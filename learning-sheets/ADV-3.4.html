      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);

  *{box-sizing:border-box;}

  .card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  .los{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .los li{display:flex; gap:12px; align-items:flex-start;}
  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}

  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}

  .rules ul,.traps ul{margin:0; padding-left:20px;} .rules li,.traps li{margin:3px 0;}
  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}
  .spr small{color:var(--ink-soft); font-size:13.5px;}
  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}
  svg.gr{width:100%; max-width:300px; height:auto;}
  .gr-grid line{stroke:var(--gr-grid); stroke-width:1;}
  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .qhead .qn{font-family:var(--f-display); font-size:20px; font-weight:700;}
  .pill{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--paper-2); color:var(--ink-soft);}
  .pill.E{background:var(--success-soft); color:var(--success);} .pill.M{background:var(--warn-soft); color:var(--warn);} .pill.H{background:var(--danger-soft); color:var(--danger);}
  .qnav{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .chip{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--card); font:600 14px var(--f-mono); cursor:pointer;}
  .chip.ans{background:var(--paper-2); border-color:var(--ink-soft);}
  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .timer{font:600 14px var(--f-mono); color:var(--ink-soft); margin-left:auto;}
  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

var S = {"id": "ADV-3.4", "unit": "Advanced Math", "topic": "Nonlinear functions", "title": "Transformations, composition and nonlinear models", "intro": "This sheet is about moving and combining functions you already know: shifting, reflecting and stretching graphs such as <i>y<\/i> = <i>x<\/i><sup>2<\/sup> and <i>y<\/i> = 2<sup><i>x<\/i><\/sup>, putting one function inside another, and choosing a nonlinear model for a real situation. On the DSAT these ideas appear as graph matching, “which equation defines <i>g<\/i>” questions, composite functions given by formulas, tables or graphs, and interpretation questions about quadratic and exponential models.", "los": [{"id": "LO1", "text": "Determine how the translations <i>f<\/i>(<i>x<\/i>) + <i>k<\/i> and <i>f<\/i>(<i>x<\/i> − <i>h<\/i>) move a nonlinear graph, its points, its vertex and its intercepts."}, {"id": "LO2", "text": "Determine the effect of the reflections −<i>f<\/i>(<i>x<\/i>) and <i>f<\/i>(−<i>x<\/i>) and the vertical stretch <i>a<\/i>·<i>f<\/i>(<i>x<\/i>), alone or combined with shifts, on a graph and its equation."}, {"id": "LO3", "text": "Evaluate, write and interpret composite functions <i>f<\/i>(<i>g<\/i>(<i>x<\/i>)) in which one or both functions are nonlinear."}, {"id": "LO4", "text": "Evaluate functions, transformed functions and composites from tables and graphs."}, {"id": "LO5", "text": "Choose an appropriate nonlinear model for a context or a table and interpret its constants and values."}], "notes": [{"lo": "LO1", "h": "Shifting a graph up, down, left or right", "html": "<p>A transformation makes a small change to the formula of a function and moves its graph in a predictable way. The two translations (slides) are:<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>New function<\/th><th>Effect on the graph<\/th><th>Point (<i>a<\/i>, <i>b<\/i>) moves to<\/th><\/tr><tr><th><i>f<\/i>(<i>x<\/i>) + <i>k<\/i><\/th><td>up <i>k<\/i> units (down if <i>k<\/i> &lt; 0)<\/td><td>(<i>a<\/i>, <i>b<\/i> + <i>k<\/i>)<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i> − <i>h<\/i>)<\/th><td>right <i>h<\/i> units (left if <i>h<\/i> &lt; 0)<\/td><td>(<i>a<\/i> + <i>h<\/i>, <i>b<\/i>)<\/td><\/tr><\/table><\/div><div class=\"rule\">A change outside the parentheses moves the graph vertically, in the direction of its sign. A change inside moves it horizontally, opposite to the sign you see: <i>f<\/i>(<i>x<\/i> − 2) moves right 2, and <i>f<\/i>(<i>x<\/i> + 2) moves left 2.<\/div><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Solid parabola y equals x squared with vertex at the origin, and a dashed parabola of the same shape with vertex (2, −3), shifted 2 units right and 3 units down\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"230\" x2=\"250\ "170.00\" cy=\"190.00\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><text x=\"184.00\" y=\"26.00\" font-style=\"italic\">y = x²<\/text><text x=\"212.00\" y=\"106.00\" font-style=\"italic\">shifted<\/text><\/g><\/svg><p>The figure shows <i>y<\/i> = <i>x<\/i><sup>2<\/sup> (solid) and <i>y<\/i> = (<i>x<\/i> − 2)<sup>2<\/sup> − 3 (dashed). The vertex moves from (0, 0) to (2, −3), and the shape of the parabola does not change at all.<\/p>"}, {"lo": "LO1", "h": "Vertex and intercepts after a shift", "html": "<p>To find the new vertex, move the old one: if <i>f<\/i> has vertex (<i>p<\/i>, <i>q<\/i>), then <i>y<\/i> = <i>f<\/i>(<i>x<\/i> − <i>h<\/i>) + <i>k<\/i> has vertex (<i>p<\/i> + <i>h<\/i>, <i>q<\/i> + <i>k<\/i>). The same idea works for any marked point.<\/p><p>Intercepts need more care.<\/p><ul><li><b><i>x<\/i>-intercepts<\/b> move with a horizontal shift: if <i>f<\/i>(3) = 0, then <i>f<\/i>(<i>x<\/i> − 4) equals 0 at <i>x<\/i> = 7. A vertical shift changes the <i>x<\/i>-intercepts completely, so solve <i>f<\/i>(<i>x<\/i>) + <i>k<\/i> = 0 again.<\/li><li><b>The <i>y<\/i>-intercept<\/b> moves with a vertical shift, but after a horizontal shift you must recompute it: the <i>y<\/i>-intercept of <i>y<\/i> = <i>f<\/i>(<i>x<\/i> − <i>h<\/i>) is <i>f<\/i>(−<i>h<\/i>), not <i>f<\/i>(0).<\/li><\/ul><div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 4, so <i>f<\/i>(<i>x<\/i> − 1) = (<i>x<\/i> − 1)<sup>2<\/sup> − 4<br><i>x<\/i>-intercepts: −2 and 2 become −1 and 3<br><i>y<\/i>-intercept: <i>f<\/i>(−1) = −3<\/div><div class=\"tip\"><b>Desmos tip:<\/b> type f(x) = x^2 − 4 and then g(x) = f(x − 1). Desmos draws both graphs, so you can tap the vertex and the intercepts to check your work.<\/div>"}, {"lo": "LO2", "h": "Reflections: a minus sign outside or inside", "html": "<p>A minus sign can flip a graph in two different ways, depending on where it goes.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>New function<\/th><th>Effect on the graph<\/th><th>(<i>a<\/i>, <i>b<\/i>) moves to<\/th><\/tr><tr><th>−<i>f<\/i>(<i>x<\/i>)<\/th><td>reflect across the <i>x<\/i>-axis<\/td><td>(<i>a<\/i>, −<i>b<\/i>)<\/td><\/tr><tr><th><i>f<\/i>(−<i>x<\/i>)<\/th><td>reflect across the <i>y<\/i>-axis<\/td><td>(−<i>a<\/i>, <i>b<\/i>)<\/td><\/tr><\/table><\/div><p>A minus outside changes every output, so the <i>y<\/i>-values change sign. A minus inside changes every input, so the <i>x<\/i>-values change sign. To write <i>f<\/i>(−<i>x<\/i>), replace every <i>x<\/i> with (−<i>x<\/i>): if <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> + 3<i>x<\/i>, then <i>f<\/i>(−<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 3<i>x<\/i>.<\/p><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Solid increasing exponential curve y equals 2 to the x through (0, 1) and (1, 2), and a dashed decreasing curve, its mirror image across the y-axis, through (0, 1) and (−1, 2)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"17 31 227.60,129.32 228.00,129.33 228.40,129.34 228.80,129.35 229.20,129.36 229.60,129.37 230.00,129.38 230.40,129.38 230.80,129.39 231.20,129.40 231.60,129.41 232.00,129.42 232.40,129.42 232.80,129.43 233.20,129.44 233.60,129.45 234.00,129.46 234.40,129.46 234.80,129.47 235.20,129.48 235.60,129.49 236.00,129.49 236.40,129.50 236.80,129.51 237.20,129.51 237.60,129.52 238.00,129.53 238.40,129.53 238.80,129.54 239.20,129.55 239.60,129.55 240.00,129.56 240.40,129.56 240.80,129.57 241.20,129.58 241.60,129.58 242.00,129.59 242.40,129.59 242.80,129.60 243.20,129.60 243.60,129.61 244.00,129.62 244.40,129.62 244.80,129.63 245.20,129.63 245.60,129.64 246.00,129.64 246.40,129.65 246.80,129.65 247.20,129.66 247.60,129.66 248.00,129.67 248.40,129.67 248.80,129.67 249.20,129.68 249.60,129.68 250.00,129.69\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-dasharray=\"7 5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"150.00\" cy=\"90.00\" r=\"3\"/><circle cx=\"110.00\" cy=\"90.00\" r=\"3\"/><circle cx=\"130.00\" cy=\"110.00\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg><p>Here <i>y<\/i> = 2<sup><i>x<\/i><\/sup> (solid) and its mirror image <i>y<\/i> = 2<sup>−<i>x<\/i><\/sup> (dashed). The point (1, 2) moves to (−1, 2), and the <i>y<\/i>-intercept (0, 1) stays put because it lies on the mirror line.<\/p><div class=\"rule\">−<i>f<\/i>(<i>x<\/i>) keeps the <i>x<\/i>-intercepts. <i>f<\/i>(−<i>x<\/i>) keeps the <i>y<\/i>-intercept.<\/div>"}, {"lo": "LO2", "h": "Stretches and combined transformations", "html": "<p>Multiplying the output by a constant, <i>y<\/i> = <i>a<\/i>·<i>f<\/i>(<i>x<\/i>), stretches the graph vertically when <i>a<\/i> &gt; 1 and squeezes it toward the <i>x<\/i>-axis when 0 &lt; <i>a<\/i> &lt; 1. Every <i>y<\/i>-value is multiplied by <i>a<\/i>, so (<i>p<\/i>, <i>q<\/i>) moves to (<i>p<\/i>, <i>a<\/i>·<i>q<\/i>). Points on the <i>x<\/i>-axis stay where they are, so the zeros do not change. If <i>a<\/i> is negative, the graph is also reflected across the <i>x<\/i>-axis.<\/p><p>Several changes can be combined in one form:<\/p><div class=\"eqs\"><i>g<\/i>(<i>x<\/i>) = <i>a<\/i>·<i>f<\/i>(<i>x<\/i> − <i>h<\/i>) + <i>k<\/i><br>(<i>p<\/i>, <i>q<\/i>) on <i>f<\/i> &nbsp;→&nbsp; (<i>p<\/i> + <i>h<\/i>, <i>a<\/i>·<i>q<\/i> + <i>k<\/i>) on <i>g<\/i><\/div><div class=\"rule\">Treat the <i>y<\/i>-coordinate in the order the formula is evaluated: multiply by <i>a<\/i> first, then add <i>k<\/i>.<\/div><p>For example, if <i>f<\/i> has vertex (1, −2), then <i>g<\/i>(<i>x<\/i>) = −3<i>f<\/i>(<i>x<\/i> + 2) + 5 has vertex (1 − 2, −3(−2) + 5) = (−1, 11). Because <i>a<\/i> is negative, a minimum of <i>f<\/i> becomes a maximum of <i>g<\/i>.<\/p>"}, {"lo": "LO3", "h": "Composite functions", "html": "<p>The composite <i>f<\/i>(<i>g<\/i>(<i>x<\/i>)) means: put <i>x<\/i> into <i>g<\/i>, then put the output of <i>g<\/i> into <i>f<\/i>. Always work from the inside out.<\/p><div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 1, &nbsp;<i>g<\/i>(<i>x<\/i>) = <i>x<\/i> + 3<br><i>f<\/i>(<i>g<\/i>(2)) = <i>f<\/i>(5) = 24<br><i>g<\/i>(<i>f<\/i>(2)) = <i>g<\/i>(3) = 6<\/div><p>The order matters: <i>f<\/i>(<i>g<\/i>(2)) and <i>g<\/i>(<i>f<\/i>(2)) are usually different. To get a formula for <i>f<\/i>(<i>g<\/i>(<i>x<\/i>)), replace every <i>x<\/i> in <i>f<\/i> with the whole expression <i>g<\/i>(<i>x<\/i>), in parentheses:<\/p><div class=\"eqs\"><i>f<\/i>(<i>g<\/i>(<i>x<\/i>)) = (<i>x<\/i> + 3)<sup>2<\/sup> − 1 = <i>x<\/i><sup>2<\/sup> + 6<i>x<\/i> + 8<\/div><div class=\"rule\"><i>f<\/i>(<i>g<\/i>(<i>x<\/i>)) is not <i>f<\/i>(<i>x<\/i>)·<i>g<\/i>(<i>x<\/i>). It is a function of a function, and <i>g<\/i> acts first.<\/div><p>In context, the output of the inner function must be the kind of quantity the outer function accepts. If <i>r<\/i>(<i>t<\/i>) is a radius after <i>t<\/i> seconds and <i>A<\/i>(<i>r<\/i>) is the area for radius <i>r<\/i>, then <i>A<\/i>(<i>r<\/i>(<i>t<\/i>)) is the area after <i>t<\/i> seconds.<\/p>"}, {"lo": "LO4", "h": "Values from tables and graphs", "html": "<p>When a function is given by a table or a graph, evaluating it means looking up a value instead of substituting.<\/p><ul><li><b>Table:<\/b> find the input in the <i>x<\/i> row and read the output in the same column.<\/li><li><b>Graph:<\/b> <i>f<\/i>(3) is the <i>y<\/i>-coordinate of the point on the graph where <i>x<\/i> = 3. To solve <i>f<\/i>(<i>x<\/i>) = 2, look across at height 2 and read every <i>x<\/i> where the graph meets that level; there may be more than one.<\/li><\/ul><p>Composites and transformations work the same way, one lookup at a time.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i>)<\/th><td>4<\/td><td>3<\/td><td>0<\/td><td>−5<\/td><\/tr><tr><th><i>g<\/i>(<i>x<\/i>)<\/th><td>2<\/td><td>0<\/td><td>3<\/td><td>1<\/td><\/tr><\/table><\/div><div class=\"eqs\"><i>f<\/i>(<i>g<\/i>(3)) = <i>f<\/i>(1) = 3<br>If <i>h<\/i>(<i>x<\/i>) = 2<i>f<\/i>(<i>x<\/i> − 1), then <i>h<\/i>(3) = 2<i>f<\/i>(2) = 0<\/div><div class=\"tip\">For a transformed function, rewrite the input first: <i>h<\/i>(3) needs <i>f<\/i>(3 − 1), which is <i>f<\/i>(2). Then look up <i>f<\/i>(2) and apply the outside changes.<\/div>"}, {"lo": "LO5", "h": "Choosing a nonlinear model", "html": "<p>DSAT questions often ask which kind of function fits a situation or a table. Look at what happens to the output over equal steps of the input.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Pattern in the outputs<\/th><th>Model<\/th><th>Typical context<\/th><\/tr><tr><th>same difference each step<\/th><td>linear, <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i><\/td><td>constant rate, fixed amount per unit<\/td><\/tr><tr><th>differences change by the same amount<\/th><td>quadratic, <i>y<\/i> = <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i><\/td><td>height of a thrown object, area, revenue<\/td><\/tr><tr><th>same ratio each step<\/th><td>exponential, <i>y<\/i> = <i>a<\/i>·<i>b<\/i><sup><i>x<\/i><\/sup><\/td><td>percent growth or decay, doubling, half-life<\/td><\/tr><\/table><\/div><div class=\"rule\">Check every step, not just the first two values. Any two points fit a line, a parabola and an exponential curve.<\/div><p>For the outputs 3, 5, 9, 17, 33 (at <i>x<\/i> = 0 to 4), the differences 2, 4, 8, 16 are not constant, but each one doubles. That points to an exponential pattern, and in fact <i>y<\/i> = 2<sup><i>x<\/i> + 1<\/sup> + 1 fits every value.<\/p>"}, {"lo": "LO5", "h": "Interpreting nonlinear models", "html": "<p>Once a model is chosen, each constant has a meaning.<\/p><ul><li>In <i>h<\/i>(<i>t<\/i>) = −4.9(<i>t<\/i> − 2)<sup>2<\/sup> + 25, the vertex (2, 25) says the object reaches its maximum height of 25 meters after 2 seconds. The value <i>h<\/i>(0) is the starting height.<\/li><li>In <i>P<\/i>(<i>t<\/i>) = 800(1.06)<sup><i>t<\/i><\/sup>, 800 is the value at <i>t<\/i> = 0, and 1.06 is the growth factor: the amount grows by 6% per time unit.<\/li><li>In <i>V<\/i>(<i>t<\/i>) = 5000(0.9)<sup><i>t<\/i><\/sup>, the factor 0.9 means a decrease of 10% per time unit, not 90%.<\/li><\/ul><p>A transformation of a model has a meaning too. If <i>N<\/i>(<i>t<\/i>) counts visitors <i>t<\/i> hours after 9 a.m., then <i>N<\/i>(<i>t<\/i> − 1) gives the same counts one hour later in the day (the graph shifts right), and <i>N<\/i>(<i>t<\/i>) + 50 adds 50 visitors at every time.<\/p><div class=\"tip\">Read the units of the input and the output first. Many wrong answer choices describe the right number with the wrong unit or the wrong time.<\/div>"}], "examples": [{"lo": "LO1", "q": "<div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 5<\/div>The function <i>g<\/i> is defined by <i>g<\/i>(<i>x<\/i>) = <i>f<\/i>(<i>x<\/i> + 2) − 3. What are the coordinates of the vertex of the graph of <i>y<\/i> = <i>g<\/i>(<i>x<\/i>)?", "steps": ["Complete the square: <i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> − 3)<sup>2<\/sup> − 4, so the vertex of <i>f<\/i> is (3, −4).", "<i>f<\/i>(<i>x<\/i> + 2) shifts the graph 2 units left, and the − 3 outside shifts it 3 units down.", "New vertex: (3 − 2, −4 − 3) = (1, −7). Check: <i>g<\/i>(1) = <i>f<\/i>(3) − 3 = −4 − 3 = −7 ✓."], "ans": "(1, −7)"}, {"lo": "LO2", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> + 1)(<i>x<\/i> − 4). Find the <i>x<\/i>-intercepts and the <i>y<\/i>-intercept of the graph of <i>y<\/i> = −2<i>f<\/i>(−<i>x<\/i>).", "steps": ["<i>f<\/i> has zeros −1 and 4. The factor −2 does not move zeros, because −2 × 0 = 0.", "<i>f<\/i>(−<i>x<\/i>) = 0 when −<i>x<\/i> = −1 or −<i>x<\/i> = 4, so <i>x<\/i> = 1 or <i>x<\/i> = −4: the zeros are reflected across the <i>y<\/i>-axis.", "For the <i>y<\/i>-intercept, substitute <i>x<\/i> = 0: −2<i>f<\/i>(0) = −2(1)(−4) = 8."], "ans": "<i>x<\/i>-intercepts (−4, 0) and (1, 0); <i>y<\/i>-intercept (0, 8)"}, {"lo": "LO3", "q": "Let <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 3 and <i>g<\/i>(<i>x<\/i>) = 2<i>x<\/i> + 1. Find <i>f<\/i>(<i>g<\/i>(2)) and <i>g<\/i>(<i>f<\/i>(2)).", "steps": ["Inside first: <i>g<\/i>(2) = 5, so <i>f<\/i>(<i>g<\/i>(2)) = <i>f<\/i>(5) = 25 − 3 = 22.", "Other order: <i>f<\/i>(2) = 1, so <i>g<\/i>(<i>f<\/i>(2)) = <i>g<\/i>(1) = 3.", "The two results are different, so the order of composition matters."], "ans": "<i>f<\/i>(<i>g<\/i>(2)) = 22 and <i>g<\/i>(<i>f<\/i>(2)) = 3"}, {"lo": "LO3", "q": "The number of bacteria in a sample kept at a temperature of <i>T<\/i> degrees Celsius is modeled by <i>N<\/i>(<i>T<\/i>) = 20<i>T<\/i><sup>2<\/sup> − 80<i>T<\/i> + 500. After the sample is taken out of a refrigerator, its temperature <i>h<\/i> hours later is <i>T<\/i>(<i>h<\/i>) = 4 + 2<i>h<\/i>. What is the value of <i>N<\/i>(<i>T<\/i>(3)), and what does it represent?", "steps": ["Inner function first: <i>T<\/i>(3) = 4 + 2(3) = 10, so 3 hours after removal the temperature is 10 degrees Celsius.", "Outer function: <i>N<\/i>(10) = 20(100) − 80(10) + 500 = 2000 − 800 + 500 = 1700.", "Meaning: the model predicts 1,700 bacteria in the sample 3 hours after it is taken out of the refrigerator."], "ans": "<i>N<\/i>(<i>T<\/i>(3)) = 1700: 1,700 bacteria, 3 hours after removal"}, {"lo": "LO4", "q": "The table gives some values of the functions <i>f<\/i> and <i>g<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>−1<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i>)<\/th><td>4<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>4<\/td><\/tr><tr><th><i>g<\/i>(<i>x<\/i>)<\/th><td>2<\/td><td>3<\/td><td>−1<\/td><td>0<\/td><td>1<\/td><\/tr><\/table><\/div>Find <i>f<\/i>(<i>g<\/i>(2)), and find <i>h<\/i>(3) where <i>h<\/i>(<i>x<\/i>) = <i>f<\/i>(<i>x<\/i> − 1) + 2.", "steps": ["From the table <i>g<\/i>(2) = 0, and then <i>f<\/i>(0) = 1, so <i>f<\/i>(<i>g<\/i>(2)) = 1.", "Rewrite the input: <i>h<\/i>(3) = <i>f<\/i>(3 − 1) + 2 = <i>f<\/i>(2) + 2.", "From the table <i>f<\/i>(2) = 1, so <i>h<\/i>(3) = 1 + 2 = 3."], "ans": "<i>f<\/i>(<i>g<\/i>(2)) = 1 and <i>h<\/i>(3) = 3"}, {"lo": "LO5", "q": "The table shows the resale value <i>V<\/i>, in dollars, of a tablet <i>t<\/i> years after it was bought.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>t<\/i><\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th><i>V<\/i><\/th><td>800<\/td><td>600<\/td><td>450<\/td><td>337.5<\/td><\/tr><\/table><\/div>Which type of function models the data, and what value does the model predict after 5 years, to the nearest cent?", "steps": ["Differences: −200, −150, −112.5. They are not constant, so the model is not linear.", "Ratios: <span class=\"fq\"><span>600<\/span><span>800<\/span><\/span> = <span class=\"fq\"><span>450<\/span><span>600<\/span><\/span> = <span class=\"fq\"><span>337.5<\/span><span>450<\/span><\/span> = 0.75. The value is multiplied by 0.75 each year, which is exponential decay of 25% per year.", "<i>V<\/i>(<i>t<\/i>) = 800(0.75)<sup><i>t<\/i><\/sup>, so <i>V<\/i>(5) = 800(0.75)<sup>5<\/sup> = 189.84375, about $189.84."], "ans": "Exponential, <i>V<\/i>(<i>t<\/i>) = 800(0.75)<sup><i>t<\/i><\/sup>; about $189.84"}], "traps": ["Shifting the wrong way horizontally: <i>f<\/i>(<i>x<\/i> − 3) moves the graph 3 units right and <i>f<\/i>(<i>x<\/i> + 3) moves it 3 units left, opposite to the sign inside.", "Mixing up the two reflections: −<i>f<\/i>(<i>x<\/i>) flips across the <i>x<\/i>-axis (negate the <i>y<\/i>-values), while <i>f<\/i>(−<i>x<\/i>) flips across the <i>y<\/i>-axis (negate the <i>x<\/i>-values).", "Keeping the old <i>y<\/i>-intercept after a horizontal shift. The <i>y<\/i>-intercept of <i>y<\/i> = <i>f<\/i>(<i>x<\/i> − <i>h<\/i>) is <i>f<\/i>(−<i>h<\/i>); always substitute <i>x<\/i> = 0 into the new function.", "Composing in the wrong order or multiplying: <i>f<\/i>(<i>g<\/i>(<i>x<\/i>)) means apply <i>g<\/i> first, then <i>f<\/i>. It is not <i>g<\/i>(<i>f<\/i>(<i>x<\/i>)) and not <i>f<\/i>(<i>x<\/i>)·<i>g<\/i>(<i>x<\/i>).", "With <i>a<\/i>·<i>f<\/i>(<i>x<\/i>) + <i>k<\/i>, adding <i>k<\/i> before multiplying by <i>a<\/i>. A point (<i>p<\/i>, <i>q<\/i>) moves to (<i>p<\/i>, <i>a<\/i>·<i>q<\/i> + <i>k<\/i>), not (<i>p<\/i>, <i>a<\/i>(<i>q<\/i> + <i>k<\/i>)).", "Choosing a model from the first two data points. Check the differences or ratios across every step of the table before deciding."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup>. Which equation represents the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) shifted 4 units to the right?", "opts": ["<i>y<\/i> = (<i>x<\/i> − 4)<sup>2<\/sup>", "<i>y<\/i> = (<i>x<\/i> + 4)<sup>2<\/sup>", "<i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 4", "<i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 4"], "ans": 0, "sol": "A shift right by 4 replaces <i>x<\/i> with <i>x<\/i> − 4.<br>So <i>y<\/i> = <i>f<\/i>(<i>x<\/i> − 4) = (<i>x<\/i> − 4)<sup>2<\/sup>.<br>Answer: <b><i>y<\/i> = (<i>x<\/i> − 4)<sup>2<\/sup><\/b>", "hint": "A shift to the right means each input must be 4 larger to give the same output as before."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "The function <i>F<\/i> gives the temperature, in degrees Fahrenheit, in a city <i>t<\/i> hours after noon. The function <i>C<\/i> converts a temperature in degrees Fahrenheit to degrees Celsius. What does <i>C<\/i>(<i>F<\/i>(3)) represent?", "opts": ["The temperature in degrees Fahrenheit at 3:00 p.m.", "The number of hours after noon when the temperature is 3 degrees Celsius", "The temperature in degrees Celsius at 3:00 p.m.", "The temperature in degrees Celsius when it is 3 degrees Fahrenheit"], "ans": 2, "sol": "Inside first: <i>F<\/i>(3) is the temperature in degrees Fahrenheit 3 hours after noon, at 3:00 p.m.<br><i>C<\/i> then converts that temperature to degrees Celsius.<br>Answer: <b>The temperature in degrees Celsius at 3:00 p.m.<\/b>", "hint": "Work inside out: what kind of quantity goes into <i>F<\/i>, and what kind of quantity comes out?"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "The table gives some values of the function <i>f<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i>)<\/th><td>5<\/td><td>2<\/td><td>1<\/td><td>2<\/td><td>5<\/td><\/tr><\/table><\/div>What is the value of <i>f<\/i>(4) − <i>f<\/i>(1)?", "opts": ["−3", "3", "7", "2"], "ans": 1, "sol": "From the table, <i>f<\/i>(4) = 5 and <i>f<\/i>(1) = 2.<br><i>f<\/i>(4) − <i>f<\/i>(1) = 5 − 2 = 3.<br>Answer: <b>3<\/b>", "hint": "Look up each output in the table separately, then subtract in the order given."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "The point (3, −5) lies on the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>). Which point must lie on the graph of <i>y<\/i> = −<i>f<\/i>(<i>x<\/i>)?", "opts": ["(−3, −5)", "(−3, 5)", "(−5, 3)", "(3, 5)"], "ans": 3, "sol": "−<i>f<\/i>(<i>x<\/i>) negates every output and keeps the inputs.<br>At <i>x<\/i> = 3: −<i>f<\/i>(3) = −(−5) = 5.<br>Answer: <b>(3, 5)<\/b>", "hint": "A minus sign outside <i>f<\/i> changes the output, not the input."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> + 1)(<i>x<\/i> − 5). At which points does the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i> − 3) cross the <i>x<\/i>-axis?", "opts": ["(−4, 0) and (2, 0)", "(2, 0) and (8, 0)", "(−1, 0) and (5, 0)", "(−2, 0) and (4, 0)"], "ans": 1, "sol": "The zeros of <i>f<\/i> are −1 and 5.<br><i>f<\/i>(<i>x<\/i> − 3) = 0 when <i>x<\/i> − 3 = −1 or <i>x<\/i> − 3 = 5, so <i>x<\/i> = 2 or <i>x<\/i> = 8.<br>Answer: <b>(2, 0) and (8, 0)<\/b>", "hint": "Set the input <i>x<\/i> − 3 equal to each zero of <i>f<\/i>."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 8, and <i>g<\/i>(<i>x<\/i>) = 3<i>f<\/i>(<i>x<\/i>). The graph of <i>y<\/i> = <i>g<\/i>(<i>x<\/i>) crosses the <i>y<\/i>-axis at the point (0, <i>b<\/i>). What is the value of <i>b<\/i>?", "ans": ["-24"], "sol": "The <i>y<\/i>-intercept is the value at <i>x<\/i> = 0: <i>f<\/i>(0) = −8.<br><i>g<\/i>(0) = 3<i>f<\/i>(0) = 3(−8) = −24.<br>Answer: <b>−24<\/b>", "hint": "The <i>y<\/i>-intercept is the output when <i>x<\/i> = 0. Find <i>f<\/i>(0) first."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "If <i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> − 1 and <i>g<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> + 3, which expression is equivalent to <i>f<\/i>(<i>g<\/i>(<i>x<\/i>))?", "opts": ["2<i>x<\/i><sup>2<\/sup> + 5", "4<i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 4", "2<i>x<\/i><sup>2<\/sup> + 2", "2<i>x<\/i><sup>3<\/sup> − <i>x<\/i><sup>2<\/sup> + 6<i>x<\/i> − 3"], "ans": 0, "sol": "Replace <i>x<\/i> in <i>f<\/i> with <i>x<\/i><sup>2<\/sup> + 3: <i>f<\/i>(<i>g<\/i>(<i>x<\/i>)) = 2(<i>x<\/i><sup>2<\/sup> + 3) − 1.<br>Distribute: 2<i>x<\/i><sup>2<\/sup> + 6 − 1 = 2<i>x<\/i><sup>2<\/sup> + 5.<br>Answer: <b>2<i>x<\/i><sup>2<\/sup> + 5<\/b>", "hint": "Replace every <i>x<\/i> in <i>f<\/i> with the whole expression <i>x<\/i><sup>2<\/sup> + 3, in parentheses."}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "The graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) is shown.<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Upward parabola y equals f of x with vertex (1, −4), passing through the points (−3, 4), (−1, −2), (3, −2) and (5, 4)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1= \/i>(−1) = 4 − (−2) = 6.<br>Answer: <b>6<\/b>", "hint": "Read the <i>y<\/i>-coordinate of the graph directly above or below each <i>x<\/i>-value."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Which equation could model the relationship between <i>x<\/i> and <i>y<\/i> in the table?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th><i>y<\/i><\/th><td>3<\/td><td>4<\/td><td>7<\/td><td>12<\/td><td>19<\/td><\/tr><\/table><\/div>", "opts": ["<i>y<\/i> = <i>x<\/i> + 3", "<i>y<\/i> = 3(2)<sup><i>x<\/i><\/sup>", "<i>y<\/i> = 2<i>x<\/i><sup>2<\/sup> − <i>x<\/i> + 3", "<i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 3"], "ans": 3, "sol": "Differences: 1, 3, 5, 7. They grow by 2 each step, so the relationship is quadratic.<br>Test <i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 3: 3, 4, 7, 12, 19 ✓. The other quadratic gives 9 at <i>x<\/i> = 2.<br>Answer: <b><i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 3<\/b>", "hint": "Find the differences between consecutive <i>y<\/i>-values. Are they equal, or do they change by a constant amount?"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "The point (4, −3) lies on the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>). Which point must lie on the graph of <i>y<\/i> = 2<i>f<\/i>(−<i>x<\/i>) + 1?", "opts": ["(4, −5)", "(−4, −4)", "(−4, −5)", "(−8, −5)"], "ans": 2, "sol": "To use <i>f<\/i>(4) = −3, the input −<i>x<\/i> must equal 4, so <i>x<\/i> = −4.<br>Then <i>y<\/i> = 2<i>f<\/i>(4) + 1 = 2(−3) + 1 = −5.<br>Answer: <b>(−4, −5)<\/b>", "hint": "For <i>f<\/i>(−<i>x<\/i>) to use the known point, what must <i>x<\/i> be? Then multiply the output by 2 before adding 1."}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "The functions <i>f<\/i> and <i>g<\/i> are defined by <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> and <i>g<\/i>(<i>x<\/i>) = 2<i>x<\/i> + 1. What is the positive value of <i>x<\/i> for which <i>f<\/i>(<i>g<\/i>(<i>x<\/i>)) = 0?", "ans": ["3/2", "1.5"], "sol": "<i>f<\/i>(<i>u<\/i>) = <i>u<\/i>(<i>u<\/i> − 4) = 0 when <i>u<\/i> = 0 or <i>u<\/i> = 4.<br>Set <i>g<\/i>(<i>x<\/i>) equal to each: 2<i>x<\/i> + 1 = 0 gives <i>x<\/i> = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>; 2<i>x<\/i> + 1 = 4 gives <i>x<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>.<br>The positive value is <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><\/b>", "hint": "First find the values of <i>u<\/i> that make <i>f<\/i>(<i>u<\/i>) = 0; then set <i>g<\/i>(<i>x<\/i>) equal to each one."}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A ball is thrown upward. Its height, in feet, <i>t<\/i> seconds after it is thrown is modeled by <i>h<\/i>(<i>t<\/i>) = −16(<i>t<\/i> − 1.5)<sup>2<\/sup> + 42. Which statement is the best interpretation of the number 42 in this context?", "opts": ["The ball reaches a maximum height of 42 feet.", "The ball is thrown from a height of 42 feet.", "The ball reaches its maximum height 42 seconds after it is thrown.", "The ball hits the ground 42 seconds after it is thrown."], "ans": 0, "sol": "The model is in vertex form with vertex (1.5, 42), and the parabola opens down.<br>So the greatest height is 42 feet, reached at <i>t<\/i> = 1.5. The starting height is <i>h<\/i>(0) = 6 feet.<br>Answer: <b>The ball reaches a maximum height of 42 feet.<\/b>", "hint": "In the form <i>a<\/i>(<i>t<\/i> − <i>p<\/i>)<sup>2<\/sup> + <i>q<\/i>, the vertex is (<i>p<\/i>, <i>q<\/i>). Which coordinate of the vertex is a height?"}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A company's daily profit, in thousands of dollars, is modeled by <i>P<\/i>(<i>x<\/i>), where <i>x<\/i> is the number of items sold. A new fee lowers the daily profit by $7,000 for every value of <i>x<\/i>, giving <i>Q<\/i>(<i>x<\/i>) = <i>P<\/i>(<i>x<\/i>) − 7. How does the graph of <i>y<\/i> = <i>Q<\/i>(<i>x<\/i>) compare with the graph of <i>y<\/i> = <i>P<\/i>(<i>x<\/i>)?", "opts": ["It is shifted 7 units down.", "It is shifted 7 units up.", "It is shifted 7 units to the right.", "It is shifted 7 units to the left."], "ans": 0, "sol": "Subtracting 7 outside the function lowers every output by 7.<br>Every point moves straight down 7 units.<br>Answer: <b>It is shifted 7 units down.<\/b>"}, {"lo": "LO3", "diff": "E", "type": "spr", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> + 4, and <i>f<\/i>(<i>g<\/i>(5)) = 13. If <i>g<\/i>(5) is positive, what is the value of <i>g<\/i>(5)?", "ans": ["3"], "sol": "Let <i>u<\/i> = <i>g<\/i>(5). Then <i>u<\/i><sup>2<\/sup> + 4 = 13, so <i>u<\/i><sup>2<\/sup> = 9.<br><i>u<\/i> = 3 or <i>u<\/i> = −3; since <i>g<\/i>(5) is positive, <i>g<\/i>(5) = 3.<br>Answer: <b>3<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A robot moves along a straight track. The table shows its distance <i>d<\/i>(<i>x<\/i>), in meters, from a sensor <i>x<\/i> seconds after it starts.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th><i>d<\/i>(<i>x<\/i>)<\/th><td>9<\/td><td>4<\/td><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><\/table><\/div>How many meters closer to the sensor is the robot at <i>x<\/i> = 2 than at <i>x<\/i> = 0?", "opts": ["2", "8", "10", "1"], "ans": 1, "sol": "From the table, <i>d<\/i>(0) = 9 and <i>d<\/i>(2) = 1.<br>9 − 1 = 8.<br>Answer: <b>8<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "The point (−4, 6) lies on the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>). Which point must lie on the graph of <i>y<\/i> = <i>f<\/i>(−<i>x<\/i>)?", "opts": ["(−4, −6)", "(4, −6)", "(4, 6)", "(6, −4)"], "ans": 2, "sol": "<i>f<\/i>(−<i>x<\/i>) reflects the graph across the <i>y<\/i>-axis, so the <i>x<\/i>-coordinate changes sign.<br>At <i>x<\/i> = 4: <i>f<\/i>(−4) = 6.<br>Answer: <b>(4, 6)<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "A culture starts with 500 bac ation defines the reflection of the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) across the <i>x<\/i>-axis?", "opts": ["<i>y<\/i> = −<i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> − 4", "<i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> + 4", "<i>y<\/i> = −<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> − 4", "<i>y<\/i> = −<i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> + 4"], "ans": 0, "sol": "A reflection across the <i>x<\/i>-axis is <i>y<\/i> = −<i>f<\/i>(<i>x<\/i>).<br>−(<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 4) = −<i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> − 4.<br>Answer: <b><i>y<\/i> = −<i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> − 4<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "On a spring day, the temperature <i>t<\/i> hours after 6 a.m. is <i>C<\/i>(<i>t<\/i>) = −0.5<i>t<\/i><sup>2<\/sup> + 4<i>t<\/i> + 10 degrees Celsius. The function <i>F<\/i>(<i>C<\/i>) = 1.8<i>C<\/i> + 32 converts degrees Celsius to degrees Fahrenheit. Which expression gives the temperature, in degrees Fahrenheit, <i>t<\/i> hours after 6 a.m.?", "opts": ["−0.9<i>t<\/i><sup>2<\/sup> + 7.2<i>t<\/i> + 42", "−0.5(1.8<i>t<\/i> + 32)<sup>2<\/sup> + 4(1.8<i>t<\/i> + 32) + 10", "−0.5<i>t<\/i><sup>2<\/sup> + 4<i>t<\/i> + 42", "−0.9<i>t<\/i><sup>2<\/sup> + 7.2<i>t<\/i> + 50"], "ans": 3, "sol": "We need <i>F<\/i>(<i>C<\/i>(<i>t<\/i>)) = 1.8(−0.5<i>t<\/i><sup>2<\/sup> + 4<i>t<\/i> + 10) + 32.<br>Distribute: −0.9<i>t<\/i><sup>2<\/sup> + 7.2<i>t<\/i> + 18 + 32 = −0.9<i>t<\/i><sup>2<\/sup> + 7.2<i>t<\/i> + 50.<br>Answer: <b>−0.9<i>t<\/i><sup>2<\/sup> + 7.2<i>t<\/i> + 50<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The table gives some values of the function <i>f<\/i>. The function <i>g<\/i> is defined by <i>g<\/i>(<i>x<\/i>) = <i>f<\/i>(−<i>x<\/i>).<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>−2<\/td><td>−1<\/td><td>0<\/td><td>1<\/td><td>2<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i>)<\/th><td>7<\/td><td>2<\/td><td>−1<\/td><td>−2<\/td><td>−1<\/td><\/tr><\/table><\/div>What is the value of <i>g<\/i>(1) + <i>g<\/i>(2)?", "opts": ["−3", "9", "3", "−9"], "ans": 1, "sol": "<i>g<\/i>(1) = <i>f<\/i>(−1) = 2 and <i>g<\/i>(2) = <i>f<\/i>(−2) = 7.<br><i>g<\/i>(1) + <i>g<\/i>(2) = 2 + 7 = 9.<br>Answer: <b>9<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The value, in dollars, of a car <i>t<\/i> years after it is bought is modeled by <i>V<\/i>(<i>t<\/i>) = 24,000(0.85)<sup><i>t<\/i><\/sup>. What is the value of the car 2 years after it is bought, to the nearest dollar?", "opts": ["$17,340", "$16,800", "$20,400", "$6,660"], "ans": 0, "sol": "<i>V<\/i>(2) = 24000(0.85)<sup>2<\/sup> = 24000(0.7225).<br>24000(0.7225) = 17340.<br>Answer: <b>$17,340<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> − 4)<sup>2<\/sup> − 9. For a constant <i>k<\/i>, the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) + <i>k<\/i> has exactly one <i>x<\/i>-intercept. What is the value of <i>k<\/i>?", "ans": ["9"], "sol": "The graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) + <i>k<\/i> has vertex (4, −9 + <i>k<\/i>) and opens up.<br>Exactly one <i>x<\/i>-intercept means the vertex is on the <i>x<\/i>-axis: −9 + <i>k<\/i> = 0.<br>So <i>k<\/i> = 9.<br>Answer: <b>9<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "The graphs of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) (solid) and <i>y<\/i> = <i>g<\/i>(<i>x<\/i>) (dashed) are shown. The graph of <i>g<\/i> is a translation of the graph of <i>f<\/i>.<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Solid downward parabola labeled f with vertex (−1, 4) crossing the x-axis at (−3, 0) and (1, 0), and a dashed downward parabola labeled g of the same shape with vertex (2, 2)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" td><td>149.2992<\/td><\/tr><\/table><\/div>Which equation models the data?", "opts": ["<i>P<\/i>(<i>t<\/i>) = 50(1.2)<sup><i>t<\/i><\/sup>", "<i>P<\/i>(<i>t<\/i>) = 50(1.44)<sup><i>t<\/i><\/sup>", "<i>P<\/i>(<i>t<\/i>) = 50(1.2)<sup><i>t<\/i>/2<\/sup>", "<i>P<\/i>(<i>t<\/i>) = 50 + 11<i>t<\/i>"], "ans": 0, "sol": "Each two-week ratio is <span class=\"fq\"><span>72<\/span><span>50<\/span><\/span> = 1.44, so the weekly factor <i>b<\/i> satisfies <i>b<\/i><sup>2<\/sup> = 1.44 and <i>b<\/i> = 1.2.<br>Check: 50(1.2)<sup>4<\/sup> = 103.68 and 50(1.2)<sup>6<\/sup> = 149.2992 ✓.<br>Answer: <b><i>P<\/i>(<i>t<\/i>) = 50(1.2)<sup><i>t<\/i><\/sup><\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i>, and <i>g<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>f<\/i>(<i>x<\/i> − 1). What is the maximum value of <i>g<\/i>(<i>x<\/i>)?", "ans": ["3"], "sol": "<i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> − 3)<sup>2<\/sup> − 9, so <i>f<\/i> has minimum value −9.<br>The shift <i>x<\/i> − 1 does not change output values. Multiplying by −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> turns the minimum −9 into a maximum: −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(−9) = 3.<br>Answer: <b>3<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A stone dropped into a pond makes a circular ripple. The radius of the ripple, in centimeters, <i>t<\/i> seconds after the stone hits the water is <i>r<\/i>(<i>t<\/i>) = 0.5<i>t<\/i> + 2, and the area of a circle with radius <i>r<\/i> is <i>A<\/i>(<i>r<\/i>) = π<i>r<\/i><sup>2<\/sup>. After how many seconds is the area of the ripple 9 times its area at <i>t<\/i> = 0?", "ans": ["8"], "sol": "At <i>t<\/i> = 0, <i>r<\/i> = 2 and the area is 4π. Nine times that is 36π.<br>π(0.5<i>t<\/i> + 2)<sup>2<\/sup> = 36π, so 0.5<i>t<\/i> + 2 = 6 (the radius is positive).<br>0.5<i>t<\/i> = 4, so <i>t<\/i> = 8.<br>Answer: <b>8<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The table gives some values of the function <i>f<\/i>. The function <i>g<\/i> is defined by <i>g<\/i>(<i>x<\/i>) = 2<i>f<\/i>(<i>x<\/i> − 1) + 1.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i>)<\/th><td>3<\/td><td>0<\/td><td>−1<\/td><td>0<\/td><td>3<\/td><\/tr><\/table><\/div>What is the value of <i>g<\/i>(3) + <i>g<\/i>(5)?", "opts": ["8", "4", "6", "2"], "ans": 2, "sol": "<i>g<\/i>(3) = 2<i>f<\/i>(2) + 1 = 2(−1) + 1 = −1.<br><i>g<\/i>(5) = 2<i>f<\/i>(4) + 1 = 2(3) + 1 = 7.<br><i>g<\/i>(3) + <i>g<\/i>(5) = −1 + 7 = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 15. For a constant <i>h<\/i>, the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i> + <i>h<\/i>) crosses the <i>x<\/i>-axis at <i>x<\/i> = −1 and <i>x<\/i> = 7. What is the value of <i>h<\/i>?", "opts": ["2", "−2", "4", "−4"], "ans": 1, "sol": "<i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> − 5)(<i>x<\/i> + 3), with zeros −3 and 5.<br>The new zeros −1 and 7 are 2 units to the right of −3 and 5, so the graph moved right 2.<br>Right 2 means <i>f<\/i>(<i>x<\/i> − 2), so <i>h<\/i> = −2.<br>Answer: <b>−2<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The height, in meters, of a footbridge arch above the ground at a horizontal distance of <i>x<\/i> meters from one end is modeled by <i>h<\/i>(<i>x<\/i>) = −0.05<i>x<\/i>(<i>x<\/i> − 40). Which is the best interpretation of the number 40 in this context?", "opts": ["The arch meets the ground again 40 meters from the end where it starts.", "The maximum height of the arch is 40 meters.", "The arch reaches its maximum height 40 meters from where it starts.", "The arch is 40 meters high where it starts."], "ans": 0, "sol": "<i>h<\/i>(<i>x<\/i>) = 0 when <i>x<\/i> = 0 or <i>x<\/i> = 40, so the arch touches the ground at both ends, 40 meters apart.<br>The maximum is halfway, at <i>x<\/i> = 20, where <i>h<\/i>(20) = 20 meters.<br>Answer: <b>The arch meets the ground again 40 meters from the end where it starts.<\/b>"}, {"lo": "LO3", "diff": "X", "type": "spr", "q": "The functions <i>f<\/i> and <i>g<\/i> are defined by <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> + 2 and <i>g<\/i>(<i>x<\/i>) = <i>a<\/i><i>x<\/i> + <i>b<\/i>, where <i>a<\/i> and <i>b<\/i> are constants and <i>a<\/i> &gt; 0. If <i>f<\/i>(<i>g<\/i>(<i>x<\/i>)) = 4<i>x<\/i><sup>2<\/sup> + 12<i>x<\/i> + 11 for all values of <i>x<\/i>, what is the value of <i>a<\/i> + <i>b<\/i>?", "ans": ["5"], "sol": "<i>f<\/i>(<i>g<\/i>(<i>x<\/i>)) = (<i>a<\/i><i>x<\/i> + <i>b<\/i>)<sup>2<\/sup> + 2 = <i>a<\/i><sup>2<i>x<\/i><\/sup><sup>2<\/sup> + 2<i>a<\/i><i>b<\/i><i>x<\/i> + <i>b<\/i><sup>2<\/sup> + 2.<br>Match coefficients: <i>a<\/i><sup>2<\/sup> = 4, so <i>a<\/i> = 2; 2<i>a<\/i><i>b<\/i> = 12, so <i>b<\/i> = 3; check <i>b<\/i><sup>2<\/sup> + 2 = 11 ✓.<br><i>a<\/i> + <i>b<\/i> = 5.<br>Answer: <b>5<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "The graph of the quadratic function <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) has its vertex at (2, −3) and passes through the point (0, 5). The function <i>g<\/i> is defined by <i>g<\/i>(<i>x<\/i>) = −2<i>f<\/i>(<i>x<\/i> + 1) + 4. What is the <i>y<\/i>-intercept of the graph of <i>y<\/i> = <i>g<\/i>(<i>x<\/i>)?", "opts": ["(0, −6)", "(0, 2)", "(0, −26)", "(0, 6)"], "ans": 3, "sol": "<i>f<\/i>(<i>x<\/i>) = <i>a<\/i>(<i>x<\/i> − 2)<sup>2<\/sup> − 3, and <i>f<\/i>(0) = 4<i>a<\/i> − 3 = 5 gives <i>a<\/i> = 2.<br><i>g<\/i>(0) = −2<i>f<\/i>(1) + 4, and <i>f<\/i>(1) = 2(1) − 3 = −1.<br><i>g<\/i>(0) = −2(−1) + 4 = 6.<br>Answer: <b>(0, 6)<\/b>"}, {"lo": "LO5", "diff": "X", "type": "spr", "q": "Two lab samples change over time. Sample A has mass <i>A<\/i>(<i>t<\/i>) = 640(<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>)<sup><i>t<\/i>/3<\/sup> milligrams and sample B ha /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

/* ---------- shared question widget ---------- */
function qBody(q, sel, name){
  var h='<div class="qtext">'+q.q+'</div>';
  if(q.type==='spr'){
    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';
  } else {
    h+='<div class="opts" role="radiogroup">'+q.opts.map(function(o,k){ return '<button type="button" class="opt" role="radio" aria-checked="'+(sel===k)+'" data-k="'+k+'"><span class="let">'+letter(k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';
  }
  return h;
}

    LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><a href="#" data-sheet="'+i+'">'+l.text+'</a>'+(ST.done[l.id]?'<span class="lo-done">✓ Done</span>':'')+'</li>'; }).join('')+'</ul>'+

      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }

    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
