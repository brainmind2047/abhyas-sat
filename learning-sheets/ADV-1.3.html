<!DOCTYPE html>

<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,
     objective-by-objective lesson cards in Learn mode, one-question-at-a-time quiz with an objective-wise report. */
  :root{
    --navy:#16264A; --navy-2:#1F3B6B; --gold:#C79A3E; --gold-soft:#F3E7C9;

    --ink:#211E1A; --ink-soft:#655D4C; --rule:#E4DCC8;
    --success:#2E7D4F; --success-soft:#E1F2E7;
    --warn:#9A6A12; --warn-soft:#FAF0D6;
    --danger:#B5443E; --danger-soft:#FAE3E1;
    --accent-text:#1F3B6B; --focus:#1F3B6B;
    --gr-grid:#E7E0CF; --gr-axis:#5C5546; --gr-line:#2D55C4; --gr-alt:#B7801A; --gr-shade:rgba(45,85,196,.16);

    --f-display:'Fraunces',Georgia,serif; --f-body:'Source Sans 3',-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    color-scheme:light;
  }

      --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
      --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
      --danger:#E38884; --danger-soft:#331D1B;
      --accent-text:#E0B75B; --focus:#E0B75B;
      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
    --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
    --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
    --danger:#E38884; --danger-soft:#331D1B;
    --accent-text:#E0B75B; --focus:#E0B75B;

    --chip-on:#E0B75B; --chip-on-ink:#141210;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;}
  h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.2;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
  i{font-family:var(--f-display); font-style:italic; font-weight:500;}
  .num{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
  .wrap{max-width:860px; margin:0 auto; padding-inline:16px;}

  /* header */
  header.brand{background:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%); color:#F4EFDF; padding-block:calc(18px + env(safe-area-inset-top,0px)) 22px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .crest{width:40px; height:40px; border-radius:10px; background:#C79A3E; color:#16264A; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:17px; flex-shrink:0;}
  .brand-name{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#E0B75B; font-weight:700;}
  .series-name{font-size:18px; font-weight:700; font-family:var(--f-display);}
  .series-name span{font-weight:400; font-size:14px; color:#CFD7EA; font-family:var(--f-body);}
  .crumbs{margin-top:16px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#AEB9D6; display:flex; flex-wrap:wrap; gap:4px 10px;}
  .crumbs b{color:#E0B75B; font-weight:700;}
  h1.title{font-size:clamp(26px,5vw,36px); margin-top:4px;}
  .summary{color:#D9DFEE; margin:6px 0 0; max-width:62ch;}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .meta span{font-size:13px; font-weight:700; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:99px; padding:4px 11px; color:#F4EFDF;}

  /* mode switch */
  .modebar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule);}
  .modebar .wrap{display:flex; gap:6px; align-items:center; padding-block:10px;}
  .tab{border:1.5px solid var(--rule); background:var(--card); border-radius:99px; padding:7px 18px; font-weight:700; cursor:pointer;}
  .tab[aria-selected="true"]{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .modebar .prog{margin-left:auto; font-size:13.5px; color:var(--ink-soft);}

  main{padding-block:22px 40px;}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  /* objectives overview */
  .los{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .los li{display:flex; gap:12px; align-items:flex-start;}
  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .lo-done{margin-left:auto; font-size:12.5px; color:var(--success); font-weight:700; flex-shrink:0;}

  /* lesson */
  .lesson{scroll-margin-top:70px;}
  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}
  .rules h3,.traps h3,.ex h3,.try h3{font-family:var(--f-body); font-size:13px; letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; color:var(--ink-soft);}
  .rules ul,.traps ul{margin:0; padding-left:20px;} .rules li,.traps li{margin:3px 0;}
  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}
  .spr small{color:var(--ink-soft); font-size:13.5px;}
  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}
  svg.gr{width:100%; max-width:300px; height:auto;}
  .gr-grid line{stroke:var(--gr-grid); stroke-width:1;}
  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .qhead .qn{font-family:var(--f-display); font-size:20px; font-weight:700;}
  .pill{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--paper-2); color:var(--ink-soft);}
  .pill.E{background:var(--success-soft); color:var(--success);} .pill.M{background:var(--warn-soft); color:var(--warn);} .pill.H{background:var(--danger-soft); color:var(--danger);}
  .qnav{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .chip{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--card); font:600 14px var(--f-mono); cursor:pointer;}
  .chip.ans{background:var(--paper-2); border-color:var(--ink-soft);}
  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .timer{font:600 14px var(--f-mono); color:var(--ink-soft); margin-left:auto;}
  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

var S = {"id": "ADV-1.3", "unit": "Advanced Math", "topic": "Equivalent expressions", "title": "Rational expressions and rewriting formulas", "intro": "A rational expression is a fraction whose numerator and denominator are polynomials, such as <span class=\"fq\"><span><i>x<\/i> + 1<\/span><span><i>x<\/i> − 3<\/span><\/span>. On the DSAT you simplify and combine these expressions, divide polynomials to find quotients and remainders, and rearrange formulas to isolate one variable, usually by choosing which of four expressions is equivalent to the one given.", "los": [{"id": "LO1", "text": "Simplify rational expressions by factoring, and determine the values excluded from their domain."}, {"id": "LO2", "text": "Add, subtract, multiply and divide rational expressions."}, {"id": "LO3", "text": "Divide a polynomial by a linear expression and use the remainder theorem to find remainders, factors and unknown coefficients."}, {"id": "LO4", "text": "Rewrite a rational expression as a quotient plus a remainder over the divisor, and identify the constants in that form."}, {"id": "LO5", "text": "Rearrange nonlinear formulas to isolate a specified variable."}], "notes": [{"lo": "LO1", "h": "Simplify by factoring", "html": "<p>A rational expression is a fraction with a polynomial on top and a nonzero polynomial on the bottom, such as <span class=\"fq\"><span><i>x<\/i> + 1<\/span><span><i>x<\/i><sup>2<\/sup> − 9<\/span><\/span>. You simplify it the same way you simplify a numerical fraction: factor, then cancel common <b>factors<\/b>.<\/p><div class=\"rule\">Factor the numerator and the denominator completely, then cancel only factors that multiply everything else.<\/div><div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 9<\/span><span><i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 6<\/span><\/span> = <span class=\"fq\"><span>(<i>x<\/i> − 3)(<i>x<\/i> + 3)<\/span><span>(<i>x<\/i> − 2)(<i>x<\/i> + 3)<\/span><\/span> = <span class=\"fq\"><span><i>x<\/i> − 3<\/span><span><i>x<\/i> − 2<\/span><\/span><\/div><p>A useful pattern: <i>a<\/i> − <i>b<\/i> and <i>b<\/i> − <i>a<\/i> are opposites, so <span class=\"fq\"><span>5 − <i>x<\/i><\/span><span><i>x<\/i> − 5<\/span><\/span> = −1 for every <i>x<\/i> ≠ 5.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Expression<\/th><th>Correct<\/th><th>Not allowed<\/th><\/tr><tr><td><span class=\"fq\"><span><i>x<\/i> + 6<\/span><span><i>x<\/i> + 2<\/span><\/span><\/td><td>already simplest<\/td><td><span class=\"fq\"><span>6<\/span><span>2<\/span><\/span> = 3<\/td><\/tr><tr><td><span class=\"fq\"><span>4<i>x<\/i> + 8<\/span><span>4<\/span><\/span><\/td><td><i>x<\/i> + 2<\/td><td><i>x<\/i> + 8<\/td><\/tr><\/table><\/div>"}, {"lo": "LO1", "h": "Excluded values", "html": "<p>A rational expression is undefined wherever its denominator equals 0, so those values of the variable are <b>excluded<\/b>. Find them from the <b>original<\/b> expression, before anything cancels.<\/p><div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 9<\/span><span><i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 6<\/span><\/span>: &nbsp;(<i>x<\/i> − 2)(<i>x<\/i> + 3) = 0, so <i>x<\/i> ≠ 2 and <i>x<\/i> ≠ −3<\/div><p>After simplifying to <span class=\"fq\"><span><i>x<\/i> − 3<\/span><span><i>x<\/i> − 2<\/span><\/span>, the value <i>x<\/i> = −3 no longer makes a denominator zero, yet it is still excluded: the two expressions are equal for every <i>other<\/i> value of <i>x<\/i>. On a graph, that value shows up as a hole.<\/p><div class=\"rule\">Excluded values come from every denominator that appears at any step, including the numerator of a divisor that you flip over.<\/div><div class=\"tip\"><b>DSAT tip:<\/b> answer choices often say \"for <i>x<\/i> ≠ 2\" or \"for <i>x<\/i> &gt; 0\". That phrase only tells you where the expressions are defined; it does not change the algebra you do.<\/div>"}, {"lo": "LO2", "h": "Multiplying and dividing", "html": "<p>To multiply rational expressions, factor everything first, cancel any factor that appears in a numerator and a denominator (even across the two fractions), then multiply what is left.<\/p><div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 4<\/span><span>3<i>x<\/i><\/span><\/span> × <span class=\"fq\"><span>6<\/span><span><i>x<\/i> + 2<\/span><\/span> = <span class=\"fq\"><span>(<i>x<\/i> − 2)(<i>x<\/i> + 2)<\/span><span>3<i>x<\/i><\/span><\/span> × <span class=\"fq\"><span>6<\/span><span><i>x<\/i> + 2<\/span><\/span> = <span class=\"fq\"><span>2(<i>x<\/i> − 2)<\/span><span><i>x<\/i><\/span><\/span><\/div><p>To divide, multiply by the <b>reciprocal<\/b> of the divisor:<\/p><div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i> + 1<\/span><span><i>x<\/i><\/span><\/span> ÷ <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 1<\/span><span><i>x<\/i><sup>2<\/sup><\/span><\/span> = <span class=\"fq\"><span><i>x<\/i> + 1<\/span><span><i>x<\/i><\/span><\/span> × <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup><\/span><span>(<i>x<\/i> − 1)(<i>x<\/i> + 1)<\/span><\/span> = <span class=\"fq\"><span><i>x<\/i><\/span><span><i>x<\/i> − 1<\/span><\/span><\/div><div class=\"rule\">Dividing by a fraction means multiplying by its reciprocal. Flip only the second fraction, and factor before you cancel.<\/div><p>Cancelling before you multiply keeps the expressions small, so you never have to expand a large product only to factor it again.<\/p>"}, {"lo": "LO2", "h": "Adding and subtracting", "html": "<p>Adding and subtracting need a <b>common denominator<\/b>. Use the least common denominator (LCD): the product of every different factor, each to the highest power in which it appears.<\/p><ol><li>Factor each denominator and find the LCD.<\/li><li>Multiply each numerator by whatever its denominator is missing.<\/li><li>Combine the numerators over the LCD and simplify.<\/li><\/ol><div class=\"eqs\"><span class=\"fq\"><span>3<\/span><span><i>x<\/i><\/span><\/span> + <span class=\"fq\"><span>2<\/span><span><i>x<\/i> + 1<\/span><\/span> = <span class=\"fq\"><span>3(<i>x<\/i> + 1)<\/span><span><i>x<\/i>(<i>x<\/i> + 1)<\/span><\/span> + <span class=\"fq\"><span>2<i>x<\/i><\/span><span><i>x<\/i>(<i>x<\/i> + 1)<\/span><\/span> = <span class=\"fq\"><span>5<i>x<\/i> + 3<\/span><span><i>x<\/i>(<i>x<\/i> + 1)<\/span><\/span><\/div><div class=\"rule\">When subtracting, put the whole second numerator in parentheses: <span class=\"fq\"><span>5<\/span><span><i>x<\/i><\/span><\/span> − <span class=\"fq\"><span><i>x<\/i> − 2<\/span><span><i>x<\/i><\/span><\/span> = <span class=\"fq\"><span>5 − (<i>x<\/i> − 2)<\/span><span><i>x<\/i><\/span><\/span> = <span class=\"fq\"><span>7 − <i>x<\/i><\/span><span><i>x<\/i><\/span><\/span>.<\/div><p>Never add the denominators: <span class=\"fq\"><span>1<\/span><span><i>x<\/i><\/span><\/span> + <span class=\"fq\"><span>1<\/span><span><i>y<\/i><\/span><\/span> is <span class=\"fq\"><span><i>y<\/i> + <i>x<\/i><\/span><span><i>x<\/i><i>y<\/i><\/span><\/span>, not <span class=\"fq\"><span>2<\/span><span><i>x<\/i> + <i>y<\/i><\/span><\/span>.<\/p><div class=\"tip\"><b>Desmos tip:<\/b> to test an answer choice, graph the original expression and the choice. If the two graphs lie exactly on top of each other, the expressions are equivalent.<\/div>"}, {"lo": "LO3", "h": "Polynomial long division", "html": "<p>Dividing a polynomial by <i>x<\/i> − <i>a<\/i> works like long division with numbers. Write the polynomial in descending powers and include a 0 for any missing power.<\/p><ol><li><b>Divide<\/b> the leading term of what is left by <i>x<\/i>.<\/li><li><b>Multiply<\/b> that term by the whole divisor.<\/li><li><b>Subtract<\/b>, then bring down the next term.<\/li><li>Repeat until what is left has a lower degree than the divisor; that is the remainder.<\/li><\/ol><div class=\"eqs\">(2<i>x<\/i><sup>3<\/sup> − 3<i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> − 5) ÷ (<i>x<\/i> − 2)<br>quotient 2<i>x<\/i><sup>2<\/sup> + <i>x<\/i> + 6, &nbsp;remainder 7<\/div><p>You can always check the result: dividend = divisor × quotient + remainder. Here (<i>x<\/i> − 2)(2<i>x<\/i><sup>2<\/sup> + <i>x<\/i> + 6) + 7 = 2<i>x<\/i><sup>3<\/sup> − 3<i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> − 5 ✓.<\/p><div class=\"rule\">When you divide by a linear expression, the remainder is always a constant.<\/div>"}, {"lo": "LO3", "h": "The remainder theorem", "html": "<p>There is a shortcut when you need only the remainder. If a polynomial <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> − <i>a<\/i>, the remainder equals <i>p<\/i>(<i>a<\/i>).<\/p><div class=\"rule\">The remainder of <i>p<\/i>(<i>x<\/i>) ÷ (<i>x<\/i> − <i>a<\/i>) is <i>p<\/i>(<i>a<\/i>). In particular, <i>x<\/i> − <i>a<\/i> is a factor of <i>p<\/i>(<i>x<\/i>) exactly when <i>p<\/i>(<i>a<\/i>) = 0.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Divisor<\/th><th>Value to plug in<\/th><\/tr><tr><td><i>x<\/i> − 4<\/td><td><i>x<\/i> = 4<\/td><\/tr><tr><td><i>x<\/i> + 3<\/td><td><i>x<\/i> = −3<\/td><\/tr><tr><td>2<i>x<\/i> − 1<\/td><td><i>x<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><\/td><\/tr><\/table><\/div><p>For <i>p<\/i>(<i>x<\/i>) = 2<i>x<\/i><sup>3<\/sup> − 3<i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> − 5, <i>p<\/i>(2) = 16 − 12 + 8 − 5 = 7, the same remainder that long division gave.<\/p><div class=\"tip\"><b>DSAT tip:<\/b> \"<i>p<\/i>(3) = 0\", \"<i>x<\/i> − 3 is a factor of <i>p<\/i>(<i>x<\/i>)\" and \"3 is a zero of <i>p<\/i>\" all say the same thing. If a question gives a remainder and an unknown coefficient, plug in the value of <i>a<\/i> and solve for the coefficient.<\/div>"}, {"lo": "LO4", "h": "Quotient plus remainder form", "html": "<p>Division lets you rewrite a rational expression as a polynomial plus a simpler fraction:<\/p><div class=\"rule\"><span class=\"fq\"><span>dividend<\/span><span>divisor<\/span><\/span> = quotient + <span class=\"fq\"><span>remainder<\/span><span>divisor<\/span><\/span><\/div><p>Divide <i>x<\/i><sup>2<\/sup> + 5 by <i>x<\/i> + 2: the quotient is <i>x<\/i> − 2 and the remainder is 9, because (<i>x<\/i> + 2)(<i>x<\/i> − 2) + 9 = <i>x<\/i><sup>2<\/sup> + 5. So<\/p><div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> + 5<\/span><span><i>x<\/i> + 2<\/span><\/span> = <i>x<\/i> − 2 + <span class=\"fq\"><span>9<\/span><span><i>x<\/i> + 2<\/span><\/span><\/div><p>For a linear numerator, a quick method is to build the divisor inside the numerator: <span class=\"fq\"><span>2<i>x<\/i> + 7<\/span><span><i>x<\/i> + 3<\/span><\/span> = <span class=\"fq\"><span>2(<i>x<\/i> + 3) + 1<\/span><span><i>x<\/i> + 3<\/span><\/span> = 2 + <span class=\"fq\"><span>1<\/span><span><i>x<\/i> + 3<\/span><\/span>.<\/p><div class=\"tip\"><b>DSAT tip:<\/b> if a question says an expression equals <i>A<\/i> + <span class=\"fq\"><span><i>B<\/i><\/span><span><i>x<\/i> + 2<\/span><\/span> and asks only for <i>B<\/i>, you need only the remainder, so the remainder theorem works: <i>B<\/i> is the numerator evaluated at <i>x<\/i> = −2. Above, (−2)<sup>2<\/sup> + 5 = 9.<\/div>"}, {"lo": "LO5", "h": "Isolating a variable in a formula", "html": "<p>To solve a formula for one variable, treat every other letter as a known number and undo the operations around your target, in reverse order.<\/p><ul><li><b>Squared variable:<\/b> isolate the square, then take the square root. From <i>V<\/i> = π<i>r<\/i><sup>2<\/sup><i>h<\/i>, <i>r<\/i><sup>2<\/sup> = <span class=\"fq\"><span><i>V<\/i><\/span><span>π<i>h<\/i><\/span><\/span>, so <i>r<\/i> = √(<span class=\"fq\"><span><i>V<\/i><\/span><span>π<i>h<\/i><\/span><\/span>) (positive, because a radius is positive).<\/li><li><b>Variable under a root:<\/b> isolate the root, then square both sides.<\/li><li><b>Target in a denominator or in several terms:<\/b> clear the fractions, gather every term containing the target on one side, factor the target out, then divide.<\/li><\/ul><div class=\"eqs\"><span class=\"fq\"><span>1<\/span><span><i>R<\/i><\/span><\/span> = <span class=\"fq\"><span>1<\/span><span><i>a<\/i><\/span><\/span> + <span class=\"fq\"><span>1<\/span><span><i>b<\/i><\/span><\/span><br><i>a<\/i><i>b<\/i> = <i>R<\/i><i>b<\/i> + <i>R<\/i><i>a<\/i> &nbsp;(multiply by <i>R<\/i><i>a<\/i><i>b<\/i>)<br><i>a<\/i><i>b<\/i> − <i>R<\/i><i>a<\/i> = <i>R<\/i><i>b<\/i><br><i>a<\/i>(<i>b<\/i> − <i>R<\/i>) = <i>R<\/i><i>b<\/i>, &nbsp;so <i>a<\/i> = <span class=\"fq\"><span><i>R<\/i><i>b<\/i><\/span><span><i>b<\/i> − <i>R<\/i><\/span><\/span><\/div><div class=\"tip\"><b>DSAT tip:<\/b> check a choice with easy numbers. With <i>R<\/i> = 2 and <i>b<\/i> = 3, the result gives <i>a<\/i> = 6, and <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>6<\/span><\/span> + <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> ✓.<\/div>"}], "examples": [{"lo": "LO1", "q": "Simplify <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> − 12<\/span><span><i>x<\/i><sup>2<\/sup> − 36<\/span><\/span> and state the values of <i>x<\/i> that are excluded.", "steps": ["Factor the numerator: <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> − 12 = (<i>x<\/i> − 6)(<i>x<\/i> + 2).", "Factor the denominator: <i>x<\/i><sup>2<\/sup> − 36 = (<i>x<\/i> − 6)(<i>x<\/i> + 6). It is zero when <i>x<\/i> = 6 or <i>x<\/i> = −6, so both values are excluded.", "Cancel the common factor <i>x<\/i> − 6 to get <span class=\"fq\"><span><i>x<\/i> + 2<\/span><span><i>x<\/i> + 6<\/span><\/span>. The value <i>x<\/i> = 6 stays excluded even though <i>x<\/i> − 6 has cancelled."], "ans": "<span class=\"fq\"><span><i>x<\/i> + 2<\/span><span><i>x<\/i> + 6<\/span><\/span>, where <i>x<\/i> ≠ −6 and <i>x<\/i> ≠ 6"}, {"lo": "LO2", "q": "Which expression is equivalent to <span class=\"fq\"><span>3<\/span><span><i>x<\/i> − 2<\/span><\/span> − <span class=\"fq\"><span>2<\/span><span><i>x<\/i> + 1<\/span><\/span>, for <i>x<\/i> ≠ 2 and <i>x<\/i> ≠ −1?", "steps": ["The LCD is (<i>x<\/i> − 2)(<i>x<\/i> + 1).", "Rewrite over the LCD: <span class=\"fq\"><span>3(<i>x<\/i> + 1) − 2(<i>x<\/i> − 2)<\/span><span>(<i>x<\/i> − 2)(<i>x<\/i> + 1)<\/span><\/span>.", "Expand the numerator, letting the minus sign reach both terms: 3<i>x<\/i> + 3 − 2<i>x<\/i> + 4 = <i>x<\/i> + 7."], "ans": "<span class=\"fq\"><span><i>x<\/i> + 7<\/span><span>(<i>x<\/i> − 2)(<i>x<\/i> + 1)<\/span><\/span>"}, {"lo": "LO2", "q": "Simplify <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 25<\/span><span>2<i>x<\/i> + 6<\/span><\/span> ÷ <span class=\"fq\"><span><i>x<\/i> − 5<\/span><span><i>x<\/i> + 3<\/span><\/span>, for <i>x<\/i> ≠ −3 and <i>x<\/i> ≠ 5.", "steps": ["Multiply by the reciprocal: <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 25<\/span><span>2<i>x<\/i> + 6<\/span><\/span> × <span class=\"fq\"><span><i>x<\/i> + 3<\/span><span><i>x<\/i> − 5<\/span><\/span>.", "Factor: <span class=\"fq\"><span>(<i>x<\/i> − 5)(<i>x<\/i> + 5)<\/span><span>2(<i>x<\/i> + 3)<\/span><\/span> × <span class=\"fq\"><span><i>x<\/i> + 3<\/span><span><i>x<\/i> − 5<\/span><\/span>.", "Cancel <i>x<\/i> − 5 and <i>x<\/i> + 3, leaving <span class=\"fq\"><span><i>x<\/i> + 5<\/span><span>2<\/span><\/span>."], "ans": "<span class=\"fq\"><span><i>x<\/i> + 5<\/span><span>2<\/span><\/span>"}, {"lo": "LO3", "q": "Divide 3<i>x<\/i><sup>3<\/sup> + 2<i>x<\/i><sup>2<\/sup> − 7 by <i>x<\/i> + 1.", "steps": ["Insert the missing <i>x<\/i> term: 3<i>x<\/i><sup>3<\/sup> + 2<i>x<\/i><sup>2<\/sup> + 0<i>x<\/i> − 7.", "3<i>x<\/i><sup>3<\/sup> ÷ <i>x<\/i> = 3<i>x<\/i><sup>2<\/sup>; subtract 3<i>x<\/i><sup>2<\/sup>(<i>x<\/i> + 1) = 3<i>x<\/i><sup>3<\/sup> + 3<i>x<\/i><sup>2<\/sup> to leave −<i>x<\/i><sup>2<\/sup> + 0<i>x<\/i>.", "−<i>x<\/i><sup>2<\/sup> ÷ <i>x<\/i> = −<i>x<\/i>; subtract −<i>x<\/i>(<i>x<\/i> + 1) = −<i>x<\/i><sup>2<\/sup> − <i>x<\/i> to leave <i>x<\/i> − 7.", "<i>x<\/i> ÷ <i>x<\/i> = 1; subtract 1(<i>x<\/i> + 1) to leave −8. Check with the remainder theorem: <i>p<\/i>(−1) = −3 + 2 − 7 = −8 ✓."], "ans": "Quotient 3<i>x<\/i><sup>2<\/sup> − <i>x<\/i> + 1, remainder −8"}, {"lo": "LO3", "q": "In the polynomial <i>p<\/i>(<i>x<\/i>) = 2<i>x<\/i><sup>3<\/sup> + <i>k<\/i><i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 6, <i>k<\/i> is a constant. If <i>p<\/i>(<i>x<\/i>) is divisible by <i>x<\/i> − 2, what is the value of <i>k<\/i>?", "steps": ["Divisible by <i>x<\/i> − 2 means the remainder is 0, so <i>p<\/i>(2) = 0.", "<i>p<\/i>(2) = 2(8) + <i>k<\/i>(4) − 5(2) + 6 = 4<i>k<\/i> + 12.", "4<i>k<\/i> + 12 = 0, so <i>k<\/i> = −3."], "ans": "<i>k<\/i> = −3"}, {"lo": "LO4", "q": "The expression <span class=\"fq\"><span>2<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 4<\/span><span><i>x<\/i> − 1<\/span><\/span> is equivalent to <i>A<\/i><i>x<\/i> + <i>B<\/i> + <span class=\"fq\"><span><i>C<\/i><\/span><span><i>x<\/i> − 1<\/span><\/span> for <i>x<\/i> ≠ 1, where <i>A<\/i>, <i>B<\/i> and <i>C<\/i> are constants. What are the values of <i>A<\/i>, <i>B<\/i> and <i>C<\/i>?", "steps": ["Divide: 2<i>x<\/i><sup>2<\/sup> ÷ <i>x<\/i> = 2<i>x<\/i>; subtract 2<i>x<\/i>(<i>x<\/i> − 1) = 2<i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> to leave 5<i>x<\/i> − 4.", "5<i>x<\/i> ÷ <i>x<\/i> = 5; subtract 5(<i>x<\/i> − 1) = 5<i>x<\/i> − 5 to leave 1.", "So the quotient is 2<i>x<\/i> + 5 and the remainder is 1. Check: (<i>x<\/i> − 1)(2<i>x<\/i> + 5) + 1 = 2<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 4 ✓."], "ans": "2<i>x<\/i> + 5 + <span class=\"fq\"><span>1<\/span><span><i>x<\/i> − 1<\/span><\/span>, so <i>A<\/i> = 2, <i>B<\/i> = 5 and <i>C<\/i> = 1"}, {"lo": "LO5", "q": "Solve <span class=\"fq\"><span>1<\/span><span><i>f<\/i><\/span><\/span> = <span class=\"fq\"><span>1<\/span><span><i>u<\/i><\/span><\/span> + <span class=\"fq\"><span>1<\/span><span><i>v<\/i><\/span><\/span> for <i>v<\/i>.", "steps": ["Multiply every term by <i>f<\/i><i>u<\/i><i>v<\/i>: <i>u<\/i><i>v<\/i> = <i>f<\/i><i>v<\/i> + <i>f<\/i><i>u<\/i>.", "Gather the <i>v<\/i> terms on one side: <i>u<\/i><i>v<\/i> − <i>f<\/i><i>v<\/i> = <i>f<\/i><i>u<\/i>.", "Factor out <i>v<\/i>: <i>v<\/i>(<i>u<\/i> − <i>f<\/i>) = <i>f<\/i><i>u<\/i>.", "Divide by <i>u<\/i> − <i>f<\/i>: <i>v<\/i> = <span class=\"fq\"><span><i>f  − 2<\/span><\/span>"], "ans": 1, "sol": "Factor <i>x<\/i><sup>2<\/sup> − 4 = (<i>x<\/i> − 2)(<i>x<\/i> + 2); this is the LCD.<br><span class=\"fq\"><span><i>x<\/i>(<i>x<\/i> + 2) − 8<\/span><span>(<i>x<\/i> − 2)(<i>x<\/i> + 2)<\/span><\/span> = <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 8<\/span><span>(<i>x<\/i> − 2)(<i>x<\/i> + 2)<\/span><\/span>.<br>Factor the numerator as (<i>x<\/i> + 4)(<i>x<\/i> − 2) and cancel <i>x<\/i> − 2.<br>Answer: <b><span class=\"fq\"><span><i>x<\/i> + 4<\/span><span><i>x<\/i> + 2<\/span><\/span><\/b>", "hint": "Factor <i>x<\/i><sup>2<\/sup> − 4 first; it shows you the common denominator."}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "When <i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + 7 is divided by <i>x<\/i> − 3, the remainder is 4, where <i>b<\/i> is a constant. What is the remainder when <i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + 7 is divided by <i>x<\/i> + 1?", "ans": ["12"], "sol": "Remainder theorem: 3<sup>2<\/sup> + 3<i>b<\/i> + 7 = 4, so 3<i>b<\/i> = −12 and <i>b<\/i> = −4.<br>The second remainder is the value at <i>x<\/i> = −1: (−1)<sup>2<\/sup> − 4(−1) + 7 = 1 + 4 + 7 = 12.<br>Answer: <b>12<\/b>", "hint": "Use the first remainder to find <i>b<\/i>, then apply the same idea a second time."}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The equation <i>y<\/i> = <span class=\"fq\"><span>3<i>x<\/i> + 2<\/span><span><i>x<\/i> − 1<\/span><\/span> relates <i>x<\/i> and <i>y<\/i>, where <i>x<\/i> ≠ 1 and <i>y<\/i> ≠ 3. Which equation gives <i>x<\/i> in terms of <i>y<\/i>?", "opts": ["<i>x<\/i> = <span class=\"fq\"><span><i>y<\/i> + 2<\/span><span><i>y<\/i> − 3<\/span><\/span>", "<i>x<\/i> = <span class=\"fq\"><span><i>y<\/i> − 2<\/span><span><i>y<\/i> − 3<\/span><\/span>", "<i>x<\/i> = <span class=\"fq\"><span><i>y<\/i> + 2<\/span><span><i>y<\/i> + 3<\/span><\/span>", "<i>x<\/i> = <span class=\"fq\"><span><i>y<\/i> − 2<\/span><span>3 − <i>y<\/i><\/span><\/span>"], "ans": 0, "sol": "Multiply both sides by <i>x<\/i> − 1: <i>x<\/i><i>y<\/i> − <i>y<\/i> = 3<i>x<\/i> + 2.<br>Gather the <i>x<\/i> terms on one side: <i>x<\/i><i>y<\/i> − 3<i>x<\/i> = <i>y<\/i> + 2.<br>Factor out <i>x<\/i>: <i>x<\/i>(<i>y<\/i> − 3) = <i>y<\/i> + 2, so <i>x<\/i> = <span class=\"fq\"><span><i>y<\/i> + 2<\/span><span><i>y<\/i> − 3<\/span><\/span>.<br>Answer: <b><i>x<\/i> = <span class=\"fq\"><span><i>y<\/i> + 2<\/span><span><i>y<\/i> − 3<\/span><\/span><\/b>", "hint": "Clear the fraction, then move every term that contains <i>x<\/i> to the same side."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which expression is equivalent to <span class=\"fq\"><span>6<i>x<\/i><sup>2<\/sup> + 9<i>x<\/i><\/span><span>3<i>x<\/i><\/span><\/span>, for <i>x<\/i> ≠ 0?", "opts": ["2<i>x<\/i> + 9", "2<i>x<\/i> + 3", "6<i>x<\/i> + 3", "2<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i>"], "ans": 1, "sol": "Factor the numerator: 6<i>x<\/i><sup>2<\/sup> + 9<i>x<\/i> = 3<i>x<\/i>(2<i>x<\/i> + 3).<br>Cancel 3<i>x<\/i>, leaving 2<i>x<\/i> + 3.<br>Answer: <b>2<i>x<\/i> + 3<\/b>"}, {"lo": "LO3", "diff": "E", "type": "spr", "q": "What is the remainder when <i>x<\/i><sup>3<\/sup> − 2<i>x<\/i> + 4 is divided by <i>x<\/i> − 1?", "ans": ["3"], "sol": "By the remainder theorem, the remainder is the value of the polynomial at <i>x<\/i> = 1.<br>1<sup>3<\/sup> − 2(1) + 4 = 3.<br>Answer: <b>3<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which expression is equivalent to <span class=\"fq\"><span>4<\/span><span><i>x<\/i><\/span><\/span> × <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup><\/span><span>8<\/span><\/span>, for <i>x<\/i> ≠ 0?", "opts": ["<span class=\"fq\"><span>2<\/span><span><i>x<\/i><\/span><\/span>", "<span class=\"fq\"><span><i>x<\/i><sup>2<\/sup><\/span><span>2<\/span><\/span>", "2<i>x<\/i>", "<span class=\"fq\"><span><i>x<\/i><\/span><span>2<\/span><\/span>"], "ans": 3, "sol": "Multiply the numerators and the denominators: <span class=\"fq\"><span>4<i>x<\/i><sup>2<\/sup><\/span><span>8<i>x<\/i><\/span><\/span>.<br>Cancel 4<i>x<\/i>, leaving <span class=\"fq\"><span><i>x<\/i><\/span><span>2<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span><i>x<\/i><\/span><span>2<\/span><\/span><\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "The kinetic energy <i>K<\/i> of an object with mass <i>m<\/i> moving at speed <i>v<\/i> is <i>K<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>m<\/i><i>v<\/i><sup>2<\/sup>. Which equation gives <i>m<\/i> in terms of <i>K<\/i> and <i>v<\/i>?", "opts": ["<i>m<\/i> = <span class=\"fq\"><span>2<i>K<\/i><\/span><span><i>v<\/i><sup>2<\/sup><\/span><\/span>", "<i>m<\/i> = <span class=\"fq\"><span><i>K<\/i><\/span><span>2<i>v<\/i><sup>2<\/sup><\/span><\/span>", "<i>m<\/i> = 2<i>K<\/i><i>v<\/i><sup>2<\/sup>", "<i>m<\/i> = <span class=\"fq\"><span><i>K<\/i><i>v<\/i><sup>2<\/sup><\/span><span>2<\/span><\/span>"], "ans": 0, "sol": "Multiply both sides by 2: 2<i>K<\/i> = <i>m<\/i><i>v<\/i><sup>2<\/sup>.<br>Divide both sides by <i>v<\/i><sup>2<\/sup>: <i>m<\/i> = <span class=\"fq\"><span>2<i>K<\/i><\/span><span><i>v<\/i><sup>2<\/sup><\/span><\/span>.<br>Answer: <b><i>m<\/i> = <span class=\"fq\"><span>2<i>K<\/i><\/span><span><i>v<\/i><sup>2<\/sup><\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Which expression is equivalent to <span class=\"fq\"><span><i>x<\/i> + 7<\/span><span><i>x<\/i> + 2<\/span><\/span>, for <i>x<\/i> ≠ −2?", "opts": ["1 + <span class=\"fq\"><span>9<\/span><span><i>x<\/i> + 2<\/span><\/span>", "<i>x<\/i> + <span class=\"fq\"><span>5<\/span><span><i>x<\/i> + 2<\/span><\/span>", "1 + <span class=\"fq\"><span>5<\/span><span><i>x<\/i> + 2<\/span><\/span>", "<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>"], "ans": 2, "sol": "Write the numerator using the divisor: <i>x<\/i> + 7 = (<i>x<\/i> + 2) + 5.<br>Split the fraction: <span class=\"fq\"><span><i>x<\/i> + 2<\/span><span><i>x<\/i> + 2<\/span><\/span> + <span class=\"fq\"><span>5<\/span><span><i>x<\/i> + 2<\/span><\/span> = 1 + <span class=\"fq\"><span>5<\/span><span><i>x<\/i> + 2<\/span><\/span>.<br>Answer: <b>1 + <span class=\"fq\"><span>5<\/span><span><i>x<\/i> + 2<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "The expression <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 4<\/span><span><i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 9<\/span><\/span> is undefined for exactly one value of <i>x<\/i>. What is that value?", "ans": ["3"], "sol": "The denominator is a perfect square: <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 9 = (<i>x<\/i> − 3)<sup>2<\/sup>.<br>It equals 0 only when <i>x<\/i> = 3.<br>Answer: <b>3<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "For <i>x<\/i> ≠ 3 and <i>x<\/i> ≠ −3, the expression <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 6<\/span><span><i>x<\/i><sup>2<\/sup> − 9<\/span><\/span> is equivalent to <span class=\"fq\"><span><i>x<\/i> + <i>a<\/i><\/span><span><i>x<\/i> + 3<\/span><\/span>, where <i>a<\/i> is a constant. What is the value of <i>a<\/i>?", "ans": ["-2"], "sol": "Factor the numerator: (<i>x<\/i> − 2)(<i>x<\/i> − 3). Factor the denominator: (<i>x<\/i> − 3)(<i>x<\/i> + 3).<br>Cancel <i>x<\/i> − 3, leaving <span class=\"fq\"><span><i>x<\/i> − 2<\/span><span><i>x<\/i> + 3<\/span><\/span>.<br>So <i>a<\/i> = −2.<br>Answer: <b>−2<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A cyclist rides 5 kilometers at <i>x<\/i> + 3 kilometers per hour and then 2 kilometers at <i>x<\/i> − 3 kilometers per hour, where <i>x<\/i> &gt; 3. The total riding time, in hours, is <span class=\"fq\"><span>5<\/span><span><i>x<\/i> + 3<\/span><\/span> + <span class=\"fq\"><span>2<\/span><span><i>x<\/i> − 3<\/span><\/span>. Which expression is equivalent to the total riding time?", "opts": ["<span class=\"fq\"><span>7<\/span><span>2<i>x<\/i><\/span><\/span>", "<span class=\"fq\"><span>7<i>x<\/i> + 21<\/span><span><i>x<\/i><sup>2<\/sup> − 9<\/span><\/span>", "<span class=\"fq\"><span>7<i>x<\/i> − 9<\/span><span><i>x<\/i><sup>2<\/sup> − 9<\/span><\/span>", "<span class=\"fq\"><span>7<i>x<\/i> − 9<\/span><span><i>x<\/i><sup>2<\/sup> + 9<\/span><\/span>"], "ans": 2, "sol": "The LCD is (<i>x<\/i> + 3)(<i>x<\/i> − 3) = <i>x<\/i><sup>2<\/sup> − 9.<br>Numerator: 5(<i>x<\/i> − 3) + 2(<i>x<\/i> + 3) = 5<i>x<\/i> − 15 + 2<i>x<\/i> + 6 = 7<i>x<\/i> − 9.<br>Answer: <b><span class=\"fq\"><span>7<i>x<\/i> − 9<\/span><span><i>x<\/i><sup>2<\/sup> − 9<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Which of the following is a factor of <i>p<\/i>(<i>x<\/i>) = <i>x<\/i><sup>3<\/sup> − 7<i>x<\/i> + 6?", "opts": ["<i>x<\/i> − 2", "<i>x<\/i> + 1", "<i>x<\/i> + 2", "<i>x<\/i> − 3"], "ans": 0, "sol": "<i>x<\/i> − <i>a<\/i> is a factor exactly when <i>p<\/i>(<i>a<\/i>) = 0.<br><i>p<\/i>(2) = 8 − 14 + 6 = 0, while <i>p<\/i>(−1), <i>p<\/i>(−2) and <i>p<\/i>(3) each equal 12.<br>Answer: <b><i>x<\/i> − 2<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Which expression is equivalent to <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> + 1<\/span><span><i>x<\/i> + 3<\/span><\/span>, for <i>x<\/i> ≠ −3?", "opts": ["<i>x<\/i> + 1 + <span class=\"fq\"><span>2<\/span><span><i>x<\/i> + 3<\/span><\/span>", "<i>x<\/i> + 7 + <span class=\"fq\"><span>22<\/span><span><i>x<\/i> + 3<\/span><\/span>", "<i>x<\/i> + 4 + <span class=\"fq\"><span>1<\/span><span><i>x<\/i> + 3<\/span><\/span>", "<i>x<\/i> + 1 − <span class=\"fq\"><span>2<\/span><span><i>x<\/i> + 3<\/span><\/span>"], "ans": 3, "sol": "<i>x<\/i><sup>2<\/sup> ÷ <i>x<\/i> = <i>x<\/i>; subtracting <i>x<\/i>(<i>x<\/i> + 3) leaves <i>x<\/i> + 1.<br><i>x<\/i> ÷ <i>x<\/i> = 1; subtracting 1(<i>x<\/i> + 3) leaves −2.<br>So the quotient is <i>x<\/i> + 1 and the remainder is −2.<br>Answer: <b><i>x<\/i> + 1 − <span class=\"fq\"><span>2<\/span><span><i>x<\/i> + 3<\/span><\/span><\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The surface area <i>S<\/i> of a spherical balloon with radius <i>r<\/i> is <i>S<\/i> = 4π<i>r<\/i><sup>2<\/sup>. Which expression gives <i>r<\/i> in terms of <i>S<\/i>?", "opts": ["<span class=\"fq\"><span>√<i>S<\/i><\/span><span>4π<\/span><\/span>", "√(<span class=\"fq\"><span><i>S<\/i><\/span><span>4π<\/span><\/span>)", "<span class=\"fq\"><span><i>S<\/i><\/span><span>4π<\/span><\/span>", "4π√<i>S<\/i>"], "ans": 1, "sol": "Divide both sides by 4π: <i>r<\/i><sup>2<\/sup> = <span class=\"fq\"><span><i>S<\/i><\/span><span>4π<\/span><\/span>.<br>Take the positive square root, because a radius is positive: <i>r<\/i> = √(<span class=\"fq\"><span><i>S<\/i><\/span><span>4π<\/span><\/span>).<br>Answer: <b>√(<span class=\"fq\"><span><i>S<\/i><\/span><span>4π<\/span><\/span>)<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which expression is equivalent to <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − 49<\/span><span>7 − <i>x<\/i><\/span><\/span>, for <i>x<\/i> ≠ 7?", "opts": ["−<i>x<\/i> − 7", "<i>x<\/i> + 7", "<i>x<\/i> − 7", "7 − <i>x<\/i>"], "ans": 0, "sol": "Numerator: (<i>x<\/i> − 7)(<i>x<\/i> + 7). Denominator: 7 − <i>x<\/i> = −(<i>x<\/i> − 7).<br>Cancel <i>x<\/i> − 7, leaving −(<i>x<\/i> + 7) = −<i>x<\/i> − 7.<br>Answer: <b>−<i>x<\/i> − 7<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which expression is equivalent to <span class=\"fq\"><span><i>x<\/i><sup>2<\/sup> − <i>x<\/i> − 6<\/span><span><i>x<\/i><sup>2<\/sup><\/span><\/span> ÷ <span class=\"fq\"><span><i>x<\/i> − 3<\/span><span><i>x<\/i><\/span><\/span>, for <i>x<\/i> ≠ 0 and <i>x<\/i> ≠ 3?", "opts": ["<span class=\"fq\"><span><i>x<\/i> − 2<\/span><span><i>x<\/i><\/span><\/span>", "<i>x<\/i>(<i>x<\/i> + 2)", "<span class=\"fq\"><span><i>x<\/i> + 2<\/span><span><i>x<\/i><\/span><\/span>", "<span class=\"fq\"><span><i>x<\/i> + 2<\/span><span><i>x<\/i><sup>3<\/sup><\/span><\/span>"], "ans": 2, "sol": "Multiply by the reciprocal and factor: <span class=\"fq\"><span>(<i>x<\/i> − 3)(<i>x<\/i> + 2)<\/span><span><i>x<\/i><sup>2<\/sup><\/span><\/span> × <span class=\"fq\"><span><i>x<\/i><\/span><span><i>x<\/ /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  $('prog').textContent=d+' of '+LOS.length+' objectives done'+(b.length?' · '+b.join(' · '):'');
}

/* ---------- shared question widget ---------- */
function qBody(q, sel, name){
  var h='<div class="qtext">'+q.q+'</div>';
  if(q.type==='spr'){
    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';
  } else {
    h+='<div class="opts" role="radiogroup">'+q.opts.map(function(o,k){ return '<button type="button" class="opt" role="radio" aria-checked="'+(sel===k)+'" data-k="'+k+'"><span class="let">'+letter(k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';
  }
  return h;
}

/* ---------- LEARN ---------- */
function renderLearn(jump){
  if(jump!=null) ST.sheet=jump;
  var cur=Math.max(0,Math.min(NSHEET-1,ST.sheet)); ST.sheet=cur; save();
  var h='<div class="stack">';
  h+='<section class="card"><div class="eyebrow">Learning objectives</div><p style="margin:6px 0 0;color:var(--ink-soft)">Each objective has its own learning sheet: read the idea, step through the worked examples, then do the guided questions (use a hint if you are stuck). Tick the objective when you are confident, then take the quiz sheets.</p><ul class="los">'+
    LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><a href="#" data-sheet="'+i+'">'+l.text+'</a>'+(ST.done[l.id]?'<span class="lo-done">✓ Done</span>':'')+'</li>'; }).join('')+'</ul>'+
    '<div class="sheetnav" role="tablist" aria-label="Learning sheets">'+LOS.map(function(l,i){ return '<button class="tab'+(ST.done[l.id]?' done':'')+'" role="tab" data-sheet="'+i+'" aria-selected="'+(i===cur)+'">Sheet '+(i+1)+'</button>'; }).join('')+
    '<button class="tab" role="tab" data-sheet="'+LOS.length+'" aria-selected="'+(cur===LOS.length)+'">Recap</button></div></section>';
  if(cur<LOS.length){
    var L=LOS[cur];
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Learning sheet '+(cur+1)+' of '+LOS.length+' · Objective '+(cur+1)+'</div><h2>'+L.text+'</h2>';
    h+='<div class="concept">'+byLo(S.notes,L.id).map(function(n){ return '<h3 class="note-h">'+n.h+'</h3>'+n.html; }).join('')+'</div>';
    byLo(S.examples,L.id).forEach(function(E,ei){
      h+='<div class="ex"><h3>Worked example '+(ei+1)+'</h3><div class="ex-q">'+E.q+'</div><ol class="steps">'+E.steps.map(function(s){ return '<li hidden>'+s+'</li>'; }).join('')+'</ol><div class="ans" hidden>Answer: '+E.ans+'</div><div class="ex-ctrl"><button class="btn" data-next>Show first step</button><button class="btn" data-all>Show full solution</button></div></div>';
    });
    var G=byLo(S.guided,L.id);
    if(G.length) h+='<h3 class="note-h">Guided practice</h3>';
    G.forEach(function(q,qi){
      var gi=S.guided.indexOf(q);
      h+='<div class="try" data-g="'+gi+'"><h3>Question '+(qi+1)+' of '+G.length+' <span class="pill '+q.diff+'" style="margin-left:6px">'+DIFF[q.diff]+'</span></h3>'+qBody(q,null,'g-'+gi)+'<div class="ex-ctrl">'+(q.hint?'<button class="btn" data-hint>Show hint</button>':'')+'<button class="btn btn-primary" data-check>Check answer</button></div><div class="hint" hidden>'+(q.hint||'')+'</div><div class="fbk"></div></div>';
    });
    h+='<label class="donebox"><input type="checkbox" id="done-'+esc(L.id)+'" data-done="'+esc(L.id)+'"'+(ST.done[L.id]?' checked':'')+'> I can do this objective</label>';
    h+='<div class="qnav"><button class="btn" data-go="'+(cur-1)+'"'+(cur===0?' disabled':'')+'>Previous sheet</button><button class="btn btn-primary" data-go="'+(cur+1)+'">'+(cur===LOS.length-1?'Go to recap':'Next sheet')+'</button></div></section>';
  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
