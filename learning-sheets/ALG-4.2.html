<script>
(function(){
"use strict";
var S = {"id": "ALG-4.2", "unit": "Algebra", "topic": "Systems of linear equations", "title": "Number of solutions in systems", "intro": "Decide whether a system of two linear equations has exactly one solution, no solution or infinitely many, and find the constants that force each case. On the DSAT this appears both as quick graph-or-equation reads and as some of the hardest constant-and-parameter questions in Module 2.", "los": [{"id": "LO1", "text": "Determine whether a system of two linear equations has exactly one solution, no solution or infinitely many solutions by comparing slopes, intercepts or coefficients."}, {"id": "LO2", "text": "Find the value of a constant that makes a system have no solution, infinitely many solutions or exactly one solution."}, {"id": "LO3", "text": "Interpret the number of solutions from graphs (intersecting, parallel or coincident lines) and from the result of solving algebraically."}, {"id": "LO4", "text": "Choose or write a second equation that gives a system a required number of solutions."}], "notes": [{"lo": "LO1", "h": "Three ways two lines can meet", "html": "<p>A system of two linear equations asks for every point (<i>x<\/i>, <i>y<\/i>) that lies on both lines. Two lines in a plane can relate in only three ways, so a linear system has only three possible numbers of solutions.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Lines<\/th><th>Slopes<\/th><th><i>y<\/i>-intercepts<\/th><th>Solutions<\/th><\/tr><tr><td>Intersecting<\/td><td>Different<\/td><td>Any<\/td><td>Exactly one<\/td><\/tr><tr><td>Parallel (distinct)<\/td><td>Equal<\/td><td>Different<\/td><td>Zero<\/td><\/tr><tr><td>Coincident (same line)<\/td><td>Equal<\/td><td>Equal<\/td><td>Infinitely many<\/td><\/tr><\/table><\/div><div class=\"rule\">A linear system can never have exactly two solutions. If two lines share two points, they are the same line, so they share every point.<\/div><p>Quickest test: rewrite both equations as <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i>. Compare the slopes first. Only if the slopes are equal do you need to compare the intercepts.<\/p>"}, {"lo": "LO1", "h": "Comparing coefficients in standard form", "html": "<p>When both equations look like <i>a<\/i><i>x<\/i> + <i>b<\/i><i>y<\/i> = <i>c<\/i>, you can decide the case without solving for <i>y<\/i>. Write the system as <i>a<\/i><i>x<\/i> + <i>b<\/i><i>y<\/i> = <i>c<\/i> and <i>d<\/i><i>x<\/i> + <i>e<\/i><i>y<\/i> = <i>f<\/i>.<\/p><div class=\"rule\">Exactly one solution: <i>a<\/i><i>e<\/i> − <i>b<\/i><i>d<\/i> ≠ 0 (the <i>x<\/i>- and <i>y<\/i>-coefficients are <b>not<\/b> in the same ratio).<br>Zero solutions: the left side of one equation is a multiple of the other, but the constant is a different multiple.<br>Infinitely many: the whole equation, constant included, is the same multiple.<\/div><p>For example, 12<i>x<\/i> + 15<i>y<\/i> = 6 is exactly 3 times 4<i>x<\/i> + 5<i>y<\/i> = 2, so that pair is one line. Change the 6 to 7 and the left sides still match but the constants do not, so the lines become parallel with no solution.<\/p><p>Fractions and decimals do not change the rule. Clear them first (multiply by 10, or by the common denominator) so the comparison is easy to see.<\/p>"}, {"lo": "LO3", "h": "Reading the case from algebra or a graph", "html": "<p>If you start solving and both variables cancel, the leftover statement tells you the case:<\/p><ul><li>A <b>false<\/b> statement, such as 3 = −5: no solution (parallel lines).<\/li><li>A <b>true<\/b> statement, such as 0 = 0: infinitely many solutions (same line). It does <b>not<\/b> mean the solution is (0, 0).<\/li><li>A single value, such as <i>x<\/i> = 2: exactly one solution.<\/li><\/ul><p>On a graph, count shared points. Crossing lines give one solution. Parallel lines that never touch give zero. If the graph shows only one line for a two-equation system, the two equations are drawn on top of each other: infinitely many. To get an equation from a graph, read the <i>y<\/i>-intercept and the rise over run between two clear grid points.<\/p><div class=\"tip\">Desmos tip: type both equations exactly as given. Crossing lines show a point you can tap; parallel lines never touch; a single visible line means the equations coincide. For a constant such as <i>k<\/i>, type the equation with <i>k<\/i>, add the slider, and watch for the value where the lines turn parallel.<\/div>"}, {"lo": "LO2", "h": "Finding a constant for zero or infinitely many", "html": "<p>Both special cases begin the same way: the lines must have <b>equal slopes<\/b>. The constant terms then decide which case you have.<\/p><div class=\"rule\">No solution: slopes equal <b>and<\/b> intercepts different.<br>Infinitely many: slopes equal <b>and<\/b> intercepts equal.<\/div><p>Method in standard form:<\/p><ul><li>Use a pair of known coefficients to find the multiple, such as \"the <i>y<\/i>-coefficient doubled.\"<\/li><li>Apply that multiple to the unknown coefficient and solve for the constant.<\/li><li>Check the constants. A different multiple gives no solution; the same multiple gives infinitely many.<\/li><\/ul><p>Example: for <i>y<\/i> = (<i>k<\/i> − 3)<i>x<\/i> + 1 and <i>y<\/i> = 5<i>x<\/i> − 2, the slopes match when <i>k<\/i> = 8. The intercepts 1 and −2 differ, so <i>k<\/i> = 8 gives no solution. No value of <i>k<\/i> gives infinitely many, because the intercepts can never match.<\/p>"}, {"lo": "LO2", "h": "Exactly one solution, and constants in both equations", "html": "<p>\"Exactly one solution\" is the normal case. It happens for every value of the constant <b>except<\/b> the ones that make the slopes equal. So find the bad values with <i>a<\/i><i>e<\/i> − <i>b<\/i><i>d<\/i> = 0 and exclude them.<\/p><p>When the constant appears in both equations, <i>a<\/i><i>e<\/i> − <i>b<\/i><i>d<\/i> = 0 can be a quadratic. Take <i>m<\/i><i>x<\/i> + 4<i>y<\/i> = 3 and <i>x<\/i> + <i>m<\/i><i>y<\/i> = 5:<\/p><ul><li><i>m<\/i> · <i>m<\/i> − 4 · 1 = 0, so <i>m<\/i> = 2 or <i>m<\/i> = −2.<\/li><li>Test each root in the original system. For <i>m<\/i> = 2, doubling <i>x<\/i> + 2<i>y<\/i> = 5 gives 2<i>x<\/i> + 4<i>y<\/i> = 10 ≠ 3: no solution. For <i>m<\/i> = −2, −2(<i>x<\/i> − 2<i>y<\/i> = 5) gives −2<i>x<\/i> + 4<i>y<\/i> = −10 ≠ 3: no solution.<\/li><li>Every other <i>m<\/i> gives exactly one solution.<\/li><\/ul><div class=\"rule\">Always test each root. One root may give no solution while another gives infinitely many.<\/div>"}, {"lo": "LO4", "h": "Building a second equation to order", "html": "<p>Some questions give you one equation and ask which second equation produces a required case. Start from the first equation and change it on purpose.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Required<\/th><th>What to do<\/th><th>From 4<i>x<\/i> − <i>y<\/i> = 9<\/th><\/tr><tr><td>Infinitely many<\/td><td>Multiply every term, constant included, by the same nonzero number<\/td><td>8<i>x<\/i> − 2<i>y<\/i> = 18<\/td><\/tr><tr><td>Zero<\/td><td>Keep a multiple of the left side, change the constant<\/td><td>8<i>x<\/i> − 2<i>y<\/i> = 5<\/td><\/tr><tr><td>Exactly one<\/td><td>Change the ratio of the <i>x<\/i>- and <i>y<\/i>-coefficients<\/td><td>4<i>x<\/i> + <i>y<\/i> = 9<\/td><\/tr><\/table><\/div><p>If the new line must also pass through a given point, first fix the slope the case requires, then use the point to find the intercept. For no solution, check that the intercept you get differs from the first line's. If it matches, that point is on the first line and no parallel, distinct line can pass through it.<\/p>"}], "examples": [{"lo": "LO1", "q": "How many solutions does the system have?<div class=\"eqs\">3<i>x<\/i> − <i>y<\/i> = 4<br>6<i>x<\/i> − 2<i>y<\/i> = 9<\/div>", "steps": ["Rewrite the first equation: <i>y<\/i> = 3<i>x<\/i> − 4.", "Rewrite the second: −2<i>y<\/i> = −6<i>x<\/i> + 9, so <i>y<\/i> = 3<i>x<\/i> − 4.5.", "Same slope (3) but different intercepts (−4 and −4.5): parallel, distinct lines."], "ans": "Zero (no solution)"}, {"lo": "LO3", "q": "Solve the system by elimination and describe its graph.<div class=\"eqs\"><i>x<\/i> + 2<i>y<\/i> = 5<br>3<i>x<\/i> + 6<i>y<\/i> = 15<\/div>", "steps": ["Multiply the first equation by 3: 3<i>x<\/i> + 6<i>y<\/i> = 15.", "Subtract the second equation: 0 = 0.", "A true statement with no variables means every point on one line is on the other: the graphs are the same line."], "ans": "Infinitely many solutions; the two graphs coincide."}, {"lo": "LO2", "q": "In the system below, <i>k<\/i> is a constant. For what value of <i>k<\/i> does the system have no solution?<div class=\"eqs\"><i>k<\/i><i>x<\/i> + 5<i>y<\/i> = 2<br>4<i>x<\/i> + 10<i>y<\/i> = 7<\/div>", "steps": ["The <i>y<\/i>-coefficient 10 is 2 times 5, so the left sides match when 4 = 2<i>k<\/i>.", "So <i>k<\/i> = 2.", "Check the constants: 2 · 2 = 4 ≠ 7, so the lines are parallel and distinct."], "ans": "<i>k<\/i> = 2"}, {"lo": "LO2", "q": "In the system below, <i>a<\/i> is a constant. For which values of <i>a<\/i> does the system have no solution, and for which does it have infinitely many?<div class=\"eqs\"><i>a<\/i><i>x<\/i> + 9<i>y<\/i> = 6<br><i>x<\/i> + <i>a<\/i><i>y<\/i> = 2<\/div>", "steps": ["Set the cross-product to 0: <i>a<\/i> · <i>a<\/i> − 9 · 1 = 0, so <i>a<\/i> = 3 or <i>a<\/i> = −3.", "<i>a<\/i> = 3: 3<i>x<\/i> + 9<i>y<\/i> = 6 is 3 times <i>x<\/i> + 3<i>y<\/i> = 2, the same line.", "<i>a<\/i> = −3: multiplying <i>x<\/i> − 3<i>y<\/i> = 2 by −3 gives −3<i>x<\/i> + 9<i>y<\/i> = −6, but the first equation says −3<i>x<\/i> + 9<i>y<\/i> = 6. Contradiction.", "Every other value of <i>a<\/i> gives exactly one solution."], "ans": "No solution when <i>a<\/i> = −3; infinitely many when <i>a<\/i> = 3."}, {"lo": "LO4", "q": "The first equation of a system is 5<i>x<\/i> − 2<i>y<\/i> = 6. Write a second linear equation whose graph passes through (2, 9) so that the system has no solution.", "steps": ["Solve for <i>y<\/i>: <i>y<\/i> = 2.5<i>x<\/i> − 3, so the slope is 2.5.", "Parallel line through (2, 9): 9 = 2.5(2) + <i>b<\/i>, so <i>b<\/i> = 4.", "<i>y<\/i> = 2.5<i>x<\/i> + 4 has intercept 4 ≠ −3, so the lines are distinct. In standard form: 5<i>x<\/i> − 2<i>y<\/i> = −8."], "ans": "<i>y<\/i> = 2.5<i>x<\/i> + 4 (or 5<i>x<\/i> − 2<i>y<\/i> = −8)"}], "traps": ["Calling a system with equal slopes \"no solution\" without checking the intercepts: equal slopes and equal intercepts mean the same line, with infinitely many solutions.", "Reading a slope from standard form with the wrong sign: 3<i>x<\/i> + 2<i>y<\/i> = 6 has slope −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>, not <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>.", "Multiplying only the left side when testing for a multiple: to describe the same line, every term, including the constant, must be scaled by the same number.", "Keeping both roots of an equation such as <i>a<\/i><sup>2<\/sup> = 16 without testing them: one root may give no solution while the other gives infinitely many.", "Reading the result 0 = 0 as \"the solution is (0, 0)\": it means the equations are the same line."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><i>y<\/i> = 3<i>x<\/i> + 4<br><i>y<\/i> = 3<i>x<\/i> − 2<\/div>How many solutions does the system of equations have?", "opts": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "ans": 0, "sol": "Both lines have slope 3, so they are parallel. Their <i>y<\/i>-intercepts, 4 and −2, are different, so the lines never meet. Answer: <b>Zero<\/b>", "hint": "Compare the slopes first, then the <i>y<\/i>-intercepts."}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">2<i>x<\/i> + 5<i>y<\/i> = 9<br>4<i>x<\/i> + 10<i>y<\/i> = 18<\/div>How many solutions does the system of equations have?", "opts": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "ans": 3, "sol": "Multiply the first equation by 2: 4<i>x<\/i> + 10<i>y<\/i> = 18, which is exactly the second equation. Both equations describe the same line. Answer: <b>Infinitely many<\/b>", "hint": "Is the second equation a multiple of the first, constant included?"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Two lines in the xy-plane: one falls from upper left to lower right through (0, 3), the other rises steeply through (0, −3); they cross at the point (2, 1).\"><g class=\"fg-grid\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line class=\"fg-axis\" x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line class=\"fg-fit\" x1=\"70\" y1=\"10\" x2=\"250\" y2=\"190\"/><line class=\"fg-fit\" x1=\"100\" y1=\"250\" x2=\"220\" y2=\"10\"/><g class=\"fg-lab\"><text x=\"246\" y=\"124\">x<\/text><text x=\"136\" y=\"18\">y<\/text><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"124\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"124\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"124\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"124\" y=\"54\" text-anchor=\"end\">4<\/text><\/g><g class=\"fg-pts\"><circle cx=\"170\" cy=\"110\" r=\"3.5\"/><\/g><\/svg>The graph of a system of two linear equations is shown. How many solutions does the system have?", "opts": ["Zero", "Exactly one", "Infinitely many", "Exactly two"], "ans": 1, "sol": "The lines have different slopes and cross at a single point, (2, 1). Every shared point is a solution, so there is one. Answer: <b>Exactly one<\/b>", "hint": "Count the points that lie on both lines."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Leo solves a system of two linear equations by elimination. Both variables cancel, and he is left with 0 = 7. Which statement about the system is true?", "opts": ["It has exactly one solution, (0, 7).", "It has no solution.", "It has infinitely many solutions.", "Its only solution has <i>x<\/i> = 7."], "ans": 1, "sol": "When both variables cancel, the leftover statement decides the case. 0 = 7 is false for every (<i>x<\/i>, <i>y<\/i>), so no ordered pair satisfies both equations: the lines are parallel. Answer: <b>It has no solution.<\/b>", "hint": "Is the statement 0 = 7 ever true?"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "In the system below, <i>k<\/i> is a constant.<div class=\"eqs\">3<i>x<\/i> − 4<i>y<\/i> = 5<br><i>k<\/i><i>x<\/i> − 8<i>y<\/i> = 11<\/div>If the system has no solution, what is the value of <i>k<\/i>?", "ans": ["6"], "sol": "The <i>y<\/i>-coefficient −8 is 2 times −4, so for parallel lines the <i>x<\/i>-coefficient must also be 2 · 3 = 6. Check the constants: 2 · 5 = 10 ≠ 11, so the lines are distinct. Answer: <b>6<\/b>", "hint": "The <i>y<\/i>-coefficients tell you which multiple of the first equation the second left side must be."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "In the system below, <i>a<\/i> is a constant.<div class=\"eqs\"><i>y<\/i> = 5<i>x<\/i> + 2<br>2<i>y<\/i> = <i>a<\/i><i>x<\/i> + 4<\/div>If the system has infinitely many solutions, what is the value of <i>a<\/i>?", "opts": ["5", "<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>", "10", "20"], "ans": 2, "sol": "Divide the second equation by 2: <i>y<\/i> = <span class=\"fq\"><span><i>a<\/i><\/span><span>2<\/span><\/span><i>x<\/i> + 2. The intercepts already match, so the slopes must match too: <span class=\"fq\"><span><i>a<\/i><\/span><span>2<\/span><\/span> = 5, giving <i>a<\/i> = 10. Answer: <b>10<\/b>", "hint": "Rewrite the second equation in the form <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i> before comparing."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "One equation of a system of two linear equations is <i>y<\/i> = −2<i>x<\/i> + 7. Which of the following could be the second equation if the system has no solution?", "opts": ["<i>y<\/i> = 2<i>x<\/i> + 7", "2<i>y<\/i> = −4<i>x<\/i> + 14", "<i>y<\/i> = −2<i>x<\/i> − 3", "<i>y<\/i> = 7<i>x<\/i> − 2"], "ans": 2, "sol": "No solution needs parallel, distinct lines: the same slope, −2, and a different intercept. <i>y<\/i> = −2<i>x<\/i> − 3 fits. (2<i>y<\/i> = −4<i>x<\/i> + 14 is the same line, and the other two have different slopes.) Answer: <b><i>y<\/i> = −2<i>x<\/i> − 3<\/b>", "hint": "No solution means the lines are parallel but not the same line."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "In the system below, <i>k<\/i> is a constant.<div class=\"eqs\"><i>k<\/i><i>x<\/i> + 2<i>y<\/i> = 6<br>3<i>x<\/i> − <i>y<\/i> = 4<\/div>For what value of <i>k<\/i> does the system have no solution?", "ans": ["-6"], "sol": "The second equation is <i>y<\/i> = 3<i>x<\/i> − 4, slope 3. The first is <i>y<\/i> = −<span class=\"fq\"><span><i>k<\/i><\/span><span>2<\/span><\/span><i>x<\/i> + 3, slope −<span class=\"fq\"><span><i>k<\/i><\/span><span>2<\/span><\/span>. Parallel when −<span class=\"fq\"><span><i>k<\/i><\/span><span>2<\/span><\/span> = 3, so <i>k<\/i> = −6. The intercepts 3 and −4 differ, so the system has no solution. Answer: <b>−6<\/b>", "hint": "Write each equation as <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i> and set the slopes equal."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Two parallel rising lines in the xy-plane: the upper passes through (0, 2) and (2, 3); the lower passes through (0, −1) and (2, 0).\"><g class=\"fg-grid\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/>< <\/span><\/span><i>x<\/i> + 2 and <i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> − 1<\/b>", "hint": "Read each line's <i>y<\/i>-intercept, then its rise over run."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "One equation of a system of two linear equations is 4<i>x<\/i> − 6<i>y<\/i> = 10. Which of the following could be the second equation if the system has infinitely many solutions?", "opts": ["6<i>x<\/i> − 9<i>y<\/i> = 15", "2<i>x<\/i> − 3<i>y<\/i> = 10", "4<i>x<\/i> + 6<i>y<\/i> = 10", "8<i>x<\/i> − 12<i>y<\/i> = 10"], "ans": 0, "sol": "Multiplying every term of 4<i>x<\/i> − 6<i>y<\/i> = 10 by 1.5 gives 6<i>x<\/i> − 9<i>y<\/i> = 15, so they are the same line. 2<i>x<\/i> − 3<i>y<\/i> = 10 and 8<i>x<\/i> − 12<i>y<\/i> = 10 are parallel but distinct; 4<i>x<\/i> + 6<i>y<\/i> = 10 has a different slope. Answer: <b>6<i>x<\/i> − 9<i>y<\/i> = 15<\/b>", "hint": "Look for the first equation multiplied through by one number, constant included."}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "In the system below, <i>a<\/i> and <i>b<\/i> are constants.<div class=\"eqs\"><i>a<\/i><i>x<\/i> − 6<i>y<\/i> = 15<br>2<i>x<\/i> − 3<i>y<\/i> = <i>b<\/i><\/div>If the system has infinitely many solutions, what is the value of <i>a<\/i> + <i>b<\/i>?", "ans": ["11.5", "23/2"], "sol": "The <i>y<\/i>-coefficients give the multiple: −6 = 2(−3), so the first equation must be exactly 2 times the second. Then <i>a<\/i> = 2 · 2 = 4 and 15 = 2<i>b<\/i>, so <i>b<\/i> = 7.5. So <i>a<\/i> + <i>b<\/i> = 11.5. Answer: <b>11.5<\/b>", "hint": "Find the single multiple that turns the second equation into the first."}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Line ℓ passes through the points (0, 3) and (2, 7). Which equation, paired with the equation of line ℓ, forms a system with infinitely many solutions?", "opts": ["2<i>x<\/i> − <i>y<\/i> = 3", "4<i>x<\/i> − 2<i>y<\/i> = −6", "4<i>x<\/i> + 2<i>y<\/i> = −6", "2<i>x<\/i> − <i>y<\/i> = −6"], "ans": 1, "sol": "Slope of ℓ: <span class=\"fq\"><span>7 − 3<\/span><span>2 − 0<\/span><\/span> = 2, intercept 3, so ℓ is <i>y<\/i> = 2<i>x<\/i> + 3. Solving 4<i>x<\/i> − 2<i>y<\/i> = −6 for <i>y<\/i>: −2<i>y<\/i> = −4<i>x<\/i> − 6, so <i>y<\/i> = 2<i>x<\/i> + 3, the same line. Answer: <b>4<i>x<\/i> − 2<i>y<\/i> = −6<\/b>", "hint": "Write the equation of ℓ first, then solve each choice for <i>y<\/i>."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><i>y<\/i> = −4<i>x<\/i> + 9<br><i>y<\/i> = 4<i>x<\/i> + 9<\/div>How many solutions does the system of equations have?", "opts": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "ans": 1, "sol": "The slopes −4 and 4 are different, so the lines cross at exactly one point. (Both pass through (0, 9), which is that point.) Answer: <b>Exactly one<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i> − 3<i>y<\/i> = 2<br>2<i>x<\/i> − 6<i>y<\/i> = 5<\/div>How many solutions does the system of equations have?", "opts": ["Zero", "Exactly one", "Infinitely many", "Exactly two"], "ans": 0, "sol": "Doubling the first equation gives 2<i>x<\/i> − 6<i>y<\/i> = 4. The second says 2<i>x<\/i> − 6<i>y<\/i> = 5, and the same expression cannot equal both 4 and 5. Answer: <b>Zero<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "On a city map drawn on a coordinate grid, two straight bike paths are each represented by a linear equation. The paths are parallel and never touch. How many solutions does the system formed by the two equations have?", "opts": ["Exactly one", "Infinitely many", "Zero", "Exactly two"], "ans": 2, "sol": "A solution is a point on both paths. Parallel paths that never touch share no point. Answer: <b>Zero<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "One equation of a system of two linear equations is <i>y<\/i> = 5<i>x<\/i> − 3. Which of the following could be the second equation if the system has exactly one solution?", "opts": ["<i>y<\/i> = 5<i>x<\/i> + 1", "2<i>y<\/i> = 10<i>x<\/i> − 6", "<i>y<\/i> = 5<i>x<\/i>", "<i>y<\/i> = −5<i>x<\/i> − 3"], "ans": 3, "sol": "Exactly one solution needs a different slope. Only <i>y<\/i> = −5<i>x<\/i> − 3 has a slope other than 5. Answer: <b><i>y<\/i> = −5<i>x<\/i> − 3<\/b>"}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "In the system below, <i>p<\/i> is a constant.<div class=\"eqs\"><i>y<\/i> = 7<i>x<\/i> + 1<br><i>y<\/i> = <i>p<\/i><i>x<\/i> − 4<\/div>If the system has no solution, what is the value of <i>p<\/i>?", "ans": ["7"], "sol": "No solution means equal slopes with different intercepts. The intercepts 1 and −4 already differ, so <i>p<\/i> = 7. Answer: <b>7<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "Plan A for a phone charges a $20 monthly fee plus $0.05 per minute. Plan B charges a $12 monthly fee plus $0.05 per minute. The monthly cost <i>C<\/i>, in dollars, for <i>m<\/i> minutes is modeled by the system below.<div class=\"eqs\"><i>C<\/i> = 20 + 0.05<i>m<\/i><br><i>C<\/i> = 12 + 0.05<i>m<\/i><\/div>How many solutions does the system of equations have?", "opts": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "ans": 0, "sol": "Both costs rise by 0.05 per minute (equal slopes), but they start at 20 and 12. Plan A always costs $8 more, so the costs are never equal. Answer: <b>Zero<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\">6<i>x<\/i> + 4<i>y<\/i> = 10<br>9<i>x<\/i> + 6<i>y<\/i> = 15<\/div>How many solutions does the system of equations have?", "opts": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "ans": 3, "sol": "Divide the first equation by 2 and the second by 3: both become 3<i>x<\/i> + 2<i>y<\/i> = 5. Same line. Answer: <b>Infinitely many<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "In the system below, <i>k<\/i> is a constant.<div class=\"eqs\">5<i>x<\/i> + <i>k<\/i><i>y<\/i> = 3<br>15<i>x<\/i> + 12<i>y<\/i> = 4<\/div>If the system has no solution, what is the value of <i>k<\/i>?", "ans": ["4"], "sol": "The <i>x<\/i>-coefficient 15 is 3 times 5, so the <i>y<\/i>-coefficients need the same ratio: 3<i>k<\/i> = 12, <i>k<\/i> = 4. Constants: 3 · 3 = 9 ≠ 4, so the lines are parallel and distinct. Answer: <b>4<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "In the system below, <i>k<\/i> is a constant.<div class=\"eqs\">2<i>x<\/i> − <i>y<\/i> = 5<br><i>k<\/i><i>x<\/i> + 3<i>y<\/i> = 1<\/div>For which value of <i>k<\/i> does the system have no solution?", "opts": ["6", "−2", "−6", "−3"], "ans": 2, "sol": "The first line is <i>y<\/i> = 2<i>x<\/i> − 5 (slope 2). The second is <i>y<\/i> = −<span class=\"fq\"><span><i>k<\/i><\/span><span>3<\/span><\/span><i>x<\/i> + <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>. Parallel when −<span class=\"fq\"><span><i>k<\/i><\/span><span>3<\/span><\/span> = 2, so <i>k<\/i> = −6; the intercepts −5 and <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> differ. Answer: <b>−6<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Rina solves the system 4<i>x<\/i> + 2<i>y<\/i> = 8 and <i>y<\/i> = −2<i>x<\/i> + 4 by substituting the second equation into the first. She gets 8 = 8. Which conclusion is correct?", "opts": ["The only solution is (0, 4).", "The system has infinitely many solutions.", "The system has no solution.", "The only solution is <i>x<\/i> = 8."], "ans": 1, "sol": "The variable disappeared and a true statement remained, so every point on one line is on the other: the equations describe the same line. (0, 4) is one solution among infinitely many. Answer: <b>The system has infinitely many solutions.<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "One equation of a system of two linear equations is 3<i>x<\/i> + 7<i>y<\/i> = 21. Which of the following could be the second equation if the system has no solution?", "opts": ["6<i>x<\/i> + 14<i>y<\/i> = 21", "6<i>x<\/i> + 14<i>y<\/i> = 42", "7<i>x<\/i> + 3<i>y<\/i> = 21", "3<i>x<\/i> − 7<i>y<\/i> = 21"], "ans": 0, "sol": "Doubling the first gives 6<i>x<\/i> + 14<i>y<\/i> = 42. Keeping that left side with a different constant, 6<i>x<\/i> + 14<i>y<\/i> = 21, gives a parallel, distinct line. Answer: <b>6<i>x<\/i> + 14<i>y<\/i> = 21<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Candle P is 30 centimeters tall and burns down 2.5 centimeters per hour. Candle Q is 24 centimeters tall and burns down 1.5 centimeters per hour. Their heights <i>h<\/i>, in centimeters, <i>t<\/i> hours after both are lit are modeled by the system below.<div class=\"eqs\"><i>h<\/i> = 30 − 2.5<i>t<\/i><br><i>h<\/i> = 24 − 1.5<i>t<\/i><\/div>How many solutions does the system of equations have?", "opts": ["Zero", "Infinitely many", "Exactly one", "Exactly two"], "ans": 2, "sol": "The rates −2.5 and −1.5 differ, so the lines cross once. Check: 30 − 2.5<i>t<\/i> = 24 − 1.5<i>t<\/i> gives <i>t<\/i> = 6 and <i>h<\/i> = 15. Answer: <b>Exactly one<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Line ℓ in the xy-plane rising through the points (0, −2) and (3, 0).\"><g class=\"fg-grid\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line class=\"fg-axis\" x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line class=\"fg-fit\" x1=\"10\" y1=\"250\" x2=\"250\" y2=\"90\"/><g class=\"fg-lab\"><text x=\"246\" y=\"124\">x<\/text><text x=\"136\" y=\"18\">y<\/text><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"124\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"124\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"124\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"124\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"214\" y=\"102\">ℓ<\/text><\/g><g class=\"fg-pts\"><circle cx=\"130\" cy=\"170\" r=\"3.5\"/><circle cx=\"190\" cy=\"130\" r=\"3.5\"/><\/g><\/svg>The graph of line ℓ is shown. A system consists of the equation of line ℓ and the equation 2<i>x<\/i> − 3<i>y<\/i> = 6. How many solutions does the system have?", "opts": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "ans": 3, "sol": "From the graph, ℓ has slope <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> and <i>y<\/i>-intercept −2: <i>y<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><i>x<\/i> − 2. Solving 2<i>x<\/i> − 3<i>y<\/i> = 6 for <i>y<\/i> gives the same equation, so both equations describe line ℓ. Answer: <b>Infinitely many<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "In the system below, <i>c<\/i> is a constant.<div class=\"eqs\">4<i>x<\/i> + 3<i>y<\/i> = <i>c<\/i><br>12<i>x<\/i> + 9<i>y<\/i> = 30<\/div>If the system has infinitely many solutions, what is the value of <i>c<\/i>?", "ans": ["10"], "sol": "The second equation is 3 times the first on the left side (12 = 3 · 4, 9 = 3 · 3). For the same line, 30 = 3<i>c<\/i>, so <i>c<\/i> = 10. Answer: <b>10<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Maya has $40 saved and adds $15 each week, so her savings after <i>w<\/i> weeks are <i>s<\/i> = 40 + 15<i>w<\/i> dollars. Her friend Jun also saves a fixed amount each week. Which equation could model Jun's savings if the system of the two equations has no solution?", "opts": ["<i>s<\/i> = 40 + 10<i>w<\/i>", "<i>s<\/i> = 25 + 15<i>w<\/i>", "<i>s<\/i> = 40 + 15<i>w<\/i>", "<i>s<\/i> = 25 + 20<i>w<\/i>"], "ans": 1, "sol": "No solution means Jun's line is parallel to Maya's but different: the same weekly amount, 15, with a different start. Answer: <b><i>s<\/i> = 25 + 15<i>w<\/i><\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "In the system below, <i>a<\/i> and <i>b<\/i> are constants.<div class=\"eqs\">2<i>x<\/i> + 3<i>y<\/i> = 7<br><i>a<\/i><i>x<\/i> + 12<i>y<\/i> = <i>b<\/i><\/div>If the system has infinitely many solutions, what is the value of <span class=\"fq\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>?", "ans": ["3.5", "7/2"], "sol": "The <i>y<\/i>-coefficient 12 is 4 times 3, so the second equation must be 4 times the first: <i>a<\/i> = 8 and <i>b<\/i> = 28. Then <span class=\"fq\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>28<\/span><span>8<\/span><\/span> = 3.5. Answer: <b>3.5<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "Which of the following systems of equations has exactly one solution?", "opts": ["<i>y<\/i> = 2<i>x<\/i> + 1 and 4<i>x<\/i> − 2<i>y<\/i> = −2", "3<i>x<\/i> + <i>y<\/i> = 4 and 6<i>x<\/i> + 2<i>y<\/i> = 5", "<i>x<\/i> − 2<i>y<\/i> = 3 and 2<i>x<\/i> − <i>y<\/i> = 3", "<i>y<\/i> = −<i>x<\/i> + 2 and <i>x<\/i> + <i>y<\/i> = 7"], "ans": 2, "sol": "Slopes: <i>x<\/i> − 2<i>y<\/i> = 3 has slope <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> and 2<i>x<\/i> − <i>y<\/i> = 3 has slope 2, so they cross once. The others have equal slopes: the first pair is one line, the other two are parallel pairs. Answer: <b><i>x<\/i> − 2<i>y<\/i> = 3 and 2<i>x<\/i> − <i>y<\/i> = 3<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Line ℓ passes through the points (−1, 4) and (3, −4). Line <i>m<\/i> has equation <i>y<\/i> = −2<i>x<\/i> + 6. At how many points do lines ℓ and <i>m<\/i> intersect?", "opts": ["Zero", "Exactly one", "Infinitely many", "Exactly two"], "ans": 0, "sol": "Slope of ℓ: <span class=\"fq\"><span>−4 − 4<\/span><span>3 + 1<\/span><\/span> = −2. Using (−1, 4): 4 = −2(−1) + <i>b<\/i>, so <i>b<\/i> = 2 and ℓ is <i>y<\/i> = −2<i>x<\/i> + 2. Same slope as <i>m<\/i>, different intercept: parallel, distinct lines. Answer: <b>Zero<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "In the system below, <i>k<\/i> is a constant.<div class=\"eqs\"><i>k<\/i><i>x<\/i> − 3<i>y<\/i> = 4<br>4<i>x<\/i> − 3<i>y<\/i> = <i>k<\/i><\/div>For which value of <i>k<\/i> does the system have infinitely many solutions?", "opts": ["−4", "4", "3", "0"], "ans": 1, "sol": "The <i>y<\/i>-coefficients are equal, so the lines can only coincide if the equations are identical: <i>k<\/i> = 4 for the <i>x<\/i>-terms, and then the constants are 4 and <i>k<\/i> = 4 as well. Answer: <b>4<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "A designer draws two straight paths on a coordinate grid. The first path lies along the line 3<i>x<\/i> − 4<i>y<\/i> = 12. The second path must pass through the point (4, 6) and must never meet the first path. If the second path lies along the line <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i>, what is the value of <i>b<\/i>?", "ans": ["3"], "sol": "The first line is <i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> − 3. Never meeting means parallel, so <i>m<\/i> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>. Through (4, 6): 6 = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>(4) + <i>b<\/i>, so <i>b<\/i> = 3, which differs from −3. Answer: <b>3<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> − 2<br>3<i>x<\/i> − 4<i>y<\/i> = 8<\/div>How many solutions does the system of equations have?", "opts": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "ans": 3, "sol": "Solve the second for <i>y<\/i>: −4<i>y<\/i> = −3<i>x<\/i> + 8, so <i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> − 2, the same as the first equation. Answer: <b>Infinitely many<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Line ℓ in the xy-plane rising through the points (0, 1) and (2, 4).\"><g class=\"fg-grid\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line class=\"fg-axis\" x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line class=\"fg-fit\" x1=\"38\" y1=\"248\" x2=\"196\" y2=\"11\"/><g class=\"fg-lab\"><text x=\"246\" y=\"124\">x<\/text><text x=\"136\" y=\"18\">y<\/text><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"124\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"124\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"124\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"124\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"182\" y=\"22\">ℓ<\/text><\/g><g class=\"fg-pts\"><circle cx=\"130\" cy=\"110\" r=\"3.5\"/><circle cx=\"170\" cy=\"50\" r=\"3.5\"/><\/g><\/svg>The graph of line ℓ is shown. Which equation, paired with the equation of line ℓ, forms a system with no solution?", "opts": ["3<i>x<\/i> − 2<i>y<\/i> = 4", "3<i>x<\/i> − 2<i>y<\/i> = −2", "2<i>x<\/i> − 3<i>y<\/i> = 4", "3<i>x<\/i> + 2<i>y<\/i> = 4"], "ans": 0, "sol": "From the graph, ℓ is <i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> + 1, or 3<i>x<\/i> − 2<i>y<\/i> = −2. A parallel, distinct line keeps 3<i>x<\/i> − 2<i>y<\/i> and changes the constant: 3<i>x<\/i> − 2<i>y<\/i> = 4 is <i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> − 2. Answer: <b>3<i>x<\/i> − 2<i>y<\/i> = 4<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "In the system below, <i>k<\/i> is a constant.<div class=\"eqs\">(<i>k<\/i> + 2)<i>x<\/i> + 4<i>y<\/i> = 9<br>3<i>x<\/i> + 2<i>y<\/i> = 5<\/div>If the system has no solution, what is the value of <i>k<\/i>?", "ans": ["4"], "sol": "The <i>y<\/i>-coefficient 4 is 2 times 2, so the <i>x<\/i>-coefficient must be 2 · 3 = 6: <i>k<\/i> + 2 = 6, <i>k<\/i> = 4. Constants: 2 · 5 = 10 ≠ 9, so the lines are distinct. Answer: <b>4<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A theater charges $12 per adult ticket and $8 per child ticket. One night's records give the equation 12<i>a<\/i> + 8<i>c<\/i> = 480, where <i>a<\/i> is the number of adult tickets and <i>c<\/i> is the number of child tickets. A second report for the same night gives 3<i>a<\/i> + 2<i>c<\/i> = 120. Which statement about the system of these two equations is true?", "opts": ["The system has exactly one solution, <i>a<\/i> = 40 and <i>c<\/i> = 0.", "The equations describe the same line, so the system has infinitely many solutions.", "The system has no solution, because 480 ≠ 120.", "The system has exactly one solution, because the coefficients are different."], "ans": 1, "sol": "Dividing 12<i>a<\/i> + 8<i>c<\/i> = 480 by 4 gives 3<i>a<\/i> + 2<i>c<\/i> = 120, the second equation. The records describe one line, so the system alone cannot pin down <i>a<\/i> and <i>c<\/i>. Answer: <b>The equations describe the same line, so the system has infinitely many solutions.<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "When a system of two linear equations is solved by elimination, the result is 0 = 0. Which of the following could be the system?", "opts": ["2<i>x<\/i> + 3<i>y<\/i> = 6 and 4<i>x<\/i> + 6<i>y<\/i> = 6", "2<i>x<\/i> + 3<i>y<\/i> = 6 and 3<i>x<\/i> + 2<i>y<\/i> = 6", "2<i>x<\/i> + 3<i>y<\/i> = 6 and 4<i>x<\/i> + 6<i>y<\/i> = 12", "2<i>x<\/i> − 3<i>y<\/i> = 6 and 4<i>x<\/i> + 6<i>y<\/i> = 12"], "ans": 2, "sol": "0 = 0 means the equations are the same line. Doubling 2<i>x<\/i> + 3<i>y<\/i> = 6 gives 4<i>x<\/i> + 6<i>y<\/i> = 12; subtracting leaves 0 = 0. Answer: <b>2<i>x<\/i> + 3<i>y<\/i> = 6 and 4<i>x<\/i> + 6<i>y<\/i> = 12<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A system consists of the equations 7<i>x<\/i> + 2<i>y<\/i> = 3 and <i>y<\/i> = <i>m<\/i><i>x<\/i> + 4, where <i>m<\/i> is a constant. For what value of <i>m<\/i> does the system have no solution?", "opts": ["−<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>", "<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>", "−<span class=\"fq\"><span>2<\/span><span>7<\/span><\/span>", "4"], "ans": 0, "sol": "Solve the first for <i>y<\/i>: <i>y<\/i> = −<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span><i>x<\/i> + <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>. Parallel needs <i>m<\/i> = −<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>, and the intercepts <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> and 4 differ, so there is no solution. Answer: <b>−<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "In the system below, <i>a<\/i> is a constant.<div class=\"eqs\"><i>a<\/i><i>x<\/i> + 8<i>y<\/i> = 4<br>2<i>x<\/i> + <i>a<\/i><i>y<\/i> = 2<\/div>For which value of <i>a<\/i> does the system have no solution?", "opts": ["4", "16", "−4", "4 and −4"], "ans": 2, "sol": "The lines are parallel or the same when <i>a<\/i> · <i>a<\/i> − 8 · 2 = 0, so <i>a<\/i> = 4 or <i>a<\/i> = −4. For <i>a<\/i> = 4: 4<i>x<\/i> + 8<i>y<\/i> = 4 is 2 times 2<i>x<\/i> + 4<i>y<\/i> = 2, the same line. For <i>a<\/i> = −4: −2(2<i>x<\/i> − 4<i>y<\/i> = 2) gives −4<i>x<\/i> + 8<i>y<\/i> = −4 ≠ 4, so no solution. Answer: <b>−4<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "In the system below, <i>p<\/i> and <i>q<\/i> are constants.<div class=\"eqs\">6<i>x<\/i> − <i>p<\/i><i>y<\/i> = 9<br><i>q<\/i><i>x<\/i> + 4<i>y<\/i> = 3<\/div>If the system has infinitely many solutions, what is the value of <i>pq<\/i>?", "ans": ["-24"], "sol": "The constants fix the multiple: 9 = 3 · 3, so the first equation is 3 times the second. Then 6 = 3<i>q<\/i>, so <i>q<\/i> = 2, and −<i>p<\/i> = 3 · 4, so <i>p<\/i> = −12. So <i>p<\/i><i>q<\/i> = −24. Answer: <b>−24<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "Which of the following systems of equations has no solution?", "opts": ["0.4<i>x<\/i> − 0.6<i>y<\/i> = 1 and 2<i>x<\/i> − 3<i>y<\/i> = 5", "1.5<i>x<\/i> + 2.5<i>y<\/i> = 4 and 3<i>x<\/i> + 5<i>y<\/i> = 10", "<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> + <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>y<\/i> = 1 and 3<i>x<\/i> + 2<i>y<\/i> = 6", "<i>x<\/i> − 4<i>y<\/i> = 12 and <i>y<\/i> = −0.25<i>x<\/i> + 3"], "ans": 1, "sol": "Doubling 1.5<i>x<\/i> + 2.5<i>y<\/i> = 4 gives 3<i>x<\/i> + 5<i>y<\/i> = 8, which contradicts 3<i>x<\/i> + 5<i>y<\/i> = 10. The first and third choices scale to identical equations (×5 and ×6), and the last pair has slopes <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span> and −<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>. Answer: <b>1.5<i>x<\/i> + 2.5<i>y<\/i> = 4 and 3<i>x<\/i> + 5<i>y<\/i> = 10<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Two cyclists ride in the same direction along a straight road. Their distances <i>d<\/i>, in kilometers, from a marker <i>t<\/i> hours after noon are modeled by the system below.<div class=\"eqs\"><i>d<\/i> = 18<i>t<\/i> + 3<br><i>d<\/i> = 18<i>t<\/i> − 6<\/div>Which statement is true?", "opts": ["They are at the same place once, at <i>t<\/i> = 0.5.", "They are always at the same place, because both travel at 18 km per hour.", "They are at the same place once, at <i>t<\/i> = 3.", "They are never at the same place, because the graphs are parallel lines."], "ans": 3, "sol": "Equal speeds give equal slopes, and the starting distances 3 and −6 differ, so the first cyclist stays 9 km ahead. Setting 18<i>t<\/i> + 3 = 18<i>t<\/i> − 6 gives 3 = −6, which is false. Answer: <b>They are never at the same place, because the graphs are parallel lines.<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "In the system below, <i>c<\/i> is a constant.<div class=\"eqs\"><i>y<\/i> = 3<i>x<\/i> + <i>c<\/i><br>6<i>x<\/i> − 2<i>y<\/i> = 5<\/div>For what value of <i>c<\/i> does the system have infinitely many solutions?", "opts": ["−<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>", "<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>", "5", "−5"], "ans": 0, "sol": "Solve the second for <i>y<\/i>: −2<i>y<\/i> = −6<i>x<\/i> + 5, so <i>y<\/i> = 3<i>x<\/i> − <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>. The slopes already match, so the intercepts must match: <i>c<\/i> = −<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>. Answer: <b>−<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "The first equation of a system is <i>k<\/i><i>x<\/i> + 2<i>y<\/i> = 6, where <i>k<\/i> is a constant. Which second equation makes the system have exactly one solution for every value of <i>k<\/i>?", "opts": ["<i>k<\/i><i>x<\/i> + 2<i>y<\/i> = 3", "<i>x<\/i> + 2<i>y<\/i> = 6", "<i>k<\/i><i>x<\/i> − 2<i>y<\/i> = 6", "−2<i>x<\/i> + <i>k<\/i><i>y<\/i> = 1"], "ans": 3, "sol": "Exactly one solution needs the cross-product of the coefficients to be nonzero. For −2<i>x<\/i> + <i>k<\/i><i>y<\/i> = 1: <i>k<\/i> · <i>k<\/i> − 2(−2) = <i>k<\/i><sup>2<\/sup> + 4, which is never 0. The others fail: <i>k<\/i><i>x<\/i> + 2<i>y<\/i> = 3 is always parallel, <i>x<\/i> + 2<i>y<\/i> = 6 fails at <i>k<\/i> = 1, and <i>k<\/i><i>x<\/i> − 2<i>y<\/i> = 6 fails at <i>k<\/i> = 0. Answer: <b>−2<i>x<\/i> + <i>k<\/i><i>y<\/i> = 1<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "The water levels in two tanks change at constant rates. The table shows the level <i>L<\/i>, in inches, of each tank <i>t<\/i> minutes after a timer starts.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Tank 1: <i>t<\/i><\/th><th>Tank 1: <i>L<\/i><\/th><th>Tank 2: <i>t<\/i><\/th><th>Tank 2: <i>L<\/i><\/th><\/tr><tr><td>0<\/td><td>7<\/td><td>1<\/td><td>4.5<\/td><\/tr><tr><td>2<\/td><td>10<\/td><td>3<\/td><td>7.5<\/td><\/tr><tr><td>4<\/td><td>13<\/td><td>5<\/td><td>10.5<\/td><\/tr><\/table><\/div>The levels are modeled by a system of two linear equations. How many solutions does the system have?", "opts": ["Exactly one", "Zero", "Infinitely many", "Exactly two"], "ans": 1, "sol": "Tank 1: rate <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> = 1.5, start 7, so <i>L<\/i> = 1.5<i>t<\/i> + 7. Tank 2: rate <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> = 1.5, and 4.5 = 1.5(1) + <i>b<\/i> gives <i>b<\/i> = 3, so <i>L<\/i> = 1.5<i>t<\/i> + 3. Equal rates, different starts: parallel lines. Answer: <b>Zero<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A bakery sells muffins for $2.50 each and scones for $4 each. The equation 2.5<i>x<\/i> + 4<i>y<\/i> = 40 gives the combinations of <i>x<\/i> muffins and <i>y<\/i> scones that cost $40. A clerk writes a second equation, 5<i>x<\/i> + <i>k<\/i><i>y<\/i> = 80, where <i>k<\/i> is a constant, meant to describe exactly the same combinations. If the system of the two equations has infinitely many solutions, what is the value of <i>k<\/i>?", "ans": ["8"], "sol": "The <i>x<\/i>-coefficient and the constant both doubled (5 = 2 · 2.5, 80 = 2 · 40), so the second equation is 2 times the first: <i>k<\/i> = 2 · 4 = 8. Answer: <b>8<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Line ℓ has an <i>x<\/i>-intercept of 6 and a <i>y<\/i>-intercept of −4. Which equation, paired with the equation of line ℓ, forms a system with infinitely many solutions?", "opts": ["3<i>x<\/i> − 2<i>y<\/i> = 12", "2<i>x<\/i> − 3<i>y<\/i> = −12", "6<i>y<\/i> = 4<i>x<\/i> − 24", "6<i>y<\/i> = 4<i>x<\/i> + 24"], "ans": 2, "sol": "Slope of ℓ: <span class=\"fq\"><span>0 − (−4)<\/span><span>6 − 0<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>, so ℓ is <i>y<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><i>x<\/i> − 4. Dividing 6<i>y<\/i> = 4<i>x<\/i> − 24 by 6 gives <i>y<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><i>x<\/i> − 4, the same line. Answer: <b>6<i>y<\/i> = 4<i>x<\/i> − 24<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "On a coordinate map, road ℓ runs straight through the points (2, 3) and (6, 11). Road <i>m<\/i> runs straight through the points (1, <i>k<\/i>) and (4, 13). The system formed by the equations of the two roads has no solution. What is the value of <i>k<\/i>?", "ans": ["7"], "sol": "No solution means the roads are parallel. Slope of ℓ: <span class=\"fq\"><span>11 − 3<\/span><span>6 − 2<\/span><\/span> = 2. Slope of <i>m<\/i>: <span class=\"fq\"><span>13 − <i>k<\/i><\/span><span>3<\/span><\/span> = 2, so <i>k<\/i> = 7. Check: ℓ is <i>y<\/i> = 2<i>x<\/i> − 1 and <i>m<\/i> is <i>y<\/i> = 2<i>x<\/i> + 5, which are distinct. Answer: <b>7<\/b>"}, {"lo": "LO2", "diff": "X", "type": "spr", "q": "In the system below, <i>a<\/i> and <i>b<\/i> are constants and <i>a<\/i> > 0.<div class=\"eqs\">(<i>a<\/i> + 2)<i>x<\/i> + 6<i>y<\/i> = 8<br>2<i>x<\/i> + (<i>a<\/i> + 3)<i>y<\/i> = <i>b<\/i><\/div>If the system has infinitely many solutions, what is the value of <i>b<\/i>?", "ans": ["16/3", "5.333"], "sol": "Same line requires (<i>a<\/i> + 2)(<i>a<\/i> + 3) − 6 · 2 = 0, so <i>a<\/i><sup>2<\/sup> + 5<i>a<\/i> − 6 = 0 and (<i>a<\/i> + 6)(<i>a<\/i> − 1) = 0. With <i>a<\/i> > 0, <i>a<\/i> = 1: the equations are 3<i>x<\/i> + 6<i>y<\/i> = 8 and 2<i>x<\/i> + 4<i>y<\/i> = <i>b<\/i>. The second is <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> of the first, so <i>b<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>(8) = <span class=\"fq\"><span>16<\/span><span>3<\/span><\/span>. Answer: <b>16/3<\/b>"}, {"lo": "LO1", "diff": "X", "type": "mcq", "q": "In the system below, <i>p<\/i>, <i>q<\/i>, <i>r<\/i> and <i>s<\/i> are nonzero constants.<div class=\"eqs\"><i>p<\/i><i>x<\/i> + <i>q<\/i><i>y<\/i> = <i>r<\/i><br>2<i>p<\/i><i>x<\/i> + 2<i>q<\/i><i>y<\/i> = <i>s<\/i><\/div>If the system has no solution, which of the following must be true?", "opts": ["<i>s<\/i> = 2<i>r<\/i>", "<i>s<\/i> ≠ 2<i>r<\/i>", "<i>r<\/i> = 2<i>s<\/i>", "<i>p<\/i> = <i>q<\/i>"], "ans": 1, "sol": "Doubling the first equation gives 2<i>p<\/i><i>x<\/i> + 2<i>q<\/i><i>y<\/i> = 2<i>r<\/i>. The left sides always match, so the lines are always parallel or identical. They are identical when <i>s<\/i> = 2<i>r<\/i>, so no solution requires <i>s<\/i> ≠ 2<i>r<\/i>. Answer: <b><i>s<\/i> ≠ 2<i>r<\/i><\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "A system consists of the equations <i>y<\/i> = 3<i>x<\/i> + 2 and <i>a<\/i><i>x<\/i> + <i>b<\/i><i>y<\/i> = 10, where <i>a<\/i> and <i>b<\/i> are constants. Which values of <i>a<\/i> and <i>b<\/i> make the system have no solution?", "opts": ["<i>a<\/i> = −15, <i>b<\/i> = 5", "<i>a<\/i> = 3, <i>b<\/i> = 1", "<i>a<\/i> = 6, <i>b<\/i> = −2", "<i>a<\/i> = −1, <i>b<\/i> = 3"], "ans": 2, "sol": "Solving <i>a<\/i><i>x<\/i> + <i>b<\/i><i>y<\/i> = 10 for <i>y<\/i> gives slope −<span class=\"fq\"><span><i>a<\/i><\/span><span><i>b<\/i><\/span><\/span> and intercept <span class=\"fq\"><span>10<\/span><span><i>b<\/i><\/span><\/span>. Need −<span class=\"fq\"><span><i>a<\/i><\/span><span><i>b<\/i><\/span><\/span> = 3 and <span class=\"fq\"><span>10<\/span><span><i>b<\/i><\/span><\/span> ≠ 2. For <i>a<\/i> = 6, <i>b<\/i> = −2: slope 3, intercept −5. (<i>a<\/i> = −15, <i>b<\/i> = 5 gives slope 3 but intercept 2, the same line.) Answer: <b><i>a<\/i> = 6, <i>b<\/i> = −2<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Streaming service A charges a $30 setup fee plus $8 per month, so its total cost after <i>m<\/i> months is <i>C<\/i> = 8<i>m<\/i> + 30 dollars. Service B charges a setup fee of <i>s<\/i> dollars plus <i>r<\/i> dollars per month, so <i>C<\/i> = <i>r<\/i><i>m<\/i> + <i>s<\/i>. Which values of <i>r<\/i> and <i>s<\/i> make the system of the two cost equations have no solution?", "opts": ["<i>r<\/i> = 8, <i>s<\/i> = 18", "<i>r<\/i> = 8, <i>s<\/i> = 30", "<i>r<\/i> = 10, <i>s<\/i> = 30", "<i>r<\/i> = 6, <i>s<\/i> = 18"], "ans": 0, "sol": "No solution needs the same monthly rate (slope 8) with a different setup fee (intercept not 30). Only <i>r<\/i> = 8, <i>s<\/i> = 18 does that; <i>r<\/i> = 8, <i>s<\/i> = 30 is the same plan. Answer: <b><i>r<\/i> = 8, <i>s<\/i> = 18<\/b>"}], "unit_no": 1, "topic_no": "4", "code": "4.2"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

    LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><a href="#" data-sheet="'+i+'">'+l.text+'</a>'+(ST.done[l.id]?'<span class="lo-done">✓ Done</span>':'')+'</li>'; }).join('')+'</ul>'+
    '<div class="sheetnav" role="tablist" aria-label="Learning sheets">'+LOS.map(function(l,i){ return '<button class="tab'+(ST.done[l.id]?' done':'')+'" role="tab" data-sheet="'+i+'" aria-selected="'+(i===cur)+'">Sheet '+(i+1)+'</button>'; }).join('')+
    '<button class="tab" role="tab" data-sheet="'+LOS.length+'" aria-selected="'+(cur===LOS.length)+'">Recap</button></div></section>';
  if(cur<LOS.length){
    var L=LOS[cur];
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Learning sheet '+(cur+1)+' of '+LOS.length+' · Objective '+(cur+1)+'</div><h2>'+L.text+'</h2>';
    h+='<div class="concept">'+byLo(S.notes,L.id).map(function(n){ return '<h3 class="note-h">'+n.h+'</h3>'+n.html; }).join('')+'</div>';
    byLo(S.examples,L.id).forEach(function(E,ei){
      h+='<div class="ex"><h3>Worked example '+(ei+1)+'</h3><div class="ex-q">'+E.q+'</div><ol class="steps">'+E.steps.map(function(s){ return '<li hidden>'+s+'</li>'; }).join('')+'</ol><div class="ans" hidden>Answer: '+E.ans+'</div><div class="ex-ctrl"><button class="btn" data-next>Show first step</button><button class="btn" data-all>Show full solution</button></div></div>';
    });
    var G=byLo(S.guided,L.id);
    if(G.length) h+='<h3 class="note-h">Guided practice</h3>';
    G.forEach(function(q,qi){
      var gi=S.guided.indexOf(q);
      h+='<div class="try" data-g="'+gi+'"><h3>Question '+(qi+1)+' of '+G.length+' <span class="pill '+q.diff+'" style="margin-left:6px">'+DIFF[q.diff]+'</span></h3>'+qBody(q,null,'g-'+gi)+'<div class="ex-ctrl">'+(q.hint?'<button class="btn" data-hint>Show hint</button>':'')+'<button class="btn btn-primary" data-check>Check answer</button></div><div class="hint" hidden>'+(q.hint||'')+'</div><div class="fbk"></div></div>';
    });
    h+='<label class="donebox"><input type="checkbox" id="done-'+esc(L.id)+'" data-done="'+esc(L.id)+'"'+(ST.done[L.id]?' checked':'')+'> I can do this objective</label>';
    h+='<div class="qnav"><button class="btn" data-go="'+(cur-1)+'"'+(cur===0?' disabled':'')+'>Previous sheet</button><button class="btn btn-primary" data-go="'+(cur+1)+'">'+(cur===LOS.length-1?'Go to recap':'Next sheet')+'</button></div></section>';
  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
