<!DOCTYPE html>
<html lang="en">
<head>

<title>2.2 Data displays and comparing distributions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,
     objective-by-objective lesson cards in Learn mode, one-question-at-a-time quiz with an objective-wise report. */
  :root{
    --navy:#16264A; --navy-2:#1F3B6B; --gold:#C79A3E; --gold-soft:#F3E7C9;
    --paper:#FBF9F4; --paper-2:#F1EAD8; --card:#FFFFFF;
    --ink:#211E1A; --ink-soft:#655D4C; --rule:#E4DCC8;
    --success:#2E7D4F; --success-soft:#E1F2E7;
    --warn:#9A6A12; --warn-soft:#FAF0D6;
    --danger:#B5443E; --danger-soft:#FAE3E1;
    --accent-text:#1F3B6B; --focus:#1F3B6B;
    --gr-grid:#E7E0CF; --gr-axis:#5C5546; --gr-line:#2D55C4; --gr-alt:#B7801A; --gr-shade:rgba(45,85,196,.16);
    --chip-on:#1F3B6B; --chip-on-ink:#FFFFFF;
    --f-display:'Fraunces',Georgia,serif; --f-body:'Source Sans 3',-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
      --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
      --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
      --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
      --danger:#E38884; --danger-soft:#331D1B;
      --accent-text:#E0B75B; --focus:#E0B75B;
      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
    --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
    --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
    --danger:#E38884; --danger-soft:#331D1B;
    --accent-text:#E0B75B; --focus:#E0B75B;
    --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
    --chip-on:#E0B75B; --chip-on-ink:#141210;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;}
  h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.2;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
  i{font-family:var(--f-display); font-style:italic; font-weight:500;}
  .num{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
  .wrap{max-width:860px; margin:0 auto; padding-inline:16px;}

  /* header */
  header.brand{background:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%); color:#F4EFDF; padding-block:calc(18px + env(safe-area-inset-top,0px)) 22px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .crest{width:40px; height:40px; border-radius:10px; background:#C79A3E; color:#16264A; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:17px; flex-shrink:0;}
  .brand-name{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#E0B75B; font-weight:700;}
  .series-name{font-size:18px; font-weight:700; font-family:var(--f-display);}
  .series-name span{font-weight:400; font-size:14px; color:#CFD7EA; font-family:var(--f-body);}
  .crumbs{margin-top:16px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#AEB9D6; display:flex; flex-wrap:wrap; gap:4px 10px;}
  .crumbs b{color:#E0B75B; font-weight:700;}
  h1.title{font-size:clamp(26px,5vw,36px); margin-top:4px;}
  .summary{color:#D9DFEE; margin:6px 0 0; max-width:62ch;}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .meta span{font-size:13px; font-weight:700; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:99px; padding:4px 11px; color:#F4EFDF;}

  /* mode switch */
  .modebar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule);}
  .modebar .wrap{display:flex; gap:6px; align-items:center; padding-block:10px;}
  .tab{border:1.5px solid var(--rule); background:var(--card); border-radius:99px; padding:7px 18px; font-weight:700; cursor:pointer;}
  .tab[aria-selected="true"]{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .modebar .prog{margin-left:auto; font-size:13.5px; color:var(--ink-soft);}

  main{padding-block:22px 40px;}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  /* objectives overview */
  .los{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .los li{display:flex; gap:12px; align-items:flex-start;}
  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .lo-done{margin-left:auto; font-size:12.5px; color:var(--success); font-weight:700; flex-shrink:0;}

  /* lesson */
  .lesson{scroll-margin-top:70px;}
  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}
  .rules h3,.traps h3,.ex h3,.try h3{font-family:var(--f-body); font-size:13px; letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; color:var(--ink-soft);}
  .rules ul,.traps ul{margin:0; padding-left:20px;} .rules li,.traps li{margin:3px 0;}
  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}
  .spr small{color:var(--ink-soft); font-size:13.5px;}
  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}
  svg.gr{width:100%; max-width:300px; height:auto;}
  .gr-grid line{stroke:var(--gr-grid); stroke-width:1;}
  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .qhead .qn{font-family:var(--f-display); font-size:20px; font-weight:700;}
  .pill{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--paper-2); color:var(--ink-soft);}
  .pill.E{background:var(--success-soft); color:var(--success);} .pill.M{background:var(--warn-soft); color:var(--warn);} .pill.H{background:var(--danger-soft); color:var(--danger);}
  .qnav{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .chip{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--card); font:600 14px var(--f-mono); cursor:pointer;}
  .chip.ans{background:var(--paper-2); border-color:var(--ink-soft);}
  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .timer{font:600 14px var(--f-mono); color:var(--ink-soft); margin-left:auto;}
  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

var S = {"id": "PSDA-2.2", "unit": "Problem-Solving and Data Analysis", "topic": "Data analysis", "title": "Data displays and comparing distributions", "intro": "Bar graphs, dot plots, histograms, frequency tables and box plots each organize data so it can be read at a glance. On the DSAT you read values and percents from these displays, find means, medians and quartiles from them, and compare two distributions by their center, spread and shape.", "los": [{"id": "LO1", "text": "Read and interpret bar graphs, dot plots, histograms and frequency tables to find counts, totals and percents."}, {"id": "LO2", "text": "Calculate the mean and median of data given in a frequency table or dot plot, and identify the interval of a histogram that contains the median."}, {"id": "LO3", "text": "Determine the five-number summary, range and interquartile range from a box plot, and interpret the quarters of the data it shows."}, {"id": "LO4", "text": "Compare two distributions by their centers (mean, median) and spreads (range, interquartile range, standard deviation)."}, {"id": "LO5", "text": "Identify the shape of a distribution as symmetric, skewed left or skewed right, and determine how the shape affects the relationship between the mean and the median."}], "notes": [{"lo": "LO1", "h": "Bar graphs and dot plots", "html": "<p>A <b>bar graph<\/b> shows categorical data: each bar is a category, such as a favorite fruit, and its height is the number (or percent) of data values in that category. The bars are separated because the categories have no numerical order. The graph below shows the favorite fruits of 50 students.<\/p><svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph. Mango: 18; Banana: 9; Apple: 12; Grapes: 7; Orange: 4\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"190\" x2=\"310\" y2=\"190\"/><line x1=\"52\" y1=\"172.2\" x2=\"310\" y2=\"172.2\"/><line x1=\"52\" y1=\"154.4\" x2=\"310\" y2=\"154.4\"/><line x1=\"52\" y1=\"136.6\" x2=\"310\" y2=\"136.6\"/><line x1=\"52\" y1=\"118.8\" x2=\"310\" y2=\"118.8\"/><line x1=\"52\" y1=\"101\" x2=\"310\" y2=\"101\"/><line x1=\"52\" y1=\"83.2\" x2=\"310\" y2=\"83.2\"/><line x1=\"52\" y1=\"65.4\" x2=\"310\" y2=\"65.4\"/><line x1=\"52\" y1=\"47.6\" x2=\"310\" y2=\"47.6\"/><line x1=\"52\" y1=\"29.8\" x2=\"310\" y2=\"29.8\"/><line x1=\"52\" y1=\"12\" x2=\"310\" y2=\"12\"/><\/g><rect class=\"fg-shape\" x=\"62.84\" y=\"29.8\" width=\"29.93\" height=\"160.2\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"114.44\" y=\"109.9\" width=\"29.93\" height=\"80.1\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"166.04\" y=\"83.2\" width=\"29.93\" height=\"106.8\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"217.64\" y=\"127.7\" width=\"29.93\" height=\"62.3\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"269.24\" y=\"154.4\" width=\"29.93\" height=\"35.6\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"310\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"154.4\" text-anchor=\"end\" dominant-baseline=\"middle\">4<\/text><text x=\"47\" y=\"118.8\" text-anchor=\"end\" dominant-baseline=\"middle\">8<\/text><text x=\"47\" y=\"83.2\" text-anchor=\"end\" dominant-baseline=\"middle\">12<\/text><text x=\"47\" y=\"47.6\" text-anchor=\"end\" dominant-baseline=\"middle\">16<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">20<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Number of students<\/text><text x=\"77.8\" y=\"205\" text-anchor=\"middle\">Mango<\/text><text x=\"129.4\" y=\"205\" text-anchor=\"middle\">Banana<\/text><text x=\"181\" y=\"205\" text-anchor=\"middle\">Apple<\/text><text x=\"232.6\" y=\"205\" text-anchor=\"middle\">Grapes<\/text><text x=\"284.2\" y=\"205\" text-anchor=\"middle\">Orange<\/text><text x=\"181\" y=\"228\" text-anchor=\"middle\">Favorite fruit<\/text><\/g><\/svg><div class=\"rule\">Read the height of a bar against the vertical scale. Add heights for a total, subtract them to compare, and divide a count by the grand total to get a fraction or percent.<\/div><p>Here, 18 + 12 = 30 students chose mango or apple, which is <span class=\"fq\"><span>30<\/span><span>50<\/span><\/span> = 60% of the students. A <b>dot plot<\/b> shows numerical data on a number line, with one dot for each data value, so the number of dots above a value is how often that value occurs.<\/p><div class=\"tip\">Always check the scale before reading. On the DSAT the gridlines may go up by 2, 5 or 10, and the question may ask for a percent of the total rather than a count.<\/div>"}, {"lo": "LO1", "h": "Histograms and frequency tables", "html": "<p>A <b>histogram<\/b> groups numerical data into equal intervals called <b>bins<\/b>. The bars touch, and the height of each bar is the number of values in that interval. The histogram shows the times 25 students took to finish a puzzle.<\/p><svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Histogram. 0 to 5: 2; 5 to 10: 6; 10 to 15: 9; 15 to 20: 5; 20 to 25: 3\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"190\" x2=\"310\" y2=\"190\"/><line x1=\"52\" y1=\"172.2\" x2=\"310\" y2=\"172.2\"/><line x1=\"52\" y1=\"154.4\" x2=\"310\" y2=\"154.4\"/><line x1=\"52\" y1=\"136.6\" x2=\"310\" y2=\"136.6\"/><line x1=\"52\" y1=\"118.8\" x2=\"310\" y2=\"118.8\"/><line x1=\"52\" y1=\"101\" x2=\"310\" y2=\"101\"/><line x1=\"52\" y1=\"83.2\" x2=\"310\" y2=\"83.2\"/><line x1=\"52\" y1=\"65.4\" x2=\"310\" y2=\"65.4\"/><line x1=\"52\" y1=\"47.6\" x2=\"310\" y2=\"47.6\"/><line x1=\"52\" y1=\"29.8\" x2=\"310\" y2=\"29.8\"/><line x1=\"52\" y1=\"12\" x2=\"310\" y2=\"12\"/><\/g><rect class=\"fg-shape\" x=\"60\" y=\"154.4\" width=\"48.4\" height=\"35.6\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"108.4\" y=\"83.2\" width=\"48.4\" height=\"106.8\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"156.8\" y=\"29.8\" width=\"48.4\" height=\"160.2\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"205.2\" y=\"101\" width=\"48.4\" height=\"89\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"253.6\" y=\"136.6\" width=\"48.4\" height=\"53.4\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"310\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"154.4\" text-anchor=\"end\" dominant-baseline=\"middle\">2<\/text><text x=\"47\" y=\"118.8\" text-anchor=\"end\" dominant-baseline=\"middle\">4<\/text><text x=\"47\" y=\"83.2\" text-anchor=\"end\" dominant-baseline=\"middle\">6<\/text><text x=\"47\" y=\"47.6\" text-anchor=\"end\" dominant-baseline=\"middle\">8<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">10<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Number of students<\/text><text x=\"60\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"108.4\" y=\"205\" text-anchor=\"middle\">5<\/text><text x=\"156.8\" y=\"205\" text-anchor=\"middle\">10<\/text><text x=\"205.2\" y=\"205\" text-anchor=\"middle\">15<\/text><text x=\"253.6\" y=\"205\" text-anchor=\"middle\">20<\/text><text x=\"302\" y=\"205\" text-anchor=\"middle\">25<\/text><text x=\"181\" y=\"228\" text-anchor=\"middle\">Time to finish puzzle (minutes)<\/text><\/g><\/svg><div class=\"rule\">A histogram tells you how many values lie in each interval, not the exact values. Read the question for the endpoint rule, such as “each bar includes its left endpoint but not its right endpoint.”<\/div><p>With that rule, a time of exactly 10 minutes belongs to the 10 to 15 bar. The number of students who took less than 10 minutes is 2 + 6 = 8, but you cannot tell how many took exactly 12 minutes. A <b>frequency table<\/b> carries the same kind of information in rows:<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Time (minutes)<\/th><th>Frequency<\/th><\/tr><tr><td>0 to 5<\/td><td>2<\/td><\/tr><tr><td>5 to 10<\/td><td>6<\/td><\/tr><tr><td>10 to 15<\/td><td>9<\/td><\/tr><tr><td>15 to 20<\/td><td>5<\/td><\/tr><tr><td>20 to 25<\/td><td>3<\/td><\/tr><tr><td>Total<\/td><td>25<\/td><\/tr><\/table><\/div>"}, {"lo": "LO2", "h": "Mean and median from a frequency table", "html": "<p>In a frequency table each value is listed once, with its <b>frequency<\/b>: the number of times it occurs. The table shows the number of goals scored by a team in each of 20 games.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Goals<\/th><th>Frequency<\/th><\/tr><tr><td>1<\/td><td>5<\/td><\/tr><tr><td>2<\/td><td>8<\/td><\/tr><tr><td>3<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>3<\/td><\/tr><tr><td>Total<\/td><td>20<\/td><\/tr><\/table><\/div><div class=\"eqs\">mean = <span class=\"fq\"><span>sum of (value × frequency)<\/span><span>total frequency<\/span><\/span><\/div><p>Here the sum is 1(5) + 2(8) + 3(4) + 4(3) = 45, so the mean is <span class=\"fq\"><span>45<\/span><span>20<\/span><\/span> = 2.25 goals per game. For the median, the 20 values in order have their middle at the 10th and 11th values. Add frequencies from the top: values 1 fill positions 1 to 5, and values 2 fill positions 6 to 13. Both middle values are 2, so the median is 2.<\/p><div class=\"rule\">Divide by the total frequency, not by the number of rows. Find the median by counting positions with running (cumulative) totals of the frequencies.<\/div>"}, {"lo": "LO2", "h": "Median from a dot plot or histogram", "html": "<p>A dot plot lets you count positions directly. The dot plot shows the number of pets owned by 15 families.<\/p><svg class=\"fig\" viewBox=\"0 0 320 110\" role=\"img\" aria-label=\"Dot plot. 1: 2 dots; 2: 4 dots; 3: 5 dots; 4: 3 dots; 5: 1 dot\"><line class=\"fg-axis\" x1=\"20\" y1=\"70\" x2=\"300\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"30\" y1=\"70\" x2=\"30\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"73.33\" y1=\"70\" x2=\"73.33\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"116.67\" y1=\"70\" x2=\"116.67\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"160\" y1=\"70\" x2=\"160\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"203.33\" y1=\"70\" x2=\"203.33\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"246.67\" y1=\"70\" x2=\"246.67\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"290\" y1=\"70\" x2=\"290\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"73.33\" cy=\"63\"/><circle r=\"3.5\" cx=\"73.33\" cy=\"53\"/><circle r=\"3.5\" cx=\"116.67\" cy=\"63\"/><circle r=\"3.5\" cx=\"116.67\" cy=\"53\"/><circle r=\"3.5\" cx=\"116.67\" cy=\"43\"/><circle r=\"3.5\" cx=\"116.67\" cy=\"33\"/><circle r=\"3.5\" cx=\"160\" cy=\"63\"/><circle r=\"3.5\" cx=\"160\" cy=\"53\"/><circle r=\"3.5\" cx=\"160\" cy=\"43\"/><circle r=\"3.5\" cx=\"160\" cy=\"33\"/><circle r=\"3.5\" cx=\"160\" cy=\"23\"/><circle r=\"3.5\" cx=\"203.33\" cy=\"63\"/><circle r=\"3.5\" cx=\"203.33\" cy=\"53\"/><circle r=\"3.5\" cx=\"203.33\" cy=\"43\"/><circle r=\"3.5\" cx=\"246.67\" cy=\"63\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"30\" y=\"87\" text-anchor=\"middle\">0<\/text><text x=\"73.33\" y=\"87\" text-anchor=\"middle\">1<\/text><text x=\"116.67\" y=\"87\" text-anchor=\"middle\">2<\/text><text x=\"160\" y=\"87\" text-anchor=\"middle\">3<\/text><text x=\"203.33\" y=\"87\" text-anchor=\"middle\">4<\/text><text x=\"246.67\" y=\"87\" text-anchor=\"middle\">5<\/text><text x=\"290\" y=\"87\" text-anchor=\"middle\">6<\/text><text x=\"160\" y=\"104\" text-anchor=\"middle\">Number of pets<\/text><\/g><\/svg><p>With 15 values, the median is the 8th value. Counting dots from the left, positions 1 to 2 are 1, positions 3 to 6 are 2, and positions 7 to 11 are 3, so the median is 3 pets. The mean is <span class=\"fq\"><span>1(2) + 2(4) + 3(5) + 4(3) + 5(1)<\/span><span>15<\/span><\/span> = <span class=\"fq\"><span>42<\/span><span>15<\/span><\/span> = 2.8 pets.<\/p><div class=\"rule\">For <i>n<\/i> values in order, the median is in position <span class=\"fq\"><span><i>n<\/i> + 1<\/span><span>2<\/span><\/span>. If <i>n<\/i> is even, average the two middle values.<\/div><p>A histogram does not show exact values, so you can only find the <b>interval<\/b> that contains the median. In the puzzle histogram, the median is the 13th of 25 times. The first two bars hold 8 times and the first three hold 17, so the median is in the 10 to 15 minute interval.<\/p>"}, {"lo": "LO3", "h": "Box plots and the five-number summary", "html": "<p>A <b>box plot<\/b> displays five numbers: the minimum, the first quartile <i>Q<\/i><sub>1<\/sub>, the median, the third quartile <i>Q<\/i><sub>3<\/sub>, and the maximum. The box runs from <i>Q<\/i><sub>1<\/sub> to <i>Q<\/i><sub>3<\/sub>, the line inside the box is the median, and the whiskers reach the minimum and maximum. This box plot summarizes a class’s test scores.<\/p><svg class=\"fig\" viewBox=\"0 0 320 100\" role=\"img\" aria-label=\"Box plot. minimum 45, first quartile 60, median 70, third quartile 78, maximum 95\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"24\" y1=\"10\" x2=\"24\" y2=\"60\"/><line x1=\"47\" y1=\"10\" x2=\"47\" y2=\"60\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"60\"/><line x1=\"93\" y1=\"10\" x2=\"93\" y2=\"60\"/><line x1=\"116\" y1=\"10\" x2=\"116\" y2=\"60\"/><line x1=\"139\" y1=\"10\" x2=\"139\" y2=\"60\"/><line x1=\"162\" y1=\"10\" x2=\"162\" y2=\"60\"/><line x1=\"185\" y1=\"10\" x2=\"185\" y2=\"60\"/><line x1=\"208\" y1=\"10\" x2=\"208\" y2=\"60\"/><line x1=\"231\" y1=\"10\" x2=\"231\" y2=\"60\"/><line x1=\"254\" y1=\"10\" x2=\"254\" y2=\"60\"/><line x1=\"277\" y1=\"10\" x2=\"277\" y2=\"60\"/><line x1=\"300\" y1=\"10\" x2=\"300\" y2=\"60\"/><\/g><line class=\"fg-axis\" x1=\"20\" y1=\"60\" x2=\"304\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"24\" y1=\"60\" x2=\"24\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"70\" y1=\"60\" x2=\"70\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"116\" y1=\"60\" x2=\"116\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"162\" y1=\"60\" x2=\"162\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"208\" y1=\"60\" x2=\"208\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"254\" y1=\"60\" x2=\"254\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"300\" y1=\"60\" x2=\"300\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-fit\" x1=\"47\" y1=\"35\" x2=\"116\" y2=\"35\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"198.8\" y1=\"35\" x2=\"277\" y2=\"35\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"47\" y1=\"28\" x2=\"47\" y2=\"42\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"277\" y1=\"28\" x2=\"277\" y2=\"42\" stroke=\"currentColor\" stroke-width=\"2\"/><rect class=\"fg-fit\" x=\"116\" y=\"24\" width=\"82.8\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"162\" y1=\"24\" x2=\"162\" y2=\"46\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"24\" y=\"77\" text-anchor=\"middle\">40<\/text><text x=\"70\" y=\"77\" text-anchor=\"middle\">50<\/text><text x=\"116\" y=\"77\" text-anchor=\"middle\">60<\/text><text x=\"162\" y=\"77\" text-anchor=\"middle\">70<\/text><text x=\"208\" y=\"77\" text-anchor=\"middle\">80<\/text><text x=\"254\" y=\"77\" text-anchor=\"middle\">90<\/text><text x=\"300\" y=\"77\" text-anchor=\"middle\">100<\/text><text x=\"162\" y=\"94\" text-anchor=\"middle\">Test score (points)<\/text><\/g><\/svg><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Minimum<\/th><th><i>Q<\/i><sub>1<\/sub><\/th><th>Median<\/th><th><i>Q<\/i><sub>3<\/sub><\/th><th>Maximum<\/th><\/tr><tr><td>45<\/td><td>60<\/td><td>70<\/td><td>78<\/td><td>95<\/td><\/tr><\/table><\/div><div class=\"rule\">Range = maximum − minimum. Interquartile range (IQR) = <i>Q<\/i><sub>3<\/sub> − <i>Q<\/i><sub>1<\/sub>, the length of the box.<\/div><p>For these scores the range is 95 − 45 = 50 points and the IQR is 78 − 60 = 18 points. The IQR measures the spread of the middle half of the data, so unlike the range it is not affected by one extreme score.<\/p>"}, {"lo": "LO3", "h": "What a box plot does and does not tell you", "html": "<p>The four parts of a box plot (left whisker, left half of the box, right half of the box, right whisker) each hold about one quarter of the data.<\/p><ul><li>About 25% of the values are below <i>Q<\/i><sub>1<\/sub> and about 25% are above <i>Q<\/i><sub>3<\/sub>.<\/li><li>About 50% of the values are between <i>Q<\/i><sub>1<\/sub> and <i>Q<\/i><sub>3<\/sub>.<\/li><li>At least half of the values are greater than or equal to the median.<\/li><\/ul><div class=\"rule\">A longer part of a box plot does not hold more values. It holds the same quarter of the data, spread over a wider interval.<\/div><p>If the test-score box plot summarizes 40 students, then about <span class=\"fq\"><span>40<\/span><span>4<\/span><\/span> = 10 students scored below 60, and about 20 students scored from 60 to 78. A box plot does <b>not<\/b> show the mean, the number of values, or any value other than the five it marks.<\/p><div class=\"tip\">DSAT questions about box plots often say “approximately” or “must be true.” For “must be true,” reject any statement that depends on how the values are arranged inside a quarter.<\/div>"}, {"lo": "LO4", "h": "Comparing two distributions", "html": "<p>To compare two data sets, compare like with like: <b>center<\/b> with center and <b>spread<\/b> with spread.<\/p><ul><li>Center: the mean or the median. A greater center means typically greater values.<\/li><li>Spread: the range, the IQR or the standard deviation. A greater spread means the values are less consistent.<\/li><\/ul><svg class=\"fig\" viewBox=\"0 0 320 146\" role=\"img\" aria-label=\"Box plots. Class A: minimum 50, first quartile 62, median 70, third quartile 76, maximum 90; Class B: minimum 58, first quartile 66, median 74, third quartile 80, maximum 86\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"74\" y1=\"10\" x2=\"74\" y2=\"106\"/><line x1=\"85.3\" y1=\"10\" x2=\"85.3\" y2=\"106\"/><line x1=\"96.6\" y1=\"10\" x2=\"96.6\" y2=\"106\"/><line x1=\"107.9\" y1=\"10\" x2=\"107.9\" y2=\"106\"/><line x1=\"119.2\" y1=\"10\" x2=\"119.2\" y2=\"106\"/><line x1=\"130.5\" y1=\"10\" x2=\"130.5\" y2=\"106\"/><line x1=\"141.8\" y1=\"10\" x2=\"141.8\" y2=\"106\"/><line x1=\"153.1\" y1=\"10\" x2=\"153.1\" y2=\"106\"/><line x1=\"164.4\" y1=\"10\" x2=\"164.4\" y2=\"106\"/><line x1=\"175.7\" y1=\"10\" x2=\"175.7\" y2=\"106\"/><line x1=\"187\" y1=\"10\" x2=\"187\" y2=\"106\"/><line x1=\"198.3\" y1=\"10\" x2=\"198.3\" y2=\"106\"/><line x1=\"209.6\" y1=\"10\" x2=\"209.6\" y2=\"106\"/><line x1=\"220.9\" y1=\"10\" x2=\"220.9\" y2=\"106\"/><line x1=\"232.2\" y1=\"10\" x2=\"232.2\" y2=\"106\"/><line x1=\"243.5\" y1=\"10\" x2=\"243.5\" y2=\"106\"/><line x1=\"254.8\" y1=\"10\" x2=\"254.8\" y2=\"106\"/><line x1=\"266.1\" y1=\"10\" x2=\"266.1\" y2=\"106\"/><line x1=\"277.4\" y1=\"10\" x2=\"277.4\" y2=\"106\"/><line x1=\"288.7\" y1=\"10\" x2=\"288.7\" y2=\"106\"/><line x1=\"300\" y1=\"10\" x2=\"300\" y2=\"106\"/><\/g><line class=\"fg-axis\" x1=\"70\" y1=\"106\" x2=\"304\" y2=\"106\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"74\" y1=\"106\" x2=\"74\" y2=\"111\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130.5\" y1=\"106\" x2=\"130.5\" y2=\"111\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"187\" y1=\"106\" x2=\"187\" y2=\"111\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"243.5\" y1=\"106\" x2=\"243.5\" y2=\"111\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"300\" y1=\"106\" x2=\"300\" y2=\"111\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-fit\" x1=\"74\" y1=\"35\" x2=\"141.8\" y2=\"35\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"220.9\" y1=\"35\" x2=\"300\" y2=\"35\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"74\" y1=\"28\" x2=\"74\" y2=\"42\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"300\" y1=\"28\" x2=\"300\" y2=\"42\" stroke=\"currentColor\" stroke-width=\"2\"/><rect class=\"fg-fit\" x=\"141.8\" y=\"24\" width=\"79.1\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"187\" y1=\"24\" x2=\"187\" y2=\"46\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"119.2\" y1=\"81\" x2=\"164.4\" y2=\"81\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"243.5\" y1=\"81\" x2=\"277.4\" y2=\"81\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"119.2\" y1=\"74\" x2=\"119.2\" y2=\"88\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"277.4\" y1=\"74\" x2=\"277.4\" y2=\"88\" stroke=\"currentColor\" stroke-width=\"2\"/><rect class=\"fg-fit\" x=\"164.4\" y=\"70\" width=\"79.1\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-fit\" x1=\"209.6\" y1=\"70\" x2=\"209.6\" y2=\"92\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"66\" y=\"35\" text-anchor=\"end\" dominant-baseline=\"middle\">Class A<\/text><text x=\"66\" y=\"81\" text-anchor=\"end\" dominant-baseline=\"middle\">Class B<\/text><text x=\"74\" y=\"123\" text-anchor=\"middle\">50<\/text><text x=\"130.5\" y=\"123\" text-anchor=\"middle\">60<\/text><text x=\"187\" y=\"123\" text-anchor=\"middle\">70<\/text><text x=\"243.5\" y=\"123\" text-anchor=\"middle\">80<\/text><text x=\"300\" y=\"123\" text-anchor=\"middle\">90<\/text><text x=\"187\" y=\"140\" text-anchor=\"middle\">Score (points)<\/text><\/g><\/svg><p>In the box plots, Class B has the greater median (74 points versus 70 points), so Class B typically scored higher. Class A has the greater range (40 versus 28), but the IQRs are equal (76 − 62 = 14 and 80 − 66 = 14), so the middle halves of the two classes are equally spread.<\/p><div class=\"rule\">Standard deviation measures how far values typically are from the mean. Data bunched close to the mean have a small standard deviation; data with many values far from the mean have a large one.<\/div><div class=\"tip\">On the DSAT you will not compute a standard deviation. Compare it by eye: look at which display has more values far from its center.<\/div>"}, {"lo": "LO5", "h": "Shape and its effect on mean and median", "html": "<p>The <b>shape<\/b> of a distribution describes where the values pile up and where they thin out.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Shape<\/th><th>Tail<\/th><th>Mean vs median<\/th><\/tr><tr><td>Symmetric<\/td><td>both sides alike<\/td><td>mean ≈ median<\/td><\/tr><tr><td>Skewed right<\/td><td>long tail to the right<\/td><td>mean &gt; median<\/td><\/tr><tr><td>Skewed left<\/td><td>long tail to the left<\/td><td>mean &lt; median<\/td><\/tr><\/table><\/div><p>The histogram of waiting times below is skewed right: most customers waited less than 20 minutes, but a few waited much longer.<\/p><svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Histogram. 0 to 10: 14; 10 to 20: 10; 20 to 30: 6; 30 to 40: 4; 40 to 50: 2; 50 to 60: 1\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"190\" x2=\"310\" y2=\"190\"/><line x1=\"52\" y1=\"167.75\" x2=\"310\" y2=\"167.75\"/><line x1=\"52\" y1=\"145.5\" x2=\"310\" y2=\"145.5\"/><line x1=\"52\" y1=\"123.25\" x2=\"310\" y2=\"123.25\"/><line x1=\"52\" y1=\"101\" x2=\"310\" y2=\"101\"/><line x1=\"52\" y1=\"78.75\" x2=\"310\" y2=\"78.75\"/><line x1=\"52\" y1=\"56.5\" x2=\"310\" y2=\"56.5\"/><line x1=\"52\" y1=\"34.25\" x2=\"310\" y2=\"34.25\"/><line x1=\"52\" y1=\"12\" x2=\"310\" y2=\"12\"/><\/g><rect class=\"fg-shape\" x=\"60\" y=\"34.25\" width=\"40.33\" height=\"155.75\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"100.33\" y=\"78.75\" width=\"40.33\" height=\"111.25\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"140.67\" y=\"123.25\" width=\"40.33\" height=\"66.75\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"181\" y=\"145.5\" width=\"40.33\" height=\"44.5\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"221.33\" y=\"167.75\" width=\"40.33\" height=\"22.25\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"261.67\" y=\"178.88\" width=\"40.33\" height=\"11.12\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"310\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"145.5\" text-anchor=\"end\" dominant-baseline=\"middle\">4<\/text><text x=\"47\" y=\"101\" text-anchor=\"end\" dominant-baseline=\"middle\">8<\/text><text x=\"47\" y=\"56.5\" text-anchor=\"end\" dominant-baseline=\"middle\">12<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">16<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Number of customers<\/text><text x=\"60\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"100.33\" y=\"205\" text-anchor=\"middle\">10<\/text><text x=\"140.67\" y=\"205\" text-anchor=\"middle\">20<\/text><text x=\"181\" y=\"205\" text-anchor=\"middle\">30<\/text><text x=\"221.33\" y=\"205\" text-anchor=\"middle\">40<\/text><text x=\"261.67\" y=\"205\" text-anchor=\"middle\">50<\/text><text x=\"302\" y=\"205\" text-anchor=\"middle\">60<\/text><text x=\"181\" y=\"228\" text-anchor=\"middle\">Waiting time (minutes)<\/text><\/g><\/svg><div class=\"rule\">A skewed distribution is named for the side of its long tail. The few extreme values in the tail pull the mean toward the tail, while the median barely moves.<\/div><p>For skewed data the median usually describes a typical value better than the mean does.<\/p>"}], "examples": [{"lo": "LO1", "q": "The histogram shows the number of hours that each of 40 volunteers worked at a food drive. Each bar includes its left endpoint but not its right endpoint.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Histogram. 0 to 3: 5; 3 to 6: 12; 6 to 9: 11; 9 to 12: 8; 12 to 15: 4\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"190\" x2=\"310\" y2=\"190\"/><line x1=\"52\" y1=\"164.57\" x2=\"310\" y2=\"164.57\"/><line x1=\"52\" y1=\"139.14\" x2=\"310\" y2=\"139.14\"/><line x1=\"52\" y1=\"113.71\" x2=\"310\" y2=\"113.71\"/><line x1=\"52\" y1=\"88.29\" x2=\"310\" y2=\"88.29\"/><line x1=\"52\" y1=\"62.86\" x2=\"310\" y2=\"62.86\"/><line x1=\"52\" y1=\"37.43\" x2=\"310\" y2=\"37.43\"/><line x1=\"52\" y1=\"12\" x2=\"310\" y2=\"12\"/><\/g><rect class=\"fg-shape\" x=\"60\" y=\"126.43\" width=\"48.4\" height=\"63.57\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"108.4\" y=\"37.43\" width=\"48.4\" height=\"152.57\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"156.8\" y=\"50.14\" width=\"48.4\" height=\"139.86\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"205.2\" y=\"88.29\" width=\"48.4\" height=\"101.71\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"253.6\" y=\"139.14\" width=\"48.4\" height=\"50.86\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"310\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"164.57\" text-anchor=\"end\" dominant-baseline=\"middle\">2<\/text><text x=\"47\" y=\"139.14\" text-anchor=\"end\" dominant-baseline=\"middle\">4<\/text><text x=\"47\" y=\"113.71\" text-anchor=\"end\" dominant-baseline=\"middle\">6<\/text><text x=\"47\" y=\"88.29\" text-anchor=\"end\" dominant-baseline=\"middle\">8<\/text><text x=\"47\" y=\"62.86\" text-anchor=\"end\" dominant-baseline=\"middle\">10<\/text><text x=\"47\" y=\"37.43\" text-anchor=\"end\" dominant-baseline=\"middle\">12<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">14<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Number of volunteers<\/text><text x=\"60\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"108.4\" y=\"205\" text-anchor=\"middle\">3<\/text><text x=\"156.8\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"205.2\" y=\"205\" text-anchor=\"middle\">9<\/text><text x=\"253.6\" y=\"205\" text-anchor=\"middle\">12<\/text><text x=\"302\" y=\"205\" text-anchor=\"middle\">15<\/text><text x=\"181\" y=\"228\" text-anchor=\"middle\">Hours volunteered<\/text><\/g><\/svg>What percent of the volunteers worked fewer than 6 hours? Can you tell how many volunteers worked exactly 7 hours?", "steps": ["“Fewer than 6 hours” means the bars from 0 to 3 and from 3 to 6: 5 + 12 = 17 volunteers.", "As a percent of all 40 volunteers: <span class=\"fq\"><span>17<\/span><span>40<\/span><\/span> = 0.425 = 42.5%.", "The 6 to 9 bar shows 11 volunteers, but a histogram does not show individual values, so the number who worked exactly 7 hours cannot be found."], "ans": "42.5%; no, the histogram does not show exact values"}, {"lo": "LO2", "q": "The table shows the number of languages spoken by each of 20 students in a class.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Languages spoken<\/th><th>Number of students<\/th><\/tr><tr><td>1<\/td><td>7<\/td><\/tr><tr><td>2<\/td><td>6<\/td><\/tr><tr><td>3<\/td><td>5<\/td><\/tr><tr><td>4<\/td><td>2<\/td><\/tr><tr><td>Total<\/td><td>20<\/td><\/tr><\/table><\/div>What is the mean number of languages spoken by these students? What is the median?", "steps": ["Multiply each value by its frequency and add: 1(7) + 2(6) + 3(5) + 4(2) = 7 + 12 + 15 + 8 = 42.", "Divide by the total frequency, 20 (not by 4, the number of rows): mean = <span class=\"fq\"><span>42<\/span><span>20<\/span><\/span> = 2.1.", "The median is the average of the 10th and 11th values. Running totals: 7 values are 1, and the values 2 fill positions 8 to 13.", "Both the 10th and 11th values are 2, so the median is 2."], "ans": "Mean 2.1 languages; median 2 languages"}, {"lo": "LO2", "q": "The dot plot shows the number of emails each of 12 employees received before 9 a.m. one day.<svg class=\"fig\" viewBox=\"0 0 320 100\" role=\"img\" aria-label=\"Dot plot. 2: 1 dot; 3: 3 dots; 4: 4 dots; 5: 2 dots; 7: 1 dot; 10: 1 dot\"><line class=\"fg-axis\" x1=\"20\" y1=\"60\" x2=\"300\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"30\" y1=\"60\" x2=\"30\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"58.89\" y1=\"60\" x2=\"58.89\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"87.78\" y1=\"60\" x2=\"87.78\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"116.67\" y1=\"60\" x2=\"116.67\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"145.56\" y1=\"60\" x2=\"145.56\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"174.44\" y1=\"60\" x2=\"174.44\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"203.33\" y1=\"60\" x2=\"203.33\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"232.22\" y1=\"60\" x2=\"232.22\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"261.11\" y1=\"60\" x2=\"261.11\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"290\" y1=\"60\" x2=\"290\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"58.89\" cy=\"53\"/><circle r=\"3.5\" cx=\"87.78\" cy=\"53\"/><circle r=\"3.5\" cx=\"87.78\" cy=\"43\"/><circle r=\"3.5\" cx=\"87.78\" cy=\"33\"/><circle r=\"3.5\" cx=\"116.67\" cy=\"53\"/><circle r=\"3.5\" cx=\"116.67\" cy=\"43\"/><circle r=\"3.5\" cx=\"116.67\" cy=\"33\"/><circle r=\"3.5\" cx=\"116.67\" cy=\"23\"/><circle r=\"3.5\" cx=\"145.56\" cy=\"53\"/><circle r=\"3.5\" cx=\"145.56\" cy=\"43\"/><circle r=\"3.5\" cx=\"203.33\" cy=\"53\"/><circle r=\"3.5\" cx=\"290\" cy=\"53\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"30\" y=\"77\" text-anchor=\"middle\">1<\/text><text x=\"58.89\" y=\"77\" text-anchor=\"middle\">2<\/text><text x=\"87.78\" y=\"77\" text-anchor=\"middle\">3<\/text><text x=\"116.67\" y=\"77\" text-anchor=\"middle\">4<\/text><text x=\"145.56\" y=\"77\" text-anchor=\"middle\">5<\/text><text x=\"174.44\" y=\"77\" text-anchor=\"middle\">6<\/text><text x=\"203.33\" y=\"77\" text-anchor=\"middle\">7<\/text><text x=\"232.22\" y=\"77\" text-anchor=\"middle\">8<\/text><text x=\"261.11\" y=\"77\" text-anchor=\"middle\">9<\/text><text x=\"290\" y=\"77\" text-anchor=\"middle\">10<\/text><text x=\"160\" y=\"94\" text-anchor=\"middle\">Number of emails received<\/text><\/g><\/svg>Find the mean and the median of the data.", "steps": ["Total of the values: 2(1) + 3(3) + 4(4) + 5(2) + 7(1) + 10(1) = 2 + 9 + 16 + 10 + 7 + 10 = 54.", "Mean = <span class=\"fq\"><span>54<\/span><span>12<\/span><\/span> = 4.5 emails.", "With 12 values, the median is the average of the 6th and 7th. Counting dots from the left, positions 5 to 8 are all 4.", "So the median is 4 emails. The two large values, 7 and 10, pull the mean above the median."], "ans": "Mean 4.5 emails; median 4 emails"}, {"lo": "LO3", "q": "The box plot summarizes the times, in seconds, of 60 swimmers in a 50-meter race.<svg class=\"fig\" viewBox=\"0 0 320 100\" role=\"img\" aria-label=\"Box plot. minimum 52, first quartile 56, median 59, third quartile 63, maximum 70\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"24\" y1=\"10\" x2=\"24\" y2=\"60\"/><line x1=\"37.8\" y1=\"10\" x2=\"37.8\" y2=\"60\"/><line x1=\"51.6\" y1=\"10\" x2=\"51.6\" y2=\"60\"/><line x1=\"65.4\" y1=\"10\" x2=\"65.4\" y2=\"60\"/><line x1=\"79.2\" y1=\"10\" x2=\"79.2\" y2=\"60\"/><line x1=\"93\" y1=\"10\" x2=\"93\" y2=\"60\"/><line x1=\"106.8\" y1=\"10\" x2=\"106.8\" y2=\"60\"/><line x1=\"120.6\" y1=\"10\" x2=\"120.6\" y2=\"60\"/><line x1=\"134.4\" y1=\"10\" x2=\"134.4\" y2=\"60\"/><line x1=\"148.2\" y1=\"10\" x2=\"148.2\" y2=\"60\"/><line x1=\"162\" y1=\"10\" x2=\"162\" y2=\"60\"/><line x1=\"175.8\" y1=\"10\" x2=\"175.8\" y2=\"60\"/><line x1=\"189.6\" y1=\"10\" x2=\"189.6\" y2=\"60\"/><line x1=\"203.4\" y1=\"10\" x2=\"203.4\" y2=\"60\"/><line x1=\"217.2\" y1=\"10\" x2=\"217.2\" y2=\"60\"/><line x1=\"231\" y1=\"10\" x2=\"231\" y2=\"60\"/><line x1=\"244.8\" y1=\"10\" x2=\"244.8\" y2=\"60\"/><line x1=\"258.6\" y1=\"10\" x2=\"258.6\" y2=\"60\"/><line x1=\"272.4\" y1=\"10\" x2=\"272.4\" y2=\"60\"/><line x1=\"286.2\" y1=\"10\" x2=\"286.2\" y2=\"60\"/><line x1=\"300\" y1=\"10\" x2=\"300\" y2=\"60\"/><\/g><line class=\"fg-axis\  at 5 minutes (mean 5, median 5) and Group Y at 8 minutes (mean 8, median 8), so Group Y has the greater center.", "Each plot has the same pattern of dots, 1, 2, 4, 2, 1, so each range is 4 minutes and the spreads are identical.", "Group Y’s times are just Group X’s times moved 3 minutes to the right."], "ans": "B"}, {"lo": "LO5", "q": "The histogram shows the amount of mobile data, in gigabytes, used in one month by each of 50 phone users. Each bar includes its left endpoint but not its right endpoint.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Histogram. 0 to 2: 18; 2 to 4: 14; 4 to 6: 8; 6 to 8: 5; 8 to 10: 3; 10 to 12: 2\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"190\" x2=\"310\" y2=\"190\"/><line x1=\"52\" y1=\"172.2\" x2=\"310\" y2=\"172.2\"/><line x1=\"52\" y1=\"154.4\" x2=\"310\" y2=\"154.4\"/><line x1=\"52\" y1=\"136.6\" x2=\"310\" y2=\"136.6\"/><line x1=\"52\" y1=\"118.8\" x2=\"310\" y2=\"118.8\"/><line x1=\"52\" y1=\"101\" x2=\"310\" y2=\"101\"/><line x1=\"52\" y1=\"83.2\" x2=\"310\" y2=\"83.2\"/><line x1=\"52\" y1=\"65.4\" x2=\"310\" y2=\"65.4\"/><line x1=\"52\" y1=\"47.6\" x2=\"310\" y2=\"47.6\"/><line x1=\"52\" y1=\"29.8\" x2=\"310\" y2=\"29.8\"/><line x1=\"52\" y1=\"12\" x2=\"310\" y2=\"12\"/><\/g><rect class=\"fg-shape\" x=\"60\" y=\"29.8\" width=\"40.33\" height=\"160.2\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"100.33\" y=\"65.4\" width=\"40.33\" height=\"124.6\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"140.67\" y=\"118.8\" width=\"40.33\" height=\"71.2\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"181\" y=\"145.5\" width=\"40.33\" height=\"44.5\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1 \/tr><tr><td>5<\/td><td>6<\/td><\/tr><\/table><\/div>If <i>k<\/i> is a positive integer, what is the least possible value of <i>k<\/i>?", "ans": ["7"], "sol": "There are 12 values less than 4 and 6 values greater than 4, so there are 18 + <i>k<\/i> values in all.<br>For the median to be 4, the middle position (or both middle positions) must come after the 12 values that are less than 4.<br>If <i>k<\/i> = 6, there are 24 values, and the 12th and 13th are 3 and 4, giving a median of 3.5.<br>If <i>k<\/i> = 7, there are 25 values, and the 13th value is 4.<br>Answer: <b>7<\/b>"}, {"lo": "LO3", "diff": "X", "type": "mcq", "q": "The box plot summarizes data set A. The frequency table summarizes data set B, which has 20 values.<svg class=\"fig\" viewBox=\"0 0 320 100\" role=\"img\" aria-label=\"Box plot. minimum 8, first quartile 10, median 13, third quartile 16, maximum 18\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"24\" y1=\"10\" x2=\"24\" y2=\"60\"/><line x1=\"42.4\" y1=\"10\" x2=\"42.4\" y2=\"60\"/><line x1=\"60.8\" y1=\"10\" x2=\"60.8\" y2=\"60\"/><line x1=\"79.2\" y1=\"10\" x2=\"79.2\" y2=\"60\"/><line x1=\"97.6\" y1=\"10\" x2=\"97.6\" y2=\"60\"/><line x1=\"116\" y1=\"10\" x2=\"116\" y2=\"60\"/><line x1=\"134.4\" y1=\"10\" x2=\"134.4\" y2=\"60\"/><line x1=\"152.8\" y1=\"10\" x2=\"152.8\" y2=\"60\"/><line x1=\"171.2\" y1=\"10\" x2=\"171.2\" y2=\"60\"/><line x1=\"189.6\" y1=\"10\" x2=\"189.6\" y2=\"60\"/><line x1=\"208\" y1=\"10\" x2=\"208\" y2=\"60\"/><line x1=\"226.4\" y1=\"10\" x2=\"226.4\" y2=\"60\"/><line x1=\"244.8\" y1=\"10\" x2=\"244.8\" y2=\"60\"/><line x1=\"263.2\" y1=\"10\" x2=\"263.2\" y2=\"60\"/><line x1=\"281.6\" y1=\"10\" x2=\"281.6\" y2=\"60\"/><line x1=\"300\" y1=\"10\" x2=\"300\" y2=\"60\"/><\/g><line class=\"fg-axis\" x1=\"20\" y1=\"60\" x2=\"304\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"24\" y1=\"60\" x2=\"24\" y2=\"65\" stroke=\"currentColor\" strok middle (5th and 6th values) is 11, so <i>Q<\/i><sub>1<\/sub> = 11. The upper half is the 11th to 20th values; its middle (15th and 16th values) is 13, so <i>Q<\/i><sub>3<\/sub> = 13.<br>IQR of B = 13 − 11 = 2.<br>6 − 2 = 4.<br>Answer: <b>4<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "Data set A and data set B each contain 25 values from 1 to 5. The table shows their frequencies.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Value<\/th><th>Frequency in data set A<\/th><th>Frequency in data set B<\/th><\/tr><tr><td>1<\/td><td>1<\/td><td>9<\/td><\/tr><tr><td>2<\/td><td>3<\/td><td>7<\/td><\/tr><tr><td>3<\/td><td>5<\/td><td>5<\/td><\/tr><tr><td>4<\/td><td>7<\/td><td>3<\/td><\/tr><tr><td>5<\/td><td>9<\/td><td>1<\/td><\/tr><tr><td>Total<\/td><td>25<\/td><td>25<\/td><\/tr><\/table><\/div>Which statement is true?", "opts": ["The means are equal, and the standard deviations are equal.", "The mean of data set A is greater, and the standard deviation of data set A is greater.", "The mean of data set A is greater, and the standard deviations are equal.", "The mean of data set B is greater, and the standard deviations are equal."], "ans": 2, "sol": "Data set B is data set A reflected about 3 (each value <i>v<\/i> in A matches 6 − <i>v<\/i> in B), so the two sets have the same spread: equal standard deviations.<br>Means: A is <span class=\"fq\"><span>95<\/span><span>25<\/span><\/span> = 3.8 and B is <span class=\"fq\"><span>55<\/span><span>25<\/span><\/span> = 2.2.<br>Answer: <b>The mean of data set A is greater, and the standard deviations are equal.<\/b>"}, {"lo": "LO5", "diff": "X", "type": "mcq", "q": "The table shows the frequencies of the values in four data sets, P, Q, R and S. Each data set has 15 values.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Value<\/th><th>P<\/th><th>Q<\/th><th>R<\/th><th>S<\/th><\/tr><tr><td>1<\/td><td>3<\/td><td>1<\/td><td>3<\/td><td>5<\/td><\/tr><tr><td>2<\/td><td>5<\/td><td>2<\/td><td>2<\/td><td>1<\/td><\/tr><tr><td>3<\/ /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
