<style>

  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}

  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}

var S = {"id": "GEO-1.3", "unit": "Geometry and Trigonometry", "topic": "Lines, angles and triangles", "title": "Similar triangles", "intro": "Similar triangles have the same shape but not necessarily the same size: their angles are equal and their sides are in proportion. On the DSAT you must spot similar triangles hidden inside a figure, often from a line parallel to a side or two segments that cross, and then use the scale factor to find a missing length, a height in a shadow problem or a perimeter.", "los": [{"id": "LO1", "text": "Identify similar triangles by AA, including triangles formed by a line parallel to a side and overlapping or nested triangles, and write a similarity statement with the vertices in matching order."}, {"id": "LO2", "text": "Determine the scale factor between similar triangles and use proportional corresponding sides to find missing lengths, including sides given as algebraic expressions."}, {"id": "LO3", "text": "Find missing lengths in nested and crossed (hourglass) figures formed by segments parallel to a side of a triangle."}, {"id": "LO4", "text": "Solve problems with similar right triangles, including shadow, lamppost and sight-line problems and the altitude drawn to the hypotenuse."}, {"id": "LO5", "text": "Apply the fact that the ratio of the perimeters of similar triangles equals the scale factor."}], "notes": [{"lo": "LO1", "h": "What similar means", "html": "<p>Two triangles are <b>similar<\/b> when one is an enlargement or a reduction of the other: they have the same shape but not necessarily the same size. In similar triangles,<\/p><ul><li>corresponding angles are equal, and<\/li><li>corresponding sides are in proportion: each side of one triangle is the same multiple of the matching side of the other.<\/li><\/ul><p>We write △<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>E<\/i><i>F<\/i>, read “triangle <i>A<\/i><i>B<\/i><i>C<\/i> is similar to triangle <i>D<\/i><i>E<\/i><i>F<\/i>.” The <b>order of the letters<\/b> tells you which parts match: <i>A<\/i> matches <i>D<\/i>, <i>B<\/i> matches <i>E<\/i> and <i>C<\/i> matches <i>F<\/i>. So <i>A<\/i><i>B<\/i> matches <i>D<\/i><i>E<\/i>, <i>B<\/i><i>C<\/i> matches <i>E<\/i><i>F<\/i> and <i>A<\/i><i>C<\/i> matches <i>D<\/i><i>F<\/i>.<\/p><div class=\"rule\">In a similarity statement, matching vertices sit in the same position. Read the correspondence from the statement, not from how the figure looks.<\/div><div class=\"tip\">DSAT tip: a figure may show the two triangles turned or flipped. Before you write a proportion, list the pairs of matching vertices.<\/div>"}, {"lo": "LO1", "h": "The AA shortcut and where it hides", "html": "<p>You do not need to check all three angles. The angles of every triangle add up to 180°, so if two angles of one triangle equal two angles of another, the third angles are equal too.<\/p><div class=\"rule\">AA similarity: if two angles of one triangle are equal to two angles of another triangle, the triangles are similar.<\/div><p>On the DSAT the equal angles are usually hidden in the figure:<\/p><ul><li><b>A line parallel to a side.<\/b> If <i>D<\/i><i>E<\/i> ∥ <i>B<\/i><i>C<\/i>, then ∠<i>A<\/i><i>D<\/i><i>E<\/i> = ∠<i>A<\/i><i>B<\/i><i>C<\/i> (corresponding angles) and ∠<i>A<\/i> is shared, so △<i>A<\/i><i>D<\/i><i>E<\/i> ∼ △<i>A<\/i><i>B<\/i><i>C<\/i>.<\/li><li><b>A shared angle<\/b> in overlapping triangles, even when no lines are parallel.<\/li><li><b>Vertical angles<\/b> where two segments cross.<\/li><li><b>Right angles:<\/b> two right triangles need only one more pair of equal angles.<\/li><\/ul><svg class=\"fig\" viewBox=\"0 0 240 190\" role=\"img\" aria-label=\"Triangle ABC with point D on side AB and point E on side AC. Segment DE is parallel to side BC and cuts off a smaller triangle ADE at the top.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"94.93,32.33 26,157.67 214,157.67\"/><line class=\"fg-edge\" x1=\"63.91\" y1=\"88.73\" x2=\"148.51\" y2=\"88.73\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"94.93\" cy=\"32.33\" r=\"3\"/><circle cx=\"26\" cy=\"157.67\" r=\"3\"/><circle cx=\"214\" cy=\"157.67\" r=\"3\"/><circle cx=\"63.91\" cy=\"88.73\" r=\"3\"/><circle cx=\"148.51\" cy=\"88.73\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"92.38\" y=\"24.09\" text-anchor=\"middle\">A<\/text><text x=\"14.32\" y=\"167.87\" text-anchor=\"middle\">B<\/text><text x=\"226.04\" y=\"167.08\" text-anchor=\"middle\">C<\/text><text x=\"51.06\" y=\"91.3\" text-anchor=\"middle\">D<\/text><text x=\"161.37\" y=\"91.3\" text-anchor=\"middle\">E<\/text><\/g><\/svg>"}, {"lo": "LO2", "h": "Scale factor and proportions", "html": "<p>The <b>scale factor<\/b> from one triangle to a similar one is the number you multiply each side of the first triangle by to get the matching side of the second. If △<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>E<\/i><i>F<\/i> with <i>A<\/i><i>B<\/i> = 4 and <i>D<\/i><i>E<\/i> = 10, the scale factor from <i>A<\/i><i>B<\/i><i>C<\/i> to <i>D<\/i><i>E<\/i><i>F<\/i> is <span class=\"fq\"><span>10<\/span><span>4<\/span><\/span> = 2.5, so every side of <i>D<\/i><i>E<\/i><i>F<\/i> is 2.5 times its partner in <i>A<\/i><i>B<\/i><i>C<\/i>.<\/p><div class=\"eqs\"><span class=\"fq\"><span><i>D<\/i><i>E<\/i><\/span><span><i>A<\/i><i>B<\/i><\/span><\/span> = <span class=\"fq\"><span><i>E<\/i><i>F<\/i><\/span><span><i>B<\/i><i>C<\/i><\/span><\/span> = <span class=\"fq\"><span><i>D<\/i><i>F<\/i><\/span><span><i>A<\/i><i>C<\/i><\/span><\/span> = <i>k<\/i><\/div><p>To find a missing side, multiply by the scale factor, or set up a proportion and cross multiply. Keep every ratio in the same order, such as new over original.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Known<\/th><th>Proportion<\/th><th>Result<\/th><\/tr><tr><td><i>A<\/i><i>B<\/i> = 4, <i>D<\/i><i>E<\/i> = 10, <i>B<\/i><i>C<\/i> = 6<\/td><td><span class=\"fq\"><span><i>E<\/i><i>F<\/i><\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>10<\/span><span>4<\/span><\/span><\/td><td><i>E<\/i><i>F<\/i> = 15<\/td><\/tr><tr><td><i>A<\/i><i>B<\/i> = 4, <i>D<\/i><i>E<\/i> = 10, <i>D<\/i><i>F<\/i> = 12.5<\/td><td><span class=\"fq\"><span><i>A<\/i><i>C<\/i><\/span><span>12.5<\/span><\/span> = <span class=\"fq\"><span>4<\/span><span>10<\/span><\/span><\/td><td><i>A<\/i><i>C<\/i> = 5<\/td><\/tr><\/table><\/div><div class=\"rule\">Similar sides grow by multiplying, not by adding. If one side goes from 4 to 10, a side of length 6 goes to 15, not to 12.<\/div>"}, {"lo": "LO3", "h": "Nested triangles: use whole sides", "html": "<p>When <i>D<\/i><i>E<\/i> ∥ <i>B<\/i><i>C<\/i>, the small triangle <i>A<\/i><i>D<\/i><i>E<\/i> sits inside △<i>A<\/i><i>B<\/i><i>C<\/i> and shares vertex <i>A<\/i>. The matching sides are <i>A<\/i><i>D<\/i> with <i>A<\/i><i>B<\/i>, <i>A<\/i><i>E<\/i> with <i>A<\/i><i>C<\/i>, and <i>D<\/i><i>E<\/i> with <i>B<\/i><i>C<\/i>.<\/p><div class=\"rule\">Compare a part of a side with the <b>whole<\/b> side: <span class=\"fq\"><span><i>A<\/i><i>D<\/i><\/span><span><i>A<\/i><i>B<\/i><\/span><\/span> = <span class=\"fq\"><span><i>A<\/i><i>E<\/i><\/span><span><i>A<\/i><i>C<\/i><\/span><\/span> = <span class=\"fq\"><span><i>D<\/i><i>E<\/i><\/span><span><i>B<\/i><i>C<\/i><\/span><\/span>. The piece <i>D<\/i><i>B<\/i> is not a side of either triangle.<\/div><p>For example, if <i>A<\/i><i>D<\/i> = 2, <i>D<\/i><i>B<\/i> = 6 and <i>D<\/i><i>E<\/i> = 3, then <i>A<\/i><i>B<\/i> = 2 + 6 = 8, the scale factor from <i>A<\/i><i>D<\/i><i>E<\/i> to <i>A<\/i><i>B<\/i><i>C<\/i> is <span class=\"fq\"><span>8<\/span><span>2<\/span><\/span> = 4, and <i>B<\/i><i>C<\/i> = 4 × 3 = 12. Using <i>D<\/i><i>B<\/i> = 6 in place of <i>A<\/i><i>B<\/i> would give the wrong value 9.<\/p><p>The parallel segment also splits the two sides in the same ratio, <span class=\"fq\"><span><i>A<\/i><i>D<\/i><\/span><span><i>D<\/i><i>B<\/i><\/span><\/span> = <span class=\"fq\"><span><i>A<\/i><i>E<\/i><\/span><span><i>E<\/i><i>C<\/i><\/span><\/span>, but this shortcut is for the side pieces only.<\/p><div class=\"tip\">DSAT tip: write the full lengths of <i>A<\/i><i>B<\/i> and <i>A<\/i><i>C<\/i> on the figure before you set up any proportion.<\/div>"}, {"lo": "LO3", "h": "Crossed segments: hourglass figures", "html": "<p>When segments <i>A<\/i><i>E<\/i> and <i>B<\/i><i>D<\/i> cross at <i>C<\/i> and <i>A<\/i><i>B<\/i> ∥ <i>D<\/i><i>E<\/i>, two triangles meet at <i>C<\/i> like an hourglass. The vertical angles at <i>C<\/i> are equal, and the alternate interior angles give ∠<i>A<\/i> = ∠<i>E<\/i> and ∠<i>B<\/i> = ∠<i>D<\/i>. So △<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>E<\/i><i>D<\/i><i>C<\/i>.<\/p><div class=\"rule\">In an hourglass figure, a side of one triangle matches the side of the other triangle that lies on the same line through <i>C<\/i>: <i>A<\/i><i>C<\/i> matches <i>E<\/i><i>C<\/i>, and <i>B<\/i><i>C<\/i> matches <i>D<\/i><i>C<\/i>.<\/div><p>For example, if <i>A<\/i><i>C<\/i> = 4, <i>C<\/i><i>E<\/i> = 10 and <i>A<\/i><i>B<\/i> = 6, the scale factor from <i>A<\/i><i>B<\/i><i>C<\/i> to <i>E<\/i><i>D<\/i><i>C<\/i> is <span class=\"fq\"><span>10<\/span><span>4<\/span><\/span> = 2.5, so <i>D<\/i><i>E<\/i> = 2.5 × 6 = 15.<\/p><p>The same picture appears when the diagonals of a trapezoid cross. The two parallel bases are the matching sides of an hourglass, so each diagonal is split in the same ratio as the lengths of the bases.<\/p>"}, {"lo": "LO4", "h": "Similar right triangles and shadows", "html": "<p>Two right triangles are similar as soon as one pair of acute angles is equal, because the right angles already match. Many real-world problems use this fact.<\/p><ul><li><b>Shadows:<\/b> at the same moment, the sun’s rays meet level ground at the same angle everywhere. An upright object and its shadow form a right triangle, so the ratio of height to shadow length is the same for every object.<\/li><li><b>Lampposts:<\/b> the light comes from one point, so the person and the lamppost form nested right triangles. The base of the lamppost’s triangle runs from the lamppost to the <b>tip of the shadow<\/b>.<\/li><li><b>Mirrors and sight lines:<\/b> equal angles at a mirror, or a line of sight that passes over the top of an object, create similar right triangles.<\/li><\/ul><div class=\"rule\">Match height with height and ground length with ground length: <span class=\"fq\"><span>height 1<\/span><span>shadow 1<\/span><\/span> = <span class=\"fq\"><span>height 2<\/span><span>shadow 2<\/span><\/span>.<\/div>"}, {"lo": "LO4", "h": "The altitude to the hypotenuse", "html": "<p>Draw the altitude <i>C<\/i><i>D<\/i> from the right angle <i>C<\/i> of right triangle <i>A<\/i><i>B<\/i><i>C<\/i> to the hypotenuse <i>A<\/i><i>B<\/i>. It splits the triangle into two smaller right triangles, and all three triangles are similar: △<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>A<\/i><i>C<\/i><i>D<\/i> ∼ △<i>C<\/i><i>B<\/i><i>D<\/i>.<\/p><div class=\"rule\">Each small triangle shares one acute angle with the large triangle, so AA applies. Match the right angles first, then the shared angle.<\/div><p>Writing proportions from these triangles gives two useful results:<\/p><div class=\"eqs\"><i>C<\/i><i>D<\/i><sup>2<\/sup> = <i>A<\/i><i>D<\/i> · <i>D<\/i><i>B<\/i><br><i>A<\/i><i>C<\/i><sup>2<\/sup> = <i>A<\/i><i>D<\/i> · <i>A<\/i><i>B<\/i> &nbsp;and&nbsp; <i>B<\/i><i>C<\/i><sup>2<\/sup> = <i>D<\/i><i>B<\/i> · <i>A<\/i><i>B<\/i><\/div><p>For example, if <i>A<\/i><i>D<\/i> = 2 and <i>D<\/i><i>B<\/i> = 8, then <i>C<\/i><i>D<\/i><sup>2<\/sup> = 16, so <i>C<\/i><i>D<\/i> = 4. You do not have to memorize these results: you can always write the proportion from matching sides, such as <span class=\"fq\"><span><i>A<\/i><i>D<\/i><\/span><span><i>C<\/i><i>D<\/i><\/span><\/span> = <span class=\"fq\"><span><i>C<\/i><i>D<\/i><\/span><span><i>D<\/i><i>B<\/i><\/span><\/span>.<\/p>"}, {"lo": "LO5", "h": "Perimeters scale by the same factor", "html": "<p>If every side of a triangle is multiplied by <i>k<\/i>, the perimeter is multiplied by <i>k<\/i> too: <i>k<\/i><i>a<\/i> + <i>k<\/i><i>b<\/i> + <i>k<\/i><i>c<\/i> = <i>k<\/i>(<i>a<\/i> + <i>b<\/i> + <i>c<\/i>). The same is true for any pair of matching lengths, such as corresponding altitudes.<\/p><div class=\"rule\">For similar triangles, <span class=\"fq\"><span>perimeter 2<\/span><span>perimeter 1<\/span><\/span> = <span class=\"fq\"><span>side 2<\/span><span>side 1<\/span><\/span> = <i>k<\/i>, the scale factor.<\/div><p>For example, a triangle with sides 3, 5 and 7 has perimeter 15. A similar triangle whose shortest side is 6 has scale factor <span class=\"fq\"><span>6<\/span><span>3<\/span><\/span> = 2, so its perimeter is 2 × 15 = 30.<\/p><p>You can also work backward from perimeters. If two similar triangles have perimeters 20 and 50, the scale factor is 2.5, and a side of 8 in the smaller triangle matches a side of 20 in the larger one.<\/p><div class=\"tip\">Area works differently: areas of similar figures scale by <i>k<\/i><sup>2<\/sup>. Never square the scale factor for a perimeter.<\/div>"}], "examples": [{"lo": "LO1", "q": "In the figure, △<i>A<\/i><i>B<\/i><i>C<\/i> has a right angle at <i>C<\/i>. Point <i>D<\/i> lies on <i>A<\/i><i>B<\/i>, point <i>E<\/i> lies on <i>B<\/i><i>C<\/i>, and <i>D<\/i><i>E<\/i> ⊥ <i>A<\/i><i>B<\/i>. Which triangle in the figure is similar to △<i>A<\/i><i>B<\/i><i>C<\/i>? Write the similarity statement with the vertices in matching order.<svg class=\"fig\" viewBox=\"0 0 260 180\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C. Point D is on hypotenuse AB and point E is on leg BC. Segment DE is perpendicular to AB, with a right-angle mark at D, forming a smaller right triangle EBD that shares angle B with triangle ABC.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26,30.57 234,149.43 26,149.43\"/><line class=\"fg-edge\" x1=\"144.4\" y1=\"98.23\" x2=\"115.14\" y2=\"149.43\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"26,141.43 34,141.43 34,149.43\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"140.43,105.17 147.38,109.14 151.35,102.2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"26\" cy=\"30.57\" r=\"3\"/><circle cx=\"234\" cy=\"149.43\" r=\"3\"/><circle cx=\"26\" cy=\"149.43\" r=\"3\"/><circle cx=\"144.4\" cy=\"98.23\" r=\"3\"/><circle cx=\"115.14\" cy=\"149.43\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"13.55\" y=\"31.34\" text-anchor=\"middle\">A<\/text><text x=\"246.45\" y=\"157.66\" text-anchor=\"middle\">B<\/text><text x=\"14.85\" y=\"160.62\" text-anchor=\"middle\">C<\/text><text x=\"150.21\" y=\"91.1\" text-anchor=\"middle\">D<\/text><text x=\"115.14\" y=\"166.93\" text-anchor=\"middle\">E<\/text><\/g><\/svg>", "steps": ["Look for a smaller triangle that shares an angle with △<i>A<\/i><i>B<\/i><i>C<\/i>: triangle <i>E<\/i><i>B<\/i><i>D<\/i> shares ∠<i>B<\/i>.", "∠<i>A<\/i><i>C<\/i><i>B<\/i> = 90° and ∠<i>E<\/i><i>D<\/i><i>B<\/i> = 90°, so the triangles have two pairs of equal angles: ∠<i>B<\/i> and the right angles. By AA, they are similar.", "Match the vertices: <i>B<\/i> matches <i>B<\/i>, the right angle at <i>C<\/i> matches the right angle at <i>D<\/i>, and the remaining vertex <i>A<\/i> matches <i>E<\/i>."], "ans": "△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>E<\/i><i>B<\/i><i>D<\/i>"}, {"lo": "LO2", "q": "△<i>P<\/i><i>Q<\/i><i>R<\/i> ∼ △<i>S<\/i><i>T<\/i><i>U<\/i>, with <i>P<\/i><i>Q<\/i> = 6, <i>Q<\/i><i>R<\/i> = 9 and <i>S<\/i><i>T<\/i> = 10. What is the length of <i>T<\/i><i>U<\/i>?", "steps": ["From the order of the letters, <i>P<\/i><i>Q<\/i> matches <i>S<\/i><i>T<\/i> and <i>Q<\/i><i>R<\/i> matches <i>T<\/i><i>U<\/i>.", "Scale factor from <i>P<\/i><i>Q<\/i><i>R<\/i> to <i>S<\/i><i>T<\/i><i>U<\/i>: <span class=\"fq\"><span>10<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>.", "<i>T<\/i><i>U<\/i> = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span> × 9 = 15."], "ans": "<i>T<\/i><i>U<\/i> = 15"}, {"lo": "LO3", "q": "In the figure, <i>D<\/i><i>E<\/i> ∥ <i>B<\/i><i>C<\/i>, <i>A<\/i><i>D<\/i> = 4, <i>D<\/i><i>E<\/i> = 6 and <i>B<\/i><i>C<\/i> = 15. What is the length of <i>D<\/i><i>B<\/i>?<svg class=\"fig\" viewBox=\"0 0 270 200\" role=\"img\" aria-label=\"Triangle ABC with point D on side AB and point E on side AC, and segment DE parallel to BC. AD is labeled 4, DE is labeled 6 and BC is labeled 15.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"113.68,42.05 26,157.95 244,157.95\"/><line class=\"fg-edge\" x1=\"78.61\" y1=\"88.41\" x2=\"165.81\" y2=\"88.41\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"113.68\" cy=\"42.05\" r=\"3\"/><circle cx=\"26\" cy=\"157.95\" r=\"3\"/><circle cx=\"244\" cy=\"157.95\" r=\"3\"/><circle cx=\"78.61\" cy=\"88.41\" r=\"3\"/><circle cx=\"165.81\" cy=\"88.41\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"111.33\" y=\"33.76\" text-anchor=\"middle\">A<\/text><text x=\"13.84\" y=\"167.06\" text-anchor=\"middle\">B<\/text><text x=\"256.34\" y=\"166.56\" text-anchor=\"middle\">C<\/text><text x=\"65.86\" y=\"90.36\" text-anchor=\"middle\">D<\/text><text x=\"178.56\" y=\"90.36\" text-anchor=\"middle\">E<\/text><text x=\"86.58\" y=\"62.49\" text-anchor=\"middle\">4<\/text><text x=\"122.21\" y=\"83.91\" text-anchor=\"middle\">6<\/text><text x=\"135\" y=\"174.45\" text-anchor=\"middle\">15<\/text><\/g><\/svg>", "steps": ["Because <i>D<\/i><i>E<\/i> ∥ <i>B<\/i><i>C<\/i>, ∠<i>A<\/i><i>D<\/i><i>E<\/i> = ∠<i>A<\/i><i>B<\/i><i>C<\/i> and ∠<i>A<\/i> is shared, so △<i>A<\/i><i>D<\/i><i>E<\/i> ∼ △<i>A<\/i><i>B<\/i><i>C<\/i> by AA.", "Scale factor from <i>A<\/i><i>D<\/i><i>E<\/i> to <i>A<\/i><i>B<\/i><i>C<\/i>: <span class=\"fq\"><span>15<\/span><span>6<\/span><\/span> = 2.5.", "The whole side is <i>A<\/i><i>B<\/i> = 2.5 × 4 = 10, so <i>D<\/i><i>B<\/i> = <i>A<\/i><i>B<\/i> − <i>A<\/i><i>D<\/i> = 10 − 4 = 6."], "ans": "<i>D<\/i><i>B<\/i> = 6"}, {"lo": "LO4", "q": "At 3:00 in the afternoon, a student who is 1.8 meters tall casts a shadow 2.4 meters long. At the same time, a tree nearby casts a shadow 14 meters long. What is the height of the tree, in meters?", "steps": ["The sun’s rays meet the ground at the same angle for the student and the tree, so the two right triangles formed by each height and its shadow are similar.", "Match height to shadow in both triangles: <span class=\"fq\"><span><i>h<\/i><\/span><span>14<\/span><\/span> = <span class=\"fq\"><span>1.8<\/span><span>2.4<\/span><\/span>.", "<span class=\"fq\"><span>1.8<\/span><span>2.4<\/span><\/span> = 0.75, so <i>h<\/i> = 14 × 0.75 = 10.5."], "ans": "10.5 meters"}, {"lo": "LO4", "q": "In the figure, triangle <i>A<\/i><i>B<\/i><i>C<\/i> has a right angle at <i>C<\/i>, and <i>C<\/i><i>D<\/i> is the altitude to hypotenuse <i>A<\/i><i>B<\/i>. If <i>A<\/i><i>D<\/i> = 4 and <i>D<\/i><i>B<\/i> = 9, what is the length of <i>C<\/i><i>D<\/i>?<svg class=\"fig\" viewBox=\"0 0 270 170\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C and hypotenuse AB along the bottom. A dashed altitude from C meets AB at D with a right-angle mark. AD is labeled 4 and DB is labeled 9.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26,135.31 244,135.31 93.08,34.69\"/><line class=\"fg-edge\" x1=\"93.08\" y1=\"34.69\" x2=\"93.08\" y2=\"135.31\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"88.64,41.35 95.3,45.79 99.73,39.13\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"101.08,135  10"}], "traps": ["Matching sides by how the figure looks instead of by the similarity statement. In △<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>E<\/i><i>D<\/i><i>C<\/i>, side <i>A<\/i><i>B<\/i> matches <i>E<\/i><i>D<\/i>, even when the triangles are drawn turned or flipped.", "In nested triangles, using the piece <i>D<\/i><i>B<\/i> instead of the whole side <i>A<\/i><i>B<\/i>. The small triangle <i>A<\/i><i>D<\/i><i>E<\/i> matches the whole triangle <i>A<\/i><i>B<\/i><i>C<\/i>, so compare <i>A<\/i><i>D<\/i> with <i>A<\/i><i>B<\/i> = <i>A<\/i><i>D<\/i> + <i>D<\/i><i>B<\/i>.", "Adding instead of multiplying. If one side grows from 4 to 10, every side is multiplied by 2.5; the sides do not each grow by 6.", "Flipping the scale factor. Decide which triangle you start from, and keep every ratio in the same order, such as new over original.", "In lamppost problems, using only the distance from the lamppost to the person as the base of the large triangle. That base runs from the lamppost all the way to the tip of the shadow.", "Squaring the scale factor for a perimeter. Perimeters and all other lengths scale by <i>k<\/i>; only areas scale by <i>k<\/i><sup>2<\/sup>."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "In △<i>A<\/i><i>B<\/i><i>C<\/i>, ∠<i>A<\/i> = 50° and ∠<i>B<\/i> = 70°. In △<i>D<\/i><i>E<\/i><i>F<\/i>, ∠<i>D<\/i> = 50° and ∠<i>F<\/i> = 60°. Which of the following is true?", "opts": ["△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>F<\/i><i>E<\/i>", "△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>E<\/i><i>F<\/i>", "△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>F<\/i><i>E<\/i><i>D<\/i>", "The triangles are not similar."], "ans": 1, "sol": "∠<i>C<\/i> = 180° − 50° − 70° = 60°, and ∠<i>E<\/i> = 180° − 50° − 60° = 70°.<br>So <i>A<\/i> matches <i>D<\/i> (50°), <i>B<\/i> matches <i>E<\/i> (70°) and <i>C<\/i> matches <i>F<\/i> (60°).<br>Answer: <b>△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>E<\/i><i>F<\/i><\/b>", "hint": "Find the missing angle of each triangle first, then pair u n><\/span> = 1.25 centimeters of drawing per meter of garden.<br>Shortest side: 12 × 1.25 = 15 centimeters.<br>Answer: <b>15<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>P<\/i><i>Q<\/i><i>R<\/i>, with <i>A<\/i><i>B<\/i> = 6, <i>B<\/i><i>C<\/i> = <i>x<\/i>, <i>P<\/i><i>Q<\/i> = 9 and <i>Q<\/i><i>R<\/i> = <i>x<\/i> + 4. What is the value of <i>x<\/i>?", "opts": ["<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>8<\/span><span>3<\/span><\/span>", "8", "12"], "ans": 2, "sol": "<span class=\"fq\"><span><i>x<\/i><\/span><span><i>x<\/i> + 4<\/span><\/span> = <span class=\"fq\"><span>6<\/span><span>9<\/span><\/span>, so 9<i>x<\/i> = 6(<i>x<\/i> + 4) = 6<i>x<\/i> + 24.<br>3<i>x<\/i> = 24, so <i>x<\/i> = 8.<br>Answer: <b>8<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A straight ramp rises 1.2 meters over a horizontal distance of 4.8 meters. A vertical support post stands under the ramp, 1.8 meters horizontally from the bottom end of the ramp, and reaches from the ground up to the ramp. How tall, in meters, is the support post?", "opts": ["0.45", "0.75", "3.0", "7.2"], "ans": 0, "sol": "The post is parallel to the vertical rise, so the small right triangle at the bottom end is similar to the whole ramp triangle.<br><span class=\"fq\"><span><i>h<\/i><\/span><span>1.8<\/span><\/span> = <span class=\"fq\"><span>1.2<\/span><span>4.8<\/span><\/span> = 0.25, so <i>h<\/i> = 0.45.<br>Answer: <b>0.45<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "In the figure, triangle <i>A<\/i><i>B<\/i><i>C<\/i> has a right angle at <i>C<\/i>, and <i>C<\/i><i>D<\/i> ⊥ <i>A<\/i><i>B<\/i>. If <i>A<\/i><i>D<\/i> = 5 and <i>D<\/i><i>B<\/i> = 15, what is the length of <i>A<\/i><i>C<\/i>?<svg class=\"fig\" viewBox=\"0 0 290 170\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C and hypotenuse AB along the bottom. A dashed segment from C is perpendicular to AB at D, with a right-angle pan class=\"fq\"><span>10<\/span><span>4<\/span><\/span> = 2.5.<br>The first perimeter is 4 + 5 + 6 = 15, so the new perimeter is 2.5 × 15 = 37.5.<br>Answer: <b>37.5<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "In △<i>A<\/i><i>B<\/i><i>C<\/i> and △<i>D<\/i><i>E<\/i><i>F<\/i>, ∠<i>A<\/i> = ∠<i>D<\/i> = 40°. Which of the following additional facts is enough to conclude that △<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>E<\/i><i>F<\/i>?", "opts": ["∠<i>B<\/i> = 65° and ∠<i>E<\/i> = 75°", "∠<i>C<\/i> = 65° and ∠<i>E<\/i> = 65°", "∠<i>B<\/i> = 65° and ∠<i>F<\/i> = 75°", "∠<i>B<\/i> = 80° and ∠<i>F<\/i> = 70°"], "ans": 2, "sol": "The statement △<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>E<\/i><i>F<\/i> needs ∠<i>B<\/i> = ∠<i>E<\/i> and ∠<i>C<\/i> = ∠<i>F<\/i>.<br>If ∠<i>B<\/i> = 65° and ∠<i>F<\/i> = 75°, then ∠<i>C<\/i> = 180° − 40° − 65° = 75° and ∠<i>E<\/i> = 180° − 40° − 75° = 65°.<br>So ∠<i>B<\/i> = ∠<i>E<\/i> and ∠<i>C<\/i> = ∠<i>F<\/i>.<br>Answer: <b>∠<i>B<\/i> = 65° and ∠<i>F<\/i> = 75°<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A designer’s drawing of a triangular logo is similar to the actual logo, and each length on the drawing is 0.4 times the matching length on the logo. A side of the drawing is 6 centimeters long. How long, in centimeters, is the matching side of the actual logo?", "opts": ["2.4", "6.4", "9", "15"], "ans": 3, "sol": "Drawing length = 0.4 × logo length, so 6 = 0.4<i>L<\/i>.<br><i>L<\/i> = <span class=\"fq\"><span>6<\/span><span>0.4<\/span><\/span> = 15.<br>Answer: <b>15<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "In the figure, segments <i>A<\/i><i>E<\/i> and <i>B<\/i><i>D<\/i> intersect at <i>C<\/i>, and <i>A<\/i><i>B<\/i> ∥ <i>D<\/i><i>E<\/i>. What is the length of <i>C<\/i><i>D<\/i>?<svg class=\"fig\" viewBox=\"0 0 290 230\" role=\"img\" aria-label=\"Segments AE and BD intersect at point C, forming triangle ABC and triangle EDC on opposite sides of C, with AB parallel to DE. AC is labeled 4, BC is labeled 5, CE is labeled x and CD is labeled x + 2.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"100.15,26 32.87,85.33 107.62,85.33\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"107.62,85.33 257.13,85.33 122.57,204\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"100.15\" cy=\"26\" r=\"3\"/><circle cx=\"32.87\" cy=\"85.33\" r=\"3\"/><circle cx=\"257.13\" cy=\"85.33\" r=\"3\"/><circle cx=\"122.57\" cy=\"204\" r=\"3\"/><circle cx=\"107.62\" cy=\"85.33\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"106\" y=\"18.89\" text-anchor=\"middle\">A<\/text><text x=\"20.88\" y=\"94.84\" text-anchor=\"middle\">B<\/text><text x=\"269.12\" y=\"84.82\" text-anchor=\"middle\">D<\/text><text x=\"116.72\" y=\"220.11\" text-anchor=\"middle\">E<\/text><text x=\"119.89\" y=\"96.58\" text-anchor=\"middle\">C<\/text><text x=\"115.79\" y=\"58.67\" text-anchor=\"middle\">4<\/text><text x=\"70.25\" y=\"101.83\" text-anchor=\"middle\">5<\/text><text x=\"103.19\" y=\"150.67\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan><\/text><text x=\"182.38\" y=\"73.83\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan> + 2<\/text><\/g><\/svg>", "opts": ["6.4", "8", "10", "12"], "ans": 2, "sol": "△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>E<\/i><i>D<\/i><i>C<\/i>, with <i>A<\/i><i>C<\/i> matching <i>E<\/i><i>C<\/i> and <i>B<\/i><i>C<\/i> matching <i>D<\/i><i>C<\/i>.<br><span class=\"fq\"><span>4<\/span><span><i>x<\/i><\/span><\/span> = <span class=\"fq\"><span>5<\/span><span><i>x<\/i> + 2<\/span><\/span>, so 4<i>x<\/i> + 8 = 5<i>x<\/i> and <i>x<\/i> = 8.<br><i>C<\/i><i>D<\/i> = <i>x<\/i> + 2 = 10.<br>Answer: <b>10<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A surveyor wants to find the distance across a river from point <i>A<\/i> to point <i>B<\/i>. Points <i>B<\/i>, <i>C<\/i> and <i>D<\/i> lie on a straight line along one bank, with <i>A<\/i><i>B<\/i> ⊥ <i>B<\/i><i>D<\/i> and <i>C<\/i> between <i>B<\/i> and <i>D<\/i>. From <i>D<\/i> she walks perpendicular to <i>B<\/i><i>D<\/i>, away from the river, to point <i>E<\/i>, chosen so that <i>A<\/i>, <i>C<\/i> and <i>E<\/i> lie on a straight line. If <i>B<\/i><i>C<\/i> = 40 meters, <i>C<\/i><i>D<\/i> = 10 meters and <i>D<\/i><i>E<\/i> = 6 meters, what is <i>A<\/i><i>B<\/i>, in meters?", "opts": ["1.5", "24", "56", "<span class=\"fq\"><span>200<\/span><span>3<\/span><\/span>"], "ans": 1, "sol": "The vertical angles at <i>C<\/i> are equal, and the angles at <i>B<\/i> and <i>D<\/i> are right angles, so △<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>E<\/i><i>D<\/i><i>C<\/i>.<br><span class=\"fq\"><span><i>A<\/i><i>B<\/i><\/span><span>40<\/span><\/span> = <span class=\"fq\"><span>6<\/span><span>10<\/span><\/span>, so <i>A<\/i><i>B<\/i> = 24.<br>Answer: <b>24<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>E<\/i><i>F<\/i>. The perimeter of △<i>A<\/i><i>B<\/i><i>C<\/i> is 36, and the perimeter of △<i>D<\/i><i>E<\/i><i>F<\/i> is 48. If <i>A<\/i><i>B<\/i> = 2<i>x<\/i> + 1 and <i>D<\/i><i>E<\/i> = 3<i>x<\/i> − 1, what is the value of <i>x<\/i>?", "ans": ["7"], "sol": "The ratio of the perimeters is <span class=\"fq\"><span>36<\/span><span>48<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>, so <span class=\"fq\"><span>2<i>x<\/i> + 1<\/span><span>3<i>x<\/i> − 1<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>.<br>4(2<i>x<\/i> + 1) = 3(3<i>x<\/i> − 1), so 8<i>x<\/i> + 4 = 9<i>x<\/i> − 3.<br><i>x<\/i> = 7.<br>Answer: <b>7<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>E<\/i><i>F<\/i>, with <i>A<\/i><i>B<\/i> = 6, <i>B<\/i><i>C<\/i> = 9 and <i>A<\/i><i>C<\/i> = 12. In △<i>D<\/i><i>E<\/i><i>F<\/i>, the longest side is 10 units longer than the shortest side. What is the length of <i>E<\/i><i>F<\/i>?", "opts": ["10", "15", "19", "20"], "ans": 1, "sol": "The sides of △<i>D<\/i><i>E<\/i><i>F<\/i> are 6<i>k<\/i>, 9<i>k<\/i> and 12<i>k<\/i>.<br>12<i>k<\/i> − 6<i>k<\/i> = 10, so <i>k<\/i> = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>.<br><i>E<\/i><i>F<\/i> matches <i>B<\/i><i>C<\/i>: <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span> × 9 = 15.<br>Answer: <b>15<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "In right triangle <i>P<\/i><i>Q<\/i><i>R<\/i>, the right angle is at <i>R<\/i>, and <i>R<\/i><i>S<\/i> is the altitude from <i>R<\/i> to hypotenuse <i>P<\/i><i>Q<\/i>. If <i>R<\/i><i>S<\/i> = 12 and <i>P<\/i><i>S<\/i> = 9, what is the length of <i>P<\/i><i>Q<\/i>?", "ans": ["25"], "sol": "The two small triangles are similar, so <span class=\"fq\"><span><i>P<\/i><i>S<\/i><\/span><span><i>R<\/i><i>S<\/i><\/span><\/span> = <span class=\"fq\"><span><i>R<\/i><i>S<\/i><\/span><span><i>S<\/i><i>Q<\/i><\/span><\/span>.<br><i>S<\/i><i>Q<\/i> = <span class=\"fq\"><span>144<\/span><span>9<\/span><\/span> = 16.<br><i>P<\/i><i>Q<\/i> = 9 + 16 = 25.<br>Answer: <b>25<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "In △<i>A<\/i><i>B<\/i><i>C<\/i>, point <i>D<\/i> lies on <i>A<\/i><i>B<\/i> and point <i>E<\/i> lies on <i>A<\/i><i>C<\/i>, and ∠<i>A<\/i><i>D<\/i><i>E<\/i> = ∠<i>A<\/i><i>C<\/i><i>B<\/i>. Segment <i>D<\/i><i>E<\/i> is not parallel to <i>B<\/i><i>C<\/i>. Which of the following must be true?", "opts": ["△<i>A<\/i><i>D<\/i><i>E<\/i> ∼ △<i>A<\/i><i>C<\/i><i>B<\/i>", "△<i>A<\/i><i>D<\/i><i>E<\/i> ∼ △<i>A<\/i><i>B<\/i><i>C<\/i>", "△<i>A<\/i><i>E<\/i><i>D<\/i> ∼ △<i>A<\/i><i>C<\/i><i>B<\/i>", "△<i>A<\/i><i>D<\/i><i>E<\/i> ∼ △<i>C<\/i><i>B<\/i><i>A<\/i>"], "ans": 0, "sol": "The two triangles share ∠<i>A<\/i>, and ∠<i>A<\/i><i>D<\/i><i>E<\/i> = ∠<i>A<\/i><i>C<\/i><i>B<\/i>, so they are similar by AA.<br><i>A<\/i> matches <i>A<\/i> and <i>D<\/i> matches <i>C<\/i>, so the remaining vertex <i>E<\/i> matches <i>B<\/i>.<br>Answer: <b>△<i>A<\/i><i>D<\/i><i>E<\/i> ∼ △<i>A<\/i><i>C<\/i><i>B<\/i><\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "△<i>K<\/i><i>L<\/i><i>M<\/i> ∼ △<i>R<\/i><i>S<\/i><i>T<\/i>, with <i>K<\/i><i>L<\/i> = 9, <i>L<\/i><i>M<\/i> = 12, <i>R<\/i><i>S<\/i> = 6 and <i>R<\/i><i>T<\/i> = 10. What is the length of <i>K<\/i><i>M<\/i>?", "ans": ["15"], "sol": "<i>K<\/i><i>L<\/i> matches <i>R<\/i><i>S<\/i>, so the scale factor from <i>R<\/i><i>S<\/i><i>T<\/i> to <i>K<\/i><i>L<\/i><i>M<\/i> is <span class=\"fq\"><span>9<\/span><span>6<\/span><\/span> = 1.5.<br><i>K<\/i><i>M<\/i> matches <i>R<\/i><i>T<\/i>: <i>K<\/i><i>M<\/i> = 1.5 × 10 = 15.<br>Answer: <b>15<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A triangular roof truss has a bottom beam <i>B<\/i><i>C<\/i> that is 11.4 meters long. A horizontal brace <i>D<\/i><i>E<\/i>, parallel to <i>B<\/i><i>C<\/i>, joins the midpoints <i>D<\/i> and <i>E<\/i> of the two sloping sides <i>A<\/i><i>B<\/i> and <i>A<\/i><i>C<\/i>. How long, in meters, is the brace?", "opts": ["5.7", "7.6", "11.4", "22.8"], "ans": 0, "sol": "Because <i>D<\/i><i>E<\/i> ∥ <i>B<\/i><i>C<\/i> and ∠<i>A<\/i> is shared, △<i>A<\/i><i>D<\/i><i>E<\/i> ∼ △<i>A<\/i><i>B<\/i><i>C<\/i> by AA. Since <i>D<\/i> is the midpoint of <i>A<\/i><i>B<\/i>, <i>A<\/i><i>D<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>A<\/i><i>B<\/i>, so the scale factor is <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>.<br><i>D<\/i><i>E<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> × 11.4 = 5.7.<br>Answer: <b>5.7<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Arjun holds a ruler 30 centimeters long upright at arm’s length, 60 centimeters from his eye. The ruler exactly covers a flagpole that is 40 meters from his eye. If the ruler and the flagpole are parallel, how tall, in meters, is the flagpole?", "opts": ["12", "20", "70", "80"], "ans": 1, "sol": "The sight lines form two similar triangles with a common vertex at his eye.<br><span class=\"fq\"><span><i>h<\/i><\/span><span>40<\/span><\/span> = <span class=\"fq\"><span>30<\/span><span>60<\/span><\/span> = 0.5, so <i>h<\/i> = 20.<br>Answer: <b>20<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Two similar triangles have corresponding altitudes of length 6 and 10. The perimeter of the smaller triangle is 27. What is the perimeter of the larger triangle?", "opts": ["16.2", "31", "45", "75"], "ans": 2, "sol": "Corresponding altitudes scale by the scale factor, so <i>k<\/i> = <span class=\"fq\"><span>10<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>.<br>Larger perimeter: 27 × <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span> = 45.<br>Answer: <b>45<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which of the following pairs of triangles must be similar?", "opts": ["Two isosceles triangles", "Two triangles that each have a 70° angle", "Two right triangles that each have a leg of length 5", "Two right triangles that each have a 40° angle"], "ans": 3, "sol": "Each right triangle with a 40° angle has angles 90°, 40° and 50°, so AA applies.<br>The other pairs can have different angles, such as isosceles triangles with vertex angles 20° and 100°.<br>Answer: <b>Two right triangles that each have a 40° angle<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>D<\/i><i>E<\/i><i>F<\/i> with <i>D<\/i><i>E<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>A<\/i><i>B<\/i>, and △<i>D<\/i><i>E<\/i><i>F<\/i> ∼ △<i>G<\/i><i>H<\/i><i>I<\/i> with <i>G<\/i><i>H<\/i> = <span class=\"fq\"><span>4<\/span><span>5<\/span><\/span><i>D<\/i><i>E<\/i>. If <i>A<\/i><i>B<\/i> = 10, what is the length of <i>G<\/i><i>H<\/i>?", "opts": ["<span class=\"fq\"><span>16<\/span><span>3<\/span><\/span>", "12", "15", "18.75"], "ans": 1, "sol": "<i>D<\/i><i>E<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> × 10 = 15.<br><i>G<\/i><i>H<\/i> = <span class=\"fq\"><span>4<\/span><span>5<\/span><\/span> × 15 = 12.<br>Answer: <b>12<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "In the figure, point <i>D<\/i> lies on <i>A<\/i><i>B<\/i>, point <i>E<\/i> lies on <i>A<\/i><i>C<\/i>, and ∠<i>A<\/i><i>E<\/i><i>D<\/i> = ∠<i>A<\/i><i>B<\/i><i>C<\/i>. What is the length of <i>E<\/i><i>C<\/i>?<svg class=\"fig\" viewBox=\"0 0 240 250\" role=\"img\" aria-label=\"Triangle ABC with point D on side AB and point E on side AC, joined by segment DE, which is not parallel to BC. AD is labeled 5, DB is labeled 5 and AE is labeled 4.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26,221.25 214,221.25 160.79,28.75\"/><line class=\"fg-edge\" x1=\"120\" y1=\"221.25\" x2=\"69.13\" y2=\"159.65\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"26\" cy=\"221.25\" r=\"3\"/><circle cx=\"214\" cy=\"221.25\" r=\"3\"/><circle cx=\"160.79\" cy=\"28.75\" r=\"3\"/><circle cx=\"120\" cy=\"221.25\" r=\"3\"/><circle cx=\"69.13\" cy=\"159.65\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"14.83\" y=\"232.41\" text-anchor=\"middle\">A<\/text><text x=\"224.16\" y=\"233.86\" text-anchor=\"middle\">B<\/text><text x=\"163.49\" y=\"20.53\" text-anchor=\"middle\">C<\/text><text x=\"120\" y=\"238.75\" text-anchor=\"middle\">D<\/text><text x=\"56.2\" y=\"165.44\" text-anchor=\"middle\">E<\/text><text x=\"73\" y=\"237.75\" text-anchor=\"middle\">5<\/text><text x=\"167\" y=\"237.75\" text-anchor=\"middle\">5<\/text><text x=\"37.74\" y=\"188.07\" text-anchor=\"middle\">4<\/text><\/g><\/svg>", "ans": ["8.5", "17/2"], "sol": "△<i>A<\/i><i>E<\/i><i>D<\/i> ∼ △<i>A<\/i><i>B<\/i><i>C<\/i> by AA: ∠<i>A<\/i> is shared and ∠<i>A<\/i><i>E<\/i><i>D<\/i> = ∠<i>A<\/i><i>B<\/i><i>C<\/i>. So <i>A<\/i><i>E<\/i> matches <i>A<\/i><i>B<\/i> and <i>A<\/i><i>D<\/i> matches <i>A<\/i><i>C<\/i>.<br><span class=\"fq\"><span><i>A<\/i><i>E<\/i><\/span><span><i>A<\/i><i>B<\/i><\/span><\/span> = <span class=\"fq\"><span><i>A<\/i><i>D<\/i><\/span><span><i>A<\/i><i>C<\/i><\/span><\/span>: <span class=\"fq\"><span>4<\/span><span>10<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span><i>A<\/i><i>C<\/i><\/span><\/span>, so <i>A<\/i><i>C<\/i> = 12.5.<br><i>E<\/i><i>C<\/i> = 12.5 − 4 = 8.5.<br>Answer: <b>8.5<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A person 1.6 meters tall stands on level ground 4 meters from the base of a lamppost. The person’s shadow, cast by the lamp, is 2 meters long. How tall, in meters, is the lamppost?", "opts": ["3.2", "3.6", "4.8", "9.6"], "ans": 2, "sol": "The large right triangle runs from the lamppost to the tip of the shadow, so its base is 4 + 2 = 6.<br><span class=\"fq\"><span><i>h<\/i><\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>1.6<\/span><span>2<\/span><\/span>, so <i>h<\/i> = 4.8.<br>Answer: <b>4.8<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Segments <i>A<\/i><i>E<\/i> and <i>B<\/i><i>D<\/i> intersect at point <i>C<\/i>, and <i>A<\/i><i>B<\/i> ∥ <i>D<\/i><i>E<\/i>. If <i>A<\/i><i>C<\/i> = 6, <i>C<\/i><i>E<\/i> = 9 and the perimeter of △<i>A<\/i><i>B<\/i><i>C<\/i> is 20, what is the perimeter of △<i>C<\/i><i>D<\/i><i>E<\/i>?", "opts": ["<span class=\"fq\"><span>40<\/span><span>3<\/span><\/span>", "23", "30", "45"], "ans": 2, "sol": "△<i>A<\/i><i>B<\/i><i>C<\/i> ∼ △<i>E<\/i><i>D<\/i><i>C<\/i>, and <i>A<\/i><i>C<\/i> matches <i>E<\/i><i>C<\/i>, so the scale factor is <span class=\"fq\"><span>9<\/span><span>6<\/span><\/span> = 1.5.<br>Perimeter of △<i>C<\/i><i>D<\/i><i>E<\/i> = 1.5 × 20 = 30.<br>Answer: <b>30<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "In △<i>A<\/i><i>B<\/i><i>C<\/i>, ∠<i>A<\/i><i>C<\/i><i>B<\/i> = 90°, and point <i>D<\/i> lies on <i>A<\/i><i>B<\/i> with <i>C<\/i><i>D<\/i> ⊥ <i>A<\/i><i>B<\/i>. Including △<i>A<\/i><i>B<\/i><i>C<\/i> itself, how many triangles in this figure are similar to △<i>A<\/i><i>B<\/i><i>C<\/i>?", "opts": ["1", "2", "3", "4"], "ans": 2, "sol": "The figure contains three triangles: <i>A<\/i><i>B<\/i><i>C<\/i>, <i>A<\/i><i>C<\/i><i>D<\/i> and <i>C<\/i><i>B<\/i><i>D<\/i>.<br>△<i>A<\/i><i>C<\/i><i>D<\/i> shares ∠<i>A<\/i> with △<i>A<\/i><i>B<\/i><i>C<\/i>, and △<i>C<\/i><i>B<\/i><i>D<\/i> shares ∠<i>B<\/i>; each has a right angle, so both are similar to △<i>A<\/i><i>B<\/i><i>C<\/i>.<br>With △<i>A<\/i><i>B<\/i><i>C<\/i> itself, that makes 3.<br>Answer: <b>3<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "In the figure, <i>D<\/i><i>E<\/i> ∥ <i>F<\/i><i>G<\/i> ∥ <i>B<\/i><i>C<\/i>. What is the value of <i>D<\/i><i>E<\/i> + <i>F<\/i><i>G<\/i>?<svg class=\"fig\" viewBox=\"0 0 320 270\" role=\"img\" aria-label=\"Triangle ABC with points D and F on side AB and points E and G on side AC. Segments DE and FG are both parallel to BC. AD is labeled 2, DF is labeled 3, FB is labeled 5 and BC is labeled 20.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"31.36,68.05 26,201.95 294,201.95\"/><line class=\"fg-edge\" x1=\"30.29\" y1=\"94.83\" x2=\"83.89\" y2=\"94.83\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"28.68\" y1=\"135\" x2=\"162.68\" y2=\"135\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"31.36\" cy=\"68.05\" r=\"3\"/><circle cx=\"26\" cy=\"201.95\" r=\"3\"/><circle cx=\"294\" cy=\"201.95\" r=\"3\"/><circle cx=\"30.29\" cy=\"94.83\" r=\"3\"/><circle cx=\"28.68\" cy=\"135\" r=\"3\"/><circle cx=\"83.89\" cy=\"94.83\" r=\"3\"/><circle cx=\"162.68\" cy=\"135\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"22.35\" y=\"63.18\" text-anchor=\"middle\">A<\/text><text x=\"14.33\" y=\"212.16\" text-anchor=\"middle\">B<\/text><text x=\"306.6\" y=\"209.63\" text-anchor=\"middle\">C<\/text><text x=\"38.77\" y=\"107.82\" text-anchor=\"middle\">D<\/text><text x=\"37.17\" y=\"147.99\" text-anchor=\"middle\">F<\/text><text x=\"90.58\" y=\"88.18\" text-anchor=\"middle\">E<\/text><text x=\"169.37\" y=\"128.35\" text-anchor=\"middle\">G<\/text><text x=\"18.83\" y=\"85.46\" text-anchor=\"middle\">2<\/text><text x=\"17.49\" y=\"118.94\" text-anchor=\"middle\">3<\/text><text x=\"15.35\" y=\"172.49\" text-anchor=\"middle\">5<\/text><text x=\"160\" y=\"218.45\" text-anchor=\"middle\">20<\/text><\/g><\/svg>", "opts": ["14", "18", "25", "30"], "ans": 0, "sol": "<i>A<\/i><i>B<\/i> = 2 + 3 + 5 = 10, and <i>A<\/i><i>F<\/i> = 2 + 3 = 5.<br><i>D<\/i><i>E<\/i> = 20 × <span class=\"fq\"><span>2<\/span><span>10<\/span><\/span> = 4 and <i>F<\/i><i>G<\/i> = 20 × <span class=\"fq\"><span>5<\/span><span>10<\/span><\/span> = 10.<br><i>D<\/i><i>E<\/i> + <i>F<\/i><i>G<\/i> = 14.<br>Answer: <b>14<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "A right triangle has legs of length 15 and 20. The altitude from the right angle to the hypotenuse divides the hypotenuse into two segments. What is the length of the shorter segment?", "ans": ["9"], "sol": "The hypotenuse is √(15<sup>2<\/sup> + 20<sup>2<\/sup>) = 25.<br>The shorter segment is next to the shorter leg, and the small triangle there is similar to the whole triangle: <span class=\"fq\"><span><i>s<\/i><\/span><span>15<\/span><\/span> = <span class=\"fq\"><span>15<\/span><span>25<\/span><\/span>.<br><i>s<\/i> = <span class=\"fq\"><span>225<\/span><span>25<\/span><\/span> = 9.<br>Answer: <b>9<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "In △<i>A<\/i><i>B<\/i><i>C<\/i>, point <i>D<\/i> lies on <i>A<\/i><i>B<\/i> and point <i>E<\/i> lies on <i>A<\/i><i>C<\/i>, with <i>D<\/i><i>E<\/i> ∥ <i>B<\/i><i>C<\/i>. The perimeter of △<i>A<\/i><i>D<\/i><i>E<\/i> is 18, the perimeter of △<i>A<\/i><i>B<\/i><i>C<\/i> is 30, and <i>D<\/i><i>B<\/i> = 4. What is the length of <i>A<\/i><i>D<\/i>?", "ans": ["6"], "sol": "The scale factor from <i>A<\/i><i>B<\/i><i>C<\/i> to <i>A<\/i><i>D<\/i><i>E<\/i> is <span class=\"fq\"><span>18<\/span><span>30<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>, so <i>A<\/i><i>D<\/i> = <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span><i>A<\/i><i>B<\/i> = <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>(<i>A<\/i><i>D<\/i> + 4).<br>5<i>A<\/i><i>D<\/i> = 3<i>A<\/i><i>D<\/i> + 12, so <i>A<\/i><i>D<\/i> = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A triangular warning sign has sides of 30, 40 and 50 centimeters. A larger sign is similar to it, and its shortest side is 30 centimeters longer than the shortest side of the original sign. What is the length, in centimeters, of the longest side of the larger sign?", "opts": ["60", "75", "80", "100"], "ans": 3, "sol": "The new shortest side is 30 + 30 = 60, so the scale factor is <span class=\"fq\"><span>60<\/span><span>30<\/span><\/span> = 2.<br>Longest side: 2 × 50 = 100.<br>Answer: <b>100<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "In a pinhole camera, light from the top and bottom of an object passes through a tiny hole and forms an upside down image on the back wall of the box. The object and the image are parallel. A tree 2 meters tall is 10 meters from the hole, and the back wall is 15 centimeters from the hole. How tall, in centimeters, is the image?", "opts": ["3", "7.5", "30", "300"], "ans": 0, "sol": "The light rays cross at the hole, forming two similar triangles. Use centimeters: the tree is 200 cm tall and 1,000 cm from the hole.<br><span class=\"fq\"><span><i>h<\/i><\/span><span>15<\/span><\/span> = <span class=\"fq\"><span>200<\/span><span>1000<\/span><\/span>, so <i>h<\/i> = 3.<br>Answer: <b>3<\/b>"}, {"lo": "LO2", "diff": "X", "type": "spr", "q": "A triangle has side lengths 6, 8 and 12. A similar triangle has two sides of lengths 9 and 18. What is the length of the third side of the similar triangle?", "ans": ["12"], "sol": "The ratio 18 : 9 = 2 must match a ratio of two sides of the first triangle, and only 12 : 6 = 2 works.<br>So 9 matches 6 and 18 matches 12, giv /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
