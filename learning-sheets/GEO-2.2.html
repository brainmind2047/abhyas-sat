var S = {"id": "GEO-2.2", "unit": "Geometry and Trigonometry", "topic": "Area and volume", "title": "Volume and surface area of solids", "intro": "Volume measures how much space a solid fills, and surface area measures how much material covers its outside. On the DSAT you find the volume of prisms, cylinders, cones, pyramids and spheres with the reference-sheet formulas, find the surface area of prisms and cylinders, work backward from a volume to a missing length, and solve container and composite-solid problems that need a unit conversion such as cubic centimeters to liters.", "los": [{"id": "LO1", "text": "Calculate the volume of rectangular prisms, other right prisms and cylinders by multiplying the area of the base by the height."}, {"id": "LO2", "text": "Calculate the volume of cones, pyramids, spheres and hemispheres by using the formulas on the DSAT reference sheet."}, {"id": "LO3", "text": "Determine the total or partial surface area of rectangular prisms, triangular prisms and cylinders."}, {"id": "LO4", "text": "Determine a missing dimension of a solid, such as a radius, height or edge length, from its volume or surface area."}, {"id": "LO5", "text": "Solve composite-solid and fill or capacity problems, including conversions between cubic units and liters."}], "notes": [{"lo": "LO1", "h": "Volume: layers of unit cubes", "html": "<p>Volume measures how much space a solid takes up, counted in <b>cubic units<\/b> such as cm<sup>3<\/sup> or ft<sup>3<\/sup>. A unit cube is 1 unit long on every edge, so a box that is 5 cubes long, 3 cubes wide and 4 cubes tall holds 5 × 3 × 4 = 60 unit cubes.<\/p><div class=\"rule\">Rectangular prism: <i>V<\/i> = <i>l<\/i><i>w<\/i><i>h<\/i>. Cube with edge <i>s<\/i>: <i>V<\/i> = <i>s<\/i><sup>3<\/sup>.<\/div><svg class=\"fig\" viewBox=\"0 0 280 220\" role=\"img\" aria-label=\"Rectangular box drawn in perspective with length 5 cm, width 3 cm and height 4 cm. Hidden back edges are dashed.\"><line class=\"fg-edge\" x1=\"57\" y1=\"175.87\" x2=\"176.77\" y2=\"175.87\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"5\"/><line class=\"fg-edge\" x1=\"176.77\" y1=\"175.87\" x2=\"176.77\" y2=\"80.06\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"176.77\" y1=\"80.06\" x2=\"57\" y2=\"80.06\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"57\" y1=\"80.06\" x2=\"57\" y2=\"175.87\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"4\"/><line class=\"fg-edge\" x1=\"57\" y1=\"80.06\" x2=\"119.23\" y2=\"44.13\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"176.77\" y1=\"80.06\" x2=\"239\" y2=\"44.13\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"176.77\" y1=\"175.87\" x2=\"239\" y2=\"139.94\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"3\"/><line class=\"fg-edge\" x1=\"119.23\" y1=\"44.13\" x2=\"239\" y2=\"44.13\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"239\" y1=\"139.94\" x2=\"239\" y2=\"44.13\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"57\" y1=\"175.87\" x2=\"119.23\" y2=\"139.94\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"119.23\" y1=\"139.94\" x2=\"239\" y2=\"139.94\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"119.23\" y1=\"139.94\" x2=\"119.23\" y2=\"44.13\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"116.88\" y=\"194.87\" text-anchor=\"middle\">5 cm<\/text><text x=\"49\" y=\"131.97\" text-anchor=\"end\">4 cm<\/text><text x=\"216.88\" y=\"169.91\" text-anchor=\"start\">3 cm<\/text><\/g><\/svg><p>A more powerful way to see it: the area of the base tells you how many cubes fit in one layer, and the height tells you how many layers there are. This works for every right prism, whatever the shape of its base (triangle, trapezoid or any polygon), as long as the two bases are identical and the sides stand straight up.<\/p><div class=\"eqs\"><i>V<\/i> = <i>B<\/i><i>h<\/i>, where <i>B<\/i> is the area of the base<\/div><p>Before you multiply, check that every length is in the same unit.<\/p>"}, {"lo": "LO1", "h": "Cylinders", "html": "<p>A cylinder works like a prism with a circular base. The base is a circle of radius <i>r<\/i>, so its area is π<i>r<\/i><sup>2<\/sup>, and multiplying by the height stacks up the layers.<\/p><div class=\"rule\">Cylinder: <i>V<\/i> = π<i>r<\/i><sup>2<\/sup><i>h<\/i><\/div><svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Right circular cylinder with a dashed radius of 3 cm drawn on the top base and a height of 5 cm marked on the right side. The hidden half of the bottom base is dashed.\"><ellipse class=\"fg-edge\" cx=\"108\" cy=\"66.67\" rx=\"64\" ry=\"17.92\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"44\" y1=\"66.67\" x2=\"44\" y2=\"173.33\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"172\" y1=\"66.67\" x2=\"172\" y2=\"173.33\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"5\"/><path class=\"fg-edge\" d=\"M44,173.33 A64,17.92 0 0 0 172,173.33\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M44,173.33 A64,17.92 0 0 1 172,173.33\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"108\" y1=\"66.67\" x2=\"172\" y2=\"66.67\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"3\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"108\" cy=\"66.67\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"140\" y=\"42.75\" text-anchor=\"middle\">3 cm<\/text><text x=\"180\" y=\"124\" text-anchor=\"start\">5 cm<\/text><\/g><\/svg><p>The cylinder shown has radius 3 cm and height 5 cm, so <i>V<\/i> = π(3)<sup>2<\/sup>(5) = 45π cubic centimeters, which is about 141.4 cubic centimeters.<\/p><div class=\"tip\">DSAT tip: answer choices are often left in terms of π, such as 45π. Use the π key only when the question asks for an approximate value. If the question gives a diameter, halve it first, because the formula needs the radius.<\/div><p>The height of a cylinder is the distance between its two circular bases, even when the cylinder lies on its side like a pipe or a log.<\/p>"}, {"lo": "LO2", "h": "Cones and pyramids: one third", "html": "<p>A cone or a pyramid narrows to a single point, the <b>apex<\/b>. If a cone and a cylinder have the same base and the same height, the cone holds exactly one third as much. The same is true for a pyramid and a prism.<\/p><div class=\"rule\">Cone: <i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π<i>r<\/i><sup>2<\/sup><i>h<\/i>. Pyramid: <i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>B<\/i><i>h<\/i>, so a rectangular base gives <i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>l<\/i><i>w<\/i><i>h<\/i>.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Solid<\/th><th>Volume<\/th><th>Compared with<\/th><\/tr><tr><td>Cylinder<\/td><td>π<i>r<\/i><sup>2<\/sup><i>h<\/i><\/td><td>—<\/td><\/tr><tr><td>Cone<\/td><td><span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π<i>r<\/i><sup>2<\/sup><i>h<\/i><\/td><td>one third of the cylinder<\/td><\/tr><tr><td>Rectangular prism<\/td><td><i>l<\/i><i>w<\/i><i>h<\/i><\/td><td>—<\/td><\/tr><tr><td>Rectangular pyramid<\/td><td><span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>l<\/i><i>w<\/i><i>h<\/i><\/td><td>one third of the prism<\/td><\/tr><\/table><\/div><svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Right circular cone with radius 3, height 4 drawn as a dashed segment from the apex to the center of the base with a right-angle mark, and slant height 5 along the right side.\"><line class=\"fg-edge\" x1=\"114\" y1=\"66.73\" x2=\"43\" y2=\"161.39\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"114\" y1=\"66.73\" x2=\"185\" y2=\"161.39\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"5\"/><path class=\"fg-edge\" d=\"M43,161.39 A71,19.88 0 0 0 185,161.39\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M43,161.39 A71,19.88 0 0 1 185,161.39\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"114\" y1=\"161.39\" x2=\"185\" y2=\"161.39\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"3\"/><line class=\"fg-edge\" x1=\"114\" y1=\"66.73\" x2=\"114\" y2=\"161.39\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"122,161.39 122,153.39 114,153.39\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"114\" cy=\"66.73\" r=\"3\"/><circle cx=\"114\" cy=\"161.39\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"149.5\" y=\"197.27\" text-anchor=\"middle\">3<\/text><text x=\"107\" y=\"135.51\" text-anchor=\"end\">4<\/text><text x=\"159.5\" y=\"114.06\" text-anchor=\"start\">5<\/text><\/g><\/svg><p>The height <i>h<\/i> is measured straight down from the apex to the base, at a right angle. The <b>slant height<\/b> runs along the side and is longer. In the cone shown, the slant height is 5 and the radius is 3, so the height is √(5<sup>2<\/sup> − 3<sup>2<\/sup>) = 4 and <i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π(3)<sup>2<\/sup>(4) = 12π.<\/p>"}, {"lo": "LO2", "h": "Spheres and hemispheres", "html": "<p>A sphere is the set of all points at distance <i>r<\/i> from a center point. Its volume depends on the cube of the radius, so a small change in <i>r<\/i> makes a big change in <i>V<\/i>.<\/p><div class=\"rule\">Sphere: <i>V<\/i> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π<i>r<\/i><sup>3<\/sup>. Hemisphere (half a sphere): <i>V<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>π<i>r<\/i><sup>3<\/sup>.<\/div><div class=\"eqs\"><i>r<\/i> = 3: <i>V<\/i> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π(27) = 36π<br><i>r<\/i> = 2: <i>V<\/i> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π(8) = <span class=\"fq\"><span>32<\/span><span>3<\/span><\/span>π<\/div><p>Cube the radius first, then multiply by <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>. When you see a diameter, divide it by 2 before cubing; using the diameter makes the volume 8 times too large. A hemisphere often appears as the top of a tower or the shape of a bowl.<\/p><div class=\"tip\">DSAT tip: the reference sheet at the start of each Math module lists the volume formulas for a rectangular prism, cylinder, sphere, cone and pyramid. You do not need to memorize them, but you do need to know what each letter stands for and which solid each formula fits.<\/div>"}, {"lo": "LO3", "h": "Surface area of a prism", "html": "<p>Surface area is the total area of all the faces of a solid, measured in <b>square units<\/b>. Imagine unfolding a closed box into a flat <b>net<\/b>: you would see six rectangles in three matching pairs.<\/p><div class=\"rule\">Rectangular prism: SA = 2(<i>l<\/i><i>w<\/i> + <i>l<\/i><i>h<\/i> + <i>w<\/i><i>h<\/i>). Cube: SA = 6<i>s<\/i><sup>2<\/sup>.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Pair of faces<\/th><th>One face<\/th><th>Both faces<\/th><\/tr><tr><td>Top and bottom<\/td><td><i>l<\/i><i>w<\/i><\/td><td>2<i>l<\/i><i>w<\/i><\/td><\/tr><tr><td>Front and back<\/td><td><i>l<\/i><i>h<\/i><\/td><td>2<i>l<\/i><i>h<\/i><\/td><\/tr><tr><td>Left and right<\/td><td><i>w<\/i><i>h<\/i><\/td><td>2<i>w<\/i><i>h<\/i><\/td><\/tr><\/table><\/div><p>For the 5 by 3 by 4 box above, SA = 2(15 + 20 + 12) = 94 square centimeters, while its volume is 60 cubic centimeters. For any other right prism, add the areas of the two bases and of the rectangles around the sides; each side rectangle has the prism's length as one of its dimensions.<\/p><div class=\"tip\">Read the context carefully: an open box has no lid, so leave out one face, and wrapping only the sides leaves out the top and the bottom.<\/div>"}, {"lo": "LO3", "h": "Surface area of a cylinder", "html": "<p>Unroll the curved side of a cylinder and you get a rectangle. Its height is <i>h<\/i>, and its length is the circumference of the base, 2π<i>r<\/i>, because the side wraps exactly once around the circle.<\/p><div class=\"rule\">Lateral (curved) area = 2π<i>r<\/i><i>h<\/i>. Total surface area = 2π<i>r<\/i><sup>2<\/sup> + 2π<i>r<\/i><i>h<\/i>.<\/div><div class=\"eqs\"><i>r<\/i> = 3, <i>h<\/i> = 5:<br>two bases: 2π(3)<sup>2<\/sup> = 18π<br>curved side: 2π(3)(5) = 30π<br>total: 18π + 30π = 48π square units<\/div><p>Decide which parts the question needs. A label around a can covers only the curved side. A cup with no lid has one base, so its area is π<i>r<\/i><sup>2<\/sup> + 2π<i>r<\/i><i>h<\/i>. A tube that is open at both ends has no bases at all.<\/p><div class=\"tip\">The surface area formulas are not on the DSAT reference sheet, so rebuild them from the net: two circles and one rectangle.<\/div>"}, {"lo": "LO4", "h": "Working backward to a missing length", "html": "<p>Many DSAT questions give the volume or the surface area and ask for a length. Write the formula, substitute everything you know, and solve for the one unknown.<\/p><div class=\"rule\">Isolate the power of the unknown first, then undo it: take a square root for <i>r<\/i><sup>2<\/sup> and a cube root for <i>r<\/i><sup>3<\/sup> or <i>s<\/i><sup>3<\/sup>.<\/div><div class=\"eqs\">Cylinder with <i>V<\/i> = 80π and <i>h<\/i> = 5:<br>π<i>r<\/i><sup>2<\/sup>(5) = 80π<br><i>r<\/i><sup>2<\/sup> = 16, so <i>r<\/i> = 4<\/div><div class=\"eqs\">Cube with <i>V<\/i> = 64:<br><i>s<\/i><sup>3<\/sup> = 64, so <i>s<\/i> = ∛64 = 4<\/div><p>Divide out π when it appears on both sides; that keeps the numbers whole. For a cone or a pyramid, multiply both sides by 3 to clear the <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> before anything else. A length must be positive, so reject the negative square root. Finally, check what the question asks for: the radius, the diameter or the height.<\/p><div class=\"tip\">Desmos tip: to solve π<i>r<\/i><sup>2<\/sup>(5) = 80π, graph <i>y<\/i> = π<i>x<\/i><sup>2<\/sup>(5) and <i>y<\/i> = 80π and read the positive <i>x<\/i>-value of the intersection point.<\/div>"}, {"lo": "LO5", "h": "Composite solids and capacity", "html": "<p>A composite solid is built from simpler solids. Split it into parts you know, find each volume, then <b>add<\/b> parts that are joined together and <b>subtract<\/b> parts that are cut out or hollow.<\/p><div class=\"eqs\">tower = cylinder + cone<br>pipe = outer cylinder − inner cylinder<\/div><p><b>Capacity<\/b> is the volume of liquid a container holds, usually in liters or milliliters.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Unit<\/th><th>Equals<\/th><\/tr><tr><td>1 milliliter (mL)<\/td><td>1 cm<sup>3<\/sup><\/td><\/tr><tr><td>1 liter (L)<\/td><td>1,000 cm<sup>3<\/sup><\/td><\/tr><tr><td>1 m<sup>3<\/sup><\/td><td>1,000 L = 1,000,000 cm<sup>3<\/sup><\/td><\/tr><tr><td>1 ft<sup>3<\/sup><\/td><td>1,728 in<sup>3<\/sup><\/td><\/tr><\/table><\/div><div class=\"rule\">Cubic units convert with the cube of the length factor: 1 m = 100 cm, so 1 m<sup>3<\/sup> = 100<sup>3<\/sup> cm<sup>3<\/sup> = 1,000,000 cm<sup>3<\/sup>.<\/div><p>Either convert every length before you multiply, or find the volume first and then use the cubic factor. A partly filled tank holds only the water, so use the depth of the water, not the height of the tank.<\/p>"}], "examples": [{"lo": "LO1", "q": "A storage box is 9 inches long, 4 inches wide and 5 inches tall. What is the volume of the box?", "steps": ["Use the box formula <i>V<\/i> = <i>l<\/i><i>w<\/i><i>h<\/i>.", "<i>V<\/i> = 9 × 4 × 5 = 180."], "ans": "180 cubic inches"}, {"lo": "LO2", "q": "The right circular cone shown has a radius of 6 centimeters and a height of 10 centimeters. Which of the following is the volume of the cone, in cubic centimeters?<br>A) 40π<br>B) 120π<br>C) 360π<br>D) 1,200π<svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Right circular cone with a dashed radius of 6 cm on the base and a dashed height of 10 cm from the apex to the center of the base, meeting the radius at a right angle.\"><line class=\"fg-edge\" x1=\"114\" y1=\"54.89\" x2=\"43\" y2=\"173.23\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"114\" y1=\"54.89\" x2=\"185\" y2=\"173.23\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M43,173.23 A71,19.88 0 0 0 185,173.23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M43,173.23 A71,19.88 0 0 1 185,173.23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"114\" y1=\"173.23\" x2=\"185\" y2=\"173.23\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"6\"/><line class=\"fg-edge\" x1=\"114\" y1=\"54.89\" x2=\"114\" y2=\"173.23\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"10\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"122,173.23 122,165.23 114,165.23\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"114\" cy=\"54.89\" r=\"3\"/><circle cx=\"114\" cy=\"173.23\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"149.5\" y=\"209.11\" text-anchor=\"middle\">6 cm<\/text><text x=\"107\" y=\"144.09\" text-anchor=\"end\">10 cm<\/text><\/g><\/svg>", "steps": ["The base is a circle with area π(6)<sup>2<\/sup> = 36π.", "A cone holds one third of the cylinder with the same base and height: <i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(36π)(10).", "<i>V<\/i> = 120π. Choice C, 360π, is the cylinder: it leaves out the <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>."], "ans": "B) 120π"}, {"lo": "LO2", "q": "A ball in the shape of a sphere has a diameter of 12 inches. Find its volume in terms of π.", "steps": ["The radius is half the diameter: <i>r<\/i> = 6.", "<i>V<\/i> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π(6)<sup>3<\/sup> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π(216).", "<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span> × 216 = 288, so <i>V<\/i> = 288π."], "ans": "288π cubic inches"}, {"lo": "LO3", "q": "A closed cylinder has a radius of 4 units and a height of 9 units. What is its total surface area?", "steps": ["Two circular bases: 2π(4)<sup>2<\/sup> = 32π.", "Curved side: 2π(4)(9) = 72π.", "Total: 32π + 72π = 104π."], "ans": "104π square units"}, {"lo": "LO4", "q": "A cylinder has a volume of 245π cubic centimeters and a radius of 7 centimeters. What is the height of the cylinder, in centimeters? (Student-produced response.)", "steps": ["Substitute into <i>V<\/i> = π<i>r<\/i><sup>2<\/sup><i>h<\/i>: π(7)<sup>2<\/sup><i>h<\/i> = 245π.", "Divide both sides by π: 49<i>h<\/i> = 245.", "Divide by 49: <i>h<\/i> = 5."], "ans": "5"}, {"lo": "LO5", "q": "A grain silo is a cylinder with radius 3 meters and height 10 meters, topped by a cone with the same radius and a height of 4 meters, as shown. What is the volume of the silo?<svg class=\"fig\" viewBox=\"0 0 240 270\" role=\"img\" aria-label=\"Silo made of a cylinder with radius 3 m and height 10 m, topped by a cone with the same radius and a height of 4 m. The cone height is dashed from the apex to the center of the cylinder top.\"><line class=\"fg-edge\" x1=\"108\" y1=\"32\" x2=\"65.55\" y2=\"88.6\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"108\" y1=\"32\" x2=\"150.45\" y2=\"88.6\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M65.55,88.6 A42.45,11.89 0 0 0 150.45,88.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M65.55,88.6 A42.45,11.89 0 0 1 150.45,88.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"65.55\" y1=\"88.6\" x2=\"65.55\" y2=\"230.11\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"150.45\" y1=\"88.6\" x2=\"150.45\" y2=\"230.11\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"10\"/><path class=\"fg-edge\" d=\"M65.55,230.11 A42.45,11.89 0 0 0 150.45,230.11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M65.55,230.11 A42.45,11.89 0 0 1 150.45,230.11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"108\" y1=\"32\" x2=\"108\" y2=\"88.6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"53.55\" y1=\"32\" x2=\"53.55\" y2=\"88.6\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\" data-v=\"4\"/><line class=\"fg-edge\" x1=\"49.55\" y1=\"32\" x2=\"102\" y2=\"32\" stroke=\"currentColor\" stroke-width=\"1\"/><line class=\"fg-edge\" x1=\"108\" y1=\"88.6\" x2=\"150.45\" y2=\"88.6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"3\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"115,88.6 115,81.6 108,81.6\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"108\" cy=\"32\" r=\"3\"/><circle cx=\"108\" cy=\"88.6\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"47.55\" y=\"64.3\" text-anchor=\"end\">4 m<\/text><text x=\"133.23\" y=\"115.49\" text-anchor=\"middle\">3 m<\/text><text x=\"158.45\" y=\"163.36\" text-anchor=\"start\">10 m<\/text><\/g><\/svg>", "steps": ["Cylinder: π(3)<sup>2<\/sup>(10) = 90π.", "Cone: <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π(3)<sup>2<\/sup>(4) = 12π.", "The parts are joined, so add: 90π + 12π = 102π."], "ans": "102π cubic meters"}, {"lo": "LO5", "q": "A rectangular fish tank is 50 centimeters long and 30 centimeters wide. Water fills it to a depth of 30 centimeters. How many liters of water are in the tank? (1 liter = 1,000 cubic centimeters)", "steps": ["Use the depth of the water as the height: <i>V<\/i> = 50 × 30 × 30 = 45,000 cubic centimeters.", "Divide by 1,000 to change to liters: 45,000 ÷ 1,000 = 45."], "ans": "45"}], "traps": ["Using the diameter in place of the radius. Halve the diameter first; using it directly makes a cylinder's volume 4 times too large and a sphere's 8 times too large.", "Forgetting the <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> for a cone or a pyramid, or wrongly using it for a cylinder or a prism. Only solids that come to a point get the <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>.", "Using the slant height as the height of a cone or a pyramid. The height is perpendicular to the base; find it with the Pythagorean theorem if needed.", "Converting cubic units with the length factor. Since 1 m = 100 cm, 1 m<sup>3<\/sup> = 1,000,000 cm<sup>3<\/sup>, not 100 cm<sup>3<\/sup>; and 1 liter is 1,000 cm<sup>3<\/sup>.", "Counting the wrong faces in a surface area question: an open box has five faces, a can's label is only the curved side, and a closed cylinder has two bases.", "Stopping at <i>r<\/i><sup>2<\/sup> or <i>s<\/i><sup>3<\/sup> when working backward. Take the square root or cube root, then check whether the question wants the radius, the diameter or the height."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A prism has a base with an area of 21 square centimeters and a height of 4 centimeters. What is the volume of the prism, in cubic centimeters?", "opts": ["25", "84", "168", "5.25"], "ans": 1, "sol": "The volume of any prism is the area of the base times the height.<br><i>V<\/i> = 21 × 4 = 84.<br>Answer: <b>84<\/b>", "hint": "You do not need to know the shape of the base: think of the base area as one layer and the height as the number of layers."}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "A cube has edges of length 5 inches. What is the volume of the cube, in cubic inches?", "opts": ["15", "25", "125", "150"], "ans": 2, "sol": "A cube has length, width and height all equal to 5.<br><i>V<\/i> = 5<sup>3<\/sup> = 5 × 5 × 5 = 125.<br>Answer: <b>125<\/b>", "hint": "All three dimensions of a cube are equal. Multiply three of them, not two."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The right circular cylinder shown has a diameter of 10 centimeters and a height of 6 centimeters. What is the volume of the cylinder, in cubic centimeters?<svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Right circular cylinder with a dashed diameter of 10 cm across the top base and a height of 6 cm marked on the right side.\"><ellipse class=\"fg-edge\" cx=\"108\" cy=\"81.6\" rx=\"64\" ry=\"17.92\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"44\" y1=\"81.6\" x2=\"44\" y2=\"158.4\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"172\" y1=\"81.6\" x2=\"172\" y2=\"158.4\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"6\"/><path class=\"fg-edge\" d=\"M44,158.4 A64,17.92 0 0 0 172,158.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M44,158.4 A64,17.92 0 0 1 172,158.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"44\" y1=\"81.6\" x2=\"172\" y2=\"81.6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"10\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"108\" cy=\"81.6\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"108\" y=\"57.68\" text-anchor=\"middle\">10 cm<\/text><text x=\"180\" y=\"124\" text-anchor=\"start\">6 cm<\/text><\/g><\/svg>", "opts": ["150π", "600π", "60π", "50π"], "ans": 0, "sol": "The radius is half the diameter: <i>r<\/i> = 5.<br><i>V<\/i> = π<i>r<\/i><sup>2<\/sup><i>h<\/i> = π(5)<sup>2<\/sup>(6) = 150π.<br>Answer: <b>150π<\/b>", "hint": "The formula uses the radius. What is the radius when the diameter is 10?"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "The pyramid shown has a square base with edges of 6 inches and a height of 5 inches. What is the volume of the pyramid, in cubic inches?<svg class=\"fig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"Pyramid with a square base. The front base edge is 6 in, and a dashed height of 5 in runs from the apex straight down to the center of the base, with a right-angle mark. Hidden edges are dashed.\"><line class=\"fg-edge\" x1=\"35.32\" y1=\"196\" x2=\"195.98\" y2=\"196\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"6\"/><line class=\"fg-edge\" x1=\"195.98\" y1=\"196\" x2=\"244.68\" y2=\"167.88\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"140\" y1=\"48.06\" x2=\"35.32\" y2=\"196\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"140\" y1=\"48.06\" x2=\"195.98\" y2=\"196\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"140\" y1=\"48.06\" x2=\"244.68\" y2=\"167.88\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"244.68\" y1=\"167.88\" x2=\"84.02\" y2=\"167.88\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"84.02\" y1=\"167.88\" x2=\"35.32\" y2=\"196\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"140\" y1=\"48.06\" x2=\"84.02\" y2=\"167.88\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"140\" y1=\"48.06\" x2=\"140\" y2=\"181.94\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"5\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"147,181.94 147,174.94 140,174.94\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"140\" cy=\"48.06\" r=\"3\"/><circle cx=\"140\" cy=\"181.94\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"115.65\" y=\"215\" text-anchor=\"middle\">6 in<\/text><text x=\"145\" y=\"152.47\" text-anchor=\"start\">5 in<\/text><\/g><\/svg>", "opts": ["180", "60", "90", "10"], "ans": 1, "sol": "Base area: 6<sup>2<\/sup> = 36.<br><i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>B<\/i><i>h<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(36)(5) = 60.<br>Answer: <b>60<\/b>", "hint": "Find the area of the square base and multiply by the height. A pyramid holds only part of that amount: which fraction?"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "A sphere has a radius of 3 meters. The volume of the sphere is <i>k<\/i>π cubic meters. What is the value of <i>k<\/i>?", "ans": ["36"], "sol": "<i>V<\/i> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π(3)<sup>3<\/sup> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π(27).<br><span class=\"fq\"><span>4<\/span><span>3<\/span><\/span> × 27 = 36, so <i>V<\/i> = 36π.<br>Answer: <b>36<\/b>", "hint": "Cube the radius first, then multiply by <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A closed rectangular box is 6 feet long, 4 feet wide and 2 feet tall. What is the total surface area of the box, in square feet?", "opts": ["48", "44", "12", "88"], "ans": 3, "sol": "The three different faces have areas 6 × 4 = 24, 6 × 2 = 12 and 4 × 2 = 8.<br>Each appears twice: SA = 2(24 + 12 + 8) = 88.<br>Answer: <b>88<\/b>", "hint": "There are three pairs of matching faces. Find one face from each pair, add them, then double."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The closed cylinder shown has a radius of 3 inches and a height of 8 inches. Its curved side and its top are painted, but its bottom is not. What is the area of the painted surface, in square inches?<svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Closed right circular cylinder with a dashed radius of 3 in on the top base and a height of 8 in marked on the right side.\"><ellipse class=\"fg-edge\" cx=\"108\" cy=\"50.58\" rx=\"52.07\" ry=\"14.58\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"55.93\" y1=\"50.58\" x2=\"55.93\" y2=\"189.42\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"160.07\" y1=\"50.58\" x2=\"160.07\" y2=\"189.42\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"8\"/><path class=\"fg-edge\" d=\"M55.93,189.42 A52.07,14.58 0 0 0 160.07,189.42\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M55.93,189.42 A52.07,14.58 0 0 1 160.07,189.42\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"108\" y1=\"50.58\" x2=\"160.07\" y2=\"50.58\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"3\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"108\" cy=\"50.58\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"134.03\" y=\"30\" text-anchor=\"middle\">3 in<\/text><text x=\"168.07\" y=\"124\" text-anchor=\"start\">8 in<\/text><\/g><\/svg>", "opts": ["57π", "66π", "48π", "72π"], "ans": 0, "sol": "Curved side: 2π<i>r<\/i><i>h<\/i> = 2π(3)(8) = 48π.<br>Top: π<i>r<\/i><sup>2<\/sup> = π(3)<sup>2<\/sup> = 9π.<br>Painted area: 48π + 9π = 57π.<br>Answer: <b>57π<\/b>", "hint": "Picture the net: a rectangle that is 2π<i>r<\/i> long and <i>h<\/i> tall, plus the circles you need. How many circles are painted?"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A rectangular prism has a volume of 240 cubic centimeters. Its length is 10 centimeters and its width is 6 centimeters. What is the height of the prism, in centimeters?", "opts": ["4", "24", "40", "224"], "ans": 0, "sol": "<i>V<\/i> = <i>l<\/i><i>w<\/i><i>h<\/i>, so 240 = 10 × 6 × <i>h<\/i> = 60<i>h<\/i>.<br><i>h<\/i> = 240 ÷ 60 = 4.<br>Answer: <b>4<\/b>", "hint": "Substitute into <i>V<\/i> = <i>l<\/i><i>w<\/i><i>h<\/i>, then divide by the product of the two lengths you know."}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "A cylinder has a volume of 72π cubic feet and a height of 2 feet. What is the radius of the cylinder, in feet?", "ans": ["6"], "sol": "π<i>r<\/i><sup>2<\/sup>(2) = 72π.<br>Divide by 2π: <i>r<\/i><sup>2<\/sup> = 36.<br>The radius is positive, so <i>r<\/i> = 6.<br>Answer: <b>6<\/b>", "hint": "Set π<i>r<\/i><sup>2<\/sup>(2) equal to 72π and divide out π first. Remember the last step after you find <i>r<\/i><sup>2<\/sup>."}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A right circular cone has a volume of 96π cubic centimeters and a height of 8 centimeters. What is the radius of the cone, in centimeters?", "opts": ["2√3", "36", "12", "6"], "ans": 3, "sol": "<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π<i>r<\/i><sup>2<\/sup>(8) = 96π.<br>Multiply both sides by 3 and divide by π: 8<i>r<\/i><sup>2<\/sup> = 288.<br><i>r<\/i><sup>2<\/sup> = 36, so <i>r<\/i> = 6.<br>Answer: <b>6<\/b>", "hint": "Multiply both sides by 3 to clear the <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> before you solve for <i>r<\/i><sup>2<\/sup>."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A café serves juice in cylindrical cups. Each cup has an inside radius of 3 centimeters and an inside height of 10 centimeters. What is the greatest number of cups that can be filled completely from 9 liters of juice? (1 liter = 1,000 cubic centimeters)", "opts": ["32", "100", "31", "3"], "ans": 2, "sol": "One cup: π(3)<sup>2<\/sup>(10) = 90π ≈ 282.7 cubic centimeters.<br>9 liters = 9,000 cubic centimeters.<br>9,000 ÷ 282.7 ≈ 31.8, so only 31 cups can be filled completely.<br>Answer: <b>31<\/b>", "hint": "Put both volumes in cubic centimeters before dividing, and think about what to do with a decimal part when cups must be full."}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "A wooden cube has edges of 6 centimeters. A hole in the shape of a cylinder with a radius of 1 centimeter is drilled straight through the cube, from the center of one face to the center of the opposite face. What is the volume of the wood that remains, to the nearest cubic centimeter?", "ans": ["197"], "sol": "Cube: 6<sup>3<\/sup> = 216.<br>Hole: a cylinder with <i>r<\/i> = 1 and <i>h<\/i> = 6, so π(1)<sup>2<\/sup>(6) = 6π ≈ 18.85.<br>Remaining wood: 216 − 18.85 ≈ 197.15.<br>Answer: <b>197<\/b>", "hint": "Subtract the part that was removed. The hole goes all the way through, so how tall is that cylinder?"}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A rectangular prism measures 2 feet by 3 feet by 18 inches. What is the volume of the prism, in cubic feet? (12 inches = 1 foot)", "opts": ["108", "23", "9", "6"], "ans": 2, "sol": "Change 18 inches to feet: 18 ÷ 12 = 1.5 feet.<br><i>V<\/i> = 2 × 3 × 1.5 = 9.<br>Answer: <b>9<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A cone has a base with an area of 30 square inches and a height of 8 inches. What is the volume of the cone, in cubic inches?", "opts": ["80", "240", "120", "38"], "ans": 0, "sol": "<i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>B<\/i><i>h<\/i>, with <i>B<\/i> = 30 and <i>h<\/i> = 8.<br><i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(30)(8) = 80.<br>Answer: <b>80<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "What is the total surface area, in square centimeters, of a cube with edges of 4 centimeters?", "opts": ["64", "16", "48", "96"], "ans": 3, "sol": "Each of the 6 faces is a 4 by 4 square with area 16.<br>SA = 6 × 16 = 96.<br>Answer: <b>96<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "The right circular cylinder shown has a radius of 2 meters and a height of 9 meters. The volume of the cylinder is <i>k<\/i>π cubic meters. What is the value of <i>k<\/i>?<svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Tall right circular cylinder with a dashed radius of 2 m on the top base and a height of 9 m marked on the right side.\"><ellipse class=\"fg-edge\" cx=\"108\" cy=\"45.3\" rx=\"33.2\" ry=\"9.3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"74.8\" y1=\"45.3\" x2=\"74.8\" y2=\"194.7\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"141.2\" y1=\"45.3\" x2=\"141.2\" y2=\"194.7\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"9\"/><path class=\"fg-edge\" d=\"M74.8,194.7 A33.2,9.3 0 0 0 141.2,194.7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M74.8,194.7 A33.2,9.3 0 0 1 141.2,194.7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"108\" y1=\"45.3\" x2=\"141.2\" y2=\"45.3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"108\" cy=\"45.3\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"124.6\" y=\"30\" text-anchor=\"middle\">2 m<\/text><text x=\"149.2\" y=\"124\" text-anchor=\"start\">9 m<\/text><\/g><\/svg>", "ans": ["36"], "sol": "<i>V<\/i> = π<i>r<\/i><sup>2<\/sup><i>h<\/i> = π(2)<sup>2<\/sup>(9).<br>4 × 9 = 36, so <i>V<\/i> = 36π.<br>Answer: <b>36<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A cube has a volume of 343 cubic inches. What is the length of one edge of the cube, in inches?", "opts": ["7", "<span class=\"fq\"><span>343<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>343<\/span><span>6<\/span><\/span>", "49"], "ans": 0, "sol": "<i>s<\/i><sup>3<\/sup> = 343.<br>7 × 7 × 7 = 343, so <i>s<\/i> = ∛343 = 7.<br>Answer: <b>7<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "A rainwater tank holds 2.5 cubic meters of water when it is full. How many liters of water does the full tank hold? (1 cubic meter = 1,000 liters)", "opts": ["250", "2,500", "25", "25,000"], "ans": 1, "sol": "Each cubic meter is 1,000 liters.<br>2.5 × 1,000 = 2,500.<br>Answer: <b>2,500<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A sphere has a radius of 3 units. A cone also has a radius of 3 units, and its height is 4 units. The volume of the sphere is how many times the volume of the cone?", "opts": ["<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "3", "9", "4"], "ans": 1, "sol": "Sphere: <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π(3)<sup>3<\/sup> = 36π.<br>Cone: <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π(3)<sup>2<\/sup>(4) = 12π.<br>36π ÷ 12π = 3.<br>Answer: <b>3<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The rectangular box shown is 10 inches long, 4 inches wide and 3 inches tall. What is the total area of the four side faces of the box, not including the top and the bottom, in square inches?<svg class=\"fig\" viewBox=\"0 0 280 220\" role=\"img\" aria-label=\"Rectangular box drawn in perspective with length 10 in, width 4 in and height 3 in. Hidden back edges are dashed.\"><line class=\"fg-edge\" x1=\"57\" y1=\"143.79\" x2=\"192.17\" y2=\"143.79\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"10\"/><line class=\"fg-edge\" x1=\"192.17\" y1=\"143.79\" x2=\"192.17\" y2=\"103.24\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"192.17\" y1=\"103.24\" x2=\"57\" y2=\"103.24\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"57\" y1=\"103.24\" x2=\"57\" y2=\"143.79\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"3\"/><line class=\"fg-edge\" x1=\"57\" y1=\"103.24\" x2=\"103.83\" y2=\"76.21\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"192.17\" y1=\"103.24\" x2=\"239\" y2=\"76.21\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"192.17\" y1=\"143.79\" x2=\"239\" y2=\"116.76\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"4\"/><line class=\"fg-edge\" x1=\"103.83\" y1=\"76.21\" x2=\"239\" y2=\"76.21\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"239\" y1=\"116.76\" x2=\"239\" y2=\"76.21\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"57\" y1=\"143.79\" x2=\"103.83\" y2=\"116.76\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"103.83\" y1=\"116.76\" x2=\"239\" y2=\"116.76\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"103.83\" y1=\"116.76\" x2=\"103.83\" y2=\"76.21\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"124.59\" y=\"162.79\" text-anchor=\"middle\">10 in<\/text><text x=\"49\" y=\"127.52\" text-anchor=\"end\">3 in<\/text><text x=\"224.59\" y=\"142.28\" text-anchor=\"start\">4 in<\/text><\/g><\/svg>", "opts": ["164", "120", "84", "42"], "ans": 2, "sol": "Front and back: 10 × 3 = 30 each.<br>Left and right: 4 × 3 = 12 each.<br>Four side faces: 2(30 + 12) = 84.<br>Answer: <b>84<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The right prism shown has bases that are right triangles with legs of 6 centimeters and 8 centimeters and a hypotenuse of 10 centimeters. The length of the prism is 12 centimeters. What is the volume of the prism, in cubic centimeters?<svg class=\"fig\" viewBox=\"0 0 300 220\" role=\"img\" aria-label=\"Right triangular prism. The front base is a right triangle with a vertical leg of 6 cm, a horizontal leg of 8 cm and a hypotenuse of 10 cm, with a right-angle mark. The prism extends 12 cm back. Hidden edges are dashed.\"><line class=\"fg-edge\" x1=\"55\" y1=\"175.9\" x2=\"142.86\" y2=\"175.9\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"8\"/><line class=\"fg-edge\" x1=\"55\" y1=\"175.9\" x2=\"55\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"6\"/><line class=\"fg-edge\" x1=\"142.86\" y1=\"175.9\" x2=\"55\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"10\"/><line class=\"fg-edge\" x1=\"142.86\" y1=\"175.9\" x2=\"257\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"12\"/><line class=\"fg-edge\" x1=\"55\" y1=\"110\" x2=\"169.14\" y2=\"44.1\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"169.14\" y1=\"44.1\" x2=\"257\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"55\" y1=\"175.9\" x2=\"169.14\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"169.14\" y1=\"110\" x2=\"257\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"169.14\" y1=\"110\" x2=\"169.14\" y2=\"44.1\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"64,175.9 64,166.9 55,166.9\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"98.93\" y=\"194.9\" text-anchor=\"middle\">8 cm<\/text><text x=\"47\" y=\"146.95\" text-anchor=\"end\">6 cm<\/text><text x=\"87.76\" y=\"128.97\" text-anchor=\"start\">10 cm<\/text><text x=\"208.93\" y=\"154.95\" text-anchor=\"start\">12 cm<\/text><\/g><\/svg>", "opts": ["576", "288", "360", "24"], "ans": 1, "sol": "The base is a right triangle, so use the two legs: <i>B<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(6)(8) = 24.<br><i>V<\/i> = <i>B<\/i><i>h<\/i> = 24 × 12 = 288.<br>Answer: <b>288<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A closed rectangular box has a square base with sides of 5 centimeters. The total surface area of the box is 170 square centimeters. What is the height of the box, in centimeters?", "opts": ["7.25", "6.8", "6", "8.5"], "ans": 2, "sol": "Top and bottom: 2(5 × 5) = 50.<br>Four sides: 4(5<i>h<\/i>) = 20<i>h<\/i>, so 50 + 20<i>h<\/i> = 170.<br>20<i>h<\/i> = 120, so <i>h<\/i> = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO5", "diff": "M", "type": "spr", "q": "A solid is made of a cube with edges of 10 centimeters and a pyramid set on top of it. The square base of the pyramid matches the top face of the cube, and the height of the pyramid is 6 centimeters. What is the volume of the solid, in cubic centimeters?", "ans": ["1200"], "sol": "Cube: 10<sup>3<\/sup> = 1,000.<br>Pyramid: <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(10 × 10)(6) = 200.<br>Total: 1,000 + 200 = 1,200.<br>Answer: <b>1200<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A pyramid has a square base with a perimeter of 32 meters, and its height is 9 meters. What is the volume of the pyramid, in cubic meters?", "opts": ["192", "576", "96", "288"], "ans": 0, "sol": "Each base edge is 32 ÷ 4 = 8, so the base area is 64.<br><i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(64)(9) = 192.<br>Answer: <b>192<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A can of soup is a cylinder with a radius of 5 centimeters and a height of 12 centimeters. A paper label covers the entire curved side of the can with no overlap. What is the area of the label, in square centimeters?", "opts": ["120π", "170π", "60π", "300π"], "ans": 0, "sol": "The label is the curved side only, which unrolls into a rectangle 2π<i>r<\/i> long and <i>h<\/i> tall.<br>Area = 2π(5)(12) = 120π.<br>Answer: <b>120π<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "A sphere has a volume of <span class=\"fq\"><span>500<\/span><span>3<\/span><\/span>π cubic inches. What is the radius of the sphere, in inches?", "ans": ["5"], "sol": "<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π<i>r<\/i><sup>3<\/sup> = <span class=\"fq\"><span>500<\/span><span>3<\/span><\/span>π.<br>Multiply both sides by <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span> and divide by π: <i>r<\/i><sup>3<\/sup> = 125.<br><i>r<\/i> = ∛125 = 5.<br>Answer: <b>5<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A builder pours a rectangular concrete slab that is 6 meters long, 4 meters wide and 15 centimeters thick. What volume of concrete is needed, in cubic meters?", "opts": ["360", "36", "24", "3.6"], "ans": 3, "sol": "Change the thickness to meters: 15 cm = 0.15 m.<br><i>V<\/i> = 6 × 4 × 0.15 = 3.6.<br>Answer: <b>3.6<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A right circular cone has a radius of 5 inches and a slant height of 13 inches. What is the volume of the cone, in cubic inches?", "opts": ["<span class=\"fq\"><span>325<\/span><span>3<\/span><\/span>π", "100π", "300π", "65π"], "ans": 1, "sol": "The height, radius and slant height form a right triangle: <i>h<\/i> = √(13<sup>2<\/sup> − 5<sup>2<\/sup>) = √144 = 12.<br><i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π(5)<sup>2<\/sup>(12) = 100π.<br>Answer: <b>100π<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "A closed cylinder has a radius of 4 inches and a total surface area of 112π square inches. What is the height of the cylinder, in inches?", "ans": ["10"], "sol": "2π(4)<sup>2<\/sup> + 2π(4)<i>h<\/i> = 112π.<br>Divide by π: 32 + 8<i>h<\/i> = 112.<br>8<i>h<\/i> = 80, so <i>h<\/i> = 10.<br>Answer: <b>10<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A cylindrical water tank has an inside diameter of 1 meter and an inside height of 2 meters. Which of the following is closest to the number of liters of water the tank holds when it is full? (1 cubic meter = 1,000 liters)", "opts": ["157", "6,283", "1,571", "15,708"], "ans": 2, "sol": "The radius is 0.5 m: <i>V<\/i> = π(0.5)<sup>2<\/sup>(2) = 0.5π ≈ 1.5708 cubic meters.<br>1.5708 × 1,000 ≈ 1,571 liters.<br>Answer: <b>1,571<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "A grain bin is shaped like a cylinder with a hemisphere on top. The cylinder and the hemisphere each have a radius of 6 feet, and the cylinder is 10 feet tall. The volume of the bin is <i>k<\/i>π cubic feet. What is the value of <i>k<\/i>?", "ans": ["504"], "sol": "Cylinder: π(6)<sup>2<\/sup>(10) = 360π.<br>Hemisphere: <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>π(6)<sup>3<\/sup> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>π(216) = 144π.<br>Total: 360π + 144π = 504π.<br>Answer: <b>504<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A cardboard box with no lid is 20 centimeters long, 15 centimeters wide and 10 centimeters tall. How many square centimeters of cardboard are needed to make the box, assuming no overlap?", "opts": ["1,300", "3,000", "700", "1,000"], "ans": 3, "sol": "Bottom only (no lid): 20 × 15 = 300.<br>Sides: 2(20 × 10) + 2(15 × 10) = 400 + 300 = 700.<br>Total: 300 + 700 = 1,000.<br>Answer: <b>1,000<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "The right circular cylinder shown has a radius of 3 centimeters and a height of 6 centimeters. Which of the following is closest to the volume of the cylinder, in cubic centimeters?<svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Right circular cylinder with a dashed radius of 3 cm on the top base and a height of 6 cm marked on the right side.\"><ellipse class=\"fg-edge\" cx=\"108\" cy=\"56\" rx=\"64\" ry=\"17.92\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"44\" y1=\"56\" x2=\"44\" y2=\"184\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"172\" y1=\"56\" x2=\"172\" y2=\"184\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"6\"/><path class=\"fg-edge\" d=\"M44,184 A64,17.92 0 0 0 172,184\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M44,184 A64,17.92 0 0 1 172,184\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"108\" y1=\"56\" x2=\"172\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"3\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"108\" cy=\"56\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"140\" y=\"32.08\" text-anchor=\"middle\">3 cm<\/text><text x=\"180\" y=\"124\" text-anchor=\"start\">6 cm<\/text><\/g><\/svg>", "opts": ["57", "113", "170", "679"], "ans": 2, "sol": "<i>V<\/i> = π(3)<sup>2<\/sup>(6) = 54π.<br>54π ≈ 169.6, which is closest to 170.<br>Answer: <b>170<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "A right circular cone has a base diameter of 10 inches and a height of 6 inches. The volume of the cone is <i>k<\/i>π cubic inches. What is the value of <i>k<\/i>?", "ans": ["50"], "sol": "The radius is 10 ÷ 2 = 5.<br><i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π(5)<sup>2<\/sup>(6) = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π(150) = 50π.<br>Answer: <b>50<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The total surface area of a cube is 150 square feet. What is the volume of the cube, in cubic feet?", "opts": ["625", "15,625", "125", "25"], "ans": 2, "sol": "Each of the 6 faces has area 150 ÷ 6 = 25, so the edge is √25 = 5.<br><i>V<\/i> = 5<sup>3<\/sup> = 125.<br>Answer: <b>125<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A right prism has bases that are right triangles with sides of 3, 4 and 5 inches. The length of the prism, the distance between the two bases, is 10 inches. What is the total surface area of the prism, in square inches?", "opts": ["132", "126", "60", "120"], "ans": 0, "sol": "Two triangular bases: 2 × <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(3)(4) = 12.<br>Three rectangles: (3 + 4 + 5) × 10 = 120.<br>Total: 12 + 120 = 132.<br>Answer: <b>132<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The inside of a cooler is a rectangular box with a base of 40 centimeters by 30 centimeters. The cooler holds exactly 18 liters when it is filled to the top. What is the inside height of the cooler, in centimeters? (1 liter = 1,000 cubic centimeters)", "opts": ["1.5", "150", "15", "0.015"], "ans": 2, "sol": "18 liters = 18,000 cubic centimeters.<br>40 × 30 × <i>h<\/i> = 18,000, so 1,200<i>h<\/i> = 18,000.<br><i>h<\/i> = 15.<br>Answer: <b>15<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "A rectangular sandbox is 2.5 meters long and 1.6 meters wide. It is filled with sand to a depth of 0.3 meter. How many cubic meters of sand are in the sandbox?", "ans": ["1.2", "6/5"], "sol": "Use the depth of the sand as the height.<br><i>V<\/i> = 2.5 × 1.6 × 0.3 = 4 × 0.3 = 1.2.<br>Answer: <b>1.2<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A pyramid has a square base with edges of 10 centimeters. The slant height of each triangular face, measured from the apex to the midpoint of a base edge, is 13 centimeters. What is the volume of the pyramid, in cubic centimeters?", "opts": ["<span class=\"fq\"><span>1300<\/span><span>3<\/span><\/span>", "400", "1,200", "1,300"], "ans": 1, "sol": "The height, half a base edge (5) and the slant height form a right triangle: <i>h<\/i> = √(13<sup>2<\/sup> − 5<sup>2<\/sup>) = 12.<br><i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(10<sup>2<\/sup>)(12) = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(1,200) = 400.<br>Answer: <b>400<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A rectangular prism has a square base with sides of length (<i>x<\/i> − 1) units, and its height is 4 units, where <i>x<\/i> &gt; 1. Which expression represents the volume of the prism, in cubic units?", "opts": ["4<i>x<\/i><sup>2<\/sup> + 4", "4<i>x<\/i><sup>2<\/sup> − 4", "4<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> + 4", "4<i>x<\/i> − 4"], "ans": 2, "sol": "<i>V<\/i> = (area of base)(height) = 4(<i>x<\/i> − 1)<sup>2<\/sup>.<br>(<i>x<\/i> − 1)<sup>2<\/sup> = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + 1, so <i>V<\/i> = 4<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> + 4.<br>Answer: <b>4<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> + 4<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A mixing bowl is shaped like a hemisphere with an inside radius of 9 centimeters. To the nearest cubic centimeter, what volume of liquid can the bowl hold?", "ans": ["1527"], "sol": "Hemisphere: <i>V<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>π(9)<sup>3<\/sup> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>π(729) = 486π.<br>486π ≈ 1,526.8.<br>Answer: <b>1527<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A pyramid has a square base, and its height is equal to the length of a base edge. The volume of the pyramid is 72 cubic meters. What is the length of a base edge, in meters?", "opts": ["∛72", "6", "24", "216"], "ans": 1, "sol": "Let the edge be <i>s<\/i>, so the height is also <i>s<\/i>: <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>s<\/i><sup>2<\/sup>(<i>s<\/i>) = 72.<br><i>s<\/i><sup>3<\/sup> = 216, so <i>s<\/i> = ∛216 = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The curved (lateral) surface of a closed cylinder has an area of 60π square inches, and the radius of the cylinder is 3 inches. What is the total surface area of the cylinder, in square inches?", "opts": ["69π", "90π", "66π", "78π"], "ans": 3, "sol": "Two bases: 2π(3)<sup>2<\/sup> = 18π.<br>Total: 18π + 60π = 78π.<br>Answer: <b>78π<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A wooden candle holder is a solid cylinder with a cone-shaped hollow cut into it, as shown. The cone has the top of the cylinder as its base, and its vertex is at the center of the bottom of the cylinder. The radius is 4 inches and the height is 9 inches. What is the volume of the wood, in cubic inches?<svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria- 2<\/sup>(9) = 48π.<br>Wood: 144π − 48π = 96π.<br>Answer: <b>96π<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The height of a right circular cylinder is twice its radius. The volume of the cylinder is 128π cubic centimeters. What is the radius of the cylinder, in centimeters?", "opts": ["4", "8", "16", "64"], "ans": 0, "sol": "With <i>h<\/i> = 2<i>r<\/i>: π<i>r<\/i><sup>2<\/sup>(2<i>r<\/i>) = 2π<i>r<\/i><sup>3<\/sup> = 128π.<br><i>r<\/i><sup>3<\/sup> = 64, so <i>r<\/i> = 4.<br>Answer: <b>4<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A cube with edges of 6 inches is cut into two identical rectangular prisms by a single cut parallel to one face. What is the total surface area of the two pieces combined, in square inches?", "opts": ["216", "432", "252", "288"], "ans": 3, "sol": "Each piece is 6 by 6 by 3: SA = 2(36 + 18 + 18) = 144.<br>Two pieces: 2 × 144 = 288.<br>(The cut adds two new 6 by 6 faces to the cube's 216.)<br>Answer: <b>288<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Water is poured into an empty rectangular tank at a rate of 4 liters per minute. The tank is 80 centimeters long and 50 centimeters wide. What is the depth of the water after 5 minutes, in centimeters? (1 liter = 1,000 cubic centimeters)", "opts": ["5", "0.5", "50", "20"], "ans": 0, "sol": "Water added: 4 × 5 = 20 liters = 20,000 cubic centimeters.<br>80 × 50 × <i>d<\/i> = 20,000, so 4,000<i>d<\/i> = 20,000.<br><i>d<\/i> = 5.<br>Answer: <b>5<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A sphere and a right circular cone each have a radius of 3 feet, and they have equal volumes. What is the height of the cone, in feet?", "opts": ["4", "36", "27", "12"], "ans": 3, "sol": "Sphere: <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π(3)<sup>3<\/sup> = 36π.<br>Cone: <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π(3)<sup>2<\/sup><i>h<\/i> = 3π<i>h<\/i>.<br>3π<i>h<\/i> = 36π, so <i>h<\/i> = 12.<br>Answer: <b>12<\/b>"}, {"lo": "LO1", "diff": "X", "type": "spr", "q": "Three faces of a closed rectangular box meet at one corner. Their areas are 24, 32 and 48 square centimeters. What is the volume of the box, in cubic centimeters?", "ans": ["192"], "sol": "Let the edges be <i>a<\/i>, <i>b<\/i> and <i>c<\/i>, with <i>a<\/i><i>b<\/i> = 24, <i>a<\/i><i>c<\/i> = 32 and <i>b<\/i><i>c<\/i> = 48.<br>Multiply: (<i>a<\/i><i>b<\/i><i>c<\/i>)<sup>2<\/sup> = 24 × 32 × 48 = 36,864.<br><i>a<\/i><i>b<\/i><i>c<\/i> = √36,864 = 192 (the edges are 4, 6 and 8).<br>Answer: <b>192<\/b>"}, {"lo": "LO5", "diff": "X", "type": "mcq", "q": "The cylindrical tank shown has an inside radius of 6 centimeters and an inside height of 20 centimeters. It contains water to a depth of 10 centimeters. A solid metal ball with a radius of 3 centimeters is placed in the tank and sinks to the bottom, fully under water. What is the new depth of the water, in centimeters?<svg class=\"fig\" viewBox=\"0 0 250 270\" role=\"img\" aria-label=\"Cylindrical tank with radius 6 cm and height 20 cm. The lower part is shaded to show water with a depth of 10 cm, marked by a dashed segment on the left.\"><path class=\"fg-shape\" d=\"M72.14,135 L72.14,219.76 A50.86,14.24 0 0 0 173.86,219.76 L173.86,135 A50.86,14.24 0 0 0 72.14,135 Z\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"none\"/><ellipse class=\"fg-edge\" cx=\"123\" cy=\"135\" rx=\"50.86\" ry=\"14.24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><line class=\"fg-edge\" x1=\"62.14\" y1=\"135\" x2=\"62.14\" y2=\"219.76\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\" data-v=\"10\"/><ellipse class=\"fg-edge\" cx=\"123\" cy=\"50.24\" rx=\"50.86\" ry=\"14.24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"72.14\" y1=\"50.24\" x2=\"72.14\" y2=\"219.76\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"173.86\" y1=\"50.24\" x2=\"173.86\" y2=\"219.76\" stroke=\"currentColor\" stroke-width=\"2\" data-v=\"20\"/><path class=\"fg-edge\" d=\"M72.14,219.76 A50.86,14.24 0 0 0 173.86,219.76\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path class=\"fg-edge\" d=\"M72.14,219.76 A50.86,14.24 0 0 1 173.86,219.76\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"123\" y1=\"50.24\" x2=\"173.86\" y2=\"50.24\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" data-v=\"6\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"123\" cy=\"50.24\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"56.14\" y=\"181.38\" text-anchor=\"end\">10 cm<\/text><text x=\"148.43\" y=\"30\" text-anchor=\"middle\">6 cm<\/text><text x=\"181.86\" y=\"139\" text-anchor=\"start\">20 cm<\/text><\/g><\/svg>", "opts": ["1", "11", "10.75", "10.25"], "ans": 1, "sol": "The ball pushes up a volume of water equal to its own: <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π(3)<sup>3<\/sup> = 36π.<br>Spread over the base π(6)<sup>2<\/sup> = 36π, the rise is 36π ÷ 36π = 1.<br>New depth: 10 + 1 = 11.<br>Answer: <b>11<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "A sphere fits exactly inside a right circular cylinder, so that it touches the top, the bottom and the curved side of the cylinder. What is the ratio of the volume of the sphere to the volume of the cylinder?", "opts": ["<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>"], "ans": 0, "sol": "If the sphere has radius <i>r<\/i>, the cylinder has radius <i>r<\/i> and height 2<i>r<\/i>, so its volume is π<i>r<\/i><sup>2<\/sup>(2<i>r<\/i>) = 2π<i>r<\/i><sup>3<\/sup>.<br>Ratio: <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>π<i>r<\/i><sup>3<\/sup> ÷ 2π<i>r<\/i><sup>3<\/sup> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "X", "type": "spr", "q": "A closed right circular cylinder has a radius of 4 units. The number of square units in its total surface area is equal to the number of cubic units in its volume. What is the height of the cylinder?", "ans": ["4"], "sol": "Surface area: 2π(4)<sup>2<\/sup> + 2π(4)<i>h<\/i> = 32π + 8π<i>h<\/i>. Volume: π(4)<sup>2<\/sup><i>h<\/i> = 16π<i>h<\/i>.<br>32π + 8π<i>h<\/i> = 16π<i>h<\/i>, so 8π<i>h<\/i> = 32π.<br><i>h<\/i> = 4.<br>Answer: <b>4<\/b>"}], "unit_no": 4, "topic_no": "2", "code": "2.2"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

/* ---------- shared question widget ---------- */
function qBody(q, sel, name){
  var h='<div class="qtext">'+q.q+'</div>';
  if(q.type==='spr'){
    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';
  } else {
    h+='<div class="opts" role="radiogroup">'+q.opts.map(function(o,k){ return '<button type="button" class="opt" role="radio" aria-checked="'+(sel===k)+'" data-k="'+k+'"><span class="let">'+letter(k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';
  }
  return h;
}

  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
