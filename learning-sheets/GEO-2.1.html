var S = {"id": "GEO-2.1", "unit": "Geometry and Trigonometry", "topic": "Area and volume", "title": "Perimeter and area of plane figures", "intro": "This subtopic covers the perimeter and area of rectangles, triangles, parallelograms, trapezoids and circles, and of composite and shaded figures built from them. On the DSAT these appear as direct formula questions, as real-world problems about fences, floors and gardens, and as questions where you work backward from a given area or perimeter, sometimes in the <i>x<\/i><i>y<\/i>-plane.", "los": [{"id": "LO1", "text": "Calculate the perimeter and area of rectangles, triangles, parallelograms and trapezoids, using a height that is perpendicular to the base."}, {"id": "LO2", "text": "Calculate the circumference and area of a circle or semicircle, and find the radius from a given circumference or area."}, {"id": "LO3", "text": "Determine the area or perimeter of composite and shaded-region figures by adding and subtracting the areas of simpler shapes."}, {"id": "LO4", "text": "Determine a missing dimension from a given area or perimeter, including figures whose side lengths are algebraic expressions."}, {"id": "LO5", "text": "Determine the area and perimeter of figures in the xy-plane from the coordinates of their vertices."}], "notes": [{"lo": "LO1", "h": "Rectangles and triangles", "html": "<p>The <b>perimeter<\/b> of a figure is the total length of its boundary, measured in units such as meters. The <b>area<\/b> is the amount of surface inside it, measured in square units such as square meters.<\/p><div class=\"eqs\">Rectangle: <i>P<\/i> = 2<i>l<\/i> + 2<i>w<\/i>, &nbsp;<i>A<\/i> = <i>l<\/i><i>w<\/i><br>Triangle: <i>A<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>b<\/i><i>h<\/i><\/div><p>In a triangle, the height <i>h<\/i> is the <b>perpendicular<\/b> distance from the base to the opposite vertex. In a right triangle the two legs are perpendicular, so the area is half the product of the legs. In an obtuse triangle the height can fall <b>outside<\/b> the triangle, meeting the extension of the base.<\/p><div class=\"rule\">Base and height must be perpendicular. A slanted side is never the height.<\/div><div class=\"tip\">DSAT tip: the reference sheet lists <i>A<\/i> = <i>l<\/i><i>w<\/i>, <i>A<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>b<\/i><i>h<\/i>, <i>A<\/i> = π<i>r<\/i><sup>2<\/sup> and <i>C<\/i> = 2π<i>r<\/i>. It gives no perimeter formulas, so add up every side yourself.<\/div>"}, {"lo": "LO1", "h": "Parallelograms and trapezoids", "html": "<p>A parallelogram can be cut along a height and rearranged into a rectangle, so its area is base times height. A trapezoid has two parallel sides, called its bases; its area is the <b>average<\/b> of the bases times the height.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Figure<\/th><th>Area<\/th><th>The height is<\/th><\/tr><tr><td>Parallelogram<\/td><td><i>A<\/i> = <i>b<\/i><i>h<\/i><\/td><td>the distance between a pair of parallel sides<\/td><\/tr><tr><td>Trapezoid<\/td><td><i>A<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(<i>b<\/i><sub>1<\/sub> + <i>b<\/i><sub>2<\/sub>)<i>h<\/i><\/td><td>the distance between the two bases<\/td><\/tr><\/table><\/div><div class=\"rule\">The height of a parallelogram or trapezoid is not a slanted side. Look for the dashed segment with a right-angle mark.<\/div><p>For example, a trapezoid with bases 8 and 14 and height 5 has area <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(8 + 14)(5) = 55. Neither formula is on the reference sheet, so learn them, or split the shape into a rectangle and triangles. For the perimeter, add all four sides, including the slanted ones.<\/p>"}, {"lo": "LO2", "h": "Circumference and area of a circle", "html": "<p>For a circle with radius <i>r<\/i> and diameter <i>d<\/i> = 2<i>r<\/i>:<\/p><div class=\"eqs\"><i>C<\/i> = 2π<i>r<\/i> = π<i>d<\/i><br><i>A<\/i> = π<i>r<\/i><sup>2<\/sup><\/div><p>Circumference is a length, so it uses <i>r<\/i>; area is measured in square units, so it uses <i>r<\/i><sup>2<\/sup>. Both formulas need the <b>radius<\/b>, so if you are given the diameter, halve it first. You can also work backward: if <i>A<\/i> = 100π, then <i>r<\/i><sup>2<\/sup> = 100, so <i>r<\/i> = 10 and <i>C<\/i> = 20π.<\/p><div class=\"rule\">Find <i>r<\/i> first. From the circumference, <i>r<\/i> = <span class=\"fq\"><span><i>C<\/i><\/span><span>2π<\/span><\/span>; from the area, <i>r<\/i><sup>2<\/sup> = <span class=\"fq\"><span><i>A<\/i><\/span><span>π<\/span><\/span>.<\/div><p>A <b>semicircle<\/b> has half the area of its circle, <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>π<i>r<\/i><sup>2<\/sup>. The perimeter of a semicircular region is the curved part plus the diameter: π<i>r<\/i> + 2<i>r<\/i>.<\/p><div class=\"tip\">Leave answers in terms of π unless the question asks for an approximation. For a decimal, use the π key on the calculator rather than 3.<\/div>"}, {"lo": "LO3", "h": "Composite figures: add the pieces", "html": "<p>A composite figure is made of simple shapes. To find its area, split it into rectangles, triangles or parts of circles that do not overlap, find each area, and add.<\/p><p>Missing side lengths come from the labeled ones. In a figure whose corners are all right angles, the horizontal lengths along the top add up to the horizontal lengths along the bottom, and the vertical lengths on the left add up to those on the right.<\/p><div class=\"rule\">Area: add the areas of non-overlapping pieces. Perimeter: walk once around the outside boundary and add only those lengths.<\/div><p>Perimeter does not add the way area does. A cut line you draw is inside the figure, so it is not part of the perimeter. When a semicircle sits on a side of a rectangle, that side is replaced by the arc: count the curved length π<i>r<\/i>, not the diameter.<\/p><div class=\"tip\">DSAT tip: copy the figure on your scratch paper, draw the cut lines, and write each piece's area inside it before you add.<\/div>"}, {"lo": "LO3", "h": "Shaded regions: subtract", "html": "<p>When a shaded region is what is left after one shape is removed from another, subtract:<\/p><div class=\"eqs\">shaded area = area of the whole figure − area of the unshaded part<\/div><p>For example, a 10 by 10 square with a 6 by 4 rectangle cut out of it has a shaded area of 100 − 24 = 76 square units.<\/p><div class=\"rule\">Shaded = whole − hole. Find each area separately, then subtract. If the answer choices contain π, leave your answer in that form, such as 64 − 16π.<\/div><p>Look for how the pieces are related. A circle inscribed in a square has a diameter equal to the side of the square. Four quarter circles with the same radius make one whole circle. A ring between two circles with the same center has area π<i>r<\/i><sub>1<\/sub><sup>2<\/sup> − π<i>r<\/i><sub>2<\/sub><sup>2<\/sup>, which is not the same as π(<i>r<\/i><sub>1<\/sub> − <i>r<\/i><sub>2<\/sub>)<sup>2<\/sup>.<\/p>"}, {"lo": "LO4", "h": "Working backward to a missing dimension", "html": "<p>When the area or perimeter is given, write the formula, substitute what you know, and solve for the unknown.<\/p><div class=\"eqs\">Rectangle with area 72 and width 6: 6<i>l<\/i> = 72, so <i>l<\/i> = 12<br>Rectangle with perimeter 40 and length 13: 2(13) + 2<i>w<\/i> = 40, so <i>w<\/i> = 7<\/div><p>If the side lengths are algebraic expressions, the equation may be quadratic. A rectangle with width <i>x<\/i> and length <i>x<\/i> + 4 and area 60 gives <i>x<\/i>(<i>x<\/i> + 4) = 60, so <i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> − 60 = 0 and (<i>x<\/i> + 10)(<i>x<\/i> − 6) = 0.<\/p><div class=\"rule\">A length must be positive. Reject any solution that makes a side zero or negative, then answer the question actually asked: the width, the length, the perimeter or the area.<\/div><div class=\"tip\">Desmos tip: graph <i>y<\/i> = <i>x<\/i>(<i>x<\/i> + 4) and <i>y<\/i> = 60 and read the intersection with positive <i>x<\/i>, which is <i>x<\/i> = 6.<\/div>"}, {"lo": "LO5", "h": "Area in the xy-plane", "html": "<p>The length of a horizontal segment is the difference of the <i>x<\/i>-coordinates of its endpoints; the length of a vertical segment is the difference of the <i>y<\/i>-coordinates. Subtract rather than counting grid dots: from <i>x<\/i> = −2 to <i>x<\/i> = 5 is 5 − (−2) = 7 units.<\/p><p>If a triangle has a horizontal side, use it as the base. The height is the vertical distance from the third vertex to that side. The triangle with vertices (0, −1), (6, −1) and (2, 4) has base 6 and height 4 − (−1) = 5, so its area is <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(6)(5) = 15.<\/p><div class=\"rule\">If no side is horizontal or vertical, use the box method: enclose the figure in the smallest rectangle with horizontal and vertical sides, then subtract the right triangles in the corners.<\/div><p>For the perimeter, a slanted side needs the distance formula, which comes from the Pythagorean theorem.<\/p><div class=\"tip\">Desmos tip: type polygon((0, −1), (6, −1), (2, 4)) to see the figure before you compute.<\/div>"}], "examples": [{"lo": "LO1", "q": "A trapezoid has parallel sides of lengths 9 centimeters and 15 centimeters, and the distance between them is 6 centimeters. What is the area of the trapezoid?", "steps": ["The parallel sides are the bases, so <i>b<\/i><sub>1<\/sub> = 9 and <i>b<\/i><sub>2<\/sub> = 15. The distance between them is the height, <i>h<\/i> = 6.", "Average the bases: <span class=\"fq\"><span>9 + 15<\/span><span>2<\/span><\/span> = 12.", "Multiply by the height: 12 × 6 = 72."], "ans": "72 square centimeters"}, {"lo": "LO2", "q": "A circle has a circumference of 18π inches. What is the area of the circle, in square inches?", "steps": ["Use <i>C<\/i> = 2π<i>r<\/i>: 2π<i>r<\/i> = 18π, so <i>r<\/i> = 9.", "Use <i>A<\/i> = π<i>r<\/i><sup>2<\/sup>: <i>A<\/i> = π(9)<sup>2<\/sup> = 81π.", "Check the units: area is in square inches, and 81π is about 254.5."], "ans": "81π square inches"}, {"lo": "LO3", "q": "Find the area and the perimeter of the figure shown. All corners are right angles.<svg class=\"fig\" viewBox=\"0 0 260 195\" role=\"img\" aria-label=\"L-shaped figure. The bottom side is 14 and the left side is 10. A 6 by 4 rectangular notch is cut from the top right corner: the horizontal edge of the notch is 6 and its vertical edge is 4. All corners are right angles.\"><polygon class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" points=\"35,170 231,170 231,86 147,86 147,30 35,30\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"35,170 231,170 231,86 147,86 147,30 35,30\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"133\" y=\"190\" text-anchor=\"middle\">14<\/text><text x=\"22\" y=\"104\" text-anchor=\"middle\">10<\/text><text x=\"189\" y=\"80\" text-anchor=\"middle\">6<\/text><text x=\"158\" y=\"62\" text-anchor=\"middle\">4<\/text><\/g><\/svg>", "steps": ["Find the missing sides. The right side is 10 − 4 = 6, and the top side is 14 − 6 = 8.", "Area: the whole 14 by 10 rectangle is 140, and the notch is 6 × 4 = 24, so the area is 140 − 24 = 116.", "Perimeter: walk around the figure: 14 + 6 + 6 + 4 + 8 + 10 = 48.", "Notice that the perimeter equals that of the full 14 by 10 rectangle, 2(14) + 2(10) = 48, because the notch only moves two sides inward."], "ans": "Area 116 square units; perimeter 48 units"}, {"lo": "LO4", "q": "A rectangle has a perimeter of 30 meters and an area of 54 square meters. What are its length and width?", "steps": ["From the perimeter, 2<i>l<\/i> + 2<i>w<\/i> = 30, so <i>l<\/i> + <i>w<\/i> = 15 and <i>w<\/i> = 15 − <i>l<\/i>.", "Substitute into the area: <i>l<\/i>(15 − <i>l<\/i>) = 54, so <i>l<\/i><sup>2<\/sup> − 15<i>l<\/i> + 54 = 0.", "Factor: (<i>l<\/i> − 6)(<i>l<\/i> − 9) = 0, so the two side lengths are 9 and 6. Check: 2(9) + 2(6) = 30 and 9 × 6 = 54."], "ans": "9 meters by 6 meters"}, {"lo": "LO5", "q": "In the <i>x<\/i><i>y<\/i>-plane, a triangle has vertices (−1, 0), (5, 2) and (2, 6). What is the area of the triangle?", "steps": ["No side is horizontal or vertical, so use the box method. The box runs from <i>x<\/i> = −1 to <i>x<\/i> = 5 and from <i>y<\/i> = 0 to <i>y<\/i> = 6, so its area is 6 × 6 = 36.", "Corner triangles: from (−1, 0) to (5, 2) gives <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(6)(2) = 6; from (5, 2) to (2, 6) gives <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(3)(4) = 6; from (2, 6) to (−1, 0) gives <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(3)(6) = 9.", "Area = 36 − (6 + 6 + 9) = 15."], "ans": "15 square units"}, {"lo": "LO3", "q": "A circular rug with a radius of 3 meters lies on a rectangular floor that is 10 meters long and 8 meters wide. To the nearest tenth of a square meter, what is the area of the floor that is not covered by the rug?", "steps": ["Floor: 10 × 8 = 80.", "Rug: π(3)<sup>2<\/sup> = 9π.", "Uncovered area = 80 − 9π ≈ 80 − 28.27 = 51.73, which rounds to 51.7."], "ans": "About 51.7 square meters"}], "traps": ["Using a slanted side as the height. In a parallelogram, a trapezoid or an obtuse triangle, the height is the perpendicular distance, often a dashed segment, not a side of the figure.", "Forgetting the <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> in the triangle and trapezoid formulas, or adding a <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> to the parallelogram formula, which is simply <i>A<\/i> = <i>b<\/i><i>h<\/i>.", "Putting the diameter into π<i>r<\/i><sup>2<\/sup> or 2π<i>r<\/i>. Halve the diameter first: a circle with diameter 10 has area 25π, not 100π.", "Mixing up circumference and area: 2π<i>r<\/i> is a length in units, while π<i>r<\/i><sup>2<\/sup> is an area in square units.", "In a composite perimeter, counting segments that lie inside the figure, or forgetting the straight diameter edge of a semicircular region.", "Keeping a negative solution for a length, or stopping at <i>x<\/i> when the question asks for a side length, the perimeter or the area."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A rectangular vegetable garden is 14 meters long and 9 meters wide. A gardener wants to put a fence along all four sides. How many meters of fencing are needed?", "opts": ["23", "37", "46", "126"], "ans": 2, "sol": "Perimeter of a rectangle: <i>P<\/i> = 2<i>l<\/i> + 2<i>w<\/i>.<br><i>P<\/i> = 2(14) + 2(9) = 28 + 18 = 46.<br>Answer: <b>46<\/b>", "hint": "Fencing goes all the way around, so each of the four sides is counted once."}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "A triangle has a base of 12 centimeters and a height of 7 centimeters. What is the area of the triangle, in square centimeters?", "opts": ["19", "38", "42", "84"], "ans": 2, "sol": "<i>A<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>b<\/i><i>h<\/i>.<br><i>A<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(12)(7) = 42.<br>Answer: <b>42<\/b>", "hint": "A triangle is half of a rectangle with the same base and height."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "In the parallelogram shown, the dashed segment is perpendicular to the base. What is the area of the parallelogram?<svg class=\"fig\" viewBox=\"0 0 270 120\" role=\"img\" aria-label=\"Parallelogram with a horizontal base of length 10 and slanted sides of length 5. A dashed segment of length 4 drops from the top left vertex perpendicular to the base, with a right-angle mark.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"30,95 200,95 251,27 81,27\"/><line class=\"fg-edge\" x1=\"81\" y1=\"27\" x2=\"81\" y2=\"95\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"89,95 89,87 81,87\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"115\" y=\"115\" text-anchor=\"middle\">10<\/text><text x=\"43.5\" y=\"65\" text-anchor=\"middle\">5<\/text><text x=\"90\" y=\"65\" text-anchor=\"middle\">4<\/text><\/g><\/svg>", "opts": ["20", "30", "40", "50"], "ans": 2, "sol": "The area of a parallelogram is base × height, where the height is perpendicular to the base.<br>The base is 10 and the height is 4. The side of length 5 is slanted, so it is not the height.<br>Area = 10 × 4 = 40.<br>Answer: <b>40<\/b>", "hint": "Which labeled length meets the base at a right angle?"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A circle has a radius of 6 inches. What is the area of the circle, in square inches?", "opts": ["6π", "12π", "36π", "144π"], "ans": 2, "sol": "<i>A<\/i> = π<i>r<\/i><sup>2<\/sup>.<br><i>A<\/i> = π(6)<sup>2<\/sup> = 36π.<br>Answer: <b>36π<\/b>", "hint": "Choose the area formula, not the circumference formula, from the reference sheet."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "The area of a circle is 49π square units. The circumference of the circle is <i>k<\/i>π units. What is the value of <i>k<\/i>?", "ans": ["14"], "sol": "π<i>r<\/i><sup>2<\/sup> = 49π, so <i>r<\/i><sup>2<\/sup> = 49 and <i>r<\/i> = 7.<br><i>C<\/i> = 2π(7) = 14π.<br>Answer: <b>14<\/b>", "hint": "Use the area to find the radius first."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "The figure shows a rectangle with a triangle on top. The dashed segment of length 3 is the height of the triangle. What is the area of the whole figure?<svg class=\"fig\" viewBox=\"0 0 230 210\" role=\"img\" aria-label=\"Figure made of a rectangle with a triangle on top. The rectangle has bottom side 8 and left side 5. A dashed horizontal segment separates the rectangle from the triangle, and a dashed segment of length 3 from the top vertex is perpendicular to it.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"35,185 195,185 195,85 115,25 35,85\"/><line class=\"fg-edge\" x1=\"35\" y1=\"85\" x2=\"195\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"115\" y1=\"85\" x2=\"115\" y2=\"25\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"123,85 123,77 115,77\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"115\" y=\"205\" text-anchor=\"middle\">8<\/text><text x=\"23\" y=\"139\" text-anchor=\"middle\">5<\/text><text x=\"124\" y=\"63\" text-anchor=\"middle\">3<\/text><\/g><\/svg>", "opts": ["26", "40", "52", "64"], "ans": 2, "sol": "Rectangle: 8 × 5 = 40.<br>Triangle: its base is the top of the rectangle, 8, and its height is 3, so its area is <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(8)(3) = 12.<br>Total: 40 + 12 = 52.<br>Answer: <b>52<\/b>", "hint": "Split the figure along the dashed horizontal segment and find the area of each piece."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The figure shows a circle inscribed in a square with side length 10. What is the area of the shaded region?<svg class=\"fig\" viewBox=\"0 0 230 230\" role=\"img\" aria-label=\"Square with side length 10. A circle is inscribed in the square, touching all four sides. The four corner regions inside the square but outside the circle are shaded.\"><path class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" fill-rule=\"evenodd\" d=\"M 25 200 L 205 200 L 205 20 L 25 20 Z M 205 110 A 90 90 0 1 0 25 110 A 90 90 0 1 0 205 110 Z\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"25,200 205,200 205,20 25,20\"/><circle class=\"fg-edge\" cx=\"115\" cy=\"110\" r=\"90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"115\" y=\"220\" text-anchor=\"middle\">10<\/text><\/g><\/svg>", "opts": ["25π", "100 − 10π", "100 − 25π", "100 − 100π"], "ans": 2, "sol": "The circle touches all four sides, so its diameter is 10 and its radius is 5.<br>Square: 10<sup>2<\/sup> = 100. Circle: π(5)<sup>2<\/sup> = 25π.<br>Shaded area = 100 − 25π.<br>Answer: <b>100 − 25π<\/b>", "hint": "How is the diameter of the circle related to the side of the square?"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A running track has two straight sides, each 100 meters long, and two semicircular ends, as shown. The dashed segment, a diameter of one end, is 64 meters long. What is the distance once around the track, to the nearest meter?<svg class=\"fig\" viewBox=\"0 0 260 130\" role=\"img\" aria-label=\"Running track made of two parallel straight sides, each 100 long, joined by two semicircular ends. A dashed diameter of length 64 is drawn across the right end.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"67.5,105 192.5,105 195.12,104.91 197.72,104.66 200.3,104.23 202.85,103.64 205.36,102.88 207.81,101.96 210.19,100.87 212.5,99.64 214.72,98.26 216.85,96.73 218.87,95.07 220.78,93.28 222.57,91.37 224.23,89.35 225.76,87.22 227.14,85 228.37,82.69 229.46,80.31 230.38,77.86 231.14,75.35 231.73,72.8 232.16,70.22 232.41,67.62 232.5,65 232.41,62.38 232.16,59.78 231.73,57.2 231.14,54.65 230.38,52.14 229.46,49.69 228.37,47.31 227.14,45 225.76,42.78 224.23,40.65 222.57,38.63 220.78,36.72 218.87,34.93 216.85,33.27 214.72,31.74 212.5,30.36 210.19,29.13 207.81,28.04 205.36,27.12 202.85,26.36 200.3,25.77 197.72,25.34 195.12,25.09 192.5,25 67.5,25 64.88,25.09 62.28,25.34 59.7,25.77 57.15,26.36 54.64,27.12 52.19,28.04 49.81,29.13 47.5,30.36 45.28,31.74 43.15,33.27 41.13,34.93 39.22,36.72 37.43,38.63 35.77,40.65 34.24,42.78 32.86,45 31.63,47.31 30.54,49.69 29.62,52.14 28.86,54.65 28.27,57.2 27.84,59.78 27.59,62.38 27.5,65 27.59,67.62 27.84,70.22 28.27,72.8 28.86,75.35 29.62,77.86 30.54,80.31 31.63,82.69 32.86,85 34.24,87.22 35.77,89.35 37.43,91.37 39.22,93.28 41.13,95.07 43.15,96.73 45.28,98.26 47.5,99.64 49.81 e. What is the area of the shaded region?<svg class=\"fig\" viewBox=\"0 0 250 190\" role=\"img\" aria-label=\"Shaded five-sided region formed from a rectangle with bottom side 8 and left side 6 by removing a right triangle from the top right corner. The removed triangle is outlined with dashed segments: its horizontal leg is 3 and its vertical leg is 4.\"><polygon class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" points=\"38,162 214,162 214,118 148,30 38,30\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"38,162 214,162 214,118 148,30 38,30\"/><line class=\"fg-edge\" x1=\"148\" y1=\"30\" x2=\"214\" y2=\"30\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"214\" y1=\"30\" x2=\"214\" y2=\"118\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"126\" y=\"182\" text-anchor=\"middle\">8<\/text><text x=\"26\" y=\"100\" text-anchor=\"middle\">6<\/text><text x=\"181\" y=\"24\" text-anchor=\"middle\">3<\/text><text x=\"226\" y=\"78\" text-anchor=\"middle\">4<\/text><\/g><\/svg>", "ans": ["42"], "sol": "Rectangle: 8 × 6 = 48.<br>Removed triangle: <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(3)(4) = 6.<br>Shaded area = 48 − 6 = 42.<br>Answer: <b>42<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A rectangular rug has an area of 15 square meters and a length of 5 meters. What is the perimeter of the rug, in meters?", "opts": ["8", "10", "16", "30"], "ans": 2, "sol": "5<i>w<\/i> = 15, so <i>w<\/i> = 3.<br>Perimeter = 2(5) + 2(3) = 16.<br>Answer: <b>16<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "A trapezoid has an area of 66 square units. Its parallel sides have lengths 5 and 17. What is the distance between the parallel sides?", "ans": ["6"], "sol": "<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(5 + 17)<i>h<\/i> = 66.<br>11<i>h<\/i> = 66, so <i>h<\/i> = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A quadrilateral in the <i>x<\/i><i>y<\/i>-plane has vertices (−4, 1), (2, 1), (4, 5) and (−4, 5). What is the area of the quadrilateral?", "opts": ["28", "32", "48", "56"], "ans": 0, "sol": "The sides on <i>y<\/i> = 1 and <i>y<\/i> = 5 are parallel, so the figure is a trapezoid. Its bases are 2 − (−4) = 6 and 4 − (−4) = 8.<br>The height is 5 − 1 = 4.<br>Area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(6 + 8)(4) = 28.<br>Answer: <b>28<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A triangle in the <i>x<\/i><i>y<\/i>-plane has vertices (2, −3), (2, 5) and (−4, 1). What is the area of the triangle?", "opts": ["12", "14", "24", "48"], "ans": 2, "sol": "The side on <i>x<\/i> = 2 is vertical, with length 5 − (−3) = 8. Use it as the base.<br>The height is the horizontal distance from (−4, 1) to the line <i>x<\/i> = 2: 2 − (−4) = 6.<br>Area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(8)(6) = 24.<br>Answer: <b>24<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i> shown, <i>A<\/i><i>B<\/i> = 6 and <i>B<\/i><i>C<\/i> = 10. The dashed segment from <i>C<\/i> is perpendicular to the extension of side <i>A<\/i><i>B<\/i> and has length 8. What is the area of triangle <i>A<\/i><i>B<\/i><i>C<\/i>?<svg class=\"fig\" viewBox=\"0 0 260 180\" role=\"img\" aria-label=\"Obtuse triangle ABC with AB = 6 on a horizontal line and BC = 10. Side AB is extended to the right with a dashed segment, and a dashed segment of length 8 drops from C perpendicular to that extension, with a right-angle mark. The height lies outside the triangle.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"32,150 128,150 224,22\"/><line class=\"fg-edge\" x1=\"128\" y1=\"150\" x2=\"224\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"224\" y1=\"150\" x2=\"224\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"216,150 216,142 224,142\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"80\" y=\"170\" text-anchor=\"middle\">6<\/text><text x=\"188\" y=\"96\" text-anchor=\"middle\">10<\/text><text x=\"235\" y=\"90\" text-anchor=\"middle\">8<\/text><text x=\"22\" y=\"158\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"128\" y=\"170\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"224\" y=\"16\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><\/g><\/svg>", "opts": ["24", "30", "40", "48"], "ans": 0, "sol": "Use <i>A<\/i><i>B<\/i> = 6 as the base. The height is the perpendicular distance from <i>C<\/i> to the line through <i>A<\/i> and <i>B<\/i>, which is 8, even though it falls outside the triangle.<br>Area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(6)(8) = 24.<br>Answer: <b>24<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A circular fountain has a radius of 2 meters. A walkway 1.5 meters wide surrounds the fountain, so that the outer edge of the walkway is a circle with the same center as the fountain. What is the area of the walkway, in square meters?", "opts": ["2.25π", "3π", "4π", "8.25π"], "ans": 3, "sol": "The outer radius is 2 + 1.5 = 3.5.<br>Area of the walkway = π(3.5)<sup>2<\/sup> − π(2)<sup>2<\/sup> = 12.25π − 4π = 8.25π.<br>Answer: <b>8.25π<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A rectangle has side lengths (<i>x<\/i> + 3) inches and (<i>x<\/i> − 2) inches, and its area is 66 square inches. What is the perimeter of the rectangle, in inches?", "opts": ["17", "34", "38", "66"], "ans": 1, "sol": "(<i>x<\/i> + 3)(<i>x<\/i> − 2) = 66, so <i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 72 = 0.<br>(<i>x<\/i> + 9)(<i>x<\/i> − 8) = 0. Since <i>x<\/i> − 2 must be positive, <i>x<\/i> = 8.<br>The sides are 11 and 6, so the perimeter is 2(11) + 2(6) = 34.<br>Answer: <b>34<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "The length of a rectangle is 4 times its width, and the perimeter of the rectangle is 70 centimeters. What is the area of the rectangle, in square centimeters?", "ans": ["196"], "sol": "Let the width be <i>w<\/i>; the length is 4<i>w<\/i>.<br>2(4<i>w<\/i>) + 2<i>w<\/i> = 70, so 10<i>w<\/i> = 70 and <i>w<\/i> = 7.<br>The length is 28, so the area is 28 × 7 = 196.<br>Answer: <b>196<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "A triangle in the <i>x<\/i><i>y<\/i>-plane has vertices (−2, −1), (4, −1) and (4, 7). What is the perimeter of the triangle?", "ans": ["24"], "sol": "The horizontal side has length 4 − (−2) = 6, and the vertical side has length 7 − (−1) = 8.<br>The third side is the hypotenuse of a right triangle with legs 6 and 8: √(6<sup>2<\/sup> + 8<sup>2<\/sup>) = √100 = 10.<br>Perimeter = 6 + 8 + 10 = 24.<br>Answer: <b>24<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "In the isosceles triangle shown, the dashed segment is perpendicular to the base. What is the area of the triangle?<svg class=\"fig\" viewBox=\"0 0 220 212\" role=\"img\" aria-label=\"Isosceles triangle with base 10 and two equal sides of length 13. A dashed altitude of length 12 runs from the top vertex perpendicular to the base, with a right-angle mark.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"45,182 175,182 110,26\"/><line class=\"fg-edge\" x1=\"110\" y1=\"26\" x2=\"110\" y2=\"182\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"118,182 118,174 110,174\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"110\" y=\"202\" text-anchor=\"middle\">10<\/text><text x=\"63.5\" y=\"108\" text-anchor=\"middle\">13<\/text><text x=\"156.5\" y=\"108\" text-anchor=\"middle\">13<\/text><text x=\"119\" y=\"127.5\" text-anchor=\"middle\">12<\/text><\/g><\/svg>", "opts": ["60", "65", "120", "130"], "ans": 0, "sol": "The base is 10 and the height is the dashed segment, 12. The sides of length 13 are slanted.<br>Area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(10)(12) = 60.<br>Answer: <b>60<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A bicycle wheel has a diameter of 70 centimeters. The wheel makes 10 full turns without slipping. To the nearest meter, how far does the bicycle travel?", "opts": ["7", "11", "22", "44"], "ans": 2, "sol": "One turn covers one circumference: π(70) ≈ 219.9 centimeters.<br>Ten turns cover about 2199 centimeters, which is about 21.99 meters.<br>To the nearest meter, the distance is 22.<br>Answer: <b>22<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A window has the shape of a square with side length 8 feet topped by a semicircle. The diameter of the semicircle is the top side of the square. What is the area of the window, in square feet?", "opts": ["64 + 4π", "64 + 8π", "64 + 16π", "64 + 32π"], "ans": 1, "sol": "Square: 8<sup>2<\/sup> = 64.<br>Semicircle: the radius is 4, so the area is <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>π(4)<sup>2<\/sup> = 8π.<br>Total: 64 + 8π.<br>Answer: <b>64 + 8π<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A trapezoid has an area of 90 square units and a height of 6 units. Its longer parallel side is twice as long as its shorter parallel side. What is the length of the longer parallel side?", "opts": ["5", "10", "15", "20"], "ans": 3, "sol": "Let the shorter side be <i>b<\/i>; the longer side is 2<i>b<\/i>.<br><span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(<i>b<\/i> + 2<i>b<\/i>)(6) = 90, so 9<i>b<\/i> = 90 and <i>b<\/i> = 10.<br>The longer side is 2(10) = 20.<br>Answer: <b>20<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A parallelogram in the <i>x<\/i><i>y<\/i>-plane has vertices (1, 1), (7, 1), (9, 5) and (3, 5). What is the area of the parallelogram?", "opts": ["24", "28", "32", "48"], "ans": 0, "sol": "The side from (1, 1) to (7, 1) is horizontal, with length 7 − 1 = 6. Use it as the base.<br>The opposite side lies on <i>y<\/i> = 5, so the height is 5 − 1 = 4.<br>Area = 6 × 4 = 24.<br>Answer: <b>24<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "On a town map drawn in the <i>x<\/i><i>y<\/i>-plane, each unit represents 10 meters. A rectangular park has corners at (2, 3), (9, 3), (9, 8) and (2, 8). What is the actual area of the park, in square meters?", "opts": ["35", "240", "350", "3500"], "ans": 3, "sol": "On the map the park is 9 − 2 = 7 units by 8 − 3 = 5 units.<br>In meters it is 70 meters by 50 meters.<br>Area = 70 × 50 = 3500.<br>Answer: <b>3500<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A garden bed has the shape of a trapezoid. Its parallel sides are 4.5 meters and 7.5 meters long, and they are 3 meters apart. One bag of mulch covers 2.5 square meters. What is the least number of whole bags needed to cover the garden bed?", "opts": ["7", "8", "15", "18"], "ans": 1, "sol": "Area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(4.5 + 7.5)(3) = 18 square meters.<br>Bags: <span class=\"fq\"><span>18<\/span><span>2.5<\/span><\/span> = 7.2.<br>7 bags are not enough, so 8 bags are needed.<br>Answer: <b>8<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "A parallelogram has sides of lengths 15 and 8. The height to the side of length 15 is 4. What is the height to the side of length 8?", "ans": ["7.5", "15/2"], "sol": "Area = base × height = 15 × 4 = 60.<br>Using the side of length 8 as the base: 8<i>h<\/i> = 60.<br><i>h<\/i> = 7.5.<br>Answer: <b>7.5<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A semicircular region has a perimeter of 10π + 20 units. What is the area of the region?", "opts": ["10π", "20π", "25π", "50π"], "ans": 3, "sol": "The perimeter is π<i>r<\/i> + 2<i>r<\/i>. So π<i>r<\/i> + 2<i>r<\/i> = 10π + 20, which gives <i>r<\/i>(π + 2) = 10(π + 2) and <i>r<\/i> = 10.<br>Area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>π(10)<sup>2<\/sup> = 50π.<br>Answer: <b>50π<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "The area of a circle, in square units, is numerically equal to 3 times its circumference, in units. What is the diameter of the circle?", "ans": ["12"], "sol": "π<i>r<\/i><sup>2<\/sup> = 3(2π<i>r<\/i>) = 6π<i>r<\/i>.<br>Divide by π<i>r<\/i> (which is not 0): <i>r<\/i> = 6.<br>The diameter is 2(6) = 12.<br>Answer: <b>12<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The figure shows two circles of the same size inside a 12 by 6 rectangle. Each circle touches three sides of the rectangle and the other circle. What is the area of the shaded region?<svg class=\"fig\" viewBox=\"0 0 270 160\" role=\"img\" aria-label=\"Rectangle 12 long and 6 tall containing two equal circles side by side. Each circle touches the top and bottom of the rectangle, one short side, and the other circle. The region inside the rectangle and outside both circles is shaded.\"><path class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" fill-rule=\"evenodd\" d=\"M 27 130 L 243 130 L 243 22 L 27 22 Z M 135 76 A 54 54 0 1 0 27 76 A 54 54 0 1 0 135 76 Z M 243 76 A 54 54 0 1 0 135 76 A 54 54 0 1 0 243 76 Z\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"27,130 243,130 243,22 27,22\"/><circle class=\"fg-edge\" cx=\"81\" cy=\"76\" r=\"54\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><circle class=\"fg-edge\" cx=\"189\" cy=\"76\" r=\"54\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"135\" y=\"150\" text-anchor=\"middle\">12<\/text><text x=\"15\" y=\"80\" text-anchor=\"middle\">6<\/text><\/g><\/svg>", "opts": ["72 − 9π", "72 − 12π", "72 − 18π", "72 − 36π"], "ans": 2, "sol": "Each circle touches the top and bottom, so its diameter is 6 and its radius is 3.<br>Rectangle: 12 × 6 = 72. Two circles: 2π(3)<sup>2<\/sup> = 18π.<br>Shaded area = 72 − 18π.<br>Answer: <b>72 − 18π<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The shaded region shown is formed by removing a semicircle from a square with side length 8. The diameter of the semicircle is the top side of the square. What is the perimeter of the shaded region?<svg class=\"fig\" viewBox=\"0 0 240 220\" role=\"img\" aria-label=\"Square with side length 8 from which a semicircle has been removed. The diameter of the semicircle is the top side of the square, and the semicircle curves down into the square. The remaining region is shaded.\"><polygon class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" points=\"32,195 208,195 208,19 207.81,24.76 207.25,30.49 206.31,36.17 205,41.78 203.33,47.29 201.3,52.68 198.92,57.92 196.21,63 193.17,67.89 189.82,72.57 186.16,77.02 182.23,81.23 178.02,85.16 173.57,88.82 168.89,92.17 164,95.21 158.92,97.92 153.68,100.3 148.29,102.33 142.78,104 137.17,105.31 131.49,106.25 125.76,106.81 120,107 114.24,106.81 108.51,106.25 102.83,105.31 97.22,104 91.71,102.33 86.32,100.3 81.08,97.92 76,95.21 71.11,92.17 66.43,88.82 61.98,85.16 57.77,81.23 53.84,77.02 50.18,72.57 46.83,67.89 43.79,63 41.08,57.92 38.7,52.68 36.67,47.29 35,41.78 33.69,36.17 32.75,30.49 32.19,24.76 32,19\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"32,195 208,195 208,19 207.81,24.76 207.25,30.49 206.31,36.17 205,41.78 203.33,47.29 201.3,52.68 198.92,57.92 196.21,63 193.17,67.89 189.82,72.57 186.16,77.02 182.23,81.23 178.02,85.16 173.57,88.82 168.89,92.17 164,95.21 158.92,97.92 153.68,100.3 148.29,102.33 142.78,104 137.17,105.31 131.49,106.25 125.76,106.81 120,107 114.24,106.81 108.51,106.25 102.83,105.31 97.22,104 91.71,102.33 86.32,100.3 81.08,97.92 76,95.21 71.11,92.17 66.43,88.82 61.98,85.16 57.77,81.23 53.84,77.02 50.18,72.57 46.83,67.89 43.79,63 41.08,57.92 38.7,52.68 36.67,47.29 35,41.78 33.69,36.17 32.75,30.49 32.19,24.76 32,19\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"120\" y=\"215\" text-anchor=\"middle\">8<\/text><\/g><\/svg>", "opts": ["24 + 4π", "24 + 8π", "32 + 4π", "32 − 4π"], "ans": 0, "sol": "The boundary has three straight sides of the square: 3 × 8 = 24. The top side is not part of the boundary.<br>The curved edge is half the circumference of a circle with radius 4: <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(2π · 4) = 4π.<br>Perimeter = 24 + 4π.<br>Answer: <b>24 + 4π<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A farmer uses 120 meters of fencing to enclose a rectangular pen next to a long, straight barn wall. The wall forms one side of the pen, so no fencing is needed on that side. Each of the two sides perpendicular to the wall is 25 meters long. What is the area of the pen, in square meters?", "opts": ["875", "1750", "2375", "3500"], "ans": 1, "sol": "The fencing covers the two perpendicular sides and the one side parallel to the wall.<br>Parallel side: 120 − 2(25) = 70.<br>Area = 70 × 25 = 1750.<br>Answer: <b>1750<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "A triangle has a base of 2<i>x<\/i> units and a height of (<i>x<\/i> + 5) units. The area of the triangle is 36 square units. What is the length of the base?", "ans": ["8"], "sol": "<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(2<i>x<\/i>)(<i>x<\/i> + 5) = 36, so <i>x<\/i>(<i>x<\/i> + 5) = 36.<br><i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> − 36 = 0, so (<i>x<\/i> + 9)(<i>x<\/i> − 4) = 0 and <i>x<\/i> = 4 (a length must be positive).<br>The base is 2(4) = 8.<br>Answer: <b>8<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A quadrilateral in the <i>x<\/i><i>y<\/i>-plane has vertices (−2, 1), (3, −2), (6, 2) and (2, 6). What is the area of the quadrilateral?", "opts": ["31.5", "32.5", "64", "65"], "ans": 1, "sol": "Box: from <i>x<\/i> = −2 to 6 and from <i>y<\/i> = −2 to 6, so 8 × 8 = 64.<br>Corner triangles: <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(5)(3) = 7.5, <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(3)(4) = 6, <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(4)(4) = 8 and <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(4)(5) = 10, for a total of 31.5.<br>Area = 64 − 31.5 = 32.5.<br>Answer: <b>32.5<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Square <i>A<\/i><i>B<\/i><i>C<\/i><i>D<\/i> lies in the <i>x<\/i><i>y<\/i>-plane. Two of its consecutive vertices are <i>A<\/i>(1, 2) and <i>B<\/i>(4, 6). What is the area of the square?", "opts": ["7", "20", "25", "49"], "ans": 2, "sol": "The side <i>A<\/i><i>B<\/i> has length √((4 − 1)<sup>2<\/sup> + (6 − 2)<sup>2<\/sup>) = √25 = 5.<br>Area = 5<sup>2<\/sup> = 25.<br>Answer: <b>25<\/b>"}, {"lo": "LO1", "diff": "X", "type": "mcq", "q": "In rectangle <i>A<\/i><i>B<\/i><i>C<\/i><i>D<\/i> shown, <i>A<\/i><i>B<\/i> = 12 and <i>B<\/i><i>C<\/i> = 7. Point <i>E<\/i> lies on side <i>C<\/i><i>D<\/i>. What is the total area of the two shaded triangles?<svg class=\"fig\" viewBox=\"0 0 270 180\" role=\"img\" aria-label=\"Rectangle ABCD with AB = 12 along the bottom and BC = 7 on the right. Point E lies on the top side CD. Segments AE and BE are drawn. Triangles ADE and BCE are shaded; triangle ABE is not shaded.\"><polygon class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" points=\"30,150 30,24 102,24\"/><polygon class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" points=\"246,150 246,24 102,24\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"30,150 246,150 246,24 30,24\"/><line class=\"fg-edge\" x1=\"30\" y1=\"150\" x2=\"102\" y2=\"24\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"246\" y1=\"150\" x2=\"102\" y2=\"24\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x= /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  } else {
    h+='<div class="opts" role="radiogroup">'+q.opts.map(function(o,k){ return '<button type="button" class="opt" role="radio" aria-checked="'+(sel===k)+'" data-k="'+k+'"><span class="let">'+letter(k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';

}

    var L=LOS[cur];
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Learning sheet '+(cur+1)+' of '+LOS.length+' · Objective '+(cur+1)+'</div><h2>'+L.text+'</h2>';
    h+='<div class="concept">'+byLo(S.notes,L.id).map(function(n){ return '<h3 class="note-h">'+n.h+'</h3>'+n.html; }).join('')+'</div>';
    byLo(S.examples,L.id).forEach(function(E,ei){
      h+='<div class="ex"><h3>Worked example '+(ei+1)+'</h3><div class="ex-q">'+E.q+'</div><ol class="steps">'+E.steps.map(function(s){ return '<li hidden>'+s+'</li>'; }).join('')+'</ol><div class="ans" hidden>Answer: '+E.ans+'</div><div class="ex-ctrl"><button class="btn" data-next>Show first step</button><button class="btn" data-all>Show full solution</button></div></div>';
    });
    var G=byLo(S.guided,L.id);
    if(G.length) h+='<h3 class="note-h">Guided practice</h3>';
    G.forEach(function(q,qi){
      var gi=S.guided.indexOf(q);
      h+='<div class="try" data-g="'+gi+'"><h3>Question '+(qi+1)+' of '+G.length+' <span class="pill '+q.diff+'" style="margin-left:6px">'+DIFF[q.diff]+'</span></h3>'+qBody(q,null,'g-'+gi)+'<div class="ex-ctrl">'+(q.hint?'<button class="btn" data-hint>Show hint</button>':'')+'<button class="btn btn-primary" data-check>Check answer</button></div><div class="hint" hidden>'+(q.hint||'')+'</div><div class="fbk"></div></div>';
    });
    h+='<label class="donebox"><input type="checkbox" id="done-'+esc(L.id)+'" data-done="'+esc(L.id)+'"'+(ST.done[L.id]?' checked':'')+'> I can do this objective</label>';
    h+='<div class="qnav"><button class="btn" data-go="'+(cur-1)+'"'+(cur===0?' disabled':'')+'>Previous sheet</button><button class="btn btn-primary" data-go="'+(cur+1)+'">'+(cur===LOS.length-1?'Go to recap':'Next sheet')+'</button></div></section>';
  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
