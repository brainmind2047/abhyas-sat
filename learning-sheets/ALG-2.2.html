var S = {"id": "ALG-2.2", "unit": "Algebra", "topic": "Linear equations in two variables", "title": "Parallel, perpendicular and points on a line", "intro": "This subtopic covers how the slopes of parallel and perpendicular lines are related, the special equations of horizontal and vertical lines, and how to test or complete a point on a line. On the DSAT these ideas appear as equation-matching questions, graph-reading questions and parameter questions such as “for what value of <i>k<\/i> are the lines perpendicular?”", "los": [{"id": "LO1", "text": "Determine the slopes of parallel and perpendicular lines, including lines in standard form, and write their equations."}, {"id": "LO2", "text": "Identify and write equations of horizontal and vertical lines and use them to locate points."}, {"id": "LO3", "text": "Determine whether a point lies on a line and find a missing coordinate or constant."}, {"id": "LO4", "text": "Write the equation of a line from its graph or from graph features such as intercepts and plotted points."}], "notes": [{"lo": "LO1", "h": "Parallel lines share a slope", "html": "<p>Two different non-vertical lines in the <i>x<\/i><i>y<\/i>-plane are parallel exactly when their slopes are equal. Their <i>y<\/i>-intercepts must be different; if both the slope and the intercept match, the two equations describe one and the same line.<\/p><div class=\"rule\">Parallel lines: <i>m<\/i><sub>1<\/sub> = <i>m<\/i><sub>2<\/sub> and <i>b<\/i><sub>1<\/sub> ≠ <i>b<\/i><sub>2<\/sub><\/div><p>To write the line parallel to a given line through a point:<\/p><ul><li>copy the slope of the given line;<\/li><li>substitute the point into <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i> and solve for <i>b<\/i>.<\/li><\/ul><p>Example: the line parallel to <i>y<\/i> = 4<i>x<\/i> + 1 through (−1, 3) satisfies 3 = 4(−1) + <i>b<\/i>, so <i>b<\/i> = 7 and the line is <i>y<\/i> = 4<i>x<\/i> + 7.<\/p>"}, {"lo": "LO1", "h": "Perpendicular lines: negative reciprocals", "html": "<p>Two non-vertical lines are perpendicular when their slopes multiply to −1. Equivalently, one slope is the <b>negative reciprocal<\/b> of the other: flip the fraction <i>and<\/i> change the sign.<\/p><div class=\"rule\"><i>m<\/i><sub>1<\/sub> · <i>m<\/i><sub>2<\/sub> = −1, so <i>m<\/i><sub>2<\/sub> = −<span class=\"fq\"><span>1<\/span><span><i>m<\/i><sub>1<\/sub><\/span><\/span><\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Slope of line<\/th><th>Perpendicular slope<\/th><\/tr><tr><td>2<\/td><td>−<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><\/td><\/tr><tr><td>−<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span><\/td><td><span class=\"fq\"><span>5<\/span><span>3<\/span><\/span><\/td><\/tr><tr><td>1<\/td><td>−1<\/td><\/tr><tr><td>0 (horizontal)<\/td><td>undefined (vertical)<\/td><\/tr><\/table><\/div><p>Doing only one of the two moves is the classic error: the reciprocal alone or the negative alone does not give a perpendicular slope.<\/p>"}, {"lo": "LO1", "h": "Lines given in standard form", "html": "<p>A line written as <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i> (with <i>B<\/i> ≠ 0) has slope −<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span>. You can get this by solving for <i>y<\/i>, but the shortcut saves time.<\/p><div class=\"rule\">Slope of <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i> is −<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span>.<br>Parallel family: <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>D<\/i>. Perpendicular family: <i>B<\/i><i>x<\/i> − <i>A<\/i><i>y<\/i> = <i>D<\/i>.<\/div><p>Example: 2<i>x<\/i> + 7<i>y<\/i> = 3 has slope −<span class=\"fq\"><span>2<\/span><span>7<\/span><\/span>. Any line 2<i>x<\/i> + 7<i>y<\/i> = <i>D<\/i> with <i>D<\/i> ≠ 3 is parallel to it, and any line 7<i>x<\/i> − 2<i>y<\/i> = <i>D<\/i> (slope <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>) is perpendicular to it.<\/p><p>When a constant such as <i>k<\/i> sits inside a coefficient, write each slope in terms of <i>k<\/i>, then set the slopes equal (parallel) or set their product to −1 (perpendicular).<\/p><div class=\"tip\">Desmos tip: type both equations exactly as given; Desmos graphs standard form directly, so you can see at once whether the lines look parallel or meet at a right angle.<\/div>"}, {"lo": "LO2", "h": "Horizontal and vertical lines", "html": "<p>A horizontal line keeps the same <i>y<\/i>-value everywhere, so its equation is <i>y<\/i> = <i>k<\/i> and its slope is 0. A vertical line keeps the same <i>x<\/i>-value, so its equation is <i>x<\/i> = <i>h<\/i>; its slope is undefined because the run is 0.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Horizontal<\/th><th>Vertical<\/th><\/tr><tr><td>Equation<\/td><td><i>y<\/i> = <i>k<\/i><\/td><td><i>x<\/i> = <i>h<\/i><\/td><\/tr><tr><td>Slope<\/td><td>0<\/td><td>undefined<\/td><\/tr><tr><td>Parallel to<\/td><td>the <i>x<\/i>-axis<\/td><td>the <i>y<\/i>-axis<\/td><\/tr><tr><td>Through (<i>p<\/i>, <i>q<\/i>)<\/td><td><i>y<\/i> = <i>q<\/i><\/td><td><i>x<\/i> = <i>p<\/i><\/td><\/tr><\/table><\/div><div class=\"rule\">Every horizontal line is perpendicular to every vertical line. The lines <i>x<\/i> = <i>h<\/i> and <i>y<\/i> = <i>k<\/i> meet at (<i>h<\/i>, <i>k<\/i>).<\/div><p>If two given points share an <i>x<\/i>-coordinate, the line through them is vertical; if they share a <i>y<\/i>-coordinate, it is horizontal.<\/p>"}, {"lo": "LO3", "h": "Points on a line and missing coordinates", "html": "<p>A point lies on a line exactly when its coordinates make the equation true. Substitute the <i>x<\/i>-value and the <i>y<\/i>-value (in that order) and check whether both sides are equal.<\/p><div class=\"rule\">(<i>p<\/i>, <i>q<\/i>) is on the line ⇔ substituting <i>x<\/i> = <i>p<\/i> and <i>y<\/i> = <i>q<\/i> gives a true statement.<\/div><p>To find a missing coordinate, substitute the coordinate you know and solve for the other one. For example, if (<i>a<\/i>, 2) is on 3<i>x<\/i> − 4<i>y<\/i> = 10, then 3<i>a<\/i> − 8 = 10, so <i>a<\/i> = 6.<\/p><p>If the equation itself contains an unknown constant, use a point that you know is on the line to find that constant first, then answer the question about the other point. Points that lie on the same line are called collinear; three points are collinear when the slope between each pair is the same.<\/p>"}, {"lo": "LO4", "h": "Reading a line's equation from a graph", "html": "<p>To write the equation of a graphed line:<\/p><ol><li>Read the <i>y<\/i>-intercept <i>b<\/i> where the line crosses the <i>y<\/i>-axis.<\/li><li>Pick two points where the line passes exactly through grid intersections.<\/li><li>Compute slope = rise ÷ run, counting <i>up<\/i> as positive and <i>down<\/i> as negative while moving right.<\/li><li>Check with a third point if possible.<\/li><\/ol><p>If the graph shows an <i>x<\/i>-intercept <i>a<\/i> and a <i>y<\/i>-intercept <i>b<\/i>, the slope is −<span class=\"fq\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>: from (<i>a<\/i>, 0) to (0, <i>b<\/i>) the rise is <i>b<\/i> and the run is −<i>a<\/i>.<\/p><div class=\"rule\">Line falling left to right ⇒ negative slope. Line rising left to right ⇒ positive slope.<\/div><div class=\"tip\">Desmos tip: type the points you read off the graph as a list, for example (0, 3), (4, −3), and then type your candidate equation; if the line passes through every dot, your equation is right.<\/div>"}], "examples": [{"lo": "LO1", "q": "Line <i>p<\/i> has equation 3<i>x<\/i> − 4<i>y<\/i> = 12. Find the slope of a line parallel to <i>p<\/i> and the slope of a line perpendicular to <i>p<\/i>.", "steps": ["For <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i>, the slope is −<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>−4<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>.", "A parallel line has the same slope: <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>.", "A perpendicular line has the negative reciprocal: −<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>. Check: <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span> · (−<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>) = −1."], "ans": "Parallel: <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>; perpendicular: −<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>"}, {"lo": "LO2", "q": "Line ℓ passes through (−5, 2) and is perpendicular to the line <i>x<\/i> = 7. What is an equation of ℓ?", "steps": ["<i>x<\/i> = 7 is a vertical line.", "A line perpendicular to a vertical line is horizontal, so ℓ has the form <i>y<\/i> = <i>k<\/i>.", "Every point on ℓ has the same <i>y<\/i>-value as (−5, 2), so <i>k<\/i> = 2."], "ans": "<i>y<\/i> = 2"}, {"lo": "LO3", "q": "Does the point (4, −1) lie on <i>y<\/i> = −2<i>x<\/i> + 7? If (<i>k<\/i>, 9) lies on the same line, what is <i>k<\/i>?", "steps": ["Substitute <i>x<\/i> = 4: −2(4) + 7 = −1, which equals the <i>y<\/i>-coordinate, so (4, −1) is on the line.", "For (<i>k<\/i>, 9): 9 = −2<i>k<\/i> + 7.", "−2<i>k<\/i> = 2, so <i>k<\/i> = −1."], "ans": "Yes; <i>k<\/i> = −1"}, {"lo": "LO1", "q": "Line ℓ is perpendicular to the line 2<i>x<\/i> + 5<i>y<\/i> = 10 and passes through the point (2, −3). What is the <i>y<\/i>-intercept of ℓ?", "steps": ["Slope of 2<i>x<\/i> + 5<i>y<\/i> = 10: −<span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>.", "Perpendicular slope: <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>.", "Substitute (2, −3) into <i>y<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i> + <i>b<\/i>: −3 = 5 + <i>b<\/i>, so <i>b<\/i> = −8."], "ans": "−8 (the line is <i>y<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i> − 8)"}, {"lo": "LO4", "q": "<svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Line in the xy-plane through the points (0, 3) and (4, negative 3); grid from negative 6 to 6 on both axes\"><g class=\"fg-grid\"><line x1=\"12\" y1=\"12\" x2=\"12\" y2=\"228\"/><line x1=\"12\" y1=\"228\" x2=\"228\" y2=\"228\"/><line x1=\"30\" y1=\"12\" x2=\"30\" y2=\"228\"/><line x1=\"12\" y1=\"210\" x2=\"228\" y2=\"210\"/><line x1=\"48\" y1=\"12\" x2=\"48\" y2=\"228\"/><line x1=\"12\" y1=\"192\" x2=\"228\" y2=\"192\"/><line x1=\"66\" y1=\"12\" x2=\"66\" y2=\"228\"/><line x1=\"12\" y1=\"174\" x2=\"228\" y2=\"174\"/><line x1=\"84\" y1=\"12\" x2=\"84\" y2=\"228\"/><line x1=\"12\" y1=\"156\" x2=\"228\" y2=\"156\"/><line x1=\"102\" y1=\"12\" x2=\"102\" y2=\"228\"/><line x1=\"12\" y1=\"138\" x2=\"228\" y2=\"138\"/><line x1=\"120\" y1=\"12\" x2=\"120\" y2=\"228\"/><line x1=\"12\" y1=\"120\" x2=\"228\" y2=\"120\"/><line x1=\"138\" y1=\"12\" x2=\"138\" y2=\"228\"/><line x1=\"12\" y1=\"102\" x2=\"228\" y2=\"102\"/><line x1=\"156\" y1=\"12\" x2=\"156\" y2=\"228\"/><line x1=\"12\" y1=\"84\" x2=\"228\" y2=\"84\"/><line x1=\"174\" y1=\"12\" x2=\"174\" y2=\"228\"/><line x1=\"12\" y1=\"66\" x2=\"228\" y2=\"66\"/><line x1=\"192\" y1=\"12\" x2=\"192\" y2=\"228\"/><line x1=\"12\" y1=\"48\" x2=\"228\" y2=\"48\"/><line x1=\"210\" y1=\"12\" x2=\"210\" y2=\"228\"/><line x1=\"12\" y1=\"30\" x2=\"228\" y2=\"30\"/><line x1=\"228\" y1=\"12\" x2=\"228\" y2=\"228\"/><line x1=\"12\" y1=\"12\" x2=\"228\" y2=\"12\"/><\/g><line class=\"fg-axis\" x1=\"12\" y1=\"120\" x2=\"228\" y2=\"120\"/><line class=\"fg-axis\" x1=\"120\" y1=\"12\" x2=\"120\" y2=\"228\"/><line class=\"fg-fit\" x1=\"84\" y1=\"12\" x2=\"228\" y2=\"228\"/><g class=\"fg-pts\"><circle cx=\"120\" cy=\"66\" r=\"3\"/><circle cx=\"192\" cy=\"174\" r=\"3\"/><\/g><g class=\"fg-lab\" font-size=\"10\"><text x=\"48\" y=\"132\" text-anchor=\"middle\">−4<\/text><text x=\"116\" y=\"196\" text-anchor=\"end\">−4<\/text><text x=\"84\" y=\"132\" text-anchor=\"middle\">−2<\/text><text x=\"116\" y=\"160\" text-anchor=\"end\">−2<\/text><text x=\"156\" y=\"132\" text-anchor=\"middle\">2<\/text><text x=\"116\" y=\"88\" text-anchor=\"end\">2<\/text><text x=\"192\" y=\"132\" text-anchor=\"middle\">4<\/text><text x=\"116\" y=\"52\" text-anchor=\"end\">4<\/text><text x=\"116\" y=\"132\" text-anchor=\"end\">O<\/text><text x=\"226\" y=\"116\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"125\" y=\"21\" font-style=\"italic\">y<\/text><\/g><\/svg><p>Line <i>n<\/i> is perpendicular to the line shown and passes through the point (6, 1). What is an equation of line <i>n<\/i>?<\/p>", "steps": ["The graphed line crosses the <i>y<\/i>-axis at (0, 3) and passes through (4, −3).", "Its slope is <span class=\"fq\"><span>−3 − 3<\/span><span>4 − 0<\/span><\/span> = <span class=\"fq\"><span>−6<\/span><span>4<\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>.", "Line <i>n<\/i> has slope <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>. Substitute (6, 1): 1 = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>(6) + <i>b<\/i> = 4 + <i>b<\/i>, so <i>b<\/i> = −3."], "ans": "<i>y<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><i>x<\/i> − 3"}, {"lo": "LO1", "q": "In the <i>x<\/i><i>y<\/i>-plane, the lines <i>a<\/i><i>x<\/i> + 3<i>y<\/i> = 7 and 4<i>x<\/i> − 6<i>y<\/i> = 1 are perpendicular, where <i>a<\/i> is a constant. What is the value of <i>a<\/i>?", "steps": ["Slope of <i>a<\/i><i>x<\/i> + 3<i>y<\/i> = 7: −<span class=\"fq\"><span><i>a<\/i><\/span><span>3<\/span><\/span>.", "Slope of 4<i>x<\/i> − 6<i>y<\/i> = 1: −<span class=\"fq\"><span>4<\/span><span>−6<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>.", "Perpendicular: (−<span class=\"fq\"><span><i>a<\/i><\/span><span>3<\/span><\/span>)(<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>) = −1, so <span class=\"fq\"><span>2<i>a<\/i><\/span><span>9<\/span><\/span> = 1 and <i>a<\/i> = <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>.", "(Had the question asked for parallel lines, −<span class=\"fq\"><span><i>a<\/i><\/span><span>3<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> would give <i>a<\/i> = −2.)"], "ans": "<i>a<\/i> = <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>"}], "traps": ["Taking only the reciprocal (or only the negative) of a slope for a perpendicular line: the perpendicular slope to <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span> is −<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>, not <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span> or −<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>.", "Reading the slope of <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i> as <i>A<\/i> or <span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span> instead of −<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span>.", "Mixing up <i>x<\/i> = <i>h<\/i> (vertical, undefined slope) with <i>y<\/i> = <i>k<\/i> (horizontal, slope 0).", "Substituting a point's coordinates into the wrong variables, for example putting the <i>y<\/i>-coordinate in for <i>x<\/i>.", "On a graph, computing run ÷ rise instead of rise ÷ run, or forgetting that a line falling to the right has a negative slope."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Line <i>p<\/i> has equation <i>y<\/i> = 4<i>x<\/i> − 9. Line <i>q<\/i> is parallel to line <i>p<\/i>. What is the slope of line <i>q<\/i>?", "opts": ["4", "−4", "<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>", "−<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>"], "ans": 0, "sol": "Parallel lines have equal slopes, and the slope of <i>y<\/i> = 4<i>x<\/i> − 9 is 4. Answer: <b>4<\/b>", "hint": "What do parallel lines have in common?"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which equation represents the horizontal line that passes through the point (3, −8)?", "opts": ["<i>x<\/i> = 3", "<i>y<\/i> = −8", "<i>x<\/i> = −8", "<i>y<\/i> = 3"], "ans": 1, "sol": "A horizontal line has a constant <i>y<\/i>-value, and here that value is −8. Answer: <b><i>y<\/i> = −8<\/b>", "hint": "On a horizontal line, which coordinate never changes?"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "Line ℓ has equation <i>y<\/i> = −<span class=\"fq\"><span>2<\/span><span>7<\/span><\/span><i>x<\/i> + 1. What is the slope of a line perpendicular to ℓ?", "ans": ["7/2", "3.5"], "sol": "Flip −<span class=\"fq\"><span>2<\/span><span>7<\/span><\/span> to get −<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>, then change the sign: <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>. Check: (−<span class=\"fq\"><span>2<\/span><span>7<\/span><\/span>)(<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>) = −1. Answer: <b>7/2<\/b>", "hint": "Flip the fraction and change its sign."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Which point lies on the line <i>y<\/i> = 3<i>x<\/i> − 5?", "opts": ["(1, 2)", "(0, 5)", "(2, 1)", "(−1, −2)"], "ans": 2, "sol": "Substitute <i>x<\/i> = 2: 3(2) − 5 = 1, which matches <i>y<\/i> = 1. The other points give −2 ≠ 2, −5 ≠ 5 and −8 ≠ −2. Answer: <b>(2, 1)<\/b>", "hint": "Plug each <i>x<\/i>-value into the equation and compare with the <i>y<\/i>-value."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img\" aria-label=\"Line in the xy-plane through the points (negative 2, 0) and (0, 4); grid from negative 6 to 6 on both axes\"><g class=\"fg-grid\"><line x1=\"12\" y1=\"12\" x2=\"12\" y2=\"228\"/><line x1=\"12\" y1=\"228\" x2=\"228\" y2=\"228\"/><line x1=\"30\" y1=\"12\" x2=\"30\" y2=\"228\"/><line x1=\"12\" y1=\"210\" x2=\"228\" y2=\"210\"/><line x1=\"48\" y1=\"12\" x2=\"48\" y2=\"228\"/><line x1=\"12\" y1=\"192\" x2=\"228\" y2=\"192\"/><line x1=\"66\" y1=\"12\" x2=\"66\" y2=\"228\"/><line x1=\"12\" y1=\"174\" x2=\"228\" y2=\"174\"/><line x1=\"84\" y1=\"12\" x2=\"84\" y2=\"228\"/><line x1=\"12\" y1=\"156\" x2=\"228\" y2=\"156\"/><line x1=\"102\" y1=\"12\" x2=\"102\" y2=\"228\"/><line x1=\"12\" y1=\"138\" x2=\"228\" y2=\"138\"/><line x1=\"120\" , "hint": "What kind of line is <i>y<\/i> = 6, and what kind of line meets it at a right angle?"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "Line <i>r<\/i> is perpendicular to the line <i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> + 2 and passes through the point (2, 5). What is the <i>y<\/i>-coordinate of the <i>y<\/i>-intercept of line <i>r<\/i>?", "ans": ["11"], "sol": "The perpendicular slope is −3. Substitute (2, 5): 5 = −3(2) + <i>b<\/i>, so <i>b<\/i> = 11. Answer: <b>11<\/b>", "hint": "Get the perpendicular slope first, then use the point to find b."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The graph of a line in the <i>x<\/i><i>y<\/i>-plane has an <i>x<\/i>-intercept at (8, 0) and a <i>y<\/i>-intercept at (0, −6). Which equation represents the line?", "opts": ["<i>y<\/i> = −<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> − 6", "<i>y<\/i> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span><i>x<\/i> − 6", "<i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> − 6", "<i>y<\/i> = −<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span><i>x<\/i> + 8"], "ans": 2, "sol": "Slope = <span class=\"fq\"><span>−6 − 0<\/span><span>0 − 8<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>, and the <i>y<\/i>-intercept is −6. Answer: <b><i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> − 6<\/b>", "hint": "Use the two intercepts as two points to get the slope."}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "The total cost <i>C<\/i>, in dollars, of renting a kayak for <i>h<\/i> hours is given by <i>C<\/i> = 12<i>h<\/i> + 15. The point (<i>h<\/i>, 87) lies on the graph of this equation in the <i>hC<\/i>-plane. What is the value of <i>h<\/i>?", "ans": ["6"], "sol": "Substitute <i>C<\/i> = 87: 87 = 12<i>h<\/i> + 15, so 12<i>h<\/i> = 72 and <i>h<\/i> = 6. Answer: <b>6<\/b>", "hint": "The second coordinate is the cost."}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "In the <i>x<\/i><i>y<\/i>-plane, the lines <i>c<\/i><i>x<\/i> − 4<i>y<\/i> = 3 and 2<i>x<\/i> + 3<i>y<\/i> = 9 are perpendicular, where <i>c<\/i> is a constant. What is the value of <i>c<\/i>?", "opts": ["−6", "−<span class=\"fq\"><span>8<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>8<\/span><span>3<\/span><\/span>", "6"], "ans": 3, "sol": "Slopes: <span class=\"fq\"><span><i>c<\/i><\/span><span>4<\/span><\/span> and −<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>. Perpendicular: (<span class=\"fq\"><span><i>c<\/i><\/span><span>4<\/span><\/span>)(−<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>) = −1, so <span class=\"fq\"><span>2<i>c<\/i><\/span><span>12<\/span><\/span> = 1 and <i>c<\/i> = 6. Answer: <b>6<\/b>", "hint": "Write each slope (one in terms of <i>c<\/i>) and set their product equal to −1."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A line has slope −<span class=\"fq\"><span>4<\/span><span>9<\/span><\/span>. What is the slope of a line perpendicular to it?", "opts": ["<span class=\"fq\"><span>9<\/span><span>4<\/span><\/span>", "−<span class=\"fq\"><span>9<\/span><span>4<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>9<\/span><\/span>", "−<span class=\"fq\"><span>4<\/span><span>9<\/span><\/span>"], "ans": 0, "sol": "The negative reciprocal of −<span class=\"fq\"><span>4<\/span><span>9<\/span><\/span> is <span class=\"fq\"><span>9<\/span><span>4<\/span><\/span>. Answer: <b>9/4<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which statement about the line <i>x<\/i> = −2 in the <i>x<\/i><i>y<\/i>-plane is true?", "opts": ["Its slope is 0.", "Its slope is −2.", "It is vertical, and its slope is undefined.", "It is horizontal and passes through (0, −2)."], "ans": 2, "sol": "<i>x<\/i> = −2 contains every point with <i>x<\/i>-coordinate −2, so it is vertical; vertical lines have undefined slope. Answer: <b>It is vertical, and its slope is undefined \"228\" y2=\"102\"/><line x1=\"156\" y1=\"12\" x2=\"156\" y2=\"228\"/><line x1=\"12\" y1=\"84\" x2=\"228\" y2=\"84\"/><line x1=\"174\" y1=\"12\" x2=\"174\" y2=\"228\"/><line x1=\"12\" y1=\"66\" x2=\"228\" y2=\"66\"/><line x1=\"192\" y1=\"12\" x2=\"192\" y2=\"228\"/><line x1=\"12\" y1=\"48\" x2=\"228\" y2=\"48\"/><line x1=\"210\" y1=\"12\" x2=\"210\" y2=\"228\"/><line x1=\"12\" y1=\"30\" x2=\"228\" y2=\"30\"/><line x1=\"228\" y1=\"12\" x2=\"228\" y2=\"228\"/><line x1=\"12\" y1=\"12\" x2=\"228\" y2=\"12\"/><\/g><line class=\"fg-axis\" x1=\"12\" y1=\"120\" x2=\"228\" y2=\"120\"/><line class=\"fg-axis\" x1=\"120\" y1=\"12\" x2=\"120\" y2=\"228\"/><line class=\"fg-fit\" x1=\"84\" y1=\"228\" x2=\"170.4\" y2=\"12\"/><g class=\"fg-pts\"><circle cx=\"120\" cy=\"138\" r=\"3\"/><circle cx=\"156\" cy=\"48\" r=\"3\"/><\/g><g class=\"fg-lab\" font-size=\"10\"><text x=\"48\" y=\"132\" text-anchor=\"middle\">−4<\/text><text x=\"116\" y=\"196\" text-anchor=\"end\">−4<\/text><text x=\"84\" y=\"132\" text-anchor=\"middle\">−2<\/text><text x=\"116\" y=\"160\" text-anchor=\"end\">−2<\/text><text x=\"156\" y=\"132\" text-anchor=\"middle\">2<\/text><text x=\"116\" y=\"88\" text-anchor=\"end\">2<\/text><text x=\"192\" y=\"132\" text-anchor=\"middle\">4<\/text><text x=\"116\" y=\"52\" text-anchor=\"end\">4<\/text><text x=\"116\" y=\"132\" text-anchor=\"end\">O<\/text><text x=\"226\" y=\"116\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"125\" y=\"21\" font-style=\"italic\">y<\/text><\/g><\/svg><p>Line <i>k<\/i> (not shown) is parallel to the line shown and passes through the point (4, 7). What is the <i>y<\/i>-coordinate of the <i>y<\/i>-intercept of line <i>k<\/i>?<\/p>", "ans": ["-3"], "sol": "The graphed line passes through (0, −1) and (2, 4), so its slope is <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>. For line <i>k<\/i>: 7 = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>(4) + <i>b<\/i> = 10 + <i>b<\/i>, so <i>b<\/i> = −3. Answer: <b>−3<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "On a city grid, Elm Street follows the line <i>y<\/i> = <span class=\"fq\"><span>2<\/span><span>5<\/span><\/span><i>x<\/i>. Main Street is perpendicular to Elm Street and passes through the point (4, 1). Which equation represents Main Street?", "opts": ["<i>y<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i> − 9", "<i>y<\/i> = −<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i> − 9", "<i>y<\/i> = −<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i> + 1", "<i>y<\/i> = −<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i> + 11"], "ans": 3, "sol": "Main Street has slope −<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>. Then 1 = −<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>(4) + <i>b<\/i> = −10 + <i>b<\/i>, so <i>b<\/i> = 11. Answer: <b><i>y<\/i> = −<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i> + 11<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The height <i>h<\/i>, in centimeters, of a plant <i>w<\/i> weeks after it is measured is modeled by <i>h<\/i> = 1.5<i>w<\/i> + 8. Which ordered pair (<i>w<\/i>, <i>h<\/i>) lies on the graph of this model?", "opts": ["(17, 6)", "(6, 17)", "(4, 9.5)", "(10, 18)"], "ans": 1, "sol": "1.5(6) + 8 = 17 ✓. (17, 6) swaps the coordinates; 1.5(4) + 8 = 14 and 1.5(10) + 8 = 23. Answer: <b>(6, 17)<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The graph of a line in the <i>x<\/i><i>y<\/i>-plane has an <i>x<\/i>-intercept at (−3, 0) and a <i>y<\/i>-intercept at (0, 9). Which equation represents the line?", "opts": ["<i>y<\/i> = 3<i>x<\/i> + 9", "<i>y<\/i> = −3<i>x<\/i> + 9", "<i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> + 9", "<i>y<\/i> = 3<i>x<\/i> − 3"], "ans": 0, "sol": "Slope = <span class=\"fq\"><span>9 − 0<\/span><span>0 − (−3)<\/span><\/span> = 3, and the <i>y<\/i>-intercept is 9. Answer: <b><i>y<\/i> = 3<i>x<\/i> + 9<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "Line ℓ is horizontal and passes through (−6, 4). Line <i>j<\/i> is vertical and passes through (3, −8). Lines ℓ and <i>j<\/i> intersect at the point (<i>a<\/i>, <i>b<\/i>). What is the value of <i>a<\/i> + <i>b<\/i>?", "ans": ["7"], "sol": "ℓ is <i>y<\/i> = 4 and <i>j<\/i> is <i>x<\/i> = 3, so they meet at (3, 4) and <i>a<\/i> + <i>b<\/i> = 7. Answer: <b>7<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "In the <i>x<\/i><i>y<\/i>-plane, the line 4<i>x<\/i> + <i>k<\/i><i>y<\/i> = 12 is parallel to the line <i>y<\/i> = −2<i>x<\/i> + 5, where <i>k<\/i> is a constant. What is the value of <i>k<\/i>?", "opts": ["−2", "8", "2", "<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>"], "ans": 2, "sol": "Slope of 4<i>x<\/i> + <i>k<\/i><i>y<\/i> = 12 is −<span class=\"fq\"><span>4<\/span><span><i>k<\/i><\/span><\/span>. Set −<span class=\"fq\"><span>4<\/span><span><i>k<\/i><\/span><\/span> = −2, so <i>k<\/i> = 2. (The line is then <i>y<\/i> = −2<i>x<\/i> + 6, distinct from the given line.) Answer: <b>2<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "Line ℓ is perpendicular to the line 7<i>x<\/i> − 2<i>y<\/i> = 3 and passes through the point (14, 1). What is the <i>x<\/i>-coordinate of the <i>x<\/i>-intercept of line ℓ?", "ans": ["35/2", "17.5"], "sol": "The given slope is <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>, so ℓ has slope −<span class=\"fq\"><span>2<\/span><span>7<\/span><\/span>: 1 = −<span class=\"fq\"><span>2<\/span><span>7<\/span><\/span>(14) + <i>b<\/i> gives <i>b<\/i> = 5. Set 0 = −<span class=\"fq\"><span>2<\/span><span>7<\/span><\/span><i>x<\/i> + 5, so <i>x<\/i> = <span class=\"fq\"><span>35<\/span><span>2<\/span><\/span>. Answer: <b>35/2<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A line in the <i>x<\/i><i>y<\/i>-plane passes through the points (2, 9) and (6, 1). Which of the following points also lies on this line?", "opts": ["(4, 6)", "(0, 11)", "(10, −5)", "(8, −3)"], "ans": 3, "sol": "Slope = <span class=\"fq\"><span>1 − 9<\/span><span>6 − 2<\/span><\/span> = −2, so <i>y<\/i> = −2<i>x<\/i> + 13. Check (8, −3): −16 + 13 = −3 ✓. The others give 5, 13 and −7. Answer: <b>(8, −3)<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The graph of a line in the <i>tV<\/i>-plane models the volume <i>V<\/i>, in liters, of water in a tank <i>t<\/i> minutes after it begins draining. The line crosses the <i>V<\/i>-axis at 240 and the <i>t<\/i>-axis at 16. Which equation represents the line?", "opts": ["<i>V<\/i> = 240 − 16<i>t<\/i>", "<i>V<\/i> = 240 − 15<i>t<\/i>", "<i>V<\/i> = 16 − 15<i>t<\/i>", "<i>V<\/i> = 240 + 15<i>t<\/i>"], "ans": 1, "sol": "The intercepts are (0, 240) and (16, 0), so slope = <span class=\"fq\"><span>0 − 240<\/span><span>16 − 0<\/span><\/span> = −15. Answer: <b><i>V<\/i> = 240 − 15<i>t<\/i><\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "The line <i>y<\/i> = −<i>x<\/i> + <i>c<\/i>, where <i>c<\/i> is a constant, passes through the point where the lines <i>x<\/i> = 5 and <i>y<\/i> = −3 intersect. What is the value of <i>c<\/i>?", "opts": ["2", "−8", "8", "−2"], "ans": 0, "sol": "The lines meet at (5, −3). Then −3 = −5 + <i>c<\/i>, so <i>c<\/i> = 2. Answer: <b>2<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A designer draws a rectangular frame on a coordinate grid. One side of the frame lies on the line 2<i>x<\/i> − 3<i>y<\/i> = 6, and an adjacent side meets it at the point (6, 2). Which equation represents the line containing the adjacent side?", "opts": ["3<i>x<\/i> − 2<i>y<\/i> = 14", "2<i>x<\/i> + 3<i>y<\/i> = 18", "3<i>x<\/i> + 2<i>y<\/i> = 22", "3<i>x<\/i> + 2<i>y<\/i> = 6"], "ans": 2, "sol": "Adjacent sides of a rectangle are perpendicular. The given slope is <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>, so the adjacent side has slope −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>, i.e. the form 3<i>x<\/i> + 2<i>y<\/i> = <i>D<\/i>. Through (6, 2): <i>D<\/i> = 18 + 4 = 22. Answer: <b>3<i>x<\/i> + 2<i>y<\/i> = 22<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "A line passes through the points (−1, 4) and (3, −2). What is the slope of a line perpendicular to it?", "opts": ["−<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>", "−<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>"], "ans": 1, "sol": "Slope = <span class=\"fq\"><span>−2 − 4<\/span><span>3 − (−1)<\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>; its negative reciprocal is <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>. Answer: <b>2/3<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which equation represents the line that is perpendicular to the line <i>x<\/i> = −9 and passes through the point (−9, 2)?", "opts": ["<i>x<\/i> = 2", "<i>x<\/i> = −9", "<i>y<\/i> = −9", "<i>y<\/i> = 2"], "ans": 3, "sol": "<i>x<\/i> = −9 is vertical, so the required line is horizontal through (−9, 2): <i>y<\/i> = 2. Answer: <b><i>y<\/i> = 2<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "The relationship between a temperature <i>c<\/i> in degrees Celsius and <i>f<\/i> in degrees Fahrenheit is <i>f<\/i> = 1.8<i>c<\/i> + 32. The point (<i>c<\/i>, 77) lies on the graph of this equation in the <i>cf<\/i>-plane. What is the value of <i>c<\/i>?", "ans": ["25"], "sol": "77 = 1.8<i>c<\/i> + 32, so 1.8<i>c<\/i> = 45 and <i>c<\/i> = 25. Answer: <b>25<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The graph of a line in the <i>x<\/i><i>y<\/i>-plane has an <i>x<\/i>-intercept at (10, 0) and a <i>y<\/i>-intercept at (0, 4). Which equation represents the line?", "opts": ["2<i>x<\/i> + 5<i>y<\/i> = 20", "5<i>x<\/i> + 2<i>y<\/i> = 20", "2<i>x<\/i> − 5<i>y<\/i> = 20", "4<i>x<\/i> + 10<i>y<\/i> = 1"], "ans": 0, "sol": "Slope = −<span class=\"fq\"><span>4<\/span><span>10<\/span><\/span> = −<span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>, so the line has the form 2<i>x<\/i> + 5<i>y<\/i> = <i>D<\/i>; (10, 0) gives <i>D<\/i> = 20. Check (0, 4): 5(4) = 20 ✓. Answer: <b>2<i>x<\/i> + 5<i>y<\/i> = 20<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "On a transit map, an existing rail line follows 4<i>x<\/i> − 6<i>y<\/i> = 9. A new rail line will be parallel to it and pass through the central station at the origin. Which equation represents the new line?", "opts": ["3<i>x<\/i> − 2<i>y<\/i> = 0", "2<i>x<\/i> + 3<i>y<\/i> = 0", "2<i>x<\/i> − 3<i>y<\/i> = 0", "4<i>x<\/i> − 6<i>y<\/i> = 9"], "ans": 2, "sol": "The existing slope is <span class=\"fq\"><span>4<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>. The line 2<i>x<\/i> − 3<i>y<\/i> = 0 also has slope <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> and contains (0, 0); 4<i>x<\/i> − 6<i>y<\/i> = 9 does not contain the origin. Answer: <b>2<i>x<\/i> − 3<i>y<\/i> = 0<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The point (<i>t<\/i>, <i>t<\/i>) lies on the line 3<i>x<\/i> − 7<i>y<\/i> = 12. What is the value of <i>t<\/i>?", "opts": ["3", "−3", "<span class=\"fq\"><span>6<\/span><span>5<\/span><\/span>", "−12"], "ans": 1, "sol": "3<i>t<\/i> − 7<i>t<\/i> = 12, so −4<i>t<\/i> = 12 and <i>t<\/i> = −3. Answer: <b>−3<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "In the <i>x<\/i><i>y<\/i>-plane, the lines <i>k<\/i><i>x<\/i> + 6<i>y<\/i> = 5 and 3<i>x<\/i> − 2<i>y<\/i> = 8 are perpendicular, where <i>k<\/i> is a constant. What is the value of <i>k<\/i>?", "ans": ["4"], "sol": "Slopes: −<span class=\"fq\"><span><i>k<\/i><\/span><span>6<\/span><\/span> and <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>. Product: −<span class=\"fq\"><span>3<i>k<\/i><\/span><span>12<\/span><\/span> = −1, so <i>k<\/i> = 4. Answer: <b>4<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "<svg class=\"fig\" viewBox=\"0 0 240 240\" role=\"img /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
