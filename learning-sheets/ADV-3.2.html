<!DOCTYPE html>

<head>

<title>3.2 Exponential functions and models</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,
     objective-by-objective lesson cards in Learn mode, one-question-at-a-time quiz with an objective-wise report. */
  :root{
    --navy:#16264A; --navy-2:#1F3B6B; --gold:#C79A3E; --gold-soft:#F3E7C9;
    --paper:#FBF9F4; --paper-2:#F1EAD8; --card:#FFFFFF;
    --ink:#211E1A; --ink-soft:#655D4C; --rule:#E4DCC8;
    --success:#2E7D4F; --success-soft:#E1F2E7;
    --warn:#9A6A12; --warn-soft:#FAF0D6;
    --danger:#B5443E; --danger-soft:#FAE3E1;
    --accent-text:#1F3B6B; --focus:#1F3B6B;
    --gr-grid:#E7E0CF; --gr-axis:#5C5546; --gr-line:#2D55C4; --gr-alt:#B7801A; --gr-shade:rgba(45,85,196,.16);
    --chip-on:#1F3B6B; --chip-on-ink:#FFFFFF;
    --f-display:'Fraunces',Georgia,serif; --f-body:'Source Sans 3',-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
      --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
      --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
      --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
      --danger:#E38884; --danger-soft:#331D1B;
      --accent-text:#E0B75B; --focus:#E0B75B;
      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
    --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
    --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
    --danger:#E38884; --danger-soft:#331D1B;
    --accent-text:#E0B75B; --focus:#E0B75B;
    --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
    --chip-on:#E0B75B; --chip-on-ink:#141210;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;}
  h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.2;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
  i{font-family:var(--f-display); font-style:italic; font-weight:500;}
  .num{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
  .wrap{max-width:860px; margin:0 auto; padding-inline:16px;}

  /* header */
  header.brand{background:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%); color:#F4EFDF; padding-block:calc(18px + env(safe-area-inset-top,0px)) 22px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .crest{width:40px; height:40px; border-radius:10px; background:#C79A3E; color:#16264A; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:17px; flex-shrink:0;}
  .brand-name{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#E0B75B; font-weight:700;}
  .series-name{font-size:18px; font-weight:700; font-family:var(--f-display);}
  .series-name span{font-weight:400; font-size:14px; color:#CFD7EA; font-family:var(--f-body);}
  .crumbs{margin-top:16px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#AEB9D6; display:flex; flex-wrap:wrap; gap:4px 10px;}
  .crumbs b{color:#E0B75B; font-weight:700;}
  h1.title{font-size:clamp(26px,5vw,36px); margin-top:4px;}
  .summary{color:#D9DFEE; margin:6px 0 0; max-width:62ch;}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .meta span{font-size:13px; font-weight:700; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:99px; padding:4px 11px; color:#F4EFDF;}

  /* mode switch */
  .modebar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule);}
  .modebar .wrap{display:flex; gap:6px; align-items:center; padding-block:10px;}
  .tab{border:1.5px solid var(--rule); background:var(--card); border-radius:99px; padding:7px 18px; font-weight:700; cursor:pointer;}
  .tab[aria-selected="true"]{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .modebar .prog{margin-left:auto; font-size:13.5px; color:var(--ink-soft);}

  main{padding-block:22px 40px;}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  /* objectives overview */
  .los{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .los li{display:flex; gap:12px; align-items:flex-start;}
  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .lo-done{margin-left:auto; font-size:12.5px; color:var(--success); font-weight:700; flex-shrink:0;}

  /* lesson */
  .lesson{scroll-margin-top:70px;}
  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}
  .rules h3,.traps h3,.ex h3,.try h3{font-family:var(--f-body); font-size:13px; letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; color:var(--ink-soft);}
  .rules ul,.traps ul{margin:0; padding-left:20px;} .rules li,.traps li{margin:3px 0;}
  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}
  .spr small{color:var(--ink-soft); font-size:13.5px;}
  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}
  svg.gr{width:100%; max-width:300px; height:auto;}
  .gr-grid line{stroke:var(--gr-grid); stroke-width:1;}
  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .qhead .qn{font-family:var(--f-display); font-size:20px; font-weight:700;}
  .pill{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--paper-2); color:var(--ink-soft);}
  .pill.E{background:var(--success-soft); color:var(--success);} .pill.M{background:var(--warn-soft); color:var(--warn);} .pill.H{background:var(--danger-soft); color:var(--danger);}
  .qnav{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .chip{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--card); font:600 14px var(--f-mono); cursor:pointer;}
  .chip.ans{background:var(--paper-2); border-color:var(--ink-soft);}
  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .timer{font:600 14px var(--f-mono); color:var(--ink-soft); margin-left:auto;}
  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

var S = {"id": "ADV-3.2", "unit": "Advanced Math", "topic": "Nonlinear functions", "title": "Exponential functions and models", "intro": "An exponential function such as <i>f<\/i>(<i>x<\/i>) = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup> changes by the same <b>factor<\/b> over equal steps, where <i>a<\/i> is the starting value and <i>b<\/i> is the growth or decay factor. On the DSAT you will build these models from percent rates, doubling times and half-lives, convert rates between time units, tell linear from exponential relationships, and explain what each number in a model means.", "los": [{"id": "LO1", "text": "Identify the initial value and the growth or decay factor of <i>f<\/i>(<i>x<\/i>) = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup> from an equation, a table or a graph, and use them to evaluate the function."}, {"id": "LO2", "text": "Write and use exponential models from a percent change (<i>b<\/i> = 1 + <i>r<\/i> or <i>b<\/i> = 1 − <i>r<\/i>), a doubling time or a half-life."}, {"id": "LO3", "text": "Convert exponential models and rates between time units, using forms such as <i>a<\/i> · <i>b<\/i><sup><i>t<\/i>/<i>k<\/i><\/sup>."}, {"id": "LO4", "text": "Distinguish linear from exponential relationships in tables, graphs and verbal descriptions."}, {"id": "LO5", "text": "Interpret the constants and expressions in an exponential model in the context of the situation."}], "notes": [{"lo": "LO1", "h": "Initial value and factor", "html": "<p>An exponential function has the form <i>f<\/i>(<i>x<\/i>) = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup>, where <i>a<\/i> ≠ 0, <i>b<\/i> &gt; 0 and <i>b<\/i> ≠ 1. Each time <i>x<\/i> increases by 1, the output is <b>multiplied<\/b> by <i>b<\/i>. A linear function adds the same amount at every step; an exponential function multiplies by the same factor.<\/p><ul><li><b>Initial value:<\/b> <i>f<\/i>(0) = <i>a<\/i> · <i>b<\/i><sup>0<\/sup> = <i>a<\/i>, so <i>a<\/i> is the <i>y<\/i>-intercept.<\/li><li><b>Growth:<\/b> if <i>b<\/i> &gt; 1, the outputs increase.<\/li><li><b>Decay:<\/b> if 0 &lt; <i>b<\/i> &lt; 1, the outputs decrease toward 0.<\/li><\/ul><div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = 2(3)<sup><i>x<\/i><\/sup>: &nbsp;2, 6, 18, 54, …<br><i>g<\/i>(<i>x<\/i>) = 160(0.5)<sup><i>x<\/i><\/sup>: &nbsp;160, 80, 40, 20, …<\/div><div class=\"rule\">Find <i>b<\/i> by dividing consecutive outputs: <i>b<\/i> = <span class=\"fq\"><span><i>f<\/i>(<i>x<\/i> + 1)<\/span><span><i>f<\/i>(<i>x<\/i>)<\/span><\/span>.<\/div><p>Exponents come before multiplication: 2(3)<sup>2<\/sup> = 2 · 9 = 18, not 6<sup>2<\/sup> = 36. A negative input is allowed too: 2(3)<sup>−1<\/sup> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>.<\/p>"}, {"lo": "LO1", "h": "Reading an exponential graph", "html": "<p>When <i>a<\/i> &gt; 0, the graph of <i>y<\/i> = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup> crosses the <i>y<\/i>-axis at (0, <i>a<\/i>) and stays above the <i>x<\/i>-axis. A growth curve rises more and more steeply to the right. A decay curve falls and flattens out, getting closer and closer to the <i>x<\/i>-axis without ever touching it.<\/p><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Solid increasing curve y equals 2 to the x through (0, 1) and (3, 8); dashed decreasing curve y equals 8 times 0.5 to the x through (0, 8) and (3, 1); both curves stay above the x-axis\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10.00\" y1=\"10\" x2=\"10.00\" y2=\"250\"/><line x1=\"40.00\" y1=\"10\" x2=\"40.00\" y2=\"250\"/><line x1=\"70.00\" y1=\"10\" x2=\"70.00\" y2=\"250\"/><line x1=\"100.00\" y1=\"10\" x2=\"100.00\" y2=\"250\"/><line x1=\"130.00\" y1=\"10\" x2=\"130.00\" y2=\"250\"/><line x1=\"160.00\" y1=\"10\" x2=\"160.00\" y2=\"250\"/><line x1=\"190.00\" y1=\"10\" x2=\"190.00\" y2=\"250\"/><line x1=\"220.00\" y1=\"10\" x2=\"220.00\" y2=\"250\"/><line x1=\"250.00\" y1=\"10\" x2=\"250.00\" y2=\"250\"/><line x1=\"10\" y1=\"250.00\" x2=\"250\" y2 9.50,190.46 L131.11,188.96 L132.73,187.40 L134.34,185.78 L135.96,184.10 L137.57,182.35 L139.19,180.54 L140.80,178.66 L142.42,176.71 L144.03,174.68 L145.65,172.58 L147.26,170.40 L148.88,168.13 L150.49,165.78 L152.11,163.34 L153.72,160.80 L155.34,158.17 L156.95,155.44 L158.57,152.61 L160.18,149.66 L161.80,146.61 L163.41,143.44 L165.03,140.15 L166.64,136.73 L168.26,133.19 L169.87,129.51 L171.49,125.69 L173.10,121.72 L174.72,117.60 L176.33,113.33 L177.95,108.90 L179.56,104.29 L181.17,99.51 L182.79,94.55 L184.40,89.40 L186.02,84.06 L187.63,78.51 L189.25,72.75 L190.86,66.77 L192.48,60.57 L194.09,54.13 L195.71,47.44 L197.32,40.50 L198.94,33.30 L200.55,25.82 L202.17,18.06 L203.78,10.00\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><path class=\"fg-fit\" d=\"M86.22,10.00 L87.58,16.83 L88.95,23.45 L90.31,29.86 L91.68,36.07 L93.04,42.09 L94.41,47.93 L95.77,53.58 L97.14,59.05 L98.50,64.36 L99.87,69.50 L101.23,74.48 L102.60,79.31 L103.96,83.99 L105.33,88.52 L106.69,92.91 L108.05,97.17 L109.42,101.29 L110.78,105.29 L112.15,109.16 L113.51,112.91 L114.88,116.55 L116.24,120.07 L117.61,123.48 L118.97,126.79 L120.34,129.99 L121.70,133.10 L123.07,136.10 L124.43,139.02 L125.80,141.84 L127.16,144.58 L128.53,147.23 L129.89,149.80 L131.26,152.29 L132.62,154.70 L133.99,157.04 L135.35,159.31 L136.72,161.50 L138.08,163.63 L139.45,165.69 L140.81,167.68 L142.18,169.62 L143.54,171.49 L144.91,173.31 L146.27,175.07 L147.64,176.77 L149.00,178.43 L150.37,180.03 L151.73,181.58 L153.10,183.08 L154.46,184.54 L155.82,185.95 L157.19,187.32 L158.55,188.64 L159.92,189.93 L161.28,191.17 L162.65,192.37 L164.01,193.54 L165.38,194.67 L166.74,195.77 L168.11,196.83 L169.47,197.86 L170.84,198.86 L172.20,199.83 L173.57,200.76 L174.93,201.67 L176.30,202.55 L177.66,203.40 L179.03,204.23 L180.39,205.03 L181.76,205.80 L183.12,206.56 L184.49,207.28 L185.85,207.99 L187.22,208.67 L188.58,209.33 L189.95,209.98 L191.31,210.60 L192.68,211.20 L194.04,211.78 L195.41,212.35 L196.77,212.90 L198.14,213.43 L199.50,213.94 L200.87,214.44 L202.23,214.92 L203.59,215.39 L204.96,215.84 L206.32,216.28 L207.69,216.71 L209.05,217.12 L210.42,217.52 L211.78,217.91 L213.15,218.28 L214.51,218.65 L215.88,219.00 L217.24,219.34 L218.61,219.67 L219.97,219.99 L221.34,220.30 L222.70,220.61 L224.07,220.90 L225.43,221.18 L226.80,221.45 L228.16,221.72 L229.53,221.98 L230.89,222.22 L232.26,222.47 L233.62,222.70 L234.99,222.93 L236.35,223.15 L237.72,223.36 L239.08,223.57 L240.45,223.76 L241.81,223.96 L243.18,224.15 L244.54,224.33 L245.91,224.50 L247.27,224.67 L248.64,224.84 L250.00,225.00\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-dasharray=\"7 5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"100.00\" cy=\"210.00\" r=\"3\"/><circle cx=\"100.00\" cy=\"70.00\" r=\"3\"/><circle cx=\"190.00\" cy=\"70.00\" r=\"3\"/><circle cx=\"190.00\" cy=\"210.00\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"40.00\" y=\"244.00\" text-anchor=\"middle\">−2<\/text><text x=\"160.00\" y=\"244.00\" text-anchor=\"middle\">2<\/text><text x=\"220.00\" y=\"244.00\" text-anchor=\"middle\">4<\/text><text x=\"95.00\" y=\"194.00\" text-anchor=\"end\">2<\/text><text x=\"95.00\" y=\"154.00\" text-anchor=\"end\">4<\/text><text x=\"95.00\" y=\"114.00\" text-anchor=\"end\">6<\/text><text x=\"95.00\" y=\"74.00\" text-anchor=\"end\">8<\/text><text x=\"95.00\" y=\"34.00\" text-anchor=\"end\">10<\/text><text x=\"248\" y=\"224.00\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"107.00\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg><p>The solid curve is <i>y<\/i> = 2<sup><i>x<\/i><\/sup>, through (0, 1) and (3, 8). The dashed curve is <i>y<\/i> = 8(0.5)<sup><i>x<\/i><\/sup>, through (0, 8) and (3, 1).<\/p><div class=\"rule\">From a graph, read <i>a<\/i> at the <i>y<\/i>-intercept, then find <i>b<\/i> from two points one unit apart: <i>b<\/i> = (output at <i>x<\/i> + 1) ÷ (output at <i>x<\/i>). If the points are 2 units apart, that ratio is <i>b<\/i><sup>2<\/sup>.<\/div>"}, {"lo": "LO2", "h": "Percent change and the factor", "html": "<p>Most DSAT models describe change as a percent. If a quantity changes by a rate <i>r<\/i> each period (written as a decimal), the factor is the new amount divided by the old amount.<\/p><div class=\"rule\">Increase by <i>r<\/i>: <i>b<\/i> = 1 + <i>r<\/i>. &nbsp;Decrease by <i>r<\/i>: <i>b<\/i> = 1 − <i>r<\/i>.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Description<\/th><th>Factor<\/th><\/tr><tr><td>grows 6% per year<\/td><td>1.06<\/td><\/tr><tr><td>shrinks 6% per year<\/td><td>0.94<\/td><\/tr><tr><td>grows 150% per year<\/td><td>2.5<\/td><\/tr><tr><td>keeps 70% each year<\/td><td>0.7 (a 30% decrease)<\/td><\/tr><\/table><\/div><p>So a city of 40,000 people growing 6% per year is modeled by <i>P<\/i>(<i>t<\/i>) = 40,000(1.06)<sup><i>t<\/i><\/sup>. Going the other way, a factor of 0.88 means a 12% decrease, because 1 − 0.88 = 0.12, and a factor of 1.3 means a 30% increase.<\/p>"}, {"lo": "LO2", "h": "Doubling time and half-life", "html": "<p>Some models give the time it takes to multiply by a fixed amount instead of a percent. If a quantity doubles every <i>d<\/i> units of time, then in <i>t<\/i> units it doubles <i>t<\/i>/<i>d<\/i> times.<\/p><div class=\"eqs\">doubling time <i>d<\/i>: &nbsp;<i>A<\/i>(<i>t<\/i>) = <i>a<\/i>(2)<sup><i>t<\/i>/<i>d<\/i><\/sup><br>half-life <i>h<\/i>: &nbsp;<i>A<\/i>(<i>t<\/i>) = <i>a<\/i>(0.5)<sup><i>t<\/i>/<i>h<\/i><\/sup><\/div><p>A culture of 300 cells that doubles every 4 hours has 300(2)<sup>12/4<\/sup> = 300 · 8 = 2,400 cells after 12 hours. A 50 gram sample with a half-life of 10 days has 50(0.5)<sup>30/10<\/sup> = 6.25 grams after 30 days.<\/p><div class=\"rule\">The number dividing the time in the exponent is the time for one full doubling or halving.<\/div><div class=\"tip\"><b>DSAT tip:<\/b> when the time is a whole number of doublings or half-lives, just count the steps: 3 half-lives leave <span class=\"fq\"><span>1<\/span><span>8<\/span><\/span> of the start, and 3 doublings give 8 times the start.<\/div>"}, {"lo": "LO3", "h": "Changing the time unit", "html": "<p>A rate is always attached to a time unit. If a quantity grows 8% per <b>year<\/b> but <i>t<\/i> is measured in <b>months<\/b>, then <i>t<\/i> months is <i>t<\/i>/12 years:<\/p><div class=\"eqs\"><i>A<\/i>(<i>t<\/i>) = 500(1.08)<sup><i>t<\/i>/12<\/sup> &nbsp;(<i>t<\/i> in months)<br><i>A<\/i>(<i>y<\/i>) = 500(1.08)<sup><i>y<\/i><\/sup> &nbsp;(<i>y<\/i> in years)<\/div><p>To go from a short period to a longer one, raise the factor to a power: 1.08 per year is 1.08<sup>10<\/sup> ≈ 2.16 per decade. To go from a long period to a shorter one, take a root: the monthly factor is 1.08<sup>1/12<\/sup> ≈ 1.0064.<\/p><div class=\"rule\">Exponent rules: <i>b<\/i><sup><i>t<\/i>/<i>k<\/i><\/sup> = (<i>b<\/i><sup>1/<i>k<\/i><\/sup>)<sup><i>t<\/i><\/sup> and <i>b<\/i><sup><i>k<\/i><i>t<\/i><\/sup> = (<i>b<\/i><sup><i>k<\/i><\/sup>)<sup><i>t<\/i><\/sup>.<\/div><p>Do not simply divide the percent: 8% per year is <b>not<\/b> the same as <span class=\"fq\"><span>8<\/span><span>12<\/span><\/span>% per month, because each month the growth is applied to a slightly larger amount.<\/p>"}, {"lo": "LO4", "h": "Linear or exponential?", "html": "<p>To decide which kind of function fits a table, look at outputs for equal steps in <i>x<\/i>.<\/p><ul><li><b>Linear:<\/b> the outputs have a constant <b>difference<\/b> (the same amount is added).<\/li><li><b>Exponential:<\/b> the outputs have a constant <b>ratio<\/b> (the same factor multiplies).<\/li><\/ul><div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><td>linear <i>p<\/i>(<i>x<\/i>)<\/td><td>10<\/td><td>16<\/td><td>22<\/td><td>28<\/td><\/tr><tr><td>exponential <i>q<\/i>(<i>x<\/i>)<\/td><td>10<\/td><td>15<\/td><td>22.5<\/td><td>33.75<\/td><\/tr><\/table><\/div><p>In <i>p<\/i>, 6 is added each time; in <i>q<\/i>, each value is 1.5 times the one before. In words, \"increases by 40 per day\" is linear, while \"increases by 40% per day\" is exponential.<\/p><div class=\"rule\">An increasing exponential function eventually exceeds any increasing linear function, even if it starts out smaller.<\/div><div class=\"tip\"><b>Desmos tip:<\/b> enter the table in Desmos. Points on a straight line mean linear; points on a curve that bends upward more and more mean exponential growth.<\/div>"}, {"lo": "LO5", "h": "What each number means", "html": "<p>Interpreting a model means linking every number to the situation. Take <i>V<\/i>(<i>t<\/i>) = 1,200(0.9)<sup><i>t<\/i>/3<\/sup>, the value in dollars of a camera <i>t<\/i> years after it was bought.<\/p><ul><li><b>1,200<\/b> is <i>V<\/i>(0): the value when it was bought.<\/li><li><b>0.9<\/b> is the factor for one period: the camera keeps 90% of its value, so it <b>loses 10%<\/b>.<\/li><li><b>3<\/b> is the length of that period: the 10% loss happens every 3 years, not every year.<\/li><\/ul><p>Expressions have meanings too: <i>V<\/i>(6) is the value after 6 years, and <i>V<\/i>(0) − <i>V<\/i>(3) = 120 is the number of dollars lost in the first 3 years.<\/p><div class=\"rule\">In <i>a<\/i>(<i>b<\/i>)<sup><i>t<\/i>/<i>k<\/i><\/sup>: <i>a<\/i> is the starting amount, <i>b<\/i> is the factor per period and <i>k<\/i> is the length of one period.<\/div><div class=\"tip\"><b>DSAT tip:<\/b> to test a claim such as \"decreases by 10% each year,\" compare <i>V<\/i>(1) with <i>V<\/i>(0) on your calculator.<\/div>"}], "examples": [{"lo": "LO1", "q": "For <i>f<\/i>(<i>x<\/i>) = 5(3)<sup><i>x<\/i><\/sup>, give the initial value and the factor, decide whether <i>f<\/i> shows growth or decay, and find <i>f<\/i>(−1).", "steps": ["Initial value: <i>f<\/i>(0) = 5(3)<sup>0<\/sup> = 5 · 1 = 5.", "Factor: 3. Since 3 &gt; 1, the function shows growth; each output is 3 times the one before.", "<i>f<\/i>(−1) = 5(3)<sup>−1<\/sup> = 5 · <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>."], "ans": "<i>f<\/i>(−1) = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>"}, {"lo": "LO2", "q": "A town has 24,000 residents, and its population grows by 3.5% each year. Write a function <i>P<\/i> that gives the population <i>t<\/i> years from now.", "steps": ["The starting amount is 24,000.", "Growth of 3.5% per year gives the factor 1 + 0.035 = 1.035.", "So <i>P<\/i>(<i>t<\/i>) = 24,000(1.035)<sup><i>t<\/i><\/sup>. Check: <i>P<\/i>(1) = 24,840, which is 24,000 plus 3.5% of 24,000 ✓."], "ans": "<i>P<\/i>(<i>t<\/i>) = 24,000(1.035)<sup><i>t<\/i><\/sup>"}, {"lo": "LO2", "q": "A patient is given 80 milligrams of a medicine that has a half-life of 6 hours. How many milligrams remain after one full day?", "steps": ["One day is 24 hours, which is <span class=\"fq\"><span>24<\/span><span>6<\/span><\/span> = 4 half-lives.", "Amount: 80(0.5)<sup>4<\/sup> = 80 · <span class=\"fq\"><span>1<\/span><span>16<\/span><\/span>.", "So 5 milligrams remain."], "ans": "5 milligrams"}, {"lo": "LO3", "q": "The function <i>A<\/i>(<i>t<\/i>) = 2,000(1.06)<sup><i>t<\/i><\/sup> gives the value, in dollars, of an investment <i>t<\/i> years after it was made. Which function gives the value <i>m<\/i> months after it was made?<br>A) 2,000(1.06)<sup>12<i>m<\/i><\/sup><br>B) 2,000(1.06)<sup><i>m<\/i>/12<\/sup><br>C) 2,000(1.005)<sup><i>m<\/i><\/sup><br>D) 24,000(1.06)<sup><i>m<\/i><\/sup>", "steps": ["<i>m<\/i> months is <i>m<\/i>/12 years, so substitute <i>t<\/i> = <i>m<\/i>/12.", "This gives 2,000(1.06)<sup><i>m<\/i>/12<\/sup>. Check: <i>m<\/i> = 12 gives 2,000(1.06), the value after one year ✓.", "Choice C is a trap: 1.005<sup>12<\/sup> ≈ 1.0617, not exactly 1.06."], "ans": "B) 2,000(1.06)<sup><i>m<\/i>/12<\/sup>"}, {"lo": "LO3", "q": "A rabbit population increases by 21% every 2 years. If it grows by the same percent every year, what is the yearly percent increase?", "steps": ["The two-year factor is 1.21.", "If the yearly factor is <i>b<\/i>, then <i>b<\/i><sup>2<\/sup> = 1.21, so <i>b<\/i> = √1.21 = 1.1.", "A factor of 1.1 is a 10% increase per year (not 10.5%, which comes from halving 21%)."], "ans": "10%"}, {"lo": "LO4", "q": "The table shows values of a function <i>f<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i>)<\/th><td>4<\/td><td>12<\/td><td>36<\/td><td>108<\/td><\/tr><\/table><\/div>Is <i>f<\/i> linear or exponential? Find <i>f<\/i>(5).", "steps": ["Differences: 8, 24, 72 are not constant, so <i>f<\/i> is not linear.", "Ratios: <span class=\"fq\"><span>12<\/span><span>4<\/span><\/span> = <span class=\"fq\"><span>36<\/span><span>12<\/span><\/span> = <span class=\"fq\"><span>108<\/span><span>36<\/span><\/span> = 3, so the function is exponential with factor 3.", "The initial value is 4, so <i>f<\/i>(<i>x<\/i>) = 4(3)<sup><i>x<\/i><\/sup> and <i>f<\/i>(5) = 4 · 243 = 972."], "ans": "<i>f<\/i>(5) = 972"}, {"lo": "LO5", "q": "The function <i>V<\/i>(<i>t<\/i>) = 18,000(0.85)<sup><i>t<\/i><\/sup> gives the value, in dollars, of a car <i>t<\/i> years after it was bought. What do 18,000 and 0.85 mean in this context?", "steps": ["<i>V<\/i>(0) = 18,000, so 18,000 is the value of the car when it was bought.", "0.85 is the yearly factor: each year the car keeps 85% of its value from the year before.", "Keeping 85% means losing 1 − 0.85 = 0.15, or 15%, each year."], "ans": "The car was worth $18,000 when it was bought, and it loses 15% of its value each year."}], "traps": ["Using the percent as the factor: growth of 4% per year means multiplying by 1.04, not by 0.04 or by 4.", "Getting decay backward: a 20% decrease leaves 80%, so the factor is 0.8, not 0.2.", "Dividing the rate when changing time units: 12% per year is not 1% per month compounded. Keep the yearly factor and use the exponent <i>t<\/i>/12 when <i>t<\/i> is in months.", "Mixing up \"increases by 50 each year\" (linear, add 50) with \"increases by 50% each year\" (exponential, multiply by 1.5).", "Misreading the exponent in <i>a<\/i>(2)<sup><i>t<\/i>/3<\/sup>: the quantity doubles once every 3 time units, not 3 times per unit.", "Multiplying before using the exponent: 5(3)<sup>2<\/sup> is 5 · 9 = 45, not 15<sup>2<\/sup> = 225."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = 7(2)<sup><i>x<\/i><\/sup><\/div>What is the value of <i>f<\/i>(3)?", "opts": ["42", "56", "343", "2,744"], "ans": 1, "sol": "Apply the exponent first: 2<sup>3<\/sup> = 8.<br>Multiply: 7 · 8 = 56.<br>Answer: <b>56<\/b>", "hint": "Apply the exponent to 2 only, then multiply by 7."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "The balance in a savings account increases by 5% each year. By what factor is the balance multiplied each year?", "opts": ["0.05", "0.95", "1.05", "1.5"], "ans": 2, "sol": "The new balance is 100% + 5% = 105% of the old balance.<br>105% = 1.05.<br>Answer: <b>1.05<\/b>", "hint": "The new balance is the old balance plus 5% of it. Write that total percent as a decimal."}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "<div class=\"eqs\"><i>g<\/i>(<i>x<\/i>) = 640(0.5)<sup><i>x<\/i><\/sup><\/div>For what value of <i>x<\/i> is <i>g<\/i>(<i>x<\/i>) = 40?", "ans": ["4"], "sol": "Each increase of 1 in <i>x<\/i> halves the output: 640, 320, 160, 80, 40.<br>That is 4 halvings, so 640(0.5)<sup>4<\/sup> = 40.<br>Answer: <b>4<\/b>", "hint": "Halve 640 again and again and count how many halvings it takes."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Which of the following situations is best modeled by an exponential function?", "opts": ["A plant grows 2 centimeters each week.", "A tank loses 15 liters of water each hour.", "A taxi ride costs $3 plus $2 for each mile.", "A city's population increases by 2% each year."], "ans": 3, "sol": "Adding or subtracting the same amount each step (2 cm, 15 liters, $2) is linear.<br>Increasing by the same <b>percent<\/b> each year multiplies by 1.02 each year, which is exponential.<br>Answer: <b>A city's population increases by 2% each year.<\/b>", "hint": "Ask whether the same amount is added each time, or the same percent."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A laptop is worth $900 and loses 12% of its value each year. Which function gives its value <i>v<\/i>(<i>t<\/i>), in dollars, <i>t<\/i> years from now?", "opts": ["<i>v<\/i>(<i>t<\/i>) = 900(0.88)<sup><i>t<\/i><\/sup>", "<i>v<\/i>(<i>t<\/i>) = 900(0.12)<sup><i>t<\/i><\/sup>", "<i>v<\/i>(<i>t<\/i>) = 900(1.12)<sup><i>t<\/i><\/sup>", "<i>v<\/i>(<i>t<\/i>) = 900 − 108<i>t<\/i>"], "ans": 0, "sol": "Losing 12% leaves 100% − 12% = 88% each year, so the factor is 0.88.<br>The starting value is 900.<br>(900 − 108<i>t<\/i> subtracts 12% of the <b>original<\/b> value each year, which is linear.)<br>Answer: <b><i>v<\/i>(<i>t<\/i>) = 900(0.88)<sup><i>t<\/i><\/sup><\/b>", "hint": "A 12% loss leaves what percent of the value?"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The function <i>A<\/i>(<i>m<\/i>) = 3,000(1.005)<sup><i>m<\/i><\/sup> gives the balance, in dollars, of an account <i>m<\/i> months after it was opened. Which function gives the balance <i>y<\/i> years after it was opened?", "opts": ["3,000(1.005)<sup><i>y<\/i>/12<\/sup>", "3,000(1.005)<sup>12<i>y<\/i><\/sup>", "3,000(1.06)<sup><i>y<\/i><\/sup>", "36,000(1.005)<sup><i>y<\/i><\/sup>"], "ans": 1, "sol": "<i>y<\/i> years is 12<i>y<\/i> months.<br>Substitute <i>m<\/i> = 12<i>y<\/i>: 3,000(1.005)<sup>12<i>y<\/i><\/sup>.<br>(1.06 is a trap: 1.005<sup>12<\/sup> ≈ 1.0617.)<br>Answer: <b>3,000(1.005)<sup>12<i>y<\/i><\/sup><\/b>", "hint": "How many months are in <i>y<\/i> years? Replace <i>m<\/i> with that."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The graph of <i>y<\/i> = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup> is shown, where <i>a<\/i> and <i>b<\/i> are constants.<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-labe 76.00\" y=\"124.00\" text-anchor=\"start\">(1, 6)<\/text><text x=\"216.00\" y=\"34.00\" text-anchor=\"start\">(2, 12)<\/text><text x=\"248\" y=\"214.00\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137.00\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>Which equation could define the graph?", "opts": ["<i>y<\/i> = 2(3)<sup><i>x<\/i><\/sup>", "<i>y<\/i> = 3<i>x<\/i> + 3", "<i>y<\/i> = 3(2)<sup><i>x<\/i><\/sup>", "<i>y<\/i> = 6(0.5)<sup><i>x<\/i><\/sup>"], "ans": 2, "sol": "The <i>y<\/i>-intercept is (0, 3), so <i>a<\/i> = 3.<br>From (0, 3) to (1, 6) the output is multiplied by 2, so <i>b<\/i> = 2. Check (2, 12): 3 · 4 = 12 ✓.<br>(<i>y<\/i> = 3<i>x<\/i> + 3 passes through (0, 3) and (1, 6) but gives 9, not 12, at <i>x<\/i> = 2.)<br>Answer: <b><i>y<\/i> = 3(2)<sup><i>x<\/i><\/sup><\/b>", "hint": "Read the <i>y<\/i>-intercept, then compare the <i>y<\/i>-values at <i>x<\/i> = 0 and <i>x<\/i> = 1."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The function <i>N<\/i>(<i>t<\/i>) = 2,500(1.08)<sup><i>t<\/i><\/sup> estimates the number of members of a cycling club <i>t<\/i> years after 2020. What is the best interpretation of 2,500 in this context?", "opts": ["The estimated number of members in 2020", "The estimated increase in the number of members each year", "The estimated number of members in 2021", "The estimated percent increase in the number of members each year"], "ans": 0, "sol": "<i>N<\/i>(0) = 2,500(1.08)<sup>0<\/sup> = 2,500.<br><i>t<\/i> = 0 means the year 2020.<br>Answer: <b>The estimated number of members in 2020<\/b>", "hint": "What is <i>N<\/i>(0), and which year does <i>t<\/i> = 0 stand for?"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "The table shows three values of an exponential function <i>f<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i>)<\/th><td>12<\/td><td>18<\/td><td>27<\/td><\/tr><\/table><\/div>What is the value of <i>f<\/i>(0)?", "ans": ["8"], "sol": "Ratio: <span class=\"fq\"><span>18<\/span><span>12<\/span><\/span> = <span class=\"fq\"><span>27<\/span><span>18<\/span><\/span> = 1.5, so each step multiplies by 1.5.<br>Step back from <i>x<\/i> = 1 to <i>x<\/i> = 0 by dividing: 12 ÷ 1.5 = 8.<br>Answer: <b>8<\/b>", "hint": "Find the common ratio, then step backward one place by dividing."}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>A<\/i>(<i>t<\/i>) = 96(0.5)<sup><i>t<\/i>/5<\/sup><\/div>The function gives the mass, in grams, of a radioactive sample <i>t<\/i> days after it was measured. For what value of <i>t<\/i> is <i>A<\/i>(<i>t<\/i>) = 12?", "ans": ["15"], "sol": "<span class=\"fq\"><span>12<\/span><span>96<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>8<\/span><\/span> = (0.5)<sup>3<\/sup>, so <i>t<\/i>/5 = 3.<br><i>t<\/i> = 15.<br>Answer: <b>15<\/b>", "hint": "What fraction of 96 is 12? How many halvings give that fraction?"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A quantity increases by 10% each year. By approximately what percent does it increase over each three-year period?", "opts": ["3.3%", "30%", "133.1%", "33.1%"], "ans": 3, "sol": "The three-year factor is 1.1<sup>3<\/sup> = 1.331.<br>1.331 − 1 = 0.331, an increase of 33.1% (not 30%, since each year's growth builds on the last).<br>Answer: <b>33.1%<\/b>", "hint": "Find the three-year factor first by multiplying the yearly factor by itself three times."}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>f<\/i>(<i>t<\/i>) = 400(0.8)<sup><i>t<\/i>/6<\/sup><\/div>The function gives the mass, in grams, of a substance <i>t<\/i> hours after an experiment began. Which statement is true?", "opts": ["The mass decreases by 20% every 6 hours.", "The mass decreases by 80% every 6 hours.", "The mass decreases by 20% every hour.", "The mass decreases by 6% every hour."], "ans": 0, "sol": "Increasing <i>t<\/i> by 6 increases the exponent by 1, which multiplies the mass by 0.8.<br>Keeping 80% means losing 20%, every 6 hours.<br>(Per hour the factor is 0.8<sup>1/6<\/sup> ≈ 0.964, about a 3.6% decrease.)<br>Answer: <b>The mass decreases by 20% every 6 hours.<\/b>", "hint": "Compare <i>f<\/i>(<i>t<\/i> + 6) with <i>f<\/i>(<i>t<\/i>)."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><i>h<\/i>(<i>x<\/i>) = 4(5)<sup><i>x<\/i><\/sup><\/div>What is the value of <i>h<\/i>(0)?", "opts": ["0", "4", "5", "20"], "ans": 1, "sol": "Any nonzero number to the power 0 is 1: 5<sup>0<\/sup> = 1.<br><i>h<\/i>(0) = 4 · 1 = 4.<br>Answer: <b>4<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which of the following functions is decreasing?", "opts": ["<i>f<\/i>(<i>x<\/i>) = 3(1.4)<sup><i>x<\/i><\/sup>", "<i>f<\/i>(<i>x<\/i>) = 0.5(2)<sup><i>x<\/i><\/sup>", "<i>f<\/i>(<i>x<\/i>) = 6(0.7)<sup><i>x<\/i><\/sup>", "<i>f<\/i>(<i>x<\/i>) = 2(3)<sup><i>x<\/i><\/sup>"], "ans": 2, "sol": "With a positive starting value, the function decreases when the factor is between 0 and 1.<br>Only 0.7 is less than 1; the coefficient 0.5 is the starting value, not the factor.<br>Answer: <b><i>f<\/i>(<i>x<\/i>) = 6(0.7)<sup><i>x<\/i><\/sup><\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Each year, a quantity is multiplied by 0.93. Which of the following describes the change in the quantity?", "opts": ["An increase of 93% each year", "A decrease of 93% each year", "An increase of 7% each year", "A decrease of 7% each year"], "ans": 3, "sol": "The factor is less than 1, so the quantity decreases.<br>1 − 0.93 = 0.07, a 7% decrease.<br>Answer: <b>A decrease of 7% each year<\/b>"}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "A tree nursery has 5,000 seedlings. The number of seedlings increases by 10% each year. How many more seedlings will the nursery have after 2 years than it has now?", "ans": ["1050"], "sol": "After 2 years: 5,000(1.1)<sup>2<\/sup> = 5,000(1.21) = 6,050.<br>Increase: 6,050 − 5,000 = 1,050.<br>Answer: <b>1050<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "For <i>x<\/i> = 0, 1, 2 and 3, which list of <i>y<\/i>-values shows an exponential relationship between <i>x<\/i> and <i>y<\/i>?", "opts": ["5, 10, 20, 40", "5, 10, 15, 20", "5, 6, 9, 14", "5, 10, 20, 35"], "ans": 0, "sol": "Check ratios of consecutive values.<br>5, 10, 20, 40: each value is 2 times the one before, a constant ratio. (5, 10, 15, 20 has a constant difference, so it is linear.)<br>Answer: <b>5, 10, 20, 40<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = 2(3)<sup><i>x<\/i><\/sup><\/div>When <i>x<\/i> increases by 2, the value of <i>f<\/i>(<i>x<\/i>) is multiplied by what number?", "opts": ["3", "6", "9", "18"], "ans": 2, "sol": "Each increase of 1 multiplies by 3.<br>Two increases multiply by 3 · 3 = 9.<br>Answer: <b>9<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "An ant colony has 1,600 ants. Each year the colony is 25% smaller than it was the year before. How many ants will the colony have after 2 years?", "opts": ["100", "900", "800", "1,200"], "ans": 1, "sol": "25% smaller each year means a factor of 0.75.<br>1,600(0.75)<sup>2<\/sup> = 1,600(0.5625) = 900.<br>(800 comes from subtracting 25% of 1,600 twice, which is linear.)<br>Answer: <b>900<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A colony of 50 bacteria doubles in size every 3 hours. Which function gives the number of bacteria <i>h<\/i> hours from now?", "opts": ["50(2)<sup><i>h<\/i>/3<\/sup>", "50(2)<sup>3<i>h<\/i><\/sup>", "50(3)<sup><i>h<\/i>/2<\/sup>", "50(2)<sup><i>h<\/i><\/sup>"], "ans": 0, "sol": "In <i>h<\/i> hours the colony doubles <i>h<\/i>/3 times.<br>So the number is 50(2)<sup><i>h<\/i>/3<\/sup>. Check: <i>h<\/i> = 3 gives 100 ✓.<br>Answer: <b>50(2)<sup><i>h<\/i>/3<\/sup><\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>P<\/i>(<i>t<\/i>) = 600(1.1)<sup><i>t<\/i><\/sup><\/div>Which of the following is equivalent to <i>P<\/i>(<i>t<\/i>)?", "opts": ["600(1.21)<sup>2<i>t<\/i><\/sup>", "600(1.2)<sup><i>t<\/i>/2<\/sup>", "600(1.05)<sup>2<i>t<\/i><\/sup>", "600(1.21)<sup><i>t<\/i>/2<\/sup>"], "ans": 3, "sol": "1.1 = (1.21)<sup>1/2<\/sup> because 1.1<sup>2<\/sup> = 1.21.<br>So 1.1<sup><i>t<\/i><\/sup> = ((1.21)<sup>1/2<\/sup>)<sup><i>t<\/i><\/sup> = (1.21)<sup><i>t<\/i>/2<\/sup>.<br>Answer: <b>600(1.21)<sup><i>t<\/i>/2<\/sup><\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Under plan A, an employee's salary increases by $2,000 each year. Under plan B, the salary increases by 4% each year. Which statement correctly describes the salary under each plan as a function of time?", "opts": ["Both plans are linear.", "Plan A is linear and plan B is exponential.", "Plan A is exponential and plan B is linear.", "Both plans are exponential."], "ans": 1, "sol": "Plan A adds the same amount, $2,000, each year: linear.<br>Plan B multiplies by 1.04 each year: exponential.<br>Answer: <b>Plan A is linear and plan B is exponential.<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The function <i>C<\/i>(<i>t<\/i>) = 75(1.03)<sup><i>t<\/i><\/sup> estimates the price, in dollars, of a concert ticket <i>t<\/i> years after 2024. What does 1.03 indicate?", "opts": ["The price increases by 3% each year.", "The price increases by $1.03 each year.", "The price increases by 103% each year.", "The price increases by $3 each year."], "ans": 0, "sol": "1.03 = 1 + 0.03, a factor for a 3% increase.<br>The price is multiplied by 1.03 each year; it does not add a fixed number of dollars.<br>Answer: <b>The price increases by 3% each year.<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The graph of <i>y<\/i> = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup> is shown, where <i>a<\/i> and <i>b<\/i> are positive constants.<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Decreasing exponential curve passing through the marked points (0, 8), (1, 4) and (2, 2), flattening toward the x-axis on the right\"> end\">6<\/text><text x=\"65.00\" y=\"74.00\" text-anchor=\"end\">8<\/text><text x=\"65.00\" y=\"34.00\" text-anchor=\"end\">10<\/text><text x=\"76.00\" y=\"64.00\" text-anchor=\"start\">(0, 8)<\/text><text x=\"106.00\" y=\"144.00\" text-anchor=\"start\">(1, 4)<\/text><text x=\"136.00\" y=\"184.00\" text-anchor=\"start\">(2, 2)<\/text><text x=\"248\" y=\"224.00\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"77.00\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>What is the value of <i>b<\/i>?", "opts": ["2", "4", "0.5", "8"], "ans": 2, "sol": "From (0, 8) to (1, 4), the output is multiplied by <span class=\"fq\"><span>4<\/span><span>8<\/span><\/span> = 0.5.<br>Check (1, 4) to (2, 2): <span class=\"fq\"><span>2<\/span><span>4<\/span><\/span> = 0.5 ✓. (8 is <i>a<\/i>, the <i>y<\/i>-intercept.)<br>Answer: <b>0.5<\/b>"}, {"lo": "LO5", "diff": "M", "type": "spr", "q": "The function <i>V<\/i>(<i>t<\/i>) = 32,000(0.9)<sup><i>t<\/i><\/sup> gives the value, in dollars, of a machine <i>t<\/i> years after it was bought. According to the model, how many dollars of value does the machine lose during the first year?", "ans": ["3200"], "sol": "<i>V<\/i>(0) = 32,000 and <i>V<\/i>(1) = 32,000(0.9) = 28,800.<br>Loss: 32,000 − 28,800 = 3,200.<br>Answer: <b>3200<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "<div class=\"eqs\"><i>P<\/i>(<i>t<\/i>) = 2,000(1.5)<sup><i>t<\/i>/4<\/sup><\/div>The function gives the population of a town <i>t<\/i> years after it was founded. By what percent does the population increase every 8 years?", "ans": ["125"], "sol": "Every 4 years the factor is 1.5, so every 8 years it is 1.5<sup>2<\/sup> = 2.25.<br>2.25 − 1 = 1.25, an increase of 125%.<br>Answer: <b>125<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A medicine has a half-life of 8 hours. Twenty-four hours after a dose was taken, 15 milligrams of the medicine remained in a patient's body. How many milligrams were in the original dose?", "opts": ["45", "60", "360", "120"], "ans": 3, "sol": "24 hours is <span class=\"fq\"><span>24<\/span><span>8<\/span><\/span> = 3 half-lives, so <span class=\"fq\"><span>1<\/span><span>8<\/span><\/span> of the dose remains.<br>Dose · <span class=\"fq\"><span>1<\/span><span>8<\/span><\/span> = 15, so the dose is 120 milligrams.<br>Answer: <b>120<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "The table shows two values of an exponential function <i>f<\/i>, where <i>f<\/i>(<i>x<\/i>) = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup> and <i>b<\/i> &gt; 0.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>1<\/td><td>3<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i>)<\/th><td>6<\/td><td>54<\/td><\/tr><\/table><\/div>What is the value of <i>f<\/i>(4)?", "ans": ["162"], "sol": "From <i>x<\/i> = 1 to <i>x<\/i> = 3 is two steps: <i>b<\/i><sup>2<\/sup> = <span class=\"fq\"><span>54<\/span><span>6<\/span><\/span> = 9, so <i>b<\/i> = 3.<br><i>f<\/i>(4) = 54 · 3 = 162.<br>Answer: <b>162<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The balance of an account grows by 10% per year. Which expression gives the <b>monthly<\/b> growth factor that produces exactly a 10% increase over 12 months?", "opts": ["(1.1)<sup>1/12<\/sup>", "<span class=\"fq\"><span>1.1<\/span><span>12<\/span><\/span>", "(1.1)<sup>12<\/sup>", "1 + <span class=\"fq\"><span>0.1<\/span><span>12<\/span><\/span>"], "ans": 0, "sol": "The monthly factor <i>b<\/i> must satisfy <i>b<\/i><sup>12<\/sup> = 1.1.<br>So <i>b<\/i> = (1.1)<sup>1/12<\/sup> ≈ 1.00797. (1 + <span class=\"fq\"><span>0.1<\/span><span>12<\/span><\/span> ≈ 1.00833 grows too fast: 1.00833<sup>12<\/sup> ≈ 1.1047.)<br>Answer: <b>(1.1)<sup>1/12<\/sup><\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>P<\/i>(<i>t<\/i>) = 8,000(1.25)<sup><i>t<\/i>/2<\/sup><\/div>The function gives the number of fish in a lake <i>t<\/i> years after a study began. What is the best interpretation of 8,000(1.25)<sup>3<\/sup>?", "opts": ["The number of fish 3 years after the study began", "The number of fish 1.5 years after the study began", "The increase in the number of fish during the first 3 years", "The number of fish 6 years after the study began"], "ans": 3, "sol": "8,000(1.25)<sup>3<\/sup> is <i>P<\/i>(<i>t<\/i>) with <i>t<\/i>/2 = 3.<br>So <i>t<\/i> = 6: it is the number of fish after 6 years.<br>Answer: <b>The number of fish 6 years after the study began<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "An investment of $3,000 doubles in value every 6 years. Which of the following is closest to its value after 15 years?", "opts": ["$7,500", "$16,971", "$22,500", "$96,000"], "ans": 1, "sol": "15 years is <span class=\"fq\"><span>15<\/span><span>6<\/span><\/span> = 2.5 doublings.<br>3,000(2)<sup>2.5<\/sup> ≈ 3,000(5.657) ≈ 16,971.<br>Answer: <b>$16,971<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "For the exponential function <i>f<\/i>(<i>x<\/i>) = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup>, where <i>b<\/i> &gt; 0, <i>f<\/i>(0) = 4 and <i>f<\/i>(3) = 500. What is the value of <i>f<\/i>(−1)?", "ans": ["4/5", ".8", "0.8"], "sol": "<i>a<\/i> = <i>f<\/i>(0) = 4.<br>4<i>b<\/i><sup>3<\/sup> = 500, so <i>b<\/i><sup>3<\/sup> = 125 and <i>b<\/i> = 5.<br><i>f<\/i>(−1) = 4 · 5<sup>−1<\/sup> = <span class=\"fq\"><span>4<\/span><span>5<\/span><\/span>.<br>Answer: <b>4/5<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "For the function <i>f<\/i>(<i>x<\/i>) = 3 · <i>b<\/i><sup><i>x<\/i><\/sup>, where <i>b<\/i> is a positive constant, <i>f<\/i>(2) = 48. What is the value of <i>b<\/i>?", "opts": ["2", "8", "4", "16"], "ans": 2, "sol": "3<i>b<\/i><sup>2<\/sup> = 48, so <i>b<\/i><sup>2<\/sup> = 16.<br>Since <i>b<\/i> &gt; 0, <i>b<\/i> = 4.<br>Answer: <b>4<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A video had 4,000 views when it was posted. Its number of views then increased by 150% each day. Which function gives the number of views <i>d<\/i> days after it was posted?", "opts": ["4,000(2.5)<sup><i>d<\/i><\/sup>", "4,000(1.5)<sup><i>d<\/i><\/sup>", "4,000(1.15)<sup><i>d<\/i><\/sup>", "4,000 + 6,000<i>d<\/i>"], "ans": 0, "sol": "An increase of 150% gives a factor of 1 + 1.5 = 2.5.<br>So the views are 4,000(2.5)<sup><i>d<\/i><\/sup>.<br>Answer: <b>4,000(2.5)<sup><i>d<\/i><\/sup><\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The table shows values of an exponential function <i>g<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>0<\/td><td>2<\/td><td>4<\/td><td>6<\/td><\/tr><tr><th><i>g<\/i>(<i>x<\/i>)<\/th><td>1,000<\/td><td>640<\/td><td>409.6<\/td><td>262.144<\/td><\/tr><\/table><\/div>Which equation defines <i>g<\/i>?", "opts": ["<i>g<\/i>(<i>x<\/i>) = 1,000(0.64)<sup><i>x<\/i><\/sup>", "<i>g<\/i>(<i>x<\/i>) = 1,000 − 180<i>x<\/i>", "<i>g<\/i>(<i>x<\/i>) = 1,000(0.82)<sup><i>x<\/i><\/sup>", "<i>g<\/i>(<i>x<\/i>) = 1,000(0.8)<sup><i>x<\/i><\/sup>"], "ans": 3, "sol": "The values are 2 units of <i>x<\/i> apart, so 0.64 is <i>b<\/i><sup>2<\/sup>.<br><i>b<\/i> = √0.64 = 0.8, and <i>a<\/i> = 1,000. Check: 1,000(0.8)<sup>6<\/sup> = 262.144 ✓.<br>Answer: <b><i>g<\/i>(<i>x<\/i>) = 1,000(0.8)<sup><i>x<\/i><\/sup><\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The function <i>E<\/i>(<i>t<\/i>) = 12(1.18)<sup><i>t<\/i><\/sup> estimates the number of electric buses in a city <i>t<\/i> years after 2022. Which of the following is the best interpretation of the statement \"<i>E<\/i>(5) is approximately 27\"?", "opts": ["The number of electric buses increases by about 27 each year.", "In 2027, the city has about 27 electric buses.", "In 2022, the city has about 27 electric buses.", "About 27 years after 2022, the city has 5 electric buses."], "ans": 1, "sol": "The input 5 means 5 years after 2022, which is 2027.<br>The output, 12(1.18)<sup>5<\/sup> ≈ 27.5, is the number of buses.<br>Answer: <b>In 2027, the city has about 27 electric buses.<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "<div class=\"eqs\"><i>P<\/i>(<i>m<\/i>) = 5,000(1.3)<sup><i>m<\/i>/12<\/sup><\/div>The function gives the number of users of an app <i>m<\/i> months after its launch. By what percent does the number of users increase each year?", "ans": ["30"], "sol": "One year is 12 months, which adds 1 to the exponent.<br>So each year the number is multiplied by 1.3, a 30% increase.<br>Answer: <b>30<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The graph of the exponential function <i>f<\/i>, where <i>f<\/i>(<i>x<\/i>) = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup>, is shown.<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Increasing exponential curve passing through the marked points (−1, 1) and (1, 9); the y-intercept is not marked\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10.00\" y1=\"10\" x2=\"10.00\" y2=\"250\"/><line x1=\"50.00\" y1=\"10\" x2=\"50.00\" y2=\"250\"/><line x1=\"90.00\" y1=\"10\" x2=\"90.00\" y2=\"250\"/><line x1=\"130.00\" y1=\"10\" x2=\"130.00\" y2=\"250\"/><line x1=\"170.00\" y1=\"10\" x2=\"170.00\" y2=\"250\"/><line x1=\"210.00\" y1=\"10\" x2=\"210.00\" y2=\"250\"/><line x1=\"250.00\" y1=\"10\" x2=\"250.00\" y2=\"250\"/><line x1=\"10\" y1=\"250.00\" x2=\"250\" y2=\"250.00\"/><line x1=\"10\" y1=\"223.33\" x2=\"250\" y2=\"223.33\"/><line x1=\"10\" y1=\"196.67\" x2=\"250\" y2=\"196.67\"/><line x1=\"10\" y1=\"170.00\" x2=\"250\" y2=\"170.00\"/><line x1=\"10\" y1=\"143.33\" x2=\"250\" y2=\"143.33\"/><line x1=\"10\" y1=\"116.67\" x2=\"250\" y2=\"116.67\"/><line x1=\"10\" y1=\"90.00\" x2=\"250\" y2=\"90.00\"/><line x1=\"10\" y1=\"63.33\" x2=\"250\" y2=\"63.33\"/><line x1=\"10\" y1=\"36.67\" x2=\"250\" y2=\"36.67\"/><line x1=\"10\" y1=\"10.00\" x2=\"250\" y2=\"10.00\"/><\/g><line class=\"fg-axis\" x1=\"6\" y1=\"223.33\" x2=\"254\" y2=\"223.33\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130.00\" y1=\"6\" x2=\"130.00\" y2=\"254\" stroke=\"currentColor\" stroke-width=\" currentColor\" font-size=\"11\"><text x=\"10.00\" y=\"237.33\" text-anchor=\"middle\">−3<\/text><text x=\"50.00\" y=\"237.33\" text-anchor=\"middle\">−2<\/text><text x=\"90.00\" y=\"237.33\" text-anchor=\"middle\">−1<\/text><text x=\"170.00\" y=\"237.33\" text-anchor=\"middle\">1<\/text><text x=\"210.00\" y=\"237.33\" text-anchor=\"middle\">2<\/text><text x=\"125.00\" y=\"174.00\" text-anchor=\"end\">4<\/text><text x=\"125.00\" y=\"120.67\" text-anchor=\"end\">8<\/text><text x=\"125.00\" y=\"67.33\" text-anchor=\"end\">12<\/text><text x=\"96.00\" y=\"204.00\" text-anchor=\"start\">(−1, 1)<\/text><text x=\"176.00\" y=\"97.33\" text-anchor=\"start\">(1, 9)<\/text><text x=\"248\" y=\"217.33\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137.00\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>What is the value of <i>f<\/i>(2)?", "opts": ["27", "13", "18", "81"], "ans": 0, "sol": "From <i>x<\/i> = −1 to <i>x<\/i> = 1 is two steps: <i>b<\/i><sup>2<\/sup> = <span class=\"fq\"><span>9<\/span><span>1<\/span><\/span> = 9, so <i>b<\/i> = 3.<br>Then <i>a<\/i> = 9 ÷ 3 = 3, so <i>f<\/i>(<i>x<\/i>) = 3(3)<sup><i>x<\/i><\/sup> and <i>f<\/i>(2) = 27.<br>(13 comes from the line through the two points.)<br>Answer: <b>27<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A radioactive sample had a mass of 2,400 grams. Nine years later its mass was 300 grams. What is the half-life of the sample, in years?", "opts": ["4.5", "8", "3", "27"], "ans": 2, "sol": "<span class=\"fq\"><span>300<\/span><span>2400<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>8<\/span><\/span> = (0.5)<sup>3<\/sup>, so 9 years is 3 half-lives.<br>Half-life: 9 ÷ 3 = 3 years.<br>Answer: <b>3<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>A<\/i>(<i>t<\/i>) = 5,000(1.0075)<sup><i>t<\/i><\/sup><\/div>The function gives the value, in dollars, of an investment <i>t<\/i> months after it was made. Which of the following is closest to the percent increase in the value each year?", "opts": ["0.75%", "9%", "12%", "9.38%"], "ans": 3, "sol": "The yearly factor is 1.0075<sup>12<\/sup> ≈ 1.0938.<br>That is an increase of about 9.38% per year (9% ignores the compounding).<br>Answer: <b>9.38%<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "A linear function <i>f<\/i> and an exponential function <i>g<\/i>, where <i>g<\/i>(<i>x<\/i>) = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup> and <i>b<\/i> &gt; 0, satisfy <i>f<\/i>(0) = <i>g<\/i>(0) = 10 and <i>f<\/i>(2) = <i>g<\/i>(2) = 40. What is the value of <i>g<\/i>(4) − <i>f<\/i>(4)?", "ans": ["90"], "sol": "Linear: slope = <span class=\"fq\"><span>40 − 10<\/span><span>2<\/span><\/span> = 15, so <i>f<\/i>(4) = 10 + 60 = 70.<br>Exponential: <i>b<\/i><sup>2<\/sup> = 4, so <i>b<\/i> = 2 and <i>g<\/i>(4) = 10 · 16 = 160.<br>160 − 70 = 90.<br>Answer: <b>90<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>T<\/i>(<i>m<\/i>) = 70 + 110(0.95)<sup><i>m<\/i><\/sup><\/div>The function gives the temperature, in degrees Fahrenheit, of a cup of tea <i>m<\/i> minutes after it was poured. What does 70 represent?", "opts": ["The temperature of the tea when it was poured", "The temperature the tea approaches as time passes", "The number of degrees the tea cools each minute", "The temperature of the tea 1 minute after it was poured"], "ans": 1, "sol": "<i>T<\/i>(0) = 70 + 110 = 180, so the pouring temperature is 180, not 70.<br>As <i>m<\/i> grows, 110(0.95)<sup><i>m<\/i><\/sup> gets close to 0, so <i>T<\/i>(<i>m<\/i>) gets close to 70.<br>Answer: <b>The temperature the tea approaches as time passes<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "The population of a village decreased by 4% each year. After 3 years the population was 13,824. What was the population when the decrease began?", "ans": ["15625"], "sol": "Let the starting population be <i>p<\/i>: <i>p<\/i>(0.96)<sup>3<\/sup> = 13,824.<br>(0.96)<sup>3<\/sup> = 0.884736, so <i>p<\/i> = 13,824 ÷ 0.884736 = 15,625.<br>Answer: <b>15625<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "For the exponential function <i>f<\/i>(<i>x<\/i>) = <i>a<\/i> · <i>b<\/i><sup><i>x<\/i><\/sup>, where <i>b<\/i> &gt; 0, <i>f<\/i>(1) = 12 and <i>f<\/i>(4) = 40.5. What is the value of <i>a<\/i>?", "opts": ["8", "6", "12", "18"], "ans": 0, "sol": "<i>b<\/i><sup>3<\/sup> = <span class=\"fq\"><span>40.5<\/span><span>12<\/span><\/span> = 3.375, so <i>b<\/i> = 1.5.<br><i>a<\/i> = <i>f<\/i>(0) = 12 ÷ 1.5 = 8.<br>Answer: <b>8<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A population of 200 bacteria triples every 5 hours. Which function gives the number of bacteria <i>d<\/i> days from now?", "opts": ["200(3)<sup>5<i>d<\/i>/24<\/sup>", "200(3)<sup><i>d<\/i>/5<\/sup>", "200(3)<sup>120<i>d<\/i><\/sup>", "200(3)<sup>24<i>d<\/i>/5<\/sup>"], "ans": 3, "sol": "<i>d<\/i> days is 24<i>d<\/i> hours, and the population triples once every 5 hours.<br>Number of triplings: 24<i>d<\/i>/5, so the function is 200(3)<sup>24<i>d<\/i>/5<\/sup>.<br>Answer: <b>200(3)<sup>24<i>d<\/i>/5<\/sup><\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The function <i>P<\/i>(<i>t<\/i>) = <i>a<\/i>(1.2)<sup><i>t<\/i><\/sup> models the population of a town <i>t<\/i> years after 2010, where <i>a<\/i> is a constant. If <i>P<\/i>(5) = 24,883.2, which of the following gives the value of <i>a<\/i> and its meaning?", "opts": ["<i>a<\/i> = 10,000; it is the yearly increase in the population.", "<i>a<\/i> = 20,736; it is the population in 2010.", "<i>a<\/i> = 10,000; it is the population in 2010.", "<i>a<\/i> = 4,976.64; it is the population in 2010."], "ans": 2, "sol": "<i>a<\/i>(1.2)<sup>5<\/sup> = 24,883.2 and 1.2<sup>5<\/sup> = 2.48832, so <i>a<\/i> = 10,000.<br><i>a<\/i> = <i>P<\/i>(0), the population in 2010. (20,736 is <i>P<\/i>(4), the population in 2014.)<br>Answer: <b><i>a<\/i> = 10,000; it is the population in 2010.<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The table shows values of <i>y<\/ /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
