(function(){

var S = {"id": "ADV-2.4", "unit": "Advanced Math", "topic": "Nonlinear equations in one variable and systems", "title": "Systems of linear and nonlinear equations", "intro": "A system that pairs a line with a parabola, a circle or an absolute value graph asks for the points the two graphs share. On the DSAT you solve these by substitution, count the solutions with the discriminant, read them from a graph, or find the constant that makes a line just touch a curve.", "los": [{"id": "LO1", "text": "Solve a system of a linear equation and a quadratic equation by substitution, and use the solutions to answer what is asked."}, {"id": "LO2", "text": "Determine the number of solutions of a linear–quadratic system by using the discriminant, including when the line is tangent to the parabola."}, {"id": "LO3", "text": "Solve systems that involve a circle or an absolute value equation together with a linear equation."}, {"id": "LO4", "text": "Interpret the solutions of a system as intersection points and read or verify them from a graph or table."}, {"id": "LO5", "text": "Find the value of a constant that gives a nonlinear system exactly one, two or no real solutions."}], "notes": [{"lo": "LO1", "h": "Substitution: where a line meets a parabola", "html": "<p>A solution of a system is an ordered pair (<i>x<\/i>, <i>y<\/i>) that makes <b>both<\/b> equations true. When both equations are already solved for <i>y<\/i>, the two right sides must be equal at a shared point, so set them equal.<\/p><div class=\"eqs\"><i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 3 and <i>y<\/i> = <i>x<\/i> + 1<br><i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 3 = <i>x<\/i> + 1<br><i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> − 4 = 0<br>(<i>x<\/i> − 4)(<i>x<\/i> + 1) = 0, so <i>x<\/i> = 4 or <i>x<\/i> = −1<\/div><p>Now find each <i>y<\/i>. Substituting into the <b>linear<\/b> equation is quickest and safest: <i>x<\/i> = 4 gives <i>y<\/i> = 5, and <i>x<\/i> = −1 gives <i>y<\/i> = 0. The solutions are (4, 5) and (−1, 0).<\/p><div class=\"rule\">Set the expressions equal, move every term to one side, solve the quadratic, then substitute each <i>x<\/i> back to get its own <i>y<\/i>.<\/div><p>Each <i>x<\/i> gives one point, so a quadratic with two roots means two solutions of the system.<\/p>"}, {"lo": "LO1", "h": "When the equations are not in y = form", "html": "<p>If the linear equation looks like <i>x<\/i> + <i>y<\/i> = 5 or 2<i>x<\/i> − <i>y<\/i> = 1, solve it for one variable first and substitute that expression into the nonlinear equation.<\/p><div class=\"eqs\"><i>x<\/i> + <i>y<\/i> = 5 and <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 1<br>5 − <i>x<\/i> = <i>x<\/i><sup>2<\/sup> − 1<br><i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 6 = 0, so <i>x<\/i> = 2 or <i>x<\/i> = −3<br>Points: (2, 3) and (−3, 8)<\/div><p>The same idea handles systems such as <i>x<\/i> + <i>y<\/i> = 9 and <i>x<\/i><i>y<\/i> = 20, which come from rectangle problems (perimeter and area): substitute <i>y<\/i> = 9 − <i>x<\/i> to get <i>x<\/i><sup>2<\/sup> − 9<i>x<\/i> + 20 = 0.<\/p><div class=\"tip\">DSAT questions often ask for one number, such as <i>x<\/i><i>y<\/i>, <i>y<\/i> when <i>x<\/i> &lt; 0, or the sum of the <i>x<\/i>-values. Read the last line of the question again before you choose. For a sum, the combined quadratic <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = 0 gives <i>x<\/i><sub>1<\/sub> + <i>x<\/i><sub>2<\/sub> = −<span class=\"fq\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> directly, even when the roots are messy.<\/div>"}, {"lo": "LO2", "h": "How many solutions? Use the discriminant", "html": "<p>After substitution you reach a quadratic <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = 0. Its number of real roots equals the number of intersection points, and the discriminant <i>D<\/i> = <i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> tells you that number without solving.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Discriminant<\/th><th>Real roots<\/th><th>The graphs<\/th><\/tr><tr><td><i>D<\/i> &gt; 0<\/td><td>2<\/td><td>line crosses the parabola twice<\/td><\/tr><tr><td><i>D<\/i> = 0<\/td><td>1<\/td><td>line is <b>tangent<\/b> (just touches)<\/td><\/tr><tr><td><i>D<\/i> &lt; 0<\/td><td>0<\/td><td>line misses the parabola<\/td><\/tr><\/table><\/div><div class=\"eqs\"><i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 1 and <i>y<\/i> = 2<i>x<\/i><br><i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + 1 = 0, <i>D<\/i> = 4 − 4 = 0<\/div><p>So the line touches the parabola at exactly one point, (1, 2).<\/p><div class=\"rule\">Compute <i>D<\/i> only after every term is on one side; <i>a<\/i>, <i>b<\/i> and <i>c<\/i> come from the <b>combined<\/b> equation, not from the parabola alone.<\/div>"}, {"lo": "LO3", "h": "A line and a circle", "html": "<p>A circle such as <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25 (center at the origin, radius 5) is not a function, but substitution still works: replace <i>y<\/i> with the line's expression.<\/p><div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25 and <i>y<\/i> = <i>x<\/i> + 1<br><i>x<\/i><sup>2<\/sup> + (<i>x<\/i> + 1)<sup>2<\/sup> = 25<br>2<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> + 1 = 25<br><i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 12 = 0, so <i>x<\/i> = 3 or <i>x<\/i> = −4<br>Points: (3, 4) and (−4, −3)<\/div><div class=\"rule\">(<i>x<\/i> + 1)<sup>2<\/sup> = <i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> + 1, never <i>x<\/i><sup>2<\/sup> + 1. Expand the square before you collect terms.<\/div><p>A line can meet a circle in 2, 1 or 0 points, and the discriminant of the combined quadratic tells you which. For a horizontal line <i>y<\/i> = <i>c<\/i> and a circle centered at the origin with radius <i>r<\/i>, there are two points when |<i>c<\/i>| &lt; <i>r<\/i>, one when |<i>c<\/i>| = <i>r<\/i> and none when |<i>c<\/i>| &gt; <i>r<\/i>. For a circle with center (<i>h<\/i>, <i>k<\/i>), substitute into (<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + (<i>y<\/i> − <i>k<\/i>)<sup>2<\/sup> = <i>r<\/i><sup>2<\/sup> in the same way.<\/p>"}, {"lo": "LO3", "h": "Absolute value systems: two cases", "html": "<p>The graph of <i>y<\/i> = |<i>x<\/i> − 2| is a V with its vertex at (2, 0). To solve it with a line, split it into its two straight pieces and keep only solutions that lie on the correct piece.<\/p><div class=\"eqs\"><i>y<\/i> = |<i>x<\/i> − 2| and <i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> + 1<br>Case <i>x<\/i> ≥ 2: <i>x<\/i> − 2 = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> + 1, so <i>x<\/i> = 6, <i>y<\/i> = 4 ✓<br>Case <i>x<\/i> &lt; 2: 2 − <i>x<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> + 1, so <i>x<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>, <i>y<\/i> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span> ✓<\/div><div class=\"rule\">After solving each case, check that the <i>x<\/i>-value satisfies that case's condition. A value that does not is rejected.<\/div><p>For example, <i>y<\/i> = |<i>x<\/i> + 2| and <i>y<\/i> = 2<i>x<\/i> − 1 give <i>x<\/i> = 3 from the right piece, but the left piece gives <i>x<\/i> = −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>, which is not less than −2, so the only solution is (3, 5). A horizontal line <i>y<\/i> = <i>c<\/i> meets <i>y<\/i> = |<i>x<\/i> − <i>h<\/i>| + <i>k<\/i> twice when <i>c<\/i> &gt; <i>k<\/i>, once when <i>c<\/i> = <i>k<\/i> and never when <i>c<\/i> &lt; <i>k<\/i>.<\/p>"}, {"lo": "LO4", "h": "Solutions are intersection points", "html": "<p>Graphing both equations turns a system into a picture: every point where the graphs cross or touch is a solution, and the number of such points is the number of solutions.<\/p><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Upward parabola y = x squared minus 2x minus 3 with vertex (1, −4) and the line y = x + 1; they cross at the marked points (−1, 0) and (4, 5)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" s s found by substitution.<\/p><ul><li>Read coordinates only at grid crossings you can trust, then confirm by substituting into <b>both<\/b> equations.<\/li><li>A point on just one graph (a vertex, an intercept) is not a solution.<\/li><li>In a table of values, a solution is an input where the two functions have the same output.<\/li><\/ul><div class=\"tip\">On the digital SAT you can type both equations into the built-in graphing calculator and tap the intersection points to see their exact coordinates.<\/div>"}, {"lo": "LO5", "h": "Finding a constant for one, two or no solutions", "html": "<p>When a system contains an unknown constant <i>k<\/i>, substitute, collect terms into <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = 0 (where <i>b<\/i> or <i>c<\/i> may contain <i>k<\/i>), and then set a condition on the discriminant.<\/p><div class=\"eqs\"><i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 3 and <i>y<\/i> = 2<i>x<\/i> + <i>k<\/i><br><i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + (3 − <i>k<\/i>) = 0<br><i>D<\/i> = (−2)<sup>2<\/sup> − 4(1)(3 − <i>k<\/i>) = 4<i>k<\/i> − 8<\/div><ul><li>Exactly one solution (tangent): <i>D<\/i> = 0, so <i>k<\/i> = 2.<\/li><li>Two solutions: <i>D<\/i> &gt; 0, so <i>k<\/i> &gt; 2.<\/li><li>No solution: <i>D<\/i> &lt; 0, so <i>k<\/i> &lt; 2.<\/li><\/ul><div class=\"rule\">One solution ↔ <i>D<\/i> = 0; two ↔ <i>D<\/i> &gt; 0; none ↔ <i>D<\/i> &lt; 0.<\/div><p>For a horizontal line <i>y<\/i> = <i>k<\/i> and a parabola, no algebra is needed: the line touches the parabola once exactly at the vertex height. It meets an upward parabola twice when <i>k<\/i> is above the vertex and never when <i>k<\/i> is below it.<\/p>"}], "examples": [{"lo": "LO1", "q": "Solve the system <i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 5 and <i>y<\/i> = 3<i>x<\/i> + 1.", "steps": ["Set the right sides equal: <i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 5 = 3<i>x<\/i> + 1.", "Move every term to one side: <i>x<\/i><sup>2<\/sup> − <i>x<\/i> − 6 = 0, so (<i>x<\/i> − 3)(<i>x<\/i> + 2) = 0.", "So <i>x<\/i> = 3 or <i>x<\/i> = −2.", "Substitute into the line: <i>y<\/i> = 3(3) + 1 = 10 and <i>y<\/i> = 3(−2) + 1 = −5."], "ans": "(3, 10) and (−2, −5)"}, {"lo": "LO1", "q": "<div class=\"eqs\"><i>x<\/i> + <i>y<\/i> = 7<br><i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 5<\/div>If (<i>x<\/i>, <i>y<\/i>) is a solution of the system above and <i>x<\/i> &gt; 0, what is the value of <i>x<\/i><i>y<\/i>?", "steps": ["Solve the linear equation for <i>y<\/i>: <i>y<\/i> = 7 − <i>x<\/i>.", "Substitute: 7 − <i>x<\/i> = <i>x<\/i><sup>2<\/sup> − 5, so <i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 12 = 0, which factors as (<i>x<\/i> + 4)(<i>x<\/i> − 3) = 0.", "Since <i>x<\/i> &gt; 0, <i>x<\/i> = 3, and then <i>y<\/i> = 7 − 3 = 4.", "<i>x<\/i><i>y<\/i> = 3(4) = 12."], "ans": "12"}, {"lo": "LO2", "q": "How many solutions does the system <i>y<\/i> = 2<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> + 4 and <i>y<\/i> = <i>x<\/i> + 2 have?", "steps": ["Set equal and collect: 2<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> + 4 = <i>x<\/i> + 2 gives 2<i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 2 = 0.", "Discriminant: <i>D<\/i> = (−4)<sup>2<\/sup> − 4(2)(2) = 16 − 16 = 0.", "<i>D<\/i> = 0, so there is exactly one solution: the line is tangent to the parabola.", "Solving 2(<i>x<\/i> − 1)<sup>2<\/sup> = 0 gives <i>x<\/i> = 1 and <i>y<\/i> = 1 + 2 = 3."], "ans": "Exactly one solution, (1, 3)"}, {"lo": "LO3", "q": "Solve the system (<i>x<\/i> − 2)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25 and <i>y<\/i> = <i>x<\/i> − 3.", "steps": ["Substitute <i>y<\/i> = <i>x<\/i> − 3: (<i>x<\/i> − 2)<sup>2<\/sup> + (<i>x<\/i> − 3)<sup>2<\/sup> = 25.", "Expand: <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 4 + <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 9 = 25, so 2<i>x<\/i><sup>2<\/sup> − 10<i>x<\/i> − 12 = 0.", "Divide by 2: <i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> − 6 = 0, so (<i>x<\/i> − 6)(<i>x<\/i> + 1) = 0 and <i>x<\/i> = 6 or <i>x<\/i> = −1.", "From the line, <i>y<\/i> = 3 or <i>y<\/i> = −4. Check (6, 3): 16 + 9 = 25 ✓."], "ans": "(6, 3) and e (−2, 1) and (2, 1).<br>Check (2, 1): −(2)<sup>2<\/sup> + 5 = 1 ✓. (0, 5) and (1, 4) are only on the parabola, and (0, 1) is only on the line.<br>Answer: <b>(2, 1)<\/b>", "hint": "Look for the points that lie on both graphs at once.", "ans": 3}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "How many real solutions does the system <i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 4 and <i>y<\/i> = 2 have?", "opts": ["0", "1", "2", "Infinitely many"], "sol": "Set equal: <i>x<\/i><sup>2<\/sup> + 4 = 2, so <i>x<\/i><sup>2<\/sup> = −2, which has no real solution.<br>The parabola's lowest point is (0, 4), above the line <i>y<\/i> = 2.<br>Answer: <b>0<\/b>", "hint": "Compare the height of the line with the lowest point of the parabola.", "ans": 0}, {"lo": "LO3", "diff": "E", "type": "spr", "q": "The system <i>y<\/i> = |<i>x<\/i> − 1| and <i>y<\/i> = 4 has two solutions. What is the greatest <i>x<\/i>-coordinate of a solution?", "ans": ["5"], "sol": "|<i>x<\/i> − 1| = 4 means <i>x<\/i> − 1 = 4 or <i>x<\/i> − 1 = −4.<br>So <i>x<\/i> = 5 or <i>x<\/i> = −3.<br>Answer: <b>5<\/b>", "hint": "The expression inside the absolute value can equal 4 or −4."}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "The system <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> and <i>y<\/i> = <i>x<\/i> + 5 has two solutions. If (<i>a<\/i>, <i>b<\/i>) is the solution with <i>a<\/i> &lt; 0, what is the value of <i>b<\/i>?", "ans": ["4"], "sol": "<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> = <i>x<\/i> + 5 gives <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> − 5 = 0, so (<i>x<\/i> − 5)(<i>x<\/i> + 1) = 0.<br>The negative root is <i>x<\/i> = −1, so <i>b<\/i> = −1 + 5 = 4.<br>Answer: <b>4<\/b>", "hint": "Find both <i>x<\/i>-values, keep the negative one, and use the line to get its <i>y<\/i>."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which of the following systems has exactly one solution?", "opts": ["<i>y<\/i> = <i>x<\/i><sup>2<\/sup> and <i>y<\/i> = 2<i>x<\/i> + 1", "<i>y<\/i> = <i>x<\/i><sup>2<\/sup> and <i>y<\/i> = −1", "<i>y<\/i> = <i>x<\/i><sup>2<\/sup> and <i>y<\/i> = 2<i>x<\/i> − 1", "<i>y<\/i> = <i>x<\/i><sup>2<\/sup> and <i>y<\/i> = <i>x<\/i>"], "sol": "<i>x<\/i><sup>2<\/sup> = 2<i>x<\/i> − 1 gives <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + 1 = 0 with <i>D<\/i> = 4 − 4 = 0: one solution.<br><i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 1 = 0 has <i>D<\/i> = 8; <i>x<\/i><sup>2<\/sup> = −1 has none; <i>x<\/i><sup>2<\/sup> − <i>x<\/i> = 0 has two.<br>Answer: <b><i>y<\/i> = <i>x<\/i><sup>2<\/sup> and <i>y<\/i> = 2<i>x<\/i> − 1<\/b>", "hint": "Combine each pair into one quadratic and look for a discriminant of zero.", "ans": 2}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "What are the solutions of the system <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 20 and <i>y<\/i> = 2<i>x<\/i>?", "opts": ["(2, 4) and (−2, 4)", "(2, 4) and (−2, −4)", "(2, 4) only", "(4, 8) and (−4, −8)"], "sol": "Substitute: <i>x<\/i><sup>2<\/sup> + (2<i>x<\/i>)<sup>2<\/sup> = 20, so 5<i>x<\/i><sup>2<\/sup> = 20 and <i>x<\/i><sup>2<\/sup> = 4.<br><i>x<\/i> = 2 gives <i>y<\/i> = 4; <i>x<\/i> = −2 gives <i>y<\/i> = −4.<br>Answer: <b>(2, 4) and (−2, −4)<\/b>", "hint": "Remember that (2<i>x<\/i>)<sup>2<\/sup> = 4<i>x<\/i><sup>2<\/sup>, and that <i>x<\/i><sup>2<\/sup> = 4 has two roots.", "ans": 1}, {"lo": "LO5", "diff": "M", "type": "spr", "q": "The system <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> + 21 and <i>y<\/i> = <i>c<\/i>, where <i>c<\/i> is a constant, has exactly one solution. What is the value of <i>c<\/i>?", "ans": ["5"], "sol": "A horizontal line touches the parabola once only at the vertex.<br>Vertex <i>x<\/i> = <span class=\"fq\"><span>8<\/span><span>2<\/span><\/span> = 4, and <i>y<\/i> = 16 − 32 + 21 = 5.<br>Answer: <b>5<\/b>", "hint": "Where can a horizontal line touch an upward parabola just once?"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A rectangular patio has a perimeter of 34 meters and an area of 60 square meters. What is the length, in meters, of its longer side?", "opts": ["5", "12", "15", "17"], "sol": "With sides <i>x<\/i> and <i>y<\/i>: <i>x<\/i> + <i>y<\/i> = 17 and <i>x<\/i><i>y<\/i> = 60.<br>Substitute <i>y<\/i> = 17 − <i>x<\/i>: <i>x<\/i><sup>2<\/sup> − 17<i>x<\/i> + 60 = 0, so (<i>x<\/i> − 12)(<i>x<\/i> − 5) = 0.<br>The sides are 12 and 5.<br>Answer: <b>12<\/b>", "hint": "Half the perimeter is the sum of the two sides; write <i>y<\/i> in terms of <i>x<\/i>.", "ans": 1}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The system <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 7 and <i>y<\/i> = 2<i>x<\/i> + <i>k<\/i> has no real solutions. Which of the following could be the value of <i>k<\/i>?", "opts": ["−3", "−2", "0", "2"], "sol": "<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + (7 − <i>k<\/i>) = 0 has <i>D<\/i> = 36 − 4(7 − <i>k<\/i>) = 8 + 4<i>k<\/i>.<br>No solution needs 8 + 4<i>k<\/i> &lt; 0, so <i>k<\/i> &lt; −2.<br>Only −3 works (−2 gives one solution).<br>Answer: <b>−3<\/b>", "hint": "Write the discriminant in terms of <i>k<\/i> and make it negative.", "ans": 0}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "How many solutions does the system <i>y<\/i> = |<i>x<\/i> − 3| and <i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> have?", "opts": ["0", "1", "2", "3"], "sol": "Case <i>x<\/i> ≥ 3: <i>x<\/i> − 3 = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> gives <i>x<\/i> = 6 ✓.<br>Case <i>x<\/i> &lt; 3: 3 − <i>x<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> gives <i>x<\/i> = 2 ✓.<br>Both are valid, so there are two solutions, (6, 3) and (2, 1).<br>Answer: <b>2<\/b>", "hint": "Solve each piece of the V separately and check each condition.", "ans": 2}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "The line <i>y<\/i> = 6<i>x<\/i> − 7 intersects the parabola <i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 3 at exactly one point, (<i>a<\/i>, <i>b<\/i>). What is the value of <i>a<\/i> + <i>b<\/i>?", "ans": ["7"], "sol": "<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 3 = 6<i>x<\/i> − 7 gives <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 4 = 0, so (<i>x<\/i> − 2)<sup>2<\/sup> = 0.<br><i>a<\/i> = 2 and <i>b<\/i> = 6(2) − 7 = 5.<br>Answer: <b>7<\/b>", "hint": "The combined quadratic should be a perfect square; its single root is <i>a<\/i>."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which ordered pair is a solution to the system <i>y<\/i> = <i>x<\/i><sup>2<\/sup> and <i>y<\/i> = <i>x<\/i> + 6?", "opts": ["(−3, 9)", "(2, 8)", "(−2, −4)", "(3, 9)"], "sol": "<i>x<\/i><sup>2<\/sup> = <i>x<\/i> + 6 gives <i>x<\/i><sup>2<\/sup> − <i>x<\/i> − 6 = 0, so <i>x<\/i> = 3 or <i>x<\/i> = −2.<br><i>x<\/i> = 3 gives <i>y<\/i> = 9; <i>x<\/i> = −2 gives <i>y<\/i> = 4, not −4.<br>Answer: <b>(3, 9)<\/b>", "ans": 3}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "The graphs of <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25 and <i>y<\/i> = 4 are shown. Which ordered pair is a solution of the system?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Circle centered at the origin with radius 5 and the horizontal line y = 4; they cross at two marked points, (−3, 4) and (3, 4)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250 ["16"], "sol": "<i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> − 12 = 0, so (<i>x<\/i> − 6)(<i>x<\/i> + 2) = 0.<br>The points are (6, 16) and (−2, 0).<br>16 + 0 = 16.<br>Answer: <b>16<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A skate ramp's profile is modeled by <i>y<\/i> = <i>x<\/i><sup>2<\/sup>, and a laser beam follows the line <i>y<\/i> = 6<i>x<\/i> + <i>k<\/i>. For what value of <i>k<\/i> does the beam touch the ramp at exactly one point?", "opts": ["−36", "−9", "−3", "9"], "sol": "<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> − <i>k<\/i> = 0 has <i>D<\/i> = 36 + 4<i>k<\/i>.<br>One point means <i>D<\/i> = 0, so <i>k<\/i> = −9.<br>Answer: <b>−9<\/b>", "ans": 1}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The table shows values of a quadratic function <i>f<\/i> and a linear function <i>g<\/i>. For which values of <i>x<\/i> in the table is (<i>x<\/i>, <i>f<\/i>(<i>x<\/i>)) a solution of the system <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) and <i>y<\/i> = <i>g<\/i>(<i>x<\/i>)?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><th><i>f<\/i>(<i>x<\/i>)<\/th><td>6<\/td><td>4<\/td><td>4<\/td><td>6<\/td><td>10<\/td><td>16<\/td><\/tr><tr><th><i>g<\/i>(<i>x<\/i>)<\/th><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><td>7<\/td><td>8<\/td><\/tr><\/table><\/div>", "opts": ["3 only", "0 and 3", "1 and 4", "1 and 3"], "sol": "A solution needs <i>f<\/i>(<i>x<\/i>) = <i>g<\/i>(<i>x<\/i>).<br>At <i>x<\/i> = 1: 4 and 4; at <i>x<\/i> = 3: 6 and 6. No other column matches.<br>Answer: <b>1 and 3<\/b>", "ans": 3}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "The system <i>y<\/i> = |<i>x<\/i> + 2| and <i>y<\/i> = 2<i>x<\/i> − 1 has exactly one solution. What is its <i>y<\/i>-coordinate?", "ans": ["5"], "sol": "Case <i>x<\/i> ≥ −2: <i>x<\/i> + 2 = 2<i>x<\/i> − 1 gives <i>x<\/i> = 3 ✓, so <i>y<\/i> = 5.<br>Case <i>x<\/i> &lt; −2: −<i>x<\/i> − 2 = 2<i>x<\/i> − 1 gives <i>x<\/i> = −<span class=\"fq\"><span>1<\ > + 2<i>x<\/i> + 3.<br>The line has <i>y<\/i>-intercept −3 and passes through (3, 0), so its slope is 1: <i>y<\/i> = <i>x<\/i> − 3.<br>Check (−2, −5): −4 − 4 + 3 = −5 ✓.<br>Answer: <b><i>y<\/i> = −<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> + 3 and <i>y<\/i> = <i>x<\/i> − 3<\/b>", "ans": 0}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "For the system <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> + 5 and <i>y<\/i> = <i>x<\/i> + <i>c<\/i>, where <i>c<\/i> is a constant greater than 1, how many solutions are there?", "opts": ["0", "1", "2", "It depends on the value of <i>c<\/i>"], "sol": "<i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + (5 − <i>c<\/i>) = 0 has <i>D<\/i> = 16 − 4(5 − <i>c<\/i>) = 4<i>c<\/i> − 4.<br>For <i>c<\/i> &gt; 1, <i>D<\/i> &gt; 0, so there are always two solutions.<br>Answer: <b>2<\/b>", "ans": 2}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A store's weekly revenue is <i>R<\/i> = −2<i>p<\/i><sup>2<\/sup> + 40<i>p<\/i> and its cost is <i>C<\/i> = 4<i>p<\/i> + 64, both in hundreds of dollars, where <i>p<\/i> is the price in dollars. The store breaks even when <i>R<\/i> = <i>C<\/i>. What is the higher break-even price, in dollars?", "opts": ["2", "9", "16", "18"], "sol": "−2<i>p<\/i><sup>2<\/sup> + 40<i>p<\/i> = 4<i>p<\/i> + 64 gives −2<i>p<\/i><sup>2<\/sup> + 36<i>p<\/i> − 64 = 0, so <i>p<\/i><sup>2<\/sup> − 18<i>p<\/i> + 32 = 0.<br>(<i>p<\/i> − 2)(<i>p<\/i> − 16) = 0, so <i>p<\/i> = 2 or <i>p<\/i> = 16.<br>Answer: <b>16<\/b>", "ans": 2}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which of the following is the <i>x<\/i>-coordinate of a solution of the system <i>y<\/i> = 3<i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> and <i>y<\/i> = 4<i>x<\/i> + 9?", "opts": ["−3", "1", "3", "9"], "sol": "3<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> − 9 = 0, so <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 3 = 0 and (<i>x<\/i> − 3)(<i>x<\/i> + 1) = 0.<br><i>x<\/i> = 3 or <i>x<\/i> = −1; only 3 is listed.<br>Answer: <b>3<\/b>", "ans": 2}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
