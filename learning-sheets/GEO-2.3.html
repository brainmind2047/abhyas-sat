<!DOCTYPE html>
<html lang="en">
<head>

<title>2.3 Scale factors and changing dimensions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,
     objective-by-objective lesson cards in Learn mode, one-question-at-a-time quiz with an objective-wise report. */
  :root{
    --navy:#16264A; --navy-2:#1F3B6B; --gold:#C79A3E; --gold-soft:#F3E7C9;
    --paper:#FBF9F4; --paper-2:#F1EAD8; --card:#FFFFFF;
    --ink:#211E1A; --ink-soft:#655D4C; --rule:#E4DCC8;
    --success:#2E7D4F; --success-soft:#E1F2E7;
    --warn:#9A6A12; --warn-soft:#FAF0D6;
    --danger:#B5443E; --danger-soft:#FAE3E1;
    --accent-text:#1F3B6B; --focus:#1F3B6B;
    --gr-grid:#E7E0CF; --gr-axis:#5C5546; --gr-line:#2D55C4; --gr-alt:#B7801A; --gr-shade:rgba(45,85,196,.16);
    --chip-on:#1F3B6B; --chip-on-ink:#FFFFFF;
    --f-display:'Fraunces',Georgia,serif; --f-body:'Source Sans 3',-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
      --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
      --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
      --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
      --danger:#E38884; --danger-soft:#331D1B;
      --accent-text:#E0B75B; --focus:#E0B75B;
      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
    --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
    --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
    --danger:#E38884; --danger-soft:#331D1B;
    --accent-text:#E0B75B; --focus:#E0B75B;
    --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
    --chip-on:#E0B75B; --chip-on-ink:#141210;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;}
  h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.2;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
  i{font-family:var(--f-display); font-style:italic; font-weight:500;}
  .num{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
  .wrap{max-width:860px; margin:0 auto; padding-inline:16px;}

  /* header */
  header.brand{background:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%); color:#F4EFDF; padding-block:calc(18px + env(safe-area-inset-top,0px)) 22px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .crest{width:40px; height:40px; border-radius:10px; background:#C79A3E; color:#16264A; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:17px; flex-shrink:0;}
  .brand-name{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#E0B75B; font-weight:700;}
  .series-name{font-size:18px; font-weight:700; font-family:var(--f-display);}
  .series-name span{font-weight:400; font-size:14px; color:#CFD7EA; font-family:var(--f-body);}
  .crumbs{margin-top:16px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#AEB9D6; display:flex; flex-wrap:wrap; gap:4px 10px;}
  .crumbs b{color:#E0B75B; font-weight:700;}
  h1.title{font-size:clamp(26px,5vw,36px); margin-top:4px;}
  .summary{color:#D9DFEE; margin:6px 0 0; max-width:62ch;}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .meta span{font-size:13px; font-weight:700; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:99px; padding:4px 11px; color:#F4EFDF;}

  /* mode switch */
  .modebar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule);}
  .modebar .wrap{display:flex; gap:6px; align-items:center; padding-block:10px;}
  .tab{border:1.5px solid var(--rule); background:var(--card); border-radius:99px; padding:7px 18px; font-weight:700; cursor:pointer;}
  .tab[aria-selected="true"]{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .modebar .prog{margin-left:auto; font-size:13.5px; color:var(--ink-soft);}

  main{padding-block:22px 40px;}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  /* objectives overview */
  .los{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .los li{display:flex; gap:12px; align-items:flex-start;}
  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .lo-done{margin-left:auto; font-size:12.5px; color:var(--success); font-weight:700; flex-shrink:0;}

  /* lesson */
  .lesson{scroll-margin-top:70px;}
  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}
  .rules h3,.traps h3,.ex h3,.try h3{font-family:var(--f-body); font-size:13px; letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; color:var(--ink-soft);}
  .rules ul,.traps ul{margin:0; padding-left:20px;} .rules li,.traps li{margin:3px 0;}
  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}
  .spr small{color:var(--ink-soft); font-size:13.5px;}
  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}
  svg.gr{width:100%; max-width:300px; height:auto;}
  .gr-grid line{stroke:var(--gr-grid); stroke-width:1;}
  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .qhead .qn{font-family:var(--f-display); font-size:20px; font-weight:700;}
  .pill{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--paper-2); color:var(--ink-soft);}
  .pill.E{background:var(--success-soft); color:var(--success);} .pill.M{background:var(--warn-soft); color:var(--warn);} .pill.H{background:var(--danger-soft); color:var(--danger);}
  .qnav{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .chip{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--card); font:600 14px var(--f-mono); cursor:pointer;}
  .chip.ans{background:var(--paper-2); border-color:var(--ink-soft);}
  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .timer{font:600 14px var(--f-mono); color:var(--ink-soft); margin-left:auto;}
  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

<script>
(function(){
"use strict";
var S = {"id": "GEO-2.3", "unit": "Geometry and Trigonometry", "topic": "Area and volume", "title": "Scale factors and changing dimensions", "intro": "When every length of a figure is multiplied by the same scale factor <i>k<\/i>, its perimeter is multiplied by <i>k<\/i>, its area by <i>k<\/i><sup>2<\/sup> and its volume by <i>k<\/i><sup>3<\/sup>. The DSAT tests this idea with similar figures and solids, scale models and maps, questions that change only one dimension, and questions about the percent change in area or volume.", "los": [{"id": "LO1", "text": "Determine how the perimeter and area of a plane figure change when every length is multiplied by a scale factor <i>k<\/i>."}, {"id": "LO2", "text": "Determine how the surface area and volume of a solid change when every length is multiplied by a scale factor <i>k<\/i>."}, {"id": "LO3", "text": "Calculate the new area or volume when only one dimension changes, or when different dimensions change by different factors."}, {"id": "LO4", "text": "Find the scale factor and missing measures of similar figures and solids from a ratio of lengths, areas or volumes."}, {"id": "LO5", "text": "Calculate the percent change in area or volume when dimensions change by a given percent."}], "notes": [{"lo": "LO1", "h": "Scale factor and perimeter", "html": "<p>A <b>scale factor<\/b> compares a new figure with the original one: <i>k<\/i> = new length ÷ original length. When <i>k<\/i> &gt; 1 the figure is enlarged, and when 0 &lt; <i>k<\/i> &lt; 1 it is reduced. Scaling changes the size of a figure but not its shape, so every angle stays the same and the two figures are similar.<\/p><div class=\"rule\">If every length is multiplied by <i>k<\/i>, then every one-dimensional measure is multiplied by <i>k<\/i>: sides, heights, diagonals, radii, circumference and perimeter.<\/div><p>Below, each side of the 3 by 2 rectangle is doubled, so <i>k<\/i> = 2. The perimeter goes from 2(3 + 2) = 10 to 2(6 + 4) = 20, which is also 2 × 10.<\/p><svg class=\"fig\" viewBox=\"0 0 308 138\" role=\"img\" aria-label=\"Two rectangles. The smaller rectangle is 3 units long and 2 units wide. The larger rectangle is 6 units long and 4 units wide, so each of its sides is 2 times the matching side of the smaller one.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"30,108 96,108 96,64 30,64\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"146,108 278,108 278,20 146,20\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"63\" y=\"121\" text-anchor=\"middle\" dominant-baseline=\"central\">3<\/text><text x=\"110\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"central\">2<\/text><text x=\"212\" y=\"121\" text-anchor=\"middle\" dominant-baseline=\"central\">6<\/text><text x=\"292\" y=\"64\" text-anchor=\"middle\" dominant-baseline=\"central\">4<\/text><\/g><\/svg><div class=\"tip\">DSAT tip: you rarely need the formula for the shape. If a hexagon has perimeter 30 and every side is multiplied by 1.5, the new perimeter is 1.5 × 30 = 45.<\/div>"}, {"lo": "LO1", "h": "Area is multiplied by <i>k<\/i><sup>2<\/sup>", "html": "<p>Area is measured in square units, so it is a product of two lengths. When each of those lengths is multiplied by <i>k<\/i>, the area is multiplied by <i>k<\/i> × <i>k<\/i> = <i>k<\/i><sup>2<\/sup>. In the rectangles above, the area goes from 3 × 2 = 6 to 6 × 4 = 24, which is 2<sup>2<\/sup> = 4 times as large.<\/p><div class=\"rule\">If every length of a plane figure is multiplied by <i>k<\/i>, its area is multiplied by <i>k<\/i><sup>2<\/sup>.<\/div><p>This works for every shape. A circle of radius <i>r<\/i> has area π<i>r<\/i><sup>2<\/sup>; with radius <i>k<\/i><i>r<\/i> its area is π(<i>k<\/i><i>r<\/i>)<sup>2<\/sup> = <i>k<\/i><sup>2<\/sup> · π<i>r<\/i><sup>2<\/sup>.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Scale factor <i>k<\/i><\/th><th>Perimeter × <i>k<\/i><\/th><th>Area × <i>k<\/i><sup>2<\/sup><\/th><\/tr><tr><td>3<\/td><td>× 3<\/td><td>× 9<\/td><\/tr><tr><td><span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><\/td><td>× <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><\/td><td>× <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span><\/td><\/tr><tr><td>1.5<\/td><td>× 1.5<\/td><td>× 2.25<\/td><\/tr><\/table><\/div>"}, {"lo": "LO2", "h": "Solids: surface area <i>k<\/i><sup>2<\/sup>, volume <i>k<\/i><sup>3<\/sup>", "html": "<p>For a solid, three kinds of measure change in three different ways when every edge, radius and height is multiplied by <i>k<\/i>.<\/p><ul><li>Lengths (edges, heights, radii) are multiplied by <i>k<\/i>.<\/li><li>Surface area is still measured in square units, so it is multiplied by <i>k<\/i><sup>2<\/sup>.<\/li><li>Volume is measured in cubic units, a product of three lengths, so it is multiplied by <i>k<\/i><sup>3<\/sup>.<\/li><\/ul><div class=\"rule\">Scale every length of a solid by <i>k<\/i>: surface area × <i>k<\/i><sup>2<\/sup>, volume × <i>k<\/i><sup>3<\/sup>.<\/div><div class=\"eqs\">Cube with edge 2: surface area 24, volume 8<br>Cube with edge 6 (<i>k<\/i> = 3): surface area 24 × 9 = 216, volume 8 × 27 = 216<\/div><div class=\"tip\">Reference sheet tip: the DSAT gives the volume formulas for prisms, cylinders, cones, pyramids and spheres. For a scaling question you often do not need them at all; just multiply the old volume by <i>k<\/i><sup>3<\/sup>.<\/div>"}, {"lo": "LO3", "h": "Changing only some dimensions", "html": "<p>When the dimensions do not all change by the same factor, the figures are no longer similar, and the rules <i>k<\/i><sup>2<\/sup> and <i>k<\/i><sup>3<\/sup> do not apply. Instead, look at the formula and replace each dimension with its new value. Each dimension contributes its own factor, raised to the power it has in the formula.<\/p><div class=\"rule\">New measure = old measure × (product of the factors, each raised to its power in the formula).<\/div><div class=\"eqs\">Rectangle, <i>A<\/i> = <i>l<\/i><i>w<\/i>: triple <i>l<\/i> only, so area × 3<br>Cylinder, <i>V<\/i> = π<i>r<\/i><sup>2<\/sup><i>h<\/i>: double <i>r<\/i> only, so volume × 2<sup>2<\/sup> = × 4<br>Cylinder: double <i>r<\/i> and triple <i>h<\/i>, so π(2<i>r<\/i>)<sup>2<\/sup>(3<i>h<\/i>) = 12π<i>r<\/i><sup>2<\/sup><i>h<\/i>, volume × 12<\/div><p>Because the radius is squared in π<i>r<\/i><sup>2<\/sup><i>h<\/i>, changing the radius has a bigger effect than changing the height by the same factor.<\/p><div class=\"tip\">DSAT tip: if you are unsure, test with simple numbers. Let <i>r<\/i> = 1 and <i>h<\/i> = 1, compute both volumes, and divide.<\/div>"}, {"lo": "LO4", "h": "Similar figures and solids", "html": "<p>Two figures are <b>similar<\/b> when one is a scaled copy of the other. Corresponding angles are equal and corresponding lengths are in the same ratio, the scale factor. If the corresponding lengths are in the ratio <i>a<\/i> : <i>b<\/i>, the other measures follow the same pattern as before.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Measure<\/th><th>Ratio<\/th><th>Lengths 2 : 3<\/th><\/tr><tr><td>Lengths, perimeters<\/td><td><i>a<\/i> : <i>b<\/i><\/td><td>2 : 3<\/td><\/tr><tr><td>Areas, surface areas<\/td><td><i>a<\/i><sup>2<\/sup> : <i>b<\/i><sup>2<\/sup><\/td><td>4 : 9<\/td><\/tr><tr><td>Volumes<\/td><td><i>a<\/i><sup>3<\/sup> : <i>b<\/i><sup>3<\/sup><\/td><td>8 : 27<\/td><\/tr><\/table><\/div><div class=\"rule\">Find the scale factor from one pair of corresponding lengths, then multiply: lengths by <i>k<\/i>, areas by <i>k<\/i><sup>2<\/sup>, volumes by <i>k<\/i><sup>3<\/sup>.<\/div><p>Scale models and maps are similar figures too. On a 1 : 100 model of a ship, the real deck has 100<sup>2<\/sup> = 10,000 times the model deck area.<\/p>"}, {"lo": "LO4", "h": "Working backward from an area or volume ratio", "html": "<p>Sometimes a question gives the areas or volumes of two similar figures and asks about a length. Then you must undo the square or the cube before you use the ratio.<\/p><div class=\"rule\">Length scale factor = √(area ratio) = ∛(volume ratio).<\/div><div class=\"eqs\">Areas 18 and 50: ratio <span class=\"fq\"><span>50<\/span><span>18<\/span><\/span> = <span class=\"fq\"><span>25<\/span><span>9<\/span><\/span>, so <i>k<\/i> = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span><br>Volumes 16 and 54: ratio <span class=\"fq\"><span>54<\/span><span>16<\/span><\/span> = <span class=\"fq\"><span>27<\/span><span>8<\/span><\/span>, so <i>k<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><\/div><p>Once you have <i>k<\/i>, you can go forward to any other measure. In the second pair, the surface areas are in the ratio (<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>)<sup>2<\/sup> = <span class=\"fq\"><span>9<\/span><span>4<\/span><\/span>.<\/p><div class=\"tip\">Desmos tip: type cbrt(27/8) or (27/8)^(1/3) to take a cube root. Always simplify the ratio first; perfect squares and perfect cubes then become easy to spot.<\/div>"}, {"lo": "LO5", "h": "Percent change in area and volume", "html": "<p>Turn every percent change into a <b>multiplier<\/b>: an increase of <i>p<\/i>% multiplies by 1 + <span class=\"fq\"><span><i>p<\/i><\/span><span>100<\/span><\/span>, and a decrease of <i>p<\/i>% multiplies by 1 − <span class=\"fq\"><span><i>p<\/i><\/span><span>100<\/span><\/span>. Then square or cube the multiplier, or multiply the separate multipliers together.<\/p><div class=\"eqs\">Each side +20%: area × 1.2<sup>2<\/sup> = × 1.44, an increase of 44%<br>Each side −10%: area × 0.9<sup>2<\/sup> = × 0.81, a decrease of 19%<br>Length +20%, width −20%: area × 1.2 × 0.8 = × 0.96, a decrease of 4%<\/div><div class=\"rule\">Percent change = (multiplier − 1) × 100%. A negative result is a decrease.<\/div><p>Percents do not simply add. A 20% increase in each side of a square gives a 44% increase in area, not 40%, and a 20% increase followed by a 20% decrease leaves the area smaller than it started.<\/p>"}], "examples": [{"lo": "LO1", "q": "Triangle <i>A<\/i><i>B<\/i><i>C<\/i> has a perimeter of 18 centimeters and an area of 12 square centimeters. Each side of triangle <i>A<\/i><i>B<\/i><i>C<\/i> is multiplied by 2.5 to form triangle <i>D<\/i><i>E<\/i><i>F<\/i>. Find the perimeter and the area of triangle <i>D<\/i><i>E<\/i><i>F<\/i>.", "steps": ["The scale factor is <i>k<\/i> = 2.5.", "Perimeter is a length, so it is multiplied by 2.5: 18 × 2.5 = 45 centimeters.", "Area is multiplied by <i>k<\/i><sup>2<\/sup> = 2.5<sup>2<\/sup> = 6.25: 12 × 6.25 = 75 square centimeters."], "ans": "Perimeter 45 cm, area 75 cm<sup>2<\/sup>"}, {"lo": "LO2", "q": "A cylindrical can holds 300 cubic centimeters of juice. A larger can is similar to it, with a radius and a height that are each 3 times those of the smaller can. How many cubic centimeters of juice does the larger can hold?<br>A) 900<br>B) 2,700<br>C) 8,100<br>D) 27,000", "steps": ["Every length is multiplied by <i>k<\/i> = 3, so the volume is multiplied by <i>k<\/i><sup>3<\/sup> = 27.", "300 × 27 = 8,100.", "Choice A multiplies by 3 and choice B by 9; both treat volume as if it had fewer than three dimensions."], "ans": "C) 8,100"}, {"lo": "LO3", "q": "The cylinder shown has radius 5 and height 6.<svg class=\"fig\" viewBox=\"0 0 214 166\" role=\"img\" aria-label=\"A right circular cylinder. A dashed radius on the top base is labeled 5, and the height along the side is labeled 6.\"><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"170,41 169.78,42.65 169.14,44.29 168.07,45.9 166.57,47.49 164.67,49.04 162.37,50.53 159.68,51.97 156.63,53.34 153.23,54.64 149.5,55.85 145.46,56.97 141.14,57.99 136.57,58.91 131.78,59.71 126.79,60.4 121.63,60.97 116.34,61.42 110.95,61.74 105.49,61.94 100,62 94.51,61.94 89.05,61.74 83.66,61.42 78.37,60.97 73.21,60.4 68.22,59.71 63.43,58.91 58.86,57.99 54.54,56.97 50.5,55.85 46.77,54.64 43.37,53.34 40.32,51.97 37.63,50.53 35.33,49.04 33.43,47.49 31.93,45.9 30.86,44.29 30.22,42.65 30,41 30.22,39.35 30.86,37.71 31.93,36.1 33.43,34.51 35.33,32.96 37.63,31.47 40.32,30.03 43.37,28.66 46.77,27.36 50.5,26.15 54.54,25.03 58.86,24.01 63.43,23.09 68.22,22.29 73.21,21.6 78.37,21.03 83.66,20.58 89.05,20.26 94.51,20.06 100,20 105.49,20.06 110.95,20.26 116.34,20.58 121.63,21.03 126.79,21.6 131.78,22.29 136.57,23.09 141.14,24.01 145.46,25.03 149.5,26.15 153.23,27.36 156.63,28.66 159.68,30.03 162.37,31.47 164.67,32.96 166.57,34.51 168.07,36.1 169.14,37.71 169.78,39.35 170,41\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"170,125 169.86,126.32 169.45,127.63 168.76,128.94 167.8,130.22 166.57,131.49 165.08,132.73 163.34,133.94 161.34,135.12 159.1,136.25 156.63,137.34 153.94,138.39 151.03,139.38 147.92,140.31 144.62,141.18 141.14,141.99 137.51,142.73 133.72,143.4 129.8,144 125.77,144.53 121.63,144.97 117.41,145.34 113.12,145.63 108.77,145.83 104.4,145.96 100,146 95.6,145.96 91.23,145.83 86.88,145.63 82.59,145.34 78.37,144.97 74.23,144.53 70.2,144 66.28,143.4 62.49,142.73 58.86,141.99 55.38,141.18 52.08,140.31 48.97,139.38 46.06,138.39 43.37,137.34 40.9,136.25 38.66,135.12 36.66,133.94 34.92,132.73 33.43,131.49 32.2,130.22 31.24,128.94 30.55,127.63 30.14,126.32 30,125\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\" points=\"30,125 30.14,123.68 30.55,122.37 31.24,121.06 32.2,119.78 33.43,118.51 34.92,117.27 36.66,116.06 38.66,114.88 40.9,113.75 43.37,112.66 46.06,111.61 48.97,110.62 52.08,109.69 55.38,108.82 58.86,108.01 62.49,107.27 66.28,106.6 70.2,106 74.23,105.47 78.37,105.03 82.59,104.66 86.88,104.37 91.23,104.17 95.6,104.04 100,104 104.4,104.04 108.77,104.17 113.12,104.37 117.41,104.66 121.63,105.03 125.77,105.47 129.8,106 133.72,106.6 137.51,107.27 141.14,108.01 144.62,108.82 147.92,109.69 151.03,110.62 153.94,111.61 156.63,112.66 159.1,113.75 161.34,114.88 163.34,116.06 165.08,117.27 166.57,118.51 167.8,119.78 168.76,121.06 169.45,122.37 169.86,123.68 170,125\"/><line class=\"fg-edge\" x1=\"30\" y1=\"41\" x2=\"30\" y2=\"125\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"170\" y1=\"41\" x2=\"170\" y2=\"125\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"100\" y1=\"41\" x2=\"170\" y2=\"41\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"100\" cy=\"41\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"135\" y=\"32\" text-anchor=\"middle\" dominant-baseline=\"central\">5<\/text><text x=\"184\" y=\"83\" text-anchor=\"middle\" dominant-baseline=\"central\">6<\/text><\/g><\/svg>Find the volume of a new cylinder in each case: (a) the height is tripled and the radius stays the same; (b) the radius is tripled and the height stays the same.", "steps": ["Original volume: <i>V<\/i> = π<i>r<\/i><sup>2<\/sup><i>h<\/i> = π(5)<sup>2<\/sup>(6) = 150π.", "(a) The height appears to the first power, so the volume is multiplied by 3: 450π.", "(b) The radius is squared, so the volume is multiplied by 3<sup>2<\/sup> = 9: 1,350π.", "Check (b) directly: π(15)<sup>2<\/sup>(6) = 1,350π."], "ans": "(a) 450π (b) 1,350π"}, {"lo": "LO4", "q": "Two similar triangles have areas of 20 square inches and 45 square inches. The shortest side of the smaller triangle is 6 inches long. What is the length, in inches, of the shortest side of the larger triangle?", "steps": ["Ratio of areas, larger to smaller: <span class=\"fq\"><span>45<\/span><span>20<\/span><\/span> = <span class=\"fq\"><span>9<\/span><span>4<\/span><\/span>.", "The length scale factor is the square root: <i>k<\/i> = √(<span class=\"fq\"><span>9<\/span><span>4<\/span><\/span>) = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>.", "Shortest side of the larger triangle: 6 × <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> = 9 inches."], "ans": "9"}, {"lo": "LO4", "q": "Two similar solid pyramids have volumes of 54 cm<sup>3<\/sup> and 250 cm<sup>3<\/sup>. The surface area of the smaller pyramid is 36 cm<sup>2<\/sup>. What is the surface area of the larger pyramid?", "steps": ["Volume ratio: <span class=\"fq\"><span>250<\/span><span>54<\/span><\/span> = <span class=\"fq\"><span>125<\/span><span>27<\/span><\/span>.", "Length scale factor: <i>k<\/i> = ∛(<span class=\"fq\"><span>125<\/span><span>27<\/span><\/span>) = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>.", "Surface area is multiplied by <i>k<\/i><sup>2<\/sup> = <span class=\"fq\"><span>25<\/span><span>9<\/span><\/span>: 36 × <span class=\"fq\"><span>25<\/span><span>9<\/span><\/span> = 100."], "ans": "100 cm<sup>2<\/sup>"}, {"lo": "LO5", "q": "Each edge of a cube is increased by 10%. By what percent does the volume of the cube increase?<br>A) 10%<br>B) 21%<br>C) 30%<br>D) 33.1%", "steps": ["A 10% increase means each edge is multiplied by 1.1.", "Volume is multiplied by 1.1<sup>3<\/sup> = 1.331.", "Percent increase: (1.331 − 1) × 100% = 33.1%. Choice C adds 10% three times, which is the common mistake."], "ans": "D) 33.1%"}], "traps": ["Multiplying an area by <i>k<\/i> instead of <i>k<\/i><sup>2<\/sup>: if every side of a square is tripled, its area is 9 times as large, not 3 times.", "Using <i>k<\/i><sup>2<\/sup> for a volume: when every edge of a box is doubled, the volume is multiplied by 2<sup>3<\/sup> = 8, while the surface area is multiplied by 4.", "Treating an area or volume ratio as the scale factor: if two similar figures have areas in the ratio 4 : 9, their sides are in the ratio 2 : 3. Take the square root (or the cube root for volumes) first.", "Scaling every dimension when only one changes: if only the height of a cylinder doubles, the volume doubles. But because <i>r<\/i> is squared in π<i>r<\/i><sup>2<\/sup><i>h<\/i>, doubling only the radius multiplies the volume by 4.", "Adding percents: a 20% increase in each side of a square raises the area by 44%, not 40%. Convert each percent to a multiplier and multiply.", "Reading the multiplier as the percent: an area multiplier of 0.64 means a 36% decrease, not 64%, and a multiplier of 2.25 means a 125% increase."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A rectangle has a perimeter of 26 centimeters. Each side length of the rectangle is multiplied by 4 to make a new rectangle. What is the perimeter, in centimeters, of the new rectangle?", "opts": ["104", "30", "52", "416"], "ans": 0, "sol": "Perimeter is a length, so it is multiplied by the scale factor 4.<br>26 × 4 = 104.<br>Answer: <b>104<\/b>", "hint": "Perimeter is measured in units, not square units. Which power of 4 applies?"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "The right triangle shown is enlarged so that each of its sides is multiplied by 3.<svg class=\"fig\" viewBox=\"0 0 204 154\" role=\"img\" aria-label=\"Right triangle with a horizontal leg of length 4, a vertical leg of length 3 and a hypotenuse of length 5. A right-angle mark is at the corner where the legs meet.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"34,22 34,124 170,124\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"43,124 43,115 34,115\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"102\" y=\"137\" text-anchor=\"middle\" dominant-baseline=\"central\">4<\/text><text x=\"20\" y=\"73\" text-anchor=\"middle\" dominant-baseline=\"central\">3<\/text><text x=\"109.8\" y=\"62.6\" text-anchor=\"middle\" dominant-baseline=\"central\">5<\/text><\/g><\/svg>What is the area of the enlarged triangle?", "opts": ["18", "54", "108", "162"], "ans": 1, "sol": "Area of the original triangle: <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(4)(3) = 6.<br>Area is multiplied by 3<sup>2<\/sup> = 9: 6 × 9 = 54.<br>Check: the new legs are 12 and 9, and <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(12)(9) = 54.<br>Answer: <b>54<\/b>", "hint": "Find the area of the triangle in the figure first, using the two legs. Then decide what multiplying every side by 3 does to an area."}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "A circle has an area of 20 square meters. A second circle has a radius that is 1.5 times the radius of the first circle. What is the area, in square meters, of the second circle?", "ans": ["45"], "sol": "Area is multiplied by the square of the scale factor: 1.5<sup>2<\/sup> = 2.25.<br>20 × 2.25 = 45.<br>Answer: <b>45<\/b>", "hint": "You do not need the radius. Every circle is similar to every other circle, so think about what scaling a length by 1.5 does to an area."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Every edge of a cube is multiplied by 2. Which statement describes how the surface area and the volume of the cube change?", "opts": ["Surface area × 2, volume × 4", "Surface area × 4, volume × 4", "Surface area × 4, volume × 8", "Surface area × 8, volume × 8"], "ans": 2, "sol": "Surface area is in square units, so it is multiplied by 2<sup>2<\/sup> = 4.<br>Volume is in cubic units, so it is multiplied by 2<sup>3<\/sup> = 8.<br>Answer: <b>Surface area × 4, volume × 8<\/b>", "hint": "Count the dimensions: surface area uses two lengths multiplied together and volume uses three."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A rectangular prism has a length of 5 inches, a width of 3 inches and a height of 2 inches. Each dimension of the prism is multiplied by 3. What is the surface area, in square inches, of the new prism?", "opts": ["186", "270", "1,674", "558"], "ans": 3, "sol": "Original surface area: 2(5 · 3 + 5 · 2 + 3 · 2) = 2(31) = 62.<br>Surface area is multiplied by 3<sup>2<\/sup> = 9: 62 × 9 = 558.<br>Answer: <b>558<\/b>", "hint": "Find the surface area of the original prism by adding the areas of its six faces. Then think about how a scale factor of 3 affects an area."}, {"lo": "LO3", "diff": "E", "type": and the height is not. Find the factor that each change contributes, then multiply them."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Two rectangles are similar. A side of the smaller rectangle is 4 centimeters long, and the corresponding side of the larger rectangle is 10 centimeters long. What is the ratio of the area of the smaller rectangle to the area of the larger rectangle?", "opts": ["2 to 5", "8 to 125", "25 to 4", "4 to 25"], "ans": 3, "sol": "Ratio of corresponding sides: 4 to 10, which is 2 to 5.<br>Areas are in the ratio of the squares: 2<sup>2<\/sup> to 5<sup>2<\/sup>, or 4 to 25.<br>Answer: <b>4 to 25<\/b>", "hint": "Simplify the ratio of the sides first. Then decide what happens to a ratio of lengths when you compare areas."}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "In the figure, triangle <i>A<\/i><i>B<\/i><i>C<\/i> is similar to triangle <i>D<\/i><i>E<\/i><i>F<\/i>, and side <i>A<\/i><i>C<\/i> corresponds to side <i>D<\/i><i>F<\/i>.<svg class=\"fig\" viewBox=\"0 0 297 212\" role=\"img\" aria-label=\"Two similar triangles. Triangle ABC has side AC of length 6 along its base. Triangle DEF has the corresponding side DF of length 9 along its base. Triangle DEF has the same shape as triangle ABC and is larger.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26,182 104,182 49.4,78\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"154,182 271,182 189.1,26\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"65\" y=\"195\" text-anchor=\"middle\" dominant-baseline=\"central\">6<\/text><text x=\"17.62\" y=\"190.59\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">A<\/text><text x=\"113.44\" y=\"189.41\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">C<\/text><text x=\"47.62\" y=\"66.13\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">B<\/text><text x=\"212.5\" y=\"195\" text-anchor=\"middle\" dominant-baseline=\"central\">9<\/text><text x=\"145.62\" y=\"190.59\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">D<\/text><text x=\"280.44\" y=\"189.41\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">F<\/text><text x=\"187.32\" y=\"14.13\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">E<\/text><\/g><\/svg>The area of triangle <i>A<\/i><i>B<\/i><i>C<\/i> is 24 square units. What is the area, in square units, of triangle <i>D<\/i><i>E<\/i><i>F<\/i>?", "ans": ["54"], "sol": "Scale factor from <i>A<\/i><i>B<\/i><i>C<\/i> to <i>D<\/i><i>E<\/i><i>F<\/i>: <span class=\"fq\"><span>9<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>.<br>Area is multiplied by (<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>)<sup>2<\/sup> = <span class=\"fq\"><span>9<\/span><span>4<\/span><\/span>.<br>24 × <span class=\"fq\"><span>9<\/span><span>4<\/span><\/span> = 54.<br>Answer: <b>54<\/b>", "hint": "Use the two labeled corresponding sides to find the scale factor. Then square it, because the question asks about area."}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Two similar cones have volumes of 16π cubic centimeters and 54π cubic centimeters. The height of the smaller cone is 4 centimeters. What is the height, in centimeters, of the larger cone?", "opts": ["9", "12", "6", "13.5"], "ans": 2, "sol": "Volume ratio, larger to smaller: <span class=\"fq\"><span>54π<\/span><span>16π<\/span><\/span> = <span class=\"fq\"><span>27<\/span><span>8<\/span><\/span>.<br>Length scale factor: ∛(<span class=\"fq\"><span>27<\/span><span>8<\/span><\/span>) = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>.<br>Height of the larger cone: 4 × <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> = 6.<br>Answer: <b>6<\/b>", "hint": "The ratio of the volumes is not the ratio of the heights. Simplify the ratio and ask th of the prism is multiplied by 4, and its length and height are not changed. What is the volume, in cubic feet, of the new prism?", "opts": ["94", "360", "1,440", "5,760"], "ans": 1, "sol": "Only one of the three dimensions changes, so the volume is multiplied by 4.<br>90 × 4 = 360.<br>Answer: <b>360<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "In the figure, rectangle <i>A<\/i><i>B<\/i><i>C<\/i><i>D<\/i> is similar to rectangle <i>E<\/i><i>F<\/i><i>G<\/i><i>H<\/i>, with <i>A<\/i><i>B<\/i> corresponding to <i>E<\/i><i>F<\/i>.<svg class=\"fig\" viewBox=\"0 0 290 131\" role=\"img\" aria-label=\"Two rectangles. Rectangle ABCD has side AB of length 8 and side BC of length 6. Rectangle EFGH has side EF of length 12 and side FG of length x.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"30,101 102,101 102,47 30,47\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"152,101 260,101 260,20 152,20\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"66\" y=\"114\" text-anchor=\"middle\" dominant-baseline=\"central\">8<\/text><text x=\"116\" y=\"74\" text-anchor=\"middle\" dominant-baseline=\"central\">6<\/text><text x=\"21.2\" y=\"107.6\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">A<\/text><text x=\"110.8\" y=\"107.6\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">B<\/text><text x=\"110.8\" y=\"40.4\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">C<\/text><text x=\"21.2\" y=\"40.4\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">D<\/text><text x=\"206\" y=\"114\" text-anchor=\"middle\" dominant-baseline=\"central\">12<\/text><text x=\"274\" y=\"60.5\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\">x<\/text><text x=\"143.2\" y=\"107.6\" text-anchor=\"middle\" dominant-baseline=\"central\" font-style=\"italic\"> ff": "H", "type": "mcq", "q": "Water fills a rectangular tank to a depth of 24 centimeters. All of the water is poured into a second rectangular tank whose base length and base width are each 2 times those of the first tank. What is the depth, in centimeters, of the water in the second tank?", "opts": ["3", "6", "12", "96"], "ans": 1, "sol": "The volume of water does not change.<br>The base area is multiplied by 2 × 2 = 4, so the depth is divided by 4.<br>24 ÷ 4 = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Two water bottles are similar in shape. The smaller bottle is 15 centimeters tall and the larger bottle is 25 centimeters tall. The smaller bottle holds 540 milliliters. How many milliliters does the larger bottle hold?", "opts": ["2,500", "550", "900", "1,500"], "ans": 0, "sol": "Scale factor: <span class=\"fq\"><span>25<\/span><span>15<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>.<br>Capacity is a volume, so it is multiplied by (<span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>)<sup>3<\/sup> = <span class=\"fq\"><span>125<\/span><span>27<\/span><\/span>.<br>540 × <span class=\"fq\"><span>125<\/span><span>27<\/span><\/span> = 2,500.<br>Answer: <b>2,500<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "The length of a rectangle is increased by 40% and its width is decreased by 30%. By what percent does the area of the rectangle decrease? (Disregard the % sign when entering your answer.)", "ans": ["2"], "sol": "The area is multiplied by 1.4 × 0.7 = 0.98.<br>Percent decrease: (1 − 0.98) × 100% = 2%.<br>Answer: <b>2<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "A restaurant sells circular pizzas in two sizes: one with a diameter of 12 inches and one with a diameter of 16 inches. The area of the 16-inch pizza is how many times the area of the 12-inch pizza?", "opts": ["<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>64<\/span><span>27 ts area is 6.<br>Area ratio: <span class=\"fq\"><span>54<\/span><span>6<\/span><\/span> = 9, so the scale factor is √9 = 3.<br>A dilation centered at the origin multiplies each coordinate by 3: <i>C<\/i>(4, 3) becomes (12, 9).<br>Answer: <b>(12, 9)<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A solid metal cube with edges 6 centimeters long has a mass of 1.8 kilograms. A solid cube made of the same metal has edges 9 centimeters long. What is the mass, in kilograms, of the larger cube?", "opts": ["2.7", "4.05", "5.4", "6.075"], "ans": 3, "sol": "Mass is proportional to volume for the same material.<br>Scale factor: <span class=\"fq\"><span>9<\/span><span>6<\/span><\/span> = 1.5, so the volume is multiplied by 1.5<sup>3<\/sup> = 3.375.<br>1.8 × 3.375 = 6.075.<br>Answer: <b>6.075<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A cube has a volume of 64 cubic inches. Each edge of the cube is increased by 2 inches. What is the volume, in cubic inches, of the new cube?", "opts": ["72", "216", "96", "144"], "ans": 1, "sol": "The original edge is ∛64 = 4 inches, so the new edge is 6 inches.<br>The scale factor is <span class=\"fq\"><span>6<\/span><span>4<\/span><\/span> = 1.5, and 64 × 1.5<sup>3<\/sup> = 216.<br>Check: 6<sup>3<\/sup> = 216.<br>Answer: <b>216<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A cylinder has radius <i>r<\/i> and height <i>h<\/i>. Which change to the cylinder doubles its volume?", "opts": ["Multiply <i>r<\/i> by 2 and <i>h<\/i> by 2.", "Multiply <i>r<\/i> by <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> and <i>h<\/i> by 2.", "Multiply <i>r<\/i> by 2 and <i>h<\/i> by <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>.", "Multiply <i>r<\/i> by 2 and <i>h<\/i> by <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>."], "ans": 2, "sol": "The volume π<i>r<\/i><sup>2<\/sup><i>h<\/i> is multiplied by (factor for <i>r<\/i>)<sup>2<\/sup> × (factor for <i>h<\/i>).<br>For 2 and <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>: 2<sup>2<\/sup> × <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> = 2. The other choices give 8, <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> and 1.<br>Answer: <b>Multiply <i>r<\/i> by 2 and <i>h<\/i> by <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A paper cup is shaped like a cone with a radius of 3 centimeters and a height of 8 centimeters. A new cup will have the same height, and its volume will be 1.44 times the volume of the original cup. What will be the radius, in centimeters, of the new cup? (The volume of a cone is <i>V<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π<i>r<\/i><sup>2<\/sup><i>h<\/i>.)", "ans": ["3.6", "18/5"], "sol": "With the height fixed, the volume is multiplied by the square of the radius factor.<br>Radius factor: √1.44 = 1.2.<br>New radius: 3 × 1.2 = 3.6.<br>Answer: <b>3.6<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The right triangle shown is similar to a larger right triangle whose area is 270 square units.<svg class=\"fig\" viewBox=\"0 0 236 122\" role=\"img\" aria-label=\"Right triangle with a horizontal leg of length 12 and a vertical leg of length 5. A right-angle mark is at the corner where the legs meet.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"34,22 34,92 202,92\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"43,92 43,83 34,83\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"118\" y=\"105\" text-anchor=\"middle\" dominant-baseline=\"central\">12<\/text><text x=\"20\" y=\"57\" text-anchor=\"middle\" dominant-baseline=\"central\">5<\/text><\/g><\/svg>What is the length of the hypotenuse of the larger triangle?", "opts": ["39", "13", "27", "117"], "ans": 0, "sol": "Area of the triangle shown: <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(12)(5) = 30, and its hypotenuse is √(12<sup>2<\/sup> + 5<sup>2<\/sup>) = 13.<br>Area ratio: <span class=\"fq\"><span>270<\/span><span>30<\/span><\/span> = 9, so the scale factor is 3.<br>Hypotenuse of the larger triangle: 13 × 3 = 39.<br>Answer: <b>39<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Two similar rectangular prisms have surface areas of 96 square inches and 216 square inches. The volume of the larger prism is 135 cubic inches. What is the volume, in cubic inches, of the smaller prism?", "opts": ["60", "90", "<span class=\"fq\"><span>80<\/span><span>3<\/span><\/span>", "40"], "ans": 3, "sol": "Surface area ratio, smaller to larger: <span class=\"fq\"><span>96<\/span><span>216<\/span><\/span> = <span class=\"fq\"><span>4<\/span><span>9<\/span><\/span>, so the length ratio is <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>.<br>Volume ratio: (<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>)<sup>3<\/sup> = <span class=\"fq\"><span>8<\/span><span>27<\/span><\/span>.<br>135 × <span class=\"fq\"><span>8<\/span><span>27<\/span><\/span> = 40.<br>Answer: <b>40<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The length of a rectangle is increased by 20%. By about what percent must the width be decreased so that the area of the rectangle does not change?", "opts": ["About 10%", "About 16.7%", "About 20%", "About 25%"], "ans": 1, "sol": "The width multiplier <i>m<\/i> must satisfy 1.2<i>m<\/i> = 1, so <i>m<\/i> = <span class=\"fq\"><span>1<\/span><span>1.2<\/span><\/span> ≈ 0.833.<br>Percent decrease: (1 − 0.833) × 100% ≈ 16.7%.<br>Answer: <b>About 16.7%<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "A company redesigns its cylindrical soup can. The radius of the new can is 10% greater than the radius of the old can, and the height is 10% less. By what percent is the volume of the new can greater than the volume of the old can? (Disregard the % sign when entering your answer.)", "ans": ["8.9"], "sol": "The volume π<i>r<\/i><sup>2<\/sup><i>h<\/i> is multiplied by 1.1<sup>2<\/sup> × 0.9.<br>1.21 × 0.9 = 1.089.<br>Percent increase: (1.089 − 1) × 100% = 8.9%.<br>Answer: <b>8.9<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "On a map, 1 centimeter represents 2.5 kilometers. A park is shown on the map as a region with an area of 6 square centimeters. What is the actual area, in square kilometers, of the park?", "opts": ["15", "93.75", "37.5", "150"], "ans": 2, "sol": "Each length on the ground is 2.5 times the map length in kilometers.<br>Areas are multiplied by 2.5<sup>2<\/sup> = 6.25.<br>6 × 6.25 = 37.5.<br>Answer: <b>37.5<\/b>"}, {"lo": "LO1", "diff": "X", "type": "spr", "q": "In the figure, the outer square has side length 12. Each of the other squares is formed by joining the midpoints of the sides of the square around it.<svg class=\"fig\" viewBox=\"0 0 196 202\" role=\"img\" aria-label=\"Four squares, one inside the next. The outer square has side length 12. Each inner square has its vertices at the midpoints of the sides of the square around it. The innermost square is shaded.\"><polygon class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" points=\"137,98 98,59 59,98 98,137\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"20,176 176,176 176,20 20,20\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"98,176 176,98 98,20 20,98\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"137,137 137,59 59,59 59,137\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"137,98 98,59 59,98 98,137\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"59\" y=\"189\" text-anchor=\"middle\" dominant-baseline=\"central\">12<\/text><\/g><\/svg>What is the area of the shaded square?", "ans": ["18"], "sol": "Joining the midpoints of a square makes a square with sides <span class=\"fq\"><span>√2<\/span><span>2<\/span><\/span> as long, so each new area is (<span class=\"fq\"><span>√2<\/span><span>2<\/span><\/span>)<sup>2<\/sup> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> of the one before.<br>The areas are 144, 72, 36 and 18.<br>The shaded square is the fourth square.<br>Answer: <b>18<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "A bakery makes a cube-shaped cake and covers its top and four sides with frosting. The small cake uses 800 grams of batter and 200 grams of frosting. A large cake has the same shape, with every edge 1.5 times as long, the mass of batter is proportional to the volume of the cake, and the mass of frosting is proportional to the frosted area. For the large cake, what is the ratio of the mass of batter to the mass of frosting?", "opts": ["6", "4", "9", "13.5"], "ans": 0, "sol": "Batter is multiplied by 1.5<sup>3<\/sup> = 3.375: 800 × 3.375 = 2,700 grams.<br>Frosting is multiplied by 1.5<sup>2<\/sup> = 2.25: 200 × 2.25 = 450 grams.<br>Ratio: <span class=\"fq\"><span>2,700<\/span><span>450<\/span><\/span> = 6. In general the ratio of batter to frosting is multiplied by <i>k<\/i><sup>3<\/sup> ÷ <i>k<\/i><sup>2<\/sup> = <i>k<\/i>.<br>Answer: <b>6<\/b>"}, {"lo": "LO3", "diff": "X", "type": "mcq", "q": "Container <i>A<\/i> is a cylinder with radius <i>r<\/i> and height <i>h<\/i>. Container <i>B<\/i> is a cone with radius 3<i>r<\/i> and height 2<i>h<\/i>. The volume of container <i>B<\/i> is how many times the volume of container <i>A<\/i>? (The volume of a cylinder is π<i>r<\/i><sup>2<\/sup><i>h<\/i>, and the volume of a cone is <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π<i>r<\/i><sup>2<\/sup><i>h<\/i>.)", "opts": ["2", "9", "18", "6"], "ans": 3, "sol": "Volume of <i>B<\/i>: <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>π(3<i>r<\/i>)<sup>2<\/sup>(2<i>h<\/i>) = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> × 9 × 2 × π<i>r<\/i><sup>2<\/sup><i>h<\/i> = 6π<i>r<\/i><sup>2<\/sup><i>h<\/i>.<br>Volume of <i>A<\/i>: π<i>r<\/i><sup>2<\/sup><i>h<\/i>.<br>Ratio: 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO5", "diff": "X", "type": "spr", "q": "The surface area of a cube is increased by 44%. By what percent does the volume of the cube increase? (Disregard the % sign when entering your answer.)", "ans": ["72.8"], "sol": "The surface area multiplier is 1.44, so the edge multiplier is √1.44 = 1.2.<br>The volume multiplier is 1.2<sup>3<\/sup> = 1.728.<br>Percent increase: (1.728 − 1) × 100% = 72.8%.<br>Answer: <b>72.8<\/b>"}], "unit_no": 4, "topic_no": "2", "code": "2.3"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

function qBody(q, sel, name){
  var h='<div class="qtext">'+q.q+'</div>';
  if(q.type==='spr'){
    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';
  } else {
    h+='<div class="opts" role="radiogroup">'+q.opts.map(function(o,k){ return '<button type="button" class="opt" role="radio" aria-checked="'+(sel===k)+'" data-k="'+k+'"><span class="let">'+letter(k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';
  }
  return h;
}

  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
