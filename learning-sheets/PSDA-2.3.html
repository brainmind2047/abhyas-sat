<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2.3 Two-variable data and scatterplots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,
     objective-by-objective lesson cards in Learn mode, one-question-at-a-time quiz with an objective-wise report. */
  :root{
    --navy:#16264A; --navy-2:#1F3B6B; --gold:#C79A3E; --gold-soft:#F3E7C9;
    --paper:#FBF9F4; --paper-2:#F1EAD8; --card:#FFFFFF;
    --ink:#211E1A; --ink-soft:#655D4C; --rule:#E4DCC8;
    --success:#2E7D4F; --success-soft:#E1F2E7;
    --warn:#9A6A12; --warn-soft:#FAF0D6;
    --danger:#B5443E; --danger-soft:#FAE3E1;
    --accent-text:#1F3B6B; --focus:#1F3B6B;
    --gr-grid:#E7E0CF; --gr-axis:#5C5546; --gr-line:#2D55C4; --gr-alt:#B7801A; --gr-shade:rgba(45,85,196,.16);
    --chip-on:#1F3B6B; --chip-on-ink:#FFFFFF;
    --f-display:'Fraunces',Georgia,serif; --f-body:'Source Sans 3',-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
      --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
      --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
      --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
      --danger:#E38884; --danger-soft:#331D1B;
      --accent-text:#E0B75B; --focus:#E0B75B;
      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
    --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
    --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
    --danger:#E38884; --danger-soft:#331D1B;
    --accent-text:#E0B75B; --focus:#E0B75B;
    --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
    --chip-on:#E0B75B; --chip-on-ink:#141210;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;}
  h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.2;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
  i{font-family:var(--f-display); font-style:italic; font-weight:500;}
  .num{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
  .wrap{max-width:860px; margin:0 auto; padding-inline:16px;}

  /* header */
  header.brand{background:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%); color:#F4EFDF; padding-block:calc(18px + env(safe-area-inset-top,0px)) 22px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .crest{width:40px; height:40px; border-radius:10px; background:#C79A3E; color:#16264A; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:17px; flex-shrink:0;}
  .brand-name{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#E0B75B; font-weight:700;}
  .series-name{font-size:18px; font-weight:700; font-family:var(--f-display);}
  .series-name span{font-weight:400; font-size:14px; color:#CFD7EA; font-family:var(--f-body);}
  .crumbs{margin-top:16px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#AEB9D6; display:flex; flex-wrap:wrap; gap:4px 10px;}
  .crumbs b{color:#E0B75B; font-weight:700;}
  h1.title{font-size:clamp(26px,5vw,36px); margin-top:4px;}
  .summary{color:#D9DFEE; margin:6px 0 0; max-width:62ch;}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .meta span{font-size:13px; font-weight:700; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:99px; padding:4px 11px; color:#F4EFDF;}

  /* mode switch */
  .modebar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule);}
  .modebar .wrap{display:flex; gap:6px; align-items:center; padding-block:10px;}
  .tab{border:1.5px solid var(--rule); background:var(--card); border-radius:99px; padding:7px 18px; font-weight:700; cursor:pointer;}
  .tab[aria-selected="true"]{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .modebar .prog{margin-left:auto; font-size:13.5px; color:var(--ink-soft);}

  main{padding-block:22px 40px;}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  /* objectives overview */
  .los{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .los li{display:flex; gap:12px; align-items:flex-start;}
  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .lo-done{margin-left:auto; font-size:12.5px; color:var(--success); font-weight:700; flex-shrink:0;}

  /* lesson */
  .lesson{scroll-margin-top:70px;}
  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}
  .rules h3,.traps h3,.ex h3,.try h3{font-family:var(--f-body); font-size:13px; letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; color:var(--ink-soft);}
  .rules ul,.traps ul{margin:0; padding-left:20px;} .rules li,.traps li{margin:3px 0;}
  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}
  .spr small{color:var(--ink-soft); font-size:13.5px;}
  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}
  svg.gr{width:100%; max-width:300px; height:auto;}
  .gr-grid line{stroke:var(--gr-grid); stroke-width:1;}
  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .qhead .qn{font-family:var(--f-display); font-size:20px; font-weight:700;}
  .pill{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--paper-2); color:var(--ink-soft);}
  .pill.E{background:var(--success-soft); color:var(--success);} .pill.M{background:var(--warn-soft); color:var(--warn);} .pill.H{background:var(--danger-soft); color:var(--danger);}
  .qnav{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .chip{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--card); font:600 14px var(--f-mono); cursor:pointer;}
  .chip.ans{background:var(--paper-2); border-color:var(--ink-soft);}
  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .timer{font:600 14px var(--f-mono); color:var(--ink-soft); margin-left:auto;}
  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

<header class="brand"><div class="wrap">
  <div class="brand-row"><div class="crest" aria-hidden="true">BM</div><div><div class="brand-name">Brain &amp; Mind Academy</div><div class="series-name">Abhyas <span>Math Learning Series · Digital SAT</span></div></div></div>
  <div class="crumbs" id="crumbs"></div>
  <h1 class="title" id="title"></h1>
  <p class="summary" id="summary"></p>
  <div class="meta" id="meta"></div>
</div></header>
<nav class="modebar" aria-label="Sheet mode"><div class="wrap" role="tablist">
  <button class="tab" role="tab" id="tabLearn" aria-selected="true">Learn</button>
  <button class="tab" role="tab" id="tabQuiz" aria-selected="false">Quiz</button>
  <span class="prog" id="prog"></span>
</div></nav>
<main class="wrap" id="main"></main>

var S = {"id": "PSDA-2.3", "unit": "Problem-Solving and Data Analysis", "topic": "Data analysis", "title": "Two-variable data and scatterplots", "intro": "A scatterplot shows two numerical variables measured on the same individuals, and a line of best fit models the trend in the data. On the DSAT you read values from scatterplots, line graphs and tables, describe associations, interpret the slope and <i>y<\/i>-intercept of a line of best fit, make predictions, and decide whether a linear or an exponential model fits the data.", "los": [{"id": "LO1", "text": "Read and interpret scatterplots, line graphs and tables of two variables to find values, counts, changes and rates of change."}, {"id": "LO2", "text": "Describe the association between two variables as positive, negative or none, and as linear or nonlinear and strong or weak."}, {"id": "LO3", "text": "Determine the equation of a line of best fit and interpret its slope and <i>y<\/i>-intercept in context."}, {"id": "LO4", "text": "Use a line of best fit to make predictions and compare predicted values with actual values (residuals)."}, {"id": "LO5", "text": "Choose between a linear and an exponential model for data by testing for constant differences or constant ratios."}], "notes": [{"lo": "LO1", "h": "Reading a scatterplot", "html": "<p>A <b>scatterplot<\/b> shows two numerical variables measured on the same individuals. Each dot is one individual: its horizontal position gives one measurement and its vertical position gives the other. The scatterplot shows the hours that 10 students practiced typing in one week and their typing speeds.<\/p><svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Scatterplot of 10 points: (1, 25); (2, 25); (2, 30); (3, 35); (4, 35); (5, 40); (6, 45); (7, 45); (8, 55); (9, 60)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\"/><line x1=\"77.3\" y1=\"12\" x2=\"77.3\" y2=\"190\"/><line x1=\"102.6\" y1=\"12\" x2=\"102.6\" y2=\"190\"/><line x1=\"127.9\" y1=\"12\" x2=\"127.9\" y2=\"190\"/><line x1=\"153.2\" y1=\"12\" x2=\"153.2\" y2=\"190\"/><line x1=\"178.5\" y1=\"12\" x2=\"178.5\" y2=\"190\"/><line x1=\"203.8\" y1=\"12\" x2=\"203.8\" y2=\"190\"/><line x1=\"229.1\" y1=\"12\" x2=\"229.1\" y2=\"190\"/><line x1=\"254.4\" y1=\"12\" x2=\"254.4\" y2=\"190\"/><line x1=\"279.7\" y1=\"12\" x2=\"279.7\" y2=\"190\"/><line x1=\"305\" y1=\"12\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"175.17\" x2=\"305\" y2=\"175.17\"/><line x1=\"52\" y1=\"160.33\" x2=\"305\" y2=\"160.33\"/><line x1=\"52\" y1=\"145.5\" x2=\"305\" y2=\"145.5\"/><line x1=\"52\" y1=\"130.67\" x2=\"305\" y2=\"130.67\"/><line x1=\"52\" y1=\"115.83\" x2=\"305\" y2=\"115.83\"/><line x1=\"52\" y1=\"101\" x2=\"305\" y2=\"101\"/><line x1=\"52\" y1=\"86.17\" x2=\"305\" y2=\"86.17\"/><line x1=\"52\" y1=\"71.33\" x2=\"305\" y2=\"71.33\"/><line x1=\"52\" y1=\"56.5\" x2=\"305\" y2=\"56.5\"/><line x1=\"52\" y1=\"41.67\" x2=\"305\" y2=\"41.67\"/><line x1=\"52\" y1=\"26.83\" x2=\"305\" y2=\"26.83\"/><line x1=\"52\" y1=\"12\" x2=\"305\" y2=\"12\"/><\/g><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"77.3\" cy=\"115.83\"/><circle r=\"3.5\" cx=\"102.6\" cy=\"115.83\"/><circle r=\"3.5\" cx=\"102.6\" cy=\"101\"/><circle r=\"3.5\" cx=\"127.9\" cy=\"86.17\"/><circle r=\"3.5\" cx=\"153.2\" cy=\"86.17\"/><circle r=\"3.5\" cx=\"178.5\" cy=\"71.33\"/><circle r=\"3.5\" cx=\"203.8\" cy=\"56.5\"/><circle r=\"3.5\" cx=\"229.1\" cy=\"56.5\"/><circle r=\"3.5\" cx=\"254.4\" cy=\"26.83\"/><circle r=\"3.5\" cx=\"279.7\" cy=\"12\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"77.3\" y=\"205\" text-anchor=\"middle\">1<\/text><text x=\"102.6\" y=\"205\" text-anchor=\"middle\">2<\/text><text x=\"127.9\" y=\"205\" text-anchor=\"middle\">3<\/text><text x=\"153.2\" y=\"205\" text-anchor=\"middle\">4<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">5<\/text><text x=\"203.8\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"229.1\" y=\"205\" text-anchor=\"middle\">7<\/text><text x=\"254.4\" y=\"205\" text-anchor=\"middle\">8<\/text><text x=\"279.7\" y=\"205\" text-anchor=\"middle\">9<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">10<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"160.33\" text-anchor=\"end\" dominant-baseline=\"middle\">10<\/text><text x=\"47\" y=\"130.67\" text-anchor=\"end\" dominant-baseline=\"middle\">20<\/text><text x=\"47\" y=\"101\" text-anchor=\"end\" dominant-baseline=\"middle\">30<\/text><text x=\"47\" y=\"71.33\" text-anchor=\"end\" dominant-baseline=\"middle\">40<\/text><text x=\"47\" y=\"41.67\" text-anchor=\"end\" dominant-baseline=\"middle\">50<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">60<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Practice time (hours)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Typing speed (words per minute)<\/text><\/g><\/svg><p>The dot at (5, 40) is a student who practiced 5 hours and types 40 words per minute. To read a dot, go straight down to the <i>x<\/i>-axis and straight across to the <i>y<\/i>-axis. To count the dots that meet a condition, such as “more than 40 words per minute,” find the horizontal gridline at 40 and count the dots strictly above it: there are 4.<\/p><div class=\"rule\">Each dot is one individual. Read its coordinates from the gridlines, and check the scale and units of each axis before you read.<\/div><div class=\"tip\"><b>DSAT tip:<\/b> words such as “more than” and “at least” decide whether a dot that sits exactly on a gridline is counted.<\/div>"}, {"lo": "LO1", "h": "Line graphs and tables of two variables", "html": "<p>A <b>line graph<\/b> shows measurements taken in order, usually over time, with consecutive points joined by segments. The graph shows the height of a bean plant measured once a week.<\/p><svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line graph through (0, 2); (1, 4); (2, 8); (3, 10); (4, 12); (5, 18); (6, 20)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\"/><line x1=\"94.17\" y1=\"12\" x2=\"94.17\" y2=\"190\"/><line x1=\"136.33\" y1=\"12\" x2=\"136.33\" y2=\"190\"/><line x1=\"178.5\" y1=\"12\" x2=\"178.5\" y2=\"190\"/><line x1=\"220.67\" y1=\"12\" x2=\"220.67\" y2=\"190\"/><line x1=\"262.83\" y1=\"12\" x2=\"262.83\" y2=\"190\"/><line x1=\"305\" y1=\"12\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"172.2\" x2=\"305\" y2=\"172.2\"/><line x1=\"52\" y1=\"154.4\" x2=\"305\" y2=\"154.4\"/><line x1=\"52\" y1=\"136.6\" x2=\"305\" y2=\"136.6\"/><line x1=\"52\" y1=\"118.8\" x2=\"305\" y2=\"118.8\"/><line x1=\"52\" y1=\"101\" x2=\"305\" y2=\"101\"/><line x1=\"52\" y1=\"83.2\" x2=\"305\" y2=\"83.2\"/><line x1=\"52\" y1=\"65.4\" x2=\"305\" y2=\"65.4\"/><line x1=\"52\" y1=\"47.6\" x2=\"305\" y2=\"47.6\"/><line x1=\"52\" y1=\"29.8\" x2=\"305\" y2=\"29.8\"/><line x1=\"52\" y1=\"12\" x2=\"305\" y2=\"12\"/><\/g><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"52,172.2 94.17,154.4 136.33,118.8 178.5,101 220.67,83.2 262.83,29.8 305,12\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"52\" cy=\"172.2\"/><circle r=\"3.5\" cx=\"94.17\" cy=\"154.4\"/><circle r=\"3.5\" cx=\"136.33\" cy=\"118.8\"/><circle r=\"3.5\" cx=\"178.5\" cy=\"101\"/><circle r=\"3.5\" cx=\"220.67\" cy=\"83.2\"/><circle r=\"3.5\" cx=\"262.83\" cy=\"29.8\"/><circle r=\"3.5\" cx=\"305\" cy=\"12\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"94.17\" y=\"205\" text-anchor=\"middle\">1<\/text><text x=\"136.33\" y=\"205\" text-anchor=\"middle\">2<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">3<\/text><text x=\"220.67\" y=\"205\" text-anchor=\"middle\">4<\/text><text x=\"262.83\" y=\"205\" text-anchor=\"middle\">5<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"154.4\" text-anchor=\"end\" dominant-baseline=\"middle\">4<\/text><text x=\"47\" y=\"118.8\" text-anchor=\"end\" dominant-baseline=\"middle\">8<\/text><text x=\"47\" y=\"83.2\" text-anchor=\"end\" dominant-baseline=\"middle\">12<\/text><text x=\"47\" y=\"47.6\" text-anchor=\"end\" dominant-baseline=\"middle\">16<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">20<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Week<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Height (cm)<\/text><\/g><\/svg><p>Each segment shows the change over one week. A rising segment is an increase, a falling segment is a decrease, and the <b>steepest<\/b> segment is the greatest change. Here the height rose from 12 to 18 centimeters between week 4 and week 5, the greatest weekly increase. Over a longer interval, use the average rate of change.<\/p><div class=\"eqs\">average rate of change from week 2 to week 6 = <span class=\"fq\"><span>20 − 8<\/span><span>6 − 2<\/span><\/span> = 3 cm per week<\/div><p>A table of two variables works the same way: each row or column is one ordered pair (<i>x<\/i>, <i>y<\/i>).<\/p><div class=\"rule\">Over equal steps in <i>x<\/i>, the greatest change is the steepest segment. Over unequal steps, compare (change in <i>y<\/i>) ÷ (change in <i>x<\/i>).<\/div>"}, {"lo": "LO2", "h": "Describing an association", "html": "<p>An <b>association<\/b> is a pattern in how two variables change together. Describe it with three features.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Feature<\/th><th>What to look for<\/th><\/tr><tr><td>Direction<\/td><td><b>Positive:<\/b> as <i>x<\/i> increases, <i>y<\/i> tends to increase (the dots rise from left to right). <b>Negative:<\/b> as <i>x<\/i> increases, <i>y<\/i> tends to decrease. <b>None:<\/b> no upward or downward trend.<\/td><\/tr><tr><td>Form<\/td><td><b>Linear<\/b> if the dots follow a straight-line pattern; <b>nonlinear<\/b> if they follow a curve, such as one that rises more and more steeply.<\/td><\/tr><tr><td>Strength<\/td><td><b>Strong<\/b> if the dots lie close to the pattern; <b>weak<\/b> if they are widely scattered around it.<\/td><\/tr><\/table><\/div><p>The typing scatterplot above shows a strong, positive, linear association. An association describes a tendency of the whole group, so a few individual dots can go against it.<\/p><div class=\"rule\">“Tends to” is the key phrase. An association does not mean that every point follows the pattern, and it does not by itself show that one variable causes the other.<\/div>"}, {"lo": "LO3", "h": "Writing a line of best fit", "html": "<p>A <b>line of best fit<\/b> is a line through the middle of the dots, with about as many dots above it as below it. It models the trend. The scatterplot shows the age and the value of 10 used cars of the same model, with a line of best fit.<\/p><svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Scatterplot of 10 points: (1, 22); (2, 18); (3, 20); (4, 16); (5, 16); (6, 10); (7, 12); (8, 6); (9, 8); (10, 4). Line of best fit through (0, 24) and (8, 8)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\"/><line x1=\"77.3\" y1=\"12\" x2=\"77.3\" y2=\"190\"/><line x1=\"102.6\" y1=\"12\" x2=\"102.6\" y2=\"190\"/><line x1=\"127.9\" y1=\"12\" x2=\"127.9\" y2=\"190\"/><line x1=\"153.2\" y1=\"12\" x2=\"153.2\" y2=\"190\"/><line x1=\"178.5\" y1=\"12\" x2=\"178.5\" y2=\"190\"/><line x1=\"203.8\" y1=\"12\" x2=\"203.8\" y2=\"190\"/><line x1=\"229.1\" y1=\"12\" x2=\"229.1\" y2=\"190\"/><line x1=\"254.4\" y1=\"12\" x2=\"254.4\" y2=\"190\"/><line x1=\"279.7\" y1=\"12\" x2=\"279.7\" y2=\"190\"/><line x1=\"305\" y1=\"12\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"177.29\" x2=\"305\" y2=\"177.29\"/><line x1=\"52\" y1=\"164.57\" x2=\"305\" y2=\"164.57\"/><line x1=\"52\" y1=\"151.86\" x2=\"305\" y2=\"151.86\"/><line x1=\"52\" y1=\"139.14\" x2=\"305\" y2=\"139.14\"/><line x1=\"52\" y1=\"126.43\" x2=\"305\" y2=\"126.43\"/><line x1=\"52\" y1=\"113.71\" x2=\"305\" y2=\"113.71\"/><line x1=\"52\" y1=\"101\" x2=\"305\" y2=\"101\"/><line x1=\"52\" y1=\"88.29\" x2=\"305\" y2=\"88.29\"/><line x1=\"52\" y1=\"75.57\" x2=\"305\" y2=\"75.57\"/><line x1=\"52\" y1=\"62.86\" x2=\"305\" y2=\"62.86\"/><line x1=\"52\" y1=\"50.14\" x2=\"305\" y2=\"50.14\"/><line x1=\"52\" y1=\"37.43\" x2=\"305\" y2=\"37.43\"/><line x1=\"52\" y1=\"24.71\" x2=\"305\" y2=\"24.71\"/><line x1=\"52\" y1=\"12\" x2=\"305\" y2=\"12\"/><\/g><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-fit\" x1=\"52\" y1=\"37.43\" x2=\"305\" y2=\"164.57\" stroke=\"currentColor\" stroke-width=\"2.2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"77.3\" cy=\"50.14\"/><circle r=\"3.5\" cx=\"102.6\" cy=\"75.57\"/><circle r=\"3.5\" cx=\"127.9\" cy=\"62.86\"/><circle r=\"3.5\" cx=\"153.2\" cy=\"88.29\"/><circle r=\"3.5\" cx=\"178.5\" cy=\"88.29\"/><circle r=\"3.5\" cx=\"203.8\" cy=\"126.43\"/><circle r=\"3.5\" cx=\"229.1\" cy=\"113.71\"/><circle r=\"3.5\" cx=\"254.4\" cy=\"151.86\"/><circle r=\"3.5\" cx=\"279.7\" cy=\"139.14\"/><circle r=\"3.5\" cx=\"305\" cy=\"164.57\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"77.3\" y=\"205\" text-anchor=\"middle\">1<\/text><text x=\"102.6\" y=\"205\" text-anchor=\"middle\">2<\/text><text x=\"127.9\" y=\"205\" text-anchor=\"middle\">3<\/text><text x=\"153.2\" y=\"205\" text-anchor=\"middle\">4<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">5<\/text><text x=\"203.8\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"229.1\" y=\"205\" text-anchor=\"middle\">7<\/text><text x=\"254.4\" y=\"205\" text-anchor=\"middle\">8<\/text><text x=\"279.7\" y=\"205\" text-anchor=\"middle\">9<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">10<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"164.57\" text-anchor=\"end\" dominant-baseline=\"middle\">4<\/text><text x=\"47\" y=\"139.14\" text-anchor=\"end\" dominant-baseline=\"middle\">8<\/text><text x=\"47\" y=\"113.71\" text-anchor=\"end\" dominant-baseline=\"middle\">12<\/text><text x=\"47\" y=\"88.29\" text-anchor=\"end\" dominant-baseline=\"middle\">16<\/text><text x=\"47\" y=\"62.86\" text-anchor=\"end\" dominant-baseline=\"middle\">20<\/text><text x=\"47\" y=\"37.43\" text-anchor=\"end\" dominant-baseline=\"middle\">24<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">28<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Age (years)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Value (thousands of dollars)<\/text><\/g><\/svg><p>To write its equation <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i>, choose two points <b>on the line<\/b> where it crosses gridline intersections. This line passes through (0, 24) and (8, 8).<\/p><div class=\"eqs\"><i>m<\/i> = <span class=\"fq\"><span>8 − 24<\/span><span>8 − 0<\/span><\/span> = <span class=\"fq\"><span>−16<\/span><span>8<\/span><\/span> = −2 &nbsp;&nbsp; <i>b<\/i> = 24<br><i>y<\/i> = −2<i>x<\/i> + 24<\/div><div class=\"rule\">Find the slope from two points on the line, not from two data points: most of the dots are not on the line.<\/div>"}, {"lo": "LO3", "h": "Slope and y-intercept in context", "html": "<p>In a line of best fit <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i>, each number has a meaning in the situation. For the cars, <i>y<\/i> = −2<i>x<\/i> + 24, where <i>x<\/i> is the age in years and <i>y<\/i> is the value in thousands of dollars.<\/p><ul><li><b>Slope −2:<\/b> for each additional year of age, the model predicts that the value decreases by 2 thousand dollars. The units of the slope are units of <i>y<\/i> per unit of <i>x<\/i>.<\/li><li><b><i>y<\/i>-intercept 24:<\/b> the predicted value of a car of age 0, a new car, is 24 thousand dollars.<\/li><\/ul><div class=\"rule\">Slope = predicted change in <i>y<\/i> for each increase of 1 in <i>x<\/i>. The <i>y<\/i>-intercept = predicted <i>y<\/i> when <i>x<\/i> = 0.<\/div><p>Over several units, multiply: in 3 years the predicted value drops by 3 × 2 = 6 thousand dollars. Use words like “predicted” or “estimated,” because the line describes the trend, not each car. If <i>x<\/i> = 0 is far outside the data, the <i>y<\/i>-intercept may have no sensible meaning.<\/p><div class=\"tip\"><b>DSAT tip:<\/b> if the equation is in another form, such as 2<i>x<\/i> + <i>y<\/i> = 24, solve for <i>y<\/i> first to see the slope.<\/div>"}, {"lo": "LO4", "h": "Predictions and residuals", "html": "<p>To <b>predict<\/b>, substitute into the equation of the line of best fit. For a 5-year-old car, <i>y<\/i> = −2(5) + 24 = 14, so the predicted value is 14 thousand dollars. The actual 5-year-old car in the data is worth 16 thousand dollars.<\/p><div class=\"eqs\">residual = actual − predicted = 16 − 14 = 2<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Residual<\/th><th>The data point is<\/th><th>The line<\/th><\/tr><tr><td>positive<\/td><td>above the line<\/td><td>underestimates<\/td><\/tr><tr><td>negative<\/td><td>below the line<\/td><td>overestimates<\/td><\/tr><tr><td>0<\/td><td>on the line<\/td><td>is exact<\/td><\/tr><\/table><\/div><div class=\"rule\">Residual = actual − predicted. A point above the line has a positive residual.<\/div><p>Predictions are most trustworthy for <i>x<\/i>-values inside the range of the data. Predicting far outside that range, such as the value of a 20-year-old car, assumes the trend continues and is much less reliable.<\/p><div class=\"tip\"><b>DSAT tip:<\/b> to predict <i>x<\/i> from a given <i>y<\/i>, substitute the <i>y<\/i>-value and solve the linear equation for <i>x<\/i>.<\/div>"}, {"lo": "LO5", "h": "Linear or exponential?", "html": "<p>When data follow a pattern, check how <i>y<\/i> changes for equal steps in <i>x<\/i>.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><tr><td>Data A<\/td><td>5<\/td><td>8<\/td><td>11<\/td><td>14<\/td><td>17<\/td><\/tr><tr><td>Data B<\/td><td>5<\/td><td>10<\/td><td>20<\/td><td>40<\/td><td>80<\/td><\/tr><\/table><\/div><p>In data A, <i>y<\/i> goes up by 3 at each step: a constant <b>difference<\/b>, so a linear model fits, <i>y<\/i> = 5 + 3<i>x<\/i>. In data B, <i>y<\/i> is multiplied by 2 at each step: a constant <b>ratio<\/b>, so an exponential model fits, <i>y<\/i> = 5(2)<sup><i>x<\/i><\/sup>.<\/p><div class=\"rule\">Equal differences for equal steps in <i>x<\/i>: linear. Equal ratios for equal steps in <i>x<\/i>: exponential.<\/div><p>Words give the same clue. “Increases by 300 each year” is linear; “increases by 3% each year” is exponential with growth factor 1.03, and “decreases by 3% each year” has decay factor 0.97. On a scatterplot, an exponential pattern curves, getting steeper (growth) or flattening out (decay).<\/p><div class=\"tip\"><b>Desmos tip:<\/b> enter the data in a table, then type y1 ~ mx1 + b for a linear model or y1 ~ ab^x1 for an exponential model, and compare how closely each one fits.<\/div>"}], "examples": [{"lo": "LO1", "q": "The scatterplot shows the daily high temperature and the number of cold drinks sold at a kiosk on 10 days.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Scatterplot of 10 points: (22, 20); (24, 30); (26, 50); (28, 40); (28, 60); (30, 50); (32, 60); (34, 70); (34, 80); (36, 70)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\"/><line x1=\"83.62\" y1=\"12\" x2=\"83.62\" y2=\"190\"/><line x1=\"115.25\" y1=\"12\" x2=\"115.25\" y2=\"190\"/><line x1=\"146.88\" y1=\"12\" x2=\"146.88\" y2=\"190\"/><line x1=\"178.5\" y1=\"12\" x2=\"178.5\" y2=\"190\"/><line x1=\"210.12\" y1=\"12\" x2=\"210.12\" y2=\"190\"/><line x1=\"241.75\" y1=\"12\" x2=\"241.75\" y2=\"190\"/><line x1=\"273.38\" y1=\"12\" x2=\"273.38\" y2=\"190\"/><line x1=\"305\" y1=\"12\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"167.75\" x2=\"305\" y2=\"167.75\"/><line x1=\"52\" y1=\"145.5\" x2=\"305\" y2=\"145.5\"/><line x1=\"52\" y1=\"123.25\" x2=\"305\" y2=\"123.25\"/><line x1=\"52\" y1=\"101\" x2=\"305\" y2=\"101\"/><line x1=\"52\" y1=\"78.75\" x2=\"305\" y2=\"78.75\"/><line x1=\"52\" y1=\"56.5\" x2=\"305\" y2=\"56.5\"/><line x1=\"52\" y1=\"34.25\" x2=\"305\" y2=\"34.25\"/><line x1=\"52\" y1=\"12\" x2=\"305\" y2=\"12\"/><\/g><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"83.62\" cy=\"145.5\"/><circle r=\"3.5\" cx=\"115.25\" cy=\"123.25\"/><circle r=\"3.5\" cx=\"146.88\" cy=\"78.75\"/><circle r=\"3.5\" cx=\"178.5\" cy=\"101\"/><circle r=\"3.5\" cx=\"178.5\" cy=\"56.5\"/><circle r=\"3.5\" cx=\"210.12\" cy=\"78.75\"/><circle r=\"3.5\" cx=\"241.75\" cy=\"56.5\"/><circle r=\"3.5\" cx=\"273.38\" cy=\"34.25\"/><circle r=\"3.5\" cx=\"273.38\" cy=\"12\"/><circle r=\"3.5\" cx=\"305\" cy=\"34.25\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">20<\/text><text x=\"83.62\" y=\"205\" text-anchor=\"middle\">22<\/text><text x=\"115.25\" y=\"205\" text-anchor=\"middle\">24<\/text><text x=\"146.88\" y=\"205\" text-anchor=\"middle\">26<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">28<\/text><text x=\"210.12\" y=\"205\" text-anchor=\"middle\">30<\/text><text x=\"241.75\" y=\"205\" text-anchor=\"middle\">32<\/text><text x=\"273.38\" y=\"205\" text-anchor=\"middle\">34<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">36<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"167.75\" text-anchor=\"end\" dominant-baseline=\"middle\">10<\/text><text x=\"47\" y=\"145.5\" text-anchor=\"end\" dominant-baseline=\"middle\">20<\/text><text x=\"47\" y=\"123.25\" text-anchor=\"end\" dominant-baseline=\"middle\">30<\/text><text x=\"47\" y=\"101\" text-anchor=\"end\" dominant-baseline=\"middle\">40<\/text><text x=\"47\" y=\"78.75\" text-anchor=\"end\" dominant-baseline=\"middle\">50<\/text><text x=\"47\" y=\"56.5\" text-anchor=\"end\" dominant-baseline=\"middle\">60<\/text><text x=\"47\" y=\"34.25\" text-anchor=\"end\" dominant-baseline=\"middle\">70<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">80<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">High temperature (°C)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Drinks sold<\/text><\/g><\/svg>On how many of these days was the high temperature below 30°C and the number of drinks sold greater than 40?", "steps": ["Days with a high below 30°C are the dots to the left of the vertical gridline at 30: (22, 20), (24, 30), (26, 50), (28, 40) and (28, 60).", "Of these, only (26, 50) and (28, 60) are above the horizontal gridline at 40. The dot (28, 40) shows exactly 40 drinks, which is not greater than 40."], "ans": "2 days"}, {"lo": "LO2", "q": "For 8 towns in a region, a geography class recorded the elevation and the average July high temperature.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Elevation (meters)<\/th><th>Temperature (°C)<\/th><\/tr><tr><td>200<\/td><td>31<\/td><\/tr><tr><td>500<\/td><td>29<\/td><\/tr><tr><td>800<\/td><td>28.5<\/td><\/tr><tr><td>1100<\/td><td>26<\/td><\/tr><tr><td>1400<\/td><td>25<\/td><\/tr><tr><td>1700<\/td><td>24<\/td><\/tr><tr><td>2000<\/td><td>21.5<\/td><\/tr><tr><td>2,300<\/td><td>20<\/td><\/tr><\/table><\/div>Which choice best describes the association between elevation and temperature?<br>A) Strong positive association<br>B) Strong negative association<br>C) No association<br>D) Positive association, then negative association", "steps": ["As the elevation increases down the table, the temperature goes down, from 31°C at 200 meters to 20°C at 2,300 meters. That is a negative association.", "Each increase of 300 meters lowers the temperature by between 0.5 and 2.5 degrees, a steady drop, so the points lie close to a line: the association is strong."], "ans": "B) Strong negative association"}, {"lo": "LO3", "q": "The scatterplot shows the number of hours 9 students spent preparing for a test and their test scores, with a line of best fit.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Scatterplot of 9 points: (1, 55); (2, 55); (3, 70); (4, 65); (5, 80); (6, 75); (6, 85); (7, 90); (8, 85). Line of best fit through (0, 50) and (8, 90)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\"/><line x1=\"83.62\" y1=\"12\" x2=\"83.62\" y2=\"190\"/><line x1=\"115.25\" y1=\"12\" x2=\"115.25\" y2=\"190\"/><line x1=\"146.88\" y1=\"12\" x2=\"146.88\" y2=\"190\"/><line x1=\"178.5\" y1=\"12\" x2=\"178.5\" y2=\"190\"/><line x1=\"210.12\" y1=\"12\" x2=\"210.12\" y2=\"190\"/><line x1=\"241.75\" y1=\"12\" x2=\"241.75\" y2=\"190\"/><line x1=\"273.38\" y1=\"12\" x2=\"273.38\" y2=\"190\"/><line x1=\"305\" y1=\"12\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"175.17\" x2=\"305\" y2=\"175.17\"/><line x1=\"52\" y1=\"160.33\" x2=\"305\" y2=\"160.33\"/><line x1=\"52\" y1=\"145.5\" x2=\"305\" y2=\"145.5\"/><line x1=\"52\" y1=\"130.67\" x2=\"305\" y2=\"130.67\"/><line x1=\"52\" y1=\"115.83\" x2=\"305\" y2=\"115.83\"/><line x1=\"52\" y1=\"101\" x2=\"305\" y2=\"101\"/><line x1=\"52\" y1=\"86.17\" x2=\"305\" y2=\"86.17\"/><line x1=\"52\" y1=\"71.33\" x2=\"305\" y2=\"71.33\"/><line x1=\"52\" y1=\"56.5\" x2=\"305\" y2=\"56.5\"/><line x1=\"52\" y1=\"41.67\" x2=\"305\" y2=\"41.67\"/><line x1=\"52\" y1=\"26.83\" x2=\"305\" y2=\"26.83\"/><line x1=\"52\" y1=\"12\" x2=\"305\" y2=\"12\"/><\/g><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-fit\" x1=\"52\" y1=\"160.33\" x2=\"305\" y2=\"41.67\" stroke=\"currentColor\" stroke-width=\"2.2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"83.62\" cy=\"145.5\"/><circle r=\"3.5\" cx=\"115.25\" cy=\"145.5\"/><circle r=\"3.5\" cx=\"146.88\" cy=\"101\"/><circle r=\"3.5\" cx=\"178.5\" cy=\"115.83\"/><circle r=\"3.5\" cx=\"210.12\" cy=\"71.33\"/><circle r=\"3.5\" cx=\"241.75\" cy=\"86.17\"/><circle r=\"3.5\" cx=\"241.75\" cy=\"56.5\"/><circle r=\"3.5\" cx=\"273.38\" cy=\"41.67\"/><circle r=\"3.5\" cx=\"305\" cy=\"56.5\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"83.62\" y=\"205\" text-anchor=\"middle\">1<\/text><text x=\"115.25\" y=\"205\" text-anchor=\"middle\">2<\/text><text x=\"146.88\" y=\"205\" text-anchor=\"middle\">3<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">4<\/text><text x=\"210.12\" y=\"205\" text-anchor=\"middle\">5<\/text><text x=\"241.75\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"273.38\" y=\"205\" text-anchor=\"middle\">7<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">8<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">40<\/text><text x=\"47\" y=\"160.33\" text-anchor=\"end\" dominant-baseline=\"middle\">50<\/text><text x=\"47\" y=\"130.67\" text-anchor=\"end\" dominant-baseline=\"middle\">60<\/text><text x=\"47\" y=\"101\" text-anchor=\"end\" dominant-baseline=\"middle\">70<\/text><text x=\"47\" y=\"71.33\" text-anchor=\"end\" dominant-baseline=\"middle\">80<\/text><text x=\"47\" y=\"41.67\" text-anchor=\"end\" dominant-baseline=\"middle\">90<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">100<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Preparation time (hours)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Test score<\/text><\/g><\/svg>Which equation best represents the line of best fit?<br>A) <i>y<\/i> = 50<i>x<\/i> + 5<br>B) <i>y<\/i> = 5<i>x<\/i> + 50<br>C) <i>y<\/i> = 0.2<i>x<\/i> + 50<br>D) <i>y<\/i> = 5<i>x<\/i> + 90", "steps": ["The line crosses the <i>y<\/i>-axis at (0, 50), so <i>b<\/i> = 50.", "The line also passes through the gridline intersection (8, 90). Slope: <span class=\"fq\"><span>90 − 50<\/span><span>8 − 0<\/span><\/span> = <span class=\"fq\"><span>40<\/span><span>8<\/span><\/span> = 5.", "So <i>y<\/i> = 5<i>x<\/i> + 50. Choice C uses run over rise, and choice D uses the wrong point as the <i>y<\/i>-intercept."], "ans": "B) <i>y<\/i> = 5<i>x<\/i> + 50"}, {"lo": "LO3", "q": "A scatterplot shows the number of days <i>x<\/i> since a tomato plant was moved into a garden and its height <i>y<\/i>, in centimeters. The line of best fit is <i>y<\/i> = 1.8<i>x<\/i> + 12. What is the best interpretation of 1.8 in this context?", "steps": ["1.8 is the coefficient of <i>x<\/i>, so it is the slope of the line.", "The slope is the predicted change in <i>y<\/i> for each increase of 1 in <i>x<\/i>: the height in centimeters for each additional day.", "Because the line is a model of the trend, say “predicted”: it is not the exact growth of every plant on every day."], "ans": "The model predicts that the plant grows 1.8 centimeters per day."}, {"lo": "LO4", "q": "The line of best fit for a data set is <i>y<\/i> = −3<i>x<\/i> + 60. The data set includes the point (8, 41). What is the residual (actual <i>y<\/i>-value minus predicted <i>y<\/i>-value) for this point?", "steps": ["Predicted value: <i>y<\/i> = −3(8) + 60 = 36.", "Residual = actual − predicted = 41 − 36 = 5. The point lies 5 units above the line."], "ans": "5"}, {"lo": "LO5", "q": "The table shows the mass of a substance, in grams, remaining in a sample at the end of each day. Is a linear or an exponential model more appropriate?<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Day<\/th><th>Mass (grams)<\/th><\/tr><tr><td>0<\/td><td>200<\/td><\/tr><tr><td>1<\/td><td>180<\/td><\/tr><tr><td>2<\/td><td>162<\/td><\/tr><tr><td>3<\/td><td>145.8<\/td><\/tr><tr><td>4<\/td><td>131.22<\/td><\/tr><\/table><\/div>", "steps": ["Differences: −20, −18, −16.2, −14.58. They are not constant, so a linear model does not fit exactly.", "Ratios: <span class=\"fq\"><span>180<\/span><span>200<\/span><\/span> = 0.9, <span class=\"fq\"><span>162<\/span><span>180<\/span><\/span> = 0.9, <span class=\"fq\"><span>145.8<\/span><span>162<\/span><\/span> = 0.9 and <span class=\"fq\"><span>131.22<\/span><span>145.8<\/span><\/span> = 0.9. Each day the mass is multiplied by 0.9.", "A constant ratio means an exponential model fits: <i>y<\/i> = 200(0.9)<sup><i>x<\/i><\/sup>, a decrease of 10% per day."], "ans": "Exponential: <i>y<\/i> = 200(0.9)<sup><i>x<\/i><\/sup>"}], "traps": ["Finding the slope of a line of best fit from two data points. Use two points that are <i>on the line<\/i>, ideally where it crosses gridline intersections.", "Misreading a scale. Check what each gridline is worth (it may be 2, 5 or 10 units) and whether an axis starts at 0 before reading any value.", "Mixing up the slope and the <i>y<\/i>-intercept in context: the slope is a change <i>per unit<\/i> of <i>x<\/i>, and the <i>y<\/i>-intercept is the predicted value when <i>x<\/i> = 0.", "Getting the sign of a residual backward. Residual = actual − predicted, so a point above the line has a positive residual.", "Reading an association as a rule for every point, or as proof of cause and effect. A negative association only says that <i>y<\/i> <i>tends<\/i> to decrease as <i>x<\/i> increases.", "Calling any increasing data exponential. Test for a constant difference (linear) or a constant ratio (exponential), and watch for unequal steps in <i>x<\/i>."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "The scatterplot shows the number of hours each of 12 volunteers spent at a beach cleanup and the mass of trash, in kilograms, that each volunteer collected.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Scatterplot of 12 points: (1, 4); (2, 4); (2, 6); (3, 6); (3, 8); (4, 10); (5, 10); (5, 12); (6, 14); (7, 14); (7, 16); (8, 18)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\"/><line x1=\"83.62\" y1=\"12\" x2=\"83.62\" y2=\"190\"/><line x1=\"115.25\" y1=\"12\" x2=\"115.25\" y2=\"190\"/><line x1=\"146.88\" y1=\"12\" x2=\"146.88\" y2=\"190\"/><line x1=\"178.5\" y1=\"12\" x2=\"178.5\" y2=\"190\"/><line x1=\"210.12\" y1=\"12\" x2=\"210.12\" y2=\"190\"/><line x1=\"241.75\" y1=\"12\" x2=\"241.75\" y2=\"190\"/><line x1=\"273.38\" y1=\"12\" x2=\"273.38\" y2=\"190\"/><line x1=\"305\" y1=\"12\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"172.2\" x2=\"305\" y2=\"172.2\"/><line x1=\"52\" y1=\"154.4\" x2=\"305\" y2=\"154.4\"/><line x1=\"52\" y1=\"136.6\" x2=\"305\" y2=\"136.6\"/><line x1=\"52\" y1=\"118.8\" x2=\"305\" y2=\"118.8\"/><line x1=\"52\" y1=\"101\" x2=\"305\" y2=\"101\"/><line x1=\"52\" y1=\"83.2\" x2=\"305\" y2=\"83.2\"/><line x1=\"52\" y1=\"65.4\" x2=\"305\" y2=\"65.4\"/><line x1=\"52\" y1=\"47.6\" x2=\"305\" y2=\"47.6\"/><line x1=\"52\" y1=\"29.8\" x2=\"305\" y2=\"29.8\"/><line x1=\"52\" y1=\"12\" x2=\"305\" y2=\"12\"/><\/g><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"83.62\" cy=\"154.4\"/><circle r=\"3.5\" cx=\"115.25\" cy=\"154.4\"/><circle r=\"3.5\" cx=\"115.25\" cy=\"136.6\"/><circle r=\"3.5\" cx=\"146.88\" cy=\"136.6\"/><circle r=\"3.5\" cx=\"146.88\" cy=\"118.8\"/><circle r=\"3.5\" cx=\"178.5\" cy=\"101\"/><circle r=\"3.5\" cx=\"210.12\" cy=\"101\"/><circle r=\"3.5\" cx=\"210.12\" cy=\"83.2\"/><circle r=\"3.5\" cx=\"241.75\" cy=\"65.4\"/><circle r=\"3.5\" cx=\"273.38\" cy=\"65.4\"/><circle r=\"3.5\" cx=\"273.38\" cy=\"47.6\"/><circle r=\"3.5\" cx=\"305\" cy=\"29.8\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"83.62\" y=\"205\" text-anchor=\"middle\">1<\/text><text x=\"115.25\" y=\"205\" text-anchor=\"middle\">2<\/text><text x=\"146.88\" y=\"205\" text-anchor=\"middle\">3<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">4<\/text><text x=\"210.12\" y=\"205\" text-anchor=\"middle\">5<\/text><text x=\"241.75\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"273.38\" y=\"205\" text-anchor=\"middle\">7<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">8<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"154.4\" text-anchor=\"end\" dominant-baseline=\"middle\">4<\/text><text x=\"47\" y=\"118.8\" text-anchor=\"end\" dominant-baseline=\"middle\">8<\/text><text x=\"47\" y=\"83.2\" text-anchor=\"end\" dominant-baseline=\"middle\">12<\/text><text x=\"47\" y=\"47.6\" text-anchor=\"end\" dominant-baseline=\"middle\">16<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">20<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Time at cleanup (hours)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Trash collected (kg)<\/text><\/g><\/svg>How many of the volunteers collected more than 12 kilograms of trash?", "opts": ["4", "5", "8", "12"], "ans": 0, "sol": "The dots above the horizontal gridline at 12 are (6, 14), (7, 14), (7, 16) and (8, 18).<br>The dot (5, 12) is exactly 12, which is not more than 12.<br>Answer: <b>4<\/b>", "hint": "Find the horizontal gridline for 12 kilograms and count only the dots strictly above it."}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "The table shows the temperature of the water in a pot <i>t<\/i> minutes after a burner was turned on.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Time (minutes)<\/th><th>Temperature (°C)<\/th><\/tr><tr><td>0<\/td><td>20<\/td><\/tr><tr><td>5<\/td><td>32<\/td><\/tr><tr><td>10<\/td><td>41<\/td><\/tr><tr><td>15<\/td><td>48<\/td><\/tr><tr><td>20<\/td><td>52<\/td><\/tr><\/table><\/div>By how many degrees Celsius did the temperature increase from <i>t<\/i> = 5 to <i>t<\/i> = 15?", "ans": ["16"], "sol": "At <i>t<\/i> = 5 the temperature is 32°C; at <i>t<\/i> = 15 it is 48°C.<br>48 − 32 = 16.<br>Answer: <b>16<\/b>", "hint": "Find the rows for <i>t<\/i> = 5 and <i>t<\/i> = 15, x=\"178.5\" cy=\"65.4\"/><circle r=\"3.5\" cx=\"220.67\" cy=\"47.6\"/><circle r=\"3.5\" cx=\"262.83\" cy=\"83.2\"/><circle r=\"3.5\" cx=\"305\" cy=\"47.6\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">2018<\/text><text x=\"94.17\" y=\"205\" text-anchor=\"middle\">2019<\/text><text x=\"136.33\" y=\"205\" text-anchor=\"middle\">2020<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">2021<\/text><text x=\"220.67\" y=\"205\" text-anchor=\"middle\">2022<\/text><text x=\"262.83\" y=\"205\" text-anchor=\"middle\">2023<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">2024<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"154.4\" text-anchor=\"end\" dominant-baseline=\"middle\">10<\/text><text x=\"47\" y=\"118.8\" text-anchor=\"end\" dominant-baseline=\"middle\">20<\/text><text x=\"47\" y=\"83.2\" text-anchor=\"end\" dominant-baseline=\"middle\">30<\/text><text x=\"47\" y=\"47.6\" text-anchor=\"end\" dominant-baseline=\"middle\">40<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">50<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Year<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Number of members<\/text><\/g><\/svg>During which one-year period did the number of members increase by the greatest amount?", "opts": ["2018 to 2019", "2020 to 2021", "2022 to 2023", "2023 to 2024"], "ans": 1, "sol": "Yearly changes: +5, 0, +15, +5, −10, +10.<br>The greatest increase is +15, from 20 members to 35 members, between 2020 and 2021. The change from 2022 to 2023 is a decrease.<br>Answer: <b>2020 to 2021<\/b>", "hint": "Compare how far each segment rises. A falling segment shows a decrease, not an increase."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "In a survey of 200 adults, those who spent more time commuting each day tended to spend less time exercising each day. Which choice best describes the association between daily commuting time and daily exercise time?", "opts": ["Positive association", "No association", "An exact linear relationship", "Negative association"], "ans": 3, "sol": "As commuting time increases, exercise time tends to decrease.<br>When one variable tends to decrease as the other increases, the association is negative. “Tended to” means it is a trend, not an exact relationship.<br>Answer: <b>Negative association<\/b>", "hint": "As one variable goes up, what tends to happen to the other one?"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "The table shows two data sets, P and Q, that use the same <i>x<\/i>-values.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><tr><td><i>y<\/i> in data set P<\/td><td>2<\/td><td>4<\/td><td>5<\/td><td>8<\/td><td>9<\/td><td>12<\/td><\/tr><tr><td><i>y<\/i> in data set Q<\/td><td>9<\/td><td>3<\/td><td>8<\/td><td>2<\/td><td>10<\/td><td>5<\/td><\/tr><\/table><\/div>Which statement best describes the associations between <i>x<\/i> and <i>y<\/i>?", "opts": ["Both data sets show a strong positive association.", "Data set P shows a strong positive association, and data set Q shows little or no association.", "Data set P shows a strong negative association, and data set Q shows a strong positive association.", "Data set Q shows a stronger positive association than data set P."], "ans": 1, "sol": "Data set P: as <i>x<\/i> increases, <i>y<\/i> rises steadily from 2 to 12, so the association is strong and positive.<br>Data set Q: <i>y<\/i> jumps up and down (9, 3, 8, 2, 10, 5) with no upward or downward trend, so there is little or no association.<br>Answer: <b>Data set P shows a strong positive association, and data set Q shows little or no association.<\/b>", "hint": "For each data set, follow <i>y<\/i> as <i>x<\/i> increases. Does it climb steadily, or jump up and down?"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "For 20 taxi rides in a city, a scatterplot shows the distance <i>x<\/i>, in kilometers, and the fare <i>y<\/i>, in dollars, of each ride. The line of best fit is <i>y<\/i> = 1.5<i>x<\/i> + 4. What is the best interpretation of 4 in this context?", "opts": ["The estimated increase in the fare, in dollars, for each additional kilometer", "The estimated distance, in kilometers, of a ride with a fare of 0 dollars", "The estimated number of kilometers that can be traveled for each dollar", "The estimated fare, in dollars, for a ride of 0 kilometers"], "ans": 3, "sol": "4 is the constant term, the <i>y<\/i>-intercept: the value of <i>y<\/i> when <i>x<\/i> = 0.<br>So 4 is the estimated fare, in dollars, for a ride of 0 kilometers (the starting fare). The estimated increase per kilometer is the slope, 1.5.<br>Answer: <b>The estimated fare, in dollars, for a ride of 0 kilometers<\/b>", "hint": "4 is the constant term. What is <i>y<\/i> when <i>x<\/i> = 0?"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "The scatterplot shows the number of weeks <i>x<\/i> that each of 10 people had been training and the number of push-ups <i>y<\/i> that each person could do without stopping. A line of best fit is shown.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Scatterplot of 10 points: (1, 12); (2, 16); (3, 16); (4, 22); (5, 20); (6, 26); (7, 26); (8, 32); (9, 32); (10, 34). Line of best fit through (0, 10) and (8, 30)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\"/><line x1=\"77.3\" y1=\"12\" x2=\"77.3\" y2=\"190\"/><line x1=\"102.6\" y1=\"12\" x2=\"102.6\" y2=\"190\"/><line x1=\"127.9\" y1=\"12\" x2=\"127.9\" y2=\"190\"/><line x1=\"153.2\" y1=\"12\" x2=\"153.2\" y2=\"190\"/><line x1=\"178.5\" y1=\"12\" x2=\"178.5\" y2=\"190\"/><line x1=\"203.8\" y1=\"12\" x2=\"203.8\" y2=\"190\"/><line x1=\"229.1\" y1=\"12\" x2=\"229.1\" y2=\"190\"/><line x1= =\"3.5\" cx=\"279.7\" cy=\"47.6\"/><circle r=\"3.5\" cx=\"305\" cy=\"38.7\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"77.3\" y=\"205\" text-anchor=\"middle\">1<\/text><text x=\"102.6\" y=\"205\" text-anchor=\"middle\">2<\/text><text x=\"127.9\" y=\"205\" text-anchor=\"middle\">3<\/text><text x=\"153.2\" y=\"205\" text-anchor=\"middle\">4<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">5<\/text><text x=\"203.8\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"229.1\" y=\"205\" text-anchor=\"middle\">7<\/text><text x=\"254.4\" y=\"205\" text-anchor=\"middle\">8<\/text><text x=\"279.7\" y=\"205\" text-anchor=\"middle\">9<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">10<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"145.5\" text-anchor=\"end\" dominant-baseline=\"middle\">10<\/text><text x=\"47\" y=\"101\" text-anchor=\"end\" dominant-baseline=\"middle\">20<\/text><text x=\"47\" y=\"56.5\" text-anchor=\"end\" dominant-baseline=\"middle\">30<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">40<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Training time (weeks)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Push-ups<\/text><\/g><\/svg>Based on the line of best fit, what is the predicted increase in the number of push-ups for each additional week of training?", "ans": ["2.5", "5/2"], "sol": "The line passes through the gridline intersections (0, 10) and (8, 30).<br>Slope = <span class=\"fq\"><span>30 − 10<\/span><span>8 − 0<\/span><\/span> = <span class=\"fq\"><span>20<\/span><span>8<\/span><\/span> = 2.5.<br>Answer: <b>2.5<\/b>", "hint": "Find two points where the line crosses gridline intersections, then divide the rise by the run."}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A line of best fit for a data set passes through the points (4, 62) and (10, 47). According to the line, what is the predicted value of <i>y<\/i> when <i>x<\/i> = 0?", "opts": ["52", "63.6", "72", "87"], "ans": 2, "sol": "Slope = <span class=\"fq\"><span>47 − 62<\/span><span>10 − 4<\/span><\/span> = <span class=\"fq\"><span>−15<\/span><span>6<\/span><\/span> = −2.5.<br>Moving from <i>x<\/i> = 4 back to <i>x<\/i> = 0 is a change of −4 in <i>x<\/i>, so <i>y<\/i> changes by (−4)(−2.5) = 10.<br>62 + 10 = 72.<br>Answer: <b>72<\/b>", "hint": "Find the slope first. Then move along the line from <i>x<\/i> = 4 back to <i>x<\/i> = 0."}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "A teacher models the relationship between the number of practice problems <i>x<\/i> that a student completes and the student's quiz score <i>y<\/i> with the line of best fit <i>y<\/i> = 1.25<i>x<\/i> + 58. According to the line, what is the predicted quiz score for a student who completes 24 practice problems?", "ans": ["88"], "sol": "Substitute <i>x<\/i> = 24: <i>y<\/i> = 1.25(24) + 58.<br>1.25(24) = 30, and 30 + 58 = 88.<br>Answer: <b>88<\/b>", "hint": "Substitute the number of practice problems for <i>x<\/i>."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A line of best fit predicts that <i>y<\/i> = 52 when <i>x<\/i> = 6. The data set includes the point (6, 47). Which statement is true?", "opts": ["The point is below the line, and its residual is −5.", "The point is above the line, and its residual is 5.", "The point is below the line, and its residual is 5.", "The point is on the line, and its residual is 0."], "ans": 0, "sol": "Residual = actual − predicted = 47 − 52 = −5.<br>The actual value is less than the predicted value, so the point is below the line.<br>Answer: <b>The point is below the line, and its residual is −5.<\/b>", "hint": "Residual = actual − predicted. Is the actual <i>y<\/i>-value greater or less than 52?"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "For <i>x<\/i> = 0, 1, 2 and 3, which list of <i>y<\/i>-values is best modeled by an exponential function?", "opts": ["3, 6, 9, 12", "3, 5, 9, 15", "3, 6, 12, 24", "24, 18, 12, 6"], "ans": 2, "sol": "An exponential pattern has a constant ratio between consecutive values.<br>3, 6, 12, 24: each value is 2 times the one before it.<br>3, 6, 9, 12 and 24, 18, 12, 6 have constant differences (linear), and 3, 5, 9, 15 has neither.<br>Answer: <b>3, 6, 12, 24<\/b>", "hint": "Divide each <i>y<\/i>-value by the one before it. Which list has the same ratio every time?"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The table shows values of <i>x<\/i> and <i>y<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><tr><td><i>y<\/i><\/td><td>12<\/td><td>18<\/td><td>27<\/td><td>40.5<\/td><\/tr><\/table><\/div>Which equation best models the data?", "opts": ["<i>y<\/i> = 8(1.5)<sup><i>x<\/i><\/sup>", "<i>y<\/i> = 12(1.5)<sup><i>x<\/i><\/sup>", "<i>y<\/i> = 6<i>x<\/i> + 6", "<i>y<\/i> = 8(0.5)<sup><i>x<\/i><\/sup>"], "ans": 0, "sol": "Ratios: <span class=\"fq\"><span>18<\/span><span>12<\/span><\/span> = <span class=\"fq\"><span>27<\/span><span>18<\/span><\/span> = <span class=\"fq\"><span>40.5<\/span><span>27<\/span><\/span> = 1.5, so the model is exponential with <i>b<\/i> = 1.5.<br>Work back one step from <i>x<\/i> = 1 to <i>x<\/i> = 0: 12 ÷ 1.5 = 8, so <i>a<\/i> = 8.<br>Check: 8(1.5)<sup>4<\/sup> = 40.5 ✓.<br>Answer: <b><i>y<\/i> = 8(1.5)<sup><i>x<\/i><\/sup><\/b>", "hint": "Find the ratio between consecutive <i>y<\/i>-values. Then work backward one step to find <i>y<\/i> when <i>x<\/i> = 0."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "The scatterplot shows the age, in years, and the height, in meters, of 10 trees in a park.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Scatterplot of 10 points: (2, 1); (4, 2); (6, 4); (6, 3); (8, 5); (10, 6); (12, 7); (14, 8); (16, 10); (18, 9)\"><g class=\"fg-grid\" stroke=\"currentColo <circle r=\"3.5\" cx=\"279.7\" cy=\"56.5\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"77.3\" y=\"205\" text-anchor=\"middle\">2<\/text><text x=\"102.6\" y=\"205\" text-anchor=\"middle\">4<\/text><text x=\"127.9\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"153.2\" y=\"205\" text-anchor=\"middle\">8<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">10<\/text><text x=\"203.8\" y=\"205\" text-anchor=\"middle\">12<\/text><text x=\"229.1\" y=\"205\" text-anchor=\"middle\">14<\/text><text x=\"254.4\" y=\"205\" text-anchor=\"middle\">16<\/text><text x=\"279.7\" y=\"205\" text-anchor=\"middle\">18<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">20<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"160.33\" text-anchor=\"end\" dominant-baseline=\"middle\">2<\/text><text x=\"47\" y=\"130.67\" text-anchor=\"end\" dominant-baseline=\"middle\">4<\/text><text x=\"47\" y=\"101\" text-anchor=\"end\" dominant-baseline=\"middle\">6<\/text><text x=\"47\" y=\"71.33\" text-anchor=\"end\" dominant-baseline=\"middle\">8<\/text><text x=\"47\" y=\"41.67\" text-anchor=\"end\" dominant-baseline=\"middle\">10<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">12<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Age (years)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Height (meters)<\/text><\/g><\/svg>What is the height, in meters, of the oldest tree shown?", "opts": ["8", "9", "10", "18"], "ans": 1, "sol": "The oldest tree is the dot farthest to the right, at 18 years.<br>That dot is at a height of 9 meters. (The tallest tree, at 10 meters, is 16 years old.)<br>Answer: <b>9<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "The table shows the number of hours that each of four friends worked last week and the amount each one earned.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Friend<\/th><th>Hours worked<\/th><th>Amount earned (dollars)<\/th><\/tr><tr><td>Asha<\/td><td>12<\/td><td>180<\/td><\/tr><tr><td>Bilal<\/td><td>20<\/td><td>260<\/td><\/tr><tr><td>Chitra<\/td><td>8<\/td><td>136<\/td><\/tr><tr><td>Dev<\/td><td>15<\/td><td>240<\/td><\/tr><\/table><\/div>Which friend earned the most per hour?", "opts": ["Asha", "Bilal", "Chitra", "Dev"], "ans": 2, "sol": "Amount per hour: Asha 180 ÷ 12 = 15, Bilal 260 ÷ 20 = 13, Chitra 136 ÷ 8 = 17, Dev 240 ÷ 15 = 16 (dollars per hour).<br>The greatest is 17 dollars per hour.<br>Answer: <b>Chitra<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "For a large group of people, which pair of variables would most likely show no association?", "opts": ["A person's height and the last digit of the person's phone number", "The number of hours a phone is used and the charge left in its battery", "A child's age and the number of words the child knows", "The outdoor temperature and the number of cold drinks sold"], "ans": 0, "sol": "The last digit of a phone number is assigned with no connection to height, so there is no trend.<br>Each of the other pairs has a clear trend: battery charge falls with use (negative), and vocabulary grows with age and cold drink sales grow with temperature (positive).<br>Answer: <b>A person's height and the last digit of the person's phone number<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "The line of best fit for a data set is <i>y<\/i> = 2<i>x<\/i> + 10. Which of the following data points lies below the line of best fit?", "opts": ["(2, 15)", "(4, 19)", "(6, 22)", "(8, 25)"], "ans": 3, "sol": "Predicted values: <i>x<\/i> = 2 gives 14, <i>x<\/i> = 4 gives 18, <i>x<\/i> = 6 gives 22, <i>x<\/i> = 8 gives 26.<br>Only (8, 25) has an actual <i>y<\/i>-value less than the predicted value: 25 &lt; 26.<br>Answer: <b>(8, 25)<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "A biologist observes that the number of cells in a sample doubles every hour. Which type of model best describes the number of cells as a function of time?", "opts": ["Decreasing exponential", "Increasing linear", "Decreasing linear", "Increasing exponential"], "ans": 3, "sol": "Doubling means multiplying by 2 each hour: a constant ratio, not a constant difference.<br>A constant ratio greater than 1 gives exponential growth.<br>Answer: <b>Increasing exponential<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "The line of best fit <i>y<\/i> = −1.5<i>x<\/i> + 40 models the amount of fuel <i>y<\/i>, in liters, left in a generator's tank <i>x<\/i> hours after the generator is started. Which statement is supported by the model?", "opts": ["The amount of fuel in the tank decreases by about 1.5 liters each hour.", "The tank contains about 1.5 liters of fuel when the generator is started.", "The amount of fuel in the tank decreases by about 40 liters each hour.", "The tank is empty after about 40 hours."], "ans": 0, "sol": "The slope, −1.5, means the predicted amount of fuel decreases by 1.5 liters for each hour.<br>The <i>y<\/i>-intercept, 40, is the predicted amount at the start, and the tank would be empty when −1.5<i>x<\/i> + 40 = 0, at about 26.7 hours.<br>Answer: <b>The amount of fuel in the tank decreases by about 1.5 liters each hour.<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "The table shows four values of <i>x<\/i> and their corresponding values of <i>y<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>1<\/th><th>3<\/th><th>7<\/th><th>11<\/th><\/tr><tr><td><i>y<\/i><\/td><td>4<\/td><td>10<\/td><td>26<\/td><td>30<\/td><\/tr><\/table><\/div>What is the average rate of change of <i>y<\/i> with respect to <i>x<\/i> from <i>x<\/i> = 3 to <i>x<\/i> = 11?", "ans": ["2.5", "5/2"], "sol": "Change in <i>y<\/i>: 30 − 10 = 20. Change in <i>x<\/i>: 11 − 3 = 8.<br>Average rate of change = <span class=\"fq\"><span>20<\/span><span>8<\/span><\/span> = 2.5.<br>Answer: <b>2.5<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A scatterplot of the 6 data points in the table shows a strong negative linear association.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><tr><td><i>y<\/i><\/td><td>31<\/td><td>26<\/td><td>23<\/td><td>18<\/td><td>15<\/td><td>10<\/td><\/tr><\/table><\/div>Which equation could represent a line of best fit for the data?", "opts": ["<i>y<\/i> = −4<i>x<\/i> + 10", "<i>y<\/i> = −0.25<i>x<\/i> + 25", "<i>y<\/i> = −4<i>x<\/i> + 35", "<i>y<\/i> = 4<i>x<\/i> + 27"], "ans": 2, "sol": "A negative association needs a negative slope; <i>y<\/i> falls by about 4 for each increase of 1 in <i>x<\/i>.<br>Check <i>y<\/i> = −4<i>x<\/i> + 35: it gives 31, 27, 23, 19, 15, 11, each within 1 of the data.<br><i>y<\/i> = −4<i>x<\/i> + 10 has the right slope but lies far below every point, and <i>y<\/i> = −0.25<i>x<\/i> + 25 is much too flat.<br>Answer: <b><i>y<\/i> = −4<i>x<\/i> + 35<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "For children between the ages of 2 and 10 at a clinic, the line of best fit <i>y<\/i> = 6.2<i>x<\/i> + 77 estimates the height <i>y<\/i>, in centimeters, of a child who is <i>x<\/i> years old. According to the line, how many centimeters greater is the predicted height of a 9-year-old than that of a 4-year-old?", "opts": ["5", "6.2", "24.8", "31"], "ans": 3, "sol": "The slope says the predicted height increases by 6.2 centimeters for each year of age.<br>From age 4 to age 9 is 5 years: 5 × 6.2 = 31.<br>Answer: <b>31<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The scatterplot shows 10 data points and a line of best fit.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Scatterplot of 10 points: (1, 4); (2, 3); (3, 6); (4, 5); (5, 8); (6, 7); (7, 10); (8, 9); (9, 12); (10, 12). Line of best fit through (0, 2) and (10, 12)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stro
