78.5\" cy=\"88.29\"/><circle r=\"3.5\" cx=\"203.8\" cy=\"101\"/><circle r=\"3.5\" cx=\"229.1\" cy=\"62.86\"/><circle r=\"3.5\" cx=\"254.4\" cy=\"75.57\"/><circle r=\"3.5\" cx=\"279.7\" cy=\"37.43\"/><circle r=\"3.5\" cx=\"305\" cy=\"37.43\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"77.3\" y=\"205\" text-anchor=\"middle\">1<\/text><text x=\"102.6\" y=\"205\" text-anchor=\"middle\">2<\/text><text x=\"127.9\" y=\"205\" text-anchor=\"middle\">3<\/text><text x=\"153.2\" y=\"205\" text-anchor=\"middle\">4<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">5<\/text><text x=\"203.8\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"229.1\" y=\"205\" text-anchor=\"middle\">7<\/text><text x=\"254.4\" y=\"205\" text-anchor=\"middle\">8<\/text><text x=\"279.7\" y=\"205\" text-anchor=\"middle\">9<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">10<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"164.57\" text-anchor=\"end\" dominant-baseline=\"middle\">2<\/text><text x=\"47\" y=\"139.14\" text-anchor=\"end\" dominant-baseline=\"middle\">4<\/text><text x=\"47\" y=\"113.71\" text-anchor=\"end\" dominant-baseline=\"middle\">6<\/text><text x=\"47\" y=\"88.29\" text-anchor=\"end\" dominant-baseline=\"middle\">8<\/text><text x=\"47\" y=\"62.86\" text-anchor=\"end\" dominant-baseline=\"middle\">10<\/text><text x=\"47\" y=\"37.43\" text-anchor=\"end\" dominant-baseline=\"middle\">12<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">14<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">x<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">y<\/text><\/g><\/svg>For how many of the data points is the actual <i>y<\/i>-value greater than the <i>y<\/i>-value predicted by the line of best fit?", "opts": ["4", "5", "6", "10"], "ans": 1, "sol": "The line passes through (0, 2) and (10, 12), so it predicts <i>y<\/i> = <i>x<\/i> + 2.<br>Points above the line: (1, 4), (3, 6), (5, 8), (7, 10) and (9, 12). The point (10, 12) is on the line.<br>Answer: <b>5<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The table shows a relationship between <i>x<\/i> and <i>y<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>0<\/th><th>2<\/th><th>4<\/th><th>6<\/th><\/tr><tr><td><i>y<\/i><\/td><td>40<\/td><td>52<\/td><td>64<\/td><td>76<\/td><\/tr><\/table><\/div>Which equation could model the relationship?", "opts": ["<i>y<\/i> = 40 + 6<i>x<\/i>", "<i>y<\/i> = 40 + 12<i>x<\/i>", "<i>y<\/i> = 40(1.3)<sup><i>x<\/i><\/sup>", "<i>y<\/i> = 40(1.15)<sup><i>x<\/i><\/sup>"], "ans": 0, "sol": "Each step of 2 in <i>x<\/i> adds 12 to <i>y<\/i>: a constant difference, so the model is linear.<br>Slope = <span class=\"fq\"><span>12<\/span><span>2<\/span><\/span> = 6, and <i>y<\/i> = 40 when <i>x<\/i> = 0.<br>Check: 40 + 6(6) = 76 ✓.<br>Answer: <b><i>y<\/i> = 40 + 6<i>x<\/i><\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The table shows the number of hours of sleep the night before a test and the test score for each of 8 students.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Student<\/th><th>Hours of sleep<\/th><th>Test score<\/th><\/tr><tr><td>P<\/td><td>6<\/td><td>72<\/td><\/tr><tr><td>Q<\/td><td>7<\/td><td>80<\/td><\/tr><tr><td>R<\/td><td>8<\/td><td>88<\/td><\/tr><tr><td>S<\/td><td>8<\/td><td>84<\/td><\/tr><tr><td>T<\/td><td>9<\/td><td>91<\/td><\/tr><tr><td>U<\/td><td>7.5<\/td><td>86<\/td><\/tr><tr><td>V<\/td><td>9<\/td><td>85<\/td><\/tr><tr><td>W<\/td><td>10<\/td><td>93<\/td><\/tr><\/table><\/div>Of the students who slept at least 8 hours, what percent scored above 85?", "opts": ["37.5%", "60%", "75%", "80%"], "ans": 1, "sol": "Students who slept at least 8 hours: R, S, T, V and W, which is 5 students.<br>Of these, R (88), T (91) and W (93) scored above 85. V scored exactly 85.<br><span class=\"fq\"><span>3<\/span><span>5<\/span><\/span> = 60%.<br>Answer: <b>60%<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "The scatterplot shows the number of followers, in thousands, of a new social media account <i>x<\/i> weeks after it was created.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Scatterplot of 8 points: (0, 4); (1, 4); (1, 8); (2, 8); (3, 12); (4, 20); (5, 36); (6, 60)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\"/><line x1=\"94.17\" y1=\"12\" x2=\"94.17\" y2=\"190\"/><line x1=\"136.33\" y1=\"12\" x2=\"136.33\" y2=\"190\"/><line x1=\"178.5\" y1=\"12\" x2=\"178.5\" y2=\"190\"/><line x1=\"220.67\" y1=\"12\" x2=\"220.67\" y2=\"190\"/><line x1=\"262.83\" y1=\"12\" x2=\"262.83\" y2=\"190\"/><line x1=\"305\" y1=\"12\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"178.88\" x2=\"305\" y2=\"178.88\"/><line x1=\"52\" y1=\"167.75\" x2=\"305\" y2=\"167.75\"/><line x1=\"52\" y1=\"156.62\" x2=\"305\" y2=\"156.62\"/><line x1=\"52\" y1=\"145.5\" x2=\"305\" y2=\"145.5\"/><line x1=\"52\" y1=\"134.38\" x2=\"305\" y2=\"134.38\"/><line x1=\"52\" y1=\"123.25\" x2=\"305\" y2=\"123.25\"/><line x1=\"52\" y1=\"112.12\" x2=\"305\" y2=\"112.12\"/><line x1=\"52\" y1=\"101\" x2=\"305\" y2=\"101\"/><line x1=\"52\" y1=\"89.88\" x2=\"305\" y2=\"89.88\"/><line x1=\"52\" y1=\"78.75\" x2=\"305\" y2=\"78.75\"/><line x1=\"52\" y1=\"67.62\" x2=\"305\" y2=\"67.62\"/><line x1=\"52\" y1=\"56.5\" x2=\"305\" y2=\"56.5\"/><line x1=\"52\" y1=\"45.38\" x2=\"305\" y2=\"45.38\"/><line x1=\"52\" y1=\"34.25\" x2=\"305\" y2=\"34.25\"/><line x1=\"52\" y1=\"23.12\" x2=\"305\" y2=\"23.12\"/><line x1=\"52\" y1=\"12\" x2=\"305\" y2=\"12\"/><\/g><line class=\"fg-axis\" x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"52\" cy=\"178.88\"/><circle r=\"3.5\" cx=\"94.17\" cy=\"178.88\"/><circle r=\"3.5\" cx=\"94.17\" cy=\"167.75\"/><circle r=\"3.5\" cx=\"136.33\" cy=\"167.75\"/><circle r=\"3.5\" cx=\"178.5\" cy=\"156.62\"/><circle r=\"3.5\" cx=\"220.67\" cy=\"134.38\"/><circle r=\"3.5\" cx=\"262.83\" cy=\"89.88\"/><circle r=\"3.5\" cx=\"305\" cy=\"23.12\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"52\" y=\"205\" text-anchor=\"middle\">0<\/text><text x=\"94.17\" y=\"205\" text-anchor=\"middle\">1<\/text><text x=\"136.33\" y=\"205\" text-anchor=\"middle\">2<\/text><text x=\"178.5\" y=\"205\" text-anchor=\"middle\">3<\/text><text x=\"220.67\" y=\"205\" text-anchor=\"middle\">4<\/text><text x=\"262.83\" y=\"205\" text-anchor=\"middle\">5<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">6<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"145.5\" text-anchor=\"end\" dominant-baseline=\"middle\">16<\/text><text x=\"47\" y=\"101\" text-anchor=\"end\" dominant-baseline=\"middle\">32<\/text><text x=\"47\" y=\"56.5\" text-anchor=\"end\" dominant-baseline=\"middle\">48<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">64<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Time since account was created (weeks)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Followers (thousands)<\/text><\/g><\/svg>Which choice best describes the association between time and the number of followers?", "opts": ["Positive linear association", "Negative nonlinear association", "Positive nonlinear association", "No association"], "ans": 2, "sol": "As time increases, the number of followers increases, so the association is positive.<br>From week 2 on, the weekly increases keep getting larger (4, 8, 16 and 24 thousand), so the points curve upward instead of following a line.<br>Answer: <b>Positive nonlinear association<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "In two cities, the estimated monthly cost <i>y<\/i>, in dollars, of a mobile phone plan that includes <i>x<\/i> gigabytes of data is modeled by a line of best fit. For city A the line is <i>y<\/i> = 1.2<i>x<\/i> + 30, and for city B it is <i>y<\/i> = 0.9<i>x<\/i> + 45. Which statement is true?", "opts": ["For each additional gigabyte, the estimated cost increases more in city A, and city B has the greater estimated cost for a plan with 0 gigabytes.", "For each additional gigabyte, the estimated cost increases more in city B, and city B has the greater estimated cost for a plan with 0 gigabytes.", "For each additional gigabyte, the estimated cost increases more in city A, and city A has the greater estimated cost for a plan with 0 gigabytes.", "For each additional gigabyte, the estimated cost increases more in city B, and city A has the greater estimated cost for a plan with 0 gigabytes."], "ans": 0, "sol": "The slopes give the increase in cost per additional gigabyte: 1.2 in city A and 0.9 in city B, so the increase is greater in city A.<br>The <i>y<\/i>-intercepts give the estimated cost for 0 gigabytes: 30 in city A and 45 in city B, so city B is greater.<br>Answer: <b>For each additional gigabyte, the estimated cost increases more in city A, and city B has the greater estimated cost for a plan with 0 gigabytes.<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "The line of best fit for a data set is <i>y<\/i> = 3.5<i>x<\/i> + 20. According to the line, what value of <i>x<\/i> corresponds to a predicted <i>y<\/i>-value of 76?", "ans": ["16"], "sol": "Substitute <i>y<\/i> = 76: 76 = 3.5<i>x<\/i> + 20.<br>3.5<i>x<\/i> = 56, so <i>x<\/i> = 16.<br>Answer: <b>16<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "The table shows values of <i>x<\/i> and <i>y<\/i> that follow an exponential relationship.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>0<\/th><th>1<\/th><th>2<\/th><\/tr><tr><td><i>y<\/i><\/td><td>16<\/td><td>24<\/td><td>36<\/td><\/tr><\/table><\/div>What is the value of <i>y<\/i> when <i>x<\/i> = 4?", "ans": ["81"], "sol": "Ratio: <span class=\"fq\"><span>24<\/span><span>16<\/span><\/span> = <span class=\"fq\"><span>36<\/span><span>24<\/span><\/span> = 1.5, so each step multiplies <i>y<\/i> by 1.5.<br><i>x<\/i> = 3: 36 × 1.5 = 54. <i>x<\/i> = 4: 54 × 1.5 = 81.<br>Answer: <b>81<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "The table shows 7 data points.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><\/tr><tr><td><i>y<\/i><\/td><td>4<\/td><td>6<\/td><td>9<\/td><td>22<\/td><td>13<\/td><td>15<\/td><td>18<\/td><\/tr><\/table><\/div>If the point (4, 22) is removed from the data, which statement best describes the change in the association between <i>x<\/i> and <i>y<\/i>?", "opts": ["The association becomes weaker.", "The association becomes stronger and remains positive.", "The association changes from positive to negative.", "The association does not change."], "ans": 1, "sol": "Without (4, 22), the other points rise steadily: 4, 6, 9, 13, 15, 18, close to a straight line.<br>The point (4, 22) is far above that pattern, so it weakens the association. Removing it makes the positive association stronger.<br>Answer: <b>The association becomes stronger and remains positive.<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "The line of best fit for a data set is <i>y<\/i> = −0.5<i>x<\/i> + 42. The residual (actual <i>y<\/i>-value minus predicted <i>y<\/i>-value) for the data point with <i>x<\/i> = 18 is −3. What is the <i>y<\/i>-value of this data point?", "ans": ["30"], "sol": "Predicted value: −0.5(18) + 42 = 33.<br>actual − 33 = −3, so actual = 30.<br>Answer: <b>30<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "The value of a machine decreases by the same percent each year. Its value was $1,250 at the start of one year and $800 two years later. By what percent does the value decrease each year? (Disregard the % sign when entering your answer.)", "ans": ["20"], "sol": "A constant percent decrease is exponential: 1,250<i>b<\/i><sup>2<\/sup> = 800.<br><i>b<\/i><sup>2<\/sup> = 0.64, so <i>b<\/i> = 0.8.<br>A factor of 0.8 is a decrease of 20% each year.<br>Answer: <b>20<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The line of best fit <i>y<\/i> = 0.15<i>x<\/i> + 2.5 models the depth <i>y<\/i>, in centimeters, of snow on the ground <i>x<\/i> minutes after a snowfall began. According to the model, what is the predicted increase in the depth of the snow each hour?", "opts": ["0.15 centimeter", "2.5 centimeters", "9 centimeters", "11.5 centimeters"], "ans": 2, "sol": "The slope, 0.15, is the predicted increase per minute.<br>One hour is 60 minutes: 0.15 × 60 = 9.<br>Answer: <b>9 centimeters<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "The line graph shows the temperature of a liquid in a laboratory experiment, measured every 2 minutes for 12 minutes.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line graph through (0, 20); (2, 26); (4, 30); (6, 28); (8, 34); (10, 32); (12, 36)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"12\" x2=\"52\" y2=\"190\"/><line x1=\"94.17\" y1=\"12\" x2=\"94.17\" y2=\"190\"/><line x1=\"136.33\" y1=\"12\" x2=\"136.33\" y2=\"190\"/><line x1=\"178.5\" y1=\"12\" x2=\"178.5\" y2=\"190\"/><line x1=\"220.67\" y1=\"12\" x2=\"220.67\" y2=\"190\"/><line x1=\"262.83\" y1=\"12\" x2=\"262.83\" y2=\"190\"/><line x1=\"305\" y1=\"12\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"190\" x2=\"305\" y2=\"190\"/><line x1=\"52\" y1=\"181.1\" x2=\"305\" y2=\"181.1\"/><line x1=\"52\" y1=\"172.2\" x2=\"305\" y2=\"172.2\"/><line x1=\"52\" y1=\"163.3\" x2=\"305\" y2=\"163.3\"/><line x1=\"52\" y1=\"154.4\" x2=\"305\" y2=\"1 le\">10<\/text><text x=\"305\" y=\"205\" text-anchor=\"middle\">12<\/text><text x=\"47\" y=\"190\" text-anchor=\"end\" dominant-baseline=\"middle\">0<\/text><text x=\"47\" y=\"145.5\" text-anchor=\"end\" dominant-baseline=\"middle\">10<\/text><text x=\"47\" y=\"101\" text-anchor=\"end\" dominant-baseline=\"middle\">20<\/text><text x=\"47\" y=\"56.5\" text-anchor=\"end\" dominant-baseline=\"middle\">30<\/text><text x=\"47\" y=\"12\" text-anchor=\"end\" dominant-baseline=\"middle\">40<\/text><text x=\"178.5\" y=\"228\" text-anchor=\"middle\">Time (minutes)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Temperature (°C)<\/text><\/g><\/svg>In how many of the 2-minute intervals did the temperature decrease?", "opts": ["1", "2", "4", "6"], "ans": 1, "sol": "Temperatures: 20, 26, 30, 28, 34, 32, 36.<br>Decreases: 30 to 28 (minutes 4 to 6) and 34 to 32 (minutes 8 to 10).<br>Answer: <b>2<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A scatterplot of data for 50 houses in a region shows a strong negative association between the distance <i>x<\/i> from a house to the city center and the price <i>y<\/i> of the house. Which statement must be true?", "opts": ["Every house that is farther from the city center costs less than every house that is closer.", "Moving a house farther from the city center causes its price to decrease.", "The line of best fit for the data has a positive slope.", "Houses that are farther from the city center tend to have lower prices."], "ans": 3, "sol": "A negative association means that as distance increases, price tends to decrease.<br>It is a tendency, so not every farther house costs less, and a scatterplot alone cannot show cause and effect. A negative association has a line of best fit with a negative slope.<br>Answer: <b>Houses that are farther from the city center tend to have lower prices.<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The scatterplot shows the age <i>x<\/i>, in months, text-anchor=\"middle\">Age of laptop (months)<\/text><text x=\"14\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-90 14 101)\">Battery life (hours)<\/text><\/g><\/svg>Which choice is the best interpretation of the <i>y<\/i>-intercept of the line of best fit?", "opts": ["The estimated battery life of a new laptop is 12 hours.", "The estimated battery life decreases by 12 hours each month.", "The estimated battery life of a new laptop is 6 hours.", "The battery of a laptop is estimated to stop working after 12 months."], "ans": 0, "sol": "The line crosses the <i>y<\/i>-axis at (0, 12).<br>At <i>x<\/i> = 0 months the laptop is new, so the model estimates that a new laptop has a battery life of 12 hours.<br>Answer: <b>The estimated battery life of a new laptop is 12 hours.<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A researcher measured the reaction times of 40 adults whose ages ranged from 20 to 60 years and found a line of best fit for reaction time as a function of age. For which age would a prediction from the line be most reliable?", "opts": ["5 years", "45 years", "75 years", "90 years"], "ans": 1, "sol": "Predictions are most reliable for ages inside the range of the data, 20 to 60 years.<br>Only 45 years is inside that range; the others require extending the trend beyond the data.<br>Answer: <b>45 years<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Which situation is best modeled by a decreasing exponential function?", "opts": ["A water tank loses 15 liters of water each hour.", "A town's population grows by 2% each year.", "A savings account grows by $50 each month.", "A car's value decreases by 12% each year."], "ans": 3, "sol": "A decreasing exponential function multiplies by the same factor less than 1 at each step.<br>Losing 12% each year multiplies the value by 0.88 each year. Losing 15 liters each hour is a constant difference (linear), and the other two situations increase.<br>Answer: <b>A car's value decreases by 12% each year.<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "The table shows the length and the width, in centimeters, of 6 rectangular tiles.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Tile<\/th><th>Length (cm)<\/th><th>Width (cm)<\/th><\/tr><tr><td>A<\/td><td>12<\/td><td>5<\/td><\/tr><tr><td>B<\/td><td>15<\/td><td>8<\/td><\/tr><tr><td>C<\/td><td>9<\/td><td>4<\/td><\/tr><tr><td>D<\/td><td>20<\/td><td>10<\/td><\/tr><tr><td>E<\/td><td>14<\/td><td>6<\/td><\/tr><tr><td>F<\/td><td>11<\/td><td>6<\/td><\/tr><\/table><\/div>For how many of the tiles is the length more than twice the width?", "ans": ["3"], "sol": "Twice each width: 10, 16, 8, 20, 12, 12.<br>Length greater: A (12 &gt; 10), C (9 &gt; 8), E (14 &gt; 12). Tile D is exactly twice, which is not more.<br>Answer: <b>3<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "The table shows five values of <i>x<\/i> and their corresponding values of <i>y<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>0<\/th><th>2<\/th><th>5<\/th><th>6<\/th><th>10<\/th><\/tr><tr><td><i>y<\/i><\/td><td>0<\/td><td>36<\/td><td>81<\/td><td>101<\/td><td>165<\/td><\/tr><\/table><\/div>For which pair of consecutive <i>x<\/i>-values in the table is the average rate of change of <i>y<\/i> with respect to <i>x<\/i> the greatest?", "opts": ["<i>x<\/i> = 0 and <i>x<\/i> = 2", "<i>x<\/i> = 2 and <i>x<\/i> = 5", "<i>x<\/i> = 5 and <i>x<\/i> = 6", "<i>x<\/i> = 6 and <i>x<\/i> = 10"], "ans": 2, "sol": "Average rate of change = (change in <i>y<\/i>) ÷ (change in <i>x<\/i>).<br>0 to 2: <span class=\"fq\"><span>36<\/span><span>2<\/span><\/span> = 18. 2 to 5: <span class=\"fq\"><span>45<\/span><span>3<\/span><\/span> = 15. 5 to 6: <span class=\"fq\"><span>20<\/span><span>1<\/span><\/span> = 20. 6 to 10: <span class=\"fq\"><span>64<\/span><span>4<\/span><\/span> = 16.<br>The greatest is 20, even though the change in <i>y<\/i> from 6 to 10 is larger.<br>Answer: <b><i>x<\/i> = 5 and <i>x<\/i> = 6<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "The table shows 6 data points that have a strong positive linear association.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><tr><td><i>y<\/i><\/td><td>5<\/td><td>8<\/td><td>10<\/td><td>13<\/td><td>15<\/td><td>18<\/td><\/tr><\/table><\/div>A seventh data point will be added. Adding which point would most weaken the association between <i>x<\/i> and <i>y<\/i>?", "opts": ["(0, 3)", "(7, 4)", "(7, 20)", "(8, 23)"], "ans": 1, "sol": "The data rise by about 2.6 for each increase of 1 in <i>x<\/i>, so the trend predicts about 2.5 at <i>x<\/i> = 0, 20.7 at <i>x<\/i> = 7 and 23.3 at <i>x<\/i> = 8.<br>(0, 3), (7, 20) and (8, 23) all lie close to the trend. (7, 4) lies far below it, so it would weaken the association the most.<br>Answer: <b>(7, 4)<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Data set A has the line of best fit <i>y<\/i> = 1.6<i>x<\/i> + 22, and data set B has the line of best fit <i>y<\/i> = 2.4<i>x<\/i> + 10. For what value of <i>x<\/i> do the two lines predict the same value of <i>y<\/i>?", "opts": ["3", "5", "15", "40"], "ans": 2, "sol": "Set the predictions equal: 1.6<i>x<\/i> + 22 = 2.4<i>x<\/i> + 10.<br>12 = 0.8<i>x<\/i>, so <i>x<\/i> = 15.<br>Check: 1.6(15) + 22 = 46 and 2.4(15) + 10 = 46 ✓.<br>Answer: <b>15<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A line of best fit for a data set has the equation <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i>, where <i>m<\/i> and <i>b<\/i> are constants. According to the line, each increase of 4 in <i>x<\/i> corresponds to an increase of 10 in the predicted value of <i>y<\/i>, and the predicted value of <i>y<\/i> when <i>x<\/i> = 6 is 40. What is the value of <i>b<\/i>?", "ans": ["25"], "sol": "Slope: <i>m<\/i> = <span class=\"fq\"><span>10<\/span><span>4<\/span><\/span> = 2.5.<br>40 = 2.5(6) + <i>b<\/i> = 15 + <i>b<\/i>.<br><i>b<\/i> = 25.<br>Answer: <b>25<\/b>"}, {"lo": /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

function wireLearn(){

  document.querySelectorAll('.ex').forEach(function(ex){

      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }

  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
