  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

<script>
(function(){
"use strict";
var S = {"id": "PSDA-2.1", "unit": "Problem-Solving and Data Analysis", "topic": "Data analysis", "title": "Center and spread of one-variable data", "intro": "A one-variable data set is a list of measurements of a single quantity, such as test scores or daily rainfall. This sheet covers the numbers that summarize such a list: the mean, median and mode describe its center, while the range and the standard deviation describe its spread. The DSAT asks you to compute these values, to work backward from a mean, to combine groups, and to predict how the summaries change when the data change.", "los": [{"id": "LO1", "text": "Determine the mean, median, mode and range of a data set given as a list or a graph."}, {"id": "LO2", "text": "Use the relationship sum = mean × number of values to find a missing value, a total or an unknown in a data set."}, {"id": "LO3", "text": "Determine a weighted mean, including the mean of two or more combined groups."}, {"id": "LO4", "text": "Determine how adding, removing or changing a value, including an outlier, affects the mean, median and range."}, {"id": "LO5", "text": "Compare standard deviations qualitatively and choose the mean or the median as the better measure of center for skewed data."}], "notes": [{"lo": "LO1", "h": "Four summary numbers", "html": "<p>A data set is a list of numbers that measure the same thing, such as the heights of the players on a team. Instead of reading every value, we describe the list with a few summary numbers. Three of them measure the <b>center<\/b> of the data, and one measures the <b>spread<\/b>.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Measure<\/th><th>What it is<\/th><th>For 3, 5, 5, 9, 13<\/th><\/tr><tr><td>Mean<\/td><td>sum of the values ÷ number of values<\/td><td>35 ÷ 5 = 7<\/td><\/tr><tr><td>Median<\/td><td>middle value after sorting<\/td><td>5<\/td><\/tr><tr><td>Mode<\/td><td>value that occurs most often<\/td><td>5<\/td><\/tr><tr><td>Range<\/td><td>greatest value − least value<\/td><td>13 − 3 = 10<\/td><\/tr><\/table><\/div><div class=\"rule\">Mean, median and mode describe the center. Range describes the spread.<\/div><p>A data set can have two or more modes (if several values tie for most frequent), or no mode at all (if every value occurs once). The mean does not have to be one of the data values, and it often is not a whole number.<\/p>"}, {"lo": "LO1", "h": "Finding the median", "html": "<p>The median is the middle of the <b>sorted<\/b> list, so always put the values in order first.<\/p><ul><li><b>Odd<\/b> number of values: the median is the single middle value. With <i>n<\/i> values it sits in position <span class=\"fq\"><span><i>n<\/i> + 1<\/span><span>2<\/span><\/span>.<\/li><li><b>Even<\/b> number of values: there are two middle values, and the median is their mean.<\/li><\/ul><div class=\"eqs\">14, 9, 21, 12, 17, 9 &nbsp;→&nbsp; 9, 9, 12, 14, 17, 21<br>median = <span class=\"fq\"><span>12 + 14<\/span><span>2<\/span><\/span> = 13<\/div><div class=\"rule\">Sort first. For an even count, average the two middle values.<\/div><p>Because only the middle position matters, the median often stays put when an end value changes. In the list 2, 4, 7, 10, <i>x<\/i> with <i>x<\/i> &gt; 10, the median is 7 no matter how large <i>x<\/i> is.<\/p><div class=\"tip\"><b>Desmos tip:<\/b> type a list such as L = [14, 9, 21, 12, 17, 9], then mean(L), median(L), min(L) and max(L). Desmos sorts the list for you, which removes the most common median error.<\/div>"}, {"lo": "LO2", "h": "The sum is the key", "html": "<p>The definition of the mean can be turned around. If you know the mean and the number of values, you know the total.<\/p><div class=\"eqs\">mean = <span class=\"fq\"><span>sum<\/span><span>number of values<\/span><\/span> &nbsp;&nbsp;⇔&nbsp;&nbsp; sum = mean × number of values<\/div><p><b>Missing value.<\/b> The mean of 4 test scores is 80, and three of them are 72, 85 and 79. The four scores must total 4 × 80 = 320, and the three known scores total 236, so the fourth score is 320 − 236 = 84.<\/p><p><b>New value.<\/b> If the mean of 5 values is 10 and a sixth value makes the mean 11, the totals are 50 and 66, so the new value is 66 − 50 = 16.<\/p><div class=\"rule\">Convert every mean into a total, do the arithmetic with totals, and convert back at the end.<\/div><div class=\"tip\"><b>DSAT tip:<\/b> when the values contain a variable, such as a mean of <i>x<\/i>, 2<i>x<\/i> and 9, write sum = mean × count as an equation and solve it.<\/div>"}, {"lo": "LO3", "h": "Weighted means and combined groups", "html": "<p>Suppose 10 students have a mean score of 70 and 30 students have a mean score of 90. The mean of all 40 students is <b>not<\/b> 80, because the second group is larger. Use totals:<\/p><div class=\"eqs\">combined mean = <span class=\"fq\"><span>10(70) + 30(90)<\/span><span>10 + 30<\/span><\/span> = <span class=\"fq\"><span>3,400<\/span><span>40<\/span><\/span> = 85<\/div><div class=\"rule\">Combined mean = <span class=\"fq\"><span>(size × mean) + (size × mean)<\/span><span>total size<\/span><\/span>. Multiply each group mean by its group size before adding.<\/div><p>The combined mean always lies between the two group means, and it is closer to the mean of the larger group. Only when the groups are the same size is it the simple average of the two means.<\/p><p>Weights can also be given as percents. If tests count for 70% of a grade and projects for 30%, a test average of 80 and a project average of 90 give 0.7(80) + 0.3(90) = 83.<\/p>"}, {"lo": "LO4", "h": "Adding, removing or changing a value", "html": "<p>To predict how the summaries change, think about what each one depends on.<\/p><ul><li><b>Mean<\/b> depends on every value. An added value that is greater than the mean pulls the mean up, a value less than the mean pulls it down, and a value equal to the mean leaves it unchanged. Changing one value by <i>d<\/i> changes the sum by <i>d<\/i> and the mean by <span class=\"fq\"><span><i>d<\/i><\/span><span><i>n<\/i><\/span><\/span>.<\/li><li><b>Median<\/b> depends only on the middle position. Changing an end value usually leaves it unchanged, but adding or removing a value shifts the middle position.<\/li><li><b>Range<\/b> depends only on the least and greatest values.<\/li><\/ul><div class=\"rule\">Before calculating, ask: does the change affect the total, the middle position, or the extremes?<\/div><p>Example: in 4, 6, 9, 11, 15 (mean 9), changing 15 to 25 raises the sum by 10, so the mean rises by <span class=\"fq\"><span>10<\/span><span>5<\/span><\/span> = 2. The median stays 9, and the range grows from 11 to 21.<\/p>"}, {"lo": "LO4", "h": "The effect of an outlier", "html": "<p>An <b>outlier<\/b> is a value much greater or much less than the rest of the data. It has a large effect on the mean and the range, but very little effect on the median.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Data<\/th><th>Mean<\/th><th>Median<\/th><th>Range<\/th><\/tr><tr><td>12, 14, 15, 15, 19<\/td><td>15<\/td><td>15<\/td><td>7<\/td><\/tr><tr><td>12, 14, 15, 15, 19, 63<\/td><td>23<\/td><td>15<\/td><td>51<\/td><\/tr><\/table><\/div><p>Adding the single value 63 raises the mean by 8 and the range by 44, but the median does not move, because 15 is still in the middle.<\/p><div class=\"rule\">An outlier pulls the mean toward itself and stretches the range; the median is resistant to outliers.<\/div><p>Removing an outlier works the same way in reverse: the mean moves back toward the bulk of the data, and the range shrinks.<\/p>"}, {"lo": "LO5", "h": "Standard deviation: typical distance from the mean", "html": "<p>The <b>standard deviation<\/b> (SD) measures how far the values typically are from the mean. The DSAT asks you to compare standard deviations, not to compute them, so look at how tightly the data cluster around the center.<\/p><svg class=\"fig\" viewBox=\"0 0 320 152\" role=\"img\" aria-label=\"Two dot plots on number lines from 0 to 12. Set A has 10 dots: 1 at 4, 2 at 5, 4 at 6, 2 at 7, 1 at 8. Set B has 10 dots: 1 at 1, 1 at 2, 1 at 3, 1 at 5, 2 at 6, 1 at 7, 1 at 9, 1 at 10, 1 at 11. Both sets have mean 6.\"><line class=\"fg-axis\" x1=\"52\" y1=\"52\" x2=\"308\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"58.0\" y1=\"52\" x2=\"58.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"78.3\" y1=\"52\" x2=\"78.3\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"98.7\" y1=\"52\" x2=\"98.7\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"119.0\" y1=\"52\" x2=\"119.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"139.3\" y1=\"52\" x2=\"139.3\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"159.7\" y1=\"52\" x2=\"159.7\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"180.0\" y1=\"52\" x2=\"180.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"200.3\" y1=\"52\" x2=\"200.3\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"220.7\" y1=\"52\" x2=\"220.7\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"241.0\" y1=\"52\" x2=\"241.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"261.3\" y1=\"52\" x2=\"261.3\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"281.7\" y1=\"52\" x2=\"281.7\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"302.0\" y1=\"52\" x2=\"302.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"112\" x2=\"308\" y2=\"112\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"58.0\" y1=\"112\" x2=\"58.0\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"78.3\" y1=\"112\" x2=\"78.3\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"98.7\" y1=\"112\" x2=\"98.7\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"119.0\" y1=\"112\" x2=\"119.0\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"139.3\" y1=\"112\" x2=\"139.3\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"159.7\" y1=\"112\" x2=\"159.7\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"180.0\" y1=\"112\" x2=\"180.0\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"200.3\" y1=\"112\" x2=\"200.3\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"220.7\" y1=\"112\" x2=\"220.7\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"241.0\" y1=\"112\" x2=\"241.0\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"261.3\" y1=\"112\" x2=\"261.3\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"281.7\" y1=\"112\" x2=\"281.7\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"302.0\" y1=\"112\" x2=\"302.0\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"139.3\" cy=\"45\" r=\"3.5\"/><circle cx=\"159.7\" cy=\"45\" r=\"3.5\"/><circle cx=\"159.7\" cy=\"36\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"45\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"36\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"27\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"18\" r=\"3.5\"/><circle cx=\"200.3\" cy=\"45\" r=\"3.5\"/><circle cx=\"200.3\" cy=\"36\" r=\"3.5\"/><circle cx=\"220.7\" cy=\"45\" r=\"3.5\"/><circle cx=\"78.3\" cy=\"105\" r=\"3.5\"/><circle cx=\"98.7\" cy=\"105\" r=\"3.5\"/><circle cx=\"119.0\" cy=\"105\" r=\"3.5\"/><circle cx=\"159.7\" cy=\"105\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"105\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"96\" r=\"3.5\"/><circle cx=\"200.3\" cy=\"105\" r=\"3.5\"/><circle cx=\"241.0\" cy=\"105\" r=\"3.5\"/><circle cx=\"261.3\" cy=\"105\" r=\"3.5\"/><circle cx=\"281.7\" cy=\"105\" r=\"3.5\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"58.0\" y=\"67\" text-anchor=\"middle\">0<\/text><text x=\"98.7\" y=\"67\" text-anchor=\"middle\">2<\/text><text x=\"139.3\" y=\"67\" text-anchor=\"middle\">4<\/text><text x=\"180.0\" y=\"67\" text-anchor=\"middle\">6<\/text><text x=\"220.7\" y=\"67\" text-anchor=\"middle\">8<\/text><text x=\"261.3\" y=\"67\" text-anchor=\"middle\">10<\/text><text x=\"302.0\" y=\"67\" text-anchor=\"middle\">12<\/text><text x=\"4\" y=\"48\" font-weight=\"bold\">Set A<\/text><text x=\"58.0\" y=\"127\" text-anchor=\"middle\">0<\/text><text x=\"98.7\" y=\"127\" text-anchor=\"middle\">2<\/text><text x=\"139.3\" y=\"127\" text-anchor=\"middle\">4<\/text><text x=\"180.0\" y=\"127\" text-anchor=\"middle\">6<\/text><text x=\"220.7\" y=\"127\" text-anchor=\"middle\">8<\/text><text x=\"261.3\" y=\"127\" text-anchor=\"middle\">10<\/text><text x=\"302.0\" y=\"127\" text-anchor=\"middle\">12<\/text><text x=\"4\" y=\"108\" font-weight=\"bold\">Set B<\/text><text x=\"180.0\" y=\"146\" text-anchor=\"middle\">Value<\/text><\/g><\/svg><p>Both sets above have mean 6 and 10 values, but the values in Set B are generally farther from 6, so Set B has the greater standard deviation.<\/p><div class=\"rule\">More values far from the mean means a greater standard deviation. Values bunched near the mean means a smaller one.<\/div><ul><li>Adding the same number to every value shifts the data but does not change the SD.<\/li><li>Removing an outlier, or adding a value equal to the mean, makes the SD smaller.<\/li><li>Two sets with the same range can still have different SDs.<\/li><\/ul>"}, {"lo": "LO5", "h": "Mean or median for skewed data", "html": "<p>A distribution is <b>skewed<\/b> when a few values stretch out far to one side, forming a long tail.<\/p><ul><li><b>Skewed right<\/b> (a few very large values, such as incomes or house prices): the mean is greater than the median.<\/li><li><b>Skewed left<\/b> (a few very small values, such as a few very low scores on an easy test): the mean is less than the median.<\/li><li><b>Roughly symmetric<\/b>: the mean and the median are close together.<\/li><\/ul><div class=\"rule\">The mean is pulled toward the tail. For skewed data or data with outliers, the median better describes a typical value.<\/div><p>For example, if the monthly rents on a street are $900, $950, $1,000, $1,050 and $4,100, the mean is $1,600, which is more than four of the five rents. The median, $1,000, is a much better description of a typical rent. For symmetric data without outliers, the mean is a good choice because it uses every value.<\/p>"}], "examples": [{"lo": "LO1", "q": "The numbers of minutes that 8 students needed to finish a puzzle were 12, 7, 15, 9, 7, 20, 11 and 15. Find the mean, median, mode and range.", "steps": ["Sort the data: 7, 7, 9, 11, 12, 15, 15, 20.", "Mean: the sum is 96, and 96 ÷ 8 = 12.", "Median: there are 8 values, so average the 4th and 5th values: <span class=\"fq\"><span>11 + 12<\/span><span>2<\/span><\/span> = 11.5.", "Mode: 7 and 15 each occur twice, so the data set has two modes. Range: 20 − 7 = 13."], "ans": "Mean 12, median 11.5, modes 7 and 15, range 13"}, {"lo": "LO2", "q": "The mean of six numbers is 14. Five of the numbers are 10, 12, 15, 17 and 20. What is the sixth number?", "steps": ["The six numbers must total 6 × 14 = 84.", "The five known numbers total 10 + 12 + 15 + 17 + 20 = 74.", "The sixth number is 84 − 74 = 10. Check: (74 + 10) ÷ 6 = 14 ✓."], "ans": "10"}, {"lo": "LO3", "q": "At a science fair, the 15 junior entries had a mean score of 72 and the 25 senior entries had a mean score of 80. What is the mean score of all 40 entries?", "steps": ["Total of the junior scores: 15 × 72 = 1,080.", "Total of the senior scores: 25 × 80 = 2,000.", "Combined mean: <span class=\"fq\"><span>1,080 + 2,000<\/span><span>40<\/span><\/span> = <span class=\"fq\"><span>3,080<\/span><span>40<\/span><\/span> = 77. It is closer to 80 because there are more senior entries; the simple average, 76, is wrong."], "ans": "77"}, {"lo": "LO4", "q": "The data set 20, 24, 25, 28, 33 has a mean of 26. If the value 33 is replaced by 63, how do the mean, the median and the range change?", "steps": ["The sum increases by 63 − 33 = 30, so the mean increases by <span class=\"fq\"><span>30<\/span><span>5<\/span><\/span> = 6, from 26 to 32.", "The middle value is still 25, because 63 is still the greatest value. The median does not change.", "The range was 33 − 20 = 13 and becomes 63 − 20 = 43, an increase of 30."], "ans": "The mean increases by 6, the median stays 25, and the range increases by 30."}, {"lo": "LO5", "q": "Data set A is 40, 45, 50, 55, 60 and data set B is 30, 40, 50, 60, 70. Which data set has the greater standard deviation?", "steps": ["Both data sets have a mean of 50.", "Distances from 50 in A: 10, 5, 0, 5, 10. Distances from 50 in B: 20, 10, 0, 10, 20.", "Every value of B is at least as far from the mean as the matching value of A, so B is more spread out."], "ans": "Data set B"}, {"lo": "LO5", "q": "The prices, in dollars, of 7 used bicycles listed for sale were 85, 90, 95, 100, 110, 120 and 480. Which measure of center best represents a typical price?<br>A) The mean, because it uses every price<br>B) The median, because the price of $480 pulls the mean up<br>C) The mean, because the prices are symmetric<br>D) The median, because it is always less than the mean", "steps": ["Mean: the sum is 1,080, and 1,080 ÷ 7 ≈ 154.29. Median: the 4th of 7 sorted values is 100.", "The mean is greater than 6 of the 7 prices, because the single price of $480 is an outlier that pulls it up.", "The median is not affected by the outlier, so it describes a typical price better. Choice D gives a false reason: the median is not always less than the mean."], "ans": "B"}], "traps": ["Finding the median without sorting the data first. The middle of the unsorted list is usually not the median.", "For an even number of values, choosing one of the two middle values instead of taking their mean.", "Averaging two group means when the groups have different sizes. Multiply each mean by its group size, add, and divide by the total size.", "Working with means when a value is added, removed or missing. Convert each mean to a total first (sum = mean × number of values).", "Assuming that an outlier moves the median as much as the mean. The median barely moves, while the mean and the range change a lot.", "Thinking that equal ranges mean equal standard deviations, or that adding the same number to every value changes the standard deviation."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "What is the median of the data set 12, 7, 15, 9, 7, 10?", "opts": ["9.5", "12", "10", "7"], "ans": 0, "sol": "Sort the data: 7, 7, 9, 10, 12, 15.<br>There are 6 values, so the median is the mean of the 3rd and 4th values: <span class=\"fq\"><span>9 + 10<\/span><span>2<\/span><\/span> = 9.5.<br>Answer: <b>9.5<\/b>", "hint": "Put the values in order first. With an even number of values, how many middle values are there?"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "The daily high temperatures, in degrees Fahrenheit, in a town on 5 days were 68, 74, 71, 80 and 72. What was the mean daily high temperature, in degrees Fahrenheit, for these 5 days?", "ans": ["73"], "sol": "Sum: 68 + 74 + 71 + 80 + 72 = 365.<br>Mean: 365 ÷ 5 = 73.<br>Answer: <b>73<\/b>", "hint": "Add the five temperatures, then divide by the number of days."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "For the data set 3, 8, 8, 5, 11, 8, 2, 5, which of the following lists the mean, the median and the mode in order from least to greatest?", "opts": ["median, mean, mode", "mode, median, mean", "mean, median, mode", "mean, mode, median"], "ans": 2, "sol": "Sorted: 2, 3, 5, 5, 8, 8, 8, 11.<br>Mean: 50 ÷ 8 = 6.25. Median: <span class=\"fq\"><span>5 + 8<\/span><span>2<\/span><\/span> = 6.5. Mode: 8.<br>So 6.25 &lt; 6.5 &lt; 8.<br>Answer: <b>mean, median, mode<\/b>", "hint": "Find all three values before comparing them. The median of 8 values is the mean of the two middle values."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "The mean of Kiran's five test scores is 82. Four of the scores are 78, 85, 90 and 74. What is the fifth score?", "opts": ["81.75", "82", "1", "83"], "ans": 3, "sol": "The five scores total 5 × 82 = 410.<br>The four known scores total 78 + 85 + 90 + 74 = 327.<br>The fifth score is 410 − 327 = 83.<br>Answer: <b>83<\/b>", "hint": "First find what all five scores must add up to."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "A delivery driver made a mean of 42 deliveries per day over 6 days. After a 7th day of work, the mean for all 7 days was 44 deliveries per day. How many deliveries did the driver make on the 7th day?", "ans": ["56"], "sol": "Total for 6 days: 6 × 42 = 252.<br>Total for 7 days: 7 × 44 = 308.<br>Deliveries on the 7th day: 308 − 252 = 56.<br>Answer: <b>56<\/b>", "hint": "Turn each mean into a total. The 7th day accounts for the difference between the two totals."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "In a quiz, the 12 students in Section A had a mean score of 70, and the 18 students in Section B had a mean score of 80. What was the mean score of all 30 students?", "opts": ["76", "75", "74", "1,140"], "ans": 0, "sol": "Total for Section A: 12 × 70 = 840. Total for Section B: 18 × 80 = 1,440.<br>Combined total: 2,280.<br>Combined mean: 2,280 ÷ 30 = 76.<br>Answer: <b>76<\/b>", "hint": "The sections have different sizes, so a simple average of 70 and 80 will not work. Find each total first."}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A café sold 40 small coffees at $2.50 each and some large coffees at $4.00 each. The mean price of all the coffees sold was $3.00. How many large coffees did the café sell?", "ans": ["20"], "sol": "Let <i>n<\/i> be the number of large coffees. Total revenue: 2.50(40) + 4.00<i>n<\/i> = 100 + 4<i>n<\/i>.<br>Also, total revenue = 3.00(40 + <i>n<\/i>) = 120 + 3<i>n<\/i>.<br>So 100 + 4<i>n<\/i> = 120 + 3<i>n<\/i>, and <i>n<\/i> = 20.<br>Answer: <b>20<\/b>", "hint": "Write the total amount of money in two ways: by adding the two kinds of coffee, and as mean price × total number of coffees."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "In the data set 5, 8, 9, 12, 16, the value 16 is replaced by 30. Which of the following does NOT change?", "opts": ["The mean", "The median", "The range", "The mean and the range"], "ans": 1, "sol": "The middle value is still 9, so the median does not change.<br>The sum increases by 14, so the mean increases, and the greatest value changes, so the range increases.<br>Answer: <b>The median<\/b>", "hint": "Which summary depends only on the middle value of the sorted list?"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The mean of 8 numbers is 15. A ninth number, 24, is added to the list. What is the mean of the 9 numbers?", "opts": ["19.5", "15", "16", "18"], "ans": 2, "sol": "Total of the 8 numbers: 8 × 15 = 120.<br>New total: 120 + 24 = 144.<br>New mean: 144 ÷ 9 = 16.<br>Answer: <b>16<\/b>", "hint": "Find the total of the 8 numbers first. Remember that there are now 9 numbers."}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A data set of 10 values has a mean of 50. It is later found that one value was recorded as 82 when its true value was 28. What is the mean of the corrected data set?", "opts": ["55.4", "44", "5.4", "44.6"], "ans": 3, "sol": "Recorded total: 10 × 50 = 500.<br>The correction lowers the total by 82 − 28 = 54, so the correct total is 446.<br>Correct mean: 446 ÷ 10 = 44.6.<br>Answer: <b>44.6<\/b>", "hint": "How does fixing the error change the total? Is the total going up or down?"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "Two machines fill bags of rice. The dot plots show the masses of 10 bags filled by machine P and 10 bags filled by machine Q. Both sets of masses have a mean of 500 grams.<svg class=\"fig\" viewBox=\"0 0 320 188\" role=\"img\" aria-label=\"Two dot plots of bag masses in grams, on number lines from 496 to 504. Machine P: 2 at 499, 6 at 500, 2 at 501. Machine Q: 1 at 497, 1 at 498, 1 at 499, 4 at 500, 1 at 501, 1 at 502, 1 at 503.\"><line class=\"fg-axis\" x1=\"70\" y1=\"70\" x2=\"308\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"76.0\" y1=\"70\" x2=\"76.0\" y2=\"74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"104.2\" y1=\"70\" x2=\"104.2\" y2=\"74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"132.5\" y1=\"70\" x2=\"132.5\" y2=\"74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"160.8\" y1=\"70\" x2=\"160.8\" y2=\"74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"189.0\" y1=\"70\" x2=\"189.0\" y2=\"74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"217.2\" y1=\"70\" x2=\"217.2\" y2=\"74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"245.5\" y1=\"70\" x2=\"245.5\" y2=\"74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"273.8\" y1=\"70\" x2=\"273.8\" y2=\"74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"302.0\" y1=\"70\" x2=\"302.0\" y2=\"74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"70\" y1=\"148\" x2=\"308\" y2=\"148\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"76.0\" y1=\"148\" x2=\"76.0\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"104.2\" y1=\"148\" x2=\"104.2\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"132.5\" y1=\"148\" x2=\"132.5\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"160.8\" y1=\"148\" x2=\"160.8\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"189.0\" y1=\"148\" x2=\"189.0\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"217.2\" y1=\"148\" x2=\"217.2\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"245.5\" y1=\"148\" x2=\"245.5\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"273.8\" y1=\"148\" x2=\"273.8\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"302.0\" y1=\"148\" x2=\"302.0\" y2=\"152\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"160.8\" cy=\"63\" r=\"3.5\"/><circle cx=\"160.8\" cy=\"54\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"63\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"54\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"45\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"36\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"27\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"18\" r=\"3.5\"/><circle cx=\"217.2\" cy=\"63\" r=\"3.5\"/><circle cx=\"217.2\" cy=\"54\" r=\"3.5\"/><circle cx=\"104.2\" cy=\"141\" r=\"3.5\"/><circle cx=\"132.5\" cy=\"141\" r=\"3.5\"/><circle cx=\"160.8\" cy=\"141\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"141\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"132\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"123\" r=\"3.5\"/><circle cx=\"189.0\" cy=\"114\" r=\"3.5\"/><circle cx=\"217.2\" cy=\"141\" r=\"3.5\"/><circle cx=\"245.5\" cy=\"141\" r=\"3.5\"/><circle cx=\"273.8\" cy=\"141\" r=\"3.5\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"76.0\" y=\"85\" text-anchor=\"middle\">496<\/text><text x=\"132.5\" y=\"85\" text-anchor=\"middle\">498<\/text><text x=\"189.0\" y=\"85\" text-anchor=\"middle\">500<\/text><text x=\"245.5\" y=\"85\" text-anchor=\"middle\">502<\/text><text x=\"302.0\" y=\"85\" text-anchor=\"middle\">504<\/text><text x=\"4\" y=\"66\" font-weight=\"bold\">Machine P<\/text><text x=\"76.0\" y=\"163\" text-anchor=\"middle\">496<\/text><text x=\"132.5\" y=\"163\" text-anchor=\"middle\">498<\/text><text x=\"189.0\" y=\"163\" text-anchor=\"middle\">500<\/text><text x=\"245.5\" y=\"163\" text-anchor=\"middle\">502<\/text><text x=\"302.0\" y=\"163\" text-anchor=\"middle\">504<\/text><text x=\"4\" y=\"144\" font-weight=\"bold\">Machine Q<\/text><text x=\"189.0\" y=\"182\" text-anchor=\"middle\">Mass of bag (grams)<\/text><\/g><\/svg>Which statement correctly compares the standard deviations of the two sets of masses?", "opts": ["The standard deviation for machine Q is greater.", "The standard deviation for machine P is greater.", "The standard deviations are equal, because the means are equal.", "The standard deviations are equal, because both machines filled 10 bags."], "ans": 0, "sol": "Machine P's masses are all within 1 gram of 500.<br>Machine Q's masses spread from 497 to 503, so they are generally farther from the mean.<br>Answer: <b>The standard deviation for machine Q is greater.<\/b>", "hint": "Standard deviation measures how far values typically are from the mean. Which plot is more spread out around 500?"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The annual salaries, in thousands of dollars, of the 7 employees at a small design studio are 38, 41, 42, 45, 47, 50 and 210. Which measure of center best represents a typical salary at the studio?", "opts": ["The mean, because it uses every salary in the data set", "The median, because the salary of 210 thousand dollars pulls the mean far above most of the salaries", "The mean, because the salaries are distributed symmetrically", "The mean, because it is greater than the median"], "ans": 1, "sol": "Mean: 473 ÷ 7 ≈ 67.6, which is greater than 6 of the 7 salaries. Median: 45.<br>The single salary of 210 is an outlier that makes the data skewed right and pulls the mean up.<br>The median is resistant to the outlier.<br>Answer: <b>The median<\/b>", "hint": "Compute both the mean and the median. Which one is close to most of the salaries?"}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "What is the mode of the data set 6, 9, 4, 9, 3, 6, 9, 2?", "opts": ["9", "6", "7", "3"], "ans": 0, "sol": "The value 9 occurs three times, more than any other value.<br>Answer: <b>9<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "A café recorded the number of customers who arrived during each of five hours: 23, 41, 17, 35 and 29. What is the range of these numbers?", "ans": ["24"], "sol": "Greatest value: 41. Least value: 17.<br>Range: 41 − 17 = 24.<br>Answer: <b>24<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "The mean of 6 numbers is 9.5. What is the sum of the 6 numbers?", "opts": ["15.5", "57", "9.5", "<span class=\"fq\"><span>19<\/span><span>12<\/span><\/span>"], "ans": 1, "sol": "Sum = mean × number of values.<br>Sum = 9.5 × 6 = 57.<br>Answer: <b>57<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Data set A consists of 10 values with a mean of 8. Data set B consists of 10 values with a mean of 14. What is the mean of all 20 values?", "opts": ["22", "110", "11", "220"], "ans": 2, "sol": "Totals: 10 × 8 = 80 and 10 × 14 = 140, so the combined total is 220.<br>Mean: 220 ÷ 20 = 11. (Equal group sizes give the simple average of the two means.)<br>Answer: <b>11<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "The value 26 is added to the data set 10, 12, 15, 18, 20. By how much does the range increase?", "opts": ["16", "26", "10", "6"], "ans": 3, "sol": "Original range: 20 − 10 = 10.<br>New range: 26 − 10 = 16.<br>Increase: 16 − 10 = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "Each of the following data sets has a mean of 5. Which data set has the smallest standard deviation?", "opts": ["5, 5, 5, 5, 5", "1, 3, 5, 7, 9", "4, 5, 5, 5, 6", "0, 5, 5, 5, 10"], "ans": 0, "sol": "In 5, 5, 5, 5, 5 every value equals the mean, so no value is any distance from the mean.<br>Its standard deviation is 0, the least possible.<br>Answer: <b>5, 5, 5, 5, 5<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "The data set 3, 5, 6, 8, 10, 11, 14, <i>x<\/i> consists of eight values, where <i>x<\/i> &gt; 14. What is the median of the data set?", "ans": ["9"], "sol": "Since <i>x<\/i> &gt; 14, the sorted list is 3, 5, 6, 8, 10, 11, 14, <i>x<\/i>.<br>The two middle values are the 4th and 5th: 8 and 10.<br>Median: <span class=\"fq\"><span>8 + 10<\/span><span>2<\/span><\/span> = 9.<br>Answer: <b>9<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The bar graph shows the monthly rainfall, in centimeters, in a town for six months.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of monthly rainfall in centimeters: Jan 3, Feb 5, Mar 8, Apr 6, May 2, Jun 6.\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\"><line x1=\"54\" y1=\"172.2\" x2=\"310\" y2=\"172.2\"/><line x1=\"54\" y1=\"154.4\" x2=\"310\" y2=\"154.4\"/><line x1=\"54\" y1=\"136.6\" x2=\"310\" y2=\"136.6\"/><line x1=\"54\" y1=\"118.8\" x2=\"310\" y2=\"118.8\"/><line x1=\"54\" y1=\"101.0\" x2=\"310\" y2=\"101.0\"/><line x1=\"54\" y1=\"83.2\" x2=\"310\" y2=\"83.2\"/><line x1=\"54\" y1=\"65.4\" x2=\"310\" y2=\"65.4\"/><line x1=\"54\" y1=\"47.6\" x2=\"310\" y2=\"47.6\"/><line x1=\"54\" y1=\"29.8\" x2=\"310\" y2=\"29.8\"/><line x1=\"54\" y1=\"12.0\" x2=\"310\" y2=\"12.0\"/><\/g><rect class=\"fg-shape\" x=\"62.5\" y=\"136.6\" width=\"25.6\" height=\"53.4\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"105.2\" y=\"101.0\" width=\"25.6\" height=\"89.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"147.9\" y=\"47.6\" width=\"25.6\" height=\"142.4\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"190.5\" y=\"83.2\" width=\"25.6\" height=\"106.8\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"233.2\" y=\"154.4\" width=\"25.6\" height=\"35.6\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"275.9\" y=\"83.2\" width=\"25.6\" height=\"106.8\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"54\" y1=\"190\" x2=\"310\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"54\" y1=\"190\" x2=\"54\" y2=\"8\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"49\" y=\"194.0\" text-anchor=\"end\">0<\/text><text x=\"49\" y=\"158.4\" text-anchor=\"end\">2<\/text><text x=\"49\" y=\"122.8\" text-anchor=\"end\">4<\/text><text x=\"49\" y=\"87.2\" text-anchor=\"end\">6<\/text><text x=\"49\" y=\"51.6\" text-anchor=\"end\">8<\/text><text x=\"49\" y=\"16.0\" text-anchor=\"end\">10<\/text><text x=\"75.3\" y=\"204\" text-anchor=\"middle\">Jan<\/text><text x=\"118.0\" y=\"204\" text-anchor=\"middle\">Feb<\/text><text x=\"160.7\" y=\"204\" text-anchor=\"middle\">Mar<\/text><text x=\"203.3\" y=\"204\" text-anchor=\"middle\">Apr<\/text><text x=\"246.0\" y=\"204\" text-anchor=\"middle\">May<\/text><text x=\"288.7\" y=\"204\" text-anchor=\"middle\">Jun<\/text><text x=\"182.0\" y=\"232\" text-anchor=\"middle\">Month<\/text><text x=\"14\" y=\"101.0\" text-anchor=\"middle\" transform=\"rotate(-90 14 101.0)\">Rainfall (centimeters)<\/text><\/g><\/svg>What is the mean monthly rainfall, in centimeters, for these six months?", "opts": ["5.5", "5", "6", "30"], "ans": 1, "sol": "From the graph: 3, 5, 8, 6, 2, 6.<br>Sum: 30. Mean: 30 ÷ 6 = 5.<br>Answer: <b>5<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "The mean of 2<i>x<\/i>, <i>x<\/i> + 5 and 3<i>x<\/i> − 2 is 11. What is the value of <i>x<\/i>?", "opts": ["6", "<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>", "5", "11"], "ans": 2, "sol": "Sum = mean × number of values: 2<i>x<\/i> + (<i>x<\/i> + 5) + (3<i>x<\/i> − 2) = 3 × 11.<br>So 6<i>x<\/i> + 3 = 33 and 6<i>x<\/i> = 30.<br><i>x<\/i> = 5.<br>Answer: <b>5<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "The mean of the numbers <i>x<\/i> and <i>y<\/i> is 13, and <i>x<\/i> − <i>y<\/i> = 6. What is the value of <i>x<\/i>?", "ans": ["16"], "sol": "The mean is 13, so <i>x<\/i> + <i>y<\/i> = 2 × 13 = 26.<br>Add the equations: 2<i>x<\/i> = 26 + 6 = 32.<br><i>x<\/i> = 16.<br>Answer: <b>16<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A school has three sections of a mathematics course, and all three took the same test. The 10 students in the first section had a mean score of 70, the 25 students in the second section had a mean score of 80, and the 15 students in the third section had a mean score of 90. What was the mean score of all 50 students?", "opts": ["80", "79", "4,050", "81"], "ans": 3, "sol": "Totals: 10 × 70 = 700, 25 × 80 = 2,000 and 15 × 90 = 1,350.<br>Combined total: 4,050.<br>Mean: 4,050 ÷ 50 = 81.<br>Answer: <b>81<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Data set P consists of 20 values with a mean of 30. Data set Q consists of 5 values with a mean of 50. If <i>m<\/i> is the mean of all 25 values, which of the following is true?", "opts": ["30 &lt; <i>m<\/i> &lt; 40", "<i>m<\/i> = 40", "40 &lt; <i>m<\/i> &lt; 50", "<i>m<\/i> = 80"], "ans": 0, "sol": "Combined total: 20(30) + 5(50) = 850.<br><i>m<\/i> = 850 ÷ 25 = 34.<br>Since P is larger, <i>m<\/i> is closer to 30 than to 50.<br>Answer: <b>30 &lt; <i>m<\/i> &lt; 40<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The data set 8, 10, 11, 13, 13, 17 has a mean of 12. The value 12 is added to the data set. Which of the following is true?", "opts": ["The mean stays the same, but the median increases.", "The mean, the median and the range all stay the same.", "The mean increases.", "The range decreases."], "ans": 1, "sol": "New sum: 72 + 12 = 84, and 84 ÷ 7 = 12, so the mean stays 12.<br>Old median: <span class=\"fq\"><span>11 + 13<\/span><span>2<\/span><\/span> = 12. New sorted list 8, 10, 11, 12, 13, 13, 17 has median 12.<br>The least and greatest values are unchanged, so the range stays 9.<br>Answer: <b>The mean, the median and the range all stay the same.<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "The data set 6, 10, 10, 13, 16, 23 has a mean of 13. If the value 23 is removed, by how much does the mean decrease?", "ans": ["2"], "sol": "Old sum: 6 × 13 = 78. New sum: 78 − 23 = 55.<br>New mean: 55 ÷ 5 = 11.<br>Decrease: 13 − 11 = 2.<br>Answer: <b>2<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The dot plot shows the number of goals a soccer team scored in each of 12 matches.<svg class=\"fig\" viewBox=\"0 0 320 92\" role=\"img\" aria-label=\"Dot plot of goals scored in 12 matches, on a number line from 0 to 10: 1 at 0, 3 at 1, 4 at 2, 2 at 3, 1 at 4, 1 at 9.\"><line class=\"fg-axis\" x1=\"16\" y1=\"52\" x2=\"308\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"22.0\" y1=\"52\" x2=\"22.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50.0\" y1=\"52\" x2=\"50.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"78.0\" y1=\"52\" x2=\"78.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"106.0\" y1=\"52\" x2=\"106.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"134.0\" y1=\"52\" x2=\"134.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"162.0\" y1=\"52\" x2=\"162.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"190.0\" y1=\"52\" x2=\"190.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"218.0\" y1=\"52\" x2=\"218.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"246.0\" y1=\"52\" x2=\"246.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"274.0\" y1=\"52\" x2=\"274.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"302.0\" y1=\"52\" x2=\"302.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"22.0\" cy=\"45\" r=\"3.5\"/><circle cx=\"50.0\" cy=\"45\" r=\"3.5\"/><circle cx=\"50.0\" cy=\"36\" r=\"3.5\"/><circle cx=\"50.0\" cy=\"27\" r=\"3.5\"/><circle cx=\"78.0\" cy=\"45\" r=\"3.5\"/><circle cx=\"78.0\" cy=\"36\" r=\"3.5\"/><circle cx=\"78.0\" cy=\"27\" r=\"3.5\"/><circle cx=\"78.0\" cy=\"18\" r=\"3.5\"/><circle cx=\"106.0\" cy=\"45\" r=\"3.5\"/><circle cx=\"106.0\" cy=\"36\" r=\"3.5\"/><circle cx=\"134.0\" cy=\"45\" r=\"3.5\"/><circle cx=\"274.0\" cy=\"45\" r=\"3.5\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"22.0\" y=\"67\" text-anchor=\"middle\">0<\/text><text x=\"50.0\" y=\"67\" text-anchor=\"middle\">1<\/text><text x=\"78.0\" y=\"67\" text-anchor=\"middle\">2<\/text><text x=\"106.0\" y=\"67\" text-anchor=\"middle\">3<\/text><text x=\"134.0\" y=\"67\" text-anchor=\"middle\">4<\/text><text x=\"162.0\" y=\"67\" text-anchor=\"middle\">5<\/text><text x=\"190.0\" y=\"67\" text-anchor=\"middle\">6<\/text><text x=\"218.0\" y=\"67\" text-anchor=\"middle\">7<\/text><text x=\"246.0\" y=\"67\" text-anchor=\"middle\">8<\/text><text x=\"274.0\" y=\"67\" text-anchor=\"middle\">9<\/text><text x=\"302.0\" y=\"67\" text-anchor=\"middle\">10<\/text><text x=\"162.0\" y=\"86\" text-anchor=\"middle\">Number of goals scored in a match<\/text><\/g><\/svg>If the match in which the team scored 9 goals is removed from the data, which of the following describes the change in the mean and the standard deviation?", "opts": ["The mean decreases and the standard deviation increases.", "The mean increases and the standard deviation decreases.", "Both the mean and the standard deviation decrease.", "Both the mean and the standard deviation stay the same."], "ans": 2, "sol": "The value 9 is far above the other values, which are all between 0 and 4.<br>Removing a value greater than the mean lowers the mean (from 2.5 to about 1.9).<br>Removing the value farthest from the center makes the data less spread out, so the standard deviation decreases.<br>Answer: <b>Both the mean and the standard deviation decrease.<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "The data set 3, 8, 14, 17, 25, <i>x<\/i> has a median of 12. What is the value of <i>x<\/i>?", "opts": ["16", "5", "12", "10"], "ans": 3, "sol": "Without <i>x<\/i>, the sorted values are 3, 8, 14, 17, 25. A median of 12 must be the mean of the 3rd and 4th values of the six.<br>If <i>x<\/i> ≤ 8 the median is <span class=\"fq\"><span>8 + 14<\/span><span>2<\/span><\/span> = 11, and if <i>x<\/i> ≥ 14 it is <span class=\"fq\"><span>14 + 17<\/span><span>2<\/span><\/span> = 15.5, so 8 &lt; <i>x<\/i> &lt; 14.<br>Then <span class=\"fq\"><span><i>x<\/i> + 14<\/span><span>2<\/span><\/span> = 12, so <i>x<\/i> = 10.<br>Answer: <b>10<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "The mean of <i>a<\/i>, <i>b<\/i> and <i>c<\/i> is 14. The mean of <i>a<\/i>, <i>b<\/i>, <i>c<\/i>, <i>d<\/i> and <i>e<\/i> is 17. What is the mean of <i>d<\/i> and <i>e<\/i>?", "ans": ["21.5", "43/2"], "sol": "<i>a<\/i> + <i>b<\/i> + <i>c<\/i> = 3 × 14 = 42.<br><i>a<\/i> + <i>b<\/i> + <i>c<\/i> + <i>d<\/i> + <i>e<\/i> = 5 × 17 = 85.<br>So <i>d<\/i> + <i>e<\/i> = 43, and their mean is 43 ÷ 2 = 21.5.<br>Answer: <b>21.5<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A company employs 30 engineers and 15 managers. The mean annual salary of the engineers is $90,000, and the mean annual salary of all 45 employees is $100,000. What is the mean annual salary of the managers, in thousands of dollars?", "opts": ["120", "110", "1,800", "40"], "ans": 0, "sol": "Total for all employees: 45 × 100 = 4,500 thousand dollars.<br>Total for engineers: 30 × 90 = 2,700 thousand dollars.<br>Managers: 4,500 − 2,700 = 1,800, and 1,800 ÷ 15 = 120.<br>Answer: <b>120<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The data set 3, 6, 6, 9, 11, 13, 15, 17, 19 has a mean of 11. The values 2 and 30 are both added to the data set. Which of the following is true?", "opts": ["The mean stays the same, the median stays the same, and the range increases.", "The mean increases, the median stays the same, and the range increases.", "The mean increases, the median increases, and the range increases.", "The mean stays the same, the median increases, and the range stays the same."], "ans": 1, "sol": "New sum: 99 + 2 + 30 = 131, and 131 ÷ 11 ≈ 11.9, so the mean increases. (2 and 30 have a mean of 16, which is above 11.)<br>One value is added below the median and one above, so the median is still 11.<br>The range grows from 16 to 28.<br>Answer: <b>The mean increases, the median stays the same, and the range increases.<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The scores of 9 students on a quiz were 18, 25, 84, 88, 90, 91, 92, 94 and 95. Which of the following statements is true?", "opts": ["The mean is greater than the median, so the mean better represents a typical score.", "The median is greater than the mean, so the mean better represents a typical score.", "The median is greater than the mean, so the median better represents a typical score.", "The mean and the median are equal, so either one represents a typical score equally well."], "ans": 2, "sol": "Mean: 677 ÷ 9 ≈ 75.2. Median: the 5th value, 90.<br>The two very low scores make the data skewed left and pull the mean down, below 7 of the 9 scores.<br>The median is not affected by those low values, so it better represents a typical score.<br>Answer: <b>The median is greater than the mean, so the median better represents a typical score.<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "For the data set 8, 14, 11, 8, 19, 12, how much greater is the mean than the mode?", "opts": ["4", "0.5", "11", "3.5"], "ans": 0, "sol": "Mean: 72 ÷ 6 = 12.<br>Mode: 8, the only value that occurs twice.<br>Difference: 12 − 8 = 4.<br>Answer: <b>4<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "The mean of the numbers <i>x<\/i>, <i>y<\/i> and <i>z<\/i> is 20. What is the mean of the numbers <i>x<\/i> + 4, <i>y<\/i> + 6 and <i>z<\/i> + 8?", "ans": ["26"], "sol": "<i>x<\/i> + <i>y<\/i> + <i>z<\/i> = 3 × 20 = 60.<br>New sum: 60 + 4 + 6 + 8 = 78.<br>New mean: 78 ÷ 3 = 26.<br>Answer: <b>26<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "In a course, a student's final grade is a weighted mean in which the test average counts for 60% and the homework average counts for 40%. Ravi's test average is 80 and his homework average is 95. What is Ravi's final grade?", "opts": ["87.5", "86", "89", "48"], "ans": 1, "sol": "Weighted mean: 0.60(80) + 0.40(95).<br>= 48 + 38 = 86.<br>Answer: <b>86<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The data set 12, 15, 15, 18, 20, 22, 24, 34 has a median of 19. If the value 34 is removed, by how much does the median decrease?", "opts": ["2", "0", "1", "10"], "ans": 2, "sol": "Before: the 4th and 5th of 8 values are 18 and 20, so the median is 19.<br>After: the 7 values 12, 15, 15, 18, 20, 22, 24 have median 18 (the 4th value).<br>Decrease: 19 − 18 = 1.<br>Answer: <b>1<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Each of the 30 values in a data set is increased by 5. Which of the following is true about the standard deviation of the new data set?", "opts": ["It is 5 more than the standard deviation of the original data set.", "It is 5 times the standard deviation of the original data set.", "It is 5 less than the standard deviation of the original data set.", "It is equal to the standard deviation of the original data set."], "ans": 3, "sol": "Adding 5 to every value moves the whole data set 5 units up, and the mean moves up by 5 as well.<br>Every distance from the mean stays the same, so the spread does not change.<br>Answer: <b>It is equal to the standard deviation of the original data set.<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "The mean of five consecutive odd integers is 27. What is the least of the five integers?", "opts": ["23", "25", "19", "27"], "ans": 0, "sol": "For evenly spaced values, the mean is the middle value, so the integers are centered at 27.<br>Consecutive odd integers differ by 2: 23, 25, 27, 29, 31.<br>Answer: <b>23<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "The data set 6, 9, 10, 14, 15, <i>x<\/i>, <i>y<\/i> consists of seven numbers, where <i>x<\/i> &lt; <i>y<\/i>. The median of the data set is 11 and the mean is 12. What is the value of <i>y<\/i>?", "ans": ["19"], "sol": "The median of 7 values is the 4th value, and 11 is not among 6, 9, 10, 14, 15, so <i>x<\/i> or <i>y<\/i> is 11. If <i>y<\/i> = 11, then <i>x<\/i> &lt; 11 and 11 would be the 5th value, so <i>x<\/i> = 11 and <i>y<\/i> &gt; 11.<br>Sum: 7 × 12 = 84, so 54 + 11 + <i>y<\/i> = 84.<br><i>y<\/i> = 19.<br>Answer: <b>19<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A list of <i>n<\/i> numbers has a mean of 12. When the number 40 is added to the list, the mean of the new list is 14. What is the value of <i>n<\/i>?", "ans": ["13"], "sol": "Original sum: 12<i>n<\/i>. New sum: 12<i>n<\/i> + 40, with <i>n<\/i> + 1 numbers.<br>So 12<i>n<\/i> + 40 = 14(<i>n<\/i> + 1) = 14<i>n<\/i> + 14.<br>2<i>n<\/i> = 26, so <i>n<\/i> = 13.<br>Answer: <b>13<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A shop mixes 6 kilograms of coffee beans that cost $12 per kilogram with 4 kilograms of beans that cost $17 per kilogram. What is the mean cost, in dollars per kilogram, of the mixture?", "opts": ["14.5", "14", "15", "140"], "ans": 1, "sol": "Total cost: 6(12) + 4(17) = 72 + 68 = 140 dollars.<br>Total mass: 10 kilograms.<br>Mean cost: 140 ÷ 10 = 14 dollars per kilogram.<br>Answer: <b>14<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "Group A has 15 members and group B has 25 members. The mean of the scores in group A is 8 greater than the mean of the scores in group B. The mean of the scores of all 40 members is 50. What is the mean of the scores in group B?", "ans": ["47"], "sol": "Let <i>b<\/i> be the mean of group B; the mean of group A is <i>b<\/i> + 8.<br>Total: 15(<i>b<\/i> + 8) + 25<i>b<\/i> = 40(50) = 2,000.<br>40<i>b<\/i> + 120 = 2,000, so <i>b<\/i> = 47.<br>Answer: <b>47<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The numbers of minutes that 8 students spent on homework one evening were 22, 25, 27, 28, 30, 31, 33 and 96. If the value 96 is removed from the data, which of the following is true?", "opts": ["The median decreases by more than the mean decreases.", "The mean and the median decrease by the same amount.", "The mean decreases by more than the median decreases.", "The mean decreases, and the median stays the same."], "ans": 2, "sol": "Mean: 292 ÷ 8 = 36.5 before and 196 ÷ 7 = 28 after, a decrease of 8.5.<br>Median: <span class=\"fq\"><span>28 + 30<\/span><span>2<\/span><\/span> = 29 before and 28 after, a decrease of 1.<br>Answer: <b>The mean decreases by more than the median decreases.<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "In a study, the lengths, in centimeters, of 7 fish were 31, 35, 38, 40, 44, 47 and 52. Which of the following changes to one length would increase the mean but leave the median unchanged?", "opts": ["Changing 31 to 41", "Changing 40 to 45", "Changing 47 to 39", "Changing 52 to 60"], "ans": 3, "sol": "The median is the 4th value, 40.<br>Changing 52 to 60 raises the sum, and 40 is still the 4th value, so the median is unchanged.<br>Changing 31 to 41 or 40 to 45 moves the median to 41 or 44; changing 47 to 39 lowers the mean.<br>Answer: <b>Changing 52 to 60<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The dot plots show data set X and data set Y. Each data set has 9 values, a mean of 5 and a range of 8.<svg class=\"fig\" viewBox=\"0 0 320 179\" role=\"img\" aria-label=\"Two dot plots on number lines from 0 to 10. Set X has 9 dots: 4 at 1, 1 at 5, 4 at 9. Set Y has 9 dots: 1 at 1, 1 at 4, 5 at 5, 1 at 6, 1 at 9.\"><line class=\"fg-axis\" x1=\"52\" y1=\"52\" x2=\"308\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"58.0\" y1=\"52\" x2=\"58.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"82.4\" y1=\"52\" x2=\"82.4\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"106.8\" y1=\"52\" x2=\"106.8\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"131.2\" y1=\"52\" x2=\"131.2\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"155.6\" y1=\"52\" x2=\"155.6\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"180.0\" y1=\"52\" x2=\"180.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"204.4\" y1=\"52\" x2=\"204.4\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"228.8\" y1=\"52\" x2=\"228.8\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"253.2\" y1=\"52\" x2=\"253.2\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"277.6\" y1=\"52\" x2=\"277.6\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"302.0\" y1=\"52\" x2=\"302.0\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"139\" x2=\"308\" y2=\"139\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"58.0\" y1=\"139\" x2=\"58.0\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"82.4\" y1=\"139\" x2=\"82.4\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"106.8\" y1=\"139\" x2=\"106.8\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"131.2\" y1=\"139\" x2=\"131.2\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"155.6\" y1=\"139\" x2=\"155.6\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"180.0\" y1=\"139\" x2=\"180.0\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"204.4\" y1=\"139\" x2=\"204.4\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"228.8\" y1=\"139\" x2=\"228.8\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"253.2\" y1=\"139\" x2=\"253.2\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"277.6\" y1=\"139\" x2=\"277.6\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"302.0\" y1=\"139\" x2=\"302.0\" y2=\"143\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"82.4\" cy=\"45\" r=\"3.5\"/><circle cx=\"82.4\" cy=\"36\" r=\"3.5\"/><circle cx=\"82.4\" cy=\"27\" r=\"3.5\"/><circle cx=\"82.4\" cy=\"18\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"45\" r=\"3.5\"/><circle cx=\"277.6\" cy=\"45\" r=\"3.5\"/><circle cx=\"277.6\" cy=\"36\" r=\"3.5\"/><circle cx=\"277.6\" cy=\"27\" r=\"3.5\"/><circle cx=\"277.6\" cy=\"18\" r=\"3.5\"/><circle cx=\"82.4\" cy=\"132\" r=\"3.5\"/><circle cx=\"155.6\" cy=\"132\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"132\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"123\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"114\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"105\" r=\"3.5\"/><circle cx=\"180.0\" cy=\"96\" r=\"3.5\"/><circle cx=\"2 >In Y, 7 of the 9 values are within 1 unit of 5.<br>The values of X are typically much farther from the mean, so X has the greater standard deviation. Equal ranges do not imply equal standard deviations.<br>Answer: <b>Data set X has the greater standard deviation.<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A bank recorded the time, in minutes, that each of 200 customers waited to be served. Most customers waited less than 10 minutes, but a few waited more than 40 minutes, so the distribution of waiting times is skewed to the right. Which of the following is most likely true?", "opts": ["The mean waiting time is greater than the median waiting time.", "The median waiting time is greater than the mean waiting time.", "The mean and the median waiting times are equal.", "The range of the waiting times is less than their standard deviation."], "ans": 0, "sol": "In a right-skewed distribution, the few very long waits pull the mean up toward the tail.<br>The median depends only on the middle position, so it stays with the bulk of the data.<br>Answer: <b>The mean waiting time is greater than the median waiting time.<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "The bar graph shows the number of books borrowed from a school library on each of 8 days.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of books borrowed on each of 8 days: day 1 12, day 2 16, day 3 10, day 4 14, day 5 30, day 6 12, day 7 14, day 8 20.\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\"><line x1=\"54\" y1=\"178.9\" x2=\"310\" y2=\"178.9\"/><line x1=\"54\" y1=\"167.8\" x2=\"310\" y2=\"167.8\"/><line x1=\"54\" y1=\"156.6\" x2=\"310\" y2=\"156.6\"/><line x1=\"54\" y1=\"145.5\" x2=\"310\" y2=\"145.5\"/><line x1=\"54\" y1=\"134.4\" x2=\"310\" y2=\"134.4\"/><line x1=\"54\" y1=\"123.2\" x2=\"310\" y2=\"123.2\"/><line x1=\"54\" y1=\"112.1\" x2=\"310\" y2=\"112.1\"/><line x1=\"54\" y1=\"101.0\" x2=\"310\" y2=\"101.0\"/><line x1=\"54\" y /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

function qBody(q, sel, name){

    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';

}

      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
