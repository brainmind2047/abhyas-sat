var S = {"id": "ADV-2.3", "unit": "Advanced Math", "topic": "Nonlinear equations in one variable and systems", "title": "Radical, rational and absolute value equations", "intro": "Some equations hide the variable under a square root, in a denominator, inside absolute value bars or in a fractional exponent. On the DSAT these appear as quick \"solve for <i>x<\/i>\" questions and as trap questions in which a value you find by correct algebra still does not work, so checking every candidate in the original equation is part of the skill.", "los": [{"id": "LO1", "text": "Solve radical equations by isolating the radical and squaring, and reject extraneous solutions by checking in the original equation."}, {"id": "LO2", "text": "Solve rational equations by clearing denominators, identifying excluded values and rejecting extraneous solutions."}, {"id": "LO3", "text": "Solve absolute value equations of the form |<i>a<\/i><i>x<\/i> + <i>b<\/i>| = <i>c<\/i> and |expression| = |expression|, and determine how many solutions they have."}, {"id": "LO4", "text": "Solve equations with rational exponents, such as <i>x<\/i><sup>3/2<\/sup> = 27, by rewriting powers as roots and raising both sides to the reciprocal power."}], "notes": [{"lo": "LO1", "h": "Isolate, square, solve, check", "html": "<p>A <b>radical equation<\/b> has the variable under a square root sign. The plan always has four steps.<\/p><ol><li><b>Isolate<\/b> the radical on one side of the equation.<\/li><li><b>Square<\/b> both sides to remove the square root.<\/li><li><b>Solve<\/b> the equation that results; it may be linear or quadratic.<\/li><li><b>Check<\/b> every answer in the <i>original<\/i> equation.<\/li><\/ol><div class=\"eqs\">√(2<i>x<\/i> + 1) − 3 = 2<br>√(2<i>x<\/i> + 1) = 5<br>2<i>x<\/i> + 1 = 25<br><i>x<\/i> = 12<\/div><p>Check: √(25) − 3 = 5 − 3 = 2 ✓.<\/p><div class=\"rule\">Isolate the radical <b>before<\/b> squaring. Squaring √(2<i>x<\/i> + 1) − 3 directly gives a messy expression that still contains a radical.<\/div><p>When the radical has a coefficient, as in 3√<i>x<\/i> = 12, divide first (√<i>x<\/i> = 4, so <i>x<\/i> = 16), or square the coefficient too: 9<i>x<\/i> = 144.<\/p>"}, {"lo": "LO1", "h": "Why extraneous solutions appear", "html": "<p>Squaring is not a reversible step: 3 and −3 both square to 9. So the squared equation can have a solution that the original equation does not. Such a value is called an <b>extraneous solution<\/b>.<\/p><div class=\"eqs\">√(<i>x<\/i> + 3) = <i>x<\/i> − 3<br><i>x<\/i> + 3 = <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 9<br><i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 6 = 0, so <i>x<\/i> = 1 or <i>x<\/i> = 6<\/div><p>Check <i>x<\/i> = 6: √9 = 3 and 6 − 3 = 3 ✓. Check <i>x<\/i> = 1: √4 = 2 but 1 − 3 = −2 ✗. The only solution is 6.<\/p><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Solid curve y equals the square root of x plus 3, its dashed mirror image y equals the negative square root of x plus 3, and the line y equals x minus 3. The line meets the solid curve at the filled point (6, 3) and meets only the dashed curve at the open point (1, −2).\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"170\ lor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"130\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">6<\/text><text x=\"85\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"85\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"85\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"85\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"252\" y=\"125\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"96\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg><p>The graph shows what happened: squaring also solved √(<i>x<\/i> + 3) = −(<i>x<\/i> − 3), the dashed curve, and that is where <i>x<\/i> = 1 came from.<\/p><div class=\"rule\">The symbol √ always means the non-negative root, so an isolated radical can never equal a negative number.<\/div>"}, {"lo": "LO1", "h": "Two radicals and cube roots", "html": "<p>If both sides are single radicals, square once: √(4<i>x<\/i> − 1) = √(<i>x<\/i> + 8) gives 4<i>x<\/i> − 1 = <i>x<\/i> + 8, so <i>x<\/i> = 3. Check that the radicands are not negative: both equal 11 ✓.<\/p><p>If a radical sits next to another term, isolate one radical, square, then isolate and square again.<\/p><ul><li>Remember (<i>a<\/i> + <i>b<\/i>)<sup>2<\/sup> = <i>a<\/i><sup>2<\/sup> + 2<i>a<\/i><i>b<\/i> + <i>b<\/i><sup>2<\/sup>, so (1 + √<i>x<\/i>)<sup>2<\/sup> = 1 + 2√<i>x<\/i> + <i>x<\/i>, not 1 + <i>x<\/i>.<\/li><li>A <b>cube root<\/b> can be undone by cubing, and cubing is reversible, so cube root equations never create extraneous solutions: ∛(<i>x<\/i> − 4) = −2 gives <i>x<\/i> − 4 = −8, so <i>x<\/i> = −4.<\/li><\/ul><div class=\"tip\">DSAT tip: if the question gives answer choices, substituting each choice into the original equation is often the fastest check, and it automatically rejects extraneous values.<\/div>"}, {"lo": "LO2", "h": "Rational equations: excluded values and the LCD", "html": "<p>A <b>rational equation<\/b> has the variable in a denominator. Before doing anything else, write down the <b>excluded values<\/b>: the numbers that make any denominator 0. They can never be solutions.<\/p><p>Then multiply <b>every term<\/b> on both sides by the least common denominator (LCD). The fractions disappear and you are left with a linear or quadratic equation.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Equation<\/th><th>Excluded<\/th><th>Multiply by<\/th><\/tr><tr><td><span class=\"fq\"><span>2<\/span><span><i>x<\/i><\/span><\/span> + <span class=\"fq\"><span>3<\/span><span><i>x<\/i> + 2<\/span><\/span> = 1<\/td><td>0, −2<\/td><td><i>x<\/i>(<i>x<\/i> + 2)<\/td><\/tr><tr><td><span class=\"fq\"><span>5<\/span><span><i>x<\/i> − 4<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span><i>x<\/i><\/span><\/span><\/td><td>4, 0<\/td><td><i>x<\/i>(<i>x<\/i> − 4)<\/td><\/tr><tr><td><span class=\"fq\"><span>1<\/span><span><i>x<\/i> − 3<\/span><\/span> + <span class=\"fq\"><span>1<\/span><span><i>x<\/i> + 3<\/span><\/span> = <span class=\"fq\"><span>6<\/span><span><i>x<\/i><sup>2<\/sup> − 9<\/span><\/span><\/td><td>3, −3<\/td><td>(<i>x<\/i> − 3)(<i>x<\/i> + 3)<\/td><\/tr><\/table><\/div><p>When the equation is a single fraction equal to another single fraction, multiplying by the LCD is the same as cross multiplying: <span class=\"fq\"><span>5<\/span><span><i>x<\/i> − 4<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span><i>x<\/i><\/span><\/span> gives 5<i>x<\/i> = <i>x<\/i> − 4.<\/p><div class=\"rule\">Factor every denominator first; the LCD uses each factor once, with its highest power.<\/div>"}, {"lo": "LO2", "h": "Extraneous solutions in rational equations", "html": "<p>Multiplying by an expression that can equal 0 can create a solution that is not really there. Compare each answer with your list of excluded values.<\/p><div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i> + 1<\/span><span><i>x<\/i> − 1<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span><i>x<\/i> − 1<\/span><\/span> &nbsp;&nbsp;(<i>x<\/i> ≠ 1)<br><i>x<\/i> + 1 = 2<br><i>x<\/i> = 1<\/div><p>But 1 is excluded, so this equation has <b>no solution<\/b>. In the same way, a quadratic from a rational equation may give two candidates of which only one survives.<\/p><ul><li>A candidate that makes any original denominator 0 is rejected.<\/li><li>Every other candidate from correct algebra is a true solution, but a quick substitution guards against slips.<\/li><\/ul><div class=\"tip\">DSAT tip: in a question that asks for the number of solutions, or offers \"no solution\" as a choice, an excluded value is almost always the trap.<\/div>"}, {"lo": "LO3", "h": "Absolute value: two cases", "html": "<p>|<i>u<\/i>| is the distance of <i>u<\/i> from 0, so |<i>u<\/i>| = <i>c<\/i> (with <i>c<\/i> &gt; 0) means <i>u<\/i> = <i>c<\/i> or <i>u<\/i> = −<i>c<\/i>.<\/p><div class=\"eqs\">|<i>x<\/i> − 2| = 3<br><i>x<\/i> − 2 = 3 or <i>x<\/i> − 2 = −3<br><i>x<\/i> = 5 or <i>x<\/i> = −1<\/div><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"V-shaped graph of y equals the absolute value of x minus 2, with its vertex at (2, 0), and the horizontal line y equals 3. They intersect at the marked points (−1, 3) and (5, 3).\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"10\" y1=\"1 .<\/div>"}, {"lo": "LO3", "h": "When the other side is not a constant", "html": "<p><b>Two absolute values.<\/b> |<i>A<\/i>| = |<i>B<\/i>| means <i>A<\/i> and <i>B<\/i> are the same distance from 0, so <i>A<\/i> = <i>B<\/i> or <i>A<\/i> = −<i>B<\/i>. For |<i>x<\/i> + 1| = |2<i>x<\/i> − 4|:<\/p><ul><li><i>x<\/i> + 1 = 2<i>x<\/i> − 4 gives <i>x<\/i> = 5;<\/li><li><i>x<\/i> + 1 = −(2<i>x<\/i> − 4) gives 3<i>x<\/i> = 3, so <i>x<\/i> = 1.<\/li><\/ul><p><b>Variable on the other side.<\/b> In |<i>A<\/i>| = <i>B<\/i> where <i>B<\/i> contains <i>x<\/i>, solve both cases, then keep only the answers that make <i>B<\/i> ≥ 0, because an absolute value is never negative. For |<i>x<\/i> − 5| = 2<i>x<\/i> − 1:<\/p><ul><li><i>x<\/i> − 5 = 2<i>x<\/i> − 1 gives <i>x<\/i> = −4, but then 2<i>x<\/i> − 1 = −9 &lt; 0, so reject it.<\/li><li><i>x<\/i> − 5 = −(2<i>x<\/i> − 1) gives <i>x<\/i> = 2, and 2(2) − 1 = 3 ≥ 0 ✓.<\/li><\/ul><div class=\"rule\">With an expression on the right, the second case negates the <b>whole<\/b> expression: −(2<i>x<\/i> − 1), not −2<i>x<\/i> − 1.<\/div>"}, {"lo": "LO4", "h": "Equations with rational exponents", "html": "<p>A rational exponent is a root and a power together: <i>x<\/i><sup>m/n<\/sup> = (ⁿ√<i>x<\/i>)<sup>m<\/sup>. For example, <i>x<\/i><sup>3/2<\/sup> = (√<i>x<\/i>)<sup>3<\/sup> and <i>x<\/i><sup>2/3<\/sup> = (∛<i>x<\/i>)<sup>2<\/sup>.<\/p><div class=\"rule\">To solve <i>x<\/i><sup>m/n<\/sup> = <i>k<\/i>, isolate the power, then raise both sides to the reciprocal exponent <i>n<\/i>/<i>m<\/i>.<\/div><div class=\"eqs\"><i>x<\/i><sup>3/2<\/sup> = 27<br><i>x<\/i> = 27<sup>2/3<\/sup> = (∛27)<sup>2<\/sup> = 3<sup>2<\/sup> = 9<\/div><p>Evaluate the reciprocal power by taking the root first; the numbers stay small.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Equation<\/th><th>Raise to<\/th><th>Solution<\/th><\/tr><tr><td><i>x<\/i><sup>1/3<\/sup> = 4<\/td><td>3<\/td><td>64<\/td><\/tr><tr><td><i>x<\/i><sup>3/4<\/sup> = 8, <i>x<\/i> &gt; 0<\/td><td>4/3<\/td><td>16<\/td><\/tr><tr><td><i>x<\/i><sup>2/3<\/sup> = 25, <i>x<\/i> &gt; 0<\/td><td>3/2<\/td><td>125<\/td><\/tr><\/table><\/div><p>Without the condition <i>x<\/i> &gt; 0, <i>x<\/i><sup>2/3<\/sup> = 25 also allows <i>x<\/i> = −125, since (∛−125)<sup>2<\/sup> = 25. Read the stated domain carefully.<\/p>"}], "examples": [{"lo": "LO1", "q": "Solve √(3<i>x<\/i> − 2) + 4 = 9.", "steps": ["Isolate the radical: √(3<i>x<\/i> − 2) = 5.", "Square both sides: 3<i>x<\/i> − 2 = 25, so 3<i>x<\/i> = 27 and <i>x<\/i> = 9.", "Check: √(27 − 2) + 4 = 5 + 4 = 9 ✓."], "ans": "<i>x<\/i> = 9"}, {"lo": "LO1", "q": "<div class=\"eqs\">√(<i>x<\/i> + 10) = <i>x<\/i> − 2<\/div>What are all solutions of the equation? (SAT style)", "steps": ["Square both sides: <i>x<\/i> + 10 = <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 4.", "Rearrange: <i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> − 6 = 0, so (<i>x<\/i> − 6)(<i>x<\/i> + 1) = 0 and <i>x<\/i> = 6 or <i>x<\/i> = −1.", "Check <i>x<\/i> = 6: √16 = 4 and 6 − 2 = 4 ✓. Check <i>x<\/i> = −1: √9 = 3 but −1 − 2 = −3 ✗, so −1 is extraneous."], "ans": "<i>x<\/i> = 6"}, {"lo": "LO2", "q": "Solve <span class=\"fq\"><span>2<\/span><span><i>x<\/i><\/span><\/span> + <span class=\"fq\"><span>3<\/span><span><i>x<\/i> + 2<\/span><\/span> = 1.", "steps": ["Excluded values: <i>x<\/i> ≠ 0 and <i>x<\/i> ≠ −2. The LCD is <i>x<\/i>(<i>x<\/i> + 2).", "Multiply every term: 2(<i>x<\/i> + 2) + 3<i>x<\/i> = <i>x<\/i>(<i>x<\/i> + 2), so 5<i>x<\/i> + 4 = <i>x<\/i><sup>2<\/sup> + 2<i>x<\/i>.", "Rearrange: <i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> − 4 = 0, so (<i>x<\/i> − 4)(<i>x<\/i> + 1) = 0.", "Neither 4 nor −1 is excluded. Check <i>x<\/i> = −1: −2 + 3 = 1 ✓; <i>x<\/i> = 4: 0.5 + 0.5 = 1 ✓."], "ans": "<i>x<\/i> = −1 or <i>x<\/i> = 4"}, {"lo": "LO2", "q": "<div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i><\/span><span><i>x<\/i> − 3<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span><i>x<\/i> − 3<\/span><\/span> + 2<\/div>How many solutions does the equation have? (SAT style)", "steps": ["Excluded value: <i>x<\/i> ≠ 3. Multiply every term by <i>x<\/i> − 3: <i>x<\/i> = 3 + 2(<i>x<\/i> − 3).", "Simplify: <i>x<\/i> = 2<i>x<\/i> − 3, so <i>x<\/i> = 3.", "But 3 is excluded (it makes the denominators 0), so the equation has no solution."], "ans": "No solution"}, {"lo": "LO3", "q": "Solve |2<i>x<\/i> − 5| = 9.", "steps": ["Case 1: 2<i>x<\/i> − 5 = 9, so 2<i>x<\/i> = 14 and <i>x<\/i> = 7.", "Case 2: 2<i>x<\/i> − 5 = −9, so 2<i>x<\/i> = −4 and <i>x<\/i> = −2.", "Check: |9| = 9 ✓ and |−9| = 9 ✓."], "ans": "<i>x<\/i> = −2 or <i>x<\/i> = 7"}, {"lo": "LO3", "q": "Solve |<i>x<\/i> + 4| = |3<i>x<\/i> − 2|.", "steps": ["Case 1, same sign: <i>x<\/i> + 4 = 3<i>x<\/i> − 2, so 6 = 2<i>x<\/i> and <i>x<\/i> = 3.", "Case 2, opposite sign: <i>x<\/i> + 4 = −(3<i>x<\/i> − 2) = −3<i>x<\/i> + 2, so 4<i>x<\/i> = −2 and <i>x<\/i> = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>.", "Check: |7| = |7| ✓ and |3.5| = |−3.5| ✓."], "ans": "<i>x<\/i> = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> or <i>x<\/i> = 3"}, {"lo": "LO4", "q": "If <i>x<\/i> &gt; 0 and 4<i>x<\/i><sup>2/3<\/sup> − 7 = 29, what is the value of <i>x<\/i>?", "steps": ["Isolate the power: 4<i>x<\/i><sup>2/3<\/sup> = 36, so <i>x<\/i><sup>2/3<\/sup> = 9.", "Raise both sides to the power 3/2: <i>x<\/i> = 9<sup>3/2<\/sup> = (√9)<sup>3<\/sup> = 3<sup>3<\/sup> = 27.", "Check: 27<sup>2/3<\/sup> = (∛27)<sup>2<\/sup> = 9, and 4(9) − 7 = 29 ✓."], "ans": "<i>x<\/i> = 27"}], "traps": ["Skipping the check after squaring. Squaring can create extraneous solutions, so substitute every candidate into the <i>original<\/i> radical equation; an isolated √ can never equal a negative number.", "Squaring term by term. (<i>x<\/i> − 2)<sup>2<\/sup> is <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 4, not <i>x<\/i><sup>2<\/sup> − 4, and squaring 3√<i>x<\/i> gives 9<i>x<\/i>, not 3<i>x<\/i>.", "Forgetting excluded values. Any value that makes a denominator 0 must be thrown out, even if it came from correct algebra; the answer may then be \"no solution.\"", "Multiplying only some terms by the LCD. Every term on both sides, including whole numbers such as the 2 in <span class=\"fq\"><span><i>x<\/i><\/span><span><i>x<\/i> − 3<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span><i>x<\/i> − 3<\/span><\/span> + 2, must be multiplied.", "Solving only one case of an absolute value equation, or splitting |<i>x<\/i> − 5| = 2<i>x<\/i> − 1 without checking that the right side is not negative. Also, |expression| = negative number has no solution.", "Raising to the wrong power. To undo <i>x<\/i><sup>3/2<\/sup>, raise to 2/3, not 3/2; and when <i>x<\/i> is not restricted to positive values, an even power such as <i>x<\/i><sup>2/3<\/sup> = 4 gives two answers, 8 and −8."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">√(<i>x<\/i> − 3) = 4<\/div>What is the value of <i>x<\/i>?", "opts": ["7", "13", "19", "5"], "ans": 2, "sol": "Square both sides: <i>x<\/i> − 3 = 16.<br>Add 3: <i>x<\/i> = 19.<br>Check: √16 = 4 ✓.<br>Answer: <b>19<\/b>", "hint": "Undo the square root first by squaring both sides, then undo the subtraction."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">|<i>x<\/i> − 6| = 2<\/div>Which of the following gives all solutions to the equation?", "opts": ["8 only", "4 and 8", "−4 and 8", "−8 and −4"], "ans": 1, "sol": "<i>x<\/i> − 6 = 2 gives <i>x<\/i> = 8.<br><i>x<\/i> − 6 = −2 gives <i>x<\/i> = 4.<br>Answer: <b>4 and 8<\/b>", "hint": "The expression inside the bars could be 2 or −2."}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "<div class=\"eqs\"><span class=\"fq\"><span>12<\/span><span><i>x<\/i> + 1<\/span><\/span> = 3<\/div>What is the solution to the equation?", "ans": ["3"], "sol": "Multiply both sides by <i>x<\/i> + 1: 12 = 3(<i>x<\/i> + 1).<br>So <i>x<\/i> + 1 = 4 and <i>x<\/i> = 3, which is not excluded (<i>x<\/i> ≠ −1).<br>Answer: <b>3<\/b>", "hint": "Multiply both sides by the denominator, then solve the linear equation."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "If <i>x<\/i><sup>1/3<\/sup> = 5, what is the value of <i>x<\/i>?", "opts": ["15", "125", "<span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>", "25"], "ans": 1, "sol": "An exponent of 1/3 means a cube root, so cube both sides.<br><i>x<\/i> = 5<sup>3<\/sup> = 125.<br>Answer: <b>125<\/b>", "hint": "What power undoes an exponent of 1/3?"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\">√(2<i>x<\/i> + 7) = <i>x<\/i> + 2<\/div>Which of the following gives all solutions to the equation?", "opts": ["1 only", "−3 only", "−3 and 1", "No solution"], "ans": 0, "sol": "Square both sides: 2<i>x<\/i> + 7 = <i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> + 4, so <i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 3 = 0.<br>(<i>x<\/i> + 3)(<i>x<\/i> − 1) = 0, so <i>x<\/i> = −3 or <i>x<\/i> = 1.<br>Check <i>x<\/i> = 1: √9 = 3 = 1 + 2 ✓. Check <i>x<\/i> = −3: √1 = 1 but −3 + 2 = −1 ✗.<br>Answer: <b>1 only<\/b>", "hint": "After squaring you get a quadratic. Test each of its roots in the original equation."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i><\/span><span><i>x<\/i> − 1<\/span><\/span> − <span class=\"fq\"><span>2<\/span><span><i>x<\/i><\/span><\/span> = 1<\/div>What is the solution to the equation?", "opts": ["1", "−2", "No solution", "2"], "ans": 3, "sol": "Excluded values: <i>x<\/i> ≠ 1 and <i>x<\/i> ≠ 0. Multiply every term by <i>x<\/i>(<i>x<\/i> − 1): <i>x<\/i><sup>2<\/sup> − 2(<i>x<\/i> − 1) = <i>x<\/i>(<i>x<\/i> − 1).<br><i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + 2 = <i>x<\/i><sup>2<\/sup> − <i>x<\/i>, so <i>x<\/i> = 2.<br>Check: <span class=\"fq\"><span>2<\/span><span>1<\/span><\/span> − <span class=\"fq\"><span>2<\/span><span>2<\/span><\/span> = 1 ✓.<br>Answer: <b>2<\/b>", "hint": "Use <i>x<\/i>(<i>x<\/i> − 1) as the LCD, and multiply the 1 on the right side too."}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "<div class=\"eqs\">|3<i>x<\/i> + 1| = 14<\/div>What is the greater of the two solutions to the equation?", "ans": ["13/3", "4.333"], "sol": "3<i>x<\/i> + 1 = 14 gives <i>x<\/i> = <span class=\"fq\"><span>13<\/span><span>3<\/span><\/span>.<br>3<i>x<\/i> + 1 = −14 gives <i>x<\/i> = −5.<br>The greater solution is <span class=\"fq\"><span>13<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>13<\/span><span>3<\/span><\/span><\/b>", "hint": "Find both solutions; one of them is positive."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "If <i>x<\/i> &gt; 0 and <i>x<\/i><sup>3/2<\/sup> = 64, what is the value of <i>x<\/i>?", "opts": ["16", "4", "8", "512"], "ans": 0, "sol": "Raise both sides to the power 2/3: <i>x<\/i> = 64<sup>2/3<\/sup>.<br>64<sup>2/3<\/sup> = (∛64)<sup>2<\/sup> = 4<sup>2<\/sup> = 16.<br>Answer: <b>16<\/b>", "hint": "Raise both sides to the reciprocal of 3/2, and take the root before the power."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\">√(5<i>x<\/i> − 6) = √(2<i>x<\/i> + 9)<\/div>What is the value of <i>x<\/i>?", "opts": ["1", "5", "<span class=\"fq\"><span>15<\/span><span>7<\/span><\/span>", "−5"], "ans": 1, "sol": "Square both sides: 5<i>x<\/i> − 6 = 2<i>x<\/i> + 9.<br>3<i>x<\/i> = 15, so <i>x<\/i> = 5.<br>Check: both radicands equal 19, which is not negative ✓.<br>Answer: <b>5<\/b>", "hint": "Squaring both sides removes both radicals at once."}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><span class=\"fq\"><span>2<\/span><span><i>x<\/i> − 3<\/span><\/span> + <span class=\"fq\"><span><i>x<\/i><\/span><span><i>x<\/i> + 3<\/span><\/span> = <span class=\"fq\"><span>12<\/span><span><i>x<\/i><sup>2<\/sup> − 9<\/span><\/span><\/div>What is the solution to the equation?", "ans": ["-2"], "sol": "<i>x<\/i><sup>2<\/sup> − 9 = (<i>x<\/i> − 3)(<i>x<\/i> + 3), so <i>x<\/i> ≠ ±3. Multiply every term by (<i>x<\/i> − 3)(<i>x<\/i> + 3): 2(<i>x<\/i> + 3) + <i>x<\/i>(<i>x<\/i> − 3) = 12.<br><i>x<\/i><sup>2<\/sup> − <i>x<\/i> + 6 = 12, so <i>x<\/i><sup>2<\/sup> − <i>x<\/i> − 6 = 0 and (<i>x<\/i> − 3)(<i>x<\/i> + 2) = 0.<br><i>x<\/i> = 3 is excluded, so <i>x<\/i> = −2.<br>Answer: <b>−2<\/b>", "hint": "Factor <i>x<\/i><sup>2<\/sup> − 9 to find the LCD, and compare your answers with the excluded values."}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\">|<i>x<\/i> − 4| = 2<i>x<\/i> + 1<\/div>Which of the following gives all solutions to the equation?", "opts": ["−5 only", "−5 and 1", "1 only", "No solution"], "ans": 2, "sol": "Case 1: <i>x<\/i> − 4 = 2<i>x<\/i> + 1 gives <i>x<\/i> = −5, but then 2<i>x<\/i> + 1 = −9 &lt; 0, so reject it.<br>Case 2: <i>x<\/i> − 4 = −(2<i>x<\/i> + 1) gives 3<i>x<\/i> = 3, so <i>x<\/i> = 1; check: |−3| = 3 = 2(1) + 1 ✓.<br>Answer: <b>1 only<\/b>", "hint": "An absolute value cannot equal a negative number, so check the right side for each case."}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "If <i>x<\/i> &gt; 0 and 3<i>x<\/i><sup>4/3<\/sup> = 48, what is the value of <i>x<\/i>?", "opts": ["4", "2", "64", "8"], "ans": 3, "sol": "Divide by 3: <i>x<\/i><sup>4/3<\/sup> = 16.<br>Raise to the power 3/4: <i>x<\/i> = 16<sup>3/4<\/sup> = (∜16)<sup>3<\/sup> = 2<sup>3<\/sup> = 8.<br>Answer: <b>8<\/b>", "hint": "Divide by 3 first. Then use the reciprocal exponent, taking the fourth root before cubing."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">√<i>x<\/i> + 5 = 12<\/div>What is the value of <i>x<\/i>?", "opts": ["7", "49", "17", "144"], "ans": 1, "sol": "Subtract 5: √<i>x<\/i> = 7.<br>Square: <i>x<\/i> = 49.<br>Answer: <b>49<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Which of the following gives all solutions to |<i>x<\/i> + 3| = 7?", "opts": ["4 and −10", "−4 and 10", "4 only", "−4 and −10"], "ans": 0, "sol": "<i>x<\/i> + 3 = 7 gives <i>x<\/i> = 4.<br><i>x<\/i> + 3 = −7 gives <i>x<\/i> = −10.<br>Answer: <b>4 and −10<\/b>"}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "<div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i> − 2<\/span><span>5<\/span><\/span> = <span class=\"fq\"><span><i>x<\/i> + 4<\/span><span>8<\/span><\/span><\/div>What is the solution to the equation?", "ans": ["12"], "sol": "Cross multiply: 8(<i>x<\/i> − 2) = 5(<i>x<\/i> + 4).<br>8<i>x<\/i> − 16 = 5<i>x<\/i> + 20, so 3<i>x<\/i> = 36.<br><i>x<\/i> = 12.<br>Answer: <b>12<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "If <i>x<\/i> &gt; 0 and <i>x<\/i><sup>1/4<\/sup> = 3, what is the value of <i>x<\/i>?", "opts": ["12", "<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>", "81", "27"], "ans": 2, "sol": "An exponent of 1/4 is a fourth root, so raise both sides to the 4th power.<br><i>x<\/i> = 3<sup>4<\/sup> = 81.<br>Answer: <b>81<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "A falling object's speed <i>v<\/i>, in meters per second, after it has fallen <i>d<\/i> meters is modeled by <i>v<\/i> = √(20<i>d<\/i>). According to the model, how many meters has the object fallen when its speed is 30 meters per second?", "opts": ["1.5", "600", "18,000", "45"], "ans": 3, "sol": "Substitute: 30 = √(20<i>d<\/i>).<br>Square: 900 = 20<i>d<\/i>.<br><i>d<\/i> = 45.<br>Answer: <b>45<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "How many solutions does the equation |<i>x<\/i> − 5| = −2 have?", "opts": ["2", "1", "0", "Infinitely many"], "ans": 2, "sol": "An absolute value is a distance, so it is never negative.<br>No value of <i>x<\/i> makes |<i>x<\/i> − 5| equal to −2.<br>Answer: <b>0<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "Working alone, pipe A fills a tank in 6 hours. With pipes A and B working together, the tank fills in 4 hours. The time <i>t<\/i>, in hours, that pipe B would take alone satisfies <span class=\"fq\"><span>1<\/span><span>6<\/span><\/span> + <span class=\"fq\"><span>1<\/span><span><i>t<\/i><\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>. What is the value of <i>t<\/i>?", "ans": ["12"], "sol": "Subtract <span class=\"fq\"><span>1<\/span ": "<div class=\"eqs\">|4<i>x<\/i> − 6| = 10<\/div>What is the product of the solutions to the equation?", "opts": ["4", "−1", "<span class=\"fq\"><span>8<\/span><span>3<\/span><\/span>", "−4"], "ans": 3, "sol": "4<i>x<\/i> − 6 = 10 gives <i>x<\/i> = 4.<br>4<i>x<\/i> − 6 = −10 gives <i>x<\/i> = −1.<br>Product: 4(−1) = −4.<br>Answer: <b>−4<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "If (2<i>x<\/i> − 1)<sup>1/3<\/sup> = 3, what is the value of <i>x<\/i>?", "opts": ["5", "13", "14", "<span class=\"fq\"><span>27<\/span><span>2<\/span><\/span>"], "ans": 2, "sol": "Cube both sides: 2<i>x<\/i> − 1 = 27.<br>2<i>x<\/i> = 28, so <i>x<\/i> = 14.<br>Answer: <b>14<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which of the following equations has no real solution?", "opts": ["√(<i>x<\/i> + 6) = 2", "√(<i>x<\/i> − 3) = 0", "√<i>x<\/i> − 6 = −2", "√(<i>x<\/i> − 3) + 6 = 2"], "ans": 3, "sol": "√(<i>x<\/i> + 6) = 2 gives <i>x<\/i> = −2; √(<i>x<\/i> − 3) = 0 gives <i>x<\/i> = 3; √<i>x<\/i> − 6 = −2 gives √<i>x<\/i> = 4 and <i>x<\/i> = 16.<br>√(<i>x<\/i> − 3) + 6 = 2 gives √(<i>x<\/i> − 3) = −4, but a square root is never negative.<br>Answer: <b>√(<i>x<\/i> − 3) + 6 = 2<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A cyclist rides 30 kilometers to a lake at an average speed of <i>r<\/i> kilometers per hour and returns along the same road at <i>r<\/i> + 5 kilometers per hour. The round trip takes 5 hours of riding, so <span class=\"fq\"><span>30<\/span><span><i>r<\/i><\/span><\/span> + <span class=\"fq\"><span>30<\/span><span><i>r<\/i> + 5<\/span><\/span> = 5. What is the value of <i>r<\/i>?", "opts": ["10", "3", "15", "−3"], "ans": 0, "sol": "Multiply by <i>r<\/i>(<i>r<\/i> + 5): 30(<i>r<\/i> + 5) + 30<i>r<\/i> = 5<i>r<\/i>(<i>r<\/i> + 5).<br>60<i>r<\/i> + 150 = 5<i>r<\/i><sup>2<\/sup> + 25<i>r<\/i>, so <i>r<\/i><sup>2<\/sup> − 7<i>r<\/i> − 30 = 0.<br>(<i>r<\/i> − 10)(<i>r<\/i> + 3) = 0; a speed cannot be negative, so <i>r<\/i> = 10.<br>Answer: <b>10<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "<div class=\"eqs\">√(<i>x<\/i> + 5) = 1 + √<i>x<\/i><\/div>What is the solution to the equation?", "ans": ["4"], "sol": "Square: <i>x<\/i> + 5 = 1 + 2√<i>x<\/i> + <i>x<\/i>.<br>So 4 = 2√<i>x<\/i>, √<i>x<\/i> = 2 and <i>x<\/i> = 4.<br>Check: √9 = 3 = 1 + 2 ✓.<br>Answer: <b>4<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\">|<i>x<\/i> + 2| = |2<i>x<\/i> − 7|<\/div>What is the sum of all solutions to the equation?", "opts": ["9", "6", "<span class=\"fq\"><span>32<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>"], "ans": 2, "sol": "<i>x<\/i> + 2 = 2<i>x<\/i> − 7 gives <i>x<\/i> = 9.<br><i>x<\/i> + 2 = −(2<i>x<\/i> − 7) gives 3<i>x<\/i> = 5, so <i>x<\/i> = <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>.<br>Sum: 9 + <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span> = <span class=\"fq\"><span>32<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>32<\/span><span>3<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "For planets orbiting the Sun, the orbital period <i>T<\/i>, in years, and the average distance from the Sun <i>a<\/i>, in astronomical units, are related by <i>T<\/i> = <i>a<\/i><sup>3/2<\/sup>. A dwarf planet has an orbital period of 8 years. What is its average distance from the Sun, in astronomical units?", "opts": ["2", "<span class=\"fq\"><span>16<\/span><span>3<\/span><\/span>", "16", "4"], "ans": 3, "sol": "Solve 8 = <i>a<\/i><sup>3/2<\/sup> by raising both sides to the power 2/3.<br><i>a<\/i> = 8<sup>2/3<\/sup> = (∛8)<sup>2<\/sup> = 2<sup>2<\/sup> = 4.<br>Answer: <b>4<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><span class=\"fq\"><span>2<i>x<\/i><\/span><span><i>x<\/i> − 3<\/span><\/span> = <span class=\"fq\"><span><i>a<\/i><\/span><span><i>x<\/i> − 3<\/span><\/span> + 1<\/div>In the equation, <i>a<\/i> is a constant. If the equation has no solut /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
