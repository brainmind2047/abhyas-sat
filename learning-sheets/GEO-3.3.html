<script>
(function(){
"use strict";
var S = {"id": "GEO-3.3", "unit": "Geometry and Trigonometry", "topic": "Right triangles, trigonometry and circles", "title": "Circles: arcs, angles and sectors", "intro": "This subtopic covers the measurements of a single circle: its radius, diameter, circumference and area, and the parts cut off by angles, namely arcs and sectors, in degrees and in radians. It also covers the angle and right-triangle facts the DSAT uses most often in circles: an inscribed angle is half the central angle, a tangent is perpendicular to the radius, and a radius drawn to a chord forms a right triangle.", "los": [{"id": "LO1", "text": "Calculate the radius, diameter, circumference or area of a circle from any one of these measurements."}, {"id": "LO2", "text": "Determine arc measures, arc lengths and sector areas from a central angle in degrees by treating each as a fraction of the whole circle."}, {"id": "LO3", "text": "Convert between degrees and radians, and use radian measure to find arc length, sector area or a central angle."}, {"id": "LO4", "text": "Apply the relationship between inscribed and central angles, including angles inscribed in a semicircle, to find angle and arc measures."}, {"id": "LO5", "text": "Solve for lengths in circles by using the facts that a tangent is perpendicular to a radius and that the perpendicular from the center bisects a chord."}], "notes": [{"lo": "LO1", "h": "Radius, diameter, circumference and area", "html": "<p>Every point on a circle is the same distance from its center. That distance is the <b>radius<\/b> <i>r<\/i>. A <b>diameter<\/b> is a chord through the center, so its length is <i>d<\/i> = 2<i>r<\/i>. The <b>circumference<\/b> is the distance around the circle.<\/p><div class=\"eqs\"><i>C<\/i> = 2π<i>r<\/i> = π<i>d<\/i><br><i>A<\/i> = π<i>r<\/i><sup>2<\/sup><\/div><p>Both formulas are on the DSAT reference sheet, so the real skill is feeding them the right number. Whatever measurement you are given, turn it into the radius first.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Given<\/th><th>Radius<\/th><th>Then<\/th><\/tr><tr><td><i>d<\/i> = 10<\/td><td><i>r<\/i> = 5<\/td><td><i>C<\/i> = 10π, <i>A<\/i> = 25π<\/td><\/tr><tr><td><i>C<\/i> = 12π<\/td><td><i>r<\/i> = 6<\/td><td><i>A<\/i> = 36π<\/td><\/tr><tr><td><i>A<\/i> = 100π<\/td><td><i>r<\/i> = 10<\/td><td><i>C<\/i> = 20π<\/td><\/tr><\/table><\/div><div class=\"rule\">Convert any given measurement to the radius before you use a circle formula.<\/div><div class=\"tip\">DSAT tip: answer choices are usually left in terms of π. If the choices are decimals, use the π key on your calculator or in Desmos instead of 3.14.<\/div>"}, {"lo": "LO2", "h": "Central angles and arc measure", "html": "<p>A <b>central angle<\/b> has its vertex at the center of the circle, and its sides are two radii. The part of the circle between those radii is an <b>arc<\/b>, and the measure of the arc in degrees equals the central angle.<\/p><ul><li>A <b>minor arc<\/b> measures less than 180° and is named by its two endpoints, such as arc <i>A<\/i><i>B<\/i>.<\/li><li>A <b>major arc<\/b> measures more than 180° and is named with three points, such as arc <i>A<\/i><i>C<\/i><i>B<\/i>.<\/li><li>A <b>semicircle<\/b> measures exactly 180°.<\/li><\/ul><div class=\"rule\">Minor arc + major arc = 360°. A central angle of <i>θ<\/i>° cuts off the fraction <span class=\"fq\"><span><i>θ<\/i><\/span><span>360<\/span><\/span> of the circle.<\/div><p>Arc <b>measure<\/b> (in degrees) is not the same as arc <b>length<\/b> (a distance). A 60° arc on a small circle and a 60° arc on a large circle have the same measure, but the arc on the large circle is longer.<\/p>"}, {"lo": "LO2", "h": "Arc length and sector area as fractions", "html": "<p>An arc is part of the circumference, and a <b>sector<\/b> (the slice bounded by two radii and an arc) is part of the area. Each is the same fraction of the whole as the central angle is of 360°.<\/p><div class=\"eqs\"><span class=\"fq\"><span>arc length<\/span><span>2π<i>r<\/i><\/span><\/span> = <span class=\"fq\"><span><i>θ<\/i><\/span><span>360<\/span><\/span> = <span class=\"fq\"><span>sector area<\/span><span>π<i>r<\/i><sup>2<\/sup><\/span><\/span><\/div><p>For a radius of 6 and a central angle of 120°, the fraction is <span class=\"fq\"><span>120<\/span><span>360<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>. The arc length is <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(12π) = 4π, and the sector area is <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(36π) = 12π.<\/p><div class=\"rule\">Arc length = <span class=\"fq\"><span><i>θ<\/i><\/span><span>360<\/span><\/span> × 2π<i>r<\/i> and sector area = <span class=\"fq\"><span><i>θ<\/i><\/span><span>360<\/span><\/span> × π<i>r<\/i><sup>2<\/sup>, with <i>θ<\/i> in degrees.<\/div><div class=\"tip\">DSAT tip: the proportion works in every direction. If you know any two of its pieces, cross multiply to find another, for example the central angle from a sector area, or the radius from an arc length.<\/div>"}, {"lo": "LO3", "h": "Radians and converting angle measures", "html": "<p>A <b>radian<\/b> is the central angle whose arc is exactly one radius long. The whole circumference is 2π<i>r<\/i>, which is 2π radius lengths, so a full turn is 2π radians.<\/p><div class=\"eqs\">360° = 2π radians, so 180° = π radians<\/div><div class=\"rule\">Degrees to radians: multiply by <span class=\"fq\"><span>π<\/span><span>180<\/span><\/span>. Radians to degrees: multiply by <span class=\"fq\"><span>180<\/span><span>π<\/span><\/span>.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Degrees<\/th><td>30°<\/td><td>45°<\/td><td>60°<\/td><td>90°<\/td><td>180°<\/td><td>270°<\/td><\/tr><tr><th>Radians<\/th><td><span class=\"fq\"><span>π<\/span><span>6<\/span><\/span><\/td><td><span class=\"fq\"><span>π<\/span><span>4<\/span><\/span><\/td><td><span class=\"fq\"><span>π<\/span><span>3<\/span><\/span><\/td><td><span class=\"fq\"><span>π<\/span><span>2<\/span><\/span><\/td><td>π<\/td><td><span class=\"fq\"><span>3π<\/span><span>2<\/span><\/span><\/td><\/tr><\/table><\/div><p>For example, 150° × <span class=\"fq\"><span>π<\/span><span>180<\/span><\/span> = <span class=\"fq\"><span>150π<\/span><span>180<\/span><\/span> = <span class=\"fq\"><span>5π<\/span><span>6<\/span><\/span> radians, and going back, <span class=\"fq\"><span>5π<\/span><span>6<\/span><\/span> × <span class=\"fq\"><span>180<\/span><span>π<\/span><\/span> = 150°.<\/p><div class=\"tip\">A radian measure without π is still valid. An angle of 2 radians is 2 × <span class=\"fq\"><span>180<\/span><span>π<\/span><\/span> ≈ 114.6°, a little less than 120°.<\/div>"}, {"lo": "LO3", "h": "Arc length and sector area in radians", "html": "<p>With the central angle in radians, the fraction of the circle is <span class=\"fq\"><span><i>θ<\/i><\/span><span>2π<\/span><\/span>, and the formulas become shorter:<\/p><div class=\"eqs\"><i>s<\/i> = <i>r<\/i><i>θ<\/i><br>sector area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>r<\/i><sup>2<\/sup><i>θ<\/i><\/div><p>Here <i>s<\/i> is the arc length and <i>θ<\/i> is in radians. For a radius of 10 and <i>θ<\/i> = <span class=\"fq\"><span>π<\/span><span>5<\/span><\/span>, the arc length is 10 × <span class=\"fq\"><span>π<\/span><span>5<\/span><\/span> = 2π and the sector area is <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(100)(<span class=\"fq\"><span>π<\/span><span>5<\/span><\/span>) = 10π.<\/p><div class=\"rule\">Use <i>s<\/i> = <i>r<\/i><i>θ<\/i> and <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>r<\/i><sup>2<\/sup><i>θ<\/i> only with radians. If the angle is in degrees, convert it first or use the fraction of 360° method.<\/div><p>Rearranged, <i>θ<\/i> = <span class=\"fq\"><span><i>s<\/i><\/span><span><i>r<\/i><\/span><\/span>: the radian measure of a central angle is the arc length divided by the radius. Because it is a length divided by a length, a radian measure has no unit. Also notice that sector area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>r<\/i><i>s<\/i>, which is handy when you know the radius and the arc length.<\/p>"}, {"lo": "LO4", "h": "Inscribed angles", "html": "<p>An <b>inscribed angle<\/b> has its vertex on the circle, and its sides are two chords. The arc that lies inside the angle is its <b>intercepted arc<\/b>.<\/p><div class=\"rule\">An inscribed angle measures half of its intercepted arc, which is half of the central angle that intercepts the same arc.<\/div><div class=\"eqs\">inscribed angle = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> × intercepted arc<\/div><ul><li>If a central angle measures 100°, an inscribed angle that intercepts the same arc measures 50°.<\/li><li>Inscribed angles that intercept the same arc are equal, wherever their vertices are on the rest of the circle.<\/li><li>An angle inscribed in a semicircle is a right angle, because it intercepts a 180° arc. So a triangle with a diameter as one side and its third vertex on the circle is a right triangle.<\/li><\/ul><div class=\"tip\">DSAT tip: whenever you see a diameter and a point on the circle, mark the 90° angle at that point at once. The Pythagorean theorem or the triangle angle sum usually finishes the problem.<\/div>"}, {"lo": "LO5", "h": "Tangent lines", "html": "<p>A <b>tangent<\/b> line touches a circle at exactly one point, called the point of tangency.<\/p><div class=\"rule\">A tangent line is perpendicular to the radius drawn to the point of tangency.<\/div><p>So the radius, the tangent segment from an outside point <i>P<\/i>, and the segment from <i>P<\/i> to the center form a right triangle. The segment to the center is the <b>hypotenuse<\/b>:<\/p><div class=\"eqs\"><i>r<\/i><sup>2<\/sup> + (tangent length)<sup>2<\/sup> = (distance from <i>P<\/i> to center)<sup>2<\/sup><\/div><p>Two tangent segments drawn to a circle from the same outside point are equal in length. Together with the two radii they form a kite with right angles at the points of tangency, so the angle between the tangents and the central angle between the radii add up to 180°.<\/p><div class=\"tip\">DSAT tip: the closest point of the circle to <i>P<\/i> lies on the segment from <i>P<\/i> to the center, so the distance from <i>P<\/i> to the circle is (distance to center) − <i>r<\/i>.<\/div>"}, {"lo": "LO5", "h": "Chords and right triangles", "html": "<p>A <b>chord<\/b> is a segment whose endpoints are both on the circle. A diameter is the longest chord.<\/p><div class=\"rule\">The perpendicular segment from the center to a chord bisects the chord.<\/div><p>Draw a radius to one endpoint of the chord. The radius is the hypotenuse of a right triangle whose legs are the distance from the center to the chord and <b>half<\/b> of the chord:<\/p><div class=\"eqs\"><i>r<\/i><sup>2<\/sup> = <i>d<\/i><sup>2<\/sup> + (<span class=\"fq\"><span>chord<\/span><span>2<\/span><\/span>)<sup>2<\/sup><\/div><p>Here <i>d<\/i> is the distance from the center to the chord, not the diameter. For a radius of 5 and a chord of length 8, half the chord is 4, so the chord is √(25 − 16) = 3 units from the center. Chords that are the same distance from the center are equal in length, and longer chords lie closer to the center.<\/p><div class=\"tip\">DSAT tip: look for Pythagorean triples such as (3, 4, 5), (5, 12, 13) and (8, 15, 17) and their multiples. They make most right triangles in circles quick to solve.<\/div>"}], "examples": [{"lo": "LO1", "q": "The circumference of a circle is 18π centimeters. What is the area of the circle?", "steps": ["Use <i>C<\/i> = 2π<i>r<\/i>: 2π<i>r<\/i> = 18π, so <i>r<\/i> = 9 centimeters.", "Use <i>A<\/i> = π<i>r<\/i><sup>2<\/sup>: <i>A<\/i> = π(9)<sup>2<\/sup> = 81π."], "ans": "81π square centimeters (about 254.5 square centimeters)"}, {"lo": "LO2", "q": "<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"Circle with center O and radius 10. Radii OA and OB form a central angle of 72 degrees; minor arc AB is between them.\"><circle class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" cx=\"130\" cy=\"120\" r=\"90\"/><line class=\"fg-edge\" x1=\"130\" y1=\"120\" x2=\"218.63\" y2=\"104.37\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"130\" y1=\"120\" x2=\"142.53\" y2=\"30.88\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"143.79,117.57 143.64,116.85 143.46,116.14 143.24,115.44 142.98,114.76 142.69,114.08 142.36,113.43 142,112.79 141.61,112.17 141.18,111.57 140.72,111 140.24,110.45 139.73,109.93 139.18,109.43 138.62,108.97 138.03,108.53 137.42,108.13 136.79,107.76 136.14,107.42 135.47,107.11 134.79,106.84 134.09,106.61 133.39,106.42 132.67,106.26 131.95,106.14\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"130\" cy=\"120\"/><circle r=\"3\" cx=\"218.63\" cy=\"104.37\"/><circle r=\"3\" cx=\"142.53\" cy=\"30.88\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"120.1\" y=\"134.4\" text-anchor=\"middle\" font-style=\"italic\">O<\/text><text x=\"232.42\" y=\"106.44\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"144.47\" y=\"21.51\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"176.23\" y=\"127.52\" text-anchor=\"middle\">10<\/text><text x=\"150.84\" y=\"102.92\" text-anchor=\"middle\">72°<\/text><\/g><\/svg>In the figure, <i>O<\/i> is the center of the circle, the radius is 10 inches, and central angle <i>A<\/i><i>O<\/i><i>B<\/i> measures 72°. What is the length of minor arc <i>A<\/i><i>B<\/i>?", "steps": ["The arc is <span class=\"fq\"><span>72<\/span><span>360<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>5<\/span><\/span> of the circle.", "The circumference is 2π(10) = 20π inches.", "Arc length = <span class=\"fq\"><span>1<\/span><span>5<\/span><\/span>(20π) = 4π inches. Its arc measure is still 72°; the length is a distance."], "ans": "4π inches (about 12.6 inches)"}, {"lo": "LO3", "q": "Convert 210° to radians, and convert <span class=\"fq\"><span>5π<\/span><span>4<\/span><\/span> radians to degrees.", "steps": ["Degrees to radians: 210 × <span class=\"fq\"><span>π<\/span><span>180<\/span><\/span> = <span class=\"fq\"><span>210π<\/span><span>180<\/span><\/span> = <span class=\"fq\"><span>7π<\/span><span>6<\/span><\/span>.", "Radians to degrees: <span class=\"fq\"><span>5π<\/span><span>4<\/span><\/span> × <span class=\"fq\"><span>180<\/span><span>π<\/span><\/span> = <span class=\"fq\"><span>900<\/span><span>4<\/span><\/span> = 225."], "ans": "210° = <span class=\"fq\"><span>7π<\/span><span>6<\/span><\/span> radians and <span class=\"fq\"><span>5π<\/span><span>4<\/span><\/span> radians = 225°"}, {"lo": "LO3", "q": "(SPR) A sector of a circle with radius 6 has a central angle of <span class=\"fq\"><span>2π<\/span><span>3<\/span><\/span> radians. The area of the sector is <i>k<\/i>π square units. What is the value of <i>k<\/i>?", "steps": ["With radians, sector area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>r<\/i><sup>2<\/sup><i>θ<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(36)(<span class=\"fq\"><span>2π<\/span><span>3<\/span><\/span>).", "<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(36) = 18, and 18 × <span class=\"fq\"><span>2π<\/span><span>3<\/span><\/span> = 12π.", "Check with fractions: <span class=\"fq\"><span>2π<\/span><span>3<\/span><\/span> is <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> of 2π, and <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> of 36π is 12π ✓."], "ans": "<i>k<\/i> = 12"}, {"lo": "LO4", "q": "<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"Circle with center O. Points A, B and C lie on the circle, with C on the major arc. Radii OA and OB form a central angle of 110 degrees, and chords CA and CB form angle ACB.\"><circle class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" cx=\"130\" cy=\"120\" r=\"90\"/><line class=\"fg-edge\" x1=\"130\" y1=\"120\" x2=\"45.43\" y2=\"150.78\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"130\" y1=\"120\" x2=\"187.85\" y2=\"188.94\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"153.29\" y1=\"33.07\" x2=\"45.43\" y2=\"150.78\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"153.29\" y1=\"33.07\" x2=\"187.85\" y2=\"188.94\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"118.72,124.1 119.09,124.99 119.52,125.85 120.02,126.67 120.59,127.44 121.21,128.17 121.89,128.85 122.63,129.47 123.41,130.03 124.23,130.52 125.09,130.95 125.98,131.31 126.89,131.59 127.83,131.8 128.78,131.94 129.74,132 130.7,131.98 131.65,131.89 132.6,131.72 133.53,131.47 134.43,131.15 135.31,130.76 136.15,130.3 136.95,129.78 137.71,129.19\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"130\" cy=\"120\"/><circle r=\"3\" cx=\"45.43\" cy=\"150.78\"/><circle r=\"3\" cx=\"187.85\" cy=\"188.94\"/><circle r=\"3\" cx=\"153.29\" cy=\"33.07\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"130\" y=\"110.5\" text-anchor=\"middle\" font-style=\"italic\">O<\/text><text x=\"32.27\" y=\"160.07\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"196.85\" y=\"204.17\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"156.92\" y=\"24.04\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"123.01\" y=\"150.58\" text-anchor=\"middle\">110°<\/text><\/g><\/svg>In the figure, points <i>A<\/i>, <i>B<\/i> and <i>C<\/i> lie on the circle with center <i>O<\/i>, and angle <i>A<\/i><i>O<\/i><i>B<\/i> measures 110°. What is the measure of angle <i>A<\/i><i>C<\/i><i>B<\/i>?<br>A) 35°&nbsp;&nbsp; B) 55°&nbsp;&nbsp; C) 110°&nbsp;&nbsp; D) 220°", "steps": ["Angle <i>A<\/i><i>C<\/i><i>B<\/i> has its vertex on the circle, so it is an inscribed angle. It intercepts minor arc <i>A<\/i><i>B<\/i>.", "Central angle <i>A<\/i><i>O<\/i><i>B<\/i> intercepts the same arc, so arc <i>A<\/i><i>B<\/i> measures 110°.", "The inscribed angle is half of that: <span class=\"fq\"><span>110<\/span><span>2<\/span><\/span> = 55°. Choice D doubles instead of halving."], "ans": "B) 55°"}, {"lo": "LO5", "q": "<svg class=\"fig\" viewBox=\"0 0 320 220\" role=\"img\" aria-label=\"Circle with center O and radius OA of length 5. Line PA is tangent to the circle at A, and PA has length 12. Segment OP joins the center to the outside point P. A right-angle mark is at A.\"><circle class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" cx=\"102.22\" cy=\"117.22\" r=\"72.22\"/><line class=\"fg-edge\" x1=\"82\" y1=\"30.56\" x2=\"290\" y2=\"117.22\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"102.22\" y1=\"117.22\" x2=\"130\" y2=\"50.56\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"102.22\" y1=\"117.22\" x2=\"290\" y2=\"117.22\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"126.54,58.86 134.85,62.32 138.31,54.02\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"102.22\" cy=\"117.22\"/><circle r=\"3\" cx=\"130\" cy=\"50.56\"/><circle r=\"3\" cx=\"290\" cy=\"117.22\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"93.22\" y=\"132.45\" text-anchor=\"middle\" font-style=\"italic\">O<\/text><text x=\"127.57\" y=\"41.27\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"304\" y=\"121.72\" text-anchor=\"middle\" font-style=\"italic\">P<\/text><text x=\"105.96\" y=\"84.16\" text-anchor=\"middle\">5<\/text><text x=\"214.23\" y=\"78.24\" text-anchor=\"middle\">12<\/text><\/g><\/svg>In the figure, line <i>P<\/i><i>A<\/i> is tangent to the circle with center <i>O<\/i> at point <i>A<\/i>. If <i>O<\/i><i>A<\/i> = 5 and <i>P<\/i><i>A<\/i> = 12, what is <i>O<\/i><i>P<\/i>?", "steps": ["A tangent is perpendicular to the radius at the point of tangency, so angle <i>O<\/i><i>A<\/i><i>P<\/i> = 90°.", "<i>O<\/i><i>P<\/i> is the hypotenuse of right triangle <i>O<\/i><i>A<\/i><i>P<\/i>: <i>O<\/i><i>P<\/i><sup>2<\/sup> = 5<sup>2<\/sup> + 12<sup>2<\/sup> = 169.", "<i>O<\/i><i>P<\/i> = 13, a (5, 12, 13) triple."], "ans": "<i>O<\/i><i>P<\/i> = 13"}, {"lo": "LO5", "q": "<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"Circle with center O and radius 10. Chord AB has length 16. A dashed segment from O meets AB at M with a right angle, and a dashed radius joins O to A.\"><circle class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" cx=\"130\" cy=\"120\" r=\"90\"/><line class=\"fg-edge\" x1=\"58\" y1=\"174\" x2=\"202\" y2=\"174\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"130\" y1=\"120\" x2=\"130\" y2=\"174\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"130\" y1=\"120\" x2=\"58\" y2=\"174\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"130,166 138,166 138,174\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"130\" cy=\"120\"/><circle r=\"3\" cx=\"58\" cy=\"174\"/><circle r=\"3\" cx=\"202\" cy=\"174\"/><circle r=\"3\" cx=\"130\" cy=\"174\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"130\" y=\"110.5\" text-anchor=\"middle\" font-style=\"italic\">O<\/text><text x=\"44.84\" y=\"183.29\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"215.16\" y=\"183.29\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"137.5\" y=\"191.49\" text-anchor=\"middle\" font-style=\"italic\">M<\/text><text x=\"87.4\" y=\"142.7\" text-anchor=\"middle\">10<\/text><text x=\"170\" y=\"192.5\" text-anchor=\"middle\">16<\/text><\/g><\/svg>A circle with center <i>O<\/i> has radius 10. Chord <i>A<\/i><i>B<\/i> has length 16, and <i>M<\/i> is the point on <i>A<\/i><i>B<\/i> closest to <i>O<\/i>. How far is the chord from the center?", "steps": ["The shortest segment <i>O<\/i><i>M<\/i> is perpendicular to the chord, so it bisects it: <i>A<\/i><i>M<\/i> = 8.", "In right triangle <i>O<\/i><i>M<\/i><i>A<\/i>, the radius <i>O<\/i><i>A<\/i> = 10 is the hypotenuse.", "<i>O<\/i><i>M<\/i><sup>2<\/sup> = 10<sup>2<\/sup> − 8<sup>2<\/sup> = 36, so <i>O<\/i><i>M<\/i> = 6."], "ans": "6 units"}], "traps": ["Using the diameter as the radius: a circle with diameter 10 has area 25π, not 100π. Halve the diameter before you square.", "Mixing up arc measure and arc length: arc measure is in degrees and equals the central angle, while arc length is a distance that depends on the radius.", "Using <i>s<\/i> = <i>r<\/i><i>θ<\/i> or <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>r<\/i><sup>2<\/sup><i>θ<\/i> with <i>θ<\/i> in degrees. These formulas need radians; with degrees, use the fraction <span class=\"fq\"><span><i>θ<\/i><\/span><span>360<\/span><\/span>.", "Doubling an inscribed angle when you should halve it, or the reverse. The angle at the center is always the larger one: central = 2 × inscribed.", "Treating the tangent segment as the hypotenuse. The radius meets the tangent at a right angle, so the segment from the outside point to the center is the hypotenuse.", "Using the whole chord in the right triangle. The perpendicular from the center cuts the chord in half, and only the half chord is a leg."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A circle has a diameter of 14. What is the area of the circle?", "opts": ["49π", "7π", "14π", "196π"], "ans": 0, "sol": "The radius is half the diameter: <i>r<\/i> = 7.<br><i>A<\/i> = π(7)<sup>2<\/sup> = 49π.<br>Answer: <b>49π<\/b>", "hint": "The area formula uses the radius, not the diameter."}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "The area of a circle is 64π square units. The circumference of the circle is <i>k<\/i>π units. What is the value of <i>k<\/i>?", "ans": ["16"], "sol": "π<i>r<\/i><sup>2<\/sup> = 64π, so <i>r<\/i><sup>2<\/sup> = 64 and <i>r<\/i> = 8.<br><i>C<\/i> = 2π(8) = 16π, so <i>k<\/i> = 16.<br>Answer: <b>16<\/b>", "hint": "Find the radius from the area first, then use the circumference formula."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Points <i>A<\/i> and <i>B<\/i> lie on a circle with center <i>O<\/i>, and central angle <i>A<\/i><i>O<\/i><i>B<\/i> measures 40°. What is the measure of the major arc from <i>A<\/i> to <i>B<\/i>?", "opts": ["20°", "320°", "40°", "140°"], "ans": 1, "sol": "Minor arc <i>A<\/i><i>B<\/i> has the same measure as the central angle: 40°.<br>The major arc is the rest of the circle: 360° − 40° = 320°.<br>Answer: <b>320°<\/b>", "hint": "The minor arc and the major arc together make up the whole circle."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"Circle with center O and radius OA of length 9. Radii OA and OB form a central angle of 80 degrees, and the sector between them is shaded.\"><polygon class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"none\" points=\"130,120 216.93,96.71 216.37,94.69 215.76,92.69 215.1,90.7 214.39,88.73 213.64,86.77 212.85,84.83 212,82.92 211.12,81.02 210.19,79.14 209.22,77.29 208.2,75.45 207.15,73.65 206.05,71.86 204.9,70.11 203.72,68.38 202.5,66.68 201.24,65 199.94,63.36 198.61,61.75 197.23,60.17 195.82,58.62 194.38,57.11 192.89,55.62 191.38,54.18 189.83,52.77 188.25,51.39 186.64,50.06 185,48.76 183.32,47.5 181.62,46.28 179.89,45.1 178.14,43.95 176.35,42.85 174.55,41.8 172.71,40.78 170.86,39.81 168.98,38.88 167.08,38 165.17,37.15 163.23,36.36 161.27,35.61 159.3,34.9 157.31,34.24 155.31,33.63 153.29,33.07 151.26,32.55 149.22,3 )<sup>2<\/sup> = 81π.<br>Sector area = <span class=\"fq\"><span>2<\/span><span>9<\/span><\/span>(81π) = 18π.<br>Answer: <b>18π<\/b>", "hint": "What fraction of 360° is 80°? Take that fraction of the area of the whole circle, not of its circumference."}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A sector of a circle has an arc length of 5π and an area of 30π. What is the radius of the circle?", "ans": ["12"], "sol": "Let <i>f<\/i> be the fraction of the circle. Then <i>f<\/i>(2π<i>r<\/i>) = 5π and <i>f<\/i>(π<i>r<\/i><sup>2<\/sup>) = 30π.<br>Divide the second equation by the first: <span class=\"fq\"><span><i>r<\/i><\/span><span>2<\/span><\/span> = 6.<br>So <i>r<\/i> = 12 (and <i>f<\/i> = <span class=\"fq\"><span>5<\/span><span>24<\/span><\/span>, a 75° sector).<br>Answer: <b>12<\/b>", "hint": "The arc and the sector are the same fraction of the circle. Dividing the sector area by the arc length makes that fraction cancel."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Which radian measure is equivalent to 240°?", "opts": ["<span class=\"fq\"><span>2π<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>3π<\/span><span>4<\/span><\/span>", "<span class=\"fq\"><span>5π<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>4π<\/span><span>3<\/span><\/span>"], "ans": 3, "sol": "Multiply by <span class=\"fq\"><span>π<\/span><span>180<\/span><\/span>: 240 × <span class=\"fq\"><span>π<\/span><span>180<\/span><\/span> = <span class=\"fq\"><span>240π<\/span><span>180<\/span><\/span>.<br>Reduce by 60: <span class=\"fq\"><span>4π<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>4π<\/span><span>3<\/span><\/span><\/b>", "hint": "Multiply by <span class=\"fq\"><span>π<\/span><span>180<\/span><\/span>, then reduce the fraction completely."}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A central angle of <span class=\"fq\"><span>3π<\/span><span>4<\/span><\/span> radians intercepts an arc on a circle with radius 8. The length of the arc is <i>k<\/i>π. What is the value of <i>k<\/i>?", "ans": ["6"], "sol": "With the angle in radians, <i>s<\/i> = <i>r<\/i><i>θ<\/i>.<br><i>s<\/i> = 8 × <span class=\"fq\"><span>3π<\/span><span>4<\/span><\/span> = 6π.<br>Answer: <b>6<\/b>", "hint": "When the angle is in radians, the arc length is the radius times the angle."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"Circle with center O. Points A, B and C lie on the circle, with C on the major arc. Chords CA and CB form an inscribed angle of 34 degrees at C, and radii OA and OB are drawn.\"><circle class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" cx=\"130\" cy=\"120\" r=\"90\"/><line class=\"fg-edge\" x1=\"130\" y1=\"120\" x2=\"56.28\" y2=\"171.62\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"130\" y1=\"120\" x2=\"150.25\" y2=\"207.69\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"160.78\" y1=\"35.43\" x2=\"56.28\" y2=\"171.62\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"160.78\" y1=\"35.43\" x2=\"150.25\" y2=\"207.69\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"148.61,51.29 149,51.59 149.41,51.88 149.82,52.15 150.23,52.42 150.66,52.67 151.09,52.92 151.52,53.15 151.96,53.38 152.41,53.59 152.86,53.79 153.32,53.98 153.78,54.16 154.24,54.33 154.71,54.48 155.19,54.63 155.66,54.76 156.14,54.88 156.62,54.99 157.11,55.09 157.6,55.17 158.08,55.24 158.58,55.31 159.07,55.35 159.56,55.39\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"130\" cy=\"120\"/><circle r=\"3\" cx=\"56.28\" cy=\"171.62\"/><circle r=\"3\" cx=\"150.25\" cy=\"207.69\"/><circle r=\"3\" cx=\"160.78\" cy=\"35.43\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"116.84\" y=\"119.71\" text-anchor=\"middle\" font-style=\"italic\">O<\/text><text x=\"44.81\" y=\"184.15\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"153.39\" y=\"225.83\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"165.57\" y=\"26.77\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"148.17\" y=\"73.65\" text-anchor=\"middle\">34°<\/text><\/g><\/svg>In the figure, points <i>A<\/i>, <i>B<\/i> and <i>C<\/i> lie on the circle with center <i>O<\/i>, and angle <i>A<\/i><i>C<\/i><i>B<\/i> measures 34°. What is the measure of angle <i>A<\/i><i>O<\/i><i>B<\/i>?", "opts": ["17°", "68°", "34°", "146°"], "ans": 1, "sol": "Angle <i>A<\/i><i>C<\/i><i>B<\/i> is inscribed and intercepts arc <i>A<\/i><i>B<\/i>.<br>Central angle <i>A<\/i><i>O<\/i><i>B<\/i> intercepts the same arc, so it is twice as large: 2 × 34° = 68°.<br>Answer: <b>68°<\/b>", "hint": "One angle has its vertex at the center and the other on the circle. Which one is larger?"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Segment <i>A<\/i><i>B<\/i> is a diameter of a circle, and point <i>C<\/i> lies on the circle. If angle <i>C<\/i><i>A<\/i><i>B<\/i> measures 28°, what is the measure of angle <i>A<\/i><i>B<\/i><i>C<\/i>?", "opts": ["28°", "56°", "62°", "152°"], "ans": 2, "sol": "Angle <i>A<\/i><i>C<\/i><i>B<\/i> is inscribed in a semicircle, so it measures 90°.<br>The angles of triangle <i>A<\/i><i>B<\/i><i>C<\/i> add to 180°: 180° − 90° − 28° = 62°.<br>Answer: <b>62°<\/b>", "hint": "What do you know about angle <i>A<\/i><i>C<\/i><i>B<\/i> when <i>A<\/i><i>B<\/i> is a diameter?"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Points <i>A<\/i>, <i>B<\/i>, <i>C<\/i> and <i>D<\/i> lie on a circle, with <i>C<\/i> and <i>D<\/i> on the same side of chord <i>A<\/i><i>B<\/i>. Angle <i>A<\/i><i>C<\/i><i>B<\/i> measures (5<i>x<\/i> − 17)° and angle <i>A<\/i><i>D<\/i><i>B<\/i> measures (3<i>x<\/i> + 5)°. What is the measure of arc <i>A<\/i><i>B<\/i> intercepted by both angles?", "opts": ["11°", "19°", "38°", "76°"], "ans": 3, "sol": "Both inscribed angles intercept arc <i>A<\/i><i>B<\/i>, so they are equal: 5<i>x<\/i> − 17 = 3<i>x<\/i> + 5, which gives <i>x<\/i> = 11.<br>Each angle measures 3(11) + 5 = 38°.<br>The intercepted arc is twice the inscribed angle: 2 × 38° = 76°.<br>Answer: <b>76°<\/b>", "hint": "Inscribed angles that intercept the same arc are equal. After you find <i>x<\/i>, check what the question actually asks for."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 320 220\" role=\"img\" aria-label=\"Circle with center O. Segments PA and PB are tangent to the circle at A and B, and they form an angle of 50 degrees at the outside point P. Radii OA and OB are drawn, with right-angle marks at A and B.\"><circle class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" cx=\"107.24\" cy=\"110\" r=\"77.24\"/><line class=\"fg-edge\" x1=\"290\" y1=\"110\" x2=\"139.88\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"290\" y1=\"110\" x2=\"139.88\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"107.24\" y1=\"110\" x2=\"139.88\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"107.24\" y1=\"110\" x2=\"139.88\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"136.08,48.16 144.23,51.96 148.04,43.8\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"136.08,171.84 144.23,168.04 148.04,176.2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"270.06,100.7 269.74,101.43 269.44,102.18 269.17,102.93 268.92,103.69 268.71,104.46 268.52,105.24 268.36,106.02 268.23,106.81 268.13,107.6 268.06,108.4 268.01,109.2 268,110 268.01,110.8 268.06,111.6 268.13,112.4 268.23,113.19 268.36,113.98 268.52,114.76 268.71,115.54 268.92,116.31 269.17,117.07 269.44,117.82 269.74,118.57 270.06,119.3\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"107.24\" cy=\"110\"/><circle r=\"3\" cx=\"139.88\" cy=\"40\"/><circle r=\"3\" cx=\"139.88\" cy=\"180\"/><circle r=\"3\" cx=\"290\" cy=\"110\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"93.24\" y=\"114.5\" text-anchor=\"middle\" font-style=\"italic\">O<\/text><text x=\"139.88\" y=\"30.5\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"139.88\" y=\"198.5\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"304\" y=\"114.5\" text-anchor=\"middle\" font-style=\"italic\">P<\/text><text x=\"252\" y=\"114.5\" text-anchor=\"middle\">50°<\/text><\/g><\/svg>In the figure, <i>P<\/i><i>A<\/i> and <i>P<\/i><i>B<\/i> are tangent to the circle with center <i>O<\/i> at <i>A<\/i> and <i>B<\/i>. If angle <i>A<\/i><i>P<\/i><i>B<\/i> measures 50°, what is the measure of angle <i>A<\/i><i>O<\/i><i>B<\/i>?", "opts": ["130°", "50°", "100°", "140°"], "ans": 0, "sol": "Each radius is perpendicular to its tangent, so angles <i>O<\/i><i>A<\/i><i>P<\/i> and <i>O<\/i><i>B<\/i><i>P<\/i> are 90°.<br>The angles of quadrilateral <i>O<\/i><i>A<\/i><i>P<\/i><i>B<\/i> add to 360°: 360° − 90° − 90° − 50° = 130°.<br>Answer: <b>130°<\/b>", "hint": "Mark the right angles where each radius meets a tangent, then use the angle sum of a quadrilateral."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "In a circle, a chord of length 24 is 5 units from the center of the circle. What is the radius of the circle?", "opts": ["12", "17", "13", "26"], "ans": 2, "sol": "The perpendicular from the center bisects the chord, so half the chord is 12.<br>The radius is the hypotenuse: <i>r<\/i><sup>2<\/sup> = 5<sup>2<\/sup> + 12<sup>2<\/sup> = 169.<br><i>r<\/i> = 13.<br>Answer: <b>13<\/b>", "hint": "Draw the perpendicular from the center to the chord and a radius to one endpoint. Which segment is the hypotenuse, and how long is each leg?"}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A circle has a circumference of 12π. What is the radius of the circle?", "opts": ["3", "6", "12", "24"], "ans": 1, "sol": "<i>C<\/i> = 2π<i>r<\/i>, so 2π<i>r<\/i> = 12π.<br>Divide by 2π: <i>r<\/i> = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "A circular rug has a radius of 3 feet. What is the circumference of the rug, to the nearest tenth of a foot?", "ans": ["18.8"], "sol": "<i>C<\/i> = 2π(3) = 6π.<br>6π ≈ 18.85, which rounds to 18.8 (6π = 18.849…).<br>Answer: <b>18.8<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A circular walking path in a park is 40 meters long all the way around. Benches stand at points <i>A<\/i> and <i>B<\/i> on the path, and the central angle <i>A<\/i><i>O<\/i><i>B<\/i>, where <i>O<\/i> is the center of the path, measures 90°. How long is the shorter section of path between the benches?", "opts": ["20 meters", "30 meters", "90 meters", "10 meters"], "ans": 3, "sol": "90° is <span class=\"fq\"><span>90<\/span><span>360<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span> of the circle.<br><span class=\"fq\"><span>1<\/span><span>4<\/span><\/span> × 40 = 10 meters.<br>Answer: <b>10 meters<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "What is the measure, in degrees, of an angle of <span class=\"fq\"><span>π<\/span><span>9<\/span><\/span> radians?", "opts": ["20°", "40°", "340°", "1,620°"], "ans": 0, "sol": "Multiply by <span class=\"fq\"><span>180<\/span><span>π<\/span><\/span>: <span class=\"fq\"><span>π<\/span><span>9<\/span><\/span> × <span class=\"fq\"><span>180<\/span><span>π<\/span><\/span> = <span class=\"fq\"><span>180<\/span><span>9<\/span><\/span>.<br><span class=\"fq\"><span>180<\/span><span>9<\/span><\/span> = 20.<br>Answer: <b>20°<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Triangle <i>A<\/i><i>B<\/i><i>C<\/i> is inscribed in a circle, and side <i>A<\/i><i>B<\/i> is a diameter of the circle. What is the measure of angle <i>A<\/i><i>C<\/i><i>B<\/i>?", "opts": ["45°", "60°", "90°", "180°"], "ans": 2, "sol": "Angle <i>A<\/i><i>C<\/i><i>B<\/i> intercepts arc <i>A<\/i><i>B<\/i>, which is a semicircle of 180°.<br>An inscribed angle is half its arc: <span class=\"fq\"><span>180<\/span><span>2<\/span><\/span> = 90°.<br>Answer: <b>90°<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "Line <i>ℓ<\/i> is tangent to a circle with center <i>O<\/i> at point <i>T<\/i>. What is the measure of the angle between line <i>ℓ<\/i> and radius <i>O<\/i><i>T<\/i>?", "opts": ["90°", "45°", "60°", "180°"], "ans": 0, "sol": "A tangent line is perpendicular to the radius drawn to the point of tangency.<br>Answer: <b>90°<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "A circular patio has an area of 154 square meters. What is the radius of the patio, to the nearest tenth of a meter?", "ans": ["7", "7.0"], "sol": "π<i>r<\/i><sup>2<\/sup> = 154, so <i>r<\/i><sup>2<\/sup> = <span class=\"fq\"><span>154<\/span><span>π<\/span><\/span> ≈ 49.02.<br><i>r<\/i> ≈ 7.001, which rounds to 7.0.<br>Answer: <b>7.0<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A pizza with a radius of 8 inches is cut into 8 congruent slices, and each slice is a sector of the circle. What is the area of one slice, in square inches?", "opts": ["2π", "16π", "64π", "8π"], "ans": 3, "sol": "The whole pizza has area π(8)<sup>2<\/sup> = 64π.<br>Each slice is <span class=\"fq\"><span>1<\/span><span>8<\/span><\/span> of it: <span class=\"fq\"><span>64π<\/span><span>8<\/span><\/span> = 8π.<br>Answer: <b>8π<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "In a circle with radius 12, minor arc <i>A<\/i><i>B<\/i> has length 5π. What is the measure of central angle <i>A<\/i><i>O<\/i><i>B<\/i>?", "opts": ["37.5°", "75°", "150°", "285°"], "ans": 1, "sol": "The circumference is 2π(12) = 24π.<br>The arc is <span class=\"fq\"><span>5π<\/span><span>24π<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>24<\/span><\/span> of the circle.<br><span class=\"fq\"><span>5<\/span><span>24<\/span><\/span> × 360° = 75°.<br>Answer: <b>75°<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A sector of a circle with radius 4 has an area of 10 square units. What is the radian measure of the sector's central angle?", "opts": ["1.25", "0.625", "1.6", "2.5"], "ans": 0, "sol": "Sector area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>r<\/i><sup>2<\/sup><i>θ<\/i>, so <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(16)<i>θ<\/i> = 10.<br>8<i>θ<\/i> = 10, so <i>θ<\/i> = 1.25.<br>Answer: <b>1.25<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "On a circle with radius 6, an arc has length 15. What is the radian measure of the central angle that intercepts this arc?", "ans": ["2.5", "5/2"], "sol": "<i>s<\/i> = <i>r<\/i><i>θ<\/i>, so <i>θ<\/i> = <span class=\"fq\"><span><i>s<\/i><\/span><span><i>r<\/i><\/span><\/span>.<br><i>θ<\/i> = <span class=\"fq\"><span>15<\/span><span>6<\/span><\/span> = 2.5.<br>Answer: <b>2.5<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"Circle with center O. Segment AB is a diameter, and point C is on the circle. Triangle ABC has AC equal to 6 and BC equal to 8, with a right-angle mark at C.\"><circle class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" cx=\"130\" cy=\"120\" r=\"90\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"40,120 220,120 104.8,33.6\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"99.4,40.8 106.6,46.2 112,39\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"130\" cy=\"120\"/><circle r=\"3\" cx=\"40\" cy=\"120\"/><circle r=\"3\" cx=\"220\" cy=\"120\"/><circle r=\"3\" cx=\"104.8\" cy=\"33.6\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"130\" y=\"138.5\" text-anchor=\"middle\" font-style=\"italic\">O<\/text><text x=\"26\" y=\"124.5\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"234\" y=\"124.5\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"102.37\" y=\"24.31\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"63.6\" y=\"74.7\" text-anchor=\"middle\">6<\/text><text x=\"169\" y=\"72.5\" text-anchor=\"middle\">8<\/text><\/g><\/svg>In the figure, points <i>A<\/i>, <i>B<\/i> and <i>C<\/i> lie on the circle with center <i>O<\/i>, <i>A<\/i><i>B<\/i> is a diameter, <i>A<\/i><i>C<\/i> = 6 and <i>B<\/i><i>C<\/i> = 8. What is the radius of the circle?", "opts": ["7", "10", "5", "14"], "ans": 2, "sol": "Angle <i>A<\/i><i>C<\/i><i>B<\/i> is inscribed in a semicircle, so it is a right angle.<br><i>A<\/i><i>B<\/i><sup>2<\/sup> = 6<sup>2<\/sup> + 8<sup>2<\/sup> = 100, so the diameter <i>A<\/i><i>B<\/i> = 10.<br>The radius is <span class=\"fq\"><span>10<\/span><span>2<\/span><\/span> = 5.<br>Answer: <b>5<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Points <i>A<\/i>, <i>B<\/i>, <i>C<\/i> and <i>D<\/i> lie on a circle, and <i>C<\/i> and <i>D<\/i> are both on the major arc cut off by chord <i>A<\/i><i>B<\/i>. If angle <i>A<\/i><i>C<\/i><i>B<\/i> measures 41°, what is the measure of angle <i>A<\/i><i>D<\/i><i>B<\/i>?", "opts": ["20.5°", "82°", "139°", "41°"], "ans": 3, "sol": "Both angles are inscribed angles that intercept the same minor arc <i>A<\/i><i>B<\/i>.<br>Inscribed angles that intercept the same arc are equal, so angle <i>A<\/i><i>D<\/i><i>B<\/i> = 41°.<br>Answer: <b>41°<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A circular pond has a radius of 17 meters. A straight footbridge crosses the pond along a chord, and the point of the bridge closest to the center of the pond is 8 meters from the center. How long is the footbridge?", "opts": ["15 meters", "30 meters", "9 meters", "2√353 meters"], "ans": 1, "sol": "The perpendicular from the center bisects the chord. Half the bridge is a leg of a right triangle with hypotenuse 17 and other leg 8.<br>Half length = √(17<sup>2<\/sup> − 8<sup>2<\/sup>) = √225 = 15.<br>The whole bridge is 2 × 15 = 30 meters.<br>Answer: <b>30 meters<\/b>"}, {"lo": "LO5", "diff": "M", "type": "spr", "q": "Segment <i>P<\/i><i>T<\/i> is tangent to a circle with center <i>O<\/i> at point <i>T<\/i>. If the radius of the circle is 9 and <i>O<\/i><i>P<\/i> = 15, what is the length of <i>P<\/i><i>T<\/i>?", "ans": ["12"], "sol": "<i>O<\/i><i>T<\/i> ⊥ <i>P<\/i><i>T<\/i>, so triangle <i>O<\/i><i>T<\/i><i>P<\/i> has a right angle at <i>T<\/i> and hypotenuse <i>O<\/i><i>P<\/i>.<br><i>P<\/i><i>T<\/i><sup>2<\/sup> = 15<sup>2<\/sup> − 9<sup>2<\/sup> = 144.<br><i>P<\/i><i>T<\/i> = 12.<br>Answer: <b>12<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "Circle <i>A<\/i> has an area of 25π. The circumference of circle <i>B<\/i> is twice the circumference of circle <i>A<\/i>. What is the area of circle <i>B<\/i>?", "opts": ["100π", "50π", "20π", "10π"], "ans": 0, "sol": "Circle <i>A<\/i>: π<i>r<\/i><sup>2<\/sup> = 25π, so <i>r<\/i> = 5 and its circumference is 10π.<br>Circle <i>B<\/i> has circumference 20π, so its radius is 10.<br>Area of circle <i>B<\/i> = π(10)<sup>2<\/sup> = 100π.<br>Answer: <b>100π<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "The minute hand of a clock is 15 centimeters long. To the nearest tenth of a centimeter, how far does the tip of the minute hand travel in 20 minutes?", "ans": ["31.4"], "sol": "In 60 minutes the hand turns 360°, so in 20 minutes it turns <span class=\"fq\"><span>20<\/span><span>60<\/span><\/span> × 360° = 120°.<br>The tip moves along an arc that is <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> of a circle with radius 15: <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> × 2π(15) = 10π.<br>10π ≈ 31.42, which rounds to 31.4.<br>Answer: <b>31.4<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A sector of a circle has a central angle of <span class=\"fq\"><span>2π<\/span><span>5<\/span><\/span> radians and an arc length of 4π. What is the area of the sector?", "opts": ["10π", "40π", "20π", "100π"], "ans": 2, "sol": "<i>s<\/i> = <i>r<\/i><i>θ<\/i>, so <i>r<\/i> = 4π ÷ <span class=\"fq\"><span>2π<\/span><span>5<\/span><\/span> = 10.<br>Sector area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>r<\/i><sup>2<\/sup><i>θ<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(100)(<span class=\"fq\"><span>2π<\/span><span>5<\/span><\/span>) = 20π.<br>Answer: <b>20π<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"Triangle ABC inscribed in a circle. The angle at A measures 70 degrees and the angle at B measures 45 degrees. Side AB is at the bottom of the circle.\"><circle class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" cx=\"130\" cy=\"120\" r=\"90\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"45.43,150.78 207.94,165 99.22,35.43\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"61.37,152.18 61.42,151.36 61.43,150.55 61.39,149.74 61.32,148.92 61.2,148.12 61.05,147.32 60.85,146.53 60.62,145.75 60.34,144.98 60.03,144.23 59.67,143.5 59.28,142.78 58.86,142.09 58.4,141.41 57.91,140.77 57.38,140.15 56.82,139.55 56.24,138.99 55.62,138.45 54.98,137.95 54.32,137.48 53.63,137.04 52.92,136.64 52.19,136.28\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"192,163.61 192.06,163.08 192.13,162.57 192.22,162.05 192.32,161.54 192.44,161.03 192.58,160.52 192.74,160.02 192.91,159.53 193.09,159.04 193.3,158.56 193.52,158.08 193.75,157.61 194,157.15 194.26,156.7 194.54,156.26 194.84,155.82 195.14,155.4 195.46,154.99 195.8,154.58 196.15,154.19 196.51,153.81 196.88,153.44 197.26,153.09 197.66,152.74\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"45.43\" cy=\"150.78\"/><circle r=\"3\" cx=\"207.94\" cy=\"165\"/><circle r=\"3\" cx=\"99.22\" cy=\"35.43\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"32.27\" y=\"160.07\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"220.07\" y=\"176.5\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"94.43\" y=\"26.77\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"73.14\" y=\"139.28\" text-anchor=\"middle\">70°<\/text><text x=\"176.01\" y=\"152.88\" text-anchor=\"middle\">45°<\/text><\/g><\/svg>In the figure, triangle <i>A<\/i><i>B<\/i><i>C<\/i> is inscribed in a circle. Angle <i>B<\/i><i>A<\/i><i>C<\/i> measures 70° and angle <i>A<\/i><i>B<\/i><i>C<\/i> measures 45°. What is the measure of minor arc <i>A<\/i><i>B<\/i>?", "opts": ["65°", "130°", "115°", "140°"], "ans": 1, "sol": "Angle <i>A<\/i><i>C<\/i><i>B<\/i> = 180° − 70° − 45° = 65°.<br>Angle <i>A<\/i><i>C<\/i><i>B<\/i> is the inscribed angle that intercepts minor arc <i>A<\/i><i>B<\/i>.<br>The arc is twice the inscribed angle: 2 × 65° = 130°.<br>Answer: <b>130°<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "From a point <i>P<\/i> outside a circle, segments <i>P<\/i><i>A<\/i> and <i>P<\/i><i>B<\/i> are tangent to the circle at <i>A<\/i> and <i>B<\/i>. If <i>P<\/i><i>A<\/i> = 3<i>x<\/i> − 1 and <i>P<\/i><i>B<\/i> = <i>x<\/i> + 9, what is the length of <i>P<\/i><i>A<\/i>?", "opts": ["5", "7", "14", "28"], "ans": 2, "sol": "Tangent segments from the same outside point are equal: 3<i>x<\/i> − 1 = <i>x<\/i> + 9.<br>2<i>x<\/i> = 10, so <i>x<\/i> = 5.<br><i>P<\/i><i>A<\/i> = 3(5) − 1 = 14.<br>Answer: <b>14<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "A wheel has a diameter of 0.7 meter. Approximately how many meters does the wheel roll in 200 complete revolutions?", "opts": ["140", "220", "440", "880"], "ans": 2, "sol": "In one revolution the wheel rolls one circumference: π(0.7) ≈ 2.199 meters.<br>In 200 revolutions: 200 × 0.7π = 140π ≈ 439.8 meters.<br>Answer: <b>440<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Points <i>A<\/i> and <i>B<\/i> divide a circle into two arcs whose lengths are in the ratio 4 : 5. What is the measure of the central angle that intercepts the shorter arc?", "opts": ["160°", "80°", "200°", "288°"], "ans": 0, "sol": "The two arcs together are 4 + 5 = 9 equal parts of the circle.<br>The shorter arc is <span class=\"fq\"><span>4<\/span><span>9<\/span><\/span> of 360°, which is 160°.<br>Answer: <b>160°<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "An angle measures 1.5 radians. What is the measure of the angle in degrees, to the nearest degree?", "ans": ["86"], "sol": "Multiply by <span class=\"fq\"><span>180<\/span><span>π<\/span><\/span>: 1.5 × <span class=\"fq\"><span>180<\/span><span>π<\/span><\/span> = <span class=\"fq\"><span>270<\/span><span>π<\/span><\/span>.<br><span class=\"fq\"><span>270<\/span><span>π<\/span><\/span> ≈ 85.94, which rounds to 86.<br>Answer: <b>86<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Segment <i>A<\/i><i>B<\/i> is a diameter of a circle, and point <i>C<\/i> lies on the circle. In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, angle <i>C<\/i><i>A<\/i><i>B<\/i> measures (2<i>x<\/i> + 10)° and angle <i>C<\/i><i>B<\/i><i>A<\/i> measures (<i>x<\/i> + 20)°. What is the measure of angle <i>C<\/i><i>A<\/i><i>B<\/i>?", "opts": ["20°", "40°", "110°", "50°"], "ans": 3, "sol": "Angle <i>A<\/i><i>C<\/i><i>B<\/i> is inscribed in a semicircle, so it is 90° and the other two angles add to 90°.<br>(2<i>x<\/i> + 10) + (<i>x<\/i> + 20) = 90, so 3<i>x<\/i> = 60 and <i>x<\/i> = 20.<br>Angle <i>C<\/i><i>A<\/i><i>B<\/i> = 2(20) + 10 = 50°.<br>Answer: <b>50°<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A circular fountain has a radius of 8 meters. From a point <i>P<\/i> outside the fountain, Riya's line of sight just touches the edge of the fountain at point <i>T<\/i>, and <i>P<\/i> is 15 meters from <i>T<\/i>. How far is <i>P<\/i> from the nearest point on the edge of the fountain?", "opts": ["7 meters", "9 meters", "15 meters", "17 meters"], "ans": 1, "sol": "The line of sight is tangent, so it is perpendicular to the radius at <i>T<\/i>.<br>The distance from <i>P<\/i> to the center is √(8<sup>2<\/sup> + 15<sup>2<\/sup>) = 17 meters.<br>The nearest point of the edge is on the segment to the center: 17 − 8 = 9 meters.<br>Answer: <b>9 meters<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "A lawn sprinkler sprays water 12 feet from its base and turns back and forth through a fixed angle, watering a sector with an area of 24π square feet. Through how many degrees does the sprinkler turn?", "ans": ["60"], "sol": "A full circle of radius 12 has area 144π.<br>The sector is <span class=\"fq\"><span>24π<\/span><span>144π<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>6<\/span><\/span> of the circle.<br><span class=\"fq\"><span>1<\/span><span>6<\/span><\/span> × 360° = 60°.<br>Answer: <b>60<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "For a certain circle, the numerical value of the area is 3 times the numerical value of the circumference. What is the radius of the circle?", "opts": ["3", "12", "36", "6"], "ans": 3, "sol": "π<i>r<\/i><sup>2<\/sup> = 3(2π<i>r<\/i>) = 6π<i>r<\/i>.<br>Divide both sides by π<i>r<\/i> (the radius is not 0): <i>r<\/i> = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"Circle with center O. Radii OA and OB each have length 6 and form a right angle at O. Chord AB is drawn, and the region between chord AB and minor arc AB is shaded.\"><polygon class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"none\" points=\"220,120 219.97,117.64 219.88,115.29 219.72,112.94 219.51,110.59 219.23,108.25 218.89,105.92 218.49,103.6 218.03,101.29 217.51,98.99 216.93,96.71 216.29,94.44 215.6,92.19 214.84,89.96 214.02,87.75 213.15,85.56 212.22,83.39 211.23,81.25 210.19,79.14 20 e sides of O: chord AB of length 24 above the center and chord CD of length 10 below it. A dashed radius joins O to B.\"><circle class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" cx=\"130\" cy=\"125\" r=\"95\"/><line class=\"fg-edge\" x1=\"42.31\" y1=\"88.46\" x2=\"217.69\" y2=\"88.46\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"93.46\" y1=\"212.69\" x2=\"166.54\" y2=\"212.69\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"130\" y1=\"125\" x2=\"217.69\" y2=\"88.46\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3\" cx=\"130\" cy=\"125\"/><circle r=\"3\" cx=\"42.31\" cy=\"88.46\"/><circle r=\"3\" cx=\"217.69\" cy=\"88.46\"/><circle r=\"3\" cx=\"93.46\" cy=\"212.69\"/><circle r=\"3\" cx=\"166.54\" cy=\"212.69\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"125.21\" y=\"142.66\" text-anchor=\"middle\" font-style=\"italic\">O<\/text><text x=\"28.78\" y=\"89.34\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"231.22\" y=\"89.34\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"80.31\" y=\"221.98\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"179.69\" y=\"221.98\" text-anchor=\"middle\" font-style=\"italic\">D<\/text><text x=\"130\" y=\"81.96\" text-anchor=\"middle\">24<\/text><text x=\"130\" y=\"206.19\" text-anchor=\"middle\">10<\/text><text x=\"169.62\" y=\"101.08\" text-anchor=\"middle\">13<\/text><\/g><\/svg>A circular window has center <i>O<\/i> and a radius of 13 inches. Two parallel wooden bars, <i>A<\/i><i>B<\/i> and <i>C<\/i><i>D<\/i>, are chords of the circle with the center between them, as shown. <i>A<\/i><i>B<\/i> is 24 inches long and <i>C<\/i><i>D<\/i> is 10 inches long. What is the distance between the two bars?", "opts": ["7 inches", "12 inches", "24 inches", "17 inches"], "ans": 3, "sol": "Distance from <i>O<\/i> to s.<br>Sector area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(8)<sup>2<\/sup>(1.5) = 48 (or <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>r<\/i><i>s<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(8)(12) = 48).<br>Answer: <b>48<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "Segment <i>A<\/i><i>B<\/i> is a diameter of a circle, and point <i>C<\/i> lies on the circle. Minor arc <i>A<\/i><i>C<\/i> measures (2<i>x<\/i>)° and minor arc <i>C<\/i><i>B<\/i> measures (<i>x<\/i> + 30)°. What is the measure of angle <i>C<\/i><i>A<\/i><i>B<\/i>?", "opts": ["40°", "50°", "80°", "100°"], "ans": 0, "sol": "Arcs <i>A<\/i><i>C<\/i> and <i>C<\/i><i>B<\/i> together make the semicircle that contains <i>C<\/i>: 2<i>x<\/i> + <i>x<\/i> + 30 = 180, so <i>x<\/i> = 50.<br>Arc <i>C<\/i><i>B<\/i> = 50 + 30 = 80°.<br>Angle <i>C<\/i><i>A<\/i><i>B<\/i> is inscribed and intercepts arc <i>C<\/i><i>B<\/i>, so it is half of 80°: 40°.<br>Answer: <b>40°<\/b>"}, {"lo": "LO5", "diff": "X", "type": "spr", "q": "Segments <i>P<\/i><i>A<\/i> and <i>P<\/i><i>B<\/i> are tangent to a circle with center <i>O<\/i> and radius 6 at points <i>A<\/i> and <i>B<\/i>. If angle <i>A<\/i><i>P<\/i><i>B<\/i> measures 60°, what is the length of <i>P<\/i><i>A<\/i>, to the nearest tenth?", "ans": ["10.4"], "sol": "By symmetry, <i>O<\/i><i>P<\/i> bisects angle <i>A<\/i><i>P<\/i><i>B<\/i>, so angle <i>A<\/i><i>P<\/i><i>O<\/i> = 30°, and angle <i>O<\/i><i>A<\/i><i>P<\/i> = 90°.<br>Triangle <i>O<\/i><i>A<\/i><i>P<\/i> is a 30°–60°–90° triangle, and <i>O<\/i><i>A<\/i> = 6 is the side opposite 30°.<br>So <i>P<\/i><i>A<\/i> = 6√3 ≈ 10.39.<br>Answer: <b>10.4<\/b>"}, {"lo": "LO1", "diff": "X", "type": "mcq", "q": "When the radius of a circle is increased by 2, the area of the circle increases by 32π. What is the circumference of the original circle?", "opts": ["7π", "18π", "14π", "49π"], "ans": 2, "sol": "π(<i>r<\/i> + 2)<sup>2<\/sup> − π<i>r<\/i><sup>2<\/sup> = 32π, so (<i>r<\/i><sup>2<\/sup> + 4<i>r<\/i> + 4) − <i>r<\/i><sup>2<\/sup> = 32.<br>4<i>r<\/i> + 4 = 32, so <i>r<\/i> = 7.<br>Original circumference = 2π(7) = 14π.<br>Answer: <b>14π<\/b>"}], "unit_no": 4, "topic_no": "3", "code": "3.3"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });

function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
