var S = {"id": "ADV-1.1", "unit": "Advanced Math", "topic": "Equivalent expressions", "title": "Polynomial operations and factoring", "intro": "Polynomial operations are the algebra behind almost every Advanced Math question: you add, subtract and multiply polynomials, and you reverse multiplication by factoring. On the DSAT these skills appear directly, as questions asking which expression is equivalent to a given one or for an unknown coefficient in an identity, and indirectly whenever a quadratic must be factored or simplified on the way to an answer.", "los": [{"id": "LO1", "text": "Add, subtract and multiply polynomials, including the special products of binomials."}, {"id": "LO2", "text": "Factor polynomials by taking out the greatest common factor and by factoring trinomials with a leading coefficient of 1 or other than 1."}, {"id": "LO3", "text": "Recognize and factor differences of squares and perfect-square trinomials, and factor four-term polynomials by grouping."}, {"id": "LO4", "text": "Determine unknown coefficients in polynomial identities and identify equivalent forms of an expression using structure."}], "notes": [{"lo": "LO1", "h": "Adding and subtracting polynomials", "html": "<p>A polynomial is a sum of terms such as 3<i>x<\/i><sup>2<\/sup>, −5<i>x<\/i> and 7. <b>Like terms<\/b> have the same variable raised to the same power, and only like terms can be combined: add or subtract their coefficients and keep the variable part unchanged.<\/p><div class=\"eqs\">(4<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 2) + (<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 6) = 5<i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + 4<\/div><p>Subtraction needs one extra step. The minus sign in front of the second polynomial applies to <i>every<\/i> term inside it, so rewrite the subtraction as adding the opposite of each term.<\/p><div class=\"eqs\">(6<i>x<\/i><sup>2<\/sup> − <i>x<\/i> + 4) − (2<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 5)<br>= 6<i>x<\/i><sup>2<\/sup> − <i>x<\/i> + 4 − 2<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> + 5<br>= 4<i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 9<\/div><div class=\"rule\">When you subtract a polynomial, change the sign of every one of its terms, then combine like terms.<\/div><p>Never add exponents when you add terms: <i>x<\/i><sup>2<\/sup> + <i>x<\/i><sup>2<\/sup> = 2<i>x<\/i><sup>2<\/sup>, not <i>x<\/i><sup>4<\/sup>. Exponents are added only when powers of the same variable are multiplied.<\/p>"}, {"lo": "LO1", "h": "Multiplying polynomials", "html": "<p>To multiply two polynomials, multiply <i>each<\/i> term of the first by <i>each<\/i> term of the second, then combine like terms. For two binomials this gives four products (first, outer, inner, last).<\/p><div class=\"eqs\">(2<i>x<\/i> + 3)(<i>x<\/i> − 4) = 2<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> + 3<i>x<\/i> − 12 = 2<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> − 12<\/div><p>A binomial times a trinomial gives six products. A small grid keeps them organized: write one polynomial across the top and the other down the side, fill in each cell, then add like terms.<\/p><p>Three special products appear so often that it pays to know them by heart.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Product<\/th><th>Expanded form<\/th><\/tr><tr><td>(<i>a<\/i> + <i>b<\/i>)<sup>2<\/sup><\/td><td><i>a<\/i><sup>2<\/sup> + 2<i>a<\/i><i>b<\/i> + <i>b<\/i><sup>2<\/sup><\/td><\/tr><tr><td>(<i>a<\/i> − <i>b<\/i>)<sup>2<\/sup><\/td><td><i>a<\/i><sup>2<\/sup> − 2<i>a<\/i><i>b<\/i> + <i>b<\/i><sup>2<\/sup><\/td><\/tr><tr><td>(<i>a<\/i> + <i>b<\/i>)(<i>a<\/i> − <i>b<\/i>)<\/td><td><i>a<\/i><sup>2<\/sup> − <i>b<\/i><sup>2<\/sup><\/td><\/tr><\/table><\/div><div class=\"rule\">(<i>a<\/i> + <i>b<\/i>)<sup>2<\/sup> is not <i>a<\/i><sup>2<\/sup> + <i>b<\/i><sup>2<\/sup>. The middle term 2<i>a<\/i><i>b<\/i> is always there.<\/div>"}, {"lo": "LO2", "h": "Taking out the greatest common factor", "html": "<p>Factoring reverses multiplication: it rewrites a sum as a product. Always begin by looking for the <b>greatest common factor<\/b> (GCF), the largest expression that divides every term.<\/p><ul><li>For the number part, take the greatest common factor of the coefficients.<\/li><li>For each variable, take the <b>lowest<\/b> power that appears in every term.<\/li><\/ul><div class=\"eqs\">18<i>x<\/i><sup>4<\/sup> − 12<i>x<\/i><sup>3<\/sup> + 6<i>x<\/i><sup>2<\/sup> = 6<i>x<\/i><sup>2<\/sup>(3<i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + 1)<\/div><p>Look at the last term: 6<i>x<\/i><sup>2<\/sup> ÷ 6<i>x<\/i><sup>2<\/sup> = 1, so a 1 stays inside the parentheses. Leaving it out is a common slip.<\/p><p>The GCF can also be a binomial. In <i>x<\/i>(<i>x<\/i> − 5) + 4(<i>x<\/i> − 5), the common factor is (<i>x<\/i> − 5), so the expression equals (<i>x<\/i> − 5)(<i>x<\/i> + 4).<\/p><div class=\"tip\">You can always check a factorization by multiplying it back out. On the DSAT this takes seconds and catches the sign errors that wrong answer choices are built on.<\/div>"}, {"lo": "LO2", "h": "Trinomials with leading coefficient 1", "html": "<p>To factor <i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i>, look for two numbers that <b>multiply to <i>c<\/i><\/b> and <b>add to <i>b<\/i><\/b>. Those numbers go into the two binomials.<\/p><div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 15: product −15, sum 2, so the numbers are 5 and −3<br><i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 15 = (<i>x<\/i> + 5)(<i>x<\/i> − 3)<\/div><p>The signs of <i>b<\/i> and <i>c<\/i> tell you where to search.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Sign of <i>c<\/i><\/th><th>Sign of <i>b<\/i><\/th><th>The two numbers<\/th><\/tr><tr><td>positive<\/td><td>positive<\/td><td>both positive<\/td><\/tr><tr><td>positive<\/td><td>negative<\/td><td>both negative<\/td><\/tr><tr><td>negative<\/td><td>either<\/td><td>opposite signs; the one with the larger size has the sign of <i>b<\/i><\/td><\/tr><\/table><\/div><div class=\"rule\"><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = (<i>x<\/i> + <i>m<\/i>)(<i>x<\/i> + <i>n<\/i>) exactly when <i>m<\/i><i>n<\/i> = <i>c<\/i> and <i>m<\/i> + <i>n<\/i> = <i>b<\/i>.<\/div><p>List the factor pairs of <i>c<\/i> in order and stop when a pair has the right sum.<\/p>"}, {"lo": "LO2", "h": "Trinomials with leading coefficient other than 1", "html": "<p>For <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> with <i>a<\/i> ≠ 1, first take out any GCF. Then use the <b>ac method<\/b>:<\/p><ol><li>Multiply <i>a<\/i> and <i>c<\/i>.<\/li><li>Find two numbers whose product is <i>a<\/i><i>c<\/i> and whose sum is <i>b<\/i>.<\/li><li>Use them to split the middle term into two terms.<\/li><li>Factor the four terms by grouping.<\/li><\/ol><div class=\"eqs\">4<i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> − 15: <i>a<\/i><i>c<\/i> = −60, and the numbers are −10 and 6<br>= 4<i>x<\/i><sup>2<\/sup> − 10<i>x<\/i> + 6<i>x<\/i> − 15<br>= 2<i>x<\/i>(2<i>x<\/i> − 5) + 3(2<i>x<\/i> − 5)<br>= (2<i>x<\/i> − 5)(2<i>x<\/i> + 3)<\/div><div class=\"tip\">On multiple-choice questions you rarely need to factor from scratch. The first and last terms usually match in every choice, so expand only the outer and inner products of each choice and see which one gives the correct middle term.<\/div>"}, {"lo": "LO3", "h": "Difference of squares and perfect squares", "html": "<p>Two of the special products can be run in reverse.<\/p><div class=\"rule\"><i>a<\/i><sup>2<\/sup> − <i>b<\/i><sup>2<\/sup> = (<i>a<\/i> − <i>b<\/i>)(<i>a<\/i> + <i>b<\/i>)<br><i>a<\/i><sup>2<\/sup> + 2<i>a<\/i><i>b<\/i> + <i>b<\/i><sup>2<\/sup> = (<i>a<\/i> + <i>b<\/i>)<sup>2<\/sup> and <i>a<\/i><sup>2<\/sup> − 2<i>a<\/i><i>b<\/i> + <i>b<\/i><sup>2<\/sup> = (<i>a<\/i> − <i>b<\/i>)<sup>2<\/sup><\/div><p>To spot a <b>difference of squares<\/b>, check for exactly two terms, both perfect squares, joined by a minus sign: 49<i>x<\/i><sup>2<\/sup> − 4 = (7<i>x<\/i> − 2)(7<i>x<\/i> + 2). A <b>sum<\/b> of squares such as <i>x<\/i><sup>2<\/sup> + 16 does not factor over the real numbers.<\/p><p>To spot a <b>perfect-square trinomial<\/b>, check that the first and last terms are perfect squares and that the middle term is twice the product of their square roots. In 16<i>x<\/i><sup>2<\/sup> + 24<i>x<\/i> + 9, 2(4<i>x<\/i>)(3) = 24<i>x<\/i>, so it equals (4<i>x<\/i> + 3)<sup>2<\/sup>.<\/p><p>Take out the GCF first and keep factoring until no factor breaks down further:<\/p><div class=\"eqs\">2<i>x<\/i><sup>3<\/sup> − 32<i>x<\/i> = 2<i>x<\/i>(<i>x<\/i><sup>2<\/sup> − 16) = 2<i>x<\/i>(<i>x<\/i> − 4)(<i>x<\/i> + 4)<\/div>"}, {"lo": "LO3", "h": "Factoring by grouping", "html": "<p>A polynomial with four terms can often be factored by <b>grouping<\/b>. Split it into two pairs, take the GCF out of each pair, and look for a common binomial.<\/p><div class=\"eqs\"><i>x<\/i><sup>3<\/sup> − 5<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 10<br>= <i>x<\/i><sup>2<\/sup>(<i>x<\/i> − 5) + 2(<i>x<\/i> − 5)<br>= (<i>x<\/i> − 5)(<i>x<\/i><sup>2<\/sup> + 2)<\/div><p>If the third term is negative, take a <b>negative<\/b> GCF out of the second pair so that the binomials match:<\/p><div class=\"eqs\">2<i>x<\/i><sup>3<\/sup> + 3<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> − 12 = <i>x<\/i><sup>2<\/sup>(2<i>x<\/i> + 3) − 4(2<i>x<\/i> + 3) = (2<i>x<\/i> + 3)(<i>x<\/i><sup>2<\/sup> − 4)<\/div><p>This is not finished yet: <i>x<\/i><sup>2<\/sup> − 4 is a difference of squares, so the complete factorization is (2<i>x<\/i> + 3)(<i>x<\/i> − 2)(<i>x<\/i> + 2).<\/p><div class=\"rule\">After grouping, the two binomials in parentheses must be identical. If they differ only in sign, factor −1 out of one pair.<\/div>"}, {"lo": "LO4", "h": "Identities and unknown coefficients", "html": "<p>An equation such as (<i>a<\/i><i>x<\/i> + 3)(2<i>x<\/i> − <i>b<\/i>) = 6<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> − 12 that is true <b>for all values of <i>x<\/i><\/b> is an identity. Two polynomials are equal for every <i>x<\/i> only when the coefficients of matching powers are equal.<\/p><div class=\"eqs\">Left side: 2<i>a<\/i><i>x<\/i><sup>2<\/sup> + (6 − <i>a<\/i><i>b<\/i>)<i>x<\/i> − 3<i>b<\/i><br>2<i>a<\/i> = 6, so <i>a<\/i> = 3; −3<i>b<\/i> = −12, so <i>b<\/i> = 4<br>Check: 6 − <i>a<\/i><i>b<\/i> = 6 − 12 = −6 ✓<\/div><div class=\"rule\">For an identity, expand, collect each power of <i>x<\/i>, and set the coefficients equal power by power.<\/div><div class=\"tip\">To test which choice is equivalent to an expression, substitute a convenient value such as <i>x<\/i> = 2 into the expression and into each choice. Any choice that gives a different number is out; use a second value if two choices tie.<\/div><p>Special products give shortcuts too: since (<i>x<\/i> + <i>y<\/i>)<sup>2<\/sup> = <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + 2<i>x<\/i><i>y<\/i>, knowing any two of (<i>x<\/i> + <i>y<\/i>)<sup>2<\/sup>, <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> and <i>x<\/i><i>y<\/i> gives you the third without finding <i>x<\/i> or <i>y<\/i>.<\/p>"}], "examples": [{"lo": "LO1", "q": "Simplify (4<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> + 7) − (<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> − 2).", "steps": ["Distribute the minus sign to every term of the second polynomial: 4<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> + 7 − <i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> + 2.", "Group like terms: (4<i>x<\/i><sup>2<\/sup> − <i>x<\/i><sup>2<\/sup>) + (−3<i>x<\/i> + 5<i>x<\/i>) + (7 + 2).", "Combine: 3<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> + 9."], "ans": "3<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> + 9"}, {"lo": "LO1", "q": "Expand and simplify (2<i>x<\/i> − 3)(<i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> − 1).", "steps": ["Multiply 2<i>x<\/i> by each term of the trinomial: 2<i>x<\/i><sup>3<\/sup> + 8<i>x<\/i><sup>2<\/sup> − 2<i>x<\/i>.", "Multiply −3 by each term: −3<i>x<\/i><sup>2<\/sup> − 12<i>x<\/i> + 3.", "Combine like terms: 2<i>x<\/i><sup>3<\/sup> + (8<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i><sup>2<\/sup>) + (−2<i>x<\/i> − 12<i>x<\/i>) + 3 = 2<i>x<\/i><sup>3<\/sup> + 5<i>x<\/i><sup>2<\/sup> − 14<i>x<\/i> + 3."], "ans": "2<i>x<\/i><sup>3<\/sup> + 5<i>x<\/i><sup>2<\/sup> − 14<i>x<\/i> + 3"}, {"lo": "LO2", "q": "Factor 6<i>x<\/i><sup>2<\/sup> + 7<i>x<\/i> − 20.", "steps": ["There is no GCF. Compute <i>a<\/i><i>c<\/i> = 6(−20) = −120.", "Find two numbers with product −120 and sum 7: 15 and −8.", "Split the middle term and group: 6<i>x<\/i><sup>2<\/sup> + 15<i>x<\/i> − 8<i>x<\/i> − 20 = 3<i>x<\/i>(2<i>x<\/i> + 5) − 4(2<i>x<\/i> + 5).", "Take out the common binomial: (3<i>x<\/i> − 4)(2<i>x<\/i> + 5). Check: 6<i>x<\/i><sup>2<\/sup> + 15<i>x<\/i> − 8<i>x<\/i> − 20 = 6<i>x<\/i><sup>2<\/sup> + 7<i>x<\/i> − 20 ✓."], "ans": "(3<i>x<\/i> − 4)(2<i>x<\/i> + 5)"}, {"lo": "LO3", "q": "Factor completely: <i>x<\/i><sup>3<\/sup> + 4<i>x<\/i><sup>2<\/sup> − 9<i>x<\/i> − 36.", "steps": ["Group in pairs: (<i>x<\/i><sup>3<\/sup> + 4<i>x<\/i><sup>2<\/sup>) + (−9<i>x<\/i> − 36).", "Take out each pair's GCF, using −9 for the second pair: <i>x<\/i><sup>2<\/sup>(<i>x<\/i> + 4) − 9(<i>x<\/i> + 4).", "Take out the common binomial: (<i>x<\/i> + 4)(<i>x<\/i><sup>2<\/sup> − 9).", "<i>x<\/i><sup>2<\/sup> − 9 is a difference of squares, so the complete factorization is (<i>x<\/i> + 4)(<i>x<\/i> − 3)(<i>x<\/i> + 3)."], "ans": "(<i>x<\/i> + 4)(<i>x<\/i> − 3)(<i>x<\/i> + 3)"}, {"lo": "LO4", "q": "<div class=\"eqs\">(<i>a<\/i><i>x<\/i> + 3)(2<i>x<\/i> − <i>b<\/i>) = 8<i>x<\/i><sup>2<\/sup> − 14<i>x<\/i> − 15<\/div>The equation above is true for all values of <i>x<\/i>, where <i>a<\/i> and <i>b<\/i> are constants. What is the value of <i>a<\/i> + <i>b<\/i>?", "steps": ["Expand the left side: 2<i>a<\/i><i>x<\/i><sup>2<\/sup> − <i>a<\/i><i>b<\/i><i>x<\/i> + 6<i>x<\/i> − 3<i>b<\/i> = 2<i>a<\/i><i>x<\/i><sup>2<\/sup> + (6 − <i>a<\/i><i>b<\/i>)<i>x<\/i> − 3<i>b<\/i>.", "Match the <i>x<\/i><sup>2<\/sup> coefficients: 2<i>a<\/i> = 8, so <i>a<\/i> = 4. Match the constants: −3<i>b<\/i> = −15, so <i>b<\/i> = 5.", "Check the middle term: 6 − <i>a<\/i><i>b<\/i> = 6 − 20 = −14 ✓.", "So <i>a<\/i> + <i>b<\/i> = 4 + 5 = 9."], "ans": "<i>a<\/i> + <i>b<\/i> = 9"}, {"lo": "LO4", "q": "If <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 40 and <i>x<\/i><i>y<\/i> = 12, what is the value of (<i>x<\/i> − <i>y<\/i>)<sup>2<\/sup>?", "steps": ["Expand the square: (<i>x<\/i> − <i>y<\/i>)<sup>2<\/sup> = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i><i>y<\/i> + <i>y<\/i><sup>2<\/sup> = (<i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup>) − 2<i>x<\/i><i>y<\/i>.", "Substitute the given values: 40 − 2(12) = 16. There is no need to find <i>x<\/i> and <i>y<\/i>."], "ans": "16"}], "traps": ["Changing only the first sign when subtracting: (5<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i>) − (<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i>) is 4<i>x<\/i><sup>2<\/sup> + 5<i>x<\/i>, not 4<i>x<\/i><sup>2<\/sup> − <i>x<\/i>. The minus sign reaches every term of the second polynomial.", "Dropping the middle term of a square: (<i>x<\/i> + 5)<sup>2<\/sup> = <i>x<\/i><sup>2<\/sup> + 10<i>x<\/i> + 25, not <i>x<\/i><sup>2<\/sup> + 25.", "Stopping too early. Take out the GCF first and keep going: 2<i>x<\/i><sup>2<\/sup> − 18 = 2(<i>x<\/i><sup>2<\/sup> − 9) = 2(<i>x<\/i> − 3)(<i>x<\/i> + 3). When a question asks for the complete factorization, an unfinished form is wrong.", "Factoring a sum of squares: <i>x<\/i><sup>2<\/sup> + 9 cannot be written as (<i>x<\/i> + 3)(<i>x<\/i> − 3), because that product is <i>x<\/i><sup>2<\/sup> − 9.", "Mixing up signs in a trinomial. When the constant term is negative, the two numbers have opposite signs; multiply your binomials back out to confirm the middle term.", "Answering the wrong quantity in an identity question, such as giving <i>a<\/i> when the question asks for <i>a<\/i> + <i>b<\/i> or for another coefficient. Reread the last line before you choose."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which expression is equivalent to (5<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 4) + (3<i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 9)?", "opts": ["8<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 5", "8<i>x<\/i><sup>2<\/sup> + 9<i>x<\/i> + 5", "8<i>x<\/i><sup>4<\/sup> − 5<i>x<\ /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
