var S = {"id": "ALG-1.3", "unit": "Algebra", "topic": "Linear equations in one variable", "title": "Writing linear equations from words", "intro": "This subtopic teaches you to turn a written situation into a one-variable linear equation, solve it, and explain what the answer means. The DSAT tests it constantly, both as “which equation represents this situation?” questions and as word problems you must set up yourself.", "los": [{"id": "LO1", "text": "Write a linear equation in one variable from a verbal description, including fixed-fee-plus-rate cost situations."}, {"id": "LO2", "text": "Solve word problems about consecutive integers, ages and perimeter by defining one variable and writing an equation."}, {"id": "LO3", "text": "Solve rate (distance = rate · time) and simple mixture problems with a one-variable linear equation."}, {"id": "LO4", "text": "Identify the equation that correctly represents a described situation."}, {"id": "LO5", "text": "Interpret the solution and the constants of a linear equation in the context of a problem."}], "notes": [{"lo": "LO1", "h": "Translating words into symbols", "html": "Before writing anything, decide what the variable stands for and write it down: “let <i>n<\/i> = the number of tickets.” Then translate phrase by phrase.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Words<\/th><th>Symbols<\/th><\/tr><tr><td>5 more than a number<\/td><td><i>n<\/i> + 5<\/td><\/tr><tr><td>5 less than a number<\/td><td><i>n<\/i> − 5 (order flips!)<\/td><\/tr><tr><td>3 times the sum of a number and 4<\/td><td>3(<i>n<\/i> + 4)<\/td><\/tr><tr><td>twice a number, decreased by 7<\/td><td>2<i>n<\/i> − 7<\/td><\/tr><tr><td>is, equals, results in, totals<\/td><td>=<\/td><\/tr><\/table><\/div><div class=\"rule\">“<i>A<\/i> less than <i>B<\/i>” means <i>B<\/i> − <i>A<\/i>. The amount being subtracted is named first.<\/div>Words like <b>sum<\/b>, <b>difference<\/b> and <b>times the sum<\/b> tell you where the parentheses go. When in doubt, test your expression with a small number, such as <i>n<\/i> = 10, and check that it matches the words."}, {"lo": "LO1", "h": "Fixed amount plus a rate", "html": "Most DSAT cost and quantity problems have the same shape: a one-time amount plus a per-unit amount repeated many times.<div class=\"rule\">total = starting amount + (rate)(number of units)<\/div>For example, a repair shop charging a $40 inspection fee plus $85 per hour of labor, with a bill of $380, gives 40 + 85<i>h<\/i> = 380, so <i>h<\/i> = 4.<ul><li>The <b>fixed<\/b> amount (fee, deposit, starting value) appears once.<\/li><li>The <b>rate<\/b> (per hour, each, per month) multiplies the variable.<\/li><li>A quantity that is <b>decreasing<\/b> (fuel used, money spent) gets a minus sign: start − rate · time.<\/li><\/ul>Percent changes fit the same pattern: a price after a 20% discount is <i>p<\/i> − 0.20<i>p<\/i> = 0.80<i>p<\/i>, and after an 8% tax it is 1.08<i>p<\/i>."}, {"lo": "LO2", "h": "Consecutive integers, ages and perimeter", "html": "These classic problems need only one variable once you describe every quantity in terms of it.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Situation<\/th><th>Write the quantities as<\/th><\/tr><tr><td>consecutive integers<\/td><td><i>n<\/i>, <i>n<\/i> + 1, <i>n<\/i> + 2, …<\/td><\/tr><tr><td>consecutive even (or odd) integers<\/td><td><i>n<\/i>, <i>n<\/i> + 2, <i>n<\/i> + 4, …<\/td><\/tr><tr><td>ages <i>k<\/i> years from now / ago<\/td><td>add or subtract <i>k<\/i> from <b>every<\/b> person's age<\/td><\/tr><tr><td>rectangle perimeter<\/td><td>2(length) + 2(width)<\/td><\/tr><\/table><\/div><div class=\"rule\">Odd and even integers both step by 2. Whether <i>n<\/i> is odd or even is decided by the answer, not by the expression.<\/div>For ages, a table with rows for each person and columns for “now” and “then” prevents the most common error: shifting one person's age but not the other's. For perimeter, sketch the shape and label every side with an expression in the same variable."}, {"lo": "LO3", "h": "Rate problems: distance = rate · time", "html": "<div class=\"rule\"><i>d<\/i> = <i>r<\/i><i>t<\/i>, so <i>t<\/i> = <span class=\"fq\"><span><i>d<\/i><\/span><span><i>r<\/i><\/span><\/span> and <i>r<\/i> = <span class=\"fq\"><span><i>d<\/i><\/span><span><i>t<\/i><\/span><\/span>. Keep units consistent: convert minutes to hours before using a speed in miles per hour.<\/div><ul><li><b>Moving apart or toward each other:<\/b> the gap changes at the <b>sum<\/b> of the speeds.<\/li><li><b>Catching up<\/b> (same direction, later start): set the two distances equal. If the second traveler starts 2 hours later, its time is <i>t<\/i> − 2.<\/li><li><b>Round trip:<\/b> the distance is the same both ways, so add the times: <span class=\"fq\"><span><i>d<\/i><\/span><span><i>r<\/i><sub>1<\/sub><\/span><\/span> + <span class=\"fq\"><span><i>d<\/i><\/span><span><i>r<\/i><sub>2<\/sub><\/span><\/span> = total time.<\/li><\/ul>Never average two speeds to get an overall speed; the traveler spends more time at the slower speed, so the simple average is too high."}, {"lo": "LO3", "h": "Mixture problems", "html": "In a mixture, the <b>amount of the ingredient<\/b> (pure salt, total value, pure silver) is conserved.<div class=\"rule\">(amount of ingredient in part 1) + (amount in part 2) = (amount in the mixture), where amount = quantity × concentration (or quantity × price).<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Liters<\/th><th>Concentration<\/th><th>Pure acid<\/th><\/tr><tr><td>Solution A<\/td><td><i>x<\/i><\/td><td>0.10<\/td><td>0.10<i>x<\/i><\/td><\/tr><tr><td>Solution B<\/td><td>12<\/td><td>0.40<\/td><td>4.8<\/td><\/tr><tr><td>Mixture<\/td><td><i>x<\/i> + 12<\/td><td>0.25<\/td><td>0.25(<i>x<\/i> + 12)<\/td><\/tr><\/table><\/div>The last column gives the equation 0.10<i>x<\/i> + 4.8 = 0.25(<i>x<\/i> + 12). The mixture's quantity is the <b>sum<\/b> of the parts, and a pure ingredient has concentration 1 (100%)."}, {"lo": "LO4", "h": "Choosing the equation that fits", "html": "“Which equation represents the situation?” questions reward a two-step check.<ol><li><b>Read the variable's definition.<\/b> If <i>x<\/i> is the <i>smallest<\/i> integer, the others are <i>x<\/i> + 2 and so on; if <i>x<\/i> is the <i>largest<\/i>, they are <i>x<\/i> − 2 and so on.<\/li><li><b>Test a meaning.<\/b> Pick an easy value of the variable and check whether each side of the equation computes the quantity the words describe.<\/li><\/ol><div class=\"rule\">Each term must have the right units. In 14<i>a<\/i> + 9(420 − <i>a<\/i>), every term is in dollars: price per ticket × number of tickets.<\/div>Watch for answer choices that swap the fixed amount and the rate, reverse a subtraction, or forget to multiply a whole group by a factor.<div class=\"tip\">Desmos tip: if you can solve the story with arithmetic, type each answer choice into Desmos with <i>x<\/i> replaced by your value (or graph both sides as <i>y<\/i> = left side and <i>y<\/i> = right side) and see which equation is true.<\/div>"}, {"lo": "LO5", "h": "Interpreting solutions and constants", "html": "After solving, ask what the number <b>means<\/b> and whether it makes sense.<ul><li><b>Constants:<\/b> in 120 + 35<i>w<\/i> = 505, the 120 is the starting amount, the 35 is the change per unit of <i>w<\/i>, and 505 is the target total.<\/li><li><b>Solution:<\/b> <i>w<\/i> = 11 means “after 11 weeks the total reaches $505.” Always state the units.<\/li><li><b>Whole objects:<\/b> if 7.4 buses are needed, you need 8 buses; if you can afford 7.4 shirts, you can buy 7.<\/li><li><b>Break-even:<\/b> when two expressions are set equal, the solution is where they are the same. Check one value on either side to see which option is cheaper beyond it.<\/li><\/ul><div class=\"tip\">Desmos tip: graph <i>y<\/i> = left side and <i>y<\/i> = right side. The <i>x<\/i>-coordinate of the intersection is the solution, and the <i>y<\/i>-coordinate is the shared value (such as the common cost).<\/div>"}], "examples": [{"lo": "LO1", "q": "A tutoring center charges a one-time $40 registration fee plus $27.50 per session. Lucia's total cost was $370. Write and solve an equation for the number of sessions, <i>s<\/i>.", "steps": ["The fee happens once and the rate multiplies the number of sessions: 40 + 27.50<i>s<\/i> = 370.", "Subtract 40 from both sides: 27.50<i>s<\/i> = 330.", "Divide by 27.50: <i>s<\/i> = 12."], "ans": "<i>s<\/i> = 12 sessions"}, {"lo": "LO2", "q": "The second side of a triangle is 3 cm longer than the first side, and the third side is twice as long as the first side. The perimeter is 51 cm. Find the length of each side.", "steps": ["Let <i>x<\/i> = the first side. Then the sides are <i>x<\/i>, <i>x<\/i> + 3 and 2<i>x<\/i>.", "Perimeter: <i>x<\/i> + (<i>x<\/i> + 3) + 2<i>x<\/i> = 51, so 4<i>x<\/i> + 3 = 51.", "4<i>x<\/i> = 48, so <i>x<\/i> = 12.", "The sides are 12 cm, 15 cm and 24 cm. Check: 12 + 15 + 24 = 51."], "ans": "12 cm, 15 cm and 24 cm"}, {"lo": "LO3", "q": "How many liters of a 20% saline solution must be added to 30 liters of a 50% saline solution to make a 35% saline solution?", "steps": ["Let <i>x<\/i> = liters of 20% solution. Salt in it: 0.20<i>x<\/i>. Salt in the 30 L: 0.50(30) = 15.", "The mixture has <i>x<\/i> + 30 liters at 35%: 0.20<i>x<\/i> + 15 = 0.35(<i>x<\/i> + 30).", "Expand: 0.20<i>x<\/i> + 15 = 0.35<i>x<\/i> + 10.5, so 4.5 = 0.15<i>x<\/i>.", "<i>x<\/i> = 30. Check: 0.20(30) + 15 = 21 and 0.35(60) = 21."], "ans": "30 liters"}, {"lo": "LO4", "q": "Lena is 5 years older than twice Omar's age. The sum of their ages is 47. If <i>o<\/i> is Omar's age, which equation represents the situation, and how old is each person?", "steps": ["“5 years older than twice Omar's age”: Lena = 2<i>o<\/i> + 5 (not 2(<i>o<\/i> + 5)).", "Sum of ages: <i>o<\/i> + (2<i>o<\/i> + 5) = 47.", "3<i>o<\/i> + 5 = 47, so 3<i>o<\/i> = 42 and <i>o<\/i> = 14.", "Lena is 2(14) + 5 = 33. Check: 14 + 33 = 47."], "ans": "<i>o<\/i> + (2<i>o<\/i> + 5) = 47; Omar is 14 and Lena is 33"}, {"lo": "LO5", "q": "Plan A costs $30 per month plus $0.08 per minute of calls. Plan B costs $12 per month plus $0.20 per minute. Solve 30 + 0.08<i>m<\/i> = 12 + 0.20<i>m<\/i> and interpret the solution. Which plan is cheaper for 200 minutes?", "steps": ["Subtract 0.08<i>m<\/i> and 12 from both sides: 18 = 0.12<i>m<\/i>.", "<i>m<\/i> = <span class=\"fq\"><span>18<\/span><span>0.12<\/span><\/span> = 150.", "Interpretation: at 150 minutes the plans cost the same, 30 + 0.08(150) = $42.", "At 200 minutes: Plan A = 30 + 16 = $46 and Plan B = 12 + 40 = $52, so Plan A is cheaper beyond 150 minutes."], "ans": "At 150 minutes both plans cost $42; for 200 minutes Plan A is cheaper"}], "traps": ["Writing “7 less than 4 times a number” as 7 − 4<i>n<\/i> instead of 4<i>n<\/i> − 7.", "In an age problem, adding the years to one person's age but forgetting to add them to the other person's age.", "Using <i>n<\/i>, <i>n<\/i> + 1, <i>n<\/i> + 2 for consecutive <b>odd<\/b> or <b>even<\/b> integers instead of stepping by 2.", "In a mixture problem, forgetting that the mixture's total quantity is the sum of the parts, or averaging two speeds or prices instead of weighting them.", "Reporting a fractional answer for a count of whole objects, such as 7.6 buses, instead of rounding in the direction the situation requires."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A plumber charges a $65 call-out fee plus $48 per hour of work. A customer's bill was $257. Which equation can be used to find <i>h<\/i>, the number of hours worked?", "opts": ["48 + 65<i>h<\/i> = 257", "65 + 48<i>h<\/i> = 257", "65<i>h<\/i> + 48<i>h<\/i> = 257", "48<i>h<\/i> − 65 = 257"], "ans": 1, "sol": "The $65 fee is charged once; the $48 is charged for each of the <i>h<\/i> hours, giving 48<i>h<\/i>. Total: 65 + 48<i>h<\/i> = 257 (so <i>h<\/i> = 4). Answer: <b>65 + 48<i>h<\/i> = 257<\/b>", "hint": "Which amount is charged only once, and which one repeats every hour?"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "A gym charges a $35 joining fee plus $22 per month. Maya has paid $211 in total. For how many months has she been a member?", "ans": ["8"], "sol": "35 + 22<i>m<\/i> = 211, so 22<i>m<\/i> = 176 and <i>m<\/i> = 8. Answer: <b>8<\/b>", "hint": "Remove the one-time fee from the total first."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "The sum of three consecutive integers is 141. What is the smallest of the three integers?", "opts": ["46", "47", "48", "138"], "ans": 0, "sol": "<i>n<\/i> + (<i>n<\/i> + 1) + (<i>n<\/i> + 2) = 141, so 3<i>n<\/i> + 3 = 141, 3<i>n<\/i> = 138 and <i>n<\/i> = 46. Answer: <b>46<\/b>", "hint": "Call the smallest integer <i>n<\/i>. What are the next two?"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "The length of a rectangle is 7 inches more than twice its width. The perimeter of the rectangle is 74 inches. What is the width, in inches?", "ans": ["10"], "sol": "Width <i>w<\/i>, length 2<i>w<\/i> + 7. Perimeter: 2<i>w<\/i> + 2(2<i>w<\/i> + 7) = 74, so 6<i>w<\/i> + 14 = 74, 6<i>w<\/i> = 60 and <i>w<\/i> = 10. Answer: <b>10<\/b>", "hint": "Perimeter counts each side twice: 2(length) + 2(width)."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Ravi is 4 times as old as his daughter. In 6 years, Ravi will be 3 times as old as his daughter will be then. How old is Ravi now?", "opts": ["12", "18", "48", "54"], "ans": 2, "sol": "Daughter <i>d<\/i>, Ravi 4<i>d<\/i>. In 6 years: 4<i>d<\/i> + 6 = 3(<i>d<\/i> + 6), so 4<i>d<\/i> + 6 = 3<i>d<\/i> + 18 and <i>d<\/i> = 12. Ravi is 4(12) = 48. Answer: <b>48<\/b>", "hint": "In 6 years, both people are 6 years older. Write both future ages before you compare them."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Two cyclists leave the same point at the same time and ride in opposite directions, one at 14 kilometers per hour and the other at 18 kilometers per hour. After how many hours will they be 112 kilometers apart?", "opts": ["3.5", "7", "8", "28"], "ans": 0, "sol": "Moving apart, the distance between them grows by 14 + 18 = 32 km each hour. 32<i>t<\/i> = 112, so <i>t<\/i> = 3.5. Answer: <b>3.5<\/b>", "hint": "How much does the distance between them grow each hour?"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A grocer mixes <i>x<\/i> pounds of nuts that cost $6.00 per pound with 15 pounds of nuts that cost $9.00 per pound. The mixture is worth $7.20 per pound. What is the value of <i>x<\/i>?", "ans": ["22.5", "45/2"], "sol": "Value equation: 6<i>x<\/i> + 9(15) = 7.20(<i>x<\/i> + 15). So 6<i>x<\/i> + 135 = 7.2<i>x<\/i> + 108, 27 = 1.2<i>x<\/i> and <i>x<\/i> = 22.5. Answer: <b>22.5<\/b>", "hint": "The total value of the parts equals the value of the whole mixture, which weighs <i>x<\/i> + 15 pounds."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A tank holds 840 liters of water and is drained at a constant rate of 35 liters per minute. Which equation can be used to find <i>t<\/i>, the number of minutes after draining begins when 315 liters remain in the tank?", "opts": ["35<i>t<\/i> = 315", "840 + 35<i>t<\/i> = 315", "35(840 − <i>t<\/i>) = 315", "840 − 35<i>t<\/i> = 315"], "ans": 3, "sol": "The amount left is the starting 840 L minus 35 L for each minute: 840 − 35<i>t<\/i>. Set it equal to 315 (<i>t<\/i> = 15). Answer: <b>840 − 35<i>t<\/i> = 315<\/b>", "hint": "Is the water amount going up or down, and where does it start?"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A club pays a one-time printing setup fee and then sells hoodies at the same price each. The equation 18<i>n<\/i> − 240 = 1,200 models the situation, where <i>n<\/i> is the number of hoodies sold and 1,200 is the club's profit, in dollars. What does 240 represent?", "opts": ["The price of one hoodie", "The number of hoodies sold", "The profit the club made", "The setup fee, in dollars"], "ans": 3, "sol": "18<i>n<\/i> is the money from sales, so 18 is the price per hoodie. The 240 is subtracted once regardless of <i>n<\/i>, so it is the one-time setup fee. Answer: <b>The setup fee, in dollars<\/b>", "hint": "Which number is multiplied by <i>n<\/i>, and which one is subtracted only once?"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A school is sending 412 students and 20 adult chaperones on a trip. Each bus holds at most 52 people. What is the minimum number of buses needed?", "opts": ["7", "8", "9", "10"], "ans": 2, "sol": "Total people: 412 + 20 = 432. 52<i>b<\/i> = 432 gives <i>b<\/i> ≈ 8.31. Eight buses carry only 416 people, so 9 buses are needed. Answer: <b>9<\/b>", "hint": "Count everyone who rides. Then ask: can you send a fraction of a bus?"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "The sum of four consecutive odd integers is 232. What is the largest of the four integers?", "ans": ["61"], "sol": "<i>n<\/i> + (<i>n<\/i> + 2) + (<i>n<\/i> + 4) + (<i>n<\/i> + 6) = 232, so 4<i>n<\/i> + 12 = 232 and <i>n<\/i> = 55. The largest is 55 + 6 = 61. Answer: <b>61<\/b>", "hint": "Consecutive odd integers are 2 apart. Find the smallest, then add."}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Train A leaves a station at 9:00 a.m. traveling at 60 miles per hour. Train B leaves the same station at 10:30 a.m. on a parallel track in the same direction, traveling at 90 miles per hour. At what time does Train B catch up to Train A?", "opts": ["12:00 p.m.", "1:30 p.m.", "3:00 p.m.", "4:30 p.m."], "ans": 1, "sol": "Let <i>t<\/i> be the hours Train A has traveled; Train B has traveled <i>t<\/i> − 1.5. Catch-up: 60<i>t<\/i> = 90(<i>t<\/i> − 1.5), so 60<i>t<\/i> = 90<i>t<\/i> − 135 and <i>t<\/i> = 4.5. That is 4.5 hours after 9:00 a.m. Answer: <b>1:30 p.m.<\/b>", "hint": "When B catches A, they have gone the same distance. How much less time has B been moving?"}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Seven less than 4 times a number <i>n<\/i> is 29. Which equation represents this statement?", "opts": ["4<i>n<\/i> − 7 = 29", "7 − 4<i>n<\/i> = 29", "4(<i>n<\/i> − 7) = 29", "4<i>n<\/i> + 7 = 29"], "ans": 0, "sol": "“Seven less than 4<i>n<\/i>” means start with 4<i>n<\/i> and subtract 7. Answer: <b>4<i>n<\/i> − 7 = 29<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "A taxi ride costs $3.50 plus $2.25 per mile. A ride cost $26.00. How many miles long was the ride?", "ans": ["10"], "sol": "3.50 + 2.25<i>m<\/i> = 26.00, so 2.25<i>m<\/i> = 22.50 and <i>m<\/i> = 10. Answer: <b>10<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "The sum of two consecutive integers is 87. What is the larger integer?", "opts": ["42", "43", "44", "45"], "ans": 2, "sol": "<i>n<\/i> + (<i>n<\/i> + 1) = 87, so 2<i>n<\/i> = 86 and <i>n<\/i> = 43. The larger is 44. Answer: <b>44<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A car travels at a constant speed of 54 miles per hour. How many hours does it take the car to travel 243 miles?", "opts": ["0.22", "4.5", "189", "13,122"], "ans": 1, "sol": "54<i>t<\/i> = 243, so <i>t<\/i> = <span class=\"fq\"><span>243<\/span><span>54<\/span><\/span> = 4.5. Answer: <b>4.5<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Ana has 240 stickers and gives away 15 stickers each day. Which equation can be used to find <i>d<\/i>, the number of days until she has 60 stickers left?", "opts": ["15<i>d<\/i> − 240 = 60", "240 − 15 = 60<i>d<\/i>", "60 − 15<i>d<\/i> = 240", "240 − 15<i>d<\/i> = 60"], "ans": 3, "sol": "She starts with 240 and loses 15 per day: 240 − 15<i>d<\/i> = 60, giving <i>d<\/i> = 12. Answer: <b>240 − 15<i>d<\/i> = 60<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "Jada's savings are modeled by the equation 120 + 35<i>w<\/i> = 505, where <i>w<\/i> is the number of weeks she has been saving and 505 is her goal, in dollars. What does 35 represent?", "opts": ["The amount, in dollars, Jada saves each week", "The amount, in dollars, Jada had at the start", "The number of weeks needed to reach her goal", "Her savings goal, in dollars"], "ans": 0, "sol": "35 multiplies <i>w<\/i>, the number of weeks, so it is the amount added per week. (120 is the starting amount; <i>w<\/i> = 11.) Answer: <b>The amount, in dollars, Jada saves each week<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "After a 25% discount, the price of a jacket is $63. Which equation can be used to find <i>p<\/i>, the original price of the jacket, in dollars?", "opts": ["<i>p<\/i> − 25 = 63", "<i>p<\/i> − 0.25 = 63", "1.25<i>p<\/i> = 63", "0.75<i>p<\/i> = 63"], "ans": 3, "sol": "A 25% discount removes 0.25<i>p<\/i>: <i>p<\/i> − 0.25<i>p<\/i> = 0.75<i>p<\/i>. So 0.75<i>p<\/i> = 63 and <i>p<\/i> = 84. Answer: <b>0.75<i>p<\/i> = 63<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "Mia is 9 years older than her brother. In 5 years, the sum of their ages will be 53. How old is Mia's brother now?", "ans": ["17"], "sol": "Brother <i>b<\/i>, Mia <i>b<\/i> + 9. In 5 years: (<i>b<\/i> + 5) + (<i>b<\/i> + 14) = 53, so 2<i>b<\/i> + 19 = 53 and <i>b<\/i> = 17. Answer: <b>17<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Each of the two equal sides of an isosceles triangle is 4 centimeters less than 3 times the base. The perimeter of the triangle is 55 centimeters. What is the length of the base, in centimeters?", "opts": ["<span class=\"fq\"><span>47<\/span><span>7<\/span><\/span>", "9", "14.75", "23"], "ans": 1, "sol": "Base <i>b<\/i>, each equal side 3<i>b<\/i> − 4. Perimeter: <i>b<\/i> + 2(3<i>b<\/i> − 4) = 55, so 7<i>b<\/i> − 8 = 55 and <i>b<\/i> = 9. Answer: <b>9<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A café blends <i>x<\/i> pounds of coffee that costs $12 per pound with 8 pounds of coffee that costs $7 per pound. The blend costs $10 per pound. What is the value of <i>x<\/i>?", "opts": ["2", "8", "12", "20"], "ans": 2, "sol": "12<i>x<\/i> + 7(8) = 10(<i>x<\/i> + 8), so 12<i>x<\/i> + 56 = 10<i>x<\/i> + 80, 2<i>x<\/i> = 24 and <i>x<\/i> = 12. Answer: <b>12<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "Two hikers are 27 miles apart and start walking toward each other at the same time. One walks at 2.5 miles per hour and the other at 3.5 miles per hour. After how many hours will they meet?", "ans": ["4.5", "9/2"], "sol": "Walking toward each other, the gap closes at 2.5 + 3.5 = 6 mph. 6<i>t<\/i> = 27, so <i>t<\/i> = 4.5. Answer: <b>4.5<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The sum of three consecutive even integers is 318. If <i>x<\/i> is the smallest of the integers, which equation represents this situation?", "opts": ["<i>x<\/i> + (<i>x<\/i> + 1) + (<i>x<\/i> + 2) = 318", "<i>x<\/i> + (<i>x<\/i> + 2) + (<i>x<\/i> + 4) = 318", "<i>x<\/i> + 2<i>x<\/i> + 4<i>x<\/i> = 318", "3<i>x<\/i> + 4 = 318"], "ans": 1, "sol": "Consecutive even integers differ by 2: <i>x<\/i>, <i>x<\/i> + 2, <i>x<\/i> + 4. (3<i>x<\/i> + 6 = 318 gives <i>x<\/i> = 104.) Answer: <b><i>x<\/i> + (<i>x<\/i> + 2) + (<i>x<\/i> + 4) = 318<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The length of a rectangular garden is 3 meters less than 4 times its width, <i>w<\/i>. The perimeter of the garden is 94 meters. Which equation represents this situation?", "opts": ["2<i>w<\/i> + 2(4<i>w<\/i> − 3) = 94", "<i>w<\/i> + (4<i>w<\/i> − 3) = 94", "2<i>w<\/i> + 2(3 − 4<i>w<\/i>) = 94", "2<i>w<\/i> + 2(4<i>w<\/i>) − 3 = 94"], "ans": 0, "sol": "Length = 4<i>w<\/i> − 3, and perimeter = 2(width) + 2(length) = 2<i>w<\/i> + 2(4<i>w<\/i> − 3). (This gives <i>w<\/i> = 10.) Answer: <b>2<i>w<\/i> + 2(4<i>w<\/i> − 3) = 94<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A ship starts a voyage with 2,400 gallons of fuel and uses 85 gallons per hour. The solution of the equation 2,400 − 85<i>h<\/i> = 700 is <i>h<\/i> = 20. What does this solution represent?", "opts": ["The ship uses 20 gallons of fuel each hour.", "The ship runs out of fuel after 20 hours.", "After 20 hours, the ship has used 700 gallons of fuel.", "After 20 hours, the ship has 700 gallons of fuel left."], "ans": 3, "sol": "2,400 − 85<i>h<\/i> is the fuel remaining after <i>h<\/i> hours, and it equals 700 when <i>h<\/i> = 20. (It has used 1,700 gallons, and runs out after about 28.2 hours.) Answer: <b>After 20 hours, the ship has 700 gallons of fuel left.<\/b>"}, {"lo": "LO5", "diff": "M", "type": "spr", "q": "A caterer charges a $180 setup fee plus $24 per guest. A client can spend at most $1,600. What is the greatest number of guests the client can invite?", "ans": ["59"], "sol": "180 + 24<i>g<\/i> = 1,600 gives <i>g<\/i> = <span class=\"fq\"><span>1,420<\/span><span>24<\/span><\/span> ≈ 59.17. Guests must be whole, and 60 guests would cost $1,620, so the greatest number is 59. Answer: <b>59<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "When 15 is added to a number and the result is tripled, the answer is 9 less than 5 times the number. What is the number?", "opts": ["−4.5", "12", "27", "45"], "ans": 2, "sol": "3(<i>n<\/i> + 15) = 5<i>n<\/i> − 9, so 3<i>n<\/i> + 45 = 5<i>n<\/i> − 9, 54 = 2<i>n<\/i> and <i>n<\/i> = 27. Answer: <b>27<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "Nina is 3 times as old as Theo. Eight years ago, Nina was 7 times as old as Theo was then. How old is Nina now?", "ans": ["36"], "sol": "Theo <i>t<\/i>, Nina 3<i>t<\/i>. Eight years ago: 3<i>t<\/i> − 8 = 7(<i>t<\/i> − 8), so 3<i>t<\/i> − 8 = 7<i>t<\/i> − 56, 48 = 4<i>t<\/i> and <i>t<\/i> = 12. Nina is 36. Answer: <b>36<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A boat travels to an island at 24 kilometers per hour and returns along the same route at 16 kilometers per hour. The round trip takes 5 hours. How many kilometers is the island from the starting point?", "opts": ["40", "48", "50", "96"], "ans": 1, "sol": "Times add: <span class=\"fq\"><span><i>d<\/i><\/span><span>24<\/span><\/span> + <span class=\"fq\"><span><i>d<\/i><\/span><span>16<\/span><\/span> = 5. Multiply by 48: 2<i>d<\/i> + 3<i>d<\/i> = 240, so <i>d<\/i> = 48. Answer: <b>48<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A theater sold 420 tickets for a total of $4,930. Adult tickets cost $14 and child tickets cost $9. If <i>a<\/i> is the number of adult tickets sold, which equation represents this situation?", "opts": ["14<i>a<\/i> + 9(420 − <i>a<\/i>) = 4,930", "9<i>a<\/i> + 14(420 − <i>a<\/i>) = 4,930", "14<i>a<\/i> + 9<i>a<\/i> = 4,930", "23(420 − <i>a<\/i>) = 4,930"], "ans": 0, "sol": "Child tickets: 420 − <i>a<\/i>. Revenue: 14<i>a<\/i> + 9(420 − <i>a<\/i>) = 4,930, which gives <i>a<\/i> = 230. Answer: <b>14<i>a<\/i> + 9(420 − <i>a<\/i>) = 4,930<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Gym A charges a $60 joining fee plus $18 per month. Gym B charges $25 per month with no joining fee. The equation 60 + 18<i>m<\/i> = 25<i>m<\/i> compares the costs after <i>m<\/i> months. Which statement is true?", "opts": ["The two gyms cost the same after 8 months.", "Gym A costs less for every membership shorter than 9 months.", "Gym A costs less for memberships of 8 months or longer.", "Gym A costs less for memberships of 9 months or longer."], "ans": 3, "sol": "60 = 7<i>m<\/i> gives <i>m<\/i> ≈ 8.57. At 8 months A = $204 and B = $200 (B cheaper); at 9 months A = $222 and B = $225 (A cheaper), and A stays cheaper after that. Answer: <b>Gym A costs less for memberships of 9 months or longer.<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "A movie-rental service charges a fixed monthly fee plus $4.99 for each movie rented. In one month, Leo rented 6 movies and paid $47.93 in total. What is the monthly fee?", "opts": ["$17.99", "$22.98", "$42.94", "$77.87"], "ans": 0, "sol": "<i>f<\/i> + 6(4.99) = 47.93, so <i>f<\/i> + 29.94 = 47.93 and <i>f<\/i> = 17.99. Answer: <b>$17.99<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "The sum of three consecutive multiples of 5 is 285. What is the largest of the three numbers?", "opts": ["90", "95", "100", "105"], "ans": 2, "sol": "<i>n<\/i> + (<i>n<\/i> + 5) + (<i>n<\/i> + 10) = 285, so 3<i>n<\/i> + 15 = 285 and <i>n<\/i> = 90. The largest is 100. Answer: <b>100<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "How many grams of pure silver must be added to 150 grams of an alloy that is 40% silver to produce an alloy that is 70% silver?", "opts": ["45", "90", "105", "150"], "ans": 3, "sol": "Silver: <i>x<\/i> + 0.40(150) = 0.70(150 + <i>x<\/i>), so <i>x<\/i> + 60 = 105 + 0.7<i>x<\/i>, 0.3<i>x<\/i> = 45 and <i>x<\/i> = 150. Answer: <b>150<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A printer has already printed 120 pages of a 1,020-page job and prints 18 pages per minute. Which equation can be used to find <i>t<\/i>, the number of additional minutes needed to finish the job?", "opts": ["120 + 18<i>t<\/i> = 1,020", "18<i>t<\/i> = 1,020", "120<i>t<\/i> + 18 = 1,020", "18<i>t<\/i> − 120 = 1,020"], "ans": 0, "sol": "Pages printed so far plus 18 per minute must reach 1,020: 120 + 18<i>t<\/i> = 1,020, so <i>t<\/i> = 50. Answer: <b>120 + 18<i>t<\/i> = 1,020<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Priya invests $5,000, part at 6% simple annual interest and the rest at 11%. Her interest after one year is $410. The situation is modeled by 0.06<i>x<\/i> + 0.11(5,000 − <i>x<\/i>) = 410. What does 5,000 − <i>x<\/i> represent?", "opts": ["The interest, in dollars, earned at 11%", "The total interest, in dollars, after one year", "The total amount, in dollars, invested", "The amount, in dollars, invested at 11%"], "ans": 3, "sol": "<i>x<\/i> is the amount at 6%, so the rest of the $5,000, which is 5,000 − <i>x<\/i>, is the amount at 11%. (Here <i>x<\/i> = 2,800.) Answer: <b>The amount, in dollars, invested at 11%<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A courier charges $8.40 for the first pound of a package and $1.15 for each additional pound. Shipping a package costs $25.65. How many pounds does the package weigh?", "opts": ["2.7", "15", "16", "22.3"], "ans": 2, "sol": "8.40 + 1.15(<i>w<\/i> − 1) = 25.65, so 1.15(<i>w<\/i> − 1) = 17.25, <i>w<\/i> − 1 = 15 and <i>w<\/i> = 16. Answer: <b>16<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A salesperson earns $520 per week plus a 6% commission on the amount of her weekly sales above $3,000. One week she earned $880. What were her total sales that week?", "opts": ["$6,000", "$9,000", "$14,667", "$17,667"], "ans": 1, "sol": "520 + 0.06(<i>s<\/i> − 3,000) = 880, so 0.06(<i>s<\/i> − 3,000) = 360, <i>s<\/i> − 3,000 = 6,000 and <i>s<\/i> = 9,000. Answer: <b>$9,000<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "The length of a rectangle is 5 feet more than its width. If the length is increased by 3 feet and the width is doubled, the perimeter of the new rectangle is 68 feet. What is the width of the original rectangle, in feet?", "ans": ["26/3", "8.666", "8.667"], "sol": "New length <i>w<\/i> + 8, new width 2<i>w<\/i>. 2(<i>w<\/i> + 8) + 2(2<i>w<\/i>) = 68, so 6<i>w<\/i> + 16 = 68 and <i>w<\/i> = <span class=\"fq\"><span>52<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>26<\/span><span>3<\/span><\/span>. Answer: <b>26/3<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A runner leaves a trailhead at 7:00 a.m., running at 9 kilometers per hour. A cyclist leaves the same trailhead 40 minutes later on the same route, riding at 21 kilometers per hour. How many kilometers from the trailhead does the cyclist catch up to the runner?", "ans": ["10.5", "21/2"], "sol": "40 min = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> h. Runner's time <i>t<\/i>, cyclist's <i>t<\/i> − <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>: 9<i>t<\/i> = 21(<i>t<\/i> − <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>) = 21<i>t<\/i> − 14, so <i>t<\/i> = <span class=\"fq\"><span>7<\/span><span>6<\/span><\/span> h. Distance: 9 · <span class=\"fq\"><span>7<\/span><span>6<\/span><\/span> = 10.5. Answer: <b>10.5<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A 40-liter radiator contains a mixture that is 25% antifreeze. How many liters of the mixtur rns 1.2 centimeters per hour. Candle B is 24 centimeters tall and burns 0.8 centimeter per hour. Both are lit at the same time and burn at constant rates. What is the height, in centimeters, of each candle when they are the same height?", "ans": ["12"], "sol": "30 − 1.2<i>t<\/i> = 24 − 0.8<i>t<\/i>, so 6 = 0.4<i>t<\/i> and <i>t<\/i> = 15 hours. Height: 30 − 1.2(15) = 12. Answer: <b>12<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A store prices an item by marking up its wholesale cost by 40% and then taking $15 off during a sale. The sale price is $69.00. What was the wholesale cost?", "opts": ["$38.57", "$50.40", "$60.00", "$117.60"], "ans": 2, "sol": "Price = 1.40<i>c<\/i> − 15 = 69, so 1.40<i>c<\/i> = 84 and <i>c<\/i> = 60. Answer: <b>$60.00<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "The perimeter of a triangle is 90 meters. The second side is 1.5 times the first side, and the third side is 10 meters less than the sum of the first two sides. What is the length of the longest side, in meters?", "opts": ["20", "30", "40", "50"], "ans": 2, "sol": "<i>x<\/i> + 1.5<i>x<\/i> + (2.5<i>x<\/i> − 10) = 90, so 5<i>x<\/i> = 100 and <i>x<\/i> = 20. Sides: 20, 30, 40. Answer: <b>40<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "Company P rents vans for $60 plus $0.25 per mile. Company Q rents vans for $40 plus <i>r<\/i> dollars per mile, where <i>r<\/i> is a constant. The equation 60 + 0.25<i>m<\/i> = 40 + <i>r<\/i><i>m<\/i> is used to find the mileage <i>m<\/i> at which the costs are equal. For which value of <i>r<\/i> is there <b>no<\/b> positive mileage at which the two companies charge the same amount?", "opts": ["0.25", "0.30", "0.35", "0.45"], "ans": 0, "sol": "Rearranging: 20 = (<i>r<\/i> − 0.25)<i>m<\/i>. If <i>r<\/i> = 0.25 the right side is always 0, so there is no solution. For 0.30, 0.35 and 0.45, <i>m<\/i> = <span class=\"fq\"><span>20<\/span><span><i>r<\/i> − 0.25<\/span><\/span> is positive (400, 200 and 100 miles). Answer: <b>0.2 /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
