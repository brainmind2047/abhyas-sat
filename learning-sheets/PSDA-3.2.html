<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,

    --gr-grid:#E7E0CF; --gr-axis:#5C5546; --gr-line:#2D55C4; --gr-alt:#B7801A; --gr-shade:rgba(45,85,196,.16);

      --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
      --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
      --danger:#E38884; --danger-soft:#331D1B;
      --accent-text:#E0B75B; --focus:#E0B75B;
      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;
      color-scheme:dark;

  }
  :root[data-theme="dark"]{
    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
    --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
    --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
    --danger:#E38884; --danger-soft:#331D1B;
    --accent-text:#E0B75B; --focus:#E0B75B;

  }
  *{box-sizing:border-box;}

  .crest{width:40px; height:40px; border-radius:10px; background:#C79A3E; color:#16264A; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:17px; flex-shrink:0;}

  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}

  .concept p{margin:0 0 10px; max-width:68ch;}

  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}

  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}

  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}

  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}

  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}

  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}

  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */

  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}

  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}

  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}

  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}

<script>
(function(){
"use strict";
var S = {"id": "PSDA-3.2", "unit": "Problem-Solving and Data Analysis", "topic": "Probability and statistical inference", "title": "Sampling, inference and margin of error", "intro": "Researchers rarely measure a whole population, so they measure a random sample and use it to estimate a population value, reporting a margin of error to show how precise the estimate is. On the DSAT you will use sample results to estimate population values, build and read interval estimates, and decide which conclusions a margin of error does and does not support.", "los": [{"id": "LO1", "text": "Identify the population, sample, sample statistic and population parameter described in a study."}, {"id": "LO2", "text": "Use a sample proportion or sample mean to estimate a population proportion, mean or total."}, {"id": "LO3", "text": "Construct and interpret an interval estimate of the form estimate ± margin of error, and recover the estimate and margin of error from an interval."}, {"id": "LO4", "text": "Determine how sample size and variability in the data affect the margin of error."}, {"id": "LO5", "text": "Determine which conclusions a margin of error supports, including when two estimates have overlapping intervals."}], "notes": [{"lo": "LO1", "h": "Populations and samples", "html": "<p>A <b>population<\/b> is the entire group a question is about, such as all 12,000 voters in a town or every bottle a machine fills in a day. Measuring every member is usually too costly, so researchers measure a <b>sample<\/b>, a smaller group taken from the population.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Term<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><tr><td>Population<\/td><td>The whole group of interest<\/td><td>All 12,000 voters in the town<\/td><\/tr><tr><td>Sample<\/td><td>The members actually measured<\/td><td>400 of those voters chosen at random<\/td><\/tr><tr><td>Parameter<\/td><td>A number that describes the population<\/td><td>The percent of all 12,000 voters who support a plan<\/td><\/tr><tr><td>Statistic<\/td><td>A number calculated from the sample<\/td><td>The percent of the 400 sampled voters who support it<\/td><\/tr><\/table><\/div><div class=\"rule\">A statistic is known exactly but changes from one sample to another. A parameter is fixed but usually unknown, so we use a statistic to estimate it.<\/div><p>Memory aid: <b>p<\/b>arameter goes with <b>p<\/b>opulation, and <b>s<\/b>tatistic goes with <b>s<\/b>ample. If a group is small enough to measure completely, such as one class of 32 students, its mean is a parameter, because nothing was sampled.<\/p>"}, {"lo": "LO2", "h": "From sample to population", "html": "<p>A sample chosen at random tends to resemble the population it came from. So a sample proportion is our estimate of the population proportion, and a sample mean is our estimate of the population mean.<\/p><div class=\"eqs\">estimated count in population = (sample proportion) × (population size)<br>estimated population total = (sample mean) × (population size)<\/div><p>Example: in a random sample of 250 of a college's 6,000 students, 40 live in a hostel. The sample proportion is <span class=\"fq\"><span>40<\/span><span>250<\/span><\/span> = 0.16, so about 0.16 × 6,000 = 960 students at the college live in a hostel.<\/p><div class=\"rule\">Find the proportion or mean from the sample, then apply it to the whole population.<\/div><div class=\"tip\">DSAT tip: read what is asked. \"How many in the population\" needs the multiplication by the population size, but \"what percent of the population\" is simply the sample percent.<\/div>"}, {"lo": "LO2", "h": "Reading the sample from a table", "html": "<p>Sample results are often given in a table or graph. Read the count you need, and divide by the total that matches the group in the question.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Owns a bicycle<\/th><th>Does not<\/th><th>Total<\/th><\/tr><tr><td>Grade 9<\/td><td>36<\/td><td>24<\/td><td>60<\/td><\/tr><tr><td>Grade 10<\/td><td>27<\/td><td>63<\/td><td>90<\/td><\/tr><tr><td>Total<\/td><td>63<\/td><td>87<\/td><td>150<\/td><\/tr><\/table><\/div><p>Suppose this is a random sample of 150 of a school's 1,200 students in grades 9 and 10.<\/p><ul><li>Students in the school who are grade 9 bicycle owners: <span class=\"fq\"><span>36<\/span><span>150<\/span><\/span> × 1,200 = 288, because the question is about the whole school.<\/li><li>If the school has 520 grade 9 students, the number of them who own a bicycle is <span class=\"fq\"><span>36<\/span><span>60<\/span><\/span> × 520 = 312, because the question is about grade 9 only.<\/li><\/ul><div class=\"rule\">A count out of the whole sample estimates a share of the whole population; a count out of one row estimates a share of that row's group.<\/div>"}, {"lo": "LO3", "h": "Margin of error and the interval estimate", "html": "<p>A sample statistic is rarely exactly equal to the parameter. The <b>margin of error<\/b> tells how far the parameter could plausibly be from the estimate. Together they give an <b>interval estimate<\/b>:<\/p><div class=\"eqs\">from (estimate − margin of error) to (estimate + margin of error)<\/div><p>If a random sample gives a mean of 7.2 hours with a margin of error of 0.5 hour, the plausible values of the population mean run from 6.7 to 7.7 hours. A value inside the interval is a plausible value of the parameter; a value outside it is not.<\/p><div class=\"rule\">For an interval from <i>L<\/i> to <i>U<\/i>: the estimate is <span class=\"fq\"><span><i>L<\/i> + <i>U<\/i><\/span><span>2<\/span><\/span> and the margin of error is <span class=\"fq\"><span><i>U<\/i> − <i>L<\/i><\/span><span>2<\/span><\/span>.<\/div><p>To turn a percent interval into a count, multiply each end by the population size.<\/p><div class=\"tip\">For percents, the DSAT may write a margin of error of 3% to mean 3 percentage points: an estimate of 52% then gives 49% to 55%.<\/div>"}, {"lo": "LO4", "h": "What changes the margin of error", "html": "<p>For a random sample, two things control the size of the margin of error.<\/p><ul><li><b>Sample size.<\/b> A larger random sample gives a more precise estimate, so its margin of error is smaller. A smaller sample gives a larger margin.<\/li><li><b>Variability.<\/b> When the data values are more spread out, the estimate could land farther from the parameter, so the margin of error is larger.<\/li><\/ul><div class=\"rule\">Larger sample: smaller margin of error. More variable data: larger margin of error.<\/div><svg class=\"fig\" viewBox=\"0 0 320 188\" role=\"img\" aria-label=\"Two dot plots on the same scale from 15 to 45 minutes. Sample P has 10 dots clustered from 27 to 33. Sample Q has 10 dots spread from 18 to 42. Both samples have a mean of 30 minutes.\"><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"70\" y1=\"72\" x2=\"304\" y2=\"72\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"70\" y1=\"72\" x2=\"70\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"77.8\" y1=\"72\" x2=\"77.8\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"85.6\" y1=\"72\" x2=\"85.6\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"93.4\" y1=\"72\" x2=\"93.4\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"101.2\" y1=\"72\" x2=\"101.2\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"109\" y1=\"72\" x2=\"109\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"116.8\" y1=\"72\" x2=\"116.8\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"124.6\" y1=\"72\" x2=\"124.6\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"132.4\" y1=\"72\" x2=\"132.4\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1. "76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"280.6\" y1=\"72\" x2=\"280.6\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"288.4\" y1=\"72\" x2=\"288.4\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"296.2\" y1=\"72\" x2=\"296.2\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"304\" y1=\"72\" x2=\"304\" y2=\"76\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"163.6\" cy=\"66\"/><circle r=\"3.5\" cx=\"171.4\" cy=\"66\"/><circle r=\"3.5\" cx=\"179.2\" cy=\"66\"/><circle r=\"3.5\" cx=\"179.2\" cy=\"58\"/><circle r=\"3.5\" cx=\"187\" cy=\"66\"/><circle r=\"3.5\" cx=\"187\" cy=\"58\"/><circle r=\"3.5\" cx=\"194.8\" cy=\"66\"/><circle r=\"3.5\" cx=\"194.8\" cy=\"58\"/><circle r=\"3.5\" cx=\"202.6\" cy=\"66\"/><circle r=\"3.5\" cx=\"210.4\" cy=\"66\"/><\/g><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"70\" y1=\"150\" x2=\"304\" y2=\"150\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"70\" y1=\"150\" x2=\"70\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"77.8\" y1=\"150\" x2=\"77.8\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"85.6\" y1=\"150\" x2=\"85.6\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"93.4\" y1=\"150\" x2=\"93.4\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"101.2\" y1=\"150\" x2=\"101.2\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"109\" y1=\"150\" x2=\"109\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"116.8\" y1=\"150\" x2=\"116.8\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"124.6\" y1=\"150\" x2=\"124.6\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"132.4\" y1=\"150\" x2=\"132.4\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"140.2\" y1=\"150\" x2=\"140.2\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"148\" y1=\"150\" x2=\"148\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"155.8\" y1=\"150\" x2=\"155.8\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"163.6\" y1=\"150\" x2=\"163.6\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"171.4\" y1=\"150\" x2=\"171.4\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"179.2\" y1=\"150\" x2=\"179.2\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"187\" y1=\"150\" x2=\"187\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"194.8\" y1=\"150\" x2=\"194.8\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"202.6\" y1=\"150\" x2=\"202.6\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"210.4\" y1=\"150\" x2=\"210.4\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"218.2\" y1=\"150\" x2=\"218.2\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"226\" y1=\"150\" x2=\"226\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"233.8\" y1=\"150\" x2=\"233.8\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"241.6\" y1=\"150\" x2=\"241.6\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"249.4\" y1=\"150\" x2=\"249.4\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"257.2\" y1=\"150\" x2=\"257.2\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"265\" y1=\"150\" x2=\"265\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"272.8\" y1=\"150\" x2=\"272.8\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"280.6\" y1=\"150\" x2=\"280.6\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"288.4\" y1=\"150\" x2=\"288.4\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"296.2\" y1=\"150\" x2=\"296.2\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"304\" y1=\"150\" x2=\"304\" y2=\"154\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"93.4\" cy=\"144\"/><circle r=\"3.5\" cx=\"116.8\" cy=\"144\"/><circle r=\"3.5\" cx=\"140.2\" cy=\"144\"/><circle r=\"3.5\" cx=\"163.6\" cy=\"144\"/><circle r=\"3.5\" cx=\"187\" cy=\"144\"/><circle r=\"3.5\" cx=\"187\" cy=\"136\"/><circle r=\"3.5\" cx=\"210.4\" cy=\"144\"/><circle r=\"3.5\" cx=\"233.8\" cy=\"144\"/><circle r=\"3.5\" cx=\"257.2\" cy=\"144\"/><circle r=\"3.5\" cx=\"280.6\" cy=\"144\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"70\" y=\"87\" text-anchor=\"middle\">15<\/text><text x=\"109\" y=\"87\" text-anchor=\"middle\">20<\/text><text x=\"148\" y=\"87\" text-anchor=\"middle\">25<\/text><text x=\"187\" y=\"87\" text-anchor=\"middle\">30<\/text><text x=\"226\" y=\"87\" text-anchor=\"middle\">35<\/text><text x=\"265\" y=\"87\" text-anchor=\"middle\">40<\/text><text x=\"304\" y=\"87\" text-anchor=\"middle\">45<\/text><text x=\"62\" y=\"69\" text-anchor=\"end\">Sample P<\/text><text x=\"70\" y=\"165\" text-anchor=\"middle\">15<\/text><text x=\"109\" y=\"165\" text-anchor=\"middle\">20<\/text><text x=\"148\" y=\"165\" text-anchor=\"middle\">25<\/text><text x=\"187\" y=\"165\" text-anchor=\"middle\">30<\/text><text x=\"226\" y=\"165\" text-anchor=\"middle\">35<\/text><text x=\"265\" y=\"165\" text-anchor=\"middle\">40<\/text><text x=\"304\" y=\"165\" text-anchor=\"middle\">45<\/text><text x=\"62\" y=\"147\" text-anchor=\"end\">Sample Q<\/text><text x=\"187\" y=\"184\" text-anchor=\"middle\">Time to finish puzzle (minutes)<\/text><\/g><\/svg><p>Both samples above have 10 values and a mean of 30 minutes, but sample Q is far more spread out, so an estimate based on sample Q would have the larger margin of error.<\/p><div class=\"tip\">The size of the population hardly matters when it is much larger than the sample. The DSAT does not ask you to calculate a margin of error, only to reason about what makes it larger or smaller.<\/div>"}, {"lo": "LO5", "h": "What a margin of error does not say", "html": "<p>An interval estimate is a statement about a <b>parameter<\/b>, such as the mean or percent for the whole population. Check every claim against these limits.<\/p><ul><li>It does <b>not<\/b> describe individuals. A mean of 7.2 ± 0.5 hours does not mean that most people sleep between 6.7 and 7.7 hours.<\/li><li>It does <b>not<\/b> give certainty. The parameter is plausibly inside the interval, not definitely.<\/li><li>It does <b>not<\/b> correct a biased sample. It measures only the chance variation of random sampling, so it means little if the sample was not chosen at random.<\/li><li>It applies only to the population that was sampled.<\/li><\/ul><div class=\"rule\">The safest conclusion: it is plausible that the mean (or percent) for the sampled population is between the two ends of the interval.<\/div><p>To test a claim, ask whether the claimed value is inside the interval. If a survey gives 38% ± 4%, a claim of 45% is not supported, but 40% is plausible.<\/p>"}, {"lo": "LO5", "h": "Comparing two estimates", "html": "<p>When two groups are estimated separately, write out both intervals before you compare them.<\/p><ul><li>If the intervals <b>do not overlap<\/b>, every plausible value for one group is greater than every plausible value for the other, so the data support a difference.<\/li><li>If the intervals <b>overlap<\/b>, the data do not give convincing evidence that either group is greater, even when one estimate is larger.<\/li><\/ul><svg class=\"fig\" viewBox=\"0 0 320 146\" role=\"img\" aria-label=\"Interval estimates for two plans. Plan A: estimate 48 percent, interval from 45 to 51 percent. Plan B: estimate 43 percent, interval from 40 to 46 percent. The intervals overlap from 45 to 46 percent.\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\"><line x1=\"78\" y1=\"12\" x2=\"78\" y2=\"106\"/><line x1=\"123.2\" y1=\"12\" x2=\"123.2\" y2=\"106\"/><line x1=\"168.4\" y1=\"12\" x2=\"168.4\" y2=\"106\"/><line x1=\"213.6\" y1=\"12\" x2=\"213.6\" y2=\"106\"/><line x1=\"258.8\" y1=\"12\" x2=\"258.8\" y2=\"106\"/><line x1=\"304\" y1=\"12\" x2=\"304\" y2=\"106\"/><\/g><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"78\" y1=\"106\" x2=\"304\" y2=\"106\"/><line class=\"fg-fit\" stroke=\"currentColor\" stroke-width=\"2.2\" x1=\"179.7\" y1=\"28\" x2=\"247.5\" y2=\"28\"/><line class=\"fg-fit\" stroke=\"currentColor\" stroke-width=\"2.2\" x1=\"179.7\" y1=\"22\" x2=\"179.7\" y2=\"34\"/><line class=\"fg-fit\" stroke=\"currentColor\" stroke-width=\"2.2\" x1=\"247.5\" y1=\"22\" x2=\"247.5\" y2=\"34\"/><line class=\"fg-fit\" stroke=\"currentColor\" stroke-width=\"2.2\" x1=\"123.2\" y1=\"68\" x2=\"191\" y2=\"68\"/><line class=\"fg-fit\" stroke=\"currentColor\" stroke-width=\"2.2\" x1=\"123.2\" y1=\"62\" x2=\"123.2\" y2=\"74\"/><line class=\"fg-fit\" stroke=\"currentColor\" stroke-width=\"2.2\" x1=\"191\" y1=\"62\" x2=\"191\" y2=\"74\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"213.6\" cy=\"28\"/><circle r=\"3.5\" cx=\"157.1\" cy=\"68\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"70\" y=\"32\" text-anchor=\"end\">Plan A<\/text><text x=\"70\" y=\"72\" text-anchor=\"end\">Plan B<\/text><text x=\"78\" y=\"121\" text-anchor=\"middle\">36<\/text><text x=\"123.2\" y=\"121\" text-anchor=\"middle\">40<\/text><text x=\"168.4\" y=\"121\" text-anchor=\"middle\">44<\/text><text x=\"213.6\" y=\"121\" text-anchor=\"middle\">48<\/text><text x=\"258.8\" y=\"121\" text-anchor=\"middle\">52<\/text><text x=\"304\" y=\"121\" text-anchor=\"middle\">56<\/text><text x=\"191\" y=\"140\" text-anchor=\"middle\">Percent of residents in favor<\/text><\/g><\/svg><p>In a random poll, 48% ± 3% favor plan A (45% to 51%) and 43% ± 3% favor plan B (40% to 46%). The intervals share the values from 45% to 46%, so the poll does not show that plan A has more support among all residents.<\/p><div class=\"rule\">Overlapping intervals: no conclusion about which is greater. Separate intervals: the group whose interval lies higher is likely greater.<\/div>"}], "examples": [{"lo": "LO1", "q": "A nonprofit wants to know the mean number of hours per week that the 5,200 volunteers in its state network spend volunteering. It randomly selects 130 of these volunteers and finds that their mean is 6.5 hours per week. Identify the population, the sample, the statistic and the parameter.", "steps": ["The population is the whole group the nonprofit wants to describe: all 5,200 volunteers in the network.", "The sample is the group actually measured: the 130 randomly selected volunteers.", "The statistic is the number calculated from the sample: the mean of 6.5 hours per week for the 130 volunteers.", "The parameter is the unknown mean number of hours per week for all 5,200 volunteers; 6.5 is the estimate of it."], "ans": "Population: all 5,200 volunteers. Sample: the 130 selected volunteers. Statistic: 6.5 hours per week. Parameter: the mean for all 5,200 volunteers."}, {"lo": "LO2", "q": "In a random sample of 300 of the 18,000 households in a city, 57 households had rooftop solar panels. Based on the sample, about how many households in the city have rooftop solar panels?", "steps": ["Sample proportion: <span class=\"fq\"><span>57<\/span><span>300<\/span><\/span> = 0.19.", "A random sample is expected to resemble the population, so about 19% of all 18,000 households have panels.", "0.19 × 18,000 = 3,420."], "ans": "About 3,420 households"}, {"lo": "LO3", "q": "A mill weighs a random sample of 80 bags of rice from one day's production. The mean mass of the sampled bags is 5.04 kilograms, with a margin of error of 0.06 kilogram. Give the interval estimate for the mean mass of all bags produced that day, and decide whether 5.00 kilograms is a plausible value of that mean.", "steps": ["Lower end: 5.04 − 0.06 = 4.98 kilograms.", "Upper end: 5.04 + 0.06 = 5.10 kilograms.", "Since 5.00 is between 4.98 and 5.10, a population mean of 5.00 kilograms is plausible."], "ans": "4.98 to 5.10 kilograms; yes, 5.00 kilograms is plausible"}, {"lo": "LO3", "q": "A random sample of 500 of the 24,000 students at a university found that 35% live off campus, with a margin of error of 4 percentage points. Between what two numbers is the total number of students who live off campus plausibly found?", "steps": ["Percent interval: 35% − 4% = 31% up to 35% + 4% = 39%.", "Lower count: 0.31 × 24,000 = 7,440.", "Upper count: 0.39 × 24,000 = 9,360."], "ans": "Between 7,440 and 9,360 students"}, {"lo": "LO4", "q": "A team estimated the mean battery life of a phone model by testing a random sample of 300 phones, and it reported a margin of error of 0.4 hour. Which change would most likely produce a smaller margin of error?<br>A) Testing a random sample of 150 phones<br>B) Testing a random sample of 1,200 phones<br>C) Testing a random sample of 300 phones of a model whose battery life varies more<br>D) Testing a random sample of 300 phones from a production run twice as large", "steps": ["A smaller sample (A) gives a less precise estimate, so a larger margin of error.", "More variable data (C) also gives a larger margin of error.", "The size of the production run (D) has almost no effect when it is far larger than the sample.", "A larger random sample (B) gives a more precise estimate and a smaller margin of error."], "ans": "B"}, {"lo": "LO5", "q": "In a random poll of a city's likely voters, 51% support candidate Rao and 46% support candidate Lin. The margin of error for each estimate is 3.5 percentage points. Which conclusion is best supported?<br>A) Rao has more support than Lin among all likely voters.<br>B) The poll does not show which candidate has more support among all likely voters.<br>C) Exactly 51% of all likely voters support Rao.<br>D) Fewer than 46% of all likely voters support Lin.", "steps": ["Rao: 51 − 3.5 = 47.5% up to 51 + 3.5 = 54.5%.", "Lin: 46 − 3.5 = 42.5% up to 46 + 3.5 = 49.5%.", "The intervals overlap from 47.5% to 49.5%; for example, Rao at 48% and Lin at 49% are both plausible, so A is not supported.", "C and D claim certainty that a sample cannot give, so B is the best conclusion."], "ans": "B"}], "traps": ["Reading an interval estimate as the range of individual values. \"Mean 7.2 ± 0.5 hours\" is about the population mean, not about how long each person sleeps.", "Treating the interval as certain. The parameter is plausibly inside the interval; the correct answer choice usually says \"plausible\", not \"definitely\".", "Declaring a winner because one estimate is larger. If the two intervals overlap, the data do not show which population value is greater.", "Using the whole width of an interval as the margin of error. The margin of error is half the width: for 52% to 60% it is 4 percentage points, not 8.", "Stopping at the sample count or percent when the question asks for a number in the population. Multiply the sample proportion by the population size.", "Thinking a larger sample makes the margin of error larger, or that the size of the population drives it. A larger sample and less variable data shrink the margin."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A city council wants to know the mean commute time of the 64,000 working adults in the city. It surveys 500 working adults selected at random and finds that their mean commute time is 27.4 minutes. What is the population in this study?", "opts": ["All 64,000 working adults in the city", "The 500 working adults who were surveyed", "The mean commute time of 27.4 minutes", "The working adults whose commute is longer than 27.4 minutes"], "ans": 0, "sol": "The population is the entire group the council wants to describe.<br>That group is every working adult in the city, not only the 500 who were surveyed (the sample).<br>Answer: <b>All 64,000 working adults in the city<\/b>", "hint": "The population is the whole group the council wants to learn about, not just the people it talked to."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A biologist catches 120 trout at random from a lake and finds that 15% of them carry a certain parasite. In this study, which of the following is a statistic?", "opts": ["The percent of all trout in the lake that carry the parasite", "The percent of the 120 caught trout that carry the parasite", "All of the trout in the lake", "The total number of trout in the lake"], "ans": 1, "sol": "A statistic is a number calculated from the sample.<br>The percent of all trout in the lake is a parameter, and \"all of the trout\" is the population, not a number.<br>The 15% found among the 120 caught trout is a statistic.<br>Answer: <b>The percent of the 120 caught trout that carry the parasite<\/b>", "hint": "A statistic is a number you can calculate from the fish that were actually caught."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A university has 9,000 students. In a random sample of 400 of these students, 72 said they bike to campus. Based on the sample, which of the following is the best estimate of the number of students at the university who bike to campus?", "opts": ["72", "162", "1,620", "7,380"], "ans": 2, "sol": "Sample proportion: <span class=\"fq\"><span>72<\/span><span>400<\/span><\/span> = 0.18.<br>Apply it to the whole university: 0.18 × 9,000 = 1,620.<br>Answer: <b>1,620<\/b>", "hint": "Find the fraction of the sample that bikes, then apply that fraction to all 9,000 students."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "An orchard harvested 12,000 apples. A worker weighed a random sample of 50 of these apples and found a mean mass of 0.18 kilogram. Based on the sample, what is the estimated total mass, in kilograms, of all 12,000 apples?", "ans": ["2160"], "sol": "The sample mean estimates the mean mass of all the apples: about 0.18 kilogram each.<br>Total ≈ mean × number of apples = 0.18 × 12,000 = 2,160.<br>Answer: <b>2160<\/b>", "hint": "The sample mean estimates the mean mass of every apple in the harvest. How do you get a total from a mean?"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Based on a random sample, a survey estimates that 58% of a town's residents use the public library, with a margin of error of 3 percentage points. Which interval gives the plausible values for the percent of all residents who use the library?", "opts": ["52% to 64%", "55% to 61%", "56.5% to 59.5%", "58% to 61%"], "ans": 1, "sol": "Subtract the margin of error from the estimate and add it to the estimate.<br>58 − 3 = 55 and 58 + 3 = 61.<br>Answer: <b>55% to 61%<\/b>", "hint": "An interval estimate stretches the margin of error out on both sides of the estimate."}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "Based on a random sample of teenagers in a district, a report states that the mean amount of sleep on school nights for all teenagers in the district is plausibly between 6.8 hours and 7.6 hours. What is the margin of error, in hours, for this estimate?", "ans": ["0.4", ".4"], "sol": "The interval is estimate ± margin of error, so its width is twice the margin of error.<br>Width: 7.6 − 6.8 = 0.8.<br>Margin of error: <span class=\"fq\"><span>0.8<\/span><span>2<\/span><\/span> = 0.4.<br>Answer: <b>0.4<\/b>", "hint": "The estimate sits exactly in the middle of the interval. How far is it from each end?"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A town has 25,000 registered voters. In a random sample of 600 of them, 38% support a new library tax, with a margin of error of 4 percentage points. Based on this survey, what is the greatest plausible number of registered voters in the town who support the tax?", "ans": ["10500"], "sol": "The upper end of the percent interval is 38% + 4% = 42%.<br>Apply it to the town: 0.42 × 25,000 = 10,500.<br>Answer: <b>10500<\/b>", "hint": "Find the upper end of the interval as a percent first, then apply that percent to the whole town."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Four random samples will be selected from the same population of adults to estimate their mean daily water intake. Which sample size would most likely give the smallest margin of error?", "opts": ["40", "100", "250", "900"], "ans": 3, "sol": "For random samples from the same population, a larger sample gives a more precise estimate.<br>The largest sample, 900 adults, gives the smallest margin of error.<br>Answer: <b>900<\/b>", "hint": "Does more data from the same population make an estimate more precise or less precise?"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A counselor selected a random sample of 15 students from each of two schools and recorded each student's daily study time. The dot plots show the data. Each sample will be used to estimate the mean daily study time of all students at its school.<svg class=\"fig\" viewBox=\"0 0 320 188\" role=\"img\" aria-label=\"Two dot plots of daily study time in minutes, each with 15 dots. School X: one dot at 40, three at 45, six at 50, three at 55, two at 60. School Y: one dot each at 15, 20, 30, 35, 40, 45, two at 50, then one each at 55, 60, 65, 70, 80, 85 and 90.\"><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"70\" y1=\"72\" x2=\"304\" y2=\"72\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"70\" y1=\"72\" x2=\"70\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"84.6\" y1=\"72\" x2=\"84.6\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"99.2\" y1=\"72\" x2=\"99.2\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"113.9\" y1=\"72\" x2=\"113.9\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"128.5\" y1=\"72\" x2=\"128.5\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"143.1\" y1=\"72\" x2=\"143.1\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"157.8\" y1=\"72\" x2=\"157.8\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"172.4\" y1=\"72\" x2=\"172.4\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"187\" y1=\"72\" x2=\"187\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"201.6\" y1=\"72\" x2=\"201.6\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"216.2\" y1=\"72\" x2=\"216.2\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"230.9\" y1=\"72\" x2=\"230.9\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"245.5\" y1=\"72\" x2=\"245.5\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"260.1\" y1=\"72\" x2=\"260.1\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"274.8\" y1=\"72\" x2=\"274.8\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"289.4\" y1=\"72\" x2=\"289.4\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"304\" y1=\"72\" x2=\"304\" y2=\"76\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"157.8\" cy=\"66\"/><circle r=\"3.5\" cx=\"172.4\" cy=\"66\"/><circle r=\"3.5\" cx=\"172.4\" cy=\"
