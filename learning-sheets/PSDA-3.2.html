0.9\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"245.5\" y1=\"150\" x2=\"245.5\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"260.1\" y1=\"150\" x2=\"260.1\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"274.8\" y1=\"150\" x2=\"274.8\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"289.4\" y1=\"150\" x2=\"289.4\" y2=\"154\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"304\" y1=\"150\" x2=\"304\" y2=\"154\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"84.6\" cy=\"144\"/><circle r=\"3.5\" cx=\"99.2\" cy=\"144\"/><circle r=\"3.5\" cx=\"128.5\" cy=\"144\"/><circle r=\"3.5\" cx=\"143.1\" cy=\"144\"/><circle r=\"3.5\" cx=\"157.8\" cy=\"144\"/><circle r=\"3.5\" cx=\"172.4\" cy=\"144\"/><circle r=\"3.5\" cx=\"187\" cy=\"144\"/><circle r=\"3.5\" cx=\"187\" cy=\"136\"/><circle r=\"3.5\" cx=\"201.6\" cy=\"144\"/><circle r=\"3.5\" cx=\"216.2\" cy=\"144\"/><circle r=\"3.5\" cx=\"230.9\" cy=\"144\"/><circle r=\"3.5\" cx=\"245.5\" cy=\"144\"/><circle r=\"3.5\" cx=\"274.8\" cy=\"144\"/><circle r=\"3.5\" cx=\"289.4\" cy=\"144\"/><circle r=\"3.5\" cx=\"304\" cy=\"144\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"70\" y=\"87\" text-anchor=\"middle\">10<\/text><text x=\"99.2\" y=\"87\" text-anchor=\"middle\">20<\/text><text x=\"128.5\" y=\"87\" text-anchor=\"middle\">30<\/text><text x=\"157.8\" y=\"87\" text-anchor=\"middle\">40<\/text><text x=\"187\" y=\"87\" text-anchor=\"middle\">50<\/text><text x=\"216.2\" y=\"87\" text-anchor=\"middle\">60<\/text><text x=\"245.5\" y=\"87\" text-anchor=\"middle\">70<\/text><text x=\"274.8\" y=\"87\" text-anchor=\"middle\">80<\/text><text x=\"304\" y=\"87\" text-anchor=\"middle\">90<\/text><text x=\"62\" y=\"69\" text-anchor=\"end\">School X<\/text><text x=\"70\" y=\"165\" text-anchor=\"middle\">10<\/text><text x=\"99.2\" y=\"165\" text-anchor=\"middle\">20<\/text><text x=\"128.5\" y=\"165\" text-anchor=\"middle\">30<\/text><text x=\"157.8\" y=\"165\" text-anchor=\"middle\">40<\/text><text x=\"187\" y=\"165\" text-anchor=\"middle\">50<\/text><text x=\"216.2\" y=\"165\" text-anchor=\"middle\">60<\/text><text x=\"245.5\" y=\"165\" text-anchor=\"middle\">70<\/text><text x=\"274.8\" y=\"165\" text-anchor=\"middle\">80<\/text><text x=\"304\" y=\"165\" text-anchor=\"middle\">90<\/text><text x=\"62\" y=\"147\" text-anchor=\"end\">School Y<\/text><text x=\"187\" y=\"184\" text-anchor=\"middle\">Daily study time (minutes)<\/text><\/g><\/svg>Which statement about the margins of error is most likely true?", "opts": ["The estimate for school X has the smaller margin of error, because the data for school X are less spread out.", "The estimate for school Y has the smaller margin of error, because the data for school Y have the greater range.", "The margins of error are equal, because the two samples are the same size.", "The estimate for school Y has the smaller margin of error, because school Y has the greatest single value."], "ans": 0, "sol": "Both samples have 15 students, so sample size does not separate them.<br>The school X data run only from 40 to 60 minutes, while the school Y data run from 15 to 90 minutes.<br>Less variable data give a smaller margin of error, so school X has the smaller margin.<br>Answer: <b>The estimate for school X has the smaller margin of error, because the data for school X are less spread out.<\/b>", "hint": "The sample sizes are equal, so look at the other factor that affects a margin of error."}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "A factory tested a random sample of 200 of the light bulbs it produced last month. The mean lifetime of the sampled bulbs was 1,150 hours, with a margin of error of 40 hours. Which of the following is the most appropriate conclusion?", "opts": ["Every bulb produced last month lasts between 1,110 hours and 1,190 hours.", "The mean lifetime of all bulbs produced last month is exactly 1,150 hours.", "It is plausible that the mean lifetime of all bulbs produced last month is between 1,110 hours and 1,190 hours.", "The mean lifetime of all bulbs produced last month is greater than 1,190 hours."], "ans": 2, "sol": "Interval: 1,150 − 40 = 1,110 up to 1,150 + 40 = 1,190 hours.<br>The interval is about the mean of all bulbs, not each bulb, and it gives plausible values, not an exact value.<br>Answer: <b>It is plausible that the mean lifetime of all bulbs produced last month is between 1,110 hours and 1,190 hours.<\/b>", "hint": "A margin of error describes uncertainty about the population mean, not about individual bulbs."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A company surveys a random sample of its customers each year. Last year, 62% of the sampled customers said they were satisfied, with a margin of error of 4 percentage points. This year, 57% said they were satisfied, with a margin of error of 4 percentage points. A manager concludes that the percent of all customers who are satisfied has decreased. Which statement best evaluates the manager's conclusion?", "opts": ["The conclusion is supported, because 57% is less than 62%.", "The conclusion is supported, because 57% is not in the interval from 58% to 66%.", "The conclusion cannot be evaluated without knowing the total number of customers.", "The conclusion is not supported, because the intervals 58% to 66% and 53% to 61% overlap."], "ans": 3, "sol": "Last year: 62 ± 4 gives 58% to 66%. This year: 57 ± 4 gives 53% to 61%.<br>The intervals share 58% to 61%, so the satisfied percent could plausibly be 60% in both years.<br>Comparing one estimate with the other interval is not enough; both intervals must be compared.<br>Answer: <b>The conclusion is not supported, because the intervals 58% to 66% and 53% to 61% overlap.<\/b>", "hint": "Write out both intervals. Is there a percent that is plausible for both years?"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Random samples of students from two school districts were asked how many minutes they spend on homework each day. For District A, the sample mean was 64.2 minutes, with a margin of error of 1.5 minutes. For District B, the sample mean was 60.1 minutes, with a margin of error of 1.8 minutes. Which of the following is best supported by these results?", "opts": ["The mean daily homework time for all students in District A is likely greater than that for all students in District B.", "No conclusion can be made about which district has the greater mean, because both estimates have a margin of error.", "Every student in District A spends more time on homework each day than every student in District B.", "The mean daily homework time for all students in District A is exactly 4.1 minutes greater than that for District B."], "ans": 0, "sol": "District A: 64.2 ± 1.5 gives 62.7 to 65.7 minutes. District B: 60.1 ± 1.8 gives 58.3 to 61.9 minutes.<br>The intervals do not overlap: every plausible value for A is greater than every plausible value for B.<br>The results describe means, not every student, and the difference is not known exactly.<br>Answer: <b>The mean daily homework time for all students in District A is likely greater than that for all students in District B.<\/b>", "hint": "Write both intervals out. Do they share any values?"}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "To estimate the percent of the 2,800 households in a village that own a two-wheeler, an inspector visits 140 households chosen at random. What is the sample in this study?", "opts": ["The 140 households the inspector visits", "All 2,800 households in the village", "The percent of all households in the village that own a two-wheeler", "The households in the village that own a two-wheeler"], "ans": 0, "sol": "The sample is the group that is actually measured.<br>The inspector measures only the 140 households visited; all 2,800 households form the population.<br>Answer: <b>The 140 households the inspector visits<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "A factory fills 50,000 packets of tea each day. A quality inspector weighs 60 packets selected at random from one day's production. Which of the following is a parameter?", "opts": ["The mean weight of the 60 packets that were weighed", "The mean weight of all 50,000 packets filled that day", "The weight of the heaviest of the 60 packets", "The number of the 60 packets that weigh less than the labeled amount"], "ans": 1, "sol": "A parameter is a number that describes the whole population.<br>The population is all 50,000 packets filled that day; the other choices describe only the 60 sampled packets, so they are statistics.<br>Answer: <b>The mean weight of all 50,000 packets filled that day<\/b>"}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "In a random sample of 80 of a school's students, 20 said science is their favorite subject. Based on the sample, what percent of all students at the school would be expected to say that science is their favorite subject? (Disregard the % sign when entering your answer.)", "ans": ["25"], "sol": "Sample proportion: <span class=\"fq\"><span>20<\/span><span>80<\/span><\/span> = 0.25.<br>The sample proportion estimates the population proportion, so about 25% of all students.<br>Answer: <b>25<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A sample proportion is 0.36, with a margin of error of 0.05. Which of the following is a plausible value for the population proportion?", "opts": ["0.29", "0.30", "0.40", "0.42"], "ans": 2, "sol": "Interval: 0.36 − 0.05 = 0.31 up to 0.36 + 0.05 = 0.41.<br>Only 0.40 is between 0.31 and 0.41.<br>Answer: <b>0.40<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A researcher estimates a population mean from a random sample. If the researcher instead uses a larger random sample from the same population, how will the margin of error most likely change?", "opts": ["It will increase.", "It will stay the same.", "It will become zero.", "It will decrease."], "ans": 3, "sol": "A larger random sample gives a more precise estimate.<br>The margin of error gets smaller, but it does not become zero unless the whole population is measured.<br>Answer: <b>It will decrease.<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "A farm weighed a random sample of 60 of the pumpkins it grew this season. The mean weight of the sampled pumpkins was 4.8 kilograms, with a margin of error of 0.3 kilogram. Which statement about the mean weight of all the pumpkins the farm grew this season is true?", "opts": ["It is plausibly between 4.5 and 5.1 kilograms, although it is not certain to be in that interval.", "It is certain to be between 4.5 and 5.1 kilograms.", "It is exactly 4.8 kilograms.", "It cannot be estimated, because only 60 pumpkins were weighed."], "ans": 0, "sol": "Interval: 4.8 ± 0.3 gives 4.5 to 5.1 kilograms.<br>A random sample gives plausible values for the population mean, not a certain or exact value, and a sample of 60 is enough to make an estimate.<br>Answer: <b>It is plausibly between 4.5 and 5.1 kilograms, although it is not certain to be in that interval.<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Foresters examined a random sample of 250 of the 6,000 trees in a forest and found that 38% of the examined trees showed signs of a beetle infestation. Which statement is true?", "opts": ["38% is a parameter that describes all 6,000 trees in the forest.", "38% is a statistic that estimates the percent of all 6,000 trees in the forest that show signs of infestation.", "The population in this study is the 250 trees that were examined.", "The sample in this study is all 6,000 trees in the forest."], "ans": 1, "sol": "The 38% was calculated from the 250 examined trees, so it is a statistic.<br>It is used to estimate the parameter: the percent of all 6,000 trees with signs of infestation.<br>The 250 trees are the sample and the 6,000 trees are the population.<br>Answer: <b>38% is a statistic that estimates the percent of all 6,000 trees in the forest that show signs of infestation.<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "A town has 1,500 households. A random sample of 40 of these households used a mean of 0.45 kiloliter of water per day. Based on the sample, what is the estimated total daily water use, in kiloliters, of all 1,500 households?", "ans": ["675"], "sol": "The sample mean estimates the mean for all households: about 0.45 kiloliter per household per day.<br>Total ≈ 0.45 × 1,500 = 675 kiloliters.<br>Answer: <b>675<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A city has 7,500 residents. The bar graph shows the responses of a random sample of 200 of these residents who were asked to name their favorite activity in the city park.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of favorite park activity for 200 sampled residents: walking 80, cycling 50, picnics 40, sports 30.\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\"><line x1=\"52\" y1=\"172.4\" x2=\"308\" y2=\"172.4\"/><line x1=\"52\" y1=\"154.8\" x2=\"308\" y2=\"154.8\"/><line x1=\"52\" y1=\"137.2\" x2=\"308\" y2=\"137.2\"/><line x1=\"52\" y1=\"119.6\" x2=\"308\" y2=\"119.6\"/><line x1=\"52\" y1=\"102\" x2=\"308\" y2=\"102\"/><line x1=\"52\" y1=\"84.4\" x2=\"308\" y2=\"84.4\"/><line x1=\"52\" y1=\"66.8\" x2=\"308\" y2=\"66.8\"/><line x1=\"52\" y1=\"49.2\" x2=\"308\" y2=\"49.2\"/><line x1=\"52\" y1=\"31.6\" x2=\"308\" y2=\"31.6\"/><line x1=\"52\" y1=\"14\" x2=\"308\" y2=\"14\"/><\/g><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"66.1\" y=\"49.2\" width=\"35.8\" height=\"140.8\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"130.1\" y=\"102\" width=\"35.8\" height=\"88\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"194.1\" y=\"119.6\" width=\"35.8\" height=\"70.4\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"258.1\" y=\"137.2\" width=\"35.8\" height=\"52.8\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"52\" y1=\"190\" x2=\"308\" y2=\"190\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"52\" y1=\"14\" x2=\"52\" y2=\"190\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"46\" y=\"194\" text-anchor=\"end\">0<\/text><text x=\"46\" y=\"176.4\" text-anchor=\"end\">10<\/text><text x=\"46\" y=\"158.8\" text-anchor=\"end\">20<\/text><text x=\"46\" y=\"141.2\" text-anchor=\"end\">30<\/text><text x=\"46\" y=\"123.6\" text-anchor=\"end\">40<\/text><text x=\"46\" y=\"106\" text-anchor=\"end\">50<\/text><text x=\"46\" y=\"88.4\" text-anchor=\"end\">60<\/text><text x=\"46\" y=\"70.8\" text-anchor=\"end\">70<\/text><text x=\"46\" y=\"53.2\" text-anchor=\"end\">80<\/text><text x=\"46\" y=\"35.6\" text-anchor=\"end\">90<\/text><text x=\"46\" y=\"18\" text-anchor=\"end\">100<\/text><text x=\"84\" y=\"205\" text-anchor=\"middle\">Walking<\/text><text x=\"148\" y=\"205\" text-anchor=\"middle\">Cycling<\/text><text x=\"212\" y=\"205\" text-anchor=\"middle\">Picnics<\/text><text x=\"276\" y=\"205\" text-anchor=\"middle\">Sports<\/text><text x=\"180\" y=\"226\" text-anchor=\"middle\">Favorite activity<\/text><text transform=\"rotate(-90)\" x=\"-102\" y=\"13\" text-anchor=\"middle\">Number of residents<\/text><\/g><\/svg>Based on the sample, about how many of the city's 7,500 residents would be expected to name cycling as their favorite activity?", "opts": ["50", "1,500", "1,875", "5,625"], "ans": 2, "sol": "From the graph, 50 of the 200 sampled residents chose cycling.<br>Sample proportion: <span class=\"fq\"><span>50<\/span><span>200<\/span><\/span> = 0.25.<br>Estimate for the city: 0.25 × 7,500 = 1,875.<br>Answer: <b>1,875<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Based on a random sample, researchers report that a population proportion is plausibly between 0.52 and 0.60. Which of the following gives the sample proportion and the margin of error?", "opts": ["Sample proportion 0.52, margin of error 0.08", "Sample proportion 0.60, margin of error 0.04", "Sample proportion 0.56, margin of error 0.08", "Sample proportion 0.56, margin of error 0.04"], "ans": 3, "sol": "The sample proportion is the midpoint: <span class=\"fq\"><span>0.52 + 0.60<\/span><span>2<\/span><\/span> = 0.56.<br>The margin of error is half the width: <span class=\"fq\"><span>0.60 − 0.52<\/span><span>2<\/span><\/span> = 0.04.<br>Answer: <b>Sample proportion 0.56, margin of error 0.04<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A random sample of commuters in a city was used to estimate the mean commute time of all commuters in the city. The interval estimate was 31.6 minutes to 36.2 minutes. What was the sample mean, in minutes?", "ans": ["33.9"], "sol": "The sample mean is the midpoint of the interval.<br><span class=\"fq\"><span>31.6 + 36.2<\/span><span>2<\/span><\/span> = <span class=\"fq\"><span>67.8<\/span><span>2<\/span><\/span> = 33.9.<br>Answer: <b>33.9<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Two machines fill bottles of juice. A random sample of 50 bottles from machine A has a standard deviation of 2.1 milliliters, and a random sample of 50 bottles from machine B has a standard deviation of 6.4 milliliters. Each sample is used to estimate the mean amount of juice in all bottles filled by that machine. Which statement is most likely true?", "opts": ["The estimate for machine A has the smaller margin of error.", "The estimate for machine B has the smaller margin of error.", "The margins of error are equal, because both samples have 50 bottles.", "The margins of error cannot be compared without knowing how many bottles each machine fills."], "ans": 0, "sol": "The sample sizes are equal, so compare variability.<br>Machine A's amounts vary less (2.1 &lt; 6.4), so its estimate has the smaller margin of error.<br>Answer: <b>The estimate for machine A has the smaller margin of error.<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A random sample of 400 adults from a city gave an estimate with a margin of error of 5 percentage points. A second random sample, of 100 adults from the same city, will be used to estimate the same percent. Which is most likely true about the margin of error of the second estimate?", "opts": ["It will be less than 5 percentage points.", "It will be greater than 5 percentage points.", "It will be exactly 5 percentage points.", "It will be exactly 1.25 percentage points."], "ans": 1, "sol": "The second sample is smaller and comes from the same population.<br>A smaller sample gives a less precise estimate, so its margin of error is most likely greater.<br>Answer: <b>It will be greater than 5 percentage points.<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "In a random sample of 500 adults in a city, 22% use public transit every day, with a margin of error of 3.6 percentage points. A city official claims that more than 30% of all adults in the city use public transit every day. Which statement best evaluates the claim?", "opts": ["The claim is supported, because the difference between 30% and 22% is greater than the margin of error.", "The claim is supported, because the actual percent could be greater than the sample percent.", "The claim is not supported, because the plausible values are from 18.4% to 25.6%, all less than 30%.", "The claim is not supported, because a sample of 500 adults is too small to estimate a percent for a whole city."], "ans": 2, "sol": "Interval: 22 − 3.6 = 18.4% up to 22 + 3.6 = 25.6%.<br>Every plausible value is below 30%, so the claim is not supported. A random sample of 500 is large enough to make an estimate.<br>Answer: <b>The claim is not supported, because the plausible values are from 18.4% to 25.6%, all less than 30%.<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Random samples of students at two schools were asked whether they walk to school. At School A, 34% said yes, with a margin of error of 5 percentage points. At School B, 27% said yes, with a margin of error of 6 percentage points. Which of the following could plausibly be the percents of all students who walk to school at School A and School B, respectively?", "opts": ["40% and 25%", "28% and 20%", "35% and 34%", "30% and 32%"], "ans": 3, "sol": "School A: 34 ± 5 gives 29% to 39%. School B: 27 ± 6 gives 21% to 33%.<br>40% and 28% are outside A's interval, and 34% is outside B's interval.<br>30% is inside A's interval and 32% is inside B's, so this pair is plausible (and School B could even have the higher percent).<br>Answer: <b>30% and 32%<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A biologist measures a random sample of 50 of the 9,000 fish in a lake and finds that their mean length is 31.2 centimeters. If the biologist had measured a different random sample of 50 fish from the same lake, which of the following would most likely be different?", "opts": ["The mean length of the fish in the sample", "The mean length of all 9,000 fish in the lake", "The number of fish in the lake", "The population being studied"], "ans": 0, "sol": "The population (the fish in the lake) and its parameters, such as their mean length and their number, do not depend on which fish are caught.<br>A statistic, such as the sample mean, changes from one random sample to another.<br>Answer: <b>The mean length of the fish in the sample<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A sports club has 3,600 members. A random sample of 150 members was asked about membership type and whether they attended the club's annual meeting. The results are shown in the table.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Attended<\/th><th>Did not attend<\/th><th>Total<\/th><\/tr><tr><td>Youth<\/td><td>18<\/td><td>27<\/td><td>45<\/td><\/tr><tr><td>Adult<\/td><td>54<\/td><td>51<\/td><td>105<\/td><\/tr><tr><td>Total<\/td><td>72<\/td><td>78<\/td><td>150<\/td><\/tr><\/table><\/div>Based on the sample, how many of the club's 3,600 members would be expected to be youth members who attended the meeting?", "ans": ["432"], "sol": "Youth members who attended: 18 of the 150 sampled members.<br>Sample proportion: <span class=\"fq\"><span>18<\/span><span>150<\/span><\/span> = 0.12.<br>Estimate for the club: 0.12 × 3,600 = 432.<br>Answer: <b>432<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A streaming service has 40,000 subscribers. In a random sample of 500 subscribers, 31% said they watch mostly on a television, with a margin of error of 4 percentage points. Based on the survey, the number of subscribers who watch mostly on a television is plausibly between <i>a<\/i> and <i>b<\/i>. What is the value of <i>b<\/i> − <i>a<\/i>?", "ans": ["3200"], "sol": "Percent interval: 27% to 35%, so <i>a<\/i> = 0.27 × 40,000 = 10,800 and <i>b<\/i> = 0.35 × 40,000 = 14,000.<br><i>b<\/i> − <i>a<\/i> = 3,200. (Shortcut: the width is twice the margin, 8% of 40,000.)<br>Answer: <b>3200<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Each of four studies estimates the mean of a different population using a random sample. The sample size and sample standard deviation for each study are given. Which study's estimate most likely has the smallest margin of error?", "opts": ["A sample of 400 with a standard deviation of 12", "A sample of 400 with a standard deviation of 4", "A sample of 100 with a standard deviation of 4", "A sample of 100 with a standard deviation of 12"], "ans": 1, "sol": "A larger sample and a smaller standard deviation each make the margin of error smaller.<br>Only one study has both the larger sample (400) and the smaller standard deviation (4).<br>Answer: <b>A sample of 400 with a standard deviation of 4<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Based on a random sample of a city's residents, a survey estimated that 46% of all residents favor a new park plan, with a margin of error of 3 percentage points. Which of the following claims about all residents of the city is consistent with the survey?<br>I. It is plausible that fewer than 45% favor the plan.<br>II. It is plausible that more than half favor the plan.", "opts": ["Neither I nor II", "II only", "I only", "I and II"], "ans": 2, "sol": "Interval: 46 ± 3 gives 43% to 49%.<br>I: values such as 44% are in the interval and are less than 45%, so I is consistent.<br>II: every plausible value is at most 49%, so more than half (over 50%) is not plausible.<br>Answer: <b>I only<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "A polling firm surveyed 1,200 voters chosen at random from a state's registered voters and found that 41% of them approve of a new transit law. Which of the following is the parameter the firm is trying to estimate?", "opts": ["The 41% of surveyed voters who approve of the law", "The percent of all of the state's registered voters who approve of the law", "The 1,200 registered voters who were surveyed", "The percent of the 1,200 surveyed voters who disapprove of the law"], "ans": 1, "sol": "A parameter describes the whole population: here, all of the state's registered voters.<br>The 41% (and the disapproval percent) come from the 1,200 sampled voters, so they are statistics.<br>Answer: <b>The percent of all of the state's registered voters who approve of the law<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "An inspector selects a random sample of 160 tablets from a shipment of 5,000 tablets and finds that 8 of the sampled tablets are defective. Based on the sample, how many tablets in the shipment would be expected to be defective?", "ans": ["250"], "sol": "Sample proportion: <span class=\"fq\"><span>8<\/span><span>160<\/span><\/span> = 0.05.<br>Estimate for the shipment: 0.05 × 5,000 = 250.<br>Answer: <b>250<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A random sample of eggs from a farm had a mean mass of 58.4 grams, with a margin of error of 1.1 grams. Which of the following is NOT a plausible value for the mean mass of all eggs from the farm?", "opts": ["57.4 grams", "58.0 grams", "59.4 grams", "59.6 grams"], "ans": 3, "sol": "Interval: 58.4 − 1.1 = 57.3 up to 58.4 + 1.1 = 59.5 grams.<br>57.4, 58.0 and 59.4 are inside; 59.6 is above 59.5.<br>Answer: <b>59.6 grams<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Two random samples were selected from the same population of adults. Sample A has 300 adults and sample B has 1,200 adults, and in each sample, 45% of the adults said they exercise daily. Which statement about the margins of error of the two estimates is most likely true?", "opts": ["The margin of error for sample A is greater.", "The margin of error for sample B is greater.", "The margins of error are equal, because the sample percents are equal.", "The margins of error are equal, because the samples come from the same population."], "ans": 0, "sol": "The samples come from the same population and give the same percent, so the difference is the sample size.<br>The smaller sample, A, gives the less precise estimate and the greater margin of error.<br>Answer: <b>The margin of error for sample A is greater.<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A library selected a random sample of 120 of its 18,000 books and found that the mean age of the sampled books was 14.2 years, with a margin of error of 1.6 years. A librarian concludes that a book chosen at random from the library is very likely to be between 12.6 and 15.8 years old. Which statement best explains why this conclusion is not appropriate?", "opts": ["The interval should be 14.2 ± 3.2 years, not 14.2 ± 1.6 years.", "No conclusion can be drawn, because 120 books are less than 1% of the library's books.", "The interval estimates the mean age of all the books, not the ages of individual books.", "The interval describes only the 120 books in the sample."], "ans": 2, "sol": "The interval 12.6 to 15.8 years gives plausible values for the mean age of all 18,000 books.<br>Individual books can be much older or newer than the mean, so the interval says nothing about a single book.<br>Answer: <b>The interval estimates the mean age of all the books, not the ages of individual books.<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A hotel randomly selected 20 of the 3,000 bookings it received last year and recorded the number of nights for each booking. The dot plot shows the results.<svg class=\"fig\" viewBox=\"0 0 320 110\" role=\"img\" aria-label=\"Dot plot of 20 bookings: 4 dots at 1 night, 6 at 2 nights, 4 at 3 nights, 3 at 4 nights, 2 at 5 nights, 1 at 6 nights.\"><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"70\" y1=\"72\" x2=\"304\" y2=\"72\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"70\" y1=\"72\" x2=\"70\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"103.4\" y1=\"72\" x2=\"103.4\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"136.9\" y1=\"72\" x2=\"136.9\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"170.3\" y1=\"72\" x2=\"170.3\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"203.7\" y1=\"72\" x2=\"203.7\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"237.1\" y1=\"72\" x2=\"237.1\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"270.6\" y1=\"72\" x2=\"270.6\" y2=\"76\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"304\" y1=\"72\" x2=\"304\" y2=\"76\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle r=\"3.5\" cx=\"103.4\" cy=\"66\"/><circle r=\"3.5\" cx=\"103.4\" cy=\"58\"/><circle r=\"3.5\" cx=\"103.4\" cy=\"50\"/><circle r=\"3.5\" cx=\"103.4\" cy=\"42\"/><circle r=\"3.5\" cx=\"136.9\" cy=\"66\"/><circle r=\"3.5\" cx=\"136.9\" cy=\"58\"/><circle r=\"3.5\" cx=\"136.9\" cy=\"50\"/><circle r=\"3.5\" cx=\"136.9\" cy=\"42\"/><circle r=\"3.5\" cx=\"136.9\" cy=\"34\"/><circle r=\"3.5\" cx=\"136.9\" cy=\"26\"/><circle r=\"3.5\" cx=\"170.3\" cy=\"66\"/><circle r=\"3.5\" cx=\"170.3\" cy=\"58\"/><circle r=\"3.5\" cx=\"170.3\" cy=\"50\"/><circle r=\"3.5\" cx=\"170.3\" cy=\"42\"/><circle r=\"3.5\" cx=\"203.7\" cy=\"66\"/><circle r=\"3.5\" cx=\"203.7\" cy=\"58\"/><circle r=\"3.5\" cx=\"203.7\" cy=\"50\"/><circle r=\"3.5\" cx=\"237.1\" cy=\"66\"/><circle r=\"3.5\" cx=\"237.1\" cy=\"58\"/><circle r=\"3.5\" cx=\"270.6\" cy=\"66\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"70\" y=\"87\" text-anchor=\"middle\">0<\/text><text x=\"103.4\" y=\"87\" text-anchor=\"middle\">1<\/text><text x=\"136.9\" y=\"87\" text-anchor=\"middle\">2<\/text><text x=\"170.3\" y=\"87\" text-anchor=\"middle\">3<\/text><text x=\"203.7\" y=\"87\" text-anchor=\"middle\">4<\/text><text x=\"237.1\" y=\"87\" text-anchor=\"middle\">5<\/text><text x=\"270.6\" y=\"87\" text-anchor=\"middle\">6<\/text><text x=\"304\" y=\"87\" text-anchor=\"middle\">7<\/text><text x=\"187\" y=\"106\" text-anchor=\"middle\">Number of nights per booking<\/text><\/g><\/svg>Based on the sample, about how many of last year's 3,000 bookings were for 4 or more nights?", "opts": ["6", "450", "900", "1,500"], "ans": 2, "sol": "From the dot plot: 3 bookings of 4 nights, 2 of 5 nights and 1 of 6 nights, so 6 of the 20 sampled bookings.<br>Sample proportion: <span class=\"fq\"><span>6<\/span><span>20<\/span><\/span> = 0.3.<br>Estimate: 0.3 × 3,000 = 900.<br>Answer: <b>900<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "An environmental group wants to know the mean lead level in the tap water of the 12,000 homes in a district. It tests the water in 90 homes selected at random. Which of the following can the group calculate exactly from the data it collected?", "opts": ["The mean lead level in the 90 tested homes", "The mean lead level in all 12,000 homes", "The number of homes in the district with a lead level above the legal limit", "The greatest lead level among all 12,000 homes"], "ans": 0, "sol": "Only the 90 tested homes were measured, so only statistics about those homes are known exactly.<br>Values for all 12,000 homes are parameters; the sample can estimate them but not give them exactly.<br>Answer: <b>The mean lead level in the 90 tested homes<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "In which of the following situations is the value described a parameter rather than a statistic?", "opts": ["A poll of 1,000 randomly selected voters in a state finds that 52% favor a proposal.", "A random sample of 15 batteries from a large shipment has a mean life of 9.4 hours.", "A survey of 300 randomly selected households in a city finds a mean of 3.1 residents per household.", "A teacher calculates the mean test score of all 32 students in her class to describe how that class performed."], "ans": 3, "sol": "A parameter describes an entire population.<br>In the first three choices, the value comes from a sample of a larger group, so it is a statistic.<br>The teacher wants to describe her class and uses every student in it, so the class is the population and its mean is a parameter.<br>Answer: <b>A teacher calculates the mean test score of all 32 students in her class to describe how that class performed.<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A company has 4,000 employees. In a random sample of 250 employees, 40% use the company gym, and 30% of those gym users use it every day. Based on the sample, about how many of the company's employees use the gym every day?", "opts": ["30", "480", "1,200", "1,600"], "ans": 1, "sol": "Proportion of the sample who use the gym every day: 0.40 × 0.30 = 0.12.<br>Estimate for the company: 0.12 × 4,000 = 480.<br>Answer: <b>480<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A school has 1,800 students. In a random sample of 45 of these students, 12 said they have a part-time job. Based on the sample, how many more students at the school would be expected to not have a part-time job than to have one?", "ans": ["840"], "sol": "With a job: <span class=\"fq\"><span>12<\/span><span>45<\/span><\/span> × 1,800 = 480. Without a job: <span class=\"fq\"><span>33<\/span><span>45<\/span><\/span> × 1,800 = 1,320.<br>Difference: 1,320 − 480 = 840.<br>Answer: <b>840<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A city has 15,000 residents. Based on a random sample, an estimated 31% of the residents own a bicycle, with a margin of error of 4 percentage points. Which of the following is a plausible number of residents of the city who own a bicycle?", "opts": ["3,900", "4,000", "5,100", "5,500"], "ans": 2, "sol": "Percent interval: 27% to 35%.<br>Count interval: 0.27 × 15,000 = 4,050 up to 0.35 × 15,000 = 5,250.<br>Only 5,100 is between 4,050 and 5,250.<br>Answer: <b>5,100<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "Based on a random sample, researchers estimate that between 2,940 and 3,660 of the 12,000 trees in a park have a certain fungus. What margin of error, in percentage points, did the researchers use?", "ans": ["3"], "sol": "Convert the ends to percents: <span class=\"fq\"><span>2,940<\/span><span>12,000<\/span><\/span> = 24.5% and <span class=\"fq\"><span>3,660<\/span><span>12,000<\/span><\/span> = 30.5%.<br>The margin of error is half the width: <span class=\"fq\"><span>30.5 − 24.5<\/span><span>2<\/span><\/span> = 3.<br>Answer: <b>3<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A factory estimated the mean length of the bolts it produced in one week by measuring a random sample of 64 bolts. Which of the following changes, by itself, would most likely increase the margin of error of the estimate?", "opts": ["Measuring a random sample of 256 bolts instead of 64 bolts", "Measuring a random sample of 64 bolts from a week in which the bolt lengths varied more", "Measuring a random sample of 64 bolts from a week in which the bolt lengths varied less", "Measuring a random sample of 64 bolts from a week in which the factory produced twice as many bolts, with the same variability in length"], "ans": 1, "sol": "A larger sample and less variable data both decrease the margin of error.<br>Producing more bolts with the same variability hardly changes the margin, because the population is far larger than the sample.<br>More variable lengths increase the margin of error.<br>Answer: <b>Measuring a random sample of 64 bolts from a week in which the bolt lengths varied more<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Two researchers estimated the percent of a city's adults who own a pet, using random samples from the same population. Researcher 1 used a sample of 150 adults and reported 61%, with a margin of error of 8 percentage points. Researcher 2 used a sample of 600 adults and reported 58%. Which of the following is most likely the margin of error of researcher 2's estimate?", "opts": ["4 percentage points", "8 percentage points", "12 percentage points", "16 percentage points"], "ans": 0, "sol": "Researcher 2 sampled the same population but used a larger sample.<br>A larger sample gives a smaller margin of error, so it should be less than 8 percentage points.<br>Answer: <b>4 percentage points<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Random samples of commuters from three towns were used to estimate the mean commute time of all commuters in each town. The results are shown in the table.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Town<\/th><th>Sample mean (minutes)<\/th><th>Margin of error (minutes)<\/th><\/tr><tr><td>R<\/td><td>24.5<\/td><td>2.0<\/td><\/tr><tr><td>S<\/td><td>28.9<\/td><td>1.8<\/td><\/tr><tr><td>T<\/td><td>26.0<\/td><td>2.2<\/td><\/tr><\/table><\/div>Which of the following conclusions is supported by these results?", "opts": ["The mean commute time of all commuters in Town S is greater than that in Town T.", "The mean commute time of all commuters in Town T is greater than that in Town R.", "The mean commute time of all commuters in Town R is less than that in Town T, and the mean in Town T is less than that in Town S.", "The mean commute time of all commuters in Town S is greater than that in Town R."], "ans": 3, "sol": "Intervals: R 22.5 to 26.5, S 27.1 to 30.7, T 23.8 to 28.2 minutes.<br>S and T overlap (27.1 to 28.2), and R and T overlap (23.8 to 26.5), so neither comparison is supported.<br>S and R do not overlap: every plausible value for S is greater than every plausible value for R.<br>Answer: <b>The mean commute time of all commuters in Town S is greater than that in Town R.<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A city news website invited its readers to vote in an online poll about a proposed stadium. Of the 2,300 readers who chose to vote, 64% supported the stadium, and the website reported a margin of error of 2 percentage points. Which of the following is the most appropriate conclusion?", "opts": ["It is plausible that between 62% and 66% of all city residents support the stadium.", "Because the voters chose themselves, the margin of error does not show how close 64% is to the percent of all city residents who support the stadium.", "Exactly 64% of all city residents support the stadium.", "Because so many readers voted, 64% is an accurate estimate for all city residents."], "ans": 1, "sol": "A margin of error measures only the chance variation of a random sample.<br>These voters chose themselves, so the sample may be biased, and no margin of error can fix that, however many people vote.<br>Answer: <b>Because the voters chose themselves, the margin of error does not show how close 64% is to the percent of all city residents who support the stadium.<\/b>"}, {"lo": "LO3", "diff": "X", "type": "spr", "q": "A town has 22,000 households. In a random sample of 400 of them, 55% have internet service faster than 100 megabits per second, with a margin of error of 5 percentage points. Based on the survey, what is the smallest plausible value for the number of households in the town that do NOT have internet service this fast?", "ans": ["8800"], "sol": "With fast service: 50% to 60%. So without fast service: 100% − 60% = 40% up to 100% − 50% = 50%.<br>Smallest plausible count: 0.40 × 22,000 = 8,800.<br>Answer: <b>8800<\/b>"}, {"lo": "LO5", "diff": "X", "type": "mcq", "q": "A poll of randomly selected voters found that 44% support candidate Q and 39% support candidate R. The same margin of error applies to both estimates. For which of the following margins of error would the poll support the conclusion that candidate Q has more support than candidate R among all voters?", "opts": ["2.4 percentage points", "2.6 percentage points", "3.0 percentage points", "3.2 percentage points"], "ans": 0, "sol": "With margin <i>m<\/i>, the intervals are 44 − <i>m<\/i> to 44 + <i>m<\/i> and 39 − <i>m<\/i> to 39 + <i>m<\/i>.<br>They do not overlap when 44 − <i>m<\/i> &gt; 39 + <i>m<\/i>, that is, 2<i>m<\/i> &lt; 5, or <i>m<\/i> &lt; 2.5.<br>Check 2.4: 41.6% &gt; 41.4%. For 2.6: 41.4% &lt; 41.6%, so the intervals overlap.<br>Answer: <b>2.4 percentage points<\/b>"}, {"lo": "LO2", "diff": "X", "type": "spr", "q": "A school has 1,200 juniors and 800 seniors. In a random sample of 60 juniors, 21 volunteer in the community. In a separate random sample of 50 seniors, 22 volunteer in the community. Based on these samples, what percent of all juniors and seniors at the school would be expected to volunteer in the community? (Disregard the % sign when entering your answer.)", "ans": ["38.6"], "sol": "Juniors: <span class=\"fq\"><span>21<\/span><span>60<\/span><\/span> = 0.35, and 0.35 × 1,200 = 420. Seniors: <span class=\"fq\"><span>22<\/span><span>50<\/span><\/span> = 0.44, and 0.44 × 800 = 352.<br>Total: 420 + 352 = 772 of 2,000 students.<br><span class=\"fq\"><span>772<\/span><span>2,000<\/span><\/span> = 0.386, or 38.6%. (Combining the samples, <span class=\"fq\"><span>43<\/span><span>110<\/span><\/span>, ignores that the grades differ in size.)<br>Answer: <b>38.6<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "Wildlife officers tagged 600 deer in a forest and released them. Later, they captured a random sample of 100 deer from the forest and found that 20 of them were tagged. Assuming the proportion of tagged deer in the sample equals the proportion of tagged deer in the whole forest, which of the following is the best estimate of the number of deer in the forest?", "opts": ["120", "750", "3,000", "3,600"], "ans": 2, "sol": "Sample proportion tagged: <span class=\"fq\"><span>20<\/span><span>100<\/span><\/span> = 0.2.<br>If <i>N<\/i> is the number of deer, then <span class=\"fq\"><span>600<\/span><span><i>N<\/i><\/span><\/span> = 0.2.<br><i>N<\/i> = <span class=\"fq\"><span>600<\/span><span>0.2<\/span><\/span> = 3,000.<br>Answer: <b>3,000<\/b>"}], "unit_no": 3, "topic_no": "3", "code": "3.2"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

/* ---------- shared question widget ---------- */
function qBody(q, sel, name){
  var h='<div class="qtext">'+q.q+'</div>';
  if(q.type==='spr'){
    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';
  } else {
    h+='<div class="opts" role="radiogroup">'+q.opts.map(function(o,k){ return '<button type="button" class="opt" role="radio" aria-checked="'+(sel===k)+'" data-k="'+k+'"><span class="let">'+letter(k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';
  }
  return h;
}

/* ---------- LEARN ---------- */
function renderLearn(jump){
  if(jump!=null) ST.sheet=jump;
  var cur=Math.max(0,Math.min(NSHEET-1,ST.sheet)); ST.sheet=cur; save();
  var h='<div class="stack">';
  h+='<section class="card"><div class="eyebrow">Learning objectives</div><p style="margin:6px 0 0;color:var(--ink-soft)">Each objective has its own learning sheet: read the idea, step through the worked examples, then do the guided questions (use a hint if you are stuck). Tick the objective when you are confident, then take the quiz sheets.</p><ul class="los">'+
    LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><a href="#" data-sheet="'+i+'">'+l.text+'</a>'+(ST.done[l.id]?'<span class="lo-done">✓ Done</span>':'')+'</li>'; }).join('')+'</ul>'+
    '<div class="sheetnav" role="tablist" aria-label="Learning sheets">'+LOS.map(function(l,i){ return '<button class="tab'+(ST.done[l.id]?' done':'')+'" role="tab" data-sheet="'+i+'" aria-selected="'+(i===cur)+'">Sheet '+(i+1)+'</button>'; }).join('')+
    '<button class="tab" role="tab" data-sheet="'+LOS.length+'" aria-selected="'+(cur===LOS.length)+'">Recap</button></div></section>';
  if(cur<LOS.length){
    var L=LOS[cur];
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Learning sheet '+(cur+1)+' of '+LOS.length+' · Objective '+(cur+1)+'</div><h2>'+L.text+'</h2>';
    h+='<div class="concept">'+byLo(S.notes,L.id).map(function(n){ return '<h3 class="note-h">'+n.h+'</h3>'+n.html; }).join('')+'</div>';
    byLo(S.examples,L.id).forEach(function(E,ei){
      h+='<div class="ex"><h3>Worked example '+(ei+1)+'</h3><div class="ex-q">'+E.q+'</div><ol class="steps">'+E.steps.map(function(s){ return '<li hidden>'+s+'</li>'; }).join('')+'</ol><div class="ans" hidden>Answer: '+E.ans+'</div><div class="ex-ctrl"><button class="btn" data-next>Show first step</button><button class="btn" data-all>Show full solution</button></div></div>';
    });
    var G=byLo(S.guided,L.id);
    if(G.length) h+='<h3 class="note-h">Guided practice</h3>';
    G.forEach(function(q,qi){
      var gi=S.guided.indexOf(q);
      h+='<div class="try" data-g="'+gi+'"><h3>Question '+(qi+1)+' of '+G.length+' <span class="pill '+q.diff+'" style="margin-left:6px">'+DIFF[q.diff]+'</span></h3>'+qBody(q,null,'g-'+gi)+'<div class="ex-ctrl">'+(q.hint?'<button class="btn" data-hint>Show hint</button>':'')+'<button class="btn btn-primary" data-check>Check answer</button></div><div class="hint" hidden>'+(q.hint||'')+'</div><div class="fbk"></div></div>';
    });
    h+='<label class="donebox"><input type="checkbox" id="done-'+esc(L.id)+'" data-done="'+esc(L.id)+'"'+(ST.done[L.id]?' checked':'')+'> I can do this objective</label>';
    h+='<div class="qnav"><button class="btn" data-go="'+(cur-1)+'"'+(cur===0?' disabled':'')+'>Previous sheet</button><button class="btn btn-primary" data-go="'+(cur+1)+'">'+(cur===LOS.length-1?'Go to recap':'Next sheet')+'</button></div></section>';
  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
