<script>
(function(){
"use strict";
var S = {"id": "PSDA-3.3", "unit": "Problem-Solving and Data Analysis", "topic": "Probability and statistical inference", "title": "Evaluating statistical claims", "intro": "A statistical claim is only as good as the study behind it. This subtopic teaches you to read a study description and decide two things: who the results apply to, which depends on how the sample was chosen, and whether they show cause and effect, which depends on how treatments were assigned. The DSAT tests this with short word problems that ask for the most appropriate conclusion, the largest population a result applies to, or the reason a claim is not justified.", "los": [{"id": "LO1", "text": "Identify random sampling methods, and explain how convenience samples, voluntary response samples and nonresponse can bias results."}, {"id": "LO2", "text": "Determine the largest population to which a sample result can be generalized, and use a random sample to make estimates only about the population that was sampled."}, {"id": "LO3", "text": "Distinguish observational studies from experiments by deciding whether the researchers imposed the treatment."}, {"id": "LO4", "text": "Determine when a study supports a cause-and-effect conclusion, recognizing the role of random assignment and of confounding variables."}, {"id": "LO5", "text": "Identify the most appropriate conclusion from a study description by checking both how subjects were selected and how treatments were assigned."}], "notes": [{"lo": "LO1", "h": "Populations, samples and random selection", "html": "<p>A <b>population<\/b> is the whole group a question is about, such as all 1,800 students at a school. A <b>sample<\/b> is the part of the population that is actually measured. A sample is useful only if it resembles the population in the ways that matter.<\/p><div class=\"rule\">A sample is random when every member of the population has the same chance of being chosen, for example when names are drawn from a complete list with a random number generator.<\/div><p>Random selection does not promise a perfect sample, but it removes the chooser's influence and gives no group an advantage. Drawing numbered slips from a box, choosing random rows from a full list, and randomly choosing a few people from each grade are all random methods.<\/p><div class=\"tip\">DSAT tip: look for two things in the description: a random process, and a list that covers the <em>whole<\/em> population. A random pick from an incomplete list, such as the members of one gym, is random only for the people on that list.<\/div>"}, {"lo": "LO1", "h": "Samples that build in bias", "html": "<p>A sampling method is <b>biased<\/b> if it tends to favor some kinds of people over others, so its results lean in one direction. A bigger sample does not fix bias: 5,000 biased answers are still biased.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Method<\/th><th>What happens<\/th><th>Why it can mislead<\/th><\/tr><tr><td>Convenience sample<\/td><td>The researcher surveys whoever is easy to reach, such as shoppers at one mall.<\/td><td>People in that place may differ from the population.<\/td><\/tr><tr><td>Voluntary response sample<\/td><td>People decide for themselves whether to answer, as in an online poll or a call-in vote.<\/td><td>People with strong opinions are more likely to respond.<\/td><\/tr><tr><td>Nonresponse<\/td><td>A random sample is chosen, but many of the people chosen do not reply.<\/td><td>Those who reply may differ from those who do not.<\/td><\/tr><\/table><\/div><div class=\"rule\">Ask: who had a chance to be in the sample, and who decided? If the answer is “only some people” or “the people themselves,” expect bias.<\/div><p>To predict the direction of the bias, ask how the people reached differ from the population. Surveying adults at a bicycle shop would overstate how many adults own bicycles.<\/p>"}, {"lo": "LO2", "h": "Generalize only to the population sampled", "html": "<p>Results from a random sample can be generalized to the population the sample was <em>drawn from<\/em>, and to no larger or different group. If 200 students are randomly chosen from one college, the results describe that college, not all college students in the state.<\/p><div class=\"rule\">The largest population a result applies to is the group the random sample was selected from. If the sample was not random, the results describe only the people in the sample.<\/div><p>A random sample also lets you estimate a count for that population. Find the sample proportion and multiply it by the size of the population that was sampled. For example, if 45 of 300 randomly chosen members of a club with 6,000 members prefer weekend events:<\/p><div class=\"eqs\">sample proportion = <span class=\"fq\"><span>45<\/span><span>300<\/span><\/span> = 0.15<br>estimate = 0.15 × 6,000 = 900 members<\/div><div class=\"tip\">DSAT tip: when a question gives two population sizes, such as all students and only Grade 11 students, multiply by the size of the group the sample actually came from.<\/div>"}, {"lo": "LO3", "h": "Observational study or experiment?", "html": "<p>The deciding question is: <b>who decided which treatment each subject gets?<\/b><\/p><ul><li>In an <b>experiment<\/b>, the researchers impose a treatment, such as giving some people a new app and others none, and then measure a response.<\/li><li>In an <b>observational study<\/b>, the researchers only record what subjects already do or already are, such as how much they exercise, without changing anything.<\/li><\/ul><div class=\"rule\">Experiment: the researcher assigns the treatment. Observational study: the subjects or their circumstances decide, and the researcher only observes and measures.<\/div><p>Random <em>selection<\/em> of subjects does not make a study an experiment; a survey of a random sample is still observational. Some questions, such as whether living near a busy highway affects breathing, can only be studied by observation, because assigning people to a harmful condition would be unethical or impractical.<\/p>"}, {"lo": "LO4", "h": "Random assignment and cause and effect", "html": "<p>When subjects choose their own treatment, the groups may differ in other ways. Students who choose to attend extra classes may also be more motivated. A hidden difference like this is called a <b>confounding variable<\/b>, and it can produce a relationship that the treatment did not cause.<\/p><p><b>Random assignment<\/b> (by coin toss, random numbers or drawing names) spreads motivation, age, health and every other factor roughly evenly between the groups. Then a difference in outcomes that is too large to be explained by chance can be credited to the treatment.<\/p><div class=\"rule\">Only a randomized experiment supports a cause-and-effect conclusion. An observational study, however large and however randomly sampled, supports only an association.<\/div><div class=\"tip\">DSAT tip: “randomly selected” answers “Who is in the study?” “Randomly assigned” answers “Who gets which treatment?” Only the second allows a claim about cause.<\/div>"}, {"lo": "LO5", "h": "Two questions, four cases", "html": "<p>Every study description answers two separate questions, and each answer controls a different part of the conclusion.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Randomly assigned<\/th><th>Not randomly assigned<\/th><\/tr><tr><th>Randomly selected<\/th><td>Cause and effect, for the whole population sampled<\/td><td>Association only, for the whole population sampled<\/td><\/tr><tr><th>Not randomly selected<\/th><td>Cause and effect, but only for the subjects in the study<\/td><td>Association only, and only for the subjects in the study<\/td><\/tr><\/table><\/div><div class=\"rule\">Random selection decides <em>who<\/em> the conclusion is about. Random assignment decides <em>what kind<\/em> of conclusion, cause or association, is allowed.<\/div><p>A survey with no treatments belongs in the right column, so it supports at most an association. Volunteers who are randomly assigned belong in the bottom left cell: the treatment effect is real for them, but they may not be typical of any larger group.<\/p>"}, {"lo": "LO5", "h": "Choosing the most appropriate conclusion", "html": "<p>On the DSAT, wrong conclusions usually go wrong in one of four ways.<\/p><ul><li><b>Too broad:<\/b> the result is extended to a larger or different population than the one sampled.<\/li><li><b>Too strong:<\/b> cause and effect is claimed without random assignment, or something is said to be “proven.”<\/li><li><b>Wrong direction:<\/b> the finding is reversed, for example “more” instead of “less.”<\/li><li><b>Too weak:<\/b> the choice says no conclusion is possible when the design does support one.<\/li><\/ul><div class=\"rule\">The best answer claims exactly what the design supports: no more and no less.<\/div><p>If the difference between the groups was small enough to be explained by chance, the right conclusion is that the study gives <b>no convincing evidence<\/b> of an effect. That is not the same as proving that there is no effect.<\/p><div class=\"tip\">Eliminate choices in order: check the population first, then the words “cause” or “associated,” then the direction.<\/div>"}], "examples": [{"lo": "LO1", "q": "A city's water board wants to know how satisfied residents are with their water supply. It considers three plans for choosing 300 residents.<br>Plan I: Survey residents who call the complaint helpline.<br>Plan II: Survey shoppers at the busiest market on a Sunday.<br>Plan III: Randomly select 300 addresses from a complete list of residential addresses and survey one adult at each.<br>Which plan gives a random sample of residents, and why are the other two likely to be biased?", "steps": ["Plan I uses people who chose to contact the board, and people who call a complaint line are likely to be unhappy, so it would overstate dissatisfaction.", "Plan II is a convenience sample: Sunday shoppers at one market may differ from residents who live far away, work on Sundays or rarely shop there.", "Plan III gives every residential address the same chance of being chosen, so it is the random sample."], "ans": "Plan III"}, {"lo": "LO1", "q": "A sports website asked visitors to vote on whether the city stadium should be renamed. Of the 5,000 votes, 70% were “No.” Which statement best describes whether this result can be generalized to all residents of the city?<br>A) Yes, because 5,000 is a large sample.<br>B) Yes, because most of the votes were “No.”<br>C) No, because visitors chose whether to vote, so this is a voluntary response sample.<br>D) No, because the website did not randomly assign visitors to groups.", "steps": ["Ask who decided to be in the sample: the visitors did, so this is a voluntary response sample, and people with strong feelings are more likely to vote.", "A large number of votes does not remove that bias, so A is wrong; B does not address how the sample was chosen.", "Random assignment is about treatments in an experiment, which this poll does not have, so D is wrong."], "ans": "C"}, {"lo": "LO2", "q": "A random sample of 160 students was selected from the 2,400 students at a college, and 36 of the students in the sample cycle to college. What is the best estimate of the number of students at the college who cycle to college, and can the estimate be applied to all college students in the state?", "steps": ["Sample proportion: <span class=\"fq\"><span>36<\/span><span>160<\/span><\/span> = 0.225.", "Multiply by the size of the population sampled: 0.225 × 2,400 = 540.", "The sample came only from this college, so the estimate describes this college only, not all college students in the state."], "ans": "About 540 students; the result applies only to this college."}, {"lo": "LO3", "q": "Classify each study as an observational study or an experiment.<br>Study 1: A researcher records the daily screen time and the exam scores of 250 randomly selected teenagers.<br>Study 2: A researcher randomly assigns 40 volunteers to read an article either on a tablet or on paper and then gives each a comprehension test.", "steps": ["In Study 1 the teenagers chose their own screen time; the researcher only recorded it. Random selection does not change that, so Study 1 is observational.", "In Study 2 the researcher decided who read on a tablet and who read on paper, so Study 2 is an experiment."], "ans": "Study 1 is an observational study; Study 2 is an experiment."}, {"lo": "LO4", "q": "In a study, 100 adult volunteers were randomly assigned to two groups of 50. One group took a 10 minute walk after lunch and the other group rested. The bar graph shows how many in each group reported feeling alert in the afternoon. Assume the difference is too large to be explained by chance.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of the number of volunteers who felt alert: 38 of the 50 who walked after lunch and 22 of the 50 who rested\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"54\" y1=\"152.0\" x2=\"308\" y2=\"152.0\"/><line x1=\"54\" y1=\"118.0\" x2=\"308\" y2=\"118.0\"/><line x1=\"54\" y1=\"84.0\" x2=\"308\" y2=\"84.0\"/><line x1=\"54\" y1=\"50.0\" x2=\"308\" y2=\"50.0\"/><line x1=\"54\" y1=\"16.0\" x2=\"308\" y2=\"16.0\"/><\/g><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"97.5\" y=\"56.8\" width=\"40\" height=\"129.2\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"224.5\" y=\"111.2\" width=\"40\" height=\"74.8\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"54\" y1=\"186.0\" x2=\"308\" y2=\"186.0\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"54\" y1=\"16\" x2=\"54\" y2=\"186.0\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text class=\"fg-tick\" x=\"49\" y=\"190.0\" text-anchor=\"end\">0<\/text><text class=\"fg-tick\" x=\"49\" y=\"156.0\" text-anchor=\"end\">10<\/text><text class=\"fg-tick\" x=\"49\" y=\"122.0\" text-anchor=\"end\">20<\/text><text class=\"fg-tick\" x=\"49\" y=\"88.0\" text-anchor=\"end\">30<\/text><text class=\"fg-tick\" x=\"49\" y=\"54.0\" text-anchor=\"end\">40<\/text><text class=\"fg-tick\" x=\"49\" y=\"20.0\" text-anchor=\"end\">50<\/text><text class=\"fg-val\" x=\"117.5\" y=\"52.8\" text-anchor=\"middle\">38<\/text><text x=\"117.5\" y=\"200.0\" text-anchor=\"middle\">Walked after lunch<\/text><text class=\"fg-val\" x=\"244.5\" y=\"107.2\" text-anchor=\"middle\">22<\/text><text x=\"244.5\" y=\"200.0\" text-anchor=\"middle\">Rested after lunch<\/text><text x=\"181.0\" y=\"236\" text-anchor=\"middle\">Group (50 volunteers each)<\/text><text x=\"13\" y=\"101.0\" text-anchor=\"middle\" transform=\"rotate(-90 13 101.0)\">Number who felt alert<\/text><\/g><\/svg>What conclusion does the study support?", "steps": ["Read the bars: 38 of 50 walkers (76%) and 22 of 50 resters (44%) felt alert.", "Treatments were randomly assigned, so the groups were alike on average in other ways, and the difference can be credited to the walk.", "The subjects were volunteers, not a random sample of any population, so the conclusion applies only to the volunteers in the study."], "ans": "Walking after lunch caused more of these volunteers to feel alert; the result should not be generalized to all adults."}, {"lo": "LO5", "q": "Researchers randomly selected 500 adults from all adults in Lucknow, asked how many floors of stairs each climbs per day, and measured each adult's resting heart rate. Adults who climbed more stairs tended to have lower resting heart rates. Which conclusion is most appropriate?<br>A) Climbing stairs causes lower resting heart rates for adults in Lucknow.<br>B) For adults in Lucknow, climbing more stairs is associated with a lower resting heart rate.<br>C) For all adults in India, climbing more stairs is associated with a lower resting heart rate.<br>D) No conclusion can be drawn, because the study was not an experiment.", "steps": ["Selection: random, from all adults in Lucknow, so the result can be generalized to adults in Lucknow but not to India. That rules out C.", "Assignment: none; the adults chose how many stairs to climb, so this is observational and supports only an association. That rules out A.", "An observational study still shows an association, so D is too weak."], "ans": "B"}], "traps": ["Thinking a large sample removes bias. Five thousand answers to an online poll are still a voluntary response sample.", "Confusing random selection with random assignment. Random selection lets you generalize to the population; random assignment lets you claim cause and effect.", "Generalizing to a larger or different population than the one sampled, such as from the members of one gym to all adults in the town.", "Claiming cause and effect from an observational study, even a large one with a random sample. Without random assignment, a confounding variable could explain the relationship.", "Choosing “no conclusion can be drawn” when the design supports a narrower conclusion, such as cause and effect for the volunteers in the study.", "Treating “no convincing evidence of an effect” as proof of no effect, or multiplying a sample proportion by the size of the wrong population."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "The manager of a cinema wants to know how satisfied the 2,400 members of its loyalty program are with the new seats. Which method of choosing 100 members is most likely to give a sample that represents all loyalty program members?", "opts": ["Survey the first 100 members who arrive for the Saturday evening show", "Post the survey on the cinema's website and use the first 100 members who respond", "Use a computer to randomly select 100 names from the list of all 2,400 members", "Randomly select 100 people from the line at the ticket counter"], "ans": 2, "sol": "Only the computer selection from the full member list gives every member the same chance.<br>The Saturday show and the website poll are convenience and voluntary response samples.<br>People in the ticket line are chosen at random, but many members are not in that line and many people in it are not members.<br>Answer: <b>Randomly select 100 names from the list of all 2,400 members<\/b>", "hint": "Which method gives each of the 2,400 members, and only members, the same chance of being chosen?"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "A radio host asked listeners to text in whether they support a later school start time. Of the 900 texts received, 81% supported the change. Which of the following best explains why this result may not represent the opinion of all listeners?", "opts": ["Listeners chose whether to text, and people with strong opinions are more likely to respond.", "A total of 900 texts is too few to draw any conclusion.", "The host did not randomly assign listeners to groups.", "A result greater than 50% is always biased."], "ans": 0, "sol": "The listeners decided for themselves whether to respond, so this is a voluntary response sample.<br>Listeners who feel strongly are overrepresented, no matter how many texts arrive.<br>There is no treatment here, so random assignment is not the issue.<br>Answer: <b>Listeners chose whether to text, so it is a voluntary response sample<\/b>", "hint": "Think about who decided which listeners ended up in the sample."}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "A housing society emailed a survey about a new parking rule to all 640 flat owners. Only 144 owners replied. What percent of the flat owners replied? (Disregard the % sign when entering your answer.)", "ans": ["22.5"], "sol": "Percent who replied = <span class=\"fq\"><span>144<\/span><span>640<\/span><\/span> × 100 = 22.5.<br>Because 77.5% did not reply, the results could suffer from nonresponse bias: owners who replied may care more about parking than those who did not.<br>Answer: <b>22.5<\/b>", "hint": "Divide the number who replied by the number who were asked, then convert to a percent."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A researcher selected 150 students at random from all the students at Greenfield Public School and found that 62% of them walk to school. What is the largest population to which this result can be generalized?", "opts": ["All school students in the city", "All students at Greenfield Public School", "Only the 150 students who were surveyed", "All school students in India"], "ans": 1, "sol": "The sample was selected at random from the students at Greenfield Public School.<br>So the result can be generalized to that school, but not to other schools, which had no chance of being sampled.<br>Answer: <b>All students at Greenfield Public School<\/b>", "hint": "The sample was chosen at random from which group of people?"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "To estimate the average number of hours per week that adults in a town exercise, a researcher randomly selected 200 people from the membership list of the town's largest gym. Which statement best describes a problem with this plan?", "opts": ["The sample is not random, because the people were chosen by the researcher.", "The researcher should have surveyed every adult in the town instead of a sample.", "The researcher should have assigned the people to exercise or not to exercise.", "Gym members probably exercise more than other adults, so the sample does not represent all adults in the town."], "ans": 3, "sol": "The selection was random, but only from the list of gym members.<br>Adults who are not members of this gym had no chance of being chosen, and gym members are likely to exercise more.<br>The result applies to gym members, not to all adults in the town.<br>Answer: <b>Gym members probably exercise more than other adults, so the sample does not represent the town<\/b>", "hint": "The selection was random, but random from which list?"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Researchers recorded how much time each of 500 commuters spent on their phone in the evening and how many hours each slept. The researchers did not ask anyone to change their phone use. What type of study is this?", "opts": ["An experiment, because the researchers collected data", "An experiment, because there were 500 participants", "An observational study, because the commuters were randomly selected", "An observational study, because the researchers did not assign phone use"], "ans": 3, "sol": "The commuters decided their own phone use, and the researchers only recorded it.<br>No treatment was imposed, so this is an observational study.<br>The description does not say the commuters were randomly selected, and random selection would not decide the type of study anyway.<br>Answer: <b>An observational study, because the researchers did not assign phone use<\/b>", "hint": "Ask who decided how much each commuter used the phone."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A researcher gave a new reading program to the 30 students in one class and compared their reading scores at the end of the term with those of the 30 students in another class, who did not use the program. Which statement about this study is accurate?", "opts": ["It is an observational study, because the two classes already existed.", "It is an experiment, because the researcher decided which class used the program.", "It is an experiment that used random assignment.", "It is an observational study, because only 30 students used the program."], "ans": 1, "sol": "The researcher imposed the treatment (the reading program) on one class, so it is an experiment.<br>The researcher chose the class; students were not randomly assigned, so the experiment does not use random assignment.<br>Answer: <b>It is an experiment, because the researcher decided which class used the program<\/b>", "hint": "Did the researcher impose the program, or only observe students who chose it? Then ask how the class was chosen."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "In an experiment, 60 volunteers were randomly assigned to drink either green tea or water each morning for a month. The green tea group reported greater alertness on average, and the difference was too large to be explained by chance. Which conclusion is supported?", "opts": ["Drinking green tea caused greater alertness for the volunteers in the study.", "Drinking green tea causes greater alertness for all adults.", "Drinking green tea caused lower alertness for the volunteers in the study.", "Drinking green tea is associated with greater alertness for the volunteers in the study, but no cause-and-effect conclusion is possible."], "ans": 0, "sol": "The drinks were randomly assigned, so a cause-and-effect conclusion is allowed.<br>The subjects were volunteers, not a random sample, so the conclusion applies to the volunteers in the study, not to all adults.<br>Answer: <b>Drinking green tea caused greater alertness for the volunteers in the study.<\/b>", "hint": "Look for the words “randomly assigned,” and then ask who was in the study."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Which of the following studies allows a cause-and-effect conclusion?", "opts": ["Comparing the sleep of students who chose to drink coffee with the sleep of students who did not", "Surveying a random sample of 500 adults about how often they exercise and how they rate their mood", "Randomly assigning 50 mice to a high-sugar diet or a normal diet and comparing their weight gain", "Comparing the heights of children whose parents are tall with those of children whose parents are short"], "ans": 2, "sol": "Only the mouse study assigns the treatment, and it does so at random.<br>The other three only observe groups that formed on their own, so they show associations, not cause and effect.<br>Answer: <b>Randomly assigning 50 mice to a high-sugar diet or a normal diet and comparing their weight gain<\/b>", "hint": "Find the study where the researcher, at random, decides who gets which treatment."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A researcher randomly selected 400 adults from all adults in Jaipur and asked each one how many cups of tea they drink per day and how many hours they sleep. Adults who drank more tea tended to sleep fewer hours. Which conclusion is most appropriate?", "opts": ["Among adults in Jaipur, drinking more tea is associated with sleeping fewer hours.", "Drinking more tea causes adults in Jaipur to sleep fewer hours.", "Among adults in India, drinking more tea is associated with sleeping fewer hours.", "Drinking more tea causes adults in India to sleep fewer hours."], "ans": 0, "sol": "Selection: random, from adults in Jaipur, so the result can be generalized to Jaipur but not to India.<br>Assignment: none, since adults chose how much tea to drink, so only an association is supported.<br>Answer: <b>Among adults in Jaipur, drinking more tea is associated with sleeping fewer hours.<\/b>", "hint": "Answer two questions: who can the result be applied to, and was any treatment randomly assigned?"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A company recruited 80 volunteers through an online advertisement to test a typing app. The volunteers were randomly assigned to use the app or not to use it for four weeks. Typing speeds increased significantly more in the app group. Which statement is most appropriate?", "opts": ["Using the app causes greater increases in typing speed for all adults.", "Using the app is associated with greater increases in typing speed for all adults, but it cannot be said to cause them.", "No conclusion can be drawn, because the volunteers were not randomly selected.", "Using the app caused greater increases in typing speed for the volunteers in the study, but the result cannot be generalized to all adults."], "ans": 3, "sol": "Random assignment of the app supports a cause-and-effect conclusion.<br>The volunteers answered an advertisement, so they are not a random sample of all adults; the conclusion applies only to the volunteers in the study.<br>“No conclusion” is too weak, because the experiment does support a conclusion about these volunteers.<br>Answer: <b>The app caused greater increases for the volunteers in the study, but not necessarily for all adults<\/b>", "hint": "Answer separately: how were people chosen, and how were they assigned?"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A researcher wants to determine whether a new study app improves exam scores for all Class 12 students in a district. Which study design best allows this conclusion?", "opts": ["Randomly select 300 Class 12 students from the district, then let each one choose whether to use the app.", "Ask Class 12 teachers to nominate 300 students, then randomly assign half of them to use the app.", "Randomly select 300 Class 12 students from the district, then randomly assign half of them to use the app.", "Randomly select 300 Class 12 students from one school in the district, then randomly assign half of them to use the app."], "ans": 2, "sol": "A conclusion about cause needs random assignment, which rules out letting students choose.<br>A conclusion about all Class 12 students in the district needs a random sample from the whole district, which rules out nominated students and students from one school.<br>Only one design has both.<br>Answer: <b>Randomly select 300 Class 12 students from the district, then randomly assign half of them to use the app.<\/b>", "hint": "The conclusion has two parts, “improves” and “all Class 12 students in the district.” Which design supports both?"}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A library wants to estimate the average number of books borrowed per month by its 3,000 registered members. Which sampling method is most likely to produce a representative sample of the members?", "opts": ["Randomly select 50 members from the library's full membership list", "Survey 50 members who are in the reading room on one afternoon", "Leave survey forms at the front desk for members to fill out if they wish", "Survey every member who borrows a book on one Monday"], "ans": 0, "sol": "The random selection from the full list gives every member the same chance.<br>The reading room and Monday borrowers are convenience samples that favor frequent visitors, and the forms at the desk form a voluntary response sample.<br>Answer: <b>Randomly select 50 members from the library's full membership list<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A random sample of 250 farmers was selected from all registered farmers in Nashik district. The survey found that 46% of them use drip irrigation. What is the largest population to which this result can be generalized?", "opts": ["Only the 250 farmers surveyed", "All registered farmers in Nashik district", "All farmers in Maharashtra", "All farmers in India"], "ans": 1, "sol": "The sample was chosen at random from registered farmers in Nashik district.<br>Farmers outside that group had no chance of being chosen, so the result cannot be extended to them.<br>Answer: <b>All registered farmers in Nashik district<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A school nurse randomly assigned 50 students to receive a daily text reminding them to drink water and 50 students to receive no reminder. She then measured how much water each student drank. What type of study is this?", "opts": ["An observational study, because water intake was measured", "An observational study, because all the students were from one school", "An experiment, because the nurse decided who received the reminder", "An experiment, because there were 100 students"], "ans": 2, "sol": "The nurse imposed the treatment (the reminder) and assigned it to students.<br>Imposing a treatment is what makes a study an experiment; the number of students does not.<br>Answer: <b>An experiment, because the nurse decided who received the reminder<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Which feature of a study is needed to conclude that a treatment causes a change in a response?", "opts": ["A large number of subjects", "Random selection of subjects from a population", "Subjects who volunteer to take part", "Random assignment of subjects to treatment groups"], "ans": 3, "sol": "Random assignment makes the groups alike on average in every other way, so a difference can be credited to the treatment.<br>Random selection lets you generalize, but it does not allow a claim about cause.<br>Answer: <b>Random assignment of subjects to treatment groups<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "A food blogger asked her online followers to rate a new restaurant, and 300 followers responded. Which term best describes this sample?", "opts": ["A simple random sample", "A voluntary response sample", "The group of subjects in an experiment", "A census of all diners at the restaurant"], "ans": 1, "sol": "The followers decided for themselves whether to respond.<br>A sample in which people choose to take part is a voluntary response sample.<br>Answer: <b>A voluntary response sample<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Researchers compared the blood pressure of 1,000 adults who said they follow a vegetarian diet with that of 1,000 adults who said they do not. Which statement about this study is true?", "opts": ["It is an observational study, because the adults chose their own diets.", "It is an experiment, because two groups were compared.", "It is an experiment, because blood pressure was measured.", "It is an observational study, because the sample was large."], "ans": 0, "sol": "The researchers did not assign any diet; the adults already followed their own diets.<br>Recording existing behavior makes this an observational study.<br>Answer: <b>It is an observational study, because the adults chose their own diets.<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "To learn about the 4,000 members of a fitness club, the club randomly selected 250 members. Of these, 60 said they prefer early morning classes. Based on this survey, what is the best estimate of the number of club members who prefer early morning classes?", "ans": ["960"], "sol": "Sample proportion: <span class=\"fq\"><span>60<\/span><span>250<\/span><\/span> = 0.24.<br>The sample was random from all 4,000 members, so apply it to that population: 0.24 × 4,000 = 960.<br>Answer: <b>960<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "To estimate the percent of a city's residents who use public transport, a researcher interviewed 300 people waiting at metro stations on weekday mornings. Which statement best explains why the estimate is likely to be biased?", "opts": ["A sample of 300 is too small to estimate a percent.", "The researcher should have randomly assigned people to use the metro.", "Interviews give less accurate answers than written surveys.", "People waiting at metro stations are more likely to use public transport than city residents in general."], "ans": 3, "sol": "This is a convenience sample of people who were easy to reach at metro stations.<br>Almost everyone found there uses public transport, so the estimate would be far too high.<br>Answer: <b>People at metro stations are more likely to use public transport than residents in general<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A random sample of 120 teachers was chosen from all teachers at government schools in Kerala, and 85 of them said they use online teaching tools every week. Which conclusion is most appropriate?", "opts": ["Most teachers in India probably use online teaching tools every week.", "Most teachers at private schools in Kerala probably use online teaching tools every week.", "Most teachers at government schools in Kerala probably use online teaching tools every week.", "Nothing can be concluded about any teachers other than the 120 surveyed."], "ans": 2, "sol": "85 of 120 is about 71%, a clear majority.<br>The sample was random from government school teachers in Kerala, so the result applies to that group only, not to India or to private schools.<br>Because the sample was random, it does support a conclusion beyond the 120 teachers.<br>Answer: <b>Most teachers at government schools in Kerala probably use the tools every week<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Which of the following is an observational study?", "opts": ["Randomly assigning 30 tomato plants to receive either 4 or 8 hours of light and measuring their growth", "Using a coin toss to decide whether each of 40 volunteers listens to music or sits in silence before a memory test", "Recording the daily screen time and the grades of 200 randomly selected students", "Randomly assigning 60 patients to use either a new skin cream or a cream with no active ingredient"], "ans": 2, "sol": "Three choices impose a treatment (light, music, cream), so they are experiments.<br>Recording screen time imposes nothing; the students chose their own screen time. Random selection does not make it an experiment.<br>Answer: <b>Recording the daily screen time and the grades of 200 randomly selected students<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A survey of 600 randomly selected adults in a city found that adults who own a dog walk more minutes per day, on average, than adults who do not. Which conclusion is appropriate?", "opts": ["Adults in the city who own a dog tend to walk more, but the survey does not show that owning a dog causes more walking.", "Owning a dog causes adults in the city to walk more.", "Walking more causes adults in the city to buy dogs.", "Owning a dog has no relationship with walking for adults in the city."], "ans": 0, "sol": "This is an observational survey: no one was assigned to own a dog.<br>It shows an association for adults in the city, but a confounding variable, such as an active lifestyle, could explain it, so neither direction of cause is supported.<br>Answer: <b>Dog owners in the city tend to walk more, but the survey does not show cause<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "For an experiment, 240 volunteers were split at random into two equal groups. One group studied with a new vocabulary app, and the other studied with a printed word list. The bar graph gives the number of volunteers in each group whose vocabulary score rose by at least 10 points.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of the number of volunteers who improved by at least 10 points: 78 in the app group and 54 in the word list group\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"54\" y1=\"157.67\" x2=\"308\" y2=\"157.67\"/><line x1=\"54\" y1=\"129.33\" x2=\"308\" y2=\"129.33\"/><line x1=\"54\" y1=\"101.0\" x2=\"308\" y2=\"101.0\"/><line x1=\"54\" y1=\"72.67\" x2=\"308\" y2=\"72.67\"/><line x1=\"54\" y1=\"44.33\" x2=\"308\" y2=\"44.33\"/><line x1=\"54\" y1=\"16.0\" x2=\"308\" y2=\"16.0\"/><\/g><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"97.5\" y=\"75.5\" width=\"40\" height=\"110.5\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"224.5\" y=\"109.5\" width=\"40\" height=\"76.5\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"54\" y1=\"186.0\" x2=\"308\" y2=\"186.0\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"54\" y1=\"16\" x2=\"54\" y2=\"186.0\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text class=\"fg-tick\" x=\"49\" y=\"190.0\" text-anchor=\"end\">0<\/text><text class=\"fg-tick\" x=\"49\" y=\"161.67\" text-anchor=\"end\">20<\/text><text class=\"fg-tick\" x=\"49\" y=\"133.33\" text-anchor=\"end\">40<\/text><text class=\"fg-tick\" x=\"49\" y=\"105.0\" text-anchor=\"end\">60<\/text><text class=\"fg-tick\" x=\"49\" y=\"76.67\" text-anchor=\"end\">80<\/text><text class=\"fg-tick\" x=\"49\" y=\"48.33\" text-anchor=\"end\">100<\/text><text class=\"fg-tick\" x=\"49\" y=\"20.0\" text-anchor=\"end\">120<\/text><text class=\"fg-val\" x=\"117.5\" y=\"71.5\" text-anchor=\"middle\">78<\/text><text x=\"117.5\" y=\"200.0\" text-anchor=\"middle\">Vocabulary app<\/text><text class=\"fg-val\" x=\"244.5\" y=\"105.5\" text-anchor=\"middle\">54<\/text><text x=\"244.5\" y=\"200.0\" text-anchor=\"middle\">Printed word list<\/text><text x=\"181.0\" y=\"236\" text-anchor=\"middle\">Group (120 volunteers each)<\/text><text x=\"13\" y=\"101.0\" text-anchor=\"middle\" transform=\"rotate(-90 13 101.0)\">Number who improved<\/text><\/g><\/svg>By how many percentage points was the improvement rate in the app group greater than the improvement rate in the word list group? (Disregard the % sign when entering your answer.)", "ans": ["20"], "sol": "App group: <span class=\"fq\"><span>78<\/span><span>120<\/span><\/span> = 65%. Word list group: <span class=\"fq\"><span>54<\/span><span>120<\/span><\/span> = 45%.<br>Difference: 65 − 45 = 20 percentage points.<br>Because the groups were randomly assigned, a difference this large can be credited to the app for these volunteers.<br>Answer: <b>20<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A researcher randomly selected 200 employees from all employees of a large IT company and randomly assigned half to use a standing desk and half to use a regular desk. After three months, the standing desk group reported less back pain on average, and the difference was too large to be explained by chance. Which conclusion is most appropriate?", "opts": ["Using a standing desk causes less back pain for employees of this company.", "Using a standing desk causes less back pain for all office workers.", "Using a standing desk is associated with less back pain for employees of this company, but cause cannot be determined.", "Using a standing desk causes more back pain for employees of this company."], "ans": 0, "sol": "Random assignment of desks supports a cause-and-effect conclusion.<br>Random selection from this company's employees lets the conclusion apply to the whole company, but not to other companies.<br>Answer: <b>Using a standing desk causes less back pain for employees of this company.<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A café owner asked 80 customers in her café whether they work from home and how many cups of coffee they drink per day. Customers who work from home drank more coffee per day, on average. Which conclusion is most appropriate?", "opts": ["Working from home causes adults in the city to drink more coffee.", "Among all adults in the city, those who work from home tend to drink more coffee.", "Among the 80 customers surveyed, those who work from home drank more coffee per day on average.", "Among the 80 customers surveyed, working from home caused them to drink more coffee."], "ans": 2, "sol": "The customers were simply those in the café, a convenience sample, so the result describes only them.<br>No one was assigned to work from home, so no cause can be claimed.<br>Answer: <b>Among the 80 customers surveyed, those who work from home drank more coffee<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Researchers randomly selected 300 students from all engineering colleges in Tamil Nadu and found that the students sleep an average of 6.1 hours per night. Which statement best explains why this result should not be generalized to all college students in India?", "opts": ["The sample was not selected at random.", "A sample of 300 students is too small.", "The researchers did not use random assignment.", "The students were selected only from engineering colleges in Tamil Nadu, and they may differ from other college students."], "ans": 3, "sol": "The selection was random, so the result applies to engineering students in Tamil Nadu.<br>Students elsewhere, or in other fields, had no chance of being selected, so the result does not extend to them.<br>Answer: <b>Only engineering colleges in Tamil Nadu were sampled<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A town council randomly selected 800 households from all households in the town and mailed each one a survey about a proposed tax. Only 140 households returned the survey, and 75% of them opposed the tax. Which statement best describes the main concern with concluding that about 75% of the households in the town oppose the tax?", "opts": ["The households were not selected at random.", "Most selected households did not respond, and the households that responded may differ from the town as a whole.", "Mailing a survey turns the study into an experiment.", "The 75% should be applied to households in other towns instead."], "ans": 1, "sol": "The selection was random, so A is false.<br>Only <span class=\"fq\"><span>140<\/span><span>800<\/span><\/span> = 17.5% of the selected households replied. Households with strong feelings about a tax are more likely to reply, so this is nonresponse bias.<br>Answer: <b>Nonresponse: most selected households did not reply<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Researchers randomly selected 450 adults from a city's voter list. They asked each adult whether they meditate regularly and gave each adult a timed concentration test. On average, adults who meditate scored higher on the test. Which statement about this study is accurate?", "opts": ["It is an observational study, because the researchers did not assign anyone to meditate.", "It is an experiment, because the adults were selected at random.", "It is an experiment, because two groups were compared.", "It is an observational study, because the results cannot be generalized."], "ans": 0, "sol": "The adults decided for themselves whether to meditate; the researchers only recorded it.<br>Random selection decides who is in the study, not whether it is an experiment.<br>The sample was random from the voter list, so the results can be generalized to that group.<br>Answer: <b>It is an observational study, because the researchers did not assign anyone to meditate.<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A study of 2,000 randomly selected households in a state found that households with more books at home had children with higher reading scores. A newspaper concluded that giving families more books will raise their children's reading scores. Which statement best evaluates the newspaper's conclusion?", "opts": ["It is justified, because the households were randomly selected.", "It is not justified, because books were not randomly assigned, and other factors, such as how much parents read, could explain the relationship.", "It is justified, because a sample of 2,000 households is large.", "It is not justified, because the result applies only to households with no books."], "ans": 1, "sol": "The study only observed how many books families already had, so it is observational.<br>A confounding variable, such as parents' reading habits or income, could raise both the number of books and the reading scores.<br>Random selection and a large sample do not allow a claim about cause.<br>Answer: <b>Not justified: books were not randomly assigned, so other factors could explain the link<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A gym randomly selected 120 of its members. Each selected member chose either a high-protein diet or a regular diet for eight weeks. On average, the high-protein group gained more muscle, and the difference was too large to be explained by chance. Which conclusion is most appropriate?", "opts": ["For members of the gym, a high-protein diet causes more muscle gain.", "For all adults, a high-protein diet causes more muscle gain.", "A high-protein diet causes more muscle gain, but only for the 120 members in the study.", "For members of the gym, choosing a high-protein diet is associated with more muscle gain, but it cannot be concluded that the diet causes it."], "ans": 3, "sol": "The members were randomly selected from the gym, so the result can be generalized to gym members.<br>The members chose their own diets, so there was no random assignment; members who chose high protein may also train harder.<br>So only an association, for members of the gym, is supported.<br>Answer: <b>For gym members, a high-protein diet is associated with more muscle gain, but not shown to cause it<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A hospital compared the recovery times of patients who chose to do physiotherapy at home with those of patients who chose to do it at the clinic. The clinic group recovered faster on average. The hospital wants to know whether clinic physiotherapy causes faster recovery for its patients. Which change to the study would best allow this conclusion?", "opts": ["Include twice as many patients in the study.", "Survey patients about which setting they prefer.", "Randomly assign each patient to home or clinic physiotherapy.", "Compare only patients who are older than 60."], "ans": 2, "sol": "Patients who chose the clinic may differ, for example in mobility or motivation, from those who chose home.<br>Random assignment balances such factors between the groups, so a difference in recovery could be credited to the setting.<br>More patients, a survey or a narrower group would not remove the self-selection.<br>Answer: <b>Randomly assign each patient to home or clinic physiotherapy.<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "A principal wants to survey 60 of the 1,200 students in her school about the canteen menu. Which method gives a random sample of the students in the school?", "opts": ["Number the students from 1 to 1,200 and use a random number generator to choose 60 numbers", "Survey the 60 students who arrive at school earliest on Monday", "Ask the class teachers to pick a total of 60 students who will give honest answers", "Put a sign-up sheet in the canteen and survey the first 60 students who sign it"], "ans": 0, "sol": "Only the random number method gives every student the same chance of selection.<br>Early arrivals are a convenience sample, teacher picks depend on judgment, and the sign-up sheet is a voluntary response sample.<br>Answer: <b>Number the students and choose 60 with a random number generator<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A random sample of 90 nurses was selected from all the nurses at City Hospital. The mean length of a shift reported by the nurses in the sample was 9.2 hours. Which statement is most appropriate?", "opts": ["The mean shift length for all nurses in the country is about 9.2 hours.", "The mean shift length for nurses at City Hospital is probably close to 9.2 hours.", "Every nurse at City Hospital works a shift of 9.2 hours.", "The result says nothing about the nurses at City Hospital who were not surveyed."], "ans": 1, "sol": "The random sample came from the nurses at City Hospital, so it estimates the mean for that hospital.<br>It does not apply to other hospitals, and a mean does not say that every nurse works exactly 9.2 hours.<br>Answer: <b>The mean shift length for nurses at City Hospital is probably close to 9.2 hours.<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "In a study, 90 volunteers were randomly divided into three groups. For a month, one group did no stretching, one group stretched for 15 minutes each day, and one group stretched for 30 minutes each day. Then the flexibility of each volunteer was measured. What makes this study an experiment?", "opts": ["The flexibility of each volunteer was measured.", "The researchers imposed the amount of stretching on each group.", "The volunteers were divided into three groups.", "The participants were volunteers."], "ans": 1, "sol": "A study is an experiment when the researchers impose the treatment.<br>Here the researchers set each group's amount of stretching; measuring, grouping and using volunteers happen in observational studies too.<br>Answer: <b>The researchers imposed the amount of stretching on each group.<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Researchers randomly assigned 150 tomato plants to be watered with either rainwater or tap water. The rainwater plants produced more tomatoes on average, and the difference was too large to be explained by chance. Why does random assignment matter in this study?", "opts": ["It allows the result to be generalized to all tomato plants in the world.", "It guarantees that every plant in a group produced the same number of tomatoes.", "It makes the two groups similar on average in sunlight, soil and other factors, so the difference can be credited to the type of water.", "It makes the study an observational study."], "ans": 2, "sol": "Random assignment balances other factors between the groups on average.<br>So the remaining difference can be credited to the treatment.<br>Generalizing to a population needs random selection, which is a different idea.<br>Answer: <b>It balances other factors between the groups, so the difference can be credited to the water<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A fitness app collected data from 5,000 users who chose to share it. Users who logged more workouts reported better sleep. Which conclusion is most appropriate?", "opts": ["Logging more workouts causes better sleep among the app's users.", "Among all adults, doing more workouts is associated with better sleep.", "Logging more workouts caused better sleep among the 5,000 users who shared their data.", "Among the 5,000 users who shared their data, logging more workouts was associated with reporting better sleep."], "ans": 3, "sol": "The users chose to share their data, so they are not a random sample; the result describes only those 5,000 users.<br>Nobody was assigned a number of workouts, so only an association is supported.<br>Answer: <b>Among the 5,000 users who shared data, more workouts was associated with better sleep<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A researcher randomly selected 300 students from a university and then randomly assigned 150 of them to take a 20 minute nap before an exam and the other 150 to stay awake. Which statement correctly describes the study?", "opts": ["It is an experiment that uses both random selection and random assignment.", "It is an observational study that uses random selection.", "It is an experiment that uses random selection but not random assignment.", "It is an observational study that uses random assignment."], "ans": 0, "sol": "The students were randomly selected from the university: random selection.<br>The researcher decided, at random, who napped: random assignment, so it is an experiment.<br>Answer: <b>It is an experiment that uses both random selection and random assignment.<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A researcher wants to estimate the percent of adults in a city who own a bicycle. Which sampling method is most likely to overestimate this percent?", "opts": ["Randomly select 400 adults from the city's voter list", "Survey 400 adults at a bicycle repair shop", "Survey 400 adults at a car showroom", "Randomly select 400 households from all households in the city and survey one adult in each"], "ans": 1, "sol": "Adults at a bicycle repair shop are much more likely than other adults to own a bicycle, so that sample would overestimate the percent.<br>The car showroom sample would more likely underestimate it, and the two random methods are not biased in either direction.<br>Answer: <b>Survey 400 adults at a bicycle repair shop<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A high school has 2,700 students, and 900 of them are in Grade 11. A random sample of 300 Grade 11 students found that 117 of them have a part-time job. Based on this sample, what is the best estimate of the number of Grade 11 students at the school who have a part-time job?", "ans": ["351"], "sol": "Sample proportion: <span class=\"fq\"><span>117<\/span><span>300<\/span><\/span> = 0.39.<br>The sample was drawn from the 900 Grade 11 students, so multiply by 900, not 2,700: 0.39 × 900 = 351.<br>Answer: <b>351<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A researcher wants to know whether a new booking app reduces the time patients wait at clinics. She plans to compare wait times at 10 clinics that already use the app with wait times at 10 clinics that do not. A colleague suggests instead choosing 10 of the 20 clinics at random to start using the app. What is the main advantage of the colleague's plan?", "opts": ["It turns the study into an experiment, so a difference in wait times could be credited to the app.", "It increases the number of clinics in the study.", "It lets the result be applied to all clinics in the world.", "It removes the need to measure wait times."], "ans": 0, "sol": "In the original plan, clinics chose whether to use the app, so it is observational; clinics that chose the app might already be better organized.<br>In the colleague's plan, the researcher randomly imposes the app, which makes it a randomized experiment.<br>The number of clinics stays at 20, and generalizing needs random selection.<br>Answer: <b>It turns the study into an experiment, so a difference could be credited to the app<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A study of 50 towns found that towns with more pharmacies had more cases of flu each winter. Which of the following is the most likely explanation of this relationship that does not involve pharmacies causing flu?", "opts": ["Pharmacies sell medicine for the flu.", "The study included 50 towns.", "Towns with larger populations tend to have both more pharmacies and more flu cases.", "Flu cases were counted only in the winter."], "ans": 2, "sol": "Population size is a confounding variable: it is linked to both the number of pharmacies and the number of flu cases.<br>It explains the relationship without either one causing the other.<br>Answer: <b>Towns with larger populations tend to have both more pharmacies and more flu cases.<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A researcher randomly selected 240 adults from a district and randomly assigned half to take a vitamin supplement daily and half to take a pill with no active ingredient. After six months, the difference in the average number of colds between the groups was small and could easily have occurred by chance. Which conclusion is most appropriate?", "opts": ["The supplement causes fewer colds for adults in the district.", "The study proves that the supplement has no effect on colds for all adults.", "The supplement causes more colds for adults in the district.", "The study provides no convincing evidence that the supplement reduces colds for adults in the district."], "ans": 3, "sol": "A difference that could easily be due to chance is not evidence of an effect in either direction.<br>Failing to find an effect is not proof of no effect, and “all adults” is broader than the district that was sampled.<br>Answer: <b>No convincing evidence that the supplement reduces colds for adults in the district<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A town has 20 wards. A researcher wants to survey 200 households about garbage collection. Which of the following plans is most likely to give a biased sample?", "opts": ["Randomly choose 10 households from each of the 20 wards", "Number all households in the town and choose 200 with a random number generator", "Choose the 200 households closest to the town hall", "Randomly choose 4 of the 20 wards and randomly choose 50 households in each of those wards"], "ans": 2, "sol": "Three plans use chance at every step, so no group of households is favored by the researcher.<br>Households near the town hall are a convenience sample and are likely to get different garbage service from households at the edge of town.<br>Answer: <b>Choose the 200 households closest to the town hall<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A researcher randomly selected 400 adults from a list of all adults in Pune who use the city bus service and found that 58% would support a fare increase if service improved. A city official claims that about 58% of all adults in Pune would support the fare increase. Which statement best evaluates the official's claim?", "opts": ["It is supported, because the sample was chosen at random.", "It is not supported, because the sample represents only bus users in Pune, not all adults in Pune.", "It is supported, because 400 adults is a large sample.", "It is not supported, because the study did not use random assignment."], "ans": 1, "sol": "The selection was random, but only from bus users.<br>Adults who do not use buses had no chance of being chosen, and they may feel differently about a bus fare increase.<br>The result can be generalized to bus users in Pune only.<br>Answer: <b>Not supported: the sample represents only bus users in Pune<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Two studies examined sports drinks and cycling endurance.<br>Study 1: 80 volunteer cyclists were randomly assigned to drink either a sports drink or water during a long ride. The sports drink group rode significantly longer.<br>Study 2: A random sample of 500 club cyclists was surveyed. Cyclists who usually drink sports drinks reported significantly longer rides.<br>Which study, if either, supports the conclusion that sports drinks cause cyclists to ride longer?", "opts": ["Both Study 1 and Study 2", "Study 2 only", "Neither study", "Study 1 only"], "ans": 3, "sol": "Study 1 randomly assigned the drinks, so it supports cause and effect, at least for those volunteers.<br>Study 2 is observational: cyclists chose their drinks, and serious riders may both buy sports drinks and ride longer.<br>Answer: <b>Study 1 only<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "An online grocery store invited its customers to take part in a test, and 300 customers agreed. They were randomly assigned to see either a red or a green “Buy now” button. Customers who saw the green button were significantly more likely to make a purchase. Which conclusion is most appropriate?", "opts": ["For the customers who agreed to take part, the green button caused a higher purchase rate.", "For all customers of the store, the green button causes a higher purchase rate.", "For the customers who agreed to take part, the green button was associated with a higher purchase rate, but it cannot be said to have caused it.", "For all online shoppers, the green button causes a higher purchase rate."], "ans": 0, "sol": "The buttons were randomly assigned, so a cause-and-effect conclusion is supported.<br>The customers chose to take part, so they are not a random sample of the store's customers; the conclusion applies only to those who agreed.<br>Answer: <b>The green button caused a higher purchase rate for the customers who agreed to take part<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Researchers want to know whether people who live near a busy highway have more breathing problems than people who do not. Why is an observational study, rather than an experiment, the appropriate design?", "opts": ["An observational study would prove that highways cause breathing problems.", "Observational studies always have larger samples than experiments.", "It would be unethical and impractical to assign people to live near a busy highway.", "An experiment cannot measure breathing problems."], "ans": 2, "sol": "An experiment would require assigning people to a possibly harmful home location, which is unethical and impractical.<br>An observational study can show an association, but it cannot prove cause.<br>Answer: <b>It would be unethical and impractical to assign people to live near a busy highway.<\/b>"}, {"lo": "LO1", "diff": "X", "type": "spr", "q": "An online poll on a news website asked readers whether the city should build a new flyover. Separately, a random sample of registered voters in the city was asked the same question. The bar graph shows the results.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Grouped bar graph. Online poll: 850 favor and 400 oppose. Random sample of voters: 172 favor and 228 oppose\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"54\" y1=\"167.11\" x2=\"308\" y2=\"167.11\"/><line x1=\"54\" y1=\"148.22\" x2=\"308\" y2=\"148.22\"/><line x1=\"54\" y1=\"129.33\" x2=\"308\" y2=\"129.33\"/><line x1=\"54\" y1=\"110.44\" x2=\"308\" y2=\"110.44\"/><line x1=\"54\" y1=\"91.56\" x2=\"308\" y2=\"91.56\"/><line x1=\"54\" y1=\"72.67\" x2=\"308\" y2=\"72.67\"/><line x1=\"54\" y1=\"53.78\" x2=\"308\" y2=\"53.78\"/><line x1=\"54\" y1=\"34.89\" x2=\"308\" y2=\"34.89\"/><line x1=\"54\" y1=\"16.0\" x2=\"308\" y2=\"16.0\"/><\/g><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"74.81\" y=\"25.44\" width=\"39.69\" height=\"160.56\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"120.5\" y=\"110.44\" width=\"39.69\" height=\"75.56\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"201.81\" y=\"153.51\" width=\"39.69\" height=\"32.49\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"247.5\" y=\"142.93\" width=\"39.69\" height=\"43.07\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"54\" y1=\"186.0\" x2=\"308\" y2=\"186.0\"/><line class=\"fg-axis\" stroke=\"currentColor\" stroke-width=\"1.5\" x1=\"54\" y1=\"16\" x2=\"54\" y2=\"186.0\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text class=\"fg-tick\" x=\"49\" y=\"190.0\" text-anchor=\"end\">0<\/text><text class=\"fg-tick\" x=\"49\" y=\"171.11\" text-anchor=\"end\">100<\/text><text class=\"fg-tick\" x=\"49\" y=\"152.22\" text-anchor=\"end\">200<\/text><text class=\"fg-tick\" x=\"49\" y=\"133.33\" text-anchor=\"end\">300<\/text><text class=\"fg-tick\" x=\"49\" y=\"114.44\" text-anchor=\"end\">400<\/text><text class=\"fg-tick\" x=\"49\" y=\"95.56\" text-anchor=\"end\">500<\/text><text class=\"fg-tick\" x=\"49\" y=\"76.67\" text-anchor=\"end\">600<\/text><text class=\"fg-tick\" x=\"49\" y=\"57.78\" text-anchor=\"end\">700<\/text><text class=\"fg-tick\" x=\"49\" y=\"38.89\" text-anchor=\"end\">800<\/text><text class=\"fg-tick\" x=\"49\" y=\"20.0\" text-anchor=\"end\">900<\/text><text class=\"fg-val\" x=\"94.65\" y=\"21.44\" text-anchor=\"middle\">850<\/text><text x=\"94.65\" y=\"199.0\" text-anchor=\"middle\">Favor<\/text><text class=\"fg-val\" x=\"140.34\" y=\"106.44\" text-anchor=\"middle\">400<\/text><text x=\"140.34\" y=\"199.0\" text-anchor=\"middle\">Oppose<\/text><text x=\"117.5\" y=\"213.0\" text-anchor=\"middle\">Online poll<\/text><text class=\"fg-val\" x=\"221.65\" y=\"149.51\" text-anchor=\"middle\">172<\/text><text x=\"221.65\" y=\"199.0\" text-anchor=\"middle\">Favor<\/text><text class=\"fg-val\" x=\"267.34\" y=\"138.93\" text-anchor=\"middle\">228<\/text><text x=\"267.34\" y=\"199.0\" text-anchor=\"middle\">Oppose<\/text><text x=\"244.5\" y=\"213.0\" text-anchor=\"middle\">Random sample<\/text><text x=\"181.0\" y=\"236\" text-anchor=\"middle\">Survey<\/text><text x=\"13\" y=\"101.0\" text-anchor=\"middle\" transform=\"rotate(-90 13 101.0)\">Number of people<\/text><\/g><\/svg>By how many percentage points is the percent in favor in the online poll greater than the percent in favor in the random sample? (Disregard the % sign when entering your answer.)", "ans": ["25"], "sol": "Online poll: <span class=\"fq\"><span>850<\/span><span>1,250<\/span><\/span> = 68% in favor.<br>Random sample: <span class=\"fq\"><span>172<\/span><span>400<\/span><\/span> = 43% in favor.<br>Difference: 68 − 43 = 25 percentage points. The random sample is the trustworthy estimate; the online poll is a voluntary response sample.<br>Answer: <b>25<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "A random sample of 200 members was taken from the 5,000 members of a cycling club in Chandigarh, and a random sample of 200 members was taken from the 8,000 members of a walking club in Chandigarh. In the samples, 38% of the cycling club members and 24% of the walking club members said they would join a weekend fitness event. Based on the samples, what is the best estimate of the total number of members of the two clubs who would join the event?", "opts": ["124", "4,030", "4,940", "3,820"], "ans": 3, "sol": "Apply each sample percent only to the club it was drawn from.<br>Cycling club: 0.38 × 5,000 = 1,900. Walking club: 0.24 × 8,000 = 1,920.<br>Total: 1,900 + 1,920 = 3,820. Averaging the percents (31% of 13,000 = 4,030) ignores that the clubs differ in size.<br>Answer: <b>3,820<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "Students at a school who signed up for an after-school tutoring program scored higher on the final exam, on average, than students who did not sign up. Which of the following, if true, would most weaken the claim that the tutoring program caused the higher scores?", "opts": ["Students who signed up already had higher grades than other students before the program began.", "The tutoring program met twice a week.", "The final exam had 40 questions.", "Both groups of students took the same final exam."], "ans": 0, "sol": "Students chose whether to sign up, so the groups may have differed from the start.<br>If the tutored students already had higher grades, that earlier difference, not the program, could explain their higher scores.<br>Answer: <b>The students who signed up already had higher grades before the program<\/b>"}, {"lo": "LO5", "diff": "X", "type": "mcq", "q": "A researcher randomly selected 120 adults from the members of a yoga center in Mysuru and randomly assigned half of them to practice a new breathing exercise daily for eight weeks. Blood pressure decreased significantly more, on average, in the breathing exercise group. Which conclusion is most appropriate?", "opts": ["The breathing exercise causes a greater decrease in blood pressure for adults in Mysuru.", "The breathing exercise causes a greater decrease in blood pressure for members of the yoga center.", "The breathing exercise is associated with a greater decrease in blood pressure for adults in Mysuru, but cause cannot be determined.", "The breathing exercise caused a greater decrease in blood pressure, but only for the 60 members who practiced it."], "ans": 1, "sol": "Random assignment supports a conclusion about cause.<br>The random sample was drawn from the yoga center's members, so the conclusion applies to all its members, but not to adults in Mysuru in general.<br>Limiting the result to the 60 who practiced is too weak, because the random sample represents the whole center.<br>Answer: <b>The exercise causes a greater decrease in blood pressure for members of the yoga center<\/b>"}], "unit_no": 3, "topic_no": "3", "code": "3.3"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }
