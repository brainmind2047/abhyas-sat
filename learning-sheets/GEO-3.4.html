var S = {"id": "GEO-3.4", "unit": "Geometry and Trigonometry", "topic": "Right triangles, trigonometry and circles", "title": "Circles in the coordinate plane", "intro": "A circle in the <i>xy<\/i>-plane is the set of all points at a fixed distance <i>r<\/i> from a center (<i>h<\/i>, <i>k<\/i>), and its standard-form equation (<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + (<i>y<\/i> − <i>k<\/i>)<sup>2<\/sup> = <i>r<\/i><sup>2<\/sup> records both facts. On the DSAT you read the center and radius from an equation, build an equation from a center, a point or a diameter, complete the square on an expanded equation, and decide whether a point lies inside, on or outside a circle.", "los": [{"id": "LO1", "text": "Identify the center and the radius of a circle from its equation in standard form."}, {"id": "LO2", "text": "Write the equation of a circle from its center and radius, from its center and a point on it, or from its graph."}, {"id": "LO3", "text": "Determine the equation, center or radius of a circle from the endpoints of a diameter by using the midpoint and distance formulas."}, {"id": "LO4", "text": "Rewrite a circle equation from general form into standard form by completing the square to find its center and radius."}, {"id": "LO5", "text": "Determine whether a point lies inside, on or outside a circle by comparing its squared distance from the center with the square of the radius."}], "notes": [{"lo": "LO1", "h": "What a circle equation says", "html": "<p>A circle is the set of all points that are the same distance, the <b>radius<\/b> <i>r<\/i>, from one fixed point, the <b>center<\/b> (<i>h<\/i>, <i>k<\/i>). If (<i>x<\/i>, <i>y<\/i>) is any point on the circle, the distance formula says √((<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + (<i>y<\/i> − <i>k<\/i>)<sup>2<\/sup>) = <i>r<\/i>. Squaring both sides removes the square root and gives the standard form of the equation.<\/p><div class=\"rule\">Standard form: (<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + (<i>y<\/i> − <i>k<\/i>)<sup>2<\/sup> = <i>r<\/i><sup>2<\/sup>, where (<i>h<\/i>, <i>k<\/i>) is the center and <i>r<\/i> is the radius.<\/div><p>The circle below has center (2, 1) and radius 3, so its equation is (<i>x<\/i> − 2)<sup>2<\/sup> + (<i>y<\/i> − 1)<sup>2<\/sup> = 9. The point (5, 1) is on it because (5 − 2)<sup>2<\/sup> + (1 − 1)<sup>2<\/sup> = 9. Every point of the circle satisfies the equation, and no other point does.<\/p><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Circle in the xy-plane with center C(2, 1) and radius 3. A dashed radius joins the center to the point (5, 1) on the circle.\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"34\" y1=\"10\" x2=\"34\" y2=\"250\"/><line x1=\"58\" y1=\"10\" x2=\"58\" y2=\"250\"/><line x1=\"82\" y1=\"10\" x2=\"82\" y2=\"250\"/><line x1=\"106\" y1=\"10\" x2=\"106\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"154\" y1=\"10\" x2=\"154\" y2=\"250\"/><line x1=\"178\" y1=\"10\" x2=\"178\" y2=\"250\"/><line x1=\"202\" y1=\"10\" x2=\"202\" y2=\"250\"/><line x1=\"226\" y1=\"10\" x2=\"226\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"226\" x2=\"250\" y2=\"226\"/><line x1=\"10\" y1=\"202\" x2=\"250\" y2=\"202\"/><line x1=\"10\" y1=\"178\" x2=\"250\" y2=\"178\"/><line x1=\"10\" y1=\"154\" x2=\"250\" y2=\"154\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"106\" x2=\"250\" y2=\"106\"/><line x1=\"10\" y1=\"82\" x2=\"250\" y2=\"82\"/><line x1=\"10\" y1=\"58\" x2=\"250\" y2=\"58\"/><line x1=\"10\" y1=\"34\" x2=\"250\" y2=\"34\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"6\" y1=\"154\" x2=\"254\" y2=\"154\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"82\" y1=\"6\" x2=\"82\" y2=\"254\" stroke=\"currentColor\" stroke-width=\" 67.62,191.39 170.00,189.87 172.32,188.25 174.57,186.54 176.76,184.75 178.87,182.87 180.91,180.91 182.87,178.87 184.75,176.76 186.54,174.57 188.25,172.32 189.87,170.00 191.39,167.62 192.82,165.18 194.15,162.69 195.39,160.14 196.52,157.55 197.55,154.92 198.48,152.25 199.30,149.54 200.01,146.81 200.62,144.05 201.11,141.26 201.50,138.46 201.78,135.65 201.94,132.83 202.00,130.00\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"130\" cy=\"130\" r=\"3\"/><circle cx=\"202\" cy=\"130\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"34\" y=\"167\" text-anchor=\"middle\">−2<\/text><text x=\"130\" y=\"167\" text-anchor=\"middle\">2<\/text><text x=\"178\" y=\"167\" text-anchor=\"middle\">4<\/text><text x=\"226\" y=\"167\" text-anchor=\"middle\">6<\/text><text x=\"78\" y=\"206\" text-anchor=\"end\">−2<\/text><text x=\"78\" y=\"110\" text-anchor=\"end\">2<\/text><text x=\"78\" y=\"62\" text-anchor=\"end\">4<\/text><text x=\"246\" y=\"148\" font-style=\"italic\">x<\/text><text x=\"88\" y=\"16\" font-style=\"italic\">y<\/text><text x=\"126\" y=\"144\" text-anchor=\"end\">C(2, 1)<\/text><text x=\"207\" y=\"124\" text-anchor=\"start\">(5, 1)<\/text><\/g><\/svg>"}, {"lo": "LO1", "h": "Reading the center and the radius", "html": "<p>In standard form, each squared group has a <b>minus<\/b> sign inside it. So when an equation shows a plus sign, that coordinate of the center is negative: (<i>x<\/i> + 3)<sup>2<\/sup> is (<i>x<\/i> − (−3))<sup>2<\/sup>, so <i>h<\/i> = −3. A plain <i>x<\/i><sup>2<\/sup> means <i>h<\/i> = 0, and a plain <i>y<\/i><sup>2<\/sup> means <i>k<\/i> = 0.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Equation<\/th><th>Center<\/th><th>Radius<\/th><\/tr><tr><td>(<i>x<\/i> − 4)<sup>2<\/sup> + (<i>y<\/i> + 1)<sup>2<\/sup> = 9<\/td><td>(4, −1)<\/td><td>3<\/td><\/tr><tr><td><i>x<\/i><sup>2<\/sup> + (<i>y<\/i> − 5)<sup>2<\/sup> = 7<\/td><td>(0, 5)<\/td><td>√7<\/td><\/tr><tr><td>(<i>x<\/i> + 2)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 0.25<\/td><td>(−2, 0)<\/td><td>0.5<\/td><\/tr><tr><td>(<i>x<\/i> + 6)<sup>2<\/sup> + (<i>y<\/i> + 6)<sup>2<\/sup> = 12<\/td><td>(−6, −6)<\/td><td>2√3<\/td><\/tr><\/table><\/div><div class=\"rule\">Flip the sign of each number inside the parentheses to read the center. Take the square root of the right side to get the radius.<\/div><div class=\"tip\">DSAT tip: the right side is <i>r<\/i><sup>2<\/sup>, not <i>r<\/i>. A wrong answer choice often uses 9 as the radius of a circle whose equation ends in = 9. If a question asks for the diameter, double the radius.<\/div>"}, {"lo": "LO2", "h": "Writing the equation from the center", "html": "<p>To write the equation of a circle, substitute the center for (<i>h<\/i>, <i>k<\/i>) and the <b>square<\/b> of the radius for <i>r<\/i><sup>2<\/sup>. A circle with center (−1, 3) and radius 4 has equation (<i>x<\/i> + 1)<sup>2<\/sup> + (<i>y<\/i> − 3)<sup>2<\/sup> = 16.<\/p><p>If you know the center and one point on the circle, the radius is the distance between them. You only need <i>r<\/i><sup>2<\/sup>, so you can skip the square root:<\/p><div class=\"eqs\">center (1, −2), point (4, 2)<br><i>r<\/i><sup>2<\/sup> = (4 − 1)<sup>2<\/sup> + (2 − (−2))<sup>2<\/sup> = 9 + 16 = 25<br>(<i>x<\/i> − 1)<sup>2<\/sup> + (<i>y<\/i> + 2)<sup>2<\/sup> = 25<\/div><div class=\"rule\">Center and a point: <i>r<\/i><sup>2<\/sup> = (difference in <i>x<\/i>)<sup>2<\/sup> + (difference in <i>y<\/i>)<sup>2<\/sup>.<\/div><p>A circle centered at the origin has the simplest form, <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = <i>r<\/i><sup>2<\/sup>.<\/p>"}, {"lo": "LO2", "h": "Reading the equation from a graph", "html": "<p>When a circle is drawn on a grid, find the center first. It is halfway between the leftmost and rightmost points of the circle, and halfway between the highest and lowest points. Then count grid units from the center straight across, or straight up, to the circle: that count is the radius.<\/p><ul><li>Leftmost (−5, 1) and rightmost (1, 1) give a center with <i>x<\/i> = −2.<\/li><li>Highest (−2, 4) and lowest (−2, −2) give a center with <i>y<\/i> = 1.<\/li><li>From (−2, 1) to (1, 1) is 3 units, so <i>r<\/i> = 3 and the equation is (<i>x<\/i> + 2)<sup>2<\/sup> + (<i>y<\/i> − 1)<sup>2<\/sup> = 9.<\/li><\/ul><div class=\"rule\">On a graph: center from the extreme points, radius by counting, then square the radius.<\/div><div class=\"tip\">Desmos tip: type the equation you chose exactly as written. If its graph lies on top of the circle in the question and passes through every labeled point, your choice is right.<\/div>"}, {"lo": "LO3", "h": "Endpoints of a diameter", "html": "<p>A diameter passes through the center, and the center cuts it into two radii. So when you are given the endpoints of a diameter:<\/p><ul><li>the <b>center<\/b> is the midpoint of the endpoints;<\/li><li>the <b>radius<\/b> is half the length of the diameter, or the distance from the center to either endpoint.<\/li><\/ul><div class=\"rule\">Center = (<span class=\"fq\"><span><i>x<\/i><sub>1<\/sub> + <i>x<\/i><sub>2<\/sub><\/span><span>2<\/span><\/span>, <span class=\"fq\"><span><i>y<\/i><sub>1<\/sub> + <i>y<\/i><sub>2<\/sub><\/span><span>2<\/span><\/span>). Radius = half of the diameter.<\/div><div class=\"eqs\">A(−2, −1), B(4, 7)<br>center: (<span class=\"fq\"><span>−2 + 4<\/span><span>2<\/span><\/span>, <span class=\"fq\"><span>−1 + 7<\/span><span>2<\/span><\/span>) = (1, 3)<br><i>r<\/i><sup>2<\/sup> = (4 − 1)<sup>2<\/sup> + (7 − 3)<sup>2<\/sup> = 25<br>(<i>x<\/i> − 1)<sup>2<\/sup> + (<i>y<\/i> − 3)<sup>2<\/sup> = 25<\/div><div class=\"tip\">DSAT tip: the distance between the endpoints is the diameter. Using it as the radius gives an <i>r<\/i><sup>2<\/sup> that is four times too large, and that wrong value is usually one of the answer choices.<\/div><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Circle in the xy-plane with a dashed diameter from A(−2, −1) to B(4, 7). Its midpoint M(1, 3) is the center, and the radius is 5.\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"6\" y1=\"190\" x2=\"254\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"110\" y1=\"6\" x2=\"110\" y2=\"254\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"70\" y1=\"210\" x2=\"190\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-fit\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" points=\"230.00,130.00 229.92,126.07 229.69,122.15 229.31,118.25 228.77,114.36 228.08,110.49 227.24,106.66 226.25,102.86 225.11,99.10 223.82,95.39 2 g-pts\" fill=\"currentColor\"><circle cx=\"70\" cy=\"210\" r=\"3\"/><circle cx=\"190\" cy=\"50\" r=\"3\"/><circle cx=\"130\" cy=\"130\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"30\" y=\"203\" text-anchor=\"middle\">−4<\/text><text x=\"70\" y=\"185\" text-anchor=\"middle\">−2<\/text><text x=\"150\" y=\"203\" text-anchor=\"middle\">2<\/text><text x=\"190\" y=\"185\" text-anchor=\"middle\">4<\/text><text x=\"230\" y=\"203\" text-anchor=\"middle\">6<\/text><text x=\"106\" y=\"154\" text-anchor=\"end\">2<\/text><text x=\"106\" y=\"114\" text-anchor=\"end\">4<\/text><text x=\"106\" y=\"74\" text-anchor=\"end\">6<\/text><text x=\"246\" y=\"184\" font-style=\"italic\">x<\/text><text x=\"116\" y=\"16\" font-style=\"italic\">y<\/text><text x=\"74\" y=\"208\" text-anchor=\"start\">A(−2, −1)<\/text><text x=\"196\" y=\"46\" text-anchor=\"start\">B(4, 7)<\/text><text x=\"136\" y=\"134\" text-anchor=\"start\">M(1, 3)<\/text><\/g><\/svg>"}, {"lo": "LO4", "h": "Completing the square", "html": "<p>Sometimes the equation of a circle is given in expanded (general) form, such as <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> − 6<i>x<\/i> + 4<i>y<\/i> − 12 = 0. To find the center and the radius, rebuild the perfect squares.<\/p><ul><li>Group the <i>x<\/i>-terms and the <i>y<\/i>-terms, and move the constant to the right side.<\/li><li>Take half of the <i>x<\/i>-coefficient, square it, and add it to <b>both<\/b> sides. Do the same for <i>y<\/i>.<\/li><li>Factor each group as a perfect square.<\/li><\/ul><div class=\"eqs\"><i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + <i>y<\/i><sup>2<\/sup> + 4<i>y<\/i> = 12<br>(<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 9) + (<i>y<\/i><sup>2<\/sup> + 4<i>y<\/i> + 4) = 12 + 9 + 4<br>(<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> + 2)<sup>2<\/sup> = 25<\/div><p>The center is (3, −2) and the radius is 5.<\/p><div class=\"rule\">Whatever you add inside the parentheses to complete a square, add to the right side too.<\/div>"}, {"lo": "LO4", "h": "Leading coefficients and a shortcut", "html": "<p>Completing the square works only when <i>x<\/i><sup>2<\/sup> and <i>y<\/i><sup>2<\/sup> each have coefficient 1. If both have the same other coefficient, divide every term by it first:<\/p><div class=\"eqs\">2<i>x<\/i><sup>2<\/sup> + 2<i>y<\/i><sup>2<\/sup> + 8<i>x<\/i> − 4<i>y<\/i> = 22<br><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + 4<i>x<\/i> − 2<i>y<\/i> = 11<br>(<i>x<\/i> + 2)<sup>2<\/sup> + (<i>y<\/i> − 1)<sup>2<\/sup> = 16<\/div><p>For <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + <i>D<\/i><i>x<\/i> + <i>E<\/i><i>y<\/i> + <i>F<\/i> = 0, the center is always half of each coefficient with the sign flipped: (−<span class=\"fq\"><span><i>D<\/i><\/span><span>2<\/span><\/span>, −<span class=\"fq\"><span><i>E<\/i><\/span><span>2<\/span><\/span>). In the last example, <i>D<\/i> = 4 and <i>E<\/i> = −2, so the center is (−2, 1).<\/p><div class=\"rule\">The right side after completing the square is <i>r<\/i><sup>2<\/sup>. It must be positive for the graph to be a circle.<\/div><div class=\"tip\">Desmos tip: you can type the expanded equation directly into Desmos and read the center and radius from the graph, then confirm with your algebra.<\/div>"}, {"lo": "LO5", "h": "Inside, on or outside", "html": "<p>To place a point relative to a circle, substitute the point into the left side of the standard form. The result is the square of the point's distance from the center. Compare it with <i>r<\/i><sup>2<\/sup>.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + (<i>y<\/i> − <i>k<\/i>)<sup>2<\/sup> is…<\/th><th>The point is…<\/th><\/tr><tr><td>less than <i>r<\/i><sup>2<\/sup><\/td><td>inside the circle<\/td><\/tr><tr><td>equal to <i>r<\/i><sup>2<\/sup><\/td><td>on the circle<\/td><\/tr><tr><td>greater than <i>r<\/i><sup>2<\/sup><\/td><td>outside the circle<\/td><\/tr><\/table><\/div><p>For (<i>x<\/i> − 1)<sup>2<\/sup> + (<i>y<\/i> + 2)<sup>2<\/sup> = 13: P(3, 1) gives 4 + 9 = 13, so P is on the circle; Q(2, 0) gives 1 + 4 = 5, so Q is inside; R(−3, 1) gives 16 + 9 = 25, so R is outside.<\/p><div class=\"rule\">Compare squared distance with <i>r<\/i><sup>2<\/sup>, or distance with <i>r<\/i>. Never compare one with the other.<\/div><div class=\"tip\">DSAT tip: in context questions, phrases such as \"at most\" or \"within\" include the points on the circle itself.<\/div><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Circle in the xy-plane with center (1, −2) and radius √13. Point P(3, 1) is on the circle, point Q(2, 0) is inside it, and point R(−3, 1) is outside it.\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"34\" y1=\"10\" x2=\"34\" y2=\"250\"/><line x1=\"58\" y1=\"10\" x2=\"58\" y2=\"250\"/><line x1=\"82\" y1=\"10\" x2=\"82\" y2=\"250\"/><line x1=\"106\" y1=\"10\" x2=\"106\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"154\" y1=\"10\" x2=\"154\" y2=\"250\"/><line x1=\"178\" y1=\"10\" x2=\"178\" y2=\"250\"/><line x1=\"202\" y1=\"10\" x2=\"202\" y2=\"250\"/><line x1=\"226\" y1=\"10\" x2=\"226\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"226\" x2=\"250\" y2=\"226\"/><line x1=\"10\" y1=\"202\" x2=\"250\" y2=\"202\"/><line x1=\"10\" y1=\"178\" x2=\"250\" y2=\"178\"/><line x1=\"10\" y1=\"154\" x2=\"250\" y2=\"154\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"106\" x2=\"250\" y2=\"106\"/><line x1=\"10\" y1=\"82\" x2=\"250\" y2=\"82\"/><line x1=\"10\" y1=\"58\" x2=\"250\" y2=\"58\"/><line x1=\"10\" y1=\"34\" x2=\"250\" y2=\"34\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"6\" y1=\"82\" x2=\"254\" y2=\"82\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"106\" y1=\"6\" x2=\"106\" y2=\"254\" stroke=\ /i> + <i>y<\/i><sup>2<\/sup> − 4<i>y<\/i> = 12.<br>Add 9 and 4 to both sides: (<i>x<\/i> + 3)<sup>2<\/sup> + (<i>y<\/i> − 2)<sup>2<\/sup> = 25.<br><i>r<\/i> = √25 = 5.<br>Answer: <b>5<\/b>", "hint": "Rewrite the equation in standard form first. Whatever you add to the left side must also be added to the right side."}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + 2<i>x<\/i> − 10<i>y<\/i> + <i>c<\/i> = 0<\/div>In the equation above, <i>c<\/i> is a constant. The graph of the equation in the <i>xy<\/i>-plane is a circle with radius 3. What is the value of <i>c<\/i>?", "ans": ["17"], "sol": "Move <i>c<\/i> and complete both squares: (<i>x<\/i> + 1)<sup>2<\/sup> + (<i>y<\/i> − 5)<sup>2<\/sup> = 1 + 25 − <i>c<\/i> = 26 − <i>c<\/i>.<br>The right side must equal <i>r<\/i><sup>2<\/sup> = 9, so 26 − <i>c<\/i> = 9.<br><i>c<\/i> = 17.<br>Answer: <b>17<\/b>", "hint": "Complete both squares while keeping <i>c<\/i> as an unknown. What must the right side equal for a radius of 3?"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A circle in the <i>xy<\/i>-plane has equation (<i>x<\/i> − 1)<sup>2<\/sup> + (<i>y<\/i> − 2)<sup>2<\/sup> = 25. Which of the following points lies on the circle?", "opts": ["(4, 6)", "(5, 3)", "(2, 7)", "(6, 7)"], "ans": 0, "sol": "Substitute each point into the left side and look for 25.<br>(4, 6): (4 − 1)<sup>2<\/sup> + (6 − 2)<sup>2<\/sup> = 9 + 16 = 25 ✓.<br>The other points give 17, 26 and 50.<br>Answer: <b>(4, 6)<\/b>", "hint": "A point is on the circle exactly when its coordinates make the left side equal to the right side."}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A cell tower is located at (3, −2) on a coordinate map of a district, where each unit represents 1 kilometer. The tower serves every location that is 5 kilometers or less from it. Which of the following locations is NOT served by the tower?", "opts": ["(6, 1)", "(−1, 0)", "(7, 2)", "(3, 3)"], "ans": 2, "sol":  0) to (0, −9), which is 9.<br>With center (0, 0), the equation is <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 9<sup>2<\/sup> = 81.<br>Answer: <b><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 81<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "On a site plan drawn in the <i>xy<\/i>-plane, with each unit representing 1 meter, the two ends of a diameter of a circular helipad are at (−6, 4) and (2, 4). Which of the following equations models the edge of the helipad?", "opts": ["(<i>x<\/i> − 2)<sup>2<\/sup> + (<i>y<\/i> + 4)<sup>2<\/sup> = 16", "(<i>x<\/i> + 2)<sup>2<\/sup> + (<i>y<\/i> − 4)<sup>2<\/sup> = 16", "(<i>x<\/i> + 2)<sup>2<\/sup> + (<i>y<\/i> − 4)<sup>2<\/sup> = 64", "(<i>x<\/i> + 2)<sup>2<\/sup> + (<i>y<\/i> − 4)<sup>2<\/sup> = 4"], "ans": 1, "sol": "The center is the midpoint of the diameter: (<span class=\"fq\"><span>−6 + 2<\/span><span>2<\/span><\/span>, 4) = (−2, 4).<br>Both ends have <i>y<\/i> = 4, so the diameter is 2 − (−6) = 8 meters long, <i>r<\/i> = 4 and <i>r<\/i><sup>2<\/sup> = 16.<br>The equation is (<i>x<\/i> + 2)<sup>2<\/sup> + (<i>y<\/i> − 4)<sup>2<\/sup> = 16.<br>Answer: <b>(<i>x<\/i> + 2)<sup>2<\/sup> + (<i>y<\/i> − 4)<sup>2<\/sup> = 16<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + 8<i>x<\/i> = 9<\/div>Which of the following equations is equivalent to the equation above?", "opts": ["(<i>x<\/i> + 4)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 9", "(<i>x<\/i> − 4)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25", "(<i>x<\/i> + 8)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 73", "(<i>x<\/i> + 4)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25"], "ans": 3, "sol": "Half of 8 is 4, and 4<sup>2<\/sup> = 16. Add 16 to both sides: <i>x<\/i><sup>2<\/sup> + 8<i>x<\/i> + 16 + <i>y<\/i><sup>2<\/sup> = 25.<br>Factor: (<i>x<\/i> + 4)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25.<br>Answer: <b>(<i>x<\/i> + 4)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25<\/b>"}, {"lo": "LO5", "diff":  by 4 and <i>y<\/i> decreases by 3.<br>The other endpoint is the same step past the center: (−1 + 4, −1 − 3) = (3, −4).<br>Answer: <b>(3, −4)<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\">4<i>x<\/i><sup>2<\/sup> + 4<i>y<\/i><sup>2<\/sup> + 16<i>x<\/i> − 8<i>y<\/i> = 5<\/div>The equation above defines a circle in the <i>xy<\/i>-plane. What are the coordinates of the center of the circle?", "opts": ["(2, −1)", "(−2, 1)", "(−8, 4)", "(−4, 2)"], "ans": 1, "sol": "Divide every term by 4: <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + 4<i>x<\/i> − 2<i>y<\/i> = <span class=\"fq\"><span>5<\/span><span>4<\/span><\/span>.<br>Add 4 and 1 to both sides: (<i>x<\/i> + 2)<sup>2<\/sup> + (<i>y<\/i> − 1)<sup>2<\/sup> = <span class=\"fq\"><span>5<\/span><span>4<\/span><\/span> + 5 = <span class=\"fq\"><span>25<\/span><span>4<\/span><\/span>.<br>The center is (−2, 1).<br>Answer: <b>(−2, 1)<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + 12<i>x<\/i> + <i>y<\/i><sup>2<\/sup> − 2<i>y<\/i> = 12<\/div>The graph of the equation above in the <i>xy<\/i>-plane is a circle with center (<i>h<\/i>, <i>k<\/i>). What is the value of <i>h<\/i> + <i>k<\/i>?", "ans": ["-5"], "sol": "Add 36 and 1 to both sides: (<i>x<\/i><sup>2<\/sup> + 12<i>x<\/i> + 36) + (<i>y<\/i><sup>2<\/sup> − 2<i>y<\/i> + 1) = 49.<br>So (<i>x<\/i> + 6)<sup>2<\/sup> + (<i>y<\/i> − 1)<sup>2<\/sup> = 49, and the center is (−6, 1).<br><i>h<\/i> + <i>k<\/i> = −6 + 1 = −5.<br>Answer: <b>−5<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A garden is mapped in the <i>xy<\/i>-plane, with each unit representing 1 meter. A sprinkler at (4, 6) waters every point that is at most 5 meters from it. Which of the following inequalities describes all the points (<i>x<\/i>, <i>y<\/i>) that the sprinkler waters?", "opts": ["(<i>x<\/i> − 4)<sup>2<\/sup> + (<i>y<\/i> − 6)<sup>2<\/sup> ≥ 25", "(<i>x<\/i> + 4)<sup>2<\/sup> + (<i>y<\/i> + 6)<sup>2<\/sup> ≤ 25", "(<i>x<\/i> − 4)<sup>2<\/sup> + (<i>y<\/i> − 6)<sup>2<\/sup> ≤ 25", "(<i>x<\/i> − 4)<sup>2<\/sup> + (<i>y<\/i> − 6)<sup>2<\/sup> ≤ 5"], "ans": 2, "sol": "A point (<i>x<\/i>, <i>y<\/i>) is at most 5 meters from (4, 6) when √((<i>x<\/i> − 4)<sup>2<\/sup> + (<i>y<\/i> − 6)<sup>2<\/sup>) ≤ 5.<br>Squaring both sides gives (<i>x<\/i> − 4)<sup>2<\/sup> + (<i>y<\/i> − 6)<sup>2<\/sup> ≤ 25.<br>Answer: <b>(<i>x<\/i> − 4)<sup>2<\/sup> + (<i>y<\/i> − 6)<sup>2<\/sup> ≤ 25<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which of the following is an equation of a circle in the <i>xy<\/i>-plane that has radius 6 and whose center lies on the <i>y<\/i>-axis?", "opts": ["(<i>x<\/i> + 3)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 36", "<i>x<\/i><sup>2<\/sup> + (<i>y<\/i> + 3)<sup>2<\/sup> = 6", "(<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> − 3)<sup>2<\/sup> = 36", "<i>x<\/i><sup>2<\/sup> + (<i>y<\/i> + 3)<sup>2<\/sup> = 36"], "ans": 3, "sol": "A center on the <i>y<\/i>-axis has <i>x<\/i>-coordinate 0, so the equation contains a plain <i>x<\/i><sup>2<\/sup> term.<br>A radius of 6 means the right side is 36.<br>Only <i>x<\/i><sup>2<\/sup> + (<i>y<\/i> + 3)<sup>2<\/sup> = 36, with center (0, −3), meets both conditions.<br>Answer: <b><i>x<\/i><sup>2<\/sup> + (<i>y<\/i> + 3)<sup>2<\/sup> = 36<\/b>"}, {"lo": "LO5", "diff": "M", "type": "spr", "q": "The point (5, <i>b<\/i>) lies on the circle (<i>x<\/i> − 2)<sup>2<\/sup> + (<i>y<\/i> + 3)<sup>2<\/sup> = 25 in the <i>xy<\/i>-plane, and <i>b<\/i> &gt; 0. What is the value of <i>b<\/i>?", "ans": ["1"], "sol": "Substitute <i>x<\/i> = 5: 9 + (<i>b<\/i> + 3)<sup>2<\/sup> = 25, so (<i>b<\/i> + 3)<sup>2<\/sup> = 16.<br><i>b<\/i> + 3 = 4 or <i>b<\/i> + 3 = −4, so <i>b<\/i> = 1 or <i>b<\/i> = −7.<br>Since <i>b<\/i> &gt; 0, <i>b<\/i> = 1.<br>Answer: <b>1<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "Circle <i>C<\/i> in the <i>xy<\/i>-plane has center (−3, 2) and passes through the center of the circle (<i>x<\/i> − 5)<sup>2<\/sup> + (<i>y<\/i> + 4)<sup>2<\/sup> = 9. Which of the following is an equation of circle <i>C<\/i>?", "opts": ["(<i>x<\/i> + 3)<sup>2<\/sup> + (<i>y<\/i> − 2)<sup>2<\/sup> = 9", "(<i>x<\/i> + 3)<sup>2<\/sup> + (<i>y<\/i> − 2)<sup>2<\/sup> = 100", "(<i>x<\/i> + 3)<sup>2<\/sup> + (<i>y<\/i> − 2)<sup>2<\/sup> = 10", "(<i>x<\/i> − 5)<sup>2<\/sup> + (<i>y<\/i> + 4)<sup>2<\/sup> = 100"], "ans": 1, "sol": "The center of the second circle is (5, −4).<br><i>r<\/i><sup>2<\/sup> = (5 − (−3))<sup>2<\/sup> + (−4 − 2)<sup>2<\/sup> = 64 + 36 = 100.<br>So circle <i>C<\/i> is (<i>x<\/i> + 3)<sup>2<\/sup> + (<i>y<\/i> − 2)<sup>2<\/sup> = 100.<br>Answer: <b>(<i>x<\/i> + 3)<sup>2<\/sup> + (<i>y<\/i> − 2)<sup>2<\/sup> = 100<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "In the <i>xy<\/i>-plane, the points A(1, −2) and B(7, 6) are the endpoints of a diameter of a circle. The equation of the circle can be written as (<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + (<i>y<\/i> − <i>k<\/i>)<sup>2<\/sup> = <i>r<\/i><sup>2<\/sup>, where <i>h<\/i>, <i>k<\/i> and <i>r<\/i> are positive constants. What is the value of <i>h<\/i> + <i>k<\/i> + <i>r<\/i>?", "ans": ["11"], "sol": "The center is the midpoint: (<span class=\"fq\"><span>1 + 7<\/span><span>2<\/span><\/span>, <span class=\"fq\"><span>−2 + 6<\/span><span>2<\/span><\/span>) = (4, 2).<br>AB = √(6<sup>2<\/sup> + 8<sup>2<\/sup>) = 10, so <i>r<\/i> = 5.<br><i>h<\/i> + <i>k<\/i> + <i>r<\/i> = 4 + 2 + 5 = 11.<br>Answer: <b>11<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> − 5<i>x<\/i> + 3<i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><\/div>The graph of the equation above in the <i>xy<\/i>-plane is a circle. What are the coordinates of the center of the circle?", "opts": ["(<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>, −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>)", "(−<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>, <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>)", "(5, −3)", "(−5, 3)"], "ans": 0, "sol": "Half of −5 is −<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>, and half of 3 is <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>.<br>Completing the squares gives (<i>x<\/i> − <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>)<sup>2<\/sup> + (<i>y<\/i> + <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>)<sup>2<\/sup> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> + <span class=\"fq\"><span>25<\/span><span>4<\/span><\/span> + <span class=\"fq\"><span>9<\/span><span>4<\/span><\/span> = 10.<br>The center is (<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>, −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>).<br>Answer: <b>(<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>, −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>)<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "In the <i>xy<\/i>-plane, the point (<i>k<\/i>, 8) lies inside the circle (<i>x<\/i> + 1)<sup>2<\/sup> + (<i>y<\/i> − 3)<sup>2<\/sup> = 26, where <i>k<\/i> is a constant. Which of the following could be the value of <i>k<\/i>?", "opts": ["−2", "−1", "0", "1"], "ans": 1, "sol": "Inside means (<i>k<\/i> + 1)<sup>2<\/sup> + (8 − 3)<sup>2<\/sup> &lt; 26, so (<i>k<\/i> + 1)<sup>2<\/sup> &lt; 1.<br>Then −1 &lt; <i>k<\/i> + 1 &lt; 1, so −2 &lt; <i>k<\/i> &lt; 0.<br>Only −1 lies in this interval; <i>k<\/i> = −2 and <i>k<\/i> = 0 put the point on the circle, and <i>k<\/i> = 1 puts it outside.<br>Answer: <b>−1<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "An engineer models the rim of a Ferris wheel in the <i>xy<\/i>-plane with the equation <i>x<\/i><sup>2<\/sup> + (<i>y<\/i> − 26)<sup>2<\/sup> = 576, where the <i>x<\/i>-axis represents the ground and each unit represents 1 meter. What is the greatest height above the ground, in meters, reached by a point on the rim?", "opts": ["2", "26", "50", "602"], "ans": 2, "sol": "The center is (0, 26) and <i>r<\/i> = √576 = 24.<br>The highest point of the rim is directly above the center: 26 + 24 = 50.<br>Answer: <b>50<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "A stone dropped into a pond makes a circular ripple. In a model drawn in the <i>xy<\/i>-plane, with each unit representing 1 centimeter, the edge of the ripple is (<i>x<\/i> − 2)<sup>2<\/sup> + (<i>y<\/i> + 1)<sup>2<\/sup> = 16 at one moment and (<i>x<\/i> − 2)<sup>2<\/sup> + (<i>y<\/i> + 1)<sup>2<\/sup> = 36 a moment later. Which statement about the two ripple edges is true?", "opts": ["They have the same center, and the radius of the second edge is 2 centimeters greater than the radius of the first.", "They have the same center, and the radius of the second edge is 20 centimeters greater than the radius of the first.", "They have different centers and the same radius.", "They have the same center, and the radius of the second edge is <span class=\"fq\"><span>9<\/span><span>4<\/span><\/span> times the radius of the first."], "ans": 0, "sol": "Both equations have center (2, −1).<br>The radii are √16 = 4 and √36 = 6, so the second radius is 6 − 4 = 2 centimeters greater.<br>Answer: <b>They have the same center, and the radius of the second edge is 2 centimeters greater than the radius of the first.<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A circle in the <i>xy<\/i>-plane has equation (<i>x<\/i> − 3)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 49. Which of the following lines passes through the center of the circle?", "opts": ["<i>y<\/i> = <i>x<\/i> + 3", "<i>y<\/i> = <i>x<\/i> − 3", "<i>y<\/i> = 3", "<i>x<\/i> = −3"], "ans": 1, "sol": "The center is (3, 0).<br>For <i>y<\/i> = <i>x<\/i> − 3: 3 − 3 = 0 ✓. The lines <i>y<\/i> = <i>x<\/i> + 3 and <i>x<\/i> = −3 pass through (−3, 0) instead, and <i>y<\/i> = 3 has no point with <i>y<\/i> = 0.<br>Answer: <b><i>y<\/i> = <i>x<\/i> − 3<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "On a plan of a city park drawn in the <i>xy<\/i>-plane, with each unit representing 1 meter, a straight path crosses a circular lawn along a diameter, from (10, 40) to (70, 120). The edge of the lawn can be modeled by (<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + (<i>y<\/i> − <i>k<\/i>)<sup>2<\/sup> = <i>c<\/i>, where <i>h<\/i>, <i>k<\/i> and <i>c<\/i> are constants. What is the value of <i>c<\/i>?", "ans": ["2500"], "sol": "The diameter is √((70 − 10)<sup>2<\/sup> + (120 − 40)<sup>2<\/sup>) = √(3600 + 6400) = 100 meters.<br>The radius is 50, so <i>c<\/i> = <i>r<\/i><sup>2<\/sup> = 2500.<br>Answer: <b>2500<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 10<i>y<\/i><\/div>Which of the following describes the graph of the equation above in the <i>xy<\/i>-plane?", "opts": ["A circle with center (0, −5) and radius 5", "A circle with center (0, 5) and radius 10", "A circle with center (0, 10) and radius 10", "A circle with center (0, 5) and radius 5"], "ans": 3, "sol": "Subtract 10<i>y<\/i> from both sides: <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> − 10<i>y<\/i> = 0.<br>Add 25 to both sides: <i>x<\/i><sup>2<\/sup> + (<i>y<\/i> − 5)<sup>2<\/sup> = 25.<br>The center is (0, 5) and the radius is 5.<br>Answer: <b>A circle with center (0, 5) and radius 5<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A circular flower bed on a garden plan is modeled by (<i>x<\/i> − 1)<sup>2<\/sup> + (<i>y<\/i> − 3)<sup>2<\/sup> = 10, where each unit represents 1 meter. Seedling P is planted at (4, 2), and seedling Q is planted at (−1, 5). Which statement is true?", "opts": ["P is on the edge of the bed, and Q is outside the bed.", "P is on the edge of the bed, and Q is inside the bed.", "P is inside the bed, and Q is on the edge of the bed.", "Both seedlings are on the edge of the bed."], "ans": 1, "sol": "P: (4 − 1)<sup>2<\/sup> + (2 − 3)<sup>2<\/sup> = 9 + 1 = 10, which equals 10, so P is on the edge.<br>Q: (−1 − 1)<sup>2<\/sup> + (5 − lane, the points (−7, 3) and (1, −3) are the endpoints of a diameter of a circle. Which of the following points also lies on the circle?", "opts": ["(−3, 10)", "(−4, 3)", "(2, 3)", "(0, 4)"], "ans": 3, "sol": "The center is the midpoint, (−3, 0), and <i>r<\/i><sup>2<\/sup> = (1 − (−3))<sup>2<\/sup> + (−3 − 0)<sup>2<\/sup> = 16 + 9 = 25.<br>So the circle is (<i>x<\/i> + 3)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25.<br>(0, 4) gives 9 + 16 = 25 ✓. The other points give 100, 10 and 34.<br>Answer: <b>(0, 4)<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Which of the following equations represents the circle in the <i>xy<\/i>-plane with the greatest radius?", "opts": ["<i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> − 4<i>x<\/i> = 12", "<i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + 8<i>x<\/i> − 6<i>y<\/i> = 0", "<i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> − 2<i>x<\/i> + 2<i>y<\/i> = 30", "<i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + 10<i>y<\/i> = −9"], "ans": 2, "sol": "Completing the square gives <i>r<\/i><sup>2<\/sup> = 12 + 4 = 16, <i>r<\/i><sup>2<\/sup> = 16 + 9 = 25, <i>r<\/i><sup>2<\/sup> = 30 + 1 + 1 = 32 and <i>r<\/i><sup>2<\/sup> = −9 + 25 = 16.<br>The greatest value of <i>r<\/i><sup>2<\/sup> is 32, so that circle has the greatest radius.<br>Answer: <b><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> − 2<i>x<\/i> + 2<i>y<\/i> = 30<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + 10<i>x<\/i> − 24<i>y<\/i> = 0<\/div>The graph of the equation above in the <i>xy<\/i>-plane is a circle that passes through the origin, O. Point Q lies on the circle, and segment OQ is a diameter of the circle. What are the coordinates of Q?", "opts": ["(−10, 24)", "(−5, 12)", "(10, −24)", "(5, −12)"], "ans": 0, "sol": "Complete the squares: (<i>x<\/i> + 5)<sup>2<\/sup> + (<i>y<\/i> − 12)<sup>2<\/sup> = 169, so the center is (−5, 12).<br>The center is the midpoint of OQ, so Q = (2(−5), 2(12)) = (−10, 24).<br>Answer: <b>(−10, 24)<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A weather station is at (−20, 15) on a coordinate map, where each unit represents 1 kilometer. The station detects any drone that is 25 kilometers or less from it. A drone flies along the <i>x<\/i>-axis. For which <i>x<\/i>-coordinates is the drone detected?", "opts": ["−45 ≤ <i>x<\/i> ≤ 5", "−40 ≤ <i>x<\/i> ≤ 0", "0 ≤ <i>x<\/i> ≤ 40", "−30 ≤ <i>x<\/i> ≤ −10"], "ans": 1, "sol": "On the <i>x<\/i>-axis <i>y<\/i> = 0, so the drone is detected when (<i>x<\/i> + 20)<sup>2<\/sup> + (0 − 15)<sup>2<\/sup> ≤ 625.<br>(<i>x<\/i> + 20)<sup>2<\/sup> ≤ 400, so −20 ≤ <i>x<\/i> + 20 ≤ 20.<br>−40 ≤ <i>x<\/i> ≤ 0.<br>Answer: <b>−40 ≤ <i>x<\/i> ≤ 0<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "In the <i>xy<\/i>-plane, how many points of the form (12, <i>k<\/i>), where <i>k<\/i> is an integer, lie inside or on the circle <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 169?", "ans": ["11"], "sol": "Inside or on means 144 + <i>k<\/i><sup>2<\/sup> ≤ 169, so <i>k<\/i><sup>2<\/sup> ≤ 25.<br>The integers with <i>k<\/i><sup>2<\/sup> ≤ 25 are −5, −4, …, 4, 5.<br>That is 11 values.<br>Answer: <b>11<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "An engineer models the circular cross section of a tunnel in the <i>xy<\/i>-plane, with each unit representing 1 meter. The flat floor of the tunnel lies along the <i>x<\/i>-axis and meets the circle at (−1, 0) and (7, 0). The circle has a radius of 5 meters, and its center is above the floor. Which of the following is an equation of the circle?", "opts": ["(<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> − 3)<sup>2<\/sup> = 25", "(<i>x<\/i> − 3)<sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> = 25", "(<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> + 3)<sup>2<\/sup> = 25", "(<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> − 4)<sup>2<\/sup> = 25"], "ans": 0, "sol": "The center is equally far from (−1, 0) and (7, 0), so its <i>x<\/i>-coordinate is 3. Call the center (3, <i>k<\/i>) with <i>k<\/i> &gt; 0.<br>(−1 − 3)<sup>2<\/sup> + (0 − <i>k<\/i>)<sup>2<\/sup> = 25, so 16 + <i>k<\/i><sup>2<\/sup> = 25 and <i>k<\/i> = 3.<br>The equation is (<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> − 3)<sup>2<\/sup> = 25.<br>Answer: <b>(<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> − 3)<sup>2<\/sup> = 25<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "In the <i>xy<\/i>-plane, the points (−1, 2) and (5, 10) are the endpoints of a diameter of a circle. An equation of the circle can be written as <i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + <i>D<\/i><i>x<\/i> + <i>E<\/i><i>y<\/i> + <i>F<\/i> = 0, where <i>D<\/i>, <i>E<\/i> and <i>F<\/i> are constants. What is the value of <i>F<\/i>?", "ans": ["15"], "sol": "The center is the midpoint, (2, 6), and <i>r<\/i><sup>2<\/sup> = (5 − 2)<sup>2<\/sup> + (10 − 6)<sup>2<\/sup> = 25.<br>So (<i>x<\/i> − 2)<sup>2<\/sup> + (<i>y<\/i> − 6)<sup>2<\/sup> = 25.<br>Expand: <i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 4 + <i>y<\/i><sup>2<\/sup> − 12<i>y<\/i> + 36 − 25 = 0, so <i>F<\/i> = 4 + 36 − 25 = 15.<br>Answer: <b>15<\/b>"}, {"lo": "LO4", "diff": "X", "type": "spr", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> + 4<i>x<\/i> − 10<i>y<\/i> = <i>k<\/i><\/div>In the equation above, <i>k<\/i> is a constant. The graph of the equation in the <i>xy<\/i>-plane is a circle that passes through the point (1, 1). What is the radius of the circle?", "ans": ["5"], "sol": "Substitute (1, 1): 1 + 1 + 4 − 10 = <i>k<\/i>, so <i>k<\/i> = −4.<br>Complete the squares: (<i>x<\/i> + 2)<sup>2<\/sup> + (<i>y<\/i> − 5)<sup>2<\/sup> = −4 + 4 + 25 = 25.<br><i>r<\/i> = √25 = 5.<br>Answer: <b>5<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "A circle in the <i>xy<\/i>-plane is tangent to both the <i>x<\/i>-axis and the <i>y<\/i>-axis, its center is in Quadrant I, and it passes through the point (2, 1). Which of the following could be an equation of the circle?", "opts": ["(<i>x<\/i> − 2)<sup>2<\/sup> + (<i>y<\/i> − 2)<sup>2<\/sup> = 4", "(<i>x<\/i> − 5)<sup>2<\/sup> + (<i>y<\/i> − 5)<sup>2<\/sup> = 25", "(<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> − 3)<sup>2<\/sup> = 9", "(<i>x<\/i> − 5)<sup>2<\/sup> + (<i>y<\/i> − 5)<sup>2<\/sup> = 5"], "ans": 1, "sol": "Tangent to both axes with center in Quadrant I means the center is (<i>r<\/i>, <i>r<\/i>).<br>(2 − <i>r<\/i>)<sup>2<\/sup> + (1 − <i>r<\/i>)<sup>2<\/sup> = <i>r<\/i><sup>2<\/sup> simplifies to <i>r<\/i><sup>2<\/sup> − 6<i>r<\/i> + 5 = 0, so <i>r<\/i> = 1 or <i>r<\/i> = 5.<br>With <i>r<\/i> = 5 the equation is (<i>x<\/i> − 5)<sup>2<\/sup> + (<i>y<\/i> − 5)<sup>2<\/sup> = 25.<br>Answer: <b>(<i>x<\/i> − 5)<sup>2<\/sup> + (<i>y<\/i> − 5)<sup>2<\/sup> = 25<\/b>"}, {"lo": "LO5", "diff": "X", "type": "spr", "q": "In the <i>xy<\/i>-plane, the point (<i>k<\/i>, <i>k<\/i>) lies inside the circle (<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> + 1)<sup>2<\/sup> = 50, where <i>k<\/i> is an integer. What is the greatest possible value of <i>k<\/i>?", "ans": ["5"], "sol": "Inside means (<i>k<\/i> − 3)<sup>2<\/sup> + (<i>k<\/i> + 1)<sup>2<\/sup> &lt; 50, which simplifies to 2<i>k<\/i><sup>2<\/sup> − 4<i>k<\/i> + 10 &lt; 50, or <i>k<\/i><sup>2<\/sup> − 2<i>k<\/i> − 20 &lt; 0.<br><i>k<\/i> = 5 gives 25 − 10 − 20 = −5 &lt; 0 ✓; <i>k<\/i> = 6 gives 36 − 12 − 20 = 4, which is not less than 0.<br>The greatest integer is 5.<br>Answer: <b>5<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>y<\/i><sup>2<\/sup> − 6<i>x<\/i> + 4<i>y<\/i> = <i>c<\/i><\/div>In the equation above, <i>c<\/i> is a constant. For which values of <i>c<\/i> is the graph of the equation in the <i>xy<\/i>-plane a circle?", "opts": ["<i>c<\/i> &gt; 13", "<i>c<\/i> &gt; 0", "<i>c<\/i> &gt; −13", "<i>c<\/i> &lt; 13"], "ans": 2, "sol": "Complete the squares: (<i>x<\/i> − 3)<sup>2<\/sup> + (<i>y<\/i> + 2)<sup>2<\/sup> = <i>c<\/i> + 13.<br>A circle needs a positive radius, so <i>c<\/i> + 13 &gt; 0.<br><i>c<\/i> &gt; −13.<br>Answer: <b><i>c<\/i> &gt; −13<\/b>"}], "unit_no": 4, "topic_no": "3", "code": "3.4"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  if(cur<LOS.length){
    var L=LOS[cur];
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Learning sheet '+(cur+1)+' of '+LOS.length+' · Objective '+(cur+1)+'</div><h2>'+L.text+'</h2>';
    h+='<div class="concept">'+byLo(S.notes,L.id).map(function(n){ return '<h3 class="note-h">'+n.h+'</h3>'+n.html; }).join('')+'</div>';
    byLo(S.examples,L.id).forEach(function(E,ei){
      h+='<div class="ex"><h3>Worked example '+(ei+1)+'</h3><div class="ex-q">'+E.q+'</div><ol class="steps">'+E.steps.map(function(s){ return '<li hidden>'+s+'</li>'; }).join('')+'</ol><div class="ans" hidden>Answer: '+E.ans+'</div><div class="ex-ctrl"><button class="btn" data-next>Show first step</button><button class="btn" data-all>Show full solution</button></div></div>';
    });
    var G=byLo(S.guided,L.id);
    if(G.length) h+='<h3 class="note-h">Guided practice</h3>';
    G.forEach(function(q,qi){
      var gi=S.guided.indexOf(q);
      h+='<div class="try" data-g="'+gi+'"><h3>Question '+(qi+1)+' of '+G.length+' <span class="pill '+q.diff+'" style="margin-left:6px">'+DIFF[q.diff]+'</span></h3>'+qBody(q,null,'g-'+gi)+'<div class="ex-ctrl">'+(q.hint?'<button class="btn" data-hint>Show hint</button>':'')+'<button class="btn btn-primary" data-check>Check answer</button></div><div class="hint" hidden>'+(q.hint||'')+'</div><div class="fbk"></div></div>';
    });
    h+='<label class="donebox"><input type="checkbox" id="done-'+esc(L.id)+'" data-done="'+esc(L.id)+'"'+(ST.done[L.id]?' checked':'')+'> I can do this objective</label>';
    h+='<div class="qnav"><button class="btn" data-go="'+(cur-1)+'"'+(cur===0?' disabled':'')+'>Previous sheet</button><button class="btn btn-primary" data-go="'+(cur+1)+'">'+(cur===LOS.length-1?'Go to recap':'Next sheet')+'</button></div></section>';
  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
