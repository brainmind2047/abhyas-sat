<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,

  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}

  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}

  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}

  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  .kpi b{font-family:var(--f-display); font-size:24px;}

  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}

  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

var S = {"id": "PSDA-1.1", "unit": "Problem-Solving and Data Analysis", "topic": "Ratios, rates and percentages", "title": "Ratios, rates and proportions", "intro": "A ratio compares two quantities, a rate compares quantities measured in different units, and a proportion states that two ratios are equal. On the Digital SAT these ideas appear in short word problems about recipes, maps, prices and speeds, and in questions that describe a proportional relationship <i>y<\/i> = <i>k<\/i><i>x<\/i> with a table, a graph or an equation.", "los": [{"id": "LO1", "text": "Write and simplify part-to-part and part-to-whole ratios, and use a ratio to find the size of each part."}, {"id": "LO2", "text": "Set up and solve proportions, including ratio tables, scale drawings and maps."}, {"id": "LO3", "text": "Calculate unit rates and use them to compare rates, such as best buys and speeds, and to solve rate problems."}, {"id": "LO4", "text": "Identify proportional relationships <i>y<\/i> = <i>k<\/i><i>x<\/i> from tables, graphs, equations and descriptions, and interpret the constant <i>k<\/i>."}, {"id": "LO5", "text": "Solve problems in which a ratio changes after quantities are added, removed or moved."}], "notes": [{"lo": "LO1", "h": "Writing and simplifying ratios", "html": "<p>A <b>ratio<\/b> compares quantities of the same kind. The ratio of 12 girls to 18 boys can be written 12 to 18, 12:18 or <span class=\"fq\"><span>12<\/span><span>18<\/span><\/span>. Like a fraction, a ratio is simplified by dividing every term by the greatest common factor, so 12:18 = 2:3.<\/p><div class=\"rule\">Order matters. \"Girls to boys\" is 2:3, but \"boys to girls\" is 3:2. Write the terms in the order the words give them.<\/div><p>Before simplifying, make sure both quantities are in the same unit. The ratio of 45 minutes to 2 hours is 45:120, which simplifies to 3:8, not 45:2.<\/p><ul><li>Ratios with decimals or fractions can be scaled to whole numbers: 1.5:2 = 3:4 (multiply by 2), and <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>:<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> = 3:2 (multiply by 6).<\/li><li>A three-part ratio such as 2:3:5 compares three quantities at once, and all three terms are scaled by the same number.<\/li><\/ul><div class=\"tip\">DSAT tip: a ratio gives relative sizes, not actual amounts. A club with a 2:3 ratio could have 2 and 3 members, or 20 and 30.<\/div>"}, {"lo": "LO1", "h": "Part-to-part and part-to-whole", "html": "<p>If two parts are in the ratio <i>a<\/i>:<i>b<\/i>, the whole is <i>a<\/i> + <i>b<\/i> parts. So if juice and water are mixed in the ratio 2:5, juice is <span class=\"fq\"><span>2<\/span><span>7<\/span><\/span> of the mixture and water is <span class=\"fq\"><span>5<\/span><span>7<\/span><\/span> of it.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Mixture 2:5<\/th><th>Part-to-part<\/th><th>Part-to-whole<\/th><\/tr><tr><td>Juice<\/td><td>juice : water = 2:5<\/td><td>juice : total = 2:7<\/td><\/tr><tr><td>Water<\/td><td>water : juice = 5:2<\/td><td>water : total = 5:7<\/td><\/tr><\/table><\/div><div class=\"rule\">To share a total in the ratio <i>a<\/i>:<i>b<\/i>, find one part = total ÷ (<i>a<\/i> + <i>b<\/i>), then multiply one part by each term of the ratio.<\/div><p>For example, to share 84 liters in the ratio 2:5, note that there are 7 parts, so one part is 12 liters and the shares are 24 and 60 liters. The same idea works when you know a difference instead of a total: if <i>a<\/i>:<i>b<\/i> = 3:7 and <i>b<\/i> is 20 more than <i>a<\/i>, then 4 parts = 20, so one part is 5.<\/p>"}, {"lo": "LO2", "h": "Proportions and ratio tables", "html": "<p>A <b>proportion<\/b> is an equation stating that two ratios are equal, such as <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span> = <span class=\"fq\"><span><i>x<\/i><\/span><span>40<\/span><\/span>. To solve it, <b>cross-multiply<\/b>: 3 × 40 = 5<i>x<\/i>, so <i>x<\/i> = 24.<\/p><div class=\"rule\">Keep the same order in both ratios. If the first ratio is cups of flour over cups of sugar, the second must also be flour over sugar.<\/div><p>A <b>ratio table<\/b> lists equivalent ratios. Each column is the first column multiplied by the same number, so you can fill a gap by finding that multiplier.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Cups of rice<\/th><td>2<\/td><td>3<\/td><td>5<\/td><td>8<\/td><\/tr><tr><th>Cups of water<\/th><td>3<\/td><td>4.5<\/td><td>7.5<\/td><td>12<\/td><\/tr><\/table><\/div><p>Here water ÷ rice is always 1.5, so 8 cups of rice need 12 cups of water. Columns can also be added: 2 + 3 cups of rice need 3 + 4.5 cups of water.<\/p><div class=\"tip\">DSAT tip: label each ratio with words before you cross-multiply. Many wrong answer choices come from flipping one of the two ratios.<\/div>"}, {"lo": "LO2", "h": "Scale drawings and maps", "html": "<p>A <b>scale<\/b> is the ratio of a length on a drawing or map to the real length it represents. A scale of 1 centimeter : 25 kilometers means each centimeter on the map stands for 25 kilometers on the ground.<\/p><div class=\"eqs\"><span class=\"fq\"><span>map length<\/span><span>real length<\/span><\/span> = <span class=\"fq\"><span>1 cm<\/span><span>25 km<\/span><\/span><\/div><p>So a road that is 6.4 centimeters long on the map is 6.4 × 25 = 160 kilometers long, and a real distance of 90 kilometers is drawn as 90 ÷ 25 = 3.6 centimeters.<\/p><div class=\"rule\">Multiply by the scale to go from the drawing to real life; divide to go from real life to the drawing. Keep the units written down so you can see which way to go.<\/div><p>A scale written without units, such as 1:50, uses the same unit on both sides: 1 centimeter on the plan is 50 centimeters in reality. Convert to the unit the question asks for at the end.<\/p><div class=\"tip\">DSAT tip: a scale applies to lengths. For an area on a scale drawing, find the real length and the real width first, then multiply them.<\/div>"}, {"lo": "LO3", "h": "Unit rates and comparing rates", "html": "<p>A <b>rate<\/b> compares quantities with different units, such as 150 kilometers in 2 hours. A <b>unit rate<\/b> is the amount for one unit of the second quantity: 150 ÷ 2 = 75 kilometers per hour.<\/p><div class=\"rule\">Unit rate = <span class=\"fq\"><span>first quantity<\/span><span>second quantity<\/span><\/span>. Divide by the quantity that comes after the word \"per.\"<\/div><ul><li><b>Best buy:<\/b> compare the price per unit. A 750-gram bag for $1.80 costs 180 ÷ 750 = 0.24 cent per gram; a 1.2-kilogram bag for $2.76 costs 276 ÷ 1,200 = 0.23 cent per gram, so the larger bag is the better buy.<\/li><li><b>Speed:<\/b> distance = rate × time, so time = distance ÷ rate and rate = distance ÷ time.<\/li><li><b>Scaling up:<\/b> once you know a unit rate, multiply. At 75 kilometers per hour, 5.5 hours covers 75 × 5.5 = 412.5 kilometers.<\/li><\/ul><div class=\"tip\">DSAT tip: the average speed for a whole trip is total distance ÷ total time. It is usually not the average of the speeds for the parts of the trip.<\/div>"}, {"lo": "LO4", "h": "Proportional relationships: <i>y<\/i> = <i>k<\/i><i>x<\/i>", "html": "<p>Two quantities are <b>proportional<\/b> when their ratio never changes. Then <i>y<\/i> = <i>k<\/i><i>x<\/i>, where the <b>constant of proportionality<\/b> <i>k<\/i> = <span class=\"fq\"><span><i>y<\/i><\/span><span><i>x<\/i><\/span><\/span> is the unit rate.<\/p><div class=\"rule\">A relationship is proportional exactly when <i>y<\/i> ÷ <i>x<\/i> is the same for every pair. Its graph is a straight line through the origin.<\/div><svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line through the origin showing earnings in dollars against time worked in hours, passing through the marked points (2, 24) and (5, 60)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"48.00\" y1=\"14\" x2=\"48.00\" y2=\"186\"/><line x1=\"90.67\" y1=\"14\" x2=\"90.67\" y2=\"186\"/><line x1=\"133.33\" y1=\"14\" x2=\"133.33\" y2=\"186\"/><line x1=\"176.00\" y1=\"14\" x2=\"176.00\" y2=\"186\"/><line x1=\"218.67\" y1=\"14\" x2=\"218.67\" y2=\"186\"/><line x1=\"261.33\" y1=\"14\" x2=\"261.33\" y2=\"186\"/><line x1=\"304.00\" y1=\"14\" x2=\"304.00\" y2=\"186\"/><line x1=\"48\" y1=\"186.00\" x2=\"304\" y2=\"186.00\"/><line x1=\"48\" y1=\"161.43\" x2=\"304\" y2=\"161.43\"/><line x1=\"48\" y1=\"136.86\" x2=\"304\" y2=\"136.86\"/><line x1=\"48\" y1=\"112.29\" x2=\"304\" y2=\"112.29\"/><line x1=\"48\" y1=\"87.71\" x2=\"304\" y2=\"87.71\"/><line x1=\"48\" y1=\"63.14\" x2=\"304\" y2=\"63.14\"/><line x1=\"48\" y1=\"38.57\" x2=\"304\" y2=\"38.57\"/><line x1=\"48\" y1=\"14.00\" x2=\"304\" y2=\"14.00\"/><\/g><line class=\"fg-axis\" x1=\"48\" y1=\"186\" x2=\"304\" y2=\"186\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"48\" y1=\"14\" x2=\"48\" y2=\"186\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" points=\"48.00,186.00 51.20,184.16 54.40,182.31 57.60,180.47 60.80,178.63 64.00,176.79 67.20,174.94 70.40,173.10 73.60,171.26 76.80,169.41 80.00,167.57 83.20,165.73 86.40,163.89 89.60,162.04 92.80,160.20 96.00,158.36 99.20,156.51 102.40,154.67 105.60,152.83 108.80,150.99 112.00,149.14 115.20,147.30 118.40,145.46 121.60,143.61 124.80,141.77 128.00,139.93 131.20,138.09 134.40,136.24 137.60,134.40 140.80,132.56 144.00,130.71 147.20,128.87 150.40,127.03 153.60,125.19 156.80,123.34 160.00,121.50 163.20,119.66 166.40,117.81 169.60,115.97 172.80,114.13 176.00,112.29 179.20,110.44 182.40,108.60 185.60,106.76 188.80,104.91 192.00,103.07 195.20,101.23 198.40,99.39 201.60,97.54 204.80,95.70 208.00,93.86 211.20,92.01 214.40,90.17 217.60,88.33 220.80,86.49 224.00,84.64 227.20,82.80 230.40,80.96 233.60,79.11 236.80,77.27 240.00,75.43 243.20,73.59 246.40,71.74 249.60,69.90 252.80,68.06 256.00,66.21 259.20,64.37 262.40,62.53 265.60,60.69 268.80,58.84 272.00,57.00 275.20,55.16 278.40,53.31 281.60,51.47 284.80,49.63 288.00,47.79 291.20,45.94 294.40,44.10 297.60,42.26 300.80,40.41 304.00,38.57\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"133.33\" cy=\"136.86\" r=\"3\"/><circle cx=\"261.33\" cy=\"63.14\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"48.00\" y=\"200\" text-anchor=\"middle\">0<\/text><text x=\"90.67\" y=\"200\" text-anchor=\"middle\">1<\/text><text x=\"133.33\" y=\"200\" text-anchor=\"middle\">2<\/text><text x=\"176.00\" y=\"200\" text-anchor=\"middle\">3<\/text><text x=\"218.67\" y=\"200\" text-anchor=\"middle\">4<\/text><text x=\"261.33\" y=\"200\" text-anchor=\"middle\">5<\/text><text x=\"304.00\" y=\"200\" text-anchor=\"middle\">6<\/text><text x=\"43\" y=\"190.00\" text-anchor=\"end\">0<\/text><text x=\"43\" y=\"165.43\" text-anchor=\"end\">12<\/text><text x=\"43\" y=\"140.86\" text-anchor=\"end\">24<\/text><text x=\"43\" y=\"116.29\" text-anchor=\"end\">36<\/text><text x=\"43\" y=\"91.71\" text-anchor=\"end\">48<\/text><text x=\"43\" y=\"67.14\" text-anchor=\"end\">60<\/text><text x=\"43\" y=\"42.57\" text-anchor=\"end\">72<\/text><text x=\"43\" y=\"18.00\" text-anchor=\"end\">84<\/text><text x=\"176\" y=\"218\" text-anchor=\"middle\">Time worked (hours)<\/text><text x=\"13\" y=\"100\" text-anchor=\"middle\" transform=\"rotate(-90 13 100)\">Earnings (dollars)<\/text><\/g><\/svg><p>The graph shows a worker's earnings. The points (2, 24) and (5, 60) both give <span class=\"fq\"><span><i>y<\/i><\/span><span><i>x<\/i><\/span><\/span> = 12, so <i>y<\/i> = 12<i>x<\/i>: the worker earns $12 per hour. A line such as <i>y<\/i> = 12<i>x<\/i> + 10 is linear but <b>not<\/b> proportional, because it does not pass through (0, 0), and doubling <i>x<\/i> does not double <i>y<\/i>.<\/p><div class=\"tip\">DSAT tip: to test a table, divide each <i>y<\/i>-value by its <i>x<\/i>-value. One quotient that is different is enough to rule out a proportional relationship.<\/div>"}, {"lo": "LO5", "h": "When a ratio changes", "html": "<p>Some questions give a ratio, then add, remove or move some items and give a new ratio. Use a variable for the size of one part, write the new ratio as an equation and solve it.<\/p><div class=\"rule\">Write the original amounts as multiples of one unknown, such as 3<i>n<\/i> and 5<i>n<\/i>. Apply the change to these amounts, then set the new ratio equal to the ratio you are given.<\/div><p>Example: a jar holds red and blue marbles in the ratio 3:5. After 12 red marbles are added, the numbers of red and blue marbles are equal. Then<\/p><div class=\"eqs\">3<i>n<\/i> + 12 = 5<i>n<\/i><br>12 = 2<i>n<\/i>, so <i>n<\/i> = 6<\/div><p>The jar started with 18 red and 30 blue marbles. Check: 18 + 12 = 30 ✓.<\/p><ul><li>If only one quantity changes, the other stays fixed, and that fixed amount is often the key.<\/li><li>Adding the same amount to both quantities changes the ratio: 4 cats and 6 dogs is 2:3, but after 2 more of each there are 6 cats and 8 dogs, which is 3:4.<\/li><li>Moving items from one group to another keeps the total the same.<\/li><\/ul>"}], "examples": [{"lo": "LO1", "q": "A school club has 36 members, and the ratio of juniors to seniors is 4:5. How many seniors are in the club, and how many more seniors than juniors are there?", "steps": ["The ratio has 4 + 5 = 9 parts, and the 36 members fill them, so one part is 36 ÷ 9 = 4 members.", "Seniors: 5 parts = 5 × 4 = 20. Juniors: 4 parts = 4 × 4 = 16.", "The difference is 1 part, which is 20 − 16 = 4 members."], "ans": "20 seniors; there are 4 more seniors than juniors"}, {"lo": "LO2", "q": "A recipe uses 3 cups of flour for every 2 cups of milk. How many cups of milk are needed for 10.5 cups of flour?<br>A) 5.5<br>B) 7<br>C) 9.5<br>D) 15.75", "steps": ["Write both ratios as flour over milk: <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> = <span class=\"fq\"><span>10.5<\/span><span><i>m<\/i><\/span><\/span>.", "Cross-multiply: 3<i>m<\/i> = 2 × 10.5 = 21.", "Divide by 3: <i>m<\/i> = 7. Choice D comes from flipping one ratio, and choice C comes from subtracting 1 (the difference between 3 and 2) instead of scaling."], "ans": "B) 7 cups of milk"}, {"lo": "LO2", "q": "On a map, 2 centimeters represent 15 kilometers. Two towns are 9.2 centimeters apart on the map. What is the actual distance between them? How far apart on the map would two towns 48 kilometers apart be?", "steps": ["Find the scale for 1 centimeter: 15 ÷ 2 = 7.5 kilometers per centimeter.", "Map to real: 9.2 × 7.5 = 69 kilometers.", "Real to map: 48 ÷ 7.5 = 6.4 centimeters."], "ans": "69 kilometers; 6.4 centimeters"}, {"lo": "LO3", "q": "Brand A sells an 18-ounce jar of peanut butter for $4.32. Brand B sells a 24-ounce jar for $5.52. Which jar is the better buy, and by how much per ounce?", "steps": ["Brand A: 4.32 ÷ 18 = $0.24 per ounce.", "Brand B: 5.52 ÷ 24 = $0.23 per ounce.", "Brand B costs less per ounce, by 0.24 − 0.23 = $0.01."], "ans": "Brand B, by 1 cent per ounce"}, {"lo": "LO3", "q": "A cyclist rides 27 kilometers in 1.5 hours. At this rate, how many minutes will it take the cyclist to ride 45 kilometers? (SAT-style student-produced response)", "steps": ["Unit rate: 27 ÷ 1.5 = 18 kilometers per hour.", "Time = distance ÷ rate = 45 ÷ 18 = 2.5 hours.", "Convert to minutes: 2.5 × 60 = 150 minutes."], "ans": "150 minutes"}, {"lo": "LO4", "q": "The graph shows the cost <i>y<\/i>, in dollars, of <i>x<\/i> pounds of cherries at a market. The relationship is proportional. Write an equation for the relationship and find the cost of 7 pounds of cherries.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line through the origin showing cost in dollars against weight in pounds, passing through the marked points (2, 9) and (6, 27)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"48.00\" y1=\"14\" x2=\"48.00\" y2=\"186\"/><line x1=\"80.00\" y1=\"14\" x2=\"80.00\" y2=\"186\"/><line x1=\"112.00\" y1=\"14\" x2=\"112.00\" y2=\"186\"/><line x1=\"144.00\" y1=\"14\" x2=\"144.00\" y2=\"186\"/><line x1=\"176.00\" y1=\"14\" x2=\"176.00\" y2=\"186\"/><line x1=\"208.00\" y1=\"14\" x2=\"208.00\" y2=\"186\"/><line x1=\"240.00\" y1=\"14\" x2=\"240.00\" y2=\"186\"/><line x1=\"272.00\" y1=\"14\" x2=\"272.00\" y2=\"186\"/><line x1=\"304.00\" y1=\"14\" x2=\"304.00\" y2=\"186\"/><line x1=\"48\" y1=\"186.00\" x2=\"304\" y2=\"186.00\"/><line x1=\"48\" y1=\"143.00\" x2=\"304\" y2=\"143.00\"/><line x1=\"48\" y1=\"100.00\" x2=\"304\" y2=\"100.00\"/><line x1=\"48\" y1=\"57.00\" x2=\"304\" y2=\"57.00\"/><line x1=\"48\" y1=\"14.00\" x2=\"304\" y2=\"14.00\"/><\/g><line class=\"fg-axis\" x1=\"48\" y1=\"186\" x2=\"304\" y2=\"186\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"48\" y1=\"14\" x2=\"48\" y2=\"186\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" points=\"48.00,186.00 51.20,183.85 54.40,181.70 57.60,179.55 60.80,177.40 64.00,175.25 67.20,173.10 70.40,170.95 73.60,168.80 76.80,166.65 80.00,164.50 83.20,162.35 86.40,160.20 89.60,158.05 92.80,155.90 96.00,153.75 99.20,151.60 102.40,149.45 105.60,147.30 108.80,145.15 112.00,143.00 115.20,140.85 118.40,138.70 121.60,136.55 124.80,134.40 128.00,132.25 131.20,130.10 134.40,127.95 137.60,125.80 140.80,123.65 144.00,121.50 147.20,119.35 150.40,117.20 153.60,115.05 156.80,112.90 160.00,110.75 163.20,108.60 166.40,106.45 169.60,104.30 172.80,102.15 176.00,100.00 179.20,97.85 182.40,95.70 185.60,93.55 188.80,91.40 192.00,89.25 195.20,87.10 198.40,84.95 201.60,82.80 204.80,80.65 208.00,78.50 211.20,76.35 214.40,74.20 217.60,72.05 220.80,69.90 224.00,67.75 227.20,65.60 230.40,63.45 233.60,61.30 236.80,59.15 240.00,57.00 243.20,54.85 246.40,52.70 249.60,50.55 252.80,48.40 256.00,46.25 259.20,44.10 262.40,41.95 265.60,39.80 268.80,37.65 272.00,35.50 275.20,33.35 278.40,31.20 281.60,29.05 284.80,26.90 288.00,24.75 291.20,2 5<i>n<\/i> boys and 4<i>n<\/i> girls.", "After 6 boys leave: <span class=\"fq\"><span>5<i>n<\/i> − 6<\/span><span>4<i>n<\/i><\/span><\/span> = <span class=\"fq\"><span>7<\/span><span>8<\/span><\/span>.", "Cross-multiply: 40<i>n<\/i> − 48 = 28<i>n<\/i>, so 12<i>n<\/i> = 48 and <i>n<\/i> = 4.", "The choir started with 20 boys and 16 girls. Now it has 14 boys and 16 girls (14:16 = 7:8 ✓), which is 30 members."], "ans": "30 members"}], "traps": ["Mixing up part-to-part and part-to-whole: in a 2:5 mixture, the first part is <span class=\"fq\"><span>2<\/span><span>7<\/span><\/span> of the total, not <span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>.", "Writing a ratio in the wrong order, or flipping one ratio in a proportion. Label each ratio with words before you cross-multiply.", "Comparing quantities in different units, such as minutes with hours or grams with kilograms, without converting them first.", "Treating the numbers in a ratio as the actual amounts. A 3:5 ratio means 3<i>n<\/i> and 5<i>n<\/i>, not 3 and 5.", "Calling every straight line proportional. A line <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i> with <i>b<\/i> ≠ 0 does not pass through the origin, so it is not proportional.", "Averaging two speeds to get an average speed. Divide the total distance by the total time instead."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A bookshelf holds 24 novels and 16 biographies and no other books. What is the ratio of novels to biographies, in simplest form?", "opts": ["2 to 3", "3 to 2", "3 to 5", "2 to 5"], "ans": 1, "sol": "Novels to biographies is 24 to 16.<br>Divide both terms by their greatest common factor, 8: 3 to 2.<br>Answer: <b>3 to 2<\/b>", "hint": "Keep the order the question uses, novels first, then divide both numbers by their greatest common factor."}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "Paint is mixed using blue paint and white paint in the ratio 3:5. What fraction of the mixture is blue paint?", "ans": ["3/8", ".375", "0.375"], "sol": "The mixture has 3 + 5 = 8 parts.<br>Blue paint is 3 of those 8 parts.<br>Answer: <b><span class=\"fq\"><span>3<\/span><span>8<\/span><\/span><\/b>", "hint": "The question asks for part-to-whole. How many parts make up the whole mixture?"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The ratio of <i>a<\/i> to <i>b<\/i> is 4:9, and <i>b<\/i> − <i>a<\/i> = 35. What is the value of <i>a<\/i> + <i>b<\/i>?", "opts": ["28", "63", "91", "455"], "ans": 2, "sol": "Write <i>a<\/i> = 4<i>n<\/i> and <i>b<\/i> = 9<i>n<\/i>. Then <i>b<\/i> − <i>a<\/i> = 5<i>n<\/i> = 35, so <i>n<\/i> = 7.<br><i>a<\/i> = 28 and <i>b<\/i> = 63.<br><i>a<\/i> + <i>b<\/i> = 91.<br>Answer: <b>91<\/b>", "hint": "The difference <i>b<\/i> − <i>a<\/i> is worth 9 − 4 parts. Find the size of one part first."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i><\/span><span>18<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>6<\/span><\/span><\/div>What is the value of <i>x<\/i>?", "opts": ["3", "15", "21.6", "90"], "ans": 1, "sol": "Cross-multiply: 6<i>x<\/i> = 5 × 18 = 90.<br>Divide by 6: <i>x<\/i> = 15.<br>Answer: <b>15<\/b>", "hint": "Cross-multiply, or ask what 6 is multiplied by to give 18."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "Batches of mortar are made by mixing cement and sand in the same ratio. The table shows the amounts in three batches.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Cement (kilograms)<\/th><td>4<\/td><td>10<\/td><td><i>c<\/i><\/td><\/tr><tr><th>Sand (kilograms)<\/th><td>14<\/td><td>35<\/td><td>59.5<\/td><\/tr><\/table><\/div>What is the value of <i>c<\/i>?", "ans": ["17"], "sol": "In every batch, sand ÷ cement = 14 ÷ 4 = 3.5 (and 35 ÷ 10 = 3.5).<br>So 59.5 ÷ <i>c<\/i> = 3.5, which gives <i>c<\/i> = 59.5 ÷ 3.5 = 17.<br>Answer: <b>17<\/b>", "hint": "Find how many kilograms of sand go with each kilogram of cement, then work backward from 59.5."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "On a blueprint, 1.5 inches represent 6 feet. A room is 4.25 inches long on the blueprint. What is the actual length of the room, in feet?", "opts": ["1.0625", "4.25", "6.375", "17"], "ans": 3, "sol": "Scale for 1 inch: 6 ÷ 1.5 = 4 feet per inch.<br>Actual length: 4.25 × 4 = 17 feet.<br>Answer: <b>17<\/b>", "hint": "First find how many feet 1 inch on the blueprint represents."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A printer prints 210 pages in 6 minutes. At this rate, how many pages does it print in 15 minutes?", "opts": ["35", "231", "525", "1,260"], "ans": 2, "sol": "Unit rate: 210 ÷ 6 = 35 pages per minute.<br>In 15 minutes: 35 × 15 = 525 pages.<br>Answer: <b>525<\/b>", "hint": "Find the number of pages per minute first, then scale up."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Three runners each ran at a constant speed. Runner A ran 3 kilometers in 13.5 minutes, Runner B ran 5 kilometers in 24 minutes, and Runner C ran 8 kilometers in 40 minutes. Which runner was the fastest?", "opts": ["Runner A", "Runner B", "Runner C", "All three ran at the same speed."], "ans": 0, "sol": "Minutes per kilometer: A: 13.5 ÷ 3 = 4.5; B: 24 ÷ 5 = 4.8; C: 40 ÷ 8 = 5.<br>The fastest runner needs the fewest minutes per kilometer.<br>Answer: <b>Runner A<\/b>", "hint": "Turn each runner's numbers into the same kind of unit rate, such as minutes per kilometer, before comparing."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "The value of <i>y<\/i> is proportional to the value of <i>x<\/i>, and <i>y<\/i> = 14 when <i>x<\/i> = 4. What is the value of <i>y<\/i> when <i>x<\/i> = 10?", "opts": ["35", "40", "56", "140"], "ans": 0, "sol": "<i>k<\/i> = <span class=\"fq\"><span><i>y<\/i><\/span><span><i>x<\/i><\/span><\/span> = <span class=\"fq\"><span>14<\/span><span>4<\/span><\/span> = 3.5, so <i>y<\/i> = 3.5<i>x<\/i>.<br>When <i>x<\/i> = 10: <i>y<\/i> = 3.5 × 10 = 35.<br>Answer: <b>35<\/b>", "hint": "Find the constant <i>k<\/i> = <span class=\"fq\"><span><i>y<\/i><\/span><span><i>x<\/i><\/span><\/span> from the pair you are given."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The graph shows the mass <i>y<\/i>, in kilograms, of <i>x<\/i> meters of a steel cable. Which equation represents the relationship?<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line through the origin showing mass in kilograms against length in meters, passing through the marked points (5, 4) and (10, 8)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"48.00\" y1=\"14\" x2=\"48.00\" y2=\"186\"/><line x1=\"73.60\" y1=\"14\" x2=\"73.60\" y2=\"186\"/><line x1=\"99.20\" y1=\"14\" x2=\"99.20\" y2=\"186\"/><line x1=\"124.80\" y1=\"14\" x2=\"124.80\" y2=\"186\"/><line x1=\"150.40\" y1=\"14\" x2=\"150.40\" y2=\"186\"/><line x1=\"176.00\" y1=\"14\" x2=\"176.00\" y2=\"186\"/><line x1=\"201.60\" y1=\"14\" x2=\"201.60\" y2=\"186\"/><line x1=\"227.20\" y1=\"14\" x2=\"227.20\" y2=\"186\"/><line x1=\"252.80\" y1=\"14\" x2=\"252.80\" y2=\"186\"/><line x1=\"278.40\" y1=\"14\" x2=\"278.40\" y2=\"186\"/><line x1=\"304.00\" y1=\"14\" x2=\"304.00\" y2=\"186\"/><line x1=\"48\" y1=\"186.00\" x2=\"304\" y2=\"186.00\"/><line x1=\"48\" y1=\"164.50\" x2=\"304\" y2=\"164.50\"/><line x1=\"48\" y1=\"143.00\" x2=\"304\" y2=\"143.00\"/><line x1=\"48\" y1=\"121.50\" x2=\"304\" y2=\"121.50\"/><line x1=\"48\" y1=\"100.00\" x2=\"304\" y2=\"100.00\"/><line x1=\"48\" y1=\"78.50\" x2=\"304\" y2=\"78.50\"/><line x1=\"48\" y1=\"57.00\" x2=\"304\" y2=\"57.00\"/><line x1=\"48\" y1=\"35.50\" x2=\"304\" y2=\"35.50\"/><line x1=\"48\" y1=\"14.00\" x2=\"304\" y2=\"14.00\"/><\/g><line class=\"fg-axis\" x1=\"48\" y1=\"186\" x2=\"304\" y2=\"186\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"48\" y1=\"14\" x2=\"48\" y2=\"186\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" points=\"48.00,186.00 51.20,183.85 e, and the ratio of cars to motorcycles becomes 3:1. How many vehicles were in the parking lot before these changes?", "opts": ["55", "72", "76", "88"], "ans": 3, "sol": "Let there be 9<i>n<\/i> cars and 2<i>n<\/i> motorcycles. Then 9<i>n<\/i> − 15 = 3(2<i>n<\/i> + 3).<br>9<i>n<\/i> − 15 = 6<i>n<\/i> + 9, so 3<i>n<\/i> = 24 and <i>n<\/i> = 8.<br>There were 72 cars and 16 motorcycles, or 88 vehicles. Check: 57 cars and 19 motorcycles give 3:1 ✓.<br>Answer: <b>88<\/b>", "hint": "Write the original numbers as 9<i>n<\/i> and 2<i>n<\/i>, apply both changes, and set the new ratio equal to 3:1."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "What is the ratio of 40 seconds to 2 minutes?", "opts": ["1 to 3", "1 to 20", "3 to 1", "20 to 1"], "ans": 0, "sol": "Use the same unit: 2 minutes = 120 seconds.<br>40 to 120 simplifies to 1 to 3.<br>Answer: <b>1 to 3<\/b>"}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "<div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i> + 3<\/span><span>4<\/span><\/span> = <span class=\"fq\"><span>15<\/span><span>6<\/span><\/span><\/div>What is the value of <i>x<\/i>?", "ans": ["7"], "sol": "Cross-multiply: 6(<i>x<\/i> + 3) = 60.<br>So <i>x<\/i> + 3 = 10.<br><i>x<\/i> = 7.<br>Answer: <b>7<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A car uses 6 gallons of gasoline to travel 192 miles. What is the car's fuel efficiency, in miles per gallon?", "opts": ["0.03125", "32", "186", "1,152"], "ans": 1, "sol": "Miles per gallon means miles ÷ gallons.<br>192 ÷ 6 = 32.<br>Answer: <b>32<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Which of the following equations represents a proportional relationship between <i>x<\/i> and <i>y<\/i>?", "opts": ["<i>y<\/i> = 3<i>x<\/i> + 1", "<i>y<\/i> = 5 − <i>x<\/i>", "<i>y<\/i> = <span class=\"fq\"><span><i>x<\/i><\/span><span>5<\/span><\/span>", "<i>y<\/i> = <i>x<\/i><sup>2<\/sup>"], "ans": 2, "sol": "A proportional relationship has the form <i>y<\/i> = <i>k<\/i><i>x<\/i>.<br><i>y<\/i> = <span class=\"fq\"><span><i>x<\/i><\/span><span>5<\/span><\/span> is <i>y<\/i> = 0.2<i>x<\/i>, so <i>k<\/i> = 0.2.<br>The others either do not pass through (0, 0) or are not lines.<br>Answer: <b><i>y<\/i> = <span class=\"fq\"><span><i>x<\/i><\/span><span>5<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "The bar graph shows the number of students in a club who chose each of three activities. Each student chose exactly one activity. What is the ratio of the number of students who chose chess to the total number of students in the club?<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of the number of students choosing each activity: Hiking 18, Chess 12, Robotics 30\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"48\" y1=\"186.00\" x2=\"304\" y2=\"186.00\"/><line x1=\"48\" y1=\"157.33\" x2=\"304\" y2=\"157.33\"/><line x1=\"48\" y1=\"128.67\" x2=\"304\" y2=\"128.67\"/><line x1=\"48\" y1=\"100.00\" x2=\"304\" y2=\"100.00\"/><line x1=\"48\" y1=\"71.33\" x2=\"304\" y2=\"71.33\"/><line x1=\"48\" y1=\"42.67\" x2=\"304\" y2=\"42.67\"/><line x1=\"48\" y1=\"14.00\" x2=\"304\" y2=\"14.00\"/><\/g><line class=\"fg-axis\" x1=\"48\" y1=\"186\" x2=\"304\" y2=\"186\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"48\" y1=\"14\" x2=\"48\" y2=\"186\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"66.77\" y=\"100.00\" width=\"47.79\" height=\"86.00\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"152.11\" y=\"128.67\" width=\"47.79\" height=\"57.33\"/><rect class=\"fg-shape\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\" x=\"237.44\" y=\"42.67\" width=\"47.79\" height=\"143.33\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"43\" y=\"190.00\" text-anchor=\"end\">0<\/text><text x=\"43\" y=\"161.33\" text-anchor=\"end\">6<\/text><text x=\"43\" y=\"132.67\" text-anchor=\"end\">12<\/text><text x=\"43\" y=\"104.00\" text-anchor=\"end\">18<\/text><text x=\"43\" y=\"75.33\" text-anchor=\"end\">24<\/text><text x=\"43\" y=\"46.67\" text-anchor=\"end\">30<\/text><text x=\"43\" y=\"18.00\" text-anchor=\"end\">36<\/text><text x=\"176\" y=\"218\" text-anchor=\"middle\">Activity<\/text><text x=\"13\" y=\"100\" text-anchor=\"middle\" transform=\"rotate(-90 13 100)\">Number of students<\/text><text x=\"90.67\" y=\"200\" text-anchor=\"middle\">Hiking<\/text><text x=\"176.00\" y=\"200\" text-anchor=\"middle\">Chess<\/text><text x=\"261.33\" y=\"200\" text-anchor=\"middle\">Robotics<\/text><\/g><\/svg>", "opts": ["1 to 4", "2 to 5", "2 to 3", "1 to 5"], "ans": 3, "sol": "From the graph: hiking 18, chess 12, robotics 30, so the total is 60.<br>Chess to total is 12 to 60, which simplifies to 1 to 5.<br>Answer: <b>1 to 5<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A floor plan uses a scale in which <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span> inch represents 1 foot. A wall is 5.5 inches long on the floor plan. What is the actual length of the wall, in feet?", "opts": ["1.375", "5.75", "22", "264"], "ans": 2, "sol": "Each inch on the plan is 4 quarter-inches, so it represents 4 feet.<br>5.5 × 4 = 22 feet.<br>Answer: <b>22<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A store sells a 12-pack of pens for $4.80 and a 30-pack of the same pens for $10.50. How many cents less per pen does the 30-pack cost than the 12-pack?", "ans": ["5"], "sol": "12-pack: 480 ÷ 12 = 40 cents per pen.<br>30-pack: 1,050 ÷ 30 = 35 cents per pen.<br>Difference: 40 − 35 = 5 cents.<br>Answer: <b>5<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The table shows four pairs of values of <i>x<\/i> and <i>y<\/i>, where <i>y<\/i> is proportional to <i>x<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>2<\/td><td>5<\/td><td>8<\/td><td>12<\/td><\/tr><tr><th><i>y<\/i><\/th><td>7<\/td><td>17.5<\/td><td>28<\/td><td>42<\/td><\/tr><\/table><\/div>Which equation represents the relationship?", "opts": ["<i>y<\/i> = <span class=\"fq\"><span>2<\/span><span>7<\/span><\/span><i>x<\/i>", "<i>y<\/i> = <i>x<\/i> + 5", "<i>y<\/i> = 7<i>x<\/i>", "<i>y<\/i> = 3.5<i>x<\/i>"], "ans": 3, "sol": "<i>k<\/i> = <span class=\"fq\"><span><i>y<\/i><\/span><span><i>x<\/i><\/span><\/span>: <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span> = 3.5, <span class=\"fq\"><span>17.5<\/span><span>5<\/span><\/span> = 3.5, <span class=\"fq\"><span>28<\/span><span>8<\/span><\/span> = 3.5, <span class=\"fq\"><span>42<\/span><span>12<\/span><\/span> = 3.5.<br>So <i>y<\/i> = 3.5<i>x<\/i>. (The equation <i>y<\/i> = <i>x<\/i> + 5 fits only the first pair.)<br>Answer: <b><i>y<\/i> = 3.5<i>x<\/i><\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The ratio of <i>p<\/i> to <i>q<\/i> is 2:3. When 10 is added to <i>p<\/i> and <i>q<\/i> is unchanged, the ratio of the new value of <i>p<\/i> to <i>q<\/i> is 4:3. What is the value of <i>q<\/i>?", "opts": ["5", "10", "15", "20"], "ans": 2, "sol": "Let <i>p<\/i> = 2<i>n<\/i> and <i>q<\/i> = 3<i>n<\/i>. Then <span class=\"fq\"><span>2<i>n<\/i> + 10<\/span><span>3<i>n<\/i><\/span><\/span> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>.<br>Cross-multiply: 6<i>n<\/i> + 30 = 12<i>n<\/i>, so <i>n<\/i> = 5.<br><i>q<\/i> = 3 × 5 = 15. Check: 20 to 15 is 4 to 3 ✓.<br>Answer: <b>15<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The numbers <i>r<\/i>, <i>s<\/i> and <i>t<\/i> are in the ratio 2:3:4, and <i>r<\/i> + <i>s<\/i> + <i>t<\/i> = 540. What is the value of <i>t<\/i>?", "opts": ["60", "135", "180", "240"], "ans": 3, "sol": "There are 2 + 3 + 4 = 9 parts, so one part is 540 ÷ 9 = 60.<br><i>t<\/i> is 4 parts: 4 × 60 = 240.<br>Answer: <b>240<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "A rectangle that is 4 inches wide and 6 inches long is enlarged so that the length and width keep the same ratio. The longer side of the enlarged rectangle is 15 inches. How many inches long is its shorter side?", "ans": ["10"], "sol": "Shorter over longer is the same before and after: <span class=\"fq\"><span>4<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span><i>w<\/i><\/span><span>15<\/span><\/span>.<br>Cross-multiply: 6<i>w<\/i> = 60.<br><i>w<\/i> = 10.<br>Answer: <b>10<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A bus travels 138 miles in 2 hours 30 minutes. What is the bus's average speed, in miles per hour?", "opts": ["0.92", "55.2", "60", "69"], "ans": 1, "sol": "2 hours 30 minutes is 2.5 hours, not 2.3 hours.<br>Speed = 138 ÷ 2.5 = 55.2 miles per hour.<br>Answer: <b>55.2<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The graph shows the volume <i>y<\/i>, in liters, of water that flows from a tap in <i>x<\/i> minutes. If the relationship continues, how many minutes will it take for 120 liters of water to flow from the tap?<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line through the origin showing volume of water in liters against time in minutes, passing through the marked points (4, 30) and (8, 60)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"48.00\" y1=\"14\" x2=\"48.00\" y2=\"186\"/><line x1=\"73.60\" y1=\"14\" x2=\"73.60\" y2=\"186\"/><line x1=\"99.20\" y1=\"14\" x2=\"99.20\" y2=\"186\"/><line x1=\"124.80\" y1=\"14\" x2=\"124.80\" y2=\"186\"/><line x1=\"150.40\" y1=\"14\" x2=\"150.40\" y2=\"186\"/><line x1=\"176.00\" y1=\"14\" x2=\"176.00\" y2=\"186\"/><line x1=\"201.60\" y1=\"14\" x2=\"201.60\" y2=\"186\"/><line x1=\"227.20\" y1=\"14\" x2=\"227.20\" y2=\"186\"/><line x1=\"252.80\" y1=\"14\" x2=\"252.80\" y2=\"186\"/><line x1=\"278.40\" y1=\"14\" x2=\"278.40\" y2=\"186\"/><line x1=\"304.00\" y1=\"14\" x2=\"304.00\" y2=\"186\"/><line x1=\"48\" ", "6 to 35", "10 to 21", "15 to 14"], "ans": 1, "sol": "Make the <i>y<\/i> terms match: 3:5 = 6:10 and 2:7 = 10:35.<br>So <i>x<\/i>:<i>y<\/i>:<i>z<\/i> = 6:10:35.<br><i>x<\/i> to <i>z<\/i> is 6 to 35.<br>Answer: <b>6 to 35<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A map has a scale in which 1 centimeter represents 4 kilometers. On the map, a rectangular nature reserve is 2.5 centimeters long and 1.5 centimeters wide. What is the actual area of the reserve, in square kilometers?", "opts": ["3.75", "15", "32", "60"], "ans": 3, "sol": "Actual length: 2.5 × 4 = 10 kilometers. Actual width: 1.5 × 4 = 6 kilometers.<br>Area = 10 × 6 = 60 square kilometers.<br>(Multiplying the map area 3.75 by 4 gives 15, which is wrong because the scale applies to each length.)<br>Answer: <b>60<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A cyclist rides 30 kilometers at an average speed of 15 kilometers per hour, then rides another 30 kilometers at an average speed of 10 kilometers per hour. What is the cyclist's average speed for the whole 60 kilometers, in kilometers per hour?", "ans": ["12"], "sol": "Time for the first part: 30 ÷ 15 = 2 hours. Time for the second part: 30 ÷ 10 = 3 hours.<br>Total time: 5 hours.<br>Average speed = 60 ÷ 5 = 12 kilometers per hour (not 12.5, the average of the two speeds).<br>Answer: <b>12<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The value of <i>y<\/i> is proportional to the value of <i>x<\/i>, and <i>y<\/i> = 12 when <i>x<\/i> = 16. If the value of <i>x<\/i> increases by 6, by how much does the value of <i>y<\/i> increase?", "opts": ["4.5", "6", "8", "16.5"], "ans": 0, "sol": "<i>k<\/i> = <span class=\"fq\"><span>12<\/span><span>16<\/span><\/span> = 0.75, so <i>y<\/i> = 0.75<i>x<\/i>.<br>An increase of 6 in <i>x<\/i> changes <i>y<\/i> by 0.75 × 6 = 4.5, whatever the starting value.<br>Answer: <b>4.5<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The same number is added to 18 and to 42, and the ratio of the first result to the second result is 1:2. What number is added?", "opts": ["6", "12", "24", "48"], "ans": 0, "sol": "Let the number be <i>g<\/i>. Then <span class=\"fq\"><span>18 + <i>g<\/i><\/span><span>42 + <i>g<\/i><\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>.<br>Cross-multiply: 36 + 2<i>g<\/i> = 42 + <i>g<\/i>, so <i>g<\/i> = 6.<br>Check: the results are 24 and 48, and 24:48 = 1:2 ✓.<br>Answer: <b>6<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "If <span class=\"fq\"><span><i>a<\/i><\/span><span><i>b<\/i><\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>, what is the value of <span class=\"fq\"><span><i>a<\/i> + <i>b<\/i><\/span><span><i>b<\/i> − <i>a<\/i><\/span><\/span>?", "opts": ["<span class=\"fq\"><span>7<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>7<\/span><\/span>", "<span class=\"fq\"><span>7<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>"], "ans": 0, "sol": "Since <i>a<\/i>:<i>b<\/i> = 2:5, write <i>a<\/i> = 2<i>n<\/i> and <i>b<\/i> = 5<i>n<\/i>.<br><i>a<\/i> + <i>b<\/i> = 7<i>n<\/i> and <i>b<\/i> − <i>a<\/i> = 3<i>n<\/i>.<br>The quotient is <span class=\"fq\"><span>7<i>n<\/i><\/span><span>3<i>n<\/i><\/span><\/span> = <span class=\"fq\"><span>7<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>7<\/span><span>3<\/span><\/span><\/b>"}], "quiz2": [{"lo": "LO5", "diff": "M", "type": "mcq", "q": "The bar graph shows the number of trees of each type in a park. If 18 more birch trees are planted and no other trees are added or removed, what will be the ratio of birch trees to oak trees in the park?<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of the number of trees of each type in a park: Oak 48, Maple 36, Pine 60, Birch 24\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"48\" y1=\"186.00\" x2=\"304\" y2=\"186.00 dle\">Maple<\/text><text x=\"208.00\" y=\"200\" text-anchor=\"middle\">Pine<\/text><text x=\"272.00\" y=\"200\" text-anchor=\"middle\">Birch<\/text><\/g><\/svg>", "opts": ["1 to 2", "7 to 8", "8 to 7", "7 to 31"], "ans": 1, "sol": "From the graph there are 24 birch trees and 48 oak trees.<br>After planting: 24 + 18 = 42 birch trees, and still 48 oak trees.<br>42 to 48 simplifies to 7 to 8.<br>Answer: <b>7 to 8<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><span class=\"fq\"><span>2<i>x<\/i> + 1<\/span><span>9<\/span><\/span> = <span class=\"fq\"><span><i>x<\/i> + 3<\/span><span>5<\/span><\/span><\/div>What is the value of <i>x<\/i>?", "opts": ["−2", "<span class=\"fq\"><span>6<\/span><span>13<\/span><\/span>", "2", "22"], "ans": 3, "sol": "Cross-multiply: 5(2<i>x<\/i> + 1) = 9(<i>x<\/i> + 3).<br>10<i>x<\/i> + 5 = 9<i>x<\/i> + 27.<br><i>x<\/i> = 22.<br>Answer: <b>22<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A 1.5-liter bottle of juice costs $2.85, and a 400-milliliter bottle of the same juice costs $0.84. Which statement is true?", "opts": ["The 1.5-liter bottle costs $0.20 less per liter.", "The 1.5-liter bottle costs $2.01 less per liter.", "The 400-milliliter bottle costs $0.20 less per liter.", "Both bottles cost the same amount per liter."], "ans": 0, "sol": "1.5-liter bottle: 2.85 ÷ 1.5 = $1.90 per liter.<br>400 milliliters = 0.4 liter: 0.84 ÷ 0.4 = $2.10 per liter.<br>The larger bottle costs 2.10 − 1.90 = $0.20 less per liter.<br>Answer: <b>The 1.5-liter bottle costs $0.20 less per liter.<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Which of the following lists of (<i>x<\/i>, <i>y<\/i>) pairs could come from a proportional relationship between <i>x<\/i> and <i>y<\/i>?", "opts": ["(1, 3), (2, 5), (3, 7)", "(2, 6), (3, 9), (5, 14)", "(1, 2), (2, 4), (3, 8)", "(2, 5), (4, 10), (7, 17.5)"], "ans": 3, "sol": "Divide each <i>y<\/i> by its <i>x<\/i>; the quotient must be the same for every pair.<br>(2, 5), (4, 10), (7, 17.5): 2.5, 2.5, 2.5.<br>Each other list has a pair with a different quotient.<br>Answer: <b>(2, 5), (4, 10), (7, 17.5)<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The ratio of the length to the width of a rectangle is 5:2, and the perimeter of the rectangle is 84 centimeters. What is the area of the rectangle, in square centimeters?", "opts": ["30", "42", "360", "1,440"], "ans": 2, "sol": "Let the length be 5<i>n<\/i> and the width 2<i>n<\/i>. The perimeter is 2(5<i>n<\/i> + 2<i>n<\/i>) = 14<i>n<\/i> = 84, so <i>n<\/i> = 6.<br>Length 30 centimeters, width 12 centimeters.<br>Area = 30 × 12 = 360.<br>Answer: <b>360<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A hiking map has a scale of 1:250,000. Two villages are 6.8 centimeters apart on the map. What is the actual distance between the villages, in kilometers?", "opts": ["1.7", "17", "170", "1,700"], "ans": 1, "sol": "Actual distance: 6.8 × 250,000 = 1,700,000 centimeters.<br>1 kilometer = 100,000 centimeters, so 1,700,000 ÷ 100,000 = 17 kilometers.<br>Answer: <b>17<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "The ratio of <i>a<\/i> to <i>b<\/i> is 3:4, and the ratio of <i>b<\/i> to <i>c<\/i> is 6:5. If <i>a<\/i> + <i>b<\/i> + <i>c<\/i> = 186, what is the value of <i>c<\/i>?", "ans": ["60"], "sol": "Match the <i>b<\/i> terms with 12: 3:4 = 9:12 and 6:5 = 12:10.<br>So <i>a<\/i>:<i>b<\/i>:<i>c<\/i> = 9:12:10, which is 31 parts.<br>One part is 186 ÷ 31 = 6, so <i>c<\/i> = 10 × 6 = 60.<br>Answer: <b>60<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "In the table, <i>y<\/i> is proportional to <i>x<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>4<\/td><td>10<\/td><td><i>b<\/i><\/td><\/tr><tr><th><i>y<\/i><\/th><td><i>a<\/i><\/td><td>25<\/td><td>40<\/td><\/tr><\/table><\/div>What is the value of <i>a<\/i> + <i>b<\/i>?", "opts": ["10", "16", "26", "44"], "ans": 2, "sol": "From the complete column, <span class=\"fq\"><span><i>y<\/i><\/span><span><i>x<\/i><\/span><\/span> = <span class=\"fq\"><span>25<\/span><span>10<\/span><\/span> = 2.5.<br><i>a<\/i> = 2.5 × 4 = 10 and <i>b<\/i> = 40 ÷ 2.5 = 16.<br><i>a<\/i> + <i>b<\/i> = 26.<br>Answer: <b>26<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Machine A fills 384 bottles in 8 minutes, and Machine B fills 416 bottles in 13 minutes. Each machine works at a constant rate. Working at the same time, how many minutes will the two machines take to fill 2,400 bottles?", "opts": ["30", "50", "62.5", "75"], "ans": 0, "sol": "Machine A: 384 ÷ 8 = 48 bottles per minute. Machine B: 416 ÷ 13 = 32 bottles per minute.<br>Together: 48 + 32 = 80 bottles per minute.<br>Time = 2,400 ÷ 80 = 30 minutes.<br>Answer: <b>30<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The graph shows the number of cups of flour <i>y<\/i> a baker needs for <i>x<\/i> batches of bread rolls. The baker has 20 cups of flour. What is the greatest number of complete batches the baker can make?<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line through the origin showing cups of flour against number of batches, passing through the marked points (2, 3), (4, 6) and (8, 12)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"48.00\" y1=\"14\" x2=\"48.00\" y2=\"186\"/><line x1=\"73.60\" y1=\"14\" x2=\"73.60\" y2=\"186\"/><line x1=\"99.20\" y1=\"14\" x2=\"99.20\" y2=\"186\"/><line x1=\"124.80\" y1=\"14\" x2=\"124.80\" y2=\"186\"/><line x1=\"150.40\" y1=\"14\" x2=\"150.40\" y2=\"186\"/><line x1=\"176.00\" y1=\"14\" x2=\"176.00\" y2=\"186\"/><line x1=\"201.60\" y1=\"14\" x2=\"201.60\" y2=\"186\"/><line x1=\"227.20\" y1=\"14\" x2=\"227.20\" y2=\"186\"/><line x1=\"252.80\" y1=\"14\" x2=\"252.80\" y2=\"186\"/><line x1=\"278.40\" y1=\"14\" x2=\"278.40\" y2=\"186\"/><line x1=\"304.00\" y1=\"14\" x2=\"304.00\" y2=\"186\"/><line x1=\"48\" y1=\"186.00\" x2=\"304\" y2=\"186.00\"/><line x1=\"48\" y1=\"151.60\" x2=\"304\" y2=\"151.60\"/><lin , "q": "Set <i>P<\/i> contains 48 whole numbers, and the ratio of even numbers to odd numbers in set <i>P<\/i> is 1:3. Set <i>Q<\/i> contains 40 whole numbers, and the ratio of even numbers to odd numbers in set <i>Q<\/i> is 2:3. The two sets have no numbers in common. What fraction of the 88 numbers in the two sets combined are even?", "opts": ["<span class=\"fq\"><span>7<\/span><span>22<\/span><\/span>", "<span class=\"fq\"><span>13<\/span><span>40<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>7<\/span><span>15<\/span><\/span>"], "ans": 0, "sol": "Set <i>P<\/i>: one part is 48 ÷ 4 = 12, so 12 numbers are even.<br>Set <i>Q<\/i>: one part is 40 ÷ 5 = 8, so 16 numbers are even.<br>Even numbers: 12 + 16 = 28 out of 88, and <span class=\"fq\"><span>28<\/span><span>88<\/span><\/span> = <span class=\"fq\"><span>7<\/span><span>22<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>7<\/span><span>22<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A store sells rice in 5-kilogram bags for $8.75 each and in 2-kilogram bags for $3.70 each. Priya wants to buy exactly 14 kilograms of rice using only these bags. What is the least amount, in dollars, she can spend?", "ans": ["24.9", "24.90"], "sol": "The 5-kilogram bag costs 8.75 ÷ 5 = $1.75 per kilogram, and the 2-kilogram bag costs $1.85 per kilogram, so use as many large bags as possible.<br>Ways to make exactly 14 kilograms: two 5-kilogram bags and two 2-kilogram bags, or seven 2-kilogram bags.<br>Costs: 2(8.75) + 2(3.70) = $24.90, or 7(3.70) = $25.90.<br>Answer: <b>24.9<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "In the <i>x<\/i><i>y<\/i>-plane, the graph of a proportional relationship between <i>x<\/i> and <i>y<\/i> passes through the points (6, <i>b<\/i>) and (<i>b<\/i>, 24), where <i>b<\/i> &gt; 0. What is the value of <i>b<\/i>?", "opts": ["12", "15", "18", "144"], "ans": 0, "sol": "In a proportional relationship, <span class=\"fq\"><span><i>y<\/i><\/span><span><i>x<\/i><\/span><\/span> is the same for both points: <span class=\"fq\"><span><i>b<\/i><\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>24<\/span><span><i>b<\/i><\/span><\/span>.<br>Cross-multiply: <i>b<\/i><sup>2<\/sup> = 144.<br>Since <i>b<\/i> &gt; 0, <i>b<\/i> = 12. Check: <span class=\"fq\"><span>12<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>24<\/span><span>12<\/span><\/span> = 2 ✓.<br>Answer: <b>12<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A jar contains only dimes and quarters, and the ratio of the number of dimes to the number of quarters is 4:3. The total value of the coins is $9.20. If 8 quarters are added to the jar, what will be the ratio of the number of dimes to the number of quarters?", "opts": ["4 to 11", "2 to 5", "1 to 1", "4 to 3"], "ans": 2, "sol": "Let there be 4<i>n<\/i> dimes and 3<i>n<\/i> quarters. Value: 0.10(4<i>n<\/i>) + 0.25(3<i>n<\/i>) = 1.15<i>n<\/i> = 9.20, so <i>n<\/i> = 8.<br>There are 32 dimes and 24 quarters.<br>After adding 8 quarters: 32 dimes and 32 quarters, which is 1 to 1.<br>Answer: <b>1 to 1<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A running track is 400 meters long. A runner completes 12 laps of the track in 21 minutes. At this rate, how many minutes would it take the runner to run 10 kilometers?", "ans": ["43.75", "175/4"], "sol": "Distance in 21 minutes: 12 × 400 = 4,800 meters.<br>Rate: 4,800 ÷ 21 meters per minute. 10 kilometers is 10,000 meters.<br>Time = 10,000 × <span class=\"fq\"><span>21<\/span><span>4,800<\/span><\/span> = 43.75 minutes.<br>Answer: <b>43.75<\/b>"}, {"lo": "LO5", "diff": "X", "type": "spr", "q": "Positive numbers <i>p<\/i> and <i>q<\/i> are in the ratio 5:2. When 18 is subtracted from <i>p<\/i> and 18 is added to <i>q<\/i>, the ratio of the results is 4:3. What is the value of <i>q<\/i> + 18?", "ans": ["54"], "sol": "Write <i>p<\/i> = 5<i>t<\/i> and <i>q<\/i> = 2<i>t<\/i>. Moving 18 from <i>p<\/i> to <i>q<\/i> keeps the sum 7<i>t<\/i> the same.<br><span class=\"fq\"><span>5<i>t<\/i> − 18<\/span><span>2<i>t<\/i> + 18<\/span><\/span> = <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>: 15<i>t<\/i> − 54 = 8<i>t<\/i> + 72, so <i>t<\/i> = 18 and the sum is 126.<br>The new <i>q<\/i> is <span class=\"fq\"><span>3<\/span><span>7<\/span><\/span> of 126 = 54. Check: <i>p<\/i> − 18 = 90 − 18 = 72, and 72 to 54 is 4 to 3 ✓.<br>Answer: <b>54<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "The value of <i>y<\/i> is proportional to <i>x<\/i>, and <i>y<\/i> = 10 when <i>x<\/i> = 4. The value of <i>z<\/i> is proportional to <i>y<\/i>, and <i>z<\/i> = 9 when <i>y<\/i> = 15. What is the value of <i>z<\/i> when <i>x<\/i> = 12?", "opts": ["7.2", "18", "27", "50"], "ans": 1, "sol": "<i>y<\/i> = 2.5<i>x<\/i>, so when <i>x<\/i> = 12, <i>y<\/i> = 30.<br><i>z<\/i> = <span class=\"fq\"><span>9<\/span><span>15<\/span><\/span><i>y<\/i> = 0.6<i>y<\/i>, so <i>z<\/i> = 0.6 × 30 = 18.<br>Answer: <b>18<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "On Map A, 1 centimeter represents 5 kilometers. On Map B, 1 centimeter represents 8 kilometers. A road is drawn on both maps, and its length on Map A is 12 centimeters greater than its length on Map B. What is the actual length of the road, in kilometers?", "opts": ["36", "96", "160", "480"], "ans": 2, "sol": "Let the real length be <i>L<\/i> kilometers. On Map A it is <span class=\"fq\"><span><i>L<\/i><\/span><span>5<\/span><\/span> centimeters, and on Map B it is <span class=\"fq\"><span><i>L<\/i><\/span><span>8<\/span><\/span> centimeters.<br><span class=\"fq\"><span><i>L<\/i><\/span><span>5<\/span><\/span> − <span class=\"fq\"><span><i>L<\/i><\/span><span>8<\/span><\/span> = 12. Multiply by 40: 8<i>L<\/i> − 5<i>L<\/i> = 480, so <i>L<\/i> = 160.<br>Check: 32 centimeters and 20 centimeters differ by 12 ✓.<br>Answer: <b>160<\/b>"}, {"lo": "LO3", "diff": "X", "type": "mcq", "q": "A driver travels the first 90 kilometers of a 180-kilometer trip at an average speed of 60 kilometers per hour. What average speed, in kilometers per hour, must the driver keep for the remaining 90 kilometers so that the average speed for the whole trip is 72 kilometers per hour?", "opts": ["72", "80", "84", "90"], "ans": 3, "sol": "The whole trip must take 180 ÷ 72 = 2.5 hours.<br>The first part takes 90 ÷ 60 = 1.5 hours, which leaves 1 hour.<br>Speed for the rest: 90 ÷ 1 = 90 kilometers per hour. (84 comes from wrongly averaging the speeds.)<br>Answer: <b>90<\/b>"}], "unit_no": 3, "topic_no": "1", "code": "1.1"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });

  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;

    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });

    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
