  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}

  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}

<script>
(function(){
"use strict";
var S = {"id": "ALG-1.1", "unit": "Algebra", "topic": "Linear equations in one variable", "title": "Solving linear equations", "intro": "A linear equation in one variable, such as 3(<i>x<\/i> − 2) = <i>x<\/i> + 8, has the variable only to the first power, and solving it means finding the value that balances both sides. These equations appear throughout the DSAT, both on their own and as the final step of word problems, systems and function questions.", "los": [{"id": "LO1", "text": "Solve multi-step linear equations by distributing, combining like terms and using inverse operations."}, {"id": "LO2", "text": "Solve linear equations that have the variable on both sides."}, {"id": "LO3", "text": "Solve linear equations containing fractions or decimals by clearing them or working with them directly."}, {"id": "LO4", "text": "Determine the value of an expression or an unknown constant from a linear equation by using its structure."}], "notes": [{"lo": "LO1", "h": "Keep the balance", "html": "<p>An equation is a balance: whatever you do to one side, you must do to the other side too. To solve, you <b>undo<\/b> what has been done to the variable, working in reverse order. If <i>x<\/i> was multiplied by 3 and then 8 was added, first subtract 8 from both sides, then divide both sides by 3.<\/p><div class=\"rule\">Undo addition and subtraction first, then multiplication and division. Do the same thing to both sides every time.<\/div><div class=\"eqs\">3<i>x<\/i> + 8 = 29<br>3<i>x<\/i> = 21<br><i>x<\/i> = 7<\/div><p>Finish by checking in the original equation: 3(7) + 8 = 29 ✓. On the DSAT, a ten second check catches most careless slips, and the wrong answer choices are usually the numbers you get from doing a step in the wrong order.<\/p>"}, {"lo": "LO1", "h": "Distribute, then combine like terms", "html": "<p>Before undoing anything, simplify each side of the equation on its own.<\/p><ol><li><b>Distribute:<\/b> multiply the number outside the parentheses by <i>every<\/i> term inside.<\/li><li><b>Combine like terms<\/b> on each side: <i>x<\/i> terms with <i>x<\/i> terms, numbers with numbers.<\/li><li><b>Undo<\/b> the remaining operations with inverse operations.<\/li><\/ol><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Expression<\/th><th>Correct<\/th><th>Common error<\/th><\/tr><tr><td>3(2<i>x<\/i> − 4)<\/td><td>6<i>x<\/i> − 12<\/td><td>6<i>x<\/i> − 4<\/td><\/tr><tr><td>−2(<i>x<\/i> − 5)<\/td><td>−2<i>x<\/i> + 10<\/td><td>−2<i>x<\/i> − 10<\/td><\/tr><tr><td>−(3<i>x<\/i> + 1)<\/td><td>−3<i>x<\/i> − 1<\/td><td>−3<i>x<\/i> + 1<\/td><\/tr><\/table><\/div><div class=\"rule\">A minus sign in front of parentheses changes the sign of every term inside them.<\/div><p>For nested brackets such as 2[5 − 3(<i>x<\/i> + 1)], work from the inside out: 5 − 3<i>x<\/i> − 3 = 2 − 3<i>x<\/i>, so the whole expression is 4 − 6<i>x<\/i>.<\/p>"}, {"lo": "LO2", "h": "Variables on both sides", "html": "<p>When <i>x<\/i> appears on both sides, gather all the <i>x<\/i> terms on one side and all the constants on the other. Moving a term really means subtracting (or adding) it on <b>both<\/b> sides, which is why its sign changes as it crosses the equals sign.<\/p><div class=\"eqs\">7<i>x<\/i> − 5 = 3<i>x<\/i> + 19<br>4<i>x<\/i> − 5 = 19 &nbsp;(subtract 3<i>x<\/i>)<br>4<i>x<\/i> = 24 &nbsp;(add 5)<br><i>x<\/i> = 6<\/div><div class=\"rule\">Collect <i>x<\/i> on the side with the larger <i>x<\/i> coefficient so the coefficient stays positive.<\/div><p>If either side has parentheses, distribute and combine on each side first, then collect. A negative or fractional answer is perfectly normal on the DSAT. (If the <i>x<\/i> terms cancel completely, the equation has no solution or infinitely many; that case has its own sheet.)<\/p>"}, {"lo": "LO3", "h": "Clearing fractions", "html": "<p>Fractions are easier to remove than to work with. Multiply <b>every term on both sides<\/b> by the least common denominator (LCD). Put each numerator in parentheses first so that the multiplication, and any minus sign, reaches the whole numerator.<\/p><div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i> + 1<\/span><span>2<\/span><\/span> − <span class=\"fq\"><span><i>x<\/i><\/span><span>3<\/span><\/span> = 2<br>3(<i>x<\/i> + 1) − 2<i>x<\/i> = 12 &nbsp;(multiply by 6)<br>3<i>x<\/i> + 3 − 2<i>x<\/i> = 12<br><i>x<\/i> = 9<\/div><div class=\"rule\">Multiply by the LCD; forgetting to multiply a whole number term (like the 2 above) is the most common slip.<\/div><p>For a proportion such as <span class=\"fq\"><span><i>a<\/i><\/span><span><i>b<\/i><\/span><\/span> = <span class=\"fq\"><span><i>c<\/i><\/span><span><i>d<\/i><\/span><\/span>, cross multiply: <i>a<\/i><i>d<\/i> = <i>b<\/i><i>c<\/i>. A coefficient like <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> can also be removed in one move by multiplying both sides by <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>.<\/p>"}, {"lo": "LO3", "h": "Decimals and the calculator", "html": "<p>Decimals can be cleared the same way: multiply every term by 10, 100 or 1,000, whichever turns every coefficient into a whole number.<\/p><div class=\"eqs\">0.3<i>x<\/i> + 1.25 = 0.05<i>x<\/i> + 3<br>30<i>x<\/i> + 125 = 5<i>x<\/i> + 300 &nbsp;(multiply by 100)<br>25<i>x<\/i> = 175<br><i>x<\/i> = 7<\/div><p>Because the calculator is allowed on every DSAT math question, you may also keep the decimals and simply be careful: 0.25<i>x<\/i> = 1.75 gives <i>x<\/i> = 7 directly.<\/p><div class=\"tip\"><b>Desmos tip:<\/b> type the whole equation, for example 0.3x + 1.25 = 0.05x + 3, into Desmos. It draws a vertical line at the solution, x = 7. You can also graph each side as its own y = … and tap the intersection point; its x coordinate is the solution.<\/div>"}, {"lo": "LO4", "h": "Solve for the chunk", "html": "<p>Some questions ask for the value of an expression, such as 2<i>x<\/i> − 3, instead of <i>x<\/i> itself. Look at how the equation is built before you start.<\/p><div class=\"eqs\">8<i>x<\/i> − 12 = 28<br>4(2<i>x<\/i> − 3) = 28<br>2<i>x<\/i> − 3 = 7<\/div><p>Seeing 8<i>x<\/i> − 12 as 4 times the chunk gives the answer in one step. If the same chunk appears on both sides, as in 5(<i>x<\/i> + 1) = 2(<i>x<\/i> + 1) + 12, treat it as a single unknown <i>u<\/i>: 5<i>u<\/i> = 2<i>u<\/i> + 12, so <i>u<\/i> = 4 and <i>x<\/i> + 1 = 4.<\/p><div class=\"rule\">Answer the question that was asked. If you solve for <i>x<\/i>, finish by substituting into the requested expression.<\/div>"}, {"lo": "LO4", "h": "Finding an unknown constant", "html": "<p>Sometimes an equation contains a constant such as <i>k<\/i>, and you are told the solution. A solution is exactly a value of <i>x<\/i> that makes both sides equal, so substitute the given value of <i>x<\/i>. What remains is a linear equation in <i>k<\/i>.<\/p><div class=\"eqs\"><i>k<\/i>(<i>x<\/i> + 1) = 4<i>x<\/i> + 2, &nbsp;solution <i>x<\/i> = 3<br><i>k<\/i>(4) = 14<br><i>k<\/i> = <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span><\/div><p>Check: with <i>k<\/i> = <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>, the left side is <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>(4) = 14 and the right side is 4(3) + 2 = 14 ✓.<\/p><div class=\"rule\">Known solution: plug it in for <i>x<\/i>, then solve the new equation for the constant.<\/div>"}], "examples": [{"lo": "LO1", "q": "Solve 5(2<i>x<\/i> − 3) − 4<i>x<\/i> = 27.", "steps": ["Distribute: 10<i>x<\/i> − 15 − 4<i>x<\/i> = 27.", "Combine like terms: 6<i>x<\/i> − 15 = 27.", "Add 15, then divide by 6: 6<i>x<\/i> = 42, so <i>x<\/i> = 7."], "ans": "<i>x<\/i> = 7"}, {"lo": "LO2", "q": "Solve 7<i>x<\/i> − 9 = 3<i>x<\/i> + 23.", "steps": ["Subtract 3<i>x<\/i> from both sides: 4<i>x<\/i> − 9 = 23.", "Add 9: 4<i>x<\/i> = 32.", "Divide by 4: <i>x<\/i> = 8. Check: 7(8) − 9 = 47 and 3(8) + 23 = 47 ✓."], "ans": "<i>x<\/i> = 8"}, {"lo": "LO3", "q": "Solve <span class=\"fq\"><span><i>x<\/i> + 4<\/span><span>3<\/span><\/span> − <span class=\"fq\"><span><i>x<\/i> − 2<\/span><span>5<\/span><\/span> = 2.", "steps": ["The LCD of 3 and 5 is 15. Multiply every term by 15: 5(<i>x<\/i> + 4) − 3(<i>x<\/i> − 2) = 30.", "Distribute carefully; the minus sign reaches the −2: 5<i>x<\/i> + 20 − 3<i>x<\/i> + 6 = 30.", "Combine: 2<i>x<\/i> + 26 = 30, so 2<i>x<\/i> = 4 and <i>x<\/i> = 2."], "ans": "<i>x<\/i> = 2"}, {"lo": "LO3", "q": "Solve 0.15<i>x<\/i> + 0.4(20 − <i>x<\/i>) = 5.5.", "steps": ["Distribute: 0.15<i>x<\/i> + 8 − 0.4<i>x<\/i> = 5.5.", "Combine: −0.25<i>x<\/i> + 8 = 5.5, so −0.25<i>x<\/i> = −2.5.", "Divide by −0.25: <i>x<\/i> = 10."], "ans": "<i>x<\/i> = 10"}, {"lo": "LO4", "q": "If 6<i>x<\/i> − 10 = 23, what is the value of 3<i>x<\/i> − 5?", "steps": ["Notice that 6<i>x<\/i> − 10 = 2(3<i>x<\/i> − 5).", "So 2(3<i>x<\/i> − 5) = 23, and dividing by 2 gives 3<i>x<\/i> − 5 = <span class=\"fq\"><span>23<\/span><span>2<\/span><\/span>. No need to find <i>x<\/i>."], "ans": "3<i>x<\/i> − 5 = 11.5"}, {"lo": "LO4", "q": "In the equation 2(<i>k<\/i><i>x<\/i> − 3) = 5<i>x<\/i> + 4, <i>k<\/i> is a constant. If <i>x<\/i> = 2 is the solution, what is the value of <i>k<\/i>?", "steps": ["Substitute <i>x<\/i> = 2: 2(2<i>k<\/i> − 3) = 5(2) + 4.", "Simplify: 4<i>k<\/i> − 6 = 14.", "So 4<i>k<\/i> = 20 and <i>k<\/i> = 5."], "ans": "<i>k<\/i> = 5"}], "traps": ["Multiplying only the first term inside parentheses: 3(<i>x<\/i> − 4) is 3<i>x<\/i> − 12, not 3<i>x<\/i> − 4.", "Losing a sign with a negative factor: −2(<i>x<\/i> − 5) is −2<i>x<\/i> + 10, and a minus sign in front of parentheses flips every sign inside.", "Clearing fractions by multiplying only the fraction terms by the LCD and forgetting the whole number terms.", "Moving a term across the equals sign without changing its sign, when you are really subtracting it from both sides.", "Finding <i>x<\/i> and stopping when the question asks for an expression such as 2<i>x<\/i> − 3 or for an unknown constant."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">4<i>x<\/i> + 9 = 37<\/div>What is the value of <i>x<\/i>?", "opts": ["7", "0.25", "11.5", "28"], "ans": 0, "sol": "Subtract 9 from both sides: 4<i>x<\/i> = 28.<br>Divide by 4: <i>x<\/i> = 7.<br>Answer: <b>7<\/b>", "hint": "Undo the + 9 before you undo the multiplication by 4."}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "<div class=\"eqs\">3(<i>x<\/i> − 5) = 24<\/div>What is the value of <i>x<\/i>?", "ans": ["13"], "sol": "Divide both sides by 3: <i>x<\/i> − 5 = 8.<br>Add 5: <i>x<\/i> = 13.<br>Answer: <b>13<\/b>", "hint": "You can divide both sides by 3 first, or distribute the 3; either way works."}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">6<i>x<\/i> − 2<i>x<\/i> + 5 = 29<\/div>What is the value of <i>x<\/i>?", "opts": ["3", "6", "8.5", "24"], "ans": 1, "sol": "Combine like terms: 4<i>x<\/i> + 5 = 29.<br>Subtract 5: 4<i>x<\/i> = 24, so <i>x<\/i> = 6.<br>Answer: <b>6<\/b>", "hint": "Combine 6<i>x<\/i> and −2<i>x<\/i> into a single term first."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">9<i>x<\/i> + 4 = 5<i>x<\/i> + 24<\/div>What is the value of <i>x<\/i>?", "opts": ["2", "7", "5", "20"], "ans": 2, "sol": "Subtract 5<i>x<\/i>: 4<i>x<\/i> + 4 = 24.<br>Subtract 4: 4<i>x<\/i> = 20, so <i>x<\/i> = 5.<br>Answer: <b>5<\/b>", "hint": "Get the <i>x<\/i> terms together on the left by subtracting 5<i>x<\/i> from both sides."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\">2(3<i>x<\/i> + 1) − (<i>x<\/i> − 4) = 36<\/div>What is the value of <i>x<\/i>?", "opts": ["6.2", "6.4", "7.6", "6"], "ans": 3, "sol": "Distribute: 6<i>x<\/i> + 2 − <i>x<\/i> + 4 = 36. The minus sign changes −4 into +4.<br>Combine: 5<i>x<\/i> + 6 = 36.<br>So 5<i>x<\/i> = 30 and <i>x<\/i> = 6.<br>Answer: <b>6<\/b>", "hint": "The minus sign in front of (<i>x<\/i> − 4) acts like multiplying by −1."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "<div class=\"eqs\">5(<i>x<\/i> − 2) = 2<i>x<\/i> + 11<\/div>What is the value of <i>x<\/i>?", "ans": ["7"], "sol": "Distribute: 5<i>x<\/i> − 10 = 2<i>x<\/i> + 11.<br>Subtract 2<i>x<\/i> and add 10: 3<i>x<\/i> = 21.<br>So <i>x<\/i> = 7.<br>Answer: <b>7<\/b>", "hint": "Distribute the 5, then collect the <i>x<\/i> terms on one side."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i><\/span><span>4<\/span><\/span> + 3 = <span class=\"fq\"><span><i>x<\/i><\/span><span>6<\/span><\/span> + 5<\/div>What is the value of <i>x<\/i>?", "opts": ["24", "2", "4", "20"], "ans": 0, "sol": "Multiply every term by 12: 3<i>x<\/i> + 36 = 2<i>x<\/i> + 60.<br>Subtract 2<i>x<\/i> and 36: <i>x<\/i> = 24.<br>Answer: <b>24<\/b>", "hint": "Multiply every term, including the 3 and the 5, by the LCD of 4 and 6."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\">0.6<i>x<\/i> − 1.5 = 0.2<i>x<\/i> + 2.5<\/div>What is the value of <i>x<\/i>?", "opts": ["1", "10", "2.5", "5"], "ans": 1, "sol": "Subtract 0.2<i>x<\/i>: 0.4<i>x<\/i> − 1.5 = 2.5.<br>Add 1.5: 0.4<i>x<\/i> = 4.<br>Divide: <i>x<\/i> = 10.<br>Answer: <b>10<\/b>", "hint": "Collect the <i>x<\/i> terms; you can multiply everything by 10 first if you prefer whole numbers."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "If 5<i>x<\/i> + 15 = 40, what is the value of <i>x<\/i> + 3?", "opts": ["5", "11", "8", "25"], "ans": 2, "sol": "5<i>x<\/i> + 15 = 5(<i>x<\/i> + 3), so 5(<i>x<\/i> + 3) = 40.<br>Divide by 5: <i>x<\/i> + 3 = 8.<br>Answer: <b>8<\/b>", "hint": "Can you factor 5 out of 5<i>x<\/i> + 15?"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><span class=\"fq\"><span>2<i>x<\/i> − 1<\/span><span>3<\/span><\/span> − <span class=\"fq\"><span><i>x<\/i> + 2<\/span><span>4<\/span><\/span> = 1<\/div>What is the value of <i>x<\/i>?", "ans": ["22/5", "4.4"], "sol": "Multiply every term by 12: 4(2<i>x<\/i> − 1) − 3(<i>x<\/i> + 2) = 12.<br>Distribute: 8<i>x<\/i> − 4 − 3<i>x<\/i> − 6 = 12.<br>Combine: 5<i>x<\/i> − 10 = 12, so 5<i>x<\/i> = 22 and <i>x<\/i> = <span class=\"fq\"><span>22<\/span><span>5<\/span><\/span>.<br>Answer: <b>22/5<\/b> (or 4.4)", "hint": "Use parentheses around each numerator before multiplying by the LCD of 3 and 4."}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "Phone plan A costs $18 per month plus $0.25 per minute of calls. Plan B costs $30 per month plus $0.10 per minute. The equation 18 + 0.25<i>m<\/i> = 30 + 0.10<i>m<\/i> gives the number of minutes <i>m<\/i> for which the two plans cost the same. What is the value of <i>m<\/i>?", "opts": ["48", "120", "200", "80"], "ans": 3, "sol": "Subtract 0.10<i>m<\/i> and 18 from both sides: 0.15<i>m<\/i> = 12.<br>Divide: <i>m<\/i> = 80.<br>Answer: <b>80<\/b>", "hint": "Collect the <i>m<\/i> terms on the left and the dollar amounts on the right."}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "In the equation <i>a<\/i>(<i>x<\/i> + 2) = 3<i>x<\/i> + 10, <i>a<\/i> is a constant. If <i>x<\/i> = 4 is the solution to the equation, what is the value of <i>a<\/i>?", "opts": ["2", "<span class=\"fq\"><span>11<\/span><span>3<\/span><\/span>", "5", "<span class=\"fq\"><span>11<\/span><span>2<\/span><\/span>"], "ans": 1, "sol": "Substitute <i>x<\/i> = 4: <i>a<\/i>(6) = 3(4) + 10 = 22.<br>Divide by 6: <i>a<\/i> = <span class=\"fq\"><span>22<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>11<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>11<\/span><span>3<\/span><\/span><\/b>", "hint": "Replace every <i>x<\/i> with 4; the result is an equation you can solve for <i>a<\/i>."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">7<i>x<\/i> − 12 = 30<\/div>What is the value of <i>x<\/i>?", "opts": ["<span class=\"fq\"><span>18<\/span><span>7<\/span><\/span>", "18", "6", "42"], "ans": 2, "sol": "Add 12: 7<i>x<\/i> = 42.<br>Divide by 7: <i>x<\/i> = 6.<br>Answer: <b>6<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "<div class=\"eqs\">4(<i>x<\/i> + 3) = 44<\/div>What is the value of <i>x<\/i>?", "ans": ["8"], "sol": "Divide by 4: <i>x<\/i> + 3 = 11.<br>Subtract 3: <i>x<\/i> = 8.<br>Answer: <b>8<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "A gym charges a one time fee of $25 plus $15 per month. Priya paid $130 in total. The equation 25 + 15<i>m<\/i> = 130 represents this situation, where <i>m<\/i> is the number of months. What is the value of <i>m<\/i>?", "opts": ["7", "<span class=\"fq\"><span>26<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>31<\/span><span>3<\/span><\/span>", "105"], "ans": 0, "sol": "Subtract 25: 15<i>m<\/i> = 105.<br>Divide by 15: <i>m<\/i> = 7.<br>Answer: <b>7<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">8<i>x<\/i> − 3 = 5<i>x<\/i> + 12<\/div>What is the value of <i>x<\/i>?", "opts": ["3", "<span class=\"fq\"><span>15<\/span><span>13<\/span><\/span>", "15", "5"], "ans": 3, "sol": "Subtract 5<i>x<\/i>: 3<i>x<\/i> − 3 = 12.<br>Add 3: 3<i>x<\/i> = 15, so <i>x<\/i> = 5.<br>Answer: <b>5<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><span class=\"fq\"><span><i>x<\/i><\/span><span>5<\/span><\/span> − 2 = 4<\/div>What is the value of <i>x<\/i>?", "opts": ["1.2", "30", "6", "10"], "ans": 1, "sol": "Add 2: <span class=\"fq\"><span><i>x<\/i><\/span><span>5<\/span><\/span> = 6.<br>Multiply by 5: <i>x<\/i> = 30.<br>Answer: <b>30<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "If 3<i>x<\/i> = 21, what is the value of 3<i>x<\/i> + 8?", "opts": ["29", "15", "7", "71"], "ans": 0, "sol": "Since 3<i>x<\/i> = 21, 3<i>x<\/i> + 8 = 21 + 8 = 29. There is no need to find <i>x<\/i>.<br>Answer: <b>29<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\">3(2<i>x<\/i> − 5) − 2(<i>x<\/i> − 4) = 21<\/div>What is the value of <i>x<\/i>?", "opts": ["3.5", "4.5", "7", "11"], "ans": 2, "sol": "Distribute: 6<i>x<\/i> − 15 − 2<i>x<\/i> + 8 = 21.<br>Combine: 4<i>x<\/i> − 7 = 21.<br>So 4<i>x<\/i> = 28 and <i>x<\/i> = 7.<br>Answer: <b>7<\/b>"}, {"lo": "LO2", "diff /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
