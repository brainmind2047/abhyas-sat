var S = {"id": "PSDA-3.1", "unit": "Problem-Solving and Data Analysis", "topic": "Probability and statistical inference", "title": "Probability and conditional probability", "intro": "Probability measures how likely an event is, as a number from 0 to 1. On the DSAT it appears mostly through two-way tables: you choose the right count for the event and, above all, the right total to divide by, especially when a question says \"given that\" or \"of those who.\" You may also be asked for an expected count or whether two events are independent.", "los": [{"id": "LO1", "text": "Calculate the probability of an event as favorable outcomes divided by total outcomes, and use the complement rule P(not <i>A<\/i>) = 1 − P(<i>A<\/i>)."}, {"id": "LO2", "text": "Determine probabilities from a two-way table, including \"and,\" \"or\" and \"neither\" events, using the grand total as the denominator and filling in missing cells."}, {"id": "LO3", "text": "Determine conditional probabilities (\"given that,\" \"of those who\") by restricting the denominator to the correct row or column."}, {"id": "LO4", "text": "Calculate expected counts from a probability or a sample proportion, and work backward from a count to a probability or a total."}, {"id": "LO5", "text": "Identify whether two events are independent by comparing conditional probabilities, and use the multiplication rule for independent events."}], "notes": [{"lo": "LO1", "h": "Favorable over total", "html": "<p>When every outcome is equally likely, the probability of an event is a fraction:<\/p><div class=\"eqs\">P(event) = <span class=\"fq\"><span>number of favorable outcomes<\/span><span>total number of outcomes<\/span><\/span><\/div><p>A probability is always between 0 (impossible) and 1 (certain). It can be written as a fraction, a decimal or a percent: <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>, 0.25 and 25% all mean the same thing. On the DSAT, the counts usually come from a table or a graph, so find the total carefully before you divide.<\/p><svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of books read last month by 40 students: 0 books, 6 students; 1 book, 11; 2 books, 13; 3 books, 7; 4 books, 3\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\"><line x1=\"50\" y1=\"168.3\" x2=\"308\" y2=\"168.3\"/><line x1=\"50\" y1=\"142.6\" x2=\"308\" y2=\"142.6\"/><line x1=\"50\" y1=\"116.9\" x2=\"308\" y2=\"116.9\"/><line x1=\"50\" y1=\"91.1\" x2=\"308\" y2=\"91.1\"/><line x1=\"50\" y1=\"65.4\" x2=\"308\" y2=\"65.4\"/><line x1=\"50\" y1=\"39.7\" x2=\"308\" y2=\"39.7\"/><line x1=\"50\" y1=\"14.0\" x2=\"308\" y2=\"14.0\"/><\/g><rect class=\"fg-shape\" x=\"59.8\" y=\"116.9\" width=\"32.0\" height=\"77.1\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"111.4\" y=\"52.6\" width=\"32.0\" height=\"141.4\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"163.0\" y=\"26.9\" width=\"32.0\" height=\"167.1\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"214.6\" y=\"104.0\" width=\"32.0\" height=\"90.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"266.2\" y=\"155.4\" width=\"32.0\" height=\"38.6\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"194.0\" x2=\"308\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"14\" x2=\"50\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"44\" y=\"198.0\" text-anchor=\"end\">0<\/text><text x=\"44\" y=\"172.3\" text-anchor=\"end\">2<\/text><text x=\"44\" y=\"146.6\" text-anchor=\"end\">4<\/text><text x=\"44\" y=\"120.9\" text-anchor=\"end\">6<\/text><text x=\"44\" y=\"95.1\" text-anchor=\"end\">8<\/text><text x=\"44\" y=\"69.4\" text-anchor=\"end\">10<\/text><text x=\"44\" y=\"43.7\" text-anchor=\"end\">12<\/text><text x=\"44\" y=\"18.0\" text-anchor=\"end\">14<\/text><text x=\"75.8\" y=\"209.0\" text-anchor=\"middle\">0<\/text><text x=\"127.4\" y=\"209.0\" text-anchor=\"middle\">1<\/text><text x=\"179.0\" y=\"209.0\" text-anchor=\"middle\">2<\/text><text x=\"230.6\" y=\"209.0\" text-anchor=\"middle\">3<\/text><text x=\"282.2\" y=\"209.0\" text-anchor=\"middle\">4<\/text><text x=\"179.0\" y=\"232\" text-anchor=\"middle\">Number of books read<\/text><text x=\"14\" y=\"104.0\" text-anchor=\"middle\" transform=\"rotate(-90 14 104.0)\">Number of students<\/text><\/g><\/svg><p>The bar graph shows how many books each of 40 students read last month. If one student is chosen at random, P(exactly 2 books) = <span class=\"fq\"><span>13<\/span><span>40<\/span><\/span> = 0.325, because 13 of the 40 students are in that bar.<\/p><div class=\"rule\">Probability = favorable ÷ total. Make sure the total counts every outcome exactly once.<\/div><div class=\"tip\">For a probability in an SPR answer, a fraction such as 13/40 is the safest entry. Never round 0.3333… to 0.33; enter 1/3 or .3333.<\/div>"}, {"lo": "LO1", "h": "Complements", "html": "<p>The <b>complement<\/b> of an event <i>A<\/i> is the event \"<i>A<\/i> does not happen.\" Every outcome is either in <i>A<\/i> or not in <i>A<\/i>, so the two probabilities add up to 1.<\/p><div class=\"rule\">P(not <i>A<\/i>) = 1 − P(<i>A<\/i>)<\/div><p>Use the complement when the event you want is made of many pieces but its opposite is small. In the book graph above, \"at least 1 book\" covers four bars, but its opposite, \"0 books,\" is a single bar:<\/p><div class=\"eqs\">P(at least 1 book) = 1 − <span class=\"fq\"><span>6<\/span><span>40<\/span><\/span> = <span class=\"fq\"><span>34<\/span><span>40<\/span><\/span> = 0.85<\/div><p>Words that signal a complement include <b>not<\/b>, <b>at least one<\/b> (the opposite of \"none\") and <b>other than<\/b>. The same idea works when outcomes fall into several groups that do not overlap: their probabilities add up to 1, so a missing probability is 1 minus the others.<\/p><div class=\"tip\">If a probability is given as a percent, its complement is 100% minus that percent: a 12% chance of a delay means an 88% chance of no delay.<\/div>"}, {"lo": "LO2", "h": "Reading a two-way table", "html": "<p>A <b>two-way table<\/b> sorts the same group of people or objects by two categories at once. The table below shows 200 students by grade and by the one activity each chose.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Music<\/th><th>Sports<\/th><th>Debate<\/th><th>Total<\/th><\/tr><tr><th>Grade 11<\/th><td>28<\/td><td>46<\/td><td>16<\/td><td>90<\/td><\/tr><tr><th>Grade 12<\/th><td>34<\/td><td>52<\/td><td>24<\/td><td>110<\/td><\/tr><tr><th>Total<\/th><td>62<\/td><td>98<\/td><td>40<\/td><td>200<\/td><\/tr><\/table><\/div><ul><li>An <b>inner cell<\/b> counts members of one row <b>and<\/b> one column: 24 students are in grade 12 and in debate.<\/li><li>A <b>row total<\/b> or <b>column total<\/b> counts one category: 98 students chose sports.<\/li><li>The <b>grand total<\/b> (200) counts everyone.<\/li><\/ul><p>If a student is chosen at random from all 200, then P(grade 12 and debate) = <span class=\"fq\"><span>24<\/span><span>200<\/span><\/span> = 0.12 and P(sports) = <span class=\"fq\"><span>98<\/span><span>200<\/span><\/span> = 0.49.<\/p><div class=\"rule\">When the selection is made from the whole group, divide by the grand total.<\/div>"}, {"lo": "LO2", "h": "\"Or,\" \"neither\" and missing cells", "html": "<p>An <b>or<\/b> event includes everyone in either category. If you add a row total and a column total, the cell where they cross is counted twice, so subtract it once. Using the activity table above:<\/p><div class=\"eqs\">P(grade 11 or debate) = <span class=\"fq\"><span>90 + 40 − 16<\/span><span>200<\/span><\/span> = <span class=\"fq\"><span>114<\/span><span>200<\/span><\/span> = 0.57<\/div><p>Check by adding the separate cells: 28 + 46 + 16 + 24 = 114. <b>Neither<\/b> is the complement of \"or\": P(neither grade 11 nor debate) = 1 − 0.57 = 0.43, which matches the 34 + 52 = 86 grade 12 students in music or sports.<\/p><div class=\"rule\">P(<i>A<\/i> or <i>B<\/i>) = <span class=\"fq\"><span>count in <i>A<\/i> + count in <i>B<\/i> − count in both<\/span><span>total<\/span><\/span><\/div><p>Some tables arrive with blank cells. Every row and every column must add up to its total, so fill in the blanks first: find a cell in a row or column that has only one blank and subtract.<\/p><div class=\"tip\">Fill in the whole table before answering. It takes a few seconds and prevents most slips.<\/div>"}, {"lo": "LO3", "h": "Given that: shrink the denominator", "html": "<p>A <b>conditional probability<\/b> is a probability calculated inside one group only. Phrases such as <b>given that<\/b>, <b>of those who<\/b>, <b>among the<\/b> and <b>if a ___ is selected<\/b> tell you that the selection is made from that group, not from everyone.<\/p><div class=\"eqs\">P(<i>A<\/i> given <i>B<\/i>) = <span class=\"fq\"><span>number in both <i>A<\/i> and <i>B<\/i><\/span><span>number in <i>B<\/i><\/span><\/span><\/div><p>In the activity table, suppose a grade 12 student is selected at random. Only the 110 students in the grade 12 row can be chosen, so<\/p><div class=\"eqs\">P(debate given grade 12) = <span class=\"fq\"><span>24<\/span><span>110<\/span><\/span> = <span class=\"fq\"><span>12<\/span><span>55<\/span><\/span><\/div><p>If instead a debate student is selected, only the 40 students in the debate column can be chosen: P(grade 12 given debate) = <span class=\"fq\"><span>24<\/span><span>40<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>.<\/p><div class=\"rule\">For a conditional probability, the denominator is the total of the group you are choosing from: a row total or a column total, never the grand total.<\/div>"}, {"lo": "LO3", "h": "Which way round?", "html": "<p>P(<i>A<\/i> given <i>B<\/i>) and P(<i>B<\/i> given <i>A<\/i>) share the same numerator, the overlap cell, but usually have different denominators. Wrong answer choices on the DSAT are often the other direction.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Wording (activity table)<\/th><th>Choose from<\/th><th>Probability<\/th><\/tr><tr><th>If a grade 11 student is selected, the probability the student chose music<\/th><td>Grade 11 row (90)<\/td><td><span class=\"fq\"><span>28<\/span><span>90<\/span><\/span> = <span class=\"fq\"><span>14<\/span><span>45<\/span><\/span><\/td><\/tr><tr><th>Of the students who chose music, the fraction in grade 11<\/th><td>Music column (62)<\/td><td><span class=\"fq\"><span>28<\/span><span>62<\/span><\/span> = <span class=\"fq\"><span>14<\/span><span>31<\/span><\/span><\/td><\/tr><tr><th>A student is selected from all; the probability the student is in grade 11 and chose music<\/th><td>Everyone (200)<\/td><td><span class=\"fq\"><span>28<\/span><span>200<\/span><\/span> = <span class=\"fq\"><span>7<\/span><span>50<\/span><\/span><\/td><\/tr><\/table><\/div><div class=\"rule\">Name the group you are choosing from first, then count inside it.<\/div><div class=\"tip\">Underline the group after \"given that,\" \"of the\" or \"among the.\" That group's total is your denominator. Percent questions work the same way: \"What percent of the debate students are in grade 11?\" is <span class=\"fq\"><span>16<\/span><span>40<\/span><\/span> = 40%.<\/div>"}, {"lo": "LO4", "h": "Expected counts", "html": "<p>A probability predicts how often an event should happen in many trials or in a large group. The prediction is called an <b>expected count<\/b>.<\/p><div class=\"rule\">Expected count = (number of trials or members) × probability<\/div><ul><li>If the probability that a part is faulty is 0.03, then in 2,000 parts about 2,000 × 0.03 = 60 are expected to be faulty.<\/li><li>A random sample works the same way: if 18 of 120 sampled residents walk to work, the proportion is <span class=\"fq\"><span>18<\/span><span>120<\/span><\/span> = 0.15, so in a town of 3,400 residents about 0.15 × 3,400 = 510 are expected to walk.<\/li><li>For a subgroup, use the proportion <b>within that subgroup<\/b> and multiply by the size of the subgroup.<\/li><\/ul><p>To work backward, divide: if 8% of the tickets in a draw are winners and 24 tickets win, there are 24 ÷ 0.08 = 300 tickets.<\/p><div class=\"tip\">An expected count is an average prediction, so it does not have to be a whole number, and the actual count can differ from it.<\/div>"}, {"lo": "LO5", "h": "Independent events", "html": "<p>Two events are <b>independent<\/b> if knowing that one happened does not change the probability of the other. In symbols, P(<i>A<\/i> given <i>B<\/i>) = P(<i>A<\/i>). The table records whether a school bus arrived late on 70 days.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Late<\/th><th>On time<\/th><th>Total<\/th><\/tr><tr><th>Rainy day<\/th><td>6<\/td><td>14<\/td><td>20<\/td><\/tr><tr><th>Dry day<\/th><td>15<\/td><td>35<\/td><td>50<\/td><\/tr><tr><th>Total<\/th><td>21<\/td><td>49<\/td><td>70<\/td><\/tr><\/table><\/div><p>P(late given rainy) = <span class=\"fq\"><span>6<\/span><span>20<\/span><\/span> = 0.3, P(late given dry) = <span class=\"fq\"><span>15<\/span><span>50<\/span><\/span> = 0.3 and P(late) = <span class=\"fq\"><span>21<\/span><span>70<\/span><\/span> = 0.3. The rate is the same in every row, so in these data \"late\" and \"rainy\" are independent.<\/p><div class=\"rule\">Independent: the proportion is the same in every row (or every column). Compare rates, not raw counts.<\/div><p>For independent events, P(<i>A<\/i> and <i>B<\/i>) = P(<i>A<\/i>) × P(<i>B<\/i>). Separate spins, coin tosses and draws <b>with replacement<\/b> are independent: two tosses of a fair coin give P(two heads) = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> × <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>. Draws <b>without<\/b> replacement are not independent, because the first draw changes what is left.<\/p>"}], "examples": [{"lo": "LO1", "q": "A bowl holds 12 lemon, 9 mango and 15 orange candies. One candy is picked at random. What is the probability that it is <b>not<\/b> a mango candy?", "steps": ["Total candies: 12 + 9 + 15 = 36.", "P(mango) = <span class=\"fq\"><span>9<\/span><span>36<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>.", "Complement: P(not mango) = 1 − <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>. (Check: <span class=\"fq\"><span>12 + 15<\/span><span>36<\/span><\/span> = <span class=\"fq\"><span>27<\/span><span>36<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>.)"], "ans": "<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>"}, {"lo": "LO1", "q": "<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of goals scored in 30 matches: 0 goals, 4 matches; 1 goal, 9; 2 goals, 8; 3 goals, 6; 4 goals, 3\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\"><line x1=\"50\" y1=\"158.0\" x2=\"308\" y2=\"158.0\"/><line x1=\"50\" y1=\"122.0\" x2=\"308\" y2=\"122.0\"/><line x1=\"50\" y1=\"86.0\" x2=\"308\" y2=\"86.0\"/><line x1=\"50\" y1=\"50.0\" x2=\"308\" y2=\"50.0\"/><line x1=\"50\" y1=\"14.0\" x2=\"308\" y2=\"14.0\"/><\/g><rect class=\"fg-shape\" x=\"59.8\" y=\"122.0\" width=\"32.0\" height=\"72.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"111.4\" y=\"32.0\" width=\"32.0\" height=\"162.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"163.0\" y=\"50.0\" width=\"32.0\" height=\"144.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"214.6\" y=\"86.0\" width=\"32.0\" height=\"108.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"266.2\" y=\"140.0\" width=\"32.0\" height=\"54.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"194.0\" x2=\"308\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"14\" x2=\"50\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"44\" y=\"198.0\" text-anchor=\"end\">0<\/text><text x=\"44\" y=\"162.0\" text-anchor=\"end\">2<\/text><text x=\"44\" y=\"126.0\" text-anchor=\"end\">4<\/text><text x=\"44\" y=\"90.0\" text-anchor=\"end\">6<\/text><text x=\"44\" y=\"54.0\" text-anchor=\"end\">8<\/text><text x=\"44\" y=\"18.0\" text-anchor=\"end\">10<\/text><text x=\"75.8\" y=\"209.0\" text-anchor=\"middle\">0<\/text><text x=\"127.4\" y=\"209.0\" text-anchor=\"middle\">1<\/text><text x=\"179.0\" y=\"209.0\" text-anchor=\"middle\">2<\/text><text x=\"230.6\" y=\"209.0\" text-anchor=\"middle\">3<\/text><text x=\"282.2\" y=\"209.0\" text-anchor=\"middle\">4<\/text><text x=\"179.0\" y=\"232\" text-anchor=\"middle\">Goals scored in a match<\/text><text x=\"14\" y=\"104.0\" text-anchor=\"middle\" transform=\"rotate(-90 14 104.0)\">Number of matches<\/text><\/g><\/svg>The bar graph shows the number of goals a school football team scored in each of its 30 matches last season. If one of these matches is selected at random, what is the probability that the team scored more than 1 goal?", "steps": ["\"More than 1 goal\" means 2, 3 or 4 goals: 8 + 6 + 3 = 17 matches.", "The total is 30 matches (4 + 9 + 8 + 6 + 3 = 30).", "P(more than 1 goal) = <span class=\"fq\"><span>17<\/span><span>30<\/span><\/span>. Using the complement gives the same result: 1 − <span class=\"fq\"><span>4 + 9<\/span><span>30<\/span><\/span> = <span class=\"fq\"><span>17<\/span><span>30<\/span><\/span>."], "ans": "<span class=\"fq\"><span>17<\/span><span>30<\/span><\/span>"}, {"lo": "LO2", "q": "A science museum asked 240 visitors which exhibit they liked best.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Age group<\/th><th>Space<\/th><th>Dinosaurs<\/th><th>Robots<\/th><th>Total<\/th><\/tr><tr><th>Child<\/th><td>34<\/td><td>46<\/td><td>20<\/td><td>100<\/td><\/tr><tr><th>Adult<\/th><td>62<\/td><td>38<\/td><td>40<\/td><td>140<\/td><\/tr><tr><th>Total<\/th><td>96<\/td><td>84<\/td><td>60<\/td><td>240<\/td><\/tr><\/table><\/div>If one of these visitors is selected at random, what is the probability that the visitor is an adult or liked the dinosaur exhibit best?<br>A) <span class=\"fq\"><span>19<\/span><span>120<\/span><\/span><br>B) <span class=\"fq\"><span>7<\/span><span>12<\/span><\/span><br>C) <span class=\"fq\"><span>31<\/span><span>40<\/span><\/span><br>D) <span class=\"fq\"><span>14<\/span><span>15<\/span><\/span>", "steps": ["The selection is from all 240 visitors, so the denominator is 240.", "Adults: 140. Dinosaur fans: 84. Adults who chose dinosaurs are in both groups: 38.", "Count each visitor once: 140 + 84 − 38 = 186.", "P = <span class=\"fq\"><span>186<\/span><span>240<\/span><\/span> = <span class=\"fq\"><span>31<\/span><span>40<\/span><\/span>, choice C. Choice D forgets to subtract the overlap; choice A is the \"and\" probability."], "ans": "C) <span class=\"fq\"><span>31<\/span><span>40<\/span><\/span>"}, {"lo": "LO3", "q": "An invented study followed 400 adults through one flu season.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Caught flu<\/th><th>Did not catch flu<\/th><th>Total<\/th><\/tr><tr><th>Flu shot<\/th><td>20<\/td><td>230<\/td><td>250<\/td><\/tr><tr><th>No flu shot<\/th><td>33<\/td><td>117<\/td><td>150<\/td><\/tr><tr><th>Total<\/th><td>53<\/td><td>347<\/td><td>400<\/td><\/tr><\/table><\/div>If a person who caught the flu is selected at random, what is the probability that the person had a flu shot?<br>A) <span class=\"fq\"><span>20<\/span><span>53<\/span><\/span><br>B) <span class=\"fq\"><span>2<\/span><span>25<\/span><\/span><br>C) <span class=\"fq\"><span>1<\/span><span>20<\/span><\/span><br>D) <span class=\"fq\"><span>53<\/span><span>400<\/span><\/span>", "steps": ["\"A person who caught the flu\" names the group: the Caught flu column, with 53 people.", "Inside that column, 20 people had a flu shot.", "P = <span class=\"fq\"><span>20<\/span><span>53<\/span><\/span>, choice A. Choice B, <span class=\"fq\"><span>20<\/span><span>250<\/span><\/span>, uses the flu shot row instead; choice C uses the grand total."], "ans": "A) <span class=\"fq\"><span>20<\/span><span>53<\/span><\/span>"}, {"lo": "LO3", "q": "Using the flu study table above, find the probability that a person who had a flu shot caught the flu, and compare it with the answer to the previous example.", "steps": ["Now the group is the Flu shot row: 250 people.", "Inside that row, 20 caught the flu, so P(caught flu given flu shot) = <span class=\"fq\"><span>20<\/span><span>250<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>25<\/span><\/span> = 0.08.", "The previous answer, P(flu shot given caught flu) = <span class=\"fq\"><span>20<\/span><span>53<\/span><\/span> ≈ 0.38, has the same numerator but a different denominator. The order of the condition matters."], "ans": "<span class=\"fq\"><span>2<\/span><span>25<\/span><\/span>"}, {"lo": "LO4", "q": "In a random sample of 150 customers of a grocery chain, 42 said they would use a home delivery service. The chain has 2,500 regular customers. Based on the sample, how many of the regular customers would be expected to use the service? (SPR)", "steps": ["Sample proportion: <span class=\"fq\"><span>42<\/span><span>150<\/span><\/span> = 0.28.", "Expected count: 0.28 × 2,500 = 700.", "Enter 700."], "ans": "700"}, {"lo": "LO5", "q": "A school recorded whether each of 300 students wears glasses and whether the student plays a musical instrument.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Wears glasses<\/th><th>No glasses<\/th><th>Total<\/th><\/tr><tr><th>Plays an instrument<\/th><td>36<\/td><td>84<\/td><td>120<\/td><\/tr><tr><th>No instrument<\/th><td>54<\/td><td>126<\/td><td>180<\/td><\/tr><tr><th>Total<\/th><td>90<\/td><td>210<\/td><td>300<\/td><\/tr><\/table><\/div>Are the events \"wears glasses\" and \"plays an instrument\" independent for these students?", "steps": ["P(glasses) = <span class=\"fq\"><span>90<\/span><span>300<\/span><\/span> = 0.3.", "P(glasses given instrument) = <span class=\"fq\"><span>36<\/span><span>120<\/span><\/span> = 0.3.", "P(glasses given no instrument) = <span class=\"fq\"><span>54<\/span><span>180<\/span><\/span> = 0.3.", "The rate is the same in both rows and overall, so the events are independent."], "ans": "Yes: P(glasses given instrument) = P(glasses) = 0.3"}], "traps": ["Dividing by the grand total in a \"given that\" or \"of those who\" question. The denominator must be the total of the group named after those words: one row or one column.", "Reading the condition the wrong way round. P(flu shot given flu) and P(flu given flu shot) share a numerator but have different denominators; the wrong direction is usually one of the answer choices.", "Counting the overlap twice in an \"or\" question. Row total + column total counts the shared cell twice, so subtract it once.", "Answering P(<i>A<\/i>) when the question asks for P(not <i>A<\/i>), or listing the pieces of \"at least one\" and missing some. Use 1 − P(<i>A<\/i>) instead.", "Adding the probabilities of independent events when both must happen. For \"A and B\" with independent events, multiply.", "Judging independence from raw counts. Equal counts do not mean independence; compare the proportions in each row or column."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Each of the integers from 1 to 20 is written on a separate card, and one card is drawn at random. What is the probability that the number on the card is a multiple of 3?", "opts": ["<span class=\"fq\"><span>3<\/span><span>10<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>7<\/span><\/span>", "<span class=\"fq\"><span>7<\/span><span>10<\/span><\/span>"], "ans": 0, "sol": "The multiples of 3 from 1 to 20 are 3, 6, 9, 12, 15 and 18: 6 numbers.<br>There are 20 cards in all.<br>P = <span class=\"fq\"><span>6<\/span><span>20<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>10<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>3<\/span><span>10<\/span><\/span><\/b>", "hint": "List the multiples of 3 that are 20 or less and count them. What is the total number of cards?"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of pets owned by 50 households: 0 pets, 14 households; 1 pet, 18; 2 pets, 11; 3 pets, 5; 4 pets, 2\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\"><line x1=\"50\" y1=\"158.0\" x2=\"308\" y2=\"158.0\"/><line x1=\"50\" y1=\"122.0\" x2=\"308\" y2=\"122.0\"/><line x1=\"50\" y1=\"86.0\" x2=\"308\" y2=\"86.0\"/><line x1=\"50\" y1=\"50.0\" x2=\"308\" y2=\"50.0\"/><line x1=\"50\" y1=\"14.0\" x2=\"308\" y2=\"14.0\"/><\/g><rect class=\"fg-shape\" x=\"59.8\" y=\"68.0\" width=\"32.0\" height=\"126.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"111.4\" y=\"32.0\" width=\"32.0\" height=\"162.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"163.0\" y=\"95.0\" width=\"32.0\" height=\"99.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"214.6\" y=\"149.0\" width=\"32.0\" height=\"45.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"266.2\" y=\"176.0\" width=\"32.0\" height=\"18.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"194.0\" x2=\"308\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"14\" x2=\"50\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"44\" y=\"198.0\" text-anchor=\"end\">0<\/text><text x=\"44\" y=\"162.0\" text-anchor=\"end\">4<\/text><text x=\"44\" y=\"126.0\" text-anchor=\"end\">8<\/text><text x=\"44\" y=\"90.0\" text-anchor=\"end\">12<\/text><text x=\"44\" y=\"54.0\" text-anchor=\"end\">16<\/text><text x=\"44\" y=\"18.0\" text-anchor=\"end\">20<\/text><text x=\"75.8\" y=\"209.0\" text-anchor=\"middle\">0<\/text><text x=\"127.4\" y=\"209.0\" text-anchor=\"middle\">1<\/text><text x=\"179.0\" y=\"209.0\" text-anchor=\"middle\">2<\/text><text x=\"230.6\" y=\"209.0\" text-anchor=\"middle\">3<\/text><text x=\"282.2\" y=\"209.0\" text-anchor=\"middle\">4<\/text><text x=\"179.0\" y=\"232\" text-anchor=\"middle\">Number of pets<\/text><text x=\"14\" y=\"104.0\" text-anchor=\"middle\" transform=\"rotate(-90 14 104.0)\">Number of households<\/text><\/g><\/svg>The bar graph shows the number of pets owned by each of 50 households on one street. If one of these households is selected at random, what is the probability that it owns at least one pet?", "ans": ["18/25", "36/50", ".72", "0.72"], "sol": "The opposite of \"at least one pet\" is \"no pets\": 14 households.<br>P(no pets) = <span class=\"fq\"><span>14<\/span><span>50<\/span><\/span>.<br>P(at least one) = 1 − <span class=\"fq\"><span>14<\/span><span>50<\/span><\/span> = <span class=\"fq\"><span>36<\/span><span>50<\/span><\/span> = <span class=\"fq\"><span>18<\/span><span>25<\/span><\/span> = 0.72.<br>Answer: <b><span class=\"fq\"><span>18<\/span><span>25<\/span><\/span><\/b>", "hint": "Which single bar shows the households that do <b>not<\/b> own at least one pet?"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A coaching center recorded the extra class chosen by each of its 120 students.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Math<\/th><th>Physics<\/th><th>Chemistry<\/th><th>Total<\/th><\/tr><tr><th>Grade 11<\/th><td>22<\/td><td>15<\/td><td>13<\/td><td>50<\/td><\/tr><tr><th>Grade 12<\/th><td>28<\/td><td>24<\/td><td>18<\/td><td>70<\/td><\/tr><tr><th>Total<\/th><td>50<\/td><td>39<\/td><td>31<\/td><td>120<\/td><\/tr><\/table><\/div>If one of these students is selected at random, what is the probability that the student is in grade 12 and chose physics?", "opts": ["<span class=\"fq\"><span>1<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>13<\/span><span>40<\/span><\/span>", "<span class=\"fq\"><span>12<\/span><span>35<\/span><\/span>", "<span class=\"fq\"><span>8<\/span><span>13<\/span><\/span>"], "ans": 0, "sol": "\"Grade 12 and physics\" is one cell: 24 students.<br>The student is selected from all 120 students.<br>P = <span class=\"fq\"><span>24<\/span><span>120<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>5<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>1<\/span><span>5<\/span><\/span><\/b>", "hint": "\"And\" points to a single cell. Since the student is chosen from all of them, which total goes in the denominator?"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A box contains 60 tiles. Each tile is red or blue and is a square, a circle or a triangle.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Square<\/th><th>Circle<\/th><th>Triangle<\/th><th>Total<\/th><\/tr><tr><th>Red<\/th><td>8<\/td><td>12<\/td><td>10<\/td><td>30<\/td><\/tr><tr><th>Blue<\/th><td>14<\/td><td>6<\/td><td>10<\/td><td>30<\/td><\/tr><tr><th>Total<\/th><td>22<\/td><td>18<\/td><td>20<\/td><td>60<\/td><\/tr><\/table><\/div>If one tile is selected at random from the box, what is the probability that it is a square?", "opts": ["<span class=\"fq\"><span>2<\/span><span>15<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>11<\/span><span>30<\/span><\/span>", "<span class=\"fq\"><span>11<\/span><span>15<\/span><\/span>"], "ans": 2, "sol": "Squares of either color: 8 + 14 = 22, the total of the Square column.<br>All 60 tiles can be chosen.<br>P = <span class=\"fq\"><span>22<\/span><span>60<\/span><\/span> = <span class=\"fq\"><span>11<\/span><span>30<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>11<\/span><span>30<\/span><\/span><\/b>", "hint": "You want every square, red or blue. Which total in the table counts them?"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A survey of 250 commuters recorded whether each uses the metro and whether each owns a car. Some values are missing from the table.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Owns a car<\/th><th>No car<\/th><th>Total<\/th><\/tr><tr><th>Uses metro<\/th><td>35<\/td><td><\/td><td>130<\/td><\/tr><tr><th>No metro<\/th><td><\/td><td>40<\/td><td><\/td><\/tr><tr><th>Total<\/th><td>115<\/td><td><\/td><td>250<\/td><\/tr><\/table><\/div>If one of these commuters is selected at random, what is the probability that the commuter uses the metro and does not own a car?", "opts": ["<span class=\"fq\"><span>7<\/span><span>50<\/span><\/span>", "<span class=\"fq\"><span>13<\/span><span>25<\/span><\/span>", "<span class=\"fq\"><span>19<\/span><span>26<\/span><\/span>", "<span class=\"fq\"><span>19<\/span><span>50<\/span><\/span>"], "ans": 3, "sol": "Uses metro, no car: 130 − 35 = 95.<br>The commuter is chosen from all 250.<br>P = <span class=\"fq\"><span>95<\/span><span>250<\/span><\/span> = <span class=\"fq\"><span>19<\/span><span>50<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>19<\/span><span>50<\/span><\/span><\/b>", "hint": "Look along the Uses metro row: you know its total and one of its cells."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "In an invented experiment, 90 tomato plants were given fertilizer A, fertilizer B or no fertilizer, and the researchers recorded whether each plant produced fruit.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Fruit<\/th><th>No fruit<\/th><th>Total<\/th><\/tr><tr><th>Fertilizer A<\/th><td>24<\/td><td>6<\/td><td>30<\/td><\/tr><tr><th>Fertilizer B<\/th><td>21<\/td><td>9<\/td><td>30<\/td><\/tr><tr><th>No fertilizer<\/th><td>12<\/td><td>18<\/td><td>30<\/td><\/tr><tr><th>Total<\/th><td>57<\/td><td>33<\/td><td>90<\/td><\/tr><\/table><\/div>If a plant that was given fertilizer B is selected at random, what is the probability that it produced fruit?", "opts": ["<span class=\"fq\"><span>7<\/span><span>30<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>7<\/span><span>19<\/span><\/span>", "<span class=\"fq\"><span>7<\/span><span>10<\/span><\/span>"], "ans": 3, "sol": "\"A plant that was given fertilizer B\" limits the choice to the Fertilizer B row: 30 plants.<br>21 of them produced fruit.<br>P = <span class=\"fq\"><span>21<\/span><span>30<\/span><\/span> = <span class=\"fq\"><span>7<\/span><span>10<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>7<\/span><span>10<\/span><\/span><\/b>", "hint": "Only plants in one row can be chosen. How many plants are in that row?"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A cafe recorded the size and type of 400 drink orders.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Small<\/th><th>Medium<\/th><th>Large<\/th><th>Total<\/th><\/tr><tr><th>Hot<\/th><td>70<\/td><td>96<\/td><td>54<\/td><td>220<\/td><\/tr><tr><th>Iced<\/th><td>30<\/td><td>104<\/td><td>46<\/td><td>180<\/td><\/tr><tr><th>Total<\/th><td>100<\/td><td>200<\/td><td>100<\/td><td>400<\/td><\/tr><\/table><\/div>What percent of the medium orders were iced? (Disregard the % sign when entering your answer.)", "ans": ["52"], "sol": "\"Of the medium orders\" means the Medium column: 96 + 104 = 200 orders.<br>Iced medium orders: 104.<br><span class=\"fq\"><span>104<\/span><span>200<\/span><\/span> = 0.52 = 52%.<br>Answer: <b>52<\/b>", "hint": "\"Of the medium orders\" tells you the denominator. Which column total is that?"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A teacher recorded whether each of 300 students studied with flashcards and whether the student scored 80 or higher on a test.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Scored 80 or higher<\/th><th>Scored below 80<\/th><th>Total<\/th><\/tr><tr><th>Used flashcards<\/th><td>48<\/td><td>32<\/td><td>80<\/td><\/tr><tr><th>No flashcards<\/th><td>72<\/td><td>148<\/td><td>220<\/td><\/tr><tr><th>Total<\/th><td>120<\/td><td>180<\/td><td>300<\/td><\/tr><\/table><\/div>If a student who scored 80 or higher is selected at random, what is the probability that the student used flashcards?", "opts": ["<span class=\"fq\"><span>4<\/span><span>25<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>15<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>"], "ans": 2, "sol": "The group is the students who scored 80 or higher: 48 + 72 = 120.<br>48 of them used flashcards.<br>P = <span class=\"fq\"><span>48<\/span><span>120<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>. (Choice D, <span class=\"fq\"><span>48<\/span><span>80<\/span><\/span>, is the other direction.)<br>Answer: <b><span class=\"fq\"><span>2<\/span><span>5<\/span><\/span><\/b>", "hint": "The group you select from comes right after \"a student who.\" Find that group's total."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The probability that a seed from a certain packet germinates is 0.85. A farmer plants 1,200 of these seeds. How many seeds are expected <b>not<\/b> to germinate?", "opts": ["180", "350", "1,020", "1,380"], "ans": 0, "sol": "P(not germinate) = 1 − 0.85 = 0.15.<br>Expected count: 0.15 × 1,200 = 180.<br>Answer: <b>180<\/b>", "hint": "First find the probability that a seed does not germinate, then use it with all 1,200 seeds."}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "A random sample of 80 households in a town was surveyed about internet service and streaming.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Fiber<\/th><th>Cable<\/th><th>No internet<\/th><th>Total<\/th><\/tr><tr><th>Has streaming<\/th><td>18<\/td><td>14<\/td><td>2<\/td><td>34<\/td><\/tr><tr><th>No streaming<\/th><td>6<\/td><td>22<\/td><td>18<\/td><td>46<\/td><\/tr><tr><th>Total<\/th><td>24<\/td><td>36<\/td><td>20<\/td><td>80<\/td><\/tr><\/table><\/div>Town records show that 2,000 households in the town have fiber internet. Based on the sample, how many of these 2,000 households would be expected to have a streaming subscription?", "ans": ["1500"], "sol": "Use the fiber households in the sample only: 18 + 6 = 24.<br>Of these, 18 have streaming: <span class=\"fq\"><span>18<\/span><span>24<\/span><\/span> = 0.75.<br>Expected count: 0.75 × 2,000 = 1,500.<br>Answer: <b>1500<\/b>", "hint": "The 2,000 households all have fiber. What proportion of the <b>fiber<\/b> households in the sample have streaming?"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Spinner P has 5 equal sections numbered 1 to 5. Spinner Q has 4 equal sections colored red, red, blue and green. Each spinner is spun once. What is the probability that spinner P lands on an even number and spinner Q lands on red?", "opts": ["<span class=\"fq\"><span>1<\/span><span>10<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>9<\/span><\/span>", "<span class=\"fq\"><span>9<\/span><span>10<\/span><\/span>"], "ans": 1, "sol": "P(even on spinner P) = <span class=\"fq\"><span>2<\/span><span>5<\/span><\/span> (the numbers 2 and 4).<br>P(red on spinner Q) = <span class=\"fq\"><span>2<\/span><span>4<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>.<br>The spins are independent, so multiply: <span class=\"fq\"><span>2<\/span><span>5<\/span><\/span> × <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>5<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>1<\/span><span>5<\/span><\/span><\/b>", "hint": "The two spins do not affect each other. Find each probability separately; then decide whether to add or multiply."}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A factory inspected the items made during its morning and evening shifts. The table shows the results, where <i>k<\/i> is the number of defective items from the evening shift.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Defective<\/th><th>Not defective<\/th><\/tr><tr><th>Morning shift<\/th><td>12<\/td><td>228<\/td><\/tr><tr><th>Evening shift<\/th><td><i>k<\/i><\/td><td>152<\/td><\/tr><\/table><\/div>For which value of <i>k<\/i> are the events \"an item is defective\" and \"an item was made during the morning shift\" independent?", "opts": ["7.6", "8", "12", "20"], "ans": 1, "sol": "Independence means the defective rate is the same for both shifts.<br>Morning rate: <span class=\"fq\"><span>12<\/span><span>12 + 228<\/span><\/span> = <span class=\"fq\"><span>12<\/span><span>240<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>20<\/span><\/span>.<br>Evening rate: <span class=\"fq\"><span><i>k<\/i><\/span><span><i>k<\/i> + 152<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>20<\/span><\/span>, so 20<i>k<\/i> = <i>k<\/i> + 152 and <i>k<\/i> = 8.<br>Answer: <b>8<\/b>", "hint": "Write the defective rate for each shift as a fraction. Remember the evening total includes the <i>k<\/i> defective items."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A bag contains 5 red marbles, 8 green marbles and 7 yellow marbles. If one marble is selected at random, what is the probability that it is green?", "opts": ["<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>"], "ans": 1, "sol": "Total marbles: 5 + 8 + 7 = 20.<br>P(green) = <span class=\"fq\"><span>8<\/span><span>20<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>2<\/span><span>5<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "A weather service gives a probability of 0.35 that it will rain in a certain town tomorrow. Based on this, what is the probability that it will not rain in the town tomorrow?", "ans": [".65", "0.65", "13/20"], "sol": "Not raining is the complement of raining.<br>P(no rain) = 1 − 0.35 = 0.65.<br>Answer: <b>0.65<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A survey asked 150 adults for their main source of news.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Age<\/th><th>TV<\/th><th>Online<\/th><th>Print<\/th><th>Total<\/th><\/tr><tr><th>Under 40<\/th><td>18<\/td><td>54<\/td><td>8<\/td><td>80<\/td><\/tr><tr><th>40 and over<\/th><td>32<\/td><td>26<\/td><td>12<\/td><td>70<\/td><\/tr><tr><th>Total<\/th><td>50<\/td><td>80<\/td><td>20<\/td><td>150<\/td><\/tr><\/table><\/div>If one of these adults is selected at random, what is the probability that the adult's main source of news is print?", "opts": ["<span class=\"fq\"><span>1<\/span><span>10<\/span><\/span>", "<span class=\"fq\"><span>6<\/span><span>35<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>15<\/span><\/span>"], "ans": 3, "sol": "Print, any age: 8 + 12 = 20 adults.<br>The adult is chosen from all 150.<br>P = <span class=\"fq\"><span>20<\/span><span>150<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>15<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>2<\/span><span>15<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A jar contains 72 marbles. Each marble is red or white and is large or small.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Large<\/th><th>Small<\/th><th>Total<\/th><\/tr><tr><th>Red<\/th><td>15<\/td><td>25<\/td><td>40<\/td><\/tr><tr><th>White<\/th><td>8<\/td><td>24<\/td><td>32<\/td><\/tr><tr><th>Total<\/th><td>23<\/td><td>49<\/td><td>72<\/td><\/tr><\/table><\/div>If a white marble is selected at random from the jar, what is the probability that it is large?", "opts": ["<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>9<\/span><\/span>", "<span class=\"fq\"><span>8<\/span><span>23<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>9<\/span><\/span>"], "ans": 0, "sol": "Only white marbles can be chosen: 8 + 24 = 32.<br>8 of them are large.<br>P = <span class=\"fq\"><span>8<\/span><span>32<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>1<\/span><span>4<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A fair six-sided die is rolled 120 times. How many times would you expect the result to be a 5 or a 6?", "opts": ["20", "60", "40", "80"], "ans": 2, "sol": "P(5 or 6) = <span class=\"fq\"><span>2<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>.<br>Expected count: <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> × 120 = 40.<br>Answer: <b>40<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "A fair coin is tossed and a fair six-sided die is rolled. What is the probability that the coin lands heads and the die shows a number less than 3?", "opts": ["<span class=\"fq\"><span>1<\/span><span>12<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>6<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>5<\/span><span>6<\/span><\/span>"], "ans": 1, "sol": "P(heads) = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>. P(less than 3) = P(1 or 2) = <span class=\"fq\"><span>2<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>.<br>The coin and die are independent, so multiply: <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> × <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>6<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>1<\/span><span>6<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of ratings from 50 customers: 1 star, 4 customers; 2 stars, 6; 3 stars, 10; 4 stars, 18; 5 stars, 12\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\"><line x1=\"50\" y1=\"158.0\" x2=\"308\" y2=\"158.0\"/><line x1=\"50\" y1=\"122.0\" x2=\"308\" y2=\"122.0\"/><line x1=\"50\" y1=\"86.0\" x2=\"308\" y2=\"86.0\"/><line x1=\"50\" y1=\"50.0\" x2=\"308\" y2=\"50.0\"/><line x1=\"50\" y1=\"14.0\" x2=\"308\" y2=\"14.0\"/><\/g><rect class=\"fg-shape\" x=\"59.8\" y=\"158.0\" width=\"32.0\" height=\"36.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"111.4\" y=\"140.0\" width=\"32.0\" height=\"54.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"163.0\" y=\"104.0\" width=\"32.0\" height=\"90.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"214.6\" y=\"32.0\" width=\"32.0\" height=\"162.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"266.2\" y=\"86.0\" width=\"32.0\" height=\"108.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"194.0\" x2=\"308\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"14\" x2=\"50\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"44\" y=\"198.0\" text-anchor=\"end\">0<\/text><text x=\"44\" y=\"162.0\" text-anchor=\"end\">4<\/text><text x=\"44\" y=\"126.0\" text-anchor=\"end\">8<\/text><text x=\"44\" y=\"90.0\" text-anchor=\"end\">12<\/text><text x=\"44\" y=\"54.0\" text-anchor=\"end\">16<\/text><text x=\"44\" y=\"18.0\" text-anchor=\"end\">20<\/text><text x=\"75.8\" y=\"209.0\" text-anchor=\"middle\">1<\/text><text x=\"127.4\" y=\"209.0\" text-anchor=\"middle\">2<\/text><text x=\"179.0\" y=\"209.0\" text-anchor=\"middle\">3<\/text><text x=\"230.6\" y=\"209.0\" text-anchor=\"middle\">4<\/text><text x=\"282.2\" y=\"209.0\" text-anchor=\"middle\">5<\/text><text x=\"179.0\" y=\"232\" text-anchor=\"middle\">Rating (stars)<\/text><text x=\"14\" y=\"104.0\" text-anchor=\"middle\" transform=\"rotate(-90 14 104.0)\">Number of customers<\/text><\/g><\/svg>The bar graph shows the ratings given by 50 customers to a new product. If one of these customers is selected at random, what is the probability that the customer gave a rating that is neither 3 stars nor 5 stars?", "opts": ["<span class=\"fq\"><span>11<\/span><span>25<\/span><\/span>", "<span class=\"fq\"><span>19<\/span><span>25<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>14<\/span><span>25<\/span><\/span>"], "ans": 3, "sol": "Customers who gave 3 or 5 stars: 10 + 12 = 22.<br>Customers who gave neither: 50 − 22 = 28.<br>P = <span class=\"fq\"><span>28<\/span><span>50<\/span><\/span> = <span class=\"fq\"><span>14<\/span><span>25<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>14<\/span><span>25<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A deck has 40 cards. Each card is blue or yellow and shows either a circle or a star.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Circle<\/th><th>Star<\/th><th>Total<\/th><\/tr><tr><th>Blue<\/th><td>9<\/td><td>11<\/td><td>20<\/td><\/tr><tr><th>Yellow<\/th><td>14<\/td><td>6<\/td><td>20<\/td><\/tr><tr><th>Total<\/th><td>23<\/td><td>17<\/td><td>40<\/td><\/tr><\/table><\/div>If one card is drawn at random, what is the probability that it is neither yellow nor a star?", "opts": ["<span class=\"fq\"><span>9<\/span><span>40<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>20<\/span><\/span>", "<span class=\"fq\"><span>31<\/span><span>40<\/span><\/span>", "<span class=\"fq\"><span>17<\/span><span>40<\/span><\/span>"], "ans": 0, "sol": "A card that is neither yellow nor a star is blue and shows a circle.<br>That cell has 9 cards.<br>P = <span class=\"fq\"><span>9<\/span><span>40<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>9<\/span><span>40<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A box contains 200 beads. Each bead is red, green or purple and is made of glass or wood.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Glass<\/th><th>Wood<\/th><th>Total<\/th><\/tr><tr><th>Red<\/th><td>12<\/td><td>48<\/td><td>60<\/td><\/tr><tr><th>Green<\/th><td>45<\/td><td>30<\/td><td>75<\/td><\/tr><tr><th>Purple<\/th><td>13<\/td><td>52<\/td><td>65<\/td><\/tr><tr><th>Total<\/th><td>70<\/td><td>130<\/td><td>200<\/td><\/tr><\/table><\/div>If a glass bead is selected at random from the box, what is the probability that it is green?", "ans": ["9/14", ".6428", ".6429", "0.642", "0.643"], "sol": "The group is the Glass column: 12 + 45 + 13 = 70 beads.<br>45 of them are green.<br>P = <span class=\"fq\"><span>45<\/span><span>70<\/span><\/span> = <span class=\"fq\"><span>9<\/span><span>14<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>9<\/span><span>14<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A clinic used a quick screening test on 500 patients and later confirmed whether each patient had a certain condition.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Tested positive<\/th><th>Tested negative<\/th><th>Total<\/th><\/tr><tr><th>Has condition<\/th><td>38<\/td><td>2<\/td><td>40<\/td><\/tr><tr><th>No condition<\/th><td>46<\/td><td>414<\/td><td>460<\/td><\/tr><tr><th>Total<\/th><td>84<\/td><td>416<\/td><td>500<\/td><\/tr><\/table><\/div>Given that a patient tested positive, what is the probability that the patient has the condition?", "opts": ["<span class=\"fq\"><span>19<\/span><span>250<\/span><\/span>", "<span class=\"fq\"><span>21<\/span><span>125<\/span><\/span>", "<span class=\"fq\"><span>19<\/span><span>42<\/span><\/span>", "<span class=\"fq\"><span>19<\/span><span>20<\/span><\/span>"], "ans": 2, "sol": "The group is the Tested positive column: 38 + 46 = 84 patients.<br>38 of them have the condition.<br>P = <span class=\"fq\"><span>38<\/span><span>84<\/span><\/span> = <span class=\"fq\"><span>19<\/span><span>42<\/span><\/span>. (Choice D, <span class=\"fq\"><span>38<\/span><span>40<\/span><\/span>, is the probability of testing positive given the condition.)<br>Answer: <b><span class=\"fq\"><span>19<\/span><span>42<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A spinner has 6 equal sections: 3 red, 2 blue and 1 green. If the spinner is spun 90 times, how many more times would you expect it to land on red than on green?", "opts": ["15", "30", "45", "60"], "ans": 1, "sol": "Expected reds: <span class=\"fq\"><span>3<\/span><span>6<\/span><\/span> × 90 = 45.<br>Expected greens: <span class=\"fq\"><span>1<\/span><span>6<\/span><\/span> × 90 = 15.<br>Difference: 45 − 15 = 30.<br>Answer: <b>30<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "A bag contains 18 blue marbles and some marbles of other colors. If one marble is selected at random, the probability that it is blue is 0.04. How many marbles are in the bag?", "ans": ["450"], "sol": "P(blue) = <span class=\"fq\"><span>number of blue marbles<\/span><span>total<\/span><\/span>, so 0.04 = <span class=\"fq\"><span>18<\/span><span>total<\/span><\/span>.<br>Total = 18 ÷ 0.04 = 450.<br>Answer: <b>450<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Ten cards are numbered 1 to 10. A card is drawn at random and replaced, and then a second card is drawn at random. What is the probability that the first card shows an even number and the second card shows a number greater than 7?", "opts": ["<span class=\"fq\"><span>3<\/span><span>20<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>6<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>10<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>5<\/span><\/span>"], "ans": 0, "sol": "P(first even) = <span class=\"fq\"><span>5<\/span><span>10<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>. P(second greater than 7) = P(8, 9 or 10) = <span class=\"fq\"><span>3<\/span><span>10<\/span><\/span>.<br>The card is replaced, so the draws are independent: <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> × <span class=\"fq\"><span>3<\/span><span>10<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>20<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>3<\/span><span>20<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A sports academy has 180 athletes, each in swimming or track and each at the junior or senior level. Some values are missing from the table.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Junior<\/th><th>Senior<\/th><th>Total<\/th><\/tr><tr><th>Swimming<\/th><td>34<\/td><td><\/td><td>80<\/td><\/tr><tr><th>Track<\/th><td><\/td><td>58<\/td><td><\/td><\/tr><tr><th>Total<\/th><td><\/td><td><\/td><td>180<\/td><\/tr><\/table><\/div>If one of these athletes is selected at random, what is the probability that the athlete is a swimmer or a senior?", "opts": ["<span class=\"fq\"><span>7<\/span><span>30<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>9<\/span><\/span>", "<span class=\"fq\"><span>26<\/span><span>45<\/span><\/span>", "<span class=\"fq\"><span>23<\/span><span>30<\/span><\/span>"], "ans": 3, "sol": "Swimming seniors: 80 − 34 = 46. Track total: 180 − 80 = 100, so track juniors: 100 − 58 = 42.<br>Senior total: 46 + 58 = 104.<br>Swimmer or senior: 80 + 104 − 46 = 138.<br>P = <span class=\"fq\"><span>138<\/span><span>180<\/span><\/span> = <span class=\"fq\"><span>23<\/span><span>30<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>23<\/span><span>30<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A bag contains only red, blue and green chips. The probability of selecting a red chip at random is <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>, and the probability of selecting a blue chip at random is <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>. If the bag contains 60 chips, how many are green?", "opts": ["15", "20", "25", "35"], "ans": 2, "sol": "P(green) = 1 − <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span> − <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> = <span class=\"fq\"><span>12<\/span><span>12<\/span><\/span> − <span class=\"fq\"><span>3<\/span><span>12<\/span><\/span> − <span class=\"fq\"><span>4<\/span><span>12<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>12<\/span><\/span>.<br>Green chips: <span class=\"fq\"><span>5<\/span><span>12<\/span><\/span> × 60 = 25.<br>Answer: <b>25<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Three boxes contain striped and solid marbles, as shown.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Striped<\/th><th>Solid<\/th><th>Total<\/th><\/tr><tr><th>Box 1<\/th><td>42<\/td><td>38<\/td><td>80<\/td><\/tr><tr><th>Box 2<\/th><td>35<\/td><td>55<\/td><td>90<\/td><\/tr><tr><th>Box 3<\/th><td>28<\/td><td>52<\/td><td>80<\/td><\/tr><tr><th>Total<\/th><td>105<\/td><td>145<\/td><td>250<\/td><\/tr><\/table><\/div>If a marble from box 2 or box 3 is selected at random, what is the probability that it is striped?", "opts": ["<span class=\"fq\"><span>7<\/span><span>18<\/span><\/span>", "<span class=\"fq\"><span>63<\/span><span>170<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>63<\/span><span>250<\/span><\/span>"], "ans": 1, "sol": "The group is boxes 2 and 3 together: 90 + 80 = 170 marbles.<br>Striped marbles in those boxes: 35 + 28 = 63.<br>P = <span class=\"fq\"><span>63<\/span><span>170<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>63<\/span><span>170<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "At a school of 1,500 students, 40% of the students take the bus. Of the students who take the bus, 15% live more than 10 kilometers from the school. How many students at the school take the bus and live more than 10 kilometers from the school?", "ans": ["90"], "sol": "Bus riders: 0.40 × 1,500 = 600.<br>Of these, 15% live far away: 0.15 × 600 = 90.<br>Answer: <b>90<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A survey of 200 students recorded whether each eats breakfast and whether each sleeps 8 or more hours on school nights.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Sleeps 8 or more hours<\/th><th>Sleeps less than 8 hours<\/th><th>Total<\/th><\/tr><tr><th>Eats breakfast<\/th><td>56<\/td><td>84<\/td><td>140<\/td><\/tr><tr><th>Skips breakfast<\/th><td>24<\/td><td>36<\/td><td>60<\/td><\/tr><tr><th>Total<\/th><td>80<\/td><td>120<\/td><td>200<\/td><\/tr><\/table><\/div>Which statement correctly describes and explains whether the events \"eats breakfast\" and \"sleeps 8 or more hours\" are independent for these students?", "opts": ["They are not independent, because 56 students who eat breakfast sleep 8 or more hours, but only 24 who skip breakfast do.", "They are independent, because more students eat breakfast (140) than sleep 8 or more hours (80).", "They are not independent, because P(eats breakfast and sleeps 8 or more hours) = 0.28 is not equal to P(sleeps 8 or more hours) = 0.4.", "They are independent, because 40% of the students who eat breakfast and 40% of those who skip it sleep 8 or more hours."], "ans": 3, "sol": "P(8+ hours given breakfast) = <span class=\"fq\"><span>56<\/span><span>140<\/span><\/span> = 0.4.<br>P(8+ hours given no breakfast) = <span class=\"fq\"><span>24<\/span><span>60<\/span><\/span> = 0.4.<br>The rates are equal, so the events are independent. Choice A compares counts, not rates; choice C compares the wrong probabilities.<br>Answer: <b>They are independent, because 40% of both groups sleep 8 or more hours.<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A gym recorded the age group and the favorite class of each of its 160 members.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Age<\/th><th>Yoga<\/th><th>Spin<\/th><th>Total<\/th><\/tr><tr><th>Under 30<\/th><td>18<\/td><td>30<\/td><td>48<\/td><\/tr><tr><th>30 to 50<\/th><td>26<\/td><td>38<\/td><td>64<\/td><\/tr><tr><th>Over 50<\/th><td>32<\/td><td>16<\/td><td>48<\/td><\/tr><tr><th>Total<\/th><td>76<\/td><td>84<\/td><td>160<\/td><\/tr><\/table><\/div>What percent of the members are over 50 or prefer yoga? (Disregard the % sign when entering your answer.)", "ans": ["57.5"], "sol": "Over 50: 48. Yoga: 18 + 26 + 32 = 76. Over 50 and yoga: 32.<br>Over 50 or yoga: 48 + 76 − 32 = 92.<br><span class=\"fq\"><span>92<\/span><span>160<\/span><\/span> = 0.575 = 57.5%.<br>Answer: <b>57.5<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A jar contains only red and blue marbles. The probability of selecting a red marble at random is <span class=\"fq\"><span>3<\/span><span>8<\/span><\/span>. After 10 more red marbles are added to the jar, the probability of selecting a red marble at random becomes <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>. How many marbles were in the jar before the red marbles were added?", "opts": ["30", "35", "40", "50"], "ans": 2, "sol": "Let <i>n<\/i> be the original number. Red marbles: <span class=\"fq\"><span>3<\/span><span>8<\/span><\/span><i>n<\/i>.<br>After adding: <span class=\"fq\"><span>3<\/span><span>8<\/span><\/span><i>n<\/i> + 10 = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(<i>n<\/i> + 10).<br>Multiply by 8: 3<i>n<\/i> + 80 = 4<i>n<\/i> + 40, so <i>n<\/i> = 40.<br>Answer: <b>40<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "Each letter of the word PROBABILITY is written on a separate tile, and the 11 tiles are placed in a bag. If one tile is selected at random, what is the probability that it shows the letter B or the letter I?", "opts": ["<span class=\"fq\"><span>2<\/span><span>11<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>9<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>11<\/span><\/span>", "<span class=\"fq\"><span>7<\/span><span>11<\/span><\/span>"], "ans": 2, "sol": "The word has 11 letters: P, R, O, B, A, B, I, L, I, T, Y.<br>B appears twice and I appears twice: 4 tiles.<br>P = <span class=\"fq\"><span>4<\/span><span>11<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>4<\/span><span>11<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A city surveyed 500 residents about a proposed new park.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Neighborhood<\/th><th>Supports<\/th><th>Does not support<\/th><th>Total<\/th><\/tr><tr><th>North<\/th><td>96<\/td><td>64<\/td><td>160<\/td><\/tr><tr><th>South<\/th><td>110<\/td><td>90<\/td><td>200<\/td><\/tr><tr><th>East<\/th><td>77<\/td><td>63<\/td><td>140<\/td><\/tr><tr><th>Total<\/th><td>283<\/td><td>217<\/td><td>500<\/td><\/tr><\/table><\/div>If one of these residents is selected at random, which of the following is closest to the probability that the resident lives in South or does not support the park?", "opts": ["0.18", "0.45", "0.65", "0.83"], "ans": 2, "sol": "South: 200. Does not support: 64 + 90 + 63 = 217. Both: 90.<br>South or does not support: 200 + 217 − 90 = 327.<br>P = <span class=\"fq\"><span>327<\/span><span>500<\/span><\/span> = 0.654 ≈ 0.65.<br>Answer: <b>0.65<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A university surveyed 1,200 recent graduates about whether they found a job within 6 months of graduating.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Major<\/th><th>Job within 6 months<\/th><th>No job within 6 months<\/th><th>Total<\/th><\/tr><tr><th>Engineering<\/th><td>340<\/td><td>60<\/td><td>400<\/td><\/tr><tr><th>Business<\/th><td>266<\/td><td>84<\/td><td>350<\/td><\/tr><tr><th>Arts<\/th><td>294<\/td><td>156<\/td><td>450<\/td><\/tr><tr><th>Total<\/th><td>900<\/td><td>300<\/td><td>1,200<\/td><\/tr><\/table><\/div>If a graduate who did not find a job within 6 months is selected at random, what is the probability that the graduate majored in arts?", "ans": ["13/25", ".52", "0.52"], "sol": "The group is the No job column: 60 + 84 + 156 = 300 graduates.<br>156 of them majored in arts.<br>P = <span class=\"fq\"><span>156<\/span><span>300<\/span><\/span> = <span class=\"fq\"><span>13<\/span><span>25<\/span><\/span> = 0.52.<br>Answer: <b><span class=\"fq\"><span>13<\/span><span>25<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A quality inspector took a random sample of 250 boxes from two packing machines.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Accepted<\/th><th>Rejected<\/th><th>Total<\/th><\/tr><tr><th>Machine A<\/th><td>114<\/td><td>6<\/td><td>120<\/td><\/tr><tr><th>Machine B<\/th><td>117<\/td><td>13<\/td><td>130<\/td><\/tr><tr><th>Total<\/th><td>231<\/td><td>19<\/td><td>250<\/td><\/tr><\/table><\/div>Next week, each machine will pack 3,000 boxes. Based on the rejection rate of each machine in the sample, about how many more boxes from machine B than from machine A are expected to be rejected?", "opts": ["150", "228", "300", "450"], "ans": 0, "sol": "Rejection rate for A: <span class=\"fq\"><span>6<\/span><span>120<\/span><\/span> = 0.05. For B: <span class=\"fq\"><span>13<\/span><span>130<\/span><\/span> = 0.10.<br>Expected rejections: A, 0.05 × 3,000 = 150; B, 0.10 × 3,000 = 300.<br>Difference: 300 − 150 = 150.<br>Answer: <b>150<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A coin is weighted so that the probability it lands heads on any toss is 0.7. The tosses are independent. If the coin is tossed twice, what is the probability that it lands tails both times?", "opts": ["0.09", "0.42", "0.49", "0.6"], "ans": 0, "sol": "P(tails) = 1 − 0.7 = 0.3 on each toss.<br>The tosses are independent: 0.3 × 0.3 = 0.09.<br>Answer: <b>0.09<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of siblings for 60 students: 0 siblings, 9 students; 1 sibling, 21; 2 siblings, 16; 3 siblings, 10; 4 siblings, 4\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\"><line x1=\"50\" y1=\"164.0\" x2=\"308\" y2=\"164.0\"/><line x1=\"50\" y1=\"134.0\" x2=\"308\" y2=\"134.0\"/><line x1=\"50\" y1=\"104.0\" x2=\"308\" y2=\"104.0\"/><line x1=\"50\" y1=\"74.0\" x2=\"308\" y2=\"74.0\"/><line x1=\"50\" y1=\"44.0\" x2=\"308\" y2=\"44.0\"/><line x1=\"50\" y1=\"14.0\" x2=\"308\" y2=\"14.0\"/><\/g><rect class=\"fg-shape\" x=\"59.8\" y=\"126.5\" width=\"32.0\" height=\"67.5\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"111.4\" y=\"36.5\" width=\"32.0\" height=\"157.5\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"163.0\" y=\"74.0\" width=\"32.0\" height=\"120.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"214.6\" y=\"119.0\" width=\"32.0\" height=\"75.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"266.2\" y=\"164.0\" width=\"32.0\" height=\"30.0\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"194.0\" x2=\"308\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"50\" y1=\"14\" x2=\"50\" y2=\"194.0\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"44\" y=\"198.0\" text-anchor=\"end\">0<\/text><text x=\"44\" y=\"168.0\" text-anchor=\"end\">4<\/text><text x=\"44\" y=\"138.0\" text-anchor=\"end\">8<\/text><text x=\"44\" y=\"108.0\" text-anchor=\"end\">12<\/text><text x=\"44\" y=\"78.0\" text-anchor=\"end\">16<\/text><text x=\"44\" y=\"48.0\" text-anchor=\"end\">20<\/text><text x=\"44\" y=\"18.0\" text-anchor=\"end\">24<\/text><text x=\"75.8\" y=\"209.0\" text-anchor=\"middle\">0<\/text><text x=\"127.4\" y=\"209.0\" text-anchor=\"middle\">1<\/text><text x=\"179.0\" y=\"209.0\" text-anchor=\"middle\">2<\/text><text x=\"230.6\" y=\"209.0\" text-anchor=\"middle\">3<\/text><text x=\"282.2\" y=\"209.0\" text-anchor=\"middle\">4<\/text><text x=\"179.0\" y=\"232\" text-anchor=\"middle\">Number of siblings<\/text><text x=\"14\" y=\"104.0\" text-anchor=\"middle\" transform=\"rotate(-90 14 104.0)\">Number of students<\/text><\/g><\/svg>The bar graph shows the number of siblings of each of 60 students. If a student who has at least one sibling is selected at random, what is the probability that the student has exactly 2 siblings?", "opts": ["<span class=\"fq\"><span>4<\/span><span>15<\/span><\/span>", "<span class=\"fq\"><span>16<\/span><span>51<\/span><\/span>", "<span class=\"fq\"><span>35<\/span><span>51<\/span><\/span>", "<span class=\"fq\"><span>17<\/span><span>20<\/span><\/span>"], "ans": 1, "sol": "Students with at least one sibling: 60 − 9 = 51.<br>16 of them have exactly 2 siblings.<br>P = <span class=\"fq\"><span>16<\/span><span>51<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>16<\/span><span>51<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "An integer from 1 to 100, inclusive, is selected at random. What is the probability that the integer is divisible by neither 2 nor 5?", "opts": ["<span class=\"fq\"><span>1<\/span><span>10<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>10<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>"], "ans": 2, "sol": "Divisible by 2: 50. Divisible by 5: 20. Divisible by both (by 10): 10.<br>Divisible by 2 or 5: 50 + 20 − 10 = 60.<br>Neither: 100 − 60 = 40, so P = <span class=\"fq\"><span>40<\/span><span>100<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>5<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>2<\/span><span>5<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A box contains red and blue tiles that are squares or circles, as shown, where <i>x<\/i> is the number of blue squares.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Square<\/th><th>Circle<\/th><\/tr><tr><th>Red<\/th><td>14<\/td><td>26<\/td><\/tr><tr><th>Blue<\/th><td><i>x<\/i><\/td><td>28<\/td><\/tr><\/table><\/div>If one tile is selected at random from the box, the probability that it is a blue square is <span class=\"fq\"><span>1<\/span><span>5<\/span><\/span>. What is the value of <i>x<\/i>?", "ans": ["17"], "sol": "Total tiles: 14 + 26 + 28 + <i>x<\/i> = 68 + <i>x<\/i>.<br><span class=\"fq\"><span><i>x<\/i><\/span><span>68 + <i>x<\/i><\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>5<\/span><\/span>, so 5<i>x<\/i> = 68 + <i>x<\/i>.<br>4<i>x<\/i> = 68, so <i>x<\/i> = 17.<br>Answer: <b>17<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "In a survey, adults were asked whether they own a bicycle and whether they live within 5 kilometers of their workplace. The table shows the percent of all respondents in each category.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Within 5 km<\/th><th>More than 5 km<\/th><th>Total<\/th><\/tr><tr><th>Owns a bicycle<\/th><td>18%<\/td><td>12%<\/td><td>30%<\/td><\/tr><tr><th>No bicycle<\/th><td>27%<\/td><td>43%<\/td><td>70%<\/td><\/tr><tr><th>Total<\/th><td>45%<\/td><td>55%<\/td><td>100%<\/td><\/tr><\/table><\/div>If a respondent who lives within 5 kilometers of the workplace is selected at random, what is the probability that the respondent owns a bicycle?", "opts": ["0.18", "0.40", "0.45", "0.60"], "ans": 1, "sol": "The group is the Within 5 km column: 45% of respondents.<br>Of these, 18% of all respondents own a bicycle.<br>P = <span class=\"fq\"><span>18<\/span><span>45<\/span><\/span> = 0.40.<br>Answer: <b>0.40<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A cafe chain recorded the drink ordered by a random sample of 160 customers.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Tea<\/th><th>Coffee<\/th><th>Total<\/th><\/tr><tr><th>Morning<\/th><td>28<\/td><td>52<\/td><td>80<\/td><\/tr><tr><th>Afternoon<\/th><td>46<\/td><td>34<\/td><td>80<\/td><\/tr><tr><th>Total<\/th><td>74<\/td><td>86<\/td><td>160<\/td><\/tr><\/table><\/div>The chain expects 3,000 morning customers and 2,000 afternoon customers next week, and each customer orders one of the two drinks. Based on the sample, how many tea orders should the chain expect next week?", "opts": ["1,050", "1,150", "1,750", "2,200"], "ans": 3, "sol": "Morning tea rate: <span class=\"fq\"><span>28<\/span><span>80<\/span><\/span> = 0.35, so 0.35 × 3,000 = 1,050.<br>Afternoon tea rate: <span class=\"fq\"><span>46<\/span><span>80<\/span><\/span> = 0.575, so 0.575 × 2,000 = 1,150.<br>Total: 1,050 + 1,150 = 2,200.<br>Answer: <b>2,200<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Spinner 1 has 3 equal sections numbered 1, 2 and 3. Spinner 2 has 4 equal sections numbered 1, 2, 3 and 4. Each spinner is spun once. What is the probability that the product of the two numbers is even?", "opts": ["<span class=\"fq\"><span>1<\/span><span>6<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>5<\/span><span>6<\/span><\/span>"], "ans": 2, "sol": "The product is odd only when both numbers are odd.<br>P(odd on spinner 1) = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>; P(odd on spinner 2) = <span class=\"fq\"><span>2<\/span><span>4<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>.<br>P(both odd) = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> × <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>, so P(even product) = 1 − <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "Two fair six-sided dice are rolled. What is the probability that the sum of the two numbers is at least 4?", "ans": ["11/12", ".9166", ".9167", "0.916", "0.917", "33/36"], "sol": "There are 6 × 6 = 36 equally likely outcomes.<br>The complement, a sum of 2 or 3, has 3 outcomes: (1, 1), (1, 2) and (2, 1).<br>P(at least 4) = 1 − <span class=\"fq\"><span>3<\/span><span>36<\/span><\/span> = <span class=\"fq\"><span>33<\/span><span>36<\/span><\/span> = <span class=\"fq\"><span>11<\/span><span>12<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>11<\/span><span>12<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A club has 300 members. Of these, 120 play tennis, 90 play golf and 40 play both. If a member is selected at random, what is the probability that the member plays neither tennis nor golf?", "opts": ["<span class=\"fq\"><span>17<\/span><span>30<\/span><\/span>", "<span class=\"fq\"><span>13<\/span><span>30<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>10<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>15<\/span><\/span>"], "ans": 1, "sol": "Members who play tennis or golf: 120 + 90 − 40 = 170.<br>Neither: 300 − 170 = 130.<br>P = <span class=\"fq\"><span>130<\/span><span>300<\/span><\/span> = <span class=\"fq\"><span>13<\/span><span>30<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>13<\/span><span>30<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Four schools reported how many of their students passed a district science exam.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>School<\/th><th>Passed<\/th><th>Did not pass<\/th><th>Total<\/th><\/tr><tr><th>School A<\/th><td>156<\/td><td>44<\/td><td>200<\/td><\/tr><tr><th>School B<\/th><td>180<\/td><td>60<\/td><td>240<\/td><\/tr><tr><th>School C<\/th><td>196<\/td><td>84<\/td><td>280<\/td><\/tr><tr><th>School D<\/th><td>132<\/td><td>48<\/td><td>180<\/td><\/tr><\/table><\/div>For which school is the probability greatest that a student selected at random from that school passed the exam?", "opts": ["School A", "School B", "School C", "School D"], "ans": 0, "sol": "Compare rates, not counts. School A: <span class=\"fq\"><span>156<\/span><span>200<\/span><\/span> = 0.78. School B: <span class=\"fq\"><span>180<\/span><span>240<\/span><\/span> = 0.75.<br>School C: <span class=\"fq\"><span>196<\/span><span>280<\/span><\/span> = 0.70. School D: <span class=\"fq\"><span>132<\/span><span>180<\/span><\/span> ≈ 0.73.<br>School A has the greatest rate, even though School C has the most students who passed.<br>Answer: <b>School A<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "In a bag of marbles, <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span> of the marbles are glass and the rest are clay. Of the glass marbles, <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span> are blue. If the bag contains 36 blue glass marbles, how many marbles are in the bag?", "ans": ["240"], "sol": "Fraction of all marbles that are blue glass: <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span> × <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>20<\/span><\/span>.<br><span class=\"fq\"><span>3<\/span><span>20<\/span><\/span> × total = 36, so total = 36 × <span class=\"fq\"><span>20<\/span><span>3<\/span><\/span> = 240.<br>Answer: <b>240<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Events <i>A<\/i> and <i>B<\/i> are independent. The probability of event <i>A<\/i> is 0.3, and the probability that both <i>A<\/i> and <i>B<\/i> occur is 0.12. What is the probability that event <i>B<\/i> does not occur?", "opts": ["0.18", "0.4", "0.42", "0.6"], "ans": 3, "sol": "Independence: P(<i>A<\/i> and <i>B<\/i>) = P(<i>A<\/i>) × P(<i>B<\/i>), so 0.12 = 0.3 × P(<i>B<\/i>).<br>P(<i>B<\/i>) = 0.12 ÷ 0.3 = 0.4.<br>P(not <i>B<\/i>) = 1 − 0.4 = 0.6.<br>Answer: <b>0.6<\/b>"}, {"lo": "LO3", "diff": "X", "type": "spr", "q": "Two bags contain only red and blue tokens. The table shows the number of tokens of each color in each bag, where <i>x<\/i> is a positive integer.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Red<\/th><th>Blue<\/th><\/tr><tr><th>Bag 1<\/th><td><i>x<\/i><\/td><td>48<\/td><\/tr><tr><th>Bag 2<\/th><td>36<\/td><td>2<i>x<\/i><\/td><\/tr><\/table><\/div>All the tokens are combined. If a blue token is selected at random, the probability that it came from bag 2 is 0.6. How many tokens are there in all?", "ans": ["192"], "sol": "Blue tokens: 48 + 2<i>x<\/i>.<br><span class=\"fq\"><span>2<i>x<\/i><\/span><span>48 + 2<i>x<\/i><\/span><\/span> = 0.6, so 2<i>x<\/i> = 28.8 + 1.2<i>x<\/i> and 0.8<i>x<\/i> = 28.8, giving <i>x<\/i> = 36.<br>Total: 36 + 48 + 36 + 72 = 192.<br>Answer: <b>192<\/b>"}, {"lo": "LO3", "diff": "X", "type": "mcq", "q": "In a town survey of 1,000 adults, 40% were under 30. Of the adults under 30, 60% said they prefer streaming to cable television. Of the adults 30 or older, 25% said they prefer streaming. If a surveyed adult who prefers streaming is selected at random, what is the probability that the adult is under 30?", "opts": ["<span class=\"fq\"><span>6<\/span><span>25<\/span><\/span>", "<span class=\"fq\"><span>5<\/span><span>13<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>8<\/span><span>13<\/span><\/span>"], "ans": 3, "sol": "Under 30: 400 adults, and 0.60 × 400 = 240 prefer streaming.<br>30 or older: 600 adults, and 0.25 × 600 = 150 prefer streaming.<br>Streaming total: 240 + 150 = 390.<br>P = <span class=\"fq\"><span>240<\/span><span>390<\/span><\/span> = <span class=\"fq\"><span>8<\/span><span>13<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>8<\/span><span>13<\/span><\/span><\/b>"}, {"lo": "LO5", "diff": "X", "type": "mcq", "q": "A spinner lands on red with probability <i>p<\/i> on each spin, and the spins are independent. If the spinner is spun twice, the probability that it lands on red at least once is 0.64. What is the value of <i>p<\/i>?", "opts": ["0.36", "0.4", "0.6", "0.8"], "ans": 1, "sol": "P(no red in two spins) = (1 − <i>p<\/i>)<sup>2<\/sup> = 1 − 0.64 = 0.36.<br>1 − <i>p<\/i> = 0.6, so <i>p<\/i> = 0.4.<br>Answer: <b>0.4<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "Each of 400 cards is either gold or silver, and some cards show a star. For a card selected at random, the probability that it is gold is 0.12, the probability that it shows a star is 0.45, and the probability that it is gold or shows a star is 0.5. How many of the cards are gold and show a star?", "opts": ["28", "48", "200", "228"], "ans": 0, "sol": "P(gold or star) = P(gold) + P(star) − P(gold and star).<br>0.5 = 0.12 + 0.45 − P(both), so P(both) = 0.07.<br>Count: 0.07 × 400 = 28.<br>Answer:
