var S = {"id": "ALG-2.1", "unit": "Algebra", "topic": "Linear equations in two variables", "title": "Slope, intercepts and forms of a line", "intro": "A line in the <i>xy<\/i>-plane is fixed by its steepness (slope) and where it crosses the axes (intercepts), and the same line can be written in slope-intercept, standard or point-slope form. The DSAT tests reading these features from an equation, switching between forms and building an equation from a few facts, from quick Module 1 items to parameter puzzles in Module 2.", "los": [{"id": "LO1", "text": "Calculate the slope of a line from two points, including points with unknown coordinates or real-world rise and run"}, {"id": "LO2", "text": "Identify the slope, x-intercept and y-intercept of a line from an equation in any form"}, {"id": "LO3", "text": "Convert a linear equation between slope-intercept, standard and point-slope forms"}, {"id": "LO4", "text": "Write the equation of a line from two points, a point and a slope, or its intercepts"}], "notes": [{"lo": "LO1", "h": "Slope: rise over run", "html": "<p>The <b>slope<\/b> of a line measures how much <i>y<\/i> changes for each 1-unit increase in <i>x<\/i>. Pick any two points on the line, (<i>x<\/i><sub>1<\/sub>, <i>y<\/i><sub>1<\/sub>) and (<i>x<\/i><sub>2<\/sub>, <i>y<\/i><sub>2<\/sub>), and divide the change in <i>y<\/i> by the change in <i>x<\/i>.<\/p><div class=\"rule\"><i>m<\/i> = <span class=\"fq\"><span><i>y<\/i><sub>2<\/sub> − <i>y<\/i><sub>1<\/sub><\/span><span><i>x<\/i><sub>2<\/sub> − <i>x<\/i><sub>1<\/sub><\/span><\/span> = <span class=\"fq\"><span>rise<\/span><span>run<\/span><\/span><\/div><p>Subtract in the <b>same order<\/b> on top and bottom. It doesn’t matter which point you call “first”, as long as you are consistent.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Slope<\/th><th>Line, read left to right<\/th><\/tr><tr><td>positive<\/td><td>goes up<\/td><\/tr><tr><td>negative<\/td><td>goes down<\/td><\/tr><tr><td>larger |<i>m<\/i>|<\/td><td>steeper<\/td><\/tr><\/table><\/div><p>In context, slope is the rise per unit of horizontal distance. A road with a 5% grade rises 5 m for every 100 m travelled horizontally, so its slope is 0.05.<\/p>"}, {"lo": "LO2", "h": "Slope-intercept form", "html": "<p>The most useful form on the DSAT is<\/p><div class=\"rule\"><i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i>: slope <i>m<\/i>, <i>y<\/i>-intercept (0, <i>b<\/i>)<\/div><p>The <i>y<\/i>-intercept is where the line crosses the <i>y<\/i>-axis, so <i>x<\/i> = 0 there, and plugging in <i>x<\/i> = 0 leaves <i>y<\/i> = <i>b<\/i>. The coefficient of <i>x<\/i> is the slope only when <i>y<\/i> is <b>alone<\/b> with coefficient 1.<\/p><ul><li><i>y<\/i> = 4 − 2<i>x<\/i> has slope −2 (the order of terms does not matter) and <i>y<\/i>-intercept 4.<\/li><li>3<i>y<\/i> = 6<i>x<\/i> + 9 is not finished: divide by 3 to get <i>y<\/i> = 2<i>x<\/i> + 3, so the slope is 2, not 6.<\/li><\/ul><p>To find the <b><i>x<\/i>-intercept<\/b>, set <i>y<\/i> = 0 and solve: 0 = <i>m<\/i><i>x<\/i> + <i>b<\/i> gives <i>x<\/i> = −<span class=\"fq\"><span><i>b<\/i><\/span><span><i>m<\/i><\/span><\/span> (when <i>m<\/i> ≠ 0).<\/p>"}, {"lo": "LO2", "h": "Standard form and intercepts", "html": "<p><b>Standard form<\/b> is <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i>, usually with integer coefficients. It hides the slope but shows the intercepts quickly.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Feature of <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i><\/th><th>How to get it<\/th><th>Result<\/th><\/tr><tr><td><i>x<\/i>-intercept<\/td><td>set <i>y<\/i> = 0<\/td><td>(<span class=\"fq\"><span><i>C<\/i><\/span><span><i>A<\/i><\/span><\/span>, 0)<\/td><\/tr><tr><td><i>y<\/i>-intercept<\/td><td>set <i>x<\/i> = 0<\/td><td>(0, <span class=\"fq\"><span><i>C<\/i><\/span><span><i>B<\/i><\/span><\/span>)<\/td><\/tr><tr><td>slope<\/td><td>solve for <i>y<\/i><\/td><td>−<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span><\/td><\/tr><\/table><\/div><p>Example: for 5<i>x<\/i> − 2<i>y<\/i> = 20, the intercepts are (4, 0) and (0, −10) and the slope is −<span class=\"fq\"><span>5<\/span><span>−2<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>.<\/p><div class=\"rule\">Slope of <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i> is −<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span>. Watch both signs.<\/div><div class=\"tip\"><b>Desmos tip:<\/b> type the equation exactly as given, in any form. Desmos graphs it, and clicking the line shows gray dots at both intercepts with their coordinates.<\/div>"}, {"lo": "LO3", "h": "Point-slope form", "html": "<p>When you know a slope and one point (<i>x<\/i><sub>1<\/sub>, <i>y<\/i><sub>1<\/sub>), write the line straight away in <b>point-slope form<\/b>:<\/p><div class=\"rule\"><i>y<\/i> − <i>y<\/i><sub>1<\/sub> = <i>m<\/i>(<i>x<\/i> − <i>x<\/i><sub>1<\/sub>)<\/div><p>The point appears with <b>opposite signs<\/b>: <i>y<\/i> + 5 = 3(<i>x<\/i> − 2) is really <i>y<\/i> − (−5) = 3(<i>x<\/i> − 2), so it passes through (2, −5) with slope 3.<\/p><p>Point-slope form is not unique. Every point on the line gives a different-looking equation for the same line, which is why DSAT answer choices often look different from your work. To compare, convert both to slope-intercept form, or check that the slope matches and the point satisfies the equation.<\/p>"}, {"lo": "LO3", "h": "Converting between forms", "html": "<p>All three forms describe the same set of points, so you can always move between them with ordinary algebra.<\/p><ul><li><b>Point-slope → slope-intercept:<\/b> distribute <i>m<\/i>, then add <i>y<\/i><sub>1<\/sub> to both sides.<\/li><li><b>Standard → slope-intercept:<\/b> move the <i>x<\/i>-term across, then divide every term by <i>B<\/i>.<\/li><li><b>Slope-intercept → standard:<\/b> move the <i>x<\/i>-term to the left, then multiply by the common denominator so all coefficients are integers. Many books also make <i>A<\/i> positive.<\/li><\/ul><p>Example: <i>y<\/i> = −<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> + 2. Add <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i>: <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> + <i>y<\/i> = 2. Multiply by 4: 3<i>x<\/i> + 4<i>y<\/i> = 8.<\/p><div class=\"rule\">Multiplying or dividing <b>every<\/b> term of an equation by the same nonzero number gives the same line.<\/div><p>So 6<i>x<\/i> + 8<i>y<\/i> = 16 and 3<i>x<\/i> + 4<i>y<\/i> = 8 are the same line, which matters when an answer choice is a multiple of yours.<\/p>"}, {"lo": "LO4", "h": "Writing the equation of a line", "html": "<p>Every “find the line” question gives you enough to get a <b>slope<\/b> and <b>one point<\/b>. After that it is just choosing the requested form.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Given<\/th><th>Plan<\/th><\/tr><tr><td>slope and <i>y<\/i>-intercept<\/td><td>write <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i> directly<\/td><\/tr><tr><td>slope and a point<\/td><td>point-slope form, or substitute into <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i> to find <i>b<\/i><\/td><\/tr><tr><td>two points<\/td><td>slope from the points, then use either point<\/td><\/tr><tr><td>both intercepts (<i>a<\/i>, 0), (0, <i>b<\/i>)<\/td><td>slope −<span class=\"fq\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>, <i>y<\/i>-intercept <i>b<\/i><\/td><\/tr><\/table><\/div><p>Check your line with the second point before choosing an answer. One substitution catches most sign slips.<\/p><div class=\"tip\"><b>Desmos tip:<\/b> put two points in a table (columns <i>x<\/i><sub>1<\/sub>, <i>y<\/i><sub>1<\/sub>), then type <i>y<\/i><sub>1<\/sub> ~ <i>m<\/i><i>x<\/i><sub>1<\/sub> + <i>b<\/i>. Desmos reports the exact <i>m<\/i> and <i>b<\/i> of the line through them.<\/div>"}, {"lo": "LO4", "h": "Unknowns and conditions on a line", "html": "<p>Harder questions wrap the same ideas in constants. The method is to translate each condition into an equation, then solve.<\/p><ul><li><b>Unknown coordinate:<\/b> “the line through (<i>k<\/i>, 4) and (1, <i>k<\/i>) has slope 2” becomes <span class=\"fq\"><span><i>k<\/i> − 4<\/span><span>1 − <i>k<\/i><\/span><\/span> = 2.<\/li><li><b>Unknown coefficient:<\/b> “3<i>x<\/i> + <i>k<\/i><i>y<\/i> = 24 has slope −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>” becomes −<span class=\"fq\"><span>3<\/span><span><i>k<\/i><\/span><\/span> = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>.<\/li><li><b>Intercept conditions:<\/b> if the intercepts are (<i>a<\/i>, 0) and (0, <i>b<\/i>), the slope is −<span class=\"fq\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>. Link <i>a<\/i> and <i>b<\/i> with the condition given, such as “the <i>x<\/i>-intercept is 3 more than the <i>y<\/i>-intercept”.<\/li><\/ul><p>Keep the letters until the end and substitute numbers only when every condition has been used. After solving, plug back in to make sure no denominator becomes 0.<\/p>"}], "examples": [{"lo": "LO1", "q": "Find the slope of the line through (−3, 7) and (5, −5).", "steps": ["Change in <i>y<\/i>: −5 − 7 = −12.", "Change in <i>x<\/i>, same order: 5 − (−3) = 8.", "<i>m<\/i> = <span class=\"fq\"><span>−12<\/span><span>8<\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>."], "ans": "<i>m<\/i> = −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>"}, {"lo": "LO2", "q": "For the line 4<i>x<\/i> − 6<i>y<\/i> = 18, find the slope, the <i>x<\/i>-intercept and the <i>y<\/i>-intercept.", "steps": ["<i>x<\/i>-intercept: set <i>y<\/i> = 0, so 4<i>x<\/i> = 18 and <i>x<\/i> = <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>.", "<i>y<\/i>-intercept: set <i>x<\/i> = 0, so −6<i>y<\/i> = 18 and <i>y<\/i> = −3.", "Slope: −<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span> = −<span class=\"fq\"><span>4<\/span><span>−6<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>. Check: from (0, −3) to (<span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>, 0) the slope is <span class=\"fq\"><span>3<\/span><span>4.5<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>."], "ans": "slope <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>; intercepts (<span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>, 0) and (0, −3)"}, {"lo": "LO3", "q": "Write <i>y<\/i> + 2 = −<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>(<i>x<\/i> − 8) in standard form <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i> with integer coefficients and <i>A<\/i> > 0.", "steps": ["Multiply every term by 4 to clear the fraction: 4<i>y<\/i> + 8 = −3(<i>x<\/i> − 8).", "Distribute: 4<i>y<\/i> + 8 = −3<i>x<\/i> + 24.", "Move <i>x<\/i> left and constants right: 3<i>x<\/i> + 4<i>y<\/i> = 16."], "ans": "3<i>x<\/i> + 4<i>y<\/i> = 16"}, {"lo": "LO4", "q": "Write the equation, in slope-intercept form, of the line through (2, −1) and (6, 11).", "steps": ["Slope: <i>m<\/i> = <span class=\"fq\"><span>11 − (−1)<\/span><span>6 − 2<\/span><\/span> = <span class=\"fq\"><span>12<\/span><span>4<\/span><\/span> = 3.", "Substitute (2, −1) into <i>y<\/i> = 3<i>x<\/i> + <i>b<\/i>: −1 = 6 + <i>b<\/i>, so <i>b<\/i> = −7.", "Check with (6, 11): 3(6) − 7 = 11. ✓"], "ans": "<i>y<\/i> = 3<i>x<\/i> − 7"}, {"lo": "LO2", "q": "What is the <i>x<\/i>-intercept of the line <i>y<\/i> − 5 = 2(<i>x<\/i> + 3)?", "steps": ["At the <i>x<\/i>-intercept, <i>y<\/i> = 0: −5 = 2(<i>x<\/i> + 3).", "Divide by 2: <i>x<\/i> + 3 = −2.5.", "So <i>x<\/i> = −5.5, and the intercept is (−5.5, 0)."], "ans": "(−5.5, 0)"}, {"lo": "LO4", "q": "Line ℓ passes through (4, 5), and its <i>x<\/i>-intercept is twice its <i>y<\/i>-intercept (both nonzero). Find an equation of ℓ in standard form.", "steps": ["Call the <i>y<\/i>-intercept (0, <i>b<\/i>); then the <i>x<\/i>-intercept is (2<i>b<\/i>, 0) and the slope is −<span class=\"fq\"><span><i>b<\/i><\/span><span>2<i>b<\/i><\/span><\/span> = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>.", "So <i>y<\/i> = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> + <i>b<\/i>. Substitute (4, 5): 5 = −2 + <i>b<\/i>, so <i>b<\/i> = 7.", "<i>y<\/i> = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> + 7; multiply by 2 and rearrange: <i>x<\/i> + 2<i>y<\/i> = 14. Check: intercepts (14, 0) and (0, 7). ✓"], "ans": "<i>x<\/i> + 2<i>y<\/i> = 14"}], "traps": ["Subtracting the coordinates in different orders, such as <span class=\"fq\"><span><i>y<\/i><sub>2<\/sub> − <i>y<\/i><sub>1<\/sub><\/span><span><i>x<\/i><sub>1<\/sub> − <i>x<\/i><sub>2<\/sub><\/span><\/span>, which flips the sign of the slope.", "Putting the change in <i>x<\/i> on top: slope is rise over run, not run over rise.", "Reading the slope of <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i> as <i>A<\/i> or <span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span>: it is −<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span>, and the <i>y<\/i>-intercept is <span class=\"fq\"><span><i>C<\/i><\/span><span><i>B<\/i><\/span><\/span>, not <i>C<\/i>.", "Taking the point from <i>y<\/i> − 4 = 2(<i>x<\/i> + 3) as (3, 4): the signs flip, so the point is (−3, 4).", "Mixing up the intercepts: the <i>x<\/i>-intercept comes from setting <i>y<\/i> = 0, and the <i>y<\/i>-intercept from setting <i>x<\/i> = 0."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "What is the slope of the line that passes through the points (1, 4) and (3, 10)?", "opts": ["<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "3", "−3", "6"], "ans": 1, "sol": "Rise: 10 − 4 = 6. Run: 3 − 1 = 2. <i>m<\/i> = <span class=\"fq\"><span>6<\/span><span>2<\/span><\/span> = 3. Answer: <b>3<\/b>", "hint": "Divide the change in <i>y<\/i> by the change in <i>x<\/i>, subtracting in the same order."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which choice gives the slope and the <i>y<\/i>-intercept of the line <i>y<\/i> = −5<i>x<\/i> + 8?", "opts": ["slope 8; <i>y<\/i>-intercept (0, −5)", "slope 5; <i>y<\/i>-intercept (0, 8)", "slope −5; <i>y<\/i>-intercept (0, −8)", "slope −5; <i>y<\/i>-intercept (0, 8)"], "ans": 3, "sol": "In <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i>, <i>m<\/i> is the coefficient of <i>x<\/i> and <i>b<\/i> is the constant: <i>m<\/i> = −5, <i>b<\/i> = 8. Answer: <b>slope −5; <i>y<\/i>-intercept (0, 8)<\/b>", "hint": "Match the equation to <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i>, keeping each sign with its number."}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "What is the <i>x<\/i>-coordinate of the <i>x<\/i>-intercept of the line <i>y<\/i> = 4<i>x<\/i> − 12?", "ans": ["3"], "sol": "Set <i>y<\/i> = 0: 0 = 4<i>x<\/i> − 12, so 4<i>x<\/i> = 12 and <i>x<\/i> = 3. Answer: <b>3<\/b>", "hint": "Which coordinate is 0 at a point on the <i>x<\/i>-axis?"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "What is the slope of the line through (−2, 5) and (4, −7)?", "ans": ["-2"], "sol": "Rise: −7 − 5 = −12. Run: 4 − (−2) = 6. <i>m<\/i> = <span class=\"fq\"><span>−12<\/span><span>6<\/span><\/span> = −2. Answer: <b>−2<\/b>", "hint": "Subtracting a negative <i>x<\/i>-coordinate means adding."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Which equation is equivalent to <i>y<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><i>x<\/i> − 4?", "opts": ["2<i>x<\/i> − 3<i>y<\/i> = 12", "2<i>x<\/i> + 3<i>y<\/i> = 12", "3<i>x<\/i> − 2<i>y<\/i> = 12", "2<i>x<\/i> − 3<i>y<\/i> = −12"], "ans": 0, "sol": "Multiply by 3: 3<i>y<\/i> = 2<i>x<\/i> − 12. Move 2<i>x<\/i> left: −2<i>x<\/i> + 3<i>y<\/i> = −12. Multiply by −1: 2<i>x<\/i> − 3<i>y<\/i> = 12. Answer: <b>2<i>x<\/i> − 3<i>y<\/i> = 12<\/b>", "hint": "Clear the fraction first, then gather the <i>x<\/i>- and <i>y<\/i>-terms on one side."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A line has slope −2 and passes through the point (3, 1). Which equation represents the line?", "opts": ["<i>y<\/i> = −2<i>x<\/i> − 5", "<i>y<\/i> = −2<i>x<\/i> + 1", "<i>y<\/i> = −2<i>x<\/i> + 7", "<i>y<\/i> = −2<i>x<\/i> + 3"], "ans": 2, "sol": "Substitute (3, 1) into <i>y<\/i> = −2<i>x<\/i> + <i>b<\/i>: 1 = −6 + <i>b<\/i>, so <i>b<\/i> = 7. Answer: <b><i>y<\/i> = −2<i>x<\/i> + 7<\/b>", "hint": "Plug the point into <i>y<\/i> = −2<i>x<\/i> + <i>b<\/i> and solve for <i>b<\/i>."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "What is the slope of the line 6<i>x<\/i> + 9<i>y<\/i> = 27?", "ans": ["-2/3", "-.6666", "-.6667", "-0.666", "-0.667"], "sol": "Solve for <i>y<\/i>: 9<i>y<\/i> = −6<i>x<\/i> + 27, so <i>y<\/i> = −<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><i>x<\/i> + 3. Or use −<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span> = −<span class=\"fq\"><span>6<\/span><span>9<\/span><\/span>. Answer: <b>−2/3<\/b>", "hint": "Get <i>y<\/i> by itself, or use the shortcut for the slope of <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i>."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A wheelchair ramp rises 1.5 feet over a horizontal distance of 18 feet. What is the slope of the ramp?", "opts": ["12", "<span class=\"fq\"><span>1<\/span><span>12<\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>18<\/span><\/span>", "16.5"], "ans": 1, "sol": "Slope = rise ÷ run = <span class=\"fq\"><span>1.5<\/span><span>18<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>12<\/span><\/span>. Answer: <b><span class=\"fq\"><span>1<\/span><span>12<\/span><\/span><\/b>", "hint": "Which measurement is the rise, and which is the run?"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "The equation <i>y<\/i> − 3 = 4(<i>x<\/i> + 2) can be written as <i>y<\/i> = <i>m<\/i><i>x<\/i> + <i>b<\/i>, where <i>m<\/i> and <i>b<\/i> are constants. What is the value of <i>b<\/i>?", "ans": ["11"], "sol": "Distribute: <i>y<\/i> − 3 = 4<i>x<\/i> + 8. Add 3: <i>y<\/i> = 4<i>x<\/i> + 11. Answer: <b>11<\/b>", "hint": "Distribute the 4 to bo >"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The equation 6<i>x<\/i> − 4<i>y<\/i> = 10 is rewritten in the form <i>y<\/i> = <i>a<\/i><i>x<\/i> + <i>b<\/i>, where <i>a<\/i> and <i>b<\/i> are constants. What is the value of <i>a<\/i> − <i>b<\/i>?", "opts": ["−1", "1", "8", "4"], "ans": 3, "sol": "−4<i>y<\/i> = −6<i>x<\/i> + 10, so <i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> − <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>. Then <i>a<\/i> − <i>b<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> + <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span> = 4. Answer: <b>4<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "In a physics demo on a coordinate grid, a laser beam travels in a straight line through the point (−2, 7) and hits the <i>x<\/i>-axis at (3, 0). What is the <i>y<\/i>-coordinate of the point where the beam's line crosses the <i>y<\/i>-axis?", "ans": ["21/5", "4.2"], "sol": "Slope: <span class=\"fq\"><span>0 − 7<\/span><span>3 − (−2)<\/span><\/span> = −<span class=\"fq\"><span>7<\/span><span>5<\/span><\/span>. Using (3, 0): 0 = −<span class=\"fq\"><span>7<\/span><span>5<\/span><\/span>(3) + <i>b<\/i>, so <i>b<\/i> = <span class=\"fq\"><span>21<\/span><span>5<\/span><\/span>. Answer: <b>21/5<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "What is the slope of the line through (−<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>, 3) and (<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>, −5)?", "opts": ["−4", "−<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>", "4", "−8"], "ans": 0, "sol": "Rise: −5 − 3 = −8. Run: <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> − (−<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>) = 2. <i>m<\/i> = <span class=\"fq\"><span>−8<\/span><span>2<\/span><\/span> = −4. Answer: <b>−4<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "What is the <i>x<\/i>-coordinate of the <i>x<\/i>-intercept of the line <i>y<\/i> + 6 = −3(<i>x<\/i> − 1)?", "ans": ["-1"], "sol": "Set <i>y<\/i> = 0: 6 = −3(<i>x<\/i> − 1), so <i>x<\/i> − 1 = −2 and <i>x<\/i> = −1. Answer: <b>−1<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Which equation is equivalent to 0.4<i>x<\/i> − 1.2<i>y<\/i> = 3.6?", "opts": ["<i>y<\/i> = 3<i>x<\/i> − 3", "<i>y<\/i> = −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> + 3", "<i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> − 3", "<i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> + 3"], "ans": 2, "sol": "−1.2<i>y<\/i> = −0.4<i>x<\/i> + 3.6. Divide by −1.2: <i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> − 3. Answer: <b><i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> − 3<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A drone flies in a straight line on a coordinate grid from (−4, 0) to (2, 9). Which equation describes the line along which it flies?", "opts": ["<i>y<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><i>x<\/i> + <span class=\"fq\"><span>8<\/span><span>3<\/span><\/span>", "<i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> + 6", "<i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> − 6", "<i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> + 9"], "ans": 1, "sol": "Slope: <span class=\"fq\"><span>9 − 0<\/span><span>2 − (−4)<\/span><\/span> = <span class=\"fq\"><span>9<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>. Using (−4, 0): 0 = −6 + <i>b<\/i>, so <i>b<\/i> = 6. Answer: <b><i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> + 6<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "On a town map drawn on a coordinate grid, a straight fence follows the line 2<i>x<\/i> + 7<i>y<\/i> = 42, and an east–west road runs along the <i>x<\/i>-axis. At which point does the fence meet the road?", "opts": ["(0, 6)", "(6, 0)", "(0, 21)", "(21, 0)"], "ans": 3, "sol": "On the <i>x<\/i>-axis, <i>y<\/i> = 0: 2<i>x<\/i> = 42, so <i>x<\/i> = 21. Answer: <b>(21, 0)<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "What is the slope of the line through (3, −8) and (−9, 1)?", "ans": ["-3/4", "-0.75", "-.75"], "sol": "Rise: 1 − (−8) = 9. Run: −9 − 3 = −12. <i>m<\/i> = <span class=\"fq\"><span>9<\/span><span>−12<\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>. Answer: <b>−3/4<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A line has equation <i>A<\/i><i>x<\/i> + <i>B<\/i><i>y<\/i> = <i>C<\/i>, where <i>A<\/i>, <i>B<\/i> and <i>C<\/i> are all positive constants. Which statement about the line is true?", "opts": ["Its slope is positive and its <i>y<\/i>-intercept is above the origin.", "Its slope is negative and its <i>y<\/i>-intercept is below the origin.", "Its slope is negative and its <i>y<\/i>-intercept is above the origin.", "Its slope is positive and its <i>y<\/i>-intercept is below the origin."], "ans": 2, "sol": "Slope = −<span class=\"fq\"><span><i>A<\/i><\/span><span><i>B<\/i><\/span><\/span> < 0. The <i>y<\/i>-intercept is (0, <span class=\"fq\"><span><i>C<\/i><\/span><span><i>B<\/i><\/span><\/span>) with <span class=\"fq\"><span><i>C<\/i><\/span><span><i>B<\/i><\/span><\/span> > 0. Answer: <b>negative slope, <i>y<\/i>-intercept above the origin<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "The equation <i>y<\/i> − 4 = −<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>(<i>x<\/i> + 10) can be written as 3<i>x<\/i> + 5<i>y<\/i> = <i>c<\/i>, where <i>c<\/i> is a constant. What is the value of <i>c<\/i>?", "ans": ["-10"], "sol": "Multiply by 5: 5<i>y<\/i> − 20 = −3(<i>x<\/i> + 10) = −3<i>x<\/i> − 30. So 3<i>x<\/i> + 5<i>y<\/i> = −10. Answer: <b>−10<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Line <i>p<\/i> passes through (6, −2) and has the same <i>y<\/i>-intercept as the line 4<i>x<\/i> − 3<i>y<\/i> = 12. Which equation represents line <i>p<\/i>?", "opts": ["<i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> − 4", "<i>y<\/i> = −<i>x<\/i> + 4", "<i>y<\/i> = −<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span><i>x<\/i> + 2", "<i>y<\/i> = 3<i>x<\/i> − 20"], "ans": 0, "sol": "For 4<i>x<\/i> − 3<i>y<\/i> = 12, <i>x<\/i> = 0 gives <i>y<\/i> = −4. Line <i>p<\/i> goes through (0, −4) and (6, −2): slope <span class=\"fq\"><span>2<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>. Answer: <b><i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> − 4<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A straight road has a grade of 6%, meaning its slope is 0.06. Over a horizontal distance of 2.5 kilometers, how many meters does the road rise?", "opts": ["15", "1,500", "60", "150"], "ans": 3, "sol": "2.5 km = 2,500 m. Rise = slope × run = 0.06 × 2,500 = 150 m. Answer: <b>150<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "In the <i>xy<\/i>-plane, the line 5<i>x<\/i> − <i>k<\/i><i>y<\/i> = 20, where <i>k<\/i> is a constant, has a <i>y<\/i>-intercept of (0, −8). What is the slope of the line?", "ans": ["2"], "sol": "Set <i>x<\/i> = 0: −<i>k<\/i>(−8) = 20, so <i>k<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>. Slope = −<span class=\"fq\"><span>5<\/span><span>−<i>k<\/i><\/span><\/span> = <span class=\"fq\"><span>5<\/span><span><i>k<\/i><\/span><\/span> = 5 ÷ <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span> = 2. Answer: <b>2<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "Two temperature scales, X and Y, are related linearly. A reading of 10 on scale X corresponds to 35 on scale Y, and a reading of 40 on scale X corresponds to 95 on scale Y. When the relationship is graphed with X on the horizontal axis, what is the X-coordinate of its horizontal-axis inte \/i><\/span><\/span>"], "ans": 2, "sol": "Slope from (<i>p<\/i>, 0) to (0, <i>q<\/i>): <span class=\"fq\"><span><i>q<\/i> − 0<\/span><span>0 − <i>p<\/i><\/span><\/span> = −<span class=\"fq\"><span><i>q<\/i><\/span><span><i>p<\/i><\/span><\/span>. Answer: <b>−<span class=\"fq\"><span><i>q<\/i><\/span><span><i>p<\/i><\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "On a design drawing on a coordinate grid, a straight handrail passes through (−6, 1) and (9, 11). Which equation represents the line of the handrail?", "opts": ["2<i>x<\/i> − 3<i>y<\/i> = 15", "2<i>x<\/i> − 3<i>y<\/i> = −15", "3<i>x<\/i> − 2<i>y<\/i> = −20", "2<i>x<\/i> + 3<i>y<\/i> = 15"], "ans": 1, "sol": "Slope: <span class=\"fq\"><span>11 − 1<\/span><span>9 − (−6)<\/span><\/span> = <span class=\"fq\"><span>10<\/span><span>15<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>. <i>y<\/i> − 1 = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>(<i>x<\/i> + 6); multiply by 3: 3<i>y<\/i> − 3 = 2<i>x<\/i> + 12, so 2<i>x<\/i> − 3<i>y<\/i> = −15. Answer: <b>2<i>x<\/i> − 3<i>y<\/i> = −15<\/b>"}, {"lo": "LO4", "diff": "X", "type": "spr", "q": "Line ℓ has slope −3. Its <i>x<\/i>-intercept is (<i>a<\/i>, 0) and its <i>y<\/i>-intercept is (0, <i>b<\/i>), where <i>a<\/i> = <i>b<\/i> + 4 and <i>b<\/i> ≠ 0. What is the value of <i>b<\/i>?", "ans": ["-6"], "sol": "Slope from (<i>a<\/i>, 0) to (0, <i>b<\/i>) is −<span class=\"fq\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>, so −<span class=\"fq\"><span><i>b<\/i><\/span><span><i>b<\/i> + 4<\/span><\/span> = −3. Then <i>b<\/i> = 3<i>b<\/i> + 12, so <i>b<\/i> = −6 (and <i>a<\/i> = −2). Check: <span class=\"fq\"><span>−6 − 0<\/span><span>0 − (−2)<\/span><\/span> = −3. ✓ Answer: <b>−6<\/b>"}, {"lo": "LO1", "diff": "X", "type": "mcq", "q": "The line through (1, 3) and (<i>k<\/i>, 9) has slope <i>k<\/i>, where <i>k<\/i> is a positive constant. What is the value of <i>k<\/i>?", "opts": ["−2", "6", "2", "3"], "ans n class=\"fq\"><span>144<\/span><span>9<\/span><\/span>) = √<span class=\"fq\"><span>400<\/span><span>9<\/span><\/span> = <span class=\"fq\"><span>20<\/span><span>3<\/span><\/span>. Answer: <b><span class=\"fq\"><span>20<\/span><span>3<\/span><\/span><\/b>"}], "unit_no": 1, "topic_no": "2", "code": "2.1"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
