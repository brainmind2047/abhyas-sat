var S = {"id": "ADV-2.2", "unit": "Advanced Math", "topic": "Nonlinear equations in one variable and systems", "title": "Discriminant, number of solutions and roots", "intro": "The discriminant <i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> tells you how many real solutions a quadratic equation has without solving it, and the sum and product of the roots can be read straight from the coefficients. On the Digital SAT these ideas appear as “how many solutions” questions, “find the constant” questions and questions that build or analyze a quadratic from its roots, often among the harder questions in Module 2.", "los": [{"id": "LO1", "text": "Use the discriminant <i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> to determine the number of real solutions of a quadratic equation, and connect it to the <i>x<\/i>-intercepts of a parabola."}, {"id": "LO2", "text": "Determine the values of a constant that give a quadratic equation exactly one, two or no real solutions."}, {"id": "LO3", "text": "Find the sum and product of the roots of a quadratic equation using <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> and <span class=\"fq\"><span><i>c<\/i><\/span><span><i>a<\/i><\/span><\/span>, without solving it."}, {"id": "LO4", "text": "Build a quadratic equation or function from its roots, or from a given sum and product of roots."}, {"id": "LO5", "text": "Solve and analyze quadratic equations that contain parameters, such as finding a constant from a known root or writing the solutions in terms of a constant."}], "notes": [{"lo": "LO1", "h": "What the discriminant measures", "html": "<p>Every quadratic equation can be written in standard form <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = 0, where <i>a<\/i> ≠ 0. The quadratic formula gives its solutions:<\/p><div class=\"eqs\"><i>x<\/i> = <span class=\"fq\"><span>−<i>b<\/i> ± √(<i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i>)<\/span><span>2<i>a<\/i><\/span><\/span><\/div><p>The expression under the radical, <i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i>, is called the <b>discriminant<\/b>. It decides how many real solutions there are, because a negative number has no real square root.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Discriminant<\/th><th>Real solutions<\/th><th>Reason<\/th><\/tr><tr><td><i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> &gt; 0<\/td><td>Exactly two<\/td><td>“±” gives two different values<\/td><\/tr><tr><td><i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> = 0<\/td><td>Exactly one<\/td><td>the radical is 0, so <i>x<\/i> = <span class=\"fq\"><span>−<i>b<\/i><\/span><span>2<i>a<\/i><\/span><\/span><\/td><\/tr><tr><td><i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> &lt; 0<\/td><td>None<\/td><td>no real square root exists<\/td><\/tr><\/table><\/div><div class=\"rule\">Write the equation in standard form first, then read <i>a<\/i>, <i>b<\/i> and <i>c<\/i> together with their signs.<\/div><p>For 2<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> − 5 = 0: (−3)<sup>2<\/sup> − 4(2)(−5) = 9 + 40 = 49, which is positive, so there are two real solutions.<\/p>"}, {"lo": "LO1", "h": "Seeing it on the graph", "html": "<p>The real solutions of <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = 0 are the <i>x<\/i>-intercepts of the parabola <i>y<\/i> = <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i>. So the discriminant also tells you how many times the graph meets the <i>x<\/i>-axis.<\/p><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Three upward parabolas with the same axis x = 1: a solid one with vertex (1, −4) crossing the <i>x<\/i>-axis at −1 and 3, a dashed one with vertex (1, 0) touching the <i>x<\/i>-axis once, and a dotted one with vertex (1, 3) that never meets the <i>x<\/i>-axis\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"6\" y1=\"130\" x2=\"254\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130\" y1=\"6\" x2=\"130\" y2=\"254\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" points=\"87.00,11.55 88.00,17.80 89.00,23.95 90.00,30.00 91.00,35.95 92.00,41.80 93.00,47.55 94.00,53.20 95.00,58.75 96.00,64.20 97.00,69.55 98.00,74.80 99.00,79.95 100.00,85.00 101.00,89.95 102.00,94.80 103.00,99.55 104.00,104.20 105.00,108.75 106.00,113.20 107.00,117.55 108.00,121.80 109.00,125.95 110.00,130.00 111.00,133.95 112.00,137.80 113.00,141.55 114.00,145.20 115.00,148.75 116.00,152.20 117.00,155.55 118.00,158.80 119.00,161.95 120.00,165.00 121.00,167.95 122.00,170.80 123.00,173.55 124.00,176.20 125.00,178.75 126.00,181.20 127.00,183.55 128.00,185.80 129.00,187.95 130.00,190.00 55 158.00,126.80 159.00,125.95 160.00,125.00 161.00,123.95 162.00,122.80 163.00,121.55 164.00,120.20 165.00,118.75 166.00,117.20 167.00,115.55 168.00,113.80 169.00,111.95 170.00,110.00 171.00,107.95 172.00,105.80 173.00,103.55 174.00,101.20 175.00,98.75 176.00,96.20 177.00,93.55 178.00,90.80 179.00,87.95 180.00,85.00 181.00,81.95 182.00,78.80 183.00,75.55 184.00,72.20 185.00,68.75 186.00,65.20 187.00,61.55 188.00,57.80 189.00,53.95 190.00,50.00 191.00,45.95 192.00,41.80 193.00,37.55 194.00,33.20 195.00,28.75 196.00,24.20 197.00,19.55 198.00,14.80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-dasharray=\"7 5\"/><polyline class=\"fg-fit\" points=\"116.00,12.20 117.00,15.55 118.00,18.80 119.00,21.95 120.00,25.00 121.00,27.95 122.00,30.80 123.00,33.55 124.00,36.20 125.00,38.75 126.00,41.20 127.00,43.55 128.00,45.80 129.00,47.95 130.00,50.00 131.00,51.95 132.00,53.80 133.00,55.55 134.00,57.20 135.00,58.75 136.00,60.20 137.00,61.55 138.00,62.80 139.00,63.95 140.00,65.00 141.00,65.95 142.00,66.80 143.00,67.55 144.00,68.20 145.00,68.75 146.00,69.20 147.00,69.55 148.00,69.80 149.00,69.95 150.00,70.00 151.00,69.95 152.00,69.80 153.00,69.55 154.00,69.20 155.00,68.75 156.00,68.20 157.00,67.55 158.00,66.80 159.00,65.95 160.00,65.00 161.00,63.95 162.00,62.80 163.00,61.55 164.00,60.20 165.00,58.75 166.00,57.20 167.00,55.55 168.00,53.80 169.00,51.95 170.00,50.00 171.00,47.95 172.00,45.80 173.00,43.55 174.00,41.20 175.00,38.75 176.00,36.20 177.00,33.55 178.00,30.80 179.00,27.95 180.00,25.00 181.00,21.95 182.00,18.80 183.00,15.55 184.00,12.20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-dasharray=\"2 4\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"110\" cy=\"130\" r=\"3\"/><circle cx=\"190\" cy=\"130\" r=\"3\"/><circle cx=\"150\" cy=\"130\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg><ul><li>Solid: <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 3, discriminant 4 + 12 = 16, two <i>x<\/i>-intercepts.<\/li><li>Dashed: <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + 1, discriminant 4 − 4 = 0, it touches the axis once.<\/li><li>Dotted: <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> + 4, discriminant 4 − 16 = −12, no <i>x<\/i>-intercepts.<\/li><\/ul><div class=\"tip\">If the discriminant is a perfect square (0, 1, 4, 9, 16, …), the solutions are rational and the quadratic factors over the integers. If it is positive but not a perfect square, expect answers with a square root.<\/div>"}, {"lo": "LO2", "h": "Finding a constant for a set number of solutions", "html": "<p>When a coefficient is unknown, translate the number of solutions into a statement about the discriminant and solve for the constant.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>The question says<\/th><th>Write<\/th><\/tr><tr><td>exactly one real solution<\/td><td><i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> = 0<\/td><\/tr><tr><td>two distinct real solutions<\/td><td><i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> &gt; 0<\/td><\/tr><tr><td>no real solutions<\/td><td><i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> &lt; 0<\/td><\/tr><tr><td>at least one real solution<\/td><td><i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> ≥ 0<\/td><\/tr><\/table><\/div><p>For <i>x<\/i><sup>2<\/sup> + 6<i>x<\/i> + <i>c<\/i> = 0, the discriminant is 36 − 4<i>c<\/i>. One solution: 36 − 4<i>c<\/i> = 0, so <i>c<\/i> = 9. Two solutions: <i>c<\/i> &lt; 9. No solutions: <i>c<\/i> &gt; 9.<\/p><div class=\"rule\">If the constant sits in front of <i>x<\/i><sup>2<\/sup>, the problem must also keep <i>a<\/i> ≠ 0; otherwise the equation is linear, not quadratic.<\/div><div class=\"tip\">When the unknown is <i>b<\/i>, the equation <i>b<\/i><sup>2<\/sup> = 4<i>a<\/i><i>c<\/i> usually has two answers, one positive and one negative. Read the question for a sign condition such as <i>b<\/i> &gt; 0.<\/div>"}, {"lo": "LO2", "h": "Rearrange before you test", "html": "<p>DSAT equations are rarely given in standard form. Expand and move every term to one side before you identify <i>a<\/i>, <i>b<\/i> and <i>c<\/i>.<\/p><div class=\"eqs\"><i>x<\/i>(<i>x<\/i> − 8) = <i>k<\/i><br><i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> − <i>k<\/i> = 0<\/div><p>Here <i>c<\/i> = −<i>k<\/i>, not <i>k<\/i>, so the discriminant is 64 + 4<i>k<\/i>.<\/p><p>The same idea answers questions about a horizontal line. The equation <i>f<\/i>(<i>x<\/i>) = <i>k<\/i> has as many solutions as the number of times the line <i>y<\/i> = <i>k<\/i> meets the graph of <i>f<\/i>. For a parabola that opens upward, a line through the vertex meets it once, a line above the vertex meets it twice and a line below meets it zero times.<\/p><div class=\"tip\">In a height model such as <i>h<\/i>(<i>t<\/i>) = −16<i>t<\/i><sup>2<\/sup> + <i>v<\/i><i>t<\/i> + <i>h<\/i><sub>0<\/sub>, you set <i>h<\/i>(<i>t<\/i>) equal to the target height, rearrange, and check the discriminant. A zero discriminant means the target is exactly the maximum height.<\/div>"}, {"lo": "LO3", "h": "Sum and product of the roots", "html": "<p>If <i>r<\/i> and <i>s<\/i> are the roots of <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = 0, then <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = <i>a<\/i>(<i>x<\/i> − <i>r<\/i>)(<i>x<\/i> − <i>s<\/i>) = <i>a<\/i><i>x<\/i><sup>2<\/sup> − <i>a<\/i>(<i>r<\/i> + <i>s<\/i>)<i>x<\/i> + <i>a<\/i><i>r<\/i><i>s<\/i>. Matching coefficients gives two shortcuts.<\/p><div class=\"rule\">Sum of the roots: <i>r<\/i> + <i>s<\/i> = <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>. Product of the roots: <i>r<\/i><i>s<\/i> = <span class=\"fq\"><span><i>c<\/i><\/span><span><i>a<\/i><\/span><\/span>.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Equation<\/th><th>Sum<\/th><th>Product<\/th><\/tr><tr><td><i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 10 = 0<\/td><td>7<\/td><td>10<\/td><\/tr><tr><td>3<i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> − 9 = 0<\/td><td><span class=\"fq\"><span>−4<\/span><span>3<\/span><\/span><\/td><td>−3<\/td><\/tr><tr><td>2<i>x<\/i><sup>2<\/sup> − 5 = 0<\/td><td>0<\/td><td><span class=\"fq\"><span>−5<\/span><span>2<\/span><\/span><\/td><\/tr><\/table><\/div><p>These work even when the roots are irrational, so a question asking for “the sum of the solutions” never requires the quadratic formula. Expressions such as <i>r<\/i><sup>2<\/sup> + <i>s<\/i><sup>2<\/sup> = (<i>r<\/i> + <i>s<\/i>)<sup>2<\/sup> − 2<i>r<\/i><i>s<\/i> and <span class=\"fq\"><span>1<\/span><span><i>r<\/i><\/span><\/span> + <span class=\"fq\"><span>1<\/span><span><i>s<\/i><\/span><\/span> = <span class=\"fq\"><span><i>r<\/i> + <i>s<\/i><\/span><span><i>r<\/i><i>s<\/i><\/span><\/span> can also be built from the sum and product.<\/p>"}, {"lo": "LO4", "h": "Building a quadratic from its roots", "html": "<p>A root <i>x<\/i> = <i>r<\/i> comes from a factor (<i>x<\/i> − <i>r<\/i>). So a quadratic with roots <i>r<\/i> and <i>s<\/i> is<\/p><div class=\"eqs\"><i>a<\/i>(<i>x<\/i> − <i>r<\/i>)(<i>x<\/i> − <i>s<\/i>) = 0, or <i>a<\/i>(<i>x<\/i><sup>2<\/sup> − (<i>r<\/i> + <i>s<\/i>)<i>x<\/i> + <i>r<\/i><i>s<\/i>) = 0<\/div><ul><li>Roots 4 and −1: (<i>x<\/i> − 4)(<i>x<\/i> + 1) = <i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> − 4.<\/li><li>A fractional root <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> gives the factor 3<i>x<\/i> − 2, which keeps integer coefficients.<\/li><li>Roots 5 ± √2: sum 10, product 25 − 2 = 23, so <i>x<\/i><sup>2<\/sup> − 10<i>x<\/i> + 23 = 0.<\/li><\/ul><p>Any nonzero multiple <i>a<\/i> gives the same roots. To pin down <i>a<\/i>, use one more fact, such as the <i>y<\/i>-intercept or another point on the graph.<\/p><div class=\"rule\">Root <i>r<\/i> ⇒ factor (<i>x<\/i> − <i>r<\/i>). Watch the sign: the root −6 gives (<i>x<\/i> + 6).<\/div>"}, {"lo": "LO5", "h": "Equations with parameters", "html": "<p>A <b>parameter<\/b> is a constant written as a letter, such as <i>k<\/i> in <i>x<\/i><sup>2<\/sup> + <i>k<\/i><i>x<\/i> − 12 = 0. Three moves handle most DSAT parameter questions.<\/p><ul><li><b>A root is given:<\/b> substitute it for <i>x<\/i> and solve for the parameter. Then use the sum or product of the roots to get the other root quickly.<\/li><li><b>Solve in terms of the parameter:<\/b> factor, complete the square or use the quadratic formula, treating the parameter as a number. For example, <i>x<\/i><sup>2<\/sup> − 5<i>k<\/i><i>x<\/i> + 6<i>k<\/i><sup>2<\/sup> = (<i>x<\/i> − 2<i>k<\/i>)(<i>x<\/i> − 3<i>k<\/i>), so <i>x<\/i> = 2<i>k<\/i> or <i>x<\/i> = 3<i>k<\/i>.<\/li><li><b>A condition links the roots<\/b> (one root is double the other, the roots differ by 4, and so on): name the roots and combine the condition with the sum and product.<\/li><\/ul><div class=\"tip\">Check your parameter in the original equation. A quick substitution catches sign slips, which are the source of most wrong answer choices.<\/div>"}], "examples": [{"lo": "LO1", "q": "How many real solutions does 3<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 4 = 0 have?", "steps": ["Identify <i>a<\/i> = 3, <i>b<\/i> = −5, <i>c<\/i> = 4.", "Discriminant: (−5)<sup>2<\/sup> − 4(3)(4) = 25 − 48 = −23.", "The discriminant is negative, so there is no real square root and no real solution."], "ans": "No real solutions"}, {"lo": "LO1", "q": "<div class=\"eqs\">4<i>x<\/i><sup>2<\/sup> + 9 = 12<i>x<\/i><\/div>How many real solutions does the equation have, and what are they?", "steps": ["Standard form: 4<i>x<\/i><sup>2<\/sup> − 12<i>x<\/i> + 9 = 0.", "Discriminant: (−12)<sup>2<\/sup> − 4(4)(9) = 144 − 144 = 0, so there is exactly one real solution.", "It is <i>x<\/i> = <span class=\"fq\"><span>−<i>b<\/i><\/span><span>2<i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>12<\/span><span>8<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>. Check: (2<i>x<\/i> − 3)<sup>2<\/sup> = 4<i>x<\/i><sup>2<\/sup> − 12<i>x<\/i> + 9."], "ans": "Exactly one real solution, <i>x<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>"}, {"lo": "LO2", "q": "<div class=\"eqs\"><i>k<\/i><i>x<\/i><sup>2<\/sup> − 12<i>x<\/i> + 9 = 0<\/div>In the equation above, <i>k<\/i> is a nonzero constant. For what value of <i>k<\/i> does the equation have exactly one real solution?", "steps": ["Exactly one solution means the discriminant is 0.", "(−12)<sup>2<\/sup> − 4(<i>k<\/i>)(9) = 144 − 36<i>k<\/i> = 0.", "<i>k<\/i> = 4. Check: 4<i>x<\/i><sup>2<\/sup> − 12<i>x<\/i> + 9 = (2<i>x<\/i> − 3)<sup>2<\/sup>, which has the single root <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>."], "ans": "<i>k<\/i> = 4"}, {"lo": "LO2", "q": "A ball is thrown upward. Its height, in feet, <i>t<\/i> seconds after release is <i>h<\/i>(<i>t<\/i>) = −16<i>t<\/i><sup>2<\/sup> + 48<i>t<\/i> + 5. For what height <i>H<\/i> is the ball at height <i>H<\/i> at exactly one moment?", "steps": ["Set −16<i>t<\/i><sup>2<\/sup> + 48<i>t<\/i> + 5 = <i>H<\/i> and rearrange: −16<i>t<\/i><sup>2<\/sup> + 48<i>t<\/i> + (5 − <i>H<\/i>) = 0.", "Exactly one moment means discriminant 0: 48<sup>2<\/sup> − 4(−16)(5 − <i>H<\/i>) = 2304 + 64(5 − <i>H<\/i>) = 0.", "Divide by 64: 36 + 5 − <i>H<\/i> = 0, so <i>H<\/i> = 41. This is the maximum height, reached at <i>t<\/i> = <span class=\"fq\"><span>48<\/span><span>32<\/span><\/span> = 1.5 seconds."], "ans": "<i>H<\/i> = 41 feet"}, {"lo": "LO3", "q": "Without solving, find the sum and the product of the solutions of 3<i>x<\/i><sup>2<\/sup> + 7<i>x<\/i> − 12 = 0.", "steps": ["Here <i>a<\/i> = 3, <i>b<\/i> = 7, <i>c<\/i> = −12.", "Sum: <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>−7<\/span><span>3<\/span><\/span>.", "Product: <span class=\"fq\"><span><i>c<\/i><\/span><span><i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>−12<\/span><span>3<\/span><\/span> = −4."], "ans": "Sum <span class=\"fq\"><span>−7<\/span><span>3<\/span><\/span>, product −4"}, {"lo": "LO4", "q": "Write a quadratic equation with integer coefficients whose solutions are <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> and −4.", "steps": ["The root <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> gives the factor 2<i>x<\/i> − 3; the root −4 gives <i>x<\/i> + 4.", "Multiply: (2<i>x<\/i> − 3)(<i>x<\/i> + 4) = 2<i>x<\/i><sup>2<\/sup> + 8<i>x<\/i> − 3<i>x<\/i> − 12 = 2<i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> − 12.", "Check with the shortcuts: sum <span class=\"fq\"><span>−5<\/span><span>2<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> + (−4) and product <span class=\"fq\"><span>−12<\/span><span>2<\/span><\/span> = −6 = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>(−4)."], "ans": "2<i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> − 12 = 0"}, {"lo": "LO5", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>k<\/i><i>x<\/i> − 18 = 0<\/div>One solution of the equation is <i>x<\/i> = 3. What is the value of <i>k<\/i>, and what is the other solution?", "steps": ["Substitute <i>x<\/i> = 3: 9 + 3<i>k<\/i> − 18 = 0, so 3<i>k<\/i> = 9 and <i>k<\/i> = 3.", "The product of the roots is <span class=\"fq\"><span><i>c<\/i><\/span><span><i>a<\/i><\/span><\/span> = −18, so the other root is <span class=\"fq\"><span>−18<\/span><span>3<\/span><\/span> = −6.", "Check: <i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 18 = (<i>x<\/i> − 3)(<i>x<\/i> + 6)."], "ans": "<i>k<\/i> = 3; the other solution is −6"}], "traps": ["Using the discriminant before the equation is in standard form. In 2<i>x<\/i><sup>2<\/sup> = 7<i>x<\/i> − 8, the value of <i>c<\/i> is +8 after you move everything to one side, not −8.", "Sign slips in <i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i>. The square <i>b<\/i><sup>2<\/sup> is never negative: if <i>b<\/i> = −6, then <i>b<\/i><sup>2<\/sup> = 36. And −4<i>a<\/i><i>c<\/i> becomes positive when <i>a<\/i> and <i>c<\/i> have opposite signs.", "Forgetting the minus sign or the division by <i>a<\/i>: the sum of the roots is <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>, not <i>b<\/i> or <span class=\"fq\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>, and the product is <span class=\"fq\"><span><i>c<\/i><\/span><span><i>a<\/i><\/span><\/span>, not <i>c<\/i>.", "Writing the wrong factor from a root. The root −5 gives (<i>x<\/i> + 5), and the root <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> gives (3<i>x<\/i> − 2), not (<i>x<\/i> − 2)(<i>x<\/i> − 3).", "Ignoring a sign condition. Equations such as <i>b<\/i><sup>2<\/sup> = 36 give <i>b<\/i> = 6 or <i>b<\/i> = −6; when the question says the constant is positive (or nonzero), use that to pick the answer."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\">2<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> − 3 = 0<\/div>What is the value of the discriminant of the equation above?", "opts": ["49", "1", "−1", "31"], "ans": 0, "sol": "Here <i>a<\/i> = 2, <i>b<\/i> = −5 and <i>c<\/i> = −3.<br><i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> = (−5)<sup>2<\/sup> − 4(2)(−3) = 25 + 24.<br>Answer: <b>49<\/b>", "hint": "Square <i>b<\/i> (a square is never negative), then subtract 4 times <i>a<\/i> times <i>c<\/i>; watch the two negative signs."}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "How many real solutions does <i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> + 7 = 0 have?", "opts": ["Exactly two real solutions", "Exactly one real solution", "No real solutions", "Infinitely many real solutions"], "ans": 2, "sol": "Discriminant: 4<sup>2<\/sup> − 4(1)(7) = 16 − 28 = −12.<br>A negative discriminant means no real square root, so there are no real solutions.<br>Answer: <b>No real solutions<\/b>", "hint": "Compute <i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> and look only at its sign."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "What is the sum of the solutions of <i>x<\/i><sup>2<\/sup> − 9<i>x<\/i> + 14 = 0?", "opts": ["−9", "9", "14", "−14"], "ans": 1, "sol": "Sum of the roots = <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>−(−9)<\/span><span>1<\/span><\/span> = 9.<br>(Check: the roots are 2 and 7.)<br>Answer: <b>9<\/b>", "hint": "Use the shortcut <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>, and be careful with the sign of <i>b<\/i>."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Which equation has solutions <i>x<\/i> = 5 and <i>x<\/i> = −2?", "opts": ["<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 10 = 0", "<i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 10 = 0", "<i>x<\/i><sup>2<\/sup> + 7<i>x<\/i> + 10 = 0", "<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> − 10 = 0"], "ans": 3, "sol": "The factors are (<i>x<\/i> − 5) and (<i>x<\/i> + 2).<br>(<i>x<\/i> − 5)(<i>x<\/i> + 2) = <i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 5<i>x<\/i> − 10 = <i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> − 10.<br>Answer: <b><i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> − 10 = 0<\/b>", "hint": "A solution <i>x<\/i> = <i>r<\/i> comes from a factor (<i>x<\/i> − <i>r<\/i>)."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> − 10<i>x<\/i> + <i>c<\/i> = 0<\/div>In the equation above, <i>c<\/i> is a constant. If the equation has exactly one real solution, what is the value of <i>c<\/i>?", "ans": ["25"], "sol": "Exactly one solution means <i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> = 0.<br>(−10)<sup>2<\/sup> − 4(1)(<i>c<\/i>) = 100 − 4<i>c<\/i> = 0, so <i>c<\/i> = 25.<br>Answer: <b>25<\/b>", "hint": "Translate “exactly one real solution” into a statement about the discriminant."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The graph of <i>y<\/i> = <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> is shown, where <i>a<\/i>, <i>b<\/i> and <i>c<\/i> are constants. Which of the following must be true?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"A downward-opening parabola with vertex (1, −2) passing through (0, −3); it lies entirely below the <i>x<\/i>-axis\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"6\" y1=\"130\" x2=\"254\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130\" y1=\"6\" x2= >x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>", "opts": ["<i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> &lt; 0", "<i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> = 0", "<i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> &gt; 0", "<i>c<\/i> &gt; 0"], "ans": 0, "sol": "The parabola never meets the <i>x<\/i>-axis, so <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = 0 has no real solutions.<br>No real solutions means a negative discriminant. (Also, the <i>y<\/i>-intercept is −3, so <i>c<\/i> &lt; 0.)<br>Answer: <b><i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> &lt; 0<\/b>", "hint": "How many <i>x<\/i>-intercepts does the graph have, and what does that say about the discriminant?"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The solutions of 4<i>x<\/i><sup>2<\/sup> − 12<i>x<\/i> − 7 = 0 are <i>r<\/i> and <i>s<\/i>. What is the value of <i>r<\/i><i>s<\/i>?", "opts": ["<span class=\"fq\"><span>7<\/span><span>4<\/span><\/span>", "<span class=\"fq\"><span>−7<\/span><span>4<\/span><\/span>", "−7", "3"], "ans": 1, "sol": "Product of the roots = <span class=\"fq\"><span><i>c<\/i><\/span><span><i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>−7<\/span><span>4<\/span><\/span>.<br>(The value 3 is the sum, <span class=\"fq\"><span>12<\/span><span>4<\/span><\/span>.)<br>Answer: <b><span class=\"fq\"><span>−7<\/span><span>4<\/span><\/span><\/b>", "hint": "The product of the roots uses <i>c<\/i> and <i>a<\/i>, including the sign of <i>c<\/i>."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> + <i>k<\/i> = 0<\/div>In the equation above, <i>k<\/i> is a constant. If <i>x<\/i> = −6 is one solution, what is the other solution?", "opts": ["−2", "10", "2", "−12"], "ans": 2, "sol": "The sum of the roots is <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> = −4.<br>So −6 + <i>s<\/i> = −4, which gives <i>s<\/i> = 2.<br>(Check: <i>k<\/i> = (−6)(2) = −12, and <i>x<\/i><  + 3 = <i>H<\/i>: the discriminant is 32<sup>2<\/sup> + 64(3 − <i>H<\/i>) = 64(19 − <i>H<\/i>).<br>There is a solution only when 19 − <i>H<\/i> ≥ 0, that is, <i>H<\/i> ≤ 19.<br>So 21 feet is never reached.<br>Answer: <b>21 feet<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Which equation has solutions 3 + √2 and 3 − √2?", "opts": ["<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 7 = 0", "<i>x<\/i><sup>2<\/sup> + 6<i>x<\/i> + 7 = 0", "<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 11 = 0", "<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> − 7 = 0"], "ans": 0, "sol": "Sum: (3 + √2) + (3 − √2) = 6.<br>Product: (3 + √2)(3 − √2) = 9 − 2 = 7.<br>So the equation is <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 7 = 0.<br>Answer: <b><i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 7 = 0<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> − 2<i>k<\/i><i>x<\/i> + <i>k<\/i><sup>2<\/sup> − 9 = 0<\/div>In the equation above, <i>k<\/i> is a constant. What are the solutions of the equation in terms of <i>k<\/i>?", "opts": ["<i>x<\/i> = −<i>k<\/i> + 3 and <i>x<\/i> = −<i>k<\/i> − 3", "<i>x<\/i> = 3<i>k<\/i> and <i>x<\/i> = −3<i>k<\/i>", "<i>x<\/i> = <i>k<\/i> + 3 and <i>x<\/i> = <i>k<\/i> − 3", "<i>x<\/i> = <i>k<\/i> + 9 and <i>x<\/i> = <i>k<\/i> − 9"], "ans": 2, "sol": "The first three terms form a perfect square: (<i>x<\/i> − <i>k<\/i>)<sup>2<\/sup> − 9 = 0.<br>So (<i>x<\/i> − <i>k<\/i>)<sup>2<\/sup> = 9 and <i>x<\/i> − <i>k<\/i> = ±3.<br>Answer: <b><i>x<\/i> = <i>k<\/i> + 3 and <i>x<\/i> = <i>k<\/i> − 3<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A company's profit, in thousands of dollars, from selling <i>x<\/i> hundred units is <i>P<\/i>(<i>x<\/i>) = −2<i>x<\/i><sup>2<\/sup> + 40<i>x<\/i> − 150. The company breaks even, <i>P<\/i>(<i>x<\/i>) = 0, at two production levels. What is the sum of these two production levels, in hundreds of units?", "opts": ["−20", "20", "75", "40"], "ans": 1, "sol": "The break-even levels are the roots of −2<i>x<\/i><sup>2<\/sup> + 40<i>x<\/i> − 150 = 0.<br>Sum = <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>−40<\/span><span>−2<\/span><\/span> = 20.<br>Answer: <b>20<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A rectangle has a perimeter of 20 meters. If its width is <i>x<\/i> meters, its area is <i>x<\/i>(10 − <i>x<\/i>) square meters. Which of the following areas is NOT possible for this rectangle?", "opts": ["16 square meters", "21 square meters", "25 square meters", "30 square meters"], "ans": 3, "sol": "Area <i>A<\/i> requires <i>x<\/i>(10 − <i>x<\/i>) = <i>A<\/i>, or <i>x<\/i><sup>2<\/sup> − 10<i>x<\/i> + <i>A<\/i> = 0.<br>A real width exists only if 100 − 4<i>A<\/i> ≥ 0, so <i>A<\/i> ≤ 25.<br>An area of 30 gives a discriminant of 100 − 120 = −20.<br>Answer: <b>30 square meters<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "The arch of a footbridge is modeled by <i>h<\/i>(<i>x<\/i>) = −0.5<i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i>, where <i>h<\/i>(<i>x<\/i>) is the height, in meters, of the arch <i>x<\/i> meters from one end. The arch meets the ground at <i>x<\/i> = 0 and <i>x<\/i> = 12. What is the value of <i>b<\/i>?", "ans": ["6"], "sol": "The zeros 0 and 12 give <i>h<\/i>(<i>x<\/i>) = −0.5<i>x<\/i>(<i>x<\/i> − 12).<br>Expand: −0.5<i>x<\/i><sup>2<\/sup> + 6<i>x<\/i>, so <i>b<\/i> = 6 and <i>c<\/i> = 0.<br>Answer: <b>6<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>k<\/i><i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> + 1 = 0<\/div>In the equation above, <i>k<\/i> is a nonzero constant. For which values of <i>k<\/i> does the equation have no real solutions?", "opts": ["<i>k<\/i> &gt; 4", "<i>k<\/i> &lt; 4", "<i>k<\/i> &gt; 16", "<i>k<\/i> &gt; <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>"], "ans": 0, "sol": "No real solutions: 16 − 4(<i>k<\/i>)(1) &lt; 0.<br>16 &lt; 4<i>k<\/i>, so <i>k<\/i> &gt; 4.<br>Answer: <b><i>k<\/i> &gt; 4<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + (<i>k<\/i> − 1)<i>x<\/i> + 9 = 0<\/div>In the equation above, <i>k<\/i> is a positive constant. If the equation has exactly one real solution, what is the value of <i>k<\/i>?", "ans": ["7"], "sol": "Discriminant 0: (<i>k<\/i> − 1)<sup>2<\/sup> − 36 = 0.<br><i>k<\/i> − 1 = 6 or <i>k<\/i> − 1 = −6, so <i>k<\/i> = 7 or <i>k<\/i> = −5.<br><i>k<\/i> is positive, so <i>k<\/i> = 7.<br>Answer: <b>7<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\">2<i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> − 15 = 0<\/div>In the equation above, <i>b<\/i> is a constant. If one solution is <i>x<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>, what is the other solution?", "opts": ["3", "−3", "−6", "<span class=\"fq\"><span>−5<\/span><span>2<\/span><\/span>"], "ans": 1, "sol": "The product of the roots is <span class=\"fq\"><span><i>c<\/i><\/span><span><i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>−15<\/span><span>2<\/span><\/span>.<br>So <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span> × <i>s<\/i> = <span class=\"fq\"><span>−15<\/span><span>2<\/span><\/span>, which gives <i>s<\/i> = −3.<br>(Then <i>b<\/i> = 1, since the sum is <span class=\"fq\"><span>−1<\/span><span>2<\/span><\/span>.)<br>Answer: <b>−3<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The length and width, in meters, of a rectangular poster are the two solutions of 2<i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 6 = 0. What is the perimeter of the poster, in meters?", "opts": ["3.5", "3", "7", "6"], "ans": 2, "sol": "Length + width = <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>.<br>Perimeter = 2 × <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span> = 7.<br>Answer: <b>7<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> − (<i>k<\/i> + 3)<i>x<\/i> + 3<i>k<\/i> = 0<\/div>In the equation above, <i>k<\/i> is a constant greater than 3. If the two solutions differ by 5, what is the value of <i>k<\/i>?", "ans": ["8"], "sol": "Factor: (<i>x<\/i> − 3)(<i>x<\/i> − <i>k<\/i>) = 0, so the solutions are 3 and <i>k<\/i>.<br>Since <i>k<\/i> &gt; 3, <i>k<\/i> − 3 = 5, so <i>k<\/i> = 8.<br>Answer: <b>8<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "How many distinct real solutions does (<i>x<\/i> − 3)<sup>2<\/sup> = 4<i>x<\/i> − 21 have?", "opts": ["Exactly two real solutions", "Exactly one real solution", "No real solutions", "Infinitely many real solutions"], "ans": 2, "sol": "Expand: <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 9 = 4<i>x<\/i> − 21, so <i>x<\/i><sup>2<\/sup> − 10<i>x<\/i> + 30 = 0.<br>Discriminant: 100 − 120 = −20.<br>Answer: <b>No real solutions<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "What is the sum of the solutions of 5<i>x<\/i><sup>2<\/sup> = 3<i>x<\/i> + 7?", "opts": ["<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>−3<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>7<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>−7<\/span><span>5<\/span><\/span>"], "ans": 0, "sol": "Standard form: 5<i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> − 7 = 0.<br>Sum = <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>3<\/span><span>5<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The quadratic function <i>f<\/i> has zeros at <i>x<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> and <i>x<\/i> = 3, and <i>f<\/i>(0) = 6. Which of the following defines <i>f<\/i>?", "opts": ["<i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 3", "<i>f<\/i>(<i>x<\/i>) = 4<i>x<\/i><sup>2<\/sup> + 14<i>x<\/i> + 6", "<i>f<\/i>(<i>x<\/i>) = 6<i>x<\/i><sup>2<\/sup> − 21<i>x<\/i> + 9", "<i>f<\/i>(<i>x<\/i>) = 4<i>x<\/i><sup>2<\/sup> − 14<i>x<\/i> + 6"], "ans": 3, "sol": "The zeros give <i>f<\/i>(<i>x<\/i>) = <i>a<\/i>(2<i>x<\/i> − 1)(<i>x<\/i> − 3).<br><i>f<\/i>(0) = <i>a<\/i>(−1)(−3) = 3<i>a<\/i> = 6, so <i>a<\/i> = 2.<br><i>f<\/i>(<i>x<\/i>) = 2(2<i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 3) = 4<i>x<\/i><sup>2<\/sup> − 14<i>x<\/i> + 6.<br>Answer: <b><i>f<\/i>(<i>x<\/i>) = 4<i>x<\/i><sup>2<\/sup> − 14<i>x<\/i> + 6<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "<div class=\"eqs\"><i>x<\/i>(<i>x<\/i> − 8) = <i>k<\/i><\/div>In the equation above, <i>k<\/i> is a constant. If the equation has exactly one real solution, what is the value of <i>k<\/i>?", "ans": ["-16"], "sol": "Rearrange: <i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> − <i>k<\/i> = 0.<br>Discriminant 0: 64 − 4(1)(−<i>k<\/i>) = 64 + 4<i>k<\/i> = 0.<br><i>k<\/i> = −16.<br>Answer: <b>−16<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> − 6<i>a<\/i><i>x<\/i> + 8<i>a<\/i><sup>2<\/sup> = 0<\/div>In the equation above, <i>a<\/i> is a positive constant. Which of the following is a solution of the equation?", "opts": ["−4<i>a<\/i>", "4<i>a<\/i>", "8<i>a<\/i>", "−2<i>a<\/i>"], "ans": 1, "sol": "Factor: (<i>x<\/i> − 2<i>a<\/i>)(<i>x<\/i> − 4<i>a<\/i>) = 0.<br>The solutions are 2<i>a<\/i> and 4<i>a<\/i>.<br>Answer: <b>4<i>a<\/i><\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A store's weekly revenue, in dollars, from selling a scarf at a price of <i>p<\/i> dollars is <i>R<\/i>(<i>p<\/i>) = −15<i>p<\/i><sup>2<\/sup> + 600<i>p<\/i>. For how many prices <i>p<\/i> is the weekly revenue exactly 6,000 dollars?", "opts": ["No price", "Exactly one price", "Exactly two prices", "Infinitely many prices"], "ans": 1, "sol": "Set −15<i>p<\/i><sup>2<\/sup> + 600<i>p<\/i> = 6000 and divide by −15: <i>p<\/i><sup>2<\/sup> − 40<i>p<\/i> + 400 = 0.<br>Discriminant: 1600 − 1600 = 0, so there is one price, <i>p<\/i> = 20.<br>Answer: <b>Exactly one price<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "The daily profit, in hundreds of dollars, of a food stall that sells <i>x<\/i> hundred meals is <i>P<\/i>(<i>x<\/i>) = −2<i>x<\/i><sup>2<\/sup> + 6<i>x<\/i> − <i>c<\/i>, where <i>c<\/i> is the fixed daily cost in hundreds of dollars. For which values of <i>c<\/i> does the stall break even, <i>P<\/i>(<i>x<\/i>) = 0, for at least one value of <i>x<\/i>?", "opts": ["<i>c<\/i> &lt; <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>", "<i>c<\/i> ≥ <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>", "<i>c<\/i> ≤ <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>", "<i>c<\/i> ≤ 18"], "ans": 2, "sol": "<i>P<\/i>(<i>x<\/i>) = 0 is 2<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + <i>c<\/i> = 0.<br>At least one real solution needs 36 − 8<i>c<\/i> ≥ 0, so <i>c<\/i> ≤ <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>.<br>(The roots add to 3, so the larger one is positive.)<br>Answer: <b><i>c<\/i> ≤ <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "The solutions of <i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 3 = 0 are <i>r<\/i> and <i>s<\/i>. What is the value of <span class=\"fq\"><span>1<\/span><span><i>r<\/i><\/span><\/span> + <span class=\"fq\"><span>1<\/span><span><i>s<\/i><\/span><\/span>?", "ans": ["7/3", "2.333"], "sol": "<span class=\"fq\"><span>1<\/span><span><i>r<\/i><\/span><\/span> + <span class=\"fq\"><span>1<\/span><span><i>s<\/i><\/span><\/span> = <span class=\"fq\"><span><i>r<\/i> + <i>s<\/i><\/span><span><i>r<\/i><i>s<\/i><\/span><\/span>.<br><i>r<\/i> + <i>s<\/i> = 7 and <i>r<\/i><i>s<\/i> = 3.<br>So the value is <span class=\"fq\"><span>7<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>7<\/span><span>3<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) is shown, where <i>f<\/i>(<i>x<\/i>) = <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> and <i>a<\/i>, <i>b<\/i> and <i>c<\/i feet with an initial speed of <i>v<\/i> feet per second. Its height, in feet, after <i>t<\/i> seconds is <i>h<\/i>(<i>t<\/i>) = −16<i>t<\/i><sup>2<\/sup> + <i>v<\/i><i>t<\/i> + 4. For which values of <i>v<\/i> does the ball reach a height of 40 feet?", "opts": ["<i>v<\/i> ≥ 24", "<i>v<\/i> ≥ 96", "<i>v<\/i> ≥ 48", "<i>v<\/i> ≥ 2,304"], "ans": 2, "sol": "Set −16<i>t<\/i><sup>2<\/sup> + <i>v<\/i><i>t<\/i> + 4 = 40: 16<i>t<\/i><sup>2<\/sup> − <i>v<\/i><i>t<\/i> + 36 = 0.<br>A real solution needs <i>v<\/i><sup>2<\/sup> − 4(16)(36) ≥ 0, so <i>v<\/i><sup>2<\/sup> ≥ 2304.<br>With <i>v<\/i> &gt; 0, <i>v<\/i> ≥ 48.<br>Answer: <b><i>v<\/i> ≥ 48<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + 24 = 0<\/div>In the equation above, <i>b<\/i> is a negative constant. The two solutions of the equation differ by 2. What is the value of <i>b<\/i>?", "ans": ["-10"], "sol": "Let the roots be <i>r<\/i> and <i>r<\/i> + 2. Their product is <i>r<\/i>(<i>r<\/i> + 2) = 24, so <i>r<\/i> = 4 (or −6).<br>With <i>b<\/i> &lt; 0, the sum <span class=\"fq\"><span>−<i>b<\/i><\/span><span><i>a<\/i><\/span><\/span> is positive, so the roots are 4 and 6.<br><i>b<\/i> = −(4 + 6) = −10.<br>Answer: <b>−10<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "In the equation <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> = 0, <i>a<\/i>, <i>b<\/i> and <i>c<\/i> are constants, and <i>a<\/i> and <i>c<\/i> have opposite signs. Which of the following must be true?", "opts": ["Exactly two real solutions exist", "Exactly one real solution exists", "No real solutions exist", "It cannot be determined without the value of <i>b<\/i>"], "ans": 0, "sol": "If <i>a<\/i> and <i>c<\/i> have opposite signs, then <i>a<\/i><i>c<\/i> &lt; 0, so −4<i>a<\/i><i>c<\/i> &gt; 0.<br>Then <i>b<\/i><sup>2<\/sup> − 4<i>a<\/i><i>c<\/i> is a nonnegative number plus a positive number, so it is positive.<br>Answer: <b>Exactly two real solutions exist<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "The height, in meters, of a hanging cable above a road is modeled by a quadratic function <i>g<\/i>(<i>x<\/i>), where <i>x<\/i> is the horizontal distance, in meters, from a tower. The graph of <i>g<\/i> has zeros at <i>x<\/i> = −4 and <i>x<\/i> = 8, and <i>g<\/i>(2) = 72. What is the value of <i>g<\/i>(0), the height of the cable at the tower?", "ans": ["64"], "sol": "Write <i>g<\/i>(<i>x<\/i>) = <i>a<\/i>(<i>x<\/i> + 4)(<i>x<\/i> − 8).<br><i>g<\/i>(2) = <i>a<\/i>(6)(−6) = −36<i>a<\/i> = 72, so <i>a<\/i> = −2.<br><i>g<\/i>(0) = −2(4)(−8) = 64.<br>Answer: <b>64<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + <i>k<\/i> = 0<\/div>In the equation above, <i>k<\/i> is a constant. If one solution is 2 + √3, what is the value of <i>k<\/i>?", "opts": ["7", "1", "−1", "3"], "ans": 1, "sol": "The other solution is 4 − (2 + √3) = 2 − √3, since the sum is 4.<br><i>k<\/i> is the product: (2 + √3)(2 − √3) = 4 − 3 = 1.<br>Answer: <b>1<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "The height, in meters, of a projectile <i>t<\/i> seconds after launch is <i>h<\/i>(<i>t<\/i>) = −4.9<i>t<\/i><sup>2<\/sup> + 19.6<i>t<\/i> + 1.5. A student rewrites <i>h<\/i>(<i>t<\/i>) = 25 as 4.9<i>t<\/i><sup>2<\/sup> − 19.6<i>t<\/i> + 23.5 = 0. Which statement is true?", "opts": ["The projectile is at 25 meters at two different times.", "The projectile is at 25 meters at exactly one time.", "The projectile reaches 25 meters only after it lands.", "The projectile never reaches a height of 25 meters."], "ans": 3, "sol": "Discriminant: 19.6<sup>2<\/sup> − 4(4.9)(23.5) = 384.16 − 460.6 = −76.44.<br>It is negative, so <i>h<\/i>(<i>t<\/i>) = 25 has no real solution.<br>Answer: <b>The projectile never reaches a height of 25 meters.<\/b>"}, {"lo": "LO2", "diff": "X", "type": "spr", "q": "<div class=\"eqs\"><i>x<\/i><sup>2<\/sup> + (<i>k<\/i> − 3)<i>x<\/i> + <i>k<\/i> = 0<\/div>In the equation above, <i>k<\/i> is a constant. The equation has exactly one real solution for two different values of <i>k<\/i>. What is the greater of these two values?", "ans": ["9"], "sol": "Discriminant 0: (<i>k<\/i> − 3)<sup>2<\/sup> − 4<i>k<\/i> = 0.<br><i>k<\/i><sup>2<\/sup> − 10<i>k<\/i> + 9 = 0, so (<i>k<\/i> − 1)(<i>k<\/i> − 9) = 0.<br><i>k<\/i> = 1 or <i>k<\/i> = 9; the greater is 9.<br>Answer: <b>9<\/b>"}, {"lo": "LO3", "diff": "X", "type": "mcq", "q": "The solutions of 2<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 1 = 0 are <i>r<\/i> and <i>s<\/i>. What is the value of <i>r<\/i><sup>2<\/sup> + <i>s<\/i><sup>2<\/sup>?", "opts": ["9", "7", "8", "10"], "ans": 2, "sol": "<i>r<\/i> + <i>s<\/i> = 3 and <i>r<\/i><i>s<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>.<br><i>r<\/i><sup>2<\/sup> + <i>s<\/i><sup>2<\/sup> = (<i>r<\/i> + <i>s<\/i>)<sup>2<\/sup> − 2<i>r<\/i><i>s<\/i> = 9 − 1 = 8.<br>Answer: <b>8<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "Each solution of a quadratic equation is 3 more than a solution of <i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 2 = 0. Which of the following could be that equation?", "opts": ["<i>x<\/i><sup>2<\/sup> − 11<i>x<\/i> + 26 = 0", "<i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 4 = 0", "<i>x<\/i><sup>2<\/sup> − 11<i>x<\/i> + 11 = 0", "<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> + 5 = 0"], "ans": 0, "sol": "If the old roots are <i>r<\/i> and <i>s<\/i>, then <i>r<\/i> + <i>s<\/i> = 5 and <i>r<\/i><i>s<\/i> = 2.<br>New sum: (<i>r<\/i> + 3) + (<i>s<\/i> + 3) = 11.<br>New product: (<i>r<\/i> + 3)(<i>s<\/i> + 3) = <i>r<\/i><i>s<\/i> + 3(<i>r<\/i> + <i>s<\/i>) + 9 = 2 + 15 + 9 = 26.<br>Answer: <b><i>x<\/i><sup>2<\/sup> − 11<i>x<\/i> + 26 = 0<\/b>"}, {"lo": "LO5", "diff": "X", "type": "mcq", "q": "The equations <i>x<\/i><sup>2<\/sup> + <i>k<\/i><i>x<\/i> + 8 = 0 and <i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 6 = 0 have exactly one solution in common, and <i>k<\/i> is a positive constant. What is the value of <i>k<\/i>?", "opts": ["−6", "<span class=\"fq\"><span>17<\/span><span>3<\/span><\/span>", "6", "<span class=\"fq\"><span>−17<\/span><span>3<\/span><\/span>"], "ans": 1, "sol": "<i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 6 = (<i>x<\/i> + 3)(<i>x<\/i> − 2), so the common solution is 2 or −3.<br>If it is 2: 4 + 2<i>k<\/i> + 8 = 0 gives <i>k<\/i> = −6, which is not positive.<br>If it is −3: 9 − 3<i>k<\/i> + 8 = 0 gives <i>k<\/i> = <span class=\"fq\"><span>17<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>17<\/span><span>3<\/span><\/span><\/b>"}], "unit_no": 2, "topic_no": "2", "code": "2.2"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

/* ---------- shared question widget ---------- */
function qBody(q, sel, name){
  var h='<div class="qtext">'+q.q+'</div>';
  if(q.type==='spr'){
    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';
  } else {
    h+='<div class="opts" role="radiogroup">'+q.opts.map(function(o,k){ return '<button type="button" class="opt" role="radio" aria-checked="'+(sel===k)+'" data-k="'+k+'"><span class="let">'+letter(k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';
  }
  return h;
}

/* ---------- LEARN ---------- */
function renderLearn(jump){

    LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><a href="#" data-sheet="'+i+'">'+l.text+'</a>'+(ST.done[l.id]?'<span class="lo-done">✓ Done</span>':'')+'</li>'; }).join('')+'</ul>'+
    '<div class="sheetnav" role="tablist" aria-label="Learning sheets">'+LOS.map(function(l,i){ return '<button class="tab'+(ST.done[l.id]?' done':'')+'" role="tab" data-sheet="'+i+'" aria-selected="'+(i===cur)+'">Sheet '+(i+1)+'</button>'; }).join('')+

      var gi=S.guided.indexOf(q);
      h+='<div class="try" data-g="'+gi+'"><h3>Question '+(qi+1)+' of '+G.length+' <span class="pill '+q.diff+'" style="margin-left:6px">'+DIFF[q.diff]+'</span></h3>'+qBody(q,null,'g-'+gi)+'<div class="ex-ctrl">'+(q.hint?'<button class="btn" data-hint>Show hint</button>':'')+'<button class="btn btn-primary" data-check>Check answer</button></div><div class="hint" hidden>'+(q.hint||'')+'</div><div class="fbk"></div></div>';
    });
    h+='<label class="donebox"><input type="checkbox" id="done-'+esc(L.id)+'" data-done="'+esc(L.id)+'"'+(ST.done[L.id]?' checked':'')+'> I can do this objective</label>';
    h+='<div class="qnav"><button class="btn" data-go="'+(cur-1)+'"'+(cur===0?' disabled':'')+'>Previous sheet</button><button class="btn btn-primary" data-go="'+(cur+1)+'">'+(cur===LOS.length-1?'Go to recap':'Next sheet')+'</button></div></section>';
  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+

  }

function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+

    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;

        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';

    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
