var S = {"id": "ADV-3.3", "unit": "Advanced Math", "topic": "Nonlinear functions", "title": "Polynomial functions, zeros and graphs", "intro": "The zeros of a polynomial, its linear factors and the <i>x<\/i>-intercepts of its graph are three views of the same information. On the Digital SAT you will use the factor and remainder theorems, read zeros, sign and end behavior from graphs, work with absolute value graphs, and state the domain and range of nonlinear functions, often in a real-world setting.", "los": [{"id": "LO1", "text": "Connect the zeros, factors and <i>x<\/i>-intercepts of a polynomial function by using the factor theorem."}, {"id": "LO2", "text": "Determine the remainder when a polynomial is divided by <i>x<\/i> − <i>a<\/i>, and use remainders to find unknown values."}, {"id": "LO3", "text": "Interpret the graph of a polynomial function: its zeros, where it is positive or negative, the effect of multiplicity, and its end behavior."}, {"id": "LO4", "text": "Analyze absolute value functions through their equations, graphs and real-world meaning."}, {"id": "LO5", "text": "Determine the domain and range of nonlinear functions from equations, graphs and contexts."}], "notes": [{"lo": "LO1", "h": "Zeros, factors and <i>x<\/i>-intercepts", "html": "<p>A <b>zero<\/b> of a function <i>f<\/i> is an input that makes the output 0. When a polynomial is in factored form, set each factor equal to 0. For <i>p<\/i>(<i>x<\/i>) = (<i>x<\/i> + 2)(<i>x<\/i> − 3)(2<i>x<\/i> − 5):<\/p><div class=\"eqs\"><i>x<\/i> + 2 = 0, so <i>x<\/i> = −2<br><i>x<\/i> − 3 = 0, so <i>x<\/i> = 3<br>2<i>x<\/i> − 5 = 0, so <i>x<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><\/div><p>Each real zero is also an <i>x<\/i>-intercept: the graph of <i>y<\/i> = <i>p<\/i>(<i>x<\/i>) meets the <i>x<\/i>-axis at (−2, 0), (3, 0) and (<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>, 0).<\/p><div class=\"rule\">Factor theorem: <i>p<\/i>(<i>a<\/i>) = 0 exactly when <i>x<\/i> − <i>a<\/i> is a factor of <i>p<\/i>(<i>x<\/i>). So \"<i>a<\/i> is a zero\", \"<i>x<\/i> − <i>a<\/i> is a factor\" and \"(<i>a<\/i>, 0) is an <i>x<\/i>-intercept\" all say the same thing.<\/div><div class=\"tip\">Watch the sign. A zero of 4 gives the factor <i>x<\/i> − 4; a zero of −4 gives <i>x<\/i> + 4. A zero of <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span> matches the factor 2<i>x<\/i> − 5 (or <i>x<\/i> − <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>).<\/div>"}, {"lo": "LO1", "h": "Using the factor theorem", "html": "<p>The factor theorem works in both directions, which gives three common DSAT moves.<\/p><ul><li><b>Test a factor.<\/b> Is <i>x<\/i> + 3 a factor of <i>p<\/i>(<i>x<\/i>) = <i>x<\/i><sup>3<\/sup> + 4<i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 6? Compute <i>p<\/i>(−3) = −27 + 36 − 3 − 6 = 0, so yes.<\/li><li><b>Find a constant.<\/b> If <i>x<\/i> − 2 is a factor of <i>x<\/i><sup>3<\/sup> + <i>k<\/i><i>x<\/i> − 6, then 2<sup>3<\/sup> + 2<i>k<\/i> − 6 = 0, so <i>k<\/i> = −1.<\/li><li><b>Finish factoring.<\/b> Once one factor is known, divide it out (or match coefficients) and factor the quadratic that is left: <i>x<\/i><sup>3<\/sup> + 4<i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 6 = (<i>x<\/i> + 3)(<i>x<\/i><sup>2<\/sup> + <i>x<\/i> − 2) = (<i>x<\/i> + 3)(<i>x<\/i> + 2)(<i>x<\/i> − 1).<\/li><\/ul><div class=\"rule\">If a cubic has zeros <i>r<\/i><sub>1<\/sub>, <i>r<\/i><sub>2<\/sub> and <i>r<\/i><sub>3<\/sub>, then <i>p<\/i>(<i>x<\/i>) = <i>a<\/i>(<i>x<\/i> − <i>r<\/i><sub>1<\/sub>)(<i>x<\/i> − <i>r<\/i><sub>2<\/sub>)(<i>x<\/i> − <i>r<\/i><sub>3<\/sub>) for some constant <i>a<\/i>. One more point on the graph, such as the <i>y<\/i>-intercept, fixes <i>a<\/i>.<\/div>"}, {"lo": "LO2", "h": "The remainder theorem", "html": "<p>Dividing a polynomial <i>p<\/i>(<i>x<\/i>) by <i>x<\/i> − <i>a<\/i> gives a quotient <i>q<\/i>(<i>x<\/i>) and a remainder <i>r<\/i> that is just a number:<\/p><div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = (<i>x<\/i> − <i>a<\/i>)·<i>q<\/i>(<i>x<\/i>) + <i>r<\/i><\/div><p>Substitute <i>x<\/i> = <i>a<\/i>: the first term becomes 0, so <i>p<\/i>(<i>a<\/i>) = <i>r<\/i>.<\/p><div class=\"rule\">Remainder theorem: the remainder when <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> − <i>a<\/i> is <i>p<\/i>(<i>a<\/i>). A remainder of 0 means <i>x<\/i> − <i>a<\/i> is a factor.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Divide by<\/th><th>Evaluate<\/th><\/tr><tr><td><i>x<\/i> − 4<\/td><td><i>p<\/i>(4)<\/td><\/tr><tr><td><i>x<\/i> + 1<\/td><td><i>p<\/i>(−1)<\/td><\/tr><tr><td><i>x<\/i><\/td><td><i>p<\/i>(0)<\/td><\/tr><\/table><\/div><p>For example, dividing <i>p<\/i>(<i>x<\/i>) = 2<i>x<\/i><sup>3<\/sup> − 5<i>x<\/i> + 4 by <i>x<\/i> − 2 leaves <i>p<\/i>(2) = 16 − 10 + 4 = 10. No long division is needed.<\/p><div class=\"tip\">If a question gives the quotient and the remainder, rebuild <i>p<\/i>(<i>x<\/i>) = (<i>x<\/i> − <i>a<\/i>)<i>q<\/i>(<i>x<\/i>) + <i>r<\/i> and evaluate it wherever you need.<\/div>"}, {"lo": "LO3", "h": "Reading zeros and sign from a graph", "html": "<p>The graph below shows <i>y<\/i> = <i>f<\/i>(<i>x<\/i>), where <i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>(<i>x<\/i> + 3)(<i>x<\/i> − 1)(<i>x<\/i> − 4).<\/p><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Graph of a cubic curve that rises from the lower left, crosses the x-axis at −3, reaches a peak near (−1, 5), comes down through (0, 3), crosses the x-axis at 1, dips to about −3, and crosses again at 4 before rising to the upper right\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"6\" y1=\"130\" x2=\"254\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130\" y1=\"6\" x2=\"130\" y2=\"254\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" points=\"57.00,245.61 58.00,234.88 59.00,224.47 60.00,214.38 61.00,204.59 62.00,195.12 63.00,185.95 64.00,177.09 65.00,168.52 66.00,160.24 67.00,152.25 68.00,144.56 69.00,137.14 70.00,130.00 71.00,123.14 72.00,116.55 73.00,110.22 74.00,104.16 75.00,98.36 76.00,92.81 77.00,87.52 78.00,82.48 79.00,77.68 80.00,73.12 81.00,68.81 82.00,64.72 83.00,60.86 84.00,57.23 85.00,53.83 86.00,50.64 87.00,47.67 88.00,44.91 89.00,42.35 90.00,40.00 91.00,37.85 92.00,35.90 93.00,34.13 94.00,32.56 95.00,31.17 96.00,29.96 97.00,28.94 98.00,28.08 99.00,27.39 100.00,26.88 101.00,26.52 102.00,26.32 103.00,26.28 104.00,26.39 105.00,26.64 106.00,27.04 107.00,27.58 108.00,28.25 109.00,29.06 110.00,30.00 111.00,31.06 112.00,32.24 113.00,33.55 114.00,34.96 115.00,36.48 116.00,38.12 117.00,39.85 118.00,41.68 119.00,43.61 120.00,45.62 121.00,47.73 122.00,49.92 123.00,52.19 124.00,54.53 125.00,56.95 126.00,59.44 127.00,61.99 128.00,64.61 129.00,67.28 130.00,70.00 131.00,72.77 132.00,75.59 133.00,78.46 134.00,81.36 135.00,84.30 136.00,87.27 137.00,90.26 138.00,93.28 139.00,96.32 140.00,99.38 141.00,102.44 142.00,105.52 143.00,108.60 144.00,111.69 145.00,114.77 146.00,117.84 147.00,120.90 148.00,123.95 149.00,126.99 150.00,130.00 151.00,132.99 152.00,135.94 153.00,138.87 154.00,141.76 155.00,144.61 156.00,147.41 157.00,150.17 158.00,152.88 159.00,155.53 160.00,158.12 161.00,160.66 162.00,163.12 163.00,165.51 164.00,167.84 165.00,170.08 166.00,172.24 167.00,174.32 168.00,176.31 169.00,178.20 170.00,180.00 171.00,181.70 172.00,183.29 173.00,184.78 174.00,186.16 175.00,187.42 176.00,188.56 177.00,189.59 178.00,190.48 179.00,191.24 180.00,191.88 181.00,192.37 182.00,192.72 183.00,192.93 184.00,192.99 185.00,192.89 186.00,192.64 187.00,192.23 188.00,191.66 189.00,190.91 190.00,190.00 191.00,188.91 192.00,187.65 193.00,186.20 194.00,184.56 195.00,182.73 196.00,180.72 197.00,178.50 198.00,176.08 199.00,173.46 200.00,170.62 201.00,167.58 202.00,164.32 203.00,160.84 204.00,157.13 205.00,153.20 206.00,149.04 207.00,144.64 208.00,140.00 209.00,135.13 210.00,130.00 211.00,124.62 212.00,119.00 213.00,113.11 214.00,106.96 215.00,100.55 216.00,93.86 217.00,86.91 218.00,79.68 219.00,72.17 220.00,64.38 221.00,56.29 222.00,47.92 223.00,39.25 224.00,30.29 225.00,21.02 226.00,11.44\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"70.00\" cy=\"130.00\" r=\"3\"/><circle cx=\"150.00\" cy=\"130.00\" r=\"3\"/><circle cx=\"210.00\" cy=\"130.00\" r=\"3\"/><circle cx=\"130.00\" cy=\"70.00\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg><p>The <i>x<\/i>-intercepts −3, 1 and 4 are the zeros. Between consecutive zeros the graph stays on one side of the <i>x<\/i>-axis, so the sign of <i>f<\/i> is constant on each interval:<\/p><ul><li><i>f<\/i>(<i>x<\/i>) &gt; 0 (graph above the axis) for −3 &lt; <i>x<\/i> &lt; 1 and for <i>x<\/i> &gt; 4;<\/li><li><i>f<\/i>(<i>x<\/i>) &lt; 0 (graph below the axis) for <i>x<\/i> &lt; −3 and for 1 &lt; <i>x<\/i> &lt; 4.<\/li><\/ul><p>The <i>y<\/i>-intercept is <i>f<\/i>(0) = <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>(3)(−1)(−4) = 3.<\/p><div class=\"rule\">Zeros split the <i>x<\/i>-axis into intervals. Read the graph, or test one value in each interval, to find where <i>f<\/i> is positive or negative.<\/div>"}, {"lo": "LO3", "h": "Multiplicity and end behavior", "html": "<p>If a factor appears <i>k<\/i> times, its zero has <b>multiplicity<\/b> <i>k<\/i>. Multiplicity controls what the graph does at that intercept.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Multiplicity<\/th><th>At the intercept<\/th><th>Example factor<\/th><\/tr><tr><td>odd (1, 3, …)<\/td><td>crosses the <i>x<\/i>-axis<\/td><td>(<i>x<\/i> − 2) or (<i>x<\/i> − 2)<sup>3<\/sup><\/td><\/tr><tr><td>even (2, 4, …)<\/td><td>touches the axis and turns back<\/td><td>(<i>x<\/i> + 1)<sup>2<\/sup><\/td><\/tr><\/table><\/div><p><b>End behavior<\/b> (what the graph does far to the left and far to the right) depends only on the leading term <i>a<\/i><i>x<\/i><sup><i>n<\/i><\/sup>, which you get by multiplying the leading terms of all the factors.<\/p><ul><li><i>n<\/i> even: both ends go the same way, up if <i>a<\/i> &gt; 0 and down if <i>a<\/i> &lt; 0.<\/li><li><i>n<\/i> odd: the ends go opposite ways; if <i>a<\/i> &gt; 0 the graph falls on the left and rises on the right.<\/li><\/ul><div class=\"tip\">For <i>f<\/i>(<i>x<\/i>) = −2<i>x<\/i>(<i>x<\/i> − 3)<sup>2<\/sup>, the leading term is −2<i>x<\/i><sup>3<\/sup>: odd degree with a negative coefficient, so the graph rises on the left and falls on the right.<\/div>"}, {"lo": "LO4", "h": "Absolute value functions", "html": "<p>The absolute value |<i>x<\/i>| is the distance from <i>x<\/i> to 0, so it is never negative. The graph of <i>y<\/i> = |<i>x<\/i>| is a V with its vertex at the origin.<\/p><div class=\"rule\"><i>y<\/i> = <i>a<\/i>|<i>x<\/i> − <i>h<\/i>| + <i>k<\/i> has vertex (<i>h<\/i>, <i>k<\/i>). It opens up if <i>a<\/i> &gt; 0 (minimum value <i>k<\/i>) and down if <i>a<\/i> &lt; 0 (maximum value <i>k<\/i>). The two sides have slopes <i>a<\/i> and −<i>a<\/i>.<\/div><p>For <i>y<\/i> = 3|<i>x<\/i> − 2| − 6: the vertex is (2, −6), the graph opens up, and the minimum value is −6. For the <i>x<\/i>-intercepts, solve 3|<i>x<\/i> − 2| − 6 = 0: |<i>x<\/i> − 2| = 2, so <i>x<\/i> − 2 = 2 or <i>x<\/i> − 2 = −2, which gives <i>x<\/i> = 4 or <i>x<\/i> = 0.<\/p><div class=\"tip\">\"Within <i>d<\/i> of <i>c<\/i>\" means |<i>x<\/i> − <i>c<\/i>| ≤ <i>d<\/i>, that is, <i>c<\/i> − <i>d<\/i> ≤ <i>x<\/i> ≤ <i>c<\/i> + <i>d<\/i>. \"More than <i>d<\/i> away from <i>c<\/i>\" means |<i>x<\/i> − <i>c<\/i>| &gt; <i>d<\/i>. Tolerance questions on the DSAT use exactly this.<\/div>"}, {"lo": "LO5", "h": "Domain and range", "html": "<p>The <b>domain<\/b> is the set of inputs a function accepts; the <b>range<\/b> is the set of outputs it actually produces.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Function contains<\/th><th>Domain restriction<\/th><\/tr><tr><td>only polynomial terms or |<i>x<\/i>|<\/td><td>none: all real numbers<\/td><\/tr><tr><td>√(expression)<\/td><td>expression ≥ 0<\/td><\/tr><tr><td>a fraction with a variable denominator<\/td><td>denominator ≠ 0<\/td><\/tr><\/table><\/div><p>Find the range from the shape. <i>y<\/i> = (<i>x<\/i> − 2)<sup>2<\/sup> + 5 has a minimum of 5, so its range is <i>y<\/i> ≥ 5. <i>y<\/i> = √(<i>x<\/i> + 1) − 3 starts at −3 and increases, so its range is <i>y<\/i> ≥ −3. A real-world context can also restrict the domain, for example time <i>t<\/i> ≥ 0 or a length that must be positive.<\/p><div class=\"rule\">On a restricted domain <i>a<\/i> ≤ <i>x<\/i> ≤ <i>b<\/i>, the range is not just the outputs at the endpoints. Include any vertex or turning point inside the interval.<\/div>"}], "examples": [{"lo": "LO1", "q": "The polynomial <i>p<\/i>(<i>x<\/i>) = 2<i>x<\/i><sup>3<\/sup> − 3<i>x<\/i><sup>2<\/sup> − 11<i>x<\/i> + 6 has <i>x<\/i> − 3 as a factor. Find all the zeros of <i>p<\/i>.", "steps": ["Check: <i>p<\/i>(3) = 54 − 27 − 33 + 6 = 0, so 3 is a zero.", "Divide out <i>x<\/i> − 3: 2<i>x<\/i><sup>3<\/sup> − 3<i>x<\/i><sup>2<\/sup> − 11<i>x<\/i> + 6 = (<i>x<\/i> − 3)(2<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 2).", "Factor the quadratic: 2<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 2 = (2<i>x<\/i> − 1)(<i>x<\/i> + 2).", "Set each factor equal to 0: <i>x<\/i> = 3, <i>x<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> and <i>x<\/i> = −2."], "ans": "−2, <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> and 3"}, {"lo": "LO2", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = <i>x<\/i><sup>3<\/sup> + <i>k<\/i><i>x<\/i><sup>2<\/sup> − 4<i>x<\/i> + 9<\/div>In the polynomial function <i>p<\/i>, <i>k<\/i> is a constant. When <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> + 2, the remainder is 13. What is the value of <i>k<\/i>?", "steps": ["Dividing by <i>x<\/i> + 2 means <i>x<\/i> − (−2), so the remainder is <i>p<\/i>(−2).", "<i>p<\/i>(−2) = −8 + 4<i>k<\/i> + 8 + 9 = 4<i>k<\/i> + 9.", "Set 4<i>k<\/i> + 9 = 13, so 4<i>k<\/i> = 4 and <i>k<\/i> = 1."], "ans": "<i>k<\/i> = 1"}, {"lo": "LO3", "q": "Describe the graph of <i>f<\/i>(<i>x<\/i>) = −2(<i>x<\/i> + 1)(<i>x<\/i> − 3)<sup>2<\/sup> at each <i>x<\/i>-intercept and at its ends.", "steps": ["The zeros are −1 (multiplicity 1) and 3 (multiplicity 2).", "Odd multiplicity: the graph crosses the <i>x<\/i>-axis at <i>x<\/i> = −1. Even multiplicity: it touches the axis at <i>x<\/i> = 3 and turns back.", "Leading term: −2 · <i>x<\/i> · <i>x<\/i><sup>2<\/sup> = −2<i>x<\/i><sup>3<\/sup>, odd degree with a negative coefficient, so the graph rises on the left and falls on the right."], "ans": "It crosses the axis at <i>x<\/i> = −1, touches it at <i>x<\/i> = 3, rises to the left and falls to the right."}, {"lo": "LO4", "q": "Find the vertex and the <i>x<\/i>-intercepts of the graph of <i>y<\/i> = |2<i>x<\/i> − 6| − 4.", "steps": ["Factor inside: |2<i>x<\/i> − 6| = 2|<i>x<\/i> − 3|, so <i>y<\/i> = 2|<i>x<\/i> − 3| − 4, with vertex (3, −4).", "Set <i>y<\/i> = 0: |2<i>x<\/i> − 6| = 4, so 2<i>x<\/i> − 6 = 4 or 2<i>x<\/i> − 6 = −4.", "That gives <i>x<\/i> = 5 or <i>x<\/i> = 1."], "ans": "Vertex (3, −4); <i>x<\/i>-intercepts at <i>x<\/i> = 1 and <i>x<\/i> = 5"}, {"lo": "LO4", "q": "A machine fills bags of rice. A bag passes inspection if its mass, <i>m<\/i> grams, is at least 988 grams and at most 1012 grams. Which absolute value inequality describes the masses that pass inspection?", "steps": ["The center of the interval is (<span class=\"fq\"><span>988 + 1012<\/span><span>2<\/span><\/span>) = 1000 grams.", "Each end is 12 grams from the center: 1012 − 1000 = 12.", "\"Within 12 of 1000\" is |<i>m<\/i> − 1000| ≤ 12."], "ans": "|<i>m<\/i> − 1000| ≤ 12"}, {"lo": "LO5", "q": "The graph of <i>h<\/i>(<i>x<\/i>) = 4 − (<i>x<\/i> − 1)<sup>2<\/sup> for −1 ≤ <i>x<\/i> ≤ 4 is shown. What is the range of <i>h<\/i>?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Arch-shaped curve drawn only from x = −1 to x = 4: it starts at the closed point (−1, 0), rises to a highest point at (1, 4), and falls to the closed endpoint (4, −5)\"><g class=\"fg-grid\" stroke=\"c \" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"90.00\" cy=\"130.00\" r=\"3\"/><circle cx=\"190.00\" cy=\"130.00\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>", "opts": ["<i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>(<i>x<\/i> + 2)<sup>2<\/sup>(<i>x<\/i> − 3)", "<i>f<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>(<i>x<\/i> − 2)<sup>2<\/sup>(<i>x<\/i> + 3)", "<i>f<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>(<i>x<\/i> + 2)<sup>2<\/sup>(<i>x<\/i> − 3)", "<i>f<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>(<i>x<\/i> + 2)(<i>x<\/i> − 3)<sup>2<\/sup>"], "ans": 2, "sol": "The graph touches the <i>x<\/i>-axis at −2 and turns back, so (<i>x<\/i> + 2) has even multiplicity: (<i>x<\/i> + 2)<sup>2<\/sup>.<br>It crosses at 3, so (<i>x<\/i> − 3) appears to an odd power.<br>The graph falls to the right, so the leading coefficient is negative. Check the scale: −<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>(0 + 2)<sup>2<\/sup>(0 − 3) = 3, the <i>y<\/i>-intercept shown, so <i>f<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>(<i>x<\/i> + 2)<sup>2<\/sup>(<i>x<\/i> − 3) fits.<br>Answer: <b><i>f<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>(<i>x<\/i> + 2)<sup>2<\/sup>(<i>x<\/i> − 3)<\/b>", "hint": "Decide which intercept is a touch and which is a crossing, then check which way the graph goes on the right."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "When the polynomial <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> − 4, the quotient is <i>x<\/i><sup>2<\/sup> + 3 and the remainder is −5. What is the value of <i>p<\/i>(2)?", "ans": ["-19"], "sol": "<i>p<\/i>(<i>x<\/i>) = (<i>x<\/i> − 4)(<i>x<\/i><sup>2<\/sup> + 3) − 5.<br><i>p<\/i>(2) = (2 − 4)(4 + 3) − 5 = −14 − 5 = −19.<br>Answer: <b>−19<\/b>", "hint": "Write <i>p<\/i>(<i>x<\/i>) as (divisor)(quotient) + remainder, then substitute."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A thermostat keeps the temperature <i>T<\/i>, in degrees Celsius, of a server room within 1.5 degrees of 21 degrees. Which inequality describes all possible temperatures in the room?", "opts": ["|<i>T<\/i> − 21| ≤ 1.5", "|<i>T<\/i> + 21| ≤ 1.5", "|<i>T<\/i> − 1.5| ≤ 21", "|<i>T<\/i> − 21| ≥ 1.5"], "ans": 0, "sol": "The distance between <i>T<\/i> and 21 is |<i>T<\/i> − 21|.<br>This distance is at most 1.5, so |<i>T<\/i> − 21| ≤ 1.5, which means 19.5 ≤ <i>T<\/i> ≤ 22.5.<br>Answer: <b>|<i>T<\/i> − 21| ≤ 1.5<\/b>", "hint": "Distance from 21 is written as an absolute value. Should that distance be small or large?"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>g<\/i>(<i>x<\/i>) = (<i>x<\/i> − 3)<sup>2<\/sup> + 2<\/div>Which of the following is the range of <i>g<\/i>?", "opts": ["<i>g<\/i>(<i>x<\/i>) ≥ 3", "<i>g<\/i>(<i>x<\/i>) ≥ 11", "All real numbers", "<i>g<\/i>(<i>x<\/i>) ≥ 2"], "ans": 3, "sol": "A square is never negative, so (<i>x<\/i> − 3)<sup>2<\/sup> ≥ 0, with equality at <i>x<\/i> = 3.<br>So <i>g<\/i>(<i>x<\/i>) ≥ 0 + 2 = 2, and <i>g<\/i> takes every value from 2 upward.<br>Answer: <b><i>g<\/i>(<i>x<\/i>) ≥ 2<\/b>", "hint": "What is the smallest value a squared expression can take, and where does it happen?"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = 2<i>x<\/i><sup>3<\/sup> + <i>b<\/i><i>x<\/i><sup>2<\/sup> + <i>c<\/i><i>x<\/i> − 12<\/div>In the polynomial function <i>p<\/i>, <i>b<\/i> and <i>c<\/i> are constants. The zeros of <i>p<\/i> include 2 and −3. What is the value of <i>p<\/i>(1)?", "ans": ["-16"], "sol": "With leading coefficient 2, <i>p<\/i>(<i>x<\/i>) = 2(<i>x<\/i> − 2)(<i>x<\/i> + 3)(<i>x<\/i> − <i>r<\/i>) for some third zero <i>r<\/i>.<br>The constant term is 2(−2)(3)(−<i>r<\/i>) = 12<i>r<\/i>, and it must equal −12, so <i>r<\/i> = −1.<br><i>p<\/i>(1) = 2(1 − 2)(1 + 3)(1 + 1) = 2(−1)(4)(2) = −16.<br>Answer: <b>−16<\/b>", "hint": "Write <i>p<\/i>(<i>x<\/i>) = 2(<i>x<\/i> − 2)(<i>x<\/i> + 3)(<i>x<\/i> − <i>r<\/i>). What must the constant term of this product be?"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = <i>x<\/i>(<i>x<\/i> − 3)<sup>2<\/sup>(<i>x<\/i> + 2)<sup>3<\/sup><\/div>At how many points does the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) cross the <i>x<\/i>-axis?", "opts": ["3", "2", "6", "1"], "ans": 1, "sol": "The zeros are 0 (multiplicity 1), 3 (multiplicity 2) and −2 (multiplicity 3).<br>The graph crosses at zeros of odd multiplicity, 0 and −2, and only touches at 3.<br>Answer: <b>2<\/b>", "hint": "Only zeros of odd multiplicity are crossing points."}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "The graph of <i>y<\/i> = −2|<i>x<\/i> + 1| + 6 and the <i>x<\/i>-axis enclose a triangle. What is the area of the triangle?", "ans": ["18"], "sol": "The vertex is (−1, 6), the top of the triangle.<br>For the <i>x<\/i>-intercepts, −2|<i>x<\/i> + 1| + 6 = 0 gives |<i>x<\/i> + 1| = 3, so <i>x<\/i> = 2 or <i>x<\/i> = −4.<br>Base = 2 − (−4) = 6 and height = 6, so area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(6)(6) = 18.<br>Answer: <b>18<\/b>", "hint": "The vertex and the two <i>x<\/i>-intercepts are the corners of the triangle."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> + 6)(<i>x<\/i> − 1)(<i>x<\/i> − 8)<\/div>What are the <i>x<\/i>-intercepts of the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>)?", "opts": ["(6, 0), (−1, 0) and (−8, 0)", "(0, −6), (0, 1) and (0, 8)", "(−6, 0), (1, 0) and (8, 0)", "(−6, 0) and (1, 0) only"], "ans": 2, "sol": "Set each factor equal to 0: <i>x<\/i> = −6, <i>x<\/i> = 1, <i>x<\/i> = 8.<br>The <i>x<\/i>-intercepts have <i>y<\/i>-coordinate 0.<br>Answer: <b>(−6, 0), (1, 0) and (8, 0)<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "What is the remainder when <i>x<\/i><sup>2<\/sup> + 5<i>x<\/i> − 3 is divided by <i>x<\/i> − 2?", "opts": ["11", "−9", "−3", "3"], "ans": 0, "sol": "By the remainder theorem, evaluate at <i>x<\/i> = 2.<br>2<sup>2<\/sup> + 5(2) − 3 = 4 + 10 − 3 = 11.<br>Answer: <b>11<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A delivery van drives along a straight highway at a constant speed. Its distance, in kilometers, from a depot <i>t<\/i> hours after 8:00 a.m. is <i>d<\/i>(<i>t<\/i>) = |60<i>t<\/i> − 150|. What is <i>d<\/i>(1)?", "opts": ["−90", "210", "150", "90"], "ans": 3, "sol": "<i>d<\/i>(1) = |60 − 150| = |−90|.<br>Absolute value is a distance, so |−90| = 90.<br>Answer: <b>90<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "What is the domain of <i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span><i>x<\/i> − 5<\/span><\/span>?", "opts": ["All real numbers except −5", "All real numbers except 5", "<i>x<\/i> &gt; 5", "All real numbers"], "ans": 1, "sol": "The denominator cannot be 0: <i>x<\/i> − 5 ≠ 0.<br>So <i>x<\/i> ≠ 5; every other real number works.<br>Answer: <b>All real numbers except 5<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "<div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> − 2)(<i>x<\/i> + 5)<\/div>For which values of <i>x<\/i> is <i>f<\/i>(<i>x<\/i>) &lt; 0?", "opts": ["<i>x<\/i> &lt; −5 or <i>x<\/i> &gt; 2", "−5 &lt; <i>x<\/i> &lt; 2", "−2 &lt; <i>x<\/i> &lt; 5", "<i>x<\/i> &gt; 2"], "ans": 1, "sol": "The zeros are −5 and 2, and the graph is a parabola opening up.<br>It is below the <i>x<\/i>-axis between the zeros. Check <i>x<\/i> = 0: (−2)(5) = −10 &lt; 0.<br>Answer: <b>−5 &lt; <i>x<\/i> &lt; 2<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "<i>p<\/i> is a polynomial function, and <i>x<\/i> − 9 is a factor of <i>p<\/i>(<i>x<\/i>). What is the value of <i>p<\/i>(9)?", "ans": ["0"], "sol": "By the factor theorem, <i>x<\/i> − 9 is a factor exactly when <i>p<\/i>(9) = 0.<br>Answer: <b>0<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = 3<i>x<\/i><sup>3<\/sup> − <i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> + 10<\/div>What is the remainder when <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> + 2?", "opts": ["38", "−18", "10", "−26"], "ans": 3, "sol": "The remainder is <i>p<\/i>(−2).<br><i>p<\/i>(−2) = 3(−8) − 4 + 4(−2) + 10 = −24 − 4 − 8 + 10 = −26.<br>Answer: <b>−26<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "An open box is made from a 20 cm by 14 cm sheet of cardboard by cutting a square with side <i>x<\/i> cm from each corner and folding up the sides. The volume of the box, in cubic centimeters, is <i>V<\/i>(<i>x<\/i>) = <i>x<\/i>(20 − 2<i>x<\/i>)(14 − 2<i>x<\/i>). Which of the following is a zero of <i>V<\/i>?", "opts": ["7", "14", "20", "4"], "ans": 0, "sol": "Set each factor equal to 0: <i>x<\/i> = 0, 20 − 2<i>x<\/i> = 0 gives <i>x<\/i> = 10, and 14 − 2<i>x<\/i> = 0 gives <i>x<\/i> = 7.<br>Of the choices, only 7 is a zero; at that size the cuts use up the whole 14 cm side.<br>Answer: <b>7<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = −3<i>x<\/i><sup>4<\/sup> + 2<i>x<\/i><sup>3<\/sup> + <i>x<\/i> − 7<\/div>Which statement describes the end behavior of the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>)?", "opts": ["It rises to the left and rises to the right.", "It falls to the left and rises to the right.", "It falls to the left and falls to the right.", "It rises to the left and falls to the right."], "ans": 2, "sol": "The leading term is −3<i>x<\/i><sup>4<\/sup>: even degree, negative coefficient.<br>Even degree means both ends go the same way; the negative coefficient sends both down.<br>Answer: <b>It falls to the left and falls to the right.<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Which equation is represented by the graph shown?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"V-shaped graph opening upward with its vertex at (2, −3), crossing the x-axis at −1 and 5\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\" ">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>", "opts": ["<i>y<\/i> = |<i>x<\/i> + 2| − 3", "<i>y<\/i> = |<i>x<\/i> − 3| − 2", "<i>y<\/i> = |<i>x<\/i> − 2| + 3", "<i>y<\/i> = |<i>x<\/i> − 2| − 3"], "ans": 3, "sol": "The vertex is (2, −3), so the equation has the form <i>y<\/i> = <i>a<\/i>|<i>x<\/i> − 2| − 3.<br>From the vertex the graph rises 1 unit for each unit across (it passes through (5, 0)), so <i>a<\/i> = 1.<br>Answer: <b><i>y<\/i> = |<i>x<\/i> − 2| − 3<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The width of a rectangle is <i>w<\/i> centimeters and its length is 12 − <i>w<\/i> centimeters. Its area is <i>A<\/i>(<i>w<\/i>) = <i>w<\/i>(12 − <i>w<\/i>). Which of the following is the domain of <i>A<\/i> in this context?", "opts": ["<i>w<\/i> ≥ 0", "0 &lt; <i>w<\/i> &lt; 12", "0 ≤ <i>w<\/i> ≤ 36", "All real numbers"], "ans": 1, "sol": "The width must be positive: <i>w<\/i> &gt; 0.<br>The length must be positive: 12 − <i>w<\/i> &gt; 0, so <i>w<\/i> &lt; 12.<br>Answer: <b>0 &lt; <i>w<\/i> &lt; 12<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "If <i>x<\/i> + 2 is a factor of <i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> − 10, where <i>b<\/i> is a constant, what is the value of <i>b<\/i>?", "ans": ["-3"], "sol": "By the factor theorem, the expression equals 0 at <i>x<\/i> = −2.<br>(−2)<sup>2<\/sup> + <i>b<\/i>(−2) − 10 = 0, so −2<i>b<\/i> − 6 = 0 and <i>b<\/i> = −3.<br>Answer: <b>−3<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The graph of the polynomial function <i>f<\/i> crosses the <i>x<\/i>-axis at <i>x<\/i> = −4 and <i>x<\/i> = 1, touches the <i>x<\/i>-axis without crossing at <i>x<\/i> = 3, and has no other <i>x<\/i>-intercepts. Which of the following could define <i>f<\/i>?", "opts": ["<i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> − 4)(<i>x<\/i> + 1)(<i>x<\/i> + 3)<sup>2<\/sup>", "<i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> + 4)(<i>x<\/i> − 1)(<i>x<\/i> − 3)", "<i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> + 4)(<i>x<\/i> − 1)(<i>x<\/i> − 3)<sup>2<\/sup>", "<i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> + 4)<sup>2<\/sup>(<i>x<\/i> − 1)<sup>2<\/sup>(<i>x<\/i> − 3)"], "ans": 2, "sol": "Crossing at −4 and 1: factors (<i>x<\/i> + 4) and (<i>x<\/i> − 1) to odd powers.<br>Touching at 3: factor (<i>x<\/i> − 3) to an even power.<br>Answer: <b><i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> + 4)(<i>x<\/i> − 1)(<i>x<\/i> − 3)<sup>2<\/sup><\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A factory accepts a steel rod if its length <i>L<\/i>, in centimeters, satisfies |<i>L<\/i> − 75| ≤ 0.4. What is the greatest length of an acceptable rod?", "opts": ["75.4 cm", "74.6 cm", "75.8 cm", "75.04 cm"], "ans": 0, "sol": "|<i>L<\/i> − 75| ≤ 0.4 means −0.4 ≤ <i>L<\/i> − 75 ≤ 0.4.<br>So 74.6 ≤ <i>L<\/i> ≤ 75.4, and the greatest length is 75.4 cm.<br>Answer: <b>75.4 cm<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Which of the following is the range of <i>f<\/i>(<i>x<\/i>) = √(<i>x<\/i> + 4) − 1?", "opts": ["<i>f<\/i>(<i>x<\/i>) ≥ −1", "<i>f<\/i>(<i>x<\/i>) ≥ −4", "<i>f<\/i>(<i>x<\/i>) ≥ 1", "<i>f<\/i>(<i>x<\/i>) ≥ 0"], "ans": 0, "sol": "A square root is never negative: √(<i>x<\/i> + 4) ≥ 0, with value 0 at <i>x<\/i> = −4.<br>Subtracting 1 gives <i>f<\/i>(<i>x<\/i>) ≥ −1, and <i>f<\/i> grows without bound.<br>Answer: <b><i>f<\/i>(<i>x<\/i>) ≥ −1<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = <i>x<\/i><sup>4<\/sup> − 2<i>x<\/i><sup>3<\/sup> + <i>k<\/i><i>x<\/i> + 5<\/div>In the polynomial function <i>p<\/i>, <i>k<\/i> is a constant. The remainder when <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> − 1 is equal to the remainder when <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> + 1. What is the value of <i>k<\/i>?", "ans": ["2"], "sol": "Remainders: <i>p<\/i>(1) = 1 − 2 + <i>k<\/i> + 5 = <i>k<\/i> + 4 and <i>p<\/i>(−1) = 1 + 2 − <i>k<\/i> + 5 = 8 − <i>k<\/i>.<br>Set them equal: <i>k<\/i> + 4 = 8 − <i>k<\/i>, so 2<i>k<\/i> = 4.<br>Answer: <b>2<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = <i>x<\/i><sup>3<\/sup> + 2<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> − 6<\/div>Which of the following is a factor of <i>p<\/i>(<i>x<\/i>)?", "opts": ["<i>x<\/i> + 2", "<i>x<\/i> − 1", "<i>x<\/i> − 2", "<i>x<\/i> − 3"], "ans": 2, "sol": "Test each choice with the factor theorem.<br><i>p<\/i>(2) = 8 + 8 − 10 − 6 = 0, so <i>x<\/i> − 2 is a factor.<br>Check the others: <i>p<\/i>(−2) = 4, <i>p<\/i>(1) = −8, <i>p<\/i>(3) = 24.<br>Answer: <b><i>x<\/i> − 2<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> − 1)(<i>x<\/i> + 2)<sup>2<\/sup>(<i>x<\/i> − 5)<\/div>How many integer values of <i>x<\/i> satisfy <i>f<\/i>(<i>x<\/i>) &lt; 0?", "ans": ["3"], "sol": "The zeros are −2 (even multiplicity, no sign change), 1 and 5.<br>The leading term is <i>x<\/i><sup>4<\/sup>, so <i>f<\/i> &gt; 0 for <i>x<\/i> &gt; 5; it changes sign at 5 and again at 1, so <i>f<\/i> &lt; 0 only for 1 &lt; <i>x<\/i> &lt; 5.<br>The integers are 2, 3 and 4.<br>Answer: <b>3<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "The graph of <i>y<\/i> = |2<i>x<\/i> + 3| intersects the line <i>y<\/i> = 11 at two points. What is the sum of the <i>x<\/i>-coordinates of these two points?", "ans": ["-3"], "sol": "Solve |2<i>x<\/i> + 3| = 11: 2<i>x<\/i> + 3 = 11 or 2<i>x<\/i> + 3 = −11.<br>So <i>x<\/i> = 4 or <i>x<\/i> = −7.<br>Sum: 4 + (−7) = −3.<br>Answer: <b>−3<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A drone flies above a rooftop. Its height above the roof, in meters, <i>t<\/i> seconds after a timer starts is <i>h<\/i>(<i>t<\/i>) = |2<i>t<\/i> − 4| + 3 for 0 ≤ <i>t<\/i> ≤ 6. Which of the following is the range of <i>h<\/i>?", "opts": ["7 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 11", "3 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 11", "3 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 7", "0 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 6"], "ans": 1, "sol": "Endpoints: <i>h<\/i>(0) = 4 + 3 = 7 and <i>h<\/i>(6) = 8 + 3 = 11.<br>The vertex is at <i>t<\/i> = 2, inside the domain, with <i>h<\/i>(2) = 3, the lowest height.<br>Answer: <b>3 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 11<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which of the following functions has zeros at −3, 0 and 5 and at no other values of <i>x<\/i>?", "opts": ["<i>f<\/i>(<i>x<\/i>) = <i>x<\/i>(<i>x<\/i> − 3)(<i>x<\/i> + 5)", "<i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> + 3)(<i>x<\/i> − 5)", "<i>f<\/i>(<i>x<\/i>) = <i>x<\/i>(<i>x<\/i> + 3)(<i>x<\/i> + 5)", "<i>f<\/i>(<i>x<\/i>) = <i>x<\/i>(<i>x<\/i> + 3)(<i>x<\/i> − 5)"], "ans": 3, "sol": "A zero at −3 needs the factor <i>x<\/i> + 3; a zero at 0 needs <i>x<\/i>; a zero at 5 needs <i>x<\/i> − 5.<br>Only <i>x<\/i>(<i>x<\/i> + 3)(<i>x<\/i> − 5) has all three and no others.<br>Answer: <b><i>f<\/i>(<i>x<\/i>) = <i>x<\/i>(<i>x<\/i> + 3)(<i>x<\/i> − 5)<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = (<i>x<\/i> − 2)(<i>x<\/i><sup>2<\/sup> + 1) + 7<\/div>What is the remainder when <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> − 2?", "opts": ["0", "7", "12", "−7"], "ans": 1, "sol": "The remainder is <i>p<\/i>(2).<br><i>p<\/i>(2) = (0)(5) + 7 = 7. The expression is already in the form (divisor)(quotient) + remainder.<br>Answer: <b>7<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The graph of the polynomial function <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) is shown. On which of the following intervals is <i>f<\/i>(<i>x<\/i>) &lt; 0 for every value of <i>x<\/i> in the interval?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Graph of a curve that comes down from the upper left, crosses the x-axis at −4, dips below the axis, rises to cross the x-axis at −1, pass in meters, is modeled by <i>h<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span>50<\/span><\/span>(<i>x<\/i> − 10)(<i>x<\/i> − 30)(<i>x<\/i> − 45), where <i>x<\/i> is the horizontal distance, in meters, from the start of the section and 0 ≤ <i>x<\/i> ≤ 50. At which of the following horizontal distances is the track level with the platform?", "opts": ["25 meters", "50 meters", "30 meters", "85 meters"], "ans": 2, "sol": "The track is level with the platform when <i>h<\/i>(<i>x<\/i>) = 0.<br>The zeros are 10, 30 and 45; of the choices, only 30 is a zero.<br>Answer: <b>30 meters<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = <i>x<\/i><sup>3<\/sup> − 5<i>x<\/i><sup>2<\/sup> + <i>k<\/i><i>x<\/i> + 8<\/div>In the polynomial function <i>p<\/i>, <i>k<\/i> is a constant. When <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> − 3, the remainder is 2. What is the remainder when <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> + 1?", "ans": ["-2"], "sol": "<i>p<\/i>(3) = 27 − 45 + 3<i>k<\/i> + 8 = 3<i>k<\/i> − 10, and this equals 2, so <i>k<\/i> = 4.<br>The second remainder is <i>p<\/i>(−1) = −1 − 5 − 4 + 8 = −2.<br>Answer: <b>−2<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = 3<i>x<\/i><sup>3<\/sup> − 4<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 2<\/div>Given that <i>x<\/i> + 1 is a factor of <i>p<\/i>(<i>x<\/i>), which of the following is also a factor of <i>p<\/i>(<i>x<\/i>)?", "opts": ["3<i>x<\/i> + 1", "3<i>x<\/i> − 1", "<i>x<\/i> + 2", "<i>x<\/i> − 3"], "ans": 1, "sol": "Divide out <i>x<\/i> + 1: 3<i>x<\/i><sup>3<\/sup> − 4<i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> + 2 = (<i>x<\/i> + 1)(3<i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 2).<br>Factor: 3<i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 2 = (3<i>x<\/i> − 1)(<i>x<\/i> − 2).<br>Answer: <b>3<i>x<\/i> − 1<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = −<i>x<\/i>(<i>x<\/i> − 4)<sup>2<\/sup>(<i>x<\/i> + 3)<\/div>Which of the following statements about the graph of <i>y<\/i> = <i>p<\/i>(<i>x<\/i>) is true?", "opts": ["It crosses the <i>x<\/i>-axis at <i>x<\/i> = 4.", "It has exactly four <i>x<\/i>-intercepts.", "<i>p<\/i>(<i>x<\/i>) &gt; 0 for all <i>x<\/i> &gt; 4.", "It touches the <i>x<\/i>-axis at <i>x<\/i> = 4 without crossing, and it falls to the right."], "ans": 3, "sol": "The zeros are 0, −3 and 4, and 4 has multiplicity 2, so the graph touches at 4 and there are only three intercepts.<br>The leading term is −<i>x<\/i><sup>4<\/sup>, so both ends point down; in particular <i>p<\/i>(<i>x<\/i>) &lt; 0 for <i>x<\/i> &gt; 4.<br>Answer: <b>It touches the <i>x<\/i>-axis at <i>x<\/i> = 4 without crossing, and it falls to the right.<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The front edge of an A-frame roof is modeled by <i>y<\/i> = <i>a<\/i>|<i>x<\/i> − <i>h<\/i>| + <i>k<\/i>, where <i>x<\/i> and <i>y<\/i> are in meters. The peak of the roof is at (3, 6) and the edge passes through (5, 2). What is the value of <i>a<\/i>?", "opts": ["2", "−2", "−<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>", "−4"], "ans": 1, "sol": "The peak is the vertex, so <i>y<\/i> = <i>a<\/i>|<i>x<\/i> − 3| + 6.<br>Substitute (5, 2): 2 = <i>a<\/i>|5 − 3| + 6 = 2<i>a<\/i> + 6, so <i>a<\/i> = −2.<br>Answer: <b>−2<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Which of the following functions has range <i>y<\/i> ≥ −3?", "opts": ["<i>y<\/i> = (<i>x<\/i> + 3)<sup>2<\/sup>", "<i>y<\/i> = −|<i>x<\/i>| − 3", "<i>y<\/i> = √(<i>x<\/i> − 3)", "<i>y<\/i> = |<i>x<\/i>| − 3"], "ans": 3, "sol": "|<i>x<\/i>| ≥ 0 with every nonnegative value possible, so |<i>x<\/i>| − 3 takes every value from −3 upward.<br>The others have ranges <i>y<\/i> ≥ 0, <i>y<\/i> ≤ −3 and <i>y<\/i> ≥ 0.<br>Answer: <b><i>y<\/i> = |<i>x<\/i>| − 3<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = <i>x<\/i><sup>3<\/sup> − 4<i>x<\/i><sup>2<\/sup> + <i>k<\/i><i>x<\/i> + 6<\/div>In the polynomial function <i>p<\/i>, <i>k<\/i> is a constant, and <i>x<\/i> − 3 is a factor of <i>p<\/i>(<i>x<\/i>). What is the positive difference between the other two zeros of <i>p<\/i>?", "ans": ["3"], "sol": "<i>p<\/i>(3) = 27 − 36 + 3<i>k<\/i> + 6 = 3<i>k<\/i> − 3 = 0, so <i>k<\/i> = 1.<br><i>x<\/i><sup>3<\/sup> − 4<i>x<\/i><sup>2<\/sup> + <i>x<\/i> + 6 = (<i>x<\/i> − 3)(<i>x<\/i><sup>2<\/sup> − <i>x<\/i> − 2) = (<i>x<\/i> − 3)(<i>x<\/i> − 2)(<i>x<\/i> + 1).<br>The other zeros are 2 and −1, and 2 − (−1) = 3.<br>Answer: <b>3<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A cell tower stands beside a straight highway at kilometer marker 38 and provides coverage to locations within 12 kilometers of it along the highway. Which inequality gives all highway markers <i>m<\/i>, in kilometers, that do NOT have coverage?", "opts": ["|<i>m<\/i> − 38| &lt; 12", "|<i>m<\/i> − 12| &gt; 38", "|<i>m<\/i> − 38| &gt; 12", "|<i>m<\/i> + 38| &gt; 12"], "ans": 2, "sol": "Covered locations satisfy |<i>m<\/i> − 38| ≤ 12.<br>Locations without coverage are the rest: |<i>m<\/i> − 38| &gt; 12, that is, <i>m<\/i> &lt; 26 or <i>m<\/i> &gt; 50.<br>Answer: <b>|<i>m<\/i> − 38| &gt; 12<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A ball is thrown upward from the edge of a cliff. Its height above the ground, in meters, <i>t<\/i> seconds after it is thrown is <i>h<\/i>(<i>t<\/i>) = −5<i>t<\/i><sup>2<\/sup> + 20<i>t<\/i> + 25, from the moment it is thrown until it hits the ground. Which of the following is the range of <i>h<\/i> in this context?", "opts": ["0 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 45", "25 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 45", "0 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 25", "0 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 5"], "ans": 0, "sol": "It hits the ground when −5<i>t<\/i><sup>2<\/sup> + 20<i>t<\/i> + 25 = 0, or <i>t<\/i><sup>2<\/sup> − 4<i>t<\/i> − 5 = 0, so <i>t<\/i> = 5. The domain is 0 ≤ <i>t<\/i> ≤ 5.<br>The vertex is at <i>t<\/i> = 2: <i>h<\/i>(2) = −20 + 40 + 25 = 45, the greatest height.<br>The height starts at 25, rises to 45 and falls to 0, so the range is 0 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 45.<br>Answer: <b>0 ≤ <i>h<\/i>(<i>t<\/i>) ≤ 45<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A company models its monthly profit, in lakhs of rupees, <i>t<\/i> months after launching a product by <i>P<\/i>(<i>t<\/i>) = −0.5(<i>t<\/i> − 2)(<i>t<\/i> − 7)(<i>t<\/i> − 11). On which of the following intervals is <i>P<\/i>(<i>t<\/i>) &gt; 0 for every <i>t<\/i> in the interval?", "opts": ["2 &lt; <i>t<\/i> &lt; 7", "<i>t<\/i> &gt; 11", "7 &lt; <i>t<\/i> &lt; 11", "2 &lt; <i>t<\/i> &lt; 11"], "ans": 2, "sol": "The zeros are 2, 7 and 11, each a crossing. The leading term is −0.5<i>t<\/i><sup>3<\/sup>, so <i>P<\/i> &lt; 0 for <i>t<\/i> &gt; 11.<br>The sign alternates: positive on 7 &lt; <i>t<\/i> &lt; 11, negative on 2 &lt; <i>t<\/i> &lt; 7.<br>Answer: <b>7 &lt; <i>t<\/i> &lt; 11<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "When the polynomial <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> − 3, the remainder is 4. Which of the following must be true?", "opts": ["<i>p<\/i>(3) = 4", "<i>p<\/i>(4) = 3", "<i>p<\/i>(−3) = 4", "<i>x<\/i> − 3 is a factor of <i>p<\/i>(<i>x<\/i>) + 4"], "ans": 0, "sol": "By the remainder theorem, the remainder on division by <i>x<\/i> − 3 is <i>p<\/i>(3), so <i>p<\/i>(3) = 4.<br>The last choice would need <i>p<\/i>(3) + 4 = 0; it is <i>p<\/i>(<i>x<\/i>) − 4 that has <i>x<\/i> − 3 as a factor.<br>Answer: <b><i>p<\/i>(3) = 4<\/b>"}, {"lo": "LO3", "diff": "X", "type": "spr", "q": "The graph of the cubic function <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) is shown. Each marked point lies where two grid lines meet. What is the value of <i>f<\/i>(2)?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Graph of a cubic curve that rises from the lower left, crosses the x-axis at −5, peaks just above the axis, crosses back down at −2, passes through (0, −3), reaches a low point and rises to cross the x-axis at 3, continuing up t s: for <i>x<\/i> ≥ 3, <i>x<\/i> − 1 = −<i>x<\/i> + 9 gives (5, 4); for <i>x<\/i> ≤ 1, −<i>x<\/i> + 1 = <i>x<\/i> + 3 gives (−1, 2).<br>The region is a quadrilateral with vertices (−1, 2), (1, 0), (5, 4) and (3, 6).<br>Its sides from (1, 0) are perpendicular, with lengths √8 and √32, so it is a rectangle with area √8 · √32 = √256 = 16.<br>Answer: <b>16<\/b>"}, {"lo": "LO5", "diff": "X", "type": "spr", "q": "The function <i>g<\/i>(<i>x<\/i>) = √(<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + <i>k<\/i>), where <i>k<\/i> is a constant, is defined for every real number <i>x<\/i>. What is the least possible value of <i>k<\/i>?", "ans": ["9"], "sol": "<i>g<\/i> is defined for all <i>x<\/i> exactly when <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + <i>k<\/i> ≥ 0 for all <i>x<\/i>.<br>Complete the square: <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + <i>k<\/i> = (<i>x<\/i> − 3)<sup>2<\/sup> + <i>k<\/i> − 9, whose least value is <i>k<\/i> − 9.<br>So <i>k<\/i> − 9 ≥ 0, and the least value is <i>k<\/i> = 9.<br>Answer: <b>9<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "<div class=\"eqs\"><i>p<\/i>(<i>x<\/i>) = 2<i>x<\/i><sup>3<\/sup> + <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> − 6<\/div>In the polynomial function <i>p<\/i>, <i>a<\/i> and <i>b<\/i> are constants. <i>p<\/i>(<i>x<\/i>) is divisible by <i>x<\/i> − 2, and the remainder when <i>p<\/i>(<i>x<\/i>) is divided by <i>x<\/i> + 1 is −12. What is the value of <i>a<\/i> + <i>b<\/i>?", "opts": ["−8", "−2", "4", "−5"], "ans": 1, "sol": "<i>p<\/i>(2) = 16 + 4<i>a<\/i> + 2<i>b<\/i> − 6 = 0, so 2<i>a<\/i> + <i>b<\/i> = −5.<br><i>p<\/i>(−1) = −2 + <i>a<\/i> − <i>b<\/i> − 6 = −12, so <i>a<\/i> − <i>b<\/i> = −4.<br>Adding: 3<i>a<\/i> = −9, so <i>a<\/i> = −3 and <i>b<\/i> = 1; <i>a<\/i> + <i>b<\/i> = −2.<br>Answer: <b>−2<\/b>"}], "unit_no": 2, "topic_no": "3", "code": "3.3"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  mode=m; selTabs(m);
  if(m==='learn') renderLearn(opts&&opts.sheet); else renderQuizIntro();
  try{ history.replaceState(null,'','#'+m); }catch(e){}
}
$('tabLearn').addEventListener('click',function(){ setMode('learn'); });
$('tabQuiz').addEventListener('click',function(){
  if(QZ){ mode='quiz'; selTabs('quiz'); if(QZ.done) renderReport('all'); else renderQuestion(); return; }
  setMode('quiz');
});

/* ---------- shared question widget ---------- */
function qBody(q, sel, name){
  var h='<div class="qtext">'+q.q+'</div>';
  if(q.type==='spr'){
    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';
  } else {
    h+='<div class="opts" role="radiogroup">'+q.opts.map(function(o,k){ return '<button type="button" class="opt" role="radio" aria-checked="'+(sel===k)+'" data-k="'+k+'"><span class="let">'+letter(k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';
  }
  return h;
}

/* ---------- LEARN ---------- */
function renderLearn(jump){
  if(jump!=null) ST.sheet=jump;
  var cur=Math.max(0,Math.min(NSHEET-1,ST.sheet)); ST.sheet=cur; save();
  var h='<div class="stack">';
  h+='<section class="card"><div class="eyebrow">Learning objectives</div><p style="margin:6px 0 0;color:var(--ink-soft)">Each objective has its own learning sheet: read the idea, step through the worked examples, then do the guided questions (use a hint if you are stuck). Tick the objective when you are confident, then take the quiz sheets.</p><ul class="los">'+
    LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><a href="#" data-sheet="'+i+'">'+l.text+'</a>'+(ST.done[l.id]?'<span class="lo-done">✓ Done</span>':'')+'</li>'; }).join('')+'</ul>'+
    '<div class="sheetnav" role="tablist" aria-label="Learning sheets">'+LOS.map(function(l,i){ return '<button class="tab'+(ST.done[l.id]?' done':'')+'" role="tab" data-sheet="'+i+'" aria-selected="'+(i===cur)+'">Sheet '+(i+1)+'</button>'; }).join('')+
    '<button class="tab" role="tab" data-sheet="'+LOS.length+'" aria-selected="'+(cur===LOS.length)+'">Recap</button></div></section>';
  if(cur<LOS.length){
    var L=LOS[cur];
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Learning sheet '+(cur+1)+' of '+LOS.length+' · Objective '+(cur+1)+'</div><h2>'+L.text+'</h2>';
    h+='<div class="concept">'+byLo(S.notes,L.id).map(function(n){ return '<h3 class="note-h">'+n.h+'</h3>'+n.html; }).join('')+'</div>';
    byLo(S.examples,L.id).forEach(function(E,ei){
      h+='<div class="ex"><h3>Worked example '+(ei+1)+'</h3><div class="ex-q">'+E.q+'</div><ol class="steps">'+E.steps.map(function(s){ return '<li hidden>'+s+'</li>'; }).join('')+'</ol><div class="ans" hidden>Answer: '+E.ans+'</div><div class="ex-ctrl"><button class="btn" data-next>Show first step</button><button class="btn" data-all>Show full solution</button></div></div>';
    });
    var G=byLo(S.guided,L.id);
    if(G.length) h+='<h3 class="note-h">Guided practice</h3>';
    G.forEach(function(q,qi){
      var gi=S.guided.indexOf(q);
      h+='<div class="try" data-g="'+gi+'"><h3>Question '+(qi+1)+' of '+G.length+' <span class="pill '+q.diff+'" style="margin-left:6px">'+DIFF[q.diff]+'</span></h3>'+qBody(q,null,'g-'+gi)+'<div class="ex-ctrl">'+(q.hint?'<button class="btn" data-hint>Show hint</button>':'')+'<button class="btn btn-primary" data-check>Check answer</button></div><div class="hint" hidden>'+(q.hint||'')+'</div><div class="fbk"></div></div>';
    });
    h+='<label class="donebox"><input type="checkbox" id="done-'+esc(L.id)+'" data-done="'+esc(L.id)+'"'+(ST.done[L.id]?' checked':'')+'> I can do this objective</label>';
    h+='<div class="qnav"><button class="btn" data-go="'+(cur-1)+'"'+(cur===0?' disabled':'')+'>Previous sheet</button><button class="btn btn-primary" data-go="'+(cur+1)+'">'+(cur===LOS.length-1?'Go to recap':'Next sheet')+'</button></div></section>';
  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
