var S = {"id": "GEO-3.1", "unit": "Geometry and Trigonometry", "topic": "Right triangles, trigonometry and circles", "title": "Pythagorean theorem and special right triangles", "intro": "The Pythagorean theorem links the three sides of every right triangle, and two special right triangles, 45°-45°-90° and 30°-60°-90°, have side ratios you can use without any calculation. On the DSAT these ideas appear in figures, in word problems about ramps, ladders and screens, in distances on the coordinate plane, and inside harder questions about boxes and triangles.", "los": [{"id": "LO1", "text": "Apply the Pythagorean theorem to find a missing side of a right triangle, and use its converse to determine whether a triangle is a right triangle."}, {"id": "LO2", "text": "Identify Pythagorean triples and their multiples and use them to find missing side lengths quickly."}, {"id": "LO3", "text": "Determine all side lengths of a 45°-45°-90° or 30°-60°-90° triangle from any one side."}, {"id": "LO4", "text": "Calculate the distance between two points in the xy-plane."}, {"id": "LO5", "text": "Determine the diagonals of rectangles and rectangular boxes and the altitudes of equilateral and isosceles triangles."}], "notes": [{"lo": "LO1", "h": "The Pythagorean theorem", "html": "<p>In a right triangle, the side opposite the right angle is the <b>hypotenuse<\/b>. It is always the longest side. The other two sides are the <b>legs<\/b>. If the legs have lengths <i>a<\/i> and <i>b<\/i> and the hypotenuse has length <i>c<\/i>, then<\/p><div class=\"eqs\"><i>a<\/i><sup>2<\/sup> + <i>b<\/i><sup>2<\/sup> = <i>c<\/i><sup>2<\/sup><\/div><div class=\"rule\">The hypotenuse stands alone on one side of the equation. To find the hypotenuse, add the squares of the legs. To find a leg, subtract: <i>b<\/i><sup>2<\/sup> = <i>c<\/i><sup>2<\/sup> − <i>a<\/i><sup>2<\/sup>.<\/div><p>For example, legs of 5 and 6 give <i>c<\/i><sup>2<\/sup> = 25 + 36 = 61, so <i>c<\/i> = √61. A hypotenuse of 8 and a leg of 3 give <i>b<\/i><sup>2<\/sup> = 64 − 9 = 55, so <i>b<\/i> = √55.<\/p><p>Simplify a radical by taking out square factors: √72 = √36 · √2 = 6√2.<\/p><div class=\"tip\">DSAT tip: the reference sheet lists <i>c<\/i><sup>2<\/sup> = <i>a<\/i><sup>2<\/sup> + <i>b<\/i><sup>2<\/sup>, but it will not tell you which side is <i>c<\/i>. Find the right-angle mark first; the side across from it is the hypotenuse.<\/div>"}, {"lo": "LO1", "h": "The converse: testing for a right angle", "html": "<p>The theorem also works backward. If the side lengths of a triangle satisfy <i>a<\/i><sup>2<\/sup> + <i>b<\/i><sup>2<\/sup> = <i>c<\/i><sup>2<\/sup>, where <i>c<\/i> is the <b>longest<\/b> side, then the triangle is a right triangle, and the right angle is opposite side <i>c<\/i>.<\/p><div class=\"rule\">To test three lengths, square the two shorter sides and add. Compare the sum with the square of the longest side. Equal means a right triangle; not equal means there is no right angle.<\/div><p>Test 9, 12, 16: 81 + 144 = 225, but 16<sup>2<\/sup> = 256. Since 225 ≠ 256, the triangle is not a right triangle. Test 1.5, 2, 2.5: 2.25 + 4 = 6.25 = 2.5<sup>2<\/sup>, so it is a right triangle.<\/p><p>Some questions combine the theorem with algebra. If a right triangle has legs <i>x<\/i> and 6 and hypotenuse <i>x<\/i> + 2, write <i>x<\/i><sup>2<\/sup> + 36 = (<i>x<\/i> + 2)<sup>2<\/sup>. Expand: <i>x<\/i><sup>2<\/sup> + 36 = <i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> + 4, so 4<i>x<\/i> = 32 and <i>x<\/i> = 8.<\/p><div class=\"tip\">Square a binomial completely: (<i>x<\/i> + 2)<sup>2<\/sup> = <i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> + 4, not <i>x<\/i><sup>2<\/sup> + 4.<\/div>"}, {"lo": "LO2", "h": "Pythagorean triples", "html": "<p>A <b>Pythagorean triple<\/b> is a set of three whole numbers that fit <i>a<\/i><sup>2<\/sup> + <i>b<\/i><sup>2<\/sup> = <i>c<\/i><sup>2<\/sup>. Recognizing the common ones saves time on the DSAT.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Triple<\/th><th>Check<\/th><th>Some multiples<\/th><\/tr><tr><td>3, 4, 5<\/td><td>9 + 16 = 25<\/td><td>6, 8, 10; 0.3, 0.4, 0.5<\/td><\/tr><tr><td>5, 12, 13<\/td><td>25 + 144 = 169<\/td><td>50, 120, 130<\/td><\/tr><tr><td>8, 15, 17<\/td><td>64 + 225 = 289<\/td><td>4, 7.5, 8.5<\/td><\/tr><tr><td>7, 24, 25<\/td><td>49 + 576 = 625<\/td><td>70, 240, 250<\/td><\/tr><\/table><\/div><div class=\"rule\">Any multiple of a triple also works: if 3, 4, 5 is a right triangle, so is 3<i>k<\/i>, 4<i>k<\/i>, 5<i>k<\/i> for any positive <i>k<\/i>, including decimals and fractions.<\/div><p>To use a triple, divide the given sides by a common factor and look for a familiar pattern. Legs of 18 and 24 are 6 × 3 and 6 × 4, so the hypotenuse is 6 × 5 = 30.<\/p><div class=\"tip\">Check that the numbers sit in the right places. In 5, 12, 13 the 13 must be the hypotenuse. If the hypotenuse is 12 and a leg is 5, the other leg is √119, not 13.<\/div>"}, {"lo": "LO3", "h": "45°-45°-90° triangles", "html": "<p>An isosceles right triangle has angles of 45°, 45° and 90°. Its legs are equal, so if each leg is <i>x<\/i>, the square of the hypotenuse is <i>x<\/i><sup>2<\/sup> + <i>x<\/i><sup>2<\/sup> = 2<i>x<\/i><sup>2<\/sup>, and the hypotenuse is <i>x<\/i>√2.<\/p><div class=\"eqs\">leg : leg : hypotenuse = <i>x<\/i> : <i>x<\/i> : <i>x<\/i>√2<\/div><div class=\"rule\">Leg to hypotenuse: multiply by √2. Hypotenuse to leg: divide by √2, which is the same as multiplying by <span class=\"fq\"><span>√2<\/span><span>2<\/span><\/span>.<\/div><p>A leg of 5 gives a hypotenuse of 5√2. A hypotenuse of 6 gives legs of <span class=\"fq\"><span>6<\/span><span>√2<\/span><\/span> = <span class=\"fq\"><span>6√2<\/span><span>2<\/span><\/span> = 3√2. A square with side <i>s<\/i> has a diagonal of <i>s<\/i>√2, because the diagonal cuts the square into two 45°-45°-90° triangles.<\/p><svg class=\"fig\" viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"Two right triangles. Left: a 45°-45°-90° triangle with legs x and x and hypotenuse x times the square root of 2. Right: a 30°-60°-90° triangle whose short leg x is opposite the 30° angle, long leg x times the square root of 3 is opposite the 60° angle, and hypotenuse is 2x.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26,130 116,130 26,40\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"154.1,130 274,130 154.1,60.8\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" points=\"35,130 35,121 26,121\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" points=\"163.1,130 163.1,121 154.1,121\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"71\" y=\"142.5\" text-anchor=\"middle\" dy=\"0.35em\"><tspan font-style=\"italic\">x<\/tspan><\/text><text x=\"16.3\" y=\"85\" text-anchor=\"middle\" dy=\"0.35em\"><tspan font-style=\"italic\">x<\/tspan><\/text><text x=\"84\" y=\"72\" text-anchor=\"middle\" dy=\"0.35em\"><tspan font-style=\"italic\">x<\/tspan>√2<\/text><text x=\"85.8\" y=\"117.5\" text-anchor=\"middle\" dy=\"0.35em\">45°<\/text><text x=\"38.5\" y=\"70.2\" text-anchor=\"middle\" dy=\"0.35em\">45°<\/text><text x=\"144.4\" y=\"95.4\" text-anchor=\"middle\" dy=\"0.35em\"><tspan font-style=\"italic\">x<\/tspan><\/text><text x=\"214\" y=\"142.5\" text-anchor=\"middle\" dy=\"0.35em\"><tspan font-style=\"italic\">x<\/tspan>√3<\/text><text x=\"221.7\" y=\"82.1\" text-anchor=\"middle\" dy=\"0.35em\">2<tspan font-style=\"italic\">x<\/tspan><\/text><text x=\"227.3\" y=\"117.5\" text-anchor=\"middle\" dy=\"0.35em\">30°<\/text><text x=\"166.6\" y=\"82.4\" text-anchor=\"middle\" dy=\"0.35em\">60°<\/text><\/g><\/svg><div class=\"tip\">The DSAT reference sheet shows both special right triangles, as in the figure. Use it to check which side gets the √2 or the √3.<\/div>"}, {"lo": "LO3", "h": "30°-60°-90° triangles", "html": "<p>A 30°-60°-90° triangle is half of an equilateral triangle. If the shortest side, opposite the 30° angle, is <i>x<\/i>, then the hypotenuse is 2<i>x<\/i> and the longer leg, opposite the 60° angle, is <i>x<\/i>√3.<\/p><div class=\"eqs\">short leg : long leg : hypotenuse = <i>x<\/i> : <i>x<\/i>√3 : 2<i>x<\/i><\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Given<\/th><th>Short leg<\/th><th>Long leg<\/th><th>Hypotenuse<\/th><\/tr><tr><td>short leg 4<\/td><td>4<\/td><td>4√3<\/td><td>8<\/td><\/tr><tr><td>hypotenuse 22<\/td><td>11<\/td><td>11√3<\/td><td>22<\/td><\/tr><tr><td>long leg 15<\/td><td><span class=\"fq\"><span>15<\/span><span>√3<\/span><\/span> = 5√3<\/td><td>15<\/td><td>10√3<\/td><\/tr><\/table><\/div><div class=\"rule\">Find the short leg first. Then double it for the hypotenuse, or multiply it by √3 for the long leg.<\/div><p>To match sides with angles, remember that the shortest side is across from 30° and the longest side, the hypotenuse, is across from 90°.<\/p>"}, {"lo": "LO4", "h": "Distance between two points", "html": "<p>The distance between two points in the <i>x<\/i><i>y<\/i>-plane is the hypotenuse of a right triangle whose legs are horizontal and vertical. The horizontal leg is the change in <i>x<\/i>, and the vertical leg is the change in <i>y<\/i>.<\/p><div class=\"eqs\"><i>d<\/i> = √((<i>x<\/i><sub>2<\/sub> − <i>x<\/i><sub>1<\/sub>)<sup>2<\/sup> + (<i>y<\/i><sub>2<\/sub> − <i>y<\/i><sub>1<\/sub>)<sup>2<\/sup>)<\/div><div class=\"rule\">Subtract the <i>x<\/i>-coordinates, subtract the <i>y<\/i>-coordinates, square both differences, add, then take the square root. The order of subtraction does not matter, because squaring removes the sign.<\/div><p>For (−1, 4) and (5, −4), the changes are 6 and −8, so <i>d<\/i> = √(36 + 64) = √100 = 10.<\/p><p>When two points share an <i>x<\/i>-coordinate or a <i>y<\/i>-coordinate, the distance is just the difference of the other coordinates: (2, −3) to (2, 8) is 11 units.<\/p><div class=\"tip\">Desmos tip: type sqrt((5−(−1))^2+(−4−4)^2) to check your arithmetic, or plot the two points and count the grid units for each leg.<\/div>"}, {"lo": "LO5", "h": "Diagonals of rectangles and boxes", "html": "<p>A diagonal of a rectangle splits it into two right triangles whose legs are the length and the width. For a rectangle with length <i>l<\/i> and width <i>w<\/i>, the diagonal is <i>d<\/i> = √(<i>l<\/i><sup>2<\/sup> + <i>w<\/i><sup>2<\/sup>).<\/p><p>For a rectangular box with length <i>l<\/i>, width <i>w<\/i> and height <i>h<\/i>, the <b>space diagonal<\/b> runs from one corner, through the inside, to the opposite corner. Use the theorem twice: first find the diagonal of the base, then use it with the height.<\/p><div class=\"eqs\">(base diagonal)<sup>2<\/sup> = <i>l<\/i><sup>2<\/sup> + <i>w<\/i><sup>2<\/sup><br>(space diagonal)<sup>2<\/sup> = <i>l<\/i><sup>2<\/sup> + <i>w<\/i><sup>2<\/sup> + <i>h<\/i><sup>2<\/sup><\/div><div class=\"rule\">Space diagonal <i>d<\/i> = √(<i>l<\/i><sup>2<\/sup> + <i>w<\/i><sup>2<\/sup> + <i>h<\/i><sup>2<\/sup>). For a cube with edge <i>s<\/i>, <i>d<\/i> = <i>s<\/i>√3.<\/div><p>For a box 2 by 6 by 9, <i>d<\/i> = √(4 + 36 + 81) = √121 = 11. This is the longest straight rod that fits inside the box.<\/p><div class=\"tip\">Do not add the dimensions themselves. The rod is not 2 + 6 + 9 = 17 units long.<\/div>"}, {"lo": "LO5", "h": "Altitudes of equilateral and isosceles triangles", "html": "<p>In an isosceles triangle, the altitude to the base meets the base at its midpoint and forms two congruent right triangles. Each has half the base as a leg and one of the equal sides as its hypotenuse.<\/p><p>An equilateral triangle with side <i>s<\/i> is a special case. Its altitude splits it into two 30°-60°-90° triangles with short leg <span class=\"fq\"><span><i>s<\/i><\/span><span>2<\/span><\/span>, so<\/p><div class=\"eqs\">altitude <i>h<\/i> = <span class=\"fq\"><span><i>s<\/i>√3<\/span><span>2<\/span><\/span>&nbsp;&nbsp;&nbsp;&nbsp;area = <span class=\"fq\"><span><i>s<\/i><sup>2<\/sup>√3<\/span><span>4<\/span><\/span><\/div><div class=\"rule\">Isosceles: (altitude)<sup>2<\/sup> = (equal side)<sup>2<\/sup> − (half the base)<sup>2<\/sup>. Equilateral: altitude = <span class=\"fq\"><span><i>s<\/i>√3<\/span><span>2<\/span><\/span>.<\/div><p>An isosceles triangle with sides 13, 13 and base 10 has altitude √(169 − 25) = 12, so its area is <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> · 10 · 12 = 60. An equilateral triangle with side 8 has altitude 4√3 and area 16√3.<\/p><div class=\"tip\">Halve the base before you use it in the Pythagorean theorem. Using the full base is the most common error.<\/div>"}], "examples": [{"lo": "LO1", "q": "A right triangle has a hypotenuse of length 10 and a leg of length 4. What is the length of the other leg?", "steps": ["The hypotenuse is 10, so it stands alone: 4<sup>2<\/sup> + <i>b<\/i><sup>2<\/sup> = 10<sup>2<\/sup>.", "16 + <i>b<\/i><sup>2<\/sup> = 100, so <i>b<\/i><sup>2<\/sup> = 84.", "<i>b<\/i> = √84 = √(4 · 21) = 2√21."], "ans": "2√21"}, {"lo": "LO1", "q": "A triangle has side lengths 11, 60 and 61. Which statement is true?<br>A) It is a right triangle, and the right angle is opposite the side of length 61.<br>B) It is a right triangle, and the right angle is opposite the side of length 60.<br>C) It is not a right triangle.<br>D) There is not enough information to decide.", "steps": ["Square the two shorter sides and add: 11<sup>2<\/sup> + 60<sup>2<\/sup> = 121 + 3,600 = 3,721.", "Square the longest side: 61<sup>2<\/sup> = 3,721.", "The two results are equal, so by the converse of the Pythagorean theorem the triangle is a right triangle, with the right angle opposite the longest side, 61."], "ans": "A"}, {"lo": "LO2", "q": "A right triangle has legs of lengths 16 and 30. What is the length of the hypotenuse?", "steps": ["Both legs are even: 16 = 2 × 8 and 30 = 2 × 15.", "8, 15, 17 is a Pythagorean triple, so the hypotenuse is 2 × 17 = 34.", "Check: 16<sup>2<\/sup> + 30<sup>2<\/sup> = 256 + 900 = 1,156 = 34<sup>2<\/sup>."], "ans": "34"}, {"lo": "LO3", "q": "In right triangle JKL, angle K is a right angle and angle J measures 30°. If JL = 14, what is the length of KL?<br>A) 7<br>B) 7√2<br>C) 7√3<br>D) 14√3", "steps": ["JL is opposite the right angle, so JL = 14 is the hypotenuse.", "KL is opposite angle J, the 30° angle, so KL is the short leg.", "Short leg = half the hypotenuse = 7. (The long leg JK would be 7√3.)"], "ans": "A) 7"}, {"lo": "LO3", "q": "A square has a diagonal of length 10. What is the area of the square?", "steps": ["The diagonal splits the square into two 45°-45°-90° triangles, each with hypotenuse 10.", "Each side is a leg: <span class=\"fq\"><span>10<\/span><span>√2<\/span><\/span> = <span class=\"fq\"><span>10√2<\/span><span>2<\/span><\/span> = 5√2.", "Area = (5√2)<sup>2<\/sup> = 25 · 2 = 50."], "ans": "50"}, {"lo": "LO4", "q": "What is the distance between the points (−3, 7) and (9, 2) in the <i>x<\/i><i>y<\/i>-plane?", "steps": ["Horizontal change: 9 − (−3) = 12. Vertical change: 2 − 7 = −5.", "<i>d<\/i> = √(12<sup>2<\/sup> + (−5)<sup>2<\/sup>) = √(144 + 25) = √169.", "<i>d<\/i> = 13. (This is the 5-12-13 triple.)"], "ans": "13"}, {"lo": "LO5", "q": "A rectangular box measures 3 centimeters by 4 centimeters by 12 centimeters. What is the length of the longest straight rod that fits inside the box?", "steps": ["The longest rod lies along the space diagonal.", "Diagonal of the 3 by 4 base: √(9 + 16) = 5.", "Use the base diagonal with the height 12: √(25 + 144) = √169 = 13. In one step: √(9 + 16 + 144) = 13."], "ans": "13 centimeters"}], "traps": ["Adding the squares when the hypotenuse is one of the given sides. If the hypotenuse is 10 and a leg is 4, the other leg is √(100 − 16) = √84, not √116.", "Treating the longest side as a leg. Find the right-angle mark first: the side across from it is the hypotenuse and goes alone in <i>a<\/i><sup>2<\/sup> + <i>b<\/i><sup>2<\/sup> = <i>c<\/i><sup>2<\/sup>.", "Forcing a triple. Sides of 5 and 12 give a third side of 13 only when both are legs; if 12 is the hypotenuse, the other leg is √119.", "Mixing up the 30°-60°-90° sides. The short leg is opposite 30°, the √3 belongs to the leg opposite 60°, and the hypotenuse is twice the short leg, not twice the long leg.", "Losing a sign in the distance formula. The change from −3 to 9 is 12, not 6. Square each difference, so a negative difference still gives a positive square.", "Using the full base for the altitude of an isosceles triangle, or adding the dimensions of a box instead of their squares. Halve the base first, and use √(<i>l<\/i><sup>2<\/sup> + <i>w<\/i><sup>2<\/sup> + <i>h<\/i><sup>2<\/sup>) for a box diagonal."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 190\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C. Leg AC has length 4 and leg BC has length 7. Side AB is the hypotenuse.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"34,40.1 34,149.9 226,149.9\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" points=\"34,140.9 43,140.9 43,149.9\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"24.1\" y=\"28.9\" text-anchor=\"middle\" dy=\"0.35em\">A<\/text><text x=\"21\" y=\"157.3\" text-anchor=\"middle\" dy=\"0.35em\">C<\/text><text x=\"240.4\" y=\"154\" text-anchor=\"middle\" dy=\"0.35em\">B<\/text><text x=\"24.3\" y=\"95\" text-anchor=\"middle\" dy=\"0.35em\">4<\/text><text x=\"130\" y=\"162.4\" text-anchor=\"middle\" dy=\"0.35em\">7<\/text><\/g><\/svg>In right triangle ABC shown, AC = 4 and BC = 7. What is the length of AB?", "opts": ["11", "√65", "√33", "65"], "ans": 1, "sol": "AB is opposite the right angle, so it is the hypotenuse.<br>AB<sup>2<\/sup> = 4<sup>2<\/sup> + 7<sup>2<\/sup> = 16 + 49 = 65.<br>AB = √65.<br>Answer: <b>√65<\/b>", "hint": "Which side is across from the right-angle mark? That side stands alone in the equation."}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "In a right triangle, one leg is twice as long as the other leg, and the hypotenuse has length 15. What is the area of the triangle?", "ans": ["45"], "sol": "Let the legs be <i>x<\/i> and 2<i>x<\/i>. Then <i>x<\/i><sup>2<\/sup> + (2<i>x<\/i>)<sup>2<\/sup> = 15<sup>2<\/sup>, so 5<i>x<\/i><sup>2<\/sup> = 225 and <i>x<\/i><sup>2<\/sup> = 45.<br>Area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> · <i>x<\/i> · 2<i>x<\/i> = <i>x<\/i><sup>2<\/sup>.<br>So the area is 45.<br>Answer: <b>45<\/b>", "hint": "Call the legs <i>x<\/i> and 2<i>x<\/i>. Notice that the area, <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> · <i>x<\/i> · 2<i>x<\/i>, equals <i>x<\/i><sup>2<\/sup>, so you may not need <i>x<\/i> itself."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which of the following could be the side lengths of a right triangle?", "opts": ["5, 7, 9", "4, 6, 8", "2, 3, √12", "6, 7, √85"], "ans": 3, "sol": "Square the two shorter sides and compare with the square of the longest side.<br>6, 7, √85: 36 + 49 = 85 = (√85)<sup>2<\/sup> ✓.<br>5, 7, 9: 25 + 49 = 74 ≠ 81. 4, 6, 8: 16 + 36 = 52 ≠ 64. 2, 3, √12: 4 + 9 = 13 ≠ 12.<br>Answer: <b>6, 7, √85<\/b>", "hint": "Square the two shorter lengths, add, and compare with the square of the longest length. Remember that (√85)<sup>2<\/sup> = 85."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A right triangle has a leg of length 24 and a hypotenuse of length 26. What is the length of the other leg?", "opts": ["10", "2", "2√313", "100"], "ans": 0, "sol": "Divide by 2: 12 and 13 belong to the 5-12-13 triple.<br>Other leg = 2 × 5 = 10. Check: 10<sup>2<\/sup> + 24<sup>2<\/sup> = 100 + 576 = 676 = 26<sup>2<\/sup>.<br>Answer: <b>10<\/b>", "hint": "Both numbers are even. Divide them by 2 and look for a triple you know."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A tent pole 1.2 meters tall stands straight up on level ground. A rope 2 meters long is pulled tight from the top of the pole to a sta , "q": "A cube has a space diagonal (from one corner, through the inside of the cube, to the opposite corner) of length 12. What is the volume of the cube?", "opts": ["192√3", "432√2", "64", "1,728"], "ans": 0, "sol": "For a cube with edge <i>s<\/i>, the space diagonal is √(<i>s<\/i><sup>2<\/sup> + <i>s<\/i><sup>2<\/sup> + <i>s<\/i><sup>2<\/sup>) = <i>s<\/i>√3.<br><i>s<\/i>√3 = 12, so <i>s<\/i> = <span class=\"fq\"><span>12<\/span><span>√3<\/span><\/span> = 4√3.<br>Volume = (4√3)<sup>3<\/sup> = 64 · 3√3 = 192√3.<br>Answer: <b>192√3<\/b>", "hint": "Write the space diagonal in terms of the edge <i>s<\/i>, using √(<i>l<\/i><sup>2<\/sup> + <i>w<\/i><sup>2<\/sup> + <i>h<\/i><sup>2<\/sup>) with all three dimensions equal."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 190\" role=\"img\" aria-label=\"Right triangle KLM with the right angle at L. Side KL has length p, side LM has length r, and side KM has length q.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"34,35 34,155 226,155\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" points=\"34,146 43,146 43,155\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"24.6\" y=\"23.3\" text-anchor=\"middle\" dy=\"0.35em\">K<\/text><text x=\"21.3\" y=\"162.9\" text-anchor=\"middle\" dy=\"0.35em\">L<\/text><text x=\"240.3\" y=\"159.5\" text-anchor=\"middle\" dy=\"0.35em\">M<\/text><text x=\"24.3\" y=\"95\" text-anchor=\"middle\" dy=\"0.35em\" font-style=\"italic\">p<\/text><text x=\"130\" y=\"167.5\" text-anchor=\"middle\" dy=\"0.35em\" font-style=\"italic\">r<\/text><text x=\"137.1\" y=\"83.6\" text-anchor=\"middle\" dy=\"0.35em\" font-style=\"italic\">q<\/text><\/g><\/svg>In right triangle KLM shown, the side lengths are <i>p<\/i>, <i>q<\/i> and <i>r<\/i>. Which equation must be true?", "opts": ["<i>p<\/i><sup>2<\/sup> + <i>q<\/i><sup>2<\/sup> = <i>r<\/i><sup>2<\/sup>", "<i n a 30°-60°-90° triangle, the side opposite the 30° angle has length 5. What is the length of the hypotenuse?", "opts": ["5√2", "10", "5√3", "10√3"], "ans": 1, "sol": "The side opposite 30° is the short leg.<br>Hypotenuse = 2 × short leg = 10.<br>Answer: <b>10<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "In triangle PQR, PQ = 20, QR = 21 and PR = 29. What is the area of triangle PQR?", "opts": ["290", "210", "304.5", "420"], "ans": 1, "sol": "Test for a right angle: 20<sup>2<\/sup> + 21<sup>2<\/sup> = 400 + 441 = 841 = 29<sup>2<\/sup>.<br>So the triangle is a right triangle with hypotenuse PR, and the legs are PQ and QR.<br>Area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> · 20 · 21 = 210.<br>Answer: <b>210<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "A carpenter cuts a wooden brace shaped like a right triangle. Its two shorter sides are 40 centimeters and 25 centimeters long. What is the length of the longest side, to the nearest tenth of a centimeter?", "ans": ["47.2"], "sol": "The longest side is the hypotenuse: √(40<sup>2<\/sup> + 25<sup>2<\/sup>) = √(1,600 + 625) = √2,225.<br>√2,225 ≈ 47.17, which rounds to 47.2.<br>Answer: <b>47.2<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A right triangle has a hypotenuse of length 39 and a leg of length 15. What is the perimeter of the triangle?", "opts": ["36", "54", "54 + 3√194", "90"], "ans": 3, "sol": "15 and 39 are 3 × 5 and 3 × 13, so the other leg is 3 × 12 = 36.<br>Perimeter = 15 + 36 + 39 = 90.<br>Answer: <b>90<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A corner shelf is shaped like an isosceles right triangle with an area of 18 square inches. What is the length, in inches, of the longest side of the shelf?", "opts": ["6√2", "6", "12", "18√2"], "ans": 0, "sol": "Let each leg be <i>x<\/i>. Area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i><sup>2<\/sup> = 18, so <i>x<\/i><sup>2<\/sup> = 36 and <i>x<\/i> = 6.<br>The longest side is the hypotenuse: 6√2.<br>Answer: <b>6√2<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "On a city map placed in the <i>x<\/i><i>y<\/i>-plane, each unit represents 1 kilometer. A library is at (−4, −3) and a school is at (11, 5). What is the straight-line distance, in kilometers, between the library and the school?", "opts": ["√53", "23", "17", "289"], "ans": 2, "sol": "Horizontal change: 11 − (−4) = 15. Vertical change: 5 − (−3) = 8.<br><i>d<\/i> = √(225 + 64) = √289 = 17.<br>Answer: <b>17<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A warning sign is shaped like an equilateral triangle with a perimeter of 36 inches. What is the height of the sign, in inches?", "opts": ["6√2", "12√3", "18√3", "6√3"], "ans": 3, "sol": "Each side is 36 ÷ 3 = 12 inches.<br>Height = <span class=\"fq\"><span><i>s<\/i>√3<\/span><span>2<\/span><\/span> = <span class=\"fq\"><span>12√3<\/span><span>2<\/span><\/span> = 6√3.<br>Answer: <b>6√3<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 210\" role=\"img\" aria-label=\"Isosceles triangle ABC with AB = AC = 10 and base BC = 12. A dashed segment AD is drawn from A perpendicular to BC, with D on BC.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"130,41 34,169 226,169\"/><line class=\"fg-edge\" x1=\"130\" y1=\"41\" x2=\"130\" y2=\"169\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" points=\"130,160 139,160 139,169\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"130\" y=\"26\" text-anchor=\"middle\" dy=\"0.35em\">A<\/text><text x=\"19.8\" y=\"173.7\" text-anchor=\"middle\" dy=\"0.35em\">B<\/text><text x=\"240.2\" y=\"173.7\" text-anchor=\"middle\" dy=\"0.35em\">C<\/text><text x=\"121\" y=\"159\" text-anchor=\"middle\" dy=\"0.35em\">D<\/text><text x=\"69.3\" y=\"95.5\" text-anchor=\"middle\" dy=\"0.35em\">10< /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
