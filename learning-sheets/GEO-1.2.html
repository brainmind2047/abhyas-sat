<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,

      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);

  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}

  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}

  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}

  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}

  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}

<script>
(function(){
"use strict";
var S = {"id": "GEO-1.2", "unit": "Geometry and Trigonometry", "topic": "Lines, angles and triangles", "title": "Triangle properties and congruence", "intro": "This subtopic covers the facts every triangle obeys: the 180° angle sum, the exterior angle theorem, the equal sides and angles of isosceles and equilateral triangles, the triangle inequality and the link between the longest side and the largest angle. It ends with congruent triangles. On the DSAT these appear as labeled figures where you find a missing angle or length, often written as an algebraic expression, and as questions about which side lengths are possible.", "los": [{"id": "LO1", "text": "Apply the triangle angle sum of 180° to find missing angles, including angles written as algebraic expressions."}, {"id": "LO2", "text": "Use the exterior angle theorem to find exterior angles, remote interior angles and unknown values."}, {"id": "LO3", "text": "Use the equal sides and equal angles of isosceles and equilateral triangles to find unknown angles and lengths."}, {"id": "LO4", "text": "Determine possible side lengths with the triangle inequality, and order sides and angles using the fact that the largest side is opposite the largest angle."}, {"id": "LO5", "text": "Identify congruent triangles by SSS, SAS, ASA or AAS, and use corresponding parts to find lengths and angles."}], "notes": [{"lo": "LO1", "h": "The angle sum of a triangle", "html": "<p>The three interior angles of every triangle add up to 180°. This one fact settles many DSAT angle questions: if you know two angles of a triangle, subtract them from 180° to find the third.<\/p><div class=\"rule\">In any triangle <i>A<\/i><i>B<\/i><i>C<\/i>, ∠<i>A<\/i> + ∠<i>B<\/i> + ∠<i>C<\/i> = 180°.<\/div><p>In a right triangle the right angle uses 90°, so the two acute angles add up to 90°. A triangle can have at most one right angle or one obtuse angle, because two such angles would already use 180° or more.<\/p><p>When the angles are written as expressions, add all three, set the sum equal to 180 and solve.<\/p><div class=\"eqs\">(2<i>x<\/i> + 5) + (3<i>x<\/i> − 10) + (<i>x<\/i> + 35) = 180<br>6<i>x<\/i> + 30 = 180<br><i>x<\/i> = 25<\/div><p>The angles are 55°, 65° and 60°. Substitute back before you answer, because the question usually asks for an angle, not for <i>x<\/i>.<\/p><div class=\"tip\">DSAT tip: when a segment splits a triangle into two smaller triangles, each small triangle also has an angle sum of 180°. Write the sum for whichever triangle contains the unknown.<\/div>"}, {"lo": "LO2", "h": "The exterior angle theorem", "html": "<p>Extend one side of a triangle past a vertex. The angle between the extension and the other side at that vertex is an <b>exterior angle<\/b>. It forms a linear pair with the interior angle next to it, so those two angles add up to 180°.<\/p><div class=\"rule\">An exterior angle equals the sum of the two remote interior angles, the two angles of the triangle that are not next to it.<\/div><p>Here is why. If the interior angle at <i>C<\/i> is <i>c<\/i>°, the exterior angle at <i>C<\/i> is (180 − <i>c<\/i>)°. The angle sum says ∠<i>A<\/i> + ∠<i>B<\/i> = 180° − <i>c<\/i>° as well, so the two are equal.<\/p><div class=\"eqs\">exterior angle at <i>C<\/i> = ∠<i>A<\/i> + ∠<i>B<\/i><\/div><p>So an exterior angle is always larger than either remote interior angle. With expressions, set the exterior angle equal to the sum of the two remote angles and solve in one step, instead of finding the interior angle first.<\/p><div class=\"tip\">DSAT tip: in a figure with extra segments, look for a triangle in which the angle you want is an exterior angle. One equation then replaces two.<\/div>"}, {"lo": "LO3", "h": "Isosceles triangles", "html": "<p>An <b>isosceles<\/b> triangle has at least two equal sides, called the legs. The third side is the base, and the angle between the legs is the vertex angle. Figures show equal sides with matching tick marks.<\/p><div class=\"rule\">Equal sides are opposite equal angles, and equal angles are opposite equal sides. So the two base angles of an isosceles triangle are equal.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>You know<\/th><th>Then<\/th><\/tr><tr><td>the vertex angle, <i>v<\/i>°<\/td><td>each base angle is <span class=\"fq\"><span>180 − <i>v<\/i><\/span><span>2<\/span><\/span> degrees<\/td><\/tr><tr><td>a base angle, <i>b<\/i>°<\/td><td>the vertex angle is (180 − 2<i>b<\/i>)°<\/td><\/tr><\/table><\/div><p>For example, a vertex angle of 50° leaves 130° for the two base angles, so each one is 65°. If a question says only that one angle of an isosceles triangle is 50°, check both cases: it may be the vertex angle (50°, 65°, 65°) or a base angle (50°, 50°, 80°).<\/p>"}, {"lo": "LO3", "h": "Equilateral triangles and combined figures", "html": "<p>An <b>equilateral<\/b> triangle has three equal sides, so its three angles are equal as well, and each one measures 180° ÷ 3 = 60°. Its perimeter is 3 times the length of one side.<\/p><div class=\"rule\">A triangle is equilateral exactly when all its angles are 60°. An isosceles triangle with a 60° angle is equilateral.<\/div><p>Harder DSAT questions often join an equilateral triangle to an isosceles one, or extend a side. Work one triangle at a time and write down every angle you can, using 60°, equal base angles, linear pairs (180°) and the angle sum.<\/p><p>When tick marks show that two sides given as expressions are equal, set the expressions equal, solve, and substitute to get the length.<\/p><div class=\"eqs\">3<i>x<\/i> − 4 = <i>x<\/i> + 10<br><i>x<\/i> = 7, so each marked side is 17<\/div><div class=\"tip\">DSAT tip: mark equal sides and equal angles on your scratch paper as soon as you find them. The next step is often an isosceles triangle you did not notice at first.<\/div>"}, {"lo": "LO4", "h": "The triangle inequality", "html": "<p>Three lengths form a triangle only if each one is less than the sum of the other two. In practice you check only the longest length: the two shorter sides must add up to <b>more<\/b> than it. If the sum is exactly equal, the three points lie on one line and there is no triangle.<\/p><div class=\"rule\">If two sides have lengths <i>a<\/i> and <i>b<\/i> with <i>a<\/i> ≥ <i>b<\/i>, the third side <i>c<\/i> satisfies <i>a<\/i> − <i>b<\/i> &lt; <i>c<\/i> &lt; <i>a<\/i> + <i>b<\/i>.<\/div><p>For example, if two sides are 5 and 9, the third side is between 9 − 5 = 4 and 9 + 5 = 14, but cannot equal 4 or 14.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Lengths<\/th><th>Test<\/th><th>Triangle?<\/th><\/tr><tr><td>4, 6, 9<\/td><td>4 + 6 = 10 &gt; 9<\/td><td>Yes<\/td><\/tr><tr><td>3, 5, 8<\/td><td>3 + 5 = 8, not greater<\/td><td>No<\/td><\/tr><tr><td>2, 4, 7<\/td><td>2 + 4 = 6 &lt; 7<\/td><td>No<\/td><\/tr><\/table><\/div><p>To count the possible whole-number lengths, list the integers strictly between the two bounds.<\/p>"}, {"lo": "LO4", "h": "Largest side, largest angle", "html": "<p>The sides and the angles of a triangle come in the same order of size. The longest side is opposite the largest angle, and the shortest side is opposite the smallest angle. The side opposite an angle is the one that does not touch its vertex: in triangle <i>A<\/i><i>B<\/i><i>C<\/i>, side <i>B<\/i><i>C<\/i> is opposite angle <i>A<\/i>.<\/p><div class=\"rule\">A larger angle is always opposite a longer side, and equal angles are opposite equal sides.<\/div><p>To order the sides, find all three angles first with the 180° sum, then name the side opposite each one. If ∠<i>A<\/i> = 50°, ∠<i>B<\/i> = 85° and ∠<i>C<\/i> = 45°, the sides from shortest to longest are <i>A<\/i><i>B<\/i> (opposite <i>C<\/i>), <i>B<\/i><i>C<\/i> (opposite <i>A<\/i>) and <i>A<\/i><i>C<\/i> (opposite <i>B<\/i>).<\/p><div class=\"tip\">DSAT tip: in a right triangle the hypotenuse is always the longest side, because it is opposite the 90° angle, the largest angle of the triangle.<\/div><p>Base your answer on the numbers, not on how the figure looks, especially when a figure is marked as not drawn to scale.<\/p>"}, {"lo": "LO5", "h": "Congruent triangles", "html": "<p>Two triangles are <b>congruent<\/b> when they have exactly the same size and shape: all three pairs of corresponding sides and all three pairs of corresponding angles are equal. You do not need all six facts to prove it. Any one of these four sets is enough.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Criterion<\/th><th>What matches<\/th><\/tr><tr><td>SSS<\/td><td>three pairs of sides<\/td><\/tr><tr><td>SAS<\/td><td>two pairs of sides and the angle between them<\/td><\/tr><tr><td>ASA<\/td><td>two pairs of angles and the side between them<\/td><\/tr><tr><td>AAS<\/td><td>two pairs of angles and a side that is not between them<\/td><\/tr><\/table><\/div><div class=\"rule\">SSA and AAA do not prove congruence. AAA gives the same shape but possibly a different size, and SSA can fit two different triangles.<\/div><p>Check the position of the parts. In SAS the angle must be formed by the two given sides, and in ASA the side must join the two given angles. If the side is elsewhere, the criterion is AAS.<\/p>"}, {"lo": "LO5", "h": "Using corresponding parts", "html": "<p>A congruence statement lists the vertices in matching order. If triangle <i>A<\/i><i>B<\/i><i>C<\/i> is congruent to triangle <i>D<\/i><i>E<\/i><i>F<\/i>, then <i>A<\/i> matches <i>D<\/i>, <i>B<\/i> matches <i>E<\/i> and <i>C<\/i> matches <i>F<\/i>, so <i>A<\/i><i>B<\/i> = <i>D<\/i><i>E<\/i>, <i>B<\/i><i>C<\/i> = <i>E<\/i><i>F<\/i>, <i>A<\/i><i>C<\/i> = <i>D<\/i><i>F<\/i>, ∠<i>A<\/i> = ∠<i>D<\/i>, ∠<i>B<\/i> = ∠<i>E<\/i> and ∠<i>C<\/i> = ∠<i>F<\/i>.<\/p><div class=\"rule\">Corresponding parts of congruent triangles are equal. Read the correspondence from the letter order, not from how the figure looks.<\/div><p>Figures often hide the facts you need:<\/p><ul><li>a side shared by both triangles is equal to itself;<\/li><li>vertical angles at a crossing point are equal;<\/li><li>a midpoint splits a segment into two equal parts;<\/li><li>parallel lines give equal alternate interior angles.<\/li><\/ul><p>Once the triangles are congruent, set corresponding parts equal. If <i>P<\/i><i>Q<\/i> = 2<i>x<\/i> + 3 corresponds to <i>S<\/i><i>T<\/i> = 15, then 2<i>x<\/i> + 3 = 15 and <i>x<\/i> = 6.<\/p>"}], "examples": [{"lo": "LO1", "q": "The angles of the triangle shown measure (<i>x<\/i> + 21)°, (2<i>x<\/i> + 15)° and (3<i>x<\/i>)°. Find the value of <i>x<\/i> and the measure of the largest angle.<svg class=\"fig\" viewBox=\"0 0 300 210\" role=\"img\" aria-label=\"Triangle ABC. The angle at A is labeled (x + 21) degrees, the angle at B is labeled (2x + 15) degrees and the angle at C is labeled (3x) degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"30,183.5 270,183.5 188.99,24.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"17.92\" y=\"192.81\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"281.65\" y=\"193.76\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"192.09\" y=\"16.38\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"83.59\" y=\"165.8\" text-anchor=\"middle\">(<tspan font-style=\"italic\">x<\/tspan> + 21)°<\/text><text x=\"227.37\" y=\"161.87\" text-anchor=\"middle\">(2<tspan font-style=\"italic\">x<\/tspan> + 15)°<\/text><text x=\"183.36\" y=\"64.56\" text-anchor=\"middle\">(3<tspan font-style=\"italic\">x<\/tspan>)°<\/text><\/g><\/svg>", "steps": ["The three angles add up to 180°: (<i>x<\/i> + 21) + (2<i>x<\/i> + 15) + 3<i>x<\/i> = 180.", "Combine like terms: 6<i>x<\/i> + 36 = 180, so 6<i>x<\/i> = 144 and <i>x<\/i> = 24.", "Substitute: ∠<i>A<\/i> = 45°, ∠<i>B<\/i> = 63° and ∠<i>C<\/i> = 72°. Check: 45 + 63 + 72 = 180 ✓."], "ans": "<i>x<\/i> = 24; the largest angle is ∠<i>C<\/i> = 72°"}, {"lo": "LO2", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, side <i>B<\/i><i>C<\/i> is extended past <i>C<\/i> to point <i>D<\/i>. Angle <i>A<\/i><i>C<\/i><i>D<\/i> measures (5<i>x<\/i> − 8)°, angle <i>A<\/i> measures (2<i>x<\/i> + 10)° and angle <i>B<\/i> measures (<i>x<\/i> + 22)°. What is the value of <i>x<\/i>?", "steps": ["Angle <i>A<\/i><i>C<\/i><i>D<\/i> is an exterior angle, and angles <i>A<\/i> and <i>B<\/i> are its remote interior angles.", "So 5<i>x<\/i> − 8 = (2<i>x<\/i> + 10) + (<i>x<\/i> + 22) = 3<i>x<\/i> + 32.", "Then 2<i>x<\/i> = 40 and <i>x<\/i> = 20. Check: ∠<i>A<\/i><i>C<\/i><i>D<\/i> = 92° and ∠<i>A<\/i> + ∠<i>B<\/i> = 50° + 42° = 92° ✓."], "ans": "<i>x<\/i> = 20"}, {"lo": "LO3", "q": "In triangle <i>P<\/i><i>Q<\/i><i>R<\/i>, <i>P<\/i><i>Q<\/i> = <i>P<\/i><i>R<\/i>. Angle <i>Q<\/i> measures (3<i>x<\/i> + 10)° and angle <i>R<\/i> measures (5<i>x<\/i> − 14)°. What is the measure of angle <i>P<\/i>?", "steps": ["<i>P<\/i><i>Q<\/i> and <i>P<\/i><i>R<\/i> are the equal sides, so the angles opposite them, ∠<i>R<\/i> and ∠<i>Q<\/i>, are equal.", "3<i>x<\/i> + 10 = 5<i>x<\/i> − 14, so 24 = 2<i>x<\/i> and <i>x<\/i> = 12. Each base angle is 3(12) + 10 = 46°.", "∠<i>P<\/i> = 180° − 46° − 46° = 88°."], "ans": "88°"}, {"lo": "LO4", "q": "Two sides of a triangle have lengths 7 and 12. If the length of the third side is an integer, how many different lengths are possible for the third side?", "steps": ["The third side <i>c<\/i> must satisfy 12 − 7 &lt; <i>c<\/i> &lt; 12 + 7, so 5 &lt; <i>c<\/i> &lt; 19.", "The integers strictly between 5 and 19 are 6, 7, 8, …, 18.", "Count them: 18 − 6 + 1 = 13."], "ans": "13"}, {"lo": "LO4", "q": "In triangle <i>X<\/i><i>Y<\/i><i>Z<\/i>, angle <i>X<\/i> measures 48° and angle <i>Y<\/i> measures 70°. List the sides of the triangle from shortest to longest.", "steps": ["Find the third angle: ∠<i>Z<\/i> = 180° − 48° − 70° = 62°.", "Order the angles: ∠<i>X<\/i> (48°) &lt; ∠<i>Z<\/i> (62°) &lt; ∠<i>Y<\/i> (70°).", "Name the opposite sides in the same order: <i>Y<\/i><i>Z<\/i> is opposite <i>X<\/i>, <i>X<\/i><i>Y<\/i> is opposite <i>Z<\/i>, and <i>X<\/i><i>Z<\/i> is opposite <i>Y<\/i>."], "ans": "<i>Y<\/i><i>Z<\/i>, <i>X<\/i><i>Y<\/i>, <i>X<\/i><i>Z<\/i>"}, {"lo": "LO5", "q": "In the figure, segments <i>A<\/i><i>D<\/i> and <i>B<\/i><i>C<\/i> intersect at <i>M<\/i>, with <i>A<\/i><i>M<\/i> = <i>M<\/i><i>D<\/i> and <i>B<\/i><i>M<\/i> = <i>M<\/i><i>C<\/i>. Which congruence criterion proves that triangle <i>A<\/i><i>M<\/i><i>B<\/i> is congruent to triangle <i>D<\/i><i>M<\/i><i>C<\/i>? Use it to find <i>D<\/i><i>C<\/i> and the measure of angle <i>C<\/i><i>D<\/i><i>M<\/i>.<br>A) SSS &nbsp; B) SAS &nbsp; C) ASA &nbsp; D) AAS<svg class=\"fig\" viewBox=\"0 0 280 200\" role=\"img\" aria-label=\"Segments AD and BC cross at point M, forming triangles AMB and DMC. Tick marks show AM = MD and BM = MC. Side AB is labeled 9 and angle BAM is labeled 40 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"44.56,131.01 140,100 146.02,172\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"235.44,68.99 140,100 133.98,28\"/><line class=\"fg-edge\" x1=\"93.83\" y1=\"120.26\" x2=\"90.74\" y2=\"110.75\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"189.26\" y1=\"89.25\" x2=\"186.17\" y2=\"79.74\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"148.16\" y1=\"137.58\" x2=\"138.19\" y2=\"138.41\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"147.82\" y1=\"133.59\" x2=\"137.86\" y2=\"134.42\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"142.14\" y1=\"65.58\" x2=\"132.18\" y2=\"66.41\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"141.81\" y1=\"61.59\" x2=\"131.84\" y2=\"62.42\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"31.58\" y=\"134.85\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"154.98\" y=\"185.92\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"125.02\" y=\"23.08\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"248.42\" y=\"74.15\" text-anchor=\"middle\" font-style=\"italic\">D<\/text><text x=\"127.51\" y=\"96.2\" text-anchor=\"middle\" font-style=\"italic\">M<\/text><text x=\"90.8\" y=\"167.13\" text-anchor=\"middle\">9<\/text><text x=\"78.54\" y=\"136.7\" text-anchor=\"middle\">40°<\/text><\/g><\/svg>", "steps": ["The tick marks give two pairs of sides: <i>A<\/i><i>M<\/i> = <i>D<\/i><i>M<\/i> and <i>B<\/i><i>M<\/i> = <i>C<\/i><i>M<\/i>.", "Angles <i>A<\/i><i>M<\/i><i>B<\/i> and <i>D<\/i><i>M<\/i><i>C<\/i> are vertical angles, so they are equal. This angle lies between the two pairs of sides, so the triangles are congruent by SAS.", "The correspondence is <i>A<\/i> ↔ <i>D<\/i>, <i>M<\/i> ↔ <i>M<\/i>, <i>B<\/i> ↔ <i>C<\/i>. So <i>D<\/i><i>C<\/i> = <i>A<\/i><i>B<\/i> = 9, and ∠<i>C<\/i><i>D<\/i><i>M<\/i> = ∠<i>B<\/i><i>A<\/i><i>M<\/i> = 40°."], "ans": "B) SAS; <i>D<\/i><i>C<\/i> = 9 and angle <i>C<\/i><i>D<\/i><i>M<\/i> = 40°"}], "traps": ["Treating an exterior angle as 180° minus a remote interior angle. The exterior angle equals the sum of the two remote interior angles, and only the adjacent interior angle is its supplement.", "Assuming which angle of an isosceles triangle is the vertex angle. If the question does not say, test the given angle both as the vertex angle and as a base angle.", "Using ≤ instead of &lt; in the triangle inequality. Lengths 3, 5 and 8 do not form a triangle, because 3 + 5 is not greater than 8.", "Naming the wrong side as opposite an angle. The side opposite angle <i>A<\/i> is <i>B<\/i><i>C<\/i>, the side that does not touch vertex <i>A<\/i>.", "Matching congruent parts by how the figure looks rather than by the letter order. If triangle <i>P<\/i><i>Q<\/i><i>R<\/i> is congruent to triangle <i>S<\/i><i>T<\/i><i>U<\/i>, side <i>Q<\/i><i>R<\/i> matches <i>T<\/i><i>U<\/i> even when the second triangle is turned or flipped.", "Using SSA or AAA as if they proved congruence, or calling a pair ASA when the given side is not between the two given angles (that case is AAS)."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Two angles of a triangle measure 47° and 68°. What is the measure of the third angle?", "opts": ["65°", "75°", "115°", "245°"], "ans": 0, "sol": "The three angles of a triangle add up to 180°.<br>180° − 47° − 68° = 65°.<br>Answer: <b>65°<\/b>", "hint": "The three angles of every triangle add up to the same total."}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "In right triangle <i>A<\/i><i>B<\/i><i>C<\/i>, angle <i>C<\/i> is the right angle and angle <i>A<\/i> measures 34°. What is the measure, in degrees, of angle <i>B<\/i>?", "ans": ["56"], "sol": "Angle <i>C<\/i> uses 90°, so ∠<i>A<\/i> + ∠<i>B<\/i> = 90°.<br>∠<i>B<\/i> = 90° − 34° = 56°.<br>Answer: <b>56<\/b>", "hint": "The right angle uses 90° of the 180°. The two acute angles share the rest."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "In the triangle shown, what is the value of <i>x<\/i>?<svg class=\"fig\" viewBox=\"0 0 260 200\" role=\"img\" aria-label=\"Triangle ABC. The angle at A is labeled (2x) degrees, the angle at B is labeled (3x) degrees and the angle at C is labeled 55 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"46.97,174 213.03,174 172.84,24\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"35.41\" y=\"184.44\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"223.54\" y=\"186.15\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"176.41\" y=\"16\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"81.41\" y=\"162.44\" text-anchor=\"middle\">(2<tspan font-style=\"italic\">x<\/tspan>)°<\/text><text x=\"187.64\" y=\"159.02\" text-anchor=\"middle\">(3<tspan font-style=\"italic\">x<\/tspan>)°<\/text><text x=\"165.48\" y=\"61.69\" text-anchor=\"middle\">55°<\/text><\/g><\/svg>", "opts": ["11", "25", "36", "61"], "ans": 1, "sol": "The three angles add up to 180°: 2<i>x<\/i> + 3<i>x<\/i> + 55 = 180.<br>5<i>x<\/i> = 125, so <i>x<\/i> = 25.<br>Check: 50° + 75° + 55° = 180° ✓.<br>Answer: <b>25<\/b>", "hint": "Write one equation that uses all three angle measures."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "In the figure, side <i>A<\/i><i>C<\/i> of triangle <i>A<\/i><i>B<\/i><i>C<\/i> is extended past <i>C<\/i> to point <i>D<\/i>. What is the value of <i>x<\/i>?<svg class=\"fig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"Triangle ABC with side AC extended past C to point D. The angle at A is labeled 58 degrees, the angle at B is labeled 72 degrees, and exterior angle BCD is labeled x degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26,144.91 90.88,41.09 178,144.91\"/><line class=\"fg-edge\" x1=\"178\" y1=\"144.91\" x2=\"254\" y2=\"144.91\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"14.27\" y=\"155.03\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"89.49\" y=\"32.66\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"189.92\" y=\"154.59\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"254\" y=\"164.41\" text-anchor=\"middle\" font-style=\"italic\">D<\/text><text x=\"53.99\" y=\"133.9\" text-anchor=\"middle\">58°<\/text><text x=\"92.97\" y=\"75.51\" text-anchor=\"middle\">72°<\/text><text x=\"188.99\" y=\"125.85\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan>°<\/text><\/g><\/svg>", "opts": ["50", "108", "122", "130"], "ans": 3, "sol": "Angle <i>B<\/i><i>C<\/i><i>D<\/i> is an exterior angle, and its remote interior angles are ∠<i>A<\/i> and ∠<i>B<\/i>.<br><i>x<\/i> = 58 + 72 = 130.<br>Answer: <b>130<\/b>", "hint": "Which two angles of the triangle are not next to the angle marked <i>x<\/i>°?"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, the exterior angle at vertex <i>C<\/i> is three times as large as angle <i>A<\/i>, and angle <i>B<\/i> measures 64°. What is the measure, in degrees, of angle <i>A<\/i>?", "ans": ["32"], "sol": "The exterior angle at <i>C<\/i> equals ∠<i>A<\/i> + ∠<i>B<\/i>, so 3∠<i>A<\/i> = ∠<i>A<\/i> + 64.<br>2∠<i>A<\/i> = 64, so ∠<i>A<\/i> = 32°.<br>Check: the exterior angle is 96° = 32° + 64° ✓.<br>Answer: <b>32<\/b>", "hint": "Write the exterior angle at <i>C<\/i> in two ways: once using angle <i>A<\/i> alone, and once as a sum of two interior angles."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "The vertex angle of an isosceles triangle measures 40°. What is the measure of each base angle?", "opts": ["50°", "70°", "110°", "140°"], "ans": 1, "sol": "The two base angles are equal, and together they measure 180° − 40° = 140°.<br>Each base angle is 140° ÷ 2 = 70°.<br>Answer: <b>70°<\/b>", "hint": "The two base angles are equal and share what is left after the vertex angle."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i> shown, <i>A<\/i><i>B<\/i> = <i>A<\/i><i>C<\/i>. What is the perimeter of the triangle?<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"Isosceles triangle ABC with tick marks showing AB = AC. Side AB is labeled 2x + 3, side AC is labeled 5x − 9 and base BC is labeled 8.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"130,28 58.95,210 201.05,210\"/><line class=\"fg-edge\" x1=\"89.82\" y1=\"117.18\" x2=\"99.13\" y2=\"120.82\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"160.87\" y1=\"120.82\" x2=\"170.18\" y2=\"117.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"130\" y=\"19.5\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"49.07\" y=\"222.94\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"210.93\" y=\"222.94\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"66.53\" y=\"112.59\" text-anchor=\"middle\">2<tspan font-style=\"italic\">x<\/tspan> + 3<\/text><text x=\"193.47\" y=\"112.59\" text-anchor=\"middle\">5<tspan font-style=\"italic\">x<\/tspan> − 9<\/text><text x=\"130\" y=\"227.5\" text-anchor=\"middle\">8<\/text><\/g><\/svg>", "opts": ["19", "22", "30", "33"], "ans": 2, "sol": "Since <i>A<\/i><i>B<\/i> = <i>A<\/i><i>C<\/i>, 2<i>x<\/i> + 3 = 5<i>x<\/i> − 9, so 12 = 3<i>x<\/i> and <i>x<\/i> = 4.<br><i>A<\/i><i>B<\/i> = <i>A<\/i><i>C<\/i> = 2(4) + 3 = 11.<br>Perimeter = 11 + 11 + 8 = 30.<br>Answer: <b>30<\/b>", "hint": "The tick marks show which two sides are equal. Set their expressions equal first."}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Triangle <i>A<\/i><i>B<\/i><i>C<\/i> is equilateral. Point <i>D<\/i> lies on the extension of side <i>B<\/i><i>C<\/i> past <i>C<\/i> so that <i>C<\/i><i>D<\/i> = <i>C<\/i><i>A<\/i>. What is the measure of angle <i>B<\/i><i>A<\/i><i>D<\/i>?", "opts": ["60°", "90°", "120°", "150°"], "ans": 1, "sol": "Each angle of an equilateral triangle is 60°, so ∠<i>A<\/i><i>C<\/i><i>D<\/i> = 180° − 60° = 120°.<br>Triangle <i>A<\/i><i>C<\/i><i>D<\/i> is isosceles with <i>C<\/i><i>A<\/i> = <i>C<\/i><i>D<\/i>, so ∠<i>C<\/i><i>A<\/i><i>D<\/i> = ∠<i>C<\/i><i>D<\/i><i>A<\/i> = (180° − 120°) ÷ 2 = 30°.<br>∠<i>B<\/i><i>A<\/i><i>D<\/i> = ∠<i>B<\/i><i>A<\/i><i>C<\/i> + ∠<i>C<\/i><i>A<\/i><i>D<\/i> = 60° + 30° = 90°.<br>Answer: <b>90°<\/b>", "hint": "Find angle <i>A<\/i><i>C<\/i><i>D<\/i> first, then use the two equal sides of triangle <i>A<\/i><i>C<\/i><i>D<\/i>."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Which of the following could be the side lengths of a triangle?", "opts": ["2, 9, 12", "3, 4, 8", "5, 5, 10", "6, 7, 12"], "ans": 3, "sol": "The two shorter sides must add up to more than the longest side.<br>2 + 9 = 11 &lt; 12, 3 + 4 = 7 &lt; 8 and 5 + 5 = 10 is not greater than 10, but 6 + 7 = 13 &gt; 12.<br>Answer: <b>6, 7, 12<\/b>", "hint": "For each choice, compare the sum of the two shorter lengths with the longest length."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "In triangle <i>J<\/i><i>K<\/i><i>L<\/i>, <i>J<\/i><i>K<\/i> = 9, <i>K<\/i><i>L<\/i> = 14 and <i>J<\/i><i>L<\/i> = 11. Which angle of the triangle has the smallest measure?", "opts": ["Angle <i>J<\/i>", "Angle <i>K<\/i>", "Angle <i>L<\/i>", "The three angles are equal."], "ans": 2, "sol": "The smallest angle is opposite the shortest side.<br>The shortest side is <i>J<\/i><i>K<\/i> = 9, and the angle opposite <i>J<\/i><i>K<\/i> is angle <i>L<\/i>.<br>Answer: <b>Angle <i>L<\/i><\/b>", "hint": "Each angle is opposite the side that does not touch its vertex."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Using only the parts marked in the figure, which congruence criterion shows that triangle <i>A<\/i><i>B<\/i><i>C<\/i> is congruent to triangle <i>D<\/i><i>E<\/i><i>F<\/i>?<svg class=\"fig\" viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Two triangles. In triangle ABC, side AB is labeled 8, angle A is labeled 40 degrees and angle B is labeled 65 degrees. In triangle DEF, side DE is labeled 8, angle D is labeled 40 degrees and angle E is labeled 65 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"22,118.58 146.63,118.58 111.58,43.42\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"318,118.58 193.37,118.58 228.42,43.42\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"9.73\" y=\"127.39\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"158.39\" y=\"128.62\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"116.01\" y=\"35.7\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"330.27\" y=\"127.39\" text-anchor=\"middle\" font-style=\"italic\">D<\/text><text x=\"181.61\" y=\"128.62\" text-anchor=\"middle\" font-style=\"italic\">E<\/text><text x=\"223.99\" y=\"35.7\" text-anchor=\"middle\" font-style=\"italic\">F<\/text><text x=\"84.32\" y=\"136.08\" text-anchor=\"middle\">8<\/text><text x=\"255.68\" y=\"136.08\" text-anchor=\"middle\">8<\/text><text x=\"55.83\" y=\"110.77\" text-anchor=\"middle\">40°<\/text><text x=\"123.02\" y=\"108.04\" text-anchor=\"middle\">65°<\/text><text x=\"284.17\" y=\"110.77\" text-anchor=\"middle\">40°<\/text><text x=\"216.98\" y=\"108.04\" text-anchor=\"middle\">65°<\/text><\/g><\/svg>", "opts": ["SSS", "SAS", "ASA", "AAS"], "ans": 2, "sol": "In each triangle the figure gives two angles and the side joining them: ∠<i>A<\/i>, <i>A<\/i><i>B<\/i>, ∠<i>B<\/i> and ∠<i>D<\/i>, <i>D<\/i><i>E<\/i>, ∠<i>E<\/i>.<br>Two angles and the included side match, so the criterion is ASA.<br>Answer: <b>ASA<\/b>", "hint": "Is the marked side between the two marked angles, or not?"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "Triangle <i>P<\/i><i>Q<\/i><i>R<\/i> is congruent to triangle <i>S<\/i><i>T<\/i><i>U<\/i>, with <i>P<\/i>, <i>Q<\/i> and <i>R<\/i> corresponding to <i>S<\/i>, <i>T<\/i> and <i>U<\/i>, respectively. <i>P<\/i><i>Q<\/i> = 2<i>x<\/i> + 1, <i>S<\/i><i>T<\/i> = 19 − <i>x<\/i> and <i>Q<\/i><i>R<\/i> = 4<i>x<\/i> − 5. What is the length of <i>T<\/i><i>U<\/i>?", "ans": ["19"], "sol": "<i>P<\/i><i>Q<\/i> corresponds to <i>S<\/i><i>T<\/i>, so 2<i>x<\/i> + 1 = 19 − <i>x<\/i>, which gives 3<i>x<\/i> = 18 and <i>x<\/i> = 6.<br><i>Q<\/i><i>R<\/i> corresponds to <i>T<\/i><i>U<\/i>, so <i>T<\/i><i>U<\/i> = <i>Q<\/i><i>R<\/i> = 4(6) − 5 = 19.<br>Answer: <b>19<\/b>", "hint": "Match the sides by letter order: <i>P<\/i><i>Q<\/i> goes with <i>S<\/i><i>T<\/i>, and <i>Q<\/i><i>R<\/i> goes with <i>T<\/i><i>U<\/i>."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, angle <i>A<\/i> measures 38°, and angle <i>B<\/i> is three times as large as angle <i>A<\/i>. What is the measure of angle <i>C<\/i>?", "opts": ["28°", "38°", "66°", "114°"], "ans": 0, "sol": "∠<i>B<\/i> = 3(38°) = 114°.<br>∠<i>C<\/i> = 180° − 38° − 114° = 28°.<br>Answer: <b>28°<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A road sign has the shape of an equilateral triangle with a perimeter of 39 inches. What is the length, in inches, of each side of the sign?", "opts": ["9.75", "13", "19.5", "117"], "ans": 1, "sol": "An equilateral triangle has three equal sides.<br>39 ÷ 3 = 13.<br>Answer: <b>13<\/b>"}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "In the figure, side <i>Q<\/i><i>P<\/i> of triangle <i>P<\/i><i>Q<\/i><i>R<\/i> is extended past <i>P<\/i> to point <i>S<\/i>. What is the value of <i>x<\/i>?<svg class=\"fig\" viewBox=\"0 0 270 220\" role=\"img\" aria-label=\"Triangle PQR with side QP extended past P to point S. The angle at Q is labeled 48 degrees, the angle at R is labeled x degrees, and exterior angle SPR is labeled 115 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"162.69,75.64 57.92,192 212.08,192\"/><line class=\"fg-edge\" x1=\"162.69\" y1=\"75.64\" x2=\"207.39\" y2=\"26\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"46.06\" y=\"201.83\" text-anchor=\"middle\" font-style=\"italic\">Q<\/text><text x=\"223.37\" y=\"202.95\" text-anchor=\"middle\" font-style=\"italic\">R<\/text><text x=\"165.93\" y=\"66.52\" text-anchor=\"middle\" font-style=\"italic\">P<\/text><text x=\"196.39\" y=\"28.5\" text-anchor=\"middle\" font-style=\"italic\">S<\/text><text x=\"87.15\" y=\"183.48\" text-anchor=\"middle\">48°<\/text><text x=\"190.4\" y=\"182.15\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan>°<\/text><text x=\"188.33\" y=\"84.43\" text-anchor=\"middle\">115°<\/text><\/g><\/svg>", "ans": ["67"], "sol": "Angle <i>S<\/i><i>P<\/i><i>R<\/i> is an exterior angle, so it equals the sum of the remote interior angles ∠<i>Q<\/i> and ∠<i>R<\/i>.<br>115 = 48 + <i>x<\/i>, so <i>x<\/i> = 67.<br>Answer: <b>67<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Two sides of a triangle have lengths 4 and 9. Which of the following could be the length of the third side?", "opts": ["3", "4", "5", "11"], "ans": 3, "sol": "The third side must be between 9 − 4 = 5 and 9 + 4 = 13, not including 5 or 13.<br>Only 11 is in that range.<br>Answer: <b>11<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "Triangle <i>A<\/i><i>B<\/i><i>C<\/i> is congruent to triangle <i>X<\/i><i>Y<\/i><i>Z<\/i>, with <i>A<\/i>, <i>B<\/i> and <i>C<\/i> corresponding to <i>X<\/i>, <i>Y<\/i> and <i>Z<\/i>, respectively. Which side must have the same length as side <i>B<\/i><i>C<\/i>?", "opts": ["<i>X<\/i><i>Y<\/i>", "<i>X<\/i><i>Z<\/i>", "<i>Y<\/i><i>Z<\/i>", "<i>A<\/i><i>C<\/i>"], "ans": 2, "sol": "<i>B<\/i> corresponds to <i>Y<\/i> and <i>C<\/i> corresponds to <i>Z<\/i>.<br>So side <i>B<\/i><i>C<\/i> corresponds to side <i>Y<\/i><i>Z<\/i>.<br>Answer: <b><i>Y<\/i><i>Z<\/i><\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "In triangle <i>D<\/i><i>E<\/i><i>F<\/i>, angle <i>D<\/i> is 30° larger than angle <i>E<\/i>, and angle <i>F<\/i> measures 80°. What is the measure, in degrees, of angle <i>E<\/i>?", "ans": ["35"], "sol": "Let ∠<i>E<\/i> = <i>e<\/i>°. Then ∠<i>D<\/i> = (<i>e<\/i> + 30)°.<br><i>e<\/i> + (<i>e<\/i> + 30) + 80 = 180, so 2<i>e<\/i> = 70 and <i>e<\/i> = 35.<br>Answer: <b>35<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i> shown, <i>A<\/i><i>B<\/i> = <i>A<\/i><i>C<\/i>. What is the value of <i>x<\/i>?<svg class=\"fig\" viewBox=\"0 0 240 220\" role=\"img\" aria-label=\"Isosceles triangle ABC with tick marks showing AB = AC. The angle at B is labeled 64 degrees and the angle at A is labeled x degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"120,28 40.01,192 199.99,192\"/><line class=\"fg-edge\" x1=\"75.51\" y1=\"107.81\" x2=\"84.5\" y2=\"112.19\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"155.5\" y1=\"112.19\" x2=\"164.49\" y2=\"107.81\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"120\" y=\"19.5\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"29.28\" y=\"203.84\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"210.72\" y=\"203.84\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"63.76\" y=\"181.66\" text-anchor=\"middle\">64°<\/text><text x=\"120\" y=\"66.5\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan>°<\/text><\/g><\/svg>", "opts": ["26", "52", "58", "64"], "ans": 1, "sol": "Since <i>A<\/i><i>B<\/i> = <i>A<\/i><i>C<\/i>, the base angles ∠<i>B<\/i> and ∠<i>C<\/i> are equal, so ∠<i>C<\/i> = 64°.<br><i>x<\/i> = 180 − 64 − 64 = 52.<br>Answer: <b>52<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, the exterior angle at vertex <i>A<\/i> measures 125°, and the exterior angle at vertex <i>B<\/i> measures 140°. What is the measure of interior angle <i>C<\/i>?", "opts": ["15°", "55°", "85°", "95°"], "ans": 2, "sol": "Each exterior angle is supplementary to the interior angle next to it: ∠<i>A<\/i> = 180° − 125° = 55° and ∠<i>B<\/i> = 180° − 140° = 40°.<br>∠<i>C<\/i> = 180° − 55° − 40° = 85°.<br>Answer: <b>85°<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Three towns, <i>A<\/i>, <i>B<\/i> and <i>C<\/i>, do not lie on one straight line. The straight-line distance from <i>A<\/i> to <i>B<\/i> is 18 kilometers, and the straight-line distance from <i>B<\/i> to <i>C<\/i> is 11 kilometers. Which of the following could be the straight-line distance, in kilometers, from <i>A<\/i> to <i>C<\/i>?", "opts": ["5", "7", "24", "29"], "ans": 2, "sol": "The three towns form a triangle, so 18 − 11 &lt; <i>A<\/i><i>C<\/i> &lt; 18 + 11.<br>7 &lt; <i>A<\/i><i>C<\/i> &lt; 29, and only 24 is in that range.<br>Answer: <b>24<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "In quadrilateral <i>A<\/i><i>B<\/i><i>C<\/i><i>D<\/i>, <i>A<\/i><i>B<\/i> = <i>C<\/i><i>D<\/i> and <i>B<\/i><i>C<\/i> = <i>D<\/i><i>A<\/i>. Diagonal <i>A<\/i><i>C<\/i> divides the quadrilateral into triangles <i>A<\/i><i>B<\/i><i>C<\/i> and <i>C<\/i><i>D<\/i><i>A<\/i>. If angle <i>B<\/i><i>A<\/i><i>C<\/i> measures 35°, what is the measure of angle <i>D<\/i><i>C<\/i><i>A<\/i>?", "opts": ["35°", "55°", "70°", "145°"], "ans": 0, "sol": "<i>A<\/i><i>B<\/i> = <i>C<\/i><i>D<\/i>, <i>B<\/i><i>C<\/i> = <i>D<\/i><i>A<\/i>, and <i>A<\/i><i>C<\/i> is shared, so triangle <i>A<\/i><i>B<\/i><i>C<\/i> is congruent to triangle <i>C<\/i><i>D<\/i><i>A<\/i> by SSS.<br>The correspondence is <i>A<\/i> ↔ <i>C<\/i>, <i>B<\/i> ↔ <i>D<\/i>, <i>C<\/i> ↔ <i>A<\/i>, so ∠<i>B<\/i><i>A<\/i><i>C<\/i> corresponds to ∠<i>D<\/i><i>C<\/i><i>A<\/i>.<br>∠<i>D<\/i><i>C<\/i><i>A<\/i> = 35°.<br>Answer: <b>35°<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Three straight fences form a triangular animal pen. Two of the corner angles are equal, and the third corner angle is 30° smaller than each of the other two. What is the measure of the third corner angle?", "opts": ["40°", "50°", "60°", "70°"], "ans": 0, "sol": "Let each equal angle be <i>a<\/i>°. The third angle is (<i>a<\/i> − 30)°.<br><i>a<\/i> + <i>a<\/i> + (<i>a<\/i> − 30) = 180, so 3<i>a<\/i> = 210 and <i>a<\/i> = 70.<br>The third angle is 70° − 30° = 40°.<br>Answer: <b>40°<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A triangular pennant has the shape of an isosceles triangle. Its base is 14 centimeters long, its other two sides are equal in length, and its perimeter is 50 centimeters. What is the length, in centimeters, of each of the two equal sides?", "ans": ["18"], "sol": "The two equal sides together measure 50 − 14 = 36 centimeters.<br>Each one is 36 ÷ 2 = 18 centimeters.<br>Answer: <b>18<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, side <i>B<\/i><i>C<\/i> is extended past <i>C<\/i> to point <i>D<\/i>. Angle <i>A<\/i><i>C<\/i><i>D<\/i> measures (4<i>x<\/i>)°, angle <i>A<\/i><i>C<\/i><i>B<\/i> measures (<i>x<\/i> + 20)°, and angle <i>B<\/i><i>A<\/i><i>C<\/i> measures 50°. What is the measure of angle <i>A<\/i><i>B<\/i><i>C<\/i>?", "opts": ["32°", "52°", "78°", "128°"], "ans": 2, "sol": "Angles <i>A<\/i><i>C<\/i><i>D<\/i> and <i>A<\/i><i>C<\/i><i>B<\/i> form a linear pair: 4<i>x<\/i> + (<i>x<\/i> + 20) = 180, so <i>x<\/i> = 32 and ∠<i>A<\/i><i>C<\/i><i>D<\/i> = 128°.<br>By the exterior angle theorem, ∠<i>A<\/i><i>C<\/i><i>D<\/i> = ∠<i>B<\/i><i>A<\/i><i>C<\/i> + ∠<i>A<\/i><i>B<\/i><i>C<\/i>, so ∠<i>A<\/i><i>B<\/i><i>C<\/i> = 128° − 50° = 78°.<br>Answer: <b>78°<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A triangular flower bed has two sides of equal length. Two of its side lengths are 5 meters and 11 meters. What is the perimeter, in meters, of the flower bed?", "opts": ["16", "21", "22", "27"], "ans": 3, "sol": "The equal sides are either 5 and 5 or 11 and 11.<br>Lengths 5, 5, 11 fail the triangle inequality, because 5 + 5 = 10 &lt; 11.<br>So the sides are 5, 11 and 11, and the perimeter is 27.<br>Answer: <b>27<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "In triangles <i>A<\/i><i>B<\/i><i>C<\/i> and <i>D<\/i><i>E<\/i><i>F<\/i>, <i>A<\/i><i>B<\/i> = <i>D<\/i><i>E<\/i> and <i>B<\/i><i>C<\/i> = <i>E<\/i><i>F<\/i>. Which of the following additional facts would be enough to prove that triangle <i>A<\/i><i>B<\/i><i>C<\/i> is congruent to triangle <i>D<\/i><i>E<\/i><i>F<\/i> by SAS?", "opts": ["∠<i>A<\/i> = ∠<i>D<\/i>", "∠<i>B<\/i> = ∠<i>E<\/i>", "∠<i>C<\/i> = ∠<i>F<\/i>", "∠<i>A<\/i> = ∠<i>F<\/i>"], "ans": 1, "sol": "SAS needs the angle between the two given pairs of sides.<br>Sides <i>A<\/i><i>B<\/i> and <i>B<\/i><i>C<\/i> meet at <i>B<\/i>, and sides <i>D<\/i><i>E<\/i> and <i>E<\/i><i>F<\/i> meet at <i>E<\/i>, so the needed fact is ∠<i>B<\/i> = ∠<i>E<\/i>.<br>Answer: <b>∠<i>B<\/i> = ∠<i>E<\/i><\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "The measures of the angles of a triangle are in the ratio 2 : 3 : 7. How many degrees larger is the largest angle than the smallest angle?", "ans": ["75"], "sol": "Let the angles be 2<i>k<\/i>, 3<i>k<\/i> and 7<i>k<\/i>. Then 12<i>k<\/i> = 180, so <i>k<\/i> = 15.<br>The angles are 30°, 45° and 105°.<br>105 − 30 = 75.<br>Answer: <b>75<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i> shown, <i>A<\/i><i>B<\/i> = <i>A<\/i><i>C<\/i> and angle <i>A<\/i> measures 36°. Point <i>D<\/i> lies on side <i>A<\/i><i>C<\/i> so that <i>B<\/i><i>D<\/i> = <i>B<\/i><i>C<\/i>. What is the measure of angle <i>A<\/i><i>B<\/i><i>D<\/i>?<svg class=\"fig\" viewBox=\"0 0 230 260\" role=\"img\" aria-label=\"Triangle ABC with AB = AC shown by single tick marks. Point D is on side AC, and segment BD is drawn. Double tick marks show BD = BC. The angle at A is labeled 36 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"115,26 48.07,232 181.93,232\"/><line class=\"fg-edge\" x1=\"48.07\" y1=\"232\" x2=\"156.37\" y2=\"153.32\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"76.78\" y1=\"127.45\" x2=\"86.29\" y2=\"130.55\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"130.32\" y1=\"89.35\" x2=\"139.84\" y2=\"86.25\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"103.54\" y1=\"197.88\" x2=\"97.66\" y2=\"189.79\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"106.77\" y1=\"195.53\" x2=\"100.9\" y2=\"187.44\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"113\" y1=\"237\" x2=\"113\" y2=\"227\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"117\" y1=\"237\" x2=\"117\" y2=\"227\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"115\" y=\"17.5\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"38.99\" y=\"245.81\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"191.01\" y=\"245.81\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"168.37\" y=\"157.82\" text-anchor=\"middle\" font-style=\"italic\">D<\/text><text x=\"115\" y=\"70.5\" text-anchor=\"middle\">36°<\/text><\/g><\/svg>", "opts": ["18°", "36°", "54°", "72°"], "ans": 1, "sol": "The base angles of triangle <i>A<\/i><i>B<\/i><i>C<\/i> are equal: ∠<i>A<\/i><i>B<\/i><i>C<\/i> = ∠<i>C<\/i> = (180° − 36°) ÷ 2 = 72°.<br>In triangle <i>B<\/i><i>D<\/i><i>C<\/i>, <i>B<\/i><i>D<\/i> = <i>B<\/i><i>C<\/i>, so ∠<i>B<\/i><i>D<\/i><i>C<\/i> = ∠<i>C<\/i> = 72° and ∠<i>D<\/i><i>B<\/i><i>C<\/i> = 180° − 144° = 36°.<br>∠<i>A<\/i><i>B<\/i><i>D<\/i> = 72° − 36° = 36°.<br>Answer: <b>36°<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "Two sides of a triangle have lengths 6 and 15. The length of the third side is an integer. What is the greatest possible perimeter of the triangle?", "ans": ["41"], "sol": "The third side <i>c<\/i> satisfies 15 − 6 &lt; <i>c<\/i> &lt; 15 + 6, so 9 &lt; <i>c<\/i> &lt; 21.<br>The greatest integer value is <i>c<\/i> = 20.<br>The perimeter is 6 + 15 + 20 = 41.<br>Answer: <b>41<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The frame of a kite, <i>A<\/i><i>B<\/i><i>C<\/i><i>D<\/i>, is shown. In the frame, <i>A<\/i><i>B<\/i> = <i>A<\/i><i>D<\/i>, <i>C<\/i><i>B<\/i> = <i>C<\/i><i>D<\/i>, and a rod connects <i>A<\/i> and <i>C<\/i>. Angle <i>B<\/i><i>A<\/i><i>D<\/i> measures 80° and angle <i>B<\/i><i>C<\/i><i>D<\/i> measures 50°. What is the measure of angle <i>A<\/i><i>B<\/i><i>C<\/i>?<svg class=\"fig\" viewBox=\"0 0 230 280\" role=\"img\" aria-label=\"Kite ABCD with A at the top and C at the bottom. Single tick marks show AB = AD and double tick marks show CB = CD. Rod AC is drawn. Angle BAD is labeled 80 degrees and angle BCD is labeled 50 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"115,26 46.66,107.44 115,254 183.34,107.44\"/><line class=\"fg-edge\" x1=\"115\" y1=\"26\" x2=\"115\" y2=\"254\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"77\" y1=\"63.51\" x2=\"84.66\" y2=\"69.94\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"145.34\" y1=\"69.94\" x2=\"153\" y2=\"63.51\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"86.21\" y1=\"180.42\" x2=\"77.14\" y2=\"184.65\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"84.52\" y1=\"176.8\" x2=\"75.45\" y2=\"181.02\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"152.86\" y1=\"184.65\" x2=\"143.79\" y2=\"180.42\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"154.55\" y1=\"181.02\" x2=\"145.48\" y2=\"176.8\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"115\" y=\"17.5\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"115\" y=\"272.5\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"33.66\" y=\"111.94\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"196.34\" y=\"111.94\" text-anchor=\"middle\" font-style=\"italic\">D<\/text><text x=\"115\" y=\"76.5\" text-anchor=\"middle\">80°<\/text><text x=\"115\" y=\"200.5\" text-anchor=\"middle\">50°<\/text><\/g><\/svg>", "opts": ["40°", "50°", "65°", "115°"], "ans": 3, "sol": "Triangles <i>A<\/i><i>B<\/i><i>C<\/i> and <i>A<\/i><i>D<\/i><i>C<\/i> are congruent by SSS (<i>A<\/i><i>B<\/i> = <i>A<\/i><i>D<\/i>, <i>C<\/i><i>B<\/i> = <i>C<\/i><i>D<\/i>, <i>A<\/i><i>C<\/i> shared), so ∠<i>B<\/i><i>A<\/i><i>C<\/i> = ∠<i>D<\/i><i>A<\/i><i>C<\/i> and ∠<i>B<\/i><i>C<\/i><i>A<\/i> = ∠<i>D<\/i><i>C<\/i><i>A<\/i>.<br>∠<i>B<\/i><i>A<\/i><i>C<\/i> = 80° ÷ 2 = 40° and ∠<i>B<\/i><i>C<\/i><i>A<\/i> = 50° ÷ 2 = 25°.<br>∠<i>A<\/i><i>B<\/i><i>C<\/i> = 180° − 40° − 25° = 115°.<br>Answer: <b>115°<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, the exterior angle at vertex <i>C<\/i> measures (7<i>x<\/i>)°, and interior angle <i>C<\/i> measures (2<i>x<\/i>)°. Angle <i>A<\/i> is 1.5 times as large as angle <i>B<\/i>. What is the measure of angle <i>A<\/i>?", "opts": ["40°", "56°", "70°", "84°"], "ans": 3, "sol": "The exterior and interior angles at <i>C<\/i> form a linear pair: 7<i>x<\/i> + 2<i>x<\/i> = 180, so <i>x<\/i> = 20 and the exterior angle is 140°.<br>By the exterior angle theorem, ∠<i>A<\/i> + ∠<i>B<\/i> = 140°, so 1.5∠<i>B<\/i> + ∠<i>B<\/i> = 140° and ∠<i>B<\/i> = 56°.<br>∠<i>A<\/i> = 1.5(56°) = 84°.<br>Answer: <b>84°<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "In right triangle <i>P<\/i><i>Q<\/i><i>R<\/i>, angle <i>R<\/i> is the right angle. Angle <i>P<\/i> measures (3<i>x<\/i> + 6)° and angle <i>Q<\/i> measures (5<i>x<\/i> − 4)°. What is the measure of angle <i>P<\/i>?", "opts": ["11°", "39°", "51°", "72.75°"], "ans": 1, "sol": "The acute angles of a right triangle add up to 90°: (3<i>x<\/i> + 6) + (5<i>x<\/i> − 4) = 90.<br>8<i>x<\/i> + 2 = 90, so <i>x<\/i> = 11.<br>∠<i>P<\/i> = 3(11) + 6 = 39°.<br>Answer: <b>39°<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The front of a roof truss is triangle <i>A<\/i><i>B<\/i><i>C<\/i>, with peak <i>A<\/i> and <i>A<\/i><i>B<\/i> = <i>A<\/i><i>C<\/i>. A vertical post <i>A<\/i><i>D<\/i> runs from <i>A<\/i> to the midpoint <i>D<\/i> of the horizontal beam <i>B<\/i><i>C<\/i>. If angle <i>B<\/i><i>A<\/i><i>D<\/i> measures 58°, what is the measure of angle <i>A<\/i><i>B<\/i><i>C<\/i>?", "opts": ["29°", "32°", "58°", "61°"], "ans": 1, "sol": "The post is vertical and the beam is horizontal, so ∠<i>A<\/i><i>D<\/i><i>B<\/i> = 90°.<br>In triangle <i>A<\/i><i>B<\/i><i>D<\/i>, ∠<i>A<\/i><i>B<\/i><i>C<\/i> = 180° − 90° − 58° = 32°.<br>Check: ∠<i>B<\/i><i>A<\/i><i>C<\/i> = 2(58°) = 116°, and (180° − 116°) ÷ 2 = 32° ✓.<br>Answer: <b>32°<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A student builds a triangular frame from three straight rods. Two of the rods are 5 feet and 8 feet long. Which inequality gives all possible lengths <i>x<\/i>, in feet, of the third rod?", "opts": ["3 &lt; <i>x<\/i> &lt; 13", "3 ≤ <i>x<\/i> ≤ 13", "5 &lt; <i>x<\/i> &lt; 8", "<i>x<\/i> &lt; 13"], "ans": 0, "sol": "The third side must be greater than 8 − 5 = 3 and less than 8 + 5 = 13.<br>The endpoints are not allowed, because the rods would then lie flat in a line.<br>Answer: <b>3 &lt; <i>x<\/i> &lt; 13<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Two triangular metal brackets are congruent: triangle <i>J<\/i><i>K<\/i><i>L<\/i> is congruent to triangle <i>M<\/i><i>N<\/i><i>P<\/i>, with <i>J<\/i>, <i>K<\/i> and <i>L<\/i> corresponding to <i>M<\/i>, <i>N<\/i> and <i>P<\/i>, respectively. In triangle <i>J<\/i><i>K<\/i><i>L<\/i>, <i>J<\/i><i>K<\/i> = 12 centimeters, angle <i>K<\/i> measures 50° and angle <i>L<\/i> measures 85°. What is the measure of angle <i>M<\/i>?", "opts": ["45°", "50°", "85°", "95°"], "ans": 0, "sol": "∠<i>J<\/i> = 180° − 50° − 85° = 45°.<br><i>M<\/i> corresponds to <i>J<\/i>, so ∠<i>M<\/i> = 45°.<br>Answer: <b>45°<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, the exterior angle at vertex <i>C<\/i> is 40° larger than angle <i>A<\/i>. What is the measure, in degrees, of angle <i>B<\/i>?", "ans": ["40"], "sol": "The exterior angle at <i>C<\/i> equals ∠<i>A<\/i> + ∠<i>B<\/i>.<br>It also equals ∠<i>A<\/i> + 40°, so ∠<i>B<\/i> = 40°.<br>Answer: <b>40<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The figure shows a triangular wooden frame <i>A<\/i><i>B<\/i><i>C<\/i> with a brace <i>A<\/i><i>D<\/i> from corner <i>A<\/i> to point <i>D<\/i> on side <i>B<\/i><i>C<\/i>. What is the value of <i>x<\/i>?<svg class=\"fig\" viewBox=\"0 0 280 200\" role=\"img\" aria-label=\"Triangle ABC with point D on side BC and segment AD drawn. The angle at B is labeled 40 degrees, the angle at C is labeled x degrees, angle BAD is labeled 30 degrees and angle DAC is labeled 45 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"189.88,29.25 26,166.75 254,166.75\"/><line class=\"fg-edge\" x1=\"189.88\" y1=\"29.25\" x2=\"139.83\" y2=\"166.75\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"194.31\" y=\"21.52\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"13.73\" y=\"175.56\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"265.76\" y=\"176.79\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"139.83\" y=\"186.25\" text-anchor=\"middle\" font-style=\"italic\">D<\/text><text x=\"57.95\" y=\"159.63\" text-anchor=\"middle\">40°<\/text><text x=\"228.7\" y=\"155.14\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan>°<\/text><text x=\"162.35\" y=\"73.06\" text-anchor=\"middle\">30°<\/text><text x=\"191.8\" y=\"77.7\" text-anchor=\"middle\">45°<\/text><\/g><\/svg>", "opts": ["45", "65", "70", "75"], "ans": 1, "sol": "Angle <i>A<\/i> of the large triangle is 30° + 45° = 75°.<br>In triangle <i>A<\/i><i>B<\/i><i>C<\/i>: 40 + 75 + <i>x<\/i> = 180, so <i>x<\/i> = 65.<br>Answer: <b>65<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "The corners of a triangular plot of land have angles related as follows: the middle-sized angle is 10° larger than the smallest angle, and the largest angle is 20° larger than twice the smallest angle. What is the measure of the largest angle?", "opts": ["37.5°", "47.5°", "85°", "95°"], "ans": 3, "sol": "Let the smallest angle be <i>s<\/i>°. The others are (<i>s<\/i> + 10)° and (2<i>s<\/i> + 20)°.<br><i>s<\/i> + (<i>s<\/i> + 10) + (2<i>s<\/i> + 20) = 180, so 4<i>s<\/i> = 150 and <i>s<\/i> = 37.5.<br>The largest angle is 2(37.5) + 20 = 95°.<br>Answer: <b>95°<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "In the figure, side <i>A<\/i><i>B<\/i> of triangle <i>A<\/i><i>B<\/i><i>C<\/i> is extended in both directions. What is the value of <i>x<\/i> + <i>y<\/i>?<svg class=\"fig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"Triangle ABC with side AB extended in both directions along a line. The exterior angle at A, between the extension and side AC, is labeled x degrees. The exterior angle at B, between the extension and side BC, is labeled y degrees. The angle at C is labeled 70 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"77.78,144.99 222.22,144.99 136.65,43.01\"/><line class=\"fg-edge\" x1=\"20\" y1=\"144.99\" x2=\"77.78\" y2=\"144.99\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"222.22\" y1=\"144.99\" x2=\"280\" y2=\"144.99\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"66.16\" y=\"155.32\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"234.11\" y=\"154.76\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"134.97\" y=\"34.62\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"65.78\" y=\"128.7\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan>°<\/text><text x=\"232.37\" y=\"127.74\" text-anchor=\"middle\"><tspan font-style=\"italic\">y<\/tspan>°<\/text><text x=\"139.62\" y=\"81.38\" text-anchor=\"middle\">70°<\/text><\/g><\/svg>", "opts": ["110", "180", "250", "290"], "ans": 2, "sol": "By the exterior angle theorem, <i>x<\/i> = ∠<i>B<\/i> + 70 and <i>y<\/i> = ∠<i>A<\/i> + 70.<br><i>x<\/i> + <i>y<\/i> = (∠<i>A<\/i> + ∠<i>B<\/i>) + 140 = 110 + 140 = 250.<br>Answer: <b>250<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "One angle of an isosceles triangle measures 30°. What is the greatest possible measure, in degrees, of another angle of the triangle?", "ans": ["120"], "sol": "If 30° is the vertex angle, the base angles are (180° − 30°) ÷ 2 = 75° each.<br>If 30° is a base angle, the angles are 30°, 30° and 120°.<br>The greatest possible measure is 120°.<br>Answer: <b>120<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A designer draws a logo made of equilateral triangle <i>A<\/i><i>B<\/i><i>C<\/i> and triangle <i>A<\/i><i>B<\/i><i>D<\/i>, where <i>D<\/i> is on the opposite side of line <i>A<\/i><i>B<\/i> from <i>C<\/i>. In triangle <i>A<\/i><i>B<\/i><i>D<\/i>, <i>D<\/i><i>A<\/i> = <i>D<\/i><i>B<\/i> and angle <i>A<\/i><i>D<\/i><i>B<\/i> measures 40°. What is the measure of angle <i>D<\/i><i>A<\/i><i>C<\/i>?", "opts": ["10°", "70°", "100°", "130°"], "ans": 3, "sol": "Triangle <i>A<\/i><i>B<\/i><i>D<\/i> is isosceles with <i>D<\/i><i>A<\/i> = <i>D<\/i><i>B<\/i>, so ∠<i>D<\/i><i>A<\/i><i>B<\/i> = (180° − 40°) ÷ 2 = 70°.<br>∠<i>B<\/i><i>A<\/i><i>C<\/i> = 60° in the equilateral triangle.<br><i>D<\/i> and <i>C<\/i> are on opposite sides of <i>A<\/i><i>B<\/i>, so ∠<i>D<\/i><i>A<\/i><i>C<\/i> = 70° + 60° = 130°.<br>Answer: <b>130°<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A triangle has side lengths <i>x<\/i>, <i>x<\/i> + 2 and 10. Which of the following could be the value of <i>x<\/i>?", "opts": ["2", "3", "4", "5"], "ans": 3, "sol": "The sum of any two sides must be greater than the third. The test that matters is <i>x<\/i> + (<i>x<\/i> + 2) &gt; 10, which gives <i>x<\/i> &gt; 4.<br>The other two tests, <i>x<\/i> + 10 &gt; <i>x<\/i> + 2 and (<i>x<\/i> + 2) + 10 &gt; <i>x<\/i>, are true for every positive <i>x<\/i>.<br>Only 5 is greater than 4.<br>Answer: <b>5<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, angle <i>A<\/i> measures (2<i>x<\/i>)°, angle <i>B<\/i> measures (3<i>x<\/i> − 10)°, and angle <i>C<\/i> measures (<i>x<\/i> + 10)°. Which of the following lists the sides of the triangle from shortest to longest?", "opts": ["<i>A<\/i><i>B<\/i>, <i>B<\/i><i>C<\/i>, <i>A<\/i><i>C<\/i>", "<i>A<\/i><i>C<\/i>, <i>B<\/i><i>C<\/i>, <i>A<\/i><i>B<\/i>", "<i>B<\/i><i>C<\/i>, <i>A<\/i><i>B<\/i>, <i>A<\/i><i>C<\/i>", "<i>A<\/i><i>B<\/i>, <i>A<\/i><i>C<\/i>, <i>B<\/i><i>C<\/i>"], "ans": 0, "sol": "2<i>x<\/i> + (3<i>x<\/i> − 10) + (<i>x<\/i> + 10) = 180, so 6<i>x<\/i> = 180 and <i>x<\/i> = 30. The angles are ∠<i>A<\/i> = 60°, ∠<i>B<\/i> = 80° and ∠<i>C<\/i> = 40°.<br>From smallest to largest angle: <i>C<\/i>, <i>A<\/i>, <i>B<\/i>.<br>The opposite sides in the same order are <i>A<\/i><i>B<\/i>, <i>B<\/i><i>C<\/i>, <i>A<\/i><i>C<\/i>.<br>Answer: <b><i>A<\/i><i>B<\/i>, <i>B<\/i><i>C<\/i>, <i>A<\/i><i>C<\/i><\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "In the figure, segments <i>A<\/i><i>E<\/i> and <i>B<\/i><i>D<\/i> intersect at <i>C<\/i>, segment <i>A<\/i><i>B<\/i> is parallel to segment <i>D<\/i><i>E<\/i>, and <i>C<\/i> is the midpoint of <i>A<\/i><i>E<\/i>. What is the length of <i>B<\/i><i>D<\/i>?<svg class=\"fig\" viewBox=\"0 0 290 210\" role=\"img\" aria-label=\"Segments AE and BD cross at point C. Segment AB is at the top and segment DE is at the bottom. Tick marks show AC = CE. Segment BC is labeled 2y + 1 and segment CD is labeled 5y − 11.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"61.43,38.14 262,38.14 145,105\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"145,105 28,171.86 228.57,171.86\"/><line class=\"fg-edge\" x1=\"100.09\" y1=\"75.48\" x2=\"106.34\" y2=\"67.67\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"183.66\" y1=\"142.33\" x2=\"189.91\" y2=\"134.52\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"48.77\" y=\"39.67\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"274.72\" y=\"39.96\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"15.28\" y=\"179.04\" text-anchor=\"middle\" font-style=\"italic\">D<\/text><text x=\"241.23\" y=\"179.33\" text-anchor=\"middle\" font-style=\"italic\">E<\/text><text x=\"161\" y=\"110.5\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"215.41\" y=\"96.91\" text-anchor=\"middle\">2<tspan font-style=\"italic\">y<\/tspan> + 1<\/text><text x=\"73.6\" y=\"120.35\" text-anchor=\"middle\">5<tspan font-style=\"italic\">y<\/tspan> − 11<\/text><\/g><\/svg>", "opts": ["4", "8", "9", "18"], "ans": 3, "sol": "∠<i>B<\/i><i>A<\/i><i>C<\/i> = ∠<i>D<\/i><i>E<\/i><i>C<\/i> (alternate interior angles), <i>A<\/i><i>C<\/i> = <i>E<\/i><i>C<\/i>, and ∠<i>A<\/i><i>C<\/i><i>B<\/i> = ∠<i>E<\/i><i>C<\/i><i>D<\/i> (vertical angles), so triangle <i>A<\/i><i>B<\/i><i>C<\/i> is congruent to triangle <i>E<\/i><i>D<\/i><i>C<\/i> by ASA.<br>So <i>B<\/i><i>C<\/i> = <i>D<\/i><i>C<\/i>: 2<i>y<\/i> + 1 = 5<i>y<\/i> − 11, which gives <i>y<\/i> = 4 and <i>B<\/i><i>C<\/i> = <i>D<\/i><i>C<\/i> = 9.<br><i>B<\/i><i>D<\/i> = 9 + 9 = 18.<br>Answer: <b>18<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "Triangle <i>A<\/i><i>B<\/i><i>C<\/i> is congruent to triangle <i>D<\/i><i>E<\/i><i>F<\/i>, with <i>A<\/i>, <i>B<\/i> and <i>C<\/i> corresponding to <i>D<\/i>, <i>E<\/i> and <i>F<\/i>, respectively. Angle <i>A<\/i> measures (2<i>x<\/i> + 10)°, angle <i>D<\/i> measures (3<i>x<\/i> − 15)°, and angle <i>E<\/i> measures (<i>x<\/i> + 40)°. What is the measure, in degrees, of angle <i>C<\/i>?", "ans": ["55"], "sol": "∠<i>A<\/i> = ∠<i>D<\/i>, so 2<i>x<\/i> + 10 = 3<i>x<\/i> − 15 and <i>x<\/i> = 25. Then ∠<i>A<\/i> = 60° and ∠<i>E<\/i> = 65°.<br>∠<i>B<\/i> = ∠<i>E<\/i> = 65°.<br>∠<i>C<\/i> = 180° − 60° − 65° = 55°.<br>Answer: <b>55<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, <i>A<\/i><i>B<\/i> = <i>B<\/i><i>C<\/i>, and the exterior angle at vertex <i>C<\/i> measures 110°. What is the measure of angle <i>B<\/i>?", "opts": ["35°", "40°", "55°", "70°"], "ans": 1, "sol": "Interior ∠<i>C<\/i> = 180° − 110° = 70°.<br><i>A<\/i><i>B<\/i> = <i>B<\/i><i>C<\/i>, so the angles opposite these sides are equal: ∠<i>C<\/i> = ∠<i>A<\/i> = 70°.<br>By the exterior angle theorem, 110° = ∠<i>A<\/i> + ∠<i>B<\/i> = 70° + ∠<i>B<\/i>, so ∠<i>B<\/i> = 40°.<br>Answer: <b>40°<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "In triangle <i>P<\/i><i>Q<\/i><i>R<\/i>, angle <i>P<\/i> measures 50°. The bisectors of angles <i>Q<\/i> and <i>R<\/i> meet at point <i>S<\/i> inside the triangle. What is the measure of angle <i>Q<\/i><i>S<\/i><i>R<\/i>?", "opts": ["65°", "100°", "115°", "130°"], "ans": 2, "sol": "∠<i>Q<\/i> + ∠<i>R<\/i> = 180° − 50° = 130°.<br>Each bisector takes half of its angle, so ∠<i>S<\/i><i>Q<\/i><i>R<\/i> + ∠<i>S<\/i><i>R<\/i><i>Q<\/i> = 130° ÷ 2 = 65°.<br>In triangle <i>Q<\/i><i>S<\/i><i>R<\/i>, ∠<i>Q<\/i><i>S<\/i><i>R<\/i> = 180° − 65° = 115°.<br>Answer: <b>115°<\/b>"}, {"lo": "LO5", "diff": "X", "type": "mcq", "q": "In quadrilateral <i>A<\/i><i>B<\/i><i>C<\/i><i>D<\/i>, diagonal <i>B<\/i><i>D<\/i> bisects angle <i>A<\/i><i>B<\/i><i>C<\/i>, and <i>A<\/i><i>B<\/i> = <i>C<\/i><i>B<\/i>. The side lengths are <i>A<\/i><i>B<\/i> = 2<i>x<\/i> + 4, <i>A<\/i><i>D<\/i> = 3<i>x<\/i> + 2 and <i>C<\/i><i>D<\/i> = 5<i>x<\/i> − 8. What is the perimeter of <i>A<\/i><i>B<\/i><i>C<\/i><i>D<\/i>?", "opts": ["31", "34", "62", "68"], "ans": 2, "sol": "In triangles <i>A<\/i><i>B<\/i><i>D<\/i> and <i>C<\/i><i>B<\/i><i>D<\/i>: <i>A<\/i><i>B<\/i> = <i>C<\/i><i>B<\/i>, ∠<i>A<\/i><i>B<\/i><i>D<\/i> = ∠<i>C<\/i><i>B<\/i><i>D<\/i>, and <i>B<\/i><i>D<\/i> is shared, so they are congruent by SAS.<br>So <i>A<\/i><i>D<\/i> = <i>C<\/i><i>D<\/i>: 3<i>x<\/i> + 2 = 5<i>x<\/i> − 8, which gives <i>x<\/i> = 5.<br><i>A<\/i><i>D<\/i> = <i>C<\/i><i>D<\/i> = 17 and <i>A<\/i><i>B<\/i> = <i>C<\/i><i>B<\/i> = 2(5) + 4 = 14.<br>Perimeter = 14 + 14 + 17 + 17 = 62.<br>Answer: <b>62<\/b>"}, {"lo": "LO4", "diff": "X", "type": "spr", "q": "A triangle has side lengths 5, 11 and <i>x<\/i>, where <i>x<\/i> is an even integer. What is the sum of all possible values of <i>x<\/i>?", "ans": ["44"], "sol": "The third side satisfies 11 − 5 &lt; <i>x<\/i> &lt; 11 + 5, so 6 &lt; <i>x<\/i> &lt; 16.<br>The even integers in that range are 8, 10, 12 and 14 (6 is not allowed, because 5 + 6 = 11 is not greater than 11).<br>8 + 10 + 12 + 14 = 44.<br>Answer: <b>44<\/b>"}, {"lo": "LO3", "diff": "X", "type": "mcq", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i> shown, point <i>D<\/i> lies on side <i>B<\/i><i>C<\/i>, and <i>A<\/i><i>B<\/i> = <i>A<\/i><i>D<\/i> = <i>D<\/i><i>C<\/i>. If angle <i>C<\/i> measures 35°, what is the measure of angle <i>B<\/i><i>A<\/i><i>C<\/i>?<svg class=\"fig\" viewBox=\"0 0 290 190\" role=\"img\" aria-label=\"Triangle ABC with point D on side BC and segment AD drawn. Tick marks show that AB, AD and DC are all equal. The angle at C is labeled 35 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"74.34,26.6 26,159.4 264,159.4\"/><line class=\"fg-edge\" x1=\"74.34\" y1=\"26.6\" x2=\"122.67\" y2=\"159.4\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"45.47\" y1=\"91.29\" x2=\"54.87\" y2=\"94.71\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"93.81\" y1=\"94.71\" x2=\"103.2\" y2=\"91.29\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"193.34\" y1=\"164.4\" x2=\"193.34\" y2=\"154.4\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"68.23\" y=\"19.62\" text-anchor=\"middle\" font-style=\"italic\">A<\/text><text x=\"14.21\" y=\"169.37\" text-anchor=\"middle\" font-style=\"italic\">B<\/text><text x=\"276.42\" y=\"167.76\" text-anchor=\"middle\" font-style=\"italic\">C<\/text><text x=\"122.67\" y=\"178.9\" text-anchor=\"middle\" font-style=\"italic\">D<\/text><text x=\"227.76\" y=\"152.48\" text-anchor=\"middle\">35°<\/text><\/g><\/svg>", "opts": ["40°", "70°", "75°", "110°"], "ans": 2, "sol": "<i>D<\/i><i>A<\/i> = <i>D<\/i><i>C<\/i>, so ∠<i>D<\/i><i>A<\/i><i>C<\/i> = ∠<i>C<\/i> = 35°.<br>∠<i>A<\/i><i>D<\/i><i>B<\/i> is an exterior angle of triangle <i>A<\/i><i>D<\/i><i>C<\/i>, so ∠<i>A<\/i><i>D<\/i><i>B<\/i> = 35° + 35° = 70°.<br><i>A<\/i><i>B<\/i> = <i>A<\/i><i>D<\/i>, so ∠<i>B<\/i> = ∠<i>A<\/i><i>D<\/i><i>B<\/i> = 70° and ∠<i>B<\/i><i>A<\/i><i>D<\/i> = 180° − 140° = 40°.<br>∠<i>B<\/i><i>A<\/i><i>C<\/i> = 40° + 35° = 75°.<br>Answer: <b>75°<\/b>"}, {"lo": "LO2", "diff": "X", "type": "spr", "q": "In triangle <i>A<\/i><i>B<\/i><i>C<\/i>, angle <i>A<\/i> measures 50°. The exterior angles at vertices <i>B<\/i> and <i>C<\/i> measure <i>b<\/i>° and <i>c<\/i>°, respectively, and <i>b<\/i> − <i>c<\/i> = 30. What is the value of <i>b<\/i>?", "ans": ["130"], "sol": "Each exterior angle is 180° minus its interior angle, so <i>b<\/i> + <i>c<\/i> = 360 − (∠<i>B<\/i> + ∠<i>C<\/i>) = 360 − 130 = 230.<br>Add the equations <i>b<\/i> + <i>c<\/i> = 230 and <i>b<\/i> − <i>c<\/i> = 30: 2<i>b<\/i> = 260.<br><i>b<\/i> = 130.<br>Answer: <b>130<\/b>"}], "unit_no": 4, "topic_no": "1", "code": "1.2"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }
