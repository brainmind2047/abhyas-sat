<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,
     objective-by-objective lesson cards in Learn mode, one-question-at-a-time quiz with an objective-wise report. */
  :root{

    --danger:#B5443E; --danger-soft:#FAE3E1;
    --accent-text:#1F3B6B; --focus:#1F3B6B;
    --gr-grid:#E7E0CF; --gr-axis:#5C5546; --gr-line:#2D55C4; --gr-alt:#B7801A; --gr-shade:rgba(45,85,196,.16);

      --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
      --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
      --danger:#E38884; --danger-soft:#331D1B;
      --accent-text:#E0B75B; --focus:#E0B75B;
      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
    --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
    --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
    --danger:#E38884; --danger-soft:#331D1B;
    --accent-text:#E0B75B; --focus:#E0B75B;

  }
  *{box-sizing:border-box;}

  .modebar .prog{margin-left:auto; font-size:13.5px; color:var(--ink-soft);}

  main{padding-block:22px 40px;}

  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .lo-done{margin-left:auto; font-size:12.5px; color:var(--success); font-weight:700; flex-shrink:0;}

  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}

  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}

  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}

  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}

  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}

  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}

  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}

  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}

  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

<script>
(function(){
"use strict";
var S = {"id": "GEO-1.1", "unit": "Geometry and Trigonometry", "topic": "Lines, angles and triangles", "title": "Lines, angles and polygons", "intro": "This subtopic covers the angle facts that let you find an unknown angle without measuring: angle pairs at an intersection, the equal and supplementary angles formed when a transversal cuts parallel lines, and the angle sums of polygons. On the DSAT these appear as figure questions, often with angles written as algebraic expressions, and as quick questions about regular polygons.", "los": [{"id": "LO1", "text": "Find unknown angle measures, including angles written as expressions, using vertical angles, linear pairs, and complementary and supplementary angles."}, {"id": "LO2", "text": "Identify corresponding, alternate interior and same-side interior angles formed when parallel lines are cut by a transversal, and use them to find angle measures."}, {"id": "LO3", "text": "Write and solve equations for angles given as algebraic expressions in figures with parallel lines and a transversal."}, {"id": "LO4", "text": "Apply the interior angle sum (<i>n<\/i> − 2) · 180° to find a missing angle, an angle sum or the number of sides of a polygon."}, {"id": "LO5", "text": "Determine the interior and exterior angles of regular polygons and use the fact that the exterior angles of a convex polygon add up to 360°."}], "notes": [{"lo": "LO1", "h": "Angles at an intersection", "html": "<p>When two lines cross, they form four angles. Two angles that sit side by side along a straight line form a <b>linear pair<\/b>, and together they make a straight angle of 180°. Two angles directly across from each other are <b>vertical angles<\/b>, and vertical angles are always equal.<\/p><svg class=\"fig\" viewBox=\"0 0 260 200\" role=\"img\" aria-label=\"Two lines intersect. Going around the intersection point, the four angles are labeled 40 degrees, 140 degrees, 40 degrees and 140 degrees.\"><line class=\"fg-edge\" x1=\"16\" y1=\"100\" x2=\"244\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"25.13\" y1=\"188\" x2=\"234.87\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"164.43\" y=\"96.68\" text-anchor=\"middle\">40°<\/text><text x=\"122.23\" y=\"90.17\" text-anchor=\"middle\">140°<\/text><text x=\"95.23\" y=\"115.65\" text-anchor=\"middle\">40°<\/text><text x=\"140.36\" y=\"120.11\" text-anchor=\"middle\">140°<\/text><\/g><\/svg><div class=\"rule\">Vertical angles are equal. The two angles of a linear pair add up to 180°.<\/div><p>In the figure, each 40° angle forms a linear pair with each 140° angle next to it, and each angle equals the one across from it. So once you know one angle at an intersection, you know all four: two of them equal the known angle and the other two are its supplement.<\/p><p>The same idea extends to more rays: angles that together fill a straight line add up to 180°, and angles that fill a full turn around a point add up to 360°.<\/p>"}, {"lo": "LO1", "h": "Complementary and supplementary angles", "html": "<p>Two angles are <b>complementary<\/b> if their measures add up to 90° and <b>supplementary<\/b> if their measures add up to 180°. The angles do not have to touch; the words describe only the sum.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Pair<\/th><th>Sum<\/th><th>Partner of an angle of <i>x<\/i>°<\/th><\/tr><tr><td>Complementary<\/td><td>90°<\/td><td>(90 − <i>x<\/i>)°<\/td><\/tr><tr><td>Supplementary<\/td><td>180°<\/td><td>(180 − <i>x<\/i>)°<\/td><\/tr><\/table><\/div><div class=\"rule\">The complement of <i>x<\/i>° is (90 − <i>x<\/i>)°. The supplement of <i>x<\/i>° is (180 − <i>x<\/i>)°.<\/div><p>Word problems often describe one angle in terms of another, for example “an angle is 30° more than twice its complement.” Call the angle <i>x<\/i>, write its partner as 90 − <i>x<\/i> or 180 − <i>x<\/i>, translate the sentence into an equation and solve.<\/p><div class=\"eqs\"><i>x<\/i> = 2(90 − <i>x<\/i>) + 30<br>3<i>x<\/i> = 210, so <i>x<\/i> = 70<\/div><div class=\"tip\">DSAT tip: C comes before S in the alphabet, and 90 comes before 180. That keeps “complementary” and “supplementary” in the right order.<\/div>"}, {"lo": "LO2", "h": "Parallel lines and a transversal", "html": "<p>A <b>transversal<\/b> is a line that crosses two other lines. When it crosses two <b>parallel<\/b> lines, it makes the same four angles at each intersection, because both lines meet the transversal at the same slant.<\/p><svg class=\"fig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"Parallel lines l and m are cut by transversal t. At line l the four angles are numbered 1 (upper left), 2 (upper right), 3 (lower left) and 4 (lower right); at line m they are numbered 5, 6, 7 and 8 in the same positions. Angles 2, 3, 6 and 7 are acute.\"><line class=\"fg-edge\" x1=\"14\" y1=\"69\" x2=\"254\" y2=\"69\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"14\" y1=\"161\" x2=\"254\" y2=\"161\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"74.53\" y1=\"218\" x2=\"193.47\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"265\" y=\"73\" text-anchor=\"middle\"><tspan font-style=\"italic\">ℓ<\/tspan><\/text><text x=\"265\" y=\"165\" text-anchor=\"middle\"><tspan font-style=\"italic\">m<\/tspan><\/text><text x=\"204.47\" y=\"20\" text-anchor=\"middle\"><tspan font-style=\"italic\">t<\/tspan><\/text><text x=\"154.56\" y=\"61.61\" text-anchor=\"middle\">1<\/text><text x=\"177.43\" y=\"65.73\" text-anchor=\"middle\">2<\/text><text x=\"142.49\" y=\"84.56\" text-anchor=\"middle\">3<\/text><text x=\"167.56\" y=\"84.12\" text-anchor=\"middle\">4<\/text><text x=\"101.44\" y=\"153.61\" text-anchor=\"middle\">5<\/text><text x=\"124.31\" y=\"157.73\" text-anchor=\"middle\">6<\/text><text x=\"89.38\" y=\"176.56\" text-anchor=\"middle\">7<\/text><text x=\"114.44\" y=\"176.12\" text-anchor=\"middle\">8<\/text><\/g><\/svg><p>In the figure, line <i>ℓ<\/i> is parallel to line <i>m<\/i>. Angles 2, 3, 6 and 7 are all equal (they are the acute angles), and angles 1, 4, 5 and 8 are all equal (the obtuse angles). Any angle from the first group and any angle from the second group are supplementary.<\/p><div class=\"rule\">When parallel lines are cut by a transversal, all the acute angles formed are equal, all the obtuse angles are equal, and each acute angle is supplementary to each obtuse angle.<\/div><div class=\"tip\">DSAT tip: use these facts only when the question states that the lines are parallel. Lines that merely look parallel in a figure do not count.<\/div>"}, {"lo": "LO2", "h": "Naming the angle pairs", "html": "<p>The DSAT uses special names for pairs of angles at the two intersections. “Interior” means between the parallel lines, and “exterior” means outside them. The table refers to the numbered figure above.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Pair<\/th><th>Where the angles are<\/th><th>Examples<\/th><th>Relationship<\/th><\/tr><tr><td>Corresponding<\/td><td>Same position at each intersection<\/td><td>∠1 and ∠5, ∠2 and ∠6<\/td><td>Equal<\/td><\/tr><tr><td>Alternate interior<\/td><td>Between the lines, opposite sides of the transversal<\/td><td>∠3 and ∠6, ∠4 and ∠5<\/td><td>Equal<\/td><\/tr><tr><td>Same-side interior<\/td><td>Between the lines, same side of the transversal<\/td><td>∠3 and ∠5, ∠4 and ∠6<\/td><td>Supplementary<\/td><\/tr><\/table><\/div><div class=\"rule\">Corresponding angles are equal, alternate interior angles are equal, and same-side interior angles add up to 180°.<\/div><p>The facts also work in reverse. If a pair of corresponding angles or alternate interior angles are equal, or a pair of same-side interior angles are supplementary, then the two lines must be parallel.<\/p>"}, {"lo": "LO2", "h": "A bend between parallel lines", "html": "<p>Sometimes two segments meet at a point <i>P<\/i> between two parallel lines, making a bend, and no single transversal crosses both lines. The key move is to draw one more line through <i>P<\/i>, parallel to the other two.<\/p><div class=\"rule\">Through a point between two parallel lines, draw a third parallel line. It splits the angle at the point into two parts, and each part is an alternate interior angle with an angle at one of the original lines.<\/div><p>Work on each half of the figure separately: find the part of the angle at <i>P<\/i> that pairs with the angle at the upper line, then the part that pairs with the angle at the lower line, and add the two parts. If an angle given at one of the lines is on the other side of the segment, replace it with its supplement first.<\/p><div class=\"tip\">DSAT tip: the extra line is not in the figure. Sketch it on your scratch paper; that one line usually turns a hard question into two easy ones.<\/div>"}, {"lo": "LO3", "h": "From a figure to an equation", "html": "<p>Many DSAT questions label angles with expressions such as (4<i>x<\/i> + 10)°. The geometry tells you which equation to write; the algebra is usually only one or two steps.<\/p><ul><li>If the two angles must be <b>equal<\/b> (vertical, corresponding or alternate interior angles), set the expressions equal to each other.<\/li><li>If the two angles must be <b>supplementary<\/b> (a linear pair or same-side interior angles), set their sum equal to 180.<\/li><\/ul><div class=\"rule\">Decide “equal” or “add to 180” before you write anything. In a parallel-line figure, two acute angles or two obtuse angles are equal, and an acute angle and an obtuse angle add up to 180°.<\/div><div class=\"eqs\">Alternate interior angles: 7<i>x<\/i> − 9 = 4<i>x<\/i> + 27, so <i>x<\/i> = 12<br>Same-side interior angles: (3<i>x<\/i> + 8) + (5<i>x<\/i> + 12) = 180, so <i>x<\/i> = 20<\/div><p>Then read the last line of the question again. It may ask for <i>x<\/i>, for an angle measure or for a different angle in the figure.<\/p>"}, {"lo": "LO4", "h": "Interior angles of a polygon", "html": "<p>Pick one vertex of a convex polygon with <i>n<\/i> sides and draw every diagonal from it. The diagonals cut the polygon into <i>n<\/i> − 2 triangles, and the angles of each triangle add up to 180°. Together, the triangles’ angles make up exactly the polygon’s interior angles.<\/p><div class=\"rule\">The interior angles of a polygon with <i>n<\/i> sides add up to (<i>n<\/i> − 2) · 180°.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Sides <i>n<\/i><\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><\/tr><tr><td>Angle sum<\/td><td>180°<\/td><td>360°<\/td><td>540°<\/td><td>720°<\/td><td>900°<\/td><td>1,080°<\/td><\/tr><\/table><\/div><p>Each extra side adds 180° to the sum. To find a missing angle, subtract the known angles from the total. To find the number of sides from a given sum, divide the sum by 180 and add 2.<\/p><div class=\"tip\">DSAT tip: the sum depends only on the number of sides, not on the shape, so a stretched hexagon has the same 720° total as a regular one.<\/div>"}, {"lo": "LO5", "h": "Regular polygons and exterior angles", "html": "<p>A <b>regular<\/b> polygon has all sides equal and all angles equal. An <b>exterior angle<\/b> is formed by one side and the extension of the next side, so at each vertex the interior angle and the exterior angle form a linear pair.<\/p><div class=\"rule\">For any convex polygon, the exterior angles (one at each vertex) add up to 360°.<\/div><div class=\"eqs\">Each exterior angle of a regular <i>n<\/i>-gon = <span class=\"fq\"><span>360°<\/span><span><i>n<\/i><\/span><\/span><br>Each interior angle = 180° − <span class=\"fq\"><span>360°<\/span><span><i>n<\/i><\/span><\/span> = <span class=\"fq\"><span>(<i>n<\/i> − 2) · 180°<\/span><span><i>n<\/i><\/span><\/span><\/div><p>Walking around a polygon, you turn through each exterior angle once and finish facing the way you started, which is why the total is always one full turn. Exterior angles are usually the fastest route: if each interior angle of a regular polygon is 140°, each exterior angle is 40°, so the polygon has <span class=\"fq\"><span>360<\/span><span>40<\/span><\/span> = 9 sides.<\/p>"}], "examples": [{"lo": "LO1", "q": "Two lines intersect. One of the four angles formed is 4 times as large as an angle next to it. What are the measures of the four angles?", "steps": ["Angles next to each other at an intersection form a linear pair, so <i>x<\/i> + 4<i>x<\/i> = 180.", "5<i>x<\/i> = 180, so <i>x<\/i> = 36 and 4<i>x<\/i> = 144.", "Vertical angles are equal, so the four angles are 36°, 144°, 36° and 144°."], "ans": "36°, 144°, 36° and 144°"}, {"lo": "LO1", "q": "An angle measures 26° less than its supplement. What is the measure of the angle, in degrees?", "steps": ["Let the angle be <i>x<\/i>°. Its supplement is (180 − <i>x<\/i>)°.", "<i>x<\/i> = (180 − <i>x<\/i>) − 26, so 2<i>x<\/i> = 154.", "<i>x<\/i> = 77. Check: the supplement is 103°, and 103 − 26 = 77 ✓."], "ans": "77"}, {"lo": "LO2", "q": "<svg class=\"fig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"Parallel lines l and m are cut by transversal t. At line l, the angle above l and to the left of t is 118 degrees and the angle above l and to the right of t is a degrees. At line m, the angle below m and to the right of t is b degrees and the angle below m and to the left of t is c degrees.\"><line class=\"fg-edge\" x1=\"14\" y1=\"69\" x2=\"254\" y2=\"69\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"14\" y1=\"161\" x2=\"254\" y2=\"161\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"79.23\" y1=\"218\" x2=\"188.77\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"265\" y=\"73\" text-anchor=\"middle\"><tspan font-style=\"italic\">ℓ<\/tspan><\/text><text x=\"265\" y=\"165\" text-anchor=\"middle\"><tspan font-style=\"italic\">m<\/tspan><\/text><text x=\"199.77\" y=\"20\" text-anchor=\"middle\"><tspan font-style=\"italic\">t<\/tspan><\/text><text x=\"143.84\" y=\"63.33\" text-anchor=\"middle\">118°<\/text><text x=\"178.05\" y=\"64.45\" text-anchor=\"middle\"><tspan font-style=\"italic\">a<\/tspan>°<\/text><text x=\"117.78\" y=\"177.71\" text-anchor=\"middle\"><tspan font-style=\"italic\">b<\/tspan>°<\/text><text x=\"88.97\" y=\"176.36\" text-anchor=\"middle\"><tspan font-style=\"italic\">c<\/tspan>°<\/text><\/g><\/svg>In the figure, line <i>ℓ<\/i> is parallel to line <i>m<\/i>. What are the values of <i>a<\/i>, <i>b<\/i> and <i>c<\/i>?", "steps": ["The angles labeled 118° and <i>a<\/i>° form a linear pair, so <i>a<\/i> = 180 − 118 = 62.", "The angle below <i>ℓ<\/i> on the right of <i>t<\/i> is vertical to the 118° angle, so it is 118°. The angle <i>b<\/i>° is in the same position at <i>m<\/i>, so they are corresponding angles: <i>b<\/i> = 118.", "The angle <i>c<\/i>° forms a linear pair with the <i>b<\/i>° angle, so <i>c<\/i> = 180 − 118 = 62. (It is also an acute angle, so it equals <i>a<\/i>.)"], "ans": "<i>a<\/i> = 62, <i>b<\/i> = 118, <i>c<\/i> = 62"}, {"lo": "LO3", "q": "<svg class=\"fig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"Parallel lines l and m are cut by transversal t. Between the parallel lines, the angle at line l on the left of t is labeled (5x minus 12) degrees and the angle at line m on the right of t is labeled (3x plus 20) degrees.\"><line class=\"fg-edge\" x1=\"14\" y1=\"69\" x2=\"254\" y2=\"69\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"14\" y1=\"161\" x2=\"254\" y2=\"161\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"92.39\" y1=\"218\" x2=\"175.61\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"265\" y=\"73\" text-anchor=\"middle\"><tspan font-style=\"italic\">ℓ<\/tspan><\/text><text x=\"265\" y=\"165\" text-anchor=\"middle\"><tspan font-style=\"italic\">m<\/tspan><\/text><text x=\"186.61\" y=\"20\" text-anchor=\"middle\"><tspan font-style=\"italic\">t<\/tspan><\/text><text x=\"112.57\" y=\"84.76\" text-anchor=\"middle\">(5<tspan font-style=\"italic\">x<\/tspan> − 12)°<\/text><text x=\"156.46\" y=\"155.1\" text-anchor=\"middle\">(3<tspan font-style=\"italic\">x<\/tspan> + 20)°<\/text><\/g><\/svg>In the figure, line <i>ℓ<\/i> is parallel to line <i>m<\/i>. What is the measure of the angle labeled (5<i>x<\/i> − 12)°?<br>A) 16°<br>B) 52°<br>C) 68°<br>D) 112°", "steps": ["Both angles are between the parallel lines and on opposite sides of <i>t<\/i>, so they are alternate interior angles, which are equal.", "5<i>x<\/i> − 12 = 3<i>x<\/i> + 20, so 2<i>x<\/i> = 32 and <i>x<\/i> = 16.", "The angle measures 5(16) − 12 = 68°. Check: 3(16) + 20 = 68 ✓. Choice A is the value of <i>x<\/i>, not the angle."], "ans": "C) 68°"}, {"lo": "LO4", "q": "The interior angles of a convex polygon add up to 1,980°. How many sides does the polygon have?", "steps": ["Set the formula equal to the sum: (<i>n<\/i> − 2) · 180 = 1,980.", "Divide by 180: <i>n<\/i> − 2 = 11.", "<i>n<\/i> = 13."], "ans": "13 sides"}, {"lo": "LO5", "q": "Each interior angle of a regular polygon measures 156°. How many sides does the polygon have?<br>A) 10<br>B) 13<br>C) 15<br>D) 24", "steps": ["Each exterior angle forms a linear pair with an interior angle: 180 − 156 = 24°.", "The exterior angles add up to 360°, so <i>n<\/i> = <span class=\"fq\"><span>360<\/span><span>24<\/span><\/span> = 15.", "Choice D is the exterior angle, not the number of sides."], "ans": "C) 15"}], "traps": ["Assuming two angles are equal because they look equal. Use only stated facts: vertical angles, linear pairs, or angle pairs at lines that the question says are parallel.", "Setting same-side interior angles equal to each other. They are supplementary (their sum is 180°); only corresponding and alternate interior angles are equal.", "Stopping at the value of <i>x<\/i>. If the question asks for an angle measure, substitute <i>x<\/i> back into the expression; the value of <i>x<\/i> itself is often a wrong answer choice.", "Mixing up complementary angles (sum 90°) and supplementary angles (sum 180°).", "Using <i>n<\/i> · 180° or (<i>n<\/i> − 1) · 180° for the interior angle sum. The sum is (<i>n<\/i> − 2) · 180°; check the formula with a triangle, where <i>n<\/i> = 3 gives 180°.", "Confusing the interior and exterior angles of a regular polygon. <span class=\"fq\"><span>360°<\/span><span><i>n<\/i><\/span><\/span> is each exterior angle; each interior angle is 180° minus that value. The exterior angles always total 360°, however many sides there are."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 200\" role=\"img\" aria-label=\"Two lines intersect. One angle is 63 degrees. The angle next to it, above the horizontal line, is b degrees, and the angle directly across from the 63 degree angle is a degrees.\"><line class=\"fg-edge\" x1=\"16\" y1=\"100\" x2=\"244\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"85.16\" y1=\"188\" x2=\"174.84\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"152.07\" y=\"96.51\" text-anchor=\"middle\">63°<\/text><text x=\"122.69\" y=\"91.06\" text-anchor=\"middle\"><tspan font-style=\"italic\">b<\/tspan>°<\/text><text x=\"110.39\" y=\"115.02\" text-anchor=\"middle\"><tspan font-style=\"italic\">a<\/tspan>°<\/text><\/g><\/svg>In the figure, two lines intersect. What is the value of <i>a<\/i> + <i>b<\/i>?", "opts": ["126", "117", "180", "234"], "ans": 2, "sol": "The angle labeled <i>a<\/i>° is across from the 63° angle, so they are vertical angles and <i>a<\/i> = 63.<br>The angle labeled <i>b<\/i>° forms a linear pair with the 63° angle, so <i>b<\/i> = 180 − 63 = 117.<br><i>a<\/i> + <i>b<\/i> = 63 + 117 = 180.<br>Answer: <b>180<\/b>", "hint": "Which labeled angle is directly across from the 63° angle, and which one shares a straight line with it?"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "The measure of ∠<i>P<\/i> is 18° more than twice the measure of ∠<i>Q<\/i>. If ∠<i>P<\/i> and ∠<i>Q<\/i> are complementary, what is the measure, in degrees, of ∠<i>Q<\/i>?", "ans": ["24"], "sol": "Let the measure of ∠<i>Q<\/i> be <i>q<\/i>°. Then the measure of ∠<i>P<\/i> is (2<i>q<\/i> + 18)°.<br>Complementary angles add up to 90°: <i>q<\/i> + 2<i>q<\/i> + 18 = 90.<br>3<i>q<\/i> = 72, so <i>q<\/i> = 24.<br>Answer: <b>24<\/b>", "hint": "Write the measure of ∠<i>P<\/i> in terms of the measure of ∠<i>Q<\/i>, then use the total that complementary angles must have."}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "Two lines intersect, forming a pair of vertical angles with measures (4<i>x<\/i> + 7)° and (6<i>x<\/i> − 19)°. What is the value of <i>x<\/i>?", "opts": ["19.2", "−6", "13", "59"], "ans": 2, "sol": "Vertical angles are equal: 4<i>x<\/i> + 7 = 6<i>x<\/i> − 19.<br>Subtract 4<i>x<\/i> and add 19: 26 = 2<i>x<\/i>.<br><i>x<\/i> = 13.<br>Answer: <b>13<\/b>", "hint": "Decide whether vertical angles are equal or supplementary, and write the matching equation."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Two parallel lines are cut by a transversal. Which of the following describes a pair of alternate interior angles?", "opts": ["Two angles between the parallel lines, on opposite sides of the transversal", "Two angles between the parallel lines, on the same side of the transversal", "Two angles in the same position at the two intersections", "Two angles outside the parallel lines, on opposite sides of the transversal"], "ans": 0, "sol": "“Interior” means the angles lie between the two parallel lines.<br>“Alternate” means they lie on opposite sides of the transversal.<br>Answer: <b>Two angles between the parallel lines, on opposite sides of the transversal<\/b>", "hint": "“Interior” tells you where the angles are relative to the parallel lines; “alternate” tells you where they are relative to the transversal."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Lines <i>ℓ<\/i> and <i>m<\/i> are parallel and are cut by transversal <i>t<\/i>. Two of the angles formed are same-side interior angles, and one of them measures 74°. What is the measure of the other angle?", "opts": ["74°", "106°", "16°", "286°"], "ans": 1, "sol": "Same-side interior angles are supplementary.<br>180 − 74 = 106.<br>Answer: <b>106°<\/b>", "hint": "One of these two angles is acute and the other is obtuse, so they cannot be equal."}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "<svg class=\"fig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"Parallel lines l and m are cut by transversal t. Between the parallel lines and on the right side of t, the angle at line l is labeled (3x plus 6) degrees and the angle at line m is labeled (2x plus 14) degrees.\"><line class=\"fg-edge\" x1=\"14\" y1=\"69\" x2=\"254\" y2=\"69\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"14\" y1=\"161\" x2=\"254\" y2=\"161\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"112.11\" y1=\"218\" x2=\"155.89\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"265\" y=\"73\" text-anchor=\"middle\"><tspan font-style=\"italic\">ℓ<\/tspan><\/text><text x=\"265\" y=\"165\" text-anchor=\"middle\"><tspan font-style=\"italic\">m<\/tspan><\/text><text x=\"166.89\" y=\"20\" text-anchor=\"middle\"><tspan font-style=\"italic\">t<\/tspan><\/text><text x=\"172.41\" y=\"86.29\" text-anchor=\"middle\">(3<tspan font-style=\"italic\">x<\/tspan> + 6)°<\/text><text x=\"161.09\" y=\"154.78\" text-anchor=\"middle\">(2<tspan font-style=\"italic\">x<\/tspan> + 14)°<\/text><\/g><\/svg>In the figure, line <i>ℓ<\/i> is parallel to line <i>m<\/i>. What is the value of <i>x<\/i>?", "ans": ["32"], "sol": "Both angles are between the parallel lines and on the same side of <i>t<\/i>, so they are same-side interior angles and are supplementary.<br>(3<i>x<\/i> + 6) + (2<i>x<\/i> + 14) = 180, so 5<i>x<\/i> + 20 = 180.<br>5<i>x<\/i> = 160 and <i>x<\/i> = 32.<br>Answer: <b>32<\/b>", "hint": "Locate both angles: are they between the parallel lines? Are they on the same side of <i>t<\/i> or on opposite sides?"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Lines <i>ℓ<\/i> and <i>m<\/i> are parallel and are cut by transversal <i>t<\/i>. Angle 1 is formed at line <i>ℓ<\/i> and measures (7<i>x<\/i> − 4)°. Angle 2 is formed at line <i>m<\/i>, and angles 1 and 2 are alternate interior angles. Angle 3 forms a linear pair with angle 2 and measures (3<i>x<\/i> + 4)°. What is the measure of angle 1?", "opts": ["58°", "122°", "18°", "10°"], "ans": 1, "sol": "Alternate interior angles are equal, so angle 2 also measures (7<i>x<\/i> − 4)°.<br>Angles 2 and 3 form a linear pair: (7<i>x<\/i> − 4) + (3<i>x<\/i> + 4) = 180, so 10<i>x<\/i> = 180 and <i>x<\/i> = 18.<br>Angle 1 measures 7(18) − 4 = 122°.<br>Answer: <b>122°<\/b>", "hint": "Replace angle 2 with an expression you already know, then use the linear pair."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "What is the sum of the measures of the interior angles of a convex polygon with 11 sides?", "opts": ["1,620°", "1,980°", "1,800°", "360°"], "ans": 0, "sol": "The interior angle sum is (<i>n<\/i> − 2) · 180°.<br>(11 − 2) · 180 = 9 · 180 = 1,620.<br>Answer: <b>1,620°<\/b>", "hint": "From one vertex, the diagonals of a polygon with <i>n<\/i> sides split it into <i>n<\/i> − 2 triangles."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 240\" role=\"img\" aria-label=\"A pentagon with interior angles labeled 100 degrees, 115 degrees, 92 degrees, 120 degrees and x degrees, in order around the figure.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"57.33,215 171.67,215 220,111.37 123.78,62.34 40,116.74\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"73.5\" y=\"210.11\" text-anchor=\"middle\">100°<\/text><text x=\"156.94\" y=\"209.53\" text-anchor=\"middle\">115°<\/text><text x=\"200.29\" y=\"124.13\" text-anchor=\"middle\">92°<\/text><text x=\"124.93\" y=\"87.31\" text-anchor=\"middle\">120°<\/text><text x=\"51.97\" y=\"130.36\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan>°<\/text><\/g><\/svg>What is the value of <i>x<\/i> in the pentagon shown?", "opts": ["67", "293", "103", "113"], "ans": 3, "sol": "The interior angles of a pentagon add up to (5 − 2) · 180 = 540°.<br>The four known angles add up to 100 + 115 + 92 + 120 = 427.<br><i>x<\/i> = 540 − 427 = 113.<br>Answer: <b>113<\/b>", "hint": "Start by finding the total of all five interior angles of any pentagon."}, {"lo": "LO5", "diff": "E", "type": "spr", "q": "Each exterior angle of a regular polygon measures 20°. How many sides does the polygon have?", "ans": ["18"], "sol": "The exterior angles of a convex polygon add up to 360°, and in a regular polygon they are all equal.<br><i>n<\/i> = <span class=\"fq\"><span>360<\/span><span>20<\/span><\/span> = 18.<br>Answer: <b>18<\/b>", "hint": "The exterior angles of every convex polygon have the same total. How many 20° angles fit into it?"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "What is the measure of each interior angle of a regular decagon (a polygon with 10 sides)?", "opts": ["144°", "36°", "162°", "140°"], "ans": 0, "sol": "Each exterior angle is <span class=\"fq\"><span>360<\/span><span>10<\/span><\/span> = 36°.<br>Each interior angle forms a linear pair with an exterior angle: 180 − 36 = 144.<br>Answer: <b>144°<\/b>", "hint": "Find one exterior angle first. How are the interior and exterior angles at a vertex related?"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Each interior angle of a regular polygon is 5 times as large as each of its exterior angles. How many sides does the polygon have?", "opts": ["6", "30", "150", "12"], "ans": 3, "sol": "Let each exterior angle be <i>e<\/i>°. Then each interior angle is 5<i>e<\/i>°, and the two form a linear pair: <i>e<\/i> + 5<i>e<\/i> = 180.<br><i>e<\/i> = 30.<br><i>n<\/i> = <span class=\"fq\"><span>360<\/span><span>30<\/span><\/span> = 12.<br>Answer: <b>12<\/b>", "hint": "At each vertex, the interior angle and the exterior angle form a linear pair. Turn that into an equation."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "What is the measure of the complement of a 38° angle?", "opts": ["142°", "38°", "52°", "128°"], "ans": 2, "sol": "Complementary angles add up to 90°.<br>90 − 38 = 52.<br>Answer: <b>52°<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Two parallel lines are cut by a transversal, and one of the angles formed measures 57°. Which of the following could be the measure of another angle formed?", "opts": ["33°", "147°", "67°", "123°"], "ans": 3, "sol": "Every angle formed is either equal to the 57° angle or supplementary to it.<br>The only possible measures are 57° and 180 − 57 = 123°.<br>Answer: <b>123°<\/b>"}, {"lo": "LO4", "diff": "E", "type": "spr", "q": "All of the diagonals from one vertex of a convex decagon (a polygon with 10 sides) are drawn. Into how many triangles do these diagonals divide the decagon?", "ans": ["8"], "sol": "From one vertex, diagonals go to every vertex except itself and its two neighbors: 10 − 3 = 7 diagonals.<br>Seven diagonals split the decagon into 7 + 1 = 8 triangles, which is 10 − 2.<br>Answer: <b>8<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "A stop sign is shaped like a regular octagon. If one exterior angle is drawn at each of its 8 vertices, what is the sum of the measures of these 8 exterior angles?", "opts": ["45°", "360°", "135°", "1,080°"], "ans": 1, "sol": "For every convex polygon, the exterior angles (one at each vertex) add up to 360°.<br>The number of sides does not change this total.<br>Answer: <b>360°<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 210\" role=\"img\" aria-label=\"Rays OA, OC and OB start at point O. Ray OA points right and ray OB points straight up. Ray OC lies between them. The angle between OA and OC is 28 degrees and the angle between OC and OB is x degrees.\"><line class=\"fg-edge\" x1=\"52\" y1=\"182\" x2=\"238\" y2=\"182\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"52\" y1=\"182\" x2=\"52\" y2=\"20\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"52\" y1=\"182\" x2=\"209.16\" y2=\"98.43\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"52\" cy=\"182\" r=\"3\"/><circle cx=\"238\" cy=\"182\" r=\"3\"/><circle cx=\"52\" cy=\"20\" r=\"3\"/><circle cx=\"209.16\" cy=\"98.43\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"99.61\" y=\"178.92\" text-anchor=\"middle\">28°<\/text><text x=\"61.27\" y=\"169.57\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan>°<\/text><text x=\"45.68\" y=\"189.9\" text-anchor=\"middle\"><tspan font-style=\"italic\">O<\/tspan><\/text><text x=\"244.34\" y=\"191.39\" text-anchor=\"middle\"><tspan font-style=\"italic\">A<\/tspan><\/text><text x=\"44\" y=\"23\" text-anchor=\"middle\"><tspan font-style=\"italic\">B<\/tspan><\/text><text x=\"216.09\" y=\"97.43\" text-anchor=\"middle\"><tspan font-style=\"italic\">C<\/tspan><\/text><\/g><\/svg>In the figure, ∠<i>A<\/i><i>O<\/i><i>B<\/i> is a right angle. What is the value of <i>x<\/i>?", "opts": ["152", "28", "118", "62"], "ans": 3, "sol": "∠<i>A<\/i><i>O<\/i><i>C<\/i> and ∠<i>C<\/i><i>O<\/i><i>B<\/i> together make the right angle ∠<i>A<\/i><i>O<\/i><i>B<\/i>, so 28 + <i>x<\/i> = 90.<br><i>x<\/i> = 62.<br>Answer: <b>62<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "Angles <i>P<\/i> and <i>Q<\/i> form a linear pair. The measure of angle <i>P<\/i> is (<i>x<\/i> + 30)°, and the measure of angle <i>Q<\/i> is (2<i>x<\/i>)°. What is the value of <i>x<\/i>?", "opts": ["20", "60", "50", "100"], "ans": 2, "sol": "A linear pair adds up to 180°: (<i>x<\/i> + 30) + 2<i>x<\/i> = 180.<br>3<i>x<\/i> + 30 = 180, so 3<i>x<\/i> = 150.<br><i>x<\/i> = 50.<br>Answer: <b>50<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Two parallel streets are crossed by a straight avenue, forming eight angles. At the first street, the avenue makes an acute angle of 64° with the street. What is the sum of the measures of the four obtuse angles formed at the two intersections?", "opts": ["464°", "256°", "116°", "720°"], "ans": 0, "sol": "Every obtuse angle formed is supplementary to the 64° angle: 180 − 64 = 116°.<br>There are two obtuse angles at each intersection, so four in all.<br>4 · 116 = 464.<br>Answer: <b>464°<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "The supplement of an angle is 4 times the complement of the same angle. What is the measure of the angle, in degrees?", "ans": ["60"], "sol": "Let the angle be <i>x<\/i>°. Its supplement is 180 − <i>x<\/i> and its complement is 90 − <i>x<\/i>.<br>180 − <i>x<\/i> = 4(90 − <i>x<\/i>) = 360 − 4<i>x<\/i>.<br>3<i>x<\/i> = 180, so <i>x<\/i> = 60.<br>Answer: <b>60<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Lines <i>ℓ<\/i> and <i>m<\/i> are parallel and are cut by transversal <i>t<\/i>. Two corresponding angles measure (4<i>x<\/i> − 15)° and (2<i>x<\/i> + 41)°. What is the value of <i>x<\/i>?", "opts": ["28", "97", "83", "13"], "ans": 0, "sol": "Corresponding angles are equal: 4<i>x<\/i> − 15 = 2<i>x<\/i> + 41.<br>2<i>x<\/i> = 56.<br><i>x<\/i> = 28.<br>Answer: <b>28<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The interior angles of a quadrilateral measure (2<i>x<\/i>)°, (3<i>x<\/i>)°, (3<i>x<\/i> + 10)° and (4<i>x<\/i> − 10)°. What is the value of <i>x<\/i>?", "opts": ["15", "30", "45", "90"], "ans": 1, "sol": "The interior angles of a quadrilateral add up to (4 − 2) · 180 = 360°.<br>2<i>x<\/i> + 3<i>x<\/i> + (3<i>x<\/i> + 10) + (4<i>x<\/i> − 10) = 12<i>x<\/i> = 360.<br><i>x<\/i> = 30.<br>Answer: <b>30<\/b>"}, {"lo": "LO5", "diff": "M", "type": "spr", "q": "A tile designer compares two tiles: one is a regular 12-sided polygon and the other is a regular hexagon. How many degrees greater is each interior angle of the 12-sided tile than each interior angle of the hexagonal tile?", "ans": ["30"], "sol": "Regular 12-gon: each exterior angle is <span class=\"fq\"><span>360<\/span><span>12<\/span><\/span> = 30°, so each interior angle is 180 − 30 = 150°.<br>Regular hexagon: each exterior angle is <span class=\"fq\"><span>360<\/span><span>6<\/span><\/span> = 60°, so each interior angle is 120°.<br>150 − 120 = 30.<br>Answer: <b>30<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"Parallel lines l and m are cut by transversal t, which slants up to the left. At line l the four angles are numbered 1 (upper left), 2 (upper right), 3 (lower left) and 4 (lower right); at line m they are numbered 5, 6, 7 and 8 in the same positions.\"><line class=\"fg-edge\" x1=\"14\" y1=\"69\" x2=\"254\" y2=\"69\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"14\" y1=\"161\" x2=\"254\" y2=\"161\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"203.47\" y1=\"218\" x2=\"64.53\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"265\" y=\"73\" text-anchor=\"middle\"><tspan font-style=\"italic\">ℓ<\/tspan><\/text><text x=\"265\" y=\"165\" text-anchor=\"middle\"><tspan font-style=\"italic\">m<\/tspan><\/text><text x=\"53.53\" y=\"20\" text-anchor=\"middle\"><tspan font-style=\"italic\">t<\/tspan><\/text><text x=\"84.07\" y=\"65.48\" text-anchor=\"middle\">1<\/text><text x=\"108.61\" y=\"61.4\" text-anchor=\"middle\">2<\/text><text x=\"96.4\" y=\"84.36\" text-anchor=\"middle\">3<\/text><text x=\"122.37\" y=\"84.35\" text-anchor=\"middle\">4<\/text><text x=\"146.12\" y=\"157.48\" text-anchor=\"middle\">5<\/text><text x=\"170.66\" y=\"153.4\" text-anchor=\"middle\">6<\/text><text x=\"158.45\" y=\"176.36\" text-anchor=\"middle\">7<\/text><text x=\"184.43\" y=\"176.35\" text-anchor=\"middle\">8<\/text><\/g><\/svg>In the figure, line <i>ℓ<\/i> is parallel to line <i>m<\/i>. Which pair of angles must be supplementary?", "opts": ["∠1 and ∠8", "∠2 and ∠6", "∠4 and ∠6", "∠3 and ∠6"], "ans": 2, "sol": "∠4 and ∠6 are both between the parallel lines and on the same side of <i>t<\/i>, so they are same-side interior angles, which are supplementary.<br>∠2 and ∠6 are corresponding and ∠3 and ∠6 are alternate interior, so each pair is equal; ∠1 and ∠8 are also equal (∠1 = ∠5 = ∠8).<br>Equal angles are supplementary only if both are 90°, and these angles are not right angles.<br>Answer: <b>∠4 and ∠6<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Two parallel rails of a fence are joined by a straight diagonal brace. Two of the angles that the brace makes with the rails are same-side interior angles, with measures <i>x<\/i>° and (3<i>x<\/i> + 24)°. What is the measure of the larger of these two angles?", "opts": ["39°", "141°", "117°", "73.5°"], "ans": 1, "sol": "Same-side interior angles are supplementary: <i>x<\/i> + (3<i>x<\/i> + 24) = 180.<br>4<i>x<\/i> = 156, so <i>x<\/i> = 39.<br>The larger angle is 3(39) + 24 = 141°.<br>Answer: <b>141°<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Angles <i>A<\/i> and <i>B<\/i> form a linear pair, and angles <i>B<\/i> and <i>C<\/i> are vertical angles. If the measure of angle <i>A<\/i> is 112°, what is the measure of angle <i>C<\/i>?", "opts": ["112°", "68°", "22°", "248°"], "ans": 1, "sol": "Angles <i>A<\/i> and <i>B<\/i> add up to 180°, so angle <i>B<\/i> measures 180 − 112 = 68°.<br>Vertical angles are equal, so angle <i>C<\/i> also measures 68°.<br>Answer: <b>68°<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A garden bed is shaped like a convex pentagon. Two of its interior angles are right angles, and the other three interior angles are equal to each other. What is the measure of each of the three equal angles?", "opts": ["120°", "108°", "90°", "60°"], "ans": 0, "sol": "The interior angles of a pentagon add up to (5 − 2) · 180 = 540°.<br>The two right angles use 180°, leaving 540 − 180 = 360°.<br>Each of the three equal angles is <span class=\"fq\"><span>360<\/span><span>3<\/span><\/span> = 120°.<br>Answer: <b>120°<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "<svg class=\"fig\" viewBox=\"0 0 290 240\" role=\"img\" aria-label=\"Two horizontal parallel roads. A bike path goes from point A on the upper road down to point P between the roads, then to point B on the lower road. Both A and B are to the right of P. At A, the path makes a 42 degree angle with the part of the road to the left of A. At B, the path makes a 71 degree angle with the part of the road to the left of B. The angle APB at the bend is x degrees.\"><line class=\"fg-edge\" x1=\"14\" y1=\"48\" x2=\"264\" y2=\"48\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"14\" y1=\"192\" x2=\"264\" y2=\"192\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"167.96\" y1=\"48\" x2=\"88\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"88\" y1=\"120\" x2=\"112.79\" y2=\"192\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"167.96\" cy=\"48\" r=\"3\"/><circle cx=\"112.79\" cy=\"192\" r=\"3\"/><circle cx=\"88\" cy=\"120\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"134.36\" y=\"63.9\" text-anchor=\"middle\">42°<\/text><text x=\"93.82\" y=\"188.67\" text-anchor=\"middle\">71°<\/text><text x=\"102.67\" y=\"129.39\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan>°<\/text><text x=\"167.96\" y=\"43\" text-anchor=\"middle\"><tspan font-style=\"italic\">A<\/tspan><\/text><text x=\"112.79\" y=\"208\" text-anchor=\"middle\"><tspan font-style=\"italic\">B<\/tspan><\/text><text x=\"79.29\" y=\"120.75\" text-anchor=\"middle\"><tspan font-style=\"italic\">P<\/tspan><\/text><\/g><\/svg>Two straight roads are parallel. A bike path runs straight from point <i>A<\/i> on one road to point <i>P<\/i>, then turns and runs straight to point <i>B<\/i> on the other road, as shown. What is the value of <i>x<\/i>?", "ans": ["113"], "sol": "Through <i>P<\/i>, imagine a third line parallel to both roads. It splits the angle at <i>P<\/i> into an upper part and a lower part.<br>The upper part and the 42° angle at <i>A<\/i> are alternate interior angles, so the upper part is 42°.<br>The lower part and the 71° angle at <i>B<\/i> are alternate interior angles, so the lower part is 71°.<br><i>x<\/i> = 42 + 71 = 113.<br>Answer: <b>113<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Lines <i>ℓ<\/i> and <i>m<\/i> are parallel, with line <i>ℓ<\/i> above line <i>m<\/i>, and both are cut by transversal <i>t<\/i>. On the left side of <i>t<\/i>, the angle above line <i>ℓ<\/i> measures (5<i>x<\/i> + 6)° and the angle below line <i>m<\/i> measures (7<i>x<\/i> − 18)°. What is the measure of the angle labeled (7<i>x<\/i> − 18)°?", "opts": ["86°", "66°", "16°", "94°"], "ans": 3, "sol": "The angle above <i>m<\/i> on the left of <i>t<\/i> corresponds to the angle above <i>ℓ<\/i> on the left, so it measures (5<i>x<\/i> + 6)°. The angle below <i>m<\/i> on the left forms a linear pair with it, so the two labeled angles add up to 180°.<br>(5<i>x<\/i> + 6) + (7<i>x<\/i> − 18) = 180, so 12<i>x<\/i> = 192 and <i>x<\/i> = 16.<br>7(16) − 18 = 94.<br>Answer: <b>94°<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The sum of the interior angles of a regular polygon is 2,340°. What is the measure of each exterior angle of the polygon?", "opts": ["156°", "<span class=\"fq\"><span>360<\/span><span>13<\/span><\/span>°", "24°", "15°"], "ans": 2, "sol": "(<i>n<\/i> − 2) · 180 = 2,340, so <i>n<\/i> − 2 = 13 and <i>n<\/i> = 15.<br>Each exterior angle is <span class=\"fq\"><span>360<\/span><span>15<\/span><\/span> = 24°.<br>Answer: <b>24°<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "Polygon <i>P<\/i> is a convex polygon with <i>n<\/i> sides, and polygon <i>Q<\/i> is a convex polygon with <i>n<\/i> + 4 sides. The sum of the interior angles of <i>Q<\/i> is 1.5 times the sum of the interior angles of <i>P<\/i>. What is the value of <i>n<\/i>?", "ans": ["10"], "sol": "Sum for <i>P<\/i>: (<i>n<\/i> − 2) · 180. Sum for <i>Q<\/i>: (<i>n<\/i> + 2) · 180.<br>(<i>n<\/i> + 2) · 180 = 1.5(<i>n<\/i> − 2) · 180, so <i>n<\/i> + 2 = 1.5<i>n<\/i> − 3.<br>0.5<i>n<\/i> = 5, so <i>n<\/i> = 10.<br>Answer: <b>10<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "Angles <i>A<\/i> and <i>B<\/i> are vertical angles, and angles <i>B<\/i> and <i>C<\/i> are complementary. The measure of angle <i>A<\/i> is (2<i>k<\/i> + 6)°, and the measure of angle <i>C<\/i> is (<i>k<\/i> + 3)°. What is the measure of angle <i>A<\/i>?", "opts": ["60°", "27°", "30°", "120°"], "ans": 0, "sol": "Vertical angles are equal, so angle <i>B<\/i> also measures (2<i>k<\/i> + 6)°.<br>Angles <i>B<\/i> and <i>C<\/i> add up to 90°: (2<i>k<\/i> + 6) + (<i>k<\/i> + 3) = 90, so 3<i>k<\/i> = 81 and <i>k<\/i> = 27.<br>Angle <i>A<\/i> = 2(27) + 6 = 60°.<br>Answer: <b>60°<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "Two angles are complementary, and the measure of one angle is 80% of the measure of the other. What is the measure of the smaller angle?", "opts": ["40°", "50°", "80°", "100°"], "ans": 0, "sol": "Let the larger angle be <i>x<\/i>°. The smaller angle is 0.8<i>x<\/i>°.<br><i>x<\/i> + 0.8<i>x<\/i> = 90, so 1.8<i>x<\/i> = 90 and <i>x<\/i> = 50.<br>The smaller angle is 0.8(50) = 40°.<br>Answer: <b>40°<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "<svg class=\"fig\" viewBox=\"0 0 260 220\" role=\"img\" aria-label=\"Line l is horizontal and line m crosses it at point O, slanting up to the left. Ray OE points straight up from O, perpendicular to l, and a right-angle mark is drawn between OE and the right part of l. The angle between ray OE and the upper part of m is x degrees. The angle between the lower part of m and the right part of l is (2x plus 15) degrees.\"><line class=\"fg-edge\" x1=\"14\" y1=\"124\" x2=\"234\" y2=\"124\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"167.17\" y1=\"208\" x2=\"75.77\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"128\" y1=\"124\" x2=\"128\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"138,124 138,114 128,114\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"128\" cy=\"124\" r=\"3\"/><circle cx=\"128\" cy=\"12\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"246\" y=\"128\" text-anchor=\"middle\"><tspan font-style=\"italic\">ℓ<\/tspan><\/text><text x=\"65.77\" y=\"22\" text-anchor=\"middle\"><tspan font-style=\"italic\">m<\/tspan><\/text><text x=\"117.61\" y=\"80.14\" text-anchor=\"middle\"><tspan font-style=\"italic\">x<\/tspan>°<\/text><text x=\"168.19\" y=\"139.21\" text-anchor=\"middle\">(2<tspan font-style=\"italic\">x<\/tspan> + 15)°<\/text><text x=\"122.08\" y=\"139.69\" text-anchor=\"middle\"><tspan font-style=\"italic\">O<\/tspan><\/text><text x=\"135.91\" y=\"16.22\" text-anchor=\"middle\"><tspan font-style=\"italic\">E<\/tspan><\/text><\/g><\/svg>In the figure, line <i>ℓ<\/i> and line <i>m<\/i> intersect at point <i>O<\/i>, and ray <i>O<\/i><i>E<\/i> is perpendicular to line <i>ℓ<\/i>. What is the value of <i>x<\/i>?", "ans": ["25"], "sol": "The angle labeled (2<i>x<\/i> + 15)° is vertical to the angle between the upper part of <i>m<\/i> and the left part of <i>ℓ<\/i>, so that angle is also (2<i>x<\/i> + 15)°.<br>Together with the <i>x<\/i>° angle, it fills the right angle between ray <i>O<\/i><i>E<\/i> and the left part of <i>ℓ<\/i>: <i>x<\/i> + (2<i>x<\/i> + 15) = 90.<br>3<i>x<\/i> = 75, so <i>x<\/i> = 25.<br>Answer: <b>25<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Lines <i>ℓ<\/i> and <i>m<\/i> are parallel and are cut by transversal <i>t<\/i>. At line <i>ℓ<\/i>, one of the acute angles formed measures 71°. What is the positive difference between the measure of an obtuse angle formed at line <i>m<\/i> and the measure of an acute angle formed at line <i>m<\/i>?", "opts": ["109°", "38°", "142°", "19°"], "ans": 1, "sol": "Every acute angle formed measures 71°, and every obtuse angle measures 180 − 71 = 109°.<br>109 − 71 = 38.<br>Answer: <b>38°<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Lines <i>ℓ<\/i> and <i>m<\/i> are parallel and are cut by transversal <i>t<\/i>. Two alternate exterior angles (outside the parallel lines, on opposite sides of <i>t<\/i>) measure (6<i>x<\/i> − 25)° and (4<i>x<\/i> + 15)°. What is the measure of each of these angles?", "opts": ["85°", "20°", "19°", "95°"], "ans": 3, "sol": "Each of the two angles is vertical to an interior angle, and those two interior angles are alternate interior angles, so the two given angles are equal.<br>6<i>x<\/i> − 25 = 4<i>x<\/i> + 15, so 2<i>x<\/i> = 40 and <i>x<\/i> = 20.<br>6(20) − 25 = 95.<br>Answer: <b>95°<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "An architect is designing two rooms whose floors are convex polygons: one has 9 sides and the other has 6 sides. How much greater is the sum of the interior angles of the 9-sided floor than the sum of the interior angles of the 6-sided floor?", "opts": ["360°", "180°", "540°", "1,260°"], "ans": 2, "sol": "9 sides: (9 − 2) · 180 = 1,260°. 6 sides: (6 − 2) · 180 = 720°.<br>1,260 − 720 = 540. (Each extra side adds 180°, and 3 · 180 = 540.)<br>Answer: <b>540°<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "At each corner point of a floor tiling, two regular octagons and one other regular polygon meet, with no gaps or overlaps. How many sides does the other regular polygon have?", "opts": ["3", "6", "4", "8"], "ans": 2, "sol": "Each interior angle of a regular octagon is 180 − <span class=\"fq\"><span>360<\/span><span>8<\/span><\/span> = 135°.<br>The angles around a point add up to 360°, so the other angle is 360 − 2(135) = 90°.<br>A regular polygon with 90° angles has exterior angles of 90°, so it has <span class=\"fq\"><span>360<\/span><span>90<\/span><\/span> = 4 sides.<br>Answer: <b>4<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "Model each half of an open pair of scissors (one blade together with its handle) as a straight line through the pivot. The angle between one blade and the handle of the other half is 140° greater than the angle between the two handles. What is the angle between the two blades?", "opts": ["20°", "40°", "140°", "160°"], "ans": 0, "sol": "Let the angle between the handles be <i>x<\/i>°. The angle between the two blades is vertical to it, so it is also <i>x<\/i>°.<br>A blade and the handle of the other half form a linear pair with the angle between the handles, so that angle is (180 − <i>x<\/i>)°.<br>180 − <i>x<\/i> = <i>x<\/i> + 140, so 2<i>x<\/i> = 40 and <i>x<\/i> = 20.<br>Answer: <b>20°<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "Lines <i>ℓ<\/i> and <i>m<\/i> are cut by transversal <i>t<\/i>. Which of the following conditions is enough to conclude that <i>ℓ<\/i> is parallel to <i>m<\/i>?", "opts": ["A pair of vertical angles are equal.", "A pair of same-side interior angles are supplementary.", "A pair of alternate interior angles are supplementary.", "Two angles that form a linear pair are supplementary."], "ans": 1, "sol": "Vertical angles are always equal and a linear pair always adds up to 180°, whether or not the lines are parallel, so those conditions tell you nothing.<br>If alternate interior angles are supplementary, the lines are parallel only in the special case where both are 90°.<br>Same-side interior angles that add up to 180° force the angles at <i>ℓ<\/i> and <i>m<\/i> to match, so the lines are parallel.<br>Answer: <b>A pair of same-side interior angles are supplementary.<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "In a city, Avenue A is parallel to Avenue B, and Street C is parallel to Street D. Each avenue crosses each street. Where Avenue A crosses Street C, one of the angles formed measures 58°. What is the measure of the obtuse angle formed where Avenue B crosses Street D?", "opts": ["58°", "122°", "116°", "32°"], "ans": 1, "sol": "Avenue B is parallel to Avenue A, so Street C crosses Avenue B at the same angles as Avenue A: 58° and 122°.<br>Street D is parallel to Street C, so it crosses Avenue B at those same angles too.<br>The obtuse angle is 180 − 58 = 122°.<br>Answer: <b>122°<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "<svg class=\"fig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"Parallel lines l and m are cut by transversal t, which slants up to the left. At line l, the angle above l and left of t is (3x plus 5) degrees and the angle above l and right of t is (5x minus 25) degrees. At line m, the angle below m and left of t is (2y) degrees.\"><line class=\"fg-edge\" x1=\"14\" y1=\"69\" x2=\"254\" y2=\"69\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"14\" y1=\"161\" x2=\"254\" y2=\"161\" stroke=\"currentColor\" stroke-width=\"2\"/><line class=\"fg-edge\" x1=\"152.16\" y1=\"218\" x2=\"115.84\" y2=\"12\" stroke=\"currentColor\" stroke-width=\"2\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"265\" y=\"73\" text-anchor=\"middle\"><tspan font-style=\"italic\">ℓ<\/tspan><\/text><text x=\"265\" y=\"165\" text-anchor=\"middle\"><tspan font-style=\"italic\">m<\/tspan><\/text><text x=\"104.84\" y=\"20\" text-anchor=\"middle\"><tspan font-style=\"italic\">t<\/tspan><\/text><text x=\"93.93\" y=\"63.79\" text-anchor=\"middle\">(3<tspan font-style=\"italic\">x<\/tspan> + 5)°<\/text><text x=\"157.27\" y=\"61.8\" text-anchor=\"middle\">(5<tspan font-style=\"italic\">x<\/tspan> − 25)°<\/text><text x=\"123.87\" y=\"176.3\" text-anchor=\"middle\">(2<tspan font-style=\"italic\">y<\/tspan>)°<\/text><\/g><\/svg>In the figure, line <i>ℓ<\/i> is parallel to line <i>m<\/i>. What is the value of <i>x<\/i> + <i>y<\/i>?", "ans": ["75"], "sol": "At line <i>ℓ<\/i>, the two labeled angles form a linear pair: (3<i>x<\/i> + 5) + (5<i>x<\/i> − 25) = 180, so 8<i>x<\/i> = 200 and <i>x<\/i> = 25.<br>The angle (5<i>x<\/i> − 25)° = 100°. The angle (2<i>y<\/i>)° at <i>m<\/i> corresponds to the angle below <i>ℓ<\/i> on the left of <i>t<\/i>, which is vertical to the 100° angle, so 2<i>y<\/i> = 100 and <i>y<\/i> = 50.<br><i>x<\/i> + <i>y<\/i> = 25 + 50 = 75.<br>Answer: <b>75<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The painted lines that separate two rows of a parking lot are parallel. A straight crosswalk stripe crosses both lines, forming two alternate interior angles that measure (3<i>x<\/i> + 12)° and (5<i>x<\/i> − 20)°. What is the measure of each of these angles?", "opts": ["60°", "120°", "16°", "82.5°"], "ans": 0, "sol": "Alternate interior angles are equal: 3<i>x<\/i> + 12 = 5<i>x<\/i> − 20.<br>2<i>x<\/i> = 32, so <i>x<\/i> = 16.<br>3(16) + 12 = 60.<br>Answer: <b>60°<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 260 222\" role=\"img\" aria-label=\"A pentagon shaped like the front of a house: a rectangle-like base with a wide roof peak. The two bottom angles are marked as right angles. The two angles where the walls meet the roof are each labeled (x plus 30) degrees, and the angle at the peak is labeled 2x degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"50,196 210,196 210,108 130,86.56 50,108\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"60,196 60,186 50,186\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"210,186 200,186 200,196\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"181.17\" y=\"127.05\" text-anchor=\"middle\">(<tspan font-style=\"italic\">x<\/tspan> + 30)°<\/text><text x=\"78.83\" y=\"127.05\" text-anchor=\"middle\">(<tspan font-style=\"italic\">x<\/tspan> + 30)°<\/text><text x=\"130\" y=\"106.56\" text-anchor=\"middle\">(2<tspan font-style=\"italic\">x<\/tspan>)°<\/text><\/g><\/svg>The front of a birdhouse is the pentagon shown, in which the two bottom angles are right angles. What is the value of <i>x<\/i>?", "opts": ["30", "120", "105", "75"], "ans": 3, "sol": "The interior angles of a pentagon add up to 540°.<br>90 + 90 + (<i>x<\/i> + 30) + (<i>x<\/i> + 30) + 2<i>x<\/i> = 540, so 4<i>x<\/i> + 240 = 540.<br>4<i>x<\/i> = 300, so <i>x<\/i> = 75.<br>Answer: <b>75<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A convex polygon has one interior angle that measures 120°, and each of its other interior angles measures 160°. How many sides does the polygon have?", "opts": ["16", "24", "15", "17"], "ans": 0, "sol": "With <i>n<\/i> sides there are <i>n<\/i> − 1 angles of 160°: 120 + 160(<i>n<\/i> − 1) = (<i>n<\/i> − 2) · 180.<br>160<i>n<\/i> − 40 = 180<i>n<\/i> − 360, so 20<i>n<\/i> = 320.<br><i>n<\/i> = 16.<br>Answer: <b>16<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The interior angles of a convex hexagon, listed from smallest to largest, increase by the same amount each time. The smallest angle measures 100°. What is the measure of the largest angle?", "opts": ["120°", "148°", "160°", "140°"], "ans": 3, "sol": "The angles are 100, 100 + <i>d<\/i>, 100 + 2<i>d<\/i>, …, 100 + 5<i>d<\/i>, and they add up to (6 − 2) · 180 = 720.<br>600 + 15<i>d<\/i> = 720, so <i>d<\/i> = 8.<br>The largest angle is 100 + 5(8) = 140°.<br>Answer: <b>140°<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A square and a regular pentagon share a side and do not overlap. At one endpoint of the shared side, what is the measure of the angle between the other side of the square and the other side of the pentagon, measured outside both shapes?", "opts": ["18°", "198°", "162°", "72°"], "ans": 2, "sol": "Each interior angle of a regular pentagon is 180 − <span class=\"fq\"><span>360<\/span><span>5<\/span><\/span> = 108°, and each angle of the square is 90°.<br>The three angles at the shared vertex fill a full turn: 360 − 90 − 108 = 162.<br>Answer: <b>162°<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The sum of the interior angles of a convex polygon is 4 times the sum of its exterior angles. How many sides does the polygon have?", "opts": ["8", "6", "10", "12"], "ans": 2, "sol": "The exterior angles add up to 360°, so the interior angles add up to 4 · 360 = 1,440°.<br>(<i>n<\/i> − 2) · 180 = 1,440, so <i>n<\/i> − 2 = 8.<br><i>n<\/i> = 10.<br>Answer: <b>10<\/b>"}, {"lo": "LO1", "diff": "X", "type": "mcq", "q": "Angles 1 and 2 are supplementary, and angles 2 and 3 are complementary. The measure of angle 1 is 5 times the measure of angle 3. What is the measure of angle 2?", "opts": ["22.5°", "67.5°", "112.5°", "45°"], "ans": 1, "sol": "Let angle 2 measure <i>y<\/i>°. Then angle 1 measures (180 − <i>y<\/i>)° and angle 3 measures (90 − <i>y<\/i>)°.<br>180 − <i>y<\/i> = 5(90 − <i>y<\/i>) = 450 − 5<i>y<\/i>.<br>4<i>y<\/i> = 270, so <i>y<\/i> = 67.5.<br>Answer: <b>67.5°<\/b>"}, {"lo": "LO2", "diff": "X", "type": "spr", "q": "<svg class=\"fig\" viewBox=\"0 0 290 240\" role=\"img\" aria-label=\"Parallel lines l and m are horizontal, with l above m. Point A is on l, point B is on m and point P is between the lines, to the left of both A and B. Segments AP and PB are drawn. At A, the angle between segment AP and the part of line l to the right of A is 128 degrees. At B, the angle between segment BP and the part of line m to the right of B is 145 /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
