<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,
     objective-by-objective lesson cards in Learn mode, one-question-at-a-time quiz with an objective-wise report. */
  :root{
    --navy:#16264A; --navy-2:#1F3B6B; --gold:#C79A3E; --gold-soft:#F3E7C9;
    --paper:#FBF9F4; --paper-2:#F1EAD8; --card:#FFFFFF;
    --ink:#211E1A; --ink-soft:#655D4C; --rule:#E4DCC8;
    --success:#2E7D4F; --success-soft:#E1F2E7;
    --warn:#9A6A12; --warn-soft:#FAF0D6;
    --danger:#B5443E; --danger-soft:#FAE3E1;
    --accent-text:#1F3B6B; --focus:#1F3B6B;
    --gr-grid:#E7E0CF; --gr-axis:#5C5546; --gr-line:#2D55C4; --gr-alt:#B7801A; --gr-shade:rgba(45,85,196,.16);
    --chip-on:#1F3B6B; --chip-on-ink:#FFFFFF;
    --f-display:'Fraunces',Georgia,serif; --f-body:'Source Sans 3',-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
      --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
      --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
      --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
      --danger:#E38884; --danger-soft:#331D1B;
      --accent-text:#E0B75B; --focus:#E0B75B;
      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
    --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
    --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
    --danger:#E38884; --danger-soft:#331D1B;
    --accent-text:#E0B75B; --focus:#E0B75B;
    --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
    --chip-on:#E0B75B; --chip-on-ink:#141210;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;}
  h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.2;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
  i{font-family:var(--f-display); font-style:italic; font-weight:500;}
  .num{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
  .wrap{max-width:860px; margin:0 auto; padding-inline:16px;}

  /* header */
  header.brand{background:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%); color:#F4EFDF; padding-block:calc(18px + env(safe-area-inset-top,0px)) 22px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .crest{width:40px; height:40px; border-radius:10px; background:#C79A3E; color:#16264A; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:17px; flex-shrink:0;}
  .brand-name{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#E0B75B; font-weight:700;}
  .series-name{font-size:18px; font-weight:700; font-family:var(--f-display);}
  .series-name span{font-weight:400; font-size:14px; color:#CFD7EA; font-family:var(--f-body);}
  .crumbs{margin-top:16px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#AEB9D6; display:flex; flex-wrap:wrap; gap:4px 10px;}
  .crumbs b{color:#E0B75B; font-weight:700;}
  h1.title{font-size:clamp(26px,5vw,36px); margin-top:4px;}
  .summary{color:#D9DFEE; margin:6px 0 0; max-width:62ch;}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .meta span{font-size:13px; font-weight:700; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:99px; padding:4px 11px; color:#F4EFDF;}

  /* mode switch */
  .modebar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule);}
  .modebar .wrap{display:flex; gap:6px; align-items:center; padding-block:10px;}
  .tab{border:1.5px solid var(--rule); background:var(--card); border-radius:99px; padding:7px 18px; font-weight:700; cursor:pointer;}
  .tab[aria-selected="true"]{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .modebar .prog{margin-left:auto; font-size:13.5px; color:var(--ink-soft);}

  main{padding-block:22px 40px;}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  /* objectives overview */
  .los{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .los li{display:flex; gap:12px; align-items:flex-start;}
  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .lo-done{margin-left:auto; font-size:12.5px; color:var(--success); font-weight:700; flex-shrink:0;}

  /* lesson */
  .lesson{scroll-margin-top:70px;}
  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}
  .rules h3,.traps h3,.ex h3,.try h3{font-family:var(--f-body); font-size:13px; letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; color:var(--ink-soft);}
  .rules ul,.traps ul{margin:0; padding-left:20px;} .rules li,.traps li{margin:3px 0;}
  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}
  .spr small{color:var(--ink-soft); font-size:13.5px;}
  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}
  svg.gr{width:100%; max-width:300px; height:auto;}
  .gr-grid line{stroke:var(--gr-grid); stroke-width:1;}
  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .qhead .qn{font-family:var(--f-display); font-size:20px; font-weight:700;}
  .pill{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--paper-2); color:var(--ink-soft);}
  .pill.E{background:var(--success-soft); color:var(--success);} .pill.M{background:var(--warn-soft); color:var(--warn);} .pill.H{background:var(--danger-soft); color:var(--danger);}
  .qnav{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .chip{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--card); font:600 14px var(--f-mono); cursor:pointer;}
  .chip.ans{background:var(--paper-2); border-color:var(--ink-soft);}
  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .timer{font:600 14px var(--f-mono); color:var(--ink-soft); margin-left:auto;}
  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

<script>
(function(){
"use strict";
var S = {"id": "ALG-4.3", "unit": "Algebra", "topic": "Systems of linear equations", "title": "Systems word problems", "intro": "Many real situations involve two unknown quantities linked by two facts, such as a total count and a total value. On the DSAT you will be asked to choose the system that models a story, solve it, and explain what the solution means in context.", "los": [{"id": "LO1", "text": "Write a system of two linear equations that models a context with two unknown quantities."}, {"id": "LO2", "text": "Solve ticket, coin, price and investment systems and answer the exact quantity asked."}, {"id": "LO3", "text": "Solve mixture and rate-distance systems, including problems with wind or current."}, {"id": "LO4", "text": "Determine and interpret break-even points, intersection points and parameters of a system in context."}], "notes": [{"lo": "LO1", "h": "Two unknowns, two facts", "html": "Most systems word problems give you two unknown quantities and two separate facts about them. Start by naming each unknown with a letter and writing down what it counts, for example <i>a<\/i> = number of adult tickets. Then turn each fact into one equation.<div class=\"rule\">Count equation: (how many of type 1) + (how many of type 2) = total number.<br>Value equation: (rate 1)(amount 1) + (rate 2)(amount 2) = total value.<\/div>Here “rate” means price per item, value per coin, percent concentration, interest rate or speed. Check that both sides of each equation have the same units: count = count, dollars = dollars, liters of acid = liters of acid. If the problem says one amount is “5 more than” or “twice” another, that relationship can replace the count equation, such as <i>c<\/i> = <i>a<\/i> + 5 or <i>s<\/i> = 2<i>g<\/i>."}, {"lo": "LO1", "h": "Translating common contexts", "html": "The same two-equation pattern appears in many disguises.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Context<\/th><th>Count equation<\/th><th>Value equation<\/th><\/tr><tr><td>Tickets<\/td><td><i>a<\/i> + <i>c<\/i> = tickets sold<\/td><td>(price)<i>a<\/i> + (price)<i>c<\/i> = revenue<\/td><\/tr><tr><td>Coins<\/td><td><i>d<\/i> + <i>q<\/i> = coins<\/td><td>0.10<i>d<\/i> + 0.25<i>q<\/i> = dollars<\/td><\/tr><tr><td>Investment<\/td><td><i>x<\/i> + <i>y<\/i> = total invested<\/td><td>0.03<i>x<\/i> + 0.05<i>y<\/i> = interest<\/td><\/tr><tr><td>Mixture<\/td><td><i>x<\/i> + <i>y<\/i> = total volume<\/td><td>0.20<i>x<\/i> + 0.50<i>y<\/i> = amount of pure substance<\/td><\/tr><\/table><\/div>Write percents as decimals (6% = 0.06) and keep money in one unit, either all dollars or all cents. When you must pick a system from answer choices, test each choice against the story: does the left side really describe the quantity on the right side?"}, {"lo": "LO2", "h": "Solving and answering the question asked", "html": "Once the system is written, solve it with substitution or elimination.<ul><li><b>Substitution<\/b> works well when one equation is already solved, like <i>y<\/i> = 120 − <i>x<\/i>.<\/li><li><b>Elimination<\/b> works well when coefficients line up, or after multiplying one equation by a constant.<\/li><\/ul><div class=\"rule\">Before you bubble an answer, reread the last sentence. The question may ask for the other variable, a total, a difference or a revenue, not the first value you found.<\/div>Always check your solution in the original words: the counts must be whole numbers, the totals must match, and nothing can be negative.<div class=\"tip\">Desmos tip: type both equations using <i>x<\/i> and <i>y<\/i> (for example <i>x<\/i> + <i>y<\/i> = 95 and 6<i>x<\/i> + 11<i>y<\/i> = 790), zoom out, and tap the intersection point to read the solution.<\/div>"}, {"lo": "LO3", "h": "Mixture problems", "html": "In a mixture problem, the key quantity is the amount of pure ingredient, not the percent.<div class=\"rule\">amount of pure ingredient = (concentration as a decimal) × (amount of mixture)<\/div>Make a small table with one row per solution and one row for the final mixture.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><\/th><th>Liters<\/th><th>Concentration<\/th><th>Pure acid<\/th><\/tr><tr><td>Solution 1<\/td><td><i>x<\/i><\/td><td>0.20<\/td><td>0.20<i>x<\/i><\/td><\/tr><tr><td>Solution 2<\/td><td><i>y<\/i><\/td><td>0.50<\/td><td>0.50<i>y<\/i><\/td><\/tr><tr><td>Mixture<\/td><td>30<\/td><td>0.32<\/td><td>9.6<\/td><\/tr><\/table><\/div>The liters column adds to give one equation and the pure-acid column adds to give the other. Pure water is 0% and a pure ingredient is 100%. Never add or average the percents directly; the final percent must lie between the two starting percents, which is a quick check. Price blends (nuts, coffee) work the same way with price per pound in place of percent."}, {"lo": "LO3", "h": "Rate and distance problems", "html": "Every rate problem rests on <b>distance = rate × time<\/b>.<div class=\"rule\">With a current or wind: downstream (with) speed = <i>b<\/i> + <i>c<\/i>; upstream (against) speed = <i>b<\/i> − <i>c<\/i>, where <i>b<\/i> is the speed in still water or still air.<\/div>Common setups:<ul><li><b>Opposite directions or toward each other:<\/b> the gap changes at the sum of the speeds.<\/li><li><b>Same direction, one catching up:<\/b> both travel the same distance when they meet, so set the two distances equal.<\/li><li><b>Round trip:<\/b> the distance out equals the distance back, and the times add to the total time.<\/li><\/ul>For wind or current problems, find each speed first as distance ÷ time, then add the two equations to get 2<i>b<\/i> and subtract them to get 2<i>c<\/i>. Keep units consistent: convert minutes to hours before using a speed in miles per hour."}, {"lo": "LO4", "h": "Break-even and the intersection point", "html": "A business usually has a fixed cost plus a cost per item, and earns a price per item.<div class=\"eqs\">Cost: <i>C<\/i> = (cost per item)<i>x<\/i> + (fixed cost)<br>Revenue: <i>R<\/i> = (price)<i>x<\/i><\/div><div class=\"rule\">Break-even: <i>R<\/i> = <i>C<\/i>. Profit = <i>R<\/i> − <i>C<\/i>, so profit is 0 at break-even, negative below it and positive above it.<\/div>Each item adds (price − cost per item) to the profit, so the break-even quantity is fixed cost ÷ (price − cost per item). The same idea compares two plans, such as two phone plans or two rental companies: the intersection (<i>x<\/i>, <i>y<\/i>) means that at <i>x<\/i> units both plans give the same value <i>y<\/i>. To the right of the intersection, the plan with the smaller slope is the cheaper one.<div class=\"tip\">Desmos tip: graph <i>y<\/i> = 3.5<i>x<\/i> + 2400 and <i>y<\/i> = 11.5<i>x<\/i>, then tap where the lines cross to read the break-even point.<\/div>"}, {"lo": "LO4", "h": "Interpreting numbers and special cases", "html": "DSAT questions often ask what a number in the model means.<ul><li>A coefficient of a variable is a rate: dollars per ticket, dollars per hour, liters of acid per liter.<\/li><li>A constant term is a starting or fixed amount.<\/li><li>The solution (<i>x<\/i>, <i>y<\/i>) is the pair of values that makes both facts true at the same time.<\/li><\/ul>Special cases matter too. If two cost models have the same rate but different fixed amounts, their lines are parallel and the costs are never equal: the system has no solution. If the two equations are multiples of each other, every point works and the system has infinitely many solutions.<div class=\"rule\">For <i>a<\/i><sub>1<\/sub><i>x<\/i> + <i>b<\/i><sub>1<\/sub><i>y<\/i> = <i>c<\/i><sub>1<\/sub> and <i>a<\/i><sub>2<\/sub><i>x<\/i> + <i>b<\/i><sub>2<\/sub><i>y<\/i> = <i>c<\/i><sub>2<\/sub>: no solution when the <i>x<\/i>- and <i>y<\/i>-coefficients are in the same ratio but the constants are not.<\/div>"}], "examples": [{"lo": "LO1", "q": "A science museum sells adult tickets for $14 and child tickets for $9. On Monday it sold 120 tickets for a total of $1,430. Write a system that models this situation and find the number of child tickets sold.", "steps": ["Let <i>a<\/i> = adult tickets and <i>c<\/i> = child tickets.", "Count equation and value equation:<div class=\"eqs\"><i>a<\/i> + <i>c<\/i> = 120<br>14<i>a<\/i> + 9<i>c<\/i> = 1430<\/div>", "Substitute <i>a<\/i> = 120 − <i>c<\/i>: 14(120 − <i>c<\/i>) + 9<i>c<\/i> = 1430, so 1680 − 5<i>c<\/i> = 1430.", "Then 5<i>c<\/i> = 250, so <i>c<\/i> = 50 (and <i>a<\/i> = 70). Check: 14(70) + 9(50) = 980 + 450 = 1430."], "ans": "<i>a<\/i> + <i>c<\/i> = 120 and 14<i>a<\/i> + 9<i>c<\/i> = 1430; <b>50 child tickets<\/b>"}, {"lo": "LO2", "q": "Omar invests a total of $8,000 in two accounts. One pays 3% simple annual interest and the other pays 5%. After one year he earns $330 in interest. How much did he invest at 3%?", "steps": ["Let <i>x<\/i> = dollars at 3% and <i>y<\/i> = dollars at 5%.<div class=\"eqs\"><i>x<\/i> + <i>y<\/i> = 8000<br>0.03<i>x<\/i> + 0.05<i>y<\/i> = 330<\/div>", "Substitute <i>y<\/i> = 8000 − <i>x<\/i>: 0.03<i>x<\/i> + 400 − 0.05<i>x<\/i> = 330.", "So −0.02<i>x<\/i> = −70, giving <i>x<\/i> = 3500 and <i>y<\/i> = 4500.", "Check: 0.03(3500) + 0.05(4500) = 105 + 225 = 330."], "ans": "<b>$3,500<\/b> at 3%"}, {"lo": "LO3", "q": "A lab technician mixes a 20% acid solution with a 50% acid solution to make 30 liters of a 32% acid solution. How many liters of the 20% solution are used?", "steps": ["Let <i>x<\/i> = liters of 20% and <i>y<\/i> = liters of 50%. Pure acid in the mixture: 0.32(30) = 9.6 liters.", "<div class=\"eqs\"><i>x<\/i> + <i>y<\/i> = 30<br>0.20<i>x<\/i> + 0.50<i>y<\/i> = 9.6<\/div>", "Substitute <i>y<\/i> = 30 − <i>x<\/i>: 0.20<i>x<\/i> + 15 − 0.50<i>x<\/i> = 9.6, so −0.30<i>x<\/i> = −5.4.", "<i>x<\/i> = 18, so <i>y<\/i> = 12. Check: 3.6 + 6 = 9.6."], "ans": "<b>18 liters<\/b> of the 20% solution"}, {"lo": "LO3", "q": "A motorboat travels 48 kilometers downstream in 2 hours. The return trip upstream over the same 48 kilometers takes 3 hours. Find the speed of the boat in still water and the speed of the current.", "steps": ["Let <i>b<\/i> = boat speed in still water and <i>c<\/i> = current speed (km/h).", "Downstream speed = 48 ÷ 2 = 24; upstream speed = 48 ÷ 3 = 16.<div class=\"eqs\"><i>b<\/i> + <i>c<\/i> = 24<br><i>b<\/i> − <i>c<\/i> = 16<\/div>", "Add: 2<i>b<\/i> = 40, so <i>b<\/i> = 20. Subtract: 2<i>c<\/i> = 8, so <i>c<\/i> = 4."], "ans": "Boat <b>20 km/h<\/b>, current <b>4 km/h<\/b>"}, {"lo": "LO4", "q": "A T-shirt printer has fixed costs of $2,400 per month and spends $3.50 to print each shirt. Each shirt sells for $11.50. How many shirts must be sold to break even, and what is the profit if 450 shirts are sold?", "steps": ["Cost <i>C<\/i> = 3.5<i>x<\/i> + 2400 and revenue <i>R<\/i> = 11.5<i>x<\/i>.", "Break-even: 11.5<i>x<\/i> = 3.5<i>x<\/i> + 2400, so 8<i>x<\/i> = 2400 and <i>x<\/i> = 300.", "Profit at 450 shirts: <i>R<\/i> − <i>C<\/i> = 8(450) − 2400 = 3600 − 2400 = 1200."], "ans": "Break even at <b>300 shirts<\/b>; profit at 450 shirts is <b>$1,200<\/b>"}, {"lo": "LO4", "q": "A store sells binders for <i>b<\/i> dollars each and folders for <i>f<\/i> dollars each. A clerk records that 2 binders and 3 folders cost $18, and that 4 binders and <i>k<\/i> folders cost $30. For what value of <i>k<\/i> is it impossible for both records to be correct?<div class=\"eqs\">2<i>b<\/i> + 3<i>f<\/i> = 18<br>4<i>b<\/i> + <i>kf<\/i> = 30<\/div>", "steps": ["The records are impossible when the system has no solution: the coefficients are proportional but the constants are not.", "The <i>b<\/i>-coefficients have ratio 4 ÷ 2 = 2, so we need <i>k<\/i> ÷ 3 = 2, which gives <i>k<\/i> = 6.", "Check the constants: 30 ÷ 18 ≠ 2, so with <i>k<\/i> = 6 the lines are parallel and never meet. For any other <i>k<\/i>, there is exactly one solution."], "ans": "<i>k<\/i> = <b>6<\/b>"}], "traps": ["Answering with the variable you solved for first when the question asks for the other quantity, a total, or a difference.", "Adding or averaging percents in a mixture problem instead of tracking the amount of pure ingredient, concentration × volume.", "Mixing units, such as cents with dollars in a coin problem or minutes with miles per hour in a rate problem.", "Attaching each price or rate to the wrong variable, which gives a value equation with the coefficients swapped.", "Forgetting the fixed cost at break-even, or treating revenue as if it were profit."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A bakery sold 85 muffins and scones in all. Muffins cost $3 each and scones cost $4 each, and the sales totaled $290. If <i>m<\/i> is the number of muffins and <i>s<\/i> is the number of scones, which system models this situation?", "opts": ["<i>m<\/i> + <i>s<\/i> = 290<br>3<i>m<\/i> + 4<i>s<\/i> = 85", "<i>m<\/i> + <i>s<\/i> = 85<br>4<i>m<\/i> + 3<i>s<\/i> = 290", "<i>m<\/i> + <i>s<\/i> = 85<br>3<i>m<\/i> + 4<i>s<\/i> = 290", "<i>m<\/i> + <i>s<\/i> = 85<br><span class=\"fq\"><span><i>m<\/i><\/span><span>3<\/span><\/span> + <span class=\"fq\"><span><i>s<\/i><\/span><span>4<\/span><\/span> = 290"], "ans": 2, "sol": "The number of items adds to 85: <i>m<\/i> + <i>s<\/i> = 85.<br>Each muffin brings $3 and each scone $4, so the money adds to 3<i>m<\/i> + 4<i>s<\/i> = 290.<br>Answer: <b>C<\/b>", "hint": "One equation counts items; the other counts dollars. Which price goes with muffins?"}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "A concert sold 180 tickets. Floor tickets cost $45 and balcony tickets cost $30. Ticket sales totaled $7,350. How many floor tickets were sold?", "ans": ["130"], "sol": "Let <i>f<\/i> and <i>b<\/i> be floor and balcony tickets: <i>f<\/i> + <i>b<\/i> = 180 and 45<i>f<\/i> + 30<i>b<\/i> = 7350.<br>Substitute <i>b<\/i> = 180 − <i>f<\/i>: 45<i>f<\/i> + 5400 − 30<i>f<\/i> = 7350, so 15<i>f<\/i> = 1950.<br><i>f<\/i> = 130.<br>Answer: <b>130<\/b>", "hint": "Write <i>b<\/i> = 180 − <i>f<\/i> and put it into the money equation."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A nurse mixes <i>x<\/i> milliliters of a 10% saline solution with <i>y<\/i> milliliters of a 25% saline solution to make 60 milliliters of a 15% saline solution. How many milliliters of the 10% solution does the nurse use?", "opts": ["20", "40", "30", "45"], "ans": 1, "sol": "<i>x<\/i> + <i>y<\/i> = 60 and 0.10<i>x<\/i> + 0.25<i>y<\/i> = 0.15(60) = 9.<br>Substitute <i>y<\/i> = 60 − <i>x<\/i>: 0.10<i>x<\/i> + 15 − 0.25<i>x<\/i> = 9, so 0.15<i>x<\/i> = 6 and <i>x<\/i> = 40.<br>Answer: <b>40<\/b>", "hint": "The amount of salt in the final mixture is 15% of 60 mL. Track salt, not percents."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A food truck pays $600 in fixed costs each day. Each meal costs $4 to make and sells for $10. How many meals must the truck sell in one day to break even?", "opts": ["60", "150", "600", "100"], "ans": 3, "sol": "Cost: <i>C<\/i> = 4<i>x<\/i> + 600. Revenue: <i>R<\/i> = 10<i>x<\/i>.<br>Break-even: 10<i>x<\/i> = 4<i>x<\/i> + 600, so 6<i>x<\/i> = 600 and <i>x<\/i> = 100.<br>Answer: <b>100<\/b>", "hint": "Each meal adds (price − cost) to the profit. How many meals cover the fixed cost?"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A jar contains only dimes and quarters. There are 64 coins worth a total of $10.30. If <i>d<\/i> is the number of dimes and <i>q<\/i> is the number of quarters, which system models this situation?", "opts": ["<i>d<\/i> + <i>q<\/i> = 64<br>0.10<i>d<\/i> + 0.25<i>q<\/i> = 10.30", "<i>d<\/i> + <i>q<\/i> = 64<br>10<i>d<\/i> + 25<i>q<\/i> = 10.30", "<i>d<\/i> + <i>q<\/i> = 64<br>0.25<i>d<\/i> + 0.10<i>q<\/i> = 10.30", "<i>d<\/i> + <i>q<\/i> = 10.30<br>10<i>d<\/i> + 25<i>q<\/i> = 64"], "ans": 0, "sol": "Coins: <i>d<\/i> + <i>q<\/i> = 64.<br>Value in dollars: a dime is $0.10 and a quarter is $0.25, so 0.10<i>d<\/i> + 0.25<i>q<\/i> = 10.30. (Choice B mixes cents on the left with dollars on the right.)<br>Answer: <b>A<\/b>", "hint": "Both sides of the value equation must be in the same unit."}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "Priya invests $12,000, part at 4% simple annual interest and the rest at 7%. After one year she has earned $645 in interest. How many dollars did she invest at 7%?", "ans": ["5500"], "sol": "<i>x<\/i> + <i>y<\/i> = 12000 and 0.04<i>x<\/i> + 0.07<i>y<\/i> = 645.<br>Substitute <i>x<\/i> = 12000 − <i>y<\/i>: 480 + 0.03<i>y<\/i> = 645, so 0.03<i>y<\/i> = 165.<br><i>y<\/i> = 5500.<br>Answer: <b>5500<\/b>", "hint": "Let <i>y<\/i> be the amount at 7% so you solve directly for what is asked."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Two cyclists start from the same point at the same time and ride in opposite directions. One rides 4 miles per hour faster than the other. After 2.5 hours they are 85 miles apart. What is the speed of the slower cyclist, in miles per hour?", "opts": ["17", "15", "19", "34"], "ans": 1, "sol": "Let <i>s<\/i> and <i>f<\/i> be the speeds: <i>f<\/i> − <i>s<\/i> = 4 and 2.5<i>s<\/i> + 2.5<i>f<\/i> = 85, so <i>s<\/i> + <i>f<\/i> = 34.<br>Add the equations <i>s<\/i> + <i>f<\/i> = 34 and −<i>s<\/i> + <i>f<\/i> = 4: 2<i>f<\/i> = 38, <i>f<\/i> = 19, so <i>s<\/i> = 15.<br>Answer: <b>15<\/b>", "hint": "Moving apart, the distance between them grows at the sum of their speeds."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The monthly cost <i>C<\/i>, in dollars, of two phone plans for <i>t<\/i> minutes of calls is modeled by the system below. The solution of the system is (300, 65). What is the best interpretation of the solution?<div class=\"eqs\">Plan A: <i>C<\/i> = 35 + 0.10<i>t<\/i><br>Plan B: <i>C<\/i> = 20 + 0.15<i>t<\/i><\/div>", "opts": ["When 300 minutes are used, both plans cost $65.", "Plan A costs $300 when 65 minutes are used.", "Plan B is cheaper than Plan A for more than 300 minutes.", "When 65 minutes are used, both plans cost $300."], "ans": 0, "sol": "The first coordinate is <i>t<\/i> (minutes) and the second is <i>C<\/i> (dollars).<br>Check: 35 + 0.10(300) = 65 and 20 + 0.15(300) = 65. (Plan B has the larger rate, so it is more expensive after 300 minutes.)<br>Answer: <b>A<\/b>", "hint": "Which variable is the first coordinate, and which is the second?"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A theater sells student tickets for $8 and general tickets for $13. For one show, it sold twice as many student tickets as general tickets and collected $3,654. How many tickets were sold in all?", "ans": ["378"], "sol": "Let <i>s<\/i> = student and <i>g<\/i> = general: <i>s<\/i> = 2<i>g<\/i> and 8<i>s<\/i> + 13<i>g<\/i> = 3654.<br>Substitute: 16<i>g<\/i> + 13<i>g<\/i> = 29<i>g<\/i> = 3654, so <i>g<\/i> = 126 and <i>s<\/i> = 252.<br>Total: 126 + 252 = 378.<br>Answer: <b>378<\/b>", "hint": "“Twice as many” gives <i>s<\/i> = 2<i>g<\/i>. The question asks for the total."}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A plane flies 1,800 miles with the wind in 4 hours. Flying back against the same wind, the trip takes 5 hours. What is the speed of the wind, in miles per hour?", "opts": ["90", "405", "450", "45"], "ans": 3, "sol": "With the wind: <i>p<\/i> + <i>w<\/i> = 1800 ÷ 4 = 450. Against: <i>p<\/i> − <i>w<\/i> = 1800 ÷ 5 = 360.<br>Subtract: 2<i>w<\/i> = 90, so <i>w<\/i> = 45.<br>Answer: <b>45<\/b>", "hint": "Find the two ground speeds first. Their difference is twice the wind speed."}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A shop blends cashews that cost $12 per pound with peanuts that cost $5 per pound to make 21 pounds of a mix worth $8 per pound. If <i>c<\/i> is the pounds of cashews and <i>p<\/i> is the pounds of peanuts, which system models the blend?", "opts": ["<i>c<\/i> + <i>p<\/i> = 21<br>12<i>c<\/i> + 5<i>p<\/i> = 8", "<i>c<\/i> + <i>p<\/i> = 168<br>12<i>c<\/i> + 5<i>p<\/i> = 21", "<i>c<\/i> + <i>p<\/i> = 21<br>12<i>c<\/i> + 5<i>p<\/i> = 168", "<i>c<\/i> + <i>p<\/i> = 21<br>12<i>c<\/i> + 5<i>p<\/i> = 357"], "ans": 2, "sol": "Weight: <i>c<\/i> + <i>p<\/i> = 21.<br>Value: the blend is worth 8 × 21 = $168, so 12<i>c<\/i> + 5<i>p<\/i> = 168.<br>Answer: <b>C<\/b>", "hint": "The right side of the value equation is the total value of the whole blend, not the price per pound."}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "A company’s cost to make <i>x<\/i> speakers is <i>C<\/i> = 18<i>x<\/i> + 4500 dollars, and its revenue from selling them is <i>R<\/i> = 27<i>x<\/i> dollars. How many speakers must the company make and sell to earn a profit of $1,800?", "ans": ["700"], "sol": "Profit = <i>R<\/i> − <i>C<\/i> = 27<i>x<\/i> − 18<i>x<\/i> − 4500 = 9<i>x<\/i> − 4500.<br>Set 9<i>x<\/i> − 4500 = 1800: 9<i>x<\/i> = 6300, so <i>x<\/i> = 700.<br>Answer: <b>700<\/b>", "hint": "Profit is revenue minus cost. Set that expression equal to 1,800."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "A parking lot holds only cars and motorcycles. There are 52 vehicles with a total of 176 wheels. Each car has 4 wheels and each motorcycle has 2. If <i>c<\/i> is the number of cars and <i>m<\/i> is the number of motorcycles, which system models this situation?", "opts": ["<i>c<\/i> + <i>m<\/i> = 52<br>4<i>c<\/i> + 2<i>m<\/i> = 176", "<i>c<\/i> + <i>m<\/i> = 176<br>4<i>c<\/i> + 2<i>m<\/i> = 52", "<i>c<\/i> + <i>m<\/i> = 52<br>2<i>c<\/i> + 4<i>m<\/i> = 176", "<i>c<\/i> + <i>m<\/i> = 52<br>6(<i>c<\/i> + <i>m<\/i>) = 176"], "ans": 0, "sol": "Vehicles: <i>c<\/i> + <i>m<\/i> = 52.<br>Wheels: 4 per car and 2 per motorcycle, so 4<i>c<\/i> + 2<i>m<\/i> = 176.<br>Answer: <b>A<\/b>"}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "A car wash charges $8 for a basic wash and $14 for a deluxe wash. On Saturday it did 73 washes and took in $746. How many deluxe washes did it do?", "ans": ["27"], "sol": "<i>b<\/i> + <i>d<\/i> = 73 and 8<i>b<\/i> + 14<i>d<\/i> = 746.<br>Substitute <i>b<\/i> = 73 − <i>d<\/i>: 584 + 6<i>d<\/i> = 746, so 6<i>d<\/i> = 162 and <i>d<\/i> = 27.<br>Answer: <b>27<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A gardener mixes <i>x<\/i> liters of a 40% fertilizer solution with <i>y<\/i> liters of a 70% fertilizer solution to make 12 liters of a 50% fertilizer solution. Which equation correctly represents the amount of pure fertilizer?", "opts": ["0.40<i>x<\/i> + 0.70<i>y<\/i> = 0.50", "0.40<i>x<\/i> + 0.70<i>y<\/i> = 6", "0.40<i>x<\/i> + 0.70<i>y<\/i> = 12", "0.50<i>x<\/i> + 0.50<i>y<\/i> = 12"], "ans": 1, "sol": "The pure fertilizer in the mixture is 0.50(12) = 6 liters.<br>It comes from 0.40<i>x<\/i> and 0.70<i>y<\/i>, so 0.40<i>x<\/i> + 0.70<i>y<\/i> = 6.<br>Answer: <b>B<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A bakery’s daily cost to make <i>n<\/i> loaves is <i>C<\/i> = 1.25<i>n<\/i> + 300 dollars, and its revenue is <i>R<\/i> = 3.75<i>n<\/i> dollars. How many loaves must it sell to break even?", "opts": ["80", "240", "120", "60"], "ans": 2, "sol": "Set <i>R<\/i> = <i>C<\/i>: 3.75<i>n<\/i> = 1.25<i>n<\/i> + 300.<br>2.5<i>n<\/i> = 300, so <i>n<\/i> = 120.<br>Answer: <b>120<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "At a water park, one family paid $54 for 3 adult tickets and 2 child tickets. Another family paid $52 for 2 adult tickets and 4 child tickets. If <i>a<\/i> is the price of an adult ticket and <i>c<\/i> is the price of a child ticket, which system models this situation?", "opts": ["3<i>a<\/i> + 2<i>c<\/i> = 52<br>2<i>a<\/i> + 4<i>c<\/i> = 54", "3<i>a<\/i> + 4<i>c<\/i> = 54<br>2<i>a<\/i> + 2<i>c<\/i> = 52", "5<i>a<\/i> = 54<br>6<i>c<\/i> = 52", "3<i>a<\/i> + 2<i>c<\/i> = 54<br>2<i>a<\/i> + 4<i>c<\/i> = 52"], "ans": 3, "sol": "First family: 3 adults and 2 children cost $54, so 3<i>a<\/i> + 2<i>c<\/i> = 54.<br>Second family: 2<i>a<\/i> + 4<i>c<\/i> = 52.<br>Answer: <b>D<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Leo has 30 coins, all nickels and quarters, worth a total of $4.30. How many quarters does he have?", "opts": ["14", "16", "17", "15"], "ans": 0, "sol": "<i>n<\/i> + <i>q<\/i> = 30 and 5<i>n<\/i> + 25<i>q<\/i> = 430 (in cents).<br>Substitute <i>n<\/i> = 30 − <i>q<\/i>: 150 + 20<i>q<\/i> = 430, so <i>q<\/i> = 14.<br>Answer: <b>14<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Two trains leave stations that are 390 miles apart at the same time and travel toward each other. One train is 15 miles per hour faster than the other. They meet after 3 hours. What is the speed of the faster train, in miles per hour?", "opts": ["57.5", "65", "72.5", "130"], "ans": 2, "sol": "Together they close 390 miles in 3 hours, so <i>s<\/i> + <i>f<\/i> = 130. Also <i>f<\/i> − <i>s<\/i> = 15.<br>Add: 2<i>f<\/i> = 145, so <i>f<\/i> = 72.5.<br>Answer: <b>72.5<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "At a craft fair, a vendor sold small candles for $6 each and large candles for $9 each. The system below models the sales, where <i>x<\/i> is the number of small candles and <i>y<\/i> is the number of large candles. Which statement is true?<div class=\"eqs\"><i>x<\/i> + <i>y<\/i> = 40<br>6<i>x<\/i> + 9<i>y<\/i> = 297<\/div>", "opts": ["The vendor sold 19 small candles and 21 large candles.", "The vendor sold 21 small candles and 19 large candles.", "Small candles brought in more money than large candles.", "The vendor sold 297 candles in all."], "ans": 1, "sol": "Substitute <i>y<\/i> = 40 − <i>x<\/i>: 6<i>x<\/i> + 360 − 9<i>x<\/i> = 297, so 3<i>x<\/i> = 63 and <i>x<\/i> = 21, <i>y<\/i> = 19.<br>Small candles earned $126 and large candles earned $171, so C is false; 297 is dollars, not candles.<br>Answer: <b>B<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Rosa invests a total of $9,000 in two accounts. She puts <i>x<\/i> dollars in an account paying 2.5% simple annual interest and <i>y<\/i> dollars in an account paying 6%. She earns $400 in interest after one year. Which system models this situation?", "opts": ["<i>x<\/i> + <i>y<\/i> = 400<br>0.025<i>x<\/i> + 0.06<i>y<\/i> = 9000", "<i>x<\/i> + <i>y<\/i> = 9000<br>2.5<i>x<\/i> + 6<i>y<\/i> = 400", "<i>x<\/i> + <i>y<\/i> = 9000<br>0.025<i>x<\/i> + 0.06<i>y<\/i> = 400", "<i>x<\/i> + <i>y<\/i> = 9000<br>0.25<i>x<\/i> + 0.6<i>y<\/i> = 400"], "ans": 2, "sol": "Money invested: <i>x<\/i> + <i>y<\/i> = 9000.<br>Interest: 2.5% = 0.025 and 6% = 0.06, so 0.025<i>x<\/i> + 0.06<i>y<\/i> = 400.<br>Answer: <b>C<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "A zoo sold 64 more child tickets than adult tickets on Sunday. Adult tickets cost $22 and child tickets cost $15. Ticket sales totaled $5,400. How many adult tickets were sold?", "ans": ["120"], "sol": "<i>c<\/i> = <i>a<\/i> + 64 and 22<i>a<\/i> + 15<i>c<\/i> = 5400.<br>Substitute: 22<i>a<\/i> + 15<i>a<\/i> + 960 = 5400, so 37<i>a<\/i> = 4440 and <i>a<\/i> = 120.<br>Answer: <b>120<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A metalworker combines an alloy that is 18% silver with an alloy that is 42% silver to make 60 grams of an alloy that is 26% silver. How many grams of the 42% alloy are used?", "opts": ["40", "30", "26", "20"], "ans": 3, "sol": "<i>x<\/i> + <i>y<\/i> = 60 and 0.18<i>x<\/i> + 0.42<i>y<\/i> = 0.26(60) = 15.6.<br>Substitute <i>x<\/i> = 60 − <i>y<\/i>: 10.8 + 0.24<i>y<\/i> = 15.6, so <i>y<\/i> = 20.<br>Answer: <b>20<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "Moving company A charges $120 plus $45 per hour. Moving company B charges $60 plus $57 per hour. For how many hours of work will the two companies charge the same amount?", "ans": ["5"], "sol": "Set the costs equal: 120 + 45<i>h<\/i> = 60 + 57<i>h<\/i>.<br>60 = 12<i>h<\/i>, so <i>h<\/i> = 5 (both charge $345).<br>Answer: <b>5<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "A kayaker paddles 12 kilometers downstream in 1.5 hours and then paddles the same 12 kilometers back upstream in 3 hours. If <i>k<\/i> is the kayaker’s speed in still water and <i>c<\/i> is the speed of the current, both in kilometers per hour, which system models the trip?", "opts": ["1.5(<i>k<\/i> + <i>c<\/i>) = 12<br>3(<i>k<\/i> − <i>c<\/i>) = 12", "1.5(<i>k<\/i> − <i>c<\/i>) = 12<br>3(<i>k<\/i> + <i>c<\/i>) = 12", "<span class=\"fq\"><span><i>k<\/i> + <i>c<\/i><\/span><span>1.5<\/span><\/span> = 12<br><span class=\"fq\"><span><i>k<\/i> − <i>c<\/i><\/span><span>3<\/span><\/span> = 12", "1.5<i>k<\/i> + 3<i>c<\/i> = 12<br>3<i>k<\/i> − 1.5<i>c<\/i> = 12"], "ans": 0, "sol": "Downstream speed is <i>k<\/i> + <i>c<\/i> and takes 1.5 hours: 1.5(<i>k<\/i> + <i>c<\/i>) = 12.<br>Upstream speed is <i>k<\/i> − <i>c<\/i> and takes 3 hours: 3(<i>k<\/i> − <i>c<\/i>) = 12. (This gives <i>k<\/i> = 6, <i>c<\/i> = 2.)<br>Answer: <b>A<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A post office sold 160 stamps, some at $0.55 each and the rest at $0.75 each, for a total of $102.00. How many $0.75 stamps were sold?", "opts": ["90", "70", "80", "136"], "ans": 1, "sol": "<i>x<\/i> + <i>y<\/i> = 160 and 0.55<i>x<\/i> + 0.75<i>y<\/i> = 102.<br>Substitute <i>x<\/i> = 160 − <i>y<\/i>: 88 + 0.20<i>y<\/i> = 102, so <i>y<\/i> = 70.<br>Answer: <b>70<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Ana starts jogging along a trail at 6 miles per hour. Thirty minutes later, Ben starts from the same point and follows the same trail at 8 miles per hour. How long after Ben starts does he catch up to Ana?", "opts": ["1 hour", "2 hours", "1.5 hours", "3 hours"], "ans": 2, "sol": "Let <i>t<\/i> = Ben’s time in hours; Ana has run <i>t<\/i> + 0.5 hours. They have covered equal distances: 8<i>t<\/i> = 6(<i>t<\/i> + 0.5).<br>2<i>t<\/i> = 3, so <i>t<\/i> = 1.5.<br>Answer: <b>1.5 hours<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A startup’s monthly cost to make <i>x<\/i> units is <i>C<\/i> = 14<i>x<\/i> + 9600 dollars. It sells every unit at the same price and wants to break even at exactly 800 units. What price per unit, in dollars, should it charge?", "opts": ["12", "14", "40", "26"], "ans": 3, "sol": "At 800 units, cost = 14(800) + 9600 = 20,800.<br>Break-even requires 800<i>p<\/i> = 20,800, so <i>p<\/i> = 26.<br>Answer: <b>26<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A farm stand sells eggs in full-dozen cartons for $5 and half-dozen cartons for $3. On Saturday it sold 62 cartons holding a total of 600 eggs. If <i>d<\/i> is the number of full-dozen cartons and <i>h<\/i> is the number of half-dozen cartons, which system can be used to find <i>d<\/i> and <i>h<\/i>?", "opts": ["<i>d<\/i> + <i>h<\/i> = 62<br>12<i>d<\/i> + 6<i>h<\/i> = 600", "<i>d<\/i> + <i>h<\/i> = 62<br>5<i>d<\/i> + 3<i>h<\/i> = 600", "<i>d<\/i> + <i>h<\/i> = 600<br>12<i>d<\/i> + 6<i>h<\/i> = 62", "<i>d<\/i> + <i>h<\/i> = 62<br>6<i>d<\/i> + 12<i>h<\/i> = 600"], "ans": 0, "sol": "Cartons: <i>d<\/i> + <i>h<\/i> = 62.<br>The 600 counts eggs, not dollars: a full carton holds 12 eggs and a half carton 6, so 12<i>d<\/i> + 6<i>h<\/i> = 600. The prices are extra information.<br>Answer: <b>A<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "Marco invested money in two funds. He put $3,000 more in Fund B, which pays 5% simple annual interest, than in Fund A, which pays 8%. After one year, both funds had earned the same amount of interest. How many dollars did Marco invest in all?", "ans": ["13000"], "sol": "<i>b<\/i> = <i>a<\/i> + 3000 and 0.08<i>a<\/i> = 0.05<i>b<\/i>.<br>Substitute: 0.08<i>a<\/i> = 0.05<i>a<\/i> + 150, so 0.03<i>a<\/i> = 150 and <i>a<\/i> = 5000, <i>b<\/i> = 8000.<br>Total: 13,000.<br>Answer: <b>13000<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A mechanic mixes a 15% antifreeze solution with pure antifreeze to make 34 liters of a 40% antifreeze solution. How many liters of pure antifreeze are used?", "ans": ["10"], "sol": "<i>x<\/i> + <i>y<\/i> = 34 and 0.15<i>x<\/i> + 1.00<i>y<\/i> = 0.40(34) = 13.6, where <i>y<\/i> is pure antifreeze.<br>Substitute <i>y<\/i> = 34 − <i>x<\/i>: 0.15<i>x<\/i> + 34 − <i>x<\/i> = 13.6, so 0.85<i>x<\/i> = 20.4 and <i>x<\/i> = 24.<br><i>y<\/i> = 10.<br>Answer: <b>10<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Print shop P charges a $25 setup fee plus $0.08 per page. Print shop Q charges a $40 setup fee plus <i>r<\/i> dollars per page. The two shops charge the same amount for a 300-page job. What is the value of <i>r<\/i>?", "opts": ["0.05", "0.03", "0.13", "0.16"], "ans": 1, "sol": "Shop P for 300 pages: 25 + 0.08(300) = 49.<br>Shop Q: 40 + 300<i>r<\/i> = 49, so 300<i>r<\/i> = 9 and <i>r<\/i> = 0.03.<br>Answer: <b>0.03<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "An aquarium charges $16 for an adult ticket, and seniors pay 25% less than adults. One day the aquarium sold 210 adult and senior tickets for $3,040. If <i>a<\/i> is the number of adult tickets and <i>s<\/i> is the number of senior tickets, which system models this situation?", "opts": ["<i>a<\/i> + <i>s<\/i> = 210<br>16<i>a<\/i> + 12<i>s<\/i> = 3040", "<i>a<\/i> + <i>s<\/i> = 210<br>16<i>a<\/i> + 4<i>s<\/i> = 3040", "<i>a<\/i> + <i>s<\/i> = 210<br>12<i>a<\/i> + 16<i>s<\/i> = 3040", "<i>a<\/i> + <i>s<\/i> = 210<br>16<i>a<\/i> + 0.25<i>s<\/i> = 3040"], "ans": 0, "sol": "A senior ticket costs 16 − 0.25(16) = $12.<br>Tickets: <i>a<\/i> + <i>s<\/i> = 210; money: 16<i>a<\/i> + 12<i>s<\/i> = 3040.<br>Answer: <b>A<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "A coin bank holds only quarters and dimes. The number of dimes is 4 less than three times the number of quarters, and the coins are worth $7.30 in all. How many coins are in the bank?", "ans": ["52"], "sol": "<i>d<\/i> = 3<i>q<\/i> − 4 and 25<i>q<\/i> + 10<i>d<\/i> = 730 (cents).<br>Substitute: 25<i>q<\/i> + 30<i>q<\/i> − 40 = 730, so 55<i>q<\/i> = 770 and <i>q<\/i> = 14, <i>d<\/i> = 38.<br>Total: 14 + 38 = 52.<br>Answer: <b>52<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A jet flies 2,940 kilometers against a steady wind in 6 hours. With the same wind behind it, the jet flies 3,150 kilometers in 5 hours. What is the jet’s speed in still air, in kilometers per hour?", "opts": ["70", "490", "560", "630"], "ans": 2, "sol": "Against: <i>p<\/i> − <i>w<\/i> = 2940 ÷ 6 = 490. With: <i>p<\/i> + <i>w<\/i> = 3150 ÷ 5 = 630.<br>Add: 2<i>p<\/i> = 1120, so <i>p<\/i> = 560.<br>Answer: <b>560<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A company earns <i>R<\/i> = 42<i>x<\/i> dollars from selling <i>x<\/i> lamps, and its cost is <i>C<\/i> = 26<i>x<\/i> + 5760 dollars. What is the least number of lamps the company must sell to make a positive profit?", "opts": ["137", "222", "360", "361"], "ans": 3, "sol": "Profit = 42<i>x<\/i> − 26<i>x<\/i> − 5760 = 16<i>x<\/i> − 5760.<br>Profit is 0 at <i>x<\/i> = 360, so it is positive only for <i>x<\/i> &gt; 360. The least whole number is 361.<br>Answer: <b>361<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Lena put <i>a<\/i> dollars in a savings account paying 4% simple annual interest and <i>b<\/i> dollars in a bond paying 6%, for a total of $9,000. After one year, the bond had earned $140 more interest than the savings account. Which system models this situation?", "opts": ["<i>a<\/i> + <i>b<\/i> = 9000<br>0.04<i>a<\/i> − 0.06<i>b<\/i> = 140", "<i>a<\/i> + <i>b<\/i> = 9000<br>0.06<i>b<\/i> − 0.04<i>a<\/i> = 140", "<i>a<\/i> + <i>b<\/i> = 9000<br>0.04<i>a<\/i> + 0.06<i>b<\/i> = 140", "<i>a<\/i> + <i>b<\/i> = 9000<br>0.06<i>a<\/i> − 0.04<i>b<\/i> = 140"], "ans": 1, "sol": "Total invested: <i>a<\/i> + <i>b<\/i> = 9000.<br>Bond interest minus savings interest is 140: 0.06<i>b<\/i> − 0.04<i>a<\/i> = 140. (This gives <i>a<\/i> = 4000 and <i>b<\/i> = 5000.)<br>Answer: <b>B<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "At a stadium, a lower-level seat costs $18 more than an upper-level seat. A group paid $480 for 5 lower-level seats and 8 upper-level seats. How much would 3 lower-level seats and 2 upper-level seats cost?", "opts": ["$78", "$186", "$204", "$240"], "ans": 2, "sol": "<i>L<\/i> = <i>U<\/i> + 18 and 5<i>L<\/i> + 8<i>U<\/i> = 480.<br>Substitute: 5<i>U<\/i> + 90 + 8<i>U<\/i> = 480, so 13<i>U<\/i> = 390, <i>U<\/i> = 30 and <i>L<\/i> = 48.<br>3(48) + 2(30) = 144 + 60 = 204.<br>Answer: <b>$204<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A 40-liter tank holds a 25% cleaning solution. Some of the solution is drained and replaced with the same amount of a 70% cleaning solution, so that the tank again holds 40 liters, now at 43%. How many liters were drained and replaced?", "ans": ["16"], "sol": "Let <i>x<\/i> = liters of 25% solution left and <i>y<\/i> = liters of 70% added: <i>x<\/i> + <i>y<\/i> = 40.<br>Cleaner: 0.25<i>x<\/i> + 0.70<i>y<\/i> = 0.43(40) = 17.2. Substitute <i>x<\/i> = 40 − <i>y<\/i>: 10 + 0.45<i>y<\/i> = 17.2, so <i>y<\/i> = 16.<br>Answer: <b>16<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A shop sells notebooks for <i>n<\/i> dollars each and pens for <i>p<\/i> dollars each. A receipt shows 4 notebooks and 6 pens for $27, and a second receipt shows 6 notebooks and <i>k<\/i> pens for $40. For which value of <i>k<\/i> can both receipts NOT be correct?<div class=\"eqs\">4<i>n<\/i> + 6<i>p<\/i> = 27<br>6<i>n<\/i> + <i>kp<\/i> = 40<\/div>", "opts": ["4", "6", "9", "15"], "ans": 2, "sol": "Both receipts fail when the system has no solution: coefficients proportional, constants not.<br>The <i>n<\/i>-ratio is 6 ÷ 4 = 1.5, so <i>k<\/i> = 1.5(6) = 9.<br>Constants: 1.5(27) = 40.5 ≠ 40, so with <i>k<\/i> = 9 there is no solution.<br>Answer: <b>9<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A courier drove from a depot to a town at an average speed of 60 kilometers per hour and returned along the same road at 45 kilometers per hour. The round trip took 7 hours of driving. If <i>u<\/i> is the time, in hours, to drive to the town and <i>w<\/i> is the time to drive back, which system models the trip?", "opts": ["<i>u<\/i> + <i>w<\/i> = 7<br>60<i>u<\/i> = 45<i>w<\/i>", "<i>u<\/i> + <i>w<\/i> = 7<br>45<i>u<\/i> = 60<i>w<\/i>", "<i>u<\/i> − <i>w<\/i> = 7<br>60<i>u<\/i> = 45<i>w<\/i>", "<i>u<\/i> + <i>w<\/i> = 7<br>60<i>u<\/i> + 45<i>w<\/i> = 7"], "ans": 0, "sol": "The times add to 7: <i>u<\/i> + <i>w<\/i> = 7.<br>The distance each way is the same: 60<i>u<\/i> = 45<i>w<\/i>. (So <i>u<\/i> = 3, <i>w<\/i> = 4, and the town is 180 km away.)<br>Answer: <b>A<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "Dana invested money in two accounts, one paying 3% simple annual interest and the other paying 7%. Her interest after one year was $590. If she had switched the amounts in the two accounts, her interest would have been $510. How many dollars did Dana invest in all?", "ans": ["11000"], "sol": "Let <i>x<\/i> be at 3% and <i>y<\/i> at 7%: 0.03<i>x<\/i> + 0.07<i>y<\/i> = 590 and 0.07<i>x<\/i> + 0.03<i>y<\/i> = 510.<br>Add the equations: 0.10<i>x<\/i> + 0.10<i>y<\/i> = 1100, so <i>x<\/i> + <i>y<\/i> = 11,000.<br>Answer: <b>11000<\/b>"}, {"lo": "LO3", "diff": "X", "type": "mcq", "q": "Two boats leave the same dock at the same time on a river whose current is <i>c<\/i> kilometers per hour, with 0 &lt; <i>c<\/i> &lt; 18. One boat heads downstream and the other heads upstream, and each has a speed of 18 kilometers per hour in still water. How far apart are the boats after 2.5 hours?", "opts": ["90 km", "45 km", "90 + 5<i>c<\/i> km", "It cannot be determined without the value of <i>c<\/i>."], "ans": 0, "sol": "Downstream boat: 2.5(18 + <i>c<\/i>) km. Upstream boat: 2.5(18 − <i>c<\/i>) km, in the opposite direction.<br>Total gap: 2.5(18 + <i>c<\/i>) + 2.5(18 − <i>c<\/i>) = 2.5(36) = 90. The <i>c<\/i> terms cancel.<br>Answer: <b>90 km<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A company makes and sells one product. Its profit is a linear function of the number of units sold. When it sells 250 units, it loses $1,500. When it sells 400 units, it makes a profit of $1,200. What is the company’s fixed cost, in dollars?", "opts": ["4,500", "6,000", "7,500", "18"], "ans": 1, "sol": "Profit <i>P<\/i> = <i>mx<\/i> − <i>F<\/i>, where <i>m<\/i> is the profit per unit before fixed costs: 250<i>m<\/i> − <i>F<\/i> = −1500 and 400<i>m<\/i> − <i>F<\/i> = 1200.<br>Subtract: 150<i>m<\/i> = 2700, so <i>m<\/i> = 18. Then <i>F<\/i> = 250(18) + 1500 = 6000.<br>Answer: <b>6,000<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "A parking garage charges <i>f<\/i> dollars for the first hour and <i>h<\/i> dollars for each additional hour. A 3-hour stay costs $14.50 and a 7-hour stay costs $28.50. Which system can be used to find <i>f<\/i> and <i>h<\/i>?", "opts": ["<i>f<\/i> + 3<i>h<\/i> = 14.50<br><i>f<\/i> + 7<i>h<\/i> = 28.50", "3<i>f<\/i> + 2<i>h<\/i> = 14.50<br>7<i>f<\/i> + 6<i>h<\/i> = 28.50", "<i>f<\/i> + 2<i>h<\/i> = 14.50<br><i>f<\/i> + 6<i>h<\/i> = 28.50", "2<i>f<\/i> + <i>h<\/i> = 14.50<br>6<i>f<\/i> + <i>h<\/i> = 28.50"], "ans": 2, "sol": "A 3-hour stay is the first hour plus 2 additional hours: <i>f<\/i> + 2<i>h<\/i> = 14.50.<br>A 7-hour stay is the first hour plus 6 additional hours: <i>f<\/i> + 6<i>h<\/i> = 28.50. (So <i>h<\/i> = 3.50 and <i>f<\/i> = 7.50.)<br>Answer: <b>C<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "An outdoor music venue sold 1,500 tickets: pavilion seats at $65 each and lawn seats at $40 each. Ticket revenue was $78,500. How many more dollars came from pavilion seats than from lawn seats?", "opts": ["$20", "$17,700", "$30,400", "$48,100"], "ans": 1, "sol": "<i>x<\/i> + <i>y<\/i> = 1500 and 65<i>x<\/i> + 40<i>y<\/i> = 78,500. Substitute <i>y<\/i> = 1500 − <i>x<\/i>: 25<i>x<\/i> + 60,000 = 78,500, so <i>x<\/i> = 740 and <i>y<\/i> = 760.<br>Pavilion: 65(740) = 48,100. Lawn: 40(760) = 30,400. Difference: 17,700.<br>Answer: <b>$17,700<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Kai covered 13 miles in 2.5 hours. He jogged part of the time at 6 miles per hour and walked the rest of the time at 4 miles per hour. How many miles did Kai jog?", "opts": ["1.5", "4", "6", "9"], "ans": 3, "sol": "Let <i>j<\/i> and <i>w<\/i> be hours jogging and walking: <i>j<\/i> + <i>w<\/i> = 2.5 and 6<i>j<\/i> + 4<i>w<\/i> = 13.<br>Substitute <i>w<\/i> = 2.5 − <i>j<\/i>: 2<i>j<\/i> + 10 = 13, so <i>j<\/i> = 1.5 hours.<br>Distance jogged: 6(1.5) = 9 miles.<br>Answer: <b>9<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The values <i>V<\/i>, in dollars, of two machines <i>t<\/i> years after purchase are modeled by the system below. The solution of the system is (8, 22,400). Which statement is the best interpretation of the solution?<div class=\"eqs\">Machine A: <i>V<\/i> = 48,000 − 3,200<i>t<\/i><br>Machine B: <i>V<\/i> = 36,000 − 1,700<i>t<\/i><\/div>", "opts": ["Eight years after purchase, both machines are worth $22,400.", "Machine A loses $22,400 in value over 8 years.", "Eight years after purchase, Machine B is worth more than Machine A.", "Machine A is worth less than Machine B during the first 8 years."], "ans": 0, "sol": "At <i>t<\/i> = 8: A is 48,000 − 25,600 = 22,400 and B is 36,000 − 13,600 = 22,400.<br>So the machines have equal value, $22,400, after 8 years. Before that, A is worth more.<br>Answer: <b>A<\/b>"}, {"lo": "LO1", "diff": "X", "type": "mcq", "q": "A charity sold <i>x<\/i> mugs at $12 each and <i>y<\/i> T-shirts at $20 each, for 150 items in all and total revenue <i>R<\/i> dollars, as modeled below. The charity sold at least one mug and at least one T-shirt. Which of the following could be the value of <i>R<\/i>?<div class=\"eqs\"><i>x<\/i> + <i>y<\/i> = 150<br>12<i>x<\/i> + 20<i>y<\/i> = <i>R<\/i><\/div>", "opts": ["2,500", "3,000", "1,750", "2,000"], "ans": 3, "sol": "Substitute <i>y<\/i> = 150 − <i>x<\/i>: <i>R<\/i> = 3000 − 8<i>x<\/i>, so <i>x<\/i> = <span class=\"fq\"><span>3000 − <i>R<\/i><\/span><span>8<\/span><\/span> must be a whole number from 1 to 149.<br>2,500 gives 62.5 and 1,750 gives 156.25 (not allowed); 3,000 gives <i>x<\/i> = 0 (no mugs). 2,000 gives <i>x<\/i> = 125, <i>y<\/i> = 25.<br>Answer: <b>2,000<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "At a fair, single ride tickets cost <i>s<\/i> dollars each and books of 10 tickets cost <i>b<\/i> dollars each. Ella paid $47 for 3 books and 4 single tickets. Omar paid $69 for 5 books and 2 single tickets. How many dollars does a person save by buying one book instead of 10 single tickets?", "ans": ["7"], "sol": "3<i>b<\/i> + 4<i>s<\/i> = 47 and 5<i>b<\/i> + 2<i>s<\/i> = 69. Double the second: 10<i>b<\/i> + 4<i>s<\/i> = 138.<br>Subtract the first: 7<i>b<\/i> = 91, so <i>b<\/i> = 13 and <i>s<\/i> = 2.<br>Ten singles cost $20, so the savings is 20 − 13 = 7.<br>Answer: <b>7<\/b>"}, {"lo": "LO3", "diff": "X", "type": "spr", "q": "Solutions P and Q contain different percents of acid. Mixing 2 liters of P with 3 liters of Q gives a solution that is 28% acid. Mixing 3 liters of P with 2 liters of Q gives a solution that is 32% acid. What percent acid is solution P?", "ans": ["40"], "sol": "Let <i>p<\/i> and <i>q<\/i> be the percents. Acid: 2<i>p<\/i> + 3<i>q<\/i> = 5(28) = 140 and 3<i>p<\/i> + 2<i>q<\/i> = 5(32) = 160.<br>Add: 5(<i>p<\/i> + <i>q<\/i>) = 300, so <i>p<\/i> + <i>q<\/i> = 60. Subtract: <i>p<\/i> − <i>q<\/i> = 20.<br><i>p<\/i> = 40.<br>Answer: <b>40<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "A company’s cost to make <i>x<\/i> units is <i>C<\/i> = 12<i>x<\/i> + <i>F<\/i>, and each unit sells for <i>p<\/i> dollars. At the current price the company breaks even at 600 units. If it raised the price by $4, it would break even at 450 units. What is the value of <i>F<\/i>?", "opts": ["24", "3,600", "5,400", "7,200"], "ans": 3, "sol": "Break-even means (price − 12)(units) = <i>F<\/i>: (<i>p<\/i> − 12)(600) = <i>F<\/i> and (<i>p<\/i> − 8)(450) = <i>F<\/i>.<br>Set equal: 600<i>p<\/i> − 7200 = 450<i>p<\/i> − 3600, so 150<i>p<\/i> = 3600 and <i>p<\/i> = 24.<br><i>F<\/i> = (24 − 12)(600) = 7200.<br>Answer: <b>7,200<\/b>"}], "unit_no": 1, "topic_no": "4", "code": "4.3"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }
