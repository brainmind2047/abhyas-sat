<!DOCTYPE html>

<title>1.2 Units and unit conversion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,
     objective-by-objective lesson cards in Learn mode, one-question-at-a-time quiz with an objective-wise report. */
  :root{
    --navy:#16264A; --navy-2:#1F3B6B; --gold:#C79A3E; --gold-soft:#F3E7C9;
    --paper:#FBF9F4; --paper-2:#F1EAD8; --card:#FFFFFF;
    --ink:#211E1A; --ink-soft:#655D4C; --rule:#E4DCC8;
    --success:#2E7D4F; --success-soft:#E1F2E7;
    --warn:#9A6A12; --warn-soft:#FAF0D6;
    --danger:#B5443E; --danger-soft:#FAE3E1;
    --accent-text:#1F3B6B; --focus:#1F3B6B;
    --gr-grid:#E7E0CF; --gr-axis:#5C5546; --gr-line:#2D55C4; --gr-alt:#B7801A; --gr-shade:rgba(45,85,196,.16);
    --chip-on:#1F3B6B; --chip-on-ink:#FFFFFF;
    --f-display:'Fraunces',Georgia,serif; --f-body:'Source Sans 3',-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
      --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
      --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
      --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
      --danger:#E38884; --danger-soft:#331D1B;
      --accent-text:#E0B75B; --focus:#E0B75B;
      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;
    --paper:#141210; --paper-2:#1C1914; --card:#1C1914;
    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;
    --success:#7BC79A; --success-soft:#1B2E22; --warn:#E3B95A; --warn-soft:#33290F;
    --danger:#E38884; --danger-soft:#331D1B;
    --accent-text:#E0B75B; --focus:#E0B75B;
    --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
    --chip-on:#E0B75B; --chip-on-ink:#141210;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;}
  h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.2;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
  i{font-family:var(--f-display); font-style:italic; font-weight:500;}
  .num{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
  .wrap{max-width:860px; margin:0 auto; padding-inline:16px;}

  /* header */
  header.brand{background:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%); color:#F4EFDF; padding-block:calc(18px + env(safe-area-inset-top,0px)) 22px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .crest{width:40px; height:40px; border-radius:10px; background:#C79A3E; color:#16264A; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:17px; flex-shrink:0;}
  .brand-name{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#E0B75B; font-weight:700;}
  .series-name{font-size:18px; font-weight:700; font-family:var(--f-display);}
  .series-name span{font-weight:400; font-size:14px; color:#CFD7EA; font-family:var(--f-body);}
  .crumbs{margin-top:16px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#AEB9D6; display:flex; flex-wrap:wrap; gap:4px 10px;}
  .crumbs b{color:#E0B75B; font-weight:700;}
  h1.title{font-size:clamp(26px,5vw,36px); margin-top:4px;}
  .summary{color:#D9DFEE; margin:6px 0 0; max-width:62ch;}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .meta span{font-size:13px; font-weight:700; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:99px; padding:4px 11px; color:#F4EFDF;}

  /* mode switch */
  .modebar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule);}
  .modebar .wrap{display:flex; gap:6px; align-items:center; padding-block:10px;}
  .tab{border:1.5px solid var(--rule); background:var(--card); border-radius:99px; padding:7px 18px; font-weight:700; cursor:pointer;}
  .tab[aria-selected="true"]{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .modebar .prog{margin-left:auto; font-size:13.5px; color:var(--ink-soft);}

  main{padding-block:22px 40px;}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  /* objectives overview */
  .los{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .los li{display:flex; gap:12px; align-items:flex-start;}
  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .lo-done{margin-left:auto; font-size:12.5px; color:var(--success); font-weight:700; flex-shrink:0;}

  /* lesson */
  .lesson{scroll-margin-top:70px;}
  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}
  .rules h3,.traps h3,.ex h3,.try h3{font-family:var(--f-body); font-size:13px; letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; color:var(--ink-soft);}
  .rules ul,.traps ul{margin:0; padding-left:20px;} .rules li,.traps li{margin:3px 0;}
  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}
  .spr small{color:var(--ink-soft); font-size:13.5px;}
  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}
  svg.gr{width:100%; max-width:300px; height:auto;}
  .gr-grid line{stroke:var(--gr-grid); stroke-width:1;}
  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .qhead .qn{font-family:var(--f-display); font-size:20px; font-weight:700;}
  .pill{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--paper-2); color:var(--ink-soft);}
  .pill.E{background:var(--success-soft); color:var(--success);} .pill.M{background:var(--warn-soft); color:var(--warn);} .pill.H{background:var(--danger-soft); color:var(--danger);}
  .qnav{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .chip{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--card); font:600 14px var(--f-mono); cursor:pointer;}
  .chip.ans{background:var(--paper-2); border-color:var(--ink-soft);}
  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .timer{font:600 14px var(--f-mono); color:var(--ink-soft); margin-left:auto;}
  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

<script>
(function(){
"use strict";
var S = {"id": "PSDA-1.2", "unit": "Problem-Solving and Data Analysis", "topic": "Ratios, rates and percentages", "title": "Units and unit conversion", "intro": "Every measurement has a unit, and converting a unit means multiplying by a fraction equal to 1, such as <span class=\"fq\"><span>1,000 meters<\/span><span>1 kilometer<\/span><\/span>. On the DSAT, units appear in direct conversions, in rates such as kilometers per hour or dollars per kilogram, in density problems, and as a hidden final step in word problems where the answer must be given in a different unit from the data.", "los": [{"id": "LO1", "text": "Convert a quantity from one unit to another by multiplying by conversion factors, including chains of two or more factors."}, {"id": "LO2", "text": "Convert rates such as kilometers per hour to meters per second by converting the units in both the numerator and the denominator."}, {"id": "LO3", "text": "Solve problems involving rates with units, such as cost per item, flow rate and fuel use, by using amount = rate × time or quantity."}, {"id": "LO4", "text": "Use density (mass per unit volume) and population density (people per unit area) to find a missing mass, volume, population or area."}, {"id": "LO5", "text": "Convert square and cubic units, and interpret the units of a quantity, coefficient or expression in context."}], "notes": [{"lo": "LO1", "h": "Conversion factors equal 1", "html": "<p>A <b>conversion factor<\/b> is a fraction whose top and bottom are the same amount written in two different units, such as <span class=\"fq\"><span>1,000 m<\/span><span>1 km<\/span><\/span> or <span class=\"fq\"><span>1 km<\/span><span>1,000 m<\/span><\/span>. Because the fraction equals 1, multiplying by it changes the units without changing the size of the quantity. Choose the version that puts the unit you want to remove in the <b>denominator<\/b>, so that it cancels.<\/p><div class=\"eqs\">3.2 km × <span class=\"fq\"><span>1,000 m<\/span><span>1 km<\/span><\/span> = 3,200 m<br>4,500 g × <span class=\"fq\"><span>1 kg<\/span><span>1,000 g<\/span><\/span> = 4.5 kg<\/div><div class=\"rule\">Write the unit next to every number. Set up each factor so the old unit cancels and the new unit is left.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Prefix<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><tr><td>kilo (k)<\/td><td>1,000 times<\/td><td>1 km = 1,000 m<\/td><\/tr><tr><td>centi (c)<\/td><td>one hundredth<\/td><td>1 m = 100 cm<\/td><\/tr><tr><td>milli (m)<\/td><td>one thousandth<\/td><td>1 L = 1,000 mL<\/td><\/tr><\/table><\/div><p>Sense check: a smaller unit needs a bigger number. 3.2 km is 3,200 m, not 0.0032 m.<\/p>"}, {"lo": "LO1", "h": "Chains of conversion factors", "html": "<p>When no single fact links the two units, chain several factors. Each factor cancels one unit and brings in the next one, like stepping stones.<\/p><div class=\"eqs\">2 days × <span class=\"fq\"><span>24 h<\/span><span>1 day<\/span><\/span> × <span class=\"fq\"><span>60 min<\/span><span>1 h<\/span><\/span> × <span class=\"fq\"><span>60 s<\/span><span>1 min<\/span><\/span> = 172,800 s<\/div><p>For a conversion between customary and metric units, the question gives the facts you need, for example 1 foot = 12 inches and 1 inch = 2.54 centimeters:<\/p><div class=\"eqs\">5 ft × <span class=\"fq\"><span>12 in<\/span><span>1 ft<\/span><\/span> × <span class=\"fq\"><span>2.54 cm<\/span><span>1 in<\/span><\/span> = 152.4 cm<\/div><div class=\"rule\">Cancel the units in a chain one at a time. If a unit refuses to cancel, that factor is upside down.<\/div><div class=\"tip\">DSAT tip: the test states every conversion that is not a metric prefix or a time fact (60 seconds = 1 minute, 60 minutes = 1 hour, 24 hours = 1 day). The facts given in parentheses after a question are exactly the factors you should use.<\/div>"}, {"lo": "LO2", "h": "Converting a rate", "html": "<p>A rate such as 72 kilometers per hour is a fraction with a unit on top and a unit on the bottom: <span class=\"fq\"><span>72 km<\/span><span>1 h<\/span><\/span>. To convert it, change the top unit and the bottom unit separately, each with its own factor.<\/p><div class=\"eqs\"><span class=\"fq\"><span>72 km<\/span><span>1 h<\/span><\/span> × <span class=\"fq\"><span>1,000 m<\/span><span>1 km<\/span><\/span> × <span class=\"fq\"><span>1 h<\/span><span>3,600 s<\/span><\/span> = <span class=\"fq\"><span>72,000 m<\/span><span>3,600 s<\/span><\/span> = 20 m/s<\/div><p>Look at where the time factor goes. Hours are in the denominator of the rate, so the factor <span class=\"fq\"><span>1 h<\/span><span>3,600 s<\/span><\/span> needs hours on top to cancel them.<\/p><div class=\"rule\">km/h to m/s: multiply by 1,000 and divide by 3,600, which is the same as dividing by 3.6. m/s to km/h: multiply by 3.6.<\/div><p>Sense check: in one second you cover far less ground than in one hour, so 72 km/h becomes the smaller-looking 20 m/s. The same method works for any rate: liters per minute to liters per hour, dollars per kilogram to dollars per gram, and so on.<\/p>"}, {"lo": "LO3", "h": "Amount = rate × time", "html": "<p>Most rate problems rest on one relationship: <b>amount = rate × time<\/b>, or more generally, total = rate × number of units. The units of the rate tell you how to use it. A flow rate of 18 liters per minute for 25 minutes gives 450 liters, because the minutes cancel.<\/p><div class=\"eqs\"><span class=\"fq\"><span>18 L<\/span><span>1 min<\/span><\/span> × 25 min = 450 L<br>time = <span class=\"fq\"><span>amount<\/span><span>rate<\/span><\/span> = 900 L ÷ (18 L per min) = 50 min<\/div><p>On a line graph, the rate is the slope, measured in <i>y<\/i>-units per <i>x<\/i>-unit. In the graph below, 4 kilograms of cashews cost $80, so the rate is $20 per kilogram, and 3 kilograms cost $60.<\/p><svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line graph of cost in dollars against mass in kilograms. The line starts at (0, 0) and rises steadily to (5, 100), with marked points at (3, 60) and (4, 80).\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"102.8\" y1=\"14\" x2=\"102.8\" y2=\"192\"/><line x1=\"153.6\" y1=\"14\" x2=\"153.6\" y2=\"192\"/><line x1=\"204.4\" y1=\"14\" x2=\"204.4\" y2=\"192\"/><line x1=\"255.2\" y1=\"14\" x2=\"255.2\" y2=\"192\"/><line x1=\"306\" y1=\"14\" x2=\"306\" y2=\"192\"/><line x1=\"52\" y1=\"156.4\" x2=\"306\" y2=\"156.4\"/><line x1=\"52\" y1=\"120.8\" x2=\"306\" y2=\"120.8\"/><line x1=\"52\" y1=\"85.2\" x2=\"306\" y2=\"85.2\"/><line x1=\"52\" y1=\"49.6\" x2=\"306\" y2=\"49.6\"/><line x1=\"52\" y1=\"14\" x2=\"306\" y2=\"14\"/><\/g><line class=\"fg-axis\" x1=\"52\" y1=\"192\" x2=\"306\" y2=\"192\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"192\" x2=\"52\" y2=\"14\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" points=\"52,192 55.17,189.78 58.35,187.55 61.52,185.32 64.7,183.1 67.88,180.88 71.05,178.65 74.22,176.43 77.4,174.2 80.58,171.97 83.75,169.75 86.93,167.53 90.1,165.3 93.28,163.07 96.45,160.85 99.62,158.62 102.8,156.4 105.97,154.18 109.15,151.95 112.32,149.72 115.5,147.5 118.67,145.28 121.85,143.05 125.02,140.82 128.2,138.6 131.38,136.38 134.55,134.15 137.73,131.93 140.9,129.7 144.07,127.48 147.25,125.25 150.43,123.02 153.6,120.8 156.77,118.58 159.95,116.35 163.12,114.12 166.3,111.9 169.48,109.67 172.65,107.45 175.82,105.23 179,103 182.17,100.78 185.35,98.55 188.53,96.33 191.7,94.1 194.88,91.88 198.05,89.65 201.22,87.42 204.4,85.2 207.58,82.97 210.75,80.75 213.92,78.53 217.1,76.3 220.28,74.08 223.45,71.85 226.62,69.62 229.8,67.4 232.97,65.17 236.15,62.95 239.33,60.72 242.5,58.5 245.67,56.28 248.85,54.05 252.03,51.83 255.2,49.6 258.38,47.38 261.55,45.15 264.73,42.92 267.9,40.7 271.08,38.47 274.25,36.25 277.42,34.03 280.6,31.8 283.77,29.58 286.95,27.35 290.12,25.12 293.3,22.9 296.48,20.67 299.65,18.45 302.83,16.22 306,14\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"204.4\" cy=\"85.2\" r=\"3\"/><circle cx=\"255.2\" cy=\"49.6\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"46\" y=\"196\" text-anchor=\"end\">0<\/text><text x=\"46\" y=\"160.4\" text-anchor=\"end\">20<\/text><text x=\"46\" y=\"124.8\" text-anchor=\"end\">40<\/text><text x=\"46\" y=\"89.2\" text-anchor=\"end\">60<\/text><text x=\"46\" y=\"53.6\" text-anchor=\"end\">80<\/text><text x=\"46\" y=\"18\" text-anchor=\"end\">100<\/text><text x=\"52\" y=\"207\" text-anchor=\"middle\">0<\/text><text x=\"102.8\" y=\"207\" text-anchor=\"middle\">1<\/text><text x=\"153.6\" y=\"207\" text-anchor=\"middle\">2<\/text><text x=\"204.4\" y=\"207\" text-anchor=\"middle\">3<\/text><text x=\"255.2\" y=\"207\" text-anchor=\"middle\">4<\/text><text x=\"306\" y=\"207\" text-anchor=\"middle\">5<\/text><text x=\"179\" y=\"228\" text-anchor=\"middle\">Mass of cashews (kilograms)<\/text><text x=\"14\" y=\"103\" text-anchor=\"middle\" transform=\"rotate(-90 14 103)\">Cost (dollars)<\/text><\/g><\/svg><div class=\"rule\">Before you multiply or divide, check that the time or quantity is in the same unit as the rate. If the rate is per minute and the time is in hours, convert first.<\/div>"}, {"lo": "LO3", "h": "Fuel use and cost per item", "html": "<p>Fuel use is stated in two opposite ways, and the DSAT uses both.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Form<\/th><th>Example<\/th><th>Fuel for 360 km<\/th><\/tr><tr><td>distance per fuel<\/td><td>15 km per liter<\/td><td>360 ÷ 15 = 24 L<\/td><\/tr><tr><td>fuel per distance<\/td><td>6 L per 100 km<\/td><td>3.6 × 6 = 21.6 L<\/td><\/tr><\/table><\/div><p>With “km per liter”, <b>divide<\/b> the distance by the rate. With “liters per 100 km”, count how many blocks of 100 km the trip contains and <b>multiply<\/b>. A higher number of km per liter means a more efficient vehicle; a higher number of liters per 100 km means a less efficient one.<\/p><p>Costs work the same way. If fuel costs $1.40 per liter, then 24 liters cost 24 × $1.40 = $33.60. Unit prices such as dollars per kilogram also let you compare packages of different sizes: find each price for the same amount.<\/p><div class=\"rule\">Let the units decide: km ÷ (km per L) = L, and L × (dollars per L) = dollars.<\/div>"}, {"lo": "LO4", "h": "Density and population density", "html": "<p><b>Density<\/b> is mass per unit of volume. It measures how tightly matter is packed.<\/p><div class=\"eqs\"><i>d<\/i> = <span class=\"fq\"><span><i>m<\/i><\/span><span><i>V<\/i><\/span><\/span> &nbsp;&nbsp; <i>m<\/i> = <i>d<\/i><i>V<\/i> &nbsp;&nbsp; <i>V<\/i> = <span class=\"fq\"><span><i>m<\/i><\/span><span><i>d<\/i><\/span><\/span><\/div><p>A stone with a volume of 400 cm<sup>3<\/sup> and a mass of 1,040 g has density <span class=\"fq\"><span>1,040 g<\/span><span>400 cm<sup>3<\/sup><\/span><\/span> = 2.6 g/cm<sup>3<\/sup>. Common units are g/cm<sup>3<\/sup>, g/mL and kg/m<sup>3<\/sup>; 1 mL is the same volume as 1 cm<sup>3<\/sup>.<\/p><p><b>Population density<\/b> uses the same idea with people and area, usually people per square kilometer or per square mile.<\/p><div class=\"eqs\">population density = <span class=\"fq\"><span>population<\/span><span>area<\/span><\/span><\/div><p>A town of 52,000 people on 16 km<sup>2<\/sup> has a population density of 3,250 people per km<sup>2<\/sup>.<\/p><div class=\"rule\">Density = amount ÷ space. Multiply density by space to find the amount; divide the amount by density to find the space.<\/div><div class=\"tip\">DSAT tip: if the mass is in kilograms but the density is in grams per cm<sup>3<\/sup>, convert first so that the units match.<\/div>"}, {"lo": "LO5", "h": "Square and cubic units", "html": "<p>Area units are squares and volume units are cubes, so their conversion factors must be squared or cubed. Since 1 m = 100 cm, a square 1 m on each side is 100 cm by 100 cm.<\/p><div class=\"eqs\">1 m<sup>2<\/sup> = 100 cm × 100 cm = 10,000 cm<sup>2<\/sup><br>1 m<sup>3<\/sup> = 100 cm × 100 cm × 100 cm = 1,000,000 cm<sup>3<\/sup><\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Length<\/th><th>Area<\/th><th>Volume<\/th><\/tr><tr><td>1 m = 100 cm<\/td><td>1 m<sup>2<\/sup> = 10,000 cm<sup>2<\/sup><\/td><td>1 m<sup>3<\/sup> = 1,000,000 cm<sup>3<\/sup><\/td><\/tr><tr><td>1 km = 1,000 m<\/td><td>1 km<sup>2<\/sup> = 1,000,000 m<sup>2<\/sup><\/td><td>1 km<sup>3<\/sup> = 10<sup>9<\/sup> m<sup>3<\/sup><\/td><\/tr><tr><td>1 ft = 12 in<\/td><td>1 ft<sup>2<\/sup> = 144 in<sup>2<\/sup><\/td><td>1 ft<sup>3<\/sup> = 1,728 in<sup>3<\/sup><\/td><\/tr><tr><td>1 yd = 3 ft<\/td><td>1 yd<sup>2<\/sup> = 9 ft<sup>2<\/sup><\/td><td>1 yd<sup>3<\/sup> = 27 ft<sup>3<\/sup><\/td><\/tr><\/table><\/div><div class=\"rule\">Square the length factor for area. Cube it for volume.<\/div><p>For liquids, 1 liter = 1,000 cm<sup>3<\/sup>, so 1 m<sup>3<\/sup> = 1,000 L. A safe alternative is to convert each length first and then multiply: a rug 2 m by 1.5 m is 200 cm by 150 cm, which is 30,000 cm<sup>2<\/sup>.<\/p>"}, {"lo": "LO5", "h": "What units does the answer have?", "html": "<p>Units follow the same rules as numbers: they multiply, divide and cancel. Tracking them tells you what a quantity means and catches setup errors.<\/p><ul><li>miles ÷ hours = miles per hour (a rate)<\/li><li>(dollars per kilogram) × kilograms = dollars<\/li><li>meters × meters = square meters (an area)<\/li><li>kilometers ÷ (kilometers per hour) = hours<\/li><\/ul><p>In a model, the units of a coefficient come from the quantities around it. If <i>C<\/i> = 0.12<i>E<\/i> + 9 gives a monthly electricity bill <i>C<\/i>, in dollars, for <i>E<\/i> kilowatt-hours used, then 0.12 is in dollars per kilowatt-hour and 9 is in dollars.<\/p><div class=\"rule\">A coefficient that multiplies a variable has units of (units of the result) ÷ (units of the variable).<\/div><div class=\"tip\">DSAT tip: before you choose an answer, check which unit the question asks for. Many wrong choices are the right number in the wrong unit, such as minutes instead of hours.<\/div>"}], "examples": [{"lo": "LO1", "q": "A strip of wood trim is 18 feet long. What is its length in centimeters? (1 foot = 12 inches and 1 inch = 2.54 centimeters)", "steps": ["Chain two factors so that feet cancel and then inches cancel: 18 ft × <span class=\"fq\"><span>12 in<\/span><span>1 ft<\/span><\/span> × <span class=\"fq\"><span>2.54 cm<\/span><span>1 in<\/span><\/span>.", "Feet to inches: 18 × 12 = 216 inches.", "Inches to centimeters: 216 × 2.54 = 548.64 centimeters."], "ans": "548.64 centimeters"}, {"lo": "LO2", "q": "A train travels at a constant speed of 216 kilometers per hour. What is its speed, in meters per second?", "steps": ["Write the rate as a fraction: <span class=\"fq\"><span>216 km<\/span><span>1 h<\/span><\/span>.", "Convert the top and the bottom: <span class=\"fq\"><span>216 km<\/span><span>1 h<\/span><\/span> × <span class=\"fq\"><span>1,000 m<\/span><span>1 km<\/span><\/span> × <span class=\"fq\"><span>1 h<\/span><span>3,600 s<\/span><\/span>.", "Kilometers and hours cancel, leaving <span class=\"fq\"><span>216,000 m<\/span><span>3,600 s<\/span><\/span> = 60 m/s. (Shortcut: 216 ÷ 3.6 = 60.)"], "ans": "60 meters per second"}, {"lo": "LO3", "q": "A swimming pool holds 54,000 liters of water. A pump fills the empty pool at 120 liters per minute. How many hours does it take to fill the pool?", "steps": ["Time = amount ÷ rate, and liters ÷ (liters per minute) gives minutes: 54,000 ÷ 120 = 450 minutes.", "The question asks for hours, so convert: 450 min × <span class=\"fq\"><span>1 h<\/span><span>60 min<\/span><\/span> = 7.5 hours."], "ans": "7.5 hours"}, {"lo": "LO3", "q": "A delivery van uses 9 liters of diesel per 100 kilometers, and diesel costs $1.30 per liter. What is the fuel cost, in dollars, of a trip of 420 kilometers?", "steps": ["The trip contains 420 ÷ 100 = 4.2 blocks of 100 kilometers.", "Fuel used: 4.2 × 9 = 37.8 liters.", "Cost: 37.8 L × $1.30 per L = $49.14."], "ans": "$49.14"}, {"lo": "LO4", "q": "A block of aluminum has a mass of 1.35 kilograms. Aluminum has a density of 2.7 grams per cubic centimeter. What is the volume of the block, in cubic centimeters?", "steps": ["The density uses grams, so convert the mass first: 1.35 kg = 1,350 g.", "Volume = <span class=\"fq\"><span>mass<\/span><span>density<\/span><\/span> = 1,350 g ÷ (2.7 g per cm<sup>3<\/sup>) = 500 cm<sup>3<\/sup>."], "ans": "500 cm<sup>3<\/sup>"}, {"lo": "LO4", "q": "A district has an area of 36 square kilometers and a population density of 1,250 people per square kilometer. If 9,000 more people move into the district, what will its new population density be?", "steps": ["Current population = density × area = 1,250 × 36 = 45,000 people.", "New population = 45,000 + 9,000 = 54,000 people.", "New density = 54,000 ÷ 36 = 1,500 people per square kilometer."], "ans": "1,500 people per square kilometer"}, {"lo": "LO5", "q": "A rectangular courtyard measures 4.5 meters by 3.2 meters. What is its area, in square centimeters? (1 meter = 100 centimeters)", "steps": ["Method 1: area = 4.5 × 3.2 = 14.4 m<sup>2<\/sup>, and 1 m<sup>2<\/sup> = 100 × 100 = 10,000 cm<sup>2<\/sup>, so the area is 14.4 × 10,000 = 144,000 cm<sup>2<\/sup>.", "Method 2: convert each side first: 450 cm × 320 cm = 144,000 cm<sup>2<\/sup>.", "Using the length factor once (14.4 × 100 = 1,440) is the most common wrong answer."], "ans": "144,000 cm<sup>2<\/sup>"}], "traps": ["Using a conversion factor upside down, such as multiplying by <span class=\"fq\"><span>1 km<\/span><span>1,000 m<\/span><\/span> when you meant <span class=\"fq\"><span>1,000 m<\/span><span>1 km<\/span><\/span>. Check that the unit you are leaving cancels.", "Converting only one part of a rate: changing kilometers to meters in a speed but forgetting to change hours to seconds, or the reverse.", "Using the length factor for area or volume: 1 square meter is 10,000 square centimeters, not 100, and 1 cubic yard is 27 cubic feet, not 3.", "Dividing the wrong way with fuel rates: divide distance by km per liter, but multiply the number of 100 km blocks by liters per 100 km.", "Mixing units inside one formula, such as a mass in kilograms with a density in grams per cubic centimeter. Make the units match before you compute.", "Giving the right number in the wrong unit (minutes when hours were asked), or rounding a count of whole pieces up when only complete pieces count."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "How many meters are in 4.75 kilometers? (1 kilometer = 1,000 meters)", "opts": ["0.00475", "47.5", "475", "4,750"], "ans": 3, "sol": "Use the factor with kilometers in the denominator: 4.75 km × <span class=\"fq\"><span>1,000 m<\/span><span>1 km<\/span><\/span>.<br>4.75 × 1,000 = 4,750.<br>Answer: <b>4,750<\/b>", "hint": "A meter is smaller than a kilometer, so expect more meters than kilometers."}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "A recipe uses 2,250 grams of flour. How many kilograms of flour is this? (1 kilogram = 1,000 grams)", "opts": ["2.25", "22.5", "2,250", "2,250,000"], "ans": 0, "sol": "Use the factor with grams in the denominator: 2,250 g × <span class=\"fq\"><span>1 kg<\/span><span>1,000 g<\/span><\/span>.<br>2,250 ÷ 1,000 = 2.25.<br>Answer: <b>2.25<\/b>", "hint": "A kilogram is larger than a gram, so the number of kilograms should be smaller than 2,250."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "How many seconds are in 1.5 days?", "opts": ["2,160", "5,400", "129,600", "7,776,000"], "ans": 2, "sol": "Chain three factors: 1.5 days × <span class=\"fq\"><span>24 h<\/span><span>1 day<\/span><\/span> × <span class=\"fq\"><span>60 min<\/span><span>1 h<\/span><\/span> × <span class=\"fq\"><span>60 s<\/span><span>1 min<\/span><\/span>.<br>1.5 × 24 = 36 hours; 36 × 60 = 2,160 minutes; 2,160 × 60 = 129,600 seconds.<br>Answer: <b>129,600<\/b>", "hint": "Go from days to hours, hours to minutes, and minutes to seconds."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A car travels at a constant speed of 84 kilometers per hour. What is its speed in kilometers per minute?", "opts": ["<span class=\"fq\"><span>7<\/span><span>300<\/span><\/span>", "<span class=\"fq\"><span>5<\/span><span>7<\/span><\/span>", "1.4", "5,040"], "ans": 2, "sol": "Only the time unit changes: <span class=\"fq\"><span>84 km<\/span><span>1 h<\/span><\/span> × <span class=\"fq\"><span>1 h<\/span><span>60 min<\/span><\/span>.<br>84 ÷ 60 = 1.4.<br>Answer: <b>1.4<\/b>", "hint": "In 1 minute the car covers only a small part of the distance it covers in 1 hour. How many minutes are in an hour?"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "The graph shows the distance a runner has covered, in meters, <i>t<\/i> seconds after starting to run at a constant speed.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line graph of distance in meters against time in seconds. The line starts at (0, 0) and rises steadily to (40, 200), with marked points at (20, 100) and (40, 200).\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"115.5\" y1=\"14\" x2=\"115.5\" y2=\"192\"/><line x1=\"179\" y1=\"14\" x2=\"179\" y2=\"192\"/><line x1=\"242.5\" y1=\"14\" x2=\"242.5\" y2=\"192\"/><line x1=\"306\" y1=\"14\" x2=\"306\" y2=\"192\"/><line x1=\"52\" y1=\"147.5\" x2=\"306\" y2=\"147.5\"/><line x1=\"52\" y1=\"103\" x2=\"306\" y2=\"103\"/><line x1=\"52\" y1=\"58.5\" x2=\"306\" y2=\"58.5\"/><line x1=\"52\" y1=\"14\" x2=\"306\" y2=\"14\"/><\/g><line class=\"fg-axis\" x1=\"52\" y1=\"192\" x2=\"306\" y2=\"192\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"192\" x2=\"52\" y2=\"14\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" points=\"52,192 55.17,189.78 58.35,187.55 61.52,185.32 64.7,183.1 67.88,180.88 7 pan><span>18<\/span><\/span>", "18", "300", "18,000"], "ans": 1, "sol": "From the graph, the runner covers 100 meters in 20 seconds, so the speed is 5 meters per second.<br><span class=\"fq\"><span>5 m<\/span><span>1 s<\/span><\/span> × <span class=\"fq\"><span>1 km<\/span><span>1,000 m<\/span><\/span> × <span class=\"fq\"><span>3,600 s<\/span><span>1 h<\/span><\/span> = <span class=\"fq\"><span>18,000<\/span><span>1,000<\/span><\/span> km per hour.<br>That is 18 kilometers per hour.<br>Answer: <b>18<\/b>", "hint": "First read the speed in meters per second from a point on the line, then convert both the meters and the seconds."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A leaking faucet drips water at a constant rate of 0.05 liter per minute. How many liters of water drip from the faucet in 2 hours?", "opts": ["0.1", "3", "6", "2,400"], "ans": 2, "sol": "The rate is per minute, so convert the time: 2 hours = 120 minutes.<br>Amount = rate × time = 0.05 × 120 = 6 liters.<br>Answer: <b>6<\/b>", "hint": "The rate is per minute, but the time is in hours. Make the units match first."}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A truck uses 28 liters of diesel per 100 kilometers. How many liters of diesel does the truck use on a trip of 375 kilometers?", "ans": ["105"], "sol": "The trip contains 375 ÷ 100 = 3.75 blocks of 100 kilometers.<br>Fuel used = 3.75 × 28 = 105 liters.<br>Answer: <b>105<\/b>", "hint": "How many blocks of 100 kilometers are in 375 kilometers?"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "An electric heater uses 1,500 watts of power. Electricity costs $0.15 per kilowatt-hour, where 1 kilowatt-hour is the energy used by 1 kilowatt of power for 1 hour. What is the cost of running the heater for 40 minutes? (1 kilowatt = 1,000 watts)", "opts": ["$0.09", "$0.15", "$9.00", "$150.00"], "ans": 1, "sol": "Power: 1,500 watts = 1.5 kilowatts. Time: 40 minutes = <span class=\"fq\"><span>40<\/span><span>60<\/span><\/span> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> hour.<br>Energy = 1.5 × <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span> = 1 kilowatt-hour.<br>Cost = 1 × $0.15 = $0.15.<br>Answer: <b>$0.15<\/b>", "hint": "Convert watts to kilowatts and minutes to hours before you multiply."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A metal sample has a mass of 54 grams and a volume of 20 cubic centimeters. What is the density of the sample, in grams per cubic centimeter?", "opts": ["<span class=\"fq\"><span>10<\/span><span>27<\/span><\/span>", "2.7", "34", "1,080"], "ans": 1, "sol": "Density = <span class=\"fq\"><span>mass<\/span><span>volume<\/span><\/span> = <span class=\"fq\"><span>54 g<\/span><span>20 cm<sup>3<\/sup><\/span><\/span>.<br>54 ÷ 20 = 2.7 grams per cubic centimeter.<br>Answer: <b>2.7<\/b>", "hint": "Density is mass divided by volume. Which number goes on top?"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "A town has a population of 61,200 and a population density of 1,800 people per square kilometer. What is the area of the town, in square kilometers?", "ans": ["34"], "sol": "Population density = <span class=\"fq\"><span>population<\/span><span>area<\/span><\/span>, so area = <span class=\"fq\"><span>population<\/span><span>density<\/span><\/span>.<br>Area = 61,200 ÷ 1,800 = 34 square kilometers.<br>Answer: <b>34<\/b>", "hint": "Write population density = population ÷ area, then rearrange it to find the area."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The formula <i>M<\/i> = 1.3<i>V<\/i> gives the mass <i>M<\/i>, in kilograms, of <i>V<\/i> cubic meters of air in a room. In which units is the number 1.3 measured?", "opts": ["Kilograms per cubic meter", "Cubic meters per kilogram", "Kilograms", "Kilogram cubic meters"], "ans": 0, "sol": "The units of 1.3 must turn cubic meters into kilograms.<br>Units of 1.3 = (units of <i>M<\/i>) ÷ (units of <i>V<\/i>) = kilograms ÷ cubic meters.<br>So 1.3 is a density, in kilograms per cubic meter.<br>Answer: <b>Kilograms per cubic meter<\/b>", "hint": "The left side is in kilograms, and 1.3 multiplies a quantity in cubic meters. What must 1.3 be measured in for the units to work?"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "A storage tank holds 2.4 cubic meters of water. How many liters of water does the tank hold? (1 meter = 100 centimeters and 1 liter = 1,000 cubic centimeters)", "ans": ["2400"], "sol": "1 m<sup>3<\/sup> = 100 × 100 × 100 = 1,000,000 cm<sup>3<\/sup>.<br>2.4 m<sup>3<\/sup> = 2,400,000 cm<sup>3<\/sup>.<br>2,400,000 ÷ 1,000 = 2,400 liters.<br>Answer: <b>2,400<\/b>", "hint": "First find how many cubic centimeters are in 1 cubic meter by cubing 100."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "How many centimeters are in 6.4 meters? (1 meter = 100 centimeters)", "opts": ["64", "640", "6,400", "64,000"], "ans": 1, "sol": "6.4 m × <span class=\"fq\"><span>100 cm<\/span><span>1 m<\/span><\/span> = 640 cm.<br>Answer: <b>640<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "How many minutes are in 3.5 hours?", "ans": ["210"], "sol": "3.5 h × <span class=\"fq\"><span>60 min<\/span><span>1 h<\/span><\/span> = 210 minutes.<br>Answer: <b>210<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "A machine fills 90 bottles per minute. At this rate, how many bottles does it fill per second?", "opts": ["0.025", "<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>", "1.5", "5,400"], "ans": 2, "sol": "Only the time unit changes: <span class=\"fq\"><span>90 bottles<\/span><span>1 min<\/span><\/span> × <span class=\"fq\"><span>1 min<\/span><span>60 s<\/span><\/span>.<br>90 ÷ 60 = 1.5 bottles per second.<br>Answer: <b>1.5<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "At a price of $3.60 per kilogram, what is the cost of 2,500 grams of rice? (1 kilogram = 1,000 grams)", "opts": ["$9.00", "$90.00", "$900.00", "$9,000.00"], "ans": 0, "sol": "The price is per kilogram, so convert: 2,500 g = 2.5 kg.<br>Cost = 2.5 × $3.60 = $9.00.<br>Answer: <b>$9.00<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A piece of glass has a volume of 15 cubic centimeters and a density of 2.5 grams per cubic centimeter. What is the mass of the piece of glass, in grams?", "opts": ["6", "17.5", "37.5", "375"], "ans": 2, "sol": "Mass = density × volume.<br>Mass = 2.5 × 15 = 37.5 grams.<br>Answer: <b>37.5<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "How many square inches are in 1 square foot? (1 foot = 12 inches)", "opts": ["12", "24", "144", "1,728"], "ans": 2, "sol": "A square 1 foot on each side is 12 inches by 12 inches.<br>Its area is 12 × 12 = 144 square inches.<br>Answer: <b>144<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "How many inches are in 4.5 yards? (1 yard = 3 feet and 1 foot = 12 inches)", "opts": ["1.5", "13.5", "54", "162"], "ans": 3, "sol": "4.5 yd × <span class=\"fq\"><span>3 ft<\/span><span>1 yd<\/span><\/span> = 13.5 ft.<br>13.5 ft × <span class=\"fq\"><span>12 in<\/span><span>1 ft<\/span><\/span> = 162 in.<br>Answer: <b>162<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A conveyor belt moves at a constant speed of 45 meters per minute. What is this speed in kilometers per hour?", "opts": ["0.75", "2.7", "750", "2,700"], "ans": 1, "sol": "Convert the top and the bottom: <span class=\"fq\"><span>45 m<\/span><span>1 min<\/span><\/span> × <span class=\"fq\"><span>1 km<\/span><span>1,000 m<\/span><\/span> × <span class=\"fq\"><span>60 min<\/span><span>1 h<\/span><\/span>.<br>45 × 60 = 2,700 meters per hour, and 2,700 ÷ 1,000 = 2.7.<br>Answer: <b>2.7<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A print shop charges $0.04 per page. A customer orders 120 copies of a report that is 35 pages long. What is the total cost, in dollars, of the order?", "ans": ["168"], "sol": "Total pages = 120 × 35 = 4,200 pages.<br>Cost = 4,200 × $0.04 = $168.<br>Answer: <b>168<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The table shows the population and area of four districts.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>District<\/th><th>Population<\/th><th>Area (square kilometers)<\/th><\/tr><tr><td>P<\/td><td>72,000<\/td><td>30<\/td><\/tr><tr><td>Q<\/td><td>132,000<\/td><td>60<\/td><\/tr><tr><td>R<\/td><td>50,400<\/td><td>24<\/td><\/tr><tr><td>S<\/td><td>91,000<\/td><td>35<\/td><\/tr><\/table><\/div>Which district has the greatest population density?", "opts": ["District P", "District Q", "District R", "District S"], "ans": 3, "sol": "Population density = population ÷ area.<br>P: 72,000 ÷ 30 = 2,400; Q: 132,000 ÷ 60 = 2,200; R: 50,400 ÷ 24 = 2,100; S: 91,000 ÷ 35 = 2,600 (people per square kilometer).<br>The greatest is 2,600.<br>Answer: <b>District S<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "How many cubic feet are in 4.5 cubic yards? (1 yard = 3 feet)", "opts": ["<span class=\"fq\"><span>1<\/span><span>6<\/span><\/span>", "13.5", "40.5", "121.5"], "ans": 3, "sol": "1 cubic yard = 3 × 3 × 3 = 27 cubic feet.<br>4.5 × 27 = 121.5 cubic feet.<br>Answer: <b>121.5<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The bar graph shows the amount of fuel that each of four delivery vans used to drive the same route of 300 kilometers.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Bar graph of fuel used, in liters, by four vans: van A 24 liters, van B 20 liters, van C 28 liters and van D 32 liters.\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"52\" y1=\"172.22\" x2=\"306\" y2=\"172.22\"/><line x1=\"52\" y1=\"152.44\" x2=\"306\" y2=\"152.44\"/><line x1=\"52\" y1=\"132.67\" x2=\"306\" y2=\"132.67\"/><line x1=\"52\" y1=\"112.89\" x2=\"306\" y2=\"112.89\"/><line x1=\"52\" y1=\"93.11\" x2=\"306\" y2=\"93.11\"/><line x1=\"52\" y1=\"73.33\" x2=\"306\" y2=\"73.33\"/><line x1=\"52\" y1=\"53.56\" x2=\"306\" y2=\"53.56\"/><line x1=\"52\" y1=\"33.78\" x2=\"306\" y2=\"33.78\"/><line x1=\"52\" y1=\"14\" x2=\"306\" y2=\"14\"/><\/g><rect class=\"fg-shape\" x=\"65.97\" y=\"73.33\" width=\"35.56\" height=\"118.67\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"129.47\" y=\"93.11\" width=\"35.56\" height=\"98.89\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"192.97\" y=\"53.56\" width=\"35.56\" height=\"138.44\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect class=\"fg-shape\" x=\"256.47\" y=\"33.78\" width=\"35.56\" height=\"158.22\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"192\" x2=\"306\" y2=\"192\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"52\" y1=\"192\" x2=\"52\" y2=\"14\" stroke=\"currentColor\" stroke-width=\"1.5\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"46\" y=\"196\" text-anchor=\"end\">0<\/text><text x=\"46\" y=\"176.22\" text-anchor=\"end\">4<\/text><text x=\"46\" y=\"156.44\" text-anchor=\"end\">8<\/text><text x=\"46\" y=\"136.67\" text-anchor=\"end\">12<\/text><text x=\"46\" y=\"116.89\" text-anchor=\"end\">16<\/text><text x=\"46\" y=\"97.11\" text-anchor=\"end\">20<\/text><text x=\"46\" y=\"77.33\" text-anchor=\"end\">24<\/text><text x=\"46\" y=\"57.56\" text-anchor=\"end\">28<\/text><text x=\"46\" y=\"37.78\" text-anchor=\"end\">32<\/text><text x=\"46\" y=\"18\" text-anchor=\"end\">36<\/text><text x=\"83.75\" y=\"207\" text-anchor=\"middle\">A<\/text><text x=\"147.25\" y=\"207\" text-anchor=\"middle\">B<\/text><text x=\"210.75\" y=\"207\" text-anchor=\"middle\">C<\/text><text x=\"274.25\" y=\"207\" text-anchor=\"middle\">D<\/text><text x=\"179\" y=\"228\" text-anchor=\"middle\">Van<\/text><text x=\"14\" y=\"103\" text-anchor=\"middle\" transform=\"rotate(-90 14 103)\">Fuel used (liters)<\/text><\/g><\/svg>Which van used fuel at a rate of 8 liters per 100 kilometers?", "opts": ["Van A", "Van B", "Van C", "Van D"], "ans": 0, "sol": "The route contains 300 ÷ 100 = 3 blocks of 100 kilometers.<br>At 8 liters per 100 kilometers, a van would use 3 × 8 = 24 liters.<br>Van A used 24 liters. (The others: B 20, C 28, D 32 liters.)<br>Answer: <b>Van A<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A motorcycle travels 35 kilometers per liter of fuel, and fuel costs $1.50 per liter. What is the fuel cost of a trip of 455 kilometers?", "opts": ["$13.00", "$19.50", "$52.50", "$682.50"], "ans": 1, "sol": "Fuel used = 455 km ÷ (35 km per L) = 13 liters.<br>Cost = 13 × $1.50 = $19.50.<br>Answer: <b>$19.50<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "Gold has a density of 19.3 grams per cubic centimeter. What is the mass, in kilograms, of a gold bar with a volume of 250 cubic centimeters? (1 kilogram = 1,000 grams)", "ans": ["4.825"], "sol": "Mass = density × volume = 19.3 × 250 = 4,825 grams.<br>4,825 g ÷ 1,000 = 4.825 kg.<br>Answer: <b>4.825<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The equation <i>F<\/i> = 48 − 3.2<i>t<\/i> gives the amount of fuel <i>F<\/i>, in liters, left in a generator’s tank <i>t<\/i> hours after the generator starts running. What is the best interpretation of 3.2 in this context?", "opts": ["The generator uses fuel at a rate of 3.2 liters per hour.", "The tank becomes empty after 3.2 hours.", "The tank holds 3.2 liters of fuel when the generator starts.", "The generator uses fuel at a rate of 3.2 hours per liter."], "ans": 0, "sol": "3.2 multiplies <i>t<\/i> (hours), and the result is in liters, so 3.2 is in liters per hour.<br>Each hour, <i>F<\/i> decreases by 3.2, so the generator uses 3.2 liters of fuel per hour.<br>Answer: <b>The generator uses fuel at a rate of 3.2 liters per hour.<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "How many whole pieces of tape, each 25 centimeters long, can be cut from a roll of 150 feet of tape? (1 foot = 12 inches and 1 inch = 2.54 centimeters)", "opts": ["72", "182", "183", "4,572"], "ans": 1, "sol": "150 ft × <span class=\"fq\"><span>12 in<\/span><span>1 ft<\/span><\/span> × <span class=\"fq\"><span>2.54 cm<\/span><span>1 in<\/span><\/span> = 4,572 cm.<br>4,572 ÷ 25 = 182.88.<br>Only complete pieces count, so round down to 182.<br>Answer: <b>182<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "Water flows from a pump at a constant rate of 0.5 liter per second. What is this rate in cubic meters per hour? (1 cubic meter = 1,000 liters)", "ans": ["1.8", "9/5"], "sol": "Per hour: 0.5 L per s × 3,600 s per h = 1,800 liters per hour.<br>In cubic meters: 1,800 ÷ 1,000 = 1.8 cubic meters per hour.<br>Answer: <b>1.8<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A rooftop tank can hold 1,200 liters of water and now contains 150 liters. A pump adds water at 24 liters per minute while a leak lets water out at 9 liters per minute. If both rates stay constant, how long will it take for the tank to become full?", "opts": ["31.8 minutes", "43.75 minutes", "1 hour 10 minutes", "1 hour 20 minutes"], "ans": 2, "sol": "The tank needs 1,200 − 150 = 1,050 more liters.<br>Net rate = 24 − 9 = 15 liters per minute.<br>Time = 1,050 ÷ 15 = 70 minutes = 1 hour 10 minutes.<br>Answer: <b>1 hour 10 minutes<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A solid cube has edges of length 20 centimeters and a mass of 5.6 kilograms. What is the density of the cube, in kilograms per cubic meter? (1 meter = 100 centimeters)", "opts": ["0.7", "28", "140", "700"], "ans": 3, "sol": "Edge = 20 cm = 0.2 m, so volume = 0.2 × 0.2 × 0.2 = 0.008 cubic meter.<br>Density = 5.6 ÷ 0.008 = 700 kilograms per cubic meter.<br>Answer: <b>700<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "A rectangular floor measures 5.4 meters by 3.6 meters. It will be covered, with no gaps or overlaps, by square tiles that are 30 centimeters on each side. How many tiles are needed? (1 meter = 100 centimeters)", "ans": ["216"], "sol": "Convert to centimeters: the floor is 540 cm by 360 cm.<br>Tiles along each side: 540 ÷ 30 = 18 and 360 ÷ 30 = 12.<br>Number of tiles = 18 × 12 = 216.<br>Answer: <b>216<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "How many milligrams are in 0.45 kilogram? (1 kilogram = 1,000 grams and 1 gram = 1,000 milligrams)", "opts": ["450", "4,500", "45,000", "450,000"], "ans": 3, "sol": "0.45 kg × <span class=\"fq\"><span>1,000 g<\/span><span>1 kg<\/span><\/span> = 450 g.<br>450 g × <span class=\"fq\"><span>1,000 mg<\/span><span>1 g<\/span><\/span> = 450,000 mg.<br>Answer: <b>450,000<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A rate of 1.4 centimeters per week is equivalent to how many millimeters per day? (1 centimeter = 10 millimeters)", "opts": ["2", "9.8", "14", "98"], "ans": 0, "sol": "Top: 1.4 cm = 14 mm, so the rate is 14 millimeters per week.<br>Bottom: 1 week = 7 days, so 14 ÷ 7 = 2 millimeters per day.<br>Answer: <b>2<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A pump fills a tank at a constant rate. The graph shows the volume of water in the tank, in liters, <i>t<\/i> minutes after the pump is switched on.<svg class=\"fig\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Line graph of volume of water in liters against time in minutes. The line starts at (0, 50) and rises steadily to (10, 350), with marked points at (0, 50), (5, 200) and (10, 350).\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"77.4\" y1=\"14\" x2=\"77.4\" y2=\"192\"/><line x1=\"102.8\" y1=\"14\" x2=\"102.8\" y2=\"192\"/><line x1=\"128.2\" y1=\"14\" x2=\"128.2\" y2=\"192\"/><line x1=\"153.6\" y1=\"14\" x2=\"153.6\" y2=\"192\"/><line x1=\"179\" y1=\"14\" x2=\"179\" y2=\"192\"/><line x1=\"204.4\" y1=\"14\" x2=\"204.4\" y2=\"192\"/><line x1=\"229.8\" y1=\"14\" x2=\"229.8\" y2=\"192\"/><line x1=\"255.2\" y1=\"14\" x2=\"255.2\" y2=\"192\"/><line x1=\"280.6\" y1=\"14\" x2=\"280.6\" y2=\"192\"/><lin 3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"46\" y=\"196\" text-anchor=\"end\">0<\/text><text x=\"46\" y=\"173.75\" text-anchor=\"end\">50<\/text><text x=\"46\" y=\"151.5\" text-anchor=\"end\">100<\/text><text x=\"46\" y=\"129.25\" text-anchor=\"end\">150<\/text><text x=\"46\" y=\"107\" text-anchor=\"end\">200<\/text><text x=\"46\" y=\"84.75\" text-anchor=\"end\">250<\/text><text x=\"46\" y=\"62.5\" text-anchor=\"end\">300<\/text><text x=\"46\" y=\"40.25\" text-anchor=\"end\">350<\/text><text x=\"46\" y=\"18\" text-anchor=\"end\">400<\/text><text x=\"52\" y=\"207\" text-anchor=\"middle\">0<\/text><text x=\"77.4\" y=\"207\" text-anchor=\"middle\">1<\/text><text x=\"102.8\" y=\"207\" text-anchor=\"middle\">2<\/text><text x=\"128.2\" y=\"207\" text-anchor=\"middle\">3<\/text><text x=\"153.6\" y=\"207\" text-anchor=\"middle\">4<\/text><text x=\"179\" y=\"207\" text-anchor=\"middle\">5<\/text><text x=\"204.4\" y=\"207\" text-anchor=\"middle\">6<\/text><text x=\"229.8\" y=\"207\" text-anchor=\"middle\">7<\/text><text x=\"255.2\" y=\"207\" text-anchor=\"middle\">8<\/text><text x=\"280.6\" y=\"207\" text-anchor=\"middle\">9<\/text><text x=\"306\" y=\"207\" text-anchor=\"middle\">10<\/text><text x=\"179\" y=\"228\" text-anchor=\"middle\">Time (minutes)<\/text><text x=\"14\" y=\"103\" text-anchor=\"middle\" transform=\"rotate(-90 14 103)\">Volume (liters)<\/text><\/g><\/svg>At what rate does the pump fill the tank, in liters per second?", "opts": ["0.5", "<span class=\"fq\"><span>7<\/span><span>12<\/span><\/span>", "30", "1,800"], "ans": 0, "sol": "From (0, 50) to (10, 350), the volume rises 300 liters in 10 minutes: 30 liters per minute.<br>Per second: 30 ÷ 60 = 0.5 liter per second.<br>Answer: <b>0.5<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The table shows the mass and volume of four samples. A sample floats in water if its density is less than 1 gram per cubic centimeter.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Sample<\/th><th>Mass (grams)<\/th><th>Volume (cubic centimeters)<\/th><\/tr><tr><td>A<\/td><td>120<\/td><td>100<\/td><\/tr><tr><td>B<\/td><td>80<\/td><td>64<\/td><\/tr><tr><td>C<\/td><td>450<\/td><td>500<\/td><\/tr><tr><td>D<\/td><td>270<\/td><td>200<\/td><\/tr><\/table><\/div>Which sample floats in water?", "opts": ["Sample A", "Sample B", "Sample C", "Sample D"], "ans": 2, "sol": "Density = mass ÷ volume.<br>A: 120 ÷ 100 = 1.2; B: 80 ÷ 64 = 1.25; C: 450 ÷ 500 = 0.9; D: 270 ÷ 200 = 1.35 (grams per cubic centimeter).<br>Only sample C has a density less than 1.<br>Answer: <b>Sample C<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "In the expression <span class=\"fq\"><span><i>d<\/i><\/span><span><i>r<\/i><\/span><\/span>, <i>d<\/i> is a distance in kilometers and <i>r<\/i> is a speed in kilometers per hour. In which units is the value of <span class=\"fq\"><span><i>d<\/i><\/span><span><i>r<\/i><\/span><\/span> measured?", "opts": ["Kilometers per hour", "Square kilometers per hour", "Hours per kilometer", "Hours"], "ans": 3, "sol": "Divide the units: km ÷ <span class=\"fq\"><span>km<\/span><span>h<\/span><\/span> = km × <span class=\"fq\"><span>h<\/span><span>km<\/span><\/span>.<br>Kilometers cancel, leaving hours. (Distance ÷ speed = time.)<br>Answer: <b>Hours<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "How many inches are equal to 127 centimeters? (1 inch = 2.54 centimeters)", "opts": ["5", "50", "124.46", "322.58"], "ans": 1, "sol": "Put centimeters in the denominator: 127 cm × <span class=\"fq\"><span>1 in<\/span><span>2.54 cm<\/span><\/span>.<br>127 ÷ 2.54 = 50.<br>Answer: <b>50<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "An object’s speed is <i>v<\/i> meters per second. Which expression gives the object’s speed in kilometers per hour?", "opts": ["<span class=\"fq\"><span><i>v<\/i><\/span><span>3.6<\/span><\/span>", "60<i>v<\/i>", "3.6<i>v<\/i>", "3,600<i>v<\/i>"], "ans": 2, "sol": "<span class=\"fq\"><span><i>v<\/i> m<\/span><span>1 s<\/span><\/span> × <span class=\"fq\"><span>1 km<\/span><span>1,000 m<\/span><\/span> × <span class=\"fq\"><span>3,600 s<\/span><span>1 h<\/span><\/span> = <span class=\"fq\"><span>3,600<i>v<\/i><\/span><span>1,000<\/span><\/span> km per hour.<br><span class=\"fq\"><span>3,600<\/span><span>1,000<\/span><\/span> = 3.6, so the speed is 3.6<i>v<\/i> kilometers per hour.<br>Answer: <b>3.6<i>v<\/i><\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "A car’s fuel tank holds 45 liters when full, and the car uses 7.5 liters of fuel per 100 kilometers. The car starts with a full tank. How many kilometers can it travel before only 6 liters of fuel are left in the tank?", "ans": ["520"], "sol": "Fuel available to use = 45 − 6 = 39 liters.<br>Each 100 kilometers uses 7.5 liters, so 39 ÷ 7.5 = 5.2 blocks of 100 kilometers.<br>Distance = 5.2 × 100 = 520 kilometers.<br>Answer: <b>520<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Town A has an area of 18 square kilometers and a population density of 2,200 people per square kilometer. Town B has an area of 12 square kilometers and a population density of 3,100 people per square kilometer. The two towns are combined into one district. What is the population density of the district, in people per square kilometer?", "opts": ["2,560", "2,650", "2,740", "5,300"], "ans": 0, "sol": "Populations: A has 2,200 × 18 = 39,600 and B has 3,100 × 12 = 37,200.<br>Total population = 76,800; total area = 18 + 12 = 30 square kilometers.<br>Density = 76,800 ÷ 30 = 2,560. (Averaging 2,200 and 3,100 ignores the different areas.)<br>Answer: <b>2,560<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A box in the shape of a rectangular prism measures 0.4 meter by 0.3 meter by 0.2 meter. What is the volume of the box, in liters? (1 meter = 100 centimeters and 1 liter = 1,000 cubic centimeters)", "opts": ["2.4", "24", "240", "24,000"], "ans": 1, "sol": "In centimeters the box is 40 cm by 30 cm by 20 cm.<br>Volume = 40 × 30 × 20 = 24,000 cm<sup>3<\/sup>.<br>24,000 ÷ 1,000 = 24 liters.<br>Answer: <b>24<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "How many feet are in 1.25 miles? (1 mile = 8 furlongs, 1 furlong = 220 yards and 1 yard = 3 feet)", "opts": ["825", "2,200", "5,280", "6,600"], "ans": 3, "sol": "1.25 mi × <span class=\"fq\"><span>8 furlongs<\/span><span>1 mi<\/span><\/span> = 10 furlongs.<br>10 furlongs × <span class=\"fq\"><span>220 yd<\/span><span>1 furlong<\/span><\/span> = 2,200 yd.<br>2,200 yd × <span class=\"fq\"><span>3 ft<\/span><span>1 yd<\/span><\/span> = 6,600 ft.<br>Answer: <b>6,600<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A rate of 2.5 milligrams per minute is equivalent to how many grams per day? (1 gram = 1,000 milligrams)", "ans": ["3.6", "18/5"], "sol": "1 day = 24 × 60 = 1,440 minutes.<br>Per day: 2.5 × 1,440 = 3,600 milligrams.<br>In grams: 3,600 ÷ 1,000 = 3.6 grams per day.<br>Answer: <b>3.6<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Store X sells olive oil for $9.00 per liter. Store Y sells olive oil in bottles of 750 milliliters for $6.30 each. How many dollars more per liter does Store X charge than Store Y? (1 liter = 1,000 milliliters)", "opts": ["$0.0006", "$0.45", "$0.60", "$2.70"], "ans": 2, "sol": "A bottle at Store Y holds 750 mL = 0.75 L.<br>Store Y price per liter = $6.30 ÷ 0.75 = $8.40.<br>Difference = $9.00 − $8.40 = $0.60 per liter.<br>Answer: <b>$0.60<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "Liquid A has a density of 0.8 gram per milliliter, and liquid B has a density of 1.2 grams per milliliter. A mixture is made from 300 milliliters of liquid A and 200 milliliters of liquid B. Assuming the volume of the mixture is the sum of the two volumes, what is the density of the mixture, in grams per milliliter?", "ans": ["0.96", ".96", "24/25"], "sol": "Masses: 0.8 × 300 = 240 grams of A and 1.2 × 200 = 240 grams of B.<br>Total mass = 480 grams; total volume = 500 milliliters.<br>Density = 480 ÷ 500 = 0.96 gram per milliliter.<br>Answer: <b>0.96<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "How many hectares are equal to 0.75 square kilometer? (1 hectare = 10,000 square meters and 1 kilometer = 1,000 meters)", "opts": ["0.075", "75", "7,500", "750,000"], "ans": 1, "sol": "1 square kilometer = 1,000 × 1,000 = 1,000,000 square meters.<br>0.75 square kilometer = 750,000 square meters.<br>750,000 ÷ 10,000 = 75 hectares.<br>Answer: <b>75<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Car P travels 18 kilometers per liter of fuel. Car Q uses 6 liters of fuel per 100 kilometers. On a trip of 450 kilometers, how many more liters of fuel does Car Q use than Car P?", "opts": ["2", "25", "27", "50"], "ans": 0, "sol": "Car P: 450 ÷ 18 = 25 liters.<br>Car Q: 450 km is 4.5 blocks of 100 km, so 4.5 × 6 = 27 liters.<br>Difference = 27 − 25 = 2 liters.<br>Answer: <b>2<\/b>"}, {"lo": "LO1", "diff": "X", "type": "spr", "q": "A certain length is <i>x<\/i> inches, and the same length is <i>y<\/i> centimeters. If <i>x<\/i> + <i>y<\/i> = 354, what is the value of <i>x<\/i>? (1 inch = 2.54 centimeters)", "ans": ["100"], "sol": "The length in centimeters is 2.54 times the length in inches, so <i>y<\/i> = 2.54<i>x<\/i>.<br>Substitute: <i>x<\/i> + 2.54<i>x<\/i> = 354, so 3.54<i>x<\/i> = 354.<br><i>x<\/i> = 100.<br>Answer: <b>100<\/b>"}, {"lo": "LO2", "diff": "X", "type": "mcq", "q": "An object moves at a speed of <i>n<\/i> kilometers per hour. The same speed is equal to <i>n<\/i> − 26 meters per second. What is the value of <i>n<\/i>?", "opts": ["10", "26", "36", "93.6"], "ans": 2, "sol": "A speed in km/h divided by 3.6 gives the speed in m/s, so <span class=\"fq\"><span><i>n<\/i><\/span><span>3.6<\/span><\/span> = <i>n<\/i> − 26.<br>Multiply by 3.6: <i>n<\/i> = 3.6<i>n<\/i> − 93.6, so 2.6<i>n<\/i> = 93.6.<br><i>n<\/i> = 36. Check: 36 km/h = 10 m/s, and 36 − 26 = 10.<br>Answer: <b>36<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "A rectangular region measures 2.5 kilometers by 1.6 kilometers and has a population of 12,000. What is the population density of the region, in people per hectare? (1 hectare = 10,000 square meters and 1 kilometer = 1,000 meters)", "opts": ["0.3", "30", "300", "3,000"], "ans": 1, "sol": "Area = 2.5 × 1.6 = 4 square kilometers = 4 × 1,000,000 = 4,000,000 square meters.<br>In hectares: 4,000,000 ÷ 10,000 = 400 hectares.<br>Density = 12,000 ÷ 400 = 30 people per hectare.<br>Answer: <b>30<\/b>"}, {"lo": "LO5", "diff": "X", "type": "spr", "q": "A tank in the shape of a cube has inside edges of 1.2 meters. The tank is empty, and water flows into it at a constant rate of 16 liters per minute. How many minutes will it take to fill the tank? (1 meter = 100 centimeters and 1 liter = 1,000 cubic centimeters)", "ans": ["108"], "sol": "Edge = 120 cm, so volume = 120 × 120 × 120 = 1,728,000 cm<sup>3<\/sup>.<br>1,728,000 ÷ 1,000 = 1,728 liters.<br>Time = 1,728 ÷ 16 = 108 minutes.<br>Answer: <b>108<\/b>"}], "unit_no": 3, "topic_no": "1", "code": "1.2"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }
