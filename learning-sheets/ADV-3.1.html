<style>
  /* Layout: Brain & Mind navy/gold identity. A study sheet: navy header, sticky Learn | Quiz switch,

  :root{

      --gr-grid:#2E2A22; --gr-axis:#B2A996; --gr-line:#7C9BF0; --gr-alt:#E0B75B; --gr-shade:rgba(124,155,240,.2);
      --chip-on:#E0B75B; --chip-on-ink:#141210;

    }
  }

    --navy:#0E1830; --navy-2:#16264A; --gold:#E0B75B; --gold-soft:#3A2F16;

    --ink:#EDE7DA; --ink-soft:#B2A996; --rule:#3A342A;

    --danger:#E38884; --danger-soft:#331D1B;

  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;}

  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .brand-row{display:flex; align-items:center; gap:12px;}
  .crest{width:40px; height:40px; border-radius:10px; background:#C79A3E; color:#16264A; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:17px; flex-shrink:0;}
  .brand-name{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#E0B75B; font-weight:700;}
  .series-name{font-size:18px; font-weight:700; font-family:var(--f-display);}

  .crumbs b{color:#E0B75B; font-weight:700;}
  h1.title{font-size:clamp(26px,5vw,36px); margin-top:4px;}

  /* mode switch */
  .modebar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule);}
  .modebar .wrap{display:flex; gap:6px; align-items:center; padding-block:10px;}
  .tab{border:1.5px solid var(--rule); background:var(--card); border-radius:99px; padding:7px 18px; font-weight:700; cursor:pointer;}

  .modebar .prog{margin-left:auto; font-size:13.5px; color:var(--ink-soft);}

  main{padding-block:22px 40px;}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-text);}

  /* objectives overview */
  .los{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .los li{display:flex; gap:12px; align-items:flex-start;}
  .los a{color:inherit; text-decoration:none;} .los a:hover{text-decoration:underline;}
  .lo-n{font-family:var(--f-mono); font-size:12.5px; font-weight:600; background:var(--gold-soft); color:var(--ink); border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;}
  .lo-done{margin-left:auto; font-size:12.5px; color:var(--success); font-weight:700; flex-shrink:0;}

  /* lesson */
  .lesson{scroll-margin-top:70px;}
  .lesson h2{font-size:24px; margin:4px 0 10px;}
  .concept p{margin:0 0 10px; max-width:68ch;}
  .concept ul,.concept ol{margin:0 0 10px; padding-left:22px;}
  .rules{background:var(--paper-2); border-radius:10px; padding:12px 16px; margin:12px 0;}
  .rules h3,.traps h3,.ex h3,.try h3{font-family:var(--f-body); font-size:13px; letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; color:var(--ink-soft);}
  .rules ul,.traps ul{margin:0; padding-left:20px;} .rules li,.traps li{margin:3px 0;}
  .traps{border-left:3px solid var(--danger); padding:4px 0 4px 14px; margin:14px 0;}
  .ex{border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .ex-q{margin-bottom:8px;}
  .steps{margin:0; padding-left:22px;} .steps li{margin:4px 0;}
  .ex .ans{margin-top:8px; font-weight:700;}
  .ex-ctrl{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{border:1.5px solid var(--rule); background:var(--card); border-radius:9px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:15px;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5; cursor:default;}
  .try{background:var(--paper-2); border-radius:10px; padding:14px 16px; margin:12px 0;}
  .feedback{margin-top:10px; border-radius:9px; padding:10px 12px; font-size:15.5px;}
  .feedback.ok{background:var(--success-soft);} .feedback.no{background:var(--danger-soft);}
  .feedback b.v{display:block; margin-bottom:2px;}
  .donebox{display:flex; align-items:center; gap:8px; margin-top:14px; font-weight:600; font-size:15px;}
  .donebox input{width:18px; height:18px; accent-color:var(--success);}
  .gotoquiz{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}

  /* questions */
  .qtext{margin-bottom:12px;}
  .qtext p{margin:0 0 8px;}
  .eqs{text-align:center; margin:8px 0 12px; line-height:1.9;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid var(--rule); background:var(--card); border-radius:10px; padding:10px 12px; cursor:pointer;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .let{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .opt[aria-checked="true"]{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .opt[aria-checked="true"] .let{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on);}
  .opt.right{border-color:var(--success); background:var(--success-soft);} .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt > span:last-child{min-width:0;}
  .spr{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .spr input{font:600 18px var(--f-mono); width:9em; padding:8px 10px; border:1.5px solid var(--ink-soft); border-radius:8px; background:var(--card); color:var(--ink);}
  .spr small{color:var(--ink-soft); font-size:13.5px;}
  .fq{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.92em; line-height:1.2;}
  .fq > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px;} .fq > span:last-child{padding:0 3px;}
  .dtab{border-collapse:collapse; margin:6px auto 10px; font-size:15.5px;}
  .dtab th,.dtab td{border:1px solid var(--ink-soft); padding:5px 12px; text-align:center;}
  .tscroll{overflow-x:auto;}
  .grwrap{display:flex; justify-content:center; margin:8px 0 12px; overflow-x:auto;}
  svg.gr{width:100%; max-width:300px; height:auto;}
  .gr-grid line{stroke:var(--gr-grid); stroke-width:1;}
  .gr-axis line{stroke:var(--gr-axis); stroke-width:1.4;}
  .gr-lab text{fill:var(--ink-soft); font:600 10.5px var(--f-body);} .gr-lab text.gr-ax{font:italic 600 13px var(--f-display); fill:var(--ink);}
  .gr-line{stroke:var(--gr-line); stroke-width:2.2; fill:none;} .gr-line.dash{stroke-dasharray:6 4;} .gr-line.alt{stroke:var(--gr-alt);}
  .gr-shade polygon{fill:var(--gr-shade); stroke:none;}
  .gr-pt{fill:var(--ink); stroke:var(--card); stroke-width:1.5;} .gr-pt.open{fill:var(--card); stroke:var(--ink);}
  .gr-note text{fill:var(--ink); font:600 12px var(--f-body);}

  /* quiz */
  .qhead{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .qhead .qn{font-family:var(--f-display); font-size:20px; font-weight:700;}
  .pill{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--paper-2); color:var(--ink-soft);}
  .pill.E{background:var(--success-soft); color:var(--success);} .pill.M{background:var(--warn-soft); color:var(--warn);} .pill.H{background:var(--danger-soft); color:var(--danger);}
  .qnav{display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .chip{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--card); font:600 14px var(--f-mono); cursor:pointer;}
  .chip.ans{background:var(--paper-2); border-color:var(--ink-soft);}
  .chip.cur{border-color:var(--chip-on); box-shadow:0 0 0 1px var(--chip-on);}
  .confirm{margin-top:12px; background:var(--warn-soft); border-radius:10px; padding:12px 14px; font-size:15.5px;}
  .confirm .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .timer{font:600 14px var(--f-mono); color:var(--ink-soft); margin-left:auto;}
  .intro-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .kpi{background:var(--paper-2); border-radius:10px; padding:10px 12px;}
  .kpi span{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .kpi b{font-family:var(--f-display); font-size:24px;}

  /* report */
  .scoreband{display:flex; flex-wrap:wrap; gap:20px; align-items:center;}
  .ring{width:120px; height:120px; flex-shrink:0;}
  .ring circle{fill:none; stroke-width:12;} .ring .bg{stroke:var(--paper-2);} .ring .fg{stroke:var(--gold); stroke-linecap:round;}
  .ring text{fill:var(--ink); font:700 24px var(--f-display);}
  .lotab{width:100%; border-collapse:collapse; font-size:15.5px;}
  .lotab td,.lotab th{padding:9px 6px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:middle;}
  .lotab th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .bar{height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--gold);}
  .st{font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .st.ok{background:var(--success-soft); color:var(--success);} .st.mid{background:var(--warn-soft); color:var(--warn);} .st.low{background:var(--danger-soft); color:var(--danger);}
  .rv{border:1px solid var(--rule); border-radius:10px; padding:12px 14px;}
  .rv summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:8px; align-items:center; list-style:none;}
  .rv summary::-webkit-details-marker{display:none;}
  .rv .mark{font-weight:700;} .mark.ok{color:var(--success);} .mark.no{color:var(--danger);} .mark.om{color:var(--ink-soft);}
  .rv .sol{background:var(--paper-2); border-radius:9px; padding:10px 12px; margin-top:10px;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .lnk{background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline;}
  footer{color:var(--ink-soft); font-size:13px; padding-block:24px 30px; border-top:1px solid var(--rule);}
  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .sheetnav .tab{padding:6px 14px; font-size:15px;}
  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}
  .tab[aria-selected="true"].done::after{color:inherit;}
  .note-h{font-family:var(--f-body); font-size:17px; font-weight:700; margin:16px 0 6px;}
  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}
  .concept .tip{border-left:3px solid var(--accent-text); padding:4px 0 4px 12px; margin:10px 0; color:var(--ink-soft);}
  .callout{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0;}
  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}
  .pill.X{background:var(--navy-2); color:#F4EFDF;}
  .sheetcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
  .sheetcard{border:1.5px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .sheetcard h3{font-size:20px;}
  .sheetcard p{margin:0; color:var(--ink-soft); font-size:15.5px;}
  .sheetcard .btn{align-self:flex-start; margin-top:auto;}
  svg.fig{display:block; width:100%; max-width:300px; height:auto; margin:10px auto; color:var(--ink);}
  svg.fig .fg-grid{stroke:var(--gr-grid); stroke-opacity:1;}
  svg.fig .fg-axis{stroke:var(--gr-axis);}
  svg.fig .fg-fit{stroke:var(--gr-line);}
  svg.fig .fg-shape{fill:var(--gr-line);}
  svg.fig .fg-pts{fill:var(--ink);}
  svg.fig .fg-lab{fill:var(--ink-soft);}
</style>

var S = {"id": "ADV-3.1", "unit": "Advanced Math", "topic": "Nonlinear functions", "title": "Quadratic functions and parabolas", "intro": "A quadratic function such as <i>f<\/i>(<i>x<\/i>) = <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i> graphs as a parabola, and it can be written in standard, vertex or factored form, each showing a different feature of the graph. The DSAT asks you to read intercepts and vertices from equations, find maximum and minimum values, rewrite a quadratic by completing the square, match equations with graphs, and interpret quadratic models of height and revenue.", "los": [{"id": "LO1", "text": "Identify the <i>y<\/i>-intercept, the vertex and the <i>x<\/i>-intercepts of a parabola from its standard, vertex or factored form."}, {"id": "LO2", "text": "Determine the axis of symmetry and the vertex using <i>x<\/i> = −<span class=\"fq\"><span><i>b<\/i><\/span><span>2<i>a<\/i><\/span><\/span> or symmetry, and find the maximum or minimum value of a quadratic function."}, {"id": "LO3", "text": "Convert a quadratic between standard, vertex and factored forms, including by completing the square."}, {"id": "LO4", "text": "Match quadratic equations with their graphs using the sign of <i>a<\/i>, the intercepts and the vertex."}, {"id": "LO5", "text": "Interpret and solve quadratic models in context, such as maximum height, landing time and maximum revenue or profit."}], "notes": [{"lo": "LO1", "h": "Three forms of a quadratic", "html": "<p>A quadratic function has degree 2, and its graph is a U-shaped curve called a <b>parabola<\/b>. The same function can be written in three common forms, and each one puts a different feature on display.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Form<\/th><th>Equation<\/th><th>Shows directly<\/th><\/tr><tr><td>Standard<\/td><td><i>y<\/i> = <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i><\/td><td><i>y<\/i>-intercept (0, <i>c<\/i>)<\/td><\/tr><tr><td>Vertex<\/td><td><i>y<\/i> = <i>a<\/i>(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i><\/td><td>vertex (<i>h<\/i>, <i>k<\/i>)<\/td><\/tr><tr><td>Factored<\/td><td><i>y<\/i> = <i>a<\/i>(<i>x<\/i> − <i>p<\/i>)(<i>x<\/i> − <i>q<\/i>)<\/td><td><i>x<\/i>-intercepts (<i>p<\/i>, 0) and (<i>q<\/i>, 0)<\/td><\/tr><\/table><\/div><p>These three equations describe one parabola:<\/p><div class=\"eqs\"><i>y<\/i> = 2<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> + 6<br><i>y<\/i> = 2(<i>x<\/i> − 2)<sup>2<\/sup> − 2<br><i>y<\/i> = 2(<i>x<\/i> − 1)(<i>x<\/i> − 3)<\/div><p>From them you can read the <i>y<\/i>-intercept (0, 6), the vertex (2, −2) and the <i>x<\/i>-intercepts (1, 0) and (3, 0). In all three forms <i>a<\/i> is the same number: it tells whether the parabola opens up (<i>a<\/i> &gt; 0) or down (<i>a<\/i> &lt; 0).<\/p><div class=\"tip\">On the DSAT, pick the form that shows the feature being asked about. An answer choice in a different form can still be equivalent, so read the question carefully.<\/div>"}, {"lo": "LO1", "h": "Intercepts from any form", "html": "<p>The <b><i>y<\/i>-intercept<\/b> is the value of the function at <i>x<\/i> = 0. Substitute 0 into whichever form you have:<\/p><ul><li>Standard: <i>y<\/i> = <i>c<\/i>.<\/li><li>Vertex: <i>y<\/i> = <i>a<\/i><i>h<\/i><sup>2<\/sup> + <i>k<\/i>, which is <b>not<\/b> just <i>k<\/i>. For <i>y<\/i> = 2(<i>x<\/i> + 1)<sup>2<\/sup> − 9, the <i>y<\/i>-intercept is 2(1) − 9 = −7.<\/li><li>Factored: <i>y<\/i> = <i>a<\/i><i>p<\/i><i>q<\/i>. For <i>y<\/i> = 4(<i>x<\/i> − 1)(<i>x<\/i> + 2), it is 4(−1)(2) = −8.<\/li><\/ul><p>The <b><i>x<\/i>-intercepts<\/b> (also called zeros or roots) are the values of <i>x<\/i> that make <i>y<\/i> = 0. In factored form, set each factor equal to zero.<\/p><div class=\"rule\"><i>y<\/i> = <i>a<\/i>(<i>x<\/i> − <i>p<\/i>)(<i>x<\/i> − <i>q<\/i>) has zeros <i>x<\/i> = <i>p<\/i> and <i>x<\/i> = <i>q<\/i>. The signs flip: the factor (<i>x<\/i> + 2) gives <i>x<\/i> = −2.<\/div><p>From vertex form, solve <i>a<\/i>(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i> = 0, so (<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> = −<span class=\"fq\"><span><i>k<\/i><\/span><span><i>a<\/i><\/span><\/span>. If −<span class=\"fq\"><span><i>k<\/i><\/span><span><i>a<\/i><\/span><\/span> is negative, the parabola never meets the <i>x<\/i>-axis; if it is zero, the vertex just touches the axis.<\/p>"}, {"lo": "LO2", "h": "Axis of symmetry and the vertex formula", "html": "<p>Every parabola is symmetric about a vertical line through its vertex, called the <b>axis of symmetry<\/b>. Points at the same height sit at equal distances on either side of it.<\/p><div class=\"rule\">For <i>y<\/i> = <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i>, the axis of symmetry is <i>x<\/i> = −<span class=\"fq\"><span><i>b<\/i><\/span><span>2<i>a<\/i><\/span><\/span>. Substitute this <i>x<\/i>-value back into the function to get the <i>y<\/i>-coordinate of the vertex.<\/div><p>Example: for <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 1, <i>a<\/i> = 1 and <i>b<\/i> = −6, so <i>x<\/i> = <span class=\"fq\"><span>6<\/span><span>2<\/span><\/span> = 3. Then <i>y<\/i> = 9 − 18 + 1 = −8, and the vertex is (3, −8).<\/p><p>Two other ways to find the axis:<\/p><ul><li>Midway between the <i>x<\/i>-intercepts: <i>x<\/i> = <span class=\"fq\"><span><i>p<\/i> + <i>q<\/i><\/span><span>2<\/span><\/span>.<\/li><li>Midway between any two points with the same <i>y<\/i>-value: if <i>f<\/i>(1) = <i>f<\/i>(7), the axis is <i>x<\/i> = 4.<\/li><\/ul><div class=\"tip\">To find a mirror-image point, reflect across the axis. For example, the <i>y<\/i>-intercept (0, <i>c<\/i>) always has a partner point at <i>x<\/i> = −<span class=\"fq\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span>, twice as far from the <i>y<\/i>-axis as the vertex.<\/div>"}, {"lo": "LO2", "h": "Maximum or minimum value", "html": "<p>The vertex is the turning point of the parabola, so its <i>y<\/i>-coordinate is the extreme value of the function.<\/p><ul><li>If <i>a<\/i> &gt; 0, the parabola opens up, the vertex is the lowest point, and <i>k<\/i> is the <b>minimum<\/b> value.<\/li><li>If <i>a<\/i> &lt; 0, the parabola opens down, the vertex is the highest point, and <i>k<\/i> is the <b>maximum<\/b> value.<\/li><\/ul><div class=\"rule\">The maximum or minimum <b>value<\/b> is a <i>y<\/i>-value (<i>k<\/i>). The <i>x<\/i>-value where it occurs is <i>h<\/i>.<\/div><p>Example: <i>f<\/i>(<i>x<\/i>) = −2<i>x<\/i><sup>2<\/sup> + 12<i>x<\/i> − 7. Since <i>a<\/i> = −2 &lt; 0, <i>f<\/i> has a maximum. The axis is <i>x<\/i> = −<span class=\"fq\"><span>12<\/span><span>2(−2)<\/span><\/span> = 3, and <i>f<\/i>(3) = −18 + 36 − 7 = 11. So the maximum value is 11, reached at <i>x<\/i> = 3, and the range of <i>f<\/i> is <i>y<\/i> ≤ 11.<\/p><div class=\"tip\">Desmos tip: graph the function and click the vertex. Desmos shows its coordinates, so you can read the maximum or minimum straight off the screen.<\/div>"}, {"lo": "LO3", "h": "Completing the square", "html": "<p>To change standard form into vertex form, <b>complete the square<\/b>:<\/p><div class=\"eqs\">3<i>x<\/i><sup>2<\/sup> + 12<i>x<\/i> − 5<br>= 3(<i>x<\/i><sup>2<\/sup> + 4<i>x<\/i>) − 5<br>= 3(<i>x<\/i><sup>2<\/sup> + 4<i>x<\/i> + 4 − 4) − 5<br>= 3(<i>x<\/i> + 2)<sup>2<\/sup> − 12 − 5<br>= 3(<i>x<\/i> + 2)<sup>2<\/sup> − 17<\/div><ul><li>Factor <i>a<\/i> out of the <i>x<\/i><sup>2<\/sup> and <i>x<\/i> terms only.<\/li><li>Take half the <i>x<\/i>-coefficient inside the parentheses and square it: half of 4 is 2, and 2<sup>2<\/sup> = 4. Add it and subtract it.<\/li><li>The subtracted 4 is inside the parentheses, so it comes out multiplied by <i>a<\/i>: 3 × 4 = 12.<\/li><\/ul><p>So <i>y<\/i> = 3<i>x<\/i><sup>2<\/sup> + 12<i>x<\/i> − 5 has vertex (−2, −17). Check with the formula: −<span class=\"fq\"><span>12<\/span><span>2(3)<\/span><\/span> = −2.<\/p><p>Going the other way is easier: expand vertex or factored form and combine like terms. To reach factored form, factor the standard form, or treat vertex form as a difference of squares, as in (<i>x<\/i> − 3)<sup>2<\/sup> − 16 = (<i>x<\/i> − 7)(<i>x<\/i> + 1).<\/p>"}, {"lo": "LO4", "h": "Matching a graph to an equation", "html": "<p>To match an equation with a graph, check one feature at a time and eliminate choices:<\/p><ul><li><b>Direction:<\/b> opening up means <i>a<\/i> &gt; 0; opening down means <i>a<\/i> &lt; 0.<\/li><li><b><i>y<\/i>-intercept:<\/b> where the curve crosses the <i>y<\/i>-axis (the value of <i>c<\/i> in standard form).<\/li><li><b><i>x<\/i>-intercepts:<\/b> the zeros <i>p<\/i> and <i>q<\/i> of factored form (watch the sign flip).<\/li><li><b>Vertex:<\/b> (<i>h<\/i>, <i>k<\/i>) in vertex form.<\/li><\/ul><p>The graph below opens down, crosses the <i>x<\/i>-axis at −1 and 3, and crosses the <i>y<\/i>-axis at <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>. Its vertex is at <i>x<\/i> = 1, midway between the zeros.<\/p><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Parabola opening downward with vertex at (1, 2), crossing the x-axis at (−1, 0) and (3, 0) and the y-axis at (0, 1.5)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"6\" y1=\"130\" x2=\"254\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130\" y1=\"6\" x2=\"130\" y2=\"254\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" points=\"70.00,250.00 71.33,244.71 72.67,239.51 74.00,234.40 75.33,229.38 76.67,224.44 78.00,219.60 79.33,214.84 80.67,210.18 82.00,205.60 83.33,201.11 84.67,196.71 86.00,192.40 87.33,188.18 88.67,184.04 90.00,180.00 91.33,176.04 92.67,172.18 94.00,168.40 95.33,164.71 96.67,161.11 98.00,157.60 99.33,154.18 100.67,150.84 102.00,147.60 103.33,144.44 104.67,141.38 106.00,138.40 107.33,135.51 108.67,132.71 110.00,130.00 111.33,127.38 112.67,124.84 114.00,122.40 115.33,120.04 116.67,117.78 118.00,115.60 119.33,113.51 120.67,111.51 122.00,109.60 123.33,107.78 124.67,106.04 126.00,104.40 127.33,102.84 128.67,101.38 130.00,100.00 131.33,98.71 132.67,97.51 134.00,96.40 135.33,95.38 136.67,94.44 138.00,93.60 139.33,92.84 140.67,92.18 142.00,91.60 143.33,91.11 144.67,90.71 146.00,90.40 147.33,90.18 148.67,90.04 150.00,90.00 151.33,90.04 152.67,90.18 154.00,90.40 155.33,90.71 156.67,91.11 158.00,91.60 159.33,92.18 160.67,92.84 162.00,93.60 163.33,94.44 164.67,95.38 166.00,96.40 167.33,97.51 168.67,98.71 170.00,100.00 171.33,101.38 172.67,102.84 174.00,104.40 175.33,106.04 176.67,107.78 178.00,109.60 179.33,111.51 180.67,113.51 182.00,115.60 183.33,117.78 184.67,120.04 186.00,122.40 187.33,124.84 188.67,127.38 190.00,130.00 191.33,132.71 192.67,135.51 194.00,138.40 195.33,141.38 196.67,144.44 198.00,147.60 199.33,150.84 200.67,154.18 202.00,157.60 203.33,161.11 204.67,164.71 206.00,168.40 207.33,172.18 208.67,176.04 210.00,180.00 211.33,184.04 212.67,188.18 214.00,192.40 215.33,196.71 216.67,201.11 218.00,205.60 219.33,210.18 220.67,214.84 222.00,219.60 223.33,224.44 224.67,229.38 226.00,234.40 227.33,239.51 228.67,244.71 230.00,250.00\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"110.00\" cy=\"130.00\" r=\"3\"/><circle cx=\"190.00\" cy=\"130.00\" r=\"3\"/><circle cx=\"150.00\" cy=\"90.00\" r=\"3\"/><circle cx=\"130.00\" cy=\"100.00\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg><p>Factored form gives <i>y<\/i> = <i>a<\/i>(<i>x<\/i> + 1)(<i>x<\/i> − 3). The vertex (1, 2) is on the graph, so 2 = <i>a<\/i>(2)(−2) and <i>a<\/i> = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>. The equation is<\/p><div class=\"eqs\"><i>y<\/i> = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(<i>x<\/i> + 1)(<i>x<\/i> − 3)<\/div><div class=\"tip\">If two choices agree on the intercepts, use one more point, often the vertex, to pin down <i>a<\/i>.<\/div>"}, {"lo": "LO5", "h": "Quadratic models in context", "html": "<p>Quadratics model quantities that rise and then fall, or fall and then rise. Two DSAT favorites:<\/p><ul><li><b>Projectile height:<\/b> <i>h<\/i>(<i>t<\/i>) = −5<i>t<\/i><sup>2<\/sup> + 20<i>t<\/i> + 1.5 gives the height, in meters, of a ball <i>t<\/i> seconds after it is thrown. The <i>y<\/i>-intercept 1.5 is the starting height. The vertex time is <i>t<\/i> = −<span class=\"fq\"><span>20<\/span><span>2(−5)<\/span><\/span> = 2, and <i>h<\/i>(2) = −20 + 40 + 1.5 = 21.5, so the maximum height is 21.5 meters. The positive zero is the time the ball lands.<\/li><li><b>Revenue:<\/b> if a store sells 120 − 4<i>p<\/i> items at a price of <i>p<\/i> dollars, the revenue is <i>R<\/i>(<i>p<\/i>) = <i>p<\/i>(120 − 4<i>p<\/i>). The zeros are <i>p<\/i> = 0 and <i>p<\/i> = 30, so the best price is halfway, <i>p<\/i> = 15, and the maximum revenue is 15(60) = 900 dollars.<\/li><\/ul><div class=\"rule\">In context, the vertex answers \"greatest\" and \"least\" questions. Check whether the question wants the input (when, at what price) or the output (how high, how much).<\/div>"}], "examples": [{"lo": "LO1", "q": "For <i>f<\/i>(<i>x<\/i>) = −2(<i>x<\/i> − 3)(<i>x<\/i> + 5), find the <i>x<\/i>-intercepts and the <i>y<\/i>-intercept of the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>).", "steps": ["Set each factor equal to zero: <i>x<\/i> − 3 = 0 gives <i>x<\/i> = 3, and <i>x<\/i> + 5 = 0 gives <i>x<\/i> = −5.", "For the <i>y<\/i>-intercept, substitute <i>x<\/i> = 0: <i>f<\/i>(0) = −2(0 − 3)(0 + 5) = −2(−3)(5) = 30.", "Since <i>a<\/i> = −2 &lt; 0, the parabola opens down, and its vertex lies midway between the zeros, at <i>x<\/i> = −1."], "ans": "<i>x<\/i>-intercepts (−5, 0) and (3, 0); <i>y<\/i>-intercept (0, 30)"}, {"lo": "LO2", "q": "In the <i>x<\/i><i>y<\/i>-plane, the graph of <i>y<\/i> = 3<i>x<\/i><sup>2<\/sup> − 18<i>x<\/i> + 7 is a parabola. What are the coordinates of its vertex, and is the <i>y<\/i>-coordinate of the vertex a maximum or a minimum value?", "steps": ["Here <i>a<\/i> = 3 and <i>b<\/i> = −18, so <i>x<\/i> = −<span class=\"fq\"><span><i>b<\/i><\/span><span>2<i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>18<\/span><span>6<\/span><\/span> = 3.", "Substitute: <i>y<\/i> = 3(9) − 18(3) + 7 = 27 − 54 + 7 = −20.", "Because <i>a<\/i> = 3 &gt; 0, the parabola opens up, so −20 is the minimum value."], "ans": "Vertex (3, −20); −20 is the minimum value"}, {"lo": "LO3", "q": "Write <i>y<\/i> = <i>x<\/i><sup>2<\/sup> + 10<i>x<\/i> + 16 in vertex form and in factored form.", "steps": ["Half of 10 is 5, and 5<sup>2<\/sup> = 25. Add and subtract 25: <i>y<\/i> = (<i>x<\/i><sup>2<\/sup> + 10<i>x<\/i> + 25) − 25 + 16.", "So <i>y<\/i> = (<i>x<\/i> + 5)<sup>2<\/sup> − 9, and the vertex is (−5, −9).", "For factored form, find two numbers with product 16 and sum 10: 2 and 8. So <i>y<\/i> = (<i>x<\/i> + 2)(<i>x<\/i> + 8).", "Check: the zeros −2 and −8 are each 3 units from <i>x<\/i> = −5, as symmetry requires."], "ans": "<i>y<\/i> = (<i>x<\/i> + 5)<sup>2<\/sup> − 9 and <i>y<\/i> = (<i>x<\/i> + 2)(<i>x<\/i> + 8)"}, {"lo": "LO4", "q": "The graph of <i>y<\/i> = <i>a<\/i>(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i>, where <i>a<\/i>, <i>h<\/i> and <i>k<\/i> are constants, is shown. It passes through the point (0, 5). What are the values of <i>a<\/i>, <i>h<\/i> and <i>k<\/i>?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Parabola opening upward with lowest point (2, −3), passing through the marked points (0, 5) and (4, 5)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><line class=\"fg-axis\" x1=\"6\" y1=\"130\" x2=\"254\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130\" y1=\"6\" x2=\"130\" y2=\"254\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-fit\" points=\"127.57,10.00 128.28,15.95 128.99,21.80 129.69,27.55 130.40,33.20 131.11,38.75 131.82,44.20 132.52,49.55 133.23,54.80 133.94,59.95 134.64,65.00 135.35,69.95 136.06,74.80 136.77,79.55 137.47,84.20 138.18,88.75 138.89,93.20 139.59,97.55 140.30,101.80 141.01,105.95 141.72,110.00 142.42,113.95 143.13,117.80 143.84,121.55 144.54,125.20 145.25,128.75 145.96,132.20 146.67,135.55 147.37,138.80 148.08,141.95 148.79,145.00 149.49,147.95 150.20,150.80 150.91,153.55 151.62,156.20 152.32,158.75 153.03,161.20 153.74,163.55 154.44,165.80 155.15,167.95 155.86,170.00 156.56,171.95 157.27,173.80 157.98,175.55 158.69,177.20 159.39,178.75 160.10,180.20 160.81,181.55 161.51,182.80 162.22,183.95 162.93,185.00 163.64,185.95 164.34,186.80 165.05,187.55 165.76,188.20 166.46,188.75 167.17,189.20 167.88,189.55 168.59,189.80 169.29,189.95 170.00,190.00 170.71,189.95 171.41,189.80 172.12,189.55 172.83,189.20 173.54,188.75 174.24,188.20 174.95,187.55 175.66,186.80 176.36,185.95 177.07,185.00 177.78,183.95 178.49,182.80 179.19,181.55 179.90,180.20 180.61,178.75 181.31,177.20 182.02,175.55 182.73,173.80 183.44,171.95 184.14,170.00 184.85,167.95 185.56,165.80 186.26,163.55 186.97,161.20 187.68,158.75 188.38,156.20 189.09,153.55 189.80,150.80 190.51,147.95 191.21,145.00 191.92,141.95 192.63,138.80 193.33,135.55 194.04,132.20 194.75,128.75 195.46,125.20 196.16,121.55 196.87,117.80 197.58,113.95 198.28,110.00 198.99,105.95 199.70,101.80 200.41,97.55 201.11,93.20 201.82,88.75 202.53,84.20 203.23,79.55 203.94,74.80 204.65,69.95 205.36,65.00 206.06,59.95 206.77,54.80 207.48,49.55 208.18,44.20 208.89,38.75 209.60,33.20 210.31,27.55 211.01,21.80 211.72,15.95 212.43,10.00\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"170.00\" cy=\"190.00\" r=\"3\"/><circle cx=\"130.00\" cy=\"30.00\" r=\"3\"/><circle cx=\"210.00\" cy=\"30.00\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>", "steps": ["The lowest point of the graph is (2, −3), so <i>h<\/i> = 2 and <i>k<\/i> = −3.", "Substitute (0, 5): 5 = <i>a<\/i>(0 − 2)<sup>2<\/sup> − 3, so 4<i>a<\/i> = 8.", "Then <i>a<\/i> = 2. Check with (4, 5), the mirror image of (0, 5): 2(4 − 2)<sup>2<\/sup> − 3 = 5."], "ans": "<i>a<\/i> = 2, <i>h<\/i> = 2, <i>k<\/i> = −3"}, {"lo": "LO5", "q": "A ball is thrown upward from a balcony. Its height, in meters, <i>t<\/i> seconds after it is thrown is <i>h<\/i>(<i>t<\/i>) = −5<i>t<\/i><sup>2<\/sup> + 30<i>t<\/i> + 2. What is the maximum height of the ball, and how many seconds after it is thrown does it reach that height?", "steps": ["The vertex time is <i>t<\/i> = −<span class=\"fq\"><span>30<\/span><span>2(−5)<\/span><\/span> = 3 seconds.", "<i>h<\/i>(3) = −5(9) + 30(3) + 2 = −45 + 90 + 2 = 47.", "Since <i>a<\/i> = −5 &lt; 0, the vertex is the highest point."], "ans": "Maximum height 47 meters, reached at <i>t<\/i> = 3 seconds"}, {"lo": "LO5", "q": "A theater sells 600 − 20<i>p<\/i> tickets for a show when the ticket price is <i>p<\/i> dollars. What ticket price gives the greatest revenue, and what is that revenue?", "steps": ["Revenue is price × number sold: <i>R<\/i>(<i>p<\/i>) = <i>p<\/i>(600 − 20<i>p<\/i>).", "<i>R<\/i>(<i>p<\/i>) = 0 when <i>p<\/i> = 0 or when 600 − 20<i>p<\/i> = 0, that is, <i>p<\/i> = 30.", "The parabola opens down, so the maximum is midway between the zeros: <i>p<\/i> = 15.", "<i>R<\/i>(15) = 15(600 − 300) = 15(300) = 4,500."], "ans": "A price of $15, giving revenue of $4,500"}], "traps": ["Reading the vertex of <i>y<\/i> = (<i>x<\/i> + 4)<sup>2<\/sup> − 1 as (4, −1). The form is <i>a<\/i>(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i>, so <i>x<\/i> + 4 means <i>h<\/i> = −4 and the vertex is (−4, −1).", "Taking the zeros of <i>y<\/i> = (<i>x<\/i> − 2)(<i>x<\/i> + 6) to be −2 and 6. Set each factor equal to zero: the zeros are 2 and −6.", "Calling <i>k<\/i> the <i>y<\/i>-intercept in vertex form. The <i>y<\/i>-intercept of <i>y<\/i> = 2(<i>x<\/i> − 3)<sup>2<\/sup> + 1 is 2(9) + 1 = 19, not 1. Always substitute <i>x<\/i> = 0.", "Completing the square without multiplying by <i>a<\/i>. In 2<i>x<\/i><sup>2<\/sup> + 12<i>x<\/i> + 1 = 2(<i>x<\/i><sup>2<\/sup> + 6<i>x<\/i> + 9) − 18 + 1, the 9 added inside the parentheses is really worth 18, so the result is 2(<i>x<\/i> + 3)<sup>2<\/sup> − 17, not 2(<i>x<\/i> + 3)<sup>2<\/sup> − 8.", "Losing the negative sign in <i>x<\/i> = −<span class=\"fq\"><span><i>b<\/i><\/span><span>2<i>a<\/i><\/span><\/span> when <i>a<\/i> is negative. For <i>y<\/i> = −<i>x<\/i><sup>2<\/sup> + 6<i>x<\/i>, <i>x<\/i> = −<span class=\"fq\"><span>6<\/span><span>−2<\/span><\/span> = 3, not −3.", "Giving the wrong coordinate in a context question. \"What is the maximum height?\" asks for the <i>y<\/i>-value of the vertex; \"when\" or \"at what price\" asks for the <i>x<\/i>-value."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "What is the vertex of the graph of <i>y<\/i> = (<i>x<\/i> − 4)<sup>2<\/sup> + 7 in the <i>x<\/i><i>y<\/i>-plane?", "opts": ["(4, 7)", "(−4, 7)", "(4, −7)", "(7, 4)"], "ans": 0, "sol": "Vertex form is <i>y<\/i> = <i>a<\/i>(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i> with vertex (<i>h<\/i>, <i>k<\/i>).<br>Here <i>x<\/i> − 4 gives <i>h<\/i> = 4, and <i>k<\/i> = 7.<br>Answer: <b>(4, 7)<\/b>", "hint": "Compare with <i>a<\/i>(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i>. What number is being subtracted from <i>x<\/i>?"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> + 3)(<i>x<\/i> − 8). What are the <i>x<\/i>-intercepts of the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>)?", "opts": ["<i>x<\/i> = 3 and <i>x<\/i> = −8", "<i>x<\/i> = 3 and <i>x<\/i> = 8", "<i>x<\/i> = −3 and <i>x<\/i> = 8", "<i>x<\/i> = −3 and <i>x<\/i> = −8"], "ans": 2, "sol": "Set each factor equal to zero.<br><i>x<\/i> + 3 = 0 gives <i>x<\/i> = −3; <i>x<\/i> − 8 = 0 gives <i>x<\/i> = 8.<br>Answer: <b><i>x<\/i> = −3 and <i>x<\/i> = 8<\/b>", "hint": "A product is zero when one of its factors is zero."}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "The axis of symmetry of the graph of <i>y<\/i> = 2<i>x<\/i><sup>2<\/sup> − 12<i>x<\/i> + 5 is the line <i>x<\/i> = <i>k<\/i>. What is the value of <i>k<\/i>?", "ans": ["3"], "sol": "Use <i>x<\/i> = −<span class=\"fq\"><span><i>b<\/i><\/span><span>2<i>a<\/i><\/span><\/span> with <i>a<\/i> = 2 and <i>b<\/i> = −12.<br><i>x<\/i> = <span class=\"fq\"><span>12<\/span><span>4<\/span><\/span> = 3.<br>Answer: <b>3<\/b>", "hint": "Identify <i>a<\/i> and <i>b<\/i>, then use the vertex formula for the <i>x<\/i>-coordinate."}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Which equation has a graph that opens downward and crosses the <i>y<\/i>-axis at (0, 4)?", "opts": ["<i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 3<i>x<\/i> + 4", "<i>y<\/i> = −<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> + 4", "<i>y<\/i> = −<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 4", "<i>y<\/i> = 4<i>x<\/i><sup>2<\/sup> − <i>x<\/i> − 1"], "ans": 1, "sol": "Opening downward requires <i>a<\/i> &lt; 0, which rules out the second and fourth equations.<br>A <i>y<\/i>-intercept of 4 requires <i>c<\/i> = 4, which rules out <i>y<\/i> = −<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> − 4.<br>Answer: <b><i>y<\/i> = −<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> + 4<\/b>", "hint": "Check two things: the sign of the <i>x<\/i><sup>2<\/sup> coefficient and the constant term."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Which expression is equivalent to <i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 2?", "opts": ["(<i>x<\/i> − 3)<sup>2<\/sup> + 2", "(<i>x<\/i> + 3)<sup>2<\/sup> − 7", "(<i>x<\/i> − 6)<sup>2<\/sup> − 34", "(<i>x<\/i> − 3)<sup>2<\/sup> − 7"], "ans": 3, "sol": "Half of −6 is −3, and (−3)<sup>2<\/sup> = 9.<br><i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 2 = (<i>x<\/i><sup>2<\/sup> − 6<i>x<\/i> + 9) − 9 + 2 = (<i>x<\/i> − 3)<sup>2<\/sup> − 7.<br>Answer: <b>(<i>x<\/i> − 3)<sup>2<\/sup> − 7<\/b>", "hint": "Add and subtract the square of half the <i>x<\/i>-coefficient."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "What is the minimum value of the function <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> + 8<i>x<\/i> + 21?", "opts": ["−4", "21", "5", "69"], "ans": 2, "sol": "The vertex is at <i>x<\/i> = −<span class=\"fq\"><span>8<\/span><span>2<\/span><\/span> = −4.<br><i>f<\/i>(−4) = 16 − 32 + 21 = 5.<br>Since <i>a<\/i> = 1 &gt; 0, this is the minimum. Answer: <b>5<\/b>", "hint": "The minimum value is the <i>y<\/i>-coordinate of the vertex, not the <i>x<\/i>-coordinate."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A rock is launched straight up from the ground. Its height, in meters, <i>t<\/i> seconds after launch is <i>h<\/i>(<i>t<\/i>) = −5<i>t<\/i>(<i>t<\/i> − 8). How many seconds after launch does the rock reach its greatest height?", "opts": ["4", "8", "80", "40"], "ans": 0, "sol": "The zeros are <i>t<\/i> = 0 (launch) and <i>t<\/i> = 8 (landing).<br>The highest point is midway between them: <i>t<\/i> = 4.<br>Answer: <b>4<\/b>", "hint": "Find when the rock is on the ground, then use symmetry."}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = 3(<i>x<\/i> − 2)<sup>2<\/sup> − 5. The graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) crosses the <i>y<\/i>-axis at (0, <i>b<\/i>). What is the value of <i>b<\/i>?", "ans": ["7"], "sol": "Substitute <i>x<\/i> = 0: <i>f<\/i>(0) = 3(0 − 2)<sup>2<\/sup> − 5.<br>= 3(4) − 5 = 7.<br>Answer: <b>7<\/b>", "hint": "The <i>y<\/i>-intercept is not <i>k<\/i>. What happens when <i>x<\/i> = 0?"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Which equation could define the parabola shown?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Parabola opening upward crossing the x-axis at (−1, 0) and (5, 0), with lowest point (2, −4.5)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\ gt; 0; this rules out the third choice.<br>The zeros are −1 and 5, so the factors are (<i>x<\/i> + 1) and (<i>x<\/i> − 5); this rules out the second.<br>At the vertex <i>x<\/i> = 2: <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(3)(−3) = −4.5 matches the graph, but 2(3)(−3) = −18 does not.<br>Answer: <b><i>y<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(<i>x<\/i> + 1)(<i>x<\/i> − 5)<\/b>", "hint": "Use the direction of opening and the <i>x<\/i>-intercepts first, then test the lowest point."}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "The expression 2<i>x<\/i><sup>2<\/sup> + 12<i>x<\/i> + 11 can be written in the form 2(<i>x<\/i> + <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i>, where <i>h<\/i> and <i>k<\/i> are constants. What is the value of <i>k<\/i>?", "ans": ["-7"], "sol": "Factor 2 from the <i>x<\/i>-terms: 2(<i>x<\/i><sup>2<\/sup> + 6<i>x<\/i>) + 11.<br>Complete the square: 2(<i>x<\/i><sup>2<\/sup> + 6<i>x<\/i> + 9) − 18 + 11.<br>So the expression is 2(<i>x<\/i> + 3)<sup>2<\/sup> − 7.<br>Answer: <b>−7<\/b>", "hint": "Factor out the 2 first, and remember that what you add inside the parentheses is multiplied by 2."}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A parabola in the <i>x<\/i><i>y<\/i>-plane passes through (−2, 9) and (6, 9), and the minimum value of <i>y<\/i> on the parabola is 1. What is the vertex of the parabola?", "opts": ["(4, 1)", "(1, 2)", "(2, 9)", "(2, 1)"], "ans": 3, "sol": "Points with equal <i>y<\/i>-values are symmetric about the axis, so the axis is <i>x<\/i> = <span class=\"fq\"><span>−2 + 6<\/span><span>2<\/span><\/span> = 2.<br>The minimum value is the <i>y<\/i>-coordinate of the vertex: 1.<br>Answer: <b>(2, 1)<\/b>", "hint": "Two points at the same height are mirror images. Where is the mirror line?"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "A shop's weekly profit, in dollars, from selling a lamp at a price of <i>x<\/i> dollars is <i>P<\/i>(<i>x<\/i>) = −2<i>x<\/i><sup>2<\/sup> + 160<i>x<\/i> − 1800. What is the maximum weekly profit, in dollars?", "ans": ["1400"], "sol": "The best price is <i>x<\/i> = −<span class=\"fq\"><span>160<\/span><span>2(−2)<\/span><\/span> = 40.<br><i>P<\/i>(40) = −2(1600) + 160(40) − 1800 = −3200 + 6400 − 1800 = 1400.<br>Answer: <b>1400<\/b>", "hint": "The question asks for the profit, not the price. Find the vertex and give its output."}], "quiz1": [{"lo": "LO2", "diff": "E", "type": "mcq", "q": "What is the axis of symmetry of the graph of <i>y<\/i> = −3(<i>x<\/i> − 5)<sup>2<\/sup> + 2?", "opts": ["<i>x<\/i> = −5", "<i>x<\/i> = 5", "<i>x<\/i> = 2", "<i>x<\/i> = −3"], "ans": 1, "sol": "The vertex is (5, 2).<br>The axis of symmetry is the vertical line through the vertex.<br>Answer: <b><i>x<\/i> = 5<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "What is the <i>y<\/i>-intercept of the graph of <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 7<i>x<\/i> + 12 in the <i>x<\/i><i>y<\/i>-plane?", "opts": ["(0, −7)", "(0, 1)", "(12, 0)", "(0, 12)"], "ans": 3, "sol": "Substitute <i>x<\/i> = 0: <i>y<\/i> = 0 − 0 + 12 = 12.<br>The <i>y<\/i>-intercept is a point on the <i>y<\/i>-axis, so its <i>x<\/i>-coordinate is 0.<br>Answer: <b>(0, 12)<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which function has a maximum value?", "opts": ["<i>f<\/i>(<i>x<\/i>) = −2<i>x<\/i><sup>2<\/sup> + <i>x<\/i> + 9", "<i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i><sup>2<\/sup> − <i>x<\/i> − 9", "<i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> + 5", "<i>f<\/i>(<i>x<\/i>) = 3(<i>x<\/i> − 1)<sup>2<\/sup> − 4"], "ans": 0, "sol": "A quadratic has a maximum when its leading coefficient is negative (it opens down).<br>Only −2<i>x<\/i><sup>2<\/sup> + <i>x<\/i> + 9 has a negative <i>x<\/i><sup>2<\/sup> coefficient.<br>Answer: <b><i>f<\/i>(<i>x<\/i>) = −2<i>x<\/i><sup>2<\/sup> + <i>x<\/i> + 9<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "The graph of <i>y<\/i> = (2<i>x<\/i> − 5)(<i>x<\/i> + 4) crosses the <i>x<\/i>-axis at two points. What is the positive <i>x<\/i>-coordinate of these points?", "ans": ["5/2", "2.5"], "sol": "Set each factor equal to zero.<br>2<i>x<\/i> − 5 = 0 gives <i>x<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>; <i>x<\/i> + 4 = 0 gives <i>x<\/i> = −4.<br>Answer: <b>5/2<\/b> (or 2.5)"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "In which quadrant of the <i>x<\/i><i>y<\/i>-plane is the vertex of the graph of <i>y<\/i> = (<i>x<\/i> + 1)<sup>2<\/sup> − 3?", "opts": ["Quadrant I", "Quadrant II", "Quadrant III", "Quadrant IV"], "ans": 2, "sol": "The vertex is (−1, −3).<br>Both coordinates are negative, so the vertex is in Quadrant III.<br>Answer: <b>Quadrant III<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "A stone is thrown from the top of a cliff. Its height above the water, in meters, <i>t<\/i> seconds after it is thrown is <i>h<\/i>(<i>t<\/i>) = −5<i>t<\/i><sup>2<\/sup> + 10<i>t<\/i> + 15. What does the number 15 represent?", "opts": ["The maximum height of the stone, in meters", "The height of the stone, in meters, at the moment it is thrown", "The number of seconds it takes the stone to reach the water", "The speed of the stone, in meters per second, when it lands"], "ans": 1, "sol": "15 is the value of <i>h<\/i>(0), the height when <i>t<\/i> = 0.<br>The maximum is <i>h<\/i>(1) = 20, and the stone reaches the water at <i>t<\/i> = 3, so 15 is neither of these.<br>Answer: <b>The height of the stone, in meters, at the moment it is thrown<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "What is the maximum value of the function <i>f<\/i>(<i>x<\/i>) = −(<i>x<\/i> − 1)(<i>x<\/i> − 9)?", "ans": ["16"], "sol": "The zeros are 1 and 9, so the vertex is at <i>x<\/i> = 5.<br><i>f<\/i>(5) = −(4)(−4) = 16.<br>Answer: <b>16<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "In a model of a fountain, the height of a jet of water is a quadratic function of the horizontal position <i>x<\/i>, in meters. The water leaves the ground at <i>x<\/i> = −7 and lands at <i>x<\/i> = 3. At what value of <i>x<\/i> is the water highest?", "opts": ["−2", "2", "−5", "5"], "ans": 0, "sol": "The two ground points are the zeros of the function.<br>The highest point is midway between them: <i>x<\/i> = <span class=\"fq\"><span>−7 + 3<\/span><span>2<\/span><\/span> = −2.<br>Answer: <b>−2<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Which expression is equivalent to (<i>x<\/i> + 4)<sup>2<\/sup> − 25?", "opts": ["(<i>x<\/i> + 1)(<i>x<\/i> − 9)", "(<i>x<\/i> − 1)(<i>x<\/i> − 9)", "(<i>x<\/i> + 4)(<i>x<\/i> − 21)", "(<i>x<\/i> − 1)(<i>x<\/i> + 9)"], "ans": 3, "sol": "Treat it as a difference of squares: (<i>x<\/i> + 4)<sup>2<\/sup> − 5<sup>2<\/sup> = (<i>x<\/i> + 4 − 5)(<i>x<\/i> + 4 + 5).<br>This is (<i>x<\/i> − 1)(<i>x<\/i> + 9). Check by expanding: <i>x<\/i><sup>2<\/sup> + 8<i>x<\/i> − 9 both ways.<br>Answer: <b>(<i>x<\/i> − 1)(<i>x<\/i> + 9)<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "What is the <i>y<\/i>-intercept of the graph of <i>y<\/i> = 2(<i>x<\/i> + 3)(<i>x<\/i> − 1)?", "opts": ["(0, −3)", "(0, 6)", "(0, −6)", "(0, 2)"], "ans": 2, "sol": "Substitute <i>x<\/i> = 0: <i>y<\/i> = 2(3)(−1).<br><i>y<\/i> = −6.<br>Answer: <b>(0, −6)<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Which equation defines the parabola shown?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Parabola opening downward with highest point (−2, 5), passing through the marked points (0, 1) and (−4, 1)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" up> + 5<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A gardener uses 120 meters of fencing to enclose a rectangular plot beside a long wall, which forms one side, so no fence is needed there. If each side perpendicular to the wall is <i>w<\/i> meters long, the area is <i>A<\/i>(<i>w<\/i>) = <i>w<\/i>(120 − 2<i>w<\/i>) square meters. What is the greatest possible area, in square meters?", "opts": ["1800", "3600", "900", "30"], "ans": 0, "sol": "The zeros of <i>A<\/i> are <i>w<\/i> = 0 and <i>w<\/i> = 60, so the maximum is at <i>w<\/i> = 30.<br><i>A<\/i>(30) = 30(120 − 60) = 30(60) = 1800.<br>Answer: <b>1800<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "The expression <i>x<\/i><sup>2<\/sup> + 14<i>x<\/i> + 40 is written in the form (<i>x<\/i> + <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i>, where <i>h<\/i> and <i>k<\/i> are constants. What is the value of <i>k<\/i>?", "ans": ["-9"], "sol": "Half of 14 is 7, and 7<sup>2<\/sup> = 49.<br><i>x<\/i><sup>2<\/sup> + 14<i>x<\/i> + 40 = (<i>x<\/i> + 7)<sup>2<\/sup> − 49 + 40 = (<i>x<\/i> + 7)<sup>2<\/sup> − 9.<br>Answer: <b>−9<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "The height of a hanging cable above a road is modeled by a quadratic function <i>h<\/i>, where <i>x<\/i> is the horizontal distance, in meters, from the left tower. If <i>h<\/i>(4) = <i>h<\/i>(16), how far from the left tower, in meters, is the lowest point of the cable?", "opts": ["6", "12", "20", "10"], "ans": 3, "sol": "Equal heights at <i>x<\/i> = 4 and <i>x<\/i> = 16 mean these points are symmetric about the axis.<br>The axis is <i>x<\/i> = <span class=\"fq\"><span>4 + 16<\/span><span>2<\/span><\/span> = 10, which is where the lowest point is.<br>Answer: <b>10<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A company's weekly revenue, in dollars, when it charges <i>p<\/i> dollars for a game is modeled by <i>R<\/i>(<i>p<\/i>) = −15(<i>p<\/i> − 30)<sup>2<\/sup> + 13500. Which statement is true according to the model?", "opts": ["Revenue is greatest, $30, when the price is $13,500.", "Revenue is least, $13,500, when the price is $30.", "Revenue is greatest, $13,500, when the price is $30.", "Revenue is $13,500 when the price is $0."], "ans": 2, "sol": "In vertex form, the vertex is (30, 13500), and <i>a<\/i> = −15 &lt; 0, so this is a maximum.<br>The input <i>p<\/i> = 30 is the price; the output 13,500 is the revenue. (At <i>p<\/i> = 0, <i>R<\/i> = 0.)<br>Answer: <b>Revenue is greatest, $13,500, when the price is $30.<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Which of the following is equivalent to 3<i>x<\/i><sup>2<\/sup> − 24<i>x<\/i> + 50?", "opts": ["3(<i>x<\/i> − 4)<sup>2<\/sup> + 2", "3(<i>x<\/i> − 4)<sup>2<\/sup> + 34", "3(<i>x<\/i> + 4)<sup>2<\/sup> + 2", "3(<i>x<\/i> − 4)<sup>2<\/sup> − 14"], "ans": 0, "sol": "Factor 3 from the <i>x<\/i>-terms: 3(<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i>) + 50.<br>Complete the square: 3(<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> + 16) − 48 + 50.<br>So the expression is 3(<i>x<\/i> − 4)<sup>2<\/sup> + 2. Answer: <b>3(<i>x<\/i> − 4)<sup>2<\/sup> + 2<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The graph of <i>y<\/i> = <i>a<\/i>(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i> is a parabola, where <i>a<\/i>, <i>h<\/i> and <i>k<\/i> are constants with <i>a<\/i> &lt; 0, <i>h<\/i> &gt; 0 and <i>k<\/i> &lt; 0. Which statement must be true?", "opts": ["The graph has two <i>x<\/i>-intercepts.", "The graph has no <i>x<\/i>-intercepts.", "The vertex of the graph is in Quadrant II.", "The <i>y<\/i>-intercept of the graph is positive."], "ans": 1, "sol": "Since <i>a<\/i> &lt; 0, the parabola opens down, so its highest point is the vertex (<i>h<\/i>, <i>k<\/i>).<br>The vertex is below the <i>x<\/i>-axis (<i>k<\/i> &lt; 0), so the whole graph is below the <i>x<\/i>-axis and never crosses it.<br>The vertex is in Quadrant IV, and the <i>y<\/i>-intercept <i>a<\/i><i>h<\/i><sup>2<\/sup> + <i>k<\/i> is negative. Answer: <b>The graph has no <i>x<\/i>-intercepts.<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = <i>a<\/i>(<i>x<\/i> − 2)(<i>x<\/i> − 8), where <i>a<\/i> is a constant. The <i>y<\/i>-intercept of the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) is (0, 32). What is the value of <i>f<\/i>(5)?", "ans": ["-18"], "sol": "<i>f<\/i>(0) = <i>a<\/i>(−2)(−8) = 16<i>a<\/i> = 32, so <i>a<\/i> = 2.<br><i>f<\/i>(5) = 2(3)(−3) = −18.<br>Answer: <b>−18<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "A ball is thrown upward from a rooftop. Its height, in meters, <i>t<\/i> seconds after it is thrown is <i>h<\/i>(<i>t<\/i>) = −5<i>t<\/i><sup>2<\/sup> + 20<i>t<\/i> + 25. How many seconds after it is thrown does the ball hit the ground?", "ans": ["5"], "sol": "Set <i>h<\/i>(<i>t<\/i>) = 0: −5(<i>t<\/i><sup>2<\/sup> − 4<i>t<\/i> − 5) = 0.<br>Factor: −5(<i>t<\/i> − 5)(<i>t<\/i> + 1) = 0, so <i>t<\/i> = 5 or <i>t<\/i> = −1.<br>Time cannot be negative. Answer: <b>5<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "The function <i>g<\/i> is defined by <i>g<\/i>(<i>x<\/i>) = −2<i>x<\/i><sup>2<\/sup> + 8<i>x<\/i> + <i>c<\/i>, where <i>c<\/i> is a constant. The maximum value of <i>g<\/i> is 13. What is the value of <i>c<\/i>?", "opts": ["13", "−3", "21", "5"], "ans": 3, "sol": "The vertex is at <i>x<\/i> = −<span class=\"fq\"><span>8<\/span><span>2(−2)<\/span><\/span> = 2.<br><i>g<\/i>(2) = −8 + 16 + <i>c<\/i> = 8 + <i>c<\/i>.<br>Set 8 + <i>c<\/i> = 13, so <i>c<\/i> = 5. Answer: <b>5<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = <i>x<\/i><sup>2<\/sup> − 2<i>x<\/i> − 15. Which equivalent form of <i>f<\/i>(<i>x<\/i>) displays the <i>x<\/i>-intercepts of the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>) as constants or coefficients?", "opts": ["(<i>x<\/i> − 1)<sup>2<\/sup> − 16", "(<i>x<\/i> + 5)(<i>x<\/i> − 3)", "(<i>x<\/i> − 5)(<i>x<\/i> + 3)", "<i>x<\/i>(<i>x<\/i> − 2) − 15"], "ans": 2, "sol": "Factored form shows the zeros. Two numbers with product −15 and sum −2 are −5 and 3.<br><i>f<\/i>(<i>x<\/i>) = (<i>x<\/i> − 5)(<i>x<\/i> + 3), so the <i>x<\/i>-intercepts are 5 and −3. ((<i>x<\/i> − 1)<sup>2<\/sup> − 16 is equivalent but shows the vertex; (<i>x<\/i> + 5)(<i>x<\/i> − 3) is not equivalent.)<br>Answer: <b>(<i>x<\/i> − 5)(<i>x<\/i> + 3)<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "For the function <i>f<\/i>(<i>x<\/i>) = −4<i>x<\/i><sup>2<\/sup> + 24<i>x<\/i> − 11, which statement is true?", "opts": ["<i>f<\/i> has a maximum value of 25 at <i>x<\/i> = 3.", "<i>f<\/i> has a minimum value of 25 at <i>x<\/i> = 3.", "<i>f<\/i> has a maximum value of 3 at <i>x<\/i> = 25.", "<i>f<\/i> has a maximum value of −11 at <i>x<\/i> = 0."], "ans": 0, "sol": "The vertex is at <i>x<\/i> = −<span class=\"fq\"><span>24<\/span><span>2(−4)<\/span><\/span> = 3, and <i>f<\/i>(3) = −36 + 72 − 11 = 25.<br>Since <i>a<\/i> = −4 &lt; 0, 25 is a maximum value.<br>Answer: <b><i>f<\/i> has a maximum value of 25 at <i>x<\/i> = 3.<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The altitude, in meters, of a drone <i>t<\/i> seconds after takeoff from a platform is <i>A<\/i>(<i>t<\/i>) = −2(<i>t<\/i> − 6)<sup>2<\/sup> + 80 for 0 ≤ <i>t<\/i> ≤ 12. How many meters higher is the drone at its highest point than at <i>t<\/i> = 0?", "opts": ["80", "8", "74", "72"], "ans": 3, "sol": "The highest altitude is the vertex value, 80 meters, at <i>t<\/i> = 6.<br><i>A<\/i>(0) = −2(36) + 80 = 8.<br>80 − 8 = 72. Answer: <b>72<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "The expression <i>x<\/i><sup>2<\/sup> − 9<i>x<\/i> + 20 is written in the form (<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i>, where <i>h<\/i> and <i>k<\/i> are constants. What is the value of <i>h<\/i>?", "ans": ["9/2", "4.5"], "sol": "Half of −9 is −<span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>, so <i>x<\/i><sup>2<\/sup> − 9<i>x<\/i> + 20 = (<i>x<\/i> − <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>)<sup>2<\/sup> − <span class=\"fq\"><span>81<\/span><span>4<\/span><\/span> + 20.<br>So <i>h<\/i> = <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span> (and <i>k<\/i> = −<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>).<br>Answer: <b>9/2<\/b> (or 4.5)"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The graph of <i>y<\/i> = <i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i>, where <i>b<\/i> and <i>c<\/i> are constants, is shown. What is the value of <i>b<\/i>?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Parabola opening upward crossing the x-axis at (−3, 0) and (1, 0), the y-axis at (0, −3), with lowest point (−1, −4)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" >(<i>x<\/i>) is <i>x<\/i> = −3. What is the value of <i>b<\/i>?", "opts": ["−12", "6", "12", "−6"], "ans": 2, "sol": "The axis is <i>x<\/i> = −<span class=\"fq\"><span><i>b<\/i><\/span><span>2(2)<\/span><\/span> = −<span class=\"fq\"><span><i>b<\/i><\/span><span>4<\/span><\/span>.<br>Set −<span class=\"fq\"><span><i>b<\/i><\/span><span>4<\/span><\/span> = −3, so <i>b<\/i> = 12.<br>Answer: <b>12<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Which of the following is equivalent to −<i>x<\/i><sup>2<\/sup> + 8<i>x<\/i> − 10?", "opts": ["−(<i>x<\/i> − 4)<sup>2<\/sup> − 26", "−(<i>x<\/i> + 4)<sup>2<\/sup> + 6", "−(<i>x<\/i> − 4)<sup>2<\/sup> − 6", "−(<i>x<\/i> − 4)<sup>2<\/sup> + 6"], "ans": 3, "sol": "Factor −1 from the <i>x<\/i>-terms: −(<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i>) − 10.<br>Complete the square: −(<i>x<\/i><sup>2<\/sup> − 8<i>x<\/i> + 16) + 16 − 10.<br>This is −(<i>x<\/i> − 4)<sup>2<\/sup> + 6. Answer: <b>−(<i>x<\/i> − 4)<sup>2<\/sup> + 6<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "A club sells 300 tickets to a show when the price is $40 per ticket. For each $1 increase in price, it sells 5 fewer tickets. What is the maximum possible ticket revenue, in dollars?", "ans": ["12500"], "sol": "With an increase of <i>x<\/i> dollars, revenue is <i>R<\/i>(<i>x<\/i>) = (40 + <i>x<\/i>)(300 − 5<i>x<\/i>).<br>The zeros are <i>x<\/i> = −40 and <i>x<\/i> = 60, so the maximum is at <i>x<\/i> = 10.<br><i>R<\/i>(10) = 50 × 250 = 12,500. Answer: <b>12500<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The graph of <i>y<\/i> = <i>a<\/i><i>x<\/i><sup>2<\/sup> + <i>b<\/i><i>x<\/i> + <i>c<\/i>, where <i>a<\/i>, <i>b<\/i> and <i>c<\/i> are constants, opens upward and has <i>x<\/i>-intercepts at −4 and 2. Which must be true?", "opts": ["<i>b<\/i> &lt; 0 and <i>c<\/i> &lt; 0", "<i>b<\/i> &gt; 0 and <i>c<\/i> &lt; 0", "<i>b<\/i> &gt; 0 and <i>c<\/i> &gt; 0", "<i>b<\/i> &lt; 0 and <i>c<\/i> &gt; 0"], "ans": 1, "sol": "The equation is <i>y<\/i> = <i>a<\/i>(<i>x<\/i> + 4)(<i>x<\/i> − 2) = <i>a<\/i>(<i>x<\/i><sup>2<\/sup> + 2<i>x<\/i> − 8) with <i>a<\/i> &gt; 0.<br>So <i>b<\/i> = 2<i>a<\/i> &gt; 0 and <i>c<\/i> = −8<i>a<\/i> &lt; 0.<br>Answer: <b><i>b<\/i> &gt; 0 and <i>c<\/i> &lt; 0<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = −2(<i>x<\/i> + 1)<sup>2<\/sup> + 18. What are the <i>x<\/i>-intercepts of the graph of <i>y<\/i> = <i>f<\/i>(<i>x<\/i>)?", "opts": ["<i>x<\/i> = −4 and <i>x<\/i> = 2", "<i>x<\/i> = −2 and <i>x<\/i> = 4", "<i>x<\/i> = −10 and <i>x<\/i> = 8", "<i>x<\/i> = −1 and <i>x<\/i> = 18"], "ans": 0, "sol": "Set −2(<i>x<\/i> + 1)<sup>2<\/sup> + 18 = 0, so (<i>x<\/i> + 1)<sup>2<\/sup> = 9.<br><i>x<\/i> + 1 = 3 or <i>x<\/i> + 1 = −3, so <i>x<\/i> = 2 or <i>x<\/i> = −4.<br>Answer: <b><i>x<\/i> = −4 and <i>x<\/i> = 2<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "The points (−3, 20) and (<i>k<\/i>, 20) lie on the graph of <i>y<\/i> = <i>x<\/i><sup>2<\/sup> − 5<i>x<\/i> − 4, where <i>k<\/i> ≠ −3. What is the value of <i>k<\/i>?", "ans": ["8"], "sol": "The axis of symmetry is <i>x<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>.<br>(−3, 20) is <span class=\"fq\"><span>11<\/span><span>2<\/span><\/span> units to the left of the axis, so its partner is <span class=\"fq\"><span>11<\/span><span>2<\/span><\/span> units to the right: <i>k<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span> + <span class=\"fq\"><span>11<\/span><span>2<\/span><\/span> = 8.<br>Check: 64 − 40 − 4 = 20. Answer: <b>8<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A ball is kicked into the air. Its height, in meters, <i>t<\/i> seconds after it is kicked is <i>h<\/i>(<i>t<\/i>) = −5<i>t<\/i><sup>2<\/sup> + 25<i>t<\/i> + 0.5. For how many seconds is the ball at a height of at least 20.5 meters?", "opts": ["4", "1", "3", "2.5"], "ans": 2, "sol": "Solve −5<i>t<\/i><sup>2<\/sup> + 25<i>t<\/i> + 0.5 = 20.5: −5<i>t<\/i><sup>2<\/sup> + 25<i>t<\/i> − 20 = 0, so <i>t<\/i><sup>2<\/sup> − 5<i>t<\/i> + 4 = 0.<br>(<i>t<\/i> − 1)(<i>t<\/i> − 4) = 0, so the ball is at 20.5 meters at <i>t<\/i> = 1 and <i>t<\/i> = 4, and above it in between.<br>4 − 1 = 3. Answer: <b>3<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The expression 4<i>x<\/i><sup>2<\/sup> − 24<i>x<\/i> + <i>c<\/i>, where <i>c<\/i> is a constant, can be rewritten as 4(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> + 5, where <i>h<\/i> is a constant. What is the value of <i>c<\/i>?", "opts": ["14", "41", "5", "23"], "ans": 1, "sol": "Matching the <i>x<\/i>-terms, 4(<i>x<\/i> − <i>h<\/i>)<sup>2<\/sup> must expand to 4<i>x<\/i><sup>2<\/sup> − 24<i>x<\/i> + ..., so −8<i>h<\/i> = −24 and <i>h<\/i> = 3.<br>4(<i>x<\/i> − 3)<sup>2<\/sup> + 5 = 4<i>x<\/i><sup>2<\/sup> − 24<i>x<\/i> + 36 + 5.<br>So <i>c<\/i> = 41. Answer: <b>41<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "Which of the following is an equation of the parabola shown in the <i>x<\/i><i>y<\/i>-plane?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Parabola opening downward with highest point (2, 5), passing through the marked points (0, 3) and (4, 3)\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/> maximum is at <i>p<\/i> = 35.<br><i>P<\/i>(35) = 15 × 60 = 900. Answer: <b>900<\/b>"}, {"lo": "LO3", "diff": "X", "type": "mcq", "q": "The expression 2<i>x<\/i><sup>2<\/sup> + 6<i>x<\/i> + 1 is written in the form 2(<i>x<\/i> + <i>h<\/i>)<sup>2<\/sup> + <i>k<\/i>, where <i>h<\/i> and <i>k<\/i> are constants. What is the value of <i>h<\/i> + <i>k<\/i>?", "opts": ["−5", "−2", "<span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>", "4"], "ans": 1, "sol": "2(<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i>) + 1 = 2(<i>x<\/i><sup>2<\/sup> + 3<i>x<\/i> + <span class=\"fq\"><span>9<\/span><span>4<\/span><\/span>) − <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span> + 1.<br>So the expression is 2(<i>x<\/i> + <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>)<sup>2<\/sup> − <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>, giving <i>h<\/i> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span> and <i>k<\/i> = −<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>.<br><i>h<\/i> + <i>k<\/i> = −<span class=\"fq\"><span>4<\/span><span>2<\/span><\/span> = −2. Answer: <b>−2<\/b>"}], "unit_no": 2, "topic_no": "3", "code": "3.1"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }
