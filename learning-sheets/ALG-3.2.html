var S = {"id": "ALG-3.2", "unit": "Algebra", "topic": "Linear functions", "title": "Rate of change and writing linear functions", "intro": "A linear function changes by the same amount for every equal step in its input, and that constant rate of change is its slope. On the DSAT you will find this rate from points, tables and graphs, write the function in the form <i>f<\/i>(<i>x<\/i>) = <i>mx<\/i> + <i>b<\/i>, and decide whether a table of values is linear.", "los": [{"id": "LO1", "text": "Determine the slope (rate of change) of a line from two points, a table, or a graph."}, {"id": "LO2", "text": "Write a linear function in the form <i>f<\/i>(<i>x<\/i>) = <i>mx<\/i> + <i>b<\/i> from two points, two function values, or a table."}, {"id": "LO3", "text": "Identify whether a linear function is increasing, decreasing, or constant from its slope, table, or graph."}, {"id": "LO4", "text": "Determine a rate of change in a real-world situation and state it with the correct units."}, {"id": "LO5", "text": "Determine whether a table of values represents a linear function by comparing rates of change."}], "notes": [{"lo": "LO1", "h": "Slope is a rate of change", "html": "The <b>slope<\/b> of a line measures how much the output changes for each 1-unit increase in the input. For any two points (<i>x<\/i><sub>1<\/sub>, <i>y<\/i><sub>1<\/sub>) and (<i>x<\/i><sub>2<\/sub>, <i>y<\/i><sub>2<\/sub>) on the line:<div class=\"rule\">slope <i>m<\/i> = <span class=\"fq\"><span>change in <i>y<\/i><\/span><span>change in <i>x<\/i><\/span><\/span> = <span class=\"fq\"><span><i>y<\/i><sub>2<\/sub> − <i>y<\/i><sub>1<\/sub><\/span><span><i>x<\/i><sub>2<\/sub> − <i>x<\/i><sub>1<\/sub><\/span><\/span><\/div>Two habits keep this safe:<ul><li>Subtract in the <b>same order<\/b> on top and bottom. If you start with the second point on top, start with it on the bottom too.<\/li><li>Put the <b>output<\/b> (<i>y<\/i> or <i>f<\/i>(<i>x<\/i>)) on top. Flipping the fraction gives the reciprocal, which is a popular wrong answer choice.<\/li><\/ul>Example: through (2, 9) and (6, 1), <i>m<\/i> = <span class=\"fq\"><span>1 − 9<\/span><span>6 − 2<\/span><\/span> = <span class=\"fq\"><span>−8<\/span><span>4<\/span><\/span> = −2. A line has the same slope no matter which two of its points you use, so a slope of −2 means <i>y<\/i> drops 2 for every 1 step right."}, {"lo": "LO1", "h": "Reading slope from a table or a graph", "html": "<b>From a table:<\/b> pick any two rows and divide the difference in outputs by the difference in inputs. Do not assume the inputs go up by 1; always compute the change in <i>x<\/i>.<br><br><b>From a graph:<\/b> choose two points where the line crosses grid intersections exactly, then count the rise and the run between them. Read the axis labels first, because the two axes may use different scales.<svg class=\"fig\" viewBox=\"0 0 228 340\" role=\"img\" aria-label=\"Line in the xy-plane through the points (0, 1) and (3, 7)\"><g class=\"fg-grid\"><line x1=\"30\" y1=\"30\" x2=\"30\" y2=\"310\"/><line x1=\"58\" y1=\"30\" x2=\"58\" y2=\"310\"/><line x1=\"86\" y1=\"30\" x2=\"86\" y2=\"310\"/><line x1=\"114\" y1=\"30\" x2=\"114\" y2=\"310\"/><line x1=\"142\" y1=\"30\" x2=\"142\" y2=\"310\"/><line x1=\"170\" y1=\"30\" x2=\"170\" y2=\"310\"/><line x1=\"198\" y1=\"30\" x2=\"198\" y2=\"310\"/><line x1=\"30\" y1=\"30\" x2=\"198\" y2=\"30\"/><line x1=\"30\" y1=\"58\" x2=\"198\" y2=\"58\"/><line x1=\"30\" y1=\"86\" x2=\"198\" y2=\"86\"/><line x1=\"30\" y1=\"114\" x2=\"198\" y2=\"114\"/><line x1=\"30\" y1=\"142\" x2=\"198\" y2=\"142\"/><line x1=\"30\" y1=\"170\" x2=\"198\" y2=\"170\"/><line x1=\"30\" y1=\"198\" x2=\"198\" y2=\"198\"/><line x1=\"30\" y1=\"226\" x2=\"198\" y2=\"226\"/><line x1=\"30\" y1=\"254\" x2=\"198\" y2=\"254\"/><line x1=\"30\" y1=\"282\" x2=\"198\" y2=\"282\"/><line x1=\"30\" y1=\"310\" x2=\"198\" y2=\"310\"/><\/g><line class=\"fg-axis\" x1=\"30\" y1=\"310\" x2=\"198\" y2=\"310\"/><line class=\"fg-axis\" x1=\"30\" y1=\"30\" x2=\"30\" y2=\"310\"/><line class=\"fg-fit\" x1=\"30.0\" y1=\"282.0\" x2=\"156.0\" y2=\"30.0\"/><g class=\"fg-pts\"><circle cx=\"30.0\" cy=\"282.0\" r=\"4\"/><circle cx=\"114.0\" cy=\"114.0\" r=\"4\"/><\/g><g class=\"fg-lab\"><text x=\"58\" y=\"326\" text-anchor=\"middle\">1<\/text><text x=\"86\" y=\"326\" text-anchor=\"middle\">2<\/text><text x=\"114\" y=\"326\" text-anchor=\"middle\">3<\/text><text x=\"142\" y=\"326\" text-anchor=\"middle\">4<\/text><text x=\"170\" y=\"326\" text-anchor=\"middle\">5<\/text><text x=\"198\" y=\"326\" text-anchor=\"middle\">6<\/text><text x=\"24\" y=\"286.0\" text-anchor=\"end\">1<\/text><text x=\"24\" y=\"258.0\" text-anchor=\"end\">2<\/text><text x=\"24\" y=\"230.0\" text-anchor=\"end\">3<\/text><text x=\"24\" y=\"202.0\" text-anchor=\"end\">4<\/text><text x=\"24\" y=\"174.0\" text-anchor=\"end\">5<\/text><text x=\"24\" y=\"146.0\" text-anchor=\"end\">6<\/text><text x=\"24\" y=\"118.0\" text-anchor=\"end\">7<\/text><text x=\"24\" y=\"90.0\" text-anchor=\"end\">8<\/text><text x=\"24\" y=\"62.0\" text-anchor=\"end\">9<\/text><text x=\"24\" y=\"34.0\" text-anchor=\"end\">10<\/text><text x=\"24\" y=\"326\" text-anchor=\"end\">0<\/text><text x=\"210\" y=\"314\">x<\/text><text x=\"30\" y=\"20\" text-anchor=\"middle\">y<\/text><\/g><\/svg>The line above passes through (0, 1) and (3, 7). Rise = 7 − 1 = 6 and run = 3 − 0 = 3, so the slope is <span class=\"fq\"><span>6<\/span><span>3<\/span><\/span> = 2.<div class=\"rule\">Going up from left to right means positive slope; going down means negative slope.<\/div>"}, {"lo": "LO2", "h": "Writing f(x) = <i>m<\/i><i>x<\/i> + b from two points", "html": "To write a linear function from two points or two function values:<ol><li>Find the slope <i>m<\/i> from the two points.<\/li><li>Substitute one point into <i>y<\/i> = <i>mx<\/i> + <i>b<\/i> and solve for <i>b<\/i>: <i>b<\/i> = <i>y<\/i> − <i>mx<\/i>.<\/li><li>Check with the other point.<\/li><\/ol>Function notation is just point notation: <i>f<\/i>(4) = 13 means the point (4, 13) is on the graph.<br><br>Example: <i>f<\/i>(1) = 5 and <i>f<\/i>(4) = 14. Then <i>m<\/i> = <span class=\"fq\"><span>14 − 5<\/span><span>4 − 1<\/span><\/span> = 3 and <i>b<\/i> = 5 − 3(1) = 2, so <i>f<\/i>(<i>x<\/i>) = 3<i>x<\/i> + 2. Check: 3(4) + 2 = 14. If a table includes <i>x<\/i> = 0, the output in that row is <i>b<\/i> directly.<div class=\"tip\">Desmos tip: type the points into a table (columns <i>x<\/i><sub>1<\/sub>, <i>y<\/i><sub>1<\/sub>), then enter <i>y<\/i><sub>1<\/sub> ~ <i>m<\/i><i>x<\/i><sub>1<\/sub> + <i>b<\/i>. Desmos reports <i>m<\/i> and <i>b<\/i> instantly.<\/div>"}, {"lo": "LO3", "h": "Increasing, decreasing, or constant", "html": "The sign of the slope tells you the direction of a linear function.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Slope<\/th><th>Function is<\/th><th>Graph<\/th><th>Table<\/th><\/tr><tr><td><i>m<\/i> &gt; 0<\/td><td>increasing<\/td><td>rises left to right<\/td><td>outputs go up as inputs go up<\/td><\/tr><tr><td><i>m<\/i> &lt; 0<\/td><td>decreasing<\/td><td>falls left to right<\/td><td>outputs go down as inputs go up<\/td><\/tr><tr><td><i>m<\/i> = 0<\/td><td>constant<\/td><td>horizontal<\/td><td>outputs never change<\/td><\/tr><\/table><\/div>Always find the coefficient of <i>x<\/i>, not the constant. In <i>g<\/i>(<i>x<\/i>) = −7 + 2<i>x<\/i> the slope is 2, so <i>g<\/i> is increasing even though a negative number is written first. Expand any brackets first: <i>h<\/i>(<i>x<\/i>) = −3(1 − 2<i>x<\/i>) = 6<i>x<\/i> − 3 is increasing.<div class=\"rule\">If the slope contains a constant, such as (<i>k<\/i> − 4)<i>x<\/i>, then the function is decreasing exactly when <i>k<\/i> − 4 &lt; 0.<\/div>"}, {"lo": "LO4", "h": "Units of a rate of change", "html": "In a real-world situation, the slope has units:<div class=\"rule\">units of slope = <span class=\"fq\"><span>units of output<\/span><span>units of input<\/span><\/span>, read as \"output units <b>per<\/b> input unit\"<\/div>If <i>C<\/i>(<i>n<\/i>) is the cost in dollars of <i>n<\/i> tickets, the slope is in dollars per ticket. If <i>d<\/i>(<i>t<\/i>) is distance in kilometers after <i>t<\/i> hours, the slope is in kilometers per hour.<ul><li>The output is the quantity named first in \"rate of change of ___ with respect to ___\".<\/li><li>A negative rate means the quantity is decreasing, for example −4 liters per minute for a draining tank.<\/li><li>If times are given as clock times, convert the elapsed time into the unit the question asks for before dividing.<\/li><\/ul>Example: a balance goes from $620 in week 2 to $500 in week 8. The rate is <span class=\"fq\"><span>500 − 620<\/span><span>8 − 2<\/span><\/span> = −20 dollars per week."}, {"lo": "LO5", "h": "Is a table linear?", "html": "A table represents a linear function exactly when the rate of change is the <b>same between every pair of consecutive rows<\/b>.<div class=\"rule\">Compute <span class=\"fq\"><span>Δ<i>y<\/i><\/span><span>Δ<i>x<\/i><\/span><\/span> for each pair of neighboring rows. All equal: linear. Any different: not linear.<\/div>When the <i>x<\/i>-values are equally spaced, you may just check that the <i>y<\/i>-values change by a constant amount. When they are not equally spaced, you must divide by each change in <i>x<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>1<\/td><td>2<\/td><\/tr><tr><td>3<\/td><td>8<\/td><\/tr><tr><td>4<\/td><td>11<\/td><\/tr><tr><td>8<\/td><td>23<\/td><\/tr><\/table><\/div>Rates: <span class=\"fq\"><span>6<\/span><span>2<\/span><\/span> = 3, <span class=\"fq\"><span>3<\/span><span>1<\/span><\/span> = 3, <span class=\"fq\"><span>12<\/span><span>4<\/span><\/span> = 3. The <i>y<\/i>-changes (6, 3, 12) differ, but every rate is 3, so the table <b>is<\/b> linear.<div class=\"tip\">Desmos tip: enter the table and type <i>y<\/i><sub>1<\/sub> ~ <i>m<\/i><i>x<\/i><sub>1<\/sub> + <i>b<\/i>. If <i>R<\/i><sup>2<\/sup> = 1 exactly, every point lies on one line.<\/div>"}], "examples": [{"lo": "LO1", "q": "Find the slope of the line that passes through (−2, 7) and (4, −5).", "steps": ["Change in <i>y<\/i>: −5 − 7 = −12.", "Change in <i>x<\/i>, in the same order: 4 − (−2) = 6.", "Slope = <span class=\"fq\"><span>−12<\/span><span>6<\/span><\/span> = −2."], "ans": "<i>m<\/i> = −2"}, {"lo": "LO2", "q": "The table shows values of the linear function <i>f<\/i>. Write <i>f<\/i>(<i>x<\/i>) in the form <i>mx<\/i> + <i>b<\/i>.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>f<\/i>(<i>x<\/i>)<\/th><\/tr><tr><td>1<\/td><td>4<\/td><\/tr><tr><td>3<\/td><td>10<\/td><\/tr><tr><td>5<\/td><td>16<\/td><\/tr><tr><td>7<\/td><td>22<\/td><\/tr><\/table><\/div>", "steps": ["The inputs go up by 2 and the outputs go up by 6, so <i>m<\/i> = <span class=\"fq\"><span>6<\/span><span>2<\/span><\/span> = 3.", "Use the point (1, 4): <i>b<\/i> = 4 − 3(1) = 1.", "Check the last row: 3(7) + 1 = 22. It matches."], "ans": "<i>f<\/i>(<i>x<\/i>) = 3<i>x<\/i> + 1"}, {"lo": "LO5", "q": "Is the relationship in the table linear? If so, is it increasing or decreasing, and what is its equation?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>0<\/td><td>9<\/td><\/tr><tr><td>2<\/td><td>6<\/td><\/tr><tr><td>5<\/td><td>1.5<\/td><\/tr><tr><td>6<\/td><td>0<\/td><\/tr><\/table><\/div>", "steps": ["Rates between neighboring rows: <span class=\"fq\"><span>6 − 9<\/span><span>2 − 0<\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>, <span class=\"fq\"><span>1.5 − 6<\/span><span>5 − 2<\/span><\/span> = <span class=\"fq\"><span>−4.5<\/span><span>3<\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>, <span class=\"fq\"><span>0 − 1.5<\/span><span>6 − 5<\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>.", "Every rate is −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>, so the table is linear. The slope is negative, so it is decreasing.", "The row with <i>x<\/i> = 0 gives <i>b<\/i> = 9."], "ans": "Linear and decreasing; <i>y<\/i> = −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> + 9"}, {"lo": "LO4", "q": "A tank is drained at a constant rate. After 4 minutes it holds 130 liters, and after 10 minutes it holds 88 liters. Find the rate of change of the volume with respect to time, with units, and write the volume <i>V<\/i>(<i>t<\/i>) after <i>t<\/i> minutes.", "steps": ["Rate = <span class=\"fq\"><span>88 − 130<\/span><span>10 − 4<\/span><\/span> = <span class=\"fq\"><span>−42<\/span><span>6<\/span><\/span> = −7.", "Units: output (liters) per input (minute), so −7 liters per minute.", "<i>V<\/i>(<i>t<\/i>) = −7<i>t<\/i> + <i>b<\/i>, and 130 = −7(4) + <i>b<\/i> gives <i>b<\/i> = 158."], "ans": "−7 liters per minute; <i>V<\/i>(<i>t<\/i>) = −7<i>t<\/i> + 158"}, {"lo": "LO3", "q": "For what values of the constant <i>a<\/i> is <i>g<\/i>(<i>x<\/i>) = (6 − 2<i>a<\/i>)<i>x<\/i> + <i>a<\/i> a decreasing function?", "steps": ["The slope is the coefficient of <i>x<\/i>: 6 − 2<i>a<\/i>. The term <i>a<\/i> on its own does not affect direction.", "Decreasing means slope &lt; 0: 6 − 2<i>a<\/i> &lt; 0.", "So 6 &lt; 2<i>a<\/i>, which gives <i>a<\/i> &gt; 3."], "ans": "<i>a<\/i> &gt; 3"}, {"lo": "LO2", "q": "The linear function <i>f<\/i> satisfies <i>f<\/i>(4) = 2·<i>f<\/i>(1) and <i>f<\/i>(6) = 20. Find <i>f<\/i>(<i>x<\/i>).", "steps": ["Write <i>f<\/i>(<i>x<\/i>) = <i>mx<\/i> + <i>b<\/i>. Then 4<i>m<\/i> + <i>b<\/i> = 2(<i>m<\/i> + <i>b<\/i>), which simplifies to <i>b<\/i> = 2<i>m<\/i>.", "Also 6<i>m<\/i> + <i>b<\/i> = 20. Substitute: 6<i>m<\/i> + 2<i>m<\/i> = 20, so <i>m<\/i> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>.", "Then <i>b<\/i> = 2(<span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>) = 5. Check: <i>f<\/i>(4) = 15 and 2·<i>f<\/i>(1) = 2(7.5) = 15."], "ans": "<i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i> + 5"}], "traps": ["Dividing the change in <i>x<\/i> by the change in <i>y<\/i> gives the reciprocal of the slope, so always put the output change on top.", "Subtracting in one order on top and the other order on the bottom flips the sign of the slope.", "In a table whose <i>x<\/i>-values jump by 2, 3 or more, the change in <i>y<\/i> between rows is not the slope; you must divide by the change in <i>x<\/i>.", "The first output in a table is the <i>y<\/i>-intercept only when that row has <i>x<\/i> = 0.", "Reversing the units of a rate, such as writing hours per mile instead of miles per hour, describes a different quantity."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "What is the slope of the line that passes through the points (1, 3) and (5, 11)?", "opts": ["<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>", "2", "4", "8"], "ans": 1, "sol": "Slope = <span class=\"fq\"><span>11 − 3<\/span><span>5 − 1<\/span><\/span> = <span class=\"fq\"><span>8<\/span><span>4<\/span><\/span> = 2. Answer: <b>2<\/b>", "hint": "Divide the change in <i>y<\/i> by the change in <i>x<\/i>, subtracting in the same order."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Which of the following functions is decreasing?", "opts": ["<i>f<\/i>(<i>x<\/i>) = 4<i>x<\/i> − 9", "<i>f<\/i>(<i>x<\/i>) = −9 + 0.4<i>x<\/i>", "<i>f<\/i>(<i>x<\/i>) = 9 − 4<i>x<\/i>", "<i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span><i>x<\/i><\/span><span>4<\/span><\/span> − 9"], "ans": 2, "sol": "A linear function is decreasing when the coefficient of <i>x<\/i> is negative. The coefficients are 4, 0.4, −4 and <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>; only 9 − 4<i>x<\/i> has a negative one. Answer: <b><i>f<\/i>(<i>x<\/i>) = 9 − 4<i>x<\/i><\/b>", "hint": "Look only at the number multiplying <i>x<\/i>, not the constant term."}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "The table shows values of a linear relationship. What is the rate of change of <i>y<\/i> with respect to <i>x<\/i>?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>2<\/td><td>9<\/td><\/tr><tr><td>4<\/td><td>15<\/td><\/tr><tr><td>6<\/td><td>21<\/td><\/tr><\/table><\/div>", "ans": ["3"], "sol": "From one row to the next, <i>x<\/i> increases by 2 and <i>y<\/i> increases by 6. Rate = <span class=\"fq\"><span>6<\/span><span>2<\/span><\/span> = 3. Answer: <b>3<\/b>", "hint": "The <i>x<\/i>-values do not go up by 1. How much does <i>x<\/i> change between rows?"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A car travels at a constant speed. After 2 hours it has traveled a total of 110 miles, and after 5 hours it has traveled a total of 275 miles. Which of the following is the rate of change of the distance traveled with respect to time?", "opts": ["55 miles per hour", "55 hours per mile", "<span class=\"fq\"><span>1<\/span><span>55<\/span><\/span> mile per hour", "165 miles per hour"], "ans": 0, "sol": "Rate = <span class=\"fq\"><span>275 − 110<\/span><span>5 − 2<\/span><\/span> = <span class=\"fq\"><span>165<\/span><span>3<\/span><\/span> = 55. Distance (miles) is the output and time (hours) is the input, so the units are miles per hour. Answer: <b>55 miles per hour<\/b>", "hint": "The units are output units per input unit. Which quantity is the output here?"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which of the following defines a linear function whose graph passes through the points (0, −4) and (3, 2)?", "opts": ["<i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> − 4", "<i>f<\/i>(<i>x<\/i>) = −4<i>x<\/i> + 2", "<i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> + 4", "<i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> − 4"], "ans": 3, "sol": "Slope = <span class=\"fq\"><span>2 − (−4)<\/span><span>3 − 0<\/span><\/span> = <span class=\"fq\"><span>6<\/span><span>3<\/span><\/span> = 2. The point (0, −4) gives <i>b<\/i> = −4. Answer: <b><i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> − 4<\/b>", "hint": "One of the points has <i>x<\/i> = 0. What does that tell you about <i>b<\/i>?"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "The table shows a linear relationship between <i>x<\/i> and <i>y<\/i>. What is the value of <i>k<\/i>?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>1<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>5<\/td><\/tr><tr><td>4<\/td><td><i>k<\/i><\/td><\/tr><tr><td>5<\/td><td>14<\/td><\/tr><\/table><\/div>", "opts": ["8", "9.5", "11", "13"], "ans": 2, "sol": "From (1, 2) to (2, 5) the slope is 3. From <i>x<\/i> = 2 to <i>x<\/i> = 4, <i>x<\/i> increases by 2, so <i>y<\/i> increases by 3(2) = 6: <i>k<\/i> = 5 + 6 = 11. Check: from (4, 11) to (5, 14) the slope is 3. Answer: <b>11<\/b>", "hint": "Notice that the <i>x<\/i>-value skips 3. How far does <i>x<\/i> move from the second row to the third?"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "What is the slope of the line shown in the <i>xy<\/i>-plane?<svg class=\"fig\" viewBox=\"0 0 256 256\" role=\"img\" aria-label=\"Line in the xy-plane through the points (0, 6) and (4, 0)\"><g class=\"fg-grid\"><line x1=\"30\" y1=\"30\" x2=\"30\" y2=\"226\"/><line x1=\"58\" y1=\"30\" x2=\"58\" y2=\"226\"/><line x1=\"86\" y1=\"30\" x2=\"86\" y2=\"226\"/><line x1=\"114\" y1=\"30\" x2=\"114\" y2=\"226\"/><line x1=\"142\" y1=\"30\" x2=\"142\" y2=\"226\"/><line x1=\"170\" y1=\"30\" x2=\"170\" y2=\"226\"/><line x1=\"198\" y1=\"30\" x2=\"198\" y2=\"226\"/><line x1=\"226\" y1=\"30\" x2=\"226\" y2=\"226\"/><line x1=\"30\" y1=\"30\" x2=\"226\" y2=\"30\"/><line x1=\"30\" y1=\"58\" x2=\"226\" y2=\"58\"/><line x1=\"30\" y1=\"86\" x2=\"226\" y2=\"86\"/><line x1=\"30\" y1=\"114\" x2=\"226\" y2=\"114\"/><line x1=\"30\" y1=\"142\" x2=\"226\" y2=\"142\"/><line x1=\"30\" y1=\"170\" x2=\"226\" y2=\"170\"/><line x1=\"30\" y1=\"198\" x2=\"226\" y2=\"198\"/><line x1=\"30\" y1=\"226\" x2=\"226\" y2=\"226\"/><\/g><line class=\"fg-axis\" x1=\"30\" y1=\"226\" x2=\"226\" y2=\"226\"/><line class=\"fg-axis\" x1=\"30\" y1=\"30\" x2=\"30\" y2=\"226\"/><line class=\"fg-fit\" x1=\"30.0\" y1=\"58.0\" x2=\"142.0\" y2=\"226.0\"/><g class=\"fg-pts\"><circle cx=\"30.0\" cy=\"58.0\" r=\"4\"/><circle cx=\"142.0\" cy=\"226.0\" r=\"4\"/><\/g><g class=\"fg-lab\"><text x=\"58\" y=\"242\" text-anchor=\"middle\">1<\/text><text x=\"86\" y=\"242\" text-anchor=\"middle\">2<\/text><text x=\"114\" y=\"242\" text-anchor=\"middle\">3<\/text><text x=\"142\" y=\"242\" text-anchor=\"middle\">4<\/text><text x=\"170\" y=\"242\" text-anchor=\"middle\">5<\/text><text x=\"198\" y=\"242\" text-anchor=\"middle\">6<\/text><text x=\"226\" y=\"242\" text-anchor=\"middle\">7<\/text><text x=\"24\" y=\"202.0\" text-anchor=\"end\">1<\/text><text x=\"24\" y=\"174.0\" text-anchor=\"end\">2<\/text><text x=\"24\" y=\"146.0\" text-anchor=\"end\">3<\/text><text x=\"24\" y=\"118.0\" text-anchor=\"end\">4<\/text><text x=\"24\" y=\"90.0\" text-anchor=\"end\">5<\/text><text x=\"24\" y=\"62.0\" text-anchor=\"end\">6<\/text><text x=\"24\" y=\"34.0\" text-anchor=\"end\">7<\/text><text x=\"24\" y=\"242\" text-anchor=\"end\">0<\/text><text x=\"238\" y=\"230\">x<\/text><text x=\"30\" y=\"20\" text-anchor=\"middle\">y<\/text><\/g><\/svg>", "opts": ["−<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>", "−<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>", "6"], "ans": 0, "sol": "The line passes through (0, 6) and (4, 0). Slope = <span class=\"fq\"><span>0 − 6<\/span><span>4 − 0<\/span><\/span> = −<span class=\"fq\"><span>6<\/span><span>4<\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>. Answer: <b>−<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><\/b>", "hint": "Find two points where the line crosses grid intersections. Is the line rising or falling?"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "For the linear function <i>f<\/i>, <i>f<\/i>(2) = 7 and <i>f<\/i>(6) = 19. What is the value of <i>f<\/i>(10)?", "ans": ["31"], "sol": "Slope = <span class=\"fq\"><span>19 − 7<\/span><span>6 − 2<\/span><\/span> = 3, and <i>b<\/i> = 7 − 3(2) = 1, so <i>f<\/i>(<i>x<\/i>) = 3<i>x<\/i> + 1. Then <i>f<\/i>(10) = 31. Answer: <b>31<\/b>", "hint": "Treat <i>f<\/i>(2) = 7 and <i>f<\/i>(6) = 19 as the points (2, 7) and (6, 19)."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A worker's pay <i>P<\/i>, in dollars, is a linear function of the number of hours worked, <i>h<\/i>. The table shows three of its values. Which equation gives <i>P<\/i> in terms of <i>h<\/i>?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>h<\/i> (hours)<\/th><th><i>P<\/i> (dollars)<\/th><\/tr><tr><td>3<\/td><td>75<\/td><\/tr><tr><td>5<\/td><td>115<\/td><\/tr><tr><td>8<\/td><td>175<\/td><\/tr><\/table><\/div>", "opts": ["<i>P<\/i> = 25<i>h<\/i>", "<i>P<\/i> = 20<i>h<\/i> + 15", "<i>P<\/i> = 15<i>h<\/i> + 20", "<i>P<\/i> = 20<i>h<\/i> + 75"], "ans": 1, "sol": "Rate = <span class=\"fq\"><span>115 − 75<\/span><span>5 − 3<\/span><\/span> = 20 dollars per hour. Then 75 = 20(3) + <i>b<\/i>, so <i>b<\/i> = 15. Check: 20(8) + 15 = 175. Answer: <b><i>P<\/i> = 20<i>h<\/i> + 15<\/b>", "hint": "An equation that fits only the first row is not enough; test it on every row."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The function <i>f<\/i> is defined by <i>f<\/i>(<i>x<\/i>) = (<i>k<\/i> − 3)<i>x<\/i> + 7, where <i>k<\/i> is a constant. If <i>f<\/i> is decreasing, which of the following could be the value of <i>k<\/i>?", "opts": ["7", "5", "3", "2"], "ans": 3, "sol": "<i>f<\/i> is decreasing when its slope is negative: <i>k<\/i> − 3 &lt; 0, so <i>k<\/i> &lt; 3. Note that <i>k<\/i> = 3 gives slope 0, a constant function. Answer: <b>2<\/b>", "hint": "Which part of the formula is the slope? What sign must it have?"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "The table shows values of a linear function. What is the value of <i>a<\/i>?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>−1<\/td><td>8<\/td><\/tr><tr><td>1<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>−2<\/td><\/tr><tr><td><i>a<\/i><\/td><td>−12<\/td><\/tr><\/table><\/div>", "ans": ["9"], "sol": "Slope = <span class=\"fq\"><span>4 − 8<\/span><span>1 − (−1)<\/span><\/span> = −2, and <span class=\"fq\"><span>−2 − 4<\/span><span>4 − 1<\/span><\/span> = −2 confirms it. So <i>y<\/i> = −2<i>x<\/i> + 6. Set −2<i>a<\/i> + 6 = −12 to get <i>a<\/i> = 9. Answer: <b>9<\/b>", "hint": "Find the equation from the first two rows, then work backward from <i>y<\/i> = −12."}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A linear function <i>f<\/i> satisfies <i>f<\/i>(<i>x<\/i> + 2) − <i>f<\/i>(<i>x<\/i>) = 10 for all <i>x<\/i>, and <i>f<\/i>(−1) = −3. Which of the following defines <i>f<\/i>?", "opts": ["<i>f<\/i>(<i>x<\/i>) = 5<i>x<\/i> + 2", "<i>f<\/i>(<i>x<\/i>) = 10<i>x<\/i> + 7", "<i>f<\/i>(<i>x<\/i>) = 5<i>x<\/i> − 8", "<i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> − 1"], "ans": 0, "sol": "When <i>x<\/i> increases by 2, the output increases by 10, so the slope is <span class=\"fq\"><span>10<\/span><span>2<\/span><\/span> = 5. Then −3 = 5(−1) + <i>b<\/i> gives <i>b<\/i> = 2. Answer: <b><i>f<\/i>(<i>x<\/i>) = 5<i>x<\/i> + 2<\/b>", "hint": "The equation tells you how much the output changes when the input increases by 2."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "What is the slope of the line that passes through (−3, 2) and (1, 14)?", "opts": ["−3", "<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "3", "4"], "ans": 2, "sol": "Slope = <span class=\"fq\"><span>14 − 2<\/span><span>1 − (−3)<\/span><\/span> = <span class=\"fq\"><span>12<\/span><span>4<\/span><\/span> = 3. Answer: <b>3<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "The table shows values of a linear function. Which statement is true?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>f<\/i>(<i>x<\/i>)<\/th><\/tr><tr><td>0<\/td><td>20<\/td><\/tr><tr><td>1<\/td><td>17<\/td><\/tr><tr><td>2<\/td><td>14<\/td><\/tr><tr><td>3<\/td><td>11<\/td><\/tr><\/table><\/div>", "opts": ["The function is increasing, and its rate of change is 3.", "The function is decreasing, and its rate of change is −3.", "The function is decreasing, and its rate of change is −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>.", "The function is constant."], "ans": 1, "sol": "Each time <i>x<\/i> increases by 1, the output falls by 3. The rate is −3, so the function is decreasing. Answer: <b>decreasing, rate −3<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "The table shows values of the linear function <i>f<\/i>. Which of the following defines <i>f<\/i>?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>f<\/i>(<i>x<\/i>)<\/th><\/tr><tr><td>0<\/td><td>−2<\/td><\/tr><tr><td>1<\/td><td>5<\/td><\/tr><tr><td>2<\/td><td>12<\/td><\/tr><\/table><\/div>", "opts": ["<i>f<\/i>(<i>x<\/i>) = 7<i>x<\/i> − 2", "<i>f<\/i>(<i>x<\/i>) = −2<i>x<\/i> + 7", "<i>f<\/i>(<i>x<\/i>) = 7<i>x<\/i> + 5", "<i>f<\/i>(<i>x<\/i>) = 5<i>x<\/i> − 2"], "ans": 0, "sol": "The output rises by 7 per 1 step in <i>x<\/i>, so <i>m<\/i> = 7. At <i>x<\/i> = 0 the output is −2, so <i>b<\/i> = −2. Answer: <b><i>f<\/i>(<i>x<\/i>) = 7<i>x<\/i> − 2<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "A candle burns at a constant rate. Its height is 24 centimeters after 2 hours and 15 centimeters after 5 hours. Which of the following is the rate of change of the candle's height with respect to time?", "opts": ["3 hours per centimeter", "−9 centimeters per hour", "−<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> centimeter per hour", "−3 centimeters per hour"], "ans": 3, "sol": "Rate = <span class=\"fq\"><span>15 − 24<\/span><span>5 − 2<\/span><\/span> = <span class=\"fq\"><span>−9<\/span><span>3<\/span><\/span> = −3. Height is the output, so the units are centimeters per hour. Answer: <b>−3 centimeters per hour<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "Which of the following sets of points (<i>x<\/i>, <i>y<\/i>) could all lie on the graph of the same linear function?", "opts": ["(0, 1), (1, 3), (2, 9)", "(0, 4), (2, 7), (4, 10)", "(1, 1), (2, 4), (3, 9)", "(0, 5), (1, 4), (3, 3)"], "ans": 1, "sol": "In choice B the rates are <span class=\"fq\"><span>7 − 4<\/span><span>2<\/span><\/span> = 1.5 and <span class=\"fq\"><span>10 − 7<\/span><span>2<\/span><\/span> = 1.5, which are equal. Choices A and C have increasing rates, and choice D has rates −1 and −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>. Answer: <b>(0, 4), (2, 7), (4, 10)<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "The table shows values of a linear relationship. What is the slope of the line through these points?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>4<\/td><td>1<\/td><\/tr><tr><td>6<\/td><td>6<\/td><\/tr><tr><td>8<\/td><td>11<\/td><\/tr><\/table><\/div>", "ans": ["5/2", "2.5"], "sol": "Slope = <span class=\"fq\"><span>6 − 1<\/span><span>6 − 4<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>2<\/span><\/span>. Answer: <b><span class=\"fq\"><span>5<\/span><span>2<\/span><\/span><\/b> (or 2.5)"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "What is the slope of the line shown?<svg class=\"fig\" viewBox=\"0 0 256 312\" role=\"img\" aria-label=\"Line in the xy-plane through the points (1, 2) and (5, 8)\"><g class=\"fg-grid\"><line x1=\"30\" y1=\"30\" x2=\"30\" y2=\"282\"/><line x1=\"58\" y1=\"30\" x2=\"58\" y2=\"282\"/><line x1=\"86\" y1=\"30\" x2=\"86\" y2=\"282\"/><line x1=\"114\" y1=\"30\" x2=\"114\" y2=\"282\"/><line x1=\"142\" y1=\"30\" x2=\"142\" y2=\"282\"/><line x1=\"170\" y1=\"30\" x2=\"170\" y2=\"282\"/><line x1=\"198\" y1=\"30\" x2=\"198\" y2=\"282\"/><line x1=\"226\" y1=\"30\" x2=\"226\" y2=\"282\"/><line x1=\"30\" y1=\"30\" x2=\"226\" y2=\"30\"/><line x1=\"30\" y1=\"58\" x2=\"226\" y2=\"58\"/><line x1=\"30\" y1=\"86\" x2=\"226\" y2=\"86\"/><line x1=\"30\" y1=\"114\" x2=\"226\" y2=\"114\"/><line x1=\"30\" y1=\"142\" x2=\"226\" y2=\"142\"/><line x1=\"30\" y1=\"170\" x2=\"226\" y2=\"170\"/><line x1=\"30\" y1=\"198\" x2=\"226\" y2=\"198\"/><line x1=\"30\" y1=\"226\" x2=\"226\" y2=\"226\"/><line x1=\"30\" y1=\"254\" x2=\"226\" y2=\"254\"/><line x1=\"30\" y1=\"282\" x2=\"226\" y2=\"282\"/><\/g><line class=\"fg-axis\" x1=\"30\" y1=\"282\" x2=\"226\" y2=\"282\"/><line class=\"fg-axis\" x1=\"30\" y1=\"30\" x2=\"30\" y2=\"282\"/><line class=\"fg-fit\" x1=\"30.0\" y1=\"268.0\" x2=\"188.7\" y2=\"30.0\"/><g class=\"fg-pts\"><circle cx=\"58.0\" cy=\"226.0\" r=\"4\"/><circle cx=\"170.0\" cy=\"58.0\" r=\"4\"/><\/g><g class=\"fg-lab\"><text x=\"58\" y=\"298\" text-anchor=\"middle\">1<\/text><text x=\"86\" y=\"298\" text-anchor=\"middle\">2<\/text><text x=\"114\" y=\"298\" text-anchor=\"middle\">3<\/text><text x=\"142\" y=\"298\" text-anchor=\"middle\">4<\/text><text x=\"170\" y=\"298\" text-anchor=\"middle\">5<\/text><text x=\"198\" y=\"298\" text-anchor=\"middle\">6<\/text><text x=\"226\" y=\"298\" text-anchor=\"middle\">7<\/text><text x=\"24\" y=\"258.0\" text-anchor=\"end\">1<\/text><text x=\"24\" y=\"230.0\" text-anchor=\"end\">2<\/text><text x=\"24\" y=\"202.0\" text-anchor=\"end\">3<\/text><text x=\"24\" y=\"174.0\" text-anchor=\"end\">4<\/text><text x=\"24\" y=\"146.0\" text-anchor=\"end\">5<\/text><text x=\"24\" y=\"118.0\" text-anchor=\"end\">6<\/text><text x=\"24\" y=\"90.0\" text-anchor=\"end\">7<\/text><text x=\"24\" y=\"62.0\" text-anchor=\"end\">8<\/text><text x=\"24\" y=\"34.0\" text-anchor=\"end\">9<\/text><text x=\"24\" y=\"298\" text-anchor=\"end\">0<\/text><text x=\"238\" y=\"286\">x<\/text><text x=\"30\" y=\"20\" text-anchor=\"middle\">y<\/text><\/g><\/svg>", "opts": ["<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>", "2", "<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>", "6"], "ans": 2, "sol": "The marked points are (1, 2) and (5, 8). Slope = <span class=\"fq\"><span>8 − 2<\/span><span>5 − 1<\/span><\/span> = <span class=\"fq\"><span>6<\/span><span>4<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>. Answer: <b><span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which of the following defines the linear function whose graph passes through (2, −1) and (6, 7)?", "opts": ["<i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> − 5", "<i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> + 3", "<i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> − 2", "<i>f<\/i>(<i>x<\/i>) = −2<i>x<\/i> + 3"], "ans": 0, "sol": "Slope = <span class=\"fq\"><span>7 − (−1)<\/span><span>6 − 2<\/span><\/span> = 2. Then −1 = 2(2) + <i>b<\/i> gives <i>b<\/i> = −5. Answer: <b><i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> − 5<\/b>"}, {"lo": "LO2", "diff": "M", "type": "spr", "q": "For the linear function <i>f<\/i>, <i>f<\/i>(−2) = 13 and <i>f<\/i>(4) = −5. What is the value of <i>f<\/i>(1)?", "ans": ["4"], "sol": "Slope = <span class=\"fq\"><span>−5 − 13<\/span><span>4 − (−2)<\/span><\/span> = <span class=\"fq\"><span>−18<\/span><span>6<\/span><\/span> = −3. Then <i>b<\/i> = 13 − (−3)(−2) = 7, so <i>f<\/i>(1) = −3 + 7 = 4. Answer: <b>4<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The monthly cost of a phone plan is a linear function of the data used. Using 3 gigabytes costs $41, and using 7 gigabytes costs $61. Which equation gives the cost <i>C<\/i>, in dollars, for <i>g<\/i> gigabytes?", "opts": ["<i>C<\/i> = 20<i>g<\/i> − 19", "<i>C<\/i> = 5<i>g<\/i> + 41", "<i>C<\/i> = <span class=\"fq\"><span>41<\/span><span>3<\/span><\/span><i>g<\/i>", "<i>C<\/i> = 5<i>g<\/i> + 26"], "ans": 3, "sol": "Rate = <span class=\"fq\"><span>61 − 41<\/span><span>7 − 3<\/span><\/span> = 5 dollars per gigabyte. Then 41 = 5(3) + <i>b<\/i>, so <i>b<\/i> = 26. Answer: <b><i>C<\/i> = 5<i>g<\/i> + 26<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The function <i>h<\/i> is defined by <i>h<\/i>(<i>x<\/i>) = −2(4 − 3<i>x<\/i>). Which statement is true?", "opts": ["<i>h<\/i> is increasing, and its slope is 6.", "<i>h<\/i> is decreasing, and its slope is −2.", "<i>h<\/i> is decreasing, and its slope is −6.", "<i>h<\/i> is increasing, and its slope is 3."], "ans": 0, "sol": "Distribute: <i>h<\/i>(<i>x<\/i>) = −8 + 6<i>x<\/i>. The slope is 6, which is positive, so <i>h<\/i> is increasing. Answer: <b>increasing, slope 6<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "The table shows a linear relationship between <i>x<\/i> and <i>y<\/i>. What is the value of <i>k<\/i>?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>0<\/td><td>4<\/td><\/tr><tr><td>3<\/td><td>13<\/td><\/tr><tr><td>5<\/td><td><i>k<\/i><\/td><\/tr><tr><td>9<\/td><td>31<\/td><\/tr><\/table><\/div>", "ans": ["19"], "sol": "From (0, 4) to (3, 13) the slope is 3, so <i>y<\/i> = 3<i>x<\/i> + 4 (check: 3(9) + 4 = 31). Then <i>k<\/i> = 3(5) + 4 = 19. Answer: <b>19<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "The air temperature decreases linearly as altitude increases. At an altitude of 2 thousand feet the temperature is 50.6°F, and at 5 thousand feet it is 39.8°F. What is the rate of change of temperature, in °F per thousand feet?", "opts": ["3.6", "−10.8", "−3.6", "−0.28"], "ans": 2, "sol": "Rate = <span class=\"fq\"><span>39.8 − 50.6<\/span><span>5 − 2<\/span><\/span> = <span class=\"fq\"><span>−10.8<\/span><span>3<\/span><\/span> = −3.6. Answer: <b>−3.6<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which of the following defines the linear function whose graph passes through (−4, 1) and (2, 4)?", "opts": ["<i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> + 9", "<i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> + 3", "<i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> − 1", "<i>f<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> + 3"], "ans": 1, "sol": "Slope = <span class=\"fq\"><span>4 − 1<\/span><span>2 − (−4)<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>6<\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>. Then 4 = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(2) + <i>b<\/i>, so <i>b<\/i> = 3. Answer: <b><i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> + 3<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A club's membership <i>m<\/i> is modeled by a linear function of <i>t<\/i>, the number of months since January. The model gives <i>m<\/i> = 40 when <i>t<\/i> = 3 and <i>m<\/i> = 40 when <i>t<\/i> = 8. Which statement about the model is true?", "opts": ["Membership increases by 5 members per month.", "Membership decreases by 5 members per month.", "Membership increases by 8 members per month.", "Membership is constant, with a rate of change of 0 members per month."], "ans": 3, "sol": "Rate = <span class=\"fq\"><span>40 − 40<\/span><span>8 − 3<\/span><\/span> = <span class=\"fq\"><span>0<\/span><span>5<\/span><\/span> = 0. A linear function with slope 0 is constant. Answer: <b>constant, rate 0<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "A machine fills bottles at a constant rate. After 6 minutes it has filled a total of 1,020 bottles, and after 15 minutes it has filled a total of 2,370 bottles. At what rate, in bottles per minute, does the machine fill bottles?", "ans": ["150"], "sol": "Rate = <span class=\"fq\"><span>2,370 − 1,020<\/span><span>15 − 6<\/span><\/span> = <span class=\"fq\"><span>1,350<\/span><span>9<\/span><\/span> = 150 bottles per minute. Answer: <b>150<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "Which statement about the table is true?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>1<\/td><td>3<\/td><\/tr><tr><td>2<\/td><td>5<\/td><\/tr><tr><td>4<\/td><td>9<\/td><\/tr><tr><td>7<\/td><td>16<\/td><\/tr><\/table><\/div>", "opts": ["The table is linear, with slope 2.", "The table is linear, with slope <span class=\"fq\"><span>7<\/span><span>3<\/span><\/span>.", "The table is not linear, because the rate from <i>x<\/i> = 4 to <i>x<\/i> = 7 is <span class=\"fq\"><span>7<\/span><span>3<\/span><\/span>, but the rate from <i>x<\/i> = 1 to <i>x<\/i> = 2 is 2.", "The table is not linear, because the <i>x<\/i>-values are not equally spaced."], "ans": 2, "sol": "Rates: <span class=\"fq\"><span>5 − 3<\/span><span>1<\/span><\/span> = 2, <span class=\"fq\"><span>9 − 5<\/span><span>2<\/span><\/span> = 2, <span class=\"fq\"><span>16 − 9<\/span><span>3<\/span><\/span> = <span class=\"fq\"><span>7<\/span><span>3<\/span><\/span>. The rates are not all equal, so the table is not linear. Unequal spacing alone never decides linearity. Answer: <b>choice C<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "For a linear function <i>f<\/i>, <i>f<\/i>(5) − <i>f<\/i>(1) = 12 and <i>f<\/i>(2) = 1. Which of the following defines <i>f<\/i>?", "opts": ["<i>f<\/i>(<i>x<\/i>) = 3<i>x<\/i> − 5", "<i>f<\/i>(<i>x<\/i>) = 12<i>x<\/i> − 23", "<i>f<\/i>(<i>x<\/i>) = 3<i>x<\/i> + 7", "<i>f<\/i>(<i>x<\/i>) = 4<i>x<\/i> − 7"], "ans": 0, "sol": "The input increases by 4 while the output increases by 12, so <i>m<\/i> = <span class=\"fq\"><span>12<\/span><span>4<\/span><\/span> = 3. Then 1 = 3(2) + <i>b<\/i> gives <i>b<\/i> = −5. Answer: <b><i>f<\/i>(<i>x<\/i>) = 3<i>x<\/i> − 5<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "The line through the points (2, <i>k<\/i>) and (<i>k<\/i>, 14) has a slope of 3. What is the value of <i>k<\/i>?", "ans": ["5"], "sol": "<span class=\"fq\"><span>14 − <i>k<\/i><\/span><span><i>k<\/i> − 2<\/span><\/span> = 3, so 14 − <i>k<\/i> = 3<i>k<\/i> − 6, which gives 20 = 4<i>k<\/i> and <i>k<\/i> = 5. Answer: <b>5<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The cost to ship a package is a linear function of its weight. Shipping a 6-pound package costs $13.10, and shipping a 15-pound package costs $22.55. By how much does the cost increase for each additional 4 pounds of weight?", "opts": ["$1.05", "$4.20", "$5.25", "$9.45"], "ans": 1, "sol": "Rate = <span class=\"fq\"><span>22.55 − 13.10<\/span><span>15 − 6<\/span><\/span> = <span class=\"fq\"><span>9.45<\/span><span>9<\/span><\/span> = 1.05 dollars per pound. For 4 pounds: 4(1.05) = 4.20. Answer: <b>$4.20<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "For a nonzero constant <i>a<\/i>, what is the slope of the line through the points (<i>a<\/i>, 3<i>a<\/i>) and (3<i>a<\/i>, −<i>a<\/i>)?", "opts": ["2", "−2", "−<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>", "It depends on the value of <i>a<\/i>."], "ans": 1, "sol": "Slope = <span class=\"fq\"><span>−<i>a<\/i> − 3<i>a<\/i><\/span><span>3<i>a<\/i> − <i>a<\/i><\/span><\/span> = <span class=\"fq\"><span>−4<i>a<\/i><\/span><span>2<i>a<\/i><\/span><\/span> = −2 for every nonzero <i>a<\/i>. Answer: <b>−2<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A linear function <i>g<\/i> satisfies <i>g<\/i>(−5) = 12 and <i>g<\/i>(10) = 3. Which statement is true?", "opts": ["<i>g<\/i> is decreasing, and its rate of change is −<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>.", "<i>g<\/i> is decreasing, and its rate of change is −<span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>.", "<i>g<\/i> is increasing, and its rate of change is <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>.", "<i>g<\/i> is decreasing, and its rate of change is −9."], "ans": 0, "sol": "Rate = <span class=\"fq\"><span>3 − 12<\/span><span>10 − (−5)<\/span><\/span> = <span class=\"fq\"><span>−9<\/span><span>15<\/span><\/span> = −<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>. It is negative, so <i>g<\/i> is decreasing. Answer: <b>decreasing, −<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "A pool drains at a constant rate. At 10:00 a.m. it holds 9,600 gallons of water, and at 1:30 p.m. the same day it holds 6,240 gallons. What is the rate of change of the amount of water with respect to time?", "opts": ["−960 gallons per minute", "−<span class=\"fq\"><span>1<\/span><span>16<\/span><\/span> gallon per minute", "−16 gallons per minute", "−18.7 gallons per minute"], "ans": 2, "sol": "From 10:00 a.m. to 1:30 p.m. is 3.5 hours, or 210 minutes. Rate = <span class=\"fq\"><span>6,240 − 9,600<\/span><span>210<\/span><\/span> = <span class=\"fq\"><span>−3,360<\/span><span>210<\/span><\/span> = −16 gallons per minute. Answer: <b>−16 gallons per minute<\/b>"}, {"lo": "LO5", "diff": "M", "type": "spr", "q": "The table shows values of a linear function. What is the value of <i>p<\/i>?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>−3<\/td><td><i>p<\/i><\/td><\/tr><tr><td>0<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>5<\/td><\/tr><tr><td>6<\/td><td>13<\/td><\/tr><\/table><\/div>", "ans": ["-5"], "sol": "Slope = <span class=\"fq\"><span>5 − 1<\/span><span>2 − 0<\/span><\/span> = 2, and <span class=\"fq\"><span>13 − 5<\/span><span>6 − 2<\/span><\/span> = 2 confirms it. So <i>y<\/i> = 2<i>x<\/i> + 1 and <i>p<\/i> = 2(−3) + 1 = −5. Answer: <b>−5<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which of the following defines the linear function whose graph passes through (−6, 4) and (9, −1)?", "opts": ["<i>f<\/i>(<i>x<\/i>) = −3<i>x<\/i> − 14", "<i>f<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> + 6", "<i>f<\/i>(<i>x<\/i>) = <span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> + 6", "<i>f<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> + 2"], "ans": 3, "sol": "Slope = <span class=\"fq\"><span>−1 − 4<\/span><span>9 − (−6)<\/span><\/span> = <span class=\"fq\"><span>−5<\/span><span>15<\/span><\/span> = −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>. Then 4 = −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>(−6) + <i>b<\/i> = 2 + <i>b<\/i>, so <i>b<\/i> = 2. Answer: <b><i>f<\/i>(<i>x<\/i>) = −<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span><i>x<\/i> + 2<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "What is the slope of the line that passes through (−1.5, 4) and (2.5, −6)?", "ans": ["-5/2", "-2.5"], "sol": "Slope = <span class=\"fq\"><span>−6 − 4<\/span><span>2.5 − (−1.5)<\/span><\/span> = <span class=\"fq\"><span>−10<\/span><span>4<\/span><\/span> = −2.5. Answer: <b>−2.5<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "For a linear function <i>f<\/i>, <i>f<\/i>(2) = 10 and <i>f<\/i>(10) = 26. What is the value of <i>f<\/i>(<i>f<\/i>(0))?", "opts": ["18", "6", "12", "26"], "ans": 0, "sol": "Slope = <span class=\"fq\"><span>26 − 10<\/span><span>10 − 2<\/span><\/span> = 2 and <i>b<\/i> = 10 − 2(2) = 6, so <i>f<\/i>(<i>x<\/i>) = 2<i>x<\/i> + 6. Then <i>f<\/i>(0) = 6 and <i>f<\/i>(6) = 18. Answer: <b>18<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "The function <i>h<\/i> is defined by <i>h<\/i>(<i>x<\/i>) = (4 − 2<i>c<\/i>)<i>x<\/i> + <i>c<\/i>, where <i>c<\/i> is a constant. If <i>h<\/i>(1) &gt; <i>h<\/i>(5), which of the following must be true?", "opts": ["<i>c<\/i> &lt; 2", "<i>c<\/i> &lt; −2", "<i>c<\/i> &gt; 2", "<i>c<\/i> &gt; 4"], "ans": 2, "sol": "<i>h<\/i>(1) &gt; <i>h<\/i>(5) means the output falls as <i>x<\/i> increases, so <i>h<\/i> is decreasing: 4 − 2<i>c<\/i> &lt; 0, which gives <i>c<\/i> &gt; 2. (<i>c<\/i> &gt; 4 need not be true, for example <i>c<\/i> = 3.) Answer: <b><i>c<\/i> &gt; 2<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The table shows the amount of fuel <i>L<\/i>, in liters, left in a generator's tank after it has run for <i>h<\/i> hours. The relationship is linear. Which of the following is the rate of change of <i>L<\/i> with respect to <i>h<\/i>?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>h<\/i> (hours)<\/th><th><i>L<\/i> (liters)<\/th><\/tr><tr><td>1.5<\/td><td>41.2<\/td><\/tr><tr><td>4<\/td><td>33.7<\/td><\/tr><tr><td>7.5<\/td><td>23.2<\/td><\/tr><\/table><\/div>", "opts": ["3 liters per hour", "−<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span> liter per hour", "−3 liters per hour", "−7.5 liters per hour"], "ans": 2, "sol": "Rate = <span class=\"fq\"><span>33.7 − 41.2<\/span><span>4 − 1.5<\/span><\/span> = <span class=\"fq\"><span>−7.5<\/span><span>2.5<\/span><\/span> = −3, and <span class=\"fq\"><span>23.2 − 33.7<\/span><span>7.5 − 4<\/span><\/span> = <span class=\"fq\"><span>−10.5<\/span><span>3.5<\/span><\/span> = −3 confirms it. Liters is the output and hours is the input. Answer: <b>−3 liters per hour<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "The table shows a linear relationship. Which ordered pair gives the values of <i>a<\/i> and <i>b<\/i>?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>2<\/td><td>1<\/td><\/tr><tr><td>5<\/td><td>7<\/td><\/tr><tr><td><i>a<\/i><\/td><td>13<\/td><\/tr><tr><td>14<\/td><td><i>b<\/i><\/td><\/tr><\/table><\/div>", "opts": ["(8, 19)", "(8, 25)", "(11, 25)", "(7, 23)"], "ans": 1, "sol": "Slope = <span class=\"fq\"><span>7 − 1<\/span><span>5 − 2<\/span><\/span> = 2, so <i>y<\/i> = 2<i>x<\/i> − 3. Then 13 = 2<i>a<\/i> − 3 gives <i>a<\/i> = 8, and <i>b<\/i> = 2(14) − 3 = 25. Answer: <b>(8, 25)<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "What is the slope of the line shown? (Note the scale on the <i>y<\/i>-axis.)<svg class=\"fig\" viewBox=\"0 0 284 284\" role=\"img\" aria-label=\"Line in the xy-plane through the points (2, 25) and (6, 5); the y-axis is marked in steps of 5\"><g class=\"fg-grid\"><line x1=\"30\" y1=\"30\" x2=\"30\" y2=\"254\"/><line x1=\"58\" y1=\"30\" x2=\"58\" y2=\"254\"/><line x1=\"86\" y1=\"30\" x2=\"86\" y2=\"254\"/><line x1=\"114\" y1=\"30\" x2=\"114\" y2=\"254\"/><line x1=\"142\" y1=\"30\" x2=\"142\" y2=\"254\"/><line x1=\"170\" y1=\"30\" x2=\"170\" y2=\"254\"/><line x1=\"198\" y1=\"30\" x2=\"198\" y2=\"254\"/><line x1=\"226\" y1=\"30\" x2=\"226\" y2=\"254\"/><line x1=\"254\" y1=\"30\" x2=\"254\" y2=\"254\"/><line x1=\"30\" y1=\"30\" x2=\"254\" y2=\"30\"/><line x1=\"30\" y1=\"58\" x2=\"254\" y2=\"58\"/><line x1=\"30\" y1=\"86\" x2=\"254\" y2=\"86\"/><line x1=\"30\" y1=\"114\" x2=\"254\" y2=\"114\"/><line x1=\"30\" y1=\"142\" x2=\"254\" y2=\"142\"/><line x1=\"30\" y1=\"170\" x2=\"254\" y2=\"170\"/><line x1=\"30\" y1=\"198\" x2=\"254\" y2=\"198\"/><line x1=\"30\" y1=\"226\" x2=\"254\" y2=\"226\"/><line x1=\"30\" y1=\"254\" x2=\"254\" y2=\"254\"/><\/g><line class=\"fg-axis\" x1=\"30\" y1=\"254\" x2=\"254\" y2=\"254\"/><line class=\"fg-axis\" x1=\"30\" y1=\"30\" x2=\"30\" y2=\"254\"/><line class=\"fg-fit\" x1=\"30.0\" y1=\"58.0\" x2=\"226.0\" y2=\"254.0\"/><g class=\"fg-pts\"><circle cx=\"86.0\" cy=\"114.0\" r=\"4\"/><circle cx=\"198.0\" cy=\"226.0\" r=\"4\"/><\/g><g class=\"fg-lab\"><text x=\"58\" y=\"270\" text-anchor=\"middle\">1<\/text><text x=\"86\" y=\"270\" text-anchor=\"middle\">2<\/text><text x=\"114\" y=\"270\" text-anchor=\"middle\">3<\/text><text x=\"142\" y=\"270\" text-anchor=\"middle\">4<\/text><text x=\"170\" y=\"270\" text-anchor=\"middle\">5<\/text><text x=\"198\" y=\"270\" text-anchor=\"middle\">6<\/text><text x=\"226\" y=\"270\" text-anchor=\"middle\">7<\/text><text x=\"254\" y=\"270\" text-anchor=\"middle\">8<\/text><text x=\"24\" y=\"230.0\" text-anchor=\"end\">5<\/text><text x=\"24\" y=\"202.0\" text-anchor=\"end\">10<\/text><text x=\"24\" y=\"174.0\" text-anchor=\"end\">15<\/text><text x=\"24\" y=\"146.0\" text-anchor=\"end\">20<\/text><text x=\"24\" y=\"118.0\" text-anchor=\"end\">25<\/text><text x=\"24\" y=\"90.0\" text-anchor=\"end\">30<\/text><text x=\"24\" y=\"62.0\" text-anchor=\"end\">35<\/text><text x=\"24\" y=\"34.0\" text-anchor=\"end\">40<\/text><text x=\"24\" y=\"270\" text-anchor=\"end\">0<\/text><text x=\"266\" y=\"258\">x<\/text><text x=\"30\" y=\"20\" text-anchor=\"middle\">y<\/text><\/g><\/svg>", "opts": ["−1", "5", "−5", "−<span class=\"fq\"><span>1<\/span><span>5<\/span><\/span>"], "ans": 2, "sol": "The marked points are (2, 25) and (6, 5). Slope = <span class=\"fq\"><span>5 − 25<\/span><span>6 − 2<\/span><\/span> = <span class=\"fq\"><span>−20<\/span><span>4<\/span><\/span> = −5. Counting grid squares instead of reading the scale gives −1. Answer: <b>−5<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "A hiker climbs at a constant rate. After 1 hour she is at an elevation of 700 feet, and after 7 hours she is at 1,900 feet. What is her elevation, in feet, after 4 hours?", "ans": ["1300"], "sol": "Rate = <span class=\"fq\"><span>1,900 − 700<\/span><span>7 − 1<\/span><\/span> = 200 feet per hour, so <i>E<\/i>(<i>t<\/i>) = 200<i>t<\/i> + 500. Then <i>E<\/i>(4) = 1,300. (Since 4 is halfway between 1 and 7, the elevation is also halfway between 700 and 1,900.) Answer: <b>1300<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "As a car is driven, the fuel in its tank decreases linearly with distance. After 40 miles the tank holds 12.6 gallons, and after 150 miles it holds 9.3 gallons. At this rate, how many miles does the car travel per gallon of fuel used?", "ans": ["100/3", "33.33"], "sol": "Fuel rate = <span class=\"fq\"><span>9.3 − 12.6<\/span><span>150 − 40<\/span><\/span> = <span class=\"fq\"><span>−3.3<\/span><span>110<\/span><\/span> = −0.03 gallon per mile. Miles per gallon is the reciprocal of 0.03: <span class=\"fq\"><span>1<\/span><span>0.03<\/span><\/span> = <span class=\"fq\"><span>100<\/span><span>3<\/span><\/span> ≈ 33.33. Answer: <b><span class=\"fq\"><span>100<\/span><span>3<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Which of the following functions are decreasing?<div class=\"eqs\">I. <i>p<\/i>(<i>x<\/i>) = −3(2 − <i>x<\/i>)<br>II. <i>q<\/i> is linear, with <i>q<\/i>(−2) = 4 and <i>q<\/i>(3) = −1<br>III. <i>r<\/i>(<i>x<\/i>) = 8 − 0.2(10 − <i>x<\/i>)<\/div>", "opts": ["II only", "I and II only", "II and III only", "I, II, and III"], "ans": 0, "sol": "I: <i>p<\/i>(<i>x<\/i>) = 3<i>x<\/i> − 6, slope 3 (increasing). II: slope <span class=\"fq\"><span>−1 − 4<\/span><span>3 − (−2)<\/span><\/span> = −1 (decreasing). III: <i>r<\/i>(<i>x<\/i>) = 6 + 0.2<i>x<\/i>, slope 0.2 (increasing). Answer: <b>II only<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A cyclist's distance <i>d<\/i> from home, in kilometers, was recorded at four times <i>t<\/i>, in minutes. One distance was recorded incorrectly; with the correct value, the relationship is linear. Which change makes the table linear?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>t<\/i> (min)<\/th><th><i>d<\/i> (km)<\/th><\/tr><tr><td>0<\/td><td>2.0<\/td><\/tr><tr><td>4<\/td><td>5.2<\/td><\/tr><tr><td>10<\/td><td>10.0<\/td><\/tr><tr><td>15<\/td><td>14.5<\/td><\/tr><\/table><\/div>", "opts": ["Change 5.2 to 5.0.", "Change 10.0 to 10.5.", "Change 2.0 to 2.4.", "Change 14.5 to 14.0."], "ans": 3, "sol": "The first two rates are <span class=\"fq\"><span>3.2<\/span><span>4<\/span><\/span> = 0.8 and <span class=\"fq\"><span>4.8<\/span><span>6<\/span><\/span> = 0.8, but the last is <span class=\"fq\"><span>4.5<\/span><span>5<\/span><\/span> = 0.9. Changing 14.5 to 14.0 makes the last rate <span class=\"fq\"><span>4<\/span><span>5<\/span><\/span> = 0.8. Answer: <b>Change 14.5 to 14.0.<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "For a constant <i>p<\/i>, the graph of a linear function <i>f<\/i> passes through (<i>p<\/i>, 2<i>p<\/i>) and (<i>p<\/i> + 3, 2<i>p<\/i> + 12). Which of the following defines <i>f<\/i>?", "opts": ["<i>f<\/i>(<i>x<\/i>) = 4<i>x<\/i> + 2<i>p<\/i>", "<i>f<\/i>(<i>x<\/i>) = 4<i>x<\/i> − 2<i>p<\/i>", "<i>f<\/i>(<i>x<\/i>) = 4<i>x<\/i> − <i>p<\/i>", "<i>f<\/i>(<i>x<\/i>) = 12<i>x<\/i> − 10<i>p<\/i>"], "ans": 1, "sol": "Slope = <span class=\"fq\"><span>12<\/span><span>3<\/span><\/span> = 4. Then 2<i>p<\/i> = 4<i>p<\/i> + <i>b<\/i>, so <i>b<\/i> = −2<i>p<\/i>. Answer: <b><i>f<\/i>(<i>x<\/i>) = 4<i>x<\/i> − 2<i>p<\/i><\/b>"}, {"lo": "LO2", "diff": "X", "type": "spr", "q": "The function <i>f<\/i> is linear and increasing, and <i>f<\/i>(<i>f<\/i>(<i>x<\/i>)) = 9<i>x<\/i> − 8 for all <i>x<\/i>. What is the value of <i>f<\/i>(6)?", "ans": ["16"], "sol": "With <i>f<\/i>(<i>x<\/i>) = <i>mx<\/i> + <i>b<\/i>, <i>f<\/i>(<i>f<\/i>(<i>x<\/i>)) = <i>m<\/i><sup>2<\/sup><i>x<\/i> + <i>mb<\/i> + <i>b<\/i>. So <i>m<\/i><sup>2<\/sup> = 9, and <i>m<\/i> = 3 because <i>f<\/i> is increasing. Then 3<i>b<\/i> + <i>b<\/i> = −8 gives <i>b<\/i> = −2, and <i>f<\/i>(6) = 16. Answer: <b>16<\/b>"}, {"lo": "LO1", "diff": "X", "type": "mcq", "q": "The points (1, 2), (3, <i>k<\/i>) and (<i>k<\/i>, 8) all lie on one line. What is the sum of all possible values of <i>k<\/i>?", "opts": ["5", "3", "−2", "7"], "ans": 1, "sol": "Equal slopes from (1, 2): <span class=\"fq\"><span><i>k<\/i> − 2<\/span><span>2<\/span><\/span> = <span class=\"fq\"><span>6<\/span><span><i>k<\/i> − 1<\/span><\/span>, so (<i>k<\/i> − 2)(<i>k<\/i> − 1) = 12, which gives <i>k<\/i><sup>2<\/sup> − 3<i>k<\/i> − 10 = 0 and <i>k<\/i> = 5 or <i>k<\/i> = −2. Both work, so the sum is 3. Answer: <b>3<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "Water pressure <i>P<\/i>, in kilopascals, increases linearly with depth <i>d<\/i>, in meters. At a depth of 4 meters, <i>P<\/i> = 141.3, and at 11 meters, <i>P<\/i> = 211.3. A diver descends at a constant 0.5 meter per second. At what rate does the pressure on the diver increase?", "opts": ["5 kilopascals per second", "20 kilopascals per second", "10 kilopascals per second", "0.05 kilopascal per second"], "ans": 0, "sol": "Pressure rate = <span class=\"fq\"><span>211.3 − 141.3<\/span><span>11 − 4<\/span><\/span> = 10 kilopascals per meter. Each second the diver goes 0.5 meter deeper, so the pressure rises 10(0.5) = 5 kilopascals per second. Answer: <b>5 kilopascals per second<\/b>"}, {"lo": "LO5", "diff": "X", "type": "mcq", "q": "The table shows three values of a relationship, where <i>t<\/i> is a constant. For what value of <i>t<\/i> does the table represent a linear function?<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><th><i>y<\/i><\/th><\/tr><tr><td>1<\/td><td>5<\/td><\/tr><tr><td><i>t<\/i><\/td><td>11<\/td><\/tr><tr><td>2<i>t<\/i><\/td><td>17<\/td><\/tr><\/table><\/div>", "opts": ["<i>t<\/i> = 2", "<i>t<\/i> = 3", "<i>t<\/i> = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>", "There is no such value of <i>t<\/i>."], "ans": 3, "sol": "Each step raises <i>y<\/i> by 6, so the two steps in <i>x<\/i> must be equal: <i>t<\/i> − 1 = 2<i>t<\/i> − <i>t<\/i> = <i>t<\/i>, which gives −1 = 0, impossible. (<i>t<\/i> = 0 or 1 would also repeat an <i>x<\/i>-value.) Answer: <b>no such value<\/b>"}], "unit_no": 1, "topic_no": "3", "code": "3.2"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

function selTabs(m){ $('tabLearn').setAttribute('aria-selected', m==='learn'); $('tabQuiz').setAttribute('aria-selected', m==='quiz'); }
function setMode(m, opts){
  mode=m; selTabs(m);
  if(m==='learn') renderLearn(opts&&opts.sheet); else renderQuizIntro();
  try{ history.replaceState(null,'','#'+m); }catch(e){}
}
$('tabLearn').addEventListener('click',function(){ setMode('learn'); });
$('tabQuiz').addEventListener('click',function(){
  if(QZ){ mode='quiz'; selTabs('quiz'); if(QZ.done) renderReport('all'); else renderQuestion(); return; }
  setMode('quiz');
});

/* ---------- shared question widget ---------- */
function qBody(q, sel, name){
  var h='<div class="qtext">'+q.q+'</div>';
  if(q.type==='spr'){
    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';
  } else {
    h+='<div class="opts" role="radiogroup">'+q.opts.map(function(o,k){ return '<button type="button" class="opt" role="radio" aria-checked="'+(sel===k)+'" data-k="'+k+'"><span class="let">'+letter(k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';
  }
  return h;
}

/* ---------- LEARN ---------- */
function renderLearn(jump){
  if(jump!=null) ST.sheet=jump;
  var cur=Math.max(0,Math.min(NSHEET-1,ST.sheet)); ST.sheet=cur; save();
  var h='<div class="stack">';
  h+='<section class="card"><div class="eyebrow">Learning objectives</div><p style="margin:6px 0 0;color:var(--ink-soft)">Each objective has its own learning sheet: read the idea, step through the worked examples, then do the guided questions (use a hint if you are stuck). Tick the objective when you are confident, then take the quiz sheets.</p><ul class="los">'+
    LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><a href="#" data-sheet="'+i+'">'+l.text+'</a>'+(ST.done[l.id]?'<span class="lo-done">✓ Done</span>':'')+'</li>'; }).join('')+'</ul>'+
    '<div class="sheetnav" role="tablist" aria-label="Learning sheets">'+LOS.map(function(l,i){ return '<button class="tab'+(ST.done[l.id]?' done':'')+'" role="tab" data-sheet="'+i+'" aria-selected="'+(i===cur)+'">Sheet '+(i+1)+'</button>'; }).join('')+
    '<button class="tab" role="tab" data-sheet="'+LOS.length+'" aria-selected="'+(cur===LOS.length)+'">Recap</button></div></section>';
  if(cur<LOS.length){
    var L=LOS[cur];
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Learning sheet '+(cur+1)+' of '+LOS.length+' · Objective '+(cur+1)+'</div><h2>'+L.text+'</h2>';
    h+='<div class="concept">'+byLo(S.notes,L.id).map(function(n){ return '<h3 class="note-h">'+n.h+'</h3>'+n.html; }).join('')+'</div>';
    byLo(S.examples,L.id).forEach(function(E,ei){
      h+='<div class="ex"><h3>Worked example '+(ei+1)+'</h3><div class="ex-q">'+E.q+'</div><ol class="steps">'+E.steps.map(function(s){ return '<li hidden>'+s+'</li>'; }).join('')+'</ol><div class="ans" hidden>Answer: '+E.ans+'</div><div class="ex-ctrl"><button class="btn" data-next>Show first step</button><button class="btn" data-all>Show full solution</button></div></div>';
    });
    var G=byLo(S.guided,L.id);
    if(G.length) h+='<h3 class="note-h">Guided practice</h3>';
    G.forEach(function(q,qi){
      var gi=S.guided.indexOf(q);
      h+='<div class="try" data-g="'+gi+'"><h3>Question '+(qi+1)+' of '+G.length+' <span class="pill '+q.diff+'" style="margin-left:6px">'+DIFF[q.diff]+'</span></h3>'+qBody(q,null,'g-'+gi)+'<div class="ex-ctrl">'+(q.hint?'<button class="btn" data-hint>Show hint</button>':'')+'<button class="btn btn-primary" data-check>Check answer</button></div><div class="hint" hidden>'+(q.hint||'')+'</div><div class="fbk"></div></div>';
    });
    h+='<label class="donebox"><input type="checkbox" id="done-'+esc(L.id)+'" data-done="'+esc(L.id)+'"'+(ST.done[L.id]?' checked':'')+'> I can do this objective</label>';
    h+='<div class="qnav"><button class="btn" data-go="'+(cur-1)+'"'+(cur===0?' disabled':'')+'>Previous sheet</button><button class="btn btn-primary" data-go="'+(cur+1)+'">'+(cur===LOS.length-1?'Go to recap':'Next sheet')+'</button></div></section>';
  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
