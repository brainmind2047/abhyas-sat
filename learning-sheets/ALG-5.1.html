var S = {"id": "ALG-5.1", "unit": "Algebra", "topic": "Linear inequalities", "title": "Solving one-variable and compound inequalities", "intro": "A linear inequality is solved almost exactly like a linear equation, except that the answer is a whole range of values instead of a single number. On the DSAT you will solve inequalities, combine them with “and” or “or,” turn absolute-value conditions into ranges, and decide which values or how many integers satisfy them.", "los": [{"id": "LO1", "text": "Solve one-variable linear inequalities, reversing the inequality sign when multiplying or dividing by a negative number, including inequalities with fractions or a constant parameter."}, {"id": "LO2", "text": "Solve compound “and” and “or” inequalities and describe the resulting solution set."}, {"id": "LO3", "text": "Solve absolute-value inequalities of the form |<i>x<\/i> − <i>a<\/i>| &lt; <i>b<\/i> or |<i>x<\/i> − <i>a<\/i>| &gt; <i>b<\/i>, and write an interval as an absolute-value inequality."}, {"id": "LO4", "text": "Determine integer solutions of an inequality and identify which given values satisfy it."}], "notes": [{"lo": "LO1", "h": "The one rule that differs from equations", "html": "You may add or subtract any number on both sides of an inequality, and you may multiply or divide both sides by a <b>positive<\/b> number, and the sign stays the same. Multiplying or dividing by a <b>negative<\/b> number reverses the order of the two sides, so the sign must flip.<div class=\"rule\">If <i>a<\/i> &lt; <i>b<\/i> and <i>c<\/i> &gt; 0, then <i>ac<\/i> &lt; <i>bc<\/i>.<br>If <i>a<\/i> &lt; <i>b<\/i> and <i>c<\/i> &lt; 0, then <i>ac<\/i> &gt; <i>bc<\/i>.<\/div>Why? 2 &lt; 5 is true, but after multiplying by −1 we get −2 and −5, and −2 &gt; −5.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Step<\/th><th>Flip the sign?<\/th><\/tr><tr><td>Add or subtract any number<\/td><td>No<\/td><\/tr><tr><td>Multiply or divide by a positive<\/td><td>No<\/td><\/tr><tr><td>Multiply or divide by a negative<\/td><td>Yes<\/td><\/tr><tr><td>Swap the two sides<\/td><td>Yes (5 &gt; <i>x<\/i> means <i>x<\/i> &lt; 5)<\/td><\/tr><\/table><\/div>A negative number on the other side does not cause a flip: 3<i>x<\/i> &lt; −12 gives <i>x<\/i> &lt; −4."}, {"lo": "LO1", "h": "Variables on both sides, fractions and parameters", "html": "Collect the variable terms on one side and the constants on the other. A useful habit is to move the variable to the side where its coefficient stays positive, so you never divide by a negative. For example, 4 − 2<i>x<\/i> &gt; 3<i>x<\/i> − 11 becomes 15 &gt; 5<i>x<\/i>, so 3 &gt; <i>x<\/i>, that is, <i>x<\/i> &lt; 3.<br>If there are fractions, multiply every term by the least common denominator first. Because the denominator is positive, the sign does not change.<br>When a letter such as <i>a<\/i> or <i>k<\/i> appears as a coefficient, its sign decides the direction. If <i>a<\/i> &lt; 0, then <i>a<\/i><i>x<\/i> &gt; 6 gives <i>x<\/i> &lt; <span class=\"fq\"><span>6<\/span><span><i>a<\/i><\/span><\/span>. To find a constant from a given solution set, solve in terms of the constant and set the boundary equal to the given number.<div class=\"tip\">Desmos tip: type the inequality exactly as written, for example 4 − 2x &gt; 3x − 11. Desmos shades the solution region, and clicking its edge shows the boundary value.<\/div>"}, {"lo": "LO2", "h": "“And” inequalities (sandwiches)", "html": "An “and” inequality is true only when <b>both<\/b> parts are true, so its solution is the overlap of the two pieces. It is often written as a sandwich, such as −5 &lt; 2<i>x<\/i> + 3 ≤ 11.<div class=\"rule\">Do the same operation to all three parts at once. If you multiply or divide by a negative, flip both signs, then rewrite the result in increasing order.<\/div>Example: 1 ≤ 7 − 3<i>x<\/i> &lt; 13 → subtract 7: −6 ≤ −3<i>x<\/i> &lt; 6 → divide by −3 and flip: 2 ≥ <i>x<\/i> &gt; −2, which reads −2 &lt; <i>x<\/i> ≤ 2.<br>When the two pieces are written separately (“<i>x<\/i> &gt; 1 and <i>x<\/i> ≤ 6”), solve each one, then keep only the values that work for both. If the pieces do not overlap, such as <i>x<\/i> &lt; 2 and <i>x<\/i> &gt; 5, the inequality has no solution."}, {"lo": "LO2", "h": "“Or” inequalities", "html": "An “or” inequality is true when <b>at least one<\/b> part is true, so its solution is everything covered by either piece. Solve each piece on its own and keep both answers. Do not combine them into a sandwich.<div class=\"rule\">“<i>x<\/i> &lt; <i>p<\/i> or <i>x<\/i> &gt; <i>q<\/i>” (with <i>p<\/i> &lt; <i>q<\/i>) is two separate rays pointing away from each other. It is never written as <i>p<\/i> &gt; <i>x<\/i> &gt; <i>q<\/i>.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Pieces<\/th><th>“and”<\/th><th>“or”<\/th><\/tr><tr><td><i>x<\/i> &gt; 1, <i>x<\/i> &lt; 6<\/td><td>1 &lt; <i>x<\/i> &lt; 6<\/td><td>all real numbers<\/td><\/tr><tr><td><i>x<\/i> &lt; 1, <i>x<\/i> &gt; 6<\/td><td>no solution<\/td><td><i>x<\/i> &lt; 1 or <i>x<\/i> &gt; 6<\/td><\/tr><tr><td><i>x<\/i> &gt; 1, <i>x<\/i> &gt; 6<\/td><td><i>x<\/i> &gt; 6<\/td><td><i>x<\/i> &gt; 1<\/td><\/tr><\/table><\/div>Sketching both pieces on one number line is the quickest way to see the overlap (“and”) or the union (“or”)."}, {"lo": "LO3", "h": "Absolute value as distance", "html": "|<i>x<\/i> − <i>a<\/i>| is the distance between <i>x<\/i> and <i>a<\/i> on the number line. So |<i>x<\/i> − 6| &lt; 2 means “<i>x<\/i> is less than 2 units from 6,” which gives 4 &lt; <i>x<\/i> &lt; 8.<div class=\"rule\">For <i>b<\/i> &gt; 0:<br>|<i>x<\/i> − <i>a<\/i>| &lt; <i>b<\/i> ⇔ <i>a<\/i> − <i>b<\/i> &lt; <i>x<\/i> &lt; <i>a<\/i> + <i>b<\/i> (one interval, an “and”)<br>|<i>x<\/i> − <i>a<\/i>| &gt; <i>b<\/i> ⇔ <i>x<\/i> &lt; <i>a<\/i> − <i>b<\/i> or <i>x<\/i> &gt; <i>a<\/i> + <i>b<\/i> (two rays, an “or”)<\/div>The same holds with ≤ and ≥. Since |<i>x<\/i> + 3| = |<i>x<\/i> − (−3)|, its center is −3. For |2<i>x<\/i> − 5| &lt; 9, write −9 &lt; 2<i>x<\/i> − 5 &lt; 9 and solve the sandwich.<br><b>Going backward:<\/b> <i>p<\/i> ≤ <i>x<\/i> ≤ <i>q<\/i> is |<i>x<\/i> − center| ≤ half-width, with center <span class=\"fq\"><span><i>p<\/i> + <i>q<\/i><\/span><span>2<\/span><\/span> and half-width <span class=\"fq\"><span><i>q<\/i> − <i>p<\/i><\/span><span>2<\/span><\/span>.<br>|<i>x<\/i> − 4| &lt; −1 has no solution; |<i>x<\/i> − 4| &gt; −1 holds for every <i>x<\/i>."}, {"lo": "LO4", "h": "Integer solutions and checking values", "html": "Many DSAT questions ask for the greatest or least integer, or how many integers, that satisfy an inequality. First solve, then look carefully at each endpoint.<div class=\"rule\">The integers from <i>m<\/i> to <i>n<\/i>, including both, number <i>n<\/i> − <i>m<\/i> + 1. A strict sign (&lt; or &gt;) excludes an endpoint that is itself an integer.<\/div>Example: −2.5 &lt; <i>x<\/i> ≤ 4 contains the integers −2, −1, 0, 1, 2, 3, 4, which is 7 integers. For <i>x<\/i> ≤ 6.6, the greatest integer is 6, not 7.<br>For “which value satisfies” questions, either solve the inequality once and compare, or substitute each option. Substituting is safest when the answer choices sit near a boundary. A value that makes the two sides equal does <b>not<\/b> satisfy a strict inequality.<div class=\"tip\">Desmos tip: after typing the inequality, enter an option as x = 7 and see whether the vertical line falls inside the shaded region. For counting, a table of x-values helps you check endpoints.<\/div>"}], "examples": [{"lo": "LO1", "q": "Solve 7 − 3<i>x<\/i> ≥ 19.", "steps": ["Subtract 7 from both sides: −3<i>x<\/i> ≥ 12.", "Divide both sides by −3. Because you are dividing by a negative, flip the sign: <i>x<\/i> ≤ −4.", "Check with <i>x<\/i> = −5: 7 + 15 = 22 ≥ 19, which is true."], "ans": "<i>x<\/i> ≤ −4"}, {"lo": "LO2", "q": "Solve −5 &lt; 2<i>x<\/i> + 3 ≤ 11.", "steps": ["Subtract 3 from all three parts: −8 &lt; 2<i>x<\/i> ≤ 8.", "Divide all three parts by 2. It is positive, so the signs stay: −4 &lt; <i>x<\/i> ≤ 4."], "ans": "−4 &lt; <i>x<\/i> ≤ 4"}, {"lo": "LO3", "q": "Solve |<i>x<\/i> − 6| &gt; 2.5.", "steps": ["“Greater than” means more than 2.5 units from 6, so there are two pieces: <i>x<\/i> − 6 &gt; 2.5 or <i>x<\/i> − 6 &lt; −2.5.", "Solve each piece: <i>x<\/i> &gt; 8.5 or <i>x<\/i> &lt; 3.5."], "ans": "<i>x<\/i> &lt; 3.5 or <i>x<\/i> &gt; 8.5"}, {"lo": "LO3", "q": "Write an absolute-value inequality whose solution is −3 ≤ <i>x<\/i> ≤ 11.", "steps": ["The center is the midpoint: <span class=\"fq\"><span>−3 + 11<\/span><span>2<\/span><\/span> = 4.", "The half-width is <span class=\"fq\"><span>11 − (−3)<\/span><span>2<\/span><\/span> = 7.", "Every <i>x<\/i> in the interval is at most 7 units from 4, and the endpoints are included, so use ≤."], "ans": "|<i>x<\/i> − 4| ≤ 7"}, {"lo": "LO4", "q": "How many integers <i>n<\/i> satisfy |2<i>n<\/i> − 7| &lt; 9?", "steps": ["Write the sandwich: −9 &lt; 2<i>n<\/i> − 7 &lt; 9.", "Add 7: −2 &lt; 2<i>n<\/i> &lt; 16. Divide by 2: −1 &lt; <i>n<\/i> &lt; 8.", "Both signs are strict, so −1 and 8 are excluded. The integers are 0, 1, 2, …, 7.", "Count: 7 − 0 + 1 = 8."], "ans": "8"}], "traps": ["Forgetting to flip the sign after multiplying or dividing by a negative, for example turning −4<i>x<\/i> &lt; 20 into <i>x<\/i> &lt; −5 instead of <i>x<\/i> &gt; −5.", "Flipping the sign when it is not needed: 3<i>x<\/i> &lt; −12 has a negative constant but a positive coefficient, so the answer is <i>x<\/i> &lt; −4.", "Treating an “or” inequality as an “and” inequality, writing −3 &lt; <i>x<\/i> &lt; 6 when the answer is <i>x<\/i> &lt; −3 or <i>x<\/i> &gt; 6.", "Turning |<i>x<\/i> − <i>a<\/i>| &gt; <i>b<\/i> into a single interval, or reading the center of |<i>x<\/i> + 3| as +3 instead of −3.", "Counting integers carelessly at the endpoints: including an endpoint that a strict inequality excludes, or forgetting to add 1 when counting from one integer to another."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which of the following is the solution to <i>x<\/i> + 8 &gt; 3?", "opts": ["<i>x<\/i> &gt; −5", "<i>x<\/i> &gt; 11", "<i>x<\/i> &lt; −5", "<i>x<\/i> &gt; 5"], "ans": 0, "sol": "Subtract 8 from both sides: <i>x<\/i> &gt; 3 − 8 = −5. No multiplying or dividing happened, so the sign stays. Answer: <b><i>x<\/i> &gt; −5<\/b>", "hint": "Undo the +8 the same way you would in an equation."}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which of the following is the solution to −4<i>x<\/i> &lt; 20?", "opts": ["<i>x<\/i> &lt; −5", "<i>x<\/i> &gt; 5", "<i>x<\/i> &gt; −5", "<i>x<\/i> &lt; 5"], "ans": 2, "sol": "Divide both sides by −4. Dividing by a negative flips the sign: <i>x<\/i> &gt; <span class=\"fq\"><span>20<\/span><span>−4<\/span><\/span> = −5. Answer: <b><i>x<\/i> &gt; −5<\/b>", "hint": "You must divide by a negative number. What does that do to the sign?"}, {"lo": "LO4", "diff": "E", "type": "spr", "q": "What is the greatest integer <i>x<\/i> that satisfies 5<i>x<\/i> − 2 ≤ 31?", "ans": ["6"], "sol": "Add 2: 5<i>x<\/i> ≤ 33. Divide by 5: <i>x<\/i> ≤ 6.6. The greatest integer that is at most 6.6 is 6. Answer: <b>6<\/b>", "hint": "Solve first, then look for the largest whole number that does not pass the boundary."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which of the following is the solution to −1 ≤ <i>x<\/i> − 4 &lt; 6?", "opts": ["−5 ≤ <i>x<\/i> &lt; 2", "3 ≤ <i>x<\/i> &lt; 10", "3 &lt; <i>x<\/i> ≤ 10", "−3 ≤ <i>x<\/i> &lt; 10"], "ans": 1, "sol": "Add 4 to all three parts: −1 + 4 ≤ <i>x<\/i> &lt; 6 + 4, so 3 ≤ <i>x<\/i> &lt; 10. Adding does not change either sign. Answer: <b>3 ≤ <i>x<\/i> &lt; 10<\/b>", "hint": "Whatever you do to the middle, do to the left and right parts too."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Which of the following is equivalent to |<i>x<\/i> − 2| &lt; 5?", "opts": ["<i>x<\/i> &lt; 7", "−7 &lt; <i>x<\/i> &lt; 3", "−3 &lt; <i>x<\/i> &lt; 7", "<i>x<\/i> &lt; −3 or <i>x<\/i> &gt; 7"], "ans": 2, "sol": "The values of <i>x<\/i> are less than 5 units from 2: 2 − 5 &lt; <i>x<\/i> &lt; 2 + 5, so −3 &lt; <i>x<\/i> &lt; 7. Answer: <b>−3 &lt; <i>x<\/i> &lt; 7<\/b>", "hint": "Think of |<i>x<\/i> − 2| as the distance from <i>x<\/i> to 2."}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which of the following is the solution to 2(<i>x<\/i> − 3) &gt; 5<i>x<\/i> + 9?", "opts": ["<i>x<\/i> &lt; −4", "<i>x<\/i> &gt; −5", "<i>x<\/i> &lt; 5", "<i>x<\/i> &lt; −5"], "ans": 3, "sol": "Distribute: 2<i>x<\/i> − 6 &gt; 5<i>x<\/i> + 9.<br>Subtract 5<i>x<\/i> and add 6: −3<i>x<\/i> &gt; 15.<br>Divide by −3 and flip: <i>x<\/i> &lt; −5. Answer: <b><i>x<\/i> &lt; −5<\/b>", "hint": "Distribute the 2 to both terms in the parentheses first."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which of the following is the solution to 3<i>x<\/i> + 1 &lt; −8 or 2<i>x<\/i> − 5 &gt; 7?", "opts": ["<i>x<\/i> &lt; −3 or <i>x<\/i> &gt; 6", "−3 &lt; <i>x<\/i> &lt; 6", "<i>x<\/i> &lt; −<span class=\"fq\"><span>7<\/span><span>3<\/span><\/span> or <i>x<\/i> &gt; 6", "<i>x<\/i> &lt; −3 or <i>x<\/i> &gt; 1"], "ans": 0, "sol": "First piece: 3<i>x<\/i> &lt; −9, so <i>x<\/i> &lt; −3. Second piece: 2<i>x<\/i> &gt; 12, so <i>x<\/i> &gt; 6.<br>The word “or” keeps both pieces; they are not combined into a sandwich. Answer: <b><i>x<\/i> &lt; −3 or <i>x<\/i> &gt; 6<\/b>", "hint": "Solve each piece separately. Does “or” mean overlap or union?"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "The solution to |<i>x<\/i> − 9| ≤ 4 is <i>a<\/i> ≤ <i>x<\/i> ≤ <i>b<\/i>. What is the value of <i>b<\/i> − <i>a<\/i>?", "ans": ["8"], "sol": "|<i>x<\/i> − 9| ≤ 4 gives 9 − 4 ≤ <i>x<\/i> ≤ 9 + 4, so 5 ≤ <i>x<\/i> ≤ 13. Then <i>b<\/i> − <i>a<\/i> = 13 − 5 = 8. Answer: <b>8<\/b>", "hint": "Find both endpoints from the center and the distance. How do they compare to the number 4?"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Which of the following values of <i>x<\/i> satisfies 4 − 2<i>x<\/i> &gt; 3<i>x<\/i> − 11?", "opts": ["7", "3", "4", "2"], "ans": 3, "sol": "Add 2<i>x<\/i> and 11 to both sides: 15 &gt; 5<i>x<\/i>, so <i>x<\/i> &lt; 3. Only 2 is less than 3. At <i>x<\/i> = 3 both sides equal −2, so 3 does not satisfy the strict inequality. Answer: <b>2<\/b>", "hint": "Solve once, then compare. Be careful with any option that makes both sides equal."}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Which inequality has the solution <i>x<\/i> &lt; −1 or <i>x<\/i> &gt; 9?", "opts": ["|<i>x<\/i> − 4| &lt; 5", "|<i>x<\/i> − 4| &gt; 5", "|<i>x<\/i> + 4| &gt; 5", "|<i>x<\/i> − 5| &gt; 4"], "ans": 1, "sol": "Two rays pointing outward mean a “greater than” absolute value. The center is the midpoint of −1 and 9, which is 4, and each boundary is 5 from 4. So the inequality is |<i>x<\/i> − 4| &gt; 5. Answer: <b>|<i>x<\/i> − 4| &gt; 5<\/b>", "hint": "Find the point halfway between the two boundaries and the distance from it to each boundary."}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "How many integers satisfy −7 &lt; 3<i>x<\/i> + 2 ≤ 14?", "ans": ["7"], "sol": "Subtract 2: −9 &lt; 3<i>x<\/i> ≤ 12. Divide by 3: −3 &lt; <i>x<\/i> ≤ 4.<br>−3 is excluded and 4 is included, so the integers are −2, −1, 0, 1, 2, 3, 4, which is 7 integers. Answer: <b>7<\/b>", "hint": "Solve the sandwich, then check which endpoints are included before counting."}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "Which of the following values of <i>x<\/i> satisfies both 5 − <i>x<\/i> &lt; 2 and 3<i>x<\/i> − 1 ≤ 14?", "opts": ["5", "3", "6", "2"], "ans": 0, "sol": "First: −<i>x<\/i> &lt; −3, so <i>x<\/i> &gt; 3. Second: 3<i>x<\/i> ≤ 15, so <i>x<\/i> ≤ 5. Together 3 &lt; <i>x<\/i> ≤ 5. Only 5 works: 3 fails the strict sign, 6 is too large and 2 is too small. Answer: <b>5<\/b>", "hint": "Find the overlap of the two solution sets. Which endpoints are included?"}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which of the following is the solution to 6<i>x<\/i> − 1 ≤ 17?", "opts": ["<i>x<\/i> ≤ 3", "<i>x<\/i> ≥ 3", "<i>x<\/i> ≤ <span class=\"fq\"><span>8<\/span><span>3<\/span><\/span>", "<i>x<\/i> ≤ 18"], "ans": 0, "sol": "Add 1: 6<i>x<\/i> ≤ 18. Divide by 6: <i>x<\/i> ≤ 3. Answer: <b><i>x<\/i> ≤ 3<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which of the following is the solution to −<span class=\"fq\"><span><i>x<\/i><\/span><span>3<\/span><\/span> &gt; 2?", "opts": ["<i>x<\/i> &gt; −6", "<i>x<\/i> &lt; −6", "<i>x<\/i> &lt; −<span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>", "<i>x<\/i> &gt; 6"], "ans": 1, "sol": "Multiply both sides by −3 and flip the sign: <i>x<\/i> &lt; −6. Answer: <b><i>x<\/i> &lt; −6<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which of the following is the solution to 4 &lt; <i>x<\/i> + 7 &lt; 12?", "opts": ["11 &lt; <i>x<\/i> &lt; 19", "3 &lt; <i>x<\/i> &lt; 5", "−3 &lt; <i>x<\/i> &lt; 5", "−3 &lt; <i>x<\/i> &lt; 19"], "ans": 2, "sol": "Subtract 7 from all three parts: 4 − 7 &lt; <i>x<\/i> &lt; 12 − 7, so −3 &lt; <i>x<\/i> &lt; 5. Answer: <b>−3 &lt; <i>x<\/i> &lt; 5<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Which of the following is equivalent to |<i>x<\/i> + 1| ≤ 3?", "opts": ["−2 ≤ <i>x<\/i> ≤ 4", "<i>x<\/i> ≤ 2", "<i>x<\/i> ≤ −4 or <i>x<\/i> ≥ 2", "−4 ≤ <i>x<\/i> ≤ 2"], "ans": 3, "sol": "|<i>x<\/i> + 1| = |<i>x<\/i> − (−1)|, so the center is −1. Within 3 of −1: −1 − 3 ≤ <i>x<\/i> ≤ −1 + 3, so −4 ≤ <i>x<\/i> ≤ 2. Answer: <b>−4 ≤ <i>x<\/i> ≤ 2<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Which of the following values of <i>x<\/i> satisfies 3<i>x<\/i> + 4 &gt; 25?", "opts": ["8", "7", "6", "5"], "ans": 0, "sol": "3<i>x<\/i> &gt; 21, so <i>x<\/i> &gt; 7. Only 8 is greater than 7; at <i>x<\/i> = 7 the two sides are equal. Answer: <b>8<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "The solution to 5<i>x<\/i> + 3 &lt; 2<i>x<\/i> + 21 is <i>x<\/i> &lt; <i>c<\/i>. What is the value of <i>c<\/i>?", "ans": ["6"], "sol": "Subtract 2<i>x<\/i> and 3: 3<i>x<\/i> &lt; 18, so <i>x<\/i> &lt; 6. Thus <i>c<\/i> = 6. Answer: <b>6<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which of the following is the solution to <span class=\"fq\"><span><i>x<\/i><\/span><span>2<\/span><\/span> − 3 ≥ <span class=\"fq\"><span><i>x<\/i><\/span><span>5<\/span><\/span>?", "opts": ["<i>x<\/i> ≤ 10", "<i>x<\/i> ≥ 10", "<i>x<\/i> ≥ <span class=\"fq\"><span>30<\/span><span>7<\/span><\/span>", "<i>x<\/i> ≥ 3"], "ans": 1, "sol": "Multiply every term by 10: 5<i>x<\/i> − 30 ≥ 2<i>x<\/i>.<br>Then 3<i>x<\/i> ≥ 30, so <i>x<\/i> ≥ 10. Answer: <b><i>x<\/i> ≥ 10<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Two water tanks are being filled. The inequality 3.2<i>t<\/i> − 14 ≤ 2.4<i>t<\/i> + 6 is true exactly when tank A holds no more water than tank B, <i>t<\/i> minutes after a timer starts. Which of the following describes all values of <i>t<\/i> for which this is true?", "opts": ["<i>t<\/i> ≥ 25", "<i>t<\/i> ≤ 10", "<i>t<\/i> ≤ 25", "<i>t<\/i> ≥ 10"], "ans": 2, "sol": "Subtract 2.4<i>t<\/i> and add 14: 0.8<i>t<\/i> ≤ 20.<br>Divide by 0.8, which is positive: <i>t<\/i> ≤ 25. Answer: <b><i>t<\/i> ≤ 25<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which of the following is the solution to −3 ≤ 5 − 2<i>x<\/i> &lt; 9?", "opts": ["−2 &lt; <i>x<\/i> ≤ 4", "−2 ≤ <i>x<\/i> &lt; 4", "<i>x<\/i> ≤ −2 or <i>x<\/i> &gt; 4", "−4 ≤ <i>x<\/i> &lt; 2"], "ans": 0, "sol": "Subtract 5: −8 ≤ −2<i>x<\/i> &lt; 4.<br>Divide by −2 and flip both signs: 4 ≥ <i>x<\/i> &gt; −2.<br>In increasing order: −2 &lt; <i>x<\/i> ≤ 4. Answer: <b>−2 &lt; <i>x<\/i> ≤ 4<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "An oven setting <i>F<\/i>, in degrees Fahrenheit, is acceptable for a recipe if 2<i>F<\/i> − 50 ≥ 600 and <i>F<\/i> + 40 ≤ 400. Which of the following settings is acceptable?", "opts": ["315", "362", "400", "350"], "ans": 3, "sol": "First: 2<i>F<\/i> ≥ 650, so <i>F<\/i> ≥ 325. Second: <i>F<\/i> ≤ 360. Together 325 ≤ <i>F<\/i> ≤ 360. Only 350 is in this range. Answer: <b>350<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A machined rod passes inspection if its length <i>L<\/i>, in millimeters, satisfies |<i>L<\/i> − 120| ≤ 0.8. Which of the following describes all lengths that pass?", "opts": ["119.2 &lt; <i>L<\/i> &lt; 120.8", "119.2 ≤ <i>L<\/i> ≤ 120.8", "<i>L<\/i> ≤ 120.8", "119.6 ≤ <i>L<\/i> ≤ 120.4"], "ans": 1, "sol": "The length is at most 0.8 mm from 120: 120 − 0.8 ≤ <i>L<\/i> ≤ 120 + 0.8, so 119.2 ≤ <i>L<\/i> ≤ 120.8. The sign ≤ includes the endpoints. Answer: <b>119.2 ≤ <i>L<\/i> ≤ 120.8<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "The solution to |2<i>x<\/i> − 5| &lt; 9 is <i>a<\/i> &lt; <i>x<\/i> &lt; <i>b<\/i>. What is the value of <i>a<\/i> + <i>b<\/i>?", "ans": ["5"], "sol": "−9 &lt; 2<i>x<\/i> − 5 &lt; 9. Add 5: −4 &lt; 2<i>x<\/i> &lt; 14. Divide by 2: −2 &lt; <i>x<\/i> &lt; 7.<br><i>a<\/i> + <i>b<\/i> = −2 + 7 = 5. Answer: <b>5<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "How many integers <i>x<\/i> satisfy |<i>x<\/i> − 3| ≤ 6?", "ans": ["13"], "sol": "3 − 6 ≤ <i>x<\/i> ≤ 3 + 6, so −3 ≤ <i>x<\/i> ≤ 9. Both ends are included: 9 − (−3) + 1 = 13. Answer: <b>13<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "Which of the following values of <i>x<\/i> is <b>not<\/b> a solution to 7 − 4<i>x<\/i> &lt; 2<i>x<\/i> + 31?", "opts": ["−3", "0", "−4", "5"], "ans": 2, "sol": "Subtract 2<i>x<\/i> and 7: −6<i>x<\/i> &lt; 24. Divide by −6 and flip: <i>x<\/i> &gt; −4.<br>−4 is not greater than −4 (both sides equal 23), so it is not a solution. Answer: <b>−4<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "A storage shelf can safely hold <i>b<\/i> boxes when 12<i>b<\/i> + 150 ≤ 900. What is the greatest number of boxes the shelf can safely hold?", "ans": ["62"], "sol": "12<i>b<\/i> ≤ 750, so <i>b<\/i> ≤ 62.5. The number of boxes must be a whole number, so the greatest is 62. Answer: <b>62<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "Which of the following describes all values of <i>x<\/i> that satisfy 2<i>x<\/i> − 3 &gt; 7 or 4 − <i>x<\/i> ≥ 6?", "opts": ["<i>x<\/i> &gt; 5 or <i>x<\/i> ≥ −2", "−2 ≤ <i>x<\/i> &lt; 5", "<i>x<\/i> &gt; 2 or <i>x<\/i> ≤ −2", "<i>x<\/i> &gt; 5 or <i>x<\/i> ≤ −2"], "ans": 3, "sol": "First piece: 2<i>x<\/i> &gt; 10, so <i>x<\/i> &gt; 5.<br>Second piece: −<i>x<\/i> ≥ 2, so <i>x<\/i> ≤ −2 (flip when dividing by −1).<br>“Or” keeps both pieces. Answer: <b><i>x<\/i> &gt; 5 or <i>x<\/i> ≤ −2<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Which inequality describes all numbers <i>x<\/i> that are within 4.5 units of −2 on the number line?", "opts": ["|<i>x<\/i> + 2| ≤ 4.5", "|<i>x<\/i> − 2| ≤ 4.5", "|<i>x<\/i> + 4.5| ≤ 2", "|<i>x<\/i> + 2| ≥ 4.5"], "ans": 0, "sol": "The distance from <i>x<\/i> to −2 is |<i>x<\/i> − (−2)| = |<i>x<\/i> + 2|. “Within 4.5” means this distance is at most 4.5. Answer: <b>|<i>x<\/i> + 2| ≤ 4.5<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A thermostat keeps a room's temperature <i>T<\/i>, in degrees Fahrenheit, from 66 to 74, inclusive. Which inequality describes all possible values of <i>T<\/i>?", "opts": ["|<i>T<\/i> − 70| ≤ 8", "|<i>T<\/i> − 4| ≤ 70", "|<i>T<\/i> − 70| ≤ 4", "|<i>T<\/i> − 70| ≥ 4"], "ans": 2, "sol": "Center: <span class=\"fq\"><span>66 + 74<\/span><span>2<\/span><\/span> = 70. Half-width: <span class=\"fq\"><span>74 − 66<\/span><span>2<\/span><\/span> = 4. Inclusive endpoints use ≤, so |<i>T<\/i> − 70| ≤ 4. Answer: <b>|<i>T<\/i> − 70| ≤ 4<\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "In the inequality 3(2<i>x<\/i> − <i>k<\/i>) &lt; 4<i>x<\/i> + 10, <i>k<\/i> is a constant. If the solution to the inequality is <i>x<\/i> &lt; 8, what is the value of <i>k<\/i>?", "ans": ["2"], "sol": "Distribute: 6<i>x<\/i> − 3<i>k<\/i> &lt; 4<i>x<\/i> + 10, so 2<i>x<\/i> &lt; 10 + 3<i>k<\/i> and <i>x<\/i> &lt; <span class=\"fq\"><span>10 + 3<i>k<\/i><\/span><span>2<\/span><\/span>.<br>Set <span class=\"fq\"><span>10 + 3<i>k<\/i><\/span><span>2<\/span><\/span> = 8: 10 + 3<i>k<\/i> = 16, so <i>k<\/i> = 2. Answer: <b>2<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "A designer needs a whole-number side length <i>s<\/i>, in centimeters, for a box that satisfies both 3<i>s<\/i> − 10 &gt; 41 and |<i>s<\/i> − 20| &lt; 5. How many values of <i>s<\/i> are possible?", "opts": ["9", "7", "8", "11"], "ans": 1, "sol": "First: 3<i>s<\/i> &gt; 51, so <i>s<\/i> &gt; 17. Second: 15 &lt; <i>s<\/i> &lt; 25.<br>Both together: 17 &lt; <i>s<\/i> &lt; 25, so <i>s<\/i> = 18, 19, …, 24, which is 7 values. Answer: <b>7<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which of the following is the solution to <span class=\"fq\"><span>3 − 2<i>x<\/i><\/span><span>4<\/span><\/span> ≥ <i>x<\/i> + 6?", "opts": ["<i>x<\/i> ≥ −<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>", "<i>x<\/i> ≤ −<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>", "<i>x<\/i> ≤ −<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>", "<i>x<\/i> ≤ <span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>"], "ans": 2, "sol": "Multiply both sides by 4: 3 − 2<i>x<\/i> ≥ 4<i>x<\/i> + 24.<br>Subtract 4<i>x<\/i> and 3: −6<i>x<\/i> ≥ 21.<br>Divide by −6 and flip: <i>x<\/i> ≤ −<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span>. Answer: <b><i>x<\/i> ≤ −<span class=\"fq\"><span>7<\/span><span>2<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which of the following is the solution to <i>x<\/i> − 4 ≤ 3<i>x<\/i> + 2 &lt; <i>x<\/i> + 12?", "opts": ["−3 ≤ <i>x<\/i> &lt; 5", "−3 &lt; <i>x<\/i> ≤ 5", "<i>x<\/i> ≥ −3", "−1 ≤ <i>x<\/i> &lt; 5"], "ans": 0, "sol": "Split into two pieces. Left: <i>x<\/i> − 4 ≤ 3<i>x<\/i> + 2 gives −6 ≤ 2<i>x<\/i>, so <i>x<\/i> ≥ −3.<br>Right: 3<i>x<\/i> + 2 &lt; <i>x<\/i> + 12 gives 2<i>x<\/i> &lt; 10, so <i>x<\/i> &lt; 5.<br>Both must hold: −3 ≤ <i>x<\/i> &lt; 5. Answer: <b>−3 ≤ <i>x<\/i> &lt; 5<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "Which of the following is equivalent to |3 − <i>x<\/i>| &gt; 7?", "opts": ["−4 &lt; <i>x<\/ "Subtract 5: <i>a<\/i><i>x<\/i> &gt; 2<i>a<\/i>.<br>Divide by <i>a<\/i>. Since <i>a<\/i> &lt; 0, flip the sign: <i>x<\/i> &lt; 2. Answer: <b><i>x<\/i> &lt; 2<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "For which of the following values of <i>c<\/i> does the inequality “<i>x<\/i> &lt; <i>c<\/i> and <i>x<\/i> &gt; 2<i>c<\/i> − 5” have no solution?", "opts": ["6", "4", "3", "−5"], "ans": 0, "sol": "The solution is the overlap 2<i>c<\/i> − 5 &lt; <i>x<\/i> &lt; <i>c<\/i>. It is empty when 2<i>c<\/i> − 5 ≥ <i>c<\/i>, that is, when <i>c<\/i> ≥ 5.<br>Only 6 qualifies; for example, <i>c<\/i> = 4 gives 3 &lt; <i>x<\/i> &lt; 4. Answer: <b>6<\/b>"}, {"lo": "LO3", "diff": "H", "type": "spr", "q": "The solution to |<i>x<\/i> − <i>a<\/i>| &lt; <i>b<\/i>, where <i>a<\/i> and <i>b<\/i> are constants, is −11 &lt; <i>x<\/i> &lt; 3. What is the value of <i>ab<\/i>?", "ans": ["-28"], "sol": "The center is <i>a<\/i> = <span class=\"fq\"><span>−11 + 3<\/span><span>2<\/span><\/span> = −4. The half-width is <i>b<\/i> = <span class=\"fq\"><span>3 − (−11)<\/span><span>2<\/span><\/span> = 7.<br><i>ab<\/i> = (−4)(7) = −28. Answer: <b>−28<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "What is the sum of all integer solutions to −4 ≤ <span class=\"fq\"><span>5 − 3<i>x<\/i><\/span><span>2<\/span><\/span> &lt; 7?", "opts": ["4", "7", "10", "9"], "ans": 1, "sol": "Multiply by 2: −8 ≤ 5 − 3<i>x<\/i> &lt; 14. Subtract 5: −13 ≤ −3<i>x<\/i> &lt; 9.<br>Divide by −3 and flip: −3 &lt; <i>x<\/i> ≤ <span class=\"fq\"><span>13<\/span><span>3<\/span><\/span>, about 4.33.<br>Integers: −2, −1, 0, 1, 2, 3, 4. Their sum is 7. Answer: <b>7<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "Two candles are lit at the same time. The inequality 24 − 1.6<i>t<\/i> &gt; 18 − 0.9<i>t<\/i> is true exactly when candle A is taller than candle B, <i>t<\/i> hours after they are lit. Which of the following describes all values of <i>t<\/i> for which candle A is taller?", "opts": ["<i>t<\/i> &lt; <span /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
