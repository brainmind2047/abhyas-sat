  @media (max-width:560px){ body{font-size:16px;} .dtab{font-size:14.5px;} .dtab th,.dtab td{padding:5px 7px;} .card{padding:16px;} .lotab .hide-s{display:none;} }

  /* learning-sheet navigator */
  .sheetnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}

  .sheetnav .tab.done::after{content:" ✓"; color:var(--success);}

  .concept .rule{background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:10px 0; font-weight:600;}

  .hint{margin-top:10px; border-left:3px solid var(--gold); padding:4px 0 4px 12px; font-size:15.5px; color:var(--ink-soft);}

var S = {"id": "GEO-3.2", "unit": "Geometry and Trigonometry", "topic": "Right triangles, trigonometry and circles", "title": "Right-triangle trigonometry", "intro": "Right-triangle trigonometry connects the acute angles of a right triangle to the ratios of its side lengths: sine, cosine and tangent. On the DSAT you use these ratios to find missing sides, to switch between the two acute angles with sin <i>x<\/i>° = cos(90° − <i>x<\/i>°), and to solve height and distance problems that use angles of elevation and depression.", "los": [{"id": "LO1", "text": "Identify the opposite side, adjacent side and hypotenuse for an acute angle of a right triangle, and write its sine, cosine and tangent as ratios of side lengths."}, {"id": "LO2", "text": "Determine a missing side length of a right triangle from one side and either an acute angle or a given trigonometric ratio."}, {"id": "LO3", "text": "Use the complementary-angle relationship sin <i>x<\/i>° = cos(90° − <i>x<\/i>°) to relate the ratios of the two acute angles and to solve for unknown angles or values."}, {"id": "LO4", "text": "Explain why trigonometric ratios are equal in similar right triangles, and use one given ratio to find the other ratios with a Pythagorean triple or the Pythagorean theorem."}, {"id": "LO5", "text": "Solve real-world problems involving angles of elevation and depression, ladders, ramps and other right-triangle models."}], "notes": [{"lo": "LO1", "h": "Naming the sides from an angle", "html": "<p>Every ratio in this subtopic starts with a right triangle and one chosen acute angle. The names of two of the sides depend on which angle you are looking from.<\/p><ul><li><b>Hypotenuse:<\/b> the longest side, across from the right angle. It never changes.<\/li><li><b>Opposite side:<\/b> the leg across from the chosen angle. It does not touch that angle.<\/li><li><b>Adjacent side:<\/b> the leg that forms the chosen angle together with the hypotenuse.<\/li><\/ul><svg class=\"fig\" viewBox=\"0 0 300 210\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C and angle A marked. Side BC, across from angle A, is labeled opposite. Side AC, which forms angle A, is labeled adjacent. Side AB, across from the right angle, is labeled hypotenuse.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26.00,178.00 226.00,178.00 226.00,28.00\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"217.00,178.00 217.00,169.00 226.00,169.00\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"50.00,178.00 49.98,177.04 49.92,176.07 49.83,175.11 49.69,174.16 49.52,173.21 49.30,172.26 49.06,171.33 48.77,170.41 48.44,169.50 48.08,168.61 47.69,167.73 47.26,166.86 46.79,166.02 46.29,165.19 45.76,164.38 45.20,163.60\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"12.19\" y=\"187.68\" text-anchor=\"middle\">A<\/text><text x=\"235.13\" y=\"18.80\" text-anchor=\"middle\">B<\/text><text x=\"238.69\" y=\"192.02\" text-anchor=\"middle\">C<\/text><text x=\"102.96\" y=\"76.78\" text-anchor=\"middle\">hypotenuse<\/text><text x=\"266.60\" y=\"107.50\" text-anchor=\"middle\">opposite<\/text><text x=\"126.00\" y=\"200.00\" text-anchor=\"middle\">adjacent<\/text><\/g><\/svg><div class=\"rule\">Opposite and adjacent swap when you move from one acute angle to the other. The hypotenuse stays the same.<\/div><p>In the figure, BC is opposite angle <i>A<\/i> and AC is adjacent to angle <i>A<\/i>. Looking from angle <i>B<\/i>, the roles reverse: AC is opposite and BC is adjacent. Before you write any ratio, point at the angle and name all three sides.<\/p>"}, {"lo": "LO1", "h": "Sine, cosine and tangent", "html": "<p>For an acute angle <i>A<\/i> of a right triangle, the three trigonometric ratios are defined by side lengths.<\/p><div class=\"eqs\">sin <i>A<\/i> = <span class=\"fq\"><span>opposite<\/span><span>hypotenuse<\/span><\/span> &nbsp;&nbsp; cos <i>A<\/i> = <span class=\"fq\"><span>adjacent<\/span><span>hypotenuse<\/span><\/span> &nbsp;&nbsp; tan <i>A<\/i> = <span class=\"fq\"><span>opposite<\/span><span>adjacent<\/span><\/span><\/div><div class=\"rule\">SOH-CAH-TOA: Sine is Opposite over Hypotenuse, Cosine is Adjacent over Hypotenuse, Tangent is Opposite over Adjacent.<\/div><svg class=\"fig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C. Leg AC is 15, leg BC is 8 and hypotenuse AB is 17.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26.00,161.13 274.00,161.13 274.00,28.87\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"265.00,161.13 265.00,152.13 274.00,152.13\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"52.00,161.13 51.99,160.34 51.95,159.54 51.89,158.75 51.81,157.96 51.70,157.17 51.56,156.38 51.40,155.60 51.22,154.83 51.02,154.06 50.79,153.30 50.54,152.54 50.26,151.79 49.97,151.05 49.65,150.33 49.31,149.61 48.94,148.90\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"12.23\" y=\"169.30\" text-anchor=\"middle\">A<\/text><text x=\"285.13\" y=\"21.50\" text-anchor=\"middle\">B<\/text><text x=\"287.52\" y=\"172.84\" text-anchor=\"middle\">C<\/text><text x=\"140.49\" y=\"81.66\" text-anchor=\"middle\">17<\/text><text x=\"288.70\" y=\"99.50\" text-anchor=\"middle\">8<\/text><text x=\"150.00\" y=\"183.13\" text-anchor=\"middle\">15<\/text><\/g><\/svg><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Ratio<\/th><th>Angle <i>A<\/i><\/th><th>Angle <i>B<\/i><\/th><\/tr><tr><td>sin<\/td><td><span class=\"fq\"><span>8<\/span><span>17<\/span><\/span><\/td><td><span class=\"fq\"><span>15<\/span><span>17<\/span><\/span><\/td><\/tr><tr><td>cos<\/td><td><span class=\"fq\"><span>15<\/span><span>17<\/span><\/span><\/td><td><span class=\"fq\"><span>8<\/span><span>17<\/span><\/span><\/td><\/tr><tr><td>tan<\/td><td><span class=\"fq\"><span>8<\/span><span>15<\/span><\/span><\/td><td><span class=\"fq\"><span>15<\/span><span>8<\/span><\/span><\/td><\/tr><\/table><\/div><p>Because the hypotenuse is the longest side, the sine and cosine of an acute angle are always between 0 and 1. The tangent can be any positive number; it is greater than 1 when the opposite leg is longer than the adjacent leg.<\/p><div class=\"tip\">DSAT tip: you never need to measure. Read the lengths, name the sides from the given angle, then divide.<\/div>"}, {"lo": "LO2", "h": "Finding a missing side", "html": "<p>If you know one acute angle and one side, a trigonometric ratio links the side you know to the side you want.<\/p><ul><li>Name the known side and the wanted side relative to the given angle.<\/li><li>Choose the ratio that uses exactly those two sides.<\/li><li>Write an equation and solve it.<\/li><\/ul><div class=\"eqs\">sin 41° = <span class=\"fq\"><span><i>x<\/i><\/span><span>24<\/span><\/span> &nbsp;→&nbsp; <i>x<\/i> = 24 sin 41° ≈ 15.7<\/div><div class=\"rule\">If the unknown is in the numerator, multiply. If the unknown is in the denominator, divide: cos 25° = <span class=\"fq\"><span>12<\/span><span><i>h<\/i><\/span><\/span> gives <i>h<\/i> = <span class=\"fq\"><span>12<\/span><span>cos 25°<\/span><\/span>.<\/div><p>A ratio value can replace the angle. If sin <i>A<\/i> = 0.6 and the hypotenuse is 35, then the leg opposite <i>A<\/i> is 0.6 × 35 = 21.<\/p><div class=\"tip\">Desmos tip: make sure Desmos is in degree mode (wrench icon) before you type sin(41). In radian mode it returns a wrong value with no warning.<\/div>"}, {"lo": "LO3", "h": "Complementary angles swap sine and cosine", "html": "<p>The two acute angles of a right triangle add up to 90°, so they are complementary. The leg opposite one of them is adjacent to the other, and that single fact swaps sine and cosine.<\/p><div class=\"rule\">For the acute angles <i>A<\/i> and <i>B<\/i> of a right triangle, sin <i>A<\/i> = cos <i>B<\/i> and cos <i>A<\/i> = sin <i>B<\/i>. In general, sin <i>x<\/i>° = cos(90° − <i>x<\/i>°).<\/div><div class=\"eqs\">sin 20° = cos 70° &nbsp;&nbsp;&nbsp; cos 52° = sin 38°<\/div><p>The tangents of the two acute angles are reciprocals, because the same two legs appear upside down: tan <i>B<\/i> = <span class=\"fq\"><span>1<\/span><span>tan <i>A<\/i><\/span><\/span>.<\/p><p>On the DSAT this often appears as an equation such as sin <i>a<\/i>° = cos <i>b<\/i>° with both angles acute. Then the angles must be complementary, so <i>a<\/i> + <i>b<\/i> = 90. Write that equation and solve for the variable.<\/p><div class=\"tip\">DSAT tip: if sin <i>a<\/i>° = cos <i>b<\/i>°, do not set <i>a<\/i> = <i>b<\/i>. Equal sine and cosine means the angles <b>add<\/b> to 90°.<\/div>"}, {"lo": "LO4", "h": "Why a ratio depends only on the angle", "html": "<p>Two right triangles with an equal acute angle are similar by AA, since they also share the right angle. Corresponding sides of similar triangles are proportional, so the ratio of two sides is the same in both triangles.<\/p><svg class=\"fig\" viewBox=\"0 0 330 190\" role=\"img\" aria-label=\"Two right triangles. Triangle ABC has right angle C, AC = 4, BC = 3 and AB = 5. Triangle DEF has right angle F, DF = 8, EF = 6 and DE = 10. Angle A and angle D are equal.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26.00,154.57 105.43,154.57 105.43,95.00\"/><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"145.14,154.57 304.00,154.57 304.00,35.43\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"96.43,154.57 96.43,145.57 105.43,145.57\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"295.00,154.57 295.00,145.57 304.00,145.57\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"46.00,154.57 45.98,153.77 45.94,152.96 45.85,152.16 45.74,151.37 45.60,150.58 45.42,149.79 45.21,149.01 44.97,148.25 44.70,147.49 44.40,146.74 44.07,146.01 43.72,145.29 43.33,144.58 42.91,143.90 42.47,143.22 42.00,142.57\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"165.14,154.57 165.13,153.77 165.08,152.96 165.00,152.16 164.88,151.37 164.74,150.58 164.56,149.79 164.36,149.01 164.12,148.25 163.85,147.49 163.55,146.74 163.22,146.01 162.86,145.29 162.47,144.58 162.06,143.90 161.61,143.22 161.14,142.57\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"12.19\" y=\"164.25\" text-anchor=\"middle\">A<\/text><text x=\"114.56\" y=\"85.80\" text-anchor=\"middle\">B<\/text><text x=\"118.12\" y=\"168.59\" text-anchor=\"middle\">C<\/text><text x=\"131.34\" y=\"164.25\" text-anchor=\"middle\">D<\/text><text x=\"313.13\" y=\"26.23\" text-anchor=\"middle\">E<\/text><text x=\"316.69\" y=\"168.59\" text-anchor=\"middle\">F<\/text><text x=\"54.66\" y=\"114.55\" text-anchor=\"middle\">5<\/text><text x=\"120.13\" y=\"129.29\" text-anchor=\"middle\">3<\/text><text x=\"65.71\" y=\"176.57\" text-anchor=\"middle\">4<\/text><text x=\"212.19\" y=\"82.99\" text-anchor=\"middle\">10<\/text><text x=\"318.70\" y=\"99.50\" text-anchor=\"middle\">6<\/text><text x=\"224.57\" y=\"176.57\" text-anchor=\"middle\">8<\/text><\/g><\/svg><div class=\"rule\">A trigonometric ratio depends only on the angle, not on the size of the triangle.<\/div><p>Here angle <i>A<\/i> equals angle <i>D<\/i>, and tan <i>A<\/i> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span> while tan <i>D<\/i> = <span class=\"fq\"><span>6<\/span><span>8<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>. Scaling a right triangle multiplies every side by the same factor, and that factor cancels in every ratio. This is why a calculator gives one value for sin 40° without knowing your triangle, and why the DSAT can ask for a ratio in one triangle using lengths from a similar one.<\/p>"}, {"lo": "LO4", "h": "From one ratio to the others", "html": "<p>If you know one ratio of an acute angle, you can find the other two without finding the angle.<\/p><ul><li>Sketch a right triangle and label two sides from the ratio. For tan <i>x<\/i> = <span class=\"fq\"><span>20<\/span><span>21<\/span><\/span>, label the opposite leg 20 and the adjacent leg 21.<\/li><li>Use the Pythagorean theorem for the third side: √(20<sup>2<\/sup> + 21<sup>2<\/sup>) = √841 = 29.<\/li><li>Read off the other ratios: sin <i>x<\/i> = <span class=\"fq\"><span>20<\/span><span>29<\/span><\/span> and cos <i>x<\/i> = <span class=\"fq\"><span>21<\/span><span>29<\/span><\/span>.<\/li><\/ul><div class=\"rule\">A ratio fixes the shape of the triangle, not its size. Labeling the legs 20<i>k<\/i> and 21<i>k<\/i> gives the same ratios.<\/div><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Triple<\/th><th>Ratios you will see<\/th><\/tr><tr><td>3, 4, 5<\/td><td><span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>, <span class=\"fq\"><span>4<\/span><span>5<\/span><\/span>, <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>, <span class=\"fq\"><span>4<\/span><span>3<\/span><\/span><\/td><\/tr><tr><td>5, 12, 13<\/td><td><span class=\"fq\"><span>5<\/span><span>13<\/span><\/span>, <span class=\"fq\"><span>12<\/span><span>13<\/span><\/span>, <span class=\"fq\"><span>5<\/span><span>12<\/span><\/span>, <span class=\"fq\"><span>12<\/span><span>5<\/span><\/span><\/td><\/tr><tr><td>8, 15, 17<\/td><td><span class=\"fq\"><span>8<\/span><span>17<\/span><\/span>, <span class=\"fq\"><span>15<\/span><span>17<\/span><\/span>, <span class=\"fq\"><span>8<\/span><span>15<\/span><\/span>, <span class=\"fq\"><span>15<\/span><span>8<\/span><\/span><\/td><\/tr><tr><td>7, 24, 25<\/td><td><span class=\"fq\"><span>7<\/span><span>25<\/span><\/span>, <span class=\"fq\"><span>24<\/span><span>25<\/span><\/span>, <span class=\"fq\"><span>7<\/span><span>24<\/span><\/span>, <span class=\"fq\"><span>24<\/span><span>7<\/span><\/span><\/td><\/tr><\/table><\/div><div class=\"tip\">DSAT tip: if the third side is not a whole number, leave it as a radical. For sin <i>x<\/i> = <span class=\"fq\"><span>1<\/span><span>4<\/span><\/span>, the adjacent leg is √15, so cos <i>x<\/i> = <span class=\"fq\"><span>√15<\/span><span>4<\/span><\/span>.<\/div>"}, {"lo": "LO5", "h": "Angles of elevation and depression", "html": "<p>An <b>angle of elevation<\/b> is measured upward from a horizontal line to a line of sight. An <b>angle of depression<\/b> is measured downward from a horizontal line. Both are measured from the horizontal, never from a vertical wall or pole.<\/p><svg class=\"fig\" viewBox=\"0 0 300 180\" role=\"img\" aria-label=\"A vertical tower TB stands on level ground, and a point P is on the ground. A dashed horizontal line runs from the top T. The angle of depression from T to P, between the horizontal line and segment TP, is labeled theta. The angle of elevation from P to T, between the ground and segment PT, is also labeled theta. The angle at the base B is a right angle.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26.00,152.00 26.00,28.00 274.00,152.00\"/><line class=\"fg-edge\" x1=\"26.00\" y1=\"28.00\" x2=\"274.00\" y2=\"28.00\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"26.00,143.00 35.00,143.00 35.00,152.00\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"56.00,28.00 55.99,28.87 55.95,29.74 55.89,30.60 55.80,31.47 55.69,32.33 55.55,33.19 55.38,34.04 55.20,34.89 54.99,35.74 54.75,36.57 54.49,37.40 54.20,38.22 53.90,39.04 53.56,39.84 53.21,40.63 52.83,41.42\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"244.00,152.00 244.01,151.13 244.05,150.26 244.11,149.40 244.20,148.53 244.31,147.67 244.45,146.81 244.62,145.96 244.80,145.11 245.01,144.26 245.25,143.43 245.51,142.60 245.80,141.78 246.10,140.96 246.44,140.16 246.79,139.37 247.17,138.58\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"68.82\" y=\"42.61\" text-anchor=\"middle\" font-style=\"italic\">θ<\/text><text x=\"231.18\" y=\"146.39\" text-anchor=\"middle\" font-style=\"italic\">θ<\/text><text x=\"14.54\" y=\"21.04\" text-anchor=\"middle\">T<\/text><text x=\"12.39\" y=\"163.30\" text-anchor=\"middle\">B<\/text><text x=\"287.74\" y=\"159.94\" text-anchor=\"middle\">P<\/text><text x=\"216.13\" y=\"22.50\" text-anchor=\"middle\">horizontal<\/text><\/g><\/svg><div class=\"rule\">The angle of depression from T to P equals the angle of elevation from P to T. The horizontal line at T is parallel to the ground, so the two angles are alternate interior angles.<\/div><p>To solve, draw the right triangle formed by the vertical height, the horizontal distance and the line of sight. Put the angle at the ground end of the line of sight, then choose the ratio as usual: the height and the horizontal distance are the legs, and the line of sight is the hypotenuse.<\/p>"}, {"lo": "LO5", "h": "Modeling with right triangles", "html": "<p>Many DSAT word problems hide a right triangle. A ladder against a wall, a ramp, a kite string or a slide each forms one with the level ground and a vertical line.<\/p><div class=\"tscroll\"><table class=\"dtab\"><tr><th>Situation<\/th><th>Hypotenuse<\/th><th>Legs<\/th><\/tr><tr><td>Ladder against a wall<\/td><td>ladder<\/td><td>height on the wall, distance from the wall<\/td><\/tr><tr><td>Ramp<\/td><td>ramp surface<\/td><td>vertical rise, horizontal run<\/td><\/tr><tr><td>Kite or drone<\/td><td>string or line of sight<\/td><td>height, ground distance<\/td><\/tr><\/table><\/div><div class=\"rule\">Measure heights from the right level: if a line of sight starts at a person's eye, add the eye height at the end.<\/div><p>Check that the answer makes sense. A leg is always shorter than the hypotenuse, and over the same horizontal distance a larger angle of elevation means a taller object.<\/p><div class=\"tip\">DSAT tip: keep full calculator precision until the final step. Rounding tan 52° to 1.3 too early can change the digit the question asks for.<\/div>"}], "examples": [{"lo": "LO1", "q": "In right triangle ABC, angle <i>C<\/i> is the right angle, AC = 24, BC = 7 and AB = 25. Find sin <i>A<\/i>, cos <i>A<\/i> and tan <i>A<\/i>. Then find tan <i>B<\/i>.", "steps": ["From angle <i>A<\/i>: BC = 7 is opposite, AC = 24 is adjacent, and AB = 25 is the hypotenuse.", "sin <i>A<\/i> = <span class=\"fq\"><span>7<\/span><span>25<\/span><\/span>, cos <i>A<\/i> = <span class=\"fq\"><span>24<\/span><span>25<\/span><\/span> and tan <i>A<\/i> = <span class=\"fq\"><span>7<\/span><span>24<\/span><\/span>.", "From angle <i>B<\/i> the legs swap roles: AC = 24 is opposite and BC = 7 is adjacent, so tan <i>B<\/i> = <span class=\"fq\"><span>24<\/span><span>7<\/span><\/span>."], "ans": "sin <i>A<\/i> = <span class=\"fq\"><span>7<\/span><span>25<\/span><\/span>, cos <i>A<\/i> = <span class=\"fq\"><span>24<\/span><span>25<\/span><\/span>, tan <i>A<\/i> = <span class=\"fq\"><span>7<\/span><span>24<\/span><\/span>, tan <i>B<\/i> = <span class=\"fq\"><span>24<\/span><span>7<\/span><\/span>"}, {"lo": "LO2", "q": "In right triangle PQR, angle <i>Q<\/i> = 90°, angle <i>P<\/i> = 38° and PR = 30. What is the length of QR, to the nearest tenth? (SPR)", "steps": ["From angle <i>P<\/i>, QR is opposite and PR is the hypotenuse, so use sine.", "sin 38° = <span class=\"fq\"><span>QR<\/span><span>30<\/span><\/span>, so QR = 30 sin 38°.", "30 sin 38° ≈ 30(0.6157) ≈ 18.47, which rounds to 18.5."], "ans": "QR ≈ 18.5"}, {"lo": "LO2", "q": "In right triangle ABC, angle <i>C<\/i> = 90°, angle <i>A<\/i> = 34° and BC = 9. Find AC to the nearest tenth.", "steps": ["From angle <i>A<\/i>, BC is opposite and AC is adjacent, so use tangent.", "tan 34° = <span class=\"fq\"><span>9<\/span><span>AC<\/span><\/span>. The unknown is in the denominator, so AC = <span class=\"fq\"><span>9<\/span><span>tan 34°<\/span><\/span>.", "AC ≈ <span class=\"fq\"><span>9<\/span><span>0.6745<\/span><\/span> ≈ 13.34, which rounds to 13.3."], "ans": "AC ≈ 13.3"}, {"lo": "LO3", "q": "<div class=\"eqs\">sin(3<i>x<\/i> + 8)° = cos(2<i>x<\/i> + 12)°<\/div>In the equation, both angle measures are between 0° and 90°. What is the value of <i>x<\/i>?<br>A) 4 &nbsp; B) 14 &nbsp; C) 16 &nbsp; D) 18", "steps": ["Equal sine and cosine of acute angles means the angles are complementary.", "So (3<i>x<\/i> + 8) + (2<i>x<\/i> + 12) = 90, which gives 5<i>x<\/i> + 20 = 90.", "5<i>x<\/i> = 70, so <i>x<\/i> = 14. Check: the angles are 50° and 40°, which add to 90° and are both acute."], "ans": "B) 14"}, {"lo": "LO4", "q": "In right triangle ABC, angle <i>C<\/i> is the right angle and tan <i>A<\/i> = <span class=\"fq\"><span>5<\/span><span>12<\/span><\/span>. Find sin <i>A<\/i> and cos <i>B<\/i>.", "steps": ["Label the leg opposite <i>A<\/i> as 5 and the leg adjacent to <i>A<\/i> as 12 (any multiple gives the same ratios).", "Hypotenuse: √(5<sup>2<\/sup> + 12<sup>2<\/sup>) = √169 = 13.", "sin <i>A<\/i> = <span class=\"fq\"><span>5<\/span><span>13<\/span><\/span>. The leg opposite <i>A<\/i> is adjacent to <i>B<\/i>, so cos <i>B<\/i> = <span class=\"fq\"><span>5<\/span><span>13<\/span><\/span> as well."], "ans": "sin <i>A<\/i> = cos <i>B<\/i> = <span class=\"fq\"><span>5<\/span><span>13<\/span><\/span>"}, {"lo": "LO5", "q": "<svg class=\"fig\" viewBox=\"0 0 270 270\" role=\"img\" aria-label=\"A surveyor stands on level ground 40 meters from the base of a building. Her eye is 1.5 meters above the ground. A dashed horizontal line runs from her eye to the building, and her line of sight to the top of the building makes a 52 degree angle with the dashed line. The building height is labeled h.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"201.22,237.47 228.44,237.47 228.44,32.53 201.22,32.53\"/><line class=\"fg-edge\" x1=\"34.00\" y1=\"237.47\" x2=\"244.00\" y2=\"237.47\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"45.67\" y1=\"237.47\" x2=\"45.67\" y2=\"231.63\" stroke=\"currentColor\" stroke-width=\"2.5\"/><line class=\"fg-edge\" x1=\"45.67\" y1=\"231.63\" x2=\"201.22\" y2=\"231.63\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line class=\"fg-edge\" x1=\"45.67\" y1=\"231.63\" x2=\"201.22\" y2=\"32.53\" stroke=\"currentColor\" stroke-width=\"1.5\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"193.22,231.63 193.22,223.63 201.22,223.63\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"73.67,231.63 73.62,230.05 73.49,228.46 73.26,226.89 72.95,225.34 72.55,223.80 72.06,222.29 71.49,220.81 70.83,219.36 70.10,217.95 69.28,216.59 68.39,215.28 67.43,214.01 66.39,212.81 65.29,211.66 64.13,210.58 62.91,209.57\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"83.42\" y=\"217.72\" text-anchor=\"middle\">52°<\/text><text x=\"123.44\" y=\"254.97\" text-anchor=\"middle\">40 m<\/text><text x=\"23.67\" y=\"239.05\" text-anchor=\"middle\">1.5 m<\/text><text x=\"238.44\" y=\"139.50\" text-anchor=\"middle\" font-style=\"italic\">h<\/text><\/g><\/svg>A surveyor stands on level ground 40 meters from the base of a building, as shown. Her eye is 1.5 meters above the ground, and the angle of elevation from her eye to the top of the building is 52°. What is the height <i>h<\/i> of the building, in meters, to the nearest tenth?", "steps": ["The right triangle starts at eye level: its horizontal leg is 40 m and its vertical leg is the part of the building above eye level.", "The vertical leg is opposite the 52° angle and the 40 m leg is adjacent, so it equals 40 tan 52° ≈ 51.20 m.", "Add the eye height: <i>h<\/i> ≈ 51.20 + 1.5 = 52.70, so about 52.7 m."], "ans": "<i>h<\/i> ≈ 52.7 meters"}], "traps": ["Naming opposite and adjacent from the wrong angle. The opposite side is across from the angle you are using, not across from the right angle.", "Putting the hypotenuse into a tangent. Tangent uses the two legs only: tan = <span class=\"fq\"><span>opposite<\/span><span>adjacent<\/span><\/span>.", "Multiplying when the unknown is in the denominator. From cos 25° = <span class=\"fq\"><span>12<\/span><span><i>h<\/i><\/span><\/span>, the result is <i>h<\/i> = <span class=\"fq\"><span>12<\/span><span>cos 25°<\/span><\/span>, not 12 cos 25°.", "Leaving the calculator or Desmos in radian mode, which gives values that look reasonable but are wrong.", "Setting <i>a<\/i> = <i>b<\/i> when sin <i>a<\/i>° = cos <i>b<\/i>°. The angles are complementary, so <i>a<\/i> + <i>b<\/i> = 90.", "Measuring an angle of depression from the vertical instead of the horizontal, or forgetting to add the observer's eye height to the height found from the triangle."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C. AC = 12, BC = 5 and AB = 13.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26.00,136.67 274.00,136.67 274.00,33.33\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"265.00,136.67 265.00,127.67 274.00,127.67\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"12.35\" y=\"144.01\" text-anchor=\"middle\">A<\/text><text x=\"286.29\" y=\"27.59\" text-anchor=\"middle\">B<\/text><text x=\"287.77\" y=\"146.90\" text-anchor=\"middle\">C<\/text><text x=\"142.37\" y=\"71.18\" text-anchor=\"middle\">13<\/text><text x=\"288.70\" y=\"89.50\" text-anchor=\"middle\">5<\/text><text x=\"150.00\" y=\"158.67\" text-anchor=\"middle\">12<\/text><\/g><\/svg>In the figure, triangle ABC has a right angle at <i>C<\/i>. What is the value of sin <i>A<\/i>?", "opts": ["<span class=\"fq\"><span>5<\/span><span>13<\/span><\/span>", "<span class=\"fq\"><span>12<\/span><span>13<\/span><\/span>", "<span class=\"fq\"><span>5<\/span><span>12<\/span><\/span>", "<span class=\"fq\"><span>13<\/span><span>5<\/span><\/span>"], "ans": 0, "sol": "From angle <i>A<\/i>, BC = 5 is the opposite side.<br>The hypotenuse is AB = 13.<br>sin <i>A<\/i> = <span class=\"fq\"><span>opposite<\/span><span>hypotenuse<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>13<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>5<\/span><span>13<\/span><\/span><\/b>", "hint": "From angle <i>A<\/i>, which side is across from it, and which side is the longest?"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "In right triangle DEF, angle <i>E<\/i> is the right angle. Which expression is equal to cos <i>D<\/i>?", "opts": ["<span class=\"fq\"><span>EF<\/span><span>DF<\/span><\/span>", "<span class=\"fq\"><span>EF<\/span><span>DE<\/span><\/span>", "<span class=\"fq\"><span>DE<\/span><span>DF<\/span><\/span>", "<span class=\"fq\"><span>DF<\/span><span>DE<\/span><\/span>"], "ans": 2, "sol": "The hypotenuse is DF, across from the right angle at <i>E<\/i>.<br>The leg that forms angle <i>D<\/i> with the hypotenuse is DE, so DE is adjacent.<br>cos <i>D<\/i> = <span class=\"fq\"><span>adjacent<\/span><span>hypotenuse<\/span><\/span> = <span class=\"fq\"><span>DE<\/span><span>DF<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>DE<\/span><span>DF<\/span><\/span><\/b>", "hint": "Cosine uses the adjacent leg. Which leg touches vertex D?"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "In right triangle JKL, angle <i>K<\/i> = 90°, JK = 9, KL = 40 and JL = 41. What is the value of tan <i>L<\/i>?", "ans": ["9/40", ".225", "0.225"], "sol": "From angle <i>L<\/i>, JK = 9 is opposite and KL = 40 is adjacent.<br>tan <i>L<\/i> = <span class=\"fq\"><span>9<\/span><span>40<\/span><\/span> = 0.225.<br>Answer: <b><span class=\"fq\"><span>9<\/span><span>40<\/span><\/span><\/b>", "hint": "Tangent uses only the two legs. Which leg is across from vertex L?"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "In right triangle ABC, angle <i>C<\/i> = 90°, sin <i>A<\/i> = <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span> and AB = 20. What is the length of BC?", "opts": ["15", "12", "16", "<span class=\"fq\"><span>100<\/span><span>3<\/span><\/span>"], "ans": 1, "sol": "AB is the hypotenuse and BC is opposite angle <i>A<\/i>, so sin <i>A<\/i> = <span class=\"fq\"><span>BC<\/span><span>20<\/span><\/span>.<br><span class=\"fq\"><span>BC<\/span><span>20<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>, so BC = <span class=\"fq\"><span>3<\/span><span>5<\/span><\/span> × 20 = 12.<br>Answer: <b>12<\/b>", "hint": "AB is across from the right angle. Write sin <i>A<\/i> using BC and AB."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "In right triangle PQR, angle <i>Q<\/i> = 90°, angle <i>P<\/i> = 40° and PQ = 15. Which of the following is closest to QR?", "opts": ["9.6", "11.5", "17.9", "12.6"], "ans": 3, "sol": "From angle <i>P<\/i>, QR is opposite and PQ is adjacent, so use tangent.<br>tan 40° = <span class=\"fq\"><span>QR<\/span><span>15<\/span><\/span>, so QR = 15 tan 40°.<br>QR ≈ 15(0.8391) ≈ 12.59.<br>Answer: <b>12.6<\/b>", "hint": "Is QR opposite or adjacent to angle P? Is PQ the hypotenuse or a leg?"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "In right triangle XYZ, angle <i>Y<\/i> = 90°, angle <i>X<\/i> = 28° and YZ = 11. What is the length of XZ, to the nearest tenth?", "ans": ["23.4"], "sol": "From angle <i>X<\/i>, YZ is opposite and XZ is the hypotenuse, so sin 28° = <span class=\"fq\"><span>11<\/span><span>XZ<\/span><\/span>.<br>The unknown is in the denominator: XZ = <span class=\"fq\"><span>11<\/span><span>sin 28°<\/span><\/span>.<br>XZ ≈ <span class=\"fq\"><span>11<\/span><span>0.4695<\/span><\/span> ≈ 23.43.<br>Answer: <b>23.4<\/b>", "hint": "The side you want is across from the right angle, so it will end up in the denominator of your ratio."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "Which of the following is equal to sin 25°?", "opts": ["cos 25°", "cos 65°", "sin 65°", "tan 65°"], "ans": 1, "sol": "25° and 65° are complementary because 25 + 65 = 90.<br>sin <i>x<\/i>° = cos(90° − <i>x<\/i>°), so sin 25° = cos 65°.<br>Answer: <b>cos 65°<\/b>", "hint": "Which angle adds to 25° to make 90°? What happens to sine for that angle?"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "In right triangle ABC, angle <i>C<\/i> = 90° and tan <i>A<\/i> = 0.8. What is the value of tan <i>B<\/i>?", "ans": ["1.25", "5/4"], "sol": "The leg opposite <i>A<\/i> is adjacent to <i>B<\/i>, and the leg adjacent to <i>A<\/i> is opposite <i>B<\/i>.<br>So tan <i>B<\/i> = <span class=\"fq\"><span>1<\/span><span>tan <i>A<\/i><\/span><\/span> = <span class=\"fq\"><span>1<\/span><span>0.8<\/span><\/span> = 1.25.<br>Answer: <b>1.25<\/b>", "hint": "Write tan A as a fraction of two legs. What happens to that fraction when you look from angle B?"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Right triangles ABC and DEF are similar, with angle <i>A<\/i> corresponding to angle <i>D<\/i> and right angles at <i>C<\/i> and <i>F<\/i>. In triangle ABC, AC = 8, BC = 6 and AB = 10. Each side of triangle DEF is 2.5 times as long as the corresponding side of triangle ABC. What is the value of cos <i>D<\/i>?", "opts": ["<span class=\"fq\"><span>4<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>8<\/span><span>25<\/span><\/span>"], "ans": 0, "sol": "Corresponding angles of similar triangles are equal, so cos <i>D<\/i> = cos <i>A<\/i>.<br>cos <i>A<\/i> = <span class=\"fq\"><span>AC<\/span><span>AB<\/span><\/span> = <span class=\"fq\"><span>8<\/span><span>10<\/span><\/span> = <span class=\"fq\"><span>4<\/span><span>5<\/span><\/span>.<br>The scale factor 2.5 cancels, so it does not change the ratio.<br>Answer: <b><span class=\"fq\"><span>4<\/span><span>5<\/span><\/span><\/b>", "hint": "Do equal angles have equal cosines? Do you need the new side lengths at all?"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "In a right triangle, <i>B<\/i> is an acute angle and cos <i>B<\/i> = 0.28. What is the value of tan <i>B<\/i>?", "opts": ["<span class=\"fq\"><span>7<\/span><span>24<\/span><\/span>", "<span class=\"fq\"><span>24<\/span><span>25<\/span><\/span>", "<span class=\"fq\"><span>25<\/span><span>7<\/span><\/span>", "<span class=\"fq\"><span>24<\/span><span>7<\/span><\/span>"], "ans": 3, "sol": "0.28 = <span class=\"fq\"><span>28<\/span><span>100<\/span><\/span> = <span class=\"fq\"><span>7<\/span><span>25<\/span><\/span>, so label the adjacent leg 7 and the hypotenuse 25.<br>Opposite leg: √(25<sup>2<\/sup> − 7<sup>2<\/sup>) = √576 = 24.<br>tan <i>B<\/i> = <span class=\"fq\"><span>opposite<\/span><span>adjacent<\/span><\/span> = <span class=\"fq\"><span>24<\/span><span>7<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>24<\/span><span>7<\/span><\/span><\/b>", "hint": "Write 0.28 as a fraction in lowest terms, then use the Pythagorean theorem for the missing leg."}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 230 260\" role=\"img\" aria-label=\"A ladder 6 meters long leans against a vertical wall. The ladder makes a 70 degree angle with the level ground. The height on the wall where the ladder touches it is labeled h.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"84.24,234.00 148.91,234.00 148.91,56.31\"/><line class=\"fg-edge\" x1=\"52.72\" y1=\"234.00\" x2=\"177.28\" y2=\"234.00\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-edge\" x1=\"148.91\" y1=\"234.00\" x2=\"148.91\" y2=\"26.00\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-e pan>0.2493<\/span><\/span> ≈ 128.3.<br>Answer: <b>128<\/b>", "hint": "Move the 14° angle down to the boat, where it is an angle of elevation. Which ratio links the height and the horizontal distance?"}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 270 190\" role=\"img\" aria-label=\"Triangle OAB in the xy-plane with vertices O at the origin, A at (15, 0) and B at (15, 8). Side AB is vertical.\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"14.00\" y1=\"167.60\" x2=\"14.00\" y2=\"22.40\"/><line x1=\"26.10\" y1=\"167.60\" x2=\"26.10\" y2=\"22.40\"/><line x1=\"38.20\" y1=\"167.60\" x2=\"38.20\" y2=\"22.40\"/><line x1=\"50.30\" y1=\"167.60\" x2=\"50.30\" y2=\"22.40\"/><line x1=\"62.40\" y1=\"167.60\" x2=\"62.40\" y2=\"22.40\"/><line x1=\"74.50\" y1=\"167.60\" x2=\"74.50\" y2=\"22.40\"/><line x1=\"86.60\" y1=\"167.60\" x2=\"86.60\" y2=\"22.40\"/><line x1=\"98.70\" y1=\"167.60\" x2=\"98.70\" y2=\"22.40\"/><line x1=\"110.80\" y1=\"167.60\" x2=\"110.80\" y2=\"22.40\"/><line x1=\"122.90\" y1=\"167.60\" x2=\"122.90\" y2=\"22.40\"/><line x1=\"135.00\" y1=\"167.60\" x2=\"135.00\" y2=\"22.40\"/><line x1=\"147.10\" y1=\"167.60\" x2=\"147.10\" y2=\"22.40\"/><line x1=\"159.20\" y1=\"167.60\" x2=\"159.20\" y2=\"22.40\"/><line x1=\"171.30\" y1=\"167.60\" x2=\"171.30\" y2=\"22.40\"/><line x1=\"183.40\" y1=\"167.60\" x2=\"183.40\" y2=\"22.40\"/><line x1=\"195.50\" y1=\"167.60\" x2=\"195.50\" y2=\"22.40\"/><line x1=\"207.60\" y1=\"167.60\" x2=\"207.60\" y2=\"22.40\"/><line x1=\"219.70\" y1=\"167.60\" x2=\"219.70\" y2=\"22.40\"/><line x1=\"231.80\" y1=\"167.60\" x2=\"231.80\" y2=\"22.40\"/><line x1=\"243.90\" y1=\"167.60\" x2=\"243.90\" y2=\"22.40\"/><line x1=\"256.00\" y1=\"167.60\" x2=\"256.00\" y2=\"22.40\"/><line x1=\"14.00\" y1=\"167.60\" x2=\"256.00\" y2=\"167.60\"/><line x1=\"14.00\" y1=\"155.50\" x2=\"256.00\" y2=\"155.50\"/><line x1=\"14.00\" y1=\"143.40\" x2=\"256.00\" y2=\"143.4 tices O(0, 0), A(15, 0) and B(15, 8). What is the value of sin(∠AOB)?", "opts": ["<span class=\"fq\"><span>15<\/span><span>17<\/span><\/span>", "<span class=\"fq\"><span>8<\/span><span>17<\/span><\/span>", "<span class=\"fq\"><span>8<\/span><span>15<\/span><\/span>", "<span class=\"fq\"><span>17<\/span><span>8<\/span><\/span>"], "ans": 1, "sol": "The triangle has a right angle at A, with legs OA = 15 and AB = 8.<br>Hypotenuse: OB = √(15<sup>2<\/sup> + 8<sup>2<\/sup>) = √289 = 17.<br>From angle AOB, AB is opposite, so sin(∠AOB) = <span class=\"fq\"><span>8<\/span><span>17<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>8<\/span><span>17<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "In right triangle RST, angle <i>S<\/i> = 90°, RS = 11, ST = 60 and RT = 61. Which angle of the triangle has a cosine of <span class=\"fq\"><span>60<\/span><span>61<\/span><\/span>?", "opts": ["Angle <i>R<\/i>", "Angle <i>S<\/i>", "No angle of the triangle", "Angle <i>T<\/i>"], "ans": 3, "sol": "The hypotenuse is RT = 61, so the cosine must use the leg 60 as the adjacent side.<br>ST = 60 touches vertex T, so it is adjacent to angle <i>T<\/i>.<br>cos <i>T<\/i> = <span class=\"fq\"><span>ST<\/span><span>RT<\/span><\/span> = <span class=\"fq\"><span>60<\/span><span>61<\/span><\/span>. (cos <i>R<\/i> = <span class=\"fq\"><span>11<\/span><span>61<\/span><\/span>.)<br>Answer: <b>Angle <i>T<\/i><\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "In right triangle ABC, angle <i>C<\/i> = 90° and sin <i>A<\/i> = 0.38. What is the value of cos <i>B<\/i>?", "opts": ["0.38", "0.62", "0.92", "2.63"], "ans": 0, "sol": "Angles <i>A<\/i> and <i>B<\/i> are complementary.<br>The side opposite <i>A<\/i> is adjacent to <i>B<\/i>, so cos <i>B<\/i> = sin <i>A<\/i>.<br>cos <i>B<\/i> = 0.38.<br>Answer: <b>0.38<\/b>"}, {"lo": "LO2", "diff": "E", "type": "spr", "q": "In right triangle ABC, angle <i>C<\/i> = 90°, cos <i>B<\/i> = 0.6 and BC = 9. What is the length of AB?", "ans": ["15"], "sol": "From angle <i>B<\/i>, BC is adjacent and AB is the hypotenuse, so cos <i>B<\/i> = <span class=\"fq\"><span>9<\/span><span>AB<\/span><\/span>.<br><span class=\"fq\"><span>9<\/span><span>AB<\/span><\/span> = 0.6, so AB = <span class=\"fq\"><span>9<\/span><span>0.6<\/span><\/span> = 15.<br>Answer: <b>15<\/b>"}, {"lo": "LO4", "diff": "E", "type": "mcq", "q": "Each side length of right triangle PQR is multiplied by 3 to form right triangle P′Q′R′, where angle <i>P<\/i>′ corresponds to angle <i>P<\/i>. If cos <i>P<\/i> = 0.96, what is the value of cos <i>P<\/i>′?", "opts": ["0.28", "0.32", "0.96", "2.88"], "ans": 2, "sol": "Multiplying every side by 3 gives a similar triangle with the same angles.<br>The factor 3 cancels in the ratio <span class=\"fq\"><span>adjacent<\/span><span>hypotenuse<\/span><\/span>.<br>cos <i>P<\/i>′ = cos <i>P<\/i> = 0.96.<br>Answer: <b>0.96<\/b>"}, {"lo": "LO5", "diff": "E", "type": "mcq", "q": "A wheelchair ramp is 4 meters long and rises 0.5 meter from the level ground to a doorway. The ramp makes an angle <i>θ<\/i> with the ground. Which equation is true?", "opts": ["cos <i>θ<\/i> = <span class=\"fq\"><span>0.5<\/span><span>4<\/span><\/span>", "tan <i>θ<\/i> = <span class=\"fq\"><span>0.5<\/span><span>4<\/span><\/span>", "sin <i>θ<\/i> = <span class=\"fq\"><span>0.5<\/span><span>4<\/span><\/span>", "sin <i>θ<\/i> = <span class=\"fq\"><span>4<\/span><span>0.5<\/span><\/span>"], "ans": 2, "sol": "The 4 m ramp surface is the hypotenuse.<br>The 0.5 m rise is opposite the angle <i>θ<\/i>.<br>sin <i>θ<\/i> = <span class=\"fq\"><span>opposite<\/span><span>hypotenuse<\/span><\/span> = <span class=\"fq\"><span>0.5<\/span><span>4<\/span><\/span>.<br>Answer: <b>sin <i>θ<\/i> = <span class=\"fq\"><span>0.5<\/span><span>4<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "In right triangle ABC, angle <i>B<\/i> = 90°, AB = 9 and AC = 15. What is the value of tan <i>C<\/i>?", "opts": ["<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>", "<span class=\"fq\"><span>3<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>5<\/span><\/span>", "<span class=\"fq\"><span>4<\/span><span>3<\/span><\/span>"], "ans": 0, "sol": "AC is the hypotenuse. The other leg is BC = √(15<sup>2<\/sup> − 9<sup>2<\/sup>) = √144 = 12.<br>From angle <i>C<\/i>, AB = 9 is opposite and BC = 12 is adjacent.<br>tan <i>C<\/i> = <span class=\"fq\"><span>9<\/span><span>12<\/span><\/span> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C. Angle A is 33 degrees, hypotenuse AB is 14 and leg AC is labeled x.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"39.13,170.00 260.87,170.00 260.87,26.00\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"251.87,170.00 251.87,161.00 260.87,161.00\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"65.13,170.00 65.11,169.06 65.06,168.13 64.98,167.20 64.86,166.27 64.71,165.35 64.53,164.43 64.31,163.52 64.06,162.62 63.78,161.72 63.46,160.84 63.12,159.97 62.74,159.11 62.33,158.27 61.90,157.44 61.43,156.63 60.94,155.84\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"81.32\" y=\"162.00\" text-anchor=\"middle\">33°<\/text><text x=\"25.31\" y=\"178.99\" text-anchor=\"middle\">A<\/text><text x=\"270.88\" y=\"17.50\" text-anchor=\"middle\">B<\/text><text x=\"273.99\" y=\"183.02\" text-anchor=\"middle\">C<\/text><text x=\"138.84\" y=\"85.32\" text-anchor=\"middle\">14<\/text><text x=\"150.00\" y=\"192.00\" text-anchor=\"middle\" font-style=\"italic\">x<\/text><\/g><\/svg>In the right triangle shown, which expression represents the value of <i>x<\/i>?", "opts": ["14 sin 33°", "14 tan 33°", "<span class=\"fq\"><span>14<\/span><span>cos 33°<\/span><\/span>", "14 cos 33°"], "ans": 3, "sol": "The side of length 14 is the hypotenuse, and <i>x<\/i> is adjacent to the 33° angle.<br>cos 33° = <span class=\"fq\"><span><i>x<\/i><\/span><span>14<\/span><\/span>.<br>Multiply both sides by 14: <i>x<\/i> = 14 cos 33°.<br>Answer: <b>14 cos 33°<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "If sin <i>a<\/i>° = cos <i>b<\/i>°, where 0 &lt; <i>a<\/i> &lt; 90 and 0 &lt; <i>b<\/i> &lt; 90, which of the following must be true?", "opts": ["<i>a<\/i> = <i>b<\/i>", "<i>a<\/i> + <i>b<\/i> = 90", "<i>a<\/i> − <i>b<\/i> = 90", "<i>a<\/i> + <i>b<\/i> = 180"], "ans": 1, "sol": "For acute angles, sin <i>a<\/i>° = cos(90 − <i>a<\/i>)°.<br>So cos(90 − <i>a<\/i>)° = cos <i>b<\/i>°, and since both are acute, <i>b<\/i> = 90 − <i>a<\/i>.<br>Therefore <i>a<\/i> + <i>b<\/i> = 90.<br>Answer: <b><i>a<\/i> + <i>b<\/i> = 90<\/b>"}, {"lo": "LO5", "diff": "M", "type": "spr", "q": "A tree casts a shadow 18 meters long on level ground when the angle of elevation of the sun is 40°. What is the height of the tree, in meters, to the nearest tenth?", "ans": ["15.1"], "sol": "The tree and its shadow are the legs; the angle of elevation is at the tip of the shadow.<br>From that angle, the height is opposite and the shadow is adjacent: tan 40° = <span class=\"fq\"><span><i>h<\/i><\/span><span>18<\/span><\/span>.<br><i>h<\/i> = 18 tan 40° ≈ 18(0.8391) ≈ 15.10.<br>Answer: <b>15.1<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "In right triangle ABC, angle <i>C<\/i> = 90°, sin <i>A<\/i> = <span class=\"fq\"><span>12<\/span><span>13<\/span><\/span> and AC = 15. What is the length of AB?", "ans": ["39"], "sol": "sin <i>A<\/i> = <span class=\"fq\"><span>12<\/span><span>13<\/span><\/span>: label the opposite leg 12 and the hypotenuse 13, so the adjacent leg is √(13<sup>2<\/sup> − 12<sup>2<\/sup>) = 5 and cos <i>A<\/i> = <span class=\"fq\"><span>5<\/span><span>13<\/span><\/span>.<br>AC is adjacent to <i>A<\/i> and AB is the hypotenuse: <span class=\"fq\"><span>15<\/span><span>AB<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>13<\/span><\/span>.<br>AB = <span class=\"fq\"><span>15 × 13<\/span><span>5<\/span><\/span> = 39.<br>Answer: <b>39<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "A straight zip line is 50 meters long and makes a 20° angle with the horizontal. Which of the following is closest to the horizontal distance, in meters, covered by the zip line?", "opts": ["47.0", "17.1", "18.2", "53.2"], "ans": 0, "sol": "The zip line is the hypotenuse, and the horizontal distance is adjacent to the 20° angle.<br>cos 20° = <span class=\"fq\"><span><i>d<\/i><\/span><span>50<\/span><\/span>, so <i>d<\/i> = 50 cos 20°.<br><i>d<\/i> ≈ 50(0.9397) ≈ 46.98.<br>Answer: <b>47.0<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "In right triangle KLM, angle <i>L<\/i> = 90°, KL = 10 and LM = 24. What is the value of sin <i>K<\/i> + cos <i>K<\/i>?", "opts": ["1", "<span class=\"fq\"><span>7<\/span><span>13<\/span><\/span>", "<span class=\"fq\"><span>17<\/span><span>13<\/span><\/span>", "<span class=\"fq\"><span>17<\/span><span>12<\/span><\/span>"], "ans": 2, "sol": "Hypotenuse: KM = √(10<sup>2<\/sup> + 24<sup>2<\/sup>) = √676 = 26.<br>sin <i>K<\/i> = <span class=\"fq\"><span>24<\/span><span>26<\/span><\/span> and cos <i>K<\/i> = <span class=\"fq\"><span>10<\/span><span>26<\/span><\/span>.<br>Sum: <span class=\"fq\"><span>34<\/span><span>26<\/span><\/span> = <span class=\"fq\"><span>17<\/span><span>13<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>17<\/span><span>13<\/span><\/span><\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "In right triangle DEF, angle <i>E<\/i> = 90°, DE = 28, EF = 45 and DF = 53. What is the value of cos(90° − <i>D<\/i>)?", "opts": ["<span class=\"fq\"><span>28<\/span><span>53<\/span><\/span>", "<span class=\"fq\"><span>45<\/span><span>53<\/span><\/span>", "<span class=\"fq\"><span>28<\/span><span>45<\/span><\/span>", "<span class=\"fq\"><span>45<\/span><span>28<\/span><\/span>"], "ans": 1, "sol": "cos(90° − <i>D<\/i>) = sin <i>D<\/i>, because 90° − <i>D<\/i> is the other acute angle, <i>F<\/i>.<br>From angle <i>D<\/i>, EF = 45 is opposite and DF = 53 is the hypotenuse.<br>sin <i>D<\/i> = <span class=\"fq\"><span>45<\/span><span>53<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>45<\/span><span>53<\/span><\/span><\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "Mira holds a kite string 1.2 meters above the ground. The string is 60 meters long, is pulled straight, and makes a 50° angle with the horizontal. Which of the following is closest to the height of the kite above the ground, in meters?", "opts": ["39.8", "46.0", "72.7", "47.2"], "ans": 3, "sol": "The string is the hypotenuse; the rise above Mira's hand is opposite the 50° angle.<br>Rise = 60 sin 50° ≈ 60(0.7660) ≈ 45.96 m.<br>Add the hand height: 45.96 + 1.2 ≈ 47.16 m.<br>Answer: <b>47.2<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 320 170\" role=\"img\" aria-label=\"Triangular roof frame. Two slanted rafters, each 10 feet long, meet at the top. Each rafter makes a 40 degree angle with the horizontal beam at the bottom, whose length is labeled w.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26.00,141.22 294.00,141.22 160.00,28.78\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"52.00,141.22 51.98,140.09 51.90,138.95 51.78,137.83 51.61,136.70 51.38,135.59 51.11,134.49 50.80,133.40 50.43,132.33 50.02,131.27 49.56,130.23 49.06,129.21 48.52,128.22 47.93,127.25 47.30,126.31 46.63,125.39 45.92,124.51\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"268.00,141.22 268.02,140.09 268.10,138.95 268.22,137.83 268.39,136.70 268.62,135.59 268.89,134.49 269.20,133.40 269.57,132.33 269.98,131.27 270.44,130.23 270.94,129.21 271.48,128.22 272.07,127.25 272.70,126.31 273.37,125.39 274.08,124.51\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"65.47\" y=\"131.35\" text-anchor=\"middle\">40°<\/text><text x=\"254.53\" y=\"131.35\" text-anchor=\"middle\">40°<\/text><text x=\"75.08\" y=\"68.15\" text-anchor=\"middle\">10 ft<\/text><text x=\"244.92\" y=\"68.15\" text-anchor=\"middle\">10 ft<\/text><text x=\"160.00\" y=\"163.22\" text-anchor=\"middle\" font-style=\"italic\">w<\/text><\/g><\/svg>The figure shows the triangular frame of a roof. The two slanted rafters are each 10 feet long, and each makes a 40° angle with the horizontal beam at the bottom. Which of the following is closest to <i>w<\/i>, the length of the beam, in feet?", "opts": ["7.7", "12.9", "26.1", "15.3"], "ans": 3, "sol": "The height from the top to the beam splits the frame into two congruent right triangles, each with hypotenuse 10.<br>In each, half the beam is adjacent to the 40° angle: <span class=\"fq\"><span><i>w<\/i><\/span><span>2<\/span><\/span> = 10 cos 40° ≈ 7.66.<br><i>w<\/i> ≈ 2(7.66) ≈ 15.32.<br>Answer: <b>15.3<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "For an acute angle <i>x<\/i>, sin <i>x<\/i> = <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>. What is the value of cos <i>x<\/i>?", "opts": ["<span class=\"fq\"><span>1<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>√5<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>√13<\/span><span>3<\/span><\/span>", "<span class=\"fq\"><span>2<\/span><span>√5<\/span><\/span>"], "ans": 1, "sol": "Label the opposite leg 2 and the hypotenuse 3.<br>Adjacent leg: √(3<sup>2<\/sup> − 2<sup>2<\/sup>) = √5.<br>cos <i>x<\/i> = <span class=\"fq\"><span>adjacent<\/span><span>hypotenuse<\/span><\/span> = <span class=\"fq\"><span>√5<\/span><span>3<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>√5<\/span><span>3<\/span><\/span><\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "In right triangle ABC, angle <i>C<\/i> = 90°, sin <i>A<\/i> = <span class=\"fq\"><span>20<\/span><span>29<\/span><\/span> and AB = 58. What is the perimeter of triangle ABC?", "ans": ["140"], "sol": "AB = 58 is the hypotenuse, and 58 = 2 × 29, so the scale factor is 2.<br>BC = 2 × 20 = 40. The adjacent leg for the 20-21-29 triple is 21, so AC = 2 × 21 = 42.<br>Perimeter = 40 + 42 + 58 = 140.<br>Answer: <b>140<\/b>"}, {"lo": "LO5", "diff": "H", "type": "spr", "q": "An airplane descends in a straight line at a constant angle of 3° below the horizontal, from an altitude of 1,200 meters until it touches down on the runway. What is the horizontal distance it travels during the descent, in kilometers, to the nearest tenth?", "ans": ["22.9"], "sol": "The altitude 1,200 m is opposite the 3° angle and the horizontal distance <i>d<\/i> is adjacent.<br>tan 3° = <span class=\"fq\"><span>1200<\/span><span><i>d<\/i><\/span><\/span>, so <i>d<\/i> = <span class=\"fq\"><span>1200<\/span><span>tan 3°<\/span><\/span> ≈ 22,897 m.<br>In kilometers: 22,897 ÷ 1,000 ≈ 22.9.<br>Answer: <b>22.9<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "In right triangle ABC, angle <i>C<\/i> = 90°. If tan <i>A<\/i> = 4 tan <i>B<\/i>, what is the value of tan <i>A<\/i>?", "opts": ["2", "<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>", "4", "16"], "ans": 0, "sol": "The acute angles are complementary, so tan <i>B<\/i> = <span class=\"fq\"><span>1<\/span><span>tan <i>A<\/i><\/span><\/span>.<br>tan <i>A<\/i> = <span class=\"fq\"><span>4<\/span><span>tan <i>A<\/i><\/span><\/span>, so tan<sup>2<\/sup> <i>A<\/i> = 4.<br>tan <i>A<\/i> is positive for an acute angle, so tan <i>A<\/i> = 2.<br>Answer: <b>2<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "In right triangle XYZ, angle <i>Z<\/i> = 90°. Which of the following is equal to <span class=\"fq\"><span>XZ<\/span><span>XY<\/span><\/span>?", "opts": ["sin <i>X<\/i>", "cos <i>Y<\/i>", "sin <i>Y<\/i>", "tan <i>X<\/i>"], "ans": 2, "sol": "XY is the hypotenuse, across from the right angle at <i>Z<\/i>.<br>XZ touches X, so it is adjacent to <i>X<\/i> and opposite <i>Y<\/i>.<br><span class=\"fq\"><span>XZ<\/span><span>XY<\/span><\/span> = cos <i>X<\/i> = sin <i>Y<\/i>; of the choices, only sin <i>Y<\/i> appears.<br>Answer: <b>sin <i>Y<\/i><\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "In right triangle ABC, angle <i>C<\/i> = 90°, tan <i>B<\/i> = 2.4 and AC = 60. What is the length of BC?", "opts": ["25", "<span class=\"fq\"><span>300<\/span><span>13<\/span><\/span>", "65", "144"], "ans": 0, "sol": "From angle <i>B<\/i>, AC is opposite and BC is adjacent: tan <i>B<\/i> = <span class=\"fq\"><span>60<\/span><span>BC<\/span><\/span>.<br><span class=\"fq\"><span>60<\/span><span>BC<\/span><\/span> = 2.4, so BC = <span class=\"fq\"><span>60<\/span><span>2.4<\/span><\/span> = 25.<br>Answer: <b>25<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "The table gives approximate values of sin <i>x<\/i>° for several angle measures.<div class=\"tscroll\"><table class=\"dtab\"><tr><th><i>x<\/i><\/th><td>20<\/td><td>35<\/td><td>55<\/td><td>70<\/td><\/tr><tr><th>sin <i>x<\/i>°<\/th><td>0.342<\/td><td>0.574<\/td><td>0.819<\/td><td>0.940<\/td><\/tr><\/table><\/div>Based on the table, which of the following is closest to cos 35°?", "opts": ["0.426", "0.574", "0.940", "0.819"], "ans": 3, "sol": "35° and 55° are complementary.<br>cos 35° = sin(90° − 35°) = sin 55°.<br>From the table, sin 55° ≈ 0.819.<br>Answer: <b>0.819<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 320 170\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C. Point D is on side AC and point E is on side AB, with segment DE perpendicular to AC.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26.00,140.83 294.00,140.83 294.00,29.17\"/><line class=\"fg-edge\" x1=\"133.20\" y1=\"140.83\" x2=\"133.20\" y2=\"96.17\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"285.00,140.83 285.00,131.83 294.00,131.83\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"124.20,140.83 124.20,131.83 133.20,131.83\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"12.35\" y=\"148.18\" text-anchor=\"middle\">A<\/text><text x=\"306.29\" y=\"23.42\" text-anchor=\"middle\">B<\/text><text x=\"307.77\" y=\"151.07\" text-anchor=\"middle\">C<\/text><text x=\"133.20\" y=\"85.17\" text-anchor=\"middle\">E<\/text><text x=\"133.20\" y=\"159.33\" text-anchor=\"middle\">D<\/text><\/g><\/svg>In the figure, D lies on AC, E lies on AB, and DE and BC are each perpendicular to AC. If AD = 12, DE = 5 and AC = 30, what is the length of BC?", "opts": ["7.5", "12.5", "23", "72"], "ans": 1, "sol": "Right triangles ADE and ACB share angle <i>A<\/i>, so tan <i>A<\/i> is the same in both.<br>In triangle ADE: tan <i>A<\/i> = <span class=\"fq\"><span>5<\/span><span>12<\/span><\/span>.<br>In triangle ACB: <span class=\"fq\"><span>BC<\/span><span>30<\/span><\/span> = <span class=\"fq\"><span>5<\/span><span>12<\/span><\/span>, so BC = <span class=\"fq\"><span>150<\/span><span>12<\/span><\/span> = 12.5.<br>Answer: <b>12.5<\/b>"}, {"lo": "LO5", "diff": "M", "type": "mcq", "q": "A drone hovers 85 meters above level ground. The angle of depression from the drone to a parked car is 34°. Which of the following is closest to the straight-line distance, in meters, from the drone to the car?", "opts": ["152", "57", "103", "126"], "ans": 0, "sol": "The angle of elevation from the car to the drone is also 34°.<br>The 85 m height is opposite that angle, and the line of sight <i>L<\/i> is the hypotenuse: sin 34° = <span class=\"fq\"><span>85<\/span><span><i>L<\/i><\/span><\/span>.<br><i>L<\/i> = <span class=\"fq\"><span>85<\/span><span>sin 34°<\/span><\/span> ≈ <span class=\"fq\"><span>85<\/span><span>0.5592<\/span><\/span> ≈ 152.0.<br>Answer: <b>152<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "In right triangle PQR, angle <i>R<\/i> = 90°, angle <i>P<\/i> = 61° and PR = 8. Which of the following is closest to PQ?", "opts": ["3.9", "9.1", "14.4", "16.5"], "ans": 3, "sol": "From angle <i>P<\/i>, PR is adjacent and PQ is the hypotenuse: cos 61° = <span class=\"fq\"><span>8<\/span><span>PQ<\/span><\/span>.<br>PQ = <span class=\"fq\"><span>8<\/span><span>cos 61°<\/span><\/span> ≈ <span class=\"fq\"><span>8<\/span><span>0.4848<\/span><\/span> ≈ 16.50.<br>Answer: <b>16.5<\/b>"}, {"lo": "LO1", "diff": "H", "type": "mcq", "q": "<svg class=\"fig\" viewBox=\"0 0 300 180\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C and side AB along the bottom. Segment CD is drawn from C perpendicular to AB, with D on AB between A and B.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"26.00,149.52 274.00,149.52 184.72,30.48\"/><line class=\"fg-edge\" x1=\"184.72\" y1=\"30.48\" x2=\"184.72\" y2=\"149.52\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"176.72,36.48 182.72,44.48 190.72,38.48\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"192.72,149.52 192.72,141.52 184.72,141.52\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"12.20\" y=\"158.06\" text-anchor=\"middle\">A<\/text><text x=\"287.82\" y=\"158.90\" text-anchor=\"middle\">B<\/text><text x=\"189.28\" y=\"19.36\" text-anchor=\"middle\">C<\/text><text x=\"184.72\" y=\"168.02\" text-anchor=\"middle\">D<\/text><\/g><\/svg>In the figure, triangle ABC has a right angle at <i>C<\/i>, and CD is perpendicular to AB. Which of the following is NOT equal to sin <i>A<\/i>?", "opts": ["<span class=\"fq\"><span>BC<\/span><span>AB<\/span><\/span>", "<span class=\"fq\"><span>AD<\/span><span>AC<\/span><\/span>", "<span class=\"fq\"><span>CD<\/span><span>AC<\/span><\/span>", "<span class=\"fq\"><span>BD<\/span><span>BC<\/span><\/span>"], "ans": 1, "sol": "In triangle ABC: sin <i>A<\/i> = <span class=\"fq\"><span>BC<\/span><span>AB<\/span><\/span>. In right triangle ADC: sin <i>A<\/i> = <span class=\"fq\"><span>CD<\/span><span>AC<\/span><\/span>.<br>Angle BCD = 90° − ∠<i>B<\/i> = ∠<i>A<\/i>, so in right triangle BDC: sin <i>A<\/i> = sin(∠BCD) = <span class=\"fq\"><span>BD<\/span><span>BC<\/span><\/span>.<br>In triangle ADC, AD is adjacent to <i>A<\/i>, so <span class=\"fq\"><span>AD<\/span><span>AC<\/span><\/span> = cos <i>A<\/i>, not sin <i>A<\/i>.<br>Answer: <b><span class=\"fq\"><span>AD<\/span><span>AC<\/span><\/span><\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "In right triangle PQR, angle <i>Q<\/i> = 90°, PQ = 20, and the hypotenuse PR is 8 units longer than QR. What is the value of sin <i>P<\/i>?", "ans": ["21/29", ".7241", "0.724"], "sol": "Let QR = <i>a<\/i>, so PR = <i>a<\/i> + 8 and 20<sup>2<\/sup> + <i>a<\/i><sup>2<\/sup> = (<i>a<\/i> + 8)<sup>2<\/sup>.<br>400 = 16<i>a<\/i> + 64, so <i>a<\/i> = 21 and PR = 29.<br>sin <i>P<\/i> = <span class=\"fq\"><span>QR<\/span><span>PR<\/span><\/span> = <span class=\"fq\"><span>21<\/span><span>29<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>21<\/span><span>29<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "A garden bed is shaped like a right triangle. Its longest side is 10 meters, and one of its acute angles measures 35°. Which of the following is closest to the area of the garden bed, in square meters?", "opts": ["28.7", "35.0", "23.5", "47.0"], "ans": 2, "sol": "The 10 m side is the hypotenuse. The legs are 10 sin 35° ≈ 5.736 and 10 cos 35° ≈ 8.192.<br>The legs are the base and height: area = <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>(5.736)(8.192).<br>Area ≈ 23.49.<br>Answer: <b>23.5<\/b>"}, {"lo": "LO2", "diff": "H", "type": "spr", "q": "In right triangle ABC, angle <i>C<\/i> = 90°, angle <i>A<\/i> = 27° and BC = 10. What is the perimeter of triangle ABC, to the nearest whole number?", "ans": ["52"], "sol": "BC is opposite <i>A<\/i>. AC = <span class=\"fq\"><span>10<\/span><span>tan 27°<\/span><\/span> ≈ 19.626 and AB = <span class=\"fq\"><span>10<\/span><span>sin 27°<\/span><\/span> ≈ 22.027.<br>Perimeter ≈ 10 + 19.626 + 22.027 ≈ 51.65.<br>To the nearest whole number: 52.<br>Answer: <b>52<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "In right triangle ABC, angle <i>C<\/i> = 90°, sin <i>A<\/i> = 2<i>m<\/i> − 0.3 and cos <i>B<\/i> = 0.5<i>m<\/i> + 0.6. What is the value of <i>m<\/i>?", "opts": ["0.28", "0.6", "0.36", "1.8"], "ans": 1, "sol": "sin <i>A<\/i> = cos <i>B<\/i> because <i>A<\/i> and <i>B<\/i> are complementary.<br>2<i>m<\/i> − 0.3 = 0.5<i>m<\/i> + 0.6, so 1.5<i>m<\/i> = 0.9.<br><i>m<\/i> = 0.6. (Check: sin <i>A<\/i> = 0.9, a valid value.)<br>Answer: <b>0.6<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "Angles with measures <i>x<\/i>° and <i>y<\/i>° are acute, and sin <i>x<\/i>° = cos <i>y<\/i>°. If <i>x<\/i> − <i>y<\/i> = 24, what is the value of <i>x<\/i>?", "opts": ["33", "45", "57", "66"], "ans": 2, "sol": "Since the angles are acute, sin <i>x<\/i>° = cos <i>y<\/i>° means <i>x<\/i> + <i>y<\/i> = 90.<br>Add the equations <i>x<\/i> + <i>y<\/i> = 90 and <i>x<\/i> − <i>y<\/i> = 24: 2<i>x<\/i> = 114.<br><i>x<\/i> = 57 (and <i>y<\/i> = 33).<br>Answer: <b>57<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "An escalator in a shopping mall is 13 meters long from bottom to top. The angle <i>θ<\/i> that it makes with the level floor satisfies tan <i>θ<\/i> = <span class=\"fq\"><span>33<\/span><span>56<\/span><\/span>. How many meters does the escalator rise vertically?", "opts": ["6.6", "7.7", "11.2", "22.1"], "ans": 0, "sol": "Legs 33 and 56 give hypotenuse √(33<sup>2<\/sup> + 56<sup>2<\/sup>) = √4225 = 65, so sin <i>θ<\/i> = <span class=\"fq\"><span>33<\/span><span>65<\/span><\/span>.<br>The 13 m escalator is the hypotenuse and the rise is opposite <i>θ<\/i>: rise = 13 sin <i>θ<\/i>.<br>Rise = 13 × <span class=\"fq\"><span>33<\/span><span>65<\/span><\/span> = <span class=\"fq\"><span>33<\/span><span>5<\/span><\/span> = 6.6.<br>Answer: <b>6.6<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "Right triangles PQR and STU are similar, with <i>P<\/i>, <i>Q<\/i> and <i>R<\/i> corresponding to <i>S<\/i>, <i>T<\/i> and <i>U<\/i>, respectively. Angle <i>Q<\/i> is a right angle, PQ = 12 and QR = 35. What is the value of sin <i>U<\/i>?", "ans": ["12/37", ".3243", "0.324"], "sol": "Angle <i>U<\/i> corresponds to angle <i>R<\/i>, so sin <i>U<\/i> = sin <i>R<\/i>.<br>Hypotenuse: PR = √(12<sup>2<\/sup> + 35<sup>2<\/sup>) = √1369 = 37.<br>sin <i>R<\/i> = <span class=\"fq\"><span>PQ<\/span><span>PR<\/span><\/span> = <span class=\"fq\"><span>12<\/span><span>37<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span>12<\/span><span>37<\/span><\/span><\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "From the top of a cliff 60 meters above the sea, the angles of depression to two boats are 40° and 25°. The boats and the base of the cliff lie on the same straight line, with both boats on the same side of the cliff. Which of the following is closest to the distance, in meters, between the two boats?", "opts": ["22.4", "48.6", "223.9", "57.2"], "ans": 3, "sol": "Each angle of depression equals the angle of elevation at that boat, and the 60 m height is opposite it.<br>Distances from the base: <span class=\"fq\"><span>60<\/span><span>tan 40°<\/span><\/span> ≈ 71.51 m and <span class=\"fq\"><span>60<\/span><span>tan 25°<\/span><\/span> ≈ 128.67 m.<br>Distance between the boats ≈ 128.67 − 71.51 ≈ 57.16 m.<br>Answer: <b>57.2<\/b>"}, {"lo": "LO5", "diff": "H", "type": "mcq", "q": "A straight guy wire runs from a point 9 meters up a vertical pole to an anchor on level ground 4 meters from the base of the pole. The wire makes an angle <i>θ<\/i> with the ground. Which of the following is closest to cos <i>θ<\/i>?", "opts": ["0.44", "0.91", "2.25", "0.41"], "ans": 3, "sol": "The wire is the hypotenuse: √(9<sup>2<\/sup> + 4<sup>2<\/sup>) = √97 ≈ 9.849 m.<br>The 4 m ground distance is adjacent to <i>θ<\/i>.<br>cos <i>θ<\/i> = <span class=\"fq\"><span>4<\/span><span>√97<\/span><\/span> ≈ 0.406.<br>Answer: <b>0.41<\/b>"}, {"lo": "LO5", "diff": "X", "type": "spr", "q": "From point P on level ground, the angle of elevation to the top of a tower is 25°. From point Q, which is 40 meters closer to the tower along the same straight line, the angle of elevation is 40°. What is the height of the tower, in meters, to the nearest whole number?", "ans": ["42"], "sol": "Let <i>h<\/i> be the height and <i>d<\/i> the distance from Q to the base: <i>h<\/i> = <i>d<\/i> tan 40° and <i>h<\/i> = (<i>d<\/i> + 40) tan 25°.<br>Set them equal: <i>d<\/i>(tan 40° − tan 25°) = 40 tan 25°, so <i>d<\/i> = <span class=\"fq\"><span>40 tan 25°<\/span><span>tan 40° − tan 25°<\/span><\/span> ≈ 50.03.<br><i>h<\/i> ≈ 50.03 tan 40° ≈ 41.98, so about 42 m.<br>Answer: <b>42<\/b>"}, {"lo": "LO4", "diff": "X", "type": "mcq", "q": "For an acute angle <i>x<\/i>, sin <i>x<\/i> = <i>k<\/i>, where 0 &lt; <i>k<\/i> &lt; 1. Which expression is equal to tan <i>x<\/i>?", "opts": ["<span class=\"fq\"><span><i>k<\/i><\/span><span>√(1 − <i>k<\/i><sup>2<\/sup>)<\/span><\/span>", "<span class=\"fq\"><span>√(1 − <i>k<\/i><sup>2<\/sup>)<\/span><span><i>k<\/i><\/span><\/span>", "<span class=\"fq\"><span><i>k<\/i><\/span><span>1 − <i>k<\/i><\/span><\/span>", "<span class=\"fq\"><span>1<\/span><span>√(1 − <i>k<\/i><sup>2<\/sup>)<\/span><\/span>"], "ans": 0, "sol": "Label the opposite leg <i>k<\/i> and the hypotenuse 1.<br>Adjacent leg: √(1 − <i>k<\/i><sup>2<\/sup>).<br>tan <i>x<\/i> = <span class=\"fq\"><span>opposite<\/span><span>adjacent<\/span><\/span> = <span class=\"fq\"><span><i>k<\/i><\/span><span>√(1 − <i>k<\/i><sup>2<\/sup>)<\/span><\/span>.<br>Answer: <b><span class=\"fq\"><span><i>k<\/i><\/span><span>√(1 − <i>k<\/i><sup>2<\/sup>)<\/span><\/span><\/b>"}, {"lo": "LO2", "diff": "X", "type": "spr", "q": "<svg class=\"fig\" viewBox=\"0 0 230 290\" role=\"img\" aria-label=\"Right triangle ABC with the right angle at C, where AC is vertical with length 20 and CB is horizontal. Point D lies on CB between C and B, and segment AD is drawn. Angle CAD is 18 degrees.\"><polygon class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" points=\"43.50,26.00 43.50,264.00 186.50,264.00\"/><line class=\"fg-edge\" x1=\"43.50\" y1=\"26.00\" x2=\"120.83\" y2=\"264.00\" stroke=\"currentColor\" stroke-width=\"2\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"43.50,255.00 52.50,255.00 52.50,264.00\"/><polyline class=\"fg-edge\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" points=\"43.50,76.00 44.48,75.99 45.46,75.96 46.44,75.91 47.42,75.85 48.40,75.76 49.37,75.65 50.35,75.53 51.32,75.38 52.29,75.22 53.25,75.04 54.21,74.84 55.17,74.62 56.12,74.38 57.07,74.12 58.01,73.85 58.95,73.55\"/><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"13\"><text x=\"59.77\" y=\"133.22\" text-anchor=\"middle\">18°<\/text><text x=\"38.81\" y=\"14.90\" text-anchor=\"middle\">A<\/text><text x=\"198.80\" y=\"278.74\" text-anchor=\"middle\">B<\/text><text x=\"35.01\" y=\"282.62\" text-anchor=\"middle\">C<\/text><text x=\"120.83\" y=\"282.50\" text-anchor=\"middle\">D<\/text><text x=\"25.10\" y=\"149.50\" text-anchor=\"middle\">20<\/text><\/g><\/svg>In the figure, triangle ABC has a right angle at <i>C<\/i>, and D lies on BC. If AC = 20, the measure of angle CAD is 18°, and the measure of angle BAC is 31°, what is the length of BD, to the nearest tenth?", "ans": ["5.5"], "sol": "In right triangle ACB, BC is opposite the 31° angle: BC = 20 tan 31° ≈ 12.017.<br>In right triangle ACD, CD is opposite the 18° angle: CD = 20 tan 18° ≈ 6.498.<br>BD = BC − CD ≈ 5.519, which rounds to 5.5.<br>Answer: <b>5.5<\/b>"}, {"lo": "LO3", "diff": "X", "type": "mcq", "q": "In right triangle RST, angle <i>S<\/i> is the right angle, and the measures of angles <i>R<\/i> and <i>T<\/i> are <i>R<\/i>° and <i>T<\/i>°. If sin <i>R<\/i>° = cos(2<i>T<\/i> − 30)°, where 0 &lt; 2<i>T<\/i> − 30 &lt; 90, what is the value of <i>R<\/i>?", "opts": ["30", "40", "60", "50"], "ans": 2, "sol": "Since <i>R<\/i> + <i>T<\/i> = 90, sin <i>R<\/i>° = cos <i>T<\/i>°.<br>So cos <i>T<\/i>° = cos(2<i>T<\/i> − 30)°, and with both angles acute, <i>T<\/i> = 2<i>T<\/i> − 30, giving <i>T<\/i> = 30.<br><i>R<\/i> = 90 − 30 = 60.<br>Answer: <b>60<\/b>"}], "unit_no": 4, "topic_no": "3", "code": "3.2"};

/* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }
