var S = {"id": "ALG-5.2", "unit": "Algebra", "topic": "Linear inequalities", "title": "Two-variable inequalities and their graphs", "intro": "A two-variable inequality such as <i>y<\/i> &gt; 2<i>x<\/i> − 3 has a whole region of solutions, drawn as a shaded half-plane with a solid or dashed boundary line. The DSAT asks you to test points, match inequalities to graphs, model budgets and limits with systems, and find which values of a constant put a point inside a region.", "los": [{"id": "LO1", "text": "Determine whether an ordered pair is a solution to a two-variable linear inequality or to a system of inequalities."}, {"id": "LO2", "text": "Identify the graph of a linear inequality or system: solid or dashed boundary, the shaded side, and the inequality that matches a given graph."}, {"id": "LO3", "text": "Write and interpret linear inequalities and systems that model real-world limits such as budgets, capacities and goals."}, {"id": "LO4", "text": "Determine the values of a constant or parameter that place a point inside (or outside) a solution region, or that give a system solutions."}], "notes": [{"lo": "LO1", "h": "What counts as a solution", "html": "An inequality in two variables, such as 3<i>x<\/i> − <i>y<\/i> &gt; 4, is a test that each ordered pair either passes or fails. A <b>solution<\/b> is any pair (<i>x<\/i>, <i>y<\/i>) that makes the statement true, and there are infinitely many of them.<div class=\"rule\">To test a point, substitute its <i>x<\/i>- and <i>y<\/i>-values and decide whether the resulting number statement is true.<\/div>Check (2, 1): 3(2) − 1 = 5, and 5 &gt; 4 is true, so it is a solution. Check (1, −1): 3(1) − (−1) = 4, and 4 &gt; 4 is false, so it is not.<ul><li>With &gt; or &lt;, points that land exactly on the boundary (giving equality) are <b>not<\/b> solutions.<\/li><li>With ≥ or ≤, boundary points <b>are<\/b> solutions.<\/li><\/ul>For a <b>system<\/b>, a point is a solution only if it passes <b>every<\/b> inequality. One failure rules it out."}, {"lo": "LO2", "h": "The boundary line: solid or dashed", "html": "Replace the inequality sign with = to get the <b>boundary line<\/b>. It splits the plane into two half-planes; the solutions fill one of them.<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Symbol<\/th><th>Boundary line<\/th><th>Points on the line<\/th><\/tr><tr><td>&lt; or &gt;<\/td><td>dashed<\/td><td>not included<\/td><\/tr><tr><td>≤ or ≥<\/td><td>solid<\/td><td>included<\/td><\/tr><\/table><\/div>To draw the line quickly, find two easy points. For 2<i>x<\/i> + 5<i>y<\/i> ≤ 10, the intercepts are (5, 0) and (0, 2); the symbol is ≤, so the line through them is solid.<div class=\"rule\">The symbol decides the line style. The direction of the symbol, after solving for <i>y<\/i>, decides the side.<\/div>"}, {"lo": "LO2", "h": "Which side to shade", "html": "Solve for <i>y<\/i> first. Then:<ul><li><i>y<\/i> &gt; <i>m<\/i><i>x<\/i> + <i>b<\/i> or <i>y<\/i> ≥ <i>m<\/i><i>x<\/i> + <i>b<\/i>: shade <b>above<\/b> the line.<\/li><li><i>y<\/i> &lt; <i>m<\/i><i>x<\/i> + <i>b<\/i> or <i>y<\/i> ≤ <i>m<\/i><i>x<\/i> + <i>b<\/i>: shade <b>below<\/b> the line.<\/li><li><i>x<\/i> &gt; <i>k<\/i>: shade to the right of the vertical line <i>x<\/i> = <i>k<\/i>; <i>x<\/i> &lt; <i>k<\/i>: to the left.<\/li><\/ul>Dividing by a negative number flips the sign. For 4<i>x<\/i> − 2<i>y<\/i> &gt; 6: −2<i>y<\/i> &gt; −4<i>x<\/i> + 6, so <i>y<\/i> &lt; 2<i>x<\/i> − 3. The region is <b>below<\/b> the dashed line, even though the original showed &gt;.<div class=\"rule\">Test-point check: if the origin is not on the line, substitute (0, 0). If it makes the inequality true, shade the side containing the origin; if false, shade the other side.<\/div>Here 4(0) − 2(0) = 0 &gt; 6 is false, so the origin is not shaded. That agrees with \"below <i>y<\/i> = 2<i>x<\/i> − 3\" because the origin sits above that line."}, {"lo": "LO2", "h": "Systems of inequalities", "html": "The solution set of a system is the <b>overlap<\/b> of the individual shaded regions. The graph below shows<div class=\"eqs\"><i>y<\/i> ≥ <i>x<\/i> − 2<br><i>y<\/i> &lt; −<i>x<\/i> + 4<\/div><svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Solid line through (0, −2) and (2, 0); dashed line through (0, 4) and (4, 0); the region above the solid line and below the dashed line is shaded\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><polygon class=\"fg-shape\" points=\"10.00,250.00 50.00,250.00 190.00,110.00 90.00,10.00 10.00,10.00\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"none\"/><line class=\"fg-axis\" x1=\"6\" y1=\"130\" x2=\"254\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130\" y1=\"6\" x2=\"130\" y2=\"254\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-fit\" x1=\"50.00\" y1=\"250.00\" x2=\"250.00\" y2=\"50.00\" stroke=\"currentColor\" stroke-width=\"2.2\"/><line class=\"fg-fit\" x1=\"90.00\" y1=\"10.00\" x2=\"250.00\" y2=\"170.00\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-dasharray=\"7 5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"130\" cy=\"170\" r=\"3\"/><circle cx=\"170\" cy=\"130\" r=\"3\"/><circle cx=\"130\" cy=\"50\" r=\"3\"/><circle cx=\"210\" cy=\"130\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>The first boundary, through (0, −2) and (2, 0), is solid with shading above it. The second, through (0, 4) and (4, 0), is dashed with shading below it. Only the wedge between them, to the left of where they cross at (3, 1), is shaded. Points on the solid edge of the wedge count; points on the dashed edge do not, and neither does the corner (3, 1) itself.<div class=\"tip\">Desmos tip: type each inequality exactly as given, for example <i>y<\/i> ≥ <i>x<\/i> − 2. Desmos draws the dashed or solid line and shades for you; the overlap of a system shows as the darker region. To test a point, type it, for example (1, 3), and see where it lands.<\/div>"}, {"lo": "LO3", "h": "Writing inequalities from a context", "html": "Translate the limit in words into a symbol:<div class=\"tscroll\"><table class=\"dtab\"><tr><th>Words<\/th><th>Symbol<\/th><\/tr><tr><td>at most, no more than, cannot exceed<\/td><td>≤<\/td><\/tr><tr><td>at least, no fewer than, a minimum of<\/td><td>≥<\/td><\/tr><tr><td>more than / less than<\/td><td>&gt; / &lt;<\/td><\/tr><\/table><\/div>Then build each side from rate × quantity. If adult tickets cost $8 and child tickets $5, and a group can spend at most $120, then 8<i>a<\/i> + 5<i>c<\/i> ≤ 120. Each term is a cost, so the coefficient 8 means \"$8 per adult ticket.\"<ul><li>Counts of objects are usually whole numbers, and they cannot be negative, so <i>a<\/i> ≥ 0 and <i>c<\/i> ≥ 0 are often implied.<\/li><li>A second condition (a capacity, a goal, a comparison like \"at least twice as many\") becomes a second inequality, giving a system.<\/li><\/ul>To check whether a plan works, substitute it into every inequality."}, {"lo": "LO4", "h": "Constraints on a constant", "html": "When a point contains an unknown, or the inequality contains a constant, substitute what you know and solve for the unknown.<div class=\"rule\">Point in a region → substitute the point → solve the resulting one-variable inequality.<\/div>Example: (3, <i>k<\/i>) is a solution of <i>y<\/i> &gt; 2<i>x<\/i> − 1 exactly when <i>k<\/i> &gt; 2(3) − 1, that is, <i>k<\/i> &gt; 5.<ul><li>For a system, find the condition from each inequality and keep the values that satisfy <b>all<\/b> of them (the overlap of the intervals).<\/li><li>\"Outside the region\" means the inequality is false. For a strict inequality, the boundary counts as outside.<\/li><li>Two boundaries with the same slope: <i>y<\/i> &gt; 3<i>x<\/i> + <i>b<\/i> and <i>y<\/i> &lt; 3<i>x<\/i> − 2 need 3<i>x<\/i> + <i>b<\/i> &lt; 3<i>x<\/i> − 2, so the system has solutions only when <i>b<\/i> &lt; −2.<\/li><\/ul>Watch the sign when the constant multiplies a negative coordinate, and remember to flip the inequality if you divide by a negative number."}], "examples": [{"lo": "LO1", "q": "Is each point a solution to 2<i>x<\/i> − 5<i>y<\/i> ≥ 9? (a) (4, −1) (b) (−1, 3)", "steps": ["(a) 2(4) − 5(−1) = 8 + 5 = 13, and 13 ≥ 9 is true.", "(b) 2(−1) − 5(3) = −2 − 15 = −17, and −17 ≥ 9 is false."], "ans": "(4, −1) is a solution; (−1, 3) is not."}, {"lo": "LO2", "q": "Describe the graph of 3<i>x<\/i> − 4<i>y<\/i> &lt; 12.", "steps": ["Subtract 3<i>x<\/i>: −4<i>y<\/i> &lt; −3<i>x<\/i> + 12.", "Divide by −4 and flip the sign: <i>y<\/i> &gt; <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> − 3.", "The symbol is strict, so the boundary <i>y<\/i> = <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> − 3 is dashed; &gt; means shade above it.", "Check with (0, 0): 0 &lt; 12 is true, and the origin is above the line (its <i>y<\/i>-intercept is −3), so the shading agrees."], "ans": "A dashed line with slope <span class=\"fq\"><span>3<\/span><span>4<\/span><\/span> and <i>y<\/i>-intercept −3, with the region above it shaded."}, {"lo": "LO3", "q": "A caterer buys sandwich trays for $6 each and salad bowls for $9 each. She can spend at most $270 and needs at least 10 salad bowls. Write a system for <i>s<\/i> trays and <i>d<\/i> bowls, and decide whether 25 trays and 14 bowls is possible.", "steps": ["Cost: 6<i>s<\/i> + 9<i>d<\/i> ≤ 270. Salad requirement: <i>d<\/i> ≥ 10.", "Test (25, 14): 6(25) + 9(14) = 150 + 126 = 276.", "276 ≤ 270 is false, so the budget condition fails (even though 14 ≥ 10 holds)."], "ans": "6<i>s<\/i> + 9<i>d<\/i> ≤ 270 and <i>d<\/i> ≥ 10; the plan is <b>not<\/b> possible."}, {"lo": "LO4", "q": "For which values of <i>k<\/i> does the point (<i>k<\/i>, 2<i>k<\/i>) lie in the solution region of the system <i>y<\/i> &gt; <i>x<\/i> + 3 and <i>y<\/i> ≤ −<i>x<\/i> + 15?", "steps": ["First inequality: 2<i>k<\/i> &gt; <i>k<\/i> + 3, so <i>k<\/i> &gt; 3.", "Second inequality: 2<i>k<\/i> ≤ −<i>k<\/i> + 15, so 3<i>k<\/i> ≤ 15 and <i>k<\/i> ≤ 5.", "Both must hold, so keep the overlap."], "ans": "3 &lt; <i>k<\/i> ≤ 5"}, {"lo": "LO4", "q": "For which values of the constant <i>b<\/i> does the system <i>y<\/i> &gt; 3<i>x<\/i> + <i>b<\/i> and <i>y<\/i> &lt; 3<i>x<\/i> − 2 have <b>no<\/b> solution?", "steps": ["Both boundaries have slope 3, so they are parallel.", "A solution needs 3<i>x<\/i> + <i>b<\/i> &lt; <i>y<\/i> &lt; 3<i>x<\/i> − 2, which is possible only if 3<i>x<\/i> + <i>b<\/i> &lt; 3<i>x<\/i> − 2, that is, <i>b<\/i> &lt; −2.", "If <i>b<\/i> = −2, the regions are the two open sides of the same line and share nothing; if <i>b<\/i> &gt; −2, the region above the first line lies entirely above the second."], "ans": "No solution when <i>b<\/i> ≥ −2."}], "traps": ["Dividing by a negative coefficient of <i>y<\/i> without flipping the sign: −2<i>y<\/i> &gt; 4<i>x<\/i> − 6 becomes <i>y<\/i> &lt; −2<i>x<\/i> + 3, so the shading goes below, not above.", "Reading the side from the original symbol in standard form: 4<i>x<\/i> − <i>y<\/i> &gt; 2 is the region <b>below<\/b> <i>y<\/i> = 4<i>x<\/i> − 2, so always solve for <i>y<\/i> or use a test point.", "Counting a point on a dashed boundary as a solution, or drawing a solid line for &lt; or &gt; (only ≤ and ≥ include the line).", "Checking a point against only one inequality of a system; it must satisfy every one.", "Swapping \"at least\" (≥) and \"at most\" (≤) in word problems, or forgetting that counts must be whole numbers."], "guided": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which ordered pair is a solution to <i>y<\/i> &gt; 4<i>x<\/i> − 7?", "opts": ["(1, −3)", "(2, 1)", "(0, −8)", "(3, 6)"], "ans": 3, "sol": "Substitute each pair. (1, −3): 4(1) − 7 = −3, and −3 &gt; −3 is false (it is on the dashed line). (2, 1): 4(2) − 7 = 1, and 1 &gt; 1 is false. (0, −8): −8 &gt; −7 is false. (3, 6): 4(3) − 7 = 5, and 6 &gt; 5 is true. Answer: <b>(3, 6)<\/b>", "hint": "Plug each point in; remember that equality does not satisfy a strict &gt;."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which describes the graph of <i>y<\/i> ≤ −3<i>x<\/i> + 2 in the <i>xy<\/i>-plane?", "opts": ["A solid line with the region below it shaded", "A dashed line with the region below it shaded", "A solid line with the region above it shaded", "A dashed line with the region above it shaded"], "ans": 0, "sol": "The symbol ≤ includes the boundary, so the line is solid. \"<i>y<\/i> is less than or equal to\" means shade below. Answer: <b>A solid line with the region below it shaded<\/b>", "hint": "Decide the line style from whether equality is allowed, then the side from the direction of the sign."}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "Ordered pairs (<i>x<\/i>, <i>y<\/i>) satisfy 2<i>x<\/i> + 3<i>y<\/i> ≥ 18. If <i>x<\/i> = 3, what is the least possible value of <i>y<\/i>?", "ans": ["4"], "sol": "Substitute: 2(3) + 3<i>y<\/i> ≥ 18, so 3<i>y<\/i> ≥ 12 and <i>y<\/i> ≥ 4. Because ≥ includes equality, the least value is 4. Answer: <b>4<\/b>", "hint": "Substitute the given <i>x<\/i> and solve the one-variable inequality for <i>y<\/i>."}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which describes the graph of 5<i>x<\/i> − <i>y<\/i> &lt; 10?", "opts": ["The region below the dashed line <i>y<\/i> = 5<i>x<\/i> − 10", "The region above the dashed line <i>y<\/i> = 5<i>x<\/i> − 10", "The region above the solid line <i>y<\/i> = 5<i>x<\/i> − 10", "The region below the solid line <i>y<\/i> = 5<i>x<\/i> − 10"], "ans": 1, "sol": "Subtract 5<i>x<\/i>: −<i>y<\/i> &lt; −5<i>x<\/i> + 10. Multiply by −1 and flip: <i>y<\/i> &gt; 5<i>x<\/i> − 10. Strict sign → dashed; &gt; → above. Answer: <b>The region above the dashed line <i>y<\/i> = 5<i>x<\/i> − 10<\/b>", "hint": "Solve for <i>y<\/i>; watch what happens to the sign when you multiply or divide by a negative."}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A climbing gym sells day passes for $12 and class passes for $20. Maya will spend at most $200 on <i>d<\/i> day passes and <i>c<\/i> class passes. Which inequality models this?", "opts": ["12<i>d<\/i> + 20<i>c<\/i> ≤ 200", "12<i>d<\/i> + 20<i>c<\/i> ≥ 200", "20<i>d<\/i> + 12<i>c<\/i> ≤ 200", "12<i>d<\/i> + 20<i>c<\/i> &lt; 200"], "ans": 0, "sol": "Cost of day passes is 12<i>d<\/i>, cost of class passes is 20<i>c<\/i>. \"At most\" allows spending exactly $200, so use ≤. Answer: <b>12<i>d<\/i> + 20<i>c<\/i> ≤ 200<\/b>", "hint": "Multiply each price by the matching quantity, then translate \"at most.\""}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which point is a solution to the system below?<div class=\"eqs\"><i>y<\/i> &lt; 2<i>x<\/i> + 1<br><i>y<\/i> ≥ −<i>x<\/i> + 4<\/div>", "opts": ["(1, 3)", "(2, 2)", "(3, 7)", "(0, 4)"], "ans": 1, "sol": "(1, 3): 3 &lt; 3 fails. (2, 2): 2 &lt; 5 true and 2 ≥ 2 true. (3, 7): 7 &lt; 7 fails. (0, 4): 4 &lt; 1 fails. Only (2, 2) passes both. Answer: <b>(2, 2)<\/b>", "hint": "A point must pass both inequalities; test the strict one carefully."}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which inequality is represented by the graph?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Dashed line through (−2, 3), (0, 2) and (4, 0); the region below the line is shaded\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><polygon class=\"fg-shape\" points=\"10.00,250.00 250.00,250.00 250.00,150.00 10.00,30.00\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"none\"/><line class=\"fg-axis\" x1=\"6\" y1=\"130\" x2=\"254\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130\" y1=\"6\" x2=\"130\" y2=\"254\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-fit\" x1=\"10.00\" y1=\"30.00\" x2=\"250.00\" y2=\"150.00\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-dasharray=\"7 5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"130\" cy=\"90\" r=\"3\"/><circle cx=\"210\" cy=\"130\" r=\"3\"/><circle cx=\"90\" cy=\"70\" r=\"3\"/><\/g><g class=\"fg-lab\" fill=\"currentColor\" font-size=\"11\"><text x=\"50\" y=\"144\" text-anchor=\"middle\">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>", "opts": ["<i>x<\/i> + 2<i>y<\/i> &lt; 4", "<i>x<\/i> + 2<i>y<\/i> &gt; 4", "<i>x<\/i> + 2<i>y<\/i> ≤ 4", "2<i>x<\/i> + <i>y<\/i> &lt; 4"], "ans": 0, "sol": "The line passes through (0, 2) and (4, 0), so it is <i>x<\/i> + 2<i>y<\/i> = 4 (2<i>x<\/i> + <i>y<\/i> = 4 would pass through (2, 0) instead). The line is dashed, so the sign is strict. The origin is in the shaded region and 0 + 0 &lt; 4 is true. Answer: <b><i>x<\/i> + 2<i>y<\/i> &lt; 4<\/b>", "hint": "Use the intercepts to find the line, the dashes for strict or not, and the origin as a test point."}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A school club sells mugs for $7 each and T-shirts for $15 each. To reach its goal, the club must raise at least $600. If the club sells 45 mugs, what is the least number of T-shirts it must sell?", "ans": ["19"], "sol": "Write 7(45) + 15<i>s<\/i> ≥ 600, so 315 + 15<i>s<\/i> ≥ 600 and 15<i>s<\/i> ≥ 285. Then <i>s<\/i> ≥ 19. Answer: <b>19<\/b>", "hint": "Write the revenue inequality, substitute the mugs, and solve for the shirts."}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "The point (2, <i>k<\/i>) lies in the solution region of the system below. What is the greatest possible value of <i>k<\/i>?<div class=\"eqs\"><i>y<\/i> ≥ 3<i>x<\/i> − 1<br><i>y<\/i> ≤ −<i>x<\/i> + 9<\/div>", "ans": ["7"], "sol": "First: <i>k<\/i> ≥ 3(2) − 1 = 5. Second: <i>k<\/i> ≤ −2 + 9 = 7. So 5 ≤ <i>k<\/i> ≤ 7, and the greatest value is 7. Answer: <b>7<\/b>", "hint": "Substitute <i>x<\/i> = 2 into each inequality to get a range for <i>k<\/i>."}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The point (<i>a<\/i>, 3) is a solution to 4<i>x<\/i> − 2<i>y<\/i> &gt; 10. Which must be true?", "opts": ["<i>a<\/i> &gt; 5", "<i>a<\/i> &lt; 4", "<i>a<\/i> &gt; 4", "<i>a<\/i> &gt; <span class=\"fq\"><span>9<\/span><span>2<\/span><\/span>"], "ans": 2, "sol": "Substitute: 4<i>a<\/i> − 2(3) &gt; 10, so 4<i>a<\/i> − 6 &gt; 10, 4<i>a<\/i> &gt; 16 and <i>a<\/i> &gt; 4. Answer: <b><i>a<\/i> &gt; 4<\/b>", "hint": "Substitute <i>x<\/i> = <i>a<\/i> and <i>y<\/i> = 3, then solve for <i>a<\/i>."}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "The graph of which inequality has a solid boundary line and a shaded region that contains the origin?", "opts": ["<i>y<\/i> ≥ 2<i>x<\/i> + 3", "<i>y<\/i> &gt; <i>x<\/i> − 4", "3<i>x<\/i> + <i>y<\/i> ≤ 5", "<i>x<\/i> − <i>y<\/i> ≥ 1"], "ans": 2, "sol": "Solid lines come from ≤ or ≥, which rules out <i>y<\/i> &gt; <i>x<\/i> − 4. Test (0, 0) in the rest: 0 ≥ 3 false; 0 ≤ 5 true; 0 ≥ 1 false. Answer: <b>3<i>x<\/i> + <i>y<\/i> ≤ 5<\/b>", "hint": "Two conditions: check the symbol for the line style, then test (0, 0)."}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "In the <i>xy<\/i>-plane, the point (0, 0) is <b>not<\/b> a solution to <i>y<\/i> ≥ 4<i>x<\/i> + <i>c<\/i>, but the point (1, 5) is. Which of the following could be the value of <i>c<\/i>?", "opts": ["−1", "2", "5", "<span class=\"fq\"><span>1<\/span><span>2<\/span><\/span>"], "ans": 3, "sol": "(0, 0) fails: 0 ≥ <i>c<\/i> is false, so <i>c<\/i> &gt; 0. (1, 5) works: 5 ≥ 4 + <i>c<\/i>, so <i>c<\/i> ≤ 1. Together 0 &lt; <i>c<\/i> ≤ 1; only <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span> fits. Answer: <b><span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><\/b>", "hint": "Turn \"not a solution\" into the opposite inequality, then combine it with the second condition."}], "quiz1": [{"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which point is <b>not<\/b> a solution to <i>y<\/i> ≥ −<i>x<\/i> + 3?", "opts": ["(4, 0)", "(1, 2)", "(2, 0)", "(0, 5)"], "ans": 2, "sol": "(4, 0): 0 ≥ −1 true. (1, 2): 2 ≥ 2 true. (2, 0): 0 ≥ 1 false. (0, 5): 5 ≥ 3 true. Answer: <b>(2, 0)<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which inequality is graphed with a dashed boundary line?", "opts": ["<i>y<\/i> ≤ 6<i>x<\/i>", "<i>x<\/i> + <i>y<\/i> &lt; 9", "<i>y<\/i> ≥ <i>x<\/i> − 8", "2<i>x<\/i> − <i>y<\/i> ≤ 1"], "ans": 1, "sol": "Only strict signs (&lt; or &gt;) give a dashed line. Answer: <b><i>x<\/i> + <i>y<\/i> &lt; 9<\/b>"}, {"lo": "LO1", "diff": "E", "type": "spr", "q": "What is the greatest integer value of <i>y<\/i> for which (3, <i>y<\/i>) is a solution to <i>y<\/i> &lt; 5<i>x<\/i> + 2?", "ans": ["16"], "sol": "Substitute: <i>y<\/i> &lt; 5(3) + 2 = 17. The greatest integer less than 17 is 16. Answer: <b>16<\/b>"}, {"lo": "LO2", "diff": "E", "type": "mcq", "q": "Which describes the boundary line of the graph of 3<i>y<\/i> − 6<i>x<\/i> ≤ 9?", "opts": ["Slope 2, <i>y<\/i>-intercept 3, solid", "Slope 2, <i>y<\/i>-intercept 3, dashed", "Slope −2, <i>y<\/i>-intercept 3, solid", "Slope 6, <i>y<\/i>-intercept 9, solid"], "ans": 0, "sol": "Add 6<i>x<\/i> and divide by 3: <i>y<\/i> ≤ 2<i>x<\/i> + 3. Slope 2, intercept 3, and ≤ gives a solid line. Answer: <b>Slope 2, <i>y<\/i>-intercept 3, solid<\/b>"}, {"lo": "LO3", "diff": "E", "type": "mcq", "q": "A delivery van can carry at most 1,800 pounds of cargo. Each type A box weighs 40 pounds and each type B box weighs 60 pounds. Which inequality represents the possible numbers of type A boxes, <i>a<\/i>, and type B boxes, <i>b<\/i>, the van can carry?", "opts": ["40<i>a<\/i> + 60<i>b<\/i> ≥ 1800", "60<i>a<\/i> + 40<i>b<\/i> ≤ 1800", "40<i>a<\/i> + 60<i>b<\/i> ≤ 1800", "<i>a<\/i> + <i>b<\/i> ≤ 1800"], "ans": 2, "sol": "Total weight is 40<i>a<\/i> + 60<i>b<\/i>, and \"at most\" means ≤. Answer: <b>40<i>a<\/i> + 60<i>b<\/i> ≤ 1800<\/b>"}, {"lo": "LO1", "diff": "E", "type": "mcq", "q": "Which point satisfies both <i>x<\/i> &gt; 2 and <i>y<\/i> ≤ 3?", "opts": ["(2, 1)", "(5, 4)", "(1, 0)", "(3, 3)"], "ans": 3, "sol": "(2, 1): 2 &gt; 2 fails. (5, 4): 4 ≤ 3 fails. (1, 0): 1 &gt; 2 fails. (3, 3): 3 &gt; 2 and 3 ≤ 3 both true. Answer: <b>(3, 3)<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which inequality is represented by the graph?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Solid line through (0, −3), (2, 1) and (3, 3); the region above and to the left of the line is shaded\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><lin \">−4<\/text><text x=\"125\" y=\"214\" text-anchor=\"end\">−4<\/text><text x=\"90\" y=\"144\" text-anchor=\"middle\">−2<\/text><text x=\"125\" y=\"174\" text-anchor=\"end\">−2<\/text><text x=\"170\" y=\"144\" text-anchor=\"middle\">2<\/text><text x=\"125\" y=\"94\" text-anchor=\"end\">2<\/text><text x=\"210\" y=\"144\" text-anchor=\"middle\">4<\/text><text x=\"125\" y=\"54\" text-anchor=\"end\">4<\/text><text x=\"248\" y=\"124\" text-anchor=\"end\" font-style=\"italic\">x<\/text><text x=\"137\" y=\"18\" font-style=\"italic\">y<\/text><\/g><\/svg>", "opts": ["<i>y<\/i> ≤ 2<i>x<\/i> − 3", "<i>y<\/i> ≥ 2<i>x<\/i> − 3", "<i>y<\/i> &gt; 2<i>x<\/i> − 3", "<i>y<\/i> ≥ <span class=\"fq\"><span>1<\/span><span>2<\/span><\/span><i>x<\/i> − 3"], "ans": 1, "sol": "The line passes through (0, −3) and (2, 1): slope <span class=\"fq\"><span>4<\/span><span>2<\/span><\/span> = 2, intercept −3. It is solid (≤ or ≥) and the shading is above, so ≥. Answer: <b><i>y<\/i> ≥ 2<i>x<\/i> − 3<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which point is a solution to 3<i>x<\/i> − 2<i>y<\/i> ≤ −4?", "opts": ["(−2, 0)", "(0, 1)", "(2, 4)", "(1, 3)"], "ans": 0, "sol": "(−2, 0): −6 ≤ −4 true. (0, 1): −2 ≤ −4 false. (2, 4): 6 − 8 = −2, false. (1, 3): 3 − 6 = −3, false. Answer: <b>(−2, 0)<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A tutor charges $35 per hour for SAT sessions and $25 per hour for homework help. This month she wants to earn more than $1,000. If she works 20 hours of homework help, what is the least whole number of hours of SAT sessions she must work?", "ans": ["15"], "sol": "Earnings: 25(20) + 35<i>s<\/i> &gt; 1,000, so 35<i>s<\/i> &gt; 500 and <i>s<\/i> &gt; 14.28…. The least whole number is 15. Answer: <b>15<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "The point (<i>k<\/i>, 4) lies in the solution region of <i>y<\/i> &lt; −2<i>x<\/i> + 10. What is the greatest integer value of <i>k<\/i>?", "ans": ["2"], "sol": "Substitute: 4 &lt; −2<i>k<\/i> + 10, so 2<i>k<\/i> &lt; 6 and <i>k<\/i> &lt; 3. The greatest integer is 2. Answer: <b>2<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "The graph of which inequality is the region below a dashed line with slope <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>?", "opts": ["3<i>x<\/i> − 2<i>y<\/i> &lt; 8", "2<i>x<\/i> − 3<i>y<\/i> &gt; 8", "3<i>x<\/i> − 2<i>y<\/i> &gt; 8", "3<i>x<\/i> + 2<i>y<\/i> &gt; 8"], "ans": 2, "sol": "Solve 3<i>x<\/i> − 2<i>y<\/i> &gt; 8: −2<i>y<\/i> &gt; −3<i>x<\/i> + 8, so <i>y<\/i> &lt; <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> − 4: dashed, slope <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>, below. The first choice gives <i>y<\/i> &gt; <span class=\"fq\"><span>3<\/span><span>2<\/span><\/span><i>x<\/i> − 4 (above), the second has slope <span class=\"fq\"><span>2<\/span><span>3<\/span><\/span>, the fourth slope −<span class=\"fq\"><span>3<\/span><span>2<\/span><\/span>. Answer: <b>3<i>x<\/i> − 2<i>y<\/i> &gt; 8<\/b>"}, {"lo": "LO1", "diff": "M", "type": "mcq", "q": "Lena buys <i>x<\/i> pounds of apples and <i>y<\/i> pounds of pears. She wants the weight of pears to be at most 3 times the weight of apples, and the total weight to be more than 8 pounds, so <i>y<\/i> ≤ 3<i>x<\/i> and <i>x<\/i> + <i>y<\/i> &gt; 8. Which purchase (<i>x<\/i>, <i>y<\/i>) meets both conditions?", "opts": ["(2, 6)", "(3, 4)", "(1, 9)", "(4, 5)"], "ans": 3, "sol": "(2, 6): total 8 &gt; 8 fails. (3, 4): total 7 fails. (1, 9): 9 ≤ 3 fails. (4, 5): 5 ≤ 12 and 9 &gt; 8. Answer: <b>(4, 5)<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A farmer plants <i>c<\/i> acres of corn and <i>w<\/i> acres of wheat. She has at most 120 acres and can spend at most $30,000; corn costs $300 per acre and wheat $200 per acre, so <i>c<\/i> + <i>w<\/i> ≤ 120 and 300<i>c<\/i> + 200<i>w<\/i> ≤ 30000. Which plan (<i>c<\/i>, <i>w<\/i>) is possible?", "opts": ["(80, 35)", "(60, 50)", "(40, 90)", "(90, 20)"], "ans": 1, "sol": "(80, 35): cost 24,000 + 7,000 = 31,000, too much. (60, 50): 110 acres and 18,000 + 10,000 = 28,000, both fine. (40, 90): 130 acres, too many. (90, 20): cost 27,000 + 4,000 = 31,000, too much. Answer: <b>(60, 50)<\/b>"}, {"lo": "LO4", "diff": "M", "type": "mcq", "q": "The point (3, −1) is a solution to <i>a<\/i><i>x<\/i> + 2<i>y<\/i> ≥ 7, where <i>a<\/i> is a constant. Which describes all possible values of <i>a<\/i>?", "opts": ["<i>a<\/i> ≥ 3", "<i>a<\/i> ≤ 3", "<i>a<\/i> ≥ <span class=\"fq\"><span>5<\/span><span>3<\/span><\/span>", "<i>a<\/i> ≥ 9"], "ans": 0, "sol": "Substitute: 3<i>a<\/i> + 2(−1) ≥ 7, so 3<i>a<\/i> ≥ 9 and <i>a<\/i> ≥ 3. Answer: <b><i>a<\/i> ≥ 3<\/b>"}, {"lo": "LO1", "diff": "M", "type": "spr", "q": "A teacher buys <i>x<\/i> notebooks at $1 each and <i>y<\/i> binders at $2 each. She buys at least one of each and spends at most $8, so <i>x<\/i> + 2<i>y<\/i> ≤ 8 with <i>x<\/i> and <i>y<\/i> positive integers. How many different combinations (<i>x<\/i>, <i>y<\/i>) are possible?", "ans": ["12"], "sol": "<i>y<\/i> = 1: <i>x<\/i> ≤ 6, 6 choices. <i>y<\/i> = 2: <i>x<\/i> ≤ 4, 4 choices. <i>y<\/i> = 3: <i>x<\/i> ≤ 2, 2 choices. <i>y<\/i> = 4 leaves <i>x<\/i> ≤ 0, impossible. Total 6 + 4 + 2 = 12. Answer: <b>12<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "Which inequality has the same graph as <i>y<\/i> &lt; −<span class=\"fq\"><span>3<\/span><span>4<\/span><\/span><i>x<\/i> + 6?", "opts": ["4<i>x<\/i> + 3<i>y<\/i> &lt; 24", "3<i>x<\/i> + 4<i>y<\/i> &gt; 24", "−3<i>x<\/i> − 4<i>y<\/i> &lt; −24", "3<i>x<\/i> + 4<i>y<\/i> &lt; 24"], "ans": 3, "sol": "Multiply both sides by 4: 4<i>y<\/i> &lt; −3<i>x<\/i> + 24, so 3<i>x<\/i> + 4<i>y<\/i> &lt; 24. The third choice simplifies to 3<i>x<\/i> + 4<i>y<\/i> &gt; 24 after dividing by −1 and flipping. Answer: <b>3<i>x<\/i> + 4<i>y<\/i> &lt; 24<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "A concert hall sells floor tickets for $45 and balcony tickets for $30. It holds at most 500 people, and the organizers need ticket sales of at least $18,000. If <i>f<\/i> floor and <i>b<\/i> balcony tickets are sold, which system represents these conditions?", "opts": ["<div class=\"eqs\"><i>f<\/i> + <i>b<\/i> ≤ 500<br>45<i>f<\/i> + 30<i>b<\/i> ≥ 18000<\/div>", "<div class=\"eqs\"><i>f<\/i> + <i>b<\/i> ≥ 500<br>45<i>f<\/i> + 30<i>b<\/i> ≤ 18000<\/div>", "<div class=\"eqs\"><i>f<\/i> + <i>b<\/i> ≤ 500<br>30<i>f<\/i> + 45<i>b<\/i> ≥ 18000<\/div>", "<div class=\"eqs\">45<i>f<\/i> + 30<i>b<\/i> ≤ 500<br><i>f<\/i> + <i>b<\/i> ≥ 18000<\/div>"], "ans": 0, "sol": "Seats: <i>f<\/i> + <i>b<\/i> ≤ 500. Revenue: 45<i>f<\/i> + 30<i>b<\/i> ≥ 18,000. Answer: <b><i>f<\/i> + <i>b<\/i> ≤ 500 and 45<i>f<\/i> + 30<i>b<\/i> ≥ 18000<\/b>"}, {"lo": "LO4", "diff": "H", "type": "spr", "q": "For how many integer values of <i>k<\/i> does the point (<i>k<\/i>, <i>k<\/i> + 1) lie in the solution region of the system below?<div class=\"eqs\"><i>y<\/i> &lt; 4<i>x<\/i> − 6<br><i>x<\/i> + <i>y<\/i> &lt; 15<\/div>", "ans": ["4"], "sol": "First: <i>k<\/i> + 1 &lt; 4<i>k<\/i> − 6, so 3<i>k<\/i> &gt; 7 and <i>k<\/i> &gt; <span class=\"fq\"><span>7<\/span><span>3<\/span><\/span>. Second: <i>k<\/i> + <i>k<\/i> + 1 &lt; 15, so <i>k<\/i> &lt; 7. Integers 3, 4, 5, 6. Answer: <b>4<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "In the <i>xy<\/i>-plane, the solution region of the system <i>y<\/i> ≥ <i>x<\/i> + 1 and <i>y<\/i> ≥ −<i>x<\/i> − 3 contains no points in which quadrant?", "opts": ["Quadrant I", "Quadrant II", "Quadrant III", "Quadrant IV"], "ans": 3, "sol": "In Quadrant IV, <i>x<\/i> &gt; 0 and <i>y<\/i> &lt; 0, but the first inequality forces <i>y<\/i> ≥ <i>x<\/i> + 1 &gt; 1. Points such as (1, 3), (−1, 2) and (−2, −0.5) show the region reaches Quadrants I, II and III. Answer: <b>Quadrant IV<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The point (2, 5) is a solution to the system <i>y<\/i> &gt; <i>a<\/i><i>x<\/i> − 1 and <i>y<\/i> ≤ 3<i>x<\/i> − <i>a<\/i>, where <i>a<\/i> is a constant. Which of the following could be the value of <i>a<\/i>?", "opts": ["3", "2", "1", "4"], "ans": 2, "sol": "First: 5 &gt; 2<i>a<\/i> − 1, so <i>a<\/i> &lt; 3. Second: 5 ≤ 6 − <i>a<\/i>, so <i>a<\/i> ≤ 1. Both: <i>a<\/i> ≤ 1. Answer: <b>1<\/b>"}], "quiz2": [{"lo": "LO1", "diff": "M", "type": "mcq", "q": "Which point is a solution to the system below?<div class=\"eqs\">−3<i>x<\/i> + 4<i>y<\/i> &gt; 2<br><i>x<\/i> − <i>y<\/i> ≥ −5<\/div>", "opts": ["(2, 2)", "(−4, 2)", "(0, 1)", "(3, −1)"], "ans": 2, "sol": "(2, 2): −6 + 8 = 2, and 2 &gt; 2 fails. (−4, 2): first gives 20 &gt; 2, but −6 ≥ −5 fails. (0, 1): 4 &gt; 2 and −1 ≥ −5. (3, −1): −13 &gt; 2 fails. Answer: <b>(0, 1)<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "Which describes the graph of −5<i>y<\/i> ≥ 10<i>x<\/i> − 15?", "opts": ["The solid line <i>y<\/i> = −2<i>x<\/i> + 3 and the region above it", "The solid line <i>y<\/i> = −2<i>x<\/i> + 3 and the region below it", "The solid line <i>y<\/i> = 2<i>x<\/i> − 3 and the region below it", "The dashed line <i>y<\/i> = −2<i>x<\/i> + 3 and the region below it"], "ans": 1, "sol": "Divide by −5 and flip: <i>y<\/i> ≤ −2<i>x<\/i> + 3. The ≤ gives a solid line, shaded below. Answer: <b>The solid line <i>y<\/i> = −2<i>x<\/i> + 3 and the region below it<\/b>"}, {"lo": "LO3", "diff": "M", "type": "mcq", "q": "A ferry's deck space limits the numbers of cars, <i>c<\/i>, and trucks, <i>t<\/i>, it carries according to 2<i>c<\/i> + 5<i>t<\/i> ≤ 150, where space is measured in lane units. What is the best interpretation of the 5?", "opts": ["The ferry can carry at most 5 trucks.", "Each car uses 5 lane units of deck space.", "The ferry carries 5 more trucks than cars.", "Each truck uses 5 lane units of deck space."], "ans": 3, "sol": "The term 5<i>t<\/i> is the space taken by <i>t<\/i> trucks, so each truck takes 5 lane units. Answer: <b>Each truck uses 5 lane units of deck space.<\/b>"}, {"lo": "LO4", "diff": "M", "type": "spr", "q": "The point (−2, <i>k<\/i>) lies in the solution region of 3<i>x<\/i> − <i>y<\/i> &lt; 4. What is the least integer value of <i>k<\/i>?", "ans": ["-9"], "sol": "Substitute: −6 − <i>k<\/i> &lt; 4, so −<i>k<\/i> &lt; 10 and <i>k<\/i> &gt; −10. The least integer greater than −10 is −9. Answer: <b>−9<\/b>"}, {"lo": "LO3", "diff": "M", "type": "spr", "q": "A runner trains on at most 10 days this month. On some days she runs 6 miles and on the others she runs 10 miles, and she wants a monthly total of at least 80 miles. What is the least number of 10-mile days she can run?", "ans": ["5"], "sol": "Let <i>x<\/i> be 6-mile days and <i>y<\/i> 10-mile days: <i>x<\/i> + <i>y<\/i> ≤ 10 and 6<i>x<\/i> + 10<i>y<\/i> ≥ 80. To use as few 10-mile days as possible, take <i>x<\/i> = 10 − <i>y<\/i>: 60 − 6<i>y<\/i> + 10<i>y<\/i> ≥ 80, so 4<i>y<\/i> ≥ 20 and <i>y<\/i> ≥ 5. Check: 5 and 5 gives 80 miles. Answer: <b>5<\/b>"}, {"lo": "LO2", "diff": "M", "type": "mcq", "q": "The graph of which inequality is a region lying entirely to the left of a vertical line?", "opts": ["−2<i>x<\/i> &gt; 8", "<i>y<\/i> &lt; −4", "2<i>x<\/i> − <i>y<\/i> &gt; 8", "<i>x<\/i> − 4 &gt; 0"], "ans": 0, "sol": "−2<i>x<\/i> &gt; 8 gives <i>x<\/i> &lt; −4: left of the vertical line <i>x<\/i> = −4. <i>y<\/i> &lt; −4 is below a horizontal line, 2<i>x<\/i> − <i>y<\/i> &gt; 8 has a slanted boundary, and <i>x<\/i> − 4 &gt; 0 is to the right of <i>x<\/i> = 4. Answer: <b>−2<i>x<\/i> &gt; 8<\/b>"}, {"lo": "LO2", "diff": "H", "type": "mcq", "q": "Which system of inequalities is represented by the graph?<svg class=\"fig\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Solid line through (−4, −3), (0, −1) and (4, 1); dashed line through (0, 4) and (4, 0); the region above the solid line and below the dashed line is shaded\"><g class=\"fg-grid\" stroke=\"currentColor\" stroke-opacity=\"0.15\" stroke-width=\"1\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"250\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"250\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"250\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"250\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"250\"/><line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"250\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"250\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"250\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"250\"/><line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"250\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"250\" x2=\"250\" y2=\"250\"/><line x1=\"10\" y1=\"230\" x2=\"250\" y2=\"230\"/><line x1=\"10\" y1=\"210\" x2=\"250\" y2=\"210\"/><line x1=\"10\" y1=\"190\" x2=\"250\" y2=\"190\"/><line x1=\"10\" y1=\"170\" x2=\"250\" y2=\"170\"/><line x1=\"10\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"10\" y1=\"130\" x2=\"250\" y2=\"130\"/><line x1=\"10\" y1=\"110\" x2=\"250\" y2=\"110\"/><line x1=\"10\" y1=\"90\" x2=\"250\" y2=\"90\"/><line x1=\"10\" y1=\"70\" x2=\"250\" y2=\"70\"/><line x1=\"10\" y1=\"50\" x2=\"250\" y2=\"50\"/><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\"/><line x1=\"10\" y1=\"10\" x2=\"250\" y2=\"10\"/><\/g><polygon class=\"fg-shape\" points=\"90.00,10.00 10.00,10.00 10.00,210.00 196.67,116.67\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke=\"none\"/><line class=\"fg-axis\" x1=\"6\" y1=\"130\" x2=\"254\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-axis\" x1=\"130\" y1=\"6\" x2=\"130\" y2=\"254\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line class=\"fg-fit\" x1=\"10.00\" y1=\"210.00\" x2=\"250.00\" y2=\"90.00\" stroke=\"currentColor\" stroke-width=\"2.2\"/><line class=\"fg-fit\" x1=\"90.00\" y1=\"10.00\" x2=\"250.00\" y2=\"170.00\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-dasharray=\"7 5\"/><g class=\"fg-pts\" fill=\"currentColor\"><circle cx=\"50\" cy=\"190\" r=\"3\"/><circle cx=\"130\" cy=\"150\" r=\"3\"/><circle cx=\"210\" cy=\"110\" r=\"3\"/><circle cx=\"130\" cy=\"50\" r=\"3\"/><circle cx=\"210\" cy=\"130\" r=\"3\"/><\/g>  is not part of the region. Answer: <b><i>r<\/i> ≥ 4<\/b>"}, {"lo": "LO3", "diff": "H", "type": "mcq", "q": "An animal shelter houses <i>d<\/i> dogs and <i>c<\/i> cats. It can hold at most 60 animals, and it always has at least twice as many cats as dogs. Which system represents these conditions?", "opts": ["<div class=\"eqs\"><i>d<\/i> + <i>c<\/i> ≤ 60<br><i>d<\/i> ≥ 2<i>c<\/i><\/div>", "<div class=\"eqs\"><i>d<\/i> + <i>c<\/i> ≤ 60<br><i>c<\/i> ≥ 2<i>d<\/i><\/div>", "<div class=\"eqs\"><i>d<\/i> + <i>c<\/i> ≥ 60<br><i>c<\/i> ≥ 2<i>d<\/i><\/div>", "<div class=\"eqs\"><i>d<\/i> + <i>c<\/i> ≤ 60<br>2<i>c<\/i> ≥ <i>d<\/i><\/div>"], "ans": 1, "sol": "Capacity: <i>d<\/i> + <i>c<\/i> ≤ 60. \"Cats at least twice dogs\": <i>c<\/i> ≥ 2<i>d<\/i> (double the dogs, and cats must reach that). Answer: <b><i>d<\/i> + <i>c<\/i> ≤ 60 and <i>c<\/i> ≥ 2<i>d<\/i><\/b>"}, {"lo": "LO1", "diff": "H", "type": "spr", "q": "A coach chooses <i>x<\/i> first-year players and <i>y<\/i> senior players for a team. The team has at most 9 players, at least 1 senior, and fewer seniors than first-years, so <i>x<\/i> + <i>y<\/i> ≤ 9, <i>y<\/i> ≥ 1 and <i>y<\/i> &lt; <i>x<\/i>, with <i>x<\/i> and <i>y<\/i> integers. How many different pairs (<i>x<\/i>, <i>y<\/i>) are possible?", "ans": ["16"], "sol": "<i>y<\/i> = 1: <i>x<\/i> from 2 to 8, 7 pairs. <i>y<\/i> = 2: 3 to 7, 5 pairs. <i>y<\/i> = 3: 4 to 6, 3 pairs. <i>y<\/i> = 4: <i>x<\/i> = 5, 1 pair. <i>y<\/i> = 5 would need <i>x<\/i> ≥ 6 and <i>x<\/i> ≤ 4. Total 16. Answer: <b>16<\/b>"}, {"lo": "LO4", "diff": "H", "type": "mcq", "q": "The system <i>x<\/i> + <i>y<\/i> &lt; 12, <i>y<\/i> &gt; 2<i>x<\/i> and <i>x<\/i> &gt; <i>p<\/i> has at least one solution, where <i>p<\/i> is an integer. What is the greatest possible value of <i>p<\/i>?", "opts": ["2", "3", "4", "6"], "ans": 1, "sol": "The first two need 2<i>x<\/i> &lt; <i>y<\/i> &lt; 12 − <i>x<\/i>, which is possible only when 2<i>x<\/i> &lt; 12 − <i>x<\/i>, so <i>x<\/i> &lt; 4. Then <i>x<\/i> &gt; <i>p< /* ---------- SPR checking (Bluebook rules) ---------- */
function parseSPR(s){
  var t=String(s||'').trim().replace(/[−–—]/g,'-'); if(!t) return null;
  var m=t.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){ var d=parseInt(m[3],10); if(!d) return null; var v=parseInt(m[2],10)/d; return {v:m[1]?-v:v, dec:false, raw:t}; }
  m=t.match(/^(-?)(\d*)\.?(\d*)$/);
  if(m && (m[2]||m[3])){ var v2=parseFloat((m[1]||'')+(m[2]||'0')+'.'+(m[3]||'0')); return {v:v2, dec:t.indexOf('.')>=0, dp:(m[3]||'').length, raw:t}; }
  return null;
}
function sprCorrect(input, answers){
  var p=parseSPR(input); if(!p) return false;
  return answers.some(function(a){
    var q=parseSPR(a); if(!q) return false; var av=q.v;
    if(Math.abs(p.v-av)<1e-9) return true;
    if(p.dec){ var max=p.v<0?6:5; if(p.raw.length<max) return false;
      var f=Math.pow(10,p.dp), tr=(av<0?-1:1)*Math.floor(Math.abs(av)*f)/f, rd=Math.round(av*f)/f;
      return Math.abs(p.v-tr)<1e-9 || Math.abs(p.v-rd)<1e-9; }
    return false;
  });
}
function isCorrect(q,g){ if(g===null||g===undefined||g==='') return false; return q.type==='spr' ? sprCorrect(g,q.ans) : g===q.ans; }

function qBody(q, sel, name){
  var h='<div class="qtext">'+q.q+'</div>';

    h+='<div class="spr"><label for="'+name+'" class="pill">Your answer</label><input id="'+name+'" autocomplete="off" spellcheck="false" maxlength="6" inputmode="text" value="'+esc(sel||'')+'"><small>Type a number, fraction (7/3) or decimal.</small></div>';

}

  } else {
    h+='<section class="card lesson" id="sheet"><div class="eyebrow">Recap</div><h2>Common traps in this subtopic</h2><div class="traps"><ul>'+S.traps.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>'+
      '<h3 class="note-h">Objective checklist</h3><ul class="los">'+LOS.map(function(l,i){ return '<li><span class="lo-n">'+(i+1)+'</span><span>'+l.text+'</span><span class="lo-done" style="color:'+(ST.done[l.id]?'var(--success)':'var(--ink-soft)')+'">'+(ST.done[l.id]?'✓ Done':'Not yet')+'</span></li>'; }).join('')+'</ul>'+
      '<div class="qnav"><button class="btn" data-go="'+(LOS.length-1)+'">Previous sheet</button><button class="btn btn-primary" id="goQuiz">Go to the quiz sheets</button></div></section>';
  }
  h+='</div>';
  $('main').innerHTML=h;
  wireLearn(); setProg();
}
function wireLearn(){
  document.querySelectorAll('[data-sheet]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); renderLearn(+a.getAttribute('data-sheet')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ renderLearn(+b.getAttribute('data-go')); var el=$('sheet'); if(el) el.scrollIntoView({block:'start'}); }); });
  if($('goQuiz')) $('goQuiz').addEventListener('click',function(){ setMode('quiz'); window.scrollTo(0,0); });
  document.querySelectorAll('.ex').forEach(function(ex){
    var steps=ex.querySelectorAll('.steps li'), ans=ex.querySelector('.ans'), nb=ex.querySelector('[data-next]'), shown=0;
    function upd(){ steps.forEach(function(s,i){ s.hidden=i>=shown; }); ans.hidden=shown<steps.length;
      nb.textContent = shown===0?'Show first step':(shown<steps.length?'Show next step':'All steps shown'); nb.disabled=shown>=steps.length; }
    nb.addEventListener('click',function(){ shown=Math.min(steps.length,shown+1); upd(); });
    ex.querySelector('[data-all]').addEventListener('click',function(){ shown=steps.length; upd(); });
    upd();
  });
  document.querySelectorAll('.try').forEach(function(box){
    var q=S.guided[+box.getAttribute('data-g')], sel=null;
    box.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ sel=+b.getAttribute('data-k'); box.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-checked', x===b); x.classList.remove('right','wrong'); }); }); });
    var hb=box.querySelector('[data-hint]'); if(hb) hb.addEventListener('click',function(){ box.querySelector('.hint').hidden=false; hb.disabled=true; });
    box.querySelector('[data-check]').addEventListener('click',function(){
      var g = q.type==='spr' ? box.querySelector('input').value.trim() : sel;
      var f=box.querySelector('.fbk');
      if(g===null||g===''){ f.innerHTML='<div class="feedback no">Choose or type an answer first.</div>'; return; }
      var ok=isCorrect(q,g);
      if(q.type!=='spr') box.querySelectorAll('.opt').forEach(function(x){ var k=+x.getAttribute('data-k'); x.classList.toggle('right',k===q.ans); x.classList.toggle('wrong',k===g&&!ok); });
      f.innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b class="v">'+(ok?'Correct.':'Not quite. The answer is '+(q.type==='spr'?q.ans[0]:letter(q.ans))+'.')+'</b>'+q.sol+'</div>';
    });
  });
  document.querySelectorAll('[data-done]').forEach(function(c){ c.addEventListener('change',function(){ ST.done[c.getAttribute('data-done')]=c.checked; save(); setProg();
    var t=document.querySelector('.sheetnav .tab[data-sheet="'+ST.sheet+'"]'); if(t) t.classList.toggle('done',c.checked); }); });
}

/* ---------- QUIZ ---------- */
var QZ=null, tick=null;
function counts(qs){ var d={E:0,M:0,H:0,X:0}; qs.forEach(function(q){ d[q.diff]=(d[q.diff]||0)+1; }); return d; }
function renderQuizIntro(){
  var h='<div class="stack"><section class="card"><div class="eyebrow">Quiz mode</div><h2 style="font-size:26px;margin:4px 0 6px;">Two quiz sheets, '+QUIZ[0].qs.length+' questions each</h2>'+
    '<p style="margin:0;color:var(--ink-soft)">Answer every question, then submit to see your score by learning objective, with a full solution for each question. You can move back and forth before submitting. Calculator allowed, as on the Digital SAT.</p><div class="sheetcards">'+
    QUIZ.map(function(Z,k){ var d=counts(Z.qs), spr=Z.qs.filter(function(q){ return q.type==='spr'; }).length;
      return '<div class="sheetcard"><div class="eyebrow">Sheet '+(k+1)+'</div><h3>'+esc(Z.title.split('· ')[1]||Z.title)+'</h3><p>'+Z.blurb+'</p>'+
        '<p class="num">'+['E','M','H','X'].filter(function(x){ return d[x]; }).map(function(x){ return d[x]+' '+DIFF[x]; }).join(' · ')+'<br>'+spr+' student-produced response · about '+Math.round(Z.qs.length*1.5)+' min</p>'+
        (ST.best[k]!=null?'<p><b>Your best: '+ST.best[k]+'/'+Z.qs.length+'</b></p>':'')+
        '<button class="btn btn-primary" data-start="'+k+'">Start Sheet '+(k+1)+'</button></div>'; }).join('')+'</div></section>';
  var cov=LOS.map(function(l){ return [byLo(S.quiz1,l.id).length, byLo(S.quiz2,l.id).length]; });
  h+='<section class="card"><div class="eyebrow">What the quizzes cover</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Sheet 1</th><th class="num">Sheet 2</th></tr>'+
    LOS.map(function(l,i){ return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+'</td><td class="num">'+cov[i][0]+'</td><td class="num">'+cov[i][1]+'</td></tr>'; }).join('')+'</table></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-start]').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-start'); QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); }); });
}
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuestion(){
  clearInterval(tick);
  var i=QZ.i, q=QZ.qs[i], n=QZ.qs.length;
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+'</div><div class="qhead" style="margin-top:6px"><span class="qn">Question '+(i+1)+' <span style="color:var(--ink-soft);font-weight:500;font-size:16px">of '+n+'</span></span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span class="timer" id="tmr" aria-live="off"></span></div>'+
    qBody(q, QZ.ans[i], 'qin')+
    '<div class="qnav"><button class="btn" id="qBack"'+(i===0?' disabled':'')+'>Back</button>'+(i<n-1?'<button class="btn btn-primary" id="qNext">Next</button>':'<button class="btn btn-primary" id="qSubmit">Submit quiz</button>')+'</div>'+
    '<div id="qConfirm"></div>'+
    '<div class="chips" aria-label="Question navigator">'+QZ.qs.map(function(_,k){ var a=QZ.ans[k]!==null&&QZ.ans[k]!==''; return '<button class="chip'+(a?' ans':'')+(k===i?' cur':'')+'" data-q="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', unanswered')+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
    '<div class="ex-ctrl" style="margin-top:12px"><button class="btn" id="qFinish">Submit now</button><button class="btn" id="qQuit">Leave this sheet</button></div></section></div>';
  $('main').innerHTML=h;
  var tm=$('tmr'); function t(){ tm.textContent=fmt((Date.now()-QZ.t0)/1000); } t(); tick=setInterval(t,1000);
  document.querySelectorAll('#main .opt').forEach(function(b){ b.addEventListener('click',function(){ var k=+b.getAttribute('data-k'); QZ.ans[i]=(QZ.ans[i]===k?null:k); renderQuestion(); }); });
  var inp=$('qin'); if(inp){ inp.addEventListener('input',function(){ QZ.ans[i]=inp.value.trim()||null; var c=document.querySelector('.chip[data-q="'+i+'"]'); if(c) c.classList.toggle('ans',!!QZ.ans[i]); }); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&i<n-1){ QZ.i++; renderQuestion(); } }); }
  if($('qBack')) $('qBack').addEventListener('click',function(){ QZ.i--; renderQuestion(); });
  if($('qNext')) $('qNext').addEventListener('click',function(){ QZ.i++; renderQuestion(); });
  function ask(){ var un=QZ.ans.filter(function(a){ return a===null||a===''; }).length;
    $('qConfirm').innerHTML='<div class="confirm">'+(un?'<b>'+un+' question'+(un>1?'s are':' is')+' unanswered.</b> ':'')+'Submit the quiz and see your results?<div class="row"><button class="btn btn-primary" id="qYes">Submit</button><button class="btn" id="qNo">Keep working</button></div></div>';
    $('qYes').addEventListener('click',finish); $('qNo').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); }
  if($('qSubmit')) $('qSubmit').addEventListener('click',ask);
  $('qFinish').addEventListener('click',ask);
  $('qQuit').addEventListener('click',function(){
    $('qConfirm').innerHTML='<div class="confirm">Leave without submitting? Your answers on this sheet will be cleared.<div class="row"><button class="btn btn-primary" id="qLeave">Leave sheet</button><button class="btn" id="qStay">Keep working</button></div></div>';
    $('qLeave').addEventListener('click',function(){ clearInterval(tick); QZ=null; renderQuizIntro(); window.scrollTo(0,0); }); $('qStay').addEventListener('click',function(){ $('qConfirm').innerHTML=''; }); });
  document.querySelectorAll('[data-q]').forEach(function(c){ c.addEventListener('click',function(){ QZ.i=+c.getAttribute('data-q'); renderQuestion(); }); });
}
function finish(){
  clearInterval(tick); QZ.done=true; QZ.secs=(Date.now()-QZ.t0)/1000;
  var score=QZ.qs.filter(function(q,k){ return isCorrect(q,QZ.ans[k]); }).length;
  ST.best[QZ.k]=Math.max(ST.best[QZ.k]||0,score); save();
  renderReport('all'); window.scrollTo(0,0);
}
function renderReport(filter){
  var n=QZ.qs.length, R=QZ.qs.map(function(q,k){ var g=QZ.ans[k], om=(g===null||g===''); return {q:q,k:k,g:g,om:om,ok:!om&&isCorrect(q,g)}; });
  var score=R.filter(function(r){ return r.ok; }).length, pc=Math.round(100*score/n);
  var C=2*Math.PI*48, off=C*(1-score/n);
  var by={}; R.forEach(function(r){ var b=by[r.q.lo]=by[r.q.lo]||{c:0,t:0}; b.t++; if(r.ok) b.c++; });
  var bd={E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0},X:{c:0,t:0}}; R.forEach(function(r){ var b=bd[r.q.diff]; if(b){ b.t++; if(r.ok) b.c++; } });
  var weak=LOS.filter(function(l){ var b=by[l.id]; return b && b.c/b.t<0.8; });
  var next = weak.length ? 'Revise '+weak.map(function(l){ return '<b>'+esc(loLabel(l.id))+'</b>'; }).join(', ')+' on its learning sheet, then retake this quiz.' :
    (QZ.k===0 ? 'Every objective is at 80% or better. Move on to Quiz Sheet 2 · SAT Level.' : 'Every objective is at 80% or better. This subtopic is mastered.');
  var h='<div class="stack"><section class="card"><div class="eyebrow">'+esc(QUIZ[QZ.k].title)+' · Your result</div><div class="scoreband" style="margin-top:8px">'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+score+' of '+n+' correct"><circle class="bg" cx="60" cy="60" r="48"/><circle class="fg" cx="60" cy="60" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle">'+pc+'%</text></svg>'+
    '<div style="min-width:0"><h2 style="font-size:28px">'+score+' of '+n+' correct</h2><p style="margin:4px 0 0;color:var(--ink-soft)">Time '+fmt(QZ.secs)+' · '+R.filter(function(r){ return r.om; }).length+' left blank · best so far '+ST.best[QZ.k]+'/'+n+'</p><p style="margin:8px 0 0">'+next+'</p></div></div>'+
    '<div class="intro-grid">'+['E','M','H','X'].map(function(d){ var b=bd[d]; return b.t?'<div class="kpi"><span>'+DIFF[d]+'</span><b class="num">'+b.c+'/'+b.t+'</b></div>':''; }).join('')+'</div></section>';
  h+='<section class="card"><div class="eyebrow">Objective-wise analysis</div><div class="tscroll"><table class="lotab" style="margin-top:8px"><tr><th>Objective</th><th class="num">Score</th><th class="hide-s">Accuracy</th><th>Status</th></tr>'+
    LOS.map(function(l,i){ var b=by[l.id]; if(!b) return ''; var p=b.c/b.t, cls=p>=0.8?'ok':(p>=0.5?'mid':'low'), lab=p>=0.8?'Mastered':(p>=0.5?'Revise':'Re-learn');
      return '<tr><td><span class="lo-n">'+(i+1)+'</span> '+l.text+(p<0.8?'<br><button class="lnk" data-relearn="'+i+'">Open learning sheet '+(i+1)+'</button>':'')+'</td><td class="num">'+b.c+'/'+b.t+'</td><td class="hide-s"><div class="bar"><i style="width:'+Math.round(100*p)+'%"></i></div></td><td><span class="st '+cls+'">'+lab+'</span></td></tr>'; }).join('')+'</table></div></section>';
  var list=R.filter(function(r){ return filter==='all'||(filter==='wrong'&&!r.ok); });
  h+='<section class="card"><div class="eyebrow">Question review</div><div class="filters" style="margin-top:8px"><button class="tab" data-f="all" aria-selected="'+(filter==='all')+'">All ('+n+')</button><button class="tab" data-f="wrong" aria-selected="'+(filter==='wrong')+'">To fix ('+(n-score)+')</button></div><div class="stack" style="gap:10px">'+
    list.map(function(r){ var q=r.q;
      var yours = r.om?'—':(q.type==='spr'?esc(r.g):letter(r.g));
      var opts = q.type==='spr'?'':'<div class="opts" style="margin-top:8px">'+q.opts.map(function(o,k){ return '<div class="opt'+(k===q.ans?' right':(k===r.g?' wrong':''))+'" style="cursor:default"><span class="let">'+letter(k)+'</span><span>'+o+'</span></div>'; }).join('')+'</div>';
      return '<details class="rv"'+(r.ok?'':' open')+'><summary><b class="num">Q'+(r.k+1)+'</b><span class="mark '+(r.ok?'ok':(r.om?'om':'no'))+'">'+(r.ok?'Correct':(r.om?'Omitted':'Incorrect'))+'</span><span class="pill">'+esc(loLabel(q.lo))+'</span><span class="pill '+q.diff+'">'+DIFF[q.diff]+'</span><span style="margin-left:auto;font-size:14px;color:var(--ink-soft)">You: '+yours+' · Key: '+(q.type==='spr'?esc(q.ans[0]):letter(q.ans))+'</span></summary><div style="margin-top:10px"><div class="qtext">'+q.q+'</div>'+opts+'<div class="sol"><b>Solution.</b> '+q.sol+'</div></div></details>'; }).join('')+
    '</div></section><section class="card gotoquiz"><div><b>Next step</b><br><span style="color:var(--ink-soft)">Retake this sheet, try the other quiz sheet, or go back to the learning sheets.</span></div><div class="ex-ctrl" style="margin:0"><button class="btn" id="toLearn">Learning sheets</button><button class="btn" id="toQuiz">All quiz sheets</button><button class="btn btn-primary" id="retake">Retake this sheet</button></div></section></div>';
  $('main').innerHTML=h; setProg();
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ renderReport(b.getAttribute('data-f')); }); });
  document.querySelectorAll('[data-relearn]').forEach(function(b){ b.addEventListener('click',function(){ setMode('learn',{sheet:+b.getAttribute('data-relearn')}); window.scrollTo(0,0); }); });
  $('toLearn').addEventListener('click',function(){ setMode('learn'); window.scrollTo(0,0); });
  $('toQuiz').addEventListener('click',function(){ QZ=null; setMode('quiz'); window.scrollTo(0,0); });
  $('retake').addEventListener('click',function(){ var k=QZ.k; QZ={k:k, qs:QUIZ[k].qs, ans:QUIZ[k].qs.map(function(){ return null; }), i:0, t0:Date.now(), done:false}; renderQuestion(); window.scrollTo(0,0); });
}

setMode(location.hash==='#quiz'?'quiz':'learn');
})();

</script>
